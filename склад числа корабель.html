<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад Числа - Корабель</title>
    <style>
        /* Скидання стилів */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #ff7b54 0%, #ffb26b 40%, #ffd56b 60%, #939b62 100%);
            font-family: 'Propysy Bold', Arial, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.3); /* Напівпрозорий фон контейнера */
        }

        /* Деталізований фон океану та заходу сонця */
        .ocean-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Анімація хвиль */
        @keyframes waveDrift {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100px); }
        }

        .wave-layer {
            animation: waveDrift 6s linear infinite alternate;
        }
        
        .wave-layer-fast {
            animation: waveDrift 4s linear infinite alternate-reverse;
        }

        /* Анімація погойдування корабля на хвилях */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-8px) rotate(1deg); }
            50% { transform: translateY(4px) rotate(0deg); }
            75% { transform: translateY(-4px) rotate(-1deg); }
        }

        /* Анімація прибуття корабля */
        @keyframes sailIn {
            0% { transform: translateX(-150vw); }
            100% { transform: translateX(0); }
        }

        /* Анімація відбуття корабля */
        @keyframes sailOut {
            0% { transform: translateX(0); }
            100% { transform: translateX(150vw); }
        }

        /* Анімація успішного вирішення */
        @keyframes successGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0)); }
            50% { filter: drop-shadow(0 0 40px rgba(255, 215, 0, 1)); }
        }

        /* Контейнер корабля */
        .ship-container {
            position: absolute;
            bottom: 12vh;
            left: 50vw;
            margin-left: -400px;
            width: 800px;
            height: 600px;
            z-index: 10;
            transition: transform 0.1s linear;
        }

        .ship-body-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: float 4s ease-in-out infinite;
        }

        .sailing-in {
            animation: sailIn 3s cubic-bezier(0.3, 1, 0.6, 1) forwards;
        }

        .sailing-out {
            animation: sailOut 2.5s cubic-bezier(0.5, 0, 0.8, 0) forwards;
        }

        /* Контейнер для математичних елементів */
        .math-board {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Головне число на вітрилі */
        .target-number {
            position: absolute;
            top: 150px;
            left: 320px;
            width: 160px;
            text-align: center;
            color: #8b0000;
            font-weight: 900;
            font-size: 6rem;
            text-shadow: 2px 2px 0px #ffcccc, -1px -1px 0 #fff;
        }

        /* Поля для вводу на корпусі корабля */
        .inputs-container {
            position: absolute;
            bottom: 110px;
            left: 240px;
            width: 320px;
            display: flex;
            justify-content: space-between;
            pointer-events: auto;
        }

        /* Стилізація інпутів під дерев'яні ящики з золотою облямівкою */
        .math-input {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #8b4513 0%, #4a250a 100%);
            border: 5px ridge #ffd700;
            border-radius: 15px;
            color: #ffd700;
            font-size: 4.5rem;
            font-weight: 900;
            text-align: center;
            outline: none;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 15px rgba(0,0,0,0.6);
            text-shadow: 2px 2px 4px #000;
            transition: all 0.3s;
        }

        .math-input:focus {
            border-color: #ffaa00;
            background: radial-gradient(circle, #a0522d 0%, #5c2e0b 100%);
            transform: scale(1.1) translateY(-5px);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5), 0 15px 25px rgba(0,0,0,0.7);
        }

        /* Стилі для кнопок керування */
        .control-buttons {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .game-btn {
            padding: 8px 15px;
            font-size: 0.9rem;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.5);
            color: #333;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            cursor: pointer;
            box-shadow: none;
            transition: background 0.2s, transform 0.2s;
        }

        .game-btn:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<div id="game-container">
    
    <!-- Кнопки керування -->
    <div class="control-buttons">
        <button id="btn-regenerate" class="game-btn">Перегенерувати приклад</button>
        <button id="btn-skip" class="game-btn">Попливти далі</button>
    </div>

    <!-- Складний SVG фон заходу сонця та океану -->
    <svg class="ocean-background" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
        <defs>
            <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#fff5cc" />
                <stop offset="100%" stop-color="#ff8800" />
            </linearGradient>
            <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffb26b" opacity="0.8"/>
                <stop offset="100%" stop-color="#ff7b54" opacity="0.2"/>
            </linearGradient>
            <linearGradient id="seaDeep" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#006699" />
                <stop offset="50%" stop-color="#003366" />
                <stop offset="100%" stop-color="#001133" />
            </linearGradient>
            <linearGradient id="waveLight" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#0099cc" opacity="0.9"/>
                <stop offset="100%" stop-color="#004488" opacity="0.9"/>
            </linearGradient>
            <linearGradient id="waveDark" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#005588" opacity="0.9"/>
                <stop offset="100%" stop-color="#001144" opacity="0.9"/>
            </linearGradient>
        </defs>

        <!-- Сонце -->
        <circle cx="960" cy="450" r="180" fill="url(#sunGrad)" filter="drop-shadow(0 0 80px #ffaa00)" />

        <!-- Декоративні хмари -->
        <path d="M200,300 Q250,250 350,280 Q450,260 500,320 Q400,350 200,300 Z" fill="url(#cloudGrad)" />
        <path d="M1400,200 Q1480,150 1600,180 Q1700,150 1750,220 Q1600,250 1400,200 Z" fill="url(#cloudGrad)" />
        <path d="M700,150 Q750,100 850,120 Q950,90 1000,150 Q850,180 700,150 Z" fill="url(#cloudGrad)" opacity="0.7"/>

        <!-- Далекий план океану -->
        <rect x="0" y="550" width="1920" height="530" fill="url(#seaDeep)" />

        <!-- Хвилі на задньому плані -->
        <g class="wave-layer">
            <path d="M-100,580 Q50,550 200,580 T500,580 T800,580 T1100,580 T1400,580 T1700,580 T2020,580 L2020,1080 L-100,1080 Z" fill="url(#waveDark)" />
        </g>
        
        <!-- Хвилі середнього плану -->
        <g class="wave-layer-fast">
            <path d="M-200,650 Q0,610 200,650 T600,650 T1000,650 T1400,650 T1800,650 T2120,650 L2120,1080 L-200,1080 Z" fill="url(#waveLight)" />
        </g>
    </svg>

    <!-- Основний контейнер корабля -->
    <div id="ship" class="ship-container sailing-in">
        <div class="ship-body-wrapper">
            
            <!-- SVG Корабля -->
            <svg viewBox="0 0 800 600" width="100%" height="100%">
                <defs>
                    <linearGradient id="woodLight" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#a0522d" />
                        <stop offset="100%" stop-color="#5c2e0b" />
                    </linearGradient>
                    <linearGradient id="woodDark" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#6b3e15" />
                        <stop offset="100%" stop-color="#3d2107" />
                    </linearGradient>
                    <linearGradient id="sailGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="80%" stop-color="#ffebd6" />
                        <stop offset="100%" stop-color="#d4bba0" />
                    </linearGradient>
                    <linearGradient id="flagGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#ff0000" />
                        <stop offset="100%" stop-color="#990000" />
                    </linearGradient>
                </defs>

                <!-- Задня щогла -->
                <rect x="550" y="150" width="16" height="300" fill="#3d2107" rx="8" />
                <path d="M560,180 Q620,250 560,350 Q500,250 560,180 Z" fill="url(#sailGrad)" stroke="#d4bba0" stroke-width="2"/>
                
                <!-- Головна щогла (центральна) -->
                <rect x="390" y="50" width="20" height="420" fill="#291604" rx="10" />
                
                <!-- Рейка головного вітрила -->
                <rect x="250" y="130" width="300" height="12" fill="#3d2107" rx="6" />
                
                <!-- Головне вітрило (Тут буде цільове число) -->
                <path d="M260,140 Q400,300 280,400 Q400,380 520,400 Q420,300 540,140 Q400,160 260,140 Z" fill="url(#sailGrad)" stroke="#c4a582" stroke-width="3" filter="drop-shadow(5px 15px 15px rgba(0,0,0,0.4))" />

                <!-- Переднє вітрило (Клівер) -->
                <path d="M390,100 L120,380 Q250,380 390,250 Z" fill="url(#sailGrad)" stroke="#d4bba0" stroke-width="2" />
                <path d="M390,250 L60,420 Q200,420 390,350 Z" fill="url(#sailGrad)" stroke="#d4bba0" stroke-width="2" />

                <!-- Канати -->
                <line x1="390" y1="80" x2="100" y2="400" stroke="#8b7355" stroke-width="3" />
                <line x1="390" y1="120" x2="60" y2="430" stroke="#8b7355" stroke-width="2" />
                <line x1="400" y1="70" x2="680" y2="420" stroke="#8b7355" stroke-width="3" />

                <!-- Прапор на вершині -->
                <path d="M400,50 L480,70 L400,90 Z" fill="url(#flagGrad)" />

                <!-- Корпус корабля (Задня частина) -->
                <path d="M680,350 L720,400 L680,520 L150,520 L80,400 L150,350 Z" fill="url(#woodDark)" />
                
                <!-- Основний корпус (Борт) -->
                <path d="M660,370 L700,400 L650,520 L120,520 L50,420 L100,370 Z" fill="url(#woodLight)" stroke="#3d2107" stroke-width="5" />
                
                <!-- Дерев'яні дошки на корпусі -->
                <path d="M90,395 L675,395" stroke="#4a250a" stroke-width="3" />
                <path d="M75,420 L685,420" stroke="#4a250a" stroke-width="4" />
                <path d="M90,445 L670,445" stroke="#4a250a" stroke-width="3" />
                <path d="M100,470 L660,470" stroke="#4a250a" stroke-width="3" />
                <path d="M110,495 L655,495" stroke="#4a250a" stroke-width="3" />

                <!-- Ілюмінатори (Віконця) -->
                <circle cx="180" cy="420" r="15" fill="#001133" stroke="#ffd700" stroke-width="4" />
                <circle cx="600" cy="420" r="15" fill="#001133" stroke="#ffd700" stroke-width="4" />
                
                <!-- Декор носа корабля -->
                <path d="M50,420 Q20,380 60,330 L80,360 Z" fill="#ffd700" />
                
                <!-- Якір -->
                <g transform="translate(130, 440) scale(0.6)">
                    <circle cx="20" cy="10" r="6" fill="none" stroke="#222" stroke-width="4" />
                    <line x1="20" y1="16" x2="20" y2="70" stroke="#222" stroke-width="6" />
                    <line x1="5" y1="30" x2="35" y2="30" stroke="#222" stroke-width="6" />
                    <path d="M0,50 Q20,80 40,50" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round" />
                    <polygon points="0,50 -5,40 5,40" fill="#222" />
                    <polygon points="40,50 35,40 45,40" fill="#222" />
                </g>

                <!-- З'єднувальна лінія між інпутами (плюс) -->
                <circle cx="400" cy="440" r="18" fill="#5c2e0b" stroke="#ffd700" stroke-width="3" />
                <path d="M390,440 L410,440 M400,430 L400,450" stroke="#ffd700" stroke-width="4" stroke-linecap="round" />
            </svg>

            <!-- HTML елементи поверх корабля (Математика) -->
            <div class="math-board">
                <div class="target-number" id="target-number">10</div>
                <div class="inputs-container">
                    <input type="text" class="math-input" id="input-left" maxlength="2" autocomplete="off">
                    <input type="text" class="math-input" id="input-right" maxlength="2" autocomplete="off">
                </div>
            </div>

        </div>
    </div>
    
    <!-- Передні хвилі, щоб частково приховати низ корабля (трохи вище і напівпрозорі) -->
    <svg class="ocean-background" style="z-index: 20;" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
        <g class="wave-layer">
            <path d="M-150,860 Q100,820 300,860 T750,860 T1200,860 T1650,860 T2100,860 L2100,1080 L-150,1080 Z" fill="url(#waveDeep)" opacity="0.6"/>
        </g>
        <defs>
            <linearGradient id="waveDeep" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#003366" />
                <stop offset="100%" stop-color="#000a1a" />
            </linearGradient>
        </defs>
    </svg>

</div>

<script>
    // Аудіо контекст для генерації звуків
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    // Функція генерації звуку успіху (дзвіночки/магія)
    function playSuccessChime() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        // Арпеджіо для ефекту успіху
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
        osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3); // C6
        
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.05);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
    }

    // Функція генерації шуму води/вітру при русі корабля
    function playSailingSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const bufferSize = audioCtx.sampleRate * 2; // 2 секунди
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        
        // Генерація білого шуму
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        
        const noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = buffer;
        
        // Фільтр низьких частот для імітації гулу хвиль
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(200, audioCtx.currentTime);
        filter.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 1);
        filter.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 2);
        
        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.5);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2);
        
        noiseSource.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        noiseSource.start();
    }

    // Елементи DOM
    const ship = document.getElementById('ship');
    const targetNumberEl = document.getElementById('target-number');
    const inputLeft = document.getElementById('input-left');
    const inputRight = document.getElementById('input-right');
    const btnRegenerate = document.getElementById('btn-regenerate');
    const btnSkip = document.getElementById('btn-skip');
    
    let currentTarget = 0;
    let isAnimating = false;

    // Логіка гри (Склад числа)
    function generateProblem() {
        currentTarget = Math.floor(Math.random() * 9) + 2; // Від 2 до 10
        targetNumberEl.innerText = currentTarget;
        
        inputLeft.value = '';
        inputRight.value = '';
        inputLeft.disabled = false;
        inputRight.disabled = false;
        
        // Повернення початкових стилів інпутів
        inputLeft.style.background = 'radial-gradient(circle, #8b4513 0%, #4a250a 100%)';
        inputRight.style.background = 'radial-gradient(circle, #8b4513 0%, #4a250a 100%)';
        inputLeft.style.borderColor = '#ffd700';
        inputRight.style.borderColor = '#ffd700';
        
        setTimeout(() => inputLeft.focus(), 500);
    }

    // Перевірка введених значень
    const checkBothInputs = () => {
        const val1 = parseInt(inputLeft.value);
        const val2 = parseInt(inputRight.value);
        
        if (!isNaN(val1) && !isNaN(val2)) {
            if (val1 + val2 === currentTarget) {
                // Успіх
                inputLeft.disabled = true;
                inputRight.disabled = true;
                
                // Зміна кольору на золотий/світіння
                const successBg = 'radial-gradient(circle, #ffcc00 0%, #cc7700 100%)';
                inputLeft.style.background = successBg;
                inputRight.style.background = successBg;
                inputLeft.style.borderColor = '#ffffff';
                inputRight.style.borderColor = '#ffffff';
                
                ship.style.animation = 'successGlow 1.5s ease';
                playSuccessChime();
                
                setTimeout(() => {
                    ship.style.animation = '';
                    sailAwayAndReturn();
                }, 1500);
            }
        }
    };

    // Обробники вводу
    [inputLeft, inputRight].forEach(input => {
        input.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
            checkBothInputs();
            // Авто-перехід на наступний інпут
            if(e.target.value !== '' && e.target === inputLeft) {
                inputRight.focus();
            }
        });
    });

    // Кнопки управління
    btnRegenerate.addEventListener('click', () => {
        if(isAnimating) return;
        generateProblem();
    });

    btnSkip.addEventListener('click', () => {
        if(isAnimating) return;
        sailAwayAndReturn();
    });

    // Анімація відплиття та приплиття нового корабля
    function sailAwayAndReturn() {
        if(isAnimating) return;
        isAnimating = true;
        
        playSailingSound();
        ship.className = 'ship-container sailing-out';
        
        setTimeout(() => {
            generateProblem();
            
            ship.className = 'ship-container sailing-in';
            playSailingSound();
            
            setTimeout(() => {
                ship.className = 'ship-container'; // Зупинка
                isAnimating = false;
            }, 3000);
            
        }, 2500);
    }

    // Ініціалізація
    window.addEventListener('DOMContentLoaded', () => {
        generateProblem();
        
        setTimeout(() => {
            ship.className = 'ship-container';
        }, 3000);
        
        // Розблокування аудіо
        document.body.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });
        
        document.body.addEventListener('keydown', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });
    });
</script>
<script src="https://olgazheltvai2.github.io/rizne/pencil.js"></script></body>
</html>
