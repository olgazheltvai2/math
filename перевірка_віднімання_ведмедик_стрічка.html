        // ============================================================================
        // 4. INTERACTIVE COLOR-CODED SATIN RIBBON (GOLD A -> RED C & GREEN B)
        // ============================================================================
        function drawNumberBadge(x, y, numberText, scaleFactor, colorTheme, isLargeHighlight = false, extraPulse = 0) {
            if (scaleFactor <= 0.01) return;
            ctx.save();
            const finalScale = scaleFactor * (1 + extraPulse * 0.18 * Math.sin(globalTime * 16));
            ctx.translate(x, y);
            ctx.scale(finalScale, finalScale);

            const r = isLargeHighlight ? 42 : 35;

            if (extraPulse > 0.05) {
                ctx.shadowColor = colorTheme.glow;
                ctx.shadowBlur = 24;
            }

            // Soft drop shadow
            ctx.fillStyle = 'rgba(15, 5, 0, 0.45)';
            ctx.beginPath();
            ctx.arc(0, 6, r + 3, 0, Math.PI * 2);
            ctx.fill();

            // Scalloped / stitched cloth medallion background
            const bgGrad = ctx.createRadialGradient(-r * 0.25, -r * 0.25, r * 0.1, 0, 0, r);
            bgGrad.addColorStop(0, colorTheme.light);
            bgGrad.addColorStop(0.55, colorTheme.main);
            bgGrad.addColorStop(1, colorTheme.badgeBg);

            ctx.fillStyle = bgGrad;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();

            // Outer brass ring
            ctx.strokeStyle = '#ffdf78';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Dashed golden thread stitching inside badge
            ctx.strokeStyle = '#fff8d6';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 4]);
            ctx.beginPath();
            ctx.arc(0, 0, r - 6, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // Numeral
            ctx.font = `900 ${isLargeHighlight ? 48 : 40}px 'Fredoka', 'Nunito', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.fillText(String(numberText), 0, 4);

            ctx.fillStyle = '#fffbe8';
            ctx.fillText(String(numberText), 0, 1);

            ctx.restore();
        }

        function drawRibbonPiece(x, y, width, height, numUnits, theme, isLeftPiece, isSeparated, highlightPulse = 0) {
            ctx.save();

            if (highlightPulse > 0.02) {
                ctx.shadowColor = theme.glow;
                ctx.shadowBlur = 28 * highlightPulse;
            }

            // Drop shadow on velvet mat
            ctx.fillStyle = 'rgba(8, 3, 1, 0.48)';
            drawRoundedRect(x + 4, y + 10, width, height, 10);
            ctx.fill();

            // Rich Satin sheen vertical gradient
            const satinGrad = ctx.createLinearGradient(x, y, x, y + height);
            satinGrad.addColorStop(0, theme.dark);
            satinGrad.addColorStop(0.22, theme.main);
            satinGrad.addColorStop(0.48, theme.light);
            satinGrad.addColorStop(0.78, theme.main);
            satinGrad.addColorStop(1, theme.dark);

            drawRoundedRect(x, y, width, height, 10);
            ctx.fillStyle = satinGrad;
            ctx.fill();

            // Satin weave border
            ctx.strokeStyle = highlightPulse > 0.1 ? '#fff3a1' : theme.dark;
            ctx.lineWidth = highlightPulse > 0.1 ? 5 : 4;
            ctx.stroke();

            // Top and bottom golden stitched hem lines
            ctx.strokeStyle = theme.stitch;
            ctx.lineWidth = 2.5;
            ctx.setLineDash([9, 6]);
            ctx.beginPath();
            ctx.moveTo(x + 10, y + 11);
            ctx.lineTo(x + width - 10, y + 11);
            ctx.moveTo(x + 10, y + height - 11);
            ctx.lineTo(x + width - 10, y + height - 11);
            ctx.stroke();
            ctx.setLineDash([]);

            // Unit segment ruler marks along the ribbon
            const unitW = width / numUnits;
            for (let i = 1; i < numUnits; i++) {
                const ux = x + i * unitW;
                ctx.strokeStyle = 'rgba(255, 248, 210, 0.42)';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(ux, y + 15);
                ctx.lineTo(ux, y + height - 15);
                ctx.stroke();

                // Small decorative gold diamond in each unit
                ctx.fillStyle = 'rgba(255, 240, 180, 0.30)';
                ctx.beginPath();
                ctx.arc(x + (i - 0.5) * unitW, y + height * 0.5, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawInteractiveRibbon() {
            if (ribbonAnim.appearScale <= 0.01) return;

            const m = getRibbonMetrics();
            const halfGap = ribbonAnim.splitGap * 0.5;
            const topY = m.centerY - m.height * 0.5;

            ctx.save();
            ctx.translate(m.centerX, m.centerY);
            ctx.scale(ribbonAnim.appearScale, ribbonAnim.appearScale);
            ctx.translate(-m.centerX, -m.centerY);

            // 1. Left Piece (Length C = A - B):
            // Starts as Warm Gold before cutting, and immediately turns Ruby RED upon cutting!
            const leftCenterX = m.startX - halfGap + m.leftW * 0.5;
            const leftPulse = Math.max(verifyState.hintPulseC, pointer.hoverLeftPiece ? 0.65 : 0);
            ctx.save();
            ctx.translate(leftCenterX, m.centerY);
            ctx.rotate(ribbonAnim.leftTilt);
            ctx.translate(-leftCenterX, -m.centerY);

            if (ribbonAnim.leftRedMorph < 1) {
                drawRibbonPiece(m.startX - halfGap, topY, m.leftW, m.height, prob.C, COLOR_THEMES.gold, true, ribbonAnim.splitGap > 0, 0);
            }
            if (ribbonAnim.leftRedMorph > 0) {
                ctx.globalAlpha = ribbonAnim.leftRedMorph;
                drawRibbonPiece(m.startX - halfGap, topY, m.leftW, m.height, prob.C, COLOR_THEMES.red, true, ribbonAnim.splitGap > 0, leftPulse);
                ctx.globalAlpha = 1;
            }
            ctx.restore();

            // 2. Right Piece (Length B - Cut-off piece):
            // Always colored in Emerald GREEN so child sees we are cutting off green B!
            const rightCenterX = m.cutX + halfGap + m.rightW * 0.5;
            const rightPulse = Math.max(verifyState.hintPulseB, pointer.hoverRightPiece ? 0.65 : 0);
            ctx.save();
            ctx.translate(rightCenterX, m.centerY);
            ctx.rotate(ribbonAnim.rightTilt);
            ctx.translate(-rightCenterX, -m.centerY);
            drawRibbonPiece(m.cutX + halfGap, topY, m.rightW, m.height, prob.B, COLOR_THEMES.green, false, ribbonAnim.splitGap > 0, rightPulse);
            ctx.restore();

            // --- STEP 1 GUIDE: PULSING TAILOR'S CHALK CUT LINE ---
            if (gameState === STATE.READY_TO_CUT || gameState === STATE.CUTTING) {
                const pulse = 0.75 + Math.sin(globalTime * 6) * 0.25;
                ctx.save();

                // Hover glow when scissors are near
                if (pointer.hoverCutZone && gameState === STATE.READY_TO_CUT) {
                    ctx.strokeStyle = 'rgba(255, 238, 120, 0.55)';
                    ctx.lineWidth = 18;
                    ctx.beginPath();
                    ctx.moveTo(m.cutX, topY - 18);
                    ctx.lineTo(m.cutX, topY + m.height + 18);
                    ctx.stroke();
                }

                // Tailor's chalk dashed cut line separating left part and green B part
                ctx.strokeStyle = `rgba(255, 245, 170, ${pulse})`;
                ctx.lineWidth = 5;
                ctx.setLineDash([10, 8]);
                const cutTop = topY - 16;
                const cutBot = topY + m.height + 16 - ribbonAnim.cutProgress * (m.height + 32);
                ctx.beginPath();
                ctx.moveTo(m.cutX, cutTop);
                ctx.lineTo(m.cutX, cutBot);
                ctx.stroke();
                ctx.setLineDash([]);

                // Pulsing target circle at bottom of cut line
                if (gameState === STATE.READY_TO_CUT) {
                    const ringR = 14 + Math.sin(globalTime * 6) * 3;
                    ctx.fillStyle = '#ffe57f';
                    ctx.beginPath();
                    ctx.arc(m.cutX, topY + m.height + 22, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffe57f';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(m.cutX, topY + m.height + 22, ringR, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();
            }

            // --- STEP 2 GUIDE & SEWING STITCHES ---
            if (gameState === STATE.VERIFY_PHASE || gameState === STATE.CELEBRATING || gameState === STATE.TRANSITION_OUT) {
                const numStitches = 6;
                const seamTop = topY + 14;
                const seamBot = topY + m.height - 14;
                const stepY = (seamBot - seamTop) / (numStitches - 1);

                // While unsewn in VERIFY_PHASE, show glowing golden thread loops inviting the player to stitch
                if (gameState === STATE.VERIFY_PHASE && !verifyState.isSewn && !verifyState.isSewingNow) {
                    const glowAlpha = pointer.hoverSewZone ? 0.95 : (0.5 + Math.sin(globalTime * 5) * 0.3);
                    ctx.strokeStyle = `rgba(255, 224, 102, ${glowAlpha})`;
                    ctx.lineWidth = pointer.hoverSewZone ? 5.5 : 4;
                    ctx.setLineDash([6, 6]);
                    for (let i = 0; i < numStitches; i++) {
                        const sy = seamTop + i * stepY;
                        ctx.beginPath();
                        ctx.moveTo(m.cutX - halfGap - 10, sy);
                        ctx.lineTo(m.cutX + halfGap + 10, sy);
                        ctx.stroke();

                        // Eyelet holes on both ribbon edges
                        ctx.fillStyle = '#ffe066';
                        ctx.beginPath();
                        ctx.arc(m.cutX - halfGap - 12, sy, 5, 0, Math.PI * 2);
                        ctx.arc(m.cutX + halfGap + 12, sy, 5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.setLineDash([]);
                }

                // Draw active / completed golden cross-stitches across the seam
                if (ribbonAnim.sewProgress > 0) {
                    const activeStitches = Math.ceil(ribbonAnim.sewProgress * numStitches);
                    ctx.save();
                    ctx.strokeStyle = '#ffd147';
                    ctx.lineWidth = 5.5;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    const spanX = Math.max(14, halfGap + 12);
                    ctx.beginPath();
                    for (let i = 0; i < activeStitches; i++) {
                        const sy1 = seamTop + i * stepY;
                        const sy2 = seamTop + Math.min(numStitches - 1, i + 1) * stepY;
                        ctx.moveTo(m.cutX - spanX, sy1);
                        ctx.lineTo(m.cutX + spanX, sy1);
                        if (i < activeStitches - 1) {
                            ctx.lineTo(m.cutX - spanX, sy2);
                        }
                    }
                    ctx.stroke();

                    // Highlight thread gleam
                    ctx.strokeStyle = '#fff5b8';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Stitch anchor knots
                    ctx.fillStyle = '#b87609';
                    for (let i = 0; i < activeStitches; i++) {
                        const sy = seamTop + i * stepY;
                        ctx.beginPath();
                        ctx.arc(m.cutX - spanX, sy, 4.5, 0, Math.PI * 2);
                        ctx.arc(m.cutX + spanX, sy, 4.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }

            // --- COLOR-CODED NUMBER BADGES ON RIBBON ---
            // 1. Green Badge B on the right piece (visible right from the start so child sees B is green!)
            const greenBadgeScale = verifyState.isSewn ? 0.88 : 1.0;
            const badgeYOffset = verifyState.isSewn ? 14 : 0;
            drawNumberBadge(rightCenterX, m.centerY + badgeYOffset, prob.B, greenBadgeScale, COLOR_THEMES.green, false, rightPulse);

            // 2. Red Badge C on the left piece (pops in as soon as the ribbon is cut!)
            if (ribbonAnim.partBadgesScale > 0.01) {
                const redBadgeScale = verifyState.isSewn ? 0.88 : ribbonAnim.partBadgesScale;
                drawNumberBadge(leftCenterX, m.centerY + badgeYOffset, prob.C, redBadgeScale, COLOR_THEMES.red, false, leftPulse);
            }

            // 3. Golden Whole Ribbon Bracket & Badge A (visible before cut AND once sewn back together!)
            const showWholeBracket = (gameState === STATE.INTRO || gameState === STATE.READY_TO_CUT ||
                                     (gameState === STATE.CUTTING && ribbonAnim.wholeBadgeScale > 0.05) ||
                                     verifyState.isSewn);

            if (showWholeBracket) {
                const brScale = verifyState.isSewn ? (1.04 + Math.sin(globalTime * 6) * 0.04) : ribbonAnim.wholeBadgeScale;
                const wholePulse = Math.max(verifyState.hintPulseA, pointer.hoverWholeBadge ? 0.7 : 0);

                ctx.save();
                ctx.globalAlpha = Math.min(1, brScale);
                ctx.strokeStyle = '#ffd559';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                const brY = topY - 24;
                ctx.beginPath();
                ctx.moveTo(m.startX + 10, brY + 14);
                ctx.quadraticCurveTo(m.startX + 10, brY, m.centerX - 52, brY);
                ctx.moveTo(m.startX + m.totalW - 10, brY + 14);
                ctx.quadraticCurveTo(m.startX + m.totalW - 10, brY, m.centerX + 52, brY);
                ctx.stroke();
                ctx.restore();

                drawNumberBadge(m.centerX, topY - 30, prob.A, brScale, COLOR_THEMES.gold, true, wholePulse);
            }

            ctx.restore();
        }

        // ============================================================================
        // 5. STYLIZED CARVED OAK & VELVET EQUATION BOARD + BOTTOM BUTTON TRAY
        // ============================================================================
        function drawClothNumberPatch(x, y, w, h, text, bgColor, textColor, popScale = 1, isInteractiveSlot = false, isActiveSlot = false, wobbleAmt = 0) {
            ctx.save();
            const wobbleX = wobbleAmt > 0 ? Math.sin(globalTime * 45) * 10 * wobbleAmt : 0;
            ctx.translate(x + wobbleX, y);
            ctx.scale(popScale, popScale);

            const rx = -w * 0.5;
            const ry = -h * 0.5;

            if (isActiveSlot) {
                ctx.shadowColor = 'rgba(255, 220, 95, 0.85)';
                ctx.shadowBlur = 18 + Math.sin(globalTime * 7) * 6;
            }

            // Shadow
            ctx.fillStyle = 'rgba(15, 6, 1, 0.45)';
            drawRoundedRect(rx + 3, ry + 5, w, h, 16);
            ctx.fill();

            // Quilted fabric patch background
            drawRoundedRect(rx, ry, w, h, 16);
            ctx.fillStyle = bgColor;
            ctx.fill();

            ctx.strokeStyle = isActiveSlot ? '#ffe066' : '#2b1406';
            ctx.lineWidth = isActiveSlot ? 5 : 3.5;
            ctx.stroke();

            // Golden dashed stitching inside patch
            ctx.strokeStyle = isActiveSlot ? '#fff6bd' : 'rgba(255, 224, 130, 0.6)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 5]);
            drawRoundedRect(rx + 6, ry + 6, w - 12, h - 12, 11);
            ctx.stroke();
            ctx.setLineDash([]);

            // Text
            ctx.font = "900 46px 'Fredoka', 'Nunito', sans-serif";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillText(text, 0, 4);
            ctx.fillStyle = textColor;
            ctx.fillText(text, 0, 1);

            ctx.restore();
        }

        function drawEquationBoard() {
            const hasVerification = boardAnim.becausePanelSlide > 0.01;
            const baseW = 470;
            const extraW = 690 * boardAnim.becausePanelSlide;
            const totalW = baseW + extraW;
            const boardH = 132;
            const cx = VW * 0.5;
            const cy = 100 + boardAnim.boardBounce * 22;
            const bx = cx - totalW * 0.5;
            const by = cy - boardH * 0.5;

            ctx.save();

            // Hanging brass chains from top of screen
            ctx.strokeStyle = '#c48d25';
            ctx.lineWidth = 7;
            ctx.beginPath();
            ctx.moveTo(bx + 75, 0);
            ctx.lineTo(bx + 75, by + 12);
            ctx.moveTo(bx + totalW - 75, 0);
            ctx.lineTo(bx + totalW - 75, by + 12);
            ctx.stroke();

            // Board drop shadow
            ctx.fillStyle = 'rgba(10, 4, 1, 0.55)';
            drawRoundedRect(bx + 6, by + 12, totalW, boardH, 28);
            ctx.fill();

            // Carved Oak Outer Frame
            const oakGrad = ctx.createLinearGradient(bx, by, bx, by + boardH);
            oakGrad.addColorStop(0, '#804924');
            oakGrad.addColorStop(0.5, '#593015');
            oakGrad.addColorStop(1, '#3b1d0a');
            drawRoundedRect(bx, by, totalW, boardH, 26);
            ctx.fillStyle = oakGrad;
            ctx.fill();
            ctx.strokeStyle = '#210e03';
            ctx.lineWidth = 5;
            ctx.stroke();

            // Inner Recessed Quilted Leather/Velvet Panel
            const innerGrad = ctx.createLinearGradient(bx, by + 12, bx, by + boardH - 12);
            innerGrad.addColorStop(0, '#361b0c');
            innerGrad.addColorStop(1, '#261206');
            drawRoundedRect(bx + 14, by + 14, totalW - 28, boardH - 28, 18);
            ctx.fillStyle = innerGrad;
            ctx.fill();

            // Golden stitched inner border
            ctx.strokeStyle = '#d49b27';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([8, 6]);
            drawRoundedRect(bx + 22, by + 22, totalW - 44, boardH - 44, 14);
            ctx.stroke();
            ctx.setLineDash([]);

            // Corner brass rivets
            drawBrassRivet(bx + 28, by + 28, 6.5);
            drawBrassRivet(bx + totalW - 28, by + 28, 6.5);
            drawBrassRivet(bx + 28, by + boardH - 28, 6.5);
            drawBrassRivet(bx + totalW - 28, by + boardH - 28, 6.5);

            // --- LEFT ZONE: COLOR-CODED SUBTRACTION EQUATION (Gold A - Green B = Red C) ---
            const subStartX = bx + 82;
            const eqY = cy;

            // Patch A (Gold - Whole Ribbon)
            drawClothNumberPatch(subStartX, eqY, 76, 78, String(prob.A), COLOR_THEMES.gold.patchBg, COLOR_THEMES.gold.patchText, 1);

            // Operator '-'
            ctx.font = "900 52px 'Fredoka', 'Nunito', sans-serif";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffd166';
            ctx.fillText('−', subStartX + 66, eqY);

            // Patch B (Emerald Green - Cut-off Piece)
            drawClothNumberPatch(subStartX + 132, eqY, 76, 78, String(prob.B), COLOR_THEMES.green.patchBg, COLOR_THEMES.green.patchText, 1);

            // Operator '='
            ctx.fillStyle = '#ffd166';
            ctx.fillText('=', subStartX + 198, eqY);

            // Subtraction Result Patch ('?' initially, then Ruby Red C after cutting)
            if (boardAnim.subAnswerScale > 0.05) {
                drawClothNumberPatch(subStartX + 268, eqY, 80, 80, String(prob.C), COLOR_THEMES.red.patchBg, COLOR_THEMES.red.patchText, boardAnim.subAnswerScale);
            } else {
                const pulseQ = 1 + Math.sin(globalTime * 5) * 0.04;
                drawClothNumberPatch(subStartX + 268, eqY, 76, 76, '?', '#4a2510', '#c99b68', pulseQ);
            }

            // --- RIGHT ZONE: INTERACTIVE VERIFICATION BY ADDITION ("тому що [ ? ] + [ ? ] = [ ? ]") ---
            if (hasVerification) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(bx + baseW - 20, by, extraW + 15, boardH);
                ctx.clip();

                const verStartX = bx + baseW + 115;

                // Leather ribbon banner for "тому що" / "потому что"
                const conjText = LANG_TEXT[currentLang].because;
                drawRoundedRect(verStartX - 108, eqY - 30, 216, 60, 14);
                ctx.fillStyle = '#5e2c12';
                ctx.fill();
                ctx.strokeStyle = '#d49b27';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.font = "800 32px 'Nunito', sans-serif";
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffe599';
                ctx.fillText(conjText, verStartX, eqY + 1);

                // Interactive Addition Slots: [ Slot 0 ] + [ Slot 1 ] = [ Slot 2 ]
                const slotCentersX = [
                    verStartX + 178,
                    verStartX + 314,
                    verStartX + 450
                ];

                // Operators '+' and '='
                ctx.font = "900 50px 'Fredoka', 'Nunito', sans-serif";
                ctx.fillStyle = '#ffd166';
                ctx.fillText('+', verStartX + 246, eqY);
                ctx.fillText('=', verStartX + 382, eqY);

                for (let i = 0; i < 3; i++) {
                    const sx = slotCentersX[i];
                    const sw = 78, sh = 78;
                    // Update logical hitbox for click selection
                    verifyState.slotRects[i] = { x: sx - sw * 0.5, y: eqY - sh * 0.5, w: sw, h: sh };

                    const slotData = verifyState.slots[i];
                    const isActive = (gameState === STATE.VERIFY_PHASE && verifyState.activeSlot === i && slotData === null);
                    const isHovered = (pointer.hoverSlotIdx === i && slotData === null);

                    if (slotData !== null) {
                        const theme = COLOR_THEMES[slotData.colorKey];
                        drawClothNumberPatch(
                            sx, eqY, 80, 80,
                            String(slotData.value),
                            theme.patchBg,
                            theme.patchText,
                            slotData.popScale,
                            true, false, 0
                        );
                    } else {
                        const pulseScale = isActive ? (1.03 + Math.sin(globalTime * 6) * 0.04) : (isHovered ? 1.05 : 1.0);
                        drawClothNumberPatch(
                            sx, eqY, sw, sh,
                            '?',
                            isActive ? '#633215' : '#43200c',
                            isActive ? '#ffe89e' : '#b88756',
                            pulseScale,
                            true,
                            isActive,
                            verifyState.slotWobble[i]
                        );
                    }
                }

                ctx.restore();
            }

            ctx.restore();
        }

        // Draw the curved wooden tray of 10 realistic tailor buttons (1..10) at the bottom of the workbench
        function drawNumberButtonTray() {
            if (verifyState.traySlide <= 0.01) return;
            updateNumberButtonPositions();

            ctx.save();
            const trayY = VH + 110 - verifyState.traySlide * 212;
            const trayW = 1190;
            const trayH = 128;
            const trayX = (VW - trayW) * 0.5;

            // Tray drop shadow
            ctx.fillStyle = 'rgba(8, 3, 0, 0.6)';
            drawRoundedRect(trayX + 6, trayY - 52, trayW, trayH, 60);
            ctx.fill();

            // Carved mahogany wooden tray body
            const trayGrad = ctx.createLinearGradient(trayX, trayY - 58, trayX, trayY + 70);
            trayGrad.addColorStop(0, '#784321');
            trayGrad.addColorStop(0.5, '#4f2911');
            trayGrad.addColorStop(1, '#2e1506');
            drawRoundedRect(trayX, trayY - 58, trayW, trayH, 60);
            ctx.fillStyle = trayGrad;
            ctx.fill();

            ctx.strokeStyle = '#d49b27';
            ctx.lineWidth = 4.5;
            ctx.stroke();

            // Recessed velvet groove inside tray
            drawRoundedRect(trayX + 16, trayY - 44, trayW - 32, trayH - 28, 48);
            ctx.fillStyle = '#261106';
            ctx.fill();

            // Draw each of the 10 carved tailor buttons
            for (let i = 0; i < 10; i++) {
                const btn = numberButtons[i];
                const wobbleX = btn.wobble > 0 ? Math.sin(globalTime * 48) * 9 * btn.wobble : 0;
                const scaleB = btn.pressScale * (btn.hover ? 1.1 : 1.0);

                ctx.save();
                ctx.translate(btn.x + wobbleX, btn.y);
                ctx.scale(scaleB, scaleB);

                // Button shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.beginPath();
                ctx.arc(2, 6, btn.r, 0, Math.PI * 2);
                ctx.fill();

                // Warm amber-wood & brass button rim
                const bGrad = ctx.createRadialGradient(-12, -12, 4, 0, 0, btn.r);
                if (btn.hover) {
                    bGrad.addColorStop(0, '#ffe89e');
                    bGrad.addColorStop(0.55, '#d99626');
                    bGrad.addColorStop(1, '#784606');
                } else {
                    bGrad.addColorStop(0, '#f5cf7a');
                    bGrad.addColorStop(0.6, '#b8761b');
                    bGrad.addColorStop(1, '#5e3405');
                }

                ctx.fillStyle = bGrad;
                ctx.beginPath();
                ctx.arc(0, 0, btn.r, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = btn.hover ? '#fff6cc' : '#3b1d04';
                ctx.lineWidth = 3.5;
                ctx.stroke();

                // Inner turned button recess
                ctx.fillStyle = btn.hover ? '#965810' : '#754108';
                ctx.beginPath();
                ctx.arc(0, 0, btn.r * 0.76, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 235, 175, 0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 4 subtle tailor button thread holes near edge of inner recess
                ctx.fillStyle = 'rgba(35, 14, 2, 0.55)';
                const holeOffset = btn.r * 0.52;
                [[-holeOffset, -holeOffset], [holeOffset, -holeOffset], [-holeOffset, holeOffset], [holeOffset, holeOffset]].forEach(([hx, hy]) => {
                    ctx.beginPath();
                    ctx.arc(hx, hy, 3.2, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Embossed Number (1..10)
                ctx.font = "900 38px 'Fredoka', 'Nunito', sans-serif";
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.fillText(String(btn.num), 0, 3);
                ctx.fillStyle = '#fff9e6';
                ctx.fillText(String(btn.num), 0, 0);

                ctx.restore();
            }

            ctx.restore();
        }

        // ============================================================================
        // 6. TOP CORNER STYLIZED BUTTONS (Language Toggle & Minimalistic Next Arrow)
        // ============================================================================
        function drawStylizedUIButtons() {
            // 1. Language Button (Top-Left: УКР / РУС)
            ctx.save();
            const lb = langBtnRect;
            const lScale = pointer.hoverLangBtn ? 1.06 : 1.0;
            ctx.translate(lb.x + lb.w * 0.5, lb.y + lb.h * 0.5);
            ctx.scale(lScale, lScale);
            ctx.translate(-(lb.x + lb.w * 0.5), -(lb.y + lb.h * 0.5));

            // Shadow
            ctx.fillStyle = 'rgba(10, 4, 1, 0.5)';
            drawRoundedRect(lb.x + 3, lb.y + 6, lb.w, lb.h, 20);
            ctx.fill();

            // Wooden & Brass Button Body
            const lGrad = ctx.createLinearGradient(lb.x, lb.y, lb.x, lb.y + lb.h);
            lGrad.addColorStop(0, pointer.hoverLangBtn ? '#96562c' : '#7d4520');
            lGrad.addColorStop(1, '#47230c');
            drawRoundedRect(lb.x, lb.y, lb.w, lb.h, 20);
            ctx.fillStyle = lGrad;
            ctx.fill();
            ctx.strokeStyle = '#d49b27';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Stitched inner border
            ctx.strokeStyle = '#ffe299';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 5]);
            drawRoundedRect(lb.x + 7, lb.y + 7, lb.w - 14, lb.h - 14, 14);
            ctx.stroke();
            ctx.setLineDash([]);

            drawBrassRivet(lb.x + 18, lb.y + lb.h * 0.5, 5);
            drawBrassRivet(lb.x + lb.w - 18, lb.y + lb.h * 0.5, 5);

            ctx.font = "900 28px 'Nunito', sans-serif";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#291204';
            ctx.fillText(LANG_TEXT[currentLang].button, lb.x + lb.w * 0.5, lb.y + lb.h * 0.5 + 3);
            ctx.fillStyle = '#fff0c2';
            ctx.fillText(LANG_TEXT[currentLang].button, lb.x + lb.w * 0.5, lb.y + lb.h * 0.5 + 1);
            ctx.restore();

            // 2. Minimalistic "Next" Button (Top-Right: Stitched Tailor's Button with Golden Arrow)
            ctx.save();
            const nb = nextBtnRect;
            const nScale = pointer.hoverNextBtn ? 1.06 : 1.0;
            ctx.translate(nb.x + nb.w * 0.5, nb.y + nb.h * 0.5);
            ctx.scale(nScale, nScale);
            ctx.translate(-(nb.x + nb.w * 0.5), -(nb.y + nb.h * 0.5));

            ctx.fillStyle = 'rgba(10, 4, 1, 0.5)';
            drawRoundedRect(nb.x + 3, nb.y + 6, nb.w, nb.h, 20);
            ctx.fill();

            const nGrad = ctx.createLinearGradient(nb.x, nb.y, nb.x, nb.y + nb.h);
            nGrad.addColorStop(0, pointer.hoverNextBtn ? '#2e7d56' : '#215e40');
            nGrad.addColorStop(1, '#113824');
            drawRoundedRect(nb.x, nb.y, nb.w, nb.h, 20);
            ctx.fillStyle = nGrad;
            ctx.fill();
            ctx.strokeStyle = '#d49b27';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.strokeStyle = '#ffe299';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 5]);
            drawRoundedRect(nb.x + 7, nb.y + 7, nb.w - 14, nb.h - 14, 14);
            ctx.stroke();
            ctx.setLineDash([]);

            // Custom-drawn embossed golden "Next" arrow icon
            const acx = nb.x + nb.w * 0.5;
            const acy = nb.y + nb.h * 0.5;
            ctx.fillStyle = '#fff0b8';
            ctx.strokeStyle = '#472802';
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(acx - 26, acy - 10);
            ctx.lineTo(acx + 2, acy - 10);
            ctx.lineTo(acx + 2, acy - 21);
            ctx.lineTo(acx + 28, acy);
            ctx.lineTo(acx + 2, acy + 21);
            ctx.lineTo(acx + 2, acy + 10);
            ctx.lineTo(acx - 26, acy + 10);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        // ============================================================================
        // 7. CELEBRATION PARTICLES (3D Wooden Buttons, Stars, Satin Curls)
        // ============================================================================
        function drawParticles() {
            for (const p of particles) {
                const alpha = Math.max(0, 1 - Math.pow(p.life / p.maxLife, 2));
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);

                if (p.type === 'button') {
                    // Tailor's button with 4 thread holes
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#2b1204';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size * 0.72, 0, Math.PI * 2);
                    ctx.stroke();

                    // 4 button holes
                    ctx.fillStyle = '#2b1204';
                    const hr = p.size * 0.25;
                    [[-hr, -hr], [hr, -hr], [-hr, hr], [hr, hr]].forEach(([hx, hy]) => {
                        ctx.beginPath();
                        ctx.arc(hx, hy, 2.3, 0, Math.PI * 2);
                        ctx.fill();
                    });
                } else if (p.type === 'star') {
                    // Golden star
                    ctx.fillStyle = '#ffe066';
                    ctx.strokeStyle = '#9e6306';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    for (let i = 0; i < 10; i++) {
                        const rad = i % 2 === 0 ? p.size : p.size * 0.45;
                        const ang = (i * Math.PI) / 5;
                        if (i === 0) ctx.moveTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
                        else ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else if (p.type === 'ribbon') {
                    // Curly satin streamer
                    ctx.fillStyle = p.color;
                    drawRoundedRect(-p.size, -p.size * 0.35, p.size * 2, p.size * 0.7, 4);
                    ctx.fill();
                } else {
                    // Golden thread spark
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // ============================================================================
        // 8. CUSTOM PROCEDURAL CURSORS (Tailor's Shears & Sewing Needle with Thread)
        // ============================================================================
        function drawTailorsScissors(x, y, angle, bladeOpenAngle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Drop shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            ctx.ellipse(6, 12, 42, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            const drawBladeAndHandle = (isUpper) => {
                ctx.save();
                ctx.rotate(isUpper ? -bladeOpenAngle : bladeOpenAngle);

                // Steel Blade
                const steelGrad = ctx.createLinearGradient(0, -10, 85, 10);
                steelGrad.addColorStop(0, '#cfd8dc');
                steelGrad.addColorStop(0.5, '#ffffff');
                steelGrad.addColorStop(1, '#90a4ae');
                ctx.fillStyle = steelGrad;
                ctx.strokeStyle = '#37474f';
                ctx.lineWidth = 2.5;

                ctx.beginPath();
                if (isUpper) {
                    ctx.moveTo(-12, 4);
                    ctx.lineTo(88, 0);
                    ctx.quadraticCurveTo(65, -15, -12, -11);
                } else {
                    ctx.moveTo(-12, -4);
                    ctx.lineTo(88, 0);
                    ctx.quadraticCurveTo(65, 15, -12, 11);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Sculpted Brass/Burgundy Handle Ring
                const hY = isUpper ? 20 : -20;
                ctx.strokeStyle = '#d49b27';
                ctx.lineWidth = 9;
                ctx.beginPath();
                ctx.ellipse(-44, hY, 24, 15, isUpper ? -0.25 : 0.25, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = '#5c3804';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            };

            drawBladeAndHandle(false);
            drawBladeAndHandle(true);

            // Central Brass Pivot Screw
            drawBrassRivet(0, 0, 7);

            ctx.restore();
        }

        function drawSewingNeedleAndThread(x, y, angle) {
            // 1. Draw the physics-simulated golden thread trailing from the needle eye
            ctx.save();
            ctx.strokeStyle = 'rgba(20, 8, 0, 0.38)';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(threadNodes[0].x + 3, threadNodes[0].y + 6);
            for (let i = 1; i < THREAD_NODES - 1; i++) {
                const xc = (threadNodes[i].x + threadNodes[i + 1].x) * 0.5 + 3;
                const yc = (threadNodes[i].y + threadNodes[i + 1].y) * 0.5 + 6;
                ctx.quadraticCurveTo(threadNodes[i].x + 3, threadNodes[i].y + 6, xc, yc);
            }
            ctx.stroke();

            // Golden silk thread core
            ctx.strokeStyle = '#ffd147';
            ctx.lineWidth = 4.5;
            ctx.beginPath();
            ctx.moveTo(threadNodes[0].x, threadNodes[0].y);
            for (let i = 1; i < THREAD_NODES - 1; i++) {
                const xc = (threadNodes[i].x + threadNodes[i + 1].x) * 0.5;
                const yc = (threadNodes[i].y + threadNodes[i + 1].y) * 0.5;
                ctx.quadraticCurveTo(threadNodes[i].x, threadNodes[i].y, xc, yc);
            }
            ctx.stroke();

            // Thread highlight
            ctx.strokeStyle = '#fff6bd';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();

            // 2. Draw Gleaming Silver Sewing Needle (Tip at x, y)
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            const needleLen = 96;
            const needleGrad = ctx.createLinearGradient(-needleLen, -4, 0, 4);
            needleGrad.addColorStop(0, '#b0bec5');
            needleGrad.addColorStop(0.5, '#ffffff');
            needleGrad.addColorStop(1, '#cfd8dc');

            ctx.fillStyle = needleGrad;
            ctx.strokeStyle = '#455a64';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(0, 0); // Sharp tip
            ctx.lineTo(-needleLen + 10, -5.5);
            ctx.arc(-needleLen + 10, 0, 5.5, -Math.PI * 0.5, Math.PI * 0.5, true);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Golden Needle Eye at the back
            ctx.fillStyle = '#d49b27';
            ctx.beginPath();
            ctx.ellipse(-needleLen + 14, 0, 7, 2.6, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawCustomCursor() {
            const m = getRibbonMetrics();

            // During active cutting animation, show the scissors slicing straight up the cut line!
            if (gameState === STATE.CUTTING && ribbonAnim.cutProgress < 1) {
                const topY = m.centerY - m.height * 0.5;
                const scX = m.cutX;
                const scY = (topY + m.height + 18) - ribbonAnim.cutProgress * (m.height + 36);
                const snipAngle = 0.08 + Math.abs(Math.sin(ribbonAnim.cutProgress * Math.PI * 4)) * 0.42;
                drawTailorsScissors(scX, scY, -Math.PI * 0.5, snipAngle);
                return;
            }

            // During active sewing animation, draw the needle stitching across the ribbon seam
            if (verifyState.isSewingNow) {
                drawSewingNeedleAndThread(ribbonAnim.activeNeedleX, ribbonAnim.activeNeedleY, ribbonAnim.activeNeedleAngle);
                return;
            }

            // Otherwise, draw tool at pointer position
            if (gameState === STATE.INTRO || gameState === STATE.READY_TO_CUT || gameState === STATE.CUTTING) {
                const hoverSnip = pointer.hoverCutZone ? Math.abs(Math.sin(globalTime * 9)) * 0.38 : 0.18 + Math.sin(pointer.snipPhase) * 0.1;
                const targetAngle = pointer.hoverCutZone ? -Math.PI * 0.45 : -Math.PI * 0.25;
                drawTailorsScissors(pointer.x, pointer.y, targetAngle, hoverSnip);
            } else {
                // Verification & Celebration: Needle with trailing physics thread
                const needleAngle = pointer.hoverSewZone ? -2.1 + Math.sin(globalTime * 8) * 0.12 : -2.35;
                drawSewingNeedleAndThread(pointer.x, pointer.y, needleAngle);
            }
        }

        // ============================================================================
        // MAIN RENDER LOOP
        // ============================================================================
        let prevTimestamp = performance.now();

        function renderFrame(timestamp) {
            const dt = Math.min(0.05, (timestamp - prevTimestamp) / 1000);
            prevTimestamp = timestamp;

            update(dt);

            // Clear viewport with deep warm timber color
            ctx.fillStyle = '#1a0e07';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            // Clip to 16:9 stage
            ctx.beginPath();
            ctx.rect(0, 0, VW, VH);
            ctx.clip();

            // 1. Living Woodland Workshop Background
            drawBackground();

            // 2. Realistic Bear Tailor Character
            drawBearTailorCharacter();

            // 3. Foreground Tailor's Workbench & Velvet Mat
            drawWorkbench();

            // 4. Interactive Color-Coded Satin Ribbon (with Cut & Sew states)
            drawInteractiveRibbon();

            // 5. Bear Tailor's Paws holding the ribbon / clapping
            drawBearPaws();

            // 6. Floating Golden Dust Motes in Sunbeams
            for (const d of dustMotes) {
                ctx.fillStyle = `rgba(255, 240, 175, ${d.alpha})`;
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                ctx.fill();
            }

            // 7. Carved Oak & Stitched Velvet Equation Board
            drawEquationBoard();

            // 8. Interactive Wooden Tray of 10 Tailor Buttons (1..10)
            drawNumberButtonTray();

            // 9. Top Stylized Language (`УКР`/`РУС`) & Minimalistic `Next` Buttons
            drawStylizedUIButtons();

            // 10. Celebration Particles & Sparks
            drawParticles();

            // 11. Custom Procedural Cursor (Scissors or Needle with Thread)
            drawCustomCursor();

            ctx.restore();

            requestAnimationFrame(renderFrame);
        }

        // Start game on load
        window.onload = () => {
            generateNewProblem(false);
            requestAnimationFrame(renderFrame);
        };
    </script>
</body>
