<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лісове ательє</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e130c;
            font-family: 'Nunito', sans-serif;
            cursor: none; /* Custom procedural cursor rendered on canvas */
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * WOODLAND BEAR TAILOR'S WORKSHOP
         * Interactive visual explanation of checking subtraction with addition:
         * A - B = C  because  C + B = A
         * 100% Procedural Canvas 2D + Web Audio API Synthesizer (Zero external assets, zero white rectangles)
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Logical 16:9 widescreen coordinate space
        const VW = 1920;
        const VH = 1080;
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;

        // Language state: 'uk' -> "тому що", 'ru' -> "потому что"
        let currentLang = 'uk';
        const LANG_TEXT = {
            uk: { button: 'УКР', because: 'тому що' },
            ru: { button: 'РУС', because: 'потому что' }
        };

        // Game state machine
        const STATE = {
            INTRO: 0,
            READY_TO_CUT: 1,
            CUTTING: 2,
            VERIFY_PHASE: 3,
            CELEBRATING: 5,
            TRANSITION_OUT: 6
        };

        let gameState = STATE.INTRO;
        let stateTimer = 0;
        let globalTime = 0;

        // Current math problem: A - B = C, because C + B = A
        let prob = {
            A: 6,
            B: 4,
            C: 2
        };
        let lastKey = '';

        // Pedagogical Color-Coding Themes (Gold = Whole A, Green = Cut B, Red = Remaining C)
        const COLOR_THEMES = {
            gold: {
                main: '#e09f1f',
                dark: '#875505',
                light: '#ffe47a',
                stitch: '#fff6cc',
                badgeBg: '#9c6206',
                patchBg: '#c98612',
                patchText: '#fffbe0',
                glow: 'rgba(255, 220, 90, 0.75)'
            },
            green: {
                main: '#1f9e55',
                dark: '#0c592b',
                light: '#6be89b',
                stitch: '#ffe885',
                badgeBg: '#0b4f26',
                patchBg: '#197a41',
                patchText: '#eafff0',
                glow: 'rgba(80, 235, 145, 0.75)'
            },
            red: {
                main: '#d92b3c',
                dark: '#820f1b',
                light: '#ff7583',
                stitch: '#ffe082',
                badgeBg: '#6e0b15',
                patchBg: '#b81d2d',
                patchText: '#fff0f2',
                glow: 'rgba(255, 95, 110, 0.75)'
            },
            neutralSlot: {
                patchBg: '#4a2510',
                patchText: '#ffd166'
            }
        };

        // Interactive verification state for "тому що [ ? ] + [ ? ] = [ ? ]"
        const verifyState = {
            slots: [null, null, null], // { value, colorKey, popScale }
            activeSlot: 0,
            slotRects: [
                { x: 0, y: 0, w: 78, h: 78 },
                { x: 0, y: 0, w: 78, h: 78 },
                { x: 0, y: 0, w: 78, h: 78 }
            ],
            slotWobble: [0, 0, 0],
            isSewn: false,
            isSewingNow: false,
            sewTimer: 0,
            traySlide: 0,       // 0..1 rises from bottom after cutting
            hintPulseC: 0,      // Visual pulse on Red C piece when guided
            hintPulseB: 0,      // Visual pulse on Green B piece when guided
            hintPulseA: 0       // Visual pulse on Whole A when guided
        };

        // Bottom tray of 10 numbered tailor buttons (1..10)
        const numberButtons = [];
        for (let i = 1; i <= 10; i++) {
            numberButtons.push({
                num: i,
                x: 0,
                y: 0,
                r: 44,
                hover: false,
                pressScale: 1,
                wobble: 0
            });
        }

        // Pointer / Cursor state in logical coordinates (VW x VH)
        const pointer = {
            x: VW * 0.5,
            y: VH * 0.65,
            vx: 0,
            vy: 0,
            isDown: false,
            hoverCutZone: false,
            hoverSewZone: false,
            hoverLeftPiece: false,
            hoverRightPiece: false,
            hoverWholeBadge: false,
            hoverLangBtn: false,
            hoverNextBtn: false,
            hoverSlotIdx: -1,
            hoverNumBtnIdx: -1,
            snipPhase: 0
        };

        // Verlet physics thread attached to the sewing needle
        const THREAD_NODES = 22;
        const THREAD_SEG_LEN = 11;
        const threadNodes = [];
        for (let i = 0; i < THREAD_NODES; i++) {
            threadNodes.push({ x: pointer.x, y: pointer.y, oldX: pointer.x, oldY: pointer.y });
        }

        // Ribbon geometry & physics animation variables
        const ribbonAnim = {
            appearScale: 0,
            splitGap: 0,         // 0 when whole, up to 115 when cut
            leftTilt: 0,
            rightTilt: 0,
            cutProgress: 0,      // 0..1 during cutting
            sewProgress: 0,      // 0..1 during sewing
            leftRedMorph: 0,     // 0 = Gold before cut, 1 = Ruby Red after cut
            partBadgesScale: 0,  // 0..1 pop-in for C badge
            wholeBadgeScale: 1,  // 1 when whole, shrinks on cut, returns on sew
            unitedGlow: 0,       // glow when sewn back together
            activeNeedleX: 0,
            activeNeedleY: 0,
            activeNeedleAngle: 0
        };

        // Equation board animation state
        const boardAnim = {
            subAnswerScale: 0,    // pops in when cut
            becausePanelSlide: 0, // unfolds 0..1 after cut
            boardBounce: 0
        };

        // Bear Tailor character animation state
        const bearAnim = {
            breath: 0,
            blinkTimer: 2.5,
            blinkState: 0,
            earTwitch: 0,
            headTilt: 0,
            curiousTiltTimer: 0,
            joyLevel: 0,          // 0 = normal/focused, 1 = cheering
            pawLeftOffset: { x: 0, y: 0 },
            pawRightOffset: { x: 0, y: 0 },
            lookX: 0,
            lookY: 0
        };

        // Ambient dust motes in sunbeams
        const dustMotes = [];
        for (let i = 0; i < 45; i++) {
            dustMotes.push({
                x: Math.random() * VW,
                y: Math.random() * VH,
                r: 1.5 + Math.random() * 3.5,
                speedY: -8 - Math.random() * 14,
                speedX: 4 + Math.random() * 10,
                phase: Math.random() * Math.PI * 2,
                alpha: 0.25 + Math.random() * 0.55
            });
        }

        // Active celebration particles (wooden buttons, golden stars, satin curls, thread sparks)
        const particles = [];

        // Interactive Top UI Button Hitboxes (Logical coords)
        const langBtnRect = { x: 42, y: 36, w: 136, h: 68 };
        const nextBtnRect = { x: VW - 178, y: 36, w: 136, h: 68 };

        // ============================================================================
        // WEB AUDIO API SYNTHESIZER (Rich, realistic, non-verbal sound effects)
        // ============================================================================
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Crisp metallic tailor's shears snip sound
            playSnip(pitchShift = 1.0) {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;

                // 1. Metallic blade friction burst (bandpass filtered white noise)
                const bufferSize = this.ctx.sampleRate * 0.09;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
                }
                const whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(3200 * pitchShift, now);
                filter.frequency.exponentialRampToValueAtTime(6400 * pitchShift, now + 0.08);
                filter.Q.value = 3.5;

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.45, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.085);

                whiteNoise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);
                whiteNoise.start(now);

                // 2. High steel ring resonance
                const osc = this.ctx.createOscillator();
                const oscGain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1950 * pitchShift, now);
                osc.frequency.exponentialRampToValueAtTime(4200 * pitchShift, now + 0.06);

                oscGain.gain.setValueAtTime(0.22, now);
                oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);

                osc.connect(oscGain);
                oscGain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            }

            // Wooden button / badge pop sound
            playPop(freq = 440) {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq * 0.65, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.45, now + 0.09);
                osc.frequency.exponentialRampToValueAtTime(freq, now + 0.16);

                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.32, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.19);
            }

            // Musical harp/pizzicato stitch sound
            playStitch(stepIndex) {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const scaleFreqs = [392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 783.99];
                const freq = scaleFreqs[stepIndex % scaleFreqs.length];

                // Plucked string harmonic
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc1.type = 'triangle';
                osc2.type = 'sine';
                osc1.frequency.setValueAtTime(freq, now);
                osc2.frequency.setValueAtTime(freq * 2, now);

                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.28, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.29);
                osc2.stop(now + 0.29);
            }

            // Cheerful marimba chime when a number slot is filled correctly
            playCorrectSlot(slotIndex = 0) {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const baseFreqs = [523.25, 659.25, 783.99];
                const f = baseFreqs[slotIndex % 3];

                [f, f * 1.5].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.055);
                    gain.gain.setValueAtTime(0.001, now + idx * 0.055);
                    gain.gain.linearRampToValueAtTime(0.28, now + idx * 0.055 + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.28);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.055);
                    osc.stop(now + idx * 0.055 + 0.3);
                });
            }

            // Comical woody "boing" wobble when child picks a wrong number
            playWrongBoing() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(240, now);
                osc.frequency.exponentialRampToValueAtTime(145, now + 0.12);
                osc.frequency.exponentialRampToValueAtTime(210, now + 0.24);
                osc.frequency.exponentialRampToValueAtTime(130, now + 0.35);

                gain.gain.setValueAtTime(0.32, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.38);
            }

            // Joyful multi-instrument celebration fanfare
            playCelebrationFanfare() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;

                // Warm marimba + celesta chord arpeggio (C major -> G -> C6)
                const notes = [
                    { f: 523.25, t: 0.00, d: 0.35 },
                    { f: 659.25, t: 0.09, d: 0.35 },
                    { f: 783.99, t: 0.18, d: 0.35 },
                    { f: 1046.50, t: 0.27, d: 0.65 },
                    { f: 880.00, t: 0.48, d: 0.25 },
                    { f: 1046.50, t: 0.62, d: 0.85 },
                    { f: 1318.51, t: 0.62, d: 0.85 }
                ];

                notes.forEach(n => {
                    const osc = this.ctx.createOscillator();
                    const sub = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    sub.type = 'sine';
                    osc.frequency.setValueAtTime(n.f, now + n.t);
                    sub.frequency.setValueAtTime(n.f * 0.5, now + n.t);

                    gain.gain.setValueAtTime(0.001, now + n.t);
                    gain.gain.linearRampToValueAtTime(0.22, now + n.t + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);

                    osc.connect(gain);
                    sub.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now + n.t);
                    sub.start(now + n.t);
                    osc.stop(now + n.t + n.d + 0.02);
                    sub.stop(now + n.t + n.d + 0.02);
                });
            }

            // Soft wooden click for UI buttons
            playClick() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(220, now + 0.045);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.055);
            }
        }

        const sound = new SoundEngine();

        // ============================================================================
        // PROBLEM GENERATOR & INITIALIZATION
        // ============================================================================
        function generateNewProblem(playAudio = false) {
            let A, B, key;
            do {
                // Minuend from 5 to 10 for clear visual segmentation
                A = Math.floor(Math.random() * 6) + 5; // 5..10
                B = Math.floor(Math.random() * (A - 1)) + 1; // 1..(A-1)
                key = `${A}-${B}`;
            } while (key === lastKey);
            lastKey = key;

            prob.A = A;
            prob.B = B;
            prob.C = A - B;

            // Reset animations
            ribbonAnim.appearScale = 0;
            ribbonAnim.splitGap = 0;
            ribbonAnim.leftTilt = 0;
            ribbonAnim.rightTilt = 0;
            ribbonAnim.cutProgress = 0;
            ribbonAnim.sewProgress = 0;
            ribbonAnim.leftRedMorph = 0;
            ribbonAnim.partBadgesScale = 0;
            ribbonAnim.wholeBadgeScale = 1;
            ribbonAnim.unitedGlow = 0;

            boardAnim.subAnswerScale = 0;
            boardAnim.becausePanelSlide = 0;
            boardAnim.boardBounce = 0;

            // Reset interactive addition verification state
            verifyState.slots = [null, null, null];
            verifyState.activeSlot = 0;
            verifyState.slotWobble = [0, 0, 0];
            verifyState.isSewn = false;
            verifyState.isSewingNow = false;
            verifyState.sewTimer = 0;
            verifyState.traySlide = 0;
            verifyState.hintPulseC = 0;
            verifyState.hintPulseB = 0;
            verifyState.hintPulseA = 0;

            bearAnim.joyLevel = 0;
            bearAnim.curiousTiltTimer = 0;

            gameState = STATE.INTRO;
            stateTimer = 0;

            if (playAudio) {
                sound.playPop(520);
            }
        }

        // ============================================================================
        // RESPONSIVE SCALING & COORDINATE MAPPING
        // ============================================================================
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;

            const scaleX = canvas.width / VW;
            const scaleY = canvas.height / VH;
            scale = Math.min(scaleX, scaleY);

            offsetX = (canvas.width - VW * scale) * 0.5;
            offsetY = (canvas.height - VH * scale) * 0.5;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function toLogicalCoords(clientX, clientY) {
            const dpr = window.devicePixelRatio || 1;
            const cx = clientX * dpr;
            const cy = clientY * dpr;
            return {
                x: (cx - offsetX) / scale,
                y: (cy - offsetY) / scale
            };
        }

        // ============================================================================
        // RIBBON GEOMETRY HELPERS
        // ============================================================================
        function getRibbonMetrics() {
            const centerX = VW * 0.5;
            const centerY = 782;
            const unitWidth = Math.min(114, 920 / prob.A);
            const totalW = prob.A * unitWidth;
            const leftW = prob.C * unitWidth;
            const rightW = prob.B * unitWidth;
            const height = 100;

            const startX = centerX - totalW * 0.5;
            const cutX = startX + leftW;

            return {
                centerX,
                centerY,
                unitWidth,
                totalW,
                leftW,
                rightW,
                height,
                startX,
                cutX
            };
        }

        function updateNumberButtonPositions() {
            const trayCenterY = VH + 110 - verifyState.traySlide * 212; // Rises to y = 978
            const spacing = 108;
            const startX = VW * 0.5 - 4.5 * spacing;

            for (let i = 0; i < 10; i++) {
                // Slight graceful curve along the wooden tray
                const norm = (i - 4.5) / 4.5;
                const curveY = Math.pow(norm, 2) * 14;
                numberButtons[i].x = startX + i * spacing;
                numberButtons[i].y = trayCenterY + curveY;
            }
        }

        // ============================================================================
        // PARTICLE SPAWNERS (Sparks, Buttons, Golden Stars, Satin Curls)
        // ============================================================================
        function spawnCutSparks(x, y) {
            for (let i = 0; i < 28; i++) {
                const angle = -Math.PI * 0.5 + (Math.random() - 0.5) * Math.PI * 1.4;
                const speed = 120 + Math.random() * 360;
                particles.push({
                    type: Math.random() < 0.6 ? 'spark' : 'threadBit',
                    x,
                    y: y + (Math.random() - 0.5) * 80,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 80,
                    gravity: 650,
                    rot: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 12,
                    size: 5 + Math.random() * 8,
                    color: Math.random() < 0.5 ? '#ffe57f' : '#ffffff',
                    life: 0,
                    maxLife: 0.45 + Math.random() * 0.35
                });
            }
        }

        function spawnCelebrationConfetti() {
            const colors = ['#ff5964', '#ffca3a', '#8ac926', '#1982c4', '#b56576', '#ff9f1c'];
            const m = getRibbonMetrics();

            for (let i = 0; i < 65; i++) {
                const pTypeRand = Math.random();
                const type = pTypeRand < 0.42 ? 'button' : (pTypeRand < 0.75 ? 'star' : 'ribbon');
                const spawnX = m.centerX + (Math.random() - 0.5) * 650;
                const spawnY = m.centerY - 20 + (Math.random() - 0.5) * 80;
                const angle = -Math.PI * 0.5 + (Math.random() - 0.5) * 1.35;
                const speed = 380 + Math.random() * 680;

                particles.push({
                    type,
                    x: spawnX,
                    y: spawnY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 180,
                    gravity: 780,
                    rot: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 10,
                    size: 14 + Math.random() * 14,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 0,
                    maxLife: 1.6 + Math.random() * 1.1
                });
            }
        }

        // ============================================================================
        // INTERACTION HANDLERS (Mouse, Touch & Keyboard)
        // ============================================================================
        function pointInRect(px, py, r) {
            return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
        }

        function checkVictoryCondition() {
            if (gameState !== STATE.VERIFY_PHASE) return;
            const allSlotsFilled = verifyState.slots[0] !== null &&
                                   verifyState.slots[1] !== null &&
                                   verifyState.slots[2] !== null;

            if (allSlotsFilled && verifyState.isSewn && !verifyState.isSewingNow) {
                boardAnim.boardBounce = 1;
                bearAnim.joyLevel = 1;
                ribbonAnim.unitedGlow = 1;

                sound.playCelebrationFanfare();
                spawnCelebrationConfetti();

                gameState = STATE.CELEBRATING;
                stateTimer = 0;
            }
        }

        function triggerCutAction() {
            if (gameState !== STATE.READY_TO_CUT) return;
            gameState = STATE.CUTTING;
            stateTimer = 0;
            sound.playSnip(1.0);
            setTimeout(() => sound.playSnip(1.18), 140);

            const m = getRibbonMetrics();
            spawnCutSparks(m.cutX, m.centerY);
        }

        function triggerSewAction() {
            if (gameState !== STATE.VERIFY_PHASE || verifyState.isSewn || verifyState.isSewingNow) return;
            verifyState.isSewingNow = true;
            verifyState.sewTimer = 0;
            ribbonAnim.sewProgress = 0;
            lastStitchSoundIdx = 0;
            sound.playStitch(0);
        }

        // Validate and place a number (1..10) into the currently active addition slot: [ ? ] + [ ? ] = [ ? ]
        function handleNumberInput(numVal, sourceBtnIdx = -1) {
            if (gameState !== STATE.VERIFY_PHASE) return;

            // Find target slot
            let slotIdx = verifyState.activeSlot;
            if (slotIdx < 0 || slotIdx > 2 || verifyState.slots[slotIdx] !== null) {
                slotIdx = verifyState.slots.findIndex(s => s === null);
                if (slotIdx === -1) return; // All slots already filled
                verifyState.activeSlot = slotIdx;
            }

            let isCorrect = false;
            let assignedColorKey = 'gold';

            if (slotIdx === 0 || slotIdx === 1) {
                // First two slots are the addends (parts C and B in either order)
                const otherIdx = slotIdx === 0 ? 1 : 0;
                const otherSlot = verifyState.slots[otherIdx];

                if (!otherSlot) {
                    // Either C (Red) or B (Green) is accepted in the first filled addend slot
                    if (numVal === prob.C) {
                        isCorrect = true;
                        assignedColorKey = 'red';
                    } else if (numVal === prob.B) {
                        isCorrect = true;
                        assignedColorKey = 'green';
                    }
                } else {
                    // The other addend slot is already filled; require the remaining part
                    if (otherSlot.colorKey === 'red' && numVal === prob.B) {
                        isCorrect = true;
                        assignedColorKey = 'green';
                    } else if (otherSlot.colorKey === 'green' && numVal === prob.C) {
                        isCorrect = true;
                        assignedColorKey = 'red';
                    }
                }
            } else if (slotIdx === 2) {
                // Third slot is the sum (= A in Gold)
                if (numVal === prob.A) {
                    isCorrect = true;
                    assignedColorKey = 'gold';
                }
            }

            if (isCorrect) {
                verifyState.slots[slotIdx] = {
                    value: numVal,
                    colorKey: assignedColorKey,
                    popScale: 1.45
                };
                if (sourceBtnIdx >= 0) {
                    numberButtons[sourceBtnIdx].pressScale = 1.28;
                }
                sound.playCorrectSlot(slotIdx);

                // Sparkle burst on the filled slot
                const sr = verifyState.slotRects[slotIdx];
                if (sr) {
                    spawnCutSparks(sr.x + sr.w * 0.5, sr.y + sr.h * 0.5);
                }

                // Advance activeSlot to the next empty slot
                const nextEmpty = verifyState.slots.findIndex(s => s === null);
                verifyState.activeSlot = nextEmpty;

                checkVictoryCondition();
            } else {
                // Wrong number: play comical boing, wobble slot & button, and pulse the visual ribbon clue!
                sound.playWrongBoing();
                verifyState.slotWobble[slotIdx] = 1.0;
                bearAnim.curiousTiltTimer = 0.85;

                if (sourceBtnIdx >= 0) {
                    numberButtons[sourceBtnIdx].wobble = 1.0;
                }

                // Trigger visual hint pulse on the corresponding ribbon part(s)
                if (slotIdx === 0 || slotIdx === 1) {
                    const otherIdx = slotIdx === 0 ? 1 : 0;
                    const otherSlot = verifyState.slots[otherIdx];
                    if (!otherSlot) {
                        verifyState.hintPulseC = 1.0;
                        verifyState.hintPulseB = 1.0;
                    } else if (otherSlot.colorKey === 'red') {
                        verifyState.hintPulseB = 1.0;
                    } else {
                        verifyState.hintPulseC = 1.0;
                    }
                } else {
                    verifyState.hintPulseA = 1.0;
                    verifyState.hintPulseC = 0.7;
                    verifyState.hintPulseB = 0.7;
                }
            }
        }

        function updateHoverStates() {
            pointer.hoverLangBtn = pointInRect(pointer.x, pointer.y, langBtnRect);
            pointer.hoverNextBtn = pointInRect(pointer.x, pointer.y, nextBtnRect);

            const m = getRibbonMetrics();
            const halfGap = ribbonAnim.splitGap * 0.5;
            const topY = m.centerY - m.height * 0.5;

            // Reset hover flags
            pointer.hoverCutZone = false;
            pointer.hoverSewZone = false;
            pointer.hoverLeftPiece = false;
            pointer.hoverRightPiece = false;
            pointer.hoverWholeBadge = false;
            pointer.hoverSlotIdx = -1;
            pointer.hoverNumBtnIdx = -1;

            if (gameState === STATE.READY_TO_CUT) {
                const ribbonBox = {
                    x: m.startX - 60,
                    y: m.centerY - m.height * 0.95,
                    w: m.totalW + 120,
                    h: m.height * 1.9
                };
                pointer.hoverCutZone = pointInRect(pointer.x, pointer.y, ribbonBox);
            } else if (gameState === STATE.VERIFY_PHASE) {
                // Check seam / gap zone for sewing
                if (!verifyState.isSewn && !verifyState.isSewingNow) {
                    const seamZone = {
                        x: m.cutX - halfGap - 42,
                        y: topY - 25,
                        w: ribbonAnim.splitGap + 84,
                        h: m.height + 50
                    };
                    pointer.hoverSewZone = pointInRect(pointer.x, pointer.y, seamZone);
                }

                // Check left Red (C) and right Green (B) ribbon pieces (so child can also click pieces directly!)
                const leftPieceBox = {
                    x: m.startX - halfGap - 10,
                    y: topY - 10,
                    w: m.leftW + 10,
                    h: m.height + 20
                };
                const rightPieceBox = {
                    x: m.cutX + halfGap,
                    y: topY - 10,
                    w: m.rightW + 10,
                    h: m.height + 20
                };
                if (!pointer.hoverSewZone) {
                    pointer.hoverLeftPiece = pointInRect(pointer.x, pointer.y, leftPieceBox);
                    pointer.hoverRightPiece = pointInRect(pointer.x, pointer.y, rightPieceBox);
                }

                // If sewn, check top Golden 'A' badge above the ribbon
                if (verifyState.isSewn) {
                    const distToBadgeA = Math.hypot(pointer.x - m.centerX, pointer.y - (topY - 34));
                    pointer.hoverWholeBadge = distToBadgeA <= 48;
                }

                // Check the 3 equation slots [ ? ] + [ ? ] = [ ? ]
                for (let i = 0; i < 3; i++) {
                    if (pointInRect(pointer.x, pointer.y, verifyState.slotRects[i])) {
                        pointer.hoverSlotIdx = i;
                        break;
                    }
                }

                // Check the 10 number buttons in the bottom tray
                updateNumberButtonPositions();
                for (let i = 0; i < 10; i++) {
                    const btn = numberButtons[i];
                    const d = Math.hypot(pointer.x - btn.x, pointer.y - btn.y);
                    btn.hover = d <= btn.r + 6;
                    if (btn.hover) {
                        pointer.hoverNumBtnIdx = i;
                    }
                }
            }
        }

        function handlePointerDown(clientX, clientY) {
            sound.init();
            const pos = toLogicalCoords(clientX, clientY);
            pointer.x = pos.x;
            pointer.y = pos.y;
            pointer.isDown = true;
            updateHoverStates();

            // 1. Check Language Toggle Button (УКР / РУС)
            if (pointer.hoverLangBtn) {
                currentLang = currentLang === 'uk' ? 'ru' : 'uk';
                sound.playClick();
                return;
            }

            // 2. Check Minimalistic Next Button (Skip/Next Problem immediately)
            if (pointer.hoverNextBtn) {
                sound.playClick();
                generateNewProblem(true);
                return;
            }

            // 3. Game Interactions by Phase
            if (gameState === STATE.READY_TO_CUT && pointer.hoverCutZone) {
                triggerCutAction();
                return;
            }

            if (gameState === STATE.VERIFY_PHASE) {
                // a) Clicking a number button 1..10
                if (pointer.hoverNumBtnIdx >= 0) {
                    const btn = numberButtons[pointer.hoverNumBtnIdx];
                    handleNumberInput(btn.num, pointer.hoverNumBtnIdx);
                    return;
                }

                // b) Clicking one of the [ ? ] slots on the board to select it
                if (pointer.hoverSlotIdx >= 0) {
                    if (verifyState.slots[pointer.hoverSlotIdx] === null) {
                        verifyState.activeSlot = pointer.hoverSlotIdx;
                        sound.playClick();
                    }
                    return;
                }

                // c) Clicking the seam between the two ribbon pieces to sew them together
                if (pointer.hoverSewZone) {
                    triggerSewAction();
                    return;
                }

                // d) Clicking directly on the Red (C), Green (B), or Gold (A) ribbon pieces/badges
                if (pointer.hoverWholeBadge && verifyState.isSewn) {
                    handleNumberInput(prob.A, prob.A - 1);
                    return;
                }
                if (pointer.hoverLeftPiece) {
                    // If both addends are already filled and only sum A is left, and ribbon is sewn, allow clicking ribbon
                    handleNumberInput(prob.C, prob.C - 1);
                    return;
                }
                if (pointer.hoverRightPiece) {
                    handleNumberInput(prob.B, prob.B - 1);
                    return;
                }
            }

            if (gameState === STATE.CELEBRATING && stateTimer > 0.6) {
                // Clicking during celebration advances quickly
                gameState = STATE.TRANSITION_OUT;
                stateTimer = 0;
            }
        }

        function handlePointerMove(clientX, clientY) {
            const pos = toLogicalCoords(clientX, clientY);
            const dx = pos.x - pointer.x;
            const dy = pos.y - pointer.y;
            pointer.vx = dx;
            pointer.vy = dy;
            pointer.x = pos.x;
            pointer.y = pos.y;

            // Animate scissor blades slightly when moving mouse
            const speed = Math.hypot(dx, dy);
            pointer.snipPhase += speed * 0.035;

            updateHoverStates();

            // Support dragging/swiping across the ribbon to cut or sew!
            if (pointer.isDown) {
                if (gameState === STATE.READY_TO_CUT && pointer.hoverCutZone) {
                    triggerCutAction();
                } else if (gameState === STATE.VERIFY_PHASE && pointer.hoverSewZone) {
                    triggerSewAction();
                }
            }
        }

        function handlePointerUp() {
            pointer.isDown = false;
        }

        window.addEventListener('pointerdown', e => handlePointerDown(e.clientX, e.clientY));
        window.addEventListener('pointermove', e => handlePointerMove(e.clientX, e.clientY));
        window.addEventListener('pointerup', handlePointerUp);

        // Allow keyboard number entry (1-9, 0 for 10) during verification phase
        window.addEventListener('keydown', e => {
            if (gameState !== STATE.VERIFY_PHASE) return;
            if (e.key >= '1' && e.key <= '9') {
                const num = parseInt(e.key, 10);
                handleNumberInput(num, num - 1);
            } else if (e.key === '0') {
                handleNumberInput(10, 9);
            }
        });

        // ============================================================================
        // PHYSICS & STATE UPDATE LOOP
        // ============================================================================
        let lastStitchSoundIdx = 0;

        function update(dt) {
            globalTime += dt;
            stateTimer += dt;

            // Update dust motes
            for (const d of dustMotes) {
                d.x += d.speedX * dt + Math.sin(globalTime * 1.2 + d.phase) * 6 * dt;
                d.y += d.speedY * dt;
                if (d.y < -20) d.y = VH + 20;
                if (d.x > VW + 20) d.x = -20;
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life += dt;
                if (p.life >= p.maxLife) {
                    particles.splice(i, 1);
                    continue;
                }
                p.vy += p.gravity * dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.rot += p.vRot * dt;
            }

            // Decay hint pulses, slot wobbles, and button animations
            verifyState.hintPulseC = Math.max(0, verifyState.hintPulseC - dt * 1.8);
            verifyState.hintPulseB = Math.max(0, verifyState.hintPulseB - dt * 1.8);
            verifyState.hintPulseA = Math.max(0, verifyState.hintPulseA - dt * 1.8);

            for (let i = 0; i < 3; i++) {
                verifyState.slotWobble[i] = Math.max(0, verifyState.slotWobble[i] - dt * 2.8);
                if (verifyState.slots[i] && verifyState.slots[i].popScale > 1) {
                    verifyState.slots[i].popScale = Math.max(1, verifyState.slots[i].popScale - dt * 3.2);
                }
            }

            for (let i = 0; i < 10; i++) {
                const btn = numberButtons[i];
                btn.wobble = Math.max(0, btn.wobble - dt * 2.8);
                btn.pressScale += (1 - btn.pressScale) * Math.min(1, dt * 12);
            }

            // Update Bear Tailor animations
            bearAnim.breath = Math.sin(globalTime * 2.2);
            bearAnim.blinkTimer -= dt;
            if (bearAnim.blinkTimer <= 0) {
                bearAnim.blinkState = 1;
                if (bearAnim.blinkTimer <= -0.14) {
                    bearAnim.blinkState = 0;
                    bearAnim.blinkTimer = 2.4 + Math.random() * 3.2;
                }
            }

            if (bearAnim.curiousTiltTimer > 0) {
                bearAnim.curiousTiltTimer = Math.max(0, bearAnim.curiousTiltTimer - dt);
                bearAnim.headTilt = Math.sin(bearAnim.curiousTiltTimer * Math.PI * 4) * 0.14;
            } else if (gameState !== STATE.CELEBRATING) {
                bearAnim.headTilt += (0 - bearAnim.headTilt) * Math.min(1, dt * 8);
            }

            // Smooth eye tracking towards active work or cursor
            const m = getRibbonMetrics();
            let targetLookX = (pointer.x - VW * 0.5) / (VW * 0.5);
            let targetLookY = (pointer.y - 520) / 500;
            if (gameState === STATE.CUTTING || verifyState.isSewingNow) {
                targetLookX = (m.cutX - VW * 0.5) / 450;
                targetLookY = 0.65;
            }
            bearAnim.lookX += (Math.max(-1, Math.min(1, targetLookX)) - bearAnim.lookX) * Math.min(1, dt * 8);
            bearAnim.lookY += (Math.max(-1, Math.min(1, targetLookY)) - bearAnim.lookY) * Math.min(1, dt * 8);

            // State Machine Logic
            if (gameState === STATE.INTRO) {
                const t = Math.min(1, stateTimer / 0.45);
                ribbonAnim.appearScale = t === 1 ? 1 : 1 - Math.pow(2, -10 * t) * Math.cos((t * 10 - 0.75) * (2 * Math.PI) / 3);
                if (stateTimer >= 0.45) {
                    ribbonAnim.appearScale = 1;
                    gameState = STATE.READY_TO_CUT;
                    stateTimer = 0;
                }
            } else if (gameState === STATE.READY_TO_CUT) {
                ribbonAnim.wholeBadgeScale = 1 + Math.sin(globalTime * 4) * 0.03;
            } else if (gameState === STATE.CUTTING) {
                // 0.0 -> 0.32s: Scissors slice through ribbon
                // 0.25 -> 0.95s: Ribbon splits into Red C and Green B, badges pop in, equation updates
                ribbonAnim.cutProgress = Math.min(1, stateTimer / 0.32);

                if (stateTimer > 0.22) {
                    const splitT = Math.min(1, (stateTimer - 0.22) / 0.48);
                    const easeOutBack = 1 + 1.70158 * Math.pow(splitT - 1, 3) + 1.70158 * Math.pow(splitT - 1, 2);
                    ribbonAnim.splitGap = 115 * Math.min(1.12, easeOutBack);
                    ribbonAnim.leftTilt = -0.035 * Math.sin(splitT * Math.PI);
                    ribbonAnim.rightTilt = 0.045 * Math.sin(splitT * Math.PI);
                    ribbonAnim.wholeBadgeScale = Math.max(0, 1 - splitT * 3);
                    ribbonAnim.leftRedMorph = Math.min(1, splitT * 1.6);

                    if (ribbonAnim.partBadgesScale === 0 && splitT > 0.2) {
                        sound.playPop(587.33); // Pop for Red C badge & answer
                    }
                    ribbonAnim.partBadgesScale = Math.min(1.08, easeOutBack);
                    boardAnim.subAnswerScale = Math.min(1.08, easeOutBack);
                }

                if (stateTimer > 0.50) {
                    const slideT = Math.min(1, (stateTimer - 0.50) / 0.42);
                    const easeSlide = 1 - Math.pow(1 - slideT, 3);
                    boardAnim.becausePanelSlide = easeSlide;
                    verifyState.traySlide = easeSlide;
                }

                if (stateTimer >= 0.96) {
                    ribbonAnim.splitGap = 115;
                    ribbonAnim.leftRedMorph = 1;
                    ribbonAnim.partBadgesScale = 1;
                    boardAnim.subAnswerScale = 1;
                    boardAnim.becausePanelSlide = 1;
                    verifyState.traySlide = 1;
                    gameState = STATE.VERIFY_PHASE;
                    stateTimer = 0;
                    updateHoverStates();
                }
            } else if (gameState === STATE.VERIFY_PHASE) {
                // Handle sewing sub-animation if active
                if (verifyState.isSewingNow) {
                    verifyState.sewTimer += dt;
                    const duration = 0.92;
                    const p = Math.min(1, verifyState.sewTimer / duration);
                    ribbonAnim.sewProgress = p;

                    const totalStitches = 6;
                    const curStitchIdx = Math.floor(p * totalStitches);
                    if (curStitchIdx > lastStitchSoundIdx && curStitchIdx < totalStitches) {
                        lastStitchSoundIdx = curStitchIdx;
                        sound.playStitch(curStitchIdx);
                        spawnCutSparks(m.cutX, m.centerY + (p - 0.5) * m.height * 0.7);
                    }

                    // Pull the gap closed smoothly in the second half of sewing
                    const pullT = Math.max(0, Math.min(1, (p - 0.22) / 0.78));
                    const smoothPull = pullT * pullT * (3 - 2 * pullT);
                    ribbonAnim.splitGap = 115 * (1 - smoothPull);

                    // Calculate automated sewing needle position
                    const stitchWave = Math.sin(p * Math.PI * totalStitches * 2);
                    const halfGap = Math.max(18, ribbonAnim.splitGap * 0.5 + 16);
                    ribbonAnim.activeNeedleX = m.cutX + stitchWave * halfGap;
                    ribbonAnim.activeNeedleY = (m.centerY - m.height * 0.36) + p * (m.height * 0.72);
                    ribbonAnim.activeNeedleAngle = stitchWave > 0 ? -0.35 : -2.75;

                    if (verifyState.sewTimer >= duration) {
                        verifyState.isSewingNow = false;
                        verifyState.isSewn = true;
                        ribbonAnim.splitGap = 0;
                        ribbonAnim.sewProgress = 1;
                        ribbonAnim.wholeBadgeScale = 1;
                        sound.playPop(659.25);
                        updateHoverStates();
                        checkVictoryCondition();
                    }
                } else if (!verifyState.isSewn) {
                    // Gentle float while waiting for needle stitch
                    ribbonAnim.splitGap = 115 + Math.sin(globalTime * 3.5) * 4;
                } else {
                    ribbonAnim.splitGap = 0;
                }
            } else if (gameState === STATE.CELEBRATING) {
                bearAnim.joyLevel = 1;
                bearAnim.headTilt = Math.sin(stateTimer * 9) * 0.09;
                boardAnim.boardBounce = Math.max(0, 1 - stateTimer * 2.5) * Math.sin(stateTimer * 18) * 0.12;
                ribbonAnim.unitedGlow = 0.6 + Math.sin(stateTimer * 7) * 0.4;
                verifyState.traySlide = Math.max(0, 1 - stateTimer * 1.8);

                // Automatically advance to next problem after 2.8 seconds
                if (stateTimer >= 2.8) {
                    gameState = STATE.TRANSITION_OUT;
                    stateTimer = 0;
                }
            } else if (gameState === STATE.TRANSITION_OUT) {
                const t = Math.min(1, stateTimer / 0.32);
                ribbonAnim.appearScale = 1 - t * t;
                if (stateTimer >= 0.32) {
                    generateNewProblem(true);
                }
            }

            // Update Verlet physics thread attached to the needle eye
            const needleUsingAuto = verifyState.isSewingNow;
            const nX = needleUsingAuto ? ribbonAnim.activeNeedleX : pointer.x;
            const nY = needleUsingAuto ? ribbonAnim.activeNeedleY : pointer.y;
            const nAng = needleUsingAuto ? ribbonAnim.activeNeedleAngle : -2.35;

            const needleLen = 92;
            const anchorX = nX - Math.cos(nAng) * needleLen;
            const anchorY = nY - Math.sin(nAng) * needleLen;

            threadNodes[0].x = anchorX;
            threadNodes[0].y = anchorY;

            for (let i = 1; i < THREAD_NODES; i++) {
                const node = threadNodes[i];
                const vx = (node.x - node.oldX) * 0.88;
                const vy = (node.y - node.oldY) * 0.88;
                node.oldX = node.x;
                node.oldY = node.y;
                node.x += vx;
                node.y += vy + 0.65; // subtle gravity droop
            }

            // Distance constraints relaxation
            for (let iter = 0; iter < 5; iter++) {
                threadNodes[0].x = anchorX;
                threadNodes[0].y = anchorY;
                for (let i = 0; i < THREAD_NODES - 1; i++) {
                    const a = threadNodes[i];
                    const b = threadNodes[i + 1];
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const dist = Math.hypot(dx, dy) || 0.0001;
                    const diff = (dist - THREAD_SEG_LEN) / dist;
                    if (i === 0) {
                        b.x -= dx * diff;
                        b.y -= dy * diff;
                    } else {
                        a.x += dx * diff * 0.5;
                        a.y += dy * diff * 0.5;
                        b.x -= dx * diff * 0.5;
                        b.y -= dy * diff * 0.5;
                    }
                }
            }
        }

        // ============================================================================
        // PROCEDURAL DRAWING HELPERS
        // ============================================================================
        function drawRoundedRect(x, y, w, h, r) {
            const radius = Math.min(r, w * 0.5, h * 0.5);
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + w, y, x + w, y + h, radius);
            ctx.arcTo(x + w, y + h, x, y + h, radius);
            ctx.arcTo(x, y + h, x, y, radius);
            ctx.arcTo(x, y, x + w, y, radius);
            ctx.closePath();
        }

        function drawBrassRivet(x, y, r = 7) {
            const grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
            grad.addColorStop(0, '#fff3b0');
            grad.addColorStop(0.45, '#d49b27');
            grad.addColorStop(1, '#5e3a04');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#3b2202';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        // ============================================================================
        // 1. LIVING WOODLAND WORKSHOP BACKGROUND
        // ============================================================================
        function drawBackground() {
            // Warm timber wall gradient
            const wallGrad = ctx.createLinearGradient(0, 0, 0, VH);
            wallGrad.addColorStop(0, '#3d2314');
            wallGrad.addColorStop(0.65, '#59341e');
            wallGrad.addColorStop(1, '#2b170c');
            ctx.fillStyle = wallGrad;
            ctx.fillRect(0, 0, VW, VH);

            // Vertical wooden wall planks with subtle woodgrain lines
            ctx.strokeStyle = 'rgba(24, 11, 4, 0.35)';
            ctx.lineWidth = 3;
            for (let x = 0; x < VW; x += 120) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, 720);
                ctx.stroke();

                // Wood knot / grain accents
                ctx.fillStyle = 'rgba(255, 200, 140, 0.03)';
                ctx.fillRect(x + 12, 0, 35, 720);
            }

            // --- ARCHED FOREST WINDOW (Left Wall) ---
            const winX = 230, winY = 290, winW = 250, winH = 340;
            ctx.save();
            // Window clipping path
            ctx.beginPath();
            ctx.arc(winX, winY - 40, winW * 0.5, Math.PI, 0, false);
            ctx.lineTo(winX + winW * 0.5, winY + winH * 0.5);
            ctx.lineTo(winX - winW * 0.5, winY + winH * 0.5);
            ctx.closePath();
            ctx.clip();

            // Sunny forest sky
            const skyGrad = ctx.createLinearGradient(winX, winY - 170, winX, winY + 170);
            skyGrad.addColorStop(0, '#72c6ef');
            skyGrad.addColorStop(0.6, '#bce7fd');
            skyGrad.addColorStop(1, '#e8f7be');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(winX - 150, winY - 180, 300, 360);

            // Warm sun glow
            const sunGrad = ctx.createRadialGradient(winX - 35, winY - 85, 8, winX - 35, winY - 85, 110);
            sunGrad.addColorStop(0, '#fffbe0');
            sunGrad.addColorStop(0.4, 'rgba(255, 235, 130, 0.6)');
            sunGrad.addColorStop(1, 'rgba(255, 235, 130, 0)');
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(winX - 35, winY - 85, 110, 0, Math.PI * 2);
            ctx.fill();

            // Distant hills
            ctx.fillStyle = '#68a357';
            ctx.beginPath();
            ctx.arc(winX - 50, winY + 180, 160, Math.PI, 0);
            ctx.arc(winX + 70, winY + 190, 140, Math.PI, 0);
            ctx.fill();

            // Swaying woodland pine trees outside window
            const treeSway = Math.sin(globalTime * 1.4) * 7;
            const drawPine = (tx, ty, scaleT, col) => {
                ctx.fillStyle = col;
                for (let layer = 0; layer < 3; layer++) {
                    const ly = ty - layer * 42 * scaleT;
                    const lw = (68 - layer * 14) * scaleT;
                    ctx.beginPath();
                    ctx.moveTo(tx + treeSway * (layer + 1) * 0.35, ly - 65 * scaleT);
                    ctx.lineTo(tx - lw, ly);
                    ctx.lineTo(tx + lw, ly);
                    ctx.closePath();
                    ctx.fill();
                }
            };
            drawPine(winX - 65, winY + 145, 0.95, '#3b7a3e');
            drawPine(winX + 55, winY + 155, 1.1, '#2b5e2e');
            drawPine(winX + 5, winY + 165, 0.85, '#4c9141');

            // Window mullions (wooden crossbars)
            ctx.strokeStyle = '#3b2010';

        // ============================================================================
        // 2. REALISTIC WOODLAND BEAR TAILOR CHARACTER
        // ============================================================================
        function drawFurTuftCircle(cx, cy, r, numTufts, tuftLen, baseColor, highlightColor) {
            const grad = ctx.createRadialGradient(cx - r * 0.2, cy - r * 0.25, r * 0.1, cx, cy, r * 1.08);
            grad.addColorStop(0, highlightColor);
            grad.addColorStop(0.65, baseColor);
            grad.addColorStop(1, '#3d1e0b');

            ctx.fillStyle = grad;
            ctx.beginPath();
            for (let i = 0; i <= numTufts; i++) {
                const ang = (i / numTufts) * Math.PI * 2;
                const nextAng = ((i + 0.5) / numTufts) * Math.PI * 2;
                const radOuter = r + (i % 2 === 0 ? tuftLen : tuftLen * 0.4);
                const ox = cx + Math.cos(ang) * radOuter;
                const oy = cy + Math.sin(ang) * radOuter;
                const ix = cx + Math.cos(nextAng) * (r - tuftLen * 0.25);
                const iy = cy + Math.sin(nextAng) * (r - tuftLen * 0.25);
                if (i === 0) ctx.moveTo(ox, oy);
                else ctx.quadraticCurveTo(ox, oy, ix, iy);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#2b1306';
            ctx.lineWidth = 3.5;
            ctx.stroke();
        }

            const drawSinglePaw = (px, py, isLeft) => {
                ctx.save();

                drawFurTuftCircle(0, 0, 44, 16, 5, '#733e20', '#96542f');

                ctx.ellipse(0, -3, 18, 13, 0, 0, Math.PI * 2);

                ctx.restore();

            drawSinglePaw(leftPawX, leftPawY, true);
