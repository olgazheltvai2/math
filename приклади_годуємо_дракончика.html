        const fillGrad = ctx.createRadialGradient(cx, cy, fr * 0.1, cx, cy, fr * 0.88);
        fillGrad.addColorStop(0, '#c97636');
        fillGrad.addColorStop(1, '#7a3c16');
        ctx.fillStyle = fillGrad;
        ctx.beginPath();
        ctx.ellipse(cx, cy, fr * 0.88, fry * 0.86, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    /* HUGE, ULTRA-CRISP EQUATION MEDALLION ON THE DISH (Warm Cream/Caramel Glaze + Deep Espresso Text) */
    function drawEquationSocket(ctx, x, y, w, h, expr, isHovered, isSelectedMode, time) {
      ctx.save();
      const pulse = isHovered
        ? (1.08 + Math.sin(time * 9) * 0.025)
        : (isSelectedMode ? 1.025 + Math.sin(time * 5) * 0.02 : 1);
      ctx.translate(x, y);
      ctx.scale(pulse, pulse);

      // Warm golden halo on hover
      if (isHovered || isSelectedMode) {
        const glow = ctx.createRadialGradient(0, 0, h * 0.35, 0, 0, w * 0.74);
        glow.addColorStop(0, isHovered ? 'rgba(255, 232, 128, 0.8)' : 'rgba(255, 224, 134, 0.36)');
        glow.addColorStop(1, 'rgba(255, 224, 134, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.ellipse(0, 0, w * 0.76, h * 0.92, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Soft cast shadow onto the dish
      ctx.fillStyle = 'rgba(34, 14, 4, 0.44)';
      ctx.beginPath();
      ctx.roundRect(-w * 0.5, -h * 0.5 + 4, w, h, h * 0.5);
      ctx.fill();

      // Warm toasted caramel-cream glaze medallion (NO plain white rectangle!)
      const medGrad = ctx.createLinearGradient(0, -h * 0.5, 0, h * 0.5);
      if (isHovered) {
        medGrad.addColorStop(0, '#fff4cf');
        medGrad.addColorStop(0.55, '#f5d48a');
        medGrad.addColorStop(1, '#d9a44e');
      } else {
        medGrad.addColorStop(0, '#fae8c3');
        medGrad.addColorStop(0.58, '#e8c484');
        medGrad.addColorStop(1, '#c99852');
      }
      ctx.fillStyle = medGrad;
      ctx.beginPath();
      ctx.roundRect(-w * 0.5, -h * 0.5, w, h, h * 0.5);
      ctx.fill();

      // Rich embossed caramel-gold rim
      ctx.strokeStyle = isHovered ? '#ffe878' : '#7d4418';
      ctx.lineWidth = isHovered ? 4 : 3.2;
      ctx.stroke();

      // Subtle inner cream sheen
      ctx.strokeStyle = 'rgba(255, 250, 234, 0.62)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.roundRect(-w * 0.46, -h * 0.42, w * 0.92, h * 0.84, h * 0.42);
      ctx.stroke();

      // HUGE, THICK, ULTRA-LEGIBLE EQUATION TEXT (~32px-44px dynamically scaled)
      const baseFont = Math.max(26, Math.min(44, Math.round(h * 0.68)));
      const fontSize = expr.length >= 7 ? Math.round(baseFont * 0.86) : baseFont;
      ctx.font = `900 ${fontSize}px 'Nunito', 'Rubik', 'Trebuchet MS', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Crisp light highlight bevel behind dark espresso text for maximum readability
      ctx.fillStyle = 'rgba(255, 248, 224, 0.78)';
      ctx.fillText(expr, 0, 2.2);
      ctx.fillStyle = '#2A1408';
      ctx.fillText(expr, 0, 0.5);

      ctx.restore();
    }

    /* REALISTIC PAINTERLY EDIBLE TOPPINGS (Chocolate, Cherry, Cookie, Strawberry, Macaron, etc.)
       WITH HUGE 38px-52px BOLD WHITE/CREAM NUMERALS + THICK DARK-CHOCOLATE OUTLINE */
    function drawTopping(ctx, x, y, r, kind, numberVal, opts = {}) {
      const { scale = 1, lifted = false, selected = false, showNumber = true } = opts;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      // Realistic cast shadow
      ctx.fillStyle = lifted ? 'rgba(20, 8, 2, 0.42)' : 'rgba(26, 11, 4, 0.34)';
      ctx.beginPath();
      ctx.ellipse(0, lifted ? r * 0.54 : r * 0.22, r * 0.98, r * 0.66, 0, 0, Math.PI * 2);
      ctx.fill();

      // Golden selection aura
      if (selected) {
        const halo = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 1.42);
        halo.addColorStop(0, 'rgba(255, 234, 128, 0.82)');
        halo.addColorStop(1, 'rgba(255, 234, 128, 0)');
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(0, 0, r * 1.42, 0, Math.PI * 2);
        ctx.fill();
      }

      // --- PAINTERLY REALISTIC FOOD ART ---
      if (kind === 'cherry') {
        // Curved green stem
        ctx.strokeStyle = '#3b7829';
        ctx.lineWidth = r * 0.11;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.52);
        ctx.bezierCurveTo(r * 0.08, -r * 1.05, r * 0.46, -r * 1.15, r * 0.64, -r * 0.92);
        ctx.stroke();

        // Tiny veined green leaf on stem
        ctx.save();
        ctx.translate(r * 0.34, -r * 0.94);
        ctx.rotate(-0.35);
        const leafG = ctx.createLinearGradient(-r * 0.25, 0, r * 0.28, 0);
        leafG.addColorStop(0, '#6ed464');
        leafG.addColorStop(1, '#246b2c');
        ctx.fillStyle = leafG;
        ctx.beginPath();
        ctx.ellipse(r * 0.12, 0, r * 0.28, r * 0.14, 0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Glossy deep crimson cherry body
        const g = ctx.createRadialGradient(-r * 0.3, -r * 0.28, r * 0.08, 0, r * 0.08, r * 0.96);
        g.addColorStop(0, '#ff6e84');
        g.addColorStop(0.35, '#cf132d');
        g.addColorStop(0.8, '#7a0819');
        g.addColorStop(1, '#42030c');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, r * 0.08, r * 0.86, 0, Math.PI * 2);
        ctx.fill();

        // Crisp glossy specular shine
        ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
        ctx.beginPath();
        ctx.ellipse(-r * 0.32, -r * 0.24, r * 0.24, r * 0.13, -0.65, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 220, 226, 0.38)';
        ctx.beginPath();
        ctx.arc(r * 0.34, r * 0.38, r * 0.12, 0, Math.PI * 2);
        ctx.fill();

      } else if (kind === 'chocolate') {
        // Chunky 3D Beveled Dark Chocolate Bar Square
        const s = r * 0.84;
        // Bottom bevel dark edge
        ctx.fillStyle = '#291107';
        ctx.beginPath();
        ctx.roundRect(-s, -s + r * 0.08, s * 2, s * 2, r * 0.22);
        ctx.fill();

        // Main sloped cocoa facets
        const baseG = ctx.createLinearGradient(-s, -s, s, s);
        baseG.addColorStop(0, '#7c4327');
        baseG.addColorStop(0.45, '#522613');
        baseG.addColorStop(1, '#331508');
        ctx.fillStyle = baseG;
        ctx.beginPath();
        ctx.roundRect(-s, -s, s * 2, s * 2, r * 0.22);
        ctx.fill();

        // Top-left sunlit bevel highlight
        ctx.strokeStyle = 'rgba(218, 158, 114, 0.5)';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Raised inner chocolate pillow
        const inner = s * 0.66;
        const inG = ctx.createLinearGradient(-inner, -inner, inner, inner);
        inG.addColorStop(0, '#8f5030');
        inG.addColorStop(0.6, '#5c2c16');
        inG.addColorStop(1, '#3d1a0b');
        ctx.fillStyle = inG;
        ctx.beginPath();
        ctx.roundRect(-inner, -inner, inner * 2, inner * 2, r * 0.14);
        ctx.fill();
        ctx.strokeStyle = 'rgba(28, 10, 4, 0.55)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Diagonal glossy cocoa sheen
        ctx.fillStyle = 'rgba(255, 228, 200, 0.18)';
        ctx.beginPath();
        ctx.moveTo(-inner * 0.8, -inner * 0.85);
        ctx.lineTo(inner * 0.3, -inner * 0.85);
        ctx.lineTo(-inner * 0.8, inner * 0.25);
        ctx.closePath();
        ctx.fill();

      } else if (kind === 'cookie') {
        // Golden Baked Chocolate-Chip Cookie
        ctx.fillStyle = '#9e5d20';
        ctx.beginPath();
        for (let i = 0; i < 16; i++) {
          const a = (i / 16) * Math.PI * 2;
          const rad = r * (0.9 + Math.sin(i * 2.7) * 0.055);
          const px = Math.cos(a) * rad;
          const py = Math.sin(a) * rad + r * 0.06;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();

        const ckG = ctx.createRadialGradient(-r * 0.22, -r * 0.24, r * 0.08, 0, 0, r * 0.96);
        ckG.addColorStop(0, '#f5cc82');
        ckG.addColorStop(0.62, '#d99642');
        ckG.addColorStop(1, '#a6601c');
        ctx.fillStyle = ckG;
        ctx.beginPath();
        for (let i = 0; i < 16; i++) {
          const a = (i / 16) * Math.PI * 2;
          const rad = r * (0.89 + Math.sin(i * 2.7) * 0.055);
          const px = Math.cos(a) * rad;
          const py = Math.sin(a) * rad;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();

        // Melted dark chocolate chips embedded in cookie
        const chips = [
          [-0.42, -0.34, 0.16], [0.38, -0.36, 0.15],
          [-0.48, 0.22, 0.17], [0.44, 0.24, 0.16],
          [0.04, -0.52, 0.13], [-0.08, 0.5, 0.15]
        ];
        chips.forEach(([cx, cy, cr]) => {
          ctx.fillStyle = '#3b1a0c';
          ctx.beginPath();
          ctx.ellipse(cx * r, cy * r, cr * r, cr * r * 0.82, cx, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(255, 224, 198, 0.35)';
          ctx.beginPath();
          ctx.arc((cx - 0.04) * r, (cy - 0.04) * r, cr * r * 0.28, 0, Math.PI * 2);
          ctx.fill();
        });

      } else if (kind === 'strawberry') {
        const g = ctx.createRadialGradient(-r * 0.26, -r * 0.25, r * 0.08, 0, 0, r * 1.05);
        g.addColorStop(0, '#ff6e7c');
        g.addColorStop(0.5, '#d61e36');
        g.addColorStop(1, '#7a0c1b');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(0, r * 0.96);
        ctx.bezierCurveTo(-r * 0.98, r * 0.44, -r * 0.98, -r * 0.65, 0, -r * 0.72);
        ctx.bezierCurveTo(r * 0.98, -r * 0.65, r * 0.98, r * 0.44, 0, r * 0.96);
        ctx.fill();

        // Dimpled golden seeds
        ctx.fillStyle = '#ffe594';
        [[-0.42, -0.16], [0.42, -0.16], [-0.28, 0.36], [0.28, 0.36], [0, 0.62], [-0.52, 0.1], [0.52, 0.1]].forEach(([sx, sy]) => {
          ctx.beginPath();
          ctx.ellipse(sx * r, sy * r, r * 0.05, r * 0.08, 0, 0, Math.PI * 2);
          ctx.fill();
        });

        // Detailed green leafy crown
        ctx.fillStyle = '#2d8a3e';
        for (let k = -2; k <= 2; k++) {
          ctx.beginPath();
          ctx.ellipse(k * r * 0.22, -r * 0.68, r * 0.24, r * 0.13, k * 0.36, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#6ad166';
        ctx.beginPath();
        ctx.ellipse(0, -r * 0.74, r * 0.24, r * 0.11, 0, 0, Math.PI * 2);
        ctx.fill();

      } else if (kind === 'macaron') {
        // French Raspberry-Vanilla Macaron
        // Bottom shell
        const botG = ctx.createLinearGradient(0, r * 0.1, 0, r * 0.75);
        botG.addColorStop(0, '#eb7ca0');
        botG.addColorStop(1, '#b53f69');
        ctx.fillStyle = botG;
        ctx.beginPath();
        ctx.ellipse(0, r * 0.32, r * 0.88, r * 0.42, 0, 0, Math.PI * 2);
        ctx.fill();

        // Creamy vanilla filling
        ctx.fillStyle = '#fff3d6';
        ctx.beginPath();
        ctx.roundRect(-r * 0.86, -r * 0.06, r * 1.72, r * 0.34, r * 0.16);
        ctx.fill();

        // Ruffled pied feet
        ctx.fillStyle = '#d45b85';
        for (let i = -4; i <= 4; i++) {
          ctx.beginPath();
          ctx.arc(i * r * 0.19, -r * 0.04, r * 0.11, 0, Math.PI * 2);
          ctx.fill();
        }

        // Smooth domed top shell
        const topG = ctx.createRadialGradient(-r * 0.25, -r * 0.45, r * 0.08, 0, -r * 0.24, r * 0.95);
        topG.addColorStop(0, '#ffc2d6');
        topG.addColorStop(0.55, '#eb7ca0');
        topG.addColorStop(1, '#bd4671');
        ctx.fillStyle = topG;
        ctx.beginPath();
        ctx.ellipse(0, -r * 0.24, r * 0.9, r * 0.5, 0, Math.PI, 0);
        ctx.quadraticCurveTo(r * 0.9, -r * 0.06, 0, -r * 0.04);
        ctx.quadraticCurveTo(-r * 0.9, -r * 0.06, -r * 0.9, -r * 0.24);
        ctx.fill();

        // Specular sheen on dome
        ctx.fillStyle = 'rgba(255, 255, 255, 0.42)';
        ctx.beginPath();
        ctx.ellipse(-r * 0.28, -r * 0.48, r * 0.28, r * 0.11, -0.25, 0, Math.PI * 2);
        ctx.fill();

      } else if (kind === 'cream_caramel') {
        // Piped Whipped Cream Rosette with Glossy Golden Caramel Drizzle
        const g = ctx.createRadialGradient(-r * 0.2, -r * 0.28, r * 0.08, 0, 0, r);
        g.addColorStop(0, '#fffdf7');
        g.addColorStop(0.65, '#f2e3c9');
        g.addColorStop(1, '#cbb28c');
        ctx.fillStyle = g;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          ctx.arc(Math.cos(a) * r * 0.4, Math.sin(a) * r * 0.36, r * 0.48, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.fillStyle = '#fffaf0';
        ctx.beginPath();
        ctx.arc(0, -r * 0.14, r * 0.44, 0, Math.PI * 2);
        ctx.fill();

        // Glossy caramel drizzle spiral
        ctx.strokeStyle = '#c46c18';
        ctx.lineWidth = r * 0.13;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.55, 0.2, Math.PI * 1.65);
        ctx.stroke();
        ctx.strokeStyle = '#f5b042';
        ctx.lineWidth = r * 0.05;
        ctx.beginPath();
        ctx.arc(-r * 0.03, -r * 0.03, r * 0.55, 0.3, Math.PI * 1.55);
        ctx.stroke();

      } else if (kind === 'biscuit') {
        // Crisp Scalloped Honey Butter Biscuit
        const bg = ctx.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.1, 0, 0, r * 1.02);
        bg.addColorStop(0, '#fae09e');
        bg.addColorStop(0.65, '#d99a44');
        bg.addColorStop(1, '#9c5f1a');
        ctx.fillStyle = bg;
        ctx.beginPath();
        const teeth = 16;
        for (let i = 0; i <= teeth * 2; i++) {
          const a = (i / (teeth * 2)) * Math.PI * 2;
          const rad = r * (i % 2 === 0 ? 0.96 : 0.84);
          const px = Math.cos(a) * rad;
          const py = Math.sin(a) * rad;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();

        // Inner baked rim & docking holes
        ctx.strokeStyle = 'rgba(130, 68, 16, 0.42)';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.68, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(122, 62, 14, 0.52)';
        for (let k = 0; k < 8; k++) {
          const a = (k / 8) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * r * 0.52, Math.sin(a) * r * 0.52, r * 0.05, 0, Math.PI * 2);
          ctx.fill();
        }

      } else if (kind === 'orange_slice') {
        // Candied Translucent Orange Slice
        ctx.fillStyle = '#e06b12';
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.92, 0, Math.PI * 2);
        ctx.fill();

        // Cream pith
        ctx.fillStyle = '#fff0cc';
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.8, 0, Math.PI * 2);
        ctx.fill();

        // 8 juicy translucent segments
        for (let i = 0; i < 8; i++) {
          const a1 = (i / 8) * Math.PI * 2 + 0.08;
          const a2 = ((i + 1) / 8) * Math.PI * 2 - 0.08;
          const sg = ctx.createRadialGradient(0, 0, r * 0.08, 0, 0, r * 0.75);
          sg.addColorStop(0, '#ffd466');
          sg.addColorStop(1, '#f07b16');
          ctx.fillStyle = sg;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, r * 0.74, a1, a2);
          ctx.closePath();
          ctx.fill();
        }
        // Glossy sugar glaze shine
        ctx.fillStyle = 'rgba(255, 255, 240, 0.34)';
        ctx.beginPath();
        ctx.ellipse(-r * 0.25, -r * 0.3, r * 0.36, r * 0.16, -0.5, 0, Math.PI * 2);
        ctx.fill();

      } else if (kind === 'pepperoni') {
        // Crispy Marbled Pepperoni Slice with Curled Golden Rim
        const pg = ctx.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.1, 0, 0, r * 0.92);
        pg.addColorStop(0, '#d9452b');
        pg.addColorStop(0.76, '#a32414');
        pg.addColorStop(1, '#5e1209');
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#6e190c';
        ctx.lineWidth = r * 0.09;
        ctx.stroke();

        // Marbled spice & fat flecks
        ctx.fillStyle = 'rgba(255, 212, 174, 0.55)';
        [[-0.36, -0.24, 0.11], [0.38, -0.28, 0.09], [-0.4, 0.32, 0.1], [0.34, 0.34, 0.12], [0.05, -0.52, 0.08]].forEach(([fx, fy, fr]) => {
          ctx.beginPath();
          ctx.arc(fx * r, fy * r, fr * r, 0, Math.PI * 2);
          ctx.fill();
        });

      } else if (kind === 'mushroom') {
        // Sliced Cremini Mushroom (cap, dark gills, pale stem)
        ctx.fillStyle = '#e8d7bc';
        ctx.beginPath();
        ctx.roundRect(-r * 0.28, -r * 0.04, r * 0.56, r * 0.84, r * 0.18);
        ctx.fill();
        // Dark brown gills underneath cap
        ctx.fillStyle = '#5c3c28';
        ctx.beginPath();
        ctx.ellipse(0, r * 0.02, r * 0.82, r * 0.24, 0, 0, Math.PI);
        ctx.fill();
        // Shaded cremini cap
        const mg = ctx.createRadialGradient(-r * 0.24, -r * 0.35, r * 0.08, 0, -r * 0.1, r * 0.92);
        mg.addColorStop(0, '#dec2a2');
        mg.addColorStop(0.55, '#a67b56');
        mg.addColorStop(1, '#634128');
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.arc(0, r * 0.04, r * 0.88, Math.PI, 0);
        ctx.closePath();
        ctx.fill();

      } else if (kind === 'cherry_tomato') {
        // Glossy Cherry Tomato Half
        const tg = ctx.createRadialGradient(-r * 0.22, -r * 0.22, r * 0.08, 0, 0, r * 0.92);
        tg.addColorStop(0, '#ff7256');
        tg.addColorStop(0.6, '#d92b1a');
        tg.addColorStop(1, '#85130a');
        ctx.fillStyle = tg;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.88, 0, Math.PI * 2);
        ctx.fill();
        // Inner juicy chambers & seeds
        ctx.fillStyle = 'rgba(255, 200, 148, 0.45)';
        ctx.beginPath();
        ctx.ellipse(-r * 0.28, 0, r * 0.22, r * 0.38, -0.15, 0, Math.PI * 2);
        ctx.ellipse(r * 0.28, 0, r * 0.22, r * 0.38, 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffe99c';
        [[-0.3, -0.18], [-0.28, 0.18], [0.3, -0.18], [0.28, 0.18]].forEach(([sx, sy]) => {
          ctx.beginPath();
          ctx.ellipse(sx * r, sy * r, r * 0.05, r * 0.08, 0, 0, Math.PI * 2);
          ctx.fill();
        });

      } else if (kind === 'mozzarella_basil') {
        // Fresh Basil Leaf behind creamy Mozzarella Ball
        ctx.save();
        ctx.rotate(-0.45);
        const bg = ctx.createLinearGradient(-r * 0.8, -r * 0.6, r * 0.8, r * 0.4);
        bg.addColorStop(0, '#6ed464');
        bg.addColorStop(1, '#1e6e2e');
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.ellipse(r * 0.28, -r * 0.34, r * 0.66, r * 0.38, 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const mz = ctx.createRadialGradient(-r * 0.25, -r * 0.25, r * 0.08, 0, r * 0.08, r * 0.84);
        mz.addColorStop(0, '#fffef7');
        mz.addColorStop(0.65, '#f2e8cf');
        mz.addColorStop(1, '#cfc09b');
        ctx.fillStyle = mz;
        ctx.beginPath();
        ctx.ellipse(0, r * 0.08, r * 0.8, r * 0.72, 0, 0, Math.PI * 2);
        ctx.fill();

      } else if (kind === 'cheese_wedge') {
        // Aged Golden Swiss Cheese Wedge
        // Front vertical face
        ctx.fillStyle = '#d99824';
        ctx.beginPath();
        ctx.moveTo(-r * 0.86, r * 0.06);
        ctx.lineTo(r * 0.86, r * 0.26);
        ctx.lineTo(r * 0.86, r * 0.64);
        ctx.lineTo(-r * 0.86, r * 0.44);
        ctx.closePath();
        ctx.fill();

        // Top creamy golden triangle
        const cg = ctx.createLinearGradient(-r * 0.8, -r * 0.7, r * 0.8, r * 0.4);
        cg.addColorStop(0, '#fff29e');
        cg.addColorStop(0.65, '#f2c144');
        cg.addColorStop(1, '#d6941e');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.moveTo(-r * 0.86, r * 0.06);
        ctx.lineTo(r * 0.22, -r * 0.78);
        ctx.lineTo(r * 0.86, r * 0.26);
        ctx.closePath();
        ctx.fill();

        // Swiss holes
        ctx.fillStyle = '#bd7b14';
        [[-0.22, -0.18, 0.14], [0.28, -0.14, 0.12], [0.1, 0.34, 0.11], [-0.44, 0.22, 0.09]].forEach(([hx, hy, hr]) => {
          ctx.beginPath();
          ctx.arc(hx * r, hy * r, hr * r, 0, Math.PI * 2);
          ctx.fill();
        });

      } else {
        // Glossy Black Olive Ring
        const og = ctx.createRadialGradient(-r * 0.28, -r * 0.28, r * 0.1, 0, 0, r * 0.88);
        og.addColorStop(0, '#5a4e66');
        og.addColorStop(0.45, '#261e2e');
        og.addColorStop(1, '#100c14');
        ctx.fillStyle = og;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.86, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#472512';
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.34, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.36)';
        ctx.beginPath();
        ctx.ellipse(-r * 0.34, -r * 0.36, r * 0.22, r * 0.1, -0.7, 0, Math.PI * 2);
        ctx.fill();
      }

      // --- HUGE, UNMISTAKABLE BOLD ANSWER NUMERAL (38px-52px + THICK DARK-CHOCOLATE OUTLINE) ---
      if (showNumber) {
        const numText = String(numberVal);
        const baseSize = Math.max(36, Math.min(54, Math.round(r * 1.12)));
        const fontSize = numText.length >= 3 ? Math.round(baseSize * 0.78) : baseSize;
        ctx.font = `900 ${fontSize}px 'Nunito', 'Rubik', 'Trebuchet MS', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.save();
        ctx.shadowColor = 'rgba(18, 6, 2, 0.65)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 3;

        // Thick dark-chocolate outline
        ctx.lineJoin = 'round';
        ctx.lineWidth = Math.max(7, Math.round(fontSize * 0.18));
        ctx.strokeStyle = '#241005';
        ctx.strokeText(numText, 0, 2);

        // Crisp bright cream-white fill
        ctx.fillStyle = '#FFFDF5';
        ctx.fillText(numText, 0, 2);
        ctx.restore();
      }

      ctx.restore();
    }

    /* Hand-Carved Rustic Oak Serving Board on the Right */
    function drawWoodenTray(ctx, layout) {
      const { trayX, trayY, trayW, trayH } = layout;
      ctx.save();

      ctx.fillStyle = 'rgba(20, 8, 2, 0.45)';
      ctx.beginPath();
      ctx.roundRect(trayX - trayW * 0.5 + 5, trayY - trayH * 0.5 + 11, trayW, trayH, trayH * 0.18);
      ctx.fill();

      const woodGrad = ctx.createLinearGradient(trayX - trayW * 0.5, trayY - trayH * 0.5, trayX + trayW * 0.5, trayY + trayH * 0.5);
      woodGrad.addColorStop(0, '#b57840');
      woodGrad.addColorStop(0.45, '#8c5324');
      woodGrad.addColorStop(1, '#5e3313');
      ctx.fillStyle = woodGrad;
      ctx.beginPath();
      ctx.roundRect(trayX - trayW * 0.5, trayY - trayH * 0.5, trayW, trayH, trayH * 0.16);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 224, 168, 0.42)';
      ctx.lineWidth = 3;
      ctx.stroke();

      const pad = Math.min(trayW, trayH) * 0.065;
      const innerGrad = ctx.createRadialGradient(trayX, trayY - trayH * 0.1, trayW * 0.05, trayX, trayY, trayW * 0.62);
      innerGrad.addColorStop(0, '#78441d');
      innerGrad.addColorStop(1, '#4f290e');
      ctx.fillStyle = innerGrad;
      ctx.beginPath();
      ctx.roundRect(trayX - trayW * 0.5 + pad, trayY - trayH * 0.5 + pad, trayW - pad * 2, trayH - pad * 2, trayH * 0.12);
      ctx.fill();

      ctx.strokeStyle = 'rgba(26, 10, 4, 0.45)';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.save();
      ctx.clip();
      ctx.strokeStyle = 'rgba(255, 210, 150, 0.07)';
      ctx.lineWidth = 2;
      for (let i = -3; i <= 3; i++) {
        const y = trayY + i * (trayH * 0.14);
        ctx.beginPath();
        ctx.moveTo(trayX - trayW * 0.5, y);
        ctx.bezierCurveTo(trayX - trayW * 0.15, y + 6, trayX + trayW * 0.15, y - 6, trayX + trayW * 0.5, y);
        ctx.stroke();
      }
      ctx.restore();
      ctx.restore();
    }

    /* =========================================================================
       7. MAIN GAME ENGINE & INTERACTION CONTROLLER
       ========================================================================= */
    class DragonGourmetGame {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.sound = new SoundEngine();
        this.particles = new ParticleSystem();
        this.dragon = new DragonCharacter();

        // Exact customizable settings (step 1!)
        this.settings = {
          min: 0,
          max: 10,
          op: '±',
          count: 4
        };

        this.state = 'INTRO_SLIDE';
        this.stateTime = 0;
        this.dishIndex = -1;
        this.currentDish = DISH_TYPES[0];
        this.plateSlide = 1;
        this.bitesTaken = 0;
        this.eatStage = 0;
        this.shimmerProgress = -1;

        this.sockets = [];
        this.toppings = [];

        this.pointer = { x: 0, y: 0, down: false };
        this.dragging = null;
        this.dragOffsetX = 0;
        this.dragOffsetY = 0;
        this.dragMoved = false;
        this.selectedTopping = null;
        this.hoveredSocket = null;
        this.lastTrailTime = 0;

        this.layout = {};
        this.lastTime = 0;

        this._bindUI();
        this._bindCanvasEvents();
        this.resize();
        this.startNewRound(true);
      }

      resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const W = window.innerWidth;
        const H = window.innerHeight;
        this.canvas.width = Math.round(W * dpr);
        this.canvas.height = Math.round(H * dpr);
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const isCompact = W < 860;
        const tableY = H * 0.48;
        const plateR = Math.min(W * (isCompact ? 0.25 : 0.205), H * 0.32);
        const plateX = isCompact ? W * 0.34 : W * 0.37;
        const plateY = tableY + (H - tableY) * 0.51;

        const dragonX = isCompact ? plateX : plateX - plateR * 0.12;
        const dragonY = tableY - plateR * 0.14;
        const dragonS = Math.min(W * 0.135, H * 0.23);

        const trayW = isCompact ? W * 0.34 : Math.min(W * 0.32, H * 0.58);
        const trayH = Math.min(H * 0.46, Math.max(220, H - tableY - 32));
        const trayX = isCompact ? W * 0.79 : W * 0.79;
        const trayY = tableY + (H - tableY) * 0.50;

        const toppingR = Math.max(32, Math.min(54, trayW * 0.16, trayH * 0.21, plateR * 0.24));

        this.layout = {
          W, H, tableY,
          plateX, plateY, plateR,
          dragonX, dragonY, dragonS,
          trayX, trayY, trayW, trayH,
          toppingR
        };

        this._repositionEntities();
      }

      _repositionEntities() {
        const { plateX, plateY, plateR, trayX, trayY, trayW, trayH } = this.layout;
        const n = this.sockets.length;

        // Generously separated socket layouts for 2, 3, 4, or 5 equations — ZERO overlap!
        let offsets;
        if (n <= 2) {
          offsets = [
            { dx: -0.36, dy: 0 },
            { dx: 0.36, dy: 0 }
          ];
        } else if (n === 3) {
          offsets = [
            { dx: 0, dy: -0.34 },
            { dx: -0.37, dy: 0.25 },
            { dx: 0.37, dy: 0.25 }
          ];
        } else if (n === 4) {
          offsets = [
            { dx: -0.37, dy: -0.27 },
            { dx: 0.37, dy: -0.27 },
            { dx: -0.37, dy: 0.28 },
            { dx: 0.37, dy: 0.28 }
          ];
        } else {
          // 5 spacious spots: 2 top, 1 center, 2 bottom
          offsets = [
            { dx: -0.39, dy: -0.35 },
            { dx: 0.39, dy: -0.35 },
            { dx: 0, dy: 0.01 },
            { dx: -0.39, dy: 0.36 },
            { dx: 0.39, dy: 0.36 }
          ];
        }

        const sockW = Math.max(94, Math.min(168, plateR * (n === 5 ? 0.64 : 0.72)));
        const sockH = Math.max(50, Math.min(72, plateR * (n === 5 ? 0.28 : 0.32)));

        this.sockets.forEach((s, i) => {
          const off = offsets[i] || { dx: 0, dy: 0 };
          s.relX = off.dx * plateR;
          s.relY = off.dy * plateR * 0.84;
          s.x = plateX + s.relX;
          s.y = plateY + s.relY;
          s.w = sockW;
          s.h = sockH;
        });

        // Spacious layout on the carved oak serving board for 2..5 huge toppings
        const m = this.toppings.length;
        const innerW = trayW * 0.76;
        const innerH = trayH * 0.70;

        this.toppings.forEach((t, i) => {
          let rx = 0, ry = 0;
          if (m <= 3) {
            if (i === 0) { rx = -0.28; ry = -0.25; }
            else if (i === 1) { rx = 0.28; ry = -0.25; }
            else { rx = 0; ry = 0.28; }
          } else if (m === 4) {
            const col = i % 2;
            const row = Math.floor(i / 2);
            rx = col === 0 ? -0.28 : 0.28;
            ry = row === 0 ? -0.26 : 0.26;
          } else {
            // 5 toppings: 3 on top row, 2 centered on bottom row
            if (i < 3) {
              rx = (i - 1) * 0.38;
              ry = -0.26;
            } else {
              rx = (i === 3 ? -0.22 : 0.22);
              ry = 0.27;
            }
          }
          t.homeX = trayX + rx * innerW;
          t.homeY = trayY + ry * innerH;
          t.r = this.layout.toppingR * (m === 5 ? 0.92 : 1.0);
          if (!t.placed && this.dragging !== t) {
            t.x = t.homeX;
            t.y = t.homeY;
          }
        });
      }

      startNewRound(immediate = false) {
        let nextIdx = Math.floor(Math.random() * DISH_TYPES.length);
        if (nextIdx === this.dishIndex) {
          nextIdx = (nextIdx + 1) % DISH_TYPES.length;
        }
        this.dishIndex = nextIdx;
        this.currentDish = DISH_TYPES[nextIdx];

        const problems = generateRoundProblems(
          this.settings.min,
          this.settings.max,
          this.settings.op,
          this.settings.count
        );

        this.sockets = problems.map((p, i) => ({
          id: i,
          expr: p.expr,
          answer: p.answer,
          solved: false,
          toppingKind: null,
          popScale: 1,
          x: 0, y: 0, relX: 0, relY: 0, w: 120, h: 58
        }));

        // Exact matching toppings (shuffled) so tray is clean and every topping & numeral is HUGE
        const shuffledAnswers = problems.map(p => p.answer);
        for (let i = shuffledAnswers.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffledAnswers[i], shuffledAnswers[j]] = [shuffledAnswers[j], shuffledAnswers[i]];
        }

        const kinds = [...this.currentDish.toppings];
        for (let i = kinds.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [kinds[i], kinds[j]] = [kinds[j], kinds[i]];
        }

        this.toppings = shuffledAnswers.map((val, i) => ({
          id: i,
          value: val,
          kind: kinds[i % kinds.length],
          x: 0, y: 0, homeX: 0, homeY: 0,
          vx: 0, vy: 0,
          r: 42,
          placed: false,
          returning: false,
          scale: 1
        }));

        this.dragging = null;
        this.selectedTopping = null;
        this.hoveredSocket = null;
        this.bitesTaken = 0;
        this.eatStage = 0;
        this.shimmerProgress = -1;
        this.dragon.lean = 0;
        this.dragon.jawOpen = 0;
        this.dragon.chewAmt = 0;
        this.dragon.setMood('idle');

        this._repositionEntities();

        if (immediate) {
          this.state = 'PLAYING';
          this.plateSlide = 0;
        } else {
          this.state = 'INTRO_SLIDE';
          this.stateTime = 0;
          this.plateSlide = 1;
          this.sound.playPlateSlide();
        }
      }

      _bindUI() {
        const btnNext = document.getElementById('btnNext');
        const btnSettings = document.getElementById('btnSettings');
        const btnSound = document.getElementById('btnSound');
        const panel = document.getElementById('settingsPanel');
        const iconOn = document.getElementById('iconSoundOn');
        const iconOff = document.getElementById('iconSoundOff');

        const minDisp = document.getElementById('minValDisplay');
        const maxDisp = document.getElementById('maxValDisplay');
        const minSlider = document.getElementById('minSlider');
        const maxSlider = document.getElementById('maxSlider');

        const refreshSettingsUI = () => {
          minDisp.textContent = this.settings.min;
          maxDisp.textContent = this.settings.max;
          minSlider.value = this.settings.min;
          maxSlider.value = this.settings.max;
          document.querySelectorAll('.op-btn').forEach(btn => {
            btn.classList.toggle('selected', btn.dataset.op === this.settings.op);
          });
          document.querySelectorAll('.count-btn').forEach(btn => {
            btn.classList.toggle('selected', Number(btn.dataset.count) === this.settings.count);
          });
        };

        const applyBounds = (newMin, newMax, triggerRound = true) => {
          let mn = Math.max(0, Math.min(90, Math.round(newMin)));
          let mx = Math.max(2, Math.min(100, Math.round(newMax)));
          if (mx < mn + 2) {
            if (mn !== this.settings.min) {
              mx = Math.min(100, mn + 2);
              if (mx - mn < 2) mn = mx - 2;
            } else {
              mn = Math.max(0, mx - 2);
              if (mx - mn < 2) mx = mn + 2;
            }
          }
          this.settings.min = mn;
          this.settings.max = mx;
          refreshSettingsUI();
          if (triggerRound) this.startNewRound(false);
        };

        btnNext.addEventListener('click', () => {
          this.sound.unlock();
          this.sound.playPickup();
          this.startNewRound(false);
        });

        btnSettings.addEventListener('click', (e) => {
          e.stopPropagation();
          this.sound.unlock();
          this.sound.playPickup();
          const hidden = panel.classList.toggle('hidden');
          btnSettings.classList.toggle('active', !hidden);
        });

        btnSound.addEventListener('click', () => {
          const muted = this.sound.toggleMute();
          iconOn.style.display = muted ? 'none' : 'block';
          iconOff.style.display = muted ? 'block' : 'none';
          if (!muted) this.sound.playPickup();
        });

        this.canvas.addEventListener('pointerdown', () => {
          if (!panel.classList.contains('hidden')) {
            panel.classList.add('hidden');
            btnSettings.classList.remove('active');
          }
        });

        // Exact step-1 stepper buttons
        document.getElementById('minDec').addEventListener('click', () => {
          this.sound.unlock(); this.sound.playPickup();
          applyBounds(this.settings.min - 1, this.settings.max, true);
        });
        document.getElementById('minInc').addEventListener('click', () => {
          this.sound.unlock(); this.sound.playPickup();
          applyBounds(this.settings.min + 1, this.settings.max, true);
        });
        document.getElementById('maxDec').addEventListener('click', () => {
          this.sound.unlock(); this.sound.playPickup();
          applyBounds(this.settings.min, this.settings.max - 1, true);
        });
        document.getElementById('maxInc').addEventListener('click', () => {
          this.sound.unlock(); this.sound.playPickup();
          applyBounds(this.settings.min, this.settings.max + 1, true);
        });

        // Smooth step-1 sliders (live preview on input, regenerate round on change)
        minSlider.addEventListener('input', () => {
          applyBounds(Number(minSlider.value), this.settings.max, false);
        });
        minSlider.addEventListener('change', () => {
          this.sound.unlock(); this.sound.playPickup();
          this.startNewRound(false);
        });

        maxSlider.addEventListener('input', () => {
          applyBounds(this.settings.min, Number(maxSlider.value), false);
        });
        maxSlider.addEventListener('change', () => {
          this.sound.unlock(); this.sound.playPickup();
          this.startNewRound(false);
        });

        // Operation buttons
        document.querySelectorAll('.op-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            this.sound.unlock();
            this.sound.playPickup();
            this.settings.op = btn.dataset.op;
            refreshSettingsUI();
            this.startNewRound(false);
          });
        });

        // Dish topping count buttons (3, 4, 5)
        document.querySelectorAll('.count-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            this.sound.unlock();
            this.sound.playPickup();
            this.settings.count = Number(btn.dataset.count);
            refreshSettingsUI();
            this.startNewRound(false);
          });
        });

        refreshSettingsUI();
      }

      _getPointerPos(e) {
        const rect = this.canvas.getBoundingClientRect();
        return {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        };
      }

      _findToppingAt(x, y) {
        for (let i = this.toppings.length - 1; i >= 0; i--) {
          const t = this.toppings[i];
          if (t.placed) continue;
          if (Math.hypot(x - t.x, y - t.y) <= t.r * 1.2) return t;
        }
        return null;
      }

      _findSocketAt(x, y, pad = 18) {
        let best = null;
        let bestDist = Infinity;
        for (const s of this.sockets) {
          if (s.solved) continue;
          const dx = Math.abs(x - s.x);
          const dy = Math.abs(y - s.y);
          if (dx <= s.w * 0.56 + pad && dy <= s.h * 0.6 + pad) {
            const d = Math.hypot(x - s.x, y - s.y);
            if (d < bestDist) {
              best = s;
              bestDist = d;
            }
          }
        }
        return best;
      }

      _bindCanvasEvents() {
        window.addEventListener('resize', () => this.resize());

        this.canvas.addEventListener('pointerdown', (e) => {
          this.sound.unlock();
          const pos = this._getPointerPos(e);
          this.pointer.x = pos.x;
          this.pointer.y = pos.y;
          this.pointer.down = true;

          if (this.state !== 'PLAYING') return;

          const hitTopping = this._findToppingAt(pos.x, pos.y);
          if (hitTopping) {
            this.dragging = hitTopping;
            this.dragging.returning = false;
            this.dragOffsetX = pos.x - hitTopping.x;
            this.dragOffsetY = pos.y - hitTopping.y;
            this.dragMoved = false;
            this.sound.playPickup();
            this.canvas.style.cursor = 'grabbing';
            if (e.target.setPointerCapture) {
              try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
            }
            return;
          }

          if (this.selectedTopping) {
            const hitSocket = this._findSocketAt(pos.x, pos.y, 24);
            if (hitSocket) {
              this._attemptMatch(this.selectedTopping, hitSocket);
              this.selectedTopping = null;
            } else {
              this.selectedTopping = null;
            }
          }
        });

        this.canvas.addEventListener('pointermove', (e) => {
          const pos = this._getPointerPos(e);
          this.pointer.x = pos.x;
          this.pointer.y = pos.y;

          if (this.state !== 'PLAYING') {
            this.canvas.style.cursor = 'default';
            return;
          }

          if (this.dragging) {
            const nx = pos.x - this.dragOffsetX;
            const ny = pos.y - this.dragOffsetY;
            if (Math.hypot(nx - this.dragging.x, ny - this.dragging.y) > 4) {
              this.dragMoved = true;
            }
            this.dragging.x = nx;
            this.dragging.y = ny;

            const now = performance.now();
            if (now - this.lastTrailTime > 36) {
              this.particles.spawnTrail(nx, ny);
              this.lastTrailTime = now;
            }

            const nearSock = this._findSocketAt(nx, ny, 24);
            if (nearSock && nearSock !== this.hoveredSocket) {
              this.sound.playHoverTick();
            }
            this.hoveredSocket = nearSock;

            const distToPlate = Math.hypot(nx - this.layout.plateX, ny - this.layout.plateY);
            if (distToPlate < this.layout.plateR * 1.45) {
              this.dragon.setMood('anticipation');
            } else if (this.dragon.mood === 'anticipation') {
              this.dragon.setMood('idle');
            }
          } else {
            const overTopping = this._findToppingAt(pos.x, pos.y);
            const overSocket = this.selectedTopping ? this._findSocketAt(pos.x, pos.y, 22) : null;
            this.hoveredSocket = overSocket;
            this.canvas.style.cursor = (overTopping || overSocket) ? 'pointer' : 'default';
          }
        });

        const endDrag = () => {
          this.pointer.down = false;
          if (!this.dragging) return;

          const item = this.dragging;
          this.dragging = null;
          this.canvas.style.cursor = 'default';

          if (!this.dragMoved) {
            this.selectedTopping = (this.selectedTopping === item) ? null : item;
            item.returning = true;
            if (this.dragon.mood === 'anticipation') this.dragon.setMood('idle');
            return;
          }

          const targetSock = this._findSocketAt(item.x, item.y, 28);
          this.hoveredSocket = null;

          if (targetSock) {
            this.selectedTopping = null;
            this._attemptMatch(item, targetSock);
          } else {
            item.returning = true;
            if (this.dragon.mood === 'anticipation') this.dragon.setMood('idle');
          }
        };

        this.canvas.addEventListener('pointerup', endDrag);
        this.canvas.addEventListener('pointercancel', endDrag);
      }

      _attemptMatch(topping, socket) {
        if (topping.value === socket.answer) {
          socket.solved = true;
          socket.toppingKind = topping.kind;
          socket.popScale = 1.45;
          topping.placed = true;
          topping.x = socket.x;
          topping.y = socket.y;

          const solvedCount = this.sockets.filter(s => s.solved).length;
          this.sound.playCorrect(solvedCount - 1);
          this.particles.spawnSparkles(socket.x, socket.y, 28);
          this.dragon.setMood('happy', 1.15);

          if (solvedCount === this.sockets.length) {
            this.state = 'CELEBRATING';
            this.stateTime = 0;
            this.shimmerProgress = 0;
            this.sound.playFanfare();
            this.particles.spawnSparkles(this.layout.plateX, this.layout.plateY, 44);
          }
        } else {
          topping.returning = true;
          const dx = topping.homeX - topping.x;
          const dy = topping.homeY - topping.y;
          topping.vx = dx * 2.2 + (Math.random() - 0.5) * 140;
          topping.vy = dy * 2.2 - 120;
          this.sound.playWrong();
          this.particles.spawnDustPuff(socket.x, socket.y);
          this.dragon.setMood('puzzled', 1.15);
          this.dragon.puffConfusedSmoke(this.layout, this.particles);
        }
      }

      update(dt, time) {
        this.particles.update(dt);
        this.dragon.update(dt, time, this.pointer, this.layout, this.particles);

        for (const s of this.sockets) {
          if (s.popScale > 1) {
            s.popScale += (1 - s.popScale) * Math.min(1, dt * 10);
          }
        }

        for (const t of this.toppings) {
          if (t.placed) continue;
          const targetScale = (this.dragging === t) ? 1.15 : (this.selectedTopping === t ? 1.11 : 1.0);
          t.scale += (targetScale - t.scale) * Math.min(1, dt * 14);

          if (t.returning && this.dragging !== t) {
            const k = 155;
            const damp = 14;
            t.vx += ((t.homeX - t.x) * k - t.vx * damp) * dt;
            t.vy += ((t.homeY - t.y) * k - t.vy * damp) * dt;
            t.x += t.vx * dt;
            t.y += t.vy * dt;
            if (Math.hypot(t.homeX - t.x, t.homeY - t.y) < 1.2 && Math.hypot(t.vx, t.vy) < 8) {
              t.x = t.homeX;
              t.y = t.homeY;
              t.vx = 0;
              t.vy = 0;
              t.returning = false;
            }
          }
        }

        this.stateTime += dt;

        if (this.state === 'INTRO_SLIDE') {
          this.plateSlide += (0 - this.plateSlide) * Math.min(1, dt * 7.5);
          if (Math.abs(this.plateSlide) < 0.008) {
            this.plateSlide = 0;
            this.state = 'PLAYING';
          }
        } else if (this.state === 'CELEBRATING') {
          this.shimmerProgress = Math.min(1.4, this.stateTime * 1.45);
          if (this.stateTime > 0.95) {
            this.state = 'EATING';
            this.stateTime = 0;
            this.eatStage = 0;
            this.bitesTaken = 0;
            this.dragon.setMood('eating');
          }
        } else if (this.state === 'EATING') {
          const cycleDur = 0.68;
          const totalEatDur = cycleDur * 4;

          if (this.stateTime < totalEatDur) {
            const biteIdx = Math.floor(this.stateTime / cycleDur);
            const localT = (this.stateTime % cycleDur) / cycleDur;

            this.dragon.lean += (1 - this.dragon.lean) * Math.min(1, dt * 8);

            if (localT < 0.34) {
              this.dragon.jawOpen = Math.sin((localT / 0.34) * Math.PI * 0.5);
              this.dragon.chewAmt = 0;
            } else if (localT < 0.52) {
              this.dragon.jawOpen = Math.max(0, 1 - (localT - 0.34) / 0.18);
              if (this.bitesTaken <= biteIdx) {
                this.bitesTaken = biteIdx + 1;
                this.sound.playChomp(biteIdx);
                this.particles.spawnCrumbs(
                  this.layout.plateX + (Math.random() - 0.5) * this.layout.plateR * 0.6,
                  this.layout.plateY + (Math.random() - 0.5) * this.layout.plateR * 0.35,
                  this.currentDish.crumbColors
                );
              }
            } else {
              this.dragon.jawOpen = 0;
              this.dragon.chewAmt = 1;
              this.dragon.chewPhase += dt * 24;
            }
          } else {
            const afterT = this.stateTime - totalEatDur;
            this.dragon.lean += (0 - this.dragon.lean) * Math.min(1, dt * 6);
            this.dragon.jawOpen = 0;
            this.dragon.chewAmt += (0 - this.dragon.chewAmt) * Math.min(1, dt * 8);

            if (this.eatStage === 0) {
              this.eatStage = 1;
              this.dragon.setMood('satisfied', 1.4);
              this.sound.playHappyPurr();
              const hx = this.layout.dragonX;
              const hy = this.layout.dragonY - this.layout.dragonS * 0.78;
              for (let k = 0; k < 6; k++) {
                this.particles.spawnHeartEmber(hx + (k - 2.5) * 18, hy);
              }
            }

            if (afterT > 1.3) {
              this.state = 'OUTRO_SLIDE';
              this.stateTime = 0;
              this.sound.playPlateSlide();
            }
          }
        } else if (this.state === 'OUTRO_SLIDE') {
          this.plateSlide -= dt * 2.5;
          if (this.plateSlide <= -1.15) {
            this.startNewRound(false);
          }
        }
      }

      draw(time) {
        const ctx = this.ctx;
        const { W, H, plateX, plateY, plateR } = this.layout;

        drawLivingBackground(ctx, W, H, time, this.layout, this.particles.clouds);
        this.particles.drawPollen(ctx, W, H, time);

        const dragonLeaningOverFood = (this.state === 'EATING' && this.dragon.lean > 0.35);
        if (!dragonLeaningOverFood) {
          this.dragon.drawBodyAndHead(ctx, this.layout, time);
        }

        this.dragon.drawFrontPaws(ctx, this.layout, time);

        drawWoodenTray(ctx, this.layout);

        const slideOffsetX = this.plateSlide * (W * 0.72);
        const curPlateX = plateX + slideOffsetX;

        drawOrnatePlate(ctx, curPlateX, plateY, plateR, this.currentDish);
        drawDishFood(ctx, curPlateX, plateY, plateR, this.currentDish.id, this.bitesTaken);

        // Equation medallions & placed realistic toppings
        for (let i = 0; i < this.sockets.length; i++) {
          const s = this.sockets[i];
          const sx = curPlateX + s.relX;
          const sy = plateY + s.relY;
          s.x = sx;
          s.y = sy;

          if (!s.solved) {
            const isHovered = this.hoveredSocket === s;
            const isSelMode = Boolean(this.selectedTopping || this.dragging);
            drawEquationSocket(ctx, sx, sy, s.w, s.h, s.expr, isHovered, isSelMode, time);
          } else {
            const eatenThreshold = Math.floor(((i + 1) / this.sockets.length) * 4);
            const eatenCheck = this.bitesTaken >= Math.max(1, eatenThreshold);
            if (!eatenCheck) {
              drawTopping(ctx, sx, sy, this.layout.toppingR * 0.88, s.toppingKind, s.answer, {
                scale: s.popScale,
                lifted: false,
                showNumber: false
              });
            }
          }
        }

        // Golden shimmer sweep on dish completion
        if (this.state === 'CELEBRATING' && this.shimmerProgress >= 0 && this.shimmerProgress <= 1.2) {
          ctx.save();
          ctx.beginPath();
          ctx.ellipse(curPlateX, plateY, plateR * 0.85, plateR * 0.72, 0, 0, Math.PI * 2);
          ctx.clip();
          const sweepX = curPlateX - plateR + this.shimmerProgress * plateR * 2.2;
          const shGrad = ctx.createLinearGradient(sweepX - plateR * 0.35, plateY - plateR, sweepX + plateR * 0.35, plateY + plateR);
          shGrad.addColorStop(0, 'rgba(255, 245, 190, 0)');
          shGrad.addColorStop(0.5, 'rgba(255, 245, 190, 0.58)');
          shGrad.addColorStop(1, 'rgba(255, 245, 190, 0)');
          ctx.fillStyle = shGrad;
          ctx.fillRect(curPlateX - plateR, plateY - plateR, plateR * 2, plateR * 2);
          ctx.restore();
        }

        if (dragonLeaningOverFood) {
          this.dragon.drawBodyAndHead(ctx, this.layout, time);
        }

        // Unplaced toppings on the oak serving board
        for (const t of this.toppings) {
          if (t.placed || t === this.dragging) continue;
          const hoverBounce = (this.selectedTopping === t) ? Math.sin(time * 8) * 3 : 0;
          drawTopping(ctx, t.x, t.y + hoverBounce, t.r, t.kind, t.value, {
            scale: t.scale,
            lifted: this.selectedTopping === t,
            selected: this.selectedTopping === t,
            showNumber: true
          });
        }

        if (this.dragging) {
          const t = this.dragging;
          drawTopping(ctx, t.x, t.y, t.r, t.kind, t.value, {
            scale: t.scale,
            lifted: true,
            selected: true,
            showNumber: true
          });
        }

        this.particles.drawParticles(ctx);
      }

      loop(now) {
        const dt = Math.min(0.05, (now - (this.lastTime || now)) / 1000);
        this.lastTime = now;
        const time = now * 0.001;

        this.update(dt, time);
        this.draw(time);

        requestAnimationFrame((t) => this.loop(t));
      }
    }

    window.onload = function () {
      const game = new DragonGourmetGame();
      requestAnimationFrame((t) => game.loop(t));
    };
  })();
  </script>
