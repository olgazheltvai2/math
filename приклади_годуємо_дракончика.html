<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dragon Gourmet Math</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Rubik:wght@800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #24150c;
      font-family: 'Nunito', 'Rubik', 'Trebuchet MS', sans-serif;
      touch-action: none;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: default;
    }

    /* Top-Right Carved-Oak & Brass Icon Controls */
    .hud-controls {
      position: fixed;
      top: 16px;
      right: 18px;
      display: flex;
      gap: 12px;
      z-index: 20;
      align-items: center;
    }

    .icon-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid #d8a256;
      background: radial-gradient(circle at 30% 25%, #9f6430, #5e3415 68%, #3a1e0a);
      box-shadow:
        0 7px 18px rgba(18, 8, 2, 0.55),
        inset 0 2px 6px rgba(255, 232, 180, 0.45),
        inset 0 -4px 7px rgba(24, 10, 2, 0.65);
      color: #fff3d6;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.16s ease, filter 0.16s ease;
      outline: none;
      padding: 0;
    }

    .icon-btn:hover {
      transform: translateY(-2px) scale(1.07);
      filter: brightness(1.1);
      box-shadow:
        0 10px 22px rgba(18, 8, 2, 0.6),
        0 0 16px rgba(255, 206, 110, 0.4),
        inset 0 2px 6px rgba(255, 240, 200, 0.65);
    }

    .icon-btn:active {
      transform: translateY(1px) scale(0.94);
    }

    .icon-btn.active {
      border-color: #ffe28c;
      box-shadow:
        0 0 20px rgba(255, 204, 92, 0.6),
        inset 0 2px 6px rgba(255, 240, 200, 0.7);
    }

    .icon-btn svg {
      width: 27px;
      height: 27px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 1px 2px rgba(32, 14, 4, 0.7));
    }

    /* Carved Oak Wood & Brass Rivets Settings Panel (Zero white rectangles) */
    .settings-panel {
      position: fixed;
      top: 84px;
      right: 18px;
      width: 332px;
      padding: 20px 18px 20px;
      border-radius: 26px;
      border: 3.5px solid #c99248;
      background:
        radial-gradient(circle at 18% 12%, rgba(162, 104, 52, 0.97), rgba(110, 64, 28, 0.98) 52%, rgba(68, 37, 14, 0.99));
      box-shadow:
        0 20px 44px rgba(14, 6, 2, 0.68),
        inset 0 2px 10px rgba(255, 224, 166, 0.32),
        inset 0 -6px 16px rgba(28, 12, 4, 0.65);
      z-index: 25;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transform-origin: top right;
      transition: opacity 0.22s ease, transform 0.24s cubic-bezier(0.34, 1.4, 0.64, 1), visibility 0.22s ease;
    }

    .settings-panel.hidden {
      opacity: 0;
      transform: scale(0.84) translateY(-10px);
      visibility: hidden;
      pointer-events: none;
    }

    /* Decorative Brass Corner Rivets */
    .rivet {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff0b8, #c48832 65%, #6e4210);
      box-shadow: 0 1px 3px rgba(20, 8, 2, 0.7);
      pointer-events: none;
    }
    .rivet.tl { top: 10px; left: 10px; }
    .rivet.tr { top: 10px; right: 10px; }
    .rivet.bl { bottom: 10px; left: 10px; }
    .rivet.br { bottom: 10px; right: 10px; }

    /* Recessed Dark Parchment / Oak Groove Rows */
    .setting-card {
      padding: 11px 13px 12px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(46, 24, 10, 0.56), rgba(34, 16, 6, 0.68));
      border: 1.5px solid rgba(226, 178, 104, 0.28);
      box-shadow:
        inset 0 3px 8px rgba(14, 6, 2, 0.55),
        0 1px 0 rgba(255, 220, 158, 0.22);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .stepper-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tag-badge {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      color: #f3ce88;
      background: rgba(112, 66, 28, 0.45);
      border: 1.5px solid rgba(235, 186, 108, 0.38);
      padding: 4px 10px;
      border-radius: 12px;
      min-width: 54px;
      text-align: center;
      text-shadow: 0 1px 2px rgba(20, 8, 2, 0.8);
    }

    .stepper-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #e6b362;
      background: radial-gradient(circle at 32% 28%, #b37034, #633614);
      color: #fff6de;
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(18, 8, 2, 0.5), inset 0 1px 3px rgba(255, 236, 194, 0.45);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .step-btn:hover {
      filter: brightness(1.14);
      transform: scale(1.07);
    }

    .step-btn:active {
      transform: scale(0.92);
    }

    .num-pill {
      min-width: 58px;
      height: 40px;
      padding: 0 10px;
      border-radius: 14px;
      background: linear-gradient(180deg, #ecd09c, #d4ab68);
      border: 2px solid #7d4a1b;
      color: #2b1306;
      font-size: 24px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 5px rgba(72, 36, 10, 0.35), 0 2px 4px rgba(16, 6, 2, 0.4);
    }

    /* Custom Warm Brass Range Sliders (Step 1) */
    .wood-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #42220c, #6e3d18);
      border: 1px solid rgba(235, 186, 108, 0.35);
      box-shadow: inset 0 2px 4px rgba(12, 5, 1, 0.7);
      outline: none;
      cursor: pointer;
    }

    .wood-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fff1bf, #e0a342 60%, #8f5714);
      border: 2.5px solid #4a2408;
      box-shadow: 0 3px 8px rgba(14, 6, 2, 0.65);
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .wood-slider::-webkit-slider-thumb:hover {
      transform: scale(1.14);
    }

    .wood-slider::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fff1bf, #e0a342 60%, #8f5714);
      border: 2.5px solid #4a2408;
      box-shadow: 0 3px 8px rgba(14, 6, 2, 0.65);
      cursor: pointer;
    }

    /* Operation & Count Toggle Button Rows */
    .toggle-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .choice-btn {
      flex: 1;
      height: 46px;
      border-radius: 16px;
      border: 2px solid rgba(226, 178, 108, 0.42);
      background: linear-gradient(180deg, rgba(132, 82, 38, 0.72), rgba(78, 44, 18, 0.85));
      color: #f4dcb0;
      font-family: inherit;
      font-size: 26px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(18, 8, 2, 0.42), inset 0 1px 3px rgba(255, 232, 184, 0.25);
      transition: all 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .choice-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .choice-btn.selected {
      background: radial-gradient(circle at 35% 25%, #3eb572, #1f7446 75%, #134d2e);
      border-color: #ffe394;
      color: #fff9e6;
      box-shadow:
        0 5px 12px rgba(12, 48, 26, 0.55),
        0 0 14px rgba(84, 212, 134, 0.36),
        inset 0 2px 4px rgba(206, 255, 224, 0.45);
      transform: scale(1.04);
    }

    @media (max-width: 640px) {
      .hud-controls {
        top: 10px;
        right: 10px;
        gap: 8px;
      }
      .icon-btn {
        width: 46px;
        height: 46px;
      }
      .icon-btn svg {
        width: 22px;
        height: 22px;
      }
      .settings-panel {
        top: 66px;
        right: 10px;
        width: 296px;
        padding: 16px 14px;
      }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Minimalist Icon-Only Carved-Wood HUD -->
  <div class="hud-controls">
    <button id="btnNext" class="icon-btn" aria-label="Next">
      <svg viewBox="0 0 24 24">
        <path d="M5 12h14"></path>
        <path d="M13 6l6 6-6 6"></path>
      </svg>
    </button>
    <button id="btnSettings" class="icon-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3.2"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    <button id="btnSound" class="icon-btn" aria-label="Sound">
      <svg id="iconSoundOn" viewBox="0 0 24 24">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="rgba(255,243,214,0.22)"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <svg id="iconSoundOff" viewBox="0 0 24 24" style="display:none;">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="rgba(255,243,214,0.16)"></polygon>
        <line x1="22" y1="9" x2="16" y2="15"></line>
        <line x1="16" y1="9" x2="22" y2="15"></line>
      </svg>
    </button>
  </div>

  <!-- Carved Oak Settings Popover: Exact Step-1 Bounds, Operations, Dish Topping Count -->
  <div id="settingsPanel" class="settings-panel hidden">
    <span class="rivet tl"></span>
    <span class="rivet tr"></span>
    <span class="rivet bl"></span>
    <span class="rivet br"></span>

    <!-- MIN bound (0..90, step 1) -->
    <div class="setting-card">
      <div class="stepper-header">
        <span class="tag-badge">min</span>
        <div class="stepper-controls">
          <button class="step-btn" id="minDec">−</button>
          <div class="num-pill" id="minValDisplay">0</div>
          <button class="step-btn" id="minInc">+</button>
        </div>
      </div>
      <input type="range" id="minSlider" class="wood-slider" min="0" max="90" step="1" value="0" />
    </div>

    <!-- MAX bound (2..100, step 1) -->
    <div class="setting-card">
      <div class="stepper-header">
        <span class="tag-badge">max</span>
        <div class="stepper-controls">
          <button class="step-btn" id="maxDec">−</button>
          <div class="num-pill" id="maxValDisplay">10</div>
          <button class="step-btn" id="maxInc">+</button>
        </div>
      </div>
      <input type="range" id="maxSlider" class="wood-slider" min="2" max="100" step="1" value="10" />
    </div>

    <!-- Operations: +  −  ± -->
    <div class="toggle-row">
      <button class="choice-btn op-btn" data-op="+">+</button>
      <button class="choice-btn op-btn" data-op="-">−</button>
      <button class="choice-btn op-btn selected" data-op="±">±</button>
    </div>

    <!-- Toppings per dish: 3  4  5 -->
    <div class="toggle-row">
      <button class="choice-btn count-btn" data-count="3">3</button>
      <button class="choice-btn count-btn selected" data-count="4">4</button>
      <button class="choice-btn count-btn" data-count="5">5</button>
    </div>
  </div>

  <script>
  (() => {
    'use strict';

    /* =========================================================================
       1. WEB AUDIO API SYNTHESIZED SOUND ENGINE (Zero external audio files)
       ========================================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.noiseBuffer = null;
      }

      unlock() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          this.ctx = new AudioCtx();
          this._buildNoiseBuffer();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      _buildNoiseBuffer() {
        if (!this.ctx) return;
        const length = this.ctx.sampleRate * 1.0;
        const buffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        this.noiseBuffer = buffer;
      }

      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }

      playPickup() {
        if (this.muted) return;
        this.unlock();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(680, now + 0.08);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.17, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }

      playHoverTick() {
        if (this.muted) return;
        this.unlock();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(820, now);
        osc.frequency.exponentialRampToValueAtTime(1080, now + 0.04);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.055, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }

      playCorrect(stepIndex) {
        if (this.muted) return;
        this.unlock();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const chords = [
          [523.25, 659.25, 783.99],
          [587.33, 739.99, 880.00],
          [659.25, 830.61, 987.77],
          [783.99, 987.77, 1174.66],
          [880.00, 1108.73, 1318.51, 1760.00]
        ];
        const chord = chords[Math.min(stepIndex, chords.length - 1)];
        chord.forEach((freq, idx) => {
          const t = now + idx * 0.055;
          const osc = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc2.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          osc2.frequency.setValueAtTime(freq * 2, t);

          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.14, t + 0.018);
          gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.48);

          const subGain = this.ctx.createGain();
          subGain.gain.value = 0.26;

          osc.connect(gain);
          osc2.connect(subGain);
          subGain.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(t);
          osc2.start(t);
          osc.stop(t + 0.5);
          osc2.stop(t + 0.5);
        });
      }

      playWrong() {
        if (this.muted) return;
        this.unlock();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // Soft comedic muted woodblock + boing
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(520, now);

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(205, now);
        osc.frequency.exponentialRampToValueAtTime(118, now + 0.13);
        osc.frequency.exponentialRampToValueAtTime(152, now + 0.22);
        osc.frequency.exponentialRampToValueAtTime(96, now + 0.34);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.15, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.38);

        // Playful confused dragon puff chirp
        const chirp = this.ctx.createOscillator();
        const cGain = this.ctx.createGain();
        chirp.type = 'sine';
        chirp.frequency.setValueAtTime(360, now + 0.09);
        chirp.frequency.exponentialRampToValueAtTime(490, now + 0.21);
        cGain.gain.setValueAtTime(0.001, now + 0.09);
        cGain.gain.linearRampToValueAtTime(0.075, now + 0.13);
        cGain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        chirp.connect(cGain);
        cGain.connect(this.ctx.destination);
        chirp.start(now + 0.09);
        chirp.stop(now + 0.27);
      }

      playFanfare() {
        if (this.muted) return;
        this.unlock();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
        notes.forEach((freq, i) => {
          const t = now + i * 0.065;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.14, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.56);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.6);
        });
      }

      playChomp(biteIdx) {
        if (this.muted) return;
        this.unlock();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const thump = this.ctx.createOscillator();
        const tGain = this.ctx.createGain();
        thump.type = 'sine';
        thump.frequency.setValueAtTime(165 - biteIdx * 8, now);
        thump.frequency.exponentialRampToValueAtTime(48, now + 0.13);
        tGain.gain.setValueAtTime(0.25, now);
        tGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        thump.connect(tGain);
        tGain.connect(this.ctx.destination);
        thump.start(now);
        thump.stop(now + 0.16);

        if (this.noiseBuffer) {
          [0, 0.07, 0.15].forEach((offset, k) => {
            const src = this.ctx.createBufferSource();
            src.buffer = this.noiseBuffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1050 + k * 440 + Math.random() * 250, now + offset);
            filter.Q.value = 1.5;
            const nGain = this.ctx.createGain();
            nGain.gain.setValueAtTime(0.001, now + offset);
            nGain.gain.linearRampToValueAtTime(k === 0 ? 0.25 : 0.15, now + offset + 0.015);
            nGain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.095);
            src.connect(filter);
            filter.connect(nGain);
            nGain.connect(this.ctx.destination);
            src.start(now + offset);
            src.stop(now + offset + 0.11);
          });
        }
      }

      playHappyPurr() {
        if (this.muted) return;
        this.unlock();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(145, now);
        osc.frequency.linearRampToValueAtTime(200, now + 0.45);
        lfo.frequency.value = 26;
        lfoGain.gain.value = 28;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.13, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.54);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        lfo.start(now);
        osc.stop(now + 0.56);
        lfo.stop(now + 0.56);

        [880, 1108.73, 1318.5].forEach((f, idx) => {
          const t = now + 0.1 + idx * 0.08;
          const bell = this.ctx.createOscillator();
          const bGain = this.ctx.createGain();
          bell.type = 'sine';
          bell.frequency.setValueAtTime(f, t);
          bGain.gain.setValueAtTime(0.001, t);
          bGain.gain.linearRampToValueAtTime(0.09, t + 0.015);
          bGain.gain.exponentialRampToValueAtTime(0.001, t + 0.44);
          bell.connect(bGain);
          bGain.connect(this.ctx.destination);
          bell.start(t);
          bell.stop(t + 0.46);
        });
      }

      playPlateSlide() {
        if (this.muted) return;
        this.unlock();
        if (!this.ctx || !this.noiseBuffer) return;
        const now = this.ctx.currentTime;
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(420, now);
        filter.frequency.exponentialRampToValueAtTime(920, now + 0.25);
        filter.Q.value = 2.2;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.075, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        src.start(now);
        src.stop(now + 0.3);
      }
    }

    /* =========================================================================
       2. EXACT-RANGE MATH PROBLEM GENERATOR (Strictly Distinct Answers)
       ========================================================================= */
    function generateRoundProblems(minVal, maxVal, opMode, desiredCount) {
      const safeMin = Math.max(0, Math.min(90, Math.round(minVal)));
      const safeMax = Math.max(safeMin + 2, Math.min(100, Math.round(maxVal)));

      // Available distinct integer answers inside [safeMin, safeMax]
      const span = safeMax - safeMin + 1;
      const targetCount = Math.max(2, Math.min(desiredCount, span));

      // Build shuffled pool of candidate answers inside [safeMin, safeMax]
      const pool = [];
      for (let n = safeMin; n <= safeMax; n++) pool.push(n);
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }

      const problems = [];
      const usedAnswers = new Set();

      // Helper to build a valid equation for a given answer
      const makeProblemFor = (ans, preferredOp) => {
        let op = preferredOp;
        if (op === '-' && ans === safeMax) {
          if (opMode === '±') op = '+';
        }
        if (op === '+' && ans === 0) {
          if (opMode === '±' && safeMax > 0) op = '-';
        }

        if (op === '+') {
          let a, b;
          if (ans === 0) {
            a = 0; b = 0;
          } else if (ans === 1) {
            a = Math.random() < 0.5 ? 1 : 0;
            b = ans - a;
          } else {
            a = 1 + Math.floor(Math.random() * (ans - 1));
            b = ans - a;
          }
          return { expr: `${a} + ${b}`, answer: ans };
        } else {
          // Subtraction: a - b = ans, with a <= safeMax
          const maxB = safeMax - ans;
          if (maxB <= 0) {
            return { expr: `${ans} − 0`, answer: ans };
          }
          const b = 1 + Math.floor(Math.random() * maxB);
          const a = ans + b;
          return { expr: `${a} − ${b}`, answer: ans };
        }
      };

      // First pass: prefer non-trivial subtraction (ans < safeMax) when opMode === '-'
      for (let i = 0; i < pool.length && problems.length < targetCount; i++) {
        const ans = pool[i];
        if (opMode === '-' && ans === safeMax && pool.length > targetCount) {
          continue;
        }
        let op = opMode;
        if (opMode === '±') {
          op = (problems.length % 2 === 0) ? '+' : '-';
          if (Math.random() < 0.35) op = op === '+' ? '-' : '+';
        }
        usedAnswers.add(ans);
        problems.push(makeProblemFor(ans, op));
      }

      // Second pass safety fill if narrow range needed safeMax
      for (let i = 0; i < pool.length && problems.length < targetCount; i++) {
        const ans = pool[i];
        if (usedAnswers.has(ans)) continue;
        usedAnswers.add(ans);
        problems.push(makeProblemFor(ans, opMode === '±' ? '+' : opMode));
      }

      return problems;
    }

    /* =========================================================================
       3. PARTICLE & ATMOSPHERE SYSTEM
       ========================================================================= */
    class ParticleSystem {
      constructor() {
        this.particles = [];
        this.pollen = [];
        this.clouds = [];
        this._initAtmosphere();
      }

      _initAtmosphere() {
        this.pollen = [];
        for (let i = 0; i < 36; i++) {
          this.pollen.push({
            x: Math.random(),
            y: Math.random() * 0.72,
            r: 1.5 + Math.random() * 2.8,
            vx: 0.004 + Math.random() * 0.008,
            vy: -0.002 + Math.random() * 0.005,
            phase: Math.random() * Math.PI * 2,
            alpha: 0.25 + Math.random() * 0.55
          });
        }
        this.clouds = [
          { x: 0.15, y: 0.18, s: 1.0, speed: 0.008 },
          { x: 0.62, y: 0.26, s: 0.78, speed: 0.006 },
          { x: 0.88, y: 0.14, s: 0.9, speed: 0.007 }
        ];
      }

      spawnSparkles(x, y, count = 24, colors = ['#ffe98a', '#ffae42', '#fff7d6', '#72f2a8', '#ff7b89']) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 75 + Math.random() * 225;
          this.particles.push({
            type: 'sparkle',
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 45,
            size: 4 + Math.random() * 7.5,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 0,
            maxLife: 0.55 + Math.random() * 0.45,
            rot: Math.random() * Math.PI,
            vRot: (Math.random() - 0.5) * 8
          });
        }
      }

      spawnTrail(x, y) {
        this.particles.push({
          type: 'sparkle',
          x: x + (Math.random() - 0.5) * 18,
          y: y + (Math.random() - 0.5) * 18,
          vx: (Math.random() - 0.5) * 32,
          vy: -16 - Math.random() * 24,
          size: 3 + Math.random() * 4.5,
          color: Math.random() < 0.5 ? '#ffe78f' : '#fff6d8',
          life: 0,
          maxLife: 0.34 + Math.random() * 0.2,
          rot: Math.random() * Math.PI,
          vRot: 4
        });
      }

      spawnDustPuff(x, y) {
        for (let i = 0; i < 12; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 35 + Math.random() * 95;
          this.particles.push({
            type: 'puff',
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 18,
            size: 7 + Math.random() * 11,
            color: '#f3e3c6',
            life: 0,
            maxLife: 0.42 + Math.random() * 0.25
          });
        }
      }

      spawnCrumbs(x, y, colors) {
        for (let i = 0; i < 24; i++) {
          const angle = -Math.PI * 0.15 - Math.random() * Math.PI * 0.7;
          const speed = 95 + Math.random() * 240;
          this.particles.push({
            type: 'crumb',
            x: x + (Math.random() - 0.5) * 34,
            y: y + (Math.random() - 0.5) * 24,
            vx: Math.cos(angle) * speed + (Math.random() - 0.5) * 130,
            vy: Math.sin(angle) * speed - 70,
            size: 4 + Math.random() * 7,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 0,
            maxLife: 0.58 + Math.random() * 0.4,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 12
          });
        }
      }

      spawnSmokeWisp(x, y, golden = false, gray = false) {
        this.particles.push({
          type: 'smoke',
          x, y,
          vx: (Math.random() - 0.5) * 18,
          vy: -30 - Math.random() * 22,
          size: golden ? 6.5 : (gray ? 7.5 : 4.5),
          color: golden ? '#ffd670' : (gray ? '#b8b0a4' : '#f2e8d5'),
          life: 0,
          maxLife: golden ? 1.15 : 0.95
        });
      }

      spawnHeartEmber(x, y) {
        this.particles.push({
          type: 'heart',
          x, y,
          vx: (Math.random() - 0.5) * 28,
          vy: -58 - Math.random() * 35,
          size: 10 + Math.random() * 8,
          color: Math.random() < 0.5 ? '#ff9d5c' : '#ffd86b',
          life: 0,
          maxLife: 1.3 + Math.random() * 0.45,
          phase: Math.random() * Math.PI * 2
        });
      }

      update(dt) {
        for (const p of this.pollen) {
          p.x += p.vx * dt;
          p.y += (p.vy + Math.sin(performance.now() * 0.0012 + p.phase) * 0.004) * dt;
          if (p.x > 1.04) p.x = -0.04;
          if (p.y < -0.04) p.y = 0.72;
          if (p.y > 0.74) p.y = 0.0;
        }
        for (const c of this.clouds) {
          c.x += c.speed * dt;
          if (c.x > 1.25) c.x = -0.25;
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.life += dt;
          if (p.life >= p.maxLife) {
            this.particles.splice(i, 1);
            continue;
          }
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.type === 'crumb') {
            p.vy += 580 * dt;
            p.rot += p.vRot * dt;
          } else if (p.type === 'sparkle') {
            p.vx *= 0.94;
            p.vy = p.vy * 0.94 + 120 * dt;
            p.rot += p.vRot * dt;
          } else if (p.type === 'puff') {
            p.vx *= 0.9;
            p.vy *= 0.9;
            p.size += 18 * dt;
          } else if (p.type === 'smoke') {
            p.x += Math.sin(p.life * 6) * 14 * dt;
            p.size += 15 * dt;
          } else if (p.type === 'heart') {
            p.x += Math.sin(p.life * 5 + p.phase) * 26 * dt;
            p.size += 5 * dt;
          }
        }
      }

      drawPollen(ctx, W, H, time) {
        ctx.save();
        for (const p of this.pollen) {
          const px = p.x * W;
          const py = p.y * H;
          const pulse = 0.65 + 0.35 * Math.sin(time * 2.1 + p.phase);
          const g = ctx.createRadialGradient(px, py, 0, px, py, p.r * 2.6);
          g.addColorStop(0, `rgba(255, 246, 198, ${p.alpha * pulse})`);
          g.addColorStop(0.45, `rgba(255, 214, 122, ${p.alpha * pulse * 0.45})`);
          g.addColorStop(1, 'rgba(255, 214, 122, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(px, py, p.r * 2.6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      drawParticles(ctx) {
        ctx.save();
        for (const p of this.particles) {
          const t = p.life / p.maxLife;
          const alpha = Math.max(0, 1 - t);
          ctx.save();
          ctx.globalAlpha = alpha;
          if (p.type === 'sparkle') {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            const s = p.size * (1 - t * 0.45);
            ctx.beginPath();
            for (let k = 0; k < 4; k++) {
              const a = (k * Math.PI) / 2;
              ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s);
              ctx.lineTo(Math.cos(a + Math.PI / 4) * s * 0.28, Math.sin(a + Math.PI / 4) * s * 0.28);
            }
            ctx.closePath();
            ctx.fill();
          } else if (p.type === 'crumb') {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.roundRect(-p.size * 0.5, -p.size * 0.38, p.size, p.size * 0.76, p.size * 0.28);
            ctx.fill();
          } else if (p.type === 'puff') {
            const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
            g.addColorStop(0, `rgba(248, 236, 214, ${alpha * 0.65})`);
            g.addColorStop(1, 'rgba(248, 236, 214, 0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.type === 'smoke') {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = Math.max(1.4, 3.6 * (1 - t));
            ctx.globalAlpha = alpha * 0.62;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.stroke();
          } else if (p.type === 'heart') {
            ctx.translate(p.x, p.y);
            const s = p.size * 0.085;
            ctx.scale(s, s);
            ctx.strokeStyle = p.color;
            ctx.fillStyle = 'rgba(255, 218, 128, 0.28)';
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            ctx.moveTo(0, 4);
            ctx.bezierCurveTo(-12, -6, -12, -16, 0, -8);
            ctx.bezierCurveTo(12, -16, 12, -6, 0, 4);
            ctx.fill();
            ctx.stroke();
          }
          ctx.restore();
        }
        ctx.restore();
      }
    }

    /* =========================================================================
       4. LIVING STORYBOOK FOREST-KITCHEN BACKGROUND & TABLE RENDERER
       ========================================================================= */
    function drawLivingBackground(ctx, W, H, time, layout, clouds) {
      const tableY = layout.tableY;

      // 1. Warm timber cottage interior wall
      const wallGrad = ctx.createLinearGradient(0, 0, 0, tableY);
      wallGrad.addColorStop(0, '#52331d');
      wallGrad.addColorStop(0.55, '#6b4426');
      wallGrad.addColorStop(1, '#442915');
      ctx.fillStyle = wallGrad;
      ctx.fillRect(0, 0, W, tableY + 6);

      // Vertical rustic wood wall planks
      ctx.save();
      const plankW = Math.max(56, W / 18);
      for (let x = 0; x < W; x += plankW) {
        ctx.fillStyle = (Math.floor(x / plankW) % 2 === 0) ? 'rgba(255, 212, 150, 0.038)' : 'rgba(20, 8, 2, 0.055)';
        ctx.fillRect(x, 0, plankW, tableY);
        ctx.strokeStyle = 'rgba(30, 14, 6, 0.3)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, tableY);
        ctx.stroke();
      }
      ctx.restore();

      // 2. Arched Wooden Cottage Window overlooking sunlit forest & drifting clouds
      const winW = Math.min(W * 0.48, H * 0.86);
      const winH = tableY * 0.90;
      const winX = W * 0.39 - winW * 0.5;
      const winY = Math.max(14, tableY - winH - 6);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(winX, winY + winH);
      ctx.lineTo(winX, winY + winW * 0.28);
      ctx.quadraticCurveTo(winX, winY, winX + winW * 0.5, winY);
      ctx.quadraticCurveTo(winX + winW, winY, winX + winW, winY + winW * 0.28);
      ctx.lineTo(winX + winW, winY + winH);
      ctx.closePath();
      ctx.save();
      ctx.clip();

      // Sunlit sky gradient
      const skyGrad = ctx.createLinearGradient(winX, winY, winX + winW * 0.25, winY + winH);
      skyGrad.addColorStop(0, '#fff2bf');
      skyGrad.addColorStop(0.35, '#d6f0bc');
      skyGrad.addColorStop(0.75, '#8bc879');
      skyGrad.addColorStop(1, '#4a8546');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(winX, winY, winW, winH);

      // Soft sun disc
      const sunX = winX + winW * 0.22;
      const sunY = winY + winH * 0.24;
      const sunGlow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, winW * 0.42);
      sunGlow.addColorStop(0, 'rgba(255, 252, 224, 0.95)');
      sunGlow.addColorStop(0.32, 'rgba(255, 236, 158, 0.55)');
      sunGlow.addColorStop(1, 'rgba(255, 236, 158, 0)');
      ctx.fillStyle = sunGlow;
      ctx.fillRect(winX, winY, winW, winH);

      // Drifting soft clouds
      ctx.fillStyle = 'rgba(255, 252, 240, 0.62)';
      for (const cl of clouds) {
        const cx = winX + cl.x * winW;
        const cy = winY + cl.y * winH;
        const cs = 22 * cl.s;
        ctx.beginPath();
        ctx.arc(cx, cy, cs, 0, Math.PI * 2);
        ctx.arc(cx + cs * 0.9, cy + cs * 0.15, cs * 0.78, 0, Math.PI * 2);
        ctx.arc(cx - cs * 0.85, cy + cs * 0.2, cs * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }

      // Distant misty forest hills
      ctx.fillStyle = '#6da662';
      ctx.beginPath();
      ctx.moveTo(winX, winY + winH);
      for (let t = 0; t <= 1; t += 0.05) {
        const hx = winX + t * winW;
        const hy = winY + winH * 0.68 - Math.sin(t * Math.PI * 2.2 + 0.4) * winH * 0.1;
        ctx.lineTo(hx, hy);
      }
      ctx.lineTo(winX + winW, winY + winH);
      ctx.closePath();
      ctx.fill();

      // Animated swaying layered forest trees
      const trees = [
        { rx: 0.14, scale: 0.92, col1: '#3f7b3c', col2: '#5ca14c', phase: 0.2 },
        { rx: 0.35, scale: 0.76, col1: '#4d8a44', col2: '#71b65a', phase: 1.5 },
        { rx: 0.64, scale: 0.86, col1: '#3a7239', col2: '#5b9d4c', phase: 2.7 },
        { rx: 0.85, scale: 1.0, col1: '#2f6132', col2: '#4d8d45', phase: 0.9 }
      ];
      for (const tr of trees) {
        const tx = winX + winW * tr.rx;
        const ty = winY + winH;
        const sway = Math.sin(time * 1.15 + tr.phase) * 7 * tr.scale;
        const h = winH * 0.64 * tr.scale;

        ctx.strokeStyle = '#573b24';
        ctx.lineWidth = 10 * tr.scale;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.quadraticCurveTo(tx + sway * 0.4, ty - h * 0.5, tx + sway, ty - h * 0.8);
        ctx.stroke();

        const puffs = [
          { dx: 0, dy: -h * 0.88, r: 42 * tr.scale, c: tr.col1 },
          { dx: -25 * tr.scale, dy: -h * 0.72, r: 32 * tr.scale, c: tr.col1 },
          { dx: 25 * tr.scale, dy: -h * 0.70, r: 34 * tr.scale, c: tr.col1 },
          { dx: -10 * tr.scale, dy: -h * 0.92, r: 26 * tr.scale, c: tr.col2 },
          { dx: 14 * tr.scale, dy: -h * 0.82, r: 24 * tr.scale, c: tr.col2 }
        ];
        for (const pf of puffs) {
          ctx.fillStyle = pf.c;
          ctx.beginPath();
          ctx.arc(tx + sway + pf.dx, ty + pf.dy, pf.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Foreground swaying foliage at sill
      for (let i = 0; i < 9; i++) {
        const fx = winX + (i / 8) * winW;
        const fy = winY + winH + 6;
        const sw = Math.sin(time * 1.6 + i) * 5;
        ctx.fillStyle = i % 2 === 0 ? '#2b592c' : '#3a7138';
        ctx.beginPath();
        ctx.arc(fx + sw, fy - 12, 24 + (i % 3) * 8, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore(); // end window clip

      // Window mullions & carved wooden arch frame
      ctx.strokeStyle = '#4e2f18';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(winX + winW * 0.5, winY + 4);
      ctx.lineTo(winX + winW * 0.5, winY + winH);
      ctx.moveTo(winX + 4, winY + winH * 0.54);
      ctx.lineTo(winX + winW - 4, winY + winH * 0.54);
      ctx.stroke();

      ctx.strokeStyle = '#6c4222';
      ctx.lineWidth = 16;
      ctx.stroke();
      ctx.strokeStyle = '#9c6739';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();

      // 3. Cozy Kitchen Shelf with Hanging Copper Pots & Dried Herbs (Right wall)
      if (W > 700) {
        const rackX = winX + winW + (W - (winX + winW)) * 0.16;
        const rackW = Math.min(260, (W - rackX) * 0.78);
        const rackY = tableY * 0.34;

        ctx.save();
        // Rustic wooden shelf board
        ctx.fillStyle = '#3c210e';
        ctx.beginPath();
        ctx.roundRect(rackX, rackY, rackW, 13, 5);
        ctx.fill();
        ctx.fillStyle = '#7c4c26';
        ctx.beginPath();
        ctx.roundRect(rackX, rackY - 3, rackW, 9, 4);
        ctx.fill();

        // Iron hanging rail
        ctx.strokeStyle = '#2b2019';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(rackX + 12, rackY + 22);
        ctx.lineTo(rackX + rackW - 12, rackY + 22);
        ctx.stroke();

        // Hanging copper pan
        const panX = rackX + rackW * 0.3;
        const panY = rackY + 22;
        const panSway = Math.sin(time * 0.9) * 0.03;
        ctx.save();
        ctx.translate(panX, panY);
        ctx.rotate(panSway);
        ctx.strokeStyle = '#332216';
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, 32);
        ctx.stroke();
        const copGrad = ctx.createRadialGradient(-8, 48, 4, 0, 54, 28);
        copGrad.addColorStop(0, '#ffd4a3');
        copGrad.addColorStop(0.5, '#c96f36');
        copGrad.addColorStop(1, '#6e3214');
        ctx.fillStyle = copGrad;
        ctx.beginPath();
        ctx.arc(0, 54, 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#4f220c';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        // Hanging dried herb bundle
        const herbX = rackX + rackW * 0.68;
        ctx.save();
        ctx.translate(herbX, panY);
        ctx.rotate(-panSway * 1.2);
        ctx.strokeStyle = '#9c6e3b';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, 18);
        ctx.stroke();
        for (let k = -2; k <= 2; k++) {
          ctx.fillStyle = k % 2 === 0 ? '#4d7a42' : '#659452';
          ctx.beginPath();
          ctx.ellipse(k * 6, 36 + Math.abs(k) * 3, 5, 18, k * 0.14, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
        ctx.restore();
      }

      // 4. Flickering Warm Hanging Lantern (Upper Left)
      if (W > 640) {
        const lanX = Math.max(46, winX * 0.48);
        const lanY = tableY * 0.28;
        const flicker = 0.88 + 0.12 * Math.sin(time * 9.5) * Math.cos(time * 4.2);

        ctx.save();
        // Warm ambient lantern glow
        const lGlow = ctx.createRadialGradient(lanX, lanY + 26, 6, lanX, lanY + 26, 130 * flicker);
        lGlow.addColorStop(0, `rgba(255, 224, 136, ${0.42 * flicker})`);
        lGlow.addColorStop(0.45, `rgba(255, 168, 76, ${0.16 * flicker})`);
        lGlow.addColorStop(1, 'rgba(255, 148, 52, 0)');
        ctx.fillStyle = lGlow;
        ctx.beginPath();
        ctx.arc(lanX, lanY + 26, 130 * flicker, 0, Math.PI * 2);
        ctx.fill();

        // Lantern chain & iron frame
        ctx.strokeStyle = '#2d1c10';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(lanX, 0);
        ctx.lineTo(lanX, lanY);
        ctx.stroke();

        ctx.fillStyle = '#332014';
        ctx.beginPath();
        ctx.moveTo(lanX - 18, lanY + 8);
        ctx.lineTo(lanX, lanY - 4);
        ctx.lineTo(lanX + 18, lanY + 8);
        ctx.closePath();
        ctx.fill();

        // Glowing amber glass core
        const glassGrad = ctx.createRadialGradient(lanX, lanY + 26, 2, lanX, lanY + 26, 18);
        glassGrad.addColorStop(0, '#fffce0');
        glassGrad.addColorStop(0.6, '#ffbf47');
        glassGrad.addColorStop(1, '#c76818');
        ctx.fillStyle = glassGrad;
        ctx.beginPath();
        ctx.roundRect(lanX - 13, lanY + 8, 26, 34, 6);
        ctx.fill();
        ctx.strokeStyle = '#332014';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      }

      // 5. Volumetric Diagonal Sunbeams
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      for (let i = 0; i < 3; i++) {
        const beamShift = Math.sin(time * 0.45 + i * 1.4) * 14;
        const bx = winX + winW * (0.14 + i * 0.24) + beamShift;
        const bw = winW * (0.15 + (i % 2) * 0.06);
        const beamGrad = ctx.createLinearGradient(bx, winY, bx + W * 0.24, H * 0.92);
        beamGrad.addColorStop(0, 'rgba(255, 244, 196, 0.16)');
        beamGrad.addColorStop(0.55, 'rgba(255, 232, 166, 0.08)');
        beamGrad.addColorStop(1, 'rgba(255, 224, 140, 0)');
        ctx.fillStyle = beamGrad;
        ctx.beginPath();
        ctx.moveTo(bx, winY + 12);
        ctx.lineTo(bx + bw, winY + 12);
        ctx.lineTo(bx + bw + W * 0.28, H);
        ctx.lineTo(bx + W * 0.16, H);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // 6. Rich Oak Dining Table Surface
      const tblGrad = ctx.createLinearGradient(0, tableY, 0, H);
      tblGrad.addColorStop(0, '#8a552c');
      tblGrad.addColorStop(0.12, '#a3683a');
      tblGrad.addColorStop(0.58, '#804c24');
      tblGrad.addColorStop(1, '#522c12');
      ctx.fillStyle = tblGrad;
      ctx.fillRect(0, tableY, W, H - tableY);

      ctx.fillStyle = 'rgba(255, 224, 168, 0.24)';
      ctx.fillRect(0, tableY, W, 4);
      ctx.fillStyle = 'rgba(26, 12, 4, 0.48)';
      ctx.fillRect(0, tableY - 3, W, 4);

      ctx.save();
      const rows = 5;
      for (let r = 1; r <= rows; r++) {
        const y = tableY + Math.pow(r / rows, 1.3) * (H - tableY);
        ctx.strokeStyle = 'rgba(42, 18, 6, 0.26)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255, 214, 152, 0.08)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, y + 3);
        ctx.bezierCurveTo(W * 0.3, y + 6, W * 0.7, y + 1, W, y + 4);
        ctx.stroke();
      }
      ctx.restore();

      // 7. Woven Embroidered Rustic Tablecloth Runner under the plate
      ctx.save();
      const runnerCx = layout.plateX;
      const runnerTopW = layout.plateR * 1.92;
      const runnerBotW = layout.plateR * 2.45;
      ctx.beginPath();
      ctx.moveTo(runnerCx - runnerTopW * 0.5, tableY + 2);
      ctx.lineTo(runnerCx + runnerTopW * 0.5, tableY + 2);
      ctx.lineTo(runnerCx + runnerBotW * 0.5, H);
      ctx.lineTo(runnerCx - runnerBotW * 0.5, H);
      ctx.closePath();

      const clothGrad = ctx.createLinearGradient(0, tableY, 0, H);
      clothGrad.addColorStop(0, '#c89b62');
      clothGrad.addColorStop(0.5, '#b6854c');
      clothGrad.addColorStop(1, '#8c5e31');
      ctx.fillStyle = clothGrad;
      ctx.fill();

      ctx.save();
      ctx.clip();
      ctx.strokeStyle = 'rgba(138, 46, 36, 0.34)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(runnerCx - runnerTopW * 0.42, tableY);
      ctx.lineTo(runnerCx - runnerBotW * 0.42, H);
      ctx.moveTo(runnerCx + runnerTopW * 0.42, tableY);
      ctx.lineTo(runnerCx + runnerBotW * 0.42, H);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 236, 198, 0.22)';
      ctx.lineWidth = 1.5;
      for (let gy = tableY + 12; gy < H; gy += 16) {
        ctx.beginPath();
        ctx.moveTo(runnerCx - runnerBotW, gy);
        ctx.lineTo(runnerCx + runnerBotW, gy);
        ctx.stroke();
      }
      ctx.restore();

      ctx.strokeStyle = 'rgba(38, 18, 6, 0.35)';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }

    /* =========================================================================
       5. REALISTIC ANIMATED BABY DRAGON CHARACTER
       ========================================================================= */
    class DragonCharacter {
      constructor() {
        this.mood = 'idle'; // idle | anticipation | happy | puzzled | eating | satisfied
        this.moodTimer = 0;
        this.blinkTimer = 2.4;
        this.blinkAmt = 0;
        this.lookX = 0;
        this.lookY = 0;
        this.targetLookX = 0;
        this.targetLookY = 0;
        this.lean = 0;
        this.jawOpen = 0;
        this.chewPhase = 0;
        this.chewAmt = 0;
        this.headTilt = 0;
        this.wingExc = 0;
        this.smokeTimer = 1.6;
        this.lickTimer = 0;
      }

      setMood(mood, duration = 0) {
        this.mood = mood;
        this.moodTimer = duration;
        if (mood === 'happy') {
          this.lickTimer = 0.65;
        }
      }

      update(dt, time, pointer, layout, particles) {
        this.blinkTimer -= dt;
        if (this.blinkTimer <= 0) {
          this.blinkAmt = 1;
          this.blinkTimer = 2.6 + Math.random() * 3.2;
        }
        if (this.blinkAmt > 0) {
          this.blinkAmt = Math.max(0, this.blinkAmt - dt * 6.5);
        }

        if (this.moodTimer > 0) {
          this.moodTimer -= dt;
          if (this.moodTimer <= 0 && (this.mood === 'happy' || this.mood === 'puzzled' || this.mood === 'satisfied')) {
            this.mood = 'idle';
          }
        }

        if (this.lickTimer > 0) this.lickTimer = Math.max(0, this.lickTimer - dt);

        // Smooth eye tracking toward cursor / dragged topping
        const headBaseX = layout.dragonX;
        const headBaseY = layout.dragonY - layout.dragonS * 0.72;
        const dx = (pointer.x - headBaseX) / Math.max(180, layout.W * 0.35);
        const dy = (pointer.y - headBaseY) / Math.max(140, layout.H * 0.35);
        this.targetLookX = Math.max(-1, Math.min(1, dx));
        this.targetLookY = Math.max(-1, Math.min(1, dy));
        this.lookX += (this.targetLookX - this.lookX) * Math.min(1, dt * 10);
        this.lookY += (this.targetLookY - this.lookY) * Math.min(1, dt * 10);

        const targetTilt = this.mood === 'puzzled'
          ? 0.25
          : this.mood === 'happy'
            ? Math.sin(time * 12) * 0.08
            : this.mood === 'satisfied'
              ? Math.sin(time * 7) * 0.09
              : Math.sin(time * 1.4) * 0.025;
        this.headTilt += (targetTilt - this.headTilt) * Math.min(1, dt * 9);

        const targetWing = (this.mood === 'happy' || this.mood === 'anticipation' || this.mood === 'satisfied') ? 1 : 0;
        this.wingExc += (targetWing - this.wingExc) * Math.min(1, dt * 7);

        // Slight eager mouth open on anticipation
        if (this.mood === 'anticipation') {
          this.jawOpen += (0.24 - this.jawOpen) * Math.min(1, dt * 8);
        } else if (this.mood !== 'eating') {
          this.jawOpen += (0 - this.jawOpen) * Math.min(1, dt * 10);
        }

        // Nostril smoke wisps
        this.smokeTimer -= dt;
        if (this.smokeTimer <= 0 && this.mood !== 'eating') {
          const s = layout.dragonS;
          const snoutX = layout.dragonX + this.lookX * s * 0.06;
          const snoutY = layout.dragonY - s * 0.56 + Math.sin(time * 2.2) * s * 0.02;
          const isGold = this.mood === 'happy' || this.mood === 'satisfied';
          particles.spawnSmokeWisp(snoutX - s * 0.07, snoutY, isGold, false);
          particles.spawnSmokeWisp(snoutX + s * 0.07, snoutY, isGold, false);
          this.smokeTimer = isGold ? 0.45 : (2.4 + Math.random() * 2.2);
        }
      }

      puffConfusedSmoke(layout, particles) {
        const s = layout.dragonS;
        const snoutX = layout.dragonX + this.lookX * s * 0.06;
        const snoutY = layout.dragonY - s * 0.56;
        particles.spawnSmokeWisp(snoutX - s * 0.08, snoutY, false, true);
        particles.spawnSmokeWisp(snoutX + s * 0.08, snoutY, false, true);
      }

      drawBodyAndHead(ctx, layout, time) {
        const cx = layout.dragonX;
        const cy = layout.dragonY;
        const s = layout.dragonS;
        const breath = Math.sin(time * 2.4);
        const happyBounce = (this.mood === 'happy' || this.mood === 'satisfied') ? Math.abs(Math.sin(time * 9)) * s * 0.07 : 0;

        ctx.save();
        ctx.translate(cx, cy - happyBounce);

        // --- 1. CURLING TAIL WITH GOLDEN SPADE ---
        const tailSway = Math.sin(time * 2.1) * s * 0.09 + this.wingExc * Math.sin(time * 10) * s * 0.06;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(-s * 0.42, s * 0.24);
        ctx.bezierCurveTo(-s * 1.12, s * 0.32, -s * 1.3, -s * 0.22 + tailSway, -s * 0.96, -s * 0.42 + tailSway);
        ctx.lineWidth = s * 0.22;
        ctx.lineCap = 'round';
        const tailGrad = ctx.createLinearGradient(-s * 1.2, -s * 0.4, -s * 0.4, s * 0.3);
        tailGrad.addColorStop(0, '#1e6e48');
        tailGrad.addColorStop(0.5, '#2b8f5c');
        tailGrad.addColorStop(1, '#195738');
        ctx.strokeStyle = tailGrad;
        ctx.stroke();

        ctx.translate(-s * 0.96, -s * 0.42 + tailSway);
        ctx.rotate(-0.65 + Math.sin(time * 2.1) * 0.15);
        const spadeGrad = ctx.createLinearGradient(-s * 0.18, -s * 0.18, s * 0.18, s * 0.18);
        spadeGrad.addColorStop(0, '#f4c762');
        spadeGrad.addColorStop(1, '#c97e24');
        ctx.fillStyle = spadeGrad;
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.22);
        ctx.quadraticCurveTo(s * 0.18, -s * 0.04, 0, s * 0.12);
        ctx.quadraticCurveTo(-s * 0.18, -s * 0.04, 0, -s * 0.22);
        ctx.fill();
        ctx.restore();

        // --- 2. IRIDESCENT TRANSLUCENT WINGS ---
        const flap = Math.sin(time * (3.2 + this.wingExc * 11)) * (0.08 + this.wingExc * 0.28);
        [-1, 1].forEach((side) => {
          ctx.save();
          ctx.translate(side * s * 0.36, -s * 0.16);
          ctx.scale(side, 1);
          ctx.rotate(-0.22 + flap);

          const memGrad = ctx.createRadialGradient(s * 0.35, -s * 0.25, s * 0.05, s * 0.45, -s * 0.15, s * 0.85);
          memGrad.addColorStop(0, 'rgba(255, 224, 132, 0.86)');
          memGrad.addColorStop(0.55, 'rgba(110, 198, 134, 0.82)');
          memGrad.addColorStop(1, 'rgba(34, 114, 74, 0.88)');
          ctx.fillStyle = memGrad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(s * 0.42, -s * 0.72, s * 0.92, -s * 0.56);
          ctx.quadraticCurveTo(s * 0.78, -s * 0.18, s * 0.86, s * 0.04);
          ctx.quadraticCurveTo(s * 0.54, -s * 0.08, s * 0.42, s * 0.18);
          ctx.quadraticCurveTo(s * 0.22, s * 0.04, 0, s * 0.16);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#1b5e3c';
          ctx.lineWidth = s * 0.045;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(s * 0.42, -s * 0.72, s * 0.92, -s * 0.56);
          ctx.stroke();

          ctx.lineWidth = s * 0.024;
          ctx.strokeStyle = 'rgba(22, 78, 50, 0.78)';
          ctx.beginPath();
          ctx.moveTo(s * 0.36, -s * 0.42);
          ctx.lineTo(s * 0.84, s * 0.02);
          ctx.moveTo(s * 0.24, -s * 0.26);
          ctx.lineTo(s * 0.42, s * 0.16);
          ctx.stroke();
          ctx.restore();
        });

        // --- 3. TORSO & SEGMENTED AMBER BELLY ---
        const torsoScaleX = 1 + breath * 0.024;
        const torsoScaleY = 1 - breath * 0.016;
        ctx.save();
        ctx.scale(torsoScaleX, torsoScaleY);

        const bodyGrad = ctx.createRadialGradient(-s * 0.18, -s * 0.18, s * 0.08, 0, s * 0.1, s * 0.78);
        bodyGrad.addColorStop(0, '#5ad18a');
        bodyGrad.addColorStop(0.42, '#2d935c');
        bodyGrad.addColorStop(0.85, '#195c3a');
        bodyGrad.addColorStop(1, '#0e3c24');
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.ellipse(0, s * 0.18, s * 0.56, s * 0.54, 0, 0, Math.PI * 2);
        ctx.fill();

        const bellyGrad = ctx.createLinearGradient(0, -s * 0.2, 0, s * 0.58);
        bellyGrad.addColorStop(0, '#ffe8a3');
        bellyGrad.addColorStop(0.5, '#f2bf63');
        bellyGrad.addColorStop(1, '#c98834');
        ctx.fillStyle = bellyGrad;
        ctx.beginPath();
        ctx.ellipse(0, s * 0.22, s * 0.35, s * 0.42, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(138, 76, 18, 0.38)';
        ctx.lineWidth = s * 0.018;
        for (let r = -1; r <= 3; r++) {
          const ry = s * (0.04 + r * 0.12);
          ctx.beginPath();
          ctx.arc(0, ry - s * 0.16, s * 0.31, Math.PI * 0.28, Math.PI * 0.72);
          ctx.stroke();
        }
        ctx.restore();

        // --- 4. ARTICULATED NECK & EXPRESSIVE HEAD ---
        const leanX = this.lean * (layout.plateX - cx) * 0.62;
        const leanY = this.lean * (layout.plateY - cy + s * 0.38) * 0.54;
        const headX = leanX + this.lookX * s * 0.05;
        const headY = -s * 0.64 + breath * s * 0.02 + leanY;

        ctx.save();
        ctx.strokeStyle = '#247c4e';
        ctx.lineWidth = s * 0.38;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.16);
        ctx.quadraticCurveTo(headX * 0.4, (headY - s * 0.16) * 0.5, headX, headY + s * 0.14);
        ctx.stroke();

        ctx.strokeStyle = '#f5cb74';
        ctx.lineWidth = s * 0.18;
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.12);
        ctx.quadraticCurveTo(headX * 0.35, (headY - s * 0.12) * 0.5, headX, headY + s * 0.18);
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.translate(headX, headY);
        ctx.rotate(this.headTilt);
        const headScale = 1 + this.lean * 0.14;
        ctx.scale(headScale, headScale);

        // Cheek fins
        [-1, 1].forEach((side) => {
          ctx.save();
          ctx.scale(side, 1);
          const droop = this.mood === 'puzzled' ? 0.25 : (this.mood === 'happy' ? -0.14 : 0);
          ctx.rotate(droop);
          const finGrad = ctx.createLinearGradient(s * 0.34, -s * 0.1, s * 0.68, -s * 0.22);
          finGrad.addColorStop(0, '#2a8c59');
          finGrad.addColorStop(0.55, '#f0be5e');
          finGrad.addColorStop(1, '#d4862e');
          ctx.fillStyle = finGrad;
          ctx.beginPath();
          ctx.moveTo(s * 0.34, -s * 0.14);
          ctx.quadraticCurveTo(s * 0.64, -s * 0.32, s * 0.68, -s * 0.1);
          ctx.quadraticCurveTo(s * 0.56, s * 0.04, s * 0.36, s * 0.06);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        });

        // Swept-back ivory-amber horns
        [-1, 1].forEach((side) => {
          ctx.save();
          ctx.scale(side, 1);
          const hornGrad = ctx.createLinearGradient(s * 0.14, -s * 0.34, s * 0.44, -s * 0.78);
          hornGrad.addColorStop(0, '#c89248');
          hornGrad.addColorStop(0.55, '#f2d9a0');
          hornGrad.addColorStop(1, '#fff5dc');
          ctx.fillStyle = hornGrad;
          ctx.beginPath();
          ctx.moveTo(s * 0.14, -s * 0.34);
          ctx.quadraticCurveTo(s * 0.26, -s * 0.66, s * 0.48, -s * 0.76);
          ctx.quadraticCurveTo(s * 0.38, -s * 0.48, s * 0.30, -s * 0.28);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = 'rgba(110, 68, 24, 0.35)';
          ctx.lineWidth = s * 0.015;
          ctx.stroke();
          ctx.restore();
        });

        // Cranium & cheeks
        const cheekPuff = 1 + this.chewAmt * (0.12 + 0.07 * Math.sin(this.chewPhase));
        const headGrad = ctx.createRadialGradient(-s * 0.14, -s * 0.24, s * 0.05, 0, -s * 0.04, s * 0.52);
        headGrad.addColorStop(0, '#6be09a');
        headGrad.addColorStop(0.45, '#339f64');
        headGrad.addColorStop(0.85, '#1d6840');
        headGrad.addColorStop(1, '#12442a');
        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.ellipse(0, -s * 0.04, s * 0.44 * cheekPuff, s * 0.38, 0, 0, Math.PI * 2);
        ctx.fill();

        // Subtle emerald forehead scales
        ctx.fillStyle = 'rgba(186, 255, 206, 0.2)';
        for (let i = -1; i <= 1; i++) {
          ctx.beginPath();
          ctx.arc(i * s * 0.11, -s * 0.28 + Math.abs(i) * s * 0.03, s * 0.045, 0, Math.PI * 2);
          ctx.fill();
        }

        // Open mouth / jaw
        const jawDrop = this.jawOpen * s * 0.26;
        if (this.jawOpen > 0.03) {
          ctx.fillStyle = '#5c1420';
          ctx.beginPath();
          ctx.ellipse(0, s * 0.14 + jawDrop * 0.42, s * 0.28, s * 0.12 + jawDrop * 0.65, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#eb6b7d';
          ctx.beginPath();
          ctx.ellipse(0, s * 0.20 + jawDrop * 0.65, s * 0.16, s * 0.08 + jawDrop * 0.2, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fff9eb';
          [-1, 1].forEach((side) => {
            ctx.beginPath();
            ctx.moveTo(side * s * 0.15, s * 0.09);
            ctx.lineTo(side * s * 0.11, s * 0.18);
            ctx.lineTo(side * s * 0.07, s * 0.09);
            ctx.closePath();
            ctx.fill();
          });

          ctx.fillStyle = '#257c4e';
          ctx.beginPath();
          ctx.arc(0, s * 0.18 + jawDrop, s * 0.24, 0.1 * Math.PI, 0.9 * Math.PI);
          ctx.fill();
        }

        // Snout & nostrils
        const snoutGrad = ctx.createRadialGradient(-s * 0.08, s * 0.02, s * 0.02, 0, s * 0.08, s * 0.34);
        snoutGrad.addColorStop(0, '#72e39f');
        snoutGrad.addColorStop(0.55, '#349e63');
        snoutGrad.addColorStop(1, '#1c653e');
        ctx.fillStyle = snoutGrad;
        ctx.beginPath();
        ctx.ellipse(0, s * 0.08, s * 0.32 * cheekPuff, s * 0.19, 0, 0, Math.PI * 2);
        ctx.fill();

        if (this.mood === 'happy' || this.mood === 'satisfied' || this.chewAmt > 0.2) {
          ctx.fillStyle = 'rgba(255, 132, 126, 0.36)';
          ctx.beginPath();
          ctx.ellipse(-s * 0.29, s * 0.08, s * 0.09, s * 0.055, 0, 0, Math.PI * 2);
          ctx.ellipse(s * 0.29, s * 0.08, s * 0.09, s * 0.055, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#0f3821';
        ctx.beginPath();
        ctx.ellipse(-s * 0.09, s * 0.03, s * 0.032, s * 0.02, -0.35, 0, Math.PI * 2);
        ctx.ellipse(s * 0.09, s * 0.03, s * 0.032, s * 0.02, 0.35, 0, Math.PI * 2);
        ctx.fill();

        if (this.jawOpen <= 0.08) {
          ctx.strokeStyle = '#124227';
          ctx.lineWidth = s * 0.022;
          ctx.lineCap = 'round';
          ctx.beginPath();
          if (this.mood === 'puzzled') {
            ctx.moveTo(-s * 0.14, s * 0.17);
            ctx.quadraticCurveTo(0, s * 0.12, s * 0.15, s * 0.19);
          } else if (this.mood === 'happy' || this.mood === 'satisfied' || this.chewAmt > 0.2) {
            ctx.moveTo(-s * 0.19, s * 0.13);
            ctx.quadraticCurveTo(0, s * 0.24, s * 0.19, s * 0.13);
          } else {
            ctx.moveTo(-s * 0.17, s * 0.14);
            ctx.quadraticCurveTo(0, s * 0.21, s * 0.17, s * 0.14);
          }
          ctx.stroke();

          if (this.lickTimer > 0) {
            const lickP = Math.sin((this.lickTimer / 0.65) * Math.PI);
            ctx.fillStyle = '#f2788a';
            ctx.beginPath();
            ctx.ellipse(s * 0.11, s * 0.19 + lickP * s * 0.04, s * 0.06, s * 0.045 * lickP + 0.01, 0.3, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Expressive glossy amber eyes
        const blissfulClosed = (this.mood === 'satisfied') || (this.chewAmt > 0.55) || (this.mood === 'happy' && Math.sin(time * 8) > 0.25);
        [-1, 1].forEach((side) => {
          const ex = side * s * 0.17;
          const ey = -s * 0.11;
          const er = s * 0.128;

          if (blissfulClosed) {
            ctx.strokeStyle = '#103b23';
            ctx.lineWidth = s * 0.032;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(ex, ey + s * 0.03, er * 0.82, Math.PI * 1.15, Math.PI * 1.85);
            ctx.stroke();
            return;
          }

          ctx.fillStyle = 'rgba(14, 52, 32, 0.45)';
          ctx.beginPath();
          ctx.ellipse(ex, ey, er * 1.12, er * 1.14, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fff9e6';
          ctx.beginPath();
          ctx.ellipse(ex, ey, er, er * 1.04, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.save();
          ctx.beginPath();
          ctx.ellipse(ex, ey, er, er * 1.04, 0, 0, Math.PI * 2);
          ctx.clip();

          const px = ex + this.lookX * er * 0.34;
          const py = ey + this.lookY * er * 0.34;
          const irisR = er * (this.mood === 'anticipation' ? 0.8 : 0.72);

          const irisGrad = ctx.createRadialGradient(px, py - irisR * 0.2, irisR * 0.1, px, py, irisR);
          irisGrad.addColorStop(0, '#ffe878');
          irisGrad.addColorStop(0.55, '#e89624');
          irisGrad.addColorStop(1, '#7a3b08');
          ctx.fillStyle = irisGrad;
          ctx.beginPath();
          ctx.arc(px, py, irisR, 0, Math.PI * 2);
          ctx.fill();

          const pupilScale = this.mood === 'anticipation' ? 1.18 : 1.0;
          ctx.fillStyle = '#180d06';
          ctx.beginPath();
          ctx.ellipse(px, py, irisR * 0.48 * pupilScale, irisR * 0.62 * pupilScale, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.94)';
          ctx.beginPath();
          ctx.arc(px - irisR * 0.26, py - irisR * 0.3, irisR * 0.24, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(px + irisR * 0.24, py + irisR * 0.24, irisR * 0.11, 0, Math.PI * 2);
          ctx.fill();

          if (this.blinkAmt > 0.02) {
            ctx.fillStyle = '#2d935c';
            ctx.fillRect(ex - er * 1.2, ey - er * 1.2, er * 2.4, er * 2.4 * this.blinkAmt);
          }
          ctx.restore();

          ctx.strokeStyle = '#185434';
          ctx.lineWidth = s * 0.028;
          ctx.lineCap = 'round';
          ctx.beginPath();
          if (this.mood === 'puzzled') {
            const asym = side === -1 ? -0.05 : 0.04;
            ctx.moveTo(ex - side * er * 0.85, ey - er * 1.1 + asym * s);
            ctx.quadraticCurveTo(ex, ey - er * 1.38 - asym * s, ex + side * er * 0.85, ey - er * 1.0);
          } else {
            ctx.moveTo(ex - side * er * 0.8, ey - er * 1.15);
            ctx.quadraticCurveTo(ex, ey - er * 1.38, ex + side * er * 0.85, ey - er * 1.05);
          }
          ctx.stroke();
        });

        ctx.restore(); // end head
        ctx.restore(); // end dragon
      }

      drawFrontPaws(ctx, layout, time) {
        const s = layout.dragonS;
        const tap = (this.mood === 'happy' || this.mood === 'anticipation')
          ? Math.abs(Math.sin(time * 10)) * s * 0.055
          : 0;
        const bellyRub = this.mood === 'satisfied' ? Math.sin(time * 9) * s * 0.08 : 0;

        [-1, 1].forEach((side) => {
          const px = layout.dragonX + side * s * 0.56 + (this.mood === 'satisfied' ? -side * s * 0.18 : 0);
          const py = layout.tableY + s * 0.15 - (side === 1 ? tap : 0) - (this.mood === 'satisfied' ? s * 0.18 + bellyRub * side : 0);

          ctx.save();
          if (this.mood !== 'satisfied') {
            ctx.fillStyle = 'rgba(30, 14, 4, 0.34)';
            ctx.beginPath();
            ctx.ellipse(px, py + s * 0.07, s * 0.21, s * 0.09, 0, 0, Math.PI * 2);
            ctx.fill();
          }

          const pawGrad = ctx.createRadialGradient(px - s * 0.04, py - s * 0.06, s * 0.02, px, py, s * 0.22);
          pawGrad.addColorStop(0, '#59cc86');
          pawGrad.addColorStop(0.6, '#2a8c57');
          pawGrad.addColorStop(1, '#175434');
          ctx.fillStyle = pawGrad;
          ctx.beginPath();
          ctx.ellipse(px, py, s * 0.19, s * 0.12, side * 0.14, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#f6e4bc';
          for (let c = -1; c <= 1; c++) {
            const cx = px + c * s * 0.075;
            const cy = py + s * 0.085;
            ctx.beginPath();
            ctx.moveTo(cx - s * 0.022, cy - s * 0.02);
            ctx.lineTo(cx, cy + s * 0.045);
            ctx.lineTo(cx + s * 0.022, cy - s * 0.02);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        });
      }
    }

    function drawOrnatePlate(ctx, cx, cy, r, dish) {
      ctx.save();
      const shGrad = ctx.createRadialGradient(cx, cy + r * 0.1, r * 0.5, cx, cy + r * 0.14, r * 1.18);
      shGrad.addColorStop(0, 'rgba(22, 9, 2, 0.54)');
      shGrad.addColorStop(0.75, 'rgba(22, 9, 2, 0.25)');
      shGrad.addColorStop(1, 'rgba(22, 9, 2, 0)');
      ctx.fillStyle = shGrad;
      ctx.beginPath();
      ctx.ellipse(cx, cy + r * 0.12, r * 1.16, r * 0.92, 0, 0, Math.PI * 2);
      ctx.fill();

      const ry = r * 0.84;
      const rimGrad = ctx.createRadialGradient(cx - r * 0.22, cy - ry * 0.28, r * 0.1, cx, cy, r * 1.05);
      rimGrad.addColorStop(0, '#fff5e0');
      rimGrad.addColorStop(0.55, dish.plateRim);
      rimGrad.addColorStop(1, dish.plateAccent);
      ctx.fillStyle = rimGrad;
      ctx.beginPath();
      ctx.ellipse(cx, cy, r * 1.04, ry * 1.04, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255, 244, 214, 0.45)';
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * r * 0.95, cy + Math.sin(a) * ry * 0.95, r * 0.02, 0, Math.PI * 2);
        ctx.fill();
      }

      const wellGrad = ctx.createRadialGradient(cx - r * 0.15, cy - ry * 0.2, r * 0.05, cx, cy, r * 0.88);
      wellGrad.addColorStop(0, dish.plateInner);
      wellGrad.addColorStop(0.84, dish.plateRim);
      wellGrad.addColorStop(1, dish.plateAccent);
      ctx.fillStyle = wellGrad;
      ctx.beginPath();
      ctx.ellipse(cx, cy, r * 0.87, ry * 0.87, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 245, 0.42)';
      ctx.lineWidth = r * 0.024;
      ctx.beginPath();
      ctx.ellipse(cx, cy, r * 0.96, ry * 0.96, 0, Math.PI * 1.12, Math.PI * 1.55);
      ctx.stroke();
      ctx.restore();
    }

    function drawDishFood(ctx, cx, cy, r, dishId, bitesTaken) {
      if (bitesTaken >= 4) return;
      ctx.save();

      if (bitesTaken > 0) {
        ctx.beginPath();
        ctx.rect(cx - r * 1.5, cy - r * 1.5, r * 3, r * 3);
        const biteSpots = [
          { dx: -0.36, dy: -0.22, br: 0.48 },
          { dx: 0.36, dy: -0.24, br: 0.49 },
          { dx: -0.18, dy: 0.28, br: 0.54 }
        ];
        for (let b = 0; b < bitesTaken; b++) {
          const sp = biteSpots[b];
          const bx = cx + sp.dx * r;
          const by = cy + sp.dy * r * 0.82;
          const br = sp.br * r;
          ctx.moveTo(bx + br, by);
          ctx.arc(bx, by, br, 0, Math.PI * 2, true);
          ctx.moveTo(bx + br * 0.65 + br * 0.45, by - br * 0.35);
          ctx.arc(bx + br * 0.65, by - br * 0.35, br * 0.45, 0, Math.PI * 2, true);
          ctx.moveTo(bx - br * 0.55 + br * 0.42, by + br * 0.35);
          ctx.arc(bx - br * 0.55, by + br * 0.35, br * 0.42, 0, Math.PI * 2, true);
        }
        ctx.clip('evenodd');
      }

      const fr = r * 0.81;
      const fry = fr * 0.83;

      ctx.fillStyle = 'rgba(42, 18, 6, 0.28)';
      ctx.beginPath();
      ctx.ellipse(cx, cy + fr * 0.09, fr * 1.03, fry * 1.02, 0, 0, Math.PI * 2);
      ctx.fill();

      if (dishId === 'berry_cake') {

        sideGrad.addColorStop(0.5, '#f2c785');
        sideGrad.addColorStop(1, '#a66d34');
        ctx.fillStyle = sideGrad;
        ctx.beginPath();
        ctx.ellipse(cx, cy + fr * 0.14, fr * 0.96, fry * 0.92, 0, 0, Math.PI);
        ctx.lineTo(cx - fr * 0.96, cy - fr * 0.04);
        ctx.ellipse(cx, cy - fr * 0.04, fr * 0.96, fry * 0.92, 0, Math.PI, 0, true);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#c43b5c';
        ctx.lineWidth = fr * 0.075;
        ctx.beginPath();
        ctx.ellipse(cx, cy + fr * 0.05, fr * 0.94, fry * 0.9, 0, 0.12 * Math.PI, 0.88 * Math.PI);

        ctx.beginPath();
        ctx.ellipse(cx, cy - fr * 0.04, fr * 0.97, fry * 0.93, 0, 0, Math.PI * 2);

      } else if (dishId === 'golden_pizza') {

        crustGrad.addColorStop(1, '#9c5619');
        ctx.fillStyle = crustGrad;
        ctx.beginPath();
        ctx.ellipse(cx, cy, fr * 1.02, fry * 1.0, 0, 0, Math.PI * 2);

        const sauceGrad = ctx.createRadialGradient(cx, cy, fr * 0.1, cx, cy, fr * 0.88);
        sauceGrad.addColorStop(0, '#d94426');
        sauceGrad.addColorStop(1, '#a32814');
        ctx.fillStyle = sauceGrad;
        ctx.beginPath();
        ctx.ellipse(cx, cy, fr * 0.86, fry * 0.84, 0, 0, Math.PI * 2);
        ctx.fill();

        const chGrad = ctx.createRadialGradient(cx - fr * 0.15, cy - fry * 0.15, fr * 0.06, cx, cy, fr * 0.82);
        chGrad.addColorStop(0, '#fff4bd');
        chGrad.addColorStop(0.7, '#f5cc64');
        chGrad.addColorStop(1, '#d99e32');
        ctx.fillStyle = chGrad;
        ctx.beginPath();
        ctx.ellipse(cx, cy, fr * 0.81, fry * 0.79, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (dishId === 'pancake_stack') {
        for (let layer = 2; layer >= 0; layer--) {
          const ly = cy + (layer - 1) * fr * 0.1;
          const lr = fr * (0.98 - layer * 0.03);
          const lry = lr * 0.83;

          ctx.fillStyle = '#f2d394';
          ctx.beginPath();
          ctx.ellipse(cx, ly + fr * 0.05, lr, lry, 0, 0, Math.PI * 2);
          ctx.fill();

          const pGrad = ctx.createRadialGradient(cx - lr * 0.2, ly - lry * 0.2, lr * 0.1, cx, ly, lr);
          pGrad.addColorStop(0, '#f2b85c');
          pGrad.addColorStop(0.7, '#cf8330');
          pGrad.addColorStop(1, '#a65d1c');
          ctx.fillStyle = pGrad;
          ctx.beginPath();
          ctx.ellipse(cx, ly, lr * 0.96, lry * 0.95, 0, 0, Math.PI * 2);

        }

        const syrGrad = ctx.createRadialGradient(cx - fr * 0.1, cy - fr * 0.16, fr * 0.05, cx, cy - fr * 0.08, fr * 0.72);
        syrGrad.addColorStop(0, 'rgba(255, 206, 98, 0.72)');
        syrGrad.addColorStop(0.55, 'rgba(196, 102, 22, 0.72)');

      } else if (dishId === 'choco_tart') {
        ctx.fillStyle = '#d99d4e';
        ctx.beginPath();
        const scallops = 24;
        for (let i = 0; i <= scallops; i++) {
          const a = (i / scallops) * Math.PI * 2;
          const rad = fr * (1.0 + (i % 2 === 0 ? 0.04 : -0.02));
          const x = cx + Math.cos(a) * rad;
          const y = cy + Math.sin(a) * rad * 0.83;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();

        const chGrad = ctx.createRadialGradient(cx - fr * 0.24, cy - fry * 0.24, fr * 0.05, cx, cy, fr * 0.92);
        chGrad.addColorStop(0, '#7d442b');
        chGrad.addColorStop(0.45, '#472112');
        chGrad.addColorStop(1, '#260f07');
        ctx.fillStyle = chGrad;
        ctx.beginPath();
        ctx.ellipse(cx, cy, fr * 0.89, fry * 0.87, 0, 0, Math.PI * 2);

      } else if (dishId === 'honey_waffle') {

        wafGrad.addColorStop(0.75, '#d99336');
        wafGrad.addColorStop(1, '#a66219');
        ctx.fillStyle = wafGrad;
        ctx.beginPath();
        ctx.ellipse(cx, cy, fr * 1.0, fry * 0.98, 0, 0, Math.PI * 2);

        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx, cy, fr * 0.9, fry * 0.88, 0, 0, Math.PI * 2);

        const step = fr * 0.27;
        for (let gx = -4; gx <= 4; gx++) {

            const px = cx + gx * step - step * 0.36;
            const py = cy + gy * step * 0.84 - step * 0.3;
            ctx.fillStyle = 'rgba(130, 68, 14, 0.42)';

            ctx.roundRect(px, py, step * 0.72, step * 0.58, step * 0.14);

        ctx.restore();
      } else if (dishId === 'caramel_cheesecake') {
        ctx.fillStyle = '#a86b32';

        const ccGrad = ctx.createRadialGradient(cx - fr * 0.2, cy - fry * 0.2, fr * 0.08, cx, cy - fr * 0.02, fr);

        ccGrad.addColorStop(1, '#cfa45c');
        ctx.fillStyle = ccGrad;

        const carGrad = ctx.createRadialGradient(cx, cy, fr * 0.1, cx, cy, fr * 0.82);
        carGrad.addColorStop(0, 'rgba(218, 124, 34, 0.65)');
        carGrad.addColorStop(1, 'rgba(156, 72, 14, 0.58)');
        ctx.fillStyle = carGrad;

        ctx.fillStyle = rimGrad;
        ctx.beginPath();
        ctx.ellipse(cx, cy, fr * 1.03, fry * 1.0, 0, 0, Math.PI * 2);
