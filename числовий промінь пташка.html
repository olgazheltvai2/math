<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пташка - Числовий промінь</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            background-color: #121c12;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Propysy Bold', 'Propysy', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            font-weight: bold;
        }

        /* Головний контейнер з пропорцією 16:9 та оригінальним фоном */
        #game-container {
            width: 100%;
            max-width: 100vw;
            aspect-ratio: 16 / 9;
            position: relative;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border: 8px solid #3e2723;
            border-radius: 20px;
        }

        /* SVG шар для деталізованого світу */
        #world-svg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        /* Анімації оточення */
        @keyframes floatCloud {
            0% { transform: translateX(0); }
            50% { transform: translateX(40px); }
            100% { transform: translateX(0); }
        }
        .cloud { animation: floatCloud 25s infinite ease-in-out; }
        
        @keyframes sunPulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        #sun-glow { animation: sunPulse 4s infinite ease-in-out; transform-origin: center; }

        /* Ефекти цілі */
        @keyframes glowTarget {
            0% { filter: drop-shadow(0 0 5px #ffeb3b); }
            50% { filter: drop-shadow(0 0 25px #ff9800); }
            100% { filter: drop-shadow(0 0 5px #ffeb3b); }
        }
        .target-highlight circle.point-base {
            fill: #fff59d !important;
            stroke: #ff6f00 !important;
            stroke-width: 7 !important;
            animation: glowTarget 1.5s infinite;
        }

        /* Анімації персонажа (Пташка) */
        @keyframes lookAround {
            0%, 45%, 100% { transform: translateX(0); }
            50%, 95% { transform: translateX(-4px); }
        }
        .eyes { animation: lookAround 4s infinite; }

        @keyframes wingFlap {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-30deg); }
        }
        .bird-wing.flapping { transform-origin: 10px 10px; animation: wingFlap 0.2s infinite; }

        @keyframes pulseBerry {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); filter: brightness(1.2); }
            100% { transform: scale(1); }
        }
        #target-berry { transform-origin: center; animation: pulseBerry 1.5s infinite ease-in-out; visibility: hidden; }

        #bird { visibility: hidden; pointer-events: auto; cursor: pointer; }

        /* Трясіння при помилці */
        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake { animation: shakeError 0.4s ease-in-out; }

        /* Інтерактивні зони на промені */
        .ray-point { pointer-events: auto; cursor: pointer; transition: all 0.2s; }
        .ray-point:hover circle.point-base {
            fill: #ffd54f !important; stroke: #ff6f00 !important; stroke-width: 6 !important;
        }
        .ray-point:hover text { fill: #ff6f00 !important; }
        
        /* Панель вводу (Калькулятор зверху по центру) */
        #input-panel {
            position: absolute;
            top: -150%;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle at top, #8d6e63, #4e342e);
            padding: 20px;
            border-radius: 35px;
            border: 6px solid #3e2723;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: top 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        
        /* Калькулятор опущено нижче */
        #input-panel.active { top: 80px; }

        /* Адаптивність для мобільних екранів */
        @media (max-width: 768px) {
            #input-panel { transform: translateX(-50%) scale(0.7); }
            #input-panel.active { top: 20px; }
        }

        #display {
            width: 100%; height: 60px;
            background: linear-gradient(to bottom, #dcedc8, #aed581);
            border: 5px inset #7cb342;
            border-radius: 15px;
            display: flex; justify-content: center; align-items: center;
            font-size: 40px; color: #1b5e20;
            box-shadow: inset 0 4px 15px rgba(0,0,0,0.2);
            letter-spacing: 6px;
            transition: background 0.3s;
        }

        .keys-grid {
            display: grid; grid-template-columns: repeat(7, 70px); gap: 10px;
        }

        .key-btn {
            height: 65px; border-radius: 15px; border: none;
            font-size: 32px; font-family: inherit; color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0,0,0,0.5), inset 0 5px 12px rgba(255,255,255,0.3);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .key-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 rgba(0,0,0,0.5), inset 0 5px 12px rgba(255,255,255,0.3);
        }
        .key-num { background: linear-gradient(to bottom, #ffb74d, #ef6c00); }
        .key-op { background: linear-gradient(to bottom, #4fc3f7, #0277bd); }
        .key-del { background: linear-gradient(to bottom, #e57373, #c62828); font-size: 26px; }
        .key-enter { background: linear-gradient(to bottom, #81c784, #2e7d32); }

        /* Система частинок (конфетті/листя) */
        .particle {
            position: absolute; pointer-events: none; border-radius: 50%;
            animation: fall 1.2s forwards cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        @keyframes fall {
            0% { transform: translateY(0) scale(1.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(300px) scale(0) rotate(720deg); opacity: 0; }
        }

        /* Погана погода (Негативний фідбек) */
        #weather-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 30, 0.7);
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 100;
        }
        #weather-overlay.active { opacity: 1; }
        
        #lightning {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            pointer-events: none;
            opacity: 0;
            z-index: 101;
        }
        @keyframes flashLightning {
            0%, 100% { opacity: 0; }
            10%, 30% { opacity: 0.9; }
            20%, 40% { opacity: 0; }
            50% { opacity: 1; }
            60% { opacity: 0; }
        }
        #lightning.active { animation: flashLightning 1.5s ease-out; }

    </style>
</head>
<body>

<div id="game-container">
    <svg id="world-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <defs>
            <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#fff59d"/>
                <stop offset="50%" stop-color="#ffeb3b"/>
                <stop offset="100%" stop-color="#fbc02d" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#81c784"/>
                <stop offset="100%" stop-color="#2e7d32"/>
            </linearGradient>
            <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#8d6e63"/>
                <stop offset="50%" stop-color="#5d4037"/>
                <stop offset="100%" stop-color="#3e2723"/>
            </linearGradient>
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#64b5f6"/>
                <stop offset="100%" stop-color="#e3f2fd"/>
            </linearGradient>
        </defs>

        <!-- Оригінальне небо -->
        <rect id="sky-rect" width="1920" height="1080" fill="url(#skyGrad)" />
        
        <circle id="sun-glow" cx="200" cy="200" r="160" fill="url(#sunGrad)" />
        <circle cx="200" cy="200" r="100" fill="#fff176" />
        
        <!-- Хмарки -->
        <g transform="translate(0, 0)">
            <g class="cloud" fill="#ffffff" opacity="0.9">
                <path d="M300 200 Q 330 150 380 180 Q 430 140 480 190 Q 530 170 540 220 Q 570 250 510 270 L 320 270 Q 260 250 300 200 Z" />
            </g>
        </g>
        <g transform="translate(900, 50) scale(0.8)">
            <g class="cloud" fill="#ffffff" opacity="0.7">
                <path d="M300 200 Q 330 150 380 180 Q 430 140 480 190 Q 530 170 540 220 Q 570 250 510 270 L 320 270 Q 260 250 300 200 Z" />
            </g>
        </g>

        <!-- Задній план лісу -->
        <g opacity="0.6">
            <path d="M-100 1080 L-100 650 Q 300 550 600 700 T 1300 600 T 2000 750 L2000 1080 Z" fill="#388e3c" />
            <path d="M-100 1080 L-100 750 Q 400 650 800 800 T 1600 700 T 2000 850 L2000 1080 Z" fill="#1b5e20" />
        </g>

        <!-- Головна гілка (Числовий промінь) -->
        <path d="M -50 700 Q 400 780 960 680 T 2000 650" fill="none" stroke="url(#woodGrad)" stroke-width="50" stroke-linecap="round" />
        
        <!-- Декоративні листочки на гілці -->
        <g id="decor-leaves">
            <path d="M 250 720 Q 280 780 310 740 Z" fill="url(#leafGrad)" />
            <path d="M 650 700 Q 690 640 720 680 Z" fill="url(#leafGrad)" />
            <path d="M 1150 660 Q 1190 720 1220 670 Z" fill="url(#leafGrad)" />
            <path d="M 1550 635 Q 1600 580 1640 620 Z" fill="url(#leafGrad)" />
        </g>

        <!-- Відмітки на промені -->
        <g id="ray-points-group"></g>

        <!-- Цільова ягода -->
        <g id="target-berry">
            <path d="M 0 0 Q 20 -35 35 -10 Z" fill="#4caf50" />
            <circle cx="0" cy="0" r="30" fill="#d32f2f" />
            <circle cx="-10" cy="-10" r="10" fill="#ffcdd2" opacity="0.8" />
            <circle cx="12" cy="15" r="5" fill="#b71c1c" opacity="0.6" />
            <circle cx="-15" cy="18" r="4" fill="#b71c1c" opacity="0.6" />
        </g>

        <!-- Головний персонаж: Пташка -->
        <g id="bird" onclick="clickBird(true)">
            <g id="bird-body" transform="translate(0, -100) scale(1.25)">
                <!-- Лапки -->
                <path d="M -15 35 L -25 55 M -15 35 L -5 55 M 15 35 L 5 55 M 15 35 L 25 55" stroke="#ffb300" stroke-width="6" stroke-linecap="round"/>
                <!-- Хвіст -->
                <path d="M -40 15 L -80 -15 L -65 30 Z" fill="#0288d1"/>
                <!-- Тіло -->
                <ellipse cx="0" cy="0" rx="45" ry="40" fill="#29b6f6" />
                <ellipse cx="15" cy="5" rx="25" ry="20" fill="#b3e5fc" />
                <!-- Крило -->
                <path d="M -20 -10 Q 15 -25 20 25 Q -15 30 -20 -10 Z" fill="#0277bd" class="bird-wing" id="wing" />
                <!-- Око -->
                <circle cx="20" cy="-15" r="9" fill="white" class="eyes"/>
                <circle cx="23" cy="-15" r="4" fill="black" class="eyes"/>
                <!-- Дзьоб -->
                <path d="M 42 -5 L 65 5 L 42 12 Z" fill="#ffca28" />
                <!-- Чубчик -->
                <path d="M 0 -40 Q 10 -60 -10 -55 Q 0 -70 -20 -60" fill="none" stroke="#0288d1" stroke-width="4" stroke-linecap="round"/>
            </g>
        </g>
    </svg>

    <!-- Погода -->
    <div id="weather-overlay"></div>
    <div id="lightning"></div>

    <!-- Панель вводу (зверху) -->
    <div id="input-panel">
        <div id="display"></div>
        <div class="keys-grid">
            <button class="key-btn key-num" onclick="pressKey('1', true)">1</button>
            <button class="key-btn key-num" onclick="pressKey('2', true)">2</button>
            <button class="key-btn key-num" onclick="pressKey('3', true)">3</button>
            <button class="key-btn key-num" onclick="pressKey('4', true)">4</button>
            <button class="key-btn key-num" onclick="pressKey('5', true)">5</button>
            <button class="key-btn key-op" onclick="pressKey('+', true)">+</button>
            <button class="key-btn key-del" onclick="pressKey('del', true)">❌</button>

            <button class="key-btn key-num" onclick="pressKey('6', true)">6</button>
            <button class="key-btn key-num" onclick="pressKey('7', true)">7</button>
            <button class="key-btn key-num" onclick="pressKey('8', true)">8</button>
            <button class="key-btn key-num" onclick="pressKey('9', true)">9</button>
            <button class="key-btn key-num" onclick="pressKey('0', true)">0</button>
            <button class="key-btn key-op" onclick="pressKey('-', true)">-</button>
            <button class="key-btn key-enter" onclick="checkAnswer(true)">✔️</button>
        </div>
    </div>
</div>

<script>
    // === Змінні для синхронізації Firebase ===
    let sendAction = function(type, data = {}) {}; // Перезапишеться у блоці Firebase

    // === Аудіо система ===
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol, delay=0) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + duration);
    }

    function playClick() { playTone(700, 'sine', 0.1, 0.2); }
    function playPop() { playTone(900, 'triangle', 0.15, 0.3); }
    function playJump() { 
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
    function playWin() {
        playTone(523.25, 'sine', 0.15, 0.3, 0);   
        playTone(659.25, 'sine', 0.15, 0.3, 0.1); 
        playTone(783.99, 'sine', 0.15, 0.3, 0.2);  
        playTone(1046.50, 'sine', 0.4, 0.4, 0.3);
    }
    function playThunder() {
        playTone(150, 'sawtooth', 0.6, 0.5, 0);
        playTone(100, 'sawtooth', 0.8, 0.5, 0.2);
        playTone(80, 'square', 1.0, 0.4, 0.4);
    }

    // === Логіка гри ===
    const rayGroup = document.getElementById('ray-points-group');
    const bird = document.getElementById('bird');
    const wing = document.getElementById('wing');
    const berry = document.getElementById('target-berry');
    const inputPanel = document.getElementById('input-panel');
    const display = document.getElementById('display');
    
    let gameState = 'PLACE_START'; // Стан: PLACE_START, PLACE_TARGET, SOLVE, DONE
    let startVal = null;
    let targetVal = null;
    let currentInput = "";
    const pointsData = [];
    let lastStateChange = 0; 
    
    // Побудова кривого числового променя
    function buildRay() {
        rayGroup.innerHTML = '';
        pointsData.length = 0;
        
        for(let i=0; i<=10; i++) {
            let t = i / 10;
            let x = 180 + t * 1560; // Розподіл по ширині
            // Математична крива для Y, щоб відповідала гілці
            let y = 700 + Math.sin(t * Math.PI) * 80 - t * 50; 
            
            let g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("class", "ray-point");
            g.setAttribute("transform", `translate(${x}, ${y})`);
            g.onclick = (e) => handlePointClick(i, true); // true = фізичний клік
            
            pointsData.push({x, y, val: i, el: g});
            
            let rope = document.createElementNS("http://www.w3.org/2000/svg", "line");
            rope.setAttribute("x1", "0"); rope.setAttribute("y1", "0");
            rope.setAttribute("x2", "0"); rope.setAttribute("y2", "60");
            rope.setAttribute("stroke", "#d7ccc8"); 
            rope.setAttribute("stroke-width", "6");
            
            let plank = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            plank.setAttribute("x", "-40"); plank.setAttribute("y", "50");
            plank.setAttribute("width", "80"); plank.setAttribute("height", "60");
            plank.setAttribute("rx", "12");
            plank.setAttribute("fill", "#ffb74d");
            plank.setAttribute("stroke", "#e65100");
            plank.setAttribute("stroke-width", "5");
            
            let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", "0"); circle.setAttribute("cy", "0");
            circle.setAttribute("r", "14");
            circle.setAttribute("fill", "#fff9c4");
            circle.setAttribute("stroke", "#fbc02d");
            circle.setAttribute("stroke-width", "4");
            circle.setAttribute("class", "point-base");
            
            let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", "0"); text.setAttribute("y", "93");
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("font-size", "40");
            text.setAttribute("fill", "#bf360c");
            text.textContent = i;
            
            g.appendChild(rope);
            g.appendChild(plank);
            g.appendChild(circle);
            g.appendChild(text);
            rayGroup.appendChild(g);
        }
    }

    // Взаємодія з променем
    function handlePointClick(val, isPhysical = false) {
        if (isPhysical) {
            // Захист від фантомних подвійних кліків (для тачпадів/телефонів)
            if (Date.now() - lastStateChange < 400) return;
            sendAction('POINT_CLICK', { val });
        }
        
        initAudio();
        
        if (gameState === 'PLACE_START') {
            startVal = val;
            let pt = pointsData[val];
            if(!pt) return; 
            bird.setAttribute("transform", `translate(${pt.x}, ${pt.y})`);
            bird.style.visibility = "visible";
            playPop();
            gameState = 'PLACE_TARGET';
            lastStateChange = Date.now();
            
        } else if (gameState === 'PLACE_TARGET') {
            if (val === startVal) {
                shakeElement(bird);
                return;
            }
            targetVal = val;
            let pt = pointsData[val];
            if(!pt) return;
            berry.setAttribute("transform", `translate(${pt.x}, ${pt.y - 20})`);
            berry.style.visibility = "visible";
            
            pt.el.classList.add('target-highlight');
            playPop();
            
            gameState = 'SOLVE';
            inputPanel.classList.add('active'); 
            currentInput = "";
            updateDisplay();
            lastStateChange = Date.now();
        }
    }

    // Клавіатура
    function pressKey(key, isPhysical = false) {
        if (gameState !== 'SOLVE') return; // Захист від зайвих кліків
        
        if (isPhysical) {
            sendAction('PRESS_KEY', { key });
        }
        playClick();
        
        if (key === 'del') {
            currentInput = currentInput.slice(0, -1);
        } else {
            if (['+', '-'].includes(key)) {
                if (currentInput.length === 0 || !['+', '-'].includes(currentInput[0])) {
                    currentInput = key + currentInput;
                } else {
                    currentInput = key + currentInput.slice(1);
                }
            } else {
                if (currentInput.replace(/[+-]/g, '').length < 2) {
                    currentInput += key;
                }
            }
        }
        updateDisplay();
    }

    function updateDisplay() {
        display.textContent = currentInput;
    }

    // Перевірка
    function checkAnswer(isPhysical = false) {
        if (gameState !== 'SOLVE') return; // Захист від багаторазових натискань
        
        if (!currentInput || currentInput.length < 2) return;
        
        let op = currentInput[0];
        let numStr = currentInput.slice(1);
        if (!['+', '-'].includes(op) || isNaN(parseInt(numStr))) return;
        
        if (isPhysical) {
            sendAction('CHECK_ANSWER');
        }
        
        let num = parseInt(numStr);
        let userResult = op === '+' ? (startVal + num) : (startVal - num);
        
        if (userResult === targetVal) {
            playWin();
            inputPanel.classList.remove('active');
            gameState = 'DONE';
            
            wing.classList.add('flapping');
            
            animateBirdJump(startVal, targetVal, () => {
                showParticles(pointsData[targetVal].x, pointsData[targetVal].y);
                berry.style.visibility = "hidden";
                wing.classList.remove('flapping');
                setTimeout(resetLevel, 2500); 
            });
            
        } else {
            playPop();
            display.style.backgroundColor = "#ffcdd2";
            gameState = 'DONE'; 
            
            setTimeout(() => {
                display.style.backgroundColor = "";
                inputPanel.classList.remove('active');
                
                let jumpEnd = Math.max(0, Math.min(10, userResult));
                
                wing.classList.add('flapping');
                animateBirdJump(startVal, jumpEnd, () => {
                    wing.classList.remove('flapping');
                    triggerBadWeather();
                    setTimeout(resetLevel, 3500);
                });
            }, 500);
            
            currentInput = "";
            updateDisplay();
        }
    }

    function shakeElement(el) {
        el.classList.add('shake');
        setTimeout(() => el.classList.remove('shake'), 400);
    }

    function triggerBadWeather() {
        playThunder();
        document.getElementById('weather-overlay').classList.add('active');
        document.getElementById('lightning').classList.add('active');
        shakeElement(bird);
    }

    // Стрибки по параболі
    function animateBirdJump(fromIdx, toIdx, callback) {
        let currentIdx = fromIdx;
        let direction = toIdx > fromIdx ? 1 : -1;
        
        function jumpNext() {
            if (currentIdx === toIdx) {
                if(callback) callback();
                return;
            }
            playJump();
            currentIdx += direction;
            let nextPt = pointsData[currentIdx];
            
            let startPt = pointsData[currentIdx - direction];
            let midX = (startPt.x + nextPt.x) / 2;
            let midY = Math.min(startPt.y, nextPt.y) - 120;
            
            let startTime = performance.now();
            let duration = 350; 
            
            function step(time) {
                let progress = (time - startTime) / duration;
                if (progress > 1) progress = 1;
                
                let inv = 1 - progress;
                let curX = inv*inv*startPt.x + 2*inv*progress*midX + progress*progress*nextPt.x;
                let curY = inv*inv*startPt.y + 2*inv*progress*midY + progress*progress*nextPt.y;
                
                bird.setAttribute("transform", `translate(${curX}, ${curY})`);
                
                if (progress < 1) requestAnimationFrame(step);
                else setTimeout(jumpNext, 100);
            }
            requestAnimationFrame(step);
        }
        jumpNext();
    }

    // Ефекти перемоги
    function showParticles(cx, cy) {
        const svg = document.getElementById('world-svg');
        const pt = svg.createSVGPoint();
        pt.x = cx; pt.y = cy;
        const screenPt = pt.matrixTransform(svg.getScreenCTM());
        
        for (let i=0; i<25; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            p.style.left = screenPt.x + 'px';
            p.style.top = (screenPt.y - 80) + 'px';
            p.style.width = p.style.height = (Math.random() * 15 + 8) + 'px';
            const colors = ['#ffeb3b', '#ff5722', '#4caf50', '#03a9f4', '#e91e63'];
            p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            let angle = Math.random() * Math.PI * 2;
            let velocity = Math.random() * 150 + 50;
            let tx = Math.cos(angle) * velocity;
            p.style.transform = `translate(${tx}px, 0)`;
            
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 1200);
        }
    }

    // Навігація / Скидання
    function resetLevel() {
        gameState = 'PLACE_START';
        startVal = null;
        targetVal = null;
        currentInput = "";
        bird.style.visibility = "hidden";
        berry.style.visibility = "hidden";
        inputPanel.classList.remove('active');
        updateDisplay();
        
        document.getElementById('weather-overlay').classList.remove('active');
        document.getElementById('lightning').classList.remove('active');
        
        pointsData.forEach(pt => {
            if (pt.el) pt.el.classList.remove('target-highlight');
        });
    }

    // Обробка натискання на пташку
    function clickBird(isPhysical = false) {
        if (isPhysical) {
            // Усуваємо фантомні подвійні кліки після тапу по екрану
            if (Date.now() - lastStateChange < 400) return; 
            sendAction('CLICK_BIRD');
        }
        
        if (gameState === 'PLACE_TARGET' || gameState === 'SOLVE') {
            playPop();
            resetLevel();
        }
    }

    // Старт
    window.addEventListener('load', () => {
        buildRay();
    });
</script>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
    // 1. Ініціалізація Firebase
    const firebaseConfig = {
        databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
        projectId: "lesson-13c44"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 2. Отримання та збереження імені
    let myName = new URLSearchParams(window.location.search).get('user');
    if (myName) {
        sessionStorage.setItem('userName', myName);
    } else {
        myName = sessionStorage.getItem('userName');
        if (!myName) {
            myName = 'Гість_' + Math.floor(Math.random() * 1000);
            sessionStorage.setItem('userName', myName);
        }
    }

    // 3. Радар та унікальні вкладки
    const tabId = Math.random().toString(36).substr(2, 9);
    const userRef = db.ref(`online_users/${myName}/${tabId}`);
    const connectedRef = db.ref('.info/connected');

    connectedRef.on('value', (snap) => {
        if (snap.val() === true) {
            userRef.set(true);
            userRef.onDisconnect().remove();
        }
    });

    window.addEventListener('beforeunload', () => {
        userRef.remove();
    });

    // 4. Оновлення списку та блокування екрану
    db.ref(`blocked_users/${myName}`).on('value', (snap) => {
        document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
    });

    // Фікс нескінченного циклу перезавантаження: перевірка isInitialRefreshLoad
    let isInitialRefreshLoad = true;
    db.ref('force_refresh').on('value', (snap) => {
        if (!isInitialRefreshLoad && snap.val() === true) {
            window.location.reload();
        }
        isInitialRefreshLoad = false;
    });

    // 5. Повернення в Лобі
    let isImmune = true;
    setTimeout(() => isImmune = false, 1000);
    db.ref('current_activity').on('value', (snap) => {
        if (!isImmune && snap.val() === 'lobby') {
            window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
        }
    });

    // 6. Синхронізація логіки гри (ІЗОЛЬОВАНА + ЗАХИСТ ВІД ДЕСИНХРОНУ)
    const GAME_ID = "bird_math_ray"; 
    let lastActionId = null; // Захищає від повторного виконання команд

    sendAction = function(type, data = {}) {
        // Унікальний ідентифікатор кожного ходу вирішує проблему розсинхрону годинників
        const actionId = tabId + '_' + Date.now() + '_' + Math.random();
        lastActionId = actionId; 
        
        db.ref('game_action').set({
            gameId: GAME_ID,
            senderId: tabId,
            actionId: actionId,
            type: type,
            data: data
        });
    };

    db.ref('game_action').on('value', snap => {
        const val = snap.val();
        if (!val || typeof val !== 'object' || val.gameId !== GAME_ID) return; 
        if (val.senderId === tabId) return; // Ігноруємо власні ходи
        if (val.actionId === lastActionId) return; // Запобігаємо нескінченному циклу!
        
        lastActionId = val.actionId;
        
        try {
            // Передаємо false, щоб гра зрозуміла, що це прийшло з інтернету і не пересилала хід назад
            if (val.type === 'POINT_CLICK' && val.data !== undefined) handlePointClick(val.data.val, false);
            if (val.type === 'PRESS_KEY' && val.data !== undefined) pressKey(val.data.key, false);
            if (val.type === 'CHECK_ANSWER') checkAnswer(false);
            if (val.type === 'CLICK_BIRD') clickBird(false);
        } catch (e) {
            console.error("Помилка синхронізації:", e);
        }
    });
</script>
