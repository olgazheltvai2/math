<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shulte Dual Generator</title>
  <style>
    /* ==========================================================
       ОСНОВНІ СТИЛІ ТА СКИДАННЯ (ЖОДНИХ БІЛИХ ПРЯМОКУТНИКІВ ТА ТЕКСТУ)
       ========================================================== */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      background: #1b4332;
    }

    /* Головна сцена гри */
    #game-scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Живий сюжетний SVG-фон на весь екран */
    #bg-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      object-fit: cover;
    }

    /* Шар для ефектів частинок (листочки, іскри, зірочки) */
    #particles-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
    }

    /* ==========================================================
       КОНТЕЙНЕР ДЛЯ ДВОХ ТАБЛИЦЬ ТА ПЕРСОНАЖА
       ========================================================== */
    .boards-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.5vw;
      width: 95vw;
      max-width: 1380px;
      height: 82vh;
    }

    /* Стилізована дерев'яна дошка з різьбленням та листям */
    .wood-board {
      position: relative;
      width: 39vw;
      max-width: 520px;
      aspect-ratio: 1 / 1;
      background: radial-gradient(circle at 30% 30%, #a45a2a, #6f3614 70%, #4a2109 100%);
      border-radius: 38px;
      padding: 22px;
      box-shadow: 
        0 18px 0 #361605,
        0 26px 40px rgba(0, 0, 0, 0.55),
        inset 0 4px 10px rgba(255, 210, 140, 0.45),
        inset 0 -8px 16px rgba(30, 10, 0, 0.7);
      border: 6px solid #c87d42;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 14px;
    }

    /* Візерунок кори дерева поверх дошки */
    .wood-board::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 28px;
      border: 3px dashed rgba(255, 200, 130, 0.25);
      pointer-events: none;
    }

    /* Декоративні листочки по кутах дошки */
    .board-deco {
      position: absolute;
      width: 64px;
      height: 64px;
      pointer-events: none;
      z-index: 12;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    }
    .deco-tl { top: -20px; left: -20px; transform: rotate(-15deg); }
    .deco-tr { top: -20px; right: -20px; transform: scaleX(-1) rotate(-15deg); }
    .deco-bl { bottom: -16px; left: -18px; transform: scaleY(-1) rotate(-10deg); }
    .deco-br { bottom: -16px; right: -18px; transform: scale(-1, -1) rotate(-10deg); }

    /* ==========================================================
       КЛІТИНКИ ТАБЛИЦІ (МЕДАЛЬЙОНИ З ВІЗЕРУНКОМ)
       ========================================================== */
    .cell {
      position: relative;
      border-radius: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, filter 0.25s ease;
      /* Текстурований бурштиново-дерев'яний медальйон */
      background: 
        radial-gradient(circle at 35% 25%, rgba(255, 235, 180, 0.35) 0%, transparent 55%),
        repeating-linear-gradient(45deg, rgba(120, 65, 20, 0.14) 0px, rgba(120, 65, 20, 0.14) 6px, transparent 6px, transparent 12px),
        linear-gradient(145deg, #f3c677, #d9933d 65%, #b56c1b 100%);
      border: 4px solid #8a4813;
      box-shadow: 
        0 8px 0 #572906,
        0 10px 16px rgba(0, 0, 0, 0.35),
        inset 0 3px 6px rgba(255, 248, 215, 0.7),
        inset 0 -5px 10px rgba(110, 50, 5, 0.5);
      overflow: hidden;
    }

    /* Внутрішній орнамент кожної клітинки */
    .cell::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 17px;
      border: 2px dotted rgba(115, 55, 10, 0.35);
      pointer-events: none;
    }

    .cell:hover {
      transform: translateY(-4px) scale(1.03);
      filter: brightness(1.07);
    }

    .cell:active {
      transform: translateY(3px) scale(0.96);
    }

    /* SVG всередині клітинки */
    .cell svg {
      width: 84%;
      height: 84%;
      filter: drop-shadow(0 4px 5px rgba(45, 20, 0, 0.35));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 2;
    }

    /* ==========================================================
       СТАН АКТИВНОГО ПІДСВІЧУВАННЯ ТОТОЖНИХ КЛІТИНОК
       ========================================================== */
    .cell.active-match {
      transform: translateY(-5px) scale(1.06);
      border-color: var(--glow-border, #fff36b);
      background: 
        radial-gradient(circle at 50% 50%, var(--glow-inner, #ffe97f) 0%, var(--glow-mid, #ff9f1c) 65%, var(--glow-outer, #e76f51) 100%);
      box-shadow: 
        0 6px 0 var(--glow-shadow, #9c3d10),
        0 0 28px var(--glow-color, #ffbe0b),
        inset 0 0 18px rgba(255, 255, 255, 0.85);
      animation: pulseCell 1.1s infinite alternate ease-in-out;
    }

    .cell.active-match svg {
      transform: scale(1.12) rotate(3deg);
    }

    @keyframes pulseCell {
      0% {
        box-shadow: 0 6px 0 var(--glow-shadow, #9c3d10), 0 0 18px var(--glow-color, #ffbe0b), inset 0 0 14px rgba(255,255,255,0.7);
      }
      100% {
        box-shadow: 0 6px 0 var(--glow-shadow, #9c3d10), 0 0 36px var(--glow-color, #ffbe0b), 0 0 55px var(--glow-color, #ffbe0b), inset 0 0 24px rgba(255,255,255,0.95);
      }
    }

    /* ==========================================================
       ЦЕНТРАЛЬНИЙ ЖИВИЙ ПЕРСОНАЖ (ЛИСЕНЯ)
       ========================================================== */
    .character-stage {
      width: 15vw;
      min-width: 135px;
      max-width: 210px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 15;
      cursor: pointer;
    }

    #fox-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 12px 16px rgba(0, 0, 0, 0.45));
      transition: transform 0.3s ease;
    }

    /* Idle-анімації персонажа */
    #fox-tail {
      transform-origin: 95px 195px;
      animation: tailWag 2.6s ease-in-out infinite alternate;
    }
    #fox-head {
      transform-origin: 100px 135px;
      animation: headBob 3.2s ease-in-out infinite alternate;
    }
    #fox-ear-l {
      transform-origin: 65px 75px;
      animation: earTwitchL 4.5s ease-in-out infinite;
    }
    #fox-ear-r {
      transform-origin: 135px 75px;
      animation: earTwitchR 5s ease-in-out infinite;
    }

    /* Стан радості персонажа при кліку */
    .fox-happy #fox-body-group {
      animation: foxJump 0.55s cubic-bezier(0.28, 0.84, 0.42, 1);
    }
    .fox-happy #fox-tail {
      animation: tailWagFast 0.25s ease-in-out infinite alternate;
    }

    @keyframes tailWag {
      0% { transform: rotate(-8deg); }
      100% { transform: rotate(12deg); }
    }
    @keyframes tailWagFast {
      0% { transform: rotate(-22deg); }
      100% { transform: rotate(25deg); }
    }
    @keyframes headBob {
      0% { transform: rotate(-2.5deg) translateY(0px); }
      100% { transform: rotate(2.5deg) translateY(3px); }
    }
    @keyframes earTwitchL {
      0%, 86%, 100% { transform: rotate(0deg); }
      90% { transform: rotate(-14deg); }
      95% { transform: rotate(6deg); }
    }
    @keyframes earTwitchR {
      0%, 78%, 100% { transform: rotate(0deg); }
      83% { transform: rotate(15deg); }
      88% { transform: rotate(-5deg); }
    }
    @keyframes foxJump {
      0% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-28px) scale(1.06, 0.95); }
      65% { transform: translateY(4px) scale(0.96, 1.04); }
      100% { transform: translateY(0) scale(1); }
    }

    /* ==========================================================
       МІНІМАЛІСТИЧНІ КНОПКИ НАВІГАЦІЇ (НАЗАД / ДАЛІ)
       ========================================================== */
    .nav-bar {
      position: absolute;
      bottom: 2.2vh;
      z-index: 25;
      display: flex;
      gap: 28px;
      align-items: center;
    }

    .nav-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 4px solid #f4a261;
      background: radial-gradient(circle at 30% 30%, #52b788, #2d6a4f 75%, #1b4332 100%);
      box-shadow: 
        0 7px 0 #122e22,
        0 10px 20px rgba(0, 0, 0, 0.45),
        inset 0 3px 6px rgba(255, 255, 255, 0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
    }

    .nav-btn:hover {
      transform: translateY(-4px) scale(1.08);
      filter: brightness(1.12);
    }

    .nav-btn:active {
      transform: translateY(4px) scale(0.94);
      box-shadow: 0 2px 0 #122e22, 0 4px 10px rgba(0,0,0,0.4);
    }

    .nav-btn:disabled {
      opacity: 0.45;
      cursor: default;
      transform: none;
      filter: grayscale(0.5);
    }

    .nav-btn svg {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35));
    }

    /* Анімації для живого фону */
    .cloud-anim-1 { animation: floatCloud 38s linear infinite; }
    .cloud-anim-2 { animation: floatCloud 52s linear infinite reverse; }
    .butterfly-anim { animation: flutter 9s ease-in-out infinite alternate; }
    .grass-sway { transform-origin: bottom center; animation: sway 3.6s ease-in-out infinite alternate; }

    @keyframes floatCloud {
      0% { transform: translateX(-120px); }
      100% { transform: translateX(120px); }
    }
    @keyframes flutter {
      0% { transform: translate(0, 0) rotate(-8deg); }
      50% { transform: translate(45px, -28px) rotate(12deg); }
      100% { transform: translate(-25px, -45px) rotate(-5deg); }
    }
    @keyframes sway {
      0% { transform: skewX(-4deg); }
      100% { transform: skewX(5deg); }
    }

    /* Адаптивність для різних екранів */
    @media (max-width: 980px) {
      .boards-wrapper {
        gap: 1.5vw;
      }
      .wood-board {
        width: 41vw;
        padding: 12px;
        gap: 8px;
      }
      .character-stage {
        width: 13vw;
        min-width: 95px;
      }
    }
  </style>
</head>
<body>

<div id="game-scene">

  <!-- ==========================================================
       ЖИВИЙ СЮЖЕТНИЙ ФОН: СОНЯЧНА ЛІСОВА ГАЛЯВИНА (SVG)
       ========================================================== -->
  <svg id="bg-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Градієнт неба -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#48cae4"/>
        <stop offset="55%" stop-color="#90e0ef"/>
        <stop offset="100%" stop-color="#caf0f8"/>
      </linearGradient>
      <!-- Градієнти пагорбів -->
      <linearGradient id="hillFar" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#74c69d"/>
        <stop offset="100%" stop-color="#40916c"/>
      </linearGradient>
      <linearGradient id="hillMid" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#52b788"/>
        <stop offset="100%" stop-color="#2d6a4f"/>
      </linearGradient>
      <linearGradient id="hillFront" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#40916c"/>
        <stop offset="100%" stop-color="#1b4332"/>
      </linearGradient>
      <!-- Шаблон декоративного листочка для кутів дошки -->
      <g id="corner-leaf">
        <path d="M10,50 C10,20 35,5 58,8 C55,32 40,52 10,50 Z" fill="#52b788" stroke="#1b4332" stroke-width="3"/>
        <path d="M12,48 Q32,28 54,10" stroke="#95d5b2" stroke-width="2.5" fill="none"/>
        <circle cx="16" cy="46" r="7" fill="#e63946" stroke="#800f2f" stroke-width="2"/>
        <circle cx="25" cy="51" r="6" fill="#ffb703" stroke="#b5651d" stroke-width="2"/>
      </g>
    </defs>

    <!-- Небо -->
    <rect width="1920" height="1080" fill="url(#skyGrad)"/>

    <!-- Сонечко з променями -->
    <g transform="translate(960, 130)">
      <circle r="110" fill="#ffea00" opacity="0.22"/>
      <circle r="80" fill="#ffd000" opacity="0.4"/>
      <circle r="56" fill="#ffbe0b"/>
    </g>

    <!-- Рухомі пухнасті хмарки -->
    <g class="cloud-anim-1" opacity="0.88" fill="#ffffff">
      <path d="M220,160 Q250,120 295,135 Q330,100 380,130 Q425,130 435,168 Q465,185 445,212 L205,212 Q180,185 220,160 Z"/>
      <path d="M1380,110 Q1410,75 1455,90 Q1490,60 1535,90 Q1575,90 1585,125 L1365,125 Z"/>
    </g>
    <g class="cloud-anim-2" opacity="0.72" fill="#f8f9fa">
      <path d="M680,210 Q710,175 750,190 Q785,165 820,195 L665,195 Z"/>
      <path d="M1620,220 Q1655,180 1705,195 Q1745,170 1790,205 L1600,205 Z"/>
    </g>

    <!-- Далекі лісові пагорби -->
    <path d="M0,650 Q420,480 920,610 T1920,580 L1920,1080 L0,1080 Z" fill="url(#hillFar)"/>

    <!-- Дерева на задньому плані -->
    <g transform="translate(120, 420)">
      <rect x="65" y="140" width="32" height="130" rx="8" fill="#6f3614"/>
      <circle cx="81" cy="110" r="75" fill="#40916c"/>
      <circle cx="45" cy="135" r="55" fill="#52b788"/>
      <circle cx="115" cy="130" r="58" fill="#2d6a4f"/>
      <circle cx="80" cy="75" r="55" fill="#74c69d"/>
    </g>
    <g transform="translate(1660, 400)">
      <rect x="65" y="140" width="34" height="140" rx="8" fill="#6f3614"/>
      <circle cx="82" cy="110" r="80" fill="#40916c"/>
      <circle cx="42" cy="135" r="60" fill="#52b788"/>
      <circle cx="120" cy="130" r="60" fill="#2d6a4f"/>
      <circle cx="82" cy="70" r="58" fill="#74c69d"/>
    </g>

    <!-- Середні пагорби -->
    <path d="M0,740 Q540,620 1050,730 T1920,690 L1920,1080 L0,1080 Z" fill="url(#hillMid)"/>

    <!-- Передній план галявини з травою та квітами -->
    <path d="M0,860 Q620,780 1120,865 T1920,830 L1920,1080 L0,1080 Z" fill="url(#hillFront)"/>

    <!-- Анімовані кущики трави та грибочки -->
    <g class="grass-sway" transform="translate(260, 890)">
      <path d="M0,60 Q-18,15 -35,0 Q-5,25 5,60 Z" fill="#74c69d"/>
      <path d="M8,60 Q12,5 30,-10 Q20,25 18,60 Z" fill="#95d5b2"/>
      <!-- Мухоморчик -->
      <path d="M45,60 L48,32 L64,32 L67,60 Z" fill="#faedcd"/>
      <path d="M30,36 Q56,2 82,36 Z" fill="#e63946"/>
      <circle cx="48" cy="24" r="4" fill="#fff"/>
      <circle cx="62" cy="20" r="3.5" fill="#fff"/>
      <circle cx="56" cy="30" r="3" fill="#fff"/>
    </g>

    <g class="grass-sway" transform="translate(1580, 880)">
      <path d="M0,60 Q-18,15 -35,0 Q-5,25 5,60 Z" fill="#74c69d"/>
      <path d="M8,60 Q12,5 30,-10 Q20,25 18,60 Z" fill="#95d5b2"/>
      <!-- Квіточка -->
      <circle cx="-25" cy="25" r="9" fill="#ffbe0b"/>
      <circle cx="-25" cy="11" r="7" fill="#ff006e"/>
      <circle cx="-25" cy="39" r="7" fill="#ff006e"/>
      <circle cx="-39" cy="25" r="7" fill="#ff006e"/>
      <circle cx="-11" cy="25" r="7" fill="#ff006e"/>
      <circle cx="-25" cy="25" r="6" fill="#ffbe0b"/>
    </g>

    <!-- Метелик у повітрі -->
    <g class="butterfly-anim" transform="translate(930, 220)">
      <path d="M0,0 C-22,-25 -38,-5 -15,12 C-32,25 -15,38 0,18 Z" fill="#ffbe0b" stroke="#fb5607" stroke-width="2"/>
      <path d="M4,0 C26,-25 42,-5 19,12 C36,25 19,38 4,18 Z" fill="#ffbe0b" stroke="#fb5607" stroke-width="2"/>
      <rect x="0" y="-4" width="4" height="26" rx="2" fill="#3a0ca3"/>
    </g>
  </svg>

  <!-- Канвас для святкових частинок при кліках -->
  <canvas id="particles-layer"></canvas>

  <!-- ==========================================================
       ОСНОВНЕ ІГРОВЕ ПОЛЕ: 2 ТАБЛИЦІ 3x3 + ЖИВИЙ ПЕРСОНАЖ
       ========================================================== -->
  <div class="boards-wrapper">
    
    <!-- ЛІВА ТАБЛИЦЯ: ТВАРИНКИ (3x3) -->
    <div class="wood-board" id="animals-board">
      <svg class="board-deco deco-tl" viewBox="0 0 64 64"><use href="#corner-leaf"/></svg>
      <svg class="board-deco deco-tr" viewBox="0 0 64 64"><use href="#corner-leaf"/></svg>
      <svg class="board-deco deco-bl" viewBox="0 0 64 64"><use href="#corner-leaf"/></svg>
      <svg class="board-deco deco-br" viewBox="0 0 64 64"><use href="#corner-leaf"/></svg>
    </div>

    <!-- ЖИВИЙ ПЕРСОНАЖ ПОСЕРЕДИНІ: ЛИСЕНЯ -->
    <div class="character-stage" id="character-box">
      <svg id="fox-svg" viewBox="0 0 200 260">
        <g id="fox-body-group">
          <!-- Пухнастий хвіст -->
          <g id="fox-tail">
            <path d="M98,195 C145,205 185,170 182,125 C178,100 152,110 140,128 C122,150 110,175 98,195 Z" fill="#f77f00" stroke="#9c3d10" stroke-width="4"/>
            <path d="M182,125 C178,100 155,108 146,122 C155,134 168,138 179,136 Z" fill="#fff8e7"/>
          </g>

          <!-- Тіло лисеняти -->
          <path d="M62,150 C52,185 55,222 68,232 L132,232 C145,222 148,185 138,150 Z" fill="#f77f00" stroke="#9c3d10" stroke-width="4"/>
          <!-- Біла грудка -->
          <path d="M78,152 C74,182 82,212 100,218 C118,212 126,182 122,152 Z" fill="#fff8e7"/>

          <!-- Задні лапки -->
          <ellipse cx="72" cy="232" rx="16" ry="10" fill="#5c2409"/>
          <ellipse cx="128" cy="232" rx="16" ry="10" fill="#5c2409"/>
          <!-- Передні лапки -->
          <rect x="76" y="182" width="15" height="44" rx="7.5" fill="#d65a00" stroke="#7f2f08" stroke-width="3"/>
          <rect x="109" y="182" width="15" height="44" rx="7.5" fill="#d65a00" stroke="#7f2f08" stroke-width="3"/>

          <!-- Голова -->
          <g id="fox-head">
            <!-- Ліве вушко -->
            <g id="fox-ear-l">
              <path d="M52,92 L34,32 L86,62 Z" fill="#f77f00" stroke="#9c3d10" stroke-width="4" stroke-linejoin="round"/>
              <path d="M54,84 L42,42 L76,62 Z" fill="#3d1e0d"/>
            </g>
            <!-- Праве вушко -->
            <g id="fox-ear-r">
              <path d="M148,92 L166,32 L114,62 Z" fill="#f77f00" stroke="#9c3d10" stroke-width="4" stroke-linejoin="round"/>
              <path d="M146,84 L158,42 L124,62 Z" fill="#3d1e0d"/>
            </g>

            <!-- Основа мордочки -->
            <path d="M40,108 C38,68 68,52 100,52 C132,52 162,68 160,108 C164,134 132,158 100,158 C68,158 36,134 40,108 Z" fill="#f77f00" stroke="#9c3d10" stroke-width="4"/>
            <!-- Білі щічки -->
            <path d="M40,110 C55,102 82,115 100,148 C70,158 38,136 40,110 Z" fill="#fff8e7"/>
            <path d="M160,110 C145,102 118,115 100,148 C130,158 162,136 160,110 Z" fill="#fff8e7"/>

            <!-- Очі (звичайні) -->
            <g id="fox-eyes-normal">
              <ellipse cx="73" cy="102" rx="10" ry="12" fill="#2b1406"/>
              <circle cx="70" cy="97" r="4" fill="#ffffff"/>
              <circle cx="77" cy="106" r="2" fill="#ffffff"/>

              <ellipse cx="127" cy="102" rx="10" ry="12" fill="#2b1406"/>
              <circle cx="124" cy="97" r="4" fill="#ffffff"/>
              <circle cx="131" cy="106" r="2" fill="#ffffff"/>
            </g>

            <!-- Очі (радісні дуги при кліку) -->

      </svg>`
    },
    // 12. БІЛОЧКА
    {
      id: 'squirrel',
      svg: `<svg viewBox="0 0 120 120">
        <!-- Великий пухнастий хвіст -->
        <path d="M74,88 C112,86 116,34 92,22 C74,14 66,34 76,46 C84,56 70,74 74,88 Z" fill="#e76f51" stroke="#8c2f1b" stroke-width="3.5"/>
        <!-- Вушка з китичками -->
        <path d="M34,42 L28,16 L48,32 Z" fill="#e76f51" stroke="#8c2f1b" stroke-width="3"/>
        <path d="M68,42 L74,16 L54,32 Z" fill="#e76f51" stroke="#8c2f1b" stroke-width="3"/>
        <!-- Голова та тіло -->
        <ellipse cx="52" cy="64" rx="28" ry="26" fill="#f4a261" stroke="#8c2f1b" stroke-width="3.5"/>
        <ellipse cx="52" cy="74" rx="18" ry="14" fill="#faedcd"/>
        <!-- Очі та носик -->
        <circle cx="40" cy="58" r="5" fill="#2b1406"/>
        <circle cx="38" cy="56" r="2" fill="#fff"/>
        <circle cx="64" cy="58" r="5" fill="#2b1406"/>
        <circle cx="62" cy="56" r="2" fill="#fff"/>
        <circle cx="52" cy="68" r="4.5" fill="#582f0e"/>
        <!-- Жолудь у лапках -->
        <circle cx="52" cy="90" r="9" fill="#bc6c25" stroke="#582f0e" stroke-width="2.5"/>
        <path d="M41,86 Q52,78 63,86 Z" fill="#606c38" stroke="#283618" stroke-width="2.5"/>
      </svg>`
    }
  ];

  /* =========================================================================
     ГЕНЕРАТОР ХУДОЖНЬОГО SVG-ЧИСЛА (1–9) ДЛЯ ПРАВОЇ ТАБЛИЦІ
     ========================================================================= */
  const NUMBER_COLORS = [
    { fill: '#ff595e', stroke: '#800f2f' }, // 1
    { fill: '#ff924c', stroke: '#7f2f08' }, // 2
    { fill: '#ffca3a', stroke: '#7f4f24' }, // 3
    { fill: '#8ac926', stroke: '#1b4332' }, // 4
    { fill: '#52b788', stroke: '#081c15' }, // 5
    { fill: '#1982c4', stroke: '#03045e' }, // 6
    { fill: '#4cc9f0', stroke: '#1d3557' }, // 7
    { fill: '#9b5de5', stroke: '#3c096c' }, // 8
    { fill: '#f15bb5', stroke: '#641220' }  // 9
  ];

  function createNumberSVG(num) {
    const style = NUMBER_COLORS[(num - 1) % NUMBER_COLORS.length];
    return `
      <svg viewBox="0 0 120 120">
        <!-- Декоративний листовий щит під цифрою -->
        <circle cx="60" cy="60" r="44" fill="rgba(255, 248, 225, 0.45)" stroke="${style.stroke}" stroke-width="3" stroke-dasharray="8 5"/>
        <!-- Об'ємна цифра -->
        <text x="60" y="64"
              text-anchor="middle"
              dominant-baseline="central"
              font-family="'Comic Sans MS', 'Chalkboard SE', sans-serif"
              font-size="72"
              font-weight="900"
              fill="${style.fill}"
              stroke="${style.stroke}"
              stroke-width="4"
              paint-order="stroke fill">
          ${num}
        </text>
      </svg>
    `;
  }

  /* =========================================================================
     ЗВУКОВИЙ СИНТЕЗАТОР WEB AUDIO API (РІЗНОМАНІТНІ МУЗИЧНІ ФІДБЕКИ БЕЗ СЛІВ)
     ========================================================================= */
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // Мелодійний звук при підсвічуванні клітинки (кожна клітинка має свій тон маримби + дзвіночка)
  function playMatchSound(index, isActivating) {
    initAudio();
    const now = audioCtx.currentTime;
    // Пентатонічна гама для приємного дитячого звучання
    const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99];
    const baseFreq = scale[index % scale.length];

    if (isActivating) {
      // Двонотна радісна іскра
      [baseFreq, baseFreq * 1.25, baseFreq * 1.5].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = i === 0 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.055);

        gain.gain.setValueAtTime(0.22, now + i * 0.055);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.055 + 0.32);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.055);
        osc.stop(now + i * 0.055 + 0.34);
      });
    } else {
      // М'який дерев'яний клік при вимкненні підсвічування
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(baseFreq * 0.9, now);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, now + 0.14);

      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.16);
    }
  }

  // Святкова фанфара, коли підсвічені всі 9 клітинок
  function playVictoryFanfare() {
    initAudio();
    const now = audioCtx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + i * 0.09);

      gain.gain.setValueAtTime(0.25, now + i * 0.09);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.45);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + i * 0.09);
      osc.stop(now + i * 0.09 + 0.46);
    });
  }

  // Звук перемикання рівня (кнопки Назад / Далі)
  function playWhooshSound() {
    initAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(280, now);
    osc.frequency.exponentialRampToValueAtTime(560, now + 0.16);

    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.19);
  }

  /* =========================================================================
     СИСТЕМА ЧАСТИНОК (ЗІРОЧКИ ТА ЛИСТОЧКИ ПРИ КЛІКАХ)
     ========================================================================= */
  const canvas = document.getElementById('particles-layer');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function spawnBurst(x, y, color) {
    for (let i = 0; i < 18; i++) {
      const angle = (Math.PI * 2 * i) / 18 + (Math.random() - 0.5) * 0.3;
      const speed = 3 + Math.random() * 6;
      particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1.5,
        size: 6 + Math.random() * 7,
        color,
        alpha: 1,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.2
      });
    }
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.18; // гравітація
      p.alpha -= 0.022;
      p.rot += p.vRot;

      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;

      // Малюємо чотирикутну зірочку-іскру
      ctx.beginPath();
      for (let s = 0; s < 4; s++) {
        ctx.lineTo(Math.cos((s * Math.PI) / 2) * p.size, Math.sin((s * Math.PI) / 2) * p.size);
        ctx.lineTo(Math.cos(((s + 0.5) * Math.PI) / 2) * (p.size * 0.4), Math.sin(((s + 0.5) * Math.PI) / 2) * (p.size * 0.4));
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  /* =========================================================================
     ЕМІЦІЇ ТА РЕАКЦІЇ ПЕРСОНАЖА (ЛИСЕНЯТИ)
     ========================================================================= */
  const characterBox = document.getElementById('character-box');
  const eyesNormal = document.getElementById('fox-eyes-normal');
  const eyesHappy = document.getElementById('fox-eyes-happy');
  let foxTimeout = null;

  function triggerFoxReaction() {
    characterBox.classList.remove('fox-happy');
    void characterBox.offsetWidth; // перезапуск CSS-анімації
    characterBox.classList.add('fox-happy');

    eyesNormal.style.display = 'none';
    eyesHappy.style.display = 'block';

    clearTimeout(foxTimeout);
    foxTimeout = setTimeout(() => {
      characterBox.classList.remove('fox-happy');
      eyesNormal.style.display = 'block';
      eyesHappy.style.display = 'none';
    }, 650);
  }

  // По кліку на самого лисенятка він теж радісно підстрибує
  characterBox.addEventListener('click', (e) => {
    const rect = characterBox.getBoundingClientRect();
    spawnBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, '#ffbe0b');
    playMatchSound(4, true);
    triggerFoxReaction();
  });

  /* =========================================================================
     ЛОГІКА БЕЗКІНЕЧНОГО ГЕНЕРАТОРА ТА ІСТОРІЇ РІВНІВ (НАЗАД / ДАЛІ)
     ========================================================================= */
  const animalsBoard = document.getElementById('animals-board');
  const numbersBoard = document.getElementById('numbers-board');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');

  // Історія згенерованих рівнів для роботи кнопки "Назад"
  const history = [];
  let currentLevelIndex = -1;

  // Допоміжна функція перемішування масиву (алгоритм Фішера-Єйтса)
  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // Створення нового випадкового розкладу для обох таблиць 3x3
  function generateLevelData() {
    const chosenAnimals = shuffleArray(SVG_ANIMALS).slice(0, 9);
    const shuffledNumbers = shuffleArray([1, 2, 3, 4, 5, 6, 7, 8, 9]);
    return {
      animals: chosenAnimals,
      numbers: shuffledNumbers,
      activeCells: new Array(9).fill(false) // які пари клітинок зараз підсвічені
    };
  }

  // Відображення поточного рівня на дошках
  function renderCurrentLevel() {
    const level = history[currentLevelIndex];

    // Очищуємо попередні клітинки (залишаючи кутові декоративні листочки)
    animalsBoard.querySelectorAll('.cell').forEach(el => el.remove());
    numbersBoard.querySelectorAll('.cell').forEach(el => el.remove());

    const animalCells = [];
    const numberCells = [];

    for (let i = 0; i < 9; i++) {
      const palette = GLOW_PALETTES[i % GLOW_PALETTES.length];

      // 1. Створюємо клітинку з тваринкою
      const aCell = document.createElement('div');
      aCell.className = 'cell';
      aCell.innerHTML = level.animals[i].svg;
      applyPaletteVariables(aCell, palette);

      // 2. Створюємо тотожну клітинку з числом
      const nCell = document.createElement('div');
      nCell.className = 'cell';
      nCell.innerHTML = createNumberSVG(level.numbers[i]);
      applyPaletteVariables(nCell, palette);

      // Відновлюємо стан підсвічування, якщо повернулися назад
      if (level.activeCells[i]) {
        aCell.classList.add('active-match');
        nCell.classList.add('active-match');
      }

      // Обробник кліку: натискання на будь-яку з двох клітинок підсвічує обидві тотожні клітинки
      const handleCellClick = () => {
        level.activeCells[i] = !level.activeCells[i];
        const isNowActive = level.activeCells[i];

        aCell.classList.toggle('active-match', isNowActive);
        nCell.classList.toggle('active-match', isNowActive);

        playMatchSound(i, isNowActive);
        triggerFoxReaction();

        if (isNowActive) {
          // Салют із зірочок над обома тотожними клітинками одночасно
          const rectA = aCell.getBoundingClientRect();
          const rectN = nCell.getBoundingClientRect();
          spawnBurst(rectA.left + rectA.width / 2, rectA.top + rectA.height / 2, palette.color);
          spawnBurst(rectN.left + rectN.width / 2, rectN.top + rectN.height / 2, palette.color);

          // Якщо підсвічені всі 9 клітинок — додатковий святковий ефект
          if (level.activeCells.every(Boolean)) {
            setTimeout(playVictoryFanfare, 220);
          }
        }
      };

      aCell.addEventListener('click', handleCellClick);
      nCell.addEventListener('click', handleCellClick);

      animalsBoard.appendChild(aCell);
      numbersBoard.appendChild(nCell);

      animalCells.push(aCell);
      numberCells.push(nCell);
    }

    // Оновлюємо доступність кнопки "Назад"
    btnPrev.disabled = currentLevelIndex <= 0;
  }

  // Передача кольорів підсвічування у CSS-змінні клітинки
  function applyPaletteVariables(el, palette) {
    el.style.setProperty('--glow-color', palette.color);
    el.style.setProperty('--glow-inner', palette.inner);
    el.style.setProperty('--glow-mid', palette.mid);
    el.style.setProperty('--glow-outer', palette.outer);
    el.style.setProperty('--glow-border', palette.border);
    el.style.setProperty('--glow-shadow', palette.shadow);
  }

  // Перехід на наступний рівень (або генерація нового)
  function goNextLevel() {
    playWhooshSound();
    triggerFoxReaction();
    if (currentLevelIndex < history.length - 1) {
      currentLevelIndex++;
    } else {
      history.push(generateLevelData());
      currentLevelIndex++;
    }
    renderCurrentLevel();
  }

  // Повернення на попередній рівень
  function goPrevLevel() {
    if (currentLevelIndex > 0) {
      playWhooshSound();
      triggerFoxReaction();
      currentLevelIndex--;
      renderCurrentLevel();
    }
  }

  btnNext.addEventListener('click', goNextLevel);
  btnPrev.addEventListener('click', goPrevLevel);

  // Підтримка стрілок клавіатури для швидкого перемикання під час уроку
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') goNextLevel();
    if (e.key === 'ArrowLeft') goPrevLevel();
  });

  // Перший запуск генератора
  history.push(generateLevelData());
  currentLevelIndex = 0;
  renderCurrentLevel();
</script>
