<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Логічне групування</title>
    <!-- Firebase Compat Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        /* Оригінальні стилі */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2c1e16;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #table-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(to right, rgba(255,255,255,0) 98%, rgba(0,0,0,0.4) 100%),
                repeating-linear-gradient(90deg, #5c3a21 0px, #5c3a21 100px, #4a2e19 102px, #4a2e19 104px),
                linear-gradient(to bottom, #7a4f32, #3d2512);
            background-blend-mode: overlay;
            z-index: 1;
        }

        #tablecloth {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 25%;
            background: 
                repeating-linear-gradient(45deg, #c73e3e 25%, transparent 25%, transparent 75%, #c73e3e 75%, #c73e3e),
                repeating-linear-gradient(45deg, #c73e3e 25%, transparent 25%, transparent 75%, #c73e3e 75%, #c73e3e);
            background-position: 0 0, 20px 20px;
            background-size: 40px 40px;
            background-color: #e5cdcd;
            border-bottom: 8px solid #9e2a2a;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 2;
        }

        #task-text {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-align: center;
            width: 90%;
            text-shadow: 3px 3px 0 #8b2323, -2px -2px 0 #8b2323, 2px -2px 0 #8b2323, -2px 2px 0 #8b2323, 0px 5px 15px rgba(0,0,0,0.8);
            pointer-events: none;
            line-height: 1.3;
        }

        #game-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: transparent;
        }

        .figure {
            position: absolute;
            cursor: grab;
            filter: drop-shadow(5px 15px 10px rgba(0,0,0,0.6));
            transition: filter 0.2s, transform 0.1s;
            user-select: none;
        }

        .figure:active {
            cursor: grabbing;
            filter: drop-shadow(15px 25px 15px rgba(0,0,0,0.8));
            transform: scale(1.05);
        }

        .eye-white { fill: #ffffff; }
        .pupil { fill: #1a1a1a; }
        .mouth-smile { stroke: #331a00; stroke-width: 3; fill: none; stroke-linecap: round; }
        .mouth-surprise { fill: #331a00; display: none; }
        
        .dragging .mouth-smile { display: none; }
        .dragging .mouth-surprise { display: block; }

        /* --- НОВІ СТИЛІ: Theme Manager --- */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: #34495e;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            z-index: 100000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid white;
        }
        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            max-height: 60vh;
            background: #fff;
            border-radius: 10px;
            z-index: 100001;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow-y: auto;
            font-family: Arial, sans-serif;
        }
        #theme-modal h3 { margin-top: 0; text-align: center; }
        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #333;
        }
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }
        .theme-item {
            position: relative;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid transparent;
            height: 80px;
            background-size: cover;
            background-position: center;
            background-color: #ccc;
        }
        .theme-item:hover { border-color: #3498db; }
        .theme-item span {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.6);
            color: white;
            text-align: center;
            font-size: 12px;
            padding: 4px 0;
        }

        /* --- НОВІ СТИЛІ: Малювання --- */
        #drawing-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 90000;
            pointer-events: none; /* Увімкнеться при активації */
        }
        #toggle-draw-btn-global {
            position: fixed;
            bottom: 85px;
            right: 20px;
            background-color: #8e44ad;
            color: white;
            border: 2px solid white;
            border-radius: 25px;
            padding: 10px 15px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            cursor: pointer;
            z-index: 100000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            font-weight: bold;
        }
        #draw-panel-global {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 100002;
            font-family: Arial, sans-serif;
            padding: 10px;
            width: 250px;
        }
        .draw-panel-header {
            cursor: grab;
            background: #eee;
            padding: 5px;
            text-align: center;
            border-radius: 4px;
            margin-bottom: 10px;
            font-weight: bold;
            position: relative;
        }
        .draw-panel-header:active { cursor: grabbing; }
        .close-draw-panel {
            position: absolute;
            right: 5px;
            top: 5px;
            cursor: pointer;
            color: #d35400;
        }
        .draw-controls { display: flex; flex-direction: column; gap: 10px; }
        .draw-row { display: flex; justify-content: space-between; gap: 5px; }
        .draw-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f9f9f9;
            cursor: pointer;
            font-weight: bold;
        }
        .draw-btn.active { background: #3498db; color: white; border-color: #2980b9; }

        /* --- НОВІ СТИЛІ: Блокування --- */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 999999;
            color: red;
            font-size: 40px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Адаптивність */
        @media (max-width: 600px) {
            #task-text { font-size: 20px; top: 15px; }
            #theme-btn { width: 40px; height: 40px; font-size: 20px; bottom: 10px; right: 10px; }
            #toggle-draw-btn-global { bottom: 60px; right: 10px; font-size: 14px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

    <!-- Фон гри -->
    <div id="table-background"></div>
    <div id="tablecloth"></div>
    
    <!-- Завдання -->
    <div id="task-text">Розділи на дві групи за різними ознаками трьома способами.</div>

    <!-- Область гри -->
    <div id="game-area"></div>

    <!-- Полотно для малювання -->
    <canvas id="drawing-canvas"></canvas>

    <!-- Інтерфейс: Кнопки та Модалки -->
    <div id="theme-btn" onclick="openThemeModal()">⚙️</div>
    <div id="theme-modal">
        <span class="close-modal" onclick="closeThemeModal()">✕</span>
        <h3>Обери фон</h3>
        <div class="theme-grid" id="theme-grid"></div>
    </div>

    <button id="toggle-draw-btn-global" onclick="openDrawPanel()">✏️ Малювати</button>
    <div id="draw-panel-global">
        <div class="draw-panel-header" id="draw-panel-header">Перетягни мене <span class="close-draw-panel" onclick="closeDrawPanel()">✕</span></div>
        <div class="draw-controls">
            <div class="draw-row">
                <button class="draw-btn active" id="tool-pencil" onclick="setDrawTool('pencil')">✏️ Олівець</button>
                <button class="draw-btn" id="tool-eraser" onclick="setDrawTool('eraser')">🧽 Гумка</button>
            </div>
            <input type="range" id="draw-size" min="1" max="50" value="5" onchange="updateDrawSettings()">
            <input type="color" id="draw-color" value="#ff0000" onchange="updateDrawSettings()">
            <button class="draw-btn" onclick="clearCanvas(true)">🗑️ Очистити</button>
        </div>
    </div>

    <!-- Екран-заглушка -->
    <div id="block-overlay">Зачекай! Зараз не твій урок.</div>

    <script>
        /* =========================================
           1. НАЛАШТУВАННЯ ІГРИ ТА FIREBASE
        ========================================= */
        const CONFIG = {
            gameId: "oznaky_figur_001", // Унікальний ідентифікатор гри
            firebaseConfig: {
                databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
                projectId: "lesson-13c44"
            }
        };

        let db = null;
        let isFirebaseActive = false;

        try {
            firebase.initializeApp(CONFIG.firebaseConfig);
            db = firebase.database();
            isFirebaseActive = true;
        } catch (e) {
            console.warn("Firebase не підключено. Гра працюватиме локально.");
        }

        /* =========================================
           2. УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ (Радар)
        ========================================= */
        let myName = "";
        function initUser() {
            const urlParams = new URLSearchParams(window.location.search);
            let userFromUrl = urlParams.get('user');
            if (userFromUrl) {
                myName = userFromUrl;
                sessionStorage.setItem('userName', myName);
            } else {
                myName = sessionStorage.getItem('userName');
                if (!myName) {
                    myName = "Гість_" + Math.floor(Math.random() * 1000);
                    sessionStorage.setItem('userName', myName);
                }
            }
        }
        initUser();

        if (isFirebaseActive) {
            const tabId = Math.random().toString(36).substr(2, 9);
            const userRef = db.ref('online_users/' + myName + '/' + tabId);
            const connectedRef = db.ref('.info/connected');

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    userRef.set({
                        game: "Логічне групування",
                        connectedAt: firebase.database.ServerValue.TIMESTAMP
                    });
                    userRef.onDisconnect().remove();
                }
            });

            window.addEventListener('beforeunload', () => userRef.remove());

            // Блокування
            db.ref('blocked_users/' + myName).on('value', (snap) => {
                const overlay = document.getElementById('block-overlay');
                if (snap.val() === true) {
                    overlay.style.display = 'flex';
                } else {
                    overlay.style.display = 'none';
                }
            });

            // Повернення в лобі (Імунітет 1 сек)
            let immunity = true;
            setTimeout(() => { immunity = false; }, 1000);
            
            db.ref('current_activity').on('value', (snap) => {
                if (immunity) return;
                if (snap.val() === 'lobby') {
                    window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
                }
            });

            // Force refresh
            db.ref('force_refresh').on('value', (snap) => {
                if (snap.val() && !immunity) window.location.reload();
            });
        }

        /* =========================================
           3. СИСТЕМА ДИНАМІЧНИХ ФОНІВ
        ========================================= */
        let savedBg = localStorage.getItem('mySavedBg_' + CONFIG.gameId);
        if (savedBg) applyBackground(savedBg);

        if (isFirebaseActive) {
            db.ref('game_theme').on('value', (snap) => {
                const themeUrl = snap.val();
                if (themeUrl) applyBackground(themeUrl);
            });
        }

        function applyBackground(url) {
            if (url === 'none') {
                document.body.style.backgroundImage = 'none';
                document.getElementById('table-background').style.display = 'block';
                document.getElementById('tablecloth').style.display = 'block';
            } else {
                document.body.style.backgroundImage = `url(${url})`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.getElementById('table-background').style.display = 'none';
                document.getElementById('tablecloth').style.display = 'none';
            }
        }

        function openThemeModal() {
            document.getElementById('theme-modal').style.display = 'block';
            loadThemeGallery();
        }

        function closeThemeModal() {
            document.getElementById('theme-modal').style.display = 'none';
        }

        let galleryLoaded = false;
        async function loadThemeGallery() {
            if (galleryLoaded) return;
            const grid = document.getElementById('theme-grid');
            
            // Опція "Без фону"
            const noBg = document.createElement('div');
            noBg.className = 'theme-item';
            noBg.style.backgroundColor = '#ccc';
            noBg.innerHTML = '<span>Без фону</span>';
            noBg.onclick = () => selectTheme('none');
            grid.appendChild(noBg);

            // Асинхронне завантаження фонів
            let found = true;
            let i = 1;
            while(found && i <= 100) { // Обмежимо 100 для швидкодії
                const url = `https://olgazheltvai2.github.io/images/backgrounds/background_${i}.webp`;
                try {
                    const res = await fetch(url, { method: 'HEAD' });
                    if (res.ok) {
                        const item = document.createElement('div');
                        item.className = 'theme-item';
                        item.style.backgroundImage = `url(${url})`;
                        item.innerHTML = `<span>Фон ${i}</span>`;
                        item.onclick = () => selectTheme(url);
                        grid.appendChild(item);
                        i++;
                    } else {
                        found = false;
                    }
                } catch(e) {
                    found = false;
                }
            }
            galleryLoaded = true;
        }

        function selectTheme(url) {
            applyBackground(url);
            localStorage.setItem('mySavedBg_' + CONFIG.gameId, url);
            if (isFirebaseActive) {
                db.ref('game_theme').set(url);
            }
            closeThemeModal();
        }

        /* =========================================
           4. ГЛОБАЛЬНИЙ ІНСТРУМЕНТ МАЛЮВАННЯ
        ========================================= */
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawingMode = false;
        let isDrawing = false;
        let drawTool = 'pencil';
        let drawColor = '#ff0000';
        let drawSize = 5;
        let lastX = 0, lastY = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function openDrawPanel() {
            document.getElementById('draw-panel-global').style.display = 'block';
            canvas.style.pointerEvents = 'auto'; // Вмикаємо малювання
            isDrawingMode = true;
        }

        function closeDrawPanel() {
            document.getElementById('draw-panel-global').style.display = 'none';
            canvas.style.pointerEvents = 'none'; // Вимикаємо малювання
            isDrawingMode = false;
        }

        function setDrawTool(tool) {
            drawTool = tool;
            document.getElementById('tool-pencil').classList.remove('active');
            document.getElementById('tool-eraser').classList.remove('active');
            document.getElementById('tool-' + tool).classList.add('active');
        }

        function updateDrawSettings() {
            drawSize = document.getElementById('draw-size').value;
            drawColor = document.getElementById('draw-color').value;
        }

        // Перетягування панелі малювання
        const drawPanel = document.getElementById('draw-panel-global');
        const drawHeader = document.getElementById('draw-panel-header');
        let isDraggingPanel = false, panOffsetX = 0, panOffsetY = 0;

        drawHeader.addEventListener('mousedown', (e) => {
            isDraggingPanel = true;
            panOffsetX = e.clientX - drawPanel.getBoundingClientRect().left;
            panOffsetY = e.clientY - drawPanel.getBoundingClientRect().top;
        });
        document.addEventListener('mousemove', (e) => {
            if (isDraggingPanel) {
                drawPanel.style.left = (e.clientX - panOffsetX) + 'px';
                drawPanel.style.top = (e.clientY - panOffsetY) + 'px';
            }
        });
        document.addEventListener('mouseup', () => isDraggingPanel = false);
        
        // Підтримка Touch для панелі
        drawHeader.addEventListener('touchstart', (e) => {
            isDraggingPanel = true;
            panOffsetX = e.touches[0].clientX - drawPanel.getBoundingClientRect().left;
            panOffsetY = e.touches[0].clientY - drawPanel.getBoundingClientRect().top;
        }, {passive: false});
        document.addEventListener('touchmove', (e) => {
            if (isDraggingPanel) {
                drawPanel.style.left = (e.touches[0].clientX - panOffsetX) + 'px';
                drawPanel.style.top = (e.touches[0].clientY - panOffsetY) + 'px';
            }
        }, {passive: false});
        document.addEventListener('touchend', () => isDraggingPanel = false);


        // Логіка малювання
        function startDrawing(e) {
            if (!isDrawingMode) return;
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x; lastY = pos.y;
        }

        function draw(e) {
            if (!isDrawing || !isDrawingMode) return;
            e.preventDefault();
            const pos = getPos(e);
            
            drawLine(lastX, lastY, pos.x, pos.y, drawTool, drawColor, drawSize, false);
            
            if (isFirebaseActive) {
                sendGameAction('draw_line', {
                    x0: lastX / canvas.width, y0: lastY / canvas.height,
                    x1: pos.x / canvas.width, y1: pos.y / canvas.height,
                    tool: drawTool, color: drawColor, size: drawSize
                });
            }
            
            lastX = pos.x; lastY = pos.y;
        }

        function stopDrawing() { isDrawing = false; }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function drawLine(x0, y0, x1, y1, tool, color, size, isRemote) {
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.lineCap = 'round';
            ctx.lineWidth = size;
            
            if (tool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = size * 2;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
            }
            ctx.stroke();
            ctx.globalCompositeOperation = 'source-over';
        }

        function clearCanvas(sync = false) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (sync && isFirebaseActive) sendGameAction('clear_canvas', {});
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        canvas.addEventListener('touchend', stopDrawing);

        /* =========================================
           5. ОРИГІНАЛЬНА ЛОГІКА ТА СИНХРОНІЗАЦІЯ ФІГУР
        ========================================= */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'grab') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'drop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            }
        }

        const figureData = [
            { id: 'gc1', type: 'cone', size: 'large', color: 'green', x: 10, y: 40 },
            { id: 'gc2', type: 'cone', size: 'large', color: 'green', x: 25, y: 65 },
            { id: 'sc1', type: 'cone', size: 'small', color: 'green', x: 45, y: 50 },
            { id: 'sc2', type: 'cone', size: 'small', color: 'green', x: 60, y: 75 },
            { id: 'gcy1', type: 'cylinder', size: 'large', color: 'green', x: 75, y: 35 },
            { id: 'pcy1', type: 'cylinder', size: 'small', color: 'pink', x: 85, y: 60 }
        ];

        const gameArea = document.getElementById('game-area');
        const eyesControllers = [];
        const figureElements = {}; // Зберігаємо посилання для швидкого доступу при синхронізації

        function createFigure(data) {
            const container = document.createElement('div');
            container.className = 'figure';
            container.id = data.id;
            figureElements[data.id] = container;
            
            const isLarge = data.size === 'large';
            const width = isLarge ? 140 : 90;
            const height = isLarge ? 200 : 130;
            
            let gradMain, gradLight, gradDark;
            if (data.color === 'green') {
                gradMain = ['#2ea838', '#0f6115'];
                gradLight = ['#4ade57', '#228f2c'];
                gradDark = '#093d0d';
            } else {
                gradMain = ['#e84a94', '#9e1a57'];
                gradLight = ['#ff7ab9', '#c42e76'];
                gradDark = '#630b33';
            }

            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("width", width);
            svg.setAttribute("height", height);
            svg.setAttribute("viewBox", `0 0 100 120`);
            
            const defs = document.createElementNS(svgNS, "defs");
            const gradId = `grad-${data.id}`;
            const gradTopId = `gradTop-${data.id}`;
            
            defs.innerHTML = `
                <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="${gradMain[0]}" />
                    <stop offset="80%" stop-color="${gradMain[1]}" />
                    <stop offset="100%" stop-color="${gradDark}" />
                </linearGradient>
                <linearGradient id="${gradTopId}" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="${gradLight[0]}" />
                    <stop offset="100%" stop-color="${gradLight[1]}" />
                </linearGradient>
            `;
            svg.appendChild(defs);

            const bodyGroup = document.createElementNS(svgNS, "g");

            if (data.type === 'cone') {
                bodyGroup.innerHTML = `
                    <path d="M 50 10 L 90 100 A 40 15 0 0 1 10 100 Z" fill="url(#${gradId})" />
                    <ellipse cx="50" cy="100" rx="40" ry="15" fill="${gradDark}" opacity="0.3" />
                `;
            } else {
                bodyGroup.innerHTML = `
                    <path d="M 10 20 L 10 100 A 40 15 0 0 0 90 100 L 90 20 A 40 15 0 0 1 10 20 Z" fill="url(#${gradId})" />
                    <ellipse cx="50" cy="20" rx="40" ry="15" fill="url(#${gradTopId})" />
                `;
            }
            svg.appendChild(bodyGroup);

            const faceY = data.type === 'cone' ? 75 : 60; 
            
            const faceGroup = document.createElementNS(svgNS, "g");
            
            faceGroup.innerHTML += `
                <circle cx="38" cy="${faceY}" r="8" class="eye-white" />
                <circle cx="62" cy="${faceY}" r="8" class="eye-white" />
            `;
            
            const pupilL = document.createElementNS(svgNS, "circle");
            pupilL.setAttribute("cx", "38");
            pupilL.setAttribute("cy", faceY);
            pupilL.setAttribute("r", "3.5");
            pupilL.setAttribute("class", "pupil");
            
            const pupilR = document.createElementNS(svgNS, "circle");
            pupilR.setAttribute("cx", "62");
            pupilR.setAttribute("cy", faceY);
            pupilR.setAttribute("r", "3.5");
            pupilR.setAttribute("class", "pupil");
            
            faceGroup.appendChild(pupilL);
            faceGroup.appendChild(pupilR);

            faceGroup.innerHTML += `
                <path d="M 40 ${faceY + 12} Q 50 ${faceY + 22} 60 ${faceY + 12}" class="mouth-smile" />
                <circle cx="50" cy="${faceY + 15}" r="6" class="mouth-surprise" />
            `;

            svg.appendChild(faceGroup);
            container.appendChild(svg);
            
            container.style.left = `${data.x}vw`;
            container.style.top = `${data.y}vh`;

            eyesControllers.push({
                pupilL: pupilL,
                pupilR: pupilR,
                baseL: { x: 38, y: faceY },
                baseR: { x: 62, y: faceY },
                radius: 4,
                currentL: { dx: 0, dy: 0 },
                currentR: { dx: 0, dy: 0 },
                targetL: { dx: 0, dy: 0 },
                targetR: { dx: 0, dy: 0 },
                speedL: 0.05 + Math.random() * 0.1,
                speedR: 0.05 + Math.random() * 0.1,
                nextMoveTime: Date.now() + Math.random() * 2000
            });

            makeDraggable(container);
            gameArea.appendChild(container);
        }

        figureData.forEach(createFigure);

        let activeEl = null;
        let offsetX = 0, offsetY = 0;
        let highestZ = 20;

        function makeDraggable(el) {
            function dragStart(e) {
                if (isDrawingMode) return; // Блокуємо перетягування фігур під час малювання
                if (e.type === "touchstart") e.preventDefault();
                activeEl = el;
                highestZ++;
                activeEl.style.zIndex = highestZ;
                activeEl.classList.add('dragging');
                playSound('grab');

                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                
                const rect = activeEl.getBoundingClientRect();
                offsetX = clientX - rect.left;
                offsetY = clientY - rect.top;

                if (isFirebaseActive) {
                    sendGameAction('figure_drag_start', { id: activeEl.id, z: highestZ });
                }
            }

            el.addEventListener('mousedown', dragStart);
            el.addEventListener('touchstart', dragStart, {passive: false});
        }

        function dragMove(e) {
            if (!activeEl) return;
            e.preventDefault();

            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            const newLeft = clientX - offsetX;
            const newTop = clientY - offsetY;

            activeEl.style.left = `${newLeft}px`;
            activeEl.style.top = `${newTop}px`;

            // Синхронізація всього шляху руху
            if (isFirebaseActive) {
                sendGameAction('figure_move', { 
                    id: activeEl.id, 
                    xPx: newLeft, 
                    yPx: newTop 
                });
            }
        }

        function dragEnd(e) {
            if (!activeEl) return;
            activeEl.classList.remove('dragging');
            playSound('drop');
            
            if (isFirebaseActive) {
                sendGameAction('figure_drag_end', { id: activeEl.id });
            }
            activeEl = null;
        }

        document.addEventListener('mousemove', dragMove);
        document.addEventListener('touchmove', dragMove, {passive: false});
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);

        function animateEyes() {
            const now = Date.now();
            
            eyesControllers.forEach(eye => {
                if (now > eye.nextMoveTime) {
                    const angleL = Math.random() * Math.PI * 2;
                    const rL = Math.random() * eye.radius;
                    eye.targetL = { dx: Math.cos(angleL) * rL, dy: Math.sin(angleL) * rL };
                    
                    const angleR = Math.random() * Math.PI * 2;
                    const rR = Math.random() * eye.radius;
                    eye.targetR = { dx: Math.cos(angleR) * rR, dy: Math.sin(angleR) * rR };

                    eye.nextMoveTime = now + 500 + Math.random() * 2500;
                    
                    eye.speedL = 0.05 + Math.random() * 0.15;
                    eye.speedR = 0.05 + Math.random() * 0.15;
                }

                eye.currentL.dx += (eye.targetL.dx - eye.currentL.dx) * eye.speedL;
                eye.currentL.dy += (eye.targetL.dy - eye.currentL.dy) * eye.speedL;
                
                eye.currentR.dx += (eye.targetR.dx - eye.currentR.dx) * eye.speedR;
                eye.currentR.dy += (eye.targetR.dy - eye.currentR.dy) * eye.speedR;

                eye.pupilL.setAttribute("cx", eye.baseL.x + eye.currentL.dx);
                eye.pupilL.setAttribute("cy", eye.baseL.y + eye.currentL.dy);
                
                eye.pupilR.setAttribute("cx", eye.baseR.x + eye.currentR.dx);
                eye.pupilR.setAttribute("cy", eye.baseR.y + eye.currentR.dy);
            });

            requestAnimationFrame(animateEyes);
        }
        animateEyes();

        /* =========================================
           6. СЛУХАЧ FIREBASE ДЛЯ СИНХРОНІЗАЦІЇ ЛОГІКИ
        ========================================= */
        function sendGameAction(type, data) {
            if (!isFirebaseActive) return;
            db.ref('game_action').set({
                senderId: myName,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                type: type,
                data: data
            });
        }

        if (isFirebaseActive) {
            db.ref('game_action').on('value', (snap) => {
                const action = snap.val();
                if (!action) return;
                
                const isRemoteAction = action.senderId !== myName;
                if (!isRemoteAction) return; // Запобігання зацикленню
                
                // Синхронізація малювання
                if (action.type === 'draw_line') {
                    const d = action.data;
                    drawLine(
                        d.x0 * canvas.width, d.y0 * canvas.height, 
                        d.x1 * canvas.width, d.y1 * canvas.height, 
                        d.tool, d.color, d.size, true
                    );
                } else if (action.type === 'clear_canvas') {
                    clearCanvas(false);
                }
                
                // Синхронізація фігур
                else if (action.type === 'figure_drag_start') {
                    const el = figureElements[action.data.id];
                    if (el) {
                        el.style.zIndex = action.data.z;
                        el.classList.add('dragging');
                        playSound('grab');
                    }
                } else if (action.type === 'figure_move') {
                    const el = figureElements[action.data.id];
                    if (el) {
                        el.style.left = action.data.xPx + 'px';
                        el.style.top = action.data.yPx + 'px';
                    }
                } else if (action.type === 'figure_drag_end') {
                    const el = figureElements[action.data.id];
                    if (el) {
                        el.classList.remove('dragging');
                        playSound('drop');
                    }
                }
            });
        }

    </script>
</body>
</html>
