<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Sea Research</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Roboto:wght@700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Roboto', sans-serif;
            user-select: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        /* Realistic Metal Console */
        .console-panel {
            position: relative;
            width: 85%;
            max-width: 1100px;
            background: linear-gradient(135deg, #3a3d40 0%, #1f2123 50%, #2a2c2e 100%);
            border-radius: 30px;
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.9),
                inset 0 2px 5px rgba(255,255,255,0.2),
                inset 0 -5px 15px rgba(0,0,0,0.8);
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            pointer-events: auto;
            border: 4px solid #111;
        }

        /* Decorative rivets on corners */
        .console-panel::before {
            content: '';
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 30% 30%, #888, #333);
            border-radius: 50%;
            box-shadow: inset 0 -2px 4px rgba(0,0,0,0.8), 0 1px 2px rgba(255,255,255,0.3);
        }

        /* Glass Screen */
        .screen-frame {
            width: 100%;
            background: #111;
            border-radius: 15px;
            padding: 10px;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.9);
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .screen {
            width: 100%;
            min-height: 220px; /* Збільшено для великого тексту */
            background: rgba(10, 25, 20, 0.95);
            border: 2px solid #0f3325;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: inset 0 0 40px rgba(0, 255, 150, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        
        /* Glass Glare */
        .screen::after {
            content: '';
            position: absolute;
            top: 0; left: -50%; width: 200%; height: 100%;
            background: linear-gradient(90deg, transparent 40%, rgba(255,255,255,0.05) 50%, transparent 60%);
            pointer-events: none;
            transform: skewX(-20deg);
        }

        #question {
            color: #aaffdd;
            font-size: clamp(2.2rem, 3.5vw, 3.5rem); /* Збільшено розмір шрифту */
            text-align: center;
            line-height: 1.4;
            text-shadow: 0 0 10px rgba(0, 255, 150, 0.6);
            font-weight: 700;
            z-index: 2;
        }

        /* Tactile Keypad */
        #keypad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 800px;
        }

        .key {
            background: linear-gradient(180deg, #4a4d50, #2a2c2e);
            border: 1px solid #111;
            color: #ccc;
            font-size: 2.5rem; /* Збільшено розмір шрифту */
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.05s;
            box-shadow: 
                0 6px 0 #111,
                0 8px 10px rgba(0,0,0,0.6),
                inset 0 1px 1px rgba(255,255,255,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 0 -1px 0 rgba(0,0,0,0.8);
        }

        .key:active {
            transform: translateY(6px);
            box-shadow: 
                0 0 0 #111,
                0 2px 5px rgba(0,0,0,0.6),
                inset 0 2px 5px rgba(0,0,0,0.8);
            color: #fff;
        }

        .key.action {
            color: #ffaa00;
            background: linear-gradient(180deg, #504a40, #2e2a25);
        }
        
        .key.action:active {
            background: #ffaa00;
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 0 #111, 0 2px 5px rgba(0,0,0,0.6), inset 0 0 20px rgba(255, 170, 0, 0.6);
        }

        #answer-display {
            grid-column: span 5;
            height: 90px; /* Трохи збільшено висоту під великі цифри */
            background: #050a08;
            border-radius: 8px;
            border: 2px solid #0f3325;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5rem; /* Збільшено розмір шрифту */
            font-family: 'Roboto Mono', monospace;
            color: #00ff99;
            text-shadow: 0 0 15px #00ff99;
            letter-spacing: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
        }

        /* Feedback States */
        .screen.correct {
            background: rgba(15, 50, 35, 0.95);
            border-color: #00ff66;
            box-shadow: inset 0 0 60px rgba(0, 255, 100, 0.4);
        }

        .screen.wrong {
            background: rgba(50, 15, 15, 0.95);
            border-color: #ff3333;
            box-shadow: inset 0 0 60px rgba(255, 50, 50, 0.4);
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Language Toggle Switch */
        .lang-switch {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #111;
            border: 2px solid #333;
            border-radius: 20px;
            display: flex;
            padding: 2px;
            cursor: pointer;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
            z-index: 100;
            transition: all 0.3s;
        }

        .lang-opt {
            padding: 6px 14px;
            font-size: 16px; /* Збільшено розмір шрифту */
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            color: #555;
            border-radius: 15px;
            transition: all 0.3s;
        }

        .lang-opt.active {
            background: #00ff99;
            color: #000;
            box-shadow: 0 0 10px rgba(0, 255, 150, 0.5);
        }

        .lang-switch:hover {
            border-color: #555;
        }

        /* Skip Button (disguised as a screw) */
        #skip-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 28px;
            height: 28px;
            background: radial-gradient(circle at 30% 30%, #666, #222);
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            box-shadow: inset 0 -2px 4px rgba(0,0,0,0.8), 0 1px 2px rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            color: transparent;
            font-size: 16px;
            transition: all 0.3s;
        }

        #skip-btn::after {
            content: '';
            width: 14px;
            height: 2px;
            background: #111;
            transform: rotate(45deg);
        }

        #skip-btn:hover {
            background: radial-gradient(circle at 30% 30%, #888, #333);
            color: #fff;
        }
        #skip-btn:hover::after { display: none; }

        /* Ending Overlay */
        #ending-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 5, 10, 0.9);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 3s ease;
        }
        
        #ending-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div id="ui-container">
        <div class="console-panel">
            
            <div class="lang-switch" id="lang-btn" onclick="toggleLanguage()">
                <span class="lang-opt active" id="lang-uk">UA</span>
                <span class="lang-opt" id="lang-ru">RU</span>
            </div>
            
            <div class="screen-frame" style="margin-top: 15px;">
                <div class="screen" id="screen">
                    <div id="question">Initializing...</div>
                </div>
            </div>
            <div id="keypad">
                <div id="answer-display"></div>
                <div class="key" onclick="inputNum('1')">1</div>
                <div class="key" onclick="inputNum('2')">2</div>
                <div class="key" onclick="inputNum('3')">3</div>
                <div class="key" onclick="inputNum('4')">4</div>
                <div class="key" onclick="inputNum('5')">5</div>
                <div class="key" onclick="inputNum('6')">6</div>
                <div class="key" onclick="inputNum('7')">7</div>
                <div class="key" onclick="inputNum('8')">8</div>
                <div class="key" onclick="inputNum('9')">9</div>
                <div class="key" onclick="inputNum('0')">0</div>
                <div class="key action" onclick="clearInput()">C</div>
                <div class="key action" onclick="submitAnswer()" style="grid-column: span 4;">ENT</div>
            </div>
            
            <div id="skip-btn" onclick="nextTask(true)">»</div>
        </div>
    </div>
    
    <div id="ending-overlay"></div>

    <script>
        // --- Data (Tasks 9 and 10 removed) ---
        const tasks = [
            { ru: "17 — это 8 и какое число?", uk: "17 — це 8 і яке число?", answer: "9" },
            { ru: "На сколько 12 больше, чем 8?", uk: "На скільки 12 більше, ніж 8?", answer: "4" },
            { ru: "1 дм 4 см уменьши на 8 см.", uk: "1 дм 4 см зменши на 8 см.", answer: "6" },
            { ru: "Вырази в сантиметрах 1 дм 6 см.", uk: "Вирази в сантиметрах 1 дм 6 см.", answer: "16" },
            { ru: "4 см увеличили на 1 дм 6 см. Какое число получилось?", uk: "4 см збільшили на 1 дм 6 см. Яке число вийшло?", answer: "20" },
            { ru: "Сумма длин двух звеньев ломаной — 16 см. Длина одного звена — 9 см. Чему равна длина другого звена?", uk: "Сума довжин двох ланок ламаної — 16 см. Довжина однієї ланки — 9 см. Чому дорівнює довжина іншої ланки?", answer: "7" },
            { ru: "В одном ведре 12 л воды. Это на 4 л меньше, чем в другом. Сколько литров во втором ведре?", uk: "В одному відрі 12 л води. Це на 4 л менше, ніж в іншому. Скільки літрів у другому відрі?", answer: "16" },
            { ru: "Сколько карандашей было в коробке, если после того, как взяли 8 карандашей, осталось столько же?", uk: "Скільки олівців було в коробці, якщо після того, як взяли 8 олівців, залишилося стільки ж?", answer: "16" }
        ];

        let currentLang = 'uk';
        let currentTaskIndex = 0;
        let currentInput = "";
        let isAnimating = false;

        // --- DOM Elements ---
        const questionEl = document.getElementById('question');
        const answerDisplay = document.getElementById('answer-display');
        const screenEl = document.getElementById('screen');
        const endingOverlay = document.getElementById('ending-overlay');
        const langUk = document.getElementById('lang-uk');
        const langRu = document.getElementById('lang-ru');

        // --- Realistic Audio Synthesis ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playSound(type) {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.05);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 1.5);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
                osc.start(now); osc.stop(now + 1.5);
            } else if (type === 'wrong') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'whale') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(300, now + 1);
                osc.frequency.linearRampToValueAtTime(100, now + 3);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.1, now + 1);
                gain.gain.linearRampToValueAtTime(0, now + 3);
                osc.start(now); osc.stop(now + 3);
            }
        }

        // --- Game Logic ---
        function updateUI() {
            const task = tasks[currentTaskIndex];
            questionEl.textContent = task[currentLang];
            answerDisplay.textContent = currentInput;
        }

        function inputNum(num) {
            if (isAnimating) return;
            initAudio(); playSound('click');
            if (currentInput.length < 3) {
                currentInput += num;
                answerDisplay.textContent = currentInput;
            }
        }

        function clearInput() {
            if (isAnimating) return;
            initAudio(); playSound('click');
            currentInput = "";
            answerDisplay.textContent = currentInput;
        }

        function submitAnswer() {
            if (isAnimating || currentInput === "") return;
            initAudio();
            const task = tasks[currentTaskIndex];
            
            if (currentInput === task.answer) {
                isAnimating = true;
                playSound('correct');
                screenEl.classList.add('correct');
                triggerBubbleBurst();
                
                setTimeout(() => {
                    screenEl.classList.remove('correct');
                    nextTask();
                    isAnimating = false;
                }, 1500);
            } else {
                isAnimating = true;
                playSound('wrong');
                screenEl.classList.add('wrong');
                
                setTimeout(() => {
                    screenEl.classList.remove('wrong');
                    clearInput();
                    isAnimating = false;
                }, 600);
            }
        }

        function nextTask(isSkip = false) {
            if (isSkip) { initAudio(); playSound('click'); }
            currentTaskIndex++;
            currentInput = "";
            
            if (currentTaskIndex >= tasks.length) {
                startEnding();
                return;
            }
            updateUI();
        }

        function toggleLanguage() {
            initAudio(); playSound('click');
            currentLang = currentLang === 'uk' ? 'ru' : 'uk';
            
            if (currentLang === 'uk') {
                langUk.classList.add('active');
                langRu.classList.remove('active');
            } else {
                langRu.classList.add('active');
                langUk.classList.remove('active');
            }
            updateUI();
        }

        // --- Canvas Environment (Deep Sea) ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let bubbles = [];
        let caustics = [];
        let kelp = [];
        let fish = [];
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            generateEnvironment();
        }
        window.addEventListener('resize', resize);

        class FishEntity {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                this.x = initial ? Math.random() * width : (Math.random() > 0.5 ? -100 : width + 100);
                this.y = Math.random() * (height * 0.7) + height * 0.15;
                this.size = Math.random() * 25 + 10;
                this.speed = (Math.random() * 1.5 + 0.5) * (this.x < 0 ? 1 : -1);
                this.color = `rgba(${100 + Math.random()*50}, ${150 + Math.random()*50}, ${200 + Math.random()*55}, ${Math.random()*0.3 + 0.2})`;
                this.phase = Math.random() * Math.PI * 2;
                this.tailSpeed = Math.random() * 0.1 + 0.05;
            }
            update(t) {
                this.x += this.speed;
                this.phase += this.tailSpeed;
                
                if (this.speed > 0 && this.x > width + 100) this.reset();
                if (this.speed < 0 && this.x < -100) this.reset();
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.speed < 0) ctx.scale(-1, 1); 
                
                ctx.fillStyle = this.color;
                
                const tailWag = Math.sin(this.phase) * 0.8;
                ctx.beginPath();
                ctx.moveTo(-this.size * 0.8, 0);
                ctx.lineTo(-this.size * 1.6, -this.size * 0.4 + tailWag * this.size * 0.3);
                ctx.lineTo(-this.size * 1.6, this.size * 0.4 + tailWag * this.size * 0.3);
                ctx.fill();
                
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.35, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(-this.size * 0.2, -this.size * 0.3);
                ctx.quadraticCurveTo(0, -this.size * 0.8, this.size * 0.3, -this.size * 0.2);
                ctx.fill();

                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.beginPath();
                ctx.arc(this.size * 0.6, -this.size * 0.05, this.size * 0.08, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        function generateEnvironment() {
            caustics = [];
            for(let i=0; i<5; i++) {
                caustics.push({
                    x: Math.random() * width,
                    y: -height,
                    w: Math.random() * 200 + 100,
                    h: height * 1.5,
                    phase: Math.random() * Math.PI * 2,
                    speed: Math.random() * 0.001 + 0.0005
                });
            }
            kelp = [];
            for(let i=0; i<15; i++) {
                kelp.push({
                    x: Math.random() * width,
                    y: height + 50,
                    h: Math.random() * 300 + 150,
                    w: Math.random() * 15 + 5,
                    phase: Math.random() * Math.PI * 2,
                    color: `rgba(${20 + Math.random()*20}, ${80 + Math.random()*40}, ${60 + Math.random()*20}, 0.8)`
                });
            }
            fish = [];
            for(let i=0; i<12; i++) {
                fish.push(new FishEntity());
            }
        }
        resize();

        class Bubble {
            constructor(x, y, isBurst = false) {
                this.x = x; this.y = y;
                this.r = Math.random() * (isBurst ? 8 : 4) + 2;
                this.speedY = -(Math.random() * (isBurst ? 15 : 3) + 1);
                this.speedX = (Math.random() - 0.5) * (isBurst ? 10 : 1);
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.05 + 0.01;
                this.life = 1;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.wobble) * 1.5;
                this.wobble += this.wobbleSpeed;
                if(this.y < -50) this.life = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(150, 220, 255, 0.1)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(150, 220, 255, 0.6)';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(this.x - this.r*0.3, this.y - this.r*0.3, this.r*0.2, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fill();
            }
        }

        function triggerBubbleBurst() {
            for (let i = 0; i < 80; i++) {
                bubbles.push(new Bubble(width/2 + (Math.random()-0.5)*600, height/2 + (Math.random()-0.5)*400, true));
            }
        }

        let endingState = 0;
        let whaleX = -500;

        function startEnding() {
            const ui = document.getElementById('ui-container');
            ui.style.transition = 'opacity 3s, transform 3s';
            ui.style.opacity = '0';
            ui.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                endingOverlay.classList.add('active');
                playSound('whale');
                endingState = 1;
            }, 2000);
        }

        function drawEnvironment(t) {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#0b3d4e');
            grad.addColorStop(0.4, '#05202b');
            grad.addColorStop(1, '#01080c');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            caustics.forEach(c => {
                const sway = Math.sin(t * c.speed + c.phase) * 150;
                ctx.beginPath();
                ctx.moveTo(c.x + sway, c.y);
                ctx.lineTo(c.x + c.w + sway, c.y);
                ctx.lineTo(c.x + c.w * 2 - sway, c.y + c.h);
                ctx.lineTo(c.x - c.w + sway, c.y + c.h);
                ctx.fillStyle = 'rgba(100, 200, 255, 0.03)';
                ctx.fill();
            });
            ctx.restore();

            fish.forEach(f => {
                f.update(t);
                f.draw(ctx);
            });

            kelp.forEach(k => {
                const sway = Math.sin(t * 0.002 + k.phase) * 40;
                ctx.beginPath();
                ctx.moveTo(k.x, k.y);
                ctx.bezierCurveTo(
                    k.x + sway * 0.5, k.y - k.h * 0.5,
                    k.x - sway * 0.5, k.y - k.h * 0.8,
                    k.x + sway, k.y - k.h
                );
                ctx.lineWidth = k.w;
                ctx.lineCap = 'round';
                ctx.strokeStyle = k.color;
                ctx.stroke();
            });

            if (Math.random() < 0.1 && endingState === 0) {
                bubbles.push(new Bubble(Math.random() * width, height + 20));
            }

            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                b.update();
                b.draw();
                if (b.life === 0) bubbles.splice(i, 1);
            }

            if (endingState === 0) {
                ctx.save();
                const frameThickness = 60;
                ctx.beginPath();
                ctx.rect(0, 0, width, height);
                ctx.rect(frameThickness, frameThickness, width - frameThickness*2, height - frameThickness*2);
                ctx.fillStyle = '#151719';
                ctx.fill('evenodd');
                
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 20;
                ctx.strokeRect(frameThickness, frameThickness, width - frameThickness*2, height - frameThickness*2);
                
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 2;
                ctx.strokeRect(frameThickness+10, frameThickness+10, width - frameThickness*2 - 20, height - frameThickness*2 - 20);

                for(let i=frameThickness/2; i<width; i+=40) {
                    drawRivet(i, frameThickness/2);
                    drawRivet(i, height - frameThickness/2);
                }
                for(let i=frameThickness/2; i<height; i+=40) {
                    drawRivet(frameThickness/2, i);
                    drawRivet(width - frameThickness/2, i);
                }
                ctx.restore();
            }

            if (endingState === 1) {
                whaleX += 1.5; 
                
                ctx.save();
                ctx.translate(whaleX, height/2);
                ctx.scale(1.5, 1.5);
                
                ctx.beginPath();
                ctx.moveTo(-200, 0);
                ctx.bezierCurveTo(-100, -80, 100, -100, 200, -20);
                ctx.bezierCurveTo(250, 20, 250, 40, 200, 50);
                ctx.bezierCurveTo(100, 80, -100, 60, -200, 0);
                ctx.fillStyle = '#05121a';
                ctx.fill();
                ctx.strokeStyle = 'rgba(0, 255, 200, 0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(-200, 0);
                ctx.bezierCurveTo(-250, -50, -300, -80, -350, -50);
                ctx.bezierCurveTo(-320, -20, -280, 0, -200, 0);
                ctx.fillStyle = '#05121a';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(150, -10, 5, 0, Math.PI*2);
                ctx.fillStyle = '#00ffcc';
                ctx.fill();
                
                for(let i=0; i<15; i++) {
                    ctx.beginPath();
                    ctx.arc(-100 + i*20, -40 + Math.sin(i)*20, 2, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(0, 255, 200, ${Math.random()*0.5 + 0.2})`;
                    ctx.fill();
                }
                ctx.restore();
                
                const darkGrad = ctx.createRadialGradient(width/2, height/2, height*0.3, width/2, height/2, height*0.8);
                darkGrad.addColorStop(0, 'transparent');
                darkGrad.addColorStop(1, 'rgba(0,0,0,0.8)');
                ctx.fillStyle = darkGrad;
                ctx.fillRect(0, 0, width, height);
            }
        }

        function drawRivet(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#2a2c2e';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x - 1, y - 1, 3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fill();
        }

        function animate(t) {
            time = t;
            drawEnvironment(t);
            requestAnimationFrame(animate);
        }

        // Init
        updateUI();
        requestAnimationFrame(animate);

        document.body.addEventListener('click', () => {
            initAudio();
            if(audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });

    </script>
</body>
