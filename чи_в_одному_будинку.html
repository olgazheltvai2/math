<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра: Магічне Дерево</title>
    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent; /* Змінено для динамічного фону */
            font-family: 'Arial', sans-serif; /* Шрифт Arial за вимогою */
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            transition: background-image 0.5s ease-in-out;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Обертка для зуму */
        #zoom-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            transition: transform 0.2s ease-in-out;
        }

        #game-container {
            position: relative;
            width: 100vw;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            /* Максимально прозорий фон */
            background: rgba(26, 35, 126, 0.1);
            border-radius: 15px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.6), inset 0 0 40px rgba(255,255,255,0.1);
            overflow: hidden;
        }

        #background-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
            opacity: 0.6; /* Трохи прозорості, щоб бачити динамічний фон */
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(106, 27, 154, 0.85);
            padding: 10px 20px;
            border-radius: 40px;
            box-shadow: 0 6px 0 rgba(74, 20, 140, 0.8), 0 10px 15px rgba(0,0,0,0.4);
            border: 2px solid #9C27B0;
        }

        #wagon-input {
            width: 70px;
            height: 50px;
            font-size: 32px;
            text-align: center;
            background-color: #F3E5F5;
            border: 3px solid #E1BEE7;
            border-radius: 15px;
            color: #4A148C;
            font-weight: bold;
            outline: none;
        }

        #build-btn {
            background: #FFCA28;
            border: 3px solid #FFECB3;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            box-shadow: 0 4px 0 #FF8F00;
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #build-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #FF8F00;
        }

        #tracks {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            z-index: 2;
            background: linear-gradient(to bottom, rgba(139, 195, 74, 0.7) 0%, rgba(76, 175, 80, 0.7) 15%, rgba(56, 142, 60, 0.7) 50%, rgba(27, 94, 32, 0.7) 100%);
            border-top: 8px solid rgba(174, 213, 129, 0.8);
            box-shadow: inset 0 20px 20px rgba(0,0,0,0.15);
        }

        #train-wrapper {
            position: absolute;
            bottom: 135px;
            left: 150px;
            display: flex;
            align-items: flex-end;
            z-index: 5;
            transform-origin: left bottom;
            transition: transform 0.4s ease-in-out;
        }

        .moving #train-wrapper {
            animation: build-shake 0.4s infinite alternate;
        }
        @keyframes build-shake {
            0% { transform: translateY(0) scale(var(--train-scale, 1)) rotate(0deg); }
            25% { transform: translateY(-1px) scale(var(--train-scale, 1)) rotate(0.2deg); }
            50% { transform: translateY(0) scale(var(--train-scale, 1)) rotate(0deg); }
            75% { transform: translateY(1px) scale(var(--train-scale, 1)) rotate(-0.2deg); }
            100% { transform: translateY(0) scale(var(--train-scale, 1)) rotate(0deg); }
        }

        .train-unit { flex-shrink: 0; }
        
        #locomotive { width: 200px; height: 230px; }

        .wagon {
            width: 130px;
            height: 150px;
            margin-left: -5px; 
            transform-origin: bottom center;
            animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.4) forwards;
            opacity: 0;
            transform: scale(0);
        }
        @keyframes pop-in { 100% { opacity: 1; transform: scale(1); } }

        .character {
            position: absolute;
            width: 100px;
            height: 210px; 
            z-index: 20;
            cursor: grab;
            filter: drop-shadow(3px 3px 5px rgba(0,0,0,0.5));
            transition: left 0.5s ease-in-out, top 0.5s ease-in-out; 
            touch-action: none; 
            will-change: left, top;
        }
        
        .character.dragging {
            cursor: grabbing;
            filter: drop-shadow(8px 15px 15px rgba(0,0,0,0.7));
            transform: scale(1.05);
            transition: none !important; 
            z-index: 100;
        }

        .char-inner {
            width: 100%;
            height: 100%;
            transform-origin: bottom center;
            animation: breathe 1.5s infinite alternate ease-in-out;
        }
        @keyframes breathe {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(0.96); }
        }

        #boy { left: 20px; bottom: 120px; }
        #girl { left: 900px; bottom: 120px; }

        /* Theme Manager & Global Controls CSS */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            z-index: 99999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            z-index: 100000;
            width: 80vw;
            max-width: 800px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 2px solid #2c3e50;
        }
        #theme-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        #theme-modal-header h2 { margin: 0; font-size: 20px; color: #2c3e50; }
        #theme-close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #e74c3c; }
        
        #theme-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
        }
        .theme-item {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
            background-color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .theme-item:hover { transform: scale(1.05); border-color: #3498db; }
        .theme-item img { width: 100%; height: 100%; object-fit: cover; }
        .theme-item span {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.6);
            color: white;
            text-align: center;
            padding: 5px;
            font-size: 14px;
            font-weight: bold;
        }

        /* Інструмент малювання */
        #global-drawing-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 90000;
            pointer-events: none; 
        }
        #toggle-draw-btn-global {
            position: fixed;
            bottom: 85px; right: 20px;
            background: #8e44ad; color: white;
            border: none; border-radius: 25px;
            padding: 10px 20px; font-size: 16px; font-weight: bold;
            cursor: pointer; z-index: 99999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #draw-panel-global {
            display: none;
            position: fixed;
            top: 20px; right: 20px;
            background: white;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            z-index: 100000;
            width: 250px;
            border: 2px solid #8e44ad;
        }
        #draw-header {
            width: 100%; height: 25px; background: #e0e0e0; border-radius: 5px;
            margin-bottom: 10px; cursor: grab; display: flex; justify-content: flex-end; align-items: center;
        }
        #draw-header:active { cursor: grabbing; }
        #close-draw-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 0 5px; color: #333; }
        .draw-controls { display: flex; flex-direction: column; gap: 10px; }
        .draw-row { display: flex; justify-content: space-between; align-items: center; gap: 5px; }
        .draw-btn {
            flex: 1; padding: 8px; border: none; border-radius: 5px; cursor: pointer;
            background: #ecf0f1; font-weight: bold; font-size: 14px;
        }
        .draw-btn.active { background: #3498db; color: white; }
        #draw-clear-btn { background: #e74c3c; color: white; }

        /* Лупа (Зум) */
        #zoom-controls {
            position: fixed;
            top: 20px; left: 20px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 99999;
        }
        .zoom-btn {
            width: 45px; height: 45px;
            border-radius: 50%; border: none;
            background: #00BCD4; color: white;
            font-size: 20px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Заглушка екрану */
        #block-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            color: red; font-size: 5vw; font-weight: bold;
            justify-content: center; align-items: center;
            z-index: 999999; text-align: center;
        }

        /* Секретні поля вводу (для сумісності) */
        .secret-input {
            color: transparent !important;
        }
        .secret-input::selection {
            background: transparent !important;
            color: transparent !important;
        }

        @media (max-width: 768px) {
            #ui-layer { transform: scale(0.8) translateX(-60%); top: 10px; }
            #theme-btn { bottom: 10px; right: 10px; width: 40px; height: 40px; font-size: 18px; }
            #toggle-draw-btn-global { bottom: 60px; right: 10px; padding: 8px 15px; font-size: 14px; }
            .zoom-btn { width: 35px; height: 35px; font-size: 16px; }
        }
    </style>
</head>
<body>

<div id="zoom-wrapper">
    <div id="game-container">
        <svg id="background-layer" viewBox="0 0 1200 800" preserveAspectRatio="none">
            <g fill="#FFF">
                <circle cx="150" cy="150" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
                <circle cx="350" cy="80" r="3"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
                <circle cx="600" cy="250" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
                <circle cx="850" cy="100" r="2.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.5s" repeatCount="indefinite"/></circle>
                <circle cx="1050" cy="180" r="2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.5s" repeatCount="indefinite"/></circle>
                <circle cx="80" cy="350" r="2.5"><animate attributeName="opacity" values="1;0;1" dur="4s" repeatCount="indefinite"/></circle>
                <circle cx="1150" cy="50" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
            </g>

            <g transform="translate(950, 250)">
                <circle cx="0" cy="0" r="140" fill="#FFF9C4" opacity="0.95" filter="drop-shadow(0 0 40px rgba(255,245,157,0.6))"/>
                <circle cx="-40" cy="-50" r="25" fill="#FFF59D" opacity="0.4"/>
                <circle cx="50" cy="40" r="45" fill="#FFF59D" opacity="0.3"/>
                <circle cx="-30" cy="60" r="18" fill="#FFF59D" opacity="0.5"/>
                <circle cx="60" cy="-30" r="12" fill="#FFF59D" opacity="0.4"/>
            </g>

            <line x1="1300" y1="-50" x2="1100" y2="150" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0">
                <animate attributeName="opacity" values="0;1;0;0;0" dur="7s" repeatCount="indefinite"/>
                <animate attributeName="x1" values="1300;400;1300;1300;1300" dur="7s" repeatCount="indefinite"/>
                <animate attributeName="y1" values="-50;850;-50;-50;-50" dur="7s" repeatCount="indefinite"/>
                <animate attributeName="x2" values="1100;200;1100;1100;1100" dur="7s" repeatCount="indefinite"/>
                <animate attributeName="y2" values="150;1050;150;150;150" dur="7s" repeatCount="indefinite"/>
            </line>

            <path d="M-100,550 Q200,350 550,580 T1300,500 L1300,800 L-100,800 Z" fill="#280659" opacity="0.4"/>
            <path d="M150,620 Q500,420 850,630 T1400,580 L1400,800 L150,800 Z" fill="#380B61" opacity="0.5"/>
        </svg>

        <div id="ui-layer">
            <input type="number" id="wagon-input" min="1" max="50" value="3">
            <button id="build-btn">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#D84315" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </button>
        </div>

        <div id="tracks"></div>

        <div id="train-wrapper">
            <svg id="locomotive" class="train-unit" viewBox="0 -50 200 230" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="-25" r="3" fill="#FFF" opacity="0">
                    <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" repeatCount="indefinite"/>
                </circle>
                <circle cx="45" cy="5" r="2.5" fill="#E040FB" opacity="0">
                    <animate attributeName="opacity" values="0;0.9;0" dur="3s" repeatCount="indefinite" begin="1s"/>
                </circle>
                <circle cx="160" cy="15" r="2" fill="#00E5FF" opacity="0">
                    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
                </circle>

                <circle cx="100" cy="60" r="70" fill="#1B5E20"/>
                <circle cx="50" cy="80" r="50" fill="#1B5E20"/>
                <circle cx="150" cy="80" r="50" fill="#1B5E20"/>
                
                <path d="M 20,180 Q 50,150 70,110 L 75,50 L 125,50 L 130,110 Q 150,150 180,180 L 150,180 Q 130,160 120,180 L 80,180 Q 70,160 50,180 Z" fill="#4E342E" stroke="#3E2723" stroke-width="4"/>
                
                <path d="M 125,140 Q 160,130 200,140 L 200,160 Q 160,150 125,160 Z" fill="#5D4037" stroke="#3E2723" stroke-width="3"/>
                <path d="M 130,80 Q 170,70 200,80 L 200,95 Q 170,85 130,95 Z" fill="#5D4037" stroke="#3E2723" stroke-width="3"/>
                
                <path d="M 75,70 Q 85,110 75,160" fill="none" stroke="#3E2723" stroke-width="2.5"/>
                <path d="M 95,60 Q 90,100 100,170" fill="none" stroke="#3E2723" stroke-width="2.5"/>
                <path d="M 115,70 Q 105,120 115,160" fill="none" stroke="#3E2723" stroke-width="2.5"/>

                <path d="M 80,180 L 80,135 Q 100,115 120,135 L 120,180 Z" fill="#795548" stroke="#3E2723" stroke-width="3"/>
                <line x1="90" y1="128" x2="90" y2="180" stroke="#3E2723" stroke-width="2"/>
                <line x1="100" y1="122" x2="100" y2="180" stroke="#3E2723" stroke-width="2"/>
                <line x1="110" y1="128" x2="110" y2="180" stroke="#3E2723" stroke-width="2"/>
                <circle cx="112" cy="155" r="3" fill="#FFCA28"/>

                <circle cx="100" cy="90" r="14" fill="#FFE082" stroke="#3E2723" stroke-width="4"/>
                <line x1="86" y1="90" x2="114" y2="90" stroke="#3E2723" stroke-width="3"/>
                <line x1="100" y1="76" x2="100" y2="104" stroke="#3E2723" stroke-width="3"/>
                <circle cx="100" cy="90" r="14" fill="#FFC107" opacity="0.5">
                    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
                </circle>

                <circle cx="100" cy="40" r="60" fill="#2E7D32" stroke="#1B5E20" stroke-width="3"/>
                <circle cx="45" cy="70" r="45" fill="#388E3C" stroke="#1B5E20" stroke-width="3"/>
                <circle cx="155" cy="70" r="45" fill="#388E3C" stroke="#1B5E20" stroke-width="3"/>
                <circle cx="75" cy="25" r="35" fill="#4CAF50" stroke="#1B5E20" stroke-width="2"/>
                <circle cx="125" cy="25" r="35" fill="#4CAF50" stroke="#1B5E20" stroke-width="2"/>

                <g>
                    <circle cx="60" cy="40" r="6" fill="#00E5FF">
                        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
                        <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="140" cy="50" r="8" fill="#E040FB">
                        <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite"/>
                        <animate attributeName="r" values="7;9;7" dur="2.5s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="100" cy="15" r="5" fill="#FFEB3B">
                        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.8s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="40" cy="90" r="5" fill="#FFEB3B">
                        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="160" cy="95" r="6" fill="#00E5FF">
                        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.2s" repeatCount="indefinite"/>
                    </circle>
                </g>

                <line x1="140" y1="110" x2="140" y2="135" stroke="#3E2723" stroke-width="2"/>
                <path d="M 135,135 L 145,135 L 148,150 L 132,150 Z" fill="#FFCA28" stroke="#3E2723" stroke-width="2"/>
                <circle cx="140" cy="142" r="4" fill="#FFF">
                    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
                </circle>

                <path d="M 35,180 L 35,165 Q 40,165 40,180 Z" fill="#FFF"/>
                <path d="M 30,165 Q 37,155 45,165 Z" fill="#E040FB" stroke="#7B1FA2" stroke-width="1.5"/>
                <circle cx="35" cy="160" r="1.5" fill="#FFF"/>
                <circle cx="40" cy="162" r="1" fill="#FFF"/>

                <path d="M 160,180 L 160,170 Q 163,170 163,180 Z" fill="#FFF"/>
                <path d="M 155,170 Q 161,162 167,170 Z" fill="#00E5FF" stroke="#0097A7" stroke-width="1.5"/>
                <circle cx="161" cy="167" r="1" fill="#FFF"/>
            </svg>
        </div>

        <div id="boy" class="character">
            <div class="char-inner">
                <svg viewBox="0 0 100 210" xmlns="http://www.w3.org/2000/svg">
                    <g transform="translate(0, 5)">
                        <path d="M 30,70 L 5,195 L 95,195 L 70,70 Z" fill="#4527A0"/>
                        <rect x="30" y="70" width="40" height="110" fill="#5E35B1" rx="15"/>
                        <rect x="30" y="130" width="40" height="10" fill="#212121"/>
                        <rect x="43" y="127" width="14" height="16" fill="none" stroke="#FFC107" stroke-width="3"/>
                        <circle cx="50" cy="50" r="22" fill="#FFCCBC"/>
                        <circle cx="50" cy="55" r="8" fill="#FFAB91" opacity="0.5"/>
                        <path d="M 28,45 Q 50,15 72,45 Q 60,35 50,45 Q 40,35 28,45 Z" fill="#3E2723"/>
                        <circle cx="41" cy="48" r="3" fill="#000"/>
                        <circle cx="59" cy="48" r="3" fill="#000"/>
                        <path d="M 45,60 Q 50,65 55,60" fill="none" stroke="#D84315" stroke-width="2" stroke-linecap="round"/>
                        <path d="M 5,32 L 95,32 L 50,-15 Z" fill="#311B92"/>
                        <ellipse cx="50" cy="32" rx="45" ry="8" fill="#4527A0"/>
                        <polygon points="40,15 60,15 55,5 45,5" fill="#FFC107"/>
                        <rect x="70" y="50" width="8" height="150" fill="#795548" rx="4"/>
                        <circle cx="74" cy="40" r="12" fill="#00E5FF">
                            <animate attributeName="r" values="10;14;10" dur="1.5s" repeatCount="indefinite"/>
                            <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
                        </circle>
                        <circle cx="74" cy="40" r="5" fill="#FFF"/>
                        <rect x="60" y="75" width="20" height="10" fill="#FFCCBC" rx="4" transform="rotate(30 70 80)"/>
                        <path d="M 30,180 L 45,180 L 45,200 L 20,200 Z" fill="#212121"/>
                        <path d="M 55,180 L 70,180 L 80,200 L 55,200 Z" fill="#212121"/>
                    </g>
                </svg>
            </div>
        </div>

        <div id="girl" class="character">
            <div class="char-inner">
                <svg viewBox="0 0 100 210" xmlns="http://www.w3.org/2000/svg">
                    <g transform="translate(0, 5)">
                        <g opacity="0.85">
                            <path d="M 50,75 C -10,10 -15,90 50,95" fill="#E1F5FE" stroke="#81D4FA" stroke-width="2">
                                <animateTransform attributeName="transform" type="rotate" values="0 50 75; -12 50 75; 0 50 75" dur="0.15s" repeatCount="indefinite"/>
                            </path>
                            <path d="M 50,75 C 110,10 115,90 50,95" fill="#E1F5FE" stroke="#81D4FA" stroke-width="2">
                                <animateTransform attributeName="transform" type="rotate" values="0 50 75; 12 50 75; 0 50 75" dur="0.15s" repeatCount="indefinite"/>
                            </path>

                        <path d="M 40,70 L 60,70 L 85,155 L 15,155 Z" fill="#E91E63"/>

                        <circle cx="50" cy="45" r="22" fill="#FFCCBC"/>

                        <circle cx="43" cy="47" r="1" fill="#FFF"/>

                        <circle cx="59" cy="47" r="1" fill="#FFF"/>

                        <path d="M 46,58 Q 50,63 54,58" fill="none" stroke="#C2185B" stroke-width="2" stroke-linecap="round"/>
                        <rect x="25" y="75" width="8" height="40" fill="#FFCCBC" rx="4" transform="rotate(25 29 75)"/>
                        <rect x="67" y="75" width="8" height="40" fill="#FFCCBC" rx="4" transform="rotate(-25 71 75)"/>
                        <line x1="15" y1="70" x2="25" y2="105" stroke="#795548" stroke-width="3"/>
                        <polygon points="15,60 20,70 10,75 15,65 5,60 15,55 10,45 20,50 25,40 25,55" fill="#FFEB3B"/>
                        <rect x="35" y="155" width="10" height="40" fill="#FFCCBC"/>
                        <rect x="55" y="155" width="10" height="40" fill="#FFCCBC"/>
                        <path d="M 30,195 L 45,195 L 45,205 L 25,205 Z" fill="#880E4F"/>
                        <path d="M 55,195 L 70,195 L 75,205 L 55,205 Z" fill="#880E4F"/>

    </div>
</div>

<!-- Лупа для зуму -->
<div id="zoom-controls">
    <button class="zoom-btn" onclick="changeZoom(0.1)">🔍+</button>
    <button class="zoom-btn" onclick="changeZoom(-0.1)">🔍-</button>
</div>

<!-- Кнопка та модальне вікно Theme Manager -->
<button id="theme-btn">⚙️</button>
<div id="theme-modal">
    <div id="theme-modal-header">
        <h2>Виберіть фон</h2>
        <button id="theme-close-btn">✕</button>
    </div>
    <div id="theme-gallery-grid">
        <!-- Сюди завантажуються мініатюри -->
    </div>
</div>

<!-- Блок для малювання -->
<canvas id="global-drawing-canvas"></canvas>
<button id="toggle-draw-btn-global">✏️ Малювати</button>
<div id="draw-panel-global">
    <div id="draw-header">
        <button id="close-draw-btn">✕</button>
    </div>
    <div class="draw-controls">
        <div class="draw-row">
            <button id="tool-pencil" class="draw-btn active">✏️ Олівець</button>
            <button id="tool-eraser" class="draw-btn">🧽 Гумка</button>
        </div>
        <div class="draw-row">
            <input type="range" id="draw-size" min="1" max="50" value="5" style="width: 100%;">
        </div>
        <div class="draw-row">
            <input type="color" id="draw-color" value="#FF0000" style="width: 100%; height: 30px; border: none; cursor: pointer;">
        </div>
        <button id="draw-clear-btn" class="draw-btn">🗑️ Очистити</button>
    </div>
</div>

<!-- Універсальний блок-заглушка -->
<div id="block-overlay">Зачекай! Зараз не твій урок.</div>

<script>
    // Конфігурація гри
    const CONFIG = {
        gameId: 'magic_tree'
    };

    // Ініціалізація Firebase
    const firebaseConfig = {
        databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
        projectId: "lesson-13c44"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    
    // Ідентифікація, Радар, Блокування
    const urlParams = new URLSearchParams(window.location.search);
    let myName = urlParams.get('user') || sessionStorage.getItem('userName');
    if (!myName) {
        myName = 'Гість_' + Math.floor(Math.random() * 1000);
    }
    sessionStorage.setItem('userName', myName);
    
    const tabId = Math.random().toString(36).substr(2, 9);
    const myRadarRef = db.ref('online_users/' + myName + '/' + tabId);
    
    myRadarRef.set(true);
    myRadarRef.onDisconnect().remove();
    
    window.addEventListener('beforeunload', () => {
        myRadarRef.remove();
    });

    db.ref('force_refresh').on('value', (snap) => {
        if (snap.val() === true) {
            window.location.reload();
        }
    });

    db.ref('blocked_users/' + myName).on('value', (snap) => {
        const overlay = document.getElementById('block-overlay');
        if (snap.val() === true) {
            overlay.style.display = 'flex';
        } else {
            overlay.style.display = 'none';
        }
    });

    let isStartImmunity = true;
    setTimeout(() => { isStartImmunity = false; }, 1000);
    db.ref('current_activity').on('value', snap => {
        if (isStartImmunity) return;
        const val = snap.val();
        if (val === 'lobby') {
            window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
        }
    });

    // Система динамічних фонів
    const savedBg = localStorage.getItem('mySavedBg_' + CONFIG.gameId);
    if(savedBg) {
        document.body.style.backgroundImage = savedBg === 'none' ? 'none' : `url('${savedBg}')`;
    }

    const themeBtn = document.getElementById('theme-btn');
    const themeModal = document.getElementById('theme-modal');
    const themeClose = document.getElementById('theme-close-btn');
    const themeGrid = document.getElementById('theme-gallery-grid');
    
    themeBtn.addEventListener('click', () => { themeModal.style.display = 'block'; loadBackgrounds(); });
    themeClose.addEventListener('click', () => { themeModal.style.display = 'none'; });
    
    let backgroundsLoaded = false;
    async function loadBackgrounds() {
        if(backgroundsLoaded) return;
        backgroundsLoaded = true;
        
        // Опція Без фону
        const noBgDiv = document.createElement('div');
        noBgDiv.className = 'theme-item';
        noBgDiv.innerHTML = `<span>Без фону</span>`;
        noBgDiv.addEventListener('click', () => selectTheme('none'));
        themeGrid.appendChild(noBgDiv);

        const baseUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
        let i = 1;
        while(i <= 1000) {
            const url = baseUrl + 'background_' + i + '.webp';
            try {
                const res = await fetch(url, {method: 'HEAD'});
                if(!res.ok) break;
                
                const div = document.createElement('div');
                div.className = 'theme-item';
                div.innerHTML = `<img src="${url}" alt="Фон ${i}"><span>Фон ${i}</span>`;
                div.addEventListener('click', () => selectTheme(url));
                themeGrid.appendChild(div);
                i++;
            } catch(e) {
                break;
            }
        }
    }

    function selectTheme(url) {
        db.ref('game_theme').set({ url: url, timestamp: Date.now() });
        themeModal.style.display = 'none';
    }

    db.ref('game_theme').on('value', snap => {
        const val = snap.val();
        if(val && val.url) {
            document.body.style.backgroundImage = val.url === 'none' ? 'none' : `url('${val.url}')`;
            localStorage.setItem('mySavedBg_' + CONFIG.gameId, val.url);
        }
    });

    // Зумування екрану
    let currentZoom = 1;
    function changeZoom(delta) {
        currentZoom += delta;
        if(currentZoom < 0.3) currentZoom = 0.3;
        if(currentZoom > 2.5) currentZoom = 2.5;
        document.getElementById('zoom-wrapper').style.transform = `scale(${currentZoom})`;
    }

    // Синхронізація дій гри (Firebase Compat)
    let isRemoteAction = false;
    let senderId = Math.random().toString(36).substr(2, 9);
    
    function sendGameAction(type, data) {
        if (isRemoteAction) return;
        db.ref('game_action').set({
            senderId: senderId,
            timestamp: firebase.database.ServerValue.TIMESTAMP,
            type: type,
            data: data
        });
    }

    db.ref('game_action').on('value', snap => {
        const val = snap.val();
        if(!val || val.senderId === senderId) return;
        
        isRemoteAction = true;
        if(val.type === 'build_train') {
            input.value = val.data.count;
            buildTrain(true);
        } else if (val.type === 'char_move') {
            const el = document.getElementById(val.data.id);
            if(el) {
                el.style.left = val.data.left + 'px';
                el.style.top = val.data.top + 'px';
                el.style.bottom = 'auto';
            }
        } else if (val.type === 'draw_line') {
            remoteDrawLine(val.data);
        } else if (val.type === 'clear_canvas') {
            ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        }
        
        setTimeout(() => { isRemoteAction = false; }, 50);
    });

    // Аудіо
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playPop() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    function playWhistle() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1600, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.1);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
        osc.start(); osc.stop(audioCtx.currentTime + 0.6);
    }

    function playGrab() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    // Логіка гри
    const input = document.getElementById('wagon-input');
    const btn = document.getElementById('build-btn');
    const trainWrapper = document.getElementById('train-wrapper');
    const girl = document.getElementById('girl');
    const container = document.getElementById('game-container');

    const colors = ['#FF9800', '#E91E63', '#9C27B0', '#00BCD4', '#8BC34A'];

    function getWagonHTML(color) {
        return `
            <svg class="train-unit wagon" viewBox="0 0 130 150" xmlns="http://www.w3.org/2000/svg">
                <rect x="0" y="40" width="130" height="110" fill="${color}" stroke="#4E342E" stroke-width="4"/>
                
                <rect x="10" y="50" width="25" height="12" fill="#000" opacity="0.1"/>
                <rect x="90" y="80" width="30" height="12" fill="#000" opacity="0.1"/>
                <rect x="20" y="110" width="20" height="12" fill="#000" opacity="0.1"/>

                <path d="M -10,40 L 65,0 L 140,40 Z" fill="#5D4037" stroke="#3E2723" stroke-width="4" stroke-linejoin="round"/>
                <path d="M 0,40 L 65,8 L 130,40 Z" fill="#8D6E63"/>
                <path d="M 30,25 Q 40,30 50,25" fill="none" stroke="#4E342E" stroke-width="3" stroke-linecap="round"/>
                <path d="M 70,20 Q 80,25 90,20" fill="none" stroke="#4E342E" stroke-width="3" stroke-linecap="round"/>

                <path d="M 10,40 Q 20,65 15,90" fill="none" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
                <path d="M 110,40 Q 100,75 115,100" fill="none" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>

                <rect x="35" y="60" width="60" height="55" fill="#E1F5FE" rx="25" stroke="#FFC107" stroke-width="4"/>
                <line x1="65" y1="60" x2="65" y2="115" stroke="#FFC107" stroke-width="4"/>
                <line x1="35" y1="90" x2="95" y2="90" stroke="#FFC107" stroke-width="4"/>

                <rect x="25" y="115" width="80" height="10" fill="#795548" rx="4" stroke="#3E2723" stroke-width="3"/>
                <path d="M 30,125 Q 65,145 100,125 Z" fill="#4CAF50" stroke="#1B5E20" stroke-width="2"/>
                <circle cx="45" cy="122" r="4.5" fill="#FFEB3B">
                    <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite"/>
                </circle>
                <circle cx="85" cy="122" r="5" fill="#F48FB1">
                    <animate attributeName="r" values="4;6;4" dur="2.5s" repeatCount="indefinite"/>
                </circle>

                <circle cx="20" cy="70" r="2.5" fill="#FFF">
                    <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
                </circle>
                <circle cx="110" cy="95" r="2.5" fill="#FFF">
                    <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite" begin="0.5s"/>
                </circle>
            </svg>
        `;
    }

    async function buildTrain(isRemote = false) {
        let count = parseInt(input.value);
        if (isNaN(count) || count < 1) count = 1;
        input.value = count;
        
        if(!isRemote) {
            sendGameAction('build_train', { count: count });
        }

        const wagons = trainWrapper.querySelectorAll('.wagon');
        wagons.forEach(w => w.remove());

        trainWrapper.style.setProperty('--train-scale', '1');
        trainWrapper.style.transform = 'scale(1)';
        container.classList.add('moving');
        playWhistle();

        for (let i = 0; i < count; i++) {
            await new Promise(r => setTimeout(r, 100));
            const div = document.createElement('div');
            div.innerHTML = getWagonHTML(colors[i % colors.length]);
            const wagonSvg = div.firstElementChild;
            trainWrapper.appendChild(wagonSvg);
            playPop();
        }

        setTimeout(() => {
            container.classList.remove('moving');
            const locoWidth = 200;
            const wagonWidth = 125; 
            const actualWidth = locoWidth + (count * wagonWidth);
            const availableWidth = container.clientWidth - 150 - 120;
            
            let scale = 1;
            if (actualWidth > availableWidth) {
                scale = availableWidth / actualWidth;
                if (scale < 0.2) scale = 0.2; 
            }

            trainWrapper.style.setProperty('--train-scale', scale);
            trainWrapper.style.transform = `scale(${scale})`;

            const scaledWidth = actualWidth * scale;
            const targetX = 150 + scaledWidth + 10; 
            
            girl.style.transition = 'left 0.5s ease-in-out';
            girl.style.left = targetX + 'px';
            girl.style.bottom = '120px'; 
            girl.style.top = 'auto';
            
            if(!isRemote) {
                sendGameAction('char_move', { id: 'girl', left: targetX, top: girl.offsetTop });
            }
        }, 300);
    }

    btn.addEventListener('click', () => buildTrain(false));
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') buildTrain(false); });

    function makeDraggable(el) {
        let isDragging = false, startX, startY, initLeft, initTop;

        el.addEventListener('pointerdown', e => {
            isDragging = true;
            el.classList.add('dragging');
            el.setPointerCapture(e.pointerId);
            playGrab();
            
            startX = e.clientX; startY = e.clientY;
            const rect = el.getBoundingClientRect();
            const pRect = container.getBoundingClientRect();
            
            initLeft = (rect.left - pRect.left) / currentZoom;
            initTop = (rect.top - pRect.top) / currentZoom;
            
            el.style.transition = 'none'; 
            el.style.left = initLeft + 'px';
            el.style.top = initTop + 'px';
            el.style.bottom = 'auto'; 
        });

        el.addEventListener('pointermove', e => {
            if (!isDragging) return;
            const newLeft = initLeft + (e.clientX - startX) / currentZoom;
            const newTop = initTop + (e.clientY - startY) / currentZoom;
            el.style.left = newLeft + 'px';
            el.style.top = newTop + 'px';
            
            sendGameAction('char_move', { id: el.id, left: newLeft, top: newTop });
        });

        el.addEventListener('pointerup', e => {
            if(!isDragging) return;
            isDragging = false;
            el.classList.remove('dragging');
            el.releasePointerCapture(e.pointerId);
            
            el.style.transition = 'left 0.5s ease-in-out, top 0.5s ease-in-out';
            playPop();
        });
    }

    makeDraggable(document.getElementById('boy'));
    makeDraggable(girl);

    window.onload = () => buildTrain(false);

    window.addEventListener('resize', () => {
        girl.style.transition = 'none'; 
        buildTrain(false);
        setTimeout(() => girl.style.transition = 'left 0.5s ease-in-out', 100);
    });

    // Централізований скрипт малювання
    const drawBtn = document.getElementById('toggle-draw-btn-global');
    const drawPanel = document.getElementById('draw-panel-global');
    const drawClose = document.getElementById('close-draw-btn');
    const drawCanvas = document.getElementById('global-drawing-canvas');
    const ctx = drawCanvas.getContext('2d');
    
    const pencilBtn = document.getElementById('tool-pencil');
    const eraserBtn = document.getElementById('tool-eraser');
    const sizeInput = document.getElementById('draw-size');
    const colorInput = document.getElementById('draw-color');
    const clearBtn = document.getElementById('draw-clear-btn');
    const drawHeader = document.getElementById('draw-header');

    let isDrawMode = false;
    let isDrawing = false;
    let isEraser = false;
    let lastX = 0, lastY = 0;

    function resizeCanvas() {
        drawCanvas.width = window.innerWidth;
        drawCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    drawBtn.addEventListener('click', () => {
        isDrawMode = true;
        drawPanel.style.display = 'block';
        drawCanvas.style.pointerEvents = 'auto';
    });

    drawClose.addEventListener('click', () => {
        isDrawMode = false;
        drawPanel.style.display = 'none';
        drawCanvas.style.pointerEvents = 'none';
    });

    pencilBtn.addEventListener('click', () => { isEraser = false; pencilBtn.classList.add('active'); eraserBtn.classList.remove('active'); });
    eraserBtn.addEventListener('click', () => { isEraser = true; eraserBtn.classList.add('active'); pencilBtn.classList.remove('active'); });
    
    clearBtn.addEventListener('click', () => {
        ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        sendGameAction('clear_canvas', {});
    });

    function getMousePos(evt) {
        const rect = drawCanvas.getBoundingClientRect();
        let clientX = evt.clientX;
        let clientY = evt.clientY;
        if(evt.touches && evt.touches.length > 0) {
            clientX = evt.touches[0].clientX;
            clientY = evt.touches[0].clientY;
        }
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function draw(x0, y0, x1, y1, color, size, eraser) {
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.strokeStyle = eraser ? 'rgba(0,0,0,1)' : color;
        ctx.lineWidth = size;
        ctx.lineCap = 'round';
        if(eraser) {
            ctx.globalCompositeOperation = 'destination-out';
        } else {
            ctx.globalCompositeOperation = 'source-over';
        }
        ctx.stroke();
        ctx.closePath();
    }

    function remoteDrawLine(data) {
        const x0 = data.nx0 * drawCanvas.width;
        const y0 = data.ny0 * drawCanvas.height;
        const x1 = data.nx1 * drawCanvas.width;
        const y1 = data.ny1 * drawCanvas.height;
        draw(x0, y0, x1, y1, data.color, data.size, data.isEraser);
    }

    const startDraw = (e) => {
        if(!isDrawMode) return;
        isDrawing = true;
        const pos = getMousePos(e);
        lastX = pos.x; lastY = pos.y;
    };

    const drawing = (e) => {
        if(!isDrawing || !isDrawMode) return;
        e.preventDefault();
        const pos = getMousePos(e);
        draw(lastX, lastY, pos.x, pos.y, colorInput.value, sizeInput.value, isEraser);
        
        sendGameAction('draw_line', {
            nx0: lastX / drawCanvas.width,
            ny0: lastY / drawCanvas.height,
            nx1: pos.x / drawCanvas.width,
            ny1: pos.y / drawCanvas.height,
            color: colorInput.value,
            size: sizeInput.value,
            isEraser: isEraser
        });
        
        lastX = pos.x; lastY = pos.y;
    };

    const stopDraw = () => { isDrawing = false; };

    drawCanvas.addEventListener('mousedown', startDraw);
    drawCanvas.addEventListener('mousemove', drawing);
    drawCanvas.addEventListener('mouseup', stopDraw);
    drawCanvas.addEventListener('mouseout', stopDraw);

    drawCanvas.addEventListener('touchstart', startDraw, {passive: false});
    drawCanvas.addEventListener('touchmove', drawing, {passive: false});
    drawCanvas.addEventListener('touchend', stopDraw);

    // Перетягування панелі малювання
    let dragPanel = false, pStartX, pStartY, pInitL, pInitT;
    drawHeader.addEventListener('mousedown', (e) => {
        dragPanel = true; pStartX = e.clientX; pStartY = e.clientY;
        const rect = drawPanel.getBoundingClientRect();
        pInitL = rect.left; pInitT = rect.top;
        drawPanel.style.right = 'auto';
    });
    window.addEventListener('mousemove', (e) => {
        if(!dragPanel) return;
        drawPanel.style.left = (pInitL + e.clientX - pStartX) + 'px';
        drawPanel.style.top = (pInitT + e.clientY - pStartY) + 'px';
    });
    window.addEventListener('mouseup', () => { dragPanel = false; });
    
    drawHeader.addEventListener('touchstart', (e) => {
        dragPanel = true; pStartX = e.touches[0].clientX; pStartY = e.touches[0].clientY;
        const rect = drawPanel.getBoundingClientRect();
        pInitL = rect.left; pInitT = rect.top;
        drawPanel.style.right = 'auto';
    }, {passive: true});
    window.addEventListener('touchmove', (e) => {
        if(!dragPanel) return;
        drawPanel.style.left = (pInitL + e.touches[0].clientX - pStartX) + 'px';
        drawPanel.style.top = (pInitT + e.touches[0].clientY - pStartY) + 'px';
    }, {passive: true});
    window.addEventListener('touchend', () => { dragPanel = false; });
</script>
</body>
</html>
