<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Підводна Математика - Сортування</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
            touch-action: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            background: rgba(0, 18, 32, 0.15);
            box-shadow: 0 0 40px rgba(0,255,255,0.1);
            overflow: hidden;
            transform-origin: center;
            transition: transform 0.3s ease;
        }

        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -5%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.1));
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5);
            animation: rise linear infinite;
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; transform: translateY(-90vh) scale(1.5); }
            100% { transform: translateY(-100vh) scale(2); opacity: 0; }
        }

        #equation-area {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2%;
            align-items: center;
            z-index: 10;
            width: 60%;
            justify-content: center;
        }

        .stone-block {
            background: radial-gradient(circle, rgba(74,103,122,0.8) 0%, rgba(43,62,74,0.9) 100%);
            border: 3px solid #1c2b36;
            border-radius: 15px;
            width: 8vw;
            height: 8vw;
            max-width: 80px;
            max-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5cqw;
            font-weight: 900;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 2px 2px 0px #000;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.2), 0 15px 20px rgba(0,0,0,0.6);
            container-type: inline-size;
            line-height: 1;
        }

        .drop-zone {
            position: absolute;
            bottom: 5%;
            width: 25%;
            height: 25%;
            z-index: 5;
            transition: all 0.3s ease;
        }
        #zone-1 { left: 20%; }
        #zone-2 { right: 20%; }
        
        .anemone-glow {
            filter: drop-shadow(0 0 20px rgba(0, 255, 170, 0.4));
            animation: pulse-glow 3s infinite alternate;
        }
        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 15px rgba(0, 255, 170, 0.3)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 35px rgba(0, 255, 170, 0.7)); transform: scale(1.05); }
        }

        #figures-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
        }

        .game-figure {
            position: absolute;
            width: 12%;
            height: 12%;
            cursor: grab;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease-out;
        }
        .game-figure.dragging {
            cursor: grabbing !important;
            z-index: 100 !important;
            filter: drop-shadow(0 20px 25px rgba(0,0,0,0.8));
            transition: none !important;
        }
        .game-figure.solved {
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
        }

        #character {
            position: absolute;
            bottom: -5%;
            left: 2%;
            width: 25%;
            height: 40%;
            z-index: 15;
            transform-origin: bottom center;
        }
        
        .tentacle {
            animation: wave 4s ease-in-out infinite alternate;
            transform-origin: top center;
        }
        .tentacle:nth-child(even) { animation-duration: 5s; animation-direction: alternate-reverse; }
        @keyframes wave {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(10deg); }
        }
        .breath { animation: breathe 3s infinite ease-in-out; transform-origin: center; }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02, 0.98); }
        }

        /* UI Controls */
        .ui-btn {
            position: absolute;
            width: 45px;
            height: 45px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00ffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ffff;
            font-size: 20px;
            cursor: pointer;
            z-index: 50000;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0,255,255,0.2);
        }
        .ui-btn:hover { background: rgba(0, 255, 255, 0.3); transform: scale(1.1); box-shadow: 0 0 20px #00ffff; }
        
        #btn-zoom-in { top: 20px; right: 80px; }
        #btn-zoom-out { top: 20px; right: 20px; }
        #btn-theme { bottom: 20px; right: 20px; }

        #btn-teacher {
            top: 20px;
            left: 20px;
            border-radius: 10px;
            border-style: dashed;
            display: none; 
        }

        #teacher-panel {
            position: absolute;
            top: 80px;
            left: -350px;
            width: 300px;
            background: linear-gradient(135deg, rgba(10, 30, 50, 0.95), rgba(0, 15, 30, 0.98));
            border: 2px solid #00ffff;
            border-radius: 20px;
            padding: 20px;
            z-index: 50001;
            backdrop-filter: blur(15px);
            box-shadow: 15px 15px 40px rgba(0,0,0,0.8);
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #b3e5fc;
        }
        #teacher-panel.open { left: 20px; }

        .t-row { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; position: relative; }
        .t-row label { font-size: 14px; font-weight: bold; color: #00ffff; }
        .t-input, .t-select {
            background: rgba(0,0,0,0.6); border: 1px solid #00acc1; border-radius: 8px;
            color: #fff; padding: 10px; font-size: 16px; outline: none; font-weight: bold; width: 100%;
        }
        
        .secret-toggle {
            position: absolute;
            right: 10px;
            top: 32px;
            cursor: pointer;
            font-size: 16px;
        }
        .secret-text { color: transparent !important; text-shadow: 0 0 5px rgba(255,255,255,0.5); }

        .t-btn {
            width: 100%; background: linear-gradient(90deg, #00838f, #00acc1); border: none; border-radius: 8px;
            color: #fff; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 0 #005662; transition: all 0.1s;
        }
        .t-btn:active { transform: translateY(5px); box-shadow: none; }

        .particle { position: absolute; pointer-events: none; border-radius: 50%; z-index: 90; }

        /* Theme Manager */
        #theme-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw; max-width: 600px;
            background: rgba(10, 20, 30, 0.95);
            border: 2px solid #00ffff;
            border-radius: 15px;
            z-index: 100000;
            padding: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            flex-direction: column;
        }
        #theme-modal.active { display: flex; }
        .theme-modal-header {
            display: flex; justify-content: space-between; align-items: center;
            color: #00ffff; margin-bottom: 15px; font-size: 20px; font-weight: bold;
        }
        .close-btn { cursor: pointer; font-size: 24px; color: #ff4444; }
        #theme-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
        }
        #theme-gallery-grid::-webkit-scrollbar { width: 8px; }
        #theme-gallery-grid::-webkit-scrollbar-thumb { background: #00ffff; border-radius: 4px; }
        .theme-card {
            height: 90px;
            background-color: #333;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 5px;
            transition: all 0.2s;
        }
        .theme-card:hover { border-color: #00ffff; transform: scale(1.05); }
        .theme-card span {
            background: rgba(0,0,0,0.7); color: #fff; font-size: 12px;
            padding: 2px 6px; border-radius: 4px; pointer-events: none;
        }

        /* Access Overlay */
        #block-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 999999;
            align-items: center; justify-content: center;
            color: red; font-size: 5vw; font-weight: bold; text-align: center;
        }

        /* Global Drawing */
        #global-draw-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 90000;
        }
        #toggle-draw-btn-global {
            position: fixed; bottom: 85px; right: 20px;
            width: 50px; height: 50px; background: #8e44ad;
            border: 2px solid #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #fff; cursor: pointer; z-index: 90001;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.2s;
        }
        #toggle-draw-btn-global:hover { transform: scale(1.1); }
        
        #draw-panel-global {
            display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.95); border: 2px solid #8e44ad; border-radius: 10px;
            padding: 10px; z-index: 90002; flex-direction: column; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            user-select: none;
        }
        .draw-panel-header {
            width: 100%; height: 20px; background: #333; border-radius: 5px;
            cursor: grab; display: flex; justify-content: flex-end; align-items: center; padding: 0 5px;
        }
        .draw-panel-header:active { cursor: grabbing; }
        .draw-close { color: #ff4444; cursor: pointer; font-weight: bold; font-size: 16px; }
        .draw-controls { display: flex; gap: 10px; align-items: center; }
        .draw-tool-btn {
            background: #444; border: none; color: #fff; padding: 8px 12px;
            border-radius: 5px; cursor: pointer; font-size: 16px;
        }
        .draw-tool-btn.active { background: #8e44ad; border: 1px solid #fff; }
        .draw-color-picker { width: 35px; height: 35px; border: none; cursor: pointer; background: transparent; }
        .draw-size-slider { width: 100px; }

        @media (max-width: 768px) {
            .stone-block { font-size: 24px; width: 12vw; height: 12vw; }
            #teacher-panel { width: 250px; }
            .ui-btn { width: 35px; height: 35px; font-size: 16px; }
            #draw-panel-global { flex-wrap: wrap; width: 90vw; }
            .draw-controls { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <svg class="bg-layer" viewBox="0 0 1920 1080" preserveAspectRatio="none">
            <path d="M0,900 Q200,850 400,950 T900,900 T1400,1000 T1920,900 L1920,1080 L0,1080 Z" fill="rgba(0, 24, 41, 0.5)"/>
            <path d="M0,950 Q300,1000 600,900 T1200,980 T1920,950 L1920,1080 L0,1080 Z" fill="rgba(0, 34, 54, 0.6)"/>
            <g opacity="0.6">
                <path d="M150,1080 Q100,800 180,600 Q250,400 150,200" fill="none" stroke="#004d40" stroke-width="30" stroke-linecap="round" class="tentacle"/>
                <path d="M1700,1080 Q1750,700 1650,500 Q1550,300 1700,100" fill="none" stroke="#00332c" stroke-width="40" stroke-linecap="round" class="tentacle"/>
            </g>
        </svg>

        <div id="bubbles-container" class="bg-layer"></div>

        <div id="equation-area">
            <div class="stone-block" id="eq-num1">2</div>
            <div style="font-size: 4vw; color: #fff; text-shadow: 0 0 10px #fff;">+</div>
            <div class="stone-block" id="eq-num2">3</div>
            <div style="font-size: 4vw; color: #fff; text-shadow: 0 0 10px #fff;">=</div>
            <div class="stone-block" id="eq-res" style="color: #00e676; text-shadow: 0 0 10px #00e676;">5</div>
        </div>

        <svg id="zone-1" class="drop-zone anemone-glow" viewBox="0 0 200 200" data-zone="1">
            <defs>
                <radialGradient id="gradZone1" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ff007f" stop-opacity="0.3"/>
                    <stop offset="80%" stop-color="#ff007f" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#99004c" stop-opacity="1"/>
                </radialGradient>
            </defs>
            <circle cx="100" cy="150" r="40" fill="#2a0018"/>
            <g stroke="url(#gradZone1)" stroke-width="15" stroke-linecap="round" fill="none">
                <path d="M100,150 Q50,100 30,50" class="tentacle"/>
                <path d="M100,150 Q80,90 70,30" class="tentacle" style="animation-delay: 0.2s;"/>
                <path d="M100,150 Q120,90 130,30" class="tentacle" style="animation-delay: 0.4s;"/>
                <path d="M100,150 Q150,100 170,50" class="tentacle" style="animation-delay: 0.6s;"/>
                <path d="M100,150 Q40,130 10,100" class="tentacle" style="animation-delay: 0.1s;"/>
                <path d="M100,150 Q160,130 190,100" class="tentacle" style="animation-delay: 0.3s;"/>
            </g>
            <circle cx="100" cy="150" r="20" fill="#ff007f" filter="blur(5px)"/>
        </svg>

        <svg id="zone-2" class="drop-zone anemone-glow" viewBox="0 0 200 200" data-zone="2">
            <defs>
                <radialGradient id="gradZone2" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3"/>
                    <stop offset="80%" stop-color="#00e5ff" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#00838f" stop-opacity="1"/>
                </radialGradient>
            </defs>
            <circle cx="100" cy="150" r="40" fill="#001d23"/>
            <g stroke="url(#gradZone2)" stroke-width="15" stroke-linecap="round" fill="none">
                <path d="M100,150 Q50,100 30,50" class="tentacle"/>
                <path d="M100,150 Q80,90 70,30" class="tentacle" style="animation-delay: 0.5s;"/>
                <path d="M100,150 Q120,90 130,30" class="tentacle" style="animation-delay: 0.1s;"/>
                <path d="M100,150 Q150,100 170,50" class="tentacle" style="animation-delay: 0.3s;"/>
                <path d="M100,150 Q40,130 10,100" class="tentacle" style="animation-delay: 0.6s;"/>
                <path d="M100,150 Q160,130 190,100" class="tentacle" style="animation-delay: 0.2s;"/>
            </g>
            <circle cx="100" cy="150" r="20" fill="#00e5ff" filter="blur(5px)"/>
        </svg>

        <svg id="character" viewBox="0 0 400 400">
            <defs>
                <radialGradient id="octoSkin" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" stop-color="#ff8a65"/>
                    <stop offset="100%" stop-color="#d84315"/>
                </radialGradient>
                <filter id="octoShadow">
                    <feDropShadow dx="0" dy="15" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
                </filter>
            </defs>
            <g filter="url(#octoShadow)" class="breath">
                <g fill="none" stroke="url(#octoSkin)" stroke-width="35" stroke-linecap="round">
                    <path d="M150,250 Q50,350 30,280" class="tentacle" style="animation-delay: 0.1s;"/>
                    <path d="M180,260 Q100,400 120,350" class="tentacle" style="animation-delay: 0.3s;"/>
                    <path d="M220,260 Q300,400 280,350" class="tentacle" style="animation-delay: 0.5s;"/>
                    <path d="M250,250 Q350,350 370,280" class="tentacle" style="animation-delay: 0.2s;"/>
                </g>
                <path d="M100,180 C100,80 300,80 300,180 C300,260 250,280 200,280 C150,280 100,260 100,180 Z" fill="url(#octoSkin)"/>
                <circle cx="160" cy="170" r="25" fill="#fff"/>
                <circle cx="240" cy="170" r="25" fill="#fff"/>
                <g id="octo-pupils">
                    <circle cx="160" cy="170" r="12" fill="#000"/>
                    <circle cx="164" cy="166" r="4" fill="#fff"/>
                    <circle cx="240" cy="170" r="12" fill="#000"/>
                    <circle cx="244" cy="166" r="4" fill="#fff"/>
                </g>
                <path id="octo-mouth" d="M180,220 Q200,240 220,220" fill="none" stroke="#5d4037" stroke-width="6" stroke-linecap="round"/>
            </g>
        </svg>

        <div id="figures-container"></div>
    </div>

    <!-- UI -->
    <div class="ui-btn" id="btn-zoom-in">🔍+</div>
    <div class="ui-btn" id="btn-zoom-out">🔍-</div>
    <div class="ui-btn" id="btn-theme">⚙️</div>
    <div class="ui-btn" id="btn-teacher">🛠</div>

    <!-- Панель вчителя -->
    <div id="teacher-panel">
        <div class="t-row">
            <label>Доданок 1</label>
            <input type="number" id="t-num1" class="t-input" value="2" min="1" max="9">
            <span class="secret-toggle" onclick="toggleSecret(this, 't-num1')">👁️</span>
        </div>
        <div class="t-row">
            <label>Доданок 2</label>
            <input type="number" id="t-num2" class="t-input" value="3" min="1" max="9">
            <span class="secret-toggle" onclick="toggleSecret(this, 't-num2')">👁️</span>
        </div>
        <div class="t-row">
            <label>Умова сортування</label>
            <select id="t-cond" class="t-select">
                <option value="color">За кольором</option>
                <option value="shape">За формою</option>
                <option value="size">За розміром</option>
            </select>
        </div>
        <button id="btn-apply" class="t-btn">СТВОРИТИ ГРУ</button>
    </div>

    <!-- Фон Modal -->
    <div id="theme-modal">
        <div class="theme-modal-header">
            <span>Вибір динамічного фону</span>
            <span class="close-btn" onclick="document.getElementById('theme-modal').classList.remove('active')">✕</span>
        </div>
        <div id="theme-gallery-grid"></div>
    </div>

    <!-- Блок -->
    <div id="block-overlay">Зачекай! Зараз не твій урок.</div>

    <!-- Малювання -->
    <canvas id="global-draw-canvas"></canvas>
    <div id="toggle-draw-btn-global">✏️</div>
    <div id="draw-panel-global">
        <div class="draw-panel-header">
            <span class="draw-close" onclick="closeDrawPanel()">✕</span>
        </div>
        <div class="draw-controls">
            <button class="draw-tool-btn active" id="tool-pencil" onclick="setDrawTool('pencil')">✏️ Олівець</button>
            <button class="draw-tool-btn" id="tool-eraser" onclick="setDrawTool('eraser')">🧽 Гумка</button>
            <input type="color" id="draw-color" class="draw-color-picker" value="#ff0000">
            <input type="range" id="draw-size" class="draw-size-slider" min="1" max="50" value="5">
            <button class="draw-tool-btn" onclick="clearCanvasSync()">🗑️ Очистити</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            gameId: 'underwater_sort_v1',
            projectId: 'lesson-13c44',
            dbUrl: 'https://lesson-13c44-default-rtdb.firebaseio.com/'
        };

        const urlParams = new URLSearchParams(window.location.search);
        let myName = urlParams.get('user') || sessionStorage.getItem('userName');
        if (!myName) {
            myName = 'Гість_' + Math.floor(Math.random() * 1000);
        }
        sessionStorage.setItem('userName', myName);
        const tabId = Math.random().toString(36).substr(2, 9);
        const isTeacher = (myName.toLowerCase() === 'вчитель' || myName.toLowerCase() === 'teacher');

        if (isTeacher) {
            document.getElementById('btn-teacher').style.display = 'flex';
        }

        function toggleSecret(icon, inputId) {
            const el = document.getElementById(inputId);
            el.classList.toggle('secret-text');
            icon.innerText = el.classList.contains('secret-text') ? '🙈' : '👁️';
        }

        let db = null;
        try {
            firebase.initializeApp({ databaseURL: CONFIG.dbUrl, projectId: CONFIG.projectId });
            db = firebase.database();
            
            const connectedRef = db.ref('.info/connected');
            const myPresenceRef = db.ref(`online_users/${myName}/${tabId}`);
            
            connectedRef.on('value', snap => {
                if (snap.val() === true) {
                    myPresenceRef.set(true);
                    myPresenceRef.onDisconnect().remove();
                }
            });

            window.addEventListener('beforeunload', () => myPresenceRef.remove());

            db.ref(`blocked_users/${myName}`).on('value', snap => {
                document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
            });

            let isFirstRefreshCheck = true;
            db.ref('force_refresh').on('value', snap => {
                if (isFirstRefreshCheck) { isFirstRefreshCheck = false; return; }
                if (snap.val() === true) window.location.reload();
            });

            let immunity = true;
            setTimeout(() => immunity = false, 1000);
            db.ref('current_activity').on('value', snap => {
                if (!immunity && snap.val() === 'lobby') {
                    window.location.href = `https://olgazheltvai2.github.io/rizne/lobby.html?user=${encodeURIComponent(myName)}`;
                }
            });

            db.ref('game_theme').on('value', snap => {
                const data = snap.val();
                if (data && data.url) {
                    applyThemeLocal(data.url);
                    localStorage.setItem('mySavedBg_' + CONFIG.gameId, data.url);
                }
            });

            db.ref('game_action').on('value', snap => {
                const action = snap.val();
                if (!action) return;
                const isRemoteAction = (action.senderId !== tabId);
                
                if (action.type === 'start_level' && isRemoteAction) {
                    applyLevelConfig(action.data);
                } else if (action.type === 'move' && isRemoteAction) {
                    remoteMoveFigure(action.data);
                } else if (action.type === 'drop' && isRemoteAction) {
                    remoteDropFigure(action.data);
                } else if (action.type === 'draw_line' && isRemoteAction) {
                    remoteDrawLine(action.data);
                } else if (action.type === 'clear_canvas' && isRemoteAction) {
                    clearCanvasLocal();
                }
            });
        } catch(e) {
            console.warn("Firebase offline", e);
        }

        function sendAction(type, data) {
            if (!db) return;
            db.ref('game_action').set({
                senderId: tabId,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                type: type,
                data: data
            });
        }

        const savedTheme = localStorage.getItem('mySavedBg_' + CONFIG.gameId);
        if (savedTheme) applyThemeLocal(savedTheme);

        function applyThemeLocal(url) {
            if (url === 'none') {
                document.body.style.backgroundImage = 'none';
            } else {
                document.body.style.backgroundImage = `url(${url})`;
            }
        }

        function loadBackgrounds() {
            const gallery = document.getElementById('theme-gallery-grid');
            gallery.innerHTML = '<div class="theme-card" onclick="selectTheme(\'none\')"><span>Без фону</span></div>';
            
            let i = 1;
            const checkNext = () => {
                const url = `https://olgazheltvai2.github.io/images/backgrounds/background_${i}.webp`;
                const img = new Image();
                img.onload = () => {
                    const card = document.createElement('div');
                    card.className = 'theme-card';
                    card.style.backgroundImage = `url(${url})`;
                    card.innerHTML = `<span>Фон ${i}</span>`;
                    card.onclick = () => selectTheme(url);
                    gallery.appendChild(card);
                    i++;
                    checkNext();
                };
                img.onerror = () => {};
                img.src = url;
            };
            checkNext();
        }

        function selectTheme(url) {
            if (db) db.ref('game_theme').set({ url: url, timestamp: firebase.database.ServerValue.TIMESTAMP });
            applyThemeLocal(url);
            localStorage.setItem('mySavedBg_' + CONFIG.gameId, url);
            document.getElementById('theme-modal').classList.remove('active');
        }

        document.getElementById('btn-theme').addEventListener('click', () => {
            document.getElementById('theme-modal').classList.add('active');
            if (document.getElementById('theme-gallery-grid').children.length === 1) loadBackgrounds();
        });

        let currentZoom = 1;
        document.getElementById('btn-zoom-in').addEventListener('click', () => {
            if(currentZoom < 2) currentZoom += 0.1;
            document.getElementById('game-wrapper').style.transform = `scale(${currentZoom})`;
            resizeCanvas(); 
        });
        document.getElementById('btn-zoom-out').addEventListener('click', () => {
            if(currentZoom > 0.5) currentZoom -= 0.1;
            document.getElementById('game-wrapper').style.transform = `scale(${currentZoom})`;
            resizeCanvas();
        });

        const canvas = document.getElementById('global-draw-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false, drawTool = 'pencil', lastX = 0, lastY = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        document.getElementById('toggle-draw-btn-global').addEventListener('click', () => {
            document.getElementById('draw-panel-global').style.display = 'flex';
            canvas.style.pointerEvents = 'auto'; 
            setDrawTool('pencil');
        });

        function closeDrawPanel() {
            document.getElementById('draw-panel-global').style.display = 'none';
            canvas.style.pointerEvents = 'none'; 
        }

        function setDrawTool(tool) {
            drawTool = tool;
            document.getElementById('tool-pencil').classList.toggle('active', tool === 'pencil');
            document.getElementById('tool-eraser').classList.toggle('active', tool === 'eraser');
        }

        function clearCanvasLocal() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function clearCanvasSync() { clearCanvasLocal(); sendAction('clear_canvas', {}); }

        function drawLocal(x0, y0, x1, y1, color, size, isEraser) {
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.strokeStyle = isEraser ? 'rgba(0,0,0,1)' : color;
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            if (isEraser) ctx.globalCompositeOperation = 'destination-out';
            else ctx.globalCompositeOperation = 'source-over';
            ctx.stroke();
            ctx.globalCompositeOperation = 'source-over';
        }

        function remoteDrawLine(data) {
            const rx0 = data.x0 * canvas.width; const ry0 = data.y0 * canvas.height;
            const rx1 = data.x1 * canvas.width; const ry1 = data.y1 * canvas.height;
            drawLocal(rx0, ry0, rx1, ry1, data.color, data.size, data.isEraser);
        }

        function handleDrawStart(e) {
            if (canvas.style.pointerEvents === 'none') return;
            isDrawing = true;
            const {clientX, clientY} = e.touches ? e.touches[0] : e;
            lastX = clientX; lastY = clientY;
        }
        function handleDrawMove(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const {clientX, clientY} = e.touches ? e.touches[0] : e;
            const color = document.getElementById('draw-color').value;
            const size = document.getElementById('draw-size').value;
            const isEraser = (drawTool === 'eraser');
            
            drawLocal(lastX, lastY, clientX, clientY, color, size, isEraser);
            
            sendAction('draw_line', {
                x0: lastX / canvas.width, y0: lastY / canvas.height,
                x1: clientX / canvas.width, y1: clientY / canvas.height,
                color, size, isEraser
            });
            lastX = clientX; lastY = clientY;
        }
        function handleDrawEnd() { isDrawing = false; }

        canvas.addEventListener('mousedown', handleDrawStart);
        canvas.addEventListener('mousemove', handleDrawMove);
        canvas.addEventListener('mouseup', handleDrawEnd);
        canvas.addEventListener('touchstart', handleDrawStart, {passive: false});
        canvas.addEventListener('touchmove', handleDrawMove, {passive: false});
        canvas.addEventListener('touchend', handleDrawEnd);

        const drawHeader = document.querySelector('.draw-panel-header');
        const drawPanel = document.getElementById('draw-panel-global');
        let isDraggingPanel = false, pX = 0, pY = 0;
        drawHeader.addEventListener('mousedown', e => { isDraggingPanel = true; pX = e.clientX - drawPanel.offsetLeft; pY = e.clientY - drawPanel.offsetTop; });
        window.addEventListener('mousemove', e => { if (isDraggingPanel) { drawPanel.style.left = (e.clientX - pX + drawPanel.offsetWidth/2) + 'px'; drawPanel.style.top = (e.clientY - pY) + 'px'; } });
        window.addEventListener('mouseup', () => isDraggingPanel = false);
        drawHeader.addEventListener('touchstart', e => { isDraggingPanel = true; const t = e.touches[0]; pX = t.clientX - drawPanel.offsetLeft; pY = t.clientY - drawPanel.offsetTop; }, {passive:true});
        window.addEventListener('touchmove', e => { if (isDraggingPanel) { const t = e.touches[0]; drawPanel.style.left = (t.clientX - pX + drawPanel.offsetWidth/2) + 'px'; drawPanel.style.top = (t.clientY - pY) + 'px'; } }, {passive:true});
        window.addEventListener('touchend', () => isDraggingPanel = false);

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'grab') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'drop') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now); osc.frequency.linearRampToValueAtTime(1600, now + 0.15);
                gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'error') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'win') {
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, i) => {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.type = 'sine'; o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0, now + i*0.1); g.gain.linearRampToValueAtTime(0.3, now + i*0.1 + 0.05); g.gain.linearRampToValueAtTime(0, now + i*0.1 + 0.3);
                    o.start(now + i*0.1); o.stop(now + i*0.1 + 0.3);
                });
            }
        }

        const TRAITS = {
            colors: { yellow: { fill: '#ffca28', stroke: '#ff8f00', glow: '#ffe082' }, blue: { fill: '#29b6f6', stroke: '#0277bd', glow: '#81d4fa' } },
            shapes: {
                square: `<rect x="15" y="15" width="70" height="70" rx="10" fill="VAR_FILL" stroke="VAR_STROKE" stroke-width="6"/><rect x="25" y="25" width="20" height="20" rx="5" fill="VAR_GLOW" opacity="0.6"/>`,
                triangle: `<path d="M50,10 L90,85 C92,89 89,95 84,95 L16,95 C11,95 8,89 10,85 Z" fill="VAR_FILL" stroke="VAR_STROKE" stroke-width="6"/><path d="M50,30 L75,75 L40,75 Z" fill="VAR_GLOW" opacity="0.5"/>`
            },
            sizes: { small: 0.6, big: 1.1 }
        };

        const container = document.getElementById('figures-container');
        const eqNum1 = document.getElementById('eq-num1'), eqNum2 = document.getElementById('eq-num2'), eqRes = document.getElementById('eq-res');
        const octoMouth = document.getElementById('octo-mouth'), octoPupils = document.getElementById('octo-pupils');
        let zones = { 1: { el: document.getElementById('zone-1'), count: 0, target: 0 }, 2: { el: document.getElementById('zone-2'), count: 0, target: 0 } };
        let isWin = false;

        document.getElementById('btn-teacher').addEventListener('click', () => {
            playSound('grab'); document.getElementById('teacher-panel').classList.toggle('open');
        });

        document.getElementById('btn-apply').addEventListener('click', () => {
            playSound('drop');
            const n1 = parseInt(document.getElementById('t-num1').value) || 2;
            const n2 = parseInt(document.getElementById('t-num2').value) || 3;
            const cond = document.getElementById('t-cond').value;
            document.getElementById('teacher-panel').classList.remove('open');
            generateLevel(n1, n2, cond);
        });

        function generateLevel(num1, num2, condition) {
            const cKeys = Object.keys(TRAITS.colors);
            const sKeys = Object.keys(TRAITS.shapes);
            const zKeys = Object.keys(TRAITS.sizes);

            const g1_color = condition === 'color' ? cKeys[0] : cKeys[Math.floor(Math.random()*2)];
            const g1_shape = condition === 'shape' ? sKeys[0] : sKeys[Math.floor(Math.random()*2)];
            const g1_size  = condition === 'size'  ? zKeys[0] : zKeys[Math.floor(Math.random()*2)];

            const g2_color = condition === 'color' ? cKeys[1] : cKeys[Math.floor(Math.random()*2)];
            const g2_shape = condition === 'shape' ? sKeys[1] : sKeys[Math.floor(Math.random()*2)];
            const g2_size  = condition === 'size'  ? zKeys[1] : zKeys[Math.floor(Math.random()*2)];

            const figuresConfigs = [];
            const placedBoxes = [];

            function getValidPos() {
                let attempts = 0;
                while(attempts < 100) {
                    let left = 25 + Math.random() * 50; 
                    let top = 30 + Math.random() * 35;  
                    let overlap = false;
                    for(let b of placedBoxes) {
                        let dx = b.left - left; let dy = b.top - top;
                        if(Math.sqrt(dx*dx + dy*dy) < 12) { overlap = true; break; }
                    }
                    if(!overlap) {
                        placedBoxes.push({left, top}); return {left, top};
                    }
                    attempts++;
                }
                return {left: 40 + Math.random()*20, top: 40 + Math.random()*20};
            }

            let idCounter = 0;
            for(let i=0; i<num1; i++) {
                let pos = getValidPos();
                figuresConfigs.push({
                    id: 'fig_' + idCounter++,
                    color: condition === 'color' ? g1_color : cKeys[Math.floor(Math.random()*2)],
                    shape: condition === 'shape' ? g1_shape : sKeys[Math.floor(Math.random()*2)],
                    size: condition === 'size' ? g1_size : zKeys[Math.floor(Math.random()*2)],
                    targetZone: 1, left: pos.left, top: pos.top, rot: Math.random() * 60 - 30
                });
            }
            for(let i=0; i<num2; i++) {
                let pos = getValidPos();
                figuresConfigs.push({
                    id: 'fig_' + idCounter++,
                    color: condition === 'color' ? g2_color : cKeys[Math.floor(Math.random()*2)],
                    shape: condition === 'shape' ? g2_shape : sKeys[Math.floor(Math.random()*2)],
                    size: condition === 'size' ? g2_size : zKeys[Math.floor(Math.random()*2)],
                    targetZone: 2, left: pos.left, top: pos.top, rot: Math.random() * 60 - 30
                });
            }

            const levelData = { n1: num1, n2: num2, condition, configs: figuresConfigs };
            applyLevelConfig(levelData);
            sendAction('start_level', levelData);
        }

        function applyLevelConfig(data) {
            isWin = false;
            container.innerHTML = '';
            zones[1].count = 0; zones[1].target = data.n1;
            zones[2].count = 0; zones[2].target = data.n2;

            eqNum1.innerText = data.n1; eqNum2.innerText = data.n2;
            eqRes.innerText = data.n1 + data.n2;
            eqRes.style.color = '#fff';
            octoMouth.setAttribute('d', 'M180,220 Q200,240 220,220');

            data.configs.forEach(conf => {
                const el = document.createElement('div');
                el.className = 'game-figure';
                el.id = conf.id;
                el.dataset.targetZone = conf.targetZone;
                el.dataset.baseScale = TRAITS.sizes[conf.size];
                el.dataset.baseRot = conf.rot;
                el.style.left = conf.left + '%';
                el.style.top = conf.top + '%';
                el.style.transform = `scale(${el.dataset.baseScale}) rotate(${conf.rot}deg)`;
                
                const col = TRAITS.colors[conf.color];
                el.innerHTML = `<svg viewBox="0 0 100 100" width="100%" height="100%" style="overflow:visible;">
                    <filter id="glow-${conf.id}"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="${col.glow}" flood-opacity="0.8"/></filter>
                    <g filter="url(#glow-${conf.id})">
                        ${TRAITS.shapes[conf.shape].replace(/VAR_FILL/g, col.fill).replace(/VAR_STROKE/g, col.stroke).replace(/VAR_GLOW/g, col.glow)}
                    </g></svg>`;
                
                container.appendChild(el);
                setupDrag(el);
            });
        }

        let draggedEl = null, dragOffset = { x: 0, y: 0 }, startPos = {};
        let lastSyncTime = 0;

        function setupDrag(el) {
            const onStart = (e) => {
                if (isWin || el.classList.contains('solved') || canvas.style.pointerEvents === 'auto') return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                dragOffset.x = (clientX - el.getBoundingClientRect().left) / currentZoom;
                dragOffset.y = (clientY - el.getBoundingClientRect().top) / currentZoom;
                
                startPos = { left: el.style.left, top: el.style.top };
                draggedEl = el;
                el.classList.add('dragging');
                playSound('grab');
                octoMouth.setAttribute('d', 'M190,230 Q200,240 210,230 Q200,220 190,230');
            };
            el.addEventListener('mousedown', onStart);
            el.addEventListener('touchstart', onStart, { passive: false });
        }

        const onMove = (e) => {
            if (!draggedEl) return;
            e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const wrapperRect = document.getElementById('game-wrapper').getBoundingClientRect();
            let newX = (clientX - wrapperRect.left) / currentZoom - dragOffset.x;
            let newY = (clientY - wrapperRect.top) / currentZoom - dragOffset.y;
            
            const pctX = (newX / (wrapperRect.width / currentZoom)) * 100;
            const pctY = (newY / (wrapperRect.height / currentZoom)) * 100;
            
            draggedEl.style.left = `${pctX}%`;
            draggedEl.style.top = `${pctY}%`;

            if (Date.now() - lastSyncTime > 40) {
                sendAction('move', { id: draggedEl.id, x: pctX, y: pctY });
                lastSyncTime = Date.now();
            }
        };

        const onEnd = () => {
            if (!draggedEl) return;
            draggedEl.classList.remove('dragging');
            
            const figRect = draggedEl.getBoundingClientRect();
            const figCenter = { x: figRect.left + figRect.width/2, y: figRect.top + figRect.height/2 };
            
            let droppedZone = null;
            for(let z in zones) {
                const zRect = zones[z].el.getBoundingClientRect();
                if (figCenter.x > zRect.left && figCenter.x < zRect.right && figCenter.y > zRect.top && figCenter.y < zRect.bottom) {
                    droppedZone = z; break;
                }
            }
            
            if (droppedZone) {
                if (draggedEl.dataset.targetZone === droppedZone) {
                    handleSuccessDrop(draggedEl, droppedZone);
                    sendAction('drop', { id: draggedEl.id, zone: droppedZone, success: true });
                } else {
                    handleFailDrop(draggedEl);
                    sendAction('drop', { id: draggedEl.id, success: false, origPos: startPos });
                }
            } else {
                draggedEl.style.transform = `scale(${draggedEl.dataset.baseScale}) rotate(${draggedEl.dataset.baseRot}deg)`;
                octoMouth.setAttribute('d', 'M180,220 Q200,240 220,220');
            }
            draggedEl = null;
        };

        window.addEventListener('mousemove', onMove); window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('mouseup', onEnd); window.addEventListener('touchend', onEnd);

        function remoteMoveFigure(data) {
            const el = document.getElementById(data.id);
            if(el && el !== draggedEl) {
                el.style.left = data.x + '%';
                el.style.top = data.y + '%';
                el.classList.add('dragging');
            }
        }
        function remoteDropFigure(data) {
            const el = document.getElementById(data.id);
            if(!el) return;
            el.classList.remove('dragging');
            if(data.success) {
                handleSuccessDrop(el, data.zone);
            } else {
                el.style.left = data.origPos.left;
                el.style.top = data.origPos.top;
                handleFailDrop(el);
            }
        }

        function handleSuccessDrop(el, zone) {
            playSound('drop');
            el.classList.add('solved');
            const zRect = zones[zone].el.getBoundingClientRect();
            const wrapperRect = document.getElementById('game-wrapper').getBoundingClientRect();
            const targetX = (((zRect.left + zRect.width/2 - wrapperRect.left) / currentZoom) / (wrapperRect.width/currentZoom)) * 100;
            const targetY = (((zRect.top + zRect.height/2 - wrapperRect.top) / currentZoom) / (wrapperRect.height/currentZoom)) * 100;
            
            el.style.left = `calc(${targetX}% - 6%)`;
            el.style.top = `calc(${targetY}% - 6%)`;
            el.style.transform = 'scale(0) rotate(180deg)';
            el.style.opacity = '0';
            
            zones[zone].el.style.filter = 'drop-shadow(0 0 50px #fff)';
            setTimeout(() => zones[zone].el.style.filter = '', 300);
            createParticles(zRect.left + zRect.width/2, zRect.top + zRect.height/2, zone == 1 ? '#ff007f' : '#00e5ff');
            
            zones[zone].count++;
            octoMouth.setAttribute('d', 'M170,220 Q200,260 230,220');
            checkWin();
        }

        function handleFailDrop(el) {
            playSound('error');
            el.style.transform = `scale(${el.dataset.baseScale}) rotate(${el.dataset.baseRot}deg)`;
            octoMouth.setAttribute('d', 'M180,240 Q200,220 220,240');
            const svg = el.querySelector('svg');
            const oldFilt = svg.style.filter;
            svg.style.filter = 'drop-shadow(0 0 20px red)';
            setTimeout(() => svg.style.filter = oldFilt, 400);
        }

        function checkWin() {
            if (zones[1].count === zones[1].target && zones[2].count === zones[2].target) {
                isWin = true;
                playSound('win');
                eqRes.style.color = '#00ffff';
                octoMouth.setAttribute('d', 'M160,210 Q200,280 240,210'); 
                for(let i=0; i<20; i++) {
                    setTimeout(() => {
                        const z1Rect = zones[1].el.getBoundingClientRect(); const z2Rect = zones[2].el.getBoundingClientRect();
                        createParticles(z1Rect.left + z1Rect.width/2, z1Rect.top + z1Rect.height/2, '#ff007f', 3);
                        createParticles(z2Rect.left + z2Rect.width/2, z2Rect.top + z2Rect.height/2, '#00e5ff', 3);
                    }, i*100);
                }
            }
        }

        function createParticles(x, y, color, count=10) {
            for(let i=0; i<count; i++) {
                const p = document.createElement('div');
                p.className = 'particle'; p.style.width = (Math.random() * 10 + 5) + 'px'; p.style.height = p.style.width;
                p.style.backgroundColor = color; p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.boxShadow = `0 0 15px ${color}`;
                const angle = Math.random() * Math.PI * 2; const dist = Math.random() * 100 + 50;
                const tx = Math.cos(angle) * dist; const ty = Math.sin(angle) * dist - 50;
                p.style.transition = 'all 0.6s cubic-bezier(0.1, 0.8, 0.3, 1)';
                document.body.appendChild(p);
                requestAnimationFrame(() => { p.style.transform = `translate(${tx}px, ${ty}px) scale(0)`; p.style.opacity = '0'; });
                setTimeout(() => p.remove(), 600);
            }
        }

        setInterval(() => {
            const b = document.createElement('div'); b.className = 'bubble'; b.style.left = `${Math.random() * 100}vw`;
            const size = Math.random() * 20 + 10; b.style.width = `${size}px`; b.style.height = `${size}px`;
            b.style.animationDuration = `${Math.random() * 5 + 4}s`;
            document.getElementById('bubbles-container').appendChild(b); setTimeout(() => b.remove(), 9000);
        }, 800);

        window.addEventListener('mousemove', (e) => {
            const wrapperRect = document.getElementById('game-wrapper').getBoundingClientRect();
            const xOffset = (e.clientX - (wrapperRect.left + wrapperRect.width/2)) / wrapperRect.width;
            const yOffset = (e.clientY - (wrapperRect.top + wrapperRect.height/2)) / wrapperRect.height;
            octoPupils.style.transform = `translate(${xOffset * 15}px, ${yOffset * 15}px)`;
        });

    </script>
</body>
</html>
