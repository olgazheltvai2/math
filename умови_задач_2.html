<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Коротка умова</title>

<!-- Firebase Compat Libraries -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
    :root {
        --bg-color1: #0f2027;
        --bg-color2: #203a43;
        --bg-color3: #2c5364;
        /* Максимально прозорі контейнери */
        --panel-bg: rgba(0, 30, 43, 0.15);
        --slot-bg: rgba(0, 0, 0, 0.25);
        --accent: #00e5ff;
        --accent-hover: #00b8d4;
        --chip-bg1: #ff007f;
        --chip-bg2: #7b1fa2;
        --text: #e0f7fa;
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        
        --font-scale: 1.2;
        --zoom-scale: 1;
    }

    * {
        box-sizing: border-box;
        user-select: none;
    }

    body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg-color1), var(--bg-color2), var(--bg-color3));
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
    }

    .background-anim {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    .bubble {
        position: absolute;
        bottom: -50px;
        background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.05));
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.2);
        animation: rise infinite ease-in;
    }

    @keyframes rise {
        0% { transform: translateY(0) scale(1); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
    }

    .seaweed {
        position: absolute;
        bottom: -20px;
        width: 30px;
        height: 200px;
        background: linear-gradient(to top, #1b5e20, #4caf50);
        border-radius: 20px 20px 0 0;
        transform-origin: bottom center;
        animation: sway 4s infinite alternate ease-in-out;
        opacity: 0.7;
        clip-path: polygon(10% 0, 90% 0, 100% 20%, 80% 40%, 100% 60%, 80% 80%, 100% 100%, 0 100%, 20% 80%, 0 60%, 20% 40%, 0 20%);
    }

    /* Controls Panel (Шрифт та Масштаб) */
    #view-controls {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 100;
        display: flex;
        gap: 10px;
        background: rgba(0,0,0,0.5);
        padding: 8px 12px;
        border-radius: 20px;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255,255,255,0.2);
    }

    .ctrl-btn {
        background: rgba(255,255,255,0.2);
        border: 1px solid rgba(255,255,255,0.4);
        color: white;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
    }
    .ctrl-btn:active { transform: scale(0.9); }

    /* Невидима зона вчителя */
    #teacher-trigger {
        position: absolute;
        top: 0;
        right: 0;
        width: 70px;
        height: 70px;
        z-index: 10000;
        cursor: default;
    }

    #ui-layer {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1200px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 20px;
        padding-top: 70px;
        gap: 20px;
        transform: scale(var(--zoom-scale));
        transform-origin: top center;
        transition: transform 0.3s ease;
    }

    #header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        width: 100%;
        gap: 15px;
    }

    #task-text {
        flex-grow: 1;
        background: var(--panel-bg);
        border: 2px dashed var(--accent);
        border-radius: 25px;
        padding: 20px 30px;
        font-size: calc(2.2vh * var(--font-scale));
        line-height: 1.5;
        box-shadow: var(--shadow);
        backdrop-filter: blur(3px);
        text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
    }

    .header-buttons {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 10px;
        flex-shrink: 0;
        align-items: flex-start;
        justify-content: flex-end;
    }

    .action-btn {
        background: linear-gradient(135deg, var(--accent), var(--accent-hover));
        color: #000;
        border: none;
        padding: 15px 25px;
        font-size: calc(1.8vh * var(--font-scale));
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 0 15px var(--accent);
        transition: transform 0.2s, box-shadow 0.2s;
        text-transform: lowercase;
    }
    
    /* Приховані від учнів кнопки перевірки */
    .teacher-only { display: none; }
    
    .btn-peek {
        background: linear-gradient(135deg, #9b59b6, #8e44ad);
        color: white;
        box-shadow: 0 0 15px #9b59b6;
    }
    .btn-correct {
        background: linear-gradient(135deg, #2ecc71, #27ae60);
        box-shadow: 0 0 15px #2ecc71;
        padding: 15px !important;
    }
    .btn-incorrect {
        background: linear-gradient(135deg, #e74c3c, #c0392b);
        box-shadow: 0 0 15px #e74c3c;
        padding: 15px !important;
    }

    .action-btn:active { transform: scale(0.95); }

    #play-area {
        display: flex;
        flex-direction: row;
        flex-grow: 1;
        gap: 30px;
        min-height: 0;
    }

    #grid-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
        background: var(--panel-bg);
        border-radius: 30px;
        padding: 30px;
        box-shadow: inset 0 0 50px rgba(0,0,0,0.2), var(--shadow);
        backdrop-filter: blur(3px);
    }

    .grid-row {
        display: flex;
        gap: 20px;
        align-items: center;
        justify-content: center;
        height: 90px;
    }

    .slot {
        background: var(--slot-bg);
        border: 2px dashed rgba(255,255,255,0.5);
        border-radius: 15px;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
        box-shadow: inset 0 5px 15px rgba(0,0,0,0.6);
        cursor: pointer;
        position: relative;
    }
    .slot:hover { border-color: var(--accent); }

    .slot.word-slot { width: 60%; }
    .slot.num-slot { width: 30%; }

    /* Оверлей-підказка для вчителя */
    .hint-overlay {
        display: none;
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.85);
        color: #00ff00;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        border-radius: 13px;
        z-index: 50;
        pointer-events: none; /* Щоб кліки проходили до слоту */
        font-size: calc(2vh * var(--font-scale));
        text-align: center;
        padding: 5px;
    }
    body.show-hints .hint-overlay { display: flex; }

    #bank-container {
        flex: 1;
        background: var(--panel-bg);
        border-radius: 30px;
        padding: 30px;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        justify-content: center;
        gap: 15px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(3px);
        overflow-y: auto;
    }

    .chip {
        background: linear-gradient(135deg, var(--chip-bg1), var(--chip-bg2));
        padding: 15px 25px;
        border-radius: 15px;
        font-size: calc(2.2vh * var(--font-scale));
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.3);
        border: 2px solid transparent;
        transition: transform 0.1s, opacity 0.3s, border 0.2s, box-shadow 0.2s;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        z-index: 10;
    }

    .chip:active { transform: scale(0.9); }
    
    .chip.selected {
        border: 2px solid #fff;
        box-shadow: 0 0 20px 5px #ffeb3b;
        transform: scale(1.05);
        z-index: 20;
    }
    
    .chip.in-slot {
        width: 100%;
        height: 100%;
        margin: 0;
        box-shadow: inset 0 2px 5px rgba(255,255,255,0.3);
        border: none;
        transform: none !important;
    }

    .shake {
        animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
        10%, 90% { transform: translate3d(-2px, 0, 0); }
        20%, 80% { transform: translate3d(4px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
        40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    #particles {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 100;
    }

    @media (max-width: 768px) {
        #header { flex-direction: column; align-items: stretch; }
        .header-buttons { justify-content: space-between; }
        .action-btn { flex: 1; padding: 10px; }
        #play-area { flex-direction: column; }
        .grid-row { height: 75px; }
        #task-text { padding: 15px; }
        .chip { padding: 10px 15px; }
    }

    /* Модалка Теми */
    #theme-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: #34495e;
        color: white;
        font-size: 24px;
        border: 2px solid white;
        cursor: pointer;
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #theme-modal {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90%;
        max-width: 600px;
        background: rgba(15, 32, 39, 0.95);
        border: 2px solid #00e5ff;
        border-radius: 15px;
        z-index: 100001;
        flex-direction: column;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    #theme-header {
        display: flex;
        justify-content: space-between;
        padding: 15px;
        border-bottom: 1px solid rgba(255,255,255,0.2);
        font-weight: bold;
        color: white;
    }
    #theme-close { cursor: pointer; color: #ff5252; font-size: 20px; }
    #theme-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 15px;
        padding: 15px;
        max-height: 60vh;
        overflow-y: auto;
    }
    .theme-card {
        position: relative;
        height: 90px;
        border-radius: 8px;
        cursor: pointer;
        background-size: cover;
        background-position: center;
        border: 2px solid transparent;
        transition: 0.2s;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        overflow: hidden;
    }
    .theme-card:hover { border-color: #00e5ff; transform: scale(1.05); }
    .theme-card span {
        background: rgba(0,0,0,0.7);
        color: white;
        width: 100%;
        text-align: center;
        font-size: 12px;
        padding: 4px 0;
        pointer-events: none;
    }
    .theme-card.no-bg { background: #555; }

    /* Олівець */
    #toggle-draw-btn-global {
        position: fixed;
        bottom: 85px;
        right: 20px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: #8e44ad;
        color: white;
        font-size: 24px;
        border: 2px solid white;
        cursor: pointer;
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #draw-panel-global {
        display: none;
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(30, 30, 30, 0.95);
        border: 2px solid #8e44ad;
        border-radius: 10px;
        z-index: 100001;
        padding: 10px;
        color: white;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        flex-direction: column;
        gap: 10px;
        width: 180px;
    }
    .draw-header {
        display: flex;
        justify-content: flex-end;
        cursor: move;
        background: rgba(255,255,255,0.1);
        padding: 5px;
        border-radius: 5px;
        height: 25px;
    }
    .draw-close { cursor: pointer; color: #ff5252; font-weight: bold; font-size: 16px; line-height: 15px;}
    .draw-controls-row { display: flex; justify-content: space-between; gap: 5px; }
    .draw-btn {
        flex: 1; padding: 5px; background: #333; border: 1px solid #555; color: white; cursor: pointer; border-radius: 5px; text-align: center; font-size: 14px;
    }
    .draw-btn.active { background: #8e44ad; border-color: #fff; }
    #draw-canvas-global {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: 90000; pointer-events: none;
    }
</style>
</head>
<body>

<div id="view-controls">
    <button class="ctrl-btn" onclick="changeFontSize(-0.1)" title="Зменшити шрифт">A-</button>
    <button class="ctrl-btn" onclick="changeFontSize(0.1)" title="Збільшити шрифт">A+</button>
    <button class="ctrl-btn" onclick="changeZoom(-0.1)" title="Віддалити">🔍-</button>
    <button class="ctrl-btn" onclick="changeZoom(0.1)" title="Наблизити">🔍+</button>
</div>

<!-- Невидима зона вчителя -->
<div id="teacher-trigger" onclick="enableTeacherMode()" title=""></div>

<div class="background-anim" id="bg-anim"></div>
<canvas id="particles"></canvas>
<canvas id="draw-canvas-global"></canvas>

<div id="ui-layer">
    <div id="header">
        <div id="task-text"></div>
        <div class="header-buttons">
            <button class="action-btn teacher-only btn-peek" onclick="togglePeek()">відповідь 👁️</button>
            <button class="action-btn teacher-only btn-correct" onclick="emitCorrect()">✅</button>
            <button class="action-btn teacher-only btn-incorrect" onclick="emitIncorrect()">❌</button>
            <button class="action-btn" onclick="handleNextClick()">далі ➔</button>
        </div>
    </div>
    <div id="play-area">
        <div id="grid-container">
            <div class="grid-row" data-row="0">
                <div class="slot word-slot" data-type="word" data-id="slot_w0" onclick="handleSlotClick(this)"></div>
                <div class="slot num-slot" data-type="num" data-id="slot_n0" onclick="handleSlotClick(this)"></div>
            </div>
            <div class="grid-row" data-row="1">
                <div class="slot word-slot" data-type="word" data-id="slot_w1" onclick="handleSlotClick(this)"></div>
                <div class="slot num-slot" data-type="num" data-id="slot_n1" onclick="handleSlotClick(this)"></div>
            </div>
            <div class="grid-row" data-row="2">
                <div class="slot word-slot" data-type="word" data-id="slot_w2" onclick="handleSlotClick(this)"></div>
                <div class="slot num-slot" data-type="num" data-id="slot_n2" onclick="handleSlotClick(this)"></div>
            </div>
        </div>
        <div id="bank-container"></div>
    </div>
</div>

<button id="theme-btn">⚙️</button>
<div id="theme-modal">
    <div id="theme-header"><span>Оберіть фон</span> <span id="theme-close">✕</span></div>
    <div id="theme-gallery">
        <div class="theme-card no-bg" onclick="selectTheme('none')"><span>Без фону</span></div>
    </div>
</div>

<button id="toggle-draw-btn-global">✏️</button>
<div id="draw-panel-global">
    <div class="draw-header"><span class="draw-close">✕</span></div>
    <div class="draw-controls-row">
        <div class="draw-btn active" id="tool-pencil">✏️ Олівець</div>
        <div class="draw-btn" id="tool-eraser">🧽 Гумка</div>
    </div>
    <input type="range" id="draw-size" min="1" max="50" value="5" style="width:100%">
    <input type="color" id="draw-color" value="#ffff00" style="width:100%; height:30px;">
    <div class="draw-btn" id="tool-clear" style="background:#c0392b;">🗑️ Очистити</div>
</div>

<script>
    // --- Конфігурація та Firebase ---
    const CONFIG = {
        projectId: 'lesson-13c44',
        gameId: 'short_condition_game_v1_final'
    };

    firebase.initializeApp({
        databaseURL: `https://${CONFIG.projectId}-default-rtdb.firebaseio.com/`
    });
    const db = firebase.database();
    
    // Ідентифікатори
    const tabId = Math.random().toString(36).substr(2, 9);
    const urlParams = new URLSearchParams(window.location.search);
    let myName = urlParams.get('user');
    if (!myName) myName = sessionStorage.getItem('userName');
    if (!myName) {
        myName = 'Гість_' + Math.floor(Math.random() * 1000);
    }
    sessionStorage.setItem('userName', myName);
    
    // clientId гарантує унікальність вкладки
    const clientId = myName + '_' + tabId;
    
    let isRemoteAction = false;
    let isTeacher = false;
    
    // Гілка action_gameId для надійної синхронізації кліків
    function sendAction(type, data) {
        if (isRemoteAction) return;
        const safeData = data ? JSON.parse(JSON.stringify(data)) : { dummy: true };
        db.ref(`action_${CONFIG.gameId}`).set({
            senderId: clientId, 
            timestamp: firebase.database.ServerValue.TIMESTAMP,
            type: type,
            data: safeData,
            actionId: Math.random().toString(36).substr(2, 9)
        });
    }

    db.ref(`action_${CONFIG.gameId}`).on('value', snap => {
        const val = snap.val();
        if (!val || val.senderId === clientId) return; // Ігноруємо свої ж дії
        
        isRemoteAction = true;
        try {
            if (val.type === 'select_chip') {
                syncChipSelection(val.data.chipId || '');
            } else if (val.type === 'place_chip') {
                placeChipInSlotLocally(val.data.chipId, val.data.slotId);
                syncChipSelection(''); 
            } else if (val.type === 'return_chip') {
                returnChipToBankLocally(val.data.chipId);
            } else if (val.type === 'reset_board') {
                syncChipSelection('');
            } else if (val.type === 'teacher_correct') {
                triggerCorrect();
            } else if (val.type === 'teacher_incorrect') {
                triggerIncorrect();
            } else if (val.type === 'draw_line') {
                remoteDrawLine(val.data);
            } else if (val.type === 'clear_canvas') {
                clearCanvasLocally();
            }
        } catch (e) { console.error(e); }
        isRemoteAction = false;
    });

    // Гілка рівня. Завдяки цьому гра гарантовано працює після перезавантаження сторінки
    db.ref(`level_${CONFIG.gameId}`).on('value', snap => {
        const val = snap.val();
        if (val) {
            applyLevel(val);
        }
    });

    // --- Логіка відображення (Шрифт, Масштаб, Вчитель) ---
    let currentFontScale = 1.2;
    let currentZoomScale = 1;
    function changeFontSize(delta) {
        currentFontScale = Math.max(0.8, Math.min(2.5, currentFontScale + delta));
        document.documentElement.style.setProperty('--font-scale', currentFontScale);
    }
    function changeZoom(delta) {
        currentZoomScale = Math.max(0.5, Math.min(2.0, currentZoomScale + delta));
        document.documentElement.style.setProperty('--zoom-scale', currentZoomScale);
    }

    // --- Захоплення ролі вчителя (Хто перший натиснув, той і вчитель) ---
    function enableTeacherMode() {
        if (isTeacher) return;
        db.ref(`teacher_${CONFIG.gameId}`).once('value', snap => {
            // Записуємо Вчителя за його ІМЕНЕМ. Це дозволяє вчителю оновлювати сторінку без втрати кнопок
            if (!snap.exists() || snap.val() === myName) {
                db.ref(`teacher_${CONFIG.gameId}`).set(myName);
                // При закритті вкладки або втраті з'єднання статус миттєво звільняється
                db.ref(`teacher_${CONFIG.gameId}`).onDisconnect().remove();
                activateTeacherUI();
            }
        });
    }

    function activateTeacherUI() {
        isTeacher = true;
        document.querySelectorAll('.teacher-only').forEach(el => el.style.display = 'inline-block');
        const trigger = document.getElementById('teacher-trigger');
        if (trigger) {
            trigger.style.display = 'none';
            trigger.style.pointerEvents = 'none';
        }
    }

    // Слухаємо статус вчителя (Блокування зони для учнів і звільнення)
    db.ref(`teacher_${CONFIG.gameId}`).on('value', snap => {
        const currentTeacherName = snap.val();
        
        if (currentTeacherName) {
            if (currentTeacherName === myName) {
                // Це ми! Навіть якщо ми щойно оновили сторінку, система нас впізнає
                activateTeacherUI();
            } else {
                // Вчитель хтось інший (учень). Блокуємо і ховаємо кнопку-тригер.
                const trigger = document.getElementById('teacher-trigger');
                if (trigger) {
                    trigger.style.display = 'none';
                    trigger.style.pointerEvents = 'none';
                }
                isTeacher = false;
                document.querySelectorAll('.teacher-only').forEach(el => el.style.display = 'none');
            }
        } else {
            // Вчитель вийшов/оновив сторінку. Роль вільна, зона знову доступна для кліку всім.
            const trigger = document.getElementById('teacher-trigger');
            if (trigger) {

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx;
    function initAudio() {
        if (!actx) actx = new AudioContext();
    }
    function playTone(freq, type, duration, vol=0.1) {
        if (!actx) return;
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        gain.gain.setValueAtTime(vol, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + duration);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + duration);
    }
    function sndPop() { playTone(600, 'sine', 0.1, 0.2); }
    function sndDrop() { playTone(400, 'triangle', 0.1, 0.2); }
    function sndErr() { playTone(150, 'sawtooth', 0.3, 0.3); }
    function sndWin() {
        [400, 500, 600, 800].forEach((f, i) => {
            setTimeout(() => playTone(f, 'sine', 0.2, 0.2), i * 100);
        });
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }

    function handleNextClick() {
        initAudio();
        sndPop();
        document.body.classList.remove('show-hints');
        
        let taskIdx = Math.floor(Math.random() * tasks.length);
        const task = tasks[taskIdx];
        let A, B, wrongNum;
        
        if (task.typeStr === "A+B=?") {
            A = Math.floor(Math.random() * 8) + 2; B = Math.floor(Math.random() * 8) + 2;
        } else if (task.typeStr === "A-B=?") {
            B = Math.floor(Math.random() * 8) + 2; A = B + Math.floor(Math.random() * 5) + 1;
        } else if (task.typeStr === "A+?=B") {
            A = Math.floor(Math.random() * 8) + 2; let diff = Math.floor(Math.random() * 8) + 2; B = A + diff;
        } else if (task.typeStr === "?-A=B") {
            A = Math.floor(Math.random() * 8) + 2; B = Math.floor(Math.random() * 8) + 2;
        }

        let ans = (task.typeStr === "A+B=?" || task.typeStr === "?-A=B") ? A+B : (task.typeStr === "A-B=?") ? A-B : B-A;
        wrongNum = ans + (Math.random() > 0.5 ? 2 : -1);
        if (wrongNum < 1) wrongNum = ans + 3;

        let payload = { taskIdx, A, B, wrongNum };
        
        // Зберігаємо рівень. Це автоматично запустить applyLevel() в усіх гравців.
        db.ref(`level_${CONFIG.gameId}`).set(payload);
        
        // Очищаємо екран від виділень
        sendAction('reset_board', {});
    }

    function applyLevel(payload) {
        const task = tasks[payload.taskIdx];
        const A = payload.A;
        const B = payload.B;
        
        let answerStr, valArr;

        if (task.typeStr === "A+B=?") {
            answerStr = (A + B).toString(); valArr = [A.toString(), B.toString(), '?'];
        } else if (task.typeStr === "A-B=?") {
            answerStr = (A - B).toString(); valArr = [A.toString(), B.toString(), '?'];
        } else if (task.typeStr === "A+?=B") {
            answerStr = (B - A).toString(); valArr = [A.toString(), '?', B.toString()];
        } else if (task.typeStr === "?-A=B") {
            answerStr = (A + B).toString(); valArr = ['?', A.toString(), B.toString()];
        }

        currentLevel = {
            text: task.text.replace('{A}', A).replace('{B}', B),
            keys: task.keys,
            values: valArr,
            answerStr: answerStr
        };

        document.getElementById('task-text').textContent = currentLevel.text;
        syncChipSelection(''); 
        
        chipsData = [
            { id: 'cw0', type: 'word', val: currentLevel.keys[0] },
            { id: 'cw1', type: 'word', val: currentLevel.keys[1] },
            { id: 'cw2', type: 'word', val: currentLevel.keys[2] },
            { id: 'cn0', type: 'num', val: currentLevel.values[0] }, 
            { id: 'cn1', type: 'num', val: currentLevel.values[1] }, 
            { id: 'cn2', type: 'num', val: currentLevel.values[2] }, 
            { id: 'cw_dist1', type: 'word', val: task.distractors[0] },
            { id: 'cw_dist2', type: 'word', val: task.distractors[1] },
            { id: 'cn_ans', type: 'num', val: answerStr },
            { id: 'cn_dist', type: 'num', val: payload.wrongNum.toString() }
        ];
        
        let uniqueChips = [];
        let seenIds = new Set();
        chipsData.forEach(c => {
            if(!seenIds.has(c.id)) { seenIds.add(c.id); uniqueChips.push(c); }
        });
        
        shuffle(uniqueChips);

        const bank = document.getElementById('bank-container');
        bank.innerHTML = '';
        uniqueChips.forEach(c => {
            const el = document.createElement('div');
            el.className = 'chip';
            el.textContent = c.val;
            el.dataset.type = c.type; 
            el.dataset.val = c.val;
            el.dataset.id = c.id;
            el.addEventListener('click', () => handleChipClickLocal(el));
            bank.appendChild(el);
        });

        for (let i = 0; i < 3; i++) {
            let expectedWord = currentLevel.keys[i];
            let peekNum = currentLevel.values[i];

            let wSlot = document.querySelector(`.grid-row[data-row="${i}"] .word-slot`);
            let nSlot = document.querySelector(`.grid-row[data-row="${i}"] .num-slot`);
            
            // Чистимо слоти від старих фішок
            Array.from(wSlot.children).forEach(c => { if(c.classList.contains('chip')) c.remove(); });
            Array.from(nSlot.children).forEach(c => { if(c.classList.contains('chip')) c.remove(); });
            
            // Створюємо або оновлюємо підказку для вчителя
            let hintW = wSlot.querySelector('.hint-overlay');
            if(!hintW) {
                hintW = document.createElement('div');
                hintW.className = 'hint-overlay';
                wSlot.appendChild(hintW);
            }
            hintW.textContent = expectedWord;

            let hintN = nSlot.querySelector('.hint-overlay');
            if(!hintN) {
                hintN = document.createElement('div');
                hintN.className = 'hint-overlay';
                nSlot.appendChild(hintN);
            }
            hintN.textContent = peekNum;
        }
    }

    function syncChipSelection(chipId) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        if (chipId && chipId !== '') {
            const c = document.querySelector(`.chip[data-id="${chipId}"]`);
            if (c) {
                c.classList.add('selected');
                selectedChip = c;
            } else {
                selectedChip = null;
            }
        } else {
            selectedChip = null;
        }
    }

    function handleChipClickLocal(chip) {
        initAudio();
        if (chip.parentElement.id === 'bank-container') {
            if (selectedChip === chip) {
                syncChipSelection('');
                sendAction('select_chip', { chipId: '' });
            } else {
                syncChipSelection(chip.dataset.id);
                sendAction('select_chip', { chipId: chip.dataset.id });
                sndPop();
            }
        } else {
            let chipId = chip.dataset.id;
            returnChipToBankLocally(chipId);
            sendAction('return_chip', { chipId });
        }
    }

    function handleSlotClick(slot) {
        if (!selectedChip) return;
        
        // ВАЖЛИВО: Видалено обмеження за типом. Дитина може ставити що завгодно і куди завгодно.
        let chipId = selectedChip.dataset.id;
        let slotId = slot.dataset.id;
        
        placeChipInSlotLocally(chipId, slotId);
        syncChipSelection(''); 
        sendAction('place_chip', { chipId, slotId }); 
    }

    function placeChipInSlotLocally(chipId, slotId) {
        const chip = document.querySelector(`.chip[data-id="${chipId}"]`);
        const slot = document.querySelector(`.slot[data-id="${slotId}"]`);
        if (!chip || !slot) return;

        const existingChip = slot.querySelector('.chip');
        if (existingChip) {
            existingChip.classList.remove('in-slot');
            document.getElementById('bank-container').appendChild(existingChip);
        }

        chip.classList.add('in-slot');
        slot.appendChild(chip);
        sndDrop();
    }

    function returnChipToBankLocally(chipId) {
        const chip = document.querySelector(`.chip[data-id="${chipId}"]`);
        if (!chip) return;
        chip.classList.remove('in-slot');
        document.getElementById('bank-container').appendChild(chip);
        sndDrop();
    }

    function triggerIncorrect() {
        sndErr();
        const rows = document.querySelectorAll('.grid-row');
        let toEject = [];

        rows.forEach((row, i) => {
            const wSlot = row.querySelector('.word-slot');
            const nSlot = row.querySelector('.num-slot');

            const wChip = wSlot.querySelector('.chip');
            const nChip = nSlot.querySelector('.chip');

            let expectedNum = currentLevel.values[i]; 

            if (wChip && wChip.dataset.val !== currentLevel.keys[i]) {
                toEject.push({ chip: wChip, row: row });
            }
            if (nChip && nChip.dataset.val !== expectedNum) {
                toEject.push({ chip: nChip, row: row });
            }
        });

        // Видаляємо дублікати рядків для візуальної тряски
        let rowsToShake = new Set(toEject.map(item => item.row));
        rowsToShake.forEach(row => row.classList.add('shake'));

        setTimeout(() => {
            rowsToShake.forEach(row => row.classList.remove('shake'));
            toEject.forEach(item => {
                item.chip.classList.remove('in-slot');
                document.getElementById('bank-container').appendChild(item.chip);
            });
        }, 500);
    }

    // --- Canvas Confetti ---
    const canvas = document.getElementById('particles');

    function resizeCanvas() {

    function spawnConfetti() {
        for(let i=0; i<100; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                vx: (Math.random() - 0.5) * 20,
                vy: (Math.random() - 0.5) * 20,
                size: Math.random() * 10 + 5,
                color: `hsl(${Math.random()*360}, 100%, 50%)`,
                life: 1
            });
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.5;
            p.life -= 0.02;
            if (p.life <= 0) {
                particles.splice(i, 1);
                continue;
            }
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
    }

    }

    function getMousePos(e) {
        const rect = drawCanvas.getBoundingClientRect();
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
        if (!isDrawMode) return;
        drawing = true;
        const pos = getMousePos(e);
        lastX = pos.x; lastY = pos.y;
    }

    function doDraw(e) {
        if (!drawing || !isDrawMode) return;
        e.preventDefault();
        const pos = getMousePos(e);
        const color = document.getElementById('draw-color').value;
        const size = document.getElementById('draw-size').value;
        
        drawLineLocally(lastX, lastY, pos.x, pos.y, color, size, currentTool);
        
        sendAction('draw_line', {
            x0: lastX / drawCanvas.width, y0: lastY / drawCanvas.height,
            x1: pos.x / drawCanvas.width, y1: pos.y / drawCanvas.height,
            color, size, tool: currentTool
        });
        
        lastX = pos.x; lastY = pos.y;
    }

    function endDraw() { drawing = false; }

    function drawLineLocally(x0, y0, x1, y1, color, size, tool) {
        dCtx.beginPath();
        dCtx.moveTo(x0, y0);
        dCtx.lineTo(x1, y1);
        dCtx.strokeStyle = tool === 'eraser' ? 'rgba(0,0,0,1)' : color;
        dCtx.lineWidth = size;
        dCtx.lineCap = 'round';
        if (tool === 'eraser') {
            dCtx.globalCompositeOperation = 'destination-out';
        } else {
            dCtx.globalCompositeOperation = 'source-over';
        }
        dCtx.stroke();
    }

    function remoteDrawLine(data) {
        drawLineLocally(
            data.x0 * drawCanvas.width, data.y0 * drawCanvas.height,
            data.x1 * drawCanvas.width, data.y1 * drawCanvas.height,
            data.color, data.size, data.tool
        );
    }

    drawCanvas.addEventListener('mousedown', startDraw);
    drawCanvas.addEventListener('mousemove', doDraw);
    drawCanvas.addEventListener('mouseup', endDraw);
    drawCanvas.addEventListener('touchstart', startDraw, {passive: false});
    drawCanvas.addEventListener('touchmove', doDraw, {passive: false});
    drawCanvas.addEventListener('touchend', endDraw);

    const drawHeader = document.querySelector('.draw-header');
    let isDragging = false, dragX = 0, dragY = 0;
    drawHeader.onmousedown = (e) => {
        isDragging = true;
        dragX = e.clientX - drawPanel.offsetLeft;
        dragY = e.clientY - drawPanel.offsetTop;
    };
    window.onmousemove = (e) => {
        if (isDragging) {
            drawPanel.style.left = (e.clientX - dragX) + 'px';
            drawPanel.style.top = (e.clientY - dragY) + 'px';
        }
    };
    window.onmouseup = () => isDragging = false;

    // --- Універсальний Блок Контролю (Ідентифікація, Радар, Блокування, Імунітет Лобі) ---
    document.body.insertAdjacentHTML('beforeend', `
        <div id="block-overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); z-index:999999; justify-content:center; align-items:center;">
            <div style="color:red; font-size:40px; font-weight:bold; font-family:Arial; text-align:center;">Зачекай!<br>Зараз не твій урок.</div>
        </div>
    `);

    const radarRef = db.ref(`online_users/${myName}/${tabId}`);
    
    db.ref('.info/connected').on('value', snap => {
        if (snap.val() === true) {
            radarRef.set(true);
            radarRef.onDisconnect().remove();
        }
    });

    // Надійно очищуємо статус вчителя при виході зі сторінки або переході в Лобі
    window.addEventListener('beforeunload', () => { 
        radarRef.remove(); 
        if (isTeacher) {
            db.ref(`teacher_${CONFIG.gameId}`).remove();
        }
    });

    let isInitialRefresh = true;
    db.ref('force_refresh').on('value', snap => {
        if (!isInitialRefresh && snap.val() === true) {
            location.reload();
        }
        isInitialRefresh = false;
    });

    db.ref(`blocked_users/${myName}`).on('value', snap => {
        document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
    });

    // Надійний імунітет Лобі при старті (1500 мс)
    const loadTime = Date.now();
    db.ref('current_activity').on('value', snap => {
        if (Date.now() - loadTime > 1500 && snap.val() === 'lobby') {
            if (isTeacher) db.ref(`teacher_${CONFIG.gameId}`).remove(); // Звільняємо роль перед переходом
            window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
        }
    });

    // --- Запуск ---
    generateBackground();
    loadThemes();
    animate();
    
    // Генеруємо рівень, якщо його ще немає в базі
    db.ref(`level_${CONFIG.gameId}`).once('value', snap => {
        if (!snap.exists()) {
            handleNextClick(); 
        }
    });

</script>
</body>
</html>
