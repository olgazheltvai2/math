<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Таємний Код Скрині</title>
<style>
  /* ================= ОСНОВНІ СТИЛІ ТА СКИДАННЯ ================= */
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
  }

  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: #0d1b2a;
  }

  /* Контейнер всієї сцени */
  #game-scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.5vh 2.5vw;
    z-index: 1;
  }

  /* Фоновий SVG на весь екран */
  #bg-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Canvas для салюту, блискіток та магічного пилу */
  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 25;
    pointer-events: none;
  }

  /* ================= АНІМАЦІЇ ФОНУ ТА ПЕРСОНАЖА ================= */
  @keyframes palmSway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(3.2deg); }
  }
  @keyframes palmSwayReverse {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-2.8deg); }
  }
  @keyframes waveFloat {
    0%, 100% { transform: translateX(0px) translateY(0px); }
    50% { transform: translateX(18px) translateY(4px); }
  }
  @keyframes sunPulse {
    0%, 100% { opacity: 0.75; transform: scale(1); }
    50% { opacity: 0.95; transform: scale(1.06); }
  }
  @keyframes parrotIdle {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(1.5deg); }
  }
  @keyframes parrotHappy {
    0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
    25% { transform: translateY(-22px) scale(1.06) rotate(-8deg); }
    50% { transform: translateY(-5px) scale(1.02) rotate(6deg); }
    75% { transform: translateY(-18px) scale(1.05) rotate(-5deg); }
  }
  @keyframes parrotSad {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-8px) rotate(-6deg); }
    40% { transform: translateX(8px) rotate(6deg); }
    60% { transform: translateX(-6px) rotate(-4deg); }
    80% { transform: translateX(6px) rotate(4deg); }
  }
  @keyframes wingFlap {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-28deg) translateY(-6px); }
  }

  .palm-left { transform-origin: 0% 40%; animation: palmSway 6s ease-in-out infinite; }
  .palm-right { transform-origin: 100% 35%; animation: palmSwayReverse 7s ease-in-out infinite; }
  .wave-anim-1 { animation: waveFloat 5s ease-in-out infinite; }
  .wave-anim-2 { animation: waveFloat 7s ease-in-out infinite reverse; }
  .sun-glow { transform-origin: 50% 45%; animation: sunPulse 5s ease-in-out infinite; }

  /* ================= ЛІВА ЧАСТИНА: ТАБЛИЦЯ-КЛЮЧ (3x3) ================= */
  #left-panel {
    position: relative;
    z-index: 5;
    width: 42%;
    max-width: 560px;
    height: 92vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  /* Дерев'яно-золота рама таблиці */
  .ancient-board {
    position: relative;
    width: 100%;
    padding: 22px 24px 26px 24px;
    border-radius: 28px;
    background: 
      radial-gradient(circle at 20% 20%, rgba(255, 200, 110, 0.14), transparent 60%),
      repeating-linear-gradient(90deg, #4a2810 0px, #583115 14px, #3f210c 28px),
      linear-gradient(145deg, #5c3417, #2f1708);
    border: 6px solid #c8963e;
    box-shadow: 
      0 18px 40px rgba(0,0,0,0.75),
      inset 0 0 25px rgba(0,0,0,0.85),
      inset 0 2px 4px rgba(255, 230, 150, 0.6);
  }

  /* Золоті кутики на дошці */
  .board-corner {
    position: absolute;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff3a8, #d49b27 60%, #6e4808 100%);
    box-shadow: 0 3px 6px rgba(0,0,0,0.6), inset 0 1px 2px #fff;
    z-index: 2;
  }
  .board-corner.tl { top: 10px; left: 10px; }
  .board-corner.tr { top: 10px; right: 10px; }
  .board-corner.bl { bottom: 10px; left: 10px; }
  .board-corner.br { bottom: 10px; right: 10px; }

  /* Сітка: 3 колонки чисел + 1 колонка справа для фігур */
  .matrix-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr) 1.15fr;
    grid-template-rows: auto repeat(3, 1fr);
    gap: 12px;
    width: 100%;
    aspect-ratio: 4.15 / 3.9;
    align-items: stretch;
  }

  /* Верхні клітинки кольорів */
  .color-header-cell {
    border-radius: 18px;
    background: linear-gradient(145deg, #2d180a, #1b0e05);
    border: 3px solid #9c6f27;
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.85), 0 4px 8px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    position: relative;
  }

  /* Порожній правий верхній кут сітки (прикрашений компасом/зіркою) */
  .corner-ornament-cell {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Клітинки з числами 1-9 */
  .number-cell {
    position: relative;
    border-radius: 18px;
    background: 
      radial-gradient(circle at 30% 25%, #f7e2b8, #d9b372 65%, #9e7332 100%);
    border: 4px solid #6b4415;
    box-shadow: 
      0 6px 0 #3d2408,
      0 10px 16px rgba(0,0,0,0.55),
      inset 0 2px 4px rgba(255, 250, 220, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.9rem, 3.8vw, 3.3rem);
    font-weight: 900;
    color: #3b1c04;
    text-shadow: 0 2px 0 rgba(255, 240, 200, 0.8), 0 -1px 2px rgba(0,0,0,0.4);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
    cursor: pointer;
  }

  .number-cell:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 
      0 9px 0 #3d2408,
      0 14px 20px rgba(0,0,0,0.65),
      inset 0 0 12px rgba(255, 245, 170, 0.95);
  }

  .number-cell.highlight-hint {
    animation: cellPulse 0.65s ease-in-out;
  }

  @keyframes cellPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); filter: brightness(1.25); }
  }

  /* Права колонка з геометричними фігурами */
  .shape-row-cell {
    border-radius: 18px;
    background: linear-gradient(145deg, #2d180a, #1b0e05);
    border: 3px solid #9c6f27;
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.85), 0 4px 8px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }

  .shape-row-cell svg, .color-header-cell svg {
    width: 82%;
    height: 82%;
    overflow: visible;
    filter: drop-shadow(0 4px 5px rgba(0,0,0,0.65));
  }

  /* ================= ЦЕНТРАЛЬНА / ПРАВА ЧАСТИНА: ЗАВДАННЯ ТА СКРИНЯ ================= */
  #right-panel {
    position: relative;
    z-index: 5;
    width: 55%;
    height: 95vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
  }

  /* Верхній ряд правої панелі: 2 кодових завдання + ключі */
  #codes-container {
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 1.5vw;
    margin-top: 0.5vh;
  }

  /* Окрема дерев'яно-кована плашка для кожного з 2 кодів */
  .code-card {
    position: relative;
    flex: 1;
    max-width: 390px;
    padding: 12px 14px 14px 14px;
    border-radius: 22px;
    background: 
      repeating-linear-gradient(135deg, #3b2210 0px, #492a14 12px, #2f1a0b 24px);
    border: 4px solid #c99738;
    box-shadow: 
      0 10px 24px rgba(0,0,0,0.7),
      inset 0 0 18px rgba(0,0,0,0.8),
      inset 0 2px 3px rgba(255, 225, 130, 0.5);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    transition: all 0.4s ease;
  }

  .code-card.unlocked {
    border-color: #52e36a;
    box-shadow: 
      0 0 25px rgba(82, 227, 106, 0.55),
      inset 0 0 18px rgba(40, 140, 60, 0.45);
  }

  .code-card.wrong-shake {
    animation: cardShake 0.45s ease-in-out;
    border-color: #ff4747;
  }

  @keyframes cardShake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  /* 3 слоти в кожному коді */
  .code-slots-group {
    display: flex;
    gap: 8px;
    flex: 1;
    justify-content: space-around;
  }

  .code-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex: 1;
  }

  /* Віконце з кольоровою фігурою-завданням */
  .target-clue-box {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 68px;
    border-radius: 14px;
    background: radial-gradient(circle at 50% 40%, #331e0e, #170c04);
    border: 2.5px solid #8a6224;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
  }

  .target-clue-box svg {
    width: 88%;
    height: 88%;
    overflow: visible;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.7));
  }

  /* Віконце для вводу цифри дитиною */
  .digit-input-box {
    width: 100%;
    height: 48px;
    max-width: 68px;
    border-radius: 12px;
    background: linear-gradient(180deg, #211207, #38200d);
    border: 3px solid #b58532;
    box-shadow: inset 0 4px 8px rgba(0,0,0,0.9), 0 2px 4px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.5rem, 2.5vw, 2.1rem);
    font-weight: 900;
    color: #ffe484;
    text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .digit-input-box.active-slot {
    border-color: #00f5d4;
    background: linear-gradient(180deg, #16332f, #234f48);
    box-shadow: 
      0 0 14px #00f5d4,
      inset 0 0 10px rgba(0, 245, 212, 0.5);
    transform: scale(1.06);
  }

  .digit-input-box.locked-slot {
    border-color: #4cd964;
    background: linear-gradient(180deg, #173d1e, #256330);
    color: #a8ff9e;
    cursor: default;
  }

  /* Міні-холдер для золотого ключа біля коду */
  .key-dock {
    width: 56px;
    height: 110px;
    border-radius: 14px;
    background: radial-gradient(circle, #291608, #120903);
    border: 2px dashed #7a5520;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .key-svg-wrapper {
    width: 48px;
    height: 96px;
    transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
    filter: drop-shadow(0 5px 8px rgba(0,0,0,0.75));
    z-index: 20;
  }

  /* ================= СЕРЕДНЯ ЗОНА: ПАПУГА, СКРИНЯ ТА СКАРБИ ================= */
  #chest-stage {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 250px;
  }

  /* Персонаж Папуга Ара */
  #parrot-container {
    position: absolute;
    left: 0%;
    bottom: 4%;
    width: clamp(135px, 15vw, 210px);
    height: clamp(175px, 21vw, 275px);
    z-index: 12;
    cursor: pointer;
    animation: parrotIdle 3.2s ease-in-out infinite;
  }

  #parrot-container.happy {
    animation: parrotHappy 0.85s ease-in-out 2;
  }

  #parrot-container.sad {
    animation: parrotSad 0.55s ease-in-out;
  }

  /* Головний контейнер скрині */
  #chest-wrapper {
    position: relative;
    width: clamp(290px, 34vw, 460px);
    height: clamp(230px, 27vw, 360px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  #chest-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 18px 25px rgba(0,0,0,0.75));
  }

  /* Анімація тремтіння скрині перед відкриттям */
  @keyframes chestRumble {
    0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    20% { transform: translate(-5px, -3px) rotate(-2deg) scale(1.03); }
    40% { transform: translate(5px, -6px) rotate(2deg) scale(1.05); }
    60% { transform: translate(-6px, -4px) rotate(-2deg) scale(1.06); }
    80% { transform: translate(6px, -2px) rotate(2deg) scale(1.04); }
  }

  .chest-rumbling {
    animation: chestRumble 0.65s ease-in-out;
  }

  /* Контейнер нагороди, яка з'являється з відкритої скрині */
  #reward-showcase {
    position: absolute;
    top: -12%;
    left: 50%;
    transform: translate(-50%, 40px) scale(0);
    width: clamp(240px, 28vw, 380px);
    height: clamp(190px, 22vw, 300px);
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    transition: transform 0.75s cubic-bezier(0.18, 1.35, 0.4, 1), opacity 0.45s ease;
    filter: drop-shadow(0 12px 24px rgba(0,0,0,0.85));
  }

  #reward-showcase.visible {
    transform: translate(-50%, -18px) scale(1.08);
    opacity: 1;
    pointer-events: auto;
    cursor: pointer;
  }

  /* Полиця зібраних скарбів (праворуч від скрині) */
  #collection-rack {
    position: absolute;
    right: 0;
    bottom: 6%;
    width: clamp(72px, 7.5vw, 102px);
    padding: 10px 8px;
    border-radius: 20px;
    background: linear-gradient(145deg, rgba(58, 32, 14, 0.92), rgba(28, 14, 5, 0.95));
    border: 3px solid #b5832e;
    box-shadow: 0 10px 22px rgba(0,0,0,0.7), inset 0 0 12px rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    z-index: 12;
  }

  .trophy-slot {
    width: clamp(44px, 4.6vw, 62px);
    height: clamp(44px, 4.6vw, 62px);
    border-radius: 50%;
    background: radial-gradient(circle, #241307, #100802);
    border: 2px solid #6e4c1b;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px;
    opacity: 0.35;
    filter: grayscale(1);
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .trophy-slot.earned {
    opacity: 1;
    filter: grayscale(0);
    border-color: #ffd700;
    background: radial-gradient(circle, #5e3f12, #241404);
    box-shadow: 0 0 12px rgba(255, 215, 0, 0.65);
    transform: scale(1.06);
  }

  /* Кнопка перезапуску (з'являється коли скриня відкрита, без слів) */
  #replay-btn {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    width: 74px;
    height: 74px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffe97d, #d99b1e 65%, #875805 100%);
    border: 4px solid #fff3b8;
    box-shadow: 0 8px 22px rgba(0,0,0,0.8), 0 0 25px rgba(255, 215, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 30;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #replay-btn.show {
    transform: translateX(-50%) scale(1);
  }

  #replay-btn:hover {
    transform: translateX(-50%) scale(1.13) rotate(25deg);
  }

  /* ================= НИЖНЯ ПАНЕЛЬ: ЗОЛОТІ МОНЕТИ-ЦИФРИ (1-9) ================= */
  #numpad-bar {
    width: 100%;
    max-width: 720px;
    padding: 10px 16px;
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(64, 35, 14, 0.92), rgba(33, 17, 6, 0.96));
    border: 4px solid #ba8730;
    box-shadow: 0 10px 25px rgba(0,0,0,0.75), inset 0 2px 5px rgba(255, 225, 130, 0.45);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    z-index: 14;
  }

  .coin-btn {
    flex: 1;
    aspect-ratio: 1 / 1;
    max-width: 64px;
    border-radius: 50%;
    background: 
      radial-gradient(circle at 32% 28%, #fff6b3 0%, #f5c242 42%, #bd7e13 82%, #784b04 100%);
    border: 3px solid #fce288;
    box-shadow: 
      0 5px 0 #593602,
      0 8px 14px rgba(0,0,0,0.65),
      inset 0 2px 4px #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.35rem, 2.2vw, 1.95rem);
    font-weight: 900;
    color: #4a2502;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .coin-btn:hover {
    transform: translateY(-3px) scale(1.06);
    filter: brightness(1.08);
  }

  .coin-btn:active {
    transform: translateY(3px) scale(0.96);
    box-shadow: 0 2px 0 #593602, 0 3px 6px rgba(0,0,0,0.6);
  }

  /* Адаптивність для менших екранів */
  @media (max-width: 980px) {
    #game-scene {
      flex-direction: column;
      padding: 1vh 2vw;
      overflow-y: auto;
    }
    #left-panel, #right-panel {
      width: 96%;
      height: auto;
    }
  }
</style>
</head>
<body>

<!-- ================= СЮЖЕТНИЙ ЖИВИЙ ФОН (ТРОПІЧНА БУХТА СКАРБІВ) ================= -->
<svg id="bg-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Градієнт вечірнього тропічного неба -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="28%" stop-color="#4b1d52"/>
      <stop offset="55%" stop-color="#9c354d"/>
      <stop offset="78%" stop-color="#e86f38"/>
      <stop offset="100%" stop-color="#ffca58"/>
    </linearGradient>

    <!-- Сяйво сонця -->
    <radialGradient id="sunGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8c4" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ffae34" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#e8482c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e8482c" stop-opacity="0"/>
    </radialGradient>

    <!-- Градієнт океану -->
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d95b43"/>
      <stop offset="25%" stop-color="#6b2d5c"/>
      <stop offset="60%" stop-color="#194a63"/>
      <stop offset="100%" stop-color="#0a2636"/>
    </linearGradient>

    <!-- Градієнт піщаного берега -->
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d69c4e"/>
      <stop offset="50%" stop-color="#a66c29"/>
      <stop offset="100%" stop-color="#5e3610"/>
    </linearGradient>

    <!-- Градієнт листя пальм -->
    <linearGradient id="palmLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a3e"/>
      <stop offset="60%" stop-color="#163d22"/>
      <stop offset="100%" stop-color="#0b2112"/>
    </linearGradient>
  </defs>

  <!-- Небо -->
  <rect width="1920" height="660" fill="url(#skyGrad)"/>

  <!-- Сонце над горизонтом -->
  <g class="sun-glow">
    <circle cx="960" cy="490" r="320" fill="url(#sunGlowGrad)"/>
    <circle cx="960" cy="490" r="95" fill="#fff3b0"/>

<script>
/* ============================================================================
   НАЛАШТУВАННЯ КОЛЬОРІВ ТА 9 ГЕОМЕТРИЧНИХ ФІГУР (МОЖНА ЛЕГКО РЕДАГУВАТИ)
   ============================================================================ */

// База кольорів (для стовпчиків зверху таблиці)
const COLORS_POOL = [
  { id: 'yellow', main: '#ffd60a', light: '#fff799', dark: '#b58400', stroke: '#7a5600' }, // Жовтий
  { id: 'green',  main: '#2ec44d', light: '#99f7ab', dark: '#107526', stroke: '#094716' }, // Зелений
  { id: 'blue',   main: '#1d8cf8', light: '#99d1ff', dark: '#084b94', stroke: '#042b57' }, // Синій
  { id: 'red',    main: '#ff3b30', light: '#ffa39e', dark: '#9e1008', stroke: '#5c0602' }, // Червоний
  { id: 'purple', main: '#af52de', light: '#e5b8ff', dark: '#631d87', stroke: '#3a0d52' }, // Фіолетовий
  { id: 'orange', main: '#ff8811', light: '#ffd099', dark: '#a84c00', stroke: '#632b00' }  // Помаранчевий
];

// Всі 9 видів геометричних фігур за умовою (круг, овал, квадрат, прямокутник, ромб, трапеція, трикутник, п'ятикутник, шестикутник)
const SHAPES_POOL = [
  'circle',     // Круг
  'oval',       // Овал
  'square',     // Квадрат
  'rectangle',  // Прямокутник
  'rhombus',    // Ромб
  'trapezoid',  // Трапеція
  'triangle',   // Трикутник
  'pentagon',   // П'ятикутник
  'hexagon'     // Шестикутник
];

/* ============================================================================
   ГЕНЕРАТОР ОБ'ЄМНИХ SVG-ФІГУР ТА КОЛЬОРОВИХ КРИСТАЛІВ
   ============================================================================ */

let svgUid = 0; // Лічильник для унікальних ID градієнтів

/**
 * Малює одну з 9 геометричних фігур у заданому кольорі (або нейтральному сріблясто-слонової кістки для заголовків рядків справа)
 */
function createShapeSVG(shapeType, colorObj = null) {
  svgUid++;
  const gradId = `shapeGrad_${svgUid}`;
  const shineId = `shapeShine_${svgUid}`;

  // Якщо колір не передано — це фігура-заголовок справа таблиці (робимо її благородною перлинно-золотистою)
  const c = colorObj || {
    main: '#e8dcc5',
    light: '#ffffff',
    dark: '#9e8c6c',
    stroke: '#4a3d28'
  };

  let shapeElement = '';
  let highlightElement = '';

  switch (shapeType) {
    case 'circle': // Круг
      shapeElement = `<circle cx="50" cy="50" r="37" fill="url(#${gradId})" stroke="${c.stroke}" stroke-width="4.5"/>`;
      highlightElement = `<ellipse cx="38" cy="34" rx="14" ry="8" transform="rotate(-25 38 34)" fill="url(#${shineId})"/>`;
      break;

    case 'oval': // Овал (чітко витягнутий горизонтально)
      shapeElement = `<ellipse cx="50" cy="50" rx="44" ry="25" fill="url(#${gradId})" stroke="${c.stroke}" stroke-width="4.5"/>`;
      highlightElement = `<ellipse cx="36" cy="40" rx="18" ry="6" transform="rotate(-12 36 40)" fill="url(#${shineId})"/>`;
      break;

    case 'square': // Квадрат (рівні сторони)
      shapeElement = `<rect x="17" y="17" width="66" height="66" rx="8" fill="url(#${gradId})" stroke="${c.stroke}" stroke-width="4.5"/>`;
      highlightElement = `<rect x="23" y="22" width="54" height="14" rx="5" fill="url(#${shineId})"/>`;
      break;

    case 'rectangle': // Прямокутник (чітко витягнутий горизонтально, щоб не плутати з квадратом)
      shapeElement = `<rect x="7" y="27" width="86" height="46" rx="7" fill="url(#${gradId})" stroke="${c.stroke}" stroke-width="4.5"/>`;
      highlightElement = `<rect x="13" y="32" width="74" height="12" rx="4" fill="url(#${shineId})"/>`;
      break;

    case 'rhombus': // Ромб
      shapeElement = `<polygon points="50,8 90,50 50,92 10,50" stroke-linejoin="round" fill="url(#${gradId})" stroke="${c.stroke}" stroke-width="4.5"/>`;
      highlightElement = `<polygon points="50,15 76,43 50,48 24,43" fill="url(#${shineId})"/>`;
      break;

    case 'trapezoid': // Трапеція
      shapeElement = `<polygon points="25,20 75,20 93,80 7,80" stroke-linejoin="round" fill="url(#${gradId})" stroke="${c.stroke}" stroke-width="4.5"/>`;
      highlightElement = `<polygon points="28,26 72,26 78,42 22,42" fill="url(#${shineId})"/>`;
      break;

    case 'triangle': // Трикутник
      shapeElement = `<polygon points="50,10 91,84 9,84" stroke-linejoin="round" fill="url(#${gradId})" stroke="${c.stroke}" stroke-width="4.5"/>`;
      highlightElement = `<polygon points="50,18 68,52 32,52" fill="url(#${shineId})"/>`;
      break;

    case 'pentagon': // П'ятикутник
      shapeElement = `<polygon points="50,9 91,39 75,87 25,87 9,39" stroke-linejoin="round" fill="url(#${gradId})" stroke="${c.stroke}" stroke-width="4.5"/>`;
      highlightElement = `<polygon points="50,16 78,38 50,48 22,38" fill="url(#${shineId})"/>`;
      break;

    case 'hexagon': // Шестикутник
      shapeElement = `<polygon points="27,12 73,12 94,50 73,88 27,88 6,50" stroke-linejoin="round" fill="url(#${gradId})" stroke="${c.stroke}" stroke-width="4.5"/>`;
      highlightElement = `<polygon points="30,18 70,18 82,42 18,42" fill="url(#${shineId})"/>`;
      break;
  }

  return `
    <svg viewBox="0 0 100 100">
      <defs>
        <radialGradient id="${gradId}" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="${c.light}"/>
          <stop offset="45%" stop-color="${c.main}"/>
          <stop offset="100%" stop-color="${c.dark}"/>
        </radialGradient>
        <linearGradient id="${shineId}" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${shapeElement}
      ${highlightElement}
    </svg>
  `;
}

/* ============================================================================
   СИНТЕЗАТОР ЗВУКІВ (WEB AUDIO API — БЕЗ ЗОВНІШНІХ ФАЙЛІВ І БЕЗ СЛІВ)
   ============================================================================ */
class SoundEngine {
  constructor() {
    this.ctx = null;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  // Звук вибору клітинки або натискання золотої монети
  playCoinTap(freq = 620) {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.45, now + 0.09);

    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.12);
  }

  // Звук повороту ключа та клацання замка
  playLockUnlock() {
    this.init();
    const now = this.ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((n, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(n, now + idx * 0.08);
      gain.gain.setValueAtTime(0.28, now + idx * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + idx * 0.08);
      osc.stop(now + idx * 0.08 + 0.26);
    });
  }

  // Звук помилки у 3-значному коді
  playError() {
    this.init();
    const now = this.ctx.currentTime;
    [210, 165].forEach((n, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(n, now + idx * 0.14);
      gain.gain.setValueAtTime(0.18, now + idx * 0.14);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.18);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + idx * 0.14);
      osc.stop(now + idx * 0.14 + 0.2);
    });
  }

  // Фанфари відкриття скрині зі скарбами
  playTreasureFanfare() {
    this.init();
    const now = this.ctx.currentTime;
    const chord = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
    chord.forEach((n, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = idx % 2 === 0 ? 'triangle' : 'sine';
      const start = now + idx * 0.09;
      osc.frequency.setValueAtTime(n, start);
      gain.gain.setValueAtTime(0.25, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.65);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(start);
      osc.stop(start + 0.66);
    });
  }

  // Веселий свист папуги при кліку на нього
  playParrotChirp() {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(900, now);
    osc.frequency.exponentialRampToValueAtTime(1650, now + 0.08);
    osc.frequency.exponentialRampToValueAtTime(1150, now + 0.16);
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.19);
  }
}

const sfx = new SoundEngine();

/* ============================================================================
   СИСТЕМА ЧАСТИНОК (ЗОЛОТІ ІСКРИ, СВІТЛЯЧКИ ТА САЛЮТ СКАРБІВ)
   ============================================================================ */
const canvas = document.getElementById('fx-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let fireflies = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Створюємо атмосферних світлячків на фоні
for (let i = 0; i < 24; i++) {
  fireflies.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: 1.8 + Math.random() * 2.5,
    vx: (Math.random() - 0.5) * 0.45,
    vy: (Math.random() - 0.5) * 0.45,
    alpha: Math.random(),
    dAlpha: 0.008 + Math.random() * 0.012
  });
}

function spawnSparkles(x, y, count = 35) {
  const palette = ['#ffd700', '#fff7a1', '#00f5d4', '#ff4da6', '#52e36a', '#ff8811'];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 8;
    particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      size: 4 + Math.random() * 6,
      color: palette[Math.floor(Math.random() * palette.length)],
      life: 1,
      decay: 0.014 + Math.random() * 0.015
    });
  }
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Малюємо світлячків
  fireflies.forEach(f => {
    f.x += f.vx;
    f.y += f.vy;
    f.alpha += f.dAlpha;
    if (f.alpha > 1 || f.alpha < 0.15) f.dAlpha *= -1;
    if (f.x < 0) f.x = canvas.width;
    if (f.x > canvas.width) f.x = 0;
    if (f.y < 0) f.y = canvas.height;
    if (f.y > canvas.height) f.y = 0;

    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, f.alpha));
    ctx.fillStyle = '#ffe97d';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // Малюємо святкові іскри
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.18; // Гравітація
    p.life -= p.decay;

    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(animateParticles);
}
animateParticles();

/* ============================================================================
   ЛОГІКА ГРИ ТА КОНТРОЛЬ НЕПОВТОРЮВАНИХ НАГОРОД
   ============================================================================ */

let activeColors = [];       // 3 обрані кольори для поточного раунду (стовпці)
let activeShapes = [];       // 3 обрані фігури для поточного раунду (рядки справа)
let gridNumbers = [];        // Матриця 3x3 з числами 1..9
let codesData = [[], []];    // 2 завдання по 3 елементи: { row, col, answer, userVal }
let locksSolved = [false, false];
let selectedSlot = { codeIdx: 0, slotIdx: 0 }; // Активна клітинка для вводу

// Черга індексів нагород (щоб жодна не повторювалась, поки не випадуть усі 6)
let rewardBag = [];
let earnedRewardsSet = new Set();

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function getNextUniqueRewardIndex() {
  if (rewardBag.length === 0) {
    rewardBag = shuffleArray([0, 1, 2, 3, 4, 5]);
  }
  return rewardBag.pop();
}

// Ініціалізація полиці колекції нагород
function initCollectionRack() {
  const rack = document.getElementById('collection-rack');
  rack.innerHTML = '';
  REWARDS_SVG.forEach((svgCode, idx) => {
    const slot = document.createElement('div');
    slot.className = 'trophy-slot';
    slot.id = `trophy-slot-${idx}`;
    slot.innerHTML = svgCode;
    rack.appendChild(slot);
  });
}

// Емоції папуги Ара
function triggerParrotEmotion(type) {
  const parrot = document.getElementById('parrot-container');
  const wingL = document.getElementById('parrot-wing-left');
  const wingR = document.getElementById('parrot-wing-right');
  parrot.classList.remove('happy', 'sad');
  void parrot.offsetWidth;

  if (type === 'happy') {
    parrot.classList.add('happy');
    wingL.style.transform = 'rotate(-35deg)';
    wingR.style.transform = 'rotate(35deg)';
    setTimeout(() => {
      wingL.style.transform = 'rotate(0deg)';
      wingR.style.transform = 'rotate(0deg)';
    }, 800);
  } else if (type === 'sad') {
    parrot.classList.add('sad');
    wingL.style.transform = 'rotate(18deg)';
    setTimeout(() => {
      wingL.style.transform = 'rotate(0deg)';
    }, 550);
  }
}

document.getElementById('parrot-container').addEventListener('click', () => {
  sfx.playParrotChirp();
  triggerParrotEmotion('happy');
});

/**
 * Запуск / перегенерація нового раунду гри
 */
function startNewRound() {
  locksSolved = [false, false];

  // Скидаємо стан скрині та замків
  document.getElementById('chest-lid-closed').style.display = 'block';
  document.getElementById('chest-lid-open').style.display = 'none';
  const rewardShowcase = document.getElementById('reward-showcase');
  rewardShowcase.classList.remove('visible');
  document.getElementById('replay-btn').classList.remove('show');

  [0, 1].forEach(idx => {
    const padlock = document.getElementById(`padlock-${idx}`);
    const shackle = document.getElementById(`shackle-${idx}`);
    const card = document.getElementById(`code-card-${idx}`);
    padlock.style.transform = 'translate(0, 0) rotate(0deg) scale(1)';
    padlock.style.opacity = '1';
    shackle.style.transform = 'translateY(0)';
    card.classList.remove('unlocked', 'wrong-shake');
  });

  // 1. Вибираємо 3 випадкові кольори (стовпці зверху) та 3 випадкові фігури з 9 (рядки справа)
  activeColors = shuffleArray(COLORS_POOL).slice(0, 3);
  activeShapes = shuffleArray(SHAPES_POOL).slice(0, 3);

  // 2. Перемішуємо числа 1..9 для матриці 3x3
  const nums = shuffleArray([1, 2, 3, 4, 5, 6, 7, 8, 9]);
  gridNumbers = [
    nums.slice(0, 3),
    nums.slice(3, 6),
    nums.slice(6, 9)
  ];

  // 3. Будуємо таблицю 3x3 (зверху кольори, справа фігури)
  renderMatrixBoard();

  // 4. Генеруємо 2 коди по 3 клітинки (разом 6 різних комбінацій колір+фігура)
  const allCells = [];
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      allCells.push({ row: r, col: c, answer: gridNumbers[r][c] });
    }
  }
  const pickedCells = shuffleArray(allCells).slice(0, 6);

  codesData[0] = pickedCells.slice(0, 3).map(item => ({ ...item, userVal: '' }));
  codesData[1] = pickedCells.slice(3, 6).map(item => ({ ...item, userVal: '' }));

  // 5. Малюємо 2 плашки кодів і золоті ключі
  renderCodeCards();

  // 6. Робимо першу клітинку першого коду активною
  selectSlot(0, 0);
}

/**
 * Рендер таблиці-шифрувальника: зверху 3 кольори, всередині 9 чисел, справа 3 фігури
 */
function renderMatrixBoard() {
  const gridEl = document.getElementById('matrix-grid');
  gridEl.innerHTML = '';

  // Верхній ряд: 3 кольори + декоративна золота роза вітрів у правому верхньому куті
  for (let c = 0; c < 3; c++) {
    const colorCell = document.createElement('div');
    colorCell.className = 'color-header-cell';
    colorCell.innerHTML = createColorSwatchSVG(activeColors[c]);
    gridEl.appendChild(colorCell);
  }

  const cornerCell = document.createElement('div');
  cornerCell.className = 'corner-ornament-cell';
  cornerCell.innerHTML = `
    <svg viewBox="0 0 80 80" width="65%" height="65%">
      <polygon points="40,4 49,31 76,40 49,49 40,76 31,49 4,40 31,31" fill="#e8ad2c" stroke="#5c3802" stroke-width="2.5"/>
      <circle cx="40" cy="40" r="8" fill="#fff3a8"/>
    </svg>
  `;
  gridEl.appendChild(cornerCell);

  // 3 рядки: у кожному рядку 3 числа + 1 фігура СПРАВА
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      const numCell = document.createElement('div');
      numCell.className = 'number-cell';
      numCell.id = `matrix-cell-${r}-${c}`;
      numCell.textContent = gridNumbers[r][c];

      // Якщо дитина клікає прямо на число в таблиці — воно підставляється у вибране віконце коду
      numCell.addEventListener('click', () => {
        numCell.classList.remove('highlight-hint');
        void numCell.offsetWidth;
        numCell.classList.add('highlight-hint');
        handleNumberInput(gridNumbers[r][c]);
      });

      gridEl.appendChild(numCell);
    }

    // Права клітинка рядка — геометрична фігура
    const shapeCell = document.createElement('div');
    shapeCell.className = 'shape-row-cell';
    shapeCell.innerHTML = createShapeSVG(activeShapes[r], null);
    gridEl.appendChild(shapeCell);
  }
}

/**
 * Рендер двох кодових карток та їхніх золотих ключів
 */
function renderCodeCards() {
  const keyGems = ['#ff2a4b', '#00e5ff'];

  [0, 1].forEach(codeIdx => {
    const slotsContainer = document.getElementById(`code-slots-${codeIdx}`);
    slotsContainer.innerHTML = '';

    codesData[codeIdx].forEach((slotData, slotIdx) => {
      const slotEl = document.createElement('div');
      slotEl.className = 'code-slot';

      // Зображення кольорової фігури
      const clueBox = document.createElement('div');
      clueBox.className = 'target-clue-box';
      const colorObj = activeColors[slotData.col];
      const shapeType = activeShapes[slotData.row];
      clueBox.innerHTML = createShapeSVG(shapeType, colorObj);

      // Поле вводу числа
      const inputBox = document.createElement('div');
      inputBox.className = 'digit-input-box';
      inputBox.id = `input-${codeIdx}-${slotIdx}`;
      inputBox.textContent = slotData.userVal;

      inputBox.addEventListener('click', () => {
        if (!locksSolved[codeIdx]) {
          sfx.playCoinTap(520);
          selectSlot(codeIdx, slotIdx);
        }
      });

      slotEl.appendChild(clueBox);
      slotEl.appendChild(inputBox);
      slotsContainer.appendChild(slotEl);
    });

    // Малюємо ключ у доці
    const keyWrap = document.getElementById(`key-${codeIdx}`);
    keyWrap.style.transform = 'translate(0, 0) rotate(0deg) scale(1)';
    keyWrap.style.opacity = '1';
    keyWrap.innerHTML = createGoldenKeySVG(keyGems[codeIdx]);
  });
}

/**
 * Вибір активного слота для вводу цифри
 */
function selectSlot(codeIdx, slotIdx) {
  if (locksSolved[codeIdx]) return;
  selectedSlot = { codeIdx, slotIdx };

  document.querySelectorAll('.digit-input-box').forEach(el => {
    el.classList.remove('active-slot');
  });

  const targetEl = document.getElementById(`input-${codeIdx}-${slotIdx}`);
  if (targetEl) {
    targetEl.classList.add('active-slot');
  }
}

/**
 * Обробка введеної цифри (1-9) з клавіатури або монет
 */
function handleNumberInput(num) {
  const { codeIdx, slotIdx } = selectedSlot;
  if (locksSolved[codeIdx]) return;

  sfx.playCoinTap(580 + num * 35);

  // Записуємо цифру в поточний слот
  codesData[codeIdx][slotIdx].userVal = num;
  const inputEl = document.getElementById(`input-${codeIdx}-${slotIdx}`);
  inputEl.textContent = num;

  // Перевіряємо, чи всі 3 цифри цього коду заповнені
  const currentCode = codesData[codeIdx];
  const allFilled = currentCode.every(item => item.userVal !== '');

  if (allFilled) {
    verifyCode(codeIdx);
  } else {
    // Переходимо на наступне порожнє віконце в цьому коді
    for (let i = 0; i < 3; i++) {
      const nextIdx = (slotIdx + 1 + i) % 3;
      if (currentCode[nextIdx].userVal === '') {
        selectSlot(codeIdx, nextIdx);
        break;
      }
    }
  }
}

/**
 * Перевірка введеного 3-значного коду для замка `codeIdx`
 */
function verifyCode(codeIdx) {
  const currentCode = codesData[codeIdx];
  const isCorrect = currentCode.every(item => Number(item.userVal) === item.answer);

  if (isCorrect) {
    // Код правильний! Блокуємо слоти та запускаємо анімацію ключа і замка
    locksSolved[codeIdx] = true;
    sfx.playLockUnlock();
    triggerParrotEmotion('happy');

    const card = document.getElementById(`code-card-${codeIdx}`);
    card.classList.add('unlocked');

    for (let i = 0; i < 3; i++) {
      const el = document.getElementById(`input-${codeIdx}-${i}`);
      el.classList.remove('active-slot');
      el.classList.add('locked-slot');
    }

    animateKeyAndPadlock(codeIdx);

    // Якщо інший код ще не розгаданий — автоматично переводимо курсор туди
    const otherCodeIdx = codeIdx === 0 ? 1 : 0;
    if (!locksSolved[otherCodeIdx]) {
      const firstEmpty = codesData[otherCodeIdx].findIndex(item => item.userVal === '');
      selectSlot(otherCodeIdx, firstEmpty !== -1 ? firstEmpty : 0);
    }
  } else {
    // Є помилка: підтрушуємо картку і очищаємо неправильні цифри, залишаючи правильні
    sfx.playError();
    triggerParrotEmotion('sad');

    const card = document.getElementById(`code-card-${codeIdx}`);
    card.classList.remove('wrong-shake');
    void card.offsetWidth;
    card.classList.add('wrong-shake');

    setTimeout(() => {
      let firstWrongSlot = -1;
      currentCode.forEach((item, idx) => {
        if (Number(item.userVal) !== item.answer) {
          item.userVal = '';
          const el = document.getElementById(`input-${codeIdx}-${idx}`);
          el.textContent = '';
          if (firstWrongSlot === -1) firstWrongSlot = idx;
        }
      });
      if (firstWrongSlot !== -1) {
        selectSlot(codeIdx, firstWrongSlot);
      }
    }, 450);
  }
}

/**
 * Анімація польоту ключа в навісний замок та його відкриття
 */
function animateKeyAndPadlock(codeIdx) {
  const keyEl = document.getElementById(`key-${codeIdx}`);
  const padlockEl = document.getElementById(`padlock-${codeIdx}`);
  const shackleEl = document.getElementById(`shackle-${codeIdx}`);

  const keyRect = keyEl.getBoundingClientRect();
  const lockRect = padlockEl.getBoundingClientRect();

  const dx = (lockRect.left + lockRect.width / 2) - (keyRect.left + keyRect.width / 2);
  const dy = (lockRect.top + lockRect.height / 2) - (keyRect.top + keyRect.height / 2);

  // Ключ летить до замка і повертається
  keyEl.style.transform = `translate(${dx}px, ${dy}px) rotate(90deg) scale(1.15)`;

  setTimeout(() => {
    // Іскри на замку та підйом дужки
    spawnSparkles(lockRect.left + lockRect.width / 2, lockRect.top + lockRect.height / 2, 28);
    shackleEl.style.transform = 'translateY(-18px)';

    setTimeout(() => {
      // Замок падає вниз і зникає разом із ключем
      padlockEl.style.transform = 'translateY(90px) rotate(28deg) scale(0.7)';
      padlockEl.style.opacity = '0';
      keyEl.style.opacity = '0';

      // Якщо обидва замки відкрито — відчиняємо скриню!
      if (locksSolved[0] && locksSolved[1]) {
        setTimeout(openTreasureChest, 450);
      }
    }, 350);
  }, 750);
}

/**
 * Відкриття скрині та показ унікальної нагороди
 */
function openTreasureChest() {
  const chestWrapper = document.getElementById('chest-wrapper');
  chestWrapper.classList.add('chest-rumbling');

  setTimeout(() => {
    chestWrapper.classList.remove('chest-rumbling');

    // Відкриваємо кришку скрині
    document.getElementById('chest-lid-closed').style.display = 'none';
    document.getElementById('chest-lid-open').style.display = 'block';

    // Обираємо унікальну нагороду, яка ще не випадала
    const rewardIdx = getNextUniqueRewardIndex();
    earnedRewardsSet.add(rewardIdx);

    const rewardShowcase = document.getElementById('reward-showcase');
    rewardShowcase.innerHTML = REWARDS_SVG[rewardIdx];
    rewardShowcase.classList.add('visible');

    // Позначаємо нагороду на полиці колекції
    const trophySlot = document.getElementById(`trophy-slot-${rewardIdx}`);
    if (trophySlot) {
      trophySlot.classList.add('earned');
    }

    // Святковий звук, радість папуги та великий салют
    sfx.playTreasureFanfare();
    triggerParrotEmotion('happy');

    const chestRect = chestWrapper.getBoundingClientRect();
    const cx = chestRect.left + chestRect.width / 2;
    const cy = chestRect.top + chestRect.height / 3;
    spawnSparkles(cx, cy, 85);
    setTimeout(() => spawnSparkles(cx - 90, cy - 40, 50), 300);
    setTimeout(() => spawnSparkles(cx + 90, cy - 40, 50), 550);

    // Показуємо круглу золоту кнопку для наступної гри
    setTimeout(() => {
      document.getElementById('replay-btn').classList.add('show');
    }, 900);
  }, 600);
}

/* ============================================================================
   ОБРОБНИКИ ПОДІЙ (ЕКРАННІ МОНЕТИ, ФІЗИЧНА КЛАВІАТУРА, НАСТУПНА СКРИНЯ)
   ============================================================================ */

// Клік по золотих монетах 1-9 знизу
document.querySelectorAll('.coin-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const num = Number(btn.getAttribute('data-num'));
    handleNumberInput(num);
  });
});

// Підтримка введення цифр 1-9 з клавіатури комп'ютера
window.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '9') {
    handleNumberInput(Number(e.key));
  } else if (e.key === 'Backspace' || e.key === 'Delete') {
    const { codeIdx, slotIdx } = selectedSlot;
    if (!locksSolved[codeIdx]) {
      codesData[codeIdx][slotIdx].userVal = '';
      document.getElementById(`input-${codeIdx}-${slotIdx}`).textContent = '';
      sfx.playCoinTap(400);
    }
  }
});

// Клік на нагороду або кнопку оновлення генерує нове завдання з новою нагородою
document.getElementById('replay-btn').addEventListener('click', () => {
  sfx.playCoinTap(750);
  startNewRound();
});

document.getElementById('reward-showcase').addEventListener('click', () => {
  sfx.playTreasureFanfare();
  const rect = document.getElementById('reward-showcase').getBoundingClientRect();
  spawnSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2, 45);
});

// Старт гри при завантаженні
initCollectionRack();
startNewRound();
</script>
