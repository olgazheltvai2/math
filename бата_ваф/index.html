<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <!-- Дозволено масштабування користувачем -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра в Картки</title>
    
    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* Базові стилі */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #222;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto; /* Дозволяє скролити, якщо не влазить */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-image 0.5s ease;
        }

        /* Контейнер гри (зліва і справа) */
        #game-container {
            width: 100%;
            min-height: 100vh;
            max-width: 1400px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 80px 50px 20px 50px;
            background: transparent;
        }

        .player-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .table-area {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 40px;
            position: relative;
        }

        .deck-wrapper {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-count {
            margin-top: 15px;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 10px;
        }

        .player-label {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            background: rgba(0,0,0,0.5);
            padding: 5px 20px;
            border-radius: 15px;
            cursor: text;
            border: 2px dashed transparent;
            transition: border 0.3s, background 0.3s;
            min-width: 150px;
            text-align: center;
        }

        .player-label:hover {
            border-color: rgba(255,255,255,0.4);
        }

        .player-label:focus {
            outline: none;
            border-color: #0f0;
            background: rgba(0,0,0,0.8);
        }

        /* Збільшені картки (з білим фоном для прозорих зображень) */
        .card {
            width: 180px;
            height: 260px;
            border-radius: 15px;
            border: 3px solid rgba(255, 255, 255, 0.7);
            background-color: #ffffff;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card.deck-card {
            background-color: #1a1a1a;
            background-image: repeating-linear-gradient(
                45deg,
                #606dbc,
                #606dbc 15px,
                #465298 15px,
                #465298 30px
            );
            border: 4px solid #fff;
        }

        .deck-wrapper:active .card.deck-card {
            transform: scale(0.95);
        }

        /* Анімації та фідбек виграшу/програшу */
        @keyframes winGlow {
            0% { box-shadow: 0 0 15px #0f0, 8px 8px 20px rgba(0,0,0,0.7); transform: scale(1); }
            50% { box-shadow: 0 0 50px #0f0, 0 0 25px #0f0; transform: scale(1.1); }
            100% { box-shadow: 0 0 15px #0f0, 8px 8px 20px rgba(0,0,0,0.7); transform: scale(1); }
        }

        @keyframes loseShake {
            0% { transform: translateX(0); filter: brightness(1) sepia(0) hue-rotate(0) saturate(1); }
            25% { transform: translateX(-5px); filter: brightness(0.5) sepia(1) hue-rotate(300deg) saturate(3); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); filter: brightness(0.5) sepia(1) hue-rotate(300deg) saturate(3); }
        }

        .card.win {
            animation: winGlow 1.5s infinite;
            border-color: #0f0;
            z-index: 10;
        }

        .card.lose {
            animation: loseShake 0.5s forwards;
            border-color: #f00;
        }

        /* Інструкція для збору карт */
        #collect-hint {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            background: rgba(0, 255, 0, 0.3);
            border: 2px solid #0f0;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            display: none;
            z-index: 20;
            animation: pulse 1s infinite alternate;
            white-space: nowrap;
        }

        @keyframes pulse {
            from { transform: translateX(-50%) scale(1); }
            to { transform: translateX(-50%) scale(1.1); }
        }

        /* Контрольна панель (згори) */
        #control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-game {
            padding: 12px 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: 2px solid white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-game:hover {
            background: rgba(50,50,50,0.9);
        }

        .btn-game.active {
            background: rgba(0, 150, 0, 0.8);
            border-color: #0f0;
        }

        /* Theme Manager UI */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 30px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        #theme-btn:active { transform: scale(0.9); }

        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.95);
            border: 2px solid white;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 60vh;
            overflow-y: auto;
            z-index: 1000;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        #theme-modal h2 { margin-bottom: 15px; text-align: center; }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1));
            gap: 15px;
        }

        .theme-item {
            position: relative;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16/9;
            background-color: #333;
        }

        .theme-item:hover { border-color: white; }

        .theme-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .theme-label {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            font-size: 14px;
            padding: 4px 0;
        }

        #close-theme-modal {
            display: block;
            margin: 20px auto 0;
            padding: 10px 30px;
            background: #444;
            color: white;
            border: 1px solid white;
            border-radius: 5px;
            cursor: pointer;
        }

        .secret-input {
            color: transparent;
            text-shadow: 0 0 0 rgba(0,0,0,0);
        }
        .secret-input::selection {
            background: transparent;
            color: transparent;
        }

        /* Універсальний блок контролю */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 99999;
            color: red;
            font-size: 40px;
            font-weight: bold;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-shadow: 2px 2px 10px black;
        }

        /* Адаптивність (Mobile Friendly) */
        @media (max-width: 900px) {
            #game-container {
                flex-direction: column; 
                padding: 70px 10px 20px 10px;
                justify-content: center;
                gap: 20px;
            }
            .card { width: 100px; height: 145px; border-width: 2px; }
            .player-label { font-size: 18px; margin-bottom: 5px; min-width: 120px; padding: 4px 10px; }
            .card-count { font-size: 18px; margin-top: 5px; padding: 4px 10px; }
            .table-area { gap: 15px; margin: 10px 0; }
            #collect-hint { top: -40px; font-size: 16px; padding: 5px 15px; }
            .player-area { order: 1; }
            #area-player2 { order: 1; }
            .table-area { order: 2; margin: 20px 0; }
            #area-player1 { order: 3; }
        }

        /* Для дуже маленьких екранів або горизонтального режиму на мобільних */
        @media (max-width: 450px), (max-height: 750px) {
            #game-container {
                padding: 60px 5px 10px 5px;
                gap: 10px;
            }
            .card { width: 80px; height: 115px; }
            .player-label { font-size: 16px; min-width: 100px; padding: 3px 8px; }
            .card-count { font-size: 16px; margin-top: 3px; padding: 3px 8px; }
            .table-area { gap: 10px; margin: 10px 0; }
            #collect-hint { top: -35px; font-size: 14px; padding: 3px 10px; }
            #control-panel { top: 10px; left: 10px; gap: 5px; }
            .btn-game { padding: 8px 12px; font-size: 14px; }
            #theme-btn { width: 45px; height: 45px; font-size: 20px; bottom: 10px; right: 10px; }
        }
    </style>
<style id="canvas-click-fix">canvas#draw-canvas { pointer-events: none !important; } .drawing-active canvas#draw-canvas { pointer-events: auto !important; }</style></head>
<body>

    <div id="control-panel">
        <button class="btn-game" onclick="triggerRestart()">Перезапустити</button>
        <button class="btn-game" id="btn-mode" onclick="toggleAiMode()">Режим: Комп'ютер</button>
    </div>

    <div id="game-container">
        
        <!-- Зона гравця 1 -->
        <div class="player-area" id="area-player1">
            <div class="player-label" id="label-player-1" contenteditable="true" onblur="updatePlayerName(1, this.innerText)" onkeydown="handleNameKeydown(event, 1, this)">Гравець 1</div>
            <div class="deck-wrapper" id="deck-wrapper-1" onclick="drawCard(1)">
                <div class="card deck-card"></div>
                <div class="card-count" id="count-1">0</div>
            </div>
        </div>

        <!-- Ігровий стіл -->
        <div class="table-area" id="table-area" onclick="handleTableClick()">
            <div id="collect-hint">Забрати карти</div>
            <div class="card" id="table-card-1" style="visibility: hidden;"></div>
            <div class="card" id="table-card-2" style="visibility: hidden;"></div>
        </div>

        <!-- Зона гравця 2 -->
        <div class="player-area" id="area-player2">
            <div class="player-label" id="label-player-2" contenteditable="true" onblur="updatePlayerName(2, this.innerText)" onkeydown="handleNameKeydown(event, 2, this)">Комп'ютер</div>
            <div class="deck-wrapper" id="deck-wrapper-2" onclick="drawCard(2)">
                <div class="card deck-card"></div>
                <div class="card-count" id="count-2">0</div>
            </div>
        </div>

    </div>

    <!-- Theme Manager UI -->
    <button id="theme-btn">⚙️</button>
    <div id="theme-modal">
        <h2>Виберіть фон</h2>
        <div class="theme-grid" id="theme-grid"></div>
        <button id="close-theme-modal">Закрити</button>
    </div>

    <!-- Універсальний блок контролю (ОБОВ'ЯЗКОВО) -->
    <div id="block-overlay">Зачекай! Зараз не твій урок.</div>

    <script>
        // Ініціалізація Firebase
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // -------------------------------------------------------------
        // УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ (Ідентифікація, Радар, Блокування)
        // -------------------------------------------------------------
        const urlParams = new URLSearchParams(window.location.search);
        let myName = urlParams.get('user') || sessionStorage.getItem('userName');
        if (!myName) {
            myName = 'Гість_' + Math.floor(Math.random() * 1000);
        }
        sessionStorage.setItem('userName', myName);

        const tabId = Math.random().toString(36).substr(2, 9);
        const myPresenceRef = db.ref(`online_users/${myName}/${tabId}`);
        const connectedRef = db.ref('.info/connected');

        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                myPresenceRef.set(true);
                myPresenceRef.onDisconnect().remove();
            }
        });

        window.addEventListener('beforeunload', () => {
            myPresenceRef.remove();
        });

        db.ref(`blocked_users/${myName}`).on('value', (snap) => {
            document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
        });

        db.ref('force_refresh').on('value', (snap) => {
            const val = snap.val();
            if (val && String(val) !== sessionStorage.getItem('last_refresh')) {
                sessionStorage.setItem('last_refresh', String(val));
                window.location.reload();
            }
        });

        let immunity = true;
        setTimeout(() => { immunity = false; }, 1000);

        db.ref('current_activity').on('value', (snap) => {
            if (!immunity && snap.val() === 'lobby') {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
        });
        
        // -------------------------------------------------------------
        // СИСТЕМА ДИНАМІЧНИХ ФОНІВ (Theme Manager)
        // -------------------------------------------------------------
        const themeBtn = document.getElementById('theme-btn');
        const themeModal = document.getElementById('theme-modal');
        const closeThemeModal = document.getElementById('close-theme-modal');
        const themeGrid = document.getElementById('theme-grid');
        const baseUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
        
        themeBtn.addEventListener('click', () => {
            themeModal.style.display = 'block';
            if (themeGrid.children.length === 0) loadThemes();
        });
        closeThemeModal.addEventListener('click', () => themeModal.style.display = 'none');

        function applyBackground(url) {
            document.body.style.backgroundImage = `url('${url}')`;
            localStorage.setItem('mySavedGameBg', url);
        }

        const savedBg = localStorage.getItem('mySavedGameBg');
        if (savedBg) applyBackground(savedBg);

        db.ref('game_theme').on('value', (snap) => {
            if (snap.val()) applyBackground(snap.val());
        });

        function loadThemes() {
            let i = 1;
            function loadNext() {
                if (i > 1000) return;
                const imgUrl = `${baseUrl}background_${i}.webp`;
                const img = new Image();
                img.onload = () => {
                    const item = document.createElement('div');
                    item.className = 'theme-item';
                    item.innerHTML = `<img src="${imgUrl}" alt="Фон ${i}"><div class="theme-label">Фон ${i}</div>`;
                    item.onclick = () => {
                        db.ref('game_theme').set(imgUrl);
                        applyBackground(imgUrl);
                        themeModal.style.display = 'none';
                    };
                    themeGrid.appendChild(item);
                    i++;
                    loadNext(); 
                };
                img.onerror = () => { /* Кінець списку */ };
                img.src = imgUrl;
            }
            loadNext();
        }

        // -------------------------------------------------------------
        // ЛОГІКА ГРИ "П'ЯНИЦЯ" ТА СИНХРОНІЗАЦІЯ Firebase
        // -------------------------------------------------------------
        
        const cardScores = {
            40:1, 39:1, 26:1, 18:1, 14:1, 6:1,
            36:2, 34:2, 27:2, 28:2, 11:2, 1:2,
            35:3, 32:3, 30:3, 19:3, 20:3, 12:3,
            25:4, 17:4, 16:4, 8:4, 2:4, 3:4,
            38:5, 37:5, 33:5, 29:5, 21:5, 22:5,
            31:6, 24:6, 23:6, 15:6, 13:6, 7:6
        };
        const allCards = Object.keys(cardScores).map(Number);
        
        let localGameState = {
            deck1: [],
            deck2: [],
            table1: [],
            table2: [],
            phase: 'draw', 
            aiMode: true,
            name1: "Гравець 1",
            name2: "Комп'ютер"
        };

        function normalizeArray(data) {
            if (!data) return [];
            if (Array.isArray(data)) return data.filter(v => v !== null && v !== undefined);
            return Object.values(data).filter(v => v !== null && v !== undefined);
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function triggerRestart() {
            let shuffled = shuffle([...allCards]);
            let mid = Math.floor(shuffled.length / 2);
            let newState = {
                deck1: shuffled.slice(0, mid),
                deck2: shuffled.slice(mid),
                table1: [],
                table2: [],
                phase: 'draw',
                aiMode: localGameState.aiMode !== undefined ? localGameState.aiMode : true,
                name1: localGameState.name1 || "Гравець 1",
                name2: localGameState.name2 || (localGameState.aiMode ? "Комп'ютер" : "Гравець 2")
            };
            db.ref('game_state').set(newState);
        }

        function toggleAiMode() {
            localGameState.aiMode = !localGameState.aiMode;
            if (localGameState.aiMode) {
                localGameState.name2 = "Комп'ютер";
            } else {
                localGameState.name2 = "Гравець 2";
            }
            db.ref('game_state').set(localGameState);
        }

        function updatePlayerName(playerNum, newName) {
            if (playerNum === 1) {
                localGameState.name1 = newName.trim() || "Гравець 1";
            } else {
                localGameState.name2 = newName.trim() || "Гравець 2";
            }
            db.ref('game_state').set(localGameState);
        }

        function handleNameKeydown(event, playerNum, el) {
            if (event.key === 'Enter') {
                event.preventDefault();
                el.blur();
            }
        }

        db.ref('game_state').on('value', (snap) => {
            const state = snap.val();
            if (state) {
                localGameState = state;
                localGameState.deck1 = normalizeArray(state.deck1);
                localGameState.deck2 = normalizeArray(state.deck2);
                localGameState.table1 = normalizeArray(state.table1);
                localGameState.table2 = normalizeArray(state.table2);
                localGameState.name1 = state.name1 || "Гравець 1";
                localGameState.name2 = state.name2 || (state.aiMode ? "Комп'ютер" : "Гравець 2");
                
                updateUI();
                checkAiAutoPlay();
            } else {
                triggerRestart();
            }
        });

        function drawCard(playerNum) {
            if (localGameState.phase !== 'draw') return;
            if (playerNum === 1 && localGameState.deck1.length === 0) return;
            if (playerNum === 2 && localGameState.deck2.length === 0) return;
            
            if (playerNum === 1 && localGameState.table1.length > localGameState.table2.length) return;
            if (playerNum === 2 && localGameState.table2.length > localGameState.table1.length) return;

            if (playerNum === 1) {
                localGameState.table1.push(localGameState.deck1.shift());
            } else {
                localGameState.table2.push(localGameState.deck2.shift());
            }
            
            if (localGameState.table1.length > 0 && localGameState.table1.length === localGameState.table2.length) {
                evaluateTable();
            }

            db.ref('game_state').set(localGameState);
        }

        function evaluateTable() {
            const card1 = localGameState.table1[localGameState.table1.length - 1];
            const card2 = localGameState.table2[localGameState.table2.length - 1];
            const score1 = cardScores[card1];
            const score2 = cardScores[card2];

            if (score1 > score2) {
                localGameState.phase = 'collect1';
            } else if (score2 > score1) {
                localGameState.phase = 'collect2';
            } else {
                localGameState.phase = 'draw';
            }
        }

        function collectCards(winnerNum) {
            let allPool = [...localGameState.table1, ...localGameState.table2];
            
            if (winnerNum === 1) {
                localGameState.deck1.push(...allPool);
            } else if (winnerNum === 2) {
                localGameState.deck2.push(...allPool);
            }

            localGameState.table1 = [];
            localGameState.table2 = [];
            localGameState.phase = 'draw';
            
            db.ref('game_state').set(localGameState);
        }

        function handleTableClick() {
            if (localGameState.phase === 'collect1') {
                collectCards(1);
            } else if (localGameState.phase === 'collect2') {
                collectCards(2);
            }
        }

        let aiTimeout = null;
        function checkAiAutoPlay() {
            clearTimeout(aiTimeout);
            if (!localGameState.aiMode) return;

            if (localGameState.phase === 'draw' && localGameState.table1.length > localGameState.table2.length && localGameState.deck2.length > 0) {
                aiTimeout = setTimeout(() => drawCard(2), 800);
            }
        }

        function getTopCardVisual(cardId) {
            return `url('kartka_${cardId}.webp')`;
        }

        function updateUI() {
            document.getElementById('count-1').innerText = localGameState.deck1.length;
            document.getElementById('count-2').innerText = localGameState.deck2.length;

            document.getElementById('deck-wrapper-1').style.visibility = localGameState.deck1.length > 0 ? 'visible' : 'hidden';
            document.getElementById('deck-wrapper-2').style.visibility = localGameState.deck2.length > 0 ? 'visible' : 'hidden';

            const labelPlayer1 = document.getElementById('label-player-1');
            const labelPlayer2 = document.getElementById('label-player-2');
            
            if (document.activeElement !== labelPlayer1) {
                labelPlayer1.innerText = localGameState.name1;
            }
            if (document.activeElement !== labelPlayer2) {
                labelPlayer2.innerText = localGameState.name2;
            }

            const el1 = document.getElementById('table-card-1');
            const el2 = document.getElementById('table-card-2');
            
            el1.className = 'card';
            el2.className = 'card';

            if (localGameState.table1.length > 0) {
                el1.style.visibility = 'visible';
                el1.style.backgroundImage = getTopCardVisual(localGameState.table1[localGameState.table1.length - 1]);
            } else {
                el1.style.visibility = 'hidden';
                el1.style.backgroundImage = 'none';
            }

            if (localGameState.table2.length > 0) {
                el2.style.visibility = 'visible';
                el2.style.backgroundImage = getTopCardVisual(localGameState.table2[localGameState.table2.length - 1]);
            } else {
                el2.style.visibility = 'hidden';
                el2.style.backgroundImage = 'none';
            }

            if (localGameState.phase === 'collect1') {
                el1.classList.add('win');
                el2.classList.add('lose');
            } else if (localGameState.phase === 'collect2') {
                el2.classList.add('win');
                el1.classList.add('lose');
            }

            const hint = document.getElementById('collect-hint');
            if (localGameState.phase === 'collect1' || localGameState.phase === 'collect2') {
                hint.style.display = 'block';
            } else {
                hint.style.display = 'none';
            }

            const modeBtn = document.getElementById('btn-mode');
            if (localGameState.aiMode) {
                modeBtn.innerText = "Режим: Комп'ютер";
                modeBtn.classList.add('active');
            } else {
                modeBtn.innerText = "Режим: 2 гравці";
                modeBtn.classList.remove('active');
            }
        }
    </script>
</html>
