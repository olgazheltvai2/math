<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>S & P — Fantasy City Arcade</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap');

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0d0822;
    font-family: 'Fredoka', sans-serif;
  }

  /* Crisp, razor-sharp typography with solid non-blurred dark outline */
  .crisp-math-text {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    fill: #FFFFFF;
    paint-order: stroke fill;
    stroke: #0c0717;
    stroke-width: 7px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .crisp-gold-text {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    fill: #FFE066;
    paint-order: stroke fill;
    stroke: #140a04;
    stroke-width: 7px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Stationary, rock-solid interactive buttons that NEVER jump or run away */
  .game-btn {
    cursor: pointer;
    position: relative;
    transition: filter 0.15s ease;
    outline: none;
    border: none;
    background: transparent;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .game-btn:hover {
    filter: brightness(1.16);
  }
  .game-btn:active .btn-inner-svg {
    transform: scale(0.95);
  }
  .btn-inner-svg {
    transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: center center;
    display: block;
  }

  /* Character idle & reaction animations */
  @keyframes breathe {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-4px); }
  }
  @keyframes blinkEye {
    0%, 92%, 100% { transform: scaleY(1); }
    96% { transform: scaleY(0.08); }
  }
  @keyframes floatIsland {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }
  @keyframes flameFlicker {
    0%, 100% { transform: scale(1) rotate(-2deg); }
    50% { transform: scale(1.08, 1.14) rotate(2deg); }
  }
  @keyframes charJumpJoy {
    0%, 100% { transform: translateY(0); }
    25% { transform: translateY(-24px); }
    50% { transform: translateY(-4px); }
    75% { transform: translateY(-18px); }
  }
  @keyframes charSadShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }
  @keyframes spinSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes popTower {
    0% { transform: scale(0.1); opacity: 0; }
    70% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .anim-breathe {
    animation: breathe 3.2s ease-in-out infinite;
  }
  .anim-blink {
    animation: blinkEye 4.2s infinite;
    transform-origin: center;
  }
  .anim-island {
    animation: floatIsland 5.5s ease-in-out infinite;
  }
  .anim-flame {
    animation: flameFlicker 0.45s ease-in-out infinite;
    transform-origin: bottom center;
  }
  .anim-joy {
    animation: charJumpJoy 0.75s ease-in-out 2;
  }
  .anim-sad {
    animation: charSadShake 0.55s ease-in-out 1;
  }
  .anim-spin {
    animation: spinSlow 12s linear infinite;
    transform-origin: center;
  }
  .anim-pop-tower {
    animation: popTower 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    transform-origin: bottom center;
  }
</style>
</head>
<body>

<div id="game-root" class="relative w-screen h-screen overflow-hidden select-none">

  <!-- ========================================================================= -->
  <!-- 1. LIVING FANTASY CITY FULLSCREEN BACKGROUND SVG                          -->
  <!-- ========================================================================= -->
  <svg id="bg-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" class="absolute inset-0 w-full h-full pointer-events-none z-0">
    <defs>
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0b0720"/>
        <stop offset="38%" stop-color="#1c1142"/>
        <stop offset="72%" stop-color="#351954"/>
        <stop offset="100%" stop-color="#582754"/>
      </linearGradient>

      <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff8d6" stop-opacity="0.9"/>
        <stop offset="40%" stop-color="#ffd966" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#a864ff" stop-opacity="0"/>
      </radialGradient>

      <radialGradient id="cyanMoonGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#e0ffff" stop-opacity="0.9"/>
        <stop offset="45%" stop-color="#48e5ff" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#48e5ff" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="woodPlank" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#7c4722"/>
        <stop offset="50%" stop-color="#582e12"/>
        <stop offset="100%" stop-color="#381b07"/>
      </linearGradient>

      <linearGradient id="woodDark" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#47230d"/>
        <stop offset="100%" stop-color="#241004"/>
      </linearGradient>

      <linearGradient id="stoneSlab" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#5b6275"/>
        <stop offset="50%" stop-color="#3f4554"/>
        <stop offset="100%" stop-color="#252934"/>
      </linearGradient>

      <linearGradient id="stoneDark" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2c303d"/>
        <stop offset="100%" stop-color="#171921"/>
      </linearGradient>

      <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff099"/>
        <stop offset="40%" stop-color="#f5b027"/>
        <stop offset="80%" stop-color="#b86b09"/>
        <stop offset="100%" stop-color="#ffe169"/>
      </linearGradient>

      <linearGradient id="crystalCyan" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#cffcff"/>
        <stop offset="45%" stop-color="#22d3ee"/>
        <stop offset="100%" stop-color="#0369a1"/>
      </linearGradient>

      <linearGradient id="crystalEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a7f3d0"/>
        <stop offset="45%" stop-color="#10b981"/>
        <stop offset="100%" stop-color="#065f46"/>
      </linearGradient>

      <linearGradient id="crystalMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f5d0fe"/>
        <stop offset="45%" stop-color="#d946ef"/>
        <stop offset="100%" stop-color="#701a75"/>
      </linearGradient>

      <linearGradient id="forgeFire" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#ef4444"/>
        <stop offset="55%" stop-color="#f97316"/>
        <stop offset="100%" stop-color="#fde047"/>
      </linearGradient>

      <linearGradient id="magicRiver" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#0f4469"/>
        <stop offset="50%" stop-color="#167c96"/>
        <stop offset="100%" stop-color="#115173"/>
      </linearGradient>

      <linearGradient id="courtyardTurf" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1d3b36"/>
        <stop offset="50%" stop-color="#142b28"/>
        <stop offset="100%" stop-color="#0c1a18"/>
      </linearGradient>
    </defs>

    <!-- Twilight Sky -->
    <rect width="1920" height="1080" fill="url(#skyGrad)"/>

    <!-- Twinkling Stars Container -->
    <g id="stars-layer"></g>

    <!-- Two Fantasy Moons -->
    <g transform="translate(1480, 190)">
      <circle r="120" fill="url(#moonGlow)"/>
      <circle r="50" fill="#fff5cc"/>
      <circle cx="-14" cy="-10" r="9" fill="#edd382" opacity="0.55"/>
      <circle cx="18" cy="14" r="12" fill="#edd382" opacity="0.45"/>
      <circle cx="7" cy="-20" r="5" fill="#edd382" opacity="0.5"/>
    </g>
    <g transform="translate(380, 165)">
      <circle r="68" fill="url(#cyanMoonGlow)"/>
      <circle r="25" fill="#d9ffff"/>
    </g>

    <!-- Drifting Animated Clouds Layer -->
    <g id="clouds-layer" opacity="0.5"></g>

    <!-- Floating Elven Crystal Island -->
    <g class="anim-island" transform="translate(220, 275)">
      <polygon points="0,0 120,0 100,42 60,88 20,42" fill="#3a284d"/>
      <ellipse cx="60" cy="0" rx="64" ry="13" fill="#256d54"/>
      <polygon points="48,-4 60,-68 72,-4" fill="url(#crystalCyan)"/>
      <polygon points="34,-2 42,-42 52,-2" fill="url(#crystalEmerald)"/>
      <polygon points="68,-2 78,-46 86,-2" fill="url(#crystalMagenta)"/>
    </g>

    <!-- Distant Mountain Silhouettes -->
    <path d="M0 650 L180 440 L340 560 L540 380 L760 570 L980 420 L1190 550 L1430 370 L1660 540 L1820 430 L1920 520 L1920 750 L0 750 Z" fill="#211338"/>
    <path d="M0 670 L140 530 L310 620 L490 480 L710 630 L960 500 L1240 620 L1490 470 L1710 600 L1920 505 L1920 760 L0 760 Z" fill="#161934"/>

    <!-- Background City Skyline Layer (Grows new glowing towers as tasks are solved!) -->
    <g id="city-skyline-towers"></g>

    <!-- LEFT DISTRICT: ELVEN WOODLAND TOWER -->
    <g transform="translate(65, 360)">
      <path d="M70 330 Q95 200 85 110 L135 110 Q125 200 155 330 Z" fill="#4d2c19"/>
      <ellipse cx="110" cy="95" rx="90" ry="50" fill="#135e4b"/>
      <polygon points="85,120 110,10 135,120" fill="url(#crystalCyan)"/>
      <polygon points="72,185 110,130 148,185" fill="url(#goldRim)"/>
      <path d="M98 220 A12 18 0 0 1 122 220 L122 250 L98 250 Z" fill="#80ffff"/>
    </g>

    <!-- RIGHT DISTRICT: ORCISH STONE FORTRESS -->
    <g transform="translate(1610, 360)">
      <polygon points="40,330 55,110 175,110 190,330" fill="url(#stoneSlab)"/>
      <rect x="45" y="92" width="28" height="24" fill="#3f4554"/>
      <rect x="85" y="92" width="28" height="24" fill="#3f4554"/>
      <rect x="125" y="92" width="28" height="24" fill="#3f4554"/>
      <rect x="162" y="92" width="28" height="24" fill="#3f4554"/>
      <path d="M48 140 Q10 120 18 85 Q32 110 52 120 Z" fill="#e5dec9"/>
      <path d="M182 140 Q220 120 212 85 Q198 110 178 120 Z" fill="#e5dec9"/>
      <path d="M90 190 A25 25 0 0 1 140 190 L140 245 L90 245 Z" fill="url(#forgeFire)"/>
      <line x1="106" y1="170" x2="106" y2="245" stroke="#1e1b18" stroke-width="4"/>
      <line x1="124" y1="170" x2="124" y2="245" stroke="#1e1b18" stroke-width="4"/>
      <g transform="translate(115, 88)">
        <path class="anim-flame" d="M-18,0 Q-22,-32 0,-52 Q22,-32 18,0 Z" fill="url(#forgeFire)"/>
      </g>
    </g>

    <!-- SHIMMERING MAGIC RIVER & FOREGROUND COURTYARD -->
    <path d="M0 660 Q480 625 960 650 Q1440 675 1920 640 L1920 760 L0 760 Z" fill="url(#magicRiver)"/>
    <path d="M0 730 Q960 680 1920 730 L1920 1080 L0 1080 Z" fill="url(#courtyardTurf)"/>
    <path d="M0 730 Q960 680 1920 730" stroke="#385950" stroke-width="8" fill="none"/>

    <!-- Foreground Luminous Fantasy Mushrooms -->
    <g transform="translate(65, 935)">
      <path d="M22 70 Q20 40 28 22 L38 22 Q45 40 42 70 Z" fill="#d8b4fe"/>
      <path d="M0 28 Q33 -12 66 28 Z" fill="url(#crystalMagenta)"/>
      <circle cx="22" cy="14" r="4.5" fill="#fff"/>
      <circle cx="42" cy="12" r="3.5" fill="#fff"/>
    </g>
    <g transform="translate(1810, 945) scale(0.9)">
      <path d="M22 70 Q20 40 28 22 L38 22 Q45 40 42 70 Z" fill="#a7f3d0"/>
      <path d="M0 28 Q33 -12 66 28 Z" fill="url(#crystalCyan)"/>
      <circle cx="20" cy="14" r="4.5" fill="#fff"/>
      <circle cx="44" cy="12" r="3.5" fill="#fff"/>
    </g>
  </svg>

  <!-- ========================================================================= -->
  <!-- 2. SAFE-AREA UI LAYOUT CONTAINER (100vw x 100vh, NEVER CROPPED!)          -->
  <!-- ========================================================================= -->
  <div class="relative z-10 w-full h-full flex flex-col justify-between p-4 sm:p-6 md:px-8 md:py-5">

    <!-- TOP NAVIGATION BAR (Always inside safe viewport area) -->
    <div class="w-full flex items-center justify-between gap-4 shrink-0">

      <!-- TOP-LEFT: Mode & S/P Filter Controls -->
      <div class="flex items-center gap-2 sm:gap-3 px-3 py-2 rounded-2xl border-4 border-[#e5a93c] shadow-2xl"
           style="background: linear-gradient(180deg, #47230d 0%, #241004 100%);">

        <!-- Button 1: Auto-Cycle All Modes (Star Crystal Icon) -->
        <button id="mode-btn-all" class="game-btn" aria-label="All Modes">
          <svg class="btn-inner-svg w-12 h-11 sm:w-14 sm:h-12" viewBox="0 0 60 54">
            <rect id="mode-bg-all" x="3" y="3" width="54" height="48" rx="13" fill="url(#stoneSlab)" stroke="#FFE066" stroke-width="4"/>
            <polygon points="30,10 35,21 47,21 37,28 41,40 30,33 19,40 23,28 13,21 25,21" fill="#FFE066" stroke="#140a04" stroke-width="2"/>
          </svg>
        </button>

        <!-- Button 2: Target Shooting Arcade Mode (Bullseye Icon) -->
        <button id="mode-btn-arcade" class="game-btn" aria-label="Target Mode">
          <svg class="btn-inner-svg w-12 h-11 sm:w-14 sm:h-12" viewBox="0 0 60 54">
            <rect id="mode-bg-arcade" x="3" y="3" width="54" height="48" rx="13" fill="url(#stoneDark)" stroke="#64748b" stroke-width="3"/>
            <circle cx="30" cy="27" r="15" stroke="#22d3ee" stroke-width="4" fill="#141824"/>
            <circle cx="30" cy="27" r="7" fill="#f97316"/>
          </svg>
        </button>

        <!-- Button 3: Interactive Grid Architect Mode (Stretching Grid Icon) -->
        <button id="mode-btn-builder" class="game-btn" aria-label="Builder Mode">
          <svg class="btn-inner-svg w-12 h-11 sm:w-14 sm:h-12" viewBox="0 0 60 54">
            <rect id="mode-bg-builder" x="3" y="3" width="54" height="48" rx="13" fill="url(#stoneDark)" stroke="#64748b" stroke-width="3"/>
            <rect x="16" y="13" width="28" height="28" rx="4" fill="#10b981" stroke="#052e16" stroke-width="2.5"/>
            <line x1="30" y1="13" x2="30" y2="41" stroke="#052e16" stroke-width="2.5"/>
            <line x1="16" y1="27" x2="44" y2="27" stroke="#052e16" stroke-width="2.5"/>
          </svg>
        </button>

        <!-- Button 4: Toggle S / P / Both (`S|P` High-Contrast Rune Stone) -->
        <button id="topic-toggle-btn" class="game-btn" aria-label="Toggle S and P">
          <svg class="btn-inner-svg w-20 h-11 sm:w-24 sm:h-12" viewBox="0 0 96 54">
            <rect x="3" y="3" width="90" height="48" rx="13" fill="#18122B" stroke="#FFE066" stroke-width="4"/>
            <text id="topic-toggle-label" x="48" y="36" text-anchor="middle" font-size="26" class="crisp-gold-text">S / P</text>
          </svg>
        </button>
      </div>

      <!-- CENTER TOP: HIGH-CONTRAST RUNIC QUESTION PLAQUE (`S = ?` or `P = ?`) -->
      <button id="question-plaque" class="game-btn" aria-label="Question Formula">
        <svg class="btn-inner-svg w-64 h-16 sm:w-80 sm:h-20 md:w-96 md:h-22" viewBox="0 0 420 96">
          <!-- Ornate Wooden & Gold Runic Shield Plaque with Dark High-Contrast Interior -->
          <path d="M 24 8 L 396 8 L 414 48 L 396 88 L 24 88 L 6 48 Z" fill="url(#woodPlank)" stroke="url(#goldRim)" stroke-width="6"/>
          <path d="M 34 16 L 386 16 L 400 48 L 386 80 L 34 80 L 20 48 Z" fill="#160d24" stroke="#854d27" stroke-width="3"/>

          <!-- Left Visual Concept Icon (Area = 2x2 filled emerald tiles, Perimeter = bright cyan outline) -->
          <g id="plaque-concept-icon" transform="translate(88, 48)"></g>

          <!-- High-Contrast Razor-Sharp Math Formula ONLY (`S = ?` or `P = ?` or `S = 18`) -->
          <text id="plaque-formula-text" x="242" y="65" text-anchor="middle" font-size="52" class="crisp-math-text" letter-spacing="2">S = ?</text>
        </svg>
      </button>

      <!-- TOP-RIGHT: Sound Toggle & Mandatory Minimalist "NEXT" Arrow Button -->
      <div class="flex items-center gap-3 shrink-0">
        <!-- Sound Horn Toggle Button -->
        <button id="sound-toggle-btn" class="game-btn" aria-label="Toggle Sound">
          <svg class="btn-inner-svg w-14 h-14 sm:w-16 sm:h-15" viewBox="0 0 72 66">
            <rect x="4" y="4" width="64" height="58" rx="18" fill="#18122B" stroke="url(#goldRim)" stroke-width="4.5"/>
            <path d="M 19 27 L 29 27 L 43 15 L 43 51 L 29 39 L 19 39 Z" fill="#FFE066"/>
            <path id="sound-waves-icon" d="M 49 23 Q 57 33 49 43 M 54 17 Q 65 33 54 49" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round"/>
            <line id="sound-mute-slash" x1="16" y1="15" x2="56" y2="51" stroke="#ef4444" stroke-width="6" stroke-linecap="round" style="display: none;"/>
          </svg>
        </button>

        <!-- ALWAYS-VISIBLE MINIMALIST "NEXT" BUTTON (Skip immediately to next task) -->
        <button id="next-task-btn" class="game-btn" aria-label="Next Task">
          <svg class="btn-inner-svg w-20 h-14 sm:w-24 sm:h-15" viewBox="0 0 96 66">
            <rect x="4" y="4" width="88" height="58" rx="18" fill="#064e3b" stroke="url(#goldRim)" stroke-width="5"/>
            <rect x="10" y="10" width="76" height="46" rx="13" fill="#047857"/>
            <polygon points="26,17 50,33 26,49" fill="#FFE066" stroke="#140a04" stroke-width="2.5" stroke-linejoin="round"/>
            <polygon points="48,17 72,33 48,49" fill="#FFFFFF" stroke="#140a04" stroke-width="2.5" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- ========================================================================= -->
    <!-- 3. THREE-COLUMN MAIN GAMEPLAY STAGE (LEFT HERO | CENTER BOARD | RIGHT 2x2)-->
    <!-- ========================================================================= -->
    <div class="w-full flex-1 min-h-0 grid grid-cols-12 gap-3 sm:gap-5 items-center my-1">

      <!-- LEFT COLUMN (3 cols): ACTIVE FANTASY CHARACTER STATION -->
      <div class="col-span-3 h-full flex items-end justify-center pb-2">
        <button id="character-station-btn" class="game-btn w-full max-w-[290px] h-full max-h-[430px]" aria-label="Character Interactive">
          <svg id="character-svg" viewBox="0 0 340 440" class="w-full h-full overflow-visible">
            <!-- Stone & Gold Pedestal -->
            <ellipse cx="170" cy="395" rx="145" ry="32" fill="#0d1b1a"/>
            <ellipse cx="170" cy="385" rx="132" ry="26" fill="url(#stoneSlab)" stroke="url(#goldRim)" stroke-width="4"/>
            <ellipse cx="170" cy="379" rx="108" ry="18" fill="#1e2433"/>

            <!-- CHARACTER 1: ELF ARCHER -->
            <g id="char-elf" transform="translate(170, 265)" style="display: none;">
              <g id="elf-rig" class="anim-breathe">
                <path d="M -38 -45 Q -82 40 -68 118 L 52 118 Q 62 40 35 -45 Z" fill="#0d5c46" stroke="#052e22" stroke-width="3"/>
                <path d="M -32 82 L -38 120 L -8 120 L -12 82 Z" fill="#5c3418"/>
                <path d="M 15 82 L 12 120 L 42 120 L 35 82 Z" fill="#5c3418"/>
                <path d="M -32 -35 L 32 -35 L 42 86 L -42 86 Z" fill="#10b981" stroke="url(#goldRim)" stroke-width="3.5"/>
                <polygon points="-18,-35 0,22 18,-35" fill="#eab308"/>
                <rect x="-36" y="28" width="72" height="14" rx="4" fill="#4a2810"/>
                <polygon points="0,22 12,35 0,48 -12,35" fill="url(#crystalCyan)"/>

                <!-- Head & Pointed Ears -->
                <g transform="translate(0, -80)">
                  <path d="M -34 -5 L -86 -26 L -40 16 Z" fill="#fbd3b6" stroke="#c27d56" stroke-width="2.5"/>
                  <path d="M 34 -5 L 86 -24 L 40 16 Z" fill="#fbd3b6" stroke="#c27d56" stroke-width="2.5"/>
                  <path d="M -44 -20 Q -55 45 -35 82 L 35 82 Q 55 45 44 -20 Z" fill="#facc15"/>
                  <ellipse cx="0" cy="0" rx="38" ry="42" fill="#fde2cc" stroke="#d99b78" stroke-width="2"/>
                  <ellipse cx="-22" cy="10" rx="8" ry="4.5" fill="#fb7185" opacity="0.5"/>
                  <ellipse cx="22" cy="10" rx="8" ry="4.5" fill="#fb7185" opacity="0.5"/>

                  <g id="elf-eyes" class="anim-blink">
                    <ellipse cx="-14" cy="-4" rx="6" ry="8" fill="#064e3b"/>
                    <ellipse cx="14" cy="-4" rx="6" ry="8" fill="#064e3b"/>
                    <circle cx="-12" cy="-7" r="2.5" fill="#fff"/>
                    <circle cx="16" cy="-7" r="2.5" fill="#fff"/>
                  </g>
                  <path d="M -10 18 Q 0 27 12 18" stroke="#7c2d12" stroke-width="4" fill="none" stroke-linecap="round"/>
                  <path d="M -42 -12 Q -15 -42 0 -22 Q 15 -42 42 -12 Q 35 -48 0 -48 Q -35 -48 -42 -12 Z" fill="#fde047"/>
                  <path d="M -36 -22 L 0 -36 L 36 -22" stroke="url(#goldRim)" stroke-width="5" fill="none"/>
                  <polygon points="0,-46 8,-30 0,-20 -8,-30" fill="url(#crystalCyan)"/>
                </g>

                <!-- Aiming Bow -->
                <g id="elf-bow-group" transform="translate(28, -10)">
                  <line x1="18" y1="-90" x2="18" y2="90" stroke="#e0f2fe" stroke-width="3"/>
                  <path d="M 18 -90 Q 84 -42 84 0 Q 84 42 18 90" stroke="url(#goldRim)" stroke-width="9" fill="none" stroke-linecap="round"/>
                  <path d="M 18 -90 Q 76 -42 76 0 Q 76 42 18 90" stroke="#059669" stroke-width="4" fill="none" stroke-linecap="round"/>
                  <polygon points="78,-14 94,0 78,14 70,0" fill="url(#crystalCyan)"/>
                  <g id="elf-loaded-arrow">
                    <line x1="18" y1="0" x2="104" y2="0" stroke="#38bdf8" stroke-width="5"/>
                    <polygon points="100,-10 122,0 100,10" fill="#ffffff"/>
                  </g>

<script>
(() => {
  /* ============================================================================
   * 1. PROCEDURAL WEB AUDIO SYNTHESIZER
   * ============================================================================ */
  class FantasySoundEngine {
    constructor() {
      this.ctx = null;
      this.muted = false;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    toggleMute() {
      this.init();
      this.muted = !this.muted;
      return this.muted;
    }

    playTone(freq, type = 'sine', duration = 0.2, startTime = 0, vol = 0.18, slideTo = null) {
      if (this.muted) return;
      this.init();
      if (!this.ctx) return;

      const now = this.ctx.currentTime + startTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + duration);
      }

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    playTileTick(index = 0) {
      const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
      const freq = scale[index % scale.length] * (1 + Math.floor(index / scale.length) * 0.25);
      this.playTone(freq, 'triangle', 0.14, 0, 0.2);
      this.playTone(freq * 2, 'sine', 0.08, 0.01, 0.08);
    }

    playHoverTick() {
      this.playTone(587.33, 'sine', 0.05, 0, 0.06, 659.25);
    }

    playElfShoot() {
      this.playTone(523.25, 'triangle', 0.25, 0, 0.22, 783.99);
      this.playTone(659.25, 'sine', 0.22, 0.03, 0.16, 1046.5);
    }

    playElfHarp() {
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      notes.forEach((n, i) => this.playTone(n, 'triangle', 0.42, i * 0.055, 0.16));
    }

    playOrcSmash() {
      this.playTone(110, 'sawtooth', 0.24, 0, 0.26, 55);
      this.playTone(880, 'square', 0.11, 0, 0.14, 440);
      this.playTone(240, 'triangle', 0.28, 0.04, 0.22, 90);
    }

    playOrcGrunt() {
      this.playTone(95, 'sawtooth', 0.18, 0, 0.26, 65);
      this.playTone(130, 'triangle', 0.22, 0.08, 0.24, 85);
    }

    playGoblinLaunch() {
      this.playTone(220, 'sine', 0.2, 0, 0.22, 680);
      this.playTone(480, 'triangle', 0.12, 0.08, 0.15, 880);
    }

    playGoblinGiggle() {
      [587, 740, 659, 880, 784].forEach((f, i) => {
        this.playTone(f, 'sine', 0.09, i * 0.06, 0.18, f * 1.15);
      });
    }

    playVictory(charType) {
      if (charType === 'elf') {
        const melody = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50, 1318.51];
        melody.forEach((f, i) => {
          this.playTone(f, 'triangle', 0.35, i * 0.08, 0.22);
          this.playTone(f * 1.5, 'sine', 0.25, i * 0.08 + 0.02, 0.1);
        });
      } else if (charType === 'orc') {
        const horn = [196.00, 261.63, 329.63, 392.00, 329.63, 523.25];
        horn.forEach((f, i) => {
          const dur = i === horn.length - 1 ? 0.52 : 0.18;
          this.playTone(f, 'sawtooth', dur, i * 0.11, 0.2);
          this.playTone(f * 0.5, 'triangle', dur, i * 0.11, 0.22);
        });
      } else {
        const bounce = [349.23, 440.00, 523.25, 698.46, 587.33, 698.46, 880.00];
        bounce.forEach((f, i) => {
          this.playTone(f, 'square', 0.16, i * 0.075, 0.14);
          this.playTone(f * 2, 'sine', 0.14, i * 0.075, 0.12);
        });
      }
    }

    playWrong(charType) {
      if (charType === 'elf') {
        this.playTone(320, 'sine', 0.35, 0, 0.24, 140);
        this.playTone(180, 'triangle', 0.25, 0.12, 0.22, 420);
      } else if (charType === 'orc') {
        this.playTone(155, 'sawtooth', 0.22, 0, 0.24, 110);
        this.playTone(110, 'sawtooth', 0.4, 0.18, 0.24, 72);
      } else {
        this.playTone(720, 'sine', 0.28, 0, 0.22, 240);
        this.playTone(380, 'triangle', 0.18, 0.18, 0.2, 540);
      }
    }

    playNextSkip() {
      this.playTone(440, 'triangle', 0.1, 0, 0.15, 660);
      this.playTone(660, 'sine', 0.14, 0.06, 0.15, 880);
    }
  }

  const sfx = new FantasySoundEngine();

  /* ============================================================================
   * 2. LIVING BACKGROUND INITIALIZATION
   * ============================================================================ */
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}) => {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs)) {
      node.setAttribute(k, v);
    }
    return node;
  };

  const starsLayer = document.getElementById('stars-layer');
  for (let i = 0; i < 60; i++) {
    const cx = Math.random() * 1920;
    const cy = Math.random() * 440;
    const r = 1.2 + Math.random() * 2.4;
    starsLayer.appendChild(el('circle', {
      cx, cy, r,
      fill: i % 3 === 0 ? '#a5f3fc' : '#fef08a',
      opacity: (0.4 + Math.random() * 0.6).toFixed(2)
    }));
  }

  const cloudsLayer = document.getElementById('clouds-layer');
  const clouds = [
    { x: 180, y: 120, scale: 1.1, speed: 0.16 },
    { x: 820, y: 85, scale: 0.9, speed: 0.12 },
    { x: 1380, y: 155, scale: 1.2, speed: 0.2 }
  ];
  clouds.forEach(c => {
    const g = el('g', { transform: `translate(${c.x}, ${c.y}) scale(${c.scale})` });
    g.appendChild(el('path', {
      d: 'M 0 30 Q 25 5 55 18 Q 85 -8 125 15 Q 160 5 180 30 Z',
      fill: '#4c2c72'
    }));
    cloudsLayer.appendChild(g);
    c.node = g;
  });

  /* ============================================================================
   * 3. GAME STATE & PROCEDURAL MATH GENERATOR
   * ============================================================================ */
  const state = {
    modeFilter: 'all',     // 'all' | 'arcade' | 'builder'
    topicFilter: 'both',   // 'both' | 'S' | 'P'
    charOrder: ['elf', 'orc', 'goblin'],
    charIndex: 0,
    solvedCount: 0,
    currentTask: null,
    locked: false,
    gridVisible: false,
    projectiles: [],
    particles: [],
    builderW: 3,
    builderH: 3
  };

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateTask() {
    state.locked = false;
    state.gridVisible = false;
    state.projectiles = [];
    document.getElementById('completed-building-layer').innerHTML = '';
    document.getElementById('blueprint-perimeter-fx').innerHTML = '';
    document.getElementById('projectile-layer').innerHTML = '';

    let charType = state.charOrder[state.charIndex % 3];
    state.charIndex++;

    let mechanic = 'arcade';
    if (state.modeFilter === 'arcade') {
      mechanic = 'arcade';
    } else if (state.modeFilter === 'builder') {
      mechanic = 'builder';
      charType = 'goblin';
    } else {
      if (state.charIndex % 4 === 0) {
        mechanic = 'builder';
      }
    }

    let concept = 'S';
    if (state.topicFilter === 'S') concept = 'S';
    else if (state.topicFilter === 'P') concept = 'P';
    else concept = Math.random() < 0.5 ? 'S' : 'P';

    let shapeType = 'rect';
    if (mechanic === 'arcade' && Math.random() < 0.2) {
      shapeType = 'L';
    }

    let w, h, cutW = 0, cutH = 0, correctValue = 0;

    if (shapeType === 'rect') {
      if (mechanic === 'builder') {
        w = randInt(2, 8);
        h = randInt(2, 6);
        state.builderW = w === 4 ? 2 : 4;
        state.builderH = h === 3 ? 2 : 3;
      } else {
        w = randInt(2, 9);
        h = randInt(2, 7);
      }
      correctValue = concept === 'S' ? (w * h) : 2 * (w + h);
    } else {
      w = randInt(5, 8);
      h = randInt(4, 6);
      cutW = randInt(2, w - 2);
      cutH = randInt(2, h - 2);
      correctValue = concept === 'S' ? (w * h - cutW * cutH) : 2 * (w + h);
    }

    // Generate smart 3rd-4th grade distractors
    const optionsSet = new Set([correctValue]);
    const oppositeValue = shapeType === 'rect'
      ? (concept === 'S' ? 2 * (w + h) : w * h)
      : (concept === 'S' ? 2 * (w + h) : (w * h - cutW * cutH));

    if (oppositeValue > 0 && oppositeValue !== correctValue) optionsSet.add(oppositeValue);
    if (w + h !== correctValue) optionsSet.add(w + h);
    if (w * (h + 1) !== correctValue) optionsSet.add(w * (h + 1));
    if ((w - 1) * h > 0 && (w - 1) * h !== correctValue) optionsSet.add((w - 1) * h);
    if (2 * w + h !== correctValue) optionsSet.add(2 * w + h);

    while (optionsSet.size < 4) {
      const cand = correctValue + randInt(-5, 7);
      if (cand > 3 && cand !== correctValue) optionsSet.add(cand);
    }

    const options = Array.from(optionsSet).slice(0, 4).sort(() => Math.random() - 0.5);

    state.currentTask = {
      charType,
      mechanic,
      concept,
      shapeType,
      w,
      h,
      cutW,
      cutH,
      correctValue,
      options
    };

    renderCharacter(charType);
    renderQuestionPlaque();
    renderBlueprint();

    const targetsGrid = document.getElementById('targets-grid-container');
    const leverBox = document.getElementById('architect-lever-container');

    if (mechanic === 'arcade') {
      targetsGrid.classList.remove('hidden');
      targetsGrid.classList.add('grid');
      leverBox.classList.add('hidden');
      leverBox.classList.remove('flex');
      renderStationaryTargets();
    } else {
      targetsGrid.classList.add('hidden');
      targetsGrid.classList.remove('grid');
      leverBox.classList.remove('hidden');
      leverBox.classList.add('flex');
    }
  }

  /* ============================================================================
   * 4. RENDER CHARACTERS, HIGH-CONTRAST PLAQUE & BLUEPRINT
   * ============================================================================ */
  function renderCharacter(charType) {
    document.getElementById('char-elf').style.display = charType === 'elf' ? 'block' : 'none';
    document.getElementById('char-orc').style.display = charType === 'orc' ? 'block' : 'none';
    document.getElementById('char-goblin').style.display = charType === 'goblin' ? 'block' : 'none';

    document.getElementById('orc-soot-mask').setAttribute('opacity', '0');
    document.getElementById('orc-steam-fx').style.display = 'none';
    document.getElementById('goblin-foam-fx').style.display = 'none';
    document.getElementById('elf-loaded-arrow').style.display = 'block';
    document.getElementById('elf-bow-group').setAttribute('transform', 'translate(28, -10) rotate(0)');
  }

  function renderQuestionPlaque() {
    const { concept, mechanic, correctValue } = state.currentTask;
    const iconGroup = document.getElementById('plaque-concept-icon');
    const formulaText = document.getElementById('plaque-formula-text');
    iconGroup.innerHTML = '';

    if (concept === 'S') {
      const positions = [[-22, -22], [3, -22], [-22, 3], [3, 3]];
      positions.forEach(([x, y]) => {
        iconGroup.appendChild(el('rect', {
          x, y, width: 21, height: 21, rx: 4,
          fill: '#10b981',
          stroke: '#FFFFFF',
          'stroke-width': 2.5
        }));
      });
    } else {
      iconGroup.appendChild(el('rect', {
        x: -22, y: -22, width: 44, height: 44, rx: 6,
        fill: 'none',
        stroke: '#22d3ee',
        'stroke-width': 6
      }));
      [[-22, -22], [22, -22], [22, 22], [-22, 22]].forEach(([cx, cy]) => {
        iconGroup.appendChild(el('circle', {
          cx, cy, r: 5.5,
          fill: '#FFE066',
          stroke: '#140a04',

        }));
      });

    formulaText.textContent = mechanic === 'builder'
      ? `${concept} = ${correctValue}`
      : `${concept} = ?`;
  }

  function renderBlueprint() {
    const bgGrid = document.getElementById('blueprint-bg-grid');
    const shapeLayer = document.getElementById('blueprint-shape-layer');
    const dimLayer = document.getElementById('blueprint-dimensions-layer');

    bgGrid.innerHTML = '';
    shapeLayer.innerHTML = '';
    dimLayer.innerHTML = '';

    const task = state.currentTask;
    const isBuilder = task.mechanic === 'builder';

    const maxCols = 10;
    const maxRows = 8;
    const cellSize = 46;
    const startX = 370 - (maxCols * cellSize) / 2;
    const startY = 295 - (maxRows * cellSize) / 2;

    for (let r = 0; r <= maxRows; r++) {
      bgGrid.appendChild(el('line', {
        x1: startX, y1: startY + r * cellSize,
        x2: startX + maxCols * cellSize, y2: startY + r * cellSize,
        stroke: '#38bdf8', 'stroke-width': 1.5
      }));
    }
    for (let c = 0; c <= maxCols; c++) {
      bgGrid.appendChild(el('line', {
        x1: startX + c * cellSize, y1: startY,
        x2: startX + c * cellSize, y2: startY + maxRows * cellSize,
        stroke: '#38bdf8', 'stroke-width': 1.5
      }));
    }

    if (isBuilder) {
      renderInteractiveBuilderGrid(startX, startY, cellSize, maxCols, maxRows);
      return;
    }

    const { w, h, cutW, cutH, shapeType, concept } = task;
    const shapeX = 370 - (w * cellSize) / 2;
    const shapeY = 295 - (h * cellSize) / 2;

    let tileIndex = 0;
    for (let r = 0; r < h; r++) {
      for (let c = 0; c < w; c++) {
        if (shapeType === 'L' && c >= (w - cutW) && r < cutH) continue;

        const tx = shapeX + c * cellSize;
        const ty = shapeY + r * cellSize;
        const idx = tileIndex++;

        const tile = el('rect', {
          x: tx + 2,
          y: ty + 2,
          width: cellSize - 4,
          height: cellSize - 4,
          rx: 6,
          fill: state.gridVisible ? '#10b981' : '#164360',
          stroke: state.gridVisible ? '#a7f3d0' : '#25648a',
          'stroke-width': state.gridVisible ? 2.5 : 1.5,
          class: 'cursor-pointer'
        });

        tile.addEventListener('click', (e) => {
          e.stopPropagation();
          sfx.playTileTick(idx);
          tile.setAttribute('fill', '#10b981');
          tile.setAttribute('stroke', '#fde047');
          tile.setAttribute('stroke-width', '3');
        });

        shapeLayer.appendChild(tile);
      }
    }

    let outlinePath = '';
    if (shapeType === 'rect') {
      outlinePath = `M ${shapeX} ${shapeY} L ${shapeX + w * cellSize} ${shapeY} L ${shapeX + w * cellSize} ${shapeY + h * cellSize} L ${shapeX} ${shapeY + h * cellSize} Z`;
    } else {
      const stepX = shapeX + (w - cutW) * cellSize;
      const stepY = shapeY + cutH * cellSize;
      outlinePath = `M ${shapeX} ${shapeY} L ${stepX} ${shapeY} L ${stepX} ${stepY} L ${shapeX + w * cellSize} ${stepY} L ${shapeX + w * cellSize} ${shapeY + h * cellSize} L ${shapeX} ${shapeY + h * cellSize} Z`;
    }

    shapeLayer.appendChild(el('path', {
      d: outlinePath,
      fill: 'none',
      stroke: concept === 'P' ? '#22d3ee' : '#f5b027',
      'stroke-width': 6,
      'stroke-linejoin': 'round',
      style: 'pointer-events: none;'
    }));

    const vertices = shapeType === 'rect'
      ? [
          [shapeX, shapeY],
          [shapeX + w * cellSize, shapeY],
          [shapeX + w * cellSize, shapeY + h * cellSize],
          [shapeX, shapeY + h * cellSize]
        ]
      : [
          [shapeX, shapeY],
          [shapeX + (w - cutW) * cellSize, shapeY],
          [shapeX + (w - cutW) * cellSize, shapeY + cutH * cellSize],
          [shapeX + w * cellSize, shapeY + cutH * cellSize],
          [shapeX + w * cellSize, shapeY + h * cellSize],
          [shapeX, shapeY + h * cellSize]
        ];

    vertices.forEach(([vx, vy]) => {
      shapeLayer.appendChild(el('circle', {
        cx: vx, cy: vy, r: 6.5,
        fill: '#FFE066',
        stroke: '#241004',
        'stroke-width': 2.5
      }));
    });

    // High-contrast razor-sharp side length plaques
    if (shapeType === 'rect') {
      createDimensionBadge(dimLayer, shapeX + (w * cellSize) / 2, shapeY - 34, w);
      createDimensionBadge(dimLayer, shapeX - 38, shapeY + (h * cellSize) / 2, h);
    } else {
      createDimensionBadge(dimLayer, shapeX + (w * cellSize) / 2, shapeY + h * cellSize + 36, w);
      createDimensionBadge(dimLayer, shapeX - 38, shapeY + (h * cellSize) / 2, h);
      createDimensionBadge(dimLayer, shapeX + ((w - cutW) * cellSize) / 2, shapeY - 32, w - cutW);
      createDimensionBadge(dimLayer, shapeX + w * cellSize + 38, shapeY + cutH * cellSize + ((h - cutH) * cellSize) / 2, h - cutH);
    }
  }

  function renderInteractiveBuilderGrid(startX, startY, cellSize, maxCols, maxRows) {
    const shapeLayer = document.getElementById('blueprint-shape-layer');
    const dimLayer = document.getElementById('blueprint-dimensions-layer');

    const bw = state.builderW;
    const bh = state.builderH;
    const originC = 1;
    const originR = 1;

    for (let r = 0; r < maxRows; r++) {
      for (let c = 0; c < maxCols; c++) {
        const inRect = c >= originC && c < originC + bw && r >= originR && r < originR + bh;
        const cx = startX + c * cellSize;
        const cy = startY + r * cellSize;

        const cell = el('rect', {
          x: cx + 2,
          y: cy + 2,
          width: cellSize - 4,
          height: cellSize - 4,
          rx: 6,
          fill: inRect ? '#10b981' : 'rgba(20, 56, 79, 0.45)',
          stroke: inRect ? '#fde047' : '#1e4e68',
          'stroke-width': inRect ? 2.5 : 1,
          class: 'cursor-pointer'
        });

        const resizeToHere = () => {
          if (state.locked) return;
          const newW = Math.max(1, Math.min(8, c - originC + 1));
          const newH = Math.max(1, Math.min(6, r - originR + 1));
          if (newW !== state.builderW || newH !== state.builderH) {
            state.builderW = newW;
            state.builderH = newH;
            sfx.playTileTick(newW + newH);
            renderBlueprint();
          }
        };

        cell.addEventListener('pointerdown', resizeToHere);
        cell.addEventListener('pointerenter', (e) => {
          if (e.buttons === 1) resizeToHere();
        });

        shapeLayer.appendChild(cell);
      }
    }

    const rx = startX + originC * cellSize;
    const ry = startY + originR * cellSize;
    shapeLayer.appendChild(el('rect', {
      x: rx, y: ry,
      width: bw * cellSize,
      height: bh * cellSize,
      fill: 'none',
      stroke: '#FFE066',
      'stroke-width': 6,
      rx: 6,
      style: 'pointer-events: none;'
    }));

    // Corner drag handle indicator
    shapeLayer.appendChild(el('circle', {
      cx: rx + bw * cellSize,
      cy: ry + bh * cellSize,
      r: 12,
      fill: '#FFE066',
      stroke: '#140a04',
      'stroke-width': 3.5,
      style: 'pointer-events: none;'
    }));

    createDimensionBadge(dimLayer, rx + (bw * cellSize) / 2, ry - 32, bw);
    createDimensionBadge(dimLayer, rx - 36, ry + (bh * cellSize) / 2, bh);
  }

  function createDimensionBadge(container, x, y, numberValue) {
    const g = el('g', { transform: `translate(${x}, ${y})` });
    g.appendChild(el('rect', {
      x: -28, y: -23, width: 56, height: 46, rx: 12,
      fill: '#18122B',
      stroke: '#FFE066',
      'stroke-width': 3.5
    }));
    const txt = el('text', {
      x: 0, y: 11,
      'text-anchor': 'middle',
      'font-size': '31',
      class: 'crisp-math-text'
    });
    txt.textContent = numberValue;
    g.appendChild(txt);
    container.appendChild(g);
  }

  /* ============================================================================
   * 6. TARGET CLICK, FAST PROJECTILE & CHARACTER REACTIONS
   * ============================================================================ */
  function screenToOverlayCoords(clientX, clientY) {
    return {
      x: (clientX / window.innerWidth) * 1920,
      y: (clientY / window.innerHeight) * 1080
    };
  }

  function handleStationaryTargetClick(btn, svgNode, chosenVal) {
    if (state.locked || btn.dataset.hit === 'true') return;

    const { charType, correctValue } = state.currentTask;
    const isCorrect = chosenVal === correctValue;
    btn.dataset.hit = 'true';
    if (isCorrect) state.locked = true;

    const charBtn = document.getElementById('character-station-btn');
    const cRect = charBtn.getBoundingClientRect();
    const tRect = btn.getBoundingClientRect();

    const startPt = screenToOverlayCoords(cRect.left + cRect.width * 0.65, cRect.top + cRect.height * 0.5);
    const endPt = screenToOverlayCoords(tRect.left + tRect.width / 2, tRect.top + tRect.height / 2);

    if (charType === 'elf') {
      sfx.playElfShoot();
      document.getElementById('elf-loaded-arrow').style.display = 'none';
    } else if (charType === 'orc') {
      sfx.playOrcSmash();
      const arm = document.getElementById('orc-hammer-arm');
      arm.style.transform = 'rotate(55deg)';
      setTimeout(() => { arm.style.transform = 'rotate(0deg)'; }, 240);
      spawnSparkleBurst(startPt.x, startPt.y, '#f97316', 14);
    } else {
      sfx.playGoblinLaunch();
    }

    const projLayer = document.getElementById('projectile-layer');
    const pNode = el('g');

    if (charType === 'elf') {
      pNode.appendChild(el('line', {
        x1: -35, y1: 0, x2: 25, y2: 0,
        stroke: '#38bdf8', 'stroke-width': 7
      }));
      pNode.appendChild(el('polygon', {
        points: '20,-12 44,0 20,12',
        fill: '#ffffff', stroke: '#0284c7', 'stroke-width': 2
      }));
    } else if (charType === 'orc') {
      pNode.appendChild(el('circle', {
        cx: 0, cy: 0, r: 22,
        fill: 'url(#forgeFire)', stroke: '#fff', 'stroke-width': 2
      }));
    } else {
      pNode.appendChild(el('circle', {
        cx: 0, cy: 0, r: 20,
        fill: 'url(#crystalMagenta)', stroke: '#fff', 'stroke-width': 3
      }));
    }

    projLayer.appendChild(pNode);

    state.projectiles.push({
      node: pNode,
      startX: startPt.x,
      startY: startPt.y,
      endX: endPt.x,
      endY: endPt.y,
      progress: 0,
      speed: 0.085,
      isCorrect,
      btn,
      svgNode
    });
  }

  function resolveTargetImpact(p) {
    const { charType } = state.currentTask;
    document.getElementById('elf-loaded-arrow').style.display = 'block';

    if (p.isCorrect) {
      // Transform the target into a glowing golden victory star emblem
      p.svgNode.innerHTML = '';
      p.svgNode.appendChild(el('circle', {
        cx: 75, cy: 75, r: 58,
        fill: '#065f46', stroke: '#FFE066', 'stroke-width': 7
      }));
      p.svgNode.appendChild(el('polygon', {
        points: '75,24 90,56 125,60 99,84 106,118 75,101 44,118 51,84 25,60 60,56',
        fill: '#FFE066', stroke: '#140a04', 'stroke-width': 3
      }));
      triggerCorrectCelebration(p.endX, p.endY, charType);
    } else {
      p.btn.style.opacity = '0.45';
      triggerWrongReaction(p.endX, p.endY, charType);
    }
  }

  // Goblin Architect Builder Submit
  document.getElementById('architect-submit-btn').addEventListener('click', (e) => {
    if (state.locked || !state.currentTask) return;
    const { concept, correctValue, charType } = state.currentTask;
    const builtVal = concept === 'S'
      ? (state.builderW * state.builderH)
      : 2 * (state.builderW + state.builderH);

    const rect = e.currentTarget.getBoundingClientRect();
    const pt = screenToOverlayCoords(rect.left + rect.width / 2, rect.top + rect.height / 2);

    if (builtVal === correctValue) {
      state.locked = true;
      triggerCorrectCelebration(pt.x, pt.y, charType);
    } else {
      triggerWrongReaction(pt.x, pt.y, charType);
    }
  });

  function triggerCorrectCelebration(fxX, fxY, charType) {
    sfx.playVictory(charType);
    spawnSparkleBurst(fxX, fxY, '#FFE066', 26);
    spawnSparkleBurst(960, 540, '#22d3ee', 32);

    const rigId = charType === 'elf' ? 'elf-rig' : (charType === 'orc' ? 'orc-rig' : 'goblin-rig');
    const rig = document.getElementById(rigId);
    rig.classList.remove('anim-breathe');
    rig.classList.add('anim-joy');

    sproutFantasyStructure(charType);
    addSkylineTower(charType);

    setTimeout(() => {
      rig.classList.remove('anim-joy');
      rig.classList.add('anim-breathe');
      generateTask();
    }, 2000);
  }

  function triggerWrongReaction(fxX, fxY, charType) {
    sfx.playWrong(charType);
    spawnSparkleBurst(fxX, fxY, '#d946ef', 16);

    const rigId = charType === 'elf' ? 'elf-rig' : (charType === 'orc' ? 'orc-rig' : 'goblin-rig');
    const rig = document.getElementById(rigId);
    rig.classList.remove('anim-breathe');
    rig.classList.add('anim-sad');

    if (charType === 'orc') {
      document.getElementById('orc-soot-mask').setAttribute('opacity', '0.72');
      document.getElementById('orc-steam-fx').style.display = 'block';
    } else if (charType === 'goblin') {
      document.getElementById('goblin-foam-fx').style.display = 'block';
    }

    setTimeout(() => {
      rig.classList.remove('anim-sad');
      rig.classList.add('anim-breathe');
      document.getElementById('orc-soot-mask').setAttribute('opacity', '0');
      document.getElementById('orc-steam-fx').style.display = 'none';
      document.getElementById('goblin-foam-fx').style.display = 'none';

  }

  /* ============================================================================
   * 7. VISUAL SCAFFOLDING HINT & UI CONTROLS
   * ============================================================================ */
  function triggerVisualScaffolding() {
    if (!state.currentTask) return;
    const { concept, w, h, cutW, cutH, shapeType } = state.currentTask;

    if (concept === 'S') {
      state.gridVisible = !state.gridVisible;
      renderBlueprint();
      const tiles = document.querySelectorAll('#blueprint-shape-layer rect');
      tiles.forEach((t, i) => {
        setTimeout(() => {
          sfx.playTileTick(i);
          t.setAttribute('fill', '#10b981');
          t.setAttribute('stroke', '#fde047');
        }, i * 30);
      });
    } else {
      const fxLayer = document.getElementById('blueprint-perimeter-fx');
      fxLayer.innerHTML = '';
      const cellSize = 46;
      const shapeX = 370 - (w * cellSize) / 2;
      const shapeY = 295 - (h * cellSize) / 2;

      const segments = shapeType === 'rect'
        ? [
            [shapeX, shapeY, shapeX + w * cellSize, shapeY],
            [shapeX + w * cellSize, shapeY, shapeX + w * cellSize, shapeY + h * cellSize],
            [shapeX + w * cellSize, shapeY + h * cellSize, shapeX, shapeY + h * cellSize],
            [shapeX, shapeY + h * cellSize, shapeX, shapeY]
          ]
        : [
            [shapeX, shapeY, shapeX + (w - cutW) * cellSize, shapeY],
            [shapeX + (w - cutW) * cellSize, shapeY, shapeX + (w - cutW) * cellSize, shapeY + cutH * cellSize],
            [shapeX + (w - cutW) * cellSize, shapeY + cutH * cellSize, shapeX + w * cellSize, shapeY + cutH * cellSize],
            [shapeX + w * cellSize, shapeY + cutH * cellSize, shapeX + w * cellSize, shapeY + h * cellSize],
            [shapeX + w * cellSize, shapeY + h * cellSize, shapeX, shapeY + h * cellSize],
            [shapeX, shapeY + h * cellSize, shapeX, shapeY]
          ];

      segments.forEach((seg, idx) => {
        setTimeout(() => {
          sfx.playTileTick(idx * 2);
          fxLayer.appendChild(el('line', {
            x1: seg[0], y1: seg[1], x2: seg[2], y2: seg[3],
            stroke: '#FFE066',
            'stroke-width': 11,
            'stroke-linecap': 'round'
          }));
        }, idx * 220);
      });
    }
  }

  document.getElementById('scaffolding-hint-btn').addEventListener('click', triggerVisualScaffolding);
  document.getElementById('question-plaque').addEventListener('click', triggerVisualScaffolding);

  document.getElementById('character-station-btn').addEventListener('click', () => {
    if (!state.currentTask) return;
    const { charType } = state.currentTask;
    if (charType === 'elf') sfx.playElfHarp();
    else if (charType === 'orc') sfx.playOrcGrunt();
    else sfx.playGoblinGiggle();
    spawnSparkleBurst(260, 680, '#FFE066', 14);
  });

  function updateModeButtonsUI() {
    const map = {
      all: 'mode-bg-all',
      arcade: 'mode-bg-arcade',
      builder: 'mode-bg-builder'
    };
    for (const [key, id] of Object.entries(map)) {
      const rect = document.getElementById(id);
      if (state.modeFilter === key) {
        rect.setAttribute('fill', 'url(#stoneSlab)');
        rect.setAttribute('stroke', '#FFE066');
        rect.setAttribute('stroke-width', '4');
      } else {
        rect.setAttribute('fill', 'url(#stoneDark)');
        rect.setAttribute('stroke', '#64748b');
        rect.setAttribute('stroke-width', '3');
      }
    }
  }

  document.getElementById('mode-btn-all').addEventListener('click', () => {
    state.modeFilter = 'all';
    updateModeButtonsUI();
    sfx.playNextSkip();
    generateTask();
  });
  document.getElementById('mode-btn-arcade').addEventListener('click', () => {
    state.modeFilter = 'arcade';
    updateModeButtonsUI();
    sfx.playNextSkip();
    generateTask();
  });
  document.getElementById('mode-btn-builder').addEventListener('click', () => {
    state.modeFilter = 'builder';
    updateModeButtonsUI();
    sfx.playNextSkip();
    generateTask();
  });

  document.getElementById('topic-toggle-btn').addEventListener('click', () => {
    const order = ['both', 'S', 'P'];
    state.topicFilter = order[(order.indexOf(state.topicFilter) + 1) % order.length];
    document.getElementById('topic-toggle-label').textContent =
      state.topicFilter === 'both' ? 'S / P' : `${state.topicFilter} = ?`;
    sfx.playNextSkip();
    generateTask();
  });

  document.getElementById('sound-toggle-btn').addEventListener('click', () => {
    const isMuted = sfx.toggleMute();
    document.getElementById('sound-mute-slash').style.display = isMuted ? 'block' : 'none';
    document.getElementById('sound-waves-icon').style.display = isMuted ? 'none' : 'block';
  });

  document.getElementById('next-task-btn').addEventListener('click', () => {
    sfx.playNextSkip();
    generateTask();
  });

  function spawnSparkleBurst(x, y, color, count = 18) {
    const pLayer = document.getElementById('particles-layer');
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
      const speed = 4 + Math.random() * 8;
      const r = 5 + Math.random() * 6;
      const node = el('polygon', {
        points: `0,${-r} ${r * 0.4},${-r * 0.4} ${r},0 ${r * 0.4},${r * 0.4} 0,${r} ${-r * 0.4},${r * 0.4} ${-r},0 ${-r * 0.4},${-r * 0.4}`,
        fill: i % 2 === 0 ? color : '#ffffff',
        transform: `translate(${x}, ${y})`
      });
      pLayer.appendChild(node);
      state.particles.push({
        node, x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        life: 1.0,
        decay: 0.03 + Math.random() * 0.02
      });
    }
  }

  function animateLoop() {
    // 1. Drift Background Clouds
    clouds.forEach(c => {
      c.x += c.speed;
      if (c.x > 1980) c.x = -220;
      c.node.setAttribute('transform', `translate(${c.x}, ${c.y}) scale(${c.scale})`);
    });

    // 2. Update Flying Projectiles
    for (let i = state.projectiles.length - 1; i >= 0; i--) {
      const p = state.projectiles[i];
      p.progress += p.speed;
      if (p.progress >= 1) {
        p.node.remove();
        state.projectiles.splice(i, 1);
        resolveTargetImpact(p);
      } else {
        const curX = p.startX + (p.endX - p.startX) * p.progress;
        const arcLift = Math.sin(p.progress * Math.PI) * -65;
        const curY = p.startY + (p.endY - p.startY) * p.progress + arcLift;
        const angle = Math.atan2(p.endY - p.startY, p.endX - p.startX) * (180 / Math.PI);
        p.node.setAttribute('transform', `translate(${curX}, ${curY}) rotate(${angle})`);
      }
    }

    // 3. Update Sparkle Particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vy += 0.2;
      pt.life -= pt.decay;
      if (pt.life <= 0) {
        pt.node.remove();
        state.particles.splice(i, 1);
      } else {
        pt.node.setAttribute('transform', `translate(${pt.x}, ${pt.y}) scale(${pt.life})`);
        pt.node.setAttribute('opacity', pt.life.toFixed(2));
      }
    }

    requestAnimationFrame(animateLoop);
  }

  window.onload = () => {
    generateTask();
    animateLoop();
  };
})();
</script>
</body>
</html>
