<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Canyon Expedition — Mental Division</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@600;700;800;900&display=swap');

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Rubik', sans-serif;
    background: #0d212c;
  }

  /* Custom Textured UI Panels — NO white rectangles anywhere */
  .wood-panel {
    background: 
      repeating-linear-gradient(
        90deg,
        rgba(42, 22, 10, 0.16) 0px,
        rgba(42, 22, 10, 0.16) 14px,
        rgba(88, 47, 20, 0.08) 14px,
        rgba(88, 47, 20, 0.08) 28px
      ),
      linear-gradient(180deg, #6e3f1d 0%, #4e2a11 55%, #381d0a 100%);
    border: 3px solid #b88644;
    box-shadow: 
      0 8px 20px rgba(0, 0, 0, 0.55),
      inset 0 2px 3px rgba(255, 225, 165, 0.35),
      inset 0 -4px 8px rgba(20, 9, 2, 0.75);
    border-radius: 16px;
    position: relative;
  }

  .stone-panel {
    background: 
      radial-gradient(circle at 20% 25%, rgba(120, 145, 160, 0.22) 0%, transparent 50%),
      radial-gradient(circle at 80% 75%, rgba(35, 50, 62, 0.45) 0%, transparent 55%),
      linear-gradient(165deg, #4b5d6b 0%, #34434e 52%, #243038 100%);
    border: 3px solid #8fa4b5;
    box-shadow: 
      0 10px 24px rgba(0, 0, 0, 0.6),
      inset 0 2px 4px rgba(215, 235, 250, 0.3),
      inset 0 -5px 10px rgba(12, 18, 22, 0.8);
    border-radius: 18px;
    position: relative;
  }

  .brass-btn {
    background: linear-gradient(180deg, #e0ac52 0%, #b87c24 55%, #8a5610 100%);
    border: 2.5px solid #fae09e;
    box-shadow: 
      0 5px 12px rgba(0, 0, 0, 0.5),
      inset 0 2px 2px rgba(255, 250, 215, 0.6),
      inset 0 -3px 5px rgba(74, 41, 4, 0.75);
    color: #291502;
    text-shadow: 0 1px 0 rgba(255, 232, 175, 0.65);
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease, box-shadow 0.15s ease;
  }

  .brass-btn:hover {
    transform: translateY(-2px) scale(1.03);
    filter: brightness(1.08);
  }

  .brass-btn:active {
    transform: translateY(2px) scale(0.97);
  }

  .brass-btn.active-toggle {
    background: linear-gradient(180deg, #38d399 0%, #109e6c 55%, #086b47 100%);
    border-color: #a7f3d0;
    color: #032619;
    text-shadow: 0 1px 0 rgba(185, 255, 225, 0.6);
    box-shadow: 
      0 0 15px rgba(52, 211, 153, 0.55),
      0 5px 12px rgba(0, 0, 0, 0.5),
      inset 0 2px 2px rgba(215, 255, 238, 0.65);
  }

  .amber-slot {
    background: 
      radial-gradient(circle at 50% 30%, #452309 0%, #261204 100%);
    border: 3px solid #d4943a;
    box-shadow: 
      inset 0 4px 10px rgba(0, 0, 0, 0.85),
      0 2px 3px rgba(255, 215, 140, 0.25);
    border-radius: 14px;
    color: #ffdfa0;
    text-shadow: 0 2px 8px rgba(255, 165, 30, 0.65);
  }

  .crate-card {
    background:
      repeating-linear-gradient(
        0deg,
        rgba(35, 16, 4, 0.18) 0px,
        rgba(35, 16, 4, 0.18) 2px,
        transparent 2px,
        transparent 16px
      ),
      linear-gradient(180deg, #875024 0%, #633714 55%, #47250b 100%);
    border: 3.5px solid #d99f4e;
    box-shadow:
      0 12px 24px rgba(0, 0, 0, 0.6),
      inset 0 2px 4px rgba(255, 225, 165, 0.45),
      inset 0 -5px 8px rgba(24, 10, 2, 0.8);
    border-radius: 18px;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease, border-color 0.2s ease;
    position: relative;
  }

  .crate-card:hover {
    transform: translateY(-6px) scale(1.04);
    filter: brightness(1.1);
    border-color: #ffe299;
  }

  .crate-card:active {
    transform: translateY(2px) scale(0.97);
  }

  .addend-plaque {
    background: linear-gradient(180deg, #295668 0%, #1a3a47 60%, #102630 100%);
    border: 2.5px solid #67d4e8;
    box-shadow:
      0 8px 16px rgba(0, 0, 0, 0.55),
      inset 0 2px 3px rgba(175, 245, 255, 0.4);
    border-radius: 14px;
    color: #e0fbff;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
  }

  .addend-plaque:hover {
    transform: translateY(-3px) scale(1.05);
    filter: brightness(1.12);
  }

  .rivet {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff2c2 0%, #b88228 60%, #593a08 100%);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
    position: absolute;
    pointer-events: none;
  }

  @keyframes shakeCrate {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-10px) rotate(-4deg); }
    40% { transform: translateX(10px) rotate(4deg); }
    60% { transform: translateX(-7px) rotate(-2.5deg); }
    80% { transform: translateX(7px) rotate(2.5deg); }
  }

  .shake-error {
    animation: shakeCrate 0.45s ease-in-out;
    border-color: #f87171 !important;
  }

  @keyframes pulseCorrect {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); box-shadow: 0 0 30px #34d399; border-color: #6ee7b7; }
    100% { transform: scale(1); }
  }

  .pulse-success {
    animation: pulseCorrect 0.55s ease-out;
  }

  @keyframes swingDown {
    0% { opacity: 0; transform: translateY(-22px) rotateX(-35deg) scale(0.88); }
    100% { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1); }
  }

  .swing-in {
    animation: swingDown 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
</style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">

  <!-- Full-Screen Living Canyon Canvas -->
  <canvas id="canyonCanvas" class="absolute inset-0 w-full h-full block z-0"></canvas>

  <!-- UI Overlay Layer (Strictly non-intrusive, widescreen adapted, zero white rectangles) -->
  <div class="relative z-10 w-full h-full flex flex-col justify-between pointer-events-none p-2.5 sm:p-4 md:px-6 md:py-4">

    <!-- TOP CONTROL BAR -->
    <div class="w-full flex flex-wrap items-center justify-between gap-2 pointer-events-auto">
      
      <!-- Left Group: Digits Selector (3-digit / 4-digit) & Level Selector (I, II, III) -->
      <div class="flex flex-wrap items-center gap-2">
        <!-- Digit Count Selector -->
        <div class="wood-panel px-2.5 py-1.5 flex items-center gap-1.5">
          <span class="rivet top-1.5 left-1.5"></span>
          <span class="rivet bottom-1.5 left-1.5"></span>
          <button id="btnDigits3" onclick="setDigitMode(3)" class="brass-btn active-toggle px-2.5 py-1 text-xs sm:text-sm font-extrabold tracking-wider">
            100
          </button>
          <button id="btnDigits4" onclick="setDigitMode(4)" class="brass-btn px-2.5 py-1 text-xs sm:text-sm font-extrabold tracking-wider">
            1000
          </button>
          <button id="btnDigitsMix" onclick="setDigitMode(0)" class="brass-btn px-2.5 py-1 text-xs sm:text-sm font-extrabold tracking-wider">
            100+1000
          </button>
        </div>

        <!-- Level Selector (I, II, III) -->
        <div class="wood-panel px-2.5 py-1.5 flex items-center gap-1.5">
          <button id="btnLvl1" onclick="setLevel(1)" class="brass-btn active-toggle w-9 h-8 sm:w-10 sm:h-9 flex items-center justify-center text-sm sm:text-base font-black">
            I
          </button>
          <button id="btnLvl2" onclick="setLevel(2)" class="brass-btn w-9 h-8 sm:w-10 sm:h-9 flex items-center justify-center text-sm sm:text-base font-black">
            II
          </button>
          <button id="btnLvl3" onclick="setLevel(3)" class="brass-btn w-9 h-8 sm:w-10 sm:h-9 flex items-center justify-center text-sm sm:text-base font-black">
            III
          </button>
        </div>

        <!-- Answer Input Mode Toggle (Crates vs Keypad) -->
        <div class="wood-panel px-2 py-1.5 flex items-center gap-1.5">
          <button id="btnModeCrates" onclick="setInputMode('crates')" class="brass-btn active-toggle px-2.5 py-1 h-8 sm:h-9 flex items-center justify-center" title="Mode A">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/>
              <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            </svg>
          </button>
          <button id="btnModeKeypad" onclick="setInputMode('keypad')" class="brass-btn px-2.5 py-1 h-8 sm:h-9 flex items-center justify-center" title="Mode B">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="2" width="16" height="20" rx="2"/>
              <line x1="8" y1="6" x2="16" y2="6"/>
              <circle cx="8" cy="11" r="1" fill="currentColor"/>
              <circle cx="12" cy="11" r="1" fill="currentColor"/>
              <circle cx="16" cy="11" r="1" fill="currentColor"/>
              <circle cx="8" cy="15" r="1" fill="currentColor"/>
              <circle cx="12" cy="15" r="1" fill="currentColor"/>
              <circle cx="16" cy="15" r="1" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Right Group: Audio, Character Switch, Language (укр/рус), Minimalist "Далі" Button -->
      <div class="flex items-center gap-2">
        <!-- Sound Toggle -->
        <button id="btnSound" onclick="toggleSound()" class="brass-btn w-10 h-10 flex items-center justify-center">
          <svg id="svgSoundOn" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <svg id="svgSoundOff" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>

        <!-- Single Language Button (укр / рус) -->
        <button id="btnLang" onclick="toggleLanguage()" class="brass-btn px-3 h-10 flex items-center justify-center text-sm sm:text-base font-extrabold tracking-wide uppercase">
          укр
        </button>

        <!-- Minimalist Skip / Next Button ("Далі") -->
        <button id="btnNext" onclick="skipProblem()" class="brass-btn px-3.5 h-10 flex items-center gap-1.5 text-sm sm:text-base font-extrabold">
          <span id="txtNext">Далі</span>
          <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- CENTER-TOP PROBLEM BOARD & MENTAL DECOMPOSITION HELPER -->
    <div class="w-full flex flex-col items-center justify-start mt-1 sm:mt-2 pointer-events-none">
      
      <!-- Suspended Carved Stone & Timber Problem Board -->
      <div id="problemBoard" class="stone-panel px-5 py-3 sm:px-8 sm:py-4 flex items-center gap-3 sm:gap-5 pointer-events-auto">
        <span class="rivet top-2 left-2"></span>
        <span class="rivet top-2 right-2"></span>
        <span class="rivet bottom-2 left-2"></span>
        <span class="rivet bottom-2 right-2"></span>

        <!-- Decomposition Helper Button (Crystal Pickaxe Icon) -->
        <button id="btnDecompose" onclick="toggleDecomposition()" class="brass-btn w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center flex-shrink-0" title="Split dividend">
          <svg class="w-6 h-6 sm:w-7 sm:h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 3.5C18 5 20.5 8.5 21 12c-3.5-.5-7-3-8.5-6.5"/>
            <path d="M9.5 14.5 19 5"/>
            <path d="M4 20l5.5-5.5"/>
            <polygon points="5 8 8 5 11 8 8 11 5 8" fill="currentColor" opacity="0.35"/>
          </svg>
        </button>

        <!-- Math Expression Display -->
        <div class="flex items-center gap-2 sm:gap-4 text-3xl sm:text-5xl md:text-6xl font-black tracking-wider text-amber-100 drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)]">
          <span id="txtDividend" class="amber-slot px-3.5 py-1 sm:px-5 sm:py-1.5">497</span>
          <span class="text-amber-400">:</span>
          <span id="txtDivisor" class="amber-slot px-3 py-1 sm:px-4 sm:py-1.5 text-emerald-300">7</span>
          <span class="text-amber-400">=</span>
          <span id="txtAnswerSlot" class="amber-slot min-w-[74px] sm:min-w-[118px] text-center px-3 py-1 sm:px-4 sm:py-1.5 text-amber-300">?</span>
        </div>
      </div>

      <!-- Swinging Addend Decomposition Plaques (Mental Math Helper without long division) -->
      <div id="decompositionContainer" class="hidden mt-2.5 flex flex-wrap items-center justify-center gap-2 sm:gap-3 pointer-events-auto">
        <!-- Dynamically populated with convenient addend plaques like [ 350 ] + [ 14 ] -->
      </div>
    </div>

    <!-- Spacer so the central canyon action & characters have full breathing room -->
    <div class="flex-1 pointer-events-none"></div>

    <!-- BOTTOM INTERACTIVE ANSWER ZONE -->
    <div class="w-full flex flex-col items-center justify-end pb-1 sm:pb-2 pointer-events-none">
      
      <!-- MODE A: 4 Suspended Expedition Cargo Crates -->
      <div id="cratesContainer" class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-5 w-full max-w-3xl px-2 pointer-events-auto">
        <!-- 4 Crates rendered by JS -->
      </div>

      <!-- MODE B: Carved Stone & Brass Numpad -->
      <div id="keypadContainer" class="hidden wood-panel p-2.5 sm:p-3.5 flex flex-wrap items-center justify-center gap-1.5 sm:gap-2.5 max-w-3xl pointer-events-auto">
        <span class="rivet top-2 left-2"></span>
        <span class="rivet top-2 right-2"></span>
        <span class="rivet bottom-2 left-2"></span>
        <span class="rivet bottom-2 right-2"></span>
        <!-- Digits 0-9, Backspace, and Submit Checkmark -->
        <div id="numpadButtons" class="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2"></div>
      </div>

    </div>

  </div>

<script>
/* ============================================================================
   WEB AUDIO SYNTHESIZER (Rich, Wordless Procedural Sound Effects)
   ============================================================================ */
class CanyonAudio {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playClick() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.exponentialRampToValueAtTime(240, now + 0.065);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.07);
  }

  playWoodPlaque() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [330, 440, 660].forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + idx * 0.045);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.15, now + idx * 0.045 + 0.11);
      gain.gain.setValueAtTime(0.14, now + idx * 0.045);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.045 + 0.12);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + idx * 0.045);
      osc.stop(now + idx * 0.045 + 0.13);
    });
  }

  playSuccessFanfare(variant = 0) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;

    // Musical chord progression variations so each stunt sounds unique
    const melodies = [
      [523.25, 659.25, 783.99, 1046.50, 1318.51], // C major bright arpeggio
      [440.00, 554.37, 659.25, 880.00, 1108.73],  // A major heroic horn
      [587.33, 739.99, 880.00, 1174.66, 1479.98], // D major triumphant
      [493.88, 622.25, 739.99, 987.77, 1244.51],  // B major adventure
      [392.00, 493.88, 587.33, 783.99, 1174.66]   // G major alpine chime
    ];
    const notes = melodies[variant % melodies.length];

    notes.forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const sub = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = 'triangle';
      sub.type = 'sine';
      const t = now + i * 0.085;
      osc.frequency.setValueAtTime(freq, t);
      sub.frequency.setValueAtTime(freq * 0.5, t);

      gain.gain.setValueAtTime(0.001, t);
      gain.gain.linearRampToValueAtTime(0.22, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);

      osc.connect(gain);
      sub.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(t);
      sub.start(t);
      osc.stop(t + 0.46);
      sub.stop(t + 0.46);
    });

    // Zipline / Whoosh / Splash accompaniment
    this.playWhoosh(0.65);
  }

  playWhoosh(duration = 0.5) {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const bufferSize = this.ctx.sampleRate * duration;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(300, now);
    filter.frequency.exponentialRampToValueAtTime(1400, now + duration * 0.5);
    filter.frequency.exponentialRampToValueAtTime(420, now + duration);
    filter.Q.value = 3.5;

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.01, now);
    gain.gain.linearRampToValueAtTime(0.18, now + duration * 0.35);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);

    noise.start(now);
    noise.stop(now + duration);
  }

  playErrorBoing() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;

    // Elastic bungee boing + pebble tumble
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(190, now);
    osc.frequency.exponentialRampToValueAtTime(115, now + 0.14);
    osc.frequency.exponentialRampToValueAtTime(210, now + 0.28);
    osc.frequency.exponentialRampToValueAtTime(95, now + 0.48);

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(650, now);

    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);

    osc.start(now);
    osc.stop(now + 0.52);
  }

  playSplash() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const duration = 0.45;
    const bufferSize = this.ctx.sampleRate * duration;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.15));
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(900, now);
    filter.frequency.exponentialRampToValueAtTime(320, now + duration);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.26, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(now);
  }

  playFireCrackle() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    for (let i = 0; i < 5; i++) {
      const t = now + i * 0.055;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(800 + Math.random() * 900, t);
      gain.gain.setValueAtTime(0.09, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.035);
    }
  }
}

/* ============================================================================
   PEDAGOGICAL MATH ENGINE: 3-DIGIT & 4-DIGIT MENTAL DIVISION (NO REMAINDER)
   ============================================================================ */
let digitMode = 3;          // 3 = 3-digit, 4 = 4-digit, 0 = mixed 3 & 4-digit
let currentLevel = 1;       // 1 = Easy direct split, 2 = Convenient addends with carry, 3 = Zero in quotient
let inputMode = 'crates';   // 'crates' or 'keypad'

/**
 * Computes the most natural mental-math convenient addend breakdown for `dividend : divisor`
 * without long division columns.
 * Examples:
 * - 497 : 7  -> [490, 7]
 * - 364 : 7  -> [350, 14]
 * - 141 : 3  -> [120, 21]
 * - 618 : 6  -> [600, 18]
 * - 3654 : 7 -> [3500, 140, 14]
 * - 8024 : 8 -> [8000, 24]
 */
function computeMentalDecomposition(dividend, divisor) {
  const quotient = dividend / divisor;
  const qStr = String(quotient);
  const len = qStr.length;
  const parts = [];

  for (let i = 0; i < len; i++) {
    const digit = parseInt(qStr[i], 10);
    if (digit > 0) {
      const placeValue = Math.pow(10, len - 1 - i);
      const partialQuotient = digit * placeValue;
      const partialDividend = partialQuotient * divisor;
      parts.push({
        addend: partialDividend,
        partialQuotient: partialQuotient
      });
    }
  }
  return parts;
}

/**
 * Generates pools of verified problems for each combination of (digits: 3 | 4) and (level: 1 | 2 | 3).
 */
function generateProblem(targetDigits, level) {
  const digits = targetDigits === 0 ? (Math.random() < 0.5 ? 3 : 4) : targetDigits;
  const candidates = [];

  if (digits === 3) {
    if (level === 1) {
      // LEVEL 1 (3-digit):
      // Type A: First two digits are a direct multiplication table multiple (k*d where k=2..9)
      // and last digit is a direct multiple (m*d where m=1..4 and m*d < 10).
      // Examples: 497:7 = 71, 819:9 = 91, 648:8 = 81, 368:4 = 92, 426:6 = 71, 357:7 = 51
      for (let d = 2; d <= 9; d++) {
        for (let k = 2; k <= 9; k++) {
          const prefix = k * d;
          if (prefix >= 10 && prefix <= 99) {
            for (let m = 1; m <= 9; m++) {
              const lastDigit = m * d;
              if (lastDigit <= 9) {
                const div = prefix * 10 + lastDigit;
                const q = div / d;
                candidates.push({ dividend: div, divisor: d, quotient: q });
              }
            }
          }
        }
        // Type B: Every single digit (hundreds, tens, units) is individually divisible by d (no 0)
        // Examples: 639:3 = 213, 842:2 = 421, 848:4 = 212
        for (let q1 = 1; q1 <= 9; q1++) {
          for (let q2 = 1; q2 <= 9; q2++) {
            for (let q3 = 1; q3 <= 9; q3++) {
              if (q1 * d <= 9 && q2 * d <= 9 && q3 * d <= 9) {
                const q = q1 * 100 + q2 * 10 + q3;
                const div = q * d;
                candidates.push({ dividend: div, divisor: d, quotient: q });
              }
            }
          }
        }
      }
    } else if (level === 2) {
      // LEVEL 2 (3-digit):
      // Requires splitting into convenient addends with regrouping/carry, NO zero in quotient!
      // Examples: 364:7 = (350+14):7 = 52, 141:3 = (120+21):3 = 47, 532:7 = 76, 432:3 = 144
      for (let d = 3; d <= 9; d++) {
        // Two-digit quotients (e.g. 364:7=52, 141:3=47) where units part of dividend >= 10
        for (let q1 = 2; q1 <= 9; q1++) {
          for (let q2 = 2; q2 <= 9; q2++) {
            if (q2 * d >= 10) {
              const q = q1 * 10 + q2;
              const div = q * d;
              if (div >= 100 && div <= 999) {
                candidates.push({ dividend: div, divisor: d, quotient: q });
              }
            }
          }
        }
        // Three-digit quotients (no zeros) with carry between hundreds/tens/units (e.g. 432:3=144)
        for (let q1 = 1; q1 <= 4; q1++) {
          for (let q2 = 2; q2 <= 9; q2++) {
            for (let q3 = 2; q3 <= 9; q3++) {
              if (q2 * d >= 10 || q3 * d >= 10) {
                const q = q1 * 100 + q2 * 10 + q3;
                const div = q * d;
                if (div >= 100 && div <= 999) {
                  candidates.push({ dividend: div, divisor: d, quotient: q });
                }
              }
            }
          }
        }
      }
    } else {
      // LEVEL 3 (3-digit):
      // Quotient MUST contain 0 in at least one place value!
      // Examples: 618:6 = 103, 824:4 = 206, 735:7 = 105, 927:9 = 103, 780:6 = 130, 910:7 = 130
      for (let d = 2; d <= 9; d++) {
        // Type A: Quotient X0Y (middle zero, e.g. 103, 206, 108)
        for (let q1 = 1; q1 <= 4; q1++) {
          for (let q3 = 1; q3 <= 9; q3++) {
            const q = q1 * 100 + q3;
            const div = q * d;
            if (div >= 100 && div <= 999) {
              // Weight X0Y where q3*d >= 10 higher for rich mental split (e.g. 618:6 = 600+18)
              candidates.push({ dividend: div, divisor: d, quotient: q });
              if (q3 * d >= 10) {
                candidates.push({ dividend: div, divisor: d, quotient: q });
                candidates.push({ dividend: div, divisor: d, quotient: q });
              }
            }
          }
        }
        // Type B: Quotient XY0 (trailing zero with regrouping, e.g. 780:6 = 130, 910:7 = 130)
        for (let q1 = 1; q1 <= 3; q1++) {
          for (let q2 = 2; q2 <= 9; q2++) {
            if (q2 * d >= 10) {
              const q = q1 * 100 + q2 * 10;
              const div = q * d;
              if (div >= 100 && div <= 999) {
                candidates.push({ dividend: div, divisor: d, quotient: q });
              }
            }
          }
        }
      }
    }
  } else {
    // 4-DIGIT DIVIDENDS (1000..9999)
    if (level === 1) {
      // LEVEL 1 (4-digit):
      // Type A: First two digits = k*d (k=2..9) and last two digits are each direct multiples (no carry, no 0)
      // Examples: 4977:7 = 711, 8199:9 = 911, 3684:4 = 921, 5688:8 = 711, 2469:3 = 823
      for (let d = 2; d <= 9; d++) {
        for (let k = 2; k <= 9; k++) {
          const prefix = k * d;
          if (prefix >= 10 && prefix <= 99) {
            for (let m1 = 1; m1 <= 4; m1++) {
              for (let m2 = 1; m2 <= 4; m2++) {
                if (m1 * d <= 9 && m2 * d <= 9) {
                  const q = k * 100 + m1 * 10 + m2;
                  const div = q * d;
                  if (div >= 1000 && div <= 9999) {
                    candidates.push({ dividend: div, divisor: d, quotient: q });
                  }
                }
              }
            }
          }
        }
        // Type B: All 4 digits individually divisible by d (e.g., 4826:2 = 2413, 9363:3 = 3121)
        for (let q1 = 1; q1 <= 4; q1++) {
          for (let q2 = 1; q2 <= 4; q2++) {
            for (let q3 = 1; q3 <= 4; q3++) {
              for (let q4 = 1; q4 <= 4; q4++) {
                if (q1 * d <= 9 && q2 * d <= 9 && q3 * d <= 9 && q4 * d <= 9) {
                  const q = q1 * 1000 + q2 * 100 + q3 * 10 + q4;
                  const div = q * d;
                  if (div >= 1000 && div <= 9999) {
                    candidates.push({ dividend: div, divisor: d, quotient: q });
                  }
                }
              }
            }
          }
        }
      }
    } else if (level === 2) {
      // LEVEL 2 (4-digit):
      // Convenient addend split with regrouping, NO zero in quotient!
      // Examples: 3654:7 = (3500+140+14):7 = 522, 1416:3 = (1200+210+6):3 = 472, 4368:8 = 546
      for (let d = 3; d <= 9; d++) {
        for (let q1 = 2; q1 <= 9; q1++) {
          for (let q2 = 2; q2 <= 9; q2++) {
            for (let q3 = 1; q3 <= 9; q3++) {
              if (q2 * d >= 10 || q3 * d >= 10) {
                const q = q1 * 100 + q2 * 10 + q3;
                const div = q * d;
                if (div >= 1000 && div <= 9999) {
                  candidates.push({ dividend: div, divisor: d, quotient: q });
                }
              }
            }
          }
        }
      }
    } else {
      // LEVEL 3 (4-digit):
      // Quotient MUST contain 0 in at least one place value!
      // Examples: 2142:7 = 306, 3624:6 = 604, 8024:8 = 1003, 6240:6 = 1040, 8324:4 = 2081
      for (let d = 2; d <= 9; d++) {
        // Type A: 3-digit quotient X0Y where dividend >= 1000 (e.g. 2142:7 = 306, 4536:9 = 504)
        for (let q1 = 2; q1 <= 9; q1++) {
          for (let q3 = 2; q3 <= 9; q3++) {
            const q = q1 * 100 + q3;
            const div = q * d;
            if (div >= 1000 && div <= 9999) {
              candidates.push({ dividend: div, divisor: d, quotient: q });
              candidates.push({ dividend: div, divisor: d, quotient: q });
            }
          }
        }
        // Type B: 4-digit quotient X0YZ, XY0Z, or X00Z (e.g. 8024:8 = 1003, 8324:4 = 2081, 6240:6 = 1040)
        for (let q1 = 1; q1 <= 3; q1++) {
          // X00Z
          for (let q4 = 2; q4 <= 9; q4++) {
            const q = q1 * 1000 + q4;
            const div = q * d;
            if (div >= 1000 && div <= 9999) {
              candidates.push({ dividend: div, divisor: d, quotient: q });
            }
          }
          // X0YZ and XY0Z and XYZ0
          for (let a = 2; a <= 9; a++) {
            for (let b = 1; b <= 9; b++) {
              const qVariants = [
                q1 * 1000 + a * 10 + b,     // X0AB
                q1 * 1000 + a * 100 + b,    // XA0B
                q1 * 1000 + a * 100 + b * 10 // XAB0
              ];
              for (const q of qVariants) {
                const div = q * d;
                if (div >= 1000 && div <= 9999) {
                  candidates.push({ dividend: div, divisor: d, quotient: q });
                }
              }
            }
          }
        }
      }
    }
  }

  // Filter out recently used problems
  const fresh = candidates.filter(c => !recentDividends.includes(c.dividend));
  const pool = fresh.length > 0 ? fresh : candidates;
  const chosen = pool[Math.floor(Math.random() * pool.length)];

  recentDividends.push(chosen.dividend);
  if (recentDividends.length > 15) recentDividends.shift();

  chosen.decomposition = computeMentalDecomposition(chosen.dividend, chosen.divisor);
  chosen.options = generateSmartDistractors(chosen.quotient);
  return chosen;
}

/**
 * Creates 4 multiple-choice options including the exact quotient and 3 pedagogical distractors
 * (such as zero-omission traps, place-value shifts, or off-by-one digit errors).
 */
function generateSmartDistractors(correct) {
  const set = new Set([correct]);
  const qStr = String(correct);

  // If correct contains '0', include zero-omission or zero-shift traps!
  if (qStr.includes('0')) {
    const noZero = parseInt(qStr.replace('0', ''), 10);
    if (noZero > 0 && noZero !== correct) set.add(noZero);

    // Swap 0 with adjacent digit (e.g. 103 -> 130, 306 -> 360)
    if (qStr.length >= 3) {
      const chars = qStr.split('');
      const zeroIdx = chars.indexOf('0');
      if (zeroIdx !== -1 && zeroIdx + 1 < chars.length) {
        const swapped = [...chars];
        [swapped[zeroIdx], swapped[zeroIdx + 1]] = [swapped[zeroIdx + 1], swapped[zeroIdx]];
        const val = parseInt(swapped.join(''), 10);
        if (val !== correct) set.add(val);
      }
    }
  } else {
    // Include a zero-insertion trap (e.g. 71 -> 701 or 52 -> 502)
    if (qStr.length === 2) {
      const withZero = parseInt(qStr[0] + '0' + qStr[1], 10);
      set.add(withZero);
    }
  }

  // Add close arithmetic neighbors (same or similar last digit / tens offset)
  const offsets = [1, -1, 10, -10, 2, -2, 9, -9, 11, -11, 100, -100];
  for (const off of offsets) {
    if (set.size >= 4) break;
    const cand = correct + off;
    if (cand > 10 && !set.has(cand)) {
      set.add(cand);
    }
  }

  while (set.size < 4) {
    const r = correct + (Math.floor(Math.random() * 19) - 9);
    if (r > 5 && !set.has(r)) set.add(r);
  }

  // Shuffle the 4 options
  const arr = Array.from(set).slice(0, 4);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

    container.classList.add('hidden');

  container.classList.remove('hidden');
  container.innerHTML = '';

  currentProblem.decomposition.forEach((part, idx) => {
    if (idx > 0) {
      const plus = document.createElement('span');
      plus.className = 'text-2xl sm:text-3xl font-black text-amber-300 drop-shadow-[0_2px_3px_rgba(0,0,0,0.9)]';
      plus.textContent = '+';
      container.appendChild(plus);

    const plaque = document.createElement('button');
    plaque.className = 'addend-plaque swing-in px-3.5 py-1.5 sm:px-5 sm:py-2 flex flex-col items-center justify-center relative';
    plaque.style.animationDelay = `${idx * 0.06}s`;

    const topRow = document.createElement('span');
    topRow.className = 'text-xl sm:text-3xl font-extrabold tracking-wider text-cyan-100';
    topRow.textContent = part.addend;
    plaque.appendChild(topRow);

    if (revealedAddendIndices.has(idx)) {
      const subRow = document.createElement('span');
      subRow.className = 'text-xs sm:text-base font-black text-amber-300 mt-0.5 border-t border-cyan-400/40 pt-0.5 w-full text-center';
      subRow.textContent = `↓ ${part.partialQuotient}`;
      plaque.appendChild(subRow);
    }

    plaque.onclick = () => {
      audio.playClick();
      if (revealedAddendIndices.has(idx)) {
        revealedAddendIndices.delete(idx);
      } else {
        revealedAddendIndices.add(idx);
      }
      renderDecomposition();
    };

    container.appendChild(plaque);
  });

function handleDigitInput(d) {
  if (isAnimatingFeedback) return;
  audio.playClick();
  if (typedAnswer.length < 4) {
    if (typedAnswer === '0') typedAnswer = d;
    else typedAnswer += d;
    document.getElementById('txtAnswerSlot').textContent = typedAnswer;
  }
}

function handleBackspace() {
  if (isAnimatingFeedback) return;
  audio.playClick();
  typedAnswer = typedAnswer.slice(0, -1);
  document.getElementById('txtAnswerSlot').textContent = typedAnswer.length > 0 ? typedAnswer : '?';
}

function submitTypedAnswer() {
  if (isAnimatingFeedback || !typedAnswer) return;
  const val = parseInt(typedAnswer, 10);
  evaluateAnswer(val, document.getElementById('problemBoard'));
}

// Physical keyboard support for fast playing
window.addEventListener('keydown', (e) => {
  if (isAnimatingFeedback) return;
  if (e.key >= '0' && e.key <= '9') {
    if (inputMode === 'crates') {
      // Allow typing in either mode by automatically updating the answer slot
      setInputMode('keypad');
    }
    handleDigitInput(e.key);
  } else if (e.key === 'Backspace') {
    if (inputMode === 'keypad') handleBackspace();
  } else if (e.key === 'Enter') {
    if (inputMode === 'keypad' && typedAnswer.length > 0) {
      submitTypedAnswer();
    }
  }
});

function evaluateAnswer(val, targetElement) {
  if (isAnimatingFeedback) return;

  const slot = document.getElementById('txtAnswerSlot');
  slot.textContent = val;

  if (val === currentProblem.quotient) {
    // CORRECT! Trigger rich wordless celebration stunt + fanfare
    isAnimatingFeedback = true;
    slot.classList.remove('text-amber-300', 'text-red-400');
    slot.classList.add('text-emerald-300');
    if (targetElement) targetElement.classList.add('pulse-success');

    const stuntIndex = stuntCounter % 5;
    stuntCounter++;
    audio.playSuccessFanfare(stuntIndex);
    triggerVictoryStunt(stuntIndex);

    setTimeout(() => {
      loadNextProblem();
    }, 2350);
  } else {
    // WRONG! Wordless elastic bungee boing + pebble splash + wobble
    audio.playErrorBoing();
    slot.classList.remove('text-amber-300');
    slot.classList.add('text-red-400');
    if (targetElement) {
      targetElement.classList.remove('shake-error');
      void targetElement.offsetWidth;
      targetElement.classList.add('shake-error');
    }
    triggerErrorSlip();

    setTimeout(() => {
      if (!isAnimatingFeedback) {
        typedAnswer = '';
        slot.textContent = '?';
        slot.classList.remove('text-red-400');
        slot.classList.add('text-amber-300');
      }
    }, 650);
  }
}

  progress: 0,
  x: 0,
  y: 0,
  blinkTimer: 0
};

function initSceneObjects() {
  clouds.length = 0;
  for (let i = 0; i < 6; i++) {
    clouds.push({
      x: Math.random() * window.innerWidth,
      y: 45 + Math.random() * 110,
      scale: 0.65 + Math.random() * 0.7,
      speed: 0.18 + Math.random() * 0.22
    });
  }

  waterfallDrops.length = 0;
  for (let i = 0; i < 75; i++) {
    waterfallDrops.push({
      offsetX: (Math.random() - 0.5) * 68,
      yRatio: Math.random(),
      speed: 0.008 + Math.random() * 0.007,
      len: 18 + Math.random() * 28,
      alpha: 0.25 + Math.random() * 0.45
    });
  }

  mistParticles.length = 0;
  for (let i = 0; i < 28; i++) {
    mistParticles.push({
      angle: Math.random() * Math.PI * 2,
      radius: 15 + Math.random() * 45,
      xOff: (Math.random() - 0.5) * 95,
      yOff: (Math.random() - 0.5) * 28,
      speed: 0.015 + Math.random() * 0.02
    });
  }

  pines.length = 0;
  const pinePositions = [0.04, 0.09, 0.15, 0.83, 0.89, 0.95];
  pinePositions.forEach((px, idx) => {
    pines.push({
      xRatio: px,
      height: 75 + (idx % 3) * 22,
      swayOffset: idx * 1.1,
      shakeTimer: 0
    });
  });
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);

// Interactive clicks on the living background & character
canvas.addEventListener('mousemove', (e) => {
  mousePos.x = e.clientX;
  mousePos.y = e.clientY;
});

canvas.addEventListener('pointerdown', (e) => {
  const rx = e.clientX;
  const ry = e.clientY;
  const w = canvas.width;
  const h = canvas.height;

  // 1. Check click on Human Explorer Character -> Switch character & friendly wave!
  const distToClimber = Math.hypot(rx - climberState.x, ry - climberState.y);
  if (distToClimber < 75 && climberState.action === 'idle') {
    audio.playClick();
    climberState.characterType = 1 - climberState.characterType;
    spawnEmbers(climberState.x, climberState.y - 30, 12, '#fde047');
    return;
  }

  // 2. Check click on Sun / Moon (top right sky area) -> Toggle Day / Golden Sunset
  const sunX = w * 0.76;
  const sunY = h * 0.18;
  if (Math.hypot(rx - sunX, ry - sunY) < 60) {
    audio.playWoodPlaque();
    sunsetMode = !sunsetMode;
    return;
  }

  // 3. Check click on Waterfall (center canyon) -> Splash sound + Double Rainbow!
  const wfX = w * 0.5;
  if (Math.abs(rx - wfX) < 70 && ry > h * 0.3 && ry < h * 0.85) {
    audio.playSplash();
    rainbowTimer = 320;
    spawnPebbles(wfX, h * 0.76, 14, '#e0f2fe');
    return;
  }

  // 4. Check click on Campfire (left cliff ledge) -> Burst glowing embers + crackle sound!
  const fireX = w * 0.12;
  const fireY = h * 0.55;
  if (Math.hypot(rx - fireX, ry - fireY) < 60) {
    audio.playFireCrackle();
    spawnEmbers(fireX, fireY - 10, 26, '#fb923c');
    return;
  }

  // 5. Check click on Pine Trees -> Shake tree & drop pinecones!
  pines.forEach(p => {
    const px = p.xRatio * w;
    const py = h * 0.53;
    if (Math.abs(rx - px) < 42 && Math.abs(ry - (py - p.height * 0.5)) < p.height * 0.65) {
      audio.playClick();
      p.shakeTimer = 35;
      for (let k = 0; k < 4; k++) {
        pinecones.push({
          x: px + (Math.random() - 0.5) * 35,
          y: py - p.height * (0.3 + Math.random() * 0.5),
          vx: (Math.random() - 0.5) * 2.5,
          vy: -1 - Math.random() * 2,
          rot: Math.random() * Math.PI
        });
      }
    }
  });
});

function spawnEmbers(x, y, count = 18, color = '#fb923c') {
  for (let i = 0; i < count; i++) {
    embers.push({
      x: x + (Math.random() - 0.5) * 20,
      y: y + (Math.random() - 0.5) * 15,
      vx: (Math.random() - 0.5) * 3.5,
      vy: -1.8 - Math.random() * 3.5,
      size: 2.5 + Math.random() * 4,
      alpha: 1,
      color
    });
  }
}

function spawnPebbles(x, y, count = 10, color = '#94a3b8') {
  for (let i = 0; i < count; i++) {
    pebbles.push({
      x: x + (Math.random() - 0.5) * 30,
      y: y,
      vx: (Math.random() - 0.5) * 5,
      vy: -2 - Math.random() * 4,
      size: 3 + Math.random() * 4.5,
      color
    });
  }
}

function spawnFirework(x, y) {
  const colors = ['#34d399', '#fbbf24', '#38bdf8', '#f472b6', '#a78bfa'];
  const col = colors[Math.floor(Math.random() * colors.length)];
  for (let i = 0; i < 36; i++) {
    const angle = (Math.PI * 2 * i) / 36 + (Math.random() - 0.5) * 0.1;
    const speed = 2.5 + Math.random() * 5.5;
    fireworks.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      alpha: 1,
      color: col,
      size: 3 + Math.random() * 3
    });
  }
}

function triggerVictoryStunt(stuntIndex) {
  const stunts = ['zipline', 'pendulum', 'glider', 'dive_kayak', 'climb_flare'];
  climberState.action = stunts[stuntIndex % stunts.length];
  climberState.progress = 0;
  rainbowTimer = Math.max(rainbowTimer, 180);
  spawnFirework(canvas.width * 0.35, canvas.height * 0.28);
  setTimeout(() => spawnFirework(canvas.width * 0.65, canvas.height * 0.26), 320);
}

function triggerErrorSlip() {
  climberState.action = 'slip';
  climberState.progress = 0;
  spawnPebbles(climberState.x, climberState.y + 45, 12, '#78716c');
}

/* ============================================================================
   PROCEDURAL BACKGROUND RENDERING
   ============================================================================ */
function drawBackground(w, h) {
  // 1. Sky Gradient (Daytime Alpine vs Golden Sunset)
  const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.78);
  if (!sunsetMode) {
    skyGrad.addColorStop(0, '#0f3854');
    skyGrad.addColorStop(0.42, '#236e8e');
    skyGrad.addColorStop(0.82, '#6bc5d2');
    skyGrad.addColorStop(1, '#b8efe0');
  } else {
    skyGrad.addColorStop(0, '#1e1b4b');
    skyGrad.addColorStop(0.38, '#581c87');
    skyGrad.addColorStop(0.72, '#c2410c');
    skyGrad.addColorStop(1, '#fbbf24');
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, w, h);

  // 2. Interactive Sun / Golden Orb with Sunbeams
  const sunX = w * 0.76;
  const sunY = h * 0.18;
  ctx.save();
  const sunGlow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 95);
  if (!sunsetMode) {
    sunGlow.addColorStop(0, '#fef9c3');
    sunGlow.addColorStop(0.35, 'rgba(253, 224, 71, 0.55)');
    sunGlow.addColorStop(1, 'rgba(253, 224, 71, 0)');
  } else {
    sunGlow.addColorStop(0, '#fde047');
    sunGlow.addColorStop(0.4, 'rgba(249, 115, 22, 0.65)');
    sunGlow.addColorStop(1, 'rgba(249, 115, 22, 0)');
  }
  ctx.fillStyle = sunGlow;
  ctx.beginPath();
  ctx.arc(sunX, sunY, 95, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = sunsetMode ? '#fed7aa' : '#fef08a';
  ctx.beginPath();
  ctx.arc(sunX, sunY, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 3. Drifting Stylized Clouds
  clouds.forEach(c => {
    c.x += c.speed;
    if (c.x > w + 120) c.x = -120;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.scale, c.scale);
    ctx.fillStyle = sunsetMode ? 'rgba(253, 186, 116, 0.35)' : 'rgba(240, 253, 250, 0.45)';
    ctx.beginPath();
    ctx.arc(0, 0, 28, 0, Math.PI * 2);
    ctx.arc(26, -6, 34, 0, Math.PI * 2);
    ctx.arc(58, 2, 26, 0, Math.PI * 2);
    ctx.arc(-24, 6, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // 4. Distant Jagged Carpathian / Alpine Mountain Range
  ctx.fillStyle = sunsetMode ? '#3b1d54' : '#26546e';
  ctx.beginPath();
  ctx.moveTo(0, h * 0.72);
  const farPeaks = [
    [0, 0.46], [0.12, 0.31], [0.23, 0.43], [0.35, 0.24],
    [0.48, 0.39], [0.59, 0.27], [0.71, 0.41], [0.84, 0.26],
    [0.94, 0.37], [1.0, 0.32]
  ];
  farPeaks.forEach(([px, py]) => ctx.lineTo(w * px, h * py));
  ctx.lineTo(w, h * 0.72);
  ctx.closePath();
  ctx.fill();

  // Snow ridges on distant mountains
  ctx.fillStyle = sunsetMode ? 'rgba(253, 186, 116, 0.28)' : 'rgba(224, 242, 254, 0.38)';
  [[0.12, 0.31], [0.35, 0.24], [0.59, 0.27], [0.84, 0.26]].forEach(([px, py]) => {
    ctx.beginPath();
    ctx.moveTo(w * px, h * py);
    ctx.lineTo(w * (px + 0.045), h * (py + 0.075));
    ctx.lineTo(w * (px + 0.01), h * (py + 0.065));
    ctx.lineTo(w * (px - 0.025), h * (py + 0.08));
    ctx.closePath();
    ctx.fill();
  });

  // 5. Mid-ground Canyon Cliffs & Central Waterfall Ledge
  ctx.fillStyle = sunsetMode ? '#2a183b' : '#1b3f52';
  ctx.beginPath();
  ctx.moveTo(0, h * 0.78);
  ctx.lineTo(0, h * 0.42);
  ctx.lineTo(w * 0.36, h * 0.36);
  ctx.lineTo(w * 0.44, h * 0.38);
  ctx.lineTo(w * 0.56, h * 0.38);
  ctx.lineTo(w * 0.64, h * 0.35);
  ctx.lineTo(w, h * 0.41);
  ctx.lineTo(w, h * 0.78);
  ctx.closePath();
  ctx.fill();

  // 6. Roaring Central Waterfall
  const wfX = w * 0.5;
  const wfTop = h * 0.38;
  const wfBottom = h * 0.78;
  const wfWidth = Math.max(58, w * 0.065);

  const wfGrad = ctx.createLinearGradient(wfX, wfTop, wfX, wfBottom);
  wfGrad.addColorStop(0, '#bae6fd');
  wfGrad.addColorStop(0.45, '#38bdf8');
  wfGrad.addColorStop(1, '#0284c7');

  ctx.fillStyle = wfGrad;
  ctx.beginPath();
  ctx.moveTo(wfX - wfWidth * 0.42, wfTop);
  ctx.lineTo(wfX + wfWidth * 0.42, wfTop);
  ctx.lineTo(wfX + wfWidth * 0.62, wfBottom);
  ctx.lineTo(wfX - wfWidth * 0.62, wfBottom);
  ctx.closePath();
  ctx.fill();

  // Falling water streaks
  ctx.strokeStyle = 'rgba(240, 249, 255, 0.65)';
  ctx.lineWidth = 2.2;
  waterfallDrops.forEach(d => {
    d.yRatio += d.speed;
    if (d.yRatio > 1) d.yRatio -= 1;
    const x = wfX + (d.offsetX / 68) * wfWidth * 0.9;
    const y = wfTop + d.yRatio * (wfBottom - wfTop);
    ctx.globalAlpha = d.alpha;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, Math.min(wfBottom, y + d.len));
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // Waterfall Rainbow (when clicked or after victory stunt)
  if (rainbowTimer > 0) {
    rainbowTimer--;
    const rbAlpha = Math.min(0.55, rainbowTimer / 60);
    const rbColors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#38bdf8', '#a855f7'];
    ctx.save();
    ctx.globalAlpha = rbAlpha;
    ctx.lineWidth = 5;
    rbColors.forEach((col, i) => {
      ctx.strokeStyle = col;
      ctx.beginPath();
      ctx.arc(wfX, wfBottom - 20, 110 - i * 6, Math.PI * 1.08, Math.PI * 1.92);
      ctx.stroke();
    });
    ctx.restore();
  }

  // 7. Emerald Canyon River & Animated Ripples
  const riverTop = h * 0.75;
  const riverGrad = ctx.createLinearGradient(0, riverTop, 0, h);
  if (!sunsetMode) {
    riverGrad.addColorStop(0, '#0d9488');
    riverGrad.addColorStop(0.45, '#0f766e');
    riverGrad.addColorStop(1, '#064e3b');
  } else {
    riverGrad.addColorStop(0, '#0f766e');
    riverGrad.addColorStop(0.5, '#115e59');
    riverGrad.addColorStop(1, '#042f2e');
  }
  ctx.fillStyle = riverGrad;
  ctx.fillRect(0, riverTop, w, h - riverTop);

  // Shimmering water wave lines
  ctx.strokeStyle = sunsetMode ? 'rgba(253, 224, 71, 0.25)' : 'rgba(153, 246, 228, 0.32)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 9; i++) {
    const wy = riverTop + 14 + i * ((h - riverTop) / 9);
    const waveOffset = Math.sin(time * 2.2 + i) * 24;
    ctx.beginPath();
    ctx.moveTo(w * 0.15 + waveOffset, wy);
    ctx.lineTo(w * 0.85 + waveOffset, wy);
    ctx.stroke();
  }

  // Waterfall base mist clouds
  mistParticles.forEach(m => {
    m.angle += m.speed;
    const mx = wfX + m.xOff + Math.cos(m.angle) * 12;
    const my = riverTop + m.yOff + Math.sin(m.angle) * 6;
    ctx.fillStyle = 'rgba(224, 242, 254, 0.32)';
    ctx.beginPath();
    ctx.arc(mx, my, m.radius, 0, Math.PI * 2);
    ctx.fill();
  });

  // 8. Foreground Left & Right Rocky Canyon Ledges
  // Left Ledge
  const leftCliffGrad = ctx.createLinearGradient(0, h * 0.48, w * 0.28, h);
  leftCliffGrad.addColorStop(0, '#475569');
  leftCliffGrad.addColorStop(0.5, '#334155');
  leftCliffGrad.addColorStop(1, '#1e293b');
  ctx.fillStyle = leftCliffGrad;
  ctx.beginPath();
  ctx.moveTo(0, h);
  ctx.lineTo(0, h * 0.51);
  ctx.lineTo(w * 0.21, h * 0.53);
  ctx.lineTo(w * 0.26, h * 0.58);
  ctx.lineTo(w * 0.23, h * 0.78);
  ctx.lineTo(w * 0.27, h);
  ctx.closePath();
  ctx.fill();

  // Mossy grass cap on Left Ledge
  ctx.fillStyle = sunsetMode ? '#365314' : '#15803d';
  ctx.beginPath();
  ctx.moveTo(0, h * 0.50);
  ctx.lineTo(w * 0.215, h * 0.525);
  ctx.lineTo(w * 0.255, h * 0.57);
  ctx.lineTo(w * 0.21, h * 0.555);
  ctx.lineTo(0, h * 0.53);
  ctx.closePath();
  ctx.fill();

  // Right Ledge
  const rightCliffGrad = ctx.createLinearGradient(w * 0.72, h * 0.48, w, h);
  rightCliffGrad.addColorStop(0, '#475569');
  rightCliffGrad.addColorStop(0.5, '#334155');
  rightCliffGrad.addColorStop(1, '#1e293b');
  ctx.fillStyle = rightCliffGrad;
  ctx.beginPath();
  ctx.moveTo(w, h);
  ctx.lineTo(w, h * 0.50);
  ctx.lineTo(w * 0.78, h * 0.53);
  ctx.lineTo(w * 0.74, h * 0.59);
  ctx.lineTo(w * 0.77, h * 0.79);
  ctx.lineTo(w * 0.73, h);
  ctx.closePath();
  ctx.fill();

  // Mossy grass cap on Right Ledge
  ctx.fillStyle = sunsetMode ? '#365314' : '#15803d';
  ctx.beginPath();
  ctx.moveTo(w, h * 0.495);
  ctx.lineTo(w * 0.775, h * 0.525);
  ctx.lineTo(w * 0.74, h * 0.58);
  ctx.lineTo(w * 0.79, h * 0.555);
  ctx.lineTo(w, h * 0.525);
  ctx.closePath();
  ctx.fill();

  // 9. Swaying Carpathian Pine Trees on Both Ledges
  pines.forEach(p => {
    const px = p.xRatio * w;
    const py = h * 0.525;
    if (p.shakeTimer > 0) p.shakeTimer--;
    const sway = Math.sin(time * 1.8 + p.swayOffset) * 4 + (p.shakeTimer > 0 ? Math.sin(p.shakeTimer * 1.7) * 7 : 0);

    ctx.save();
    ctx.translate(px, py);
    // Trunk
    ctx.fillStyle = '#451a03';
    ctx.fillRect(-5, -18, 10, 22);

    // 3 Layered pine tiers
    for (let tier = 0; tier < 3; tier++) {
      const ty = -14 - tier * (p.height * 0.28);
      const tw = (36 - tier * 8);
      const th = p.height * 0.42;
      ctx.fillStyle = tier === 0 ? '#064e3b' : (tier === 1 ? '#047857' : '#059669');
      ctx.beginPath();
      ctx.moveTo(sway * (tier + 1) * 0.35, ty - th);
      ctx.lineTo(-tw, ty);
      ctx.lineTo(tw, ty);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  });

  // 10. Interactive Expedition Campfire on Left Ledge
  const fireX = w * 0.12;
  const fireY = h * 0.54;
  ctx.save();
  ctx.translate(fireX, fireY);
  // Logs
  ctx.fillStyle = '#451a03';
  ctx.fillRect(-16, -2, 32, 6);
  // Stones
  ctx.fillStyle = '#64748b';
  [-14, -6, 3, 12].forEach(sx => {
    ctx.beginPath();
    ctx.arc(sx, 4, 5, 0, Math.PI * 2);
    ctx.fill();
  });
  // Animated flickering flames
  const fFlicker = Math.sin(time * 14) * 4;
  const flameGrad = ctx.createRadialGradient(0, -10, 2, 0, -12, 26);
  flameGrad.addColorStop(0, '#fef08a');
  flameGrad.addColorStop(0.5, '#f97316');
  flameGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
  ctx.fillStyle = flameGrad;
  ctx.beginPath();
  ctx.moveTo(-12, 2);
  ctx.quadraticCurveTo(-10, -18, fFlicker, -28 - Math.abs(fFlicker));
  ctx.quadraticCurveTo(10, -18, 12, 2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // 11. Steel Zipline Cable Anchored Across the Canyon
  const zipStartX = w * 0.19;
  const zipStartY = h * 0.42;
  const zipEndX = w * 0.81;
  const zipEndY = h * 0.48;

  // Wooden Anchor Posts
  ctx.fillStyle = '#5c2d0c';
  ctx.fillRect(zipStartX - 5, zipStartY - 8, 10, h * 0.53 - zipStartY + 8);
  ctx.fillRect(zipEndX - 5, zipEndY - 8, 10, h * 0.53 - zipEndY + 8);

  // Cable Line
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(zipStartX, zipStartY);
  ctx.quadraticCurveTo(w * 0.5, (zipStartY + zipEndY) * 0.5 + 18, zipEndX, zipEndY);
  ctx.stroke();
}

/* ============================================================================
   REALISTIC ARTICULATED HUMAN CHARACTER RENDERER & PHYSICS
   ============================================================================ */
function drawLimbSegment(x1, y1, x2, y2, thickness, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = thickness;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

/**
 * Renders an articulated, realistic human mountain explorer/climber with
 * anatomically proportioned limbs, joints, climbing gear, helmet, and expressive face.
 */
function drawRealisticExplorer(cx, cy, scale, pose) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale * (pose.flipX ? -1 : 1), scale);
  ctx.rotate(pose.bodyTilt || 0);

  const isFemale = climberState.characterType === 0;
  const jacketColor = isFemale ? '#e11d48' : '#0284c7';
  const jacketDark = isFemale ? '#9f1239' : '#0369a1';
  const pantsColor = '#1e293b';
  const skinColor = '#fcd5b5';
  const helmetColor = isFemale ? '#fbbf24' : '#34d399';

  // --- BACKPACK ---
  ctx.fillStyle = isFemale ? '#0f766e' : '#b45309';
  ctx.beginPath();
  ctx.roundRect(-20, -26, 15, 30, 6);
  ctx.fill();
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // --- BACK LEG (Thigh -> Knee -> Shin -> Climbing Boot) ---
  const hipX = 0, hipY = 10;
  const bKneeX = hipX + Math.sin(pose.backThigh) * 22;
  const bKneeY = hipY + Math.cos(pose.backThigh) * 22;
  const bFootX = bKneeX + Math.sin(pose.backShin) * 21;
  const bFootY = bKneeY + Math.cos(pose.backShin) * 21;

  drawLimbSegment(hipX, hipY, bKneeX, bKneeY, 10, '#0f172a');
  drawLimbSegment(bKneeX, bKneeY, bFootX, bFootY, 8.5, '#1e293b');
  // Boot
  ctx.fillStyle = '#451a03';
  ctx.beginPath();
  ctx.roundRect(bFootX - 4, bFootY - 3, 13, 7, 3);
  ctx.fill();

  // --- BACK ARM (Shoulder -> Elbow -> Hand) ---
  const shX = 2, shY = -20;
  const bElbX = shX + Math.sin(pose.backUpperArm) * 17;
  const bElbY = shY + Math.cos(pose.backUpperArm) * 17;
  const bHandX = bElbX + Math.sin(pose.backForearm) * 16;
  const bHandY = bElbY + Math.cos(pose.backForearm) * 16;

  drawLimbSegment(shX, shY, bElbX, bElbY, 8.5, jacketDark);
  drawLimbSegment(bElbX, bElbY, bHandX, bHandY, 7, jacketDark);
  ctx.fillStyle = skinColor;
  ctx.beginPath();
  ctx.arc(bHandX, bHandY, 4.2, 0, Math.PI * 2);
  ctx.fill();

  // --- TORSO & CLIMBING HARNESS ---
  ctx.fillStyle = jacketColor;
  ctx.beginPath();
  ctx.roundRect(-10, -26, 20, 38, 8);
  ctx.fill();

  // Expedition Vest Collar & Zipper
  ctx.strokeStyle = '#fde047';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(3, -25);
  ctx.lineTo(3, 10);
  ctx.stroke();

  // Climbing Harness Belt
  ctx.fillStyle = '#334155';
  ctx.fillRect(-10, 4, 20, 6);
  ctx.fillStyle = '#fbbf24';
  ctx.fillRect(0, 4, 5, 6);

  // --- FRONT LEG (Thigh -> Knee -> Shin -> Boot) ---
  const fKneeX = hipX + Math.sin(pose.frontThigh) * 22;
  const fKneeY = hipY + Math.cos(pose.frontThigh) * 22;
  const fFootX = fKneeX + Math.sin(pose.frontShin) * 21;
  const fFootY = fKneeY + Math.cos(pose.frontShin) * 21;

  drawLimbSegment(hipX, hipY, fKneeX, fKneeY, 10.5, pantsColor);
  drawLimbSegment(fKneeX, fKneeY, fFootX, fFootY, 9, '#334155');
  // Boot with traction sole
  ctx.fillStyle = '#78350f';
  ctx.beginPath();
  ctx.roundRect(fFootX - 4, fFootY - 3, 14, 7.5, 3);
  ctx.fill();
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(fFootX - 4, fFootY + 2.5, 14, 2);

  // --- NECK & HEAD ---
  ctx.fillStyle = skinColor;
  ctx.fillRect(-4, -33, 8, 9);

  // Ponytail / Hair
  ctx.fillStyle = isFemale ? '#7c2d12' : '#451a03';
  if (isFemale) {
    ctx.beginPath();
    ctx.ellipse(-12, -36, 7, 4, -0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Head Oval
  ctx.fillStyle = skinColor;
  ctx.beginPath();
  ctx.ellipse(1, -41, 11, 12.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Expressive Eyes (tracking cursor / action) & Smile
  const isBlinking = climberState.blinkTimer > 0;
  ctx.fillStyle = '#0f172a';
  if (isBlinking) {
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = '#0f172a';
    ctx.beginPath();
    ctx.moveTo(4, -42);
    ctx.lineTo(9, -42);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(6.5, -42, 2.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(7.1, -42.7, 0.8, 0, Math.PI * 2);
    ctx.fill();
  }

  // Eyebrow
  ctx.strokeStyle = '#451a03';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(3.5, -46);
  ctx.lineTo(9.5, -45.5);
  ctx.stroke();

  // Confident Smile (or surprised O on slip)
  ctx.strokeStyle = '#9a3412';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  if (pose.surprised) {
    ctx.arc(6, -35, 2.5, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    ctx.arc(4.5, -36.5, 4, 0.15, Math.PI * 0.75);
    ctx.stroke();
  }

  // Climbing Helmet with Headlamp
  ctx.fillStyle = helmetColor;
  ctx.beginPath();
  ctx.arc(0, -44, 12.5, Math.PI * 0.95, Math.PI * 2.08);
  ctx.fill();
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  // Headlamp on front of helmet
  ctx.fillStyle = '#fef08a';
  ctx.fillRect(9, -49, 4, 5);

  // --- FRONT ARM (Shoulder -> Elbow -> Hand) ---
  const fElbX = shX + Math.sin(pose.frontUpperArm) * 17;
  const fElbY = shY + Math.cos(pose.frontUpperArm) * 17;
  const fHandX = fElbX + Math.sin(pose.frontForearm) * 16;
  const fHandY = fElbY + Math.cos(pose.frontForearm) * 16;

  drawLimbSegment(shX, shY, fElbX, fElbY, 9, jacketColor);
  drawLimbSegment(fElbX, fElbY, fHandX, fHandY, 7.5, jacketColor);
  ctx.fillStyle = skinColor;
  ctx.beginPath();
  ctx.arc(fHandX, fHandY, 4.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/**
 * Updates and renders the human explorer in either idle breathing pose or one of the
 * 5 celebratory canyon stunts / bungee slip.
 */
function updateAndDrawClimber(w, h) {
  // Natural blinking
  if (Math.random() < 0.012 && climberState.blinkTimer === 0) {
    climberState.blinkTimer = 8;
  }
  if (climberState.blinkTimer > 0) climberState.blinkTimer--;

  const baseScale = Math.max(0.88, Math.min(1.22, w / 1280));
  const homeX = w * 0.21;
  const homeY = h * 0.485;

  if (climberState.action === 'idle') {
    const breath = Math.sin(time * 3.2) * 0.05;
    climberState.x = homeX;
    climberState.y = homeY + Math.sin(time * 3.2) * 1.5;

    // Subtle arm wave toward the canyon
    const pose = {
      bodyTilt: breath * 0.4,
      frontUpperArm: 0.35 + Math.sin(time * 2.5) * 0.12,
      frontForearm: 0.85 + Math.cos(time * 2.5) * 0.15,
      backUpperArm: -0.25,
      backForearm: 0.3,
      frontThigh: 0.12,
      frontShin: -0.05,
      backThigh: -0.15,
      backShin: 0.08,
      flipX: false,
      surprised: false
    };
    drawRealisticExplorer(climberState.x, climberState.y, baseScale, pose);
  }
  else if (climberState.action === 'zipline') {
    // STUNT 1: High-Speed Zipline Ride Across the Canyon with Sparks!
    climberState.progress += 0.014;
    const t = Math.min(1, climberState.progress);
    const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

    const zipStartX = w * 0.19;
    const zipStartY = h * 0.42;
    const zipEndX = w * 0.81;
    const zipEndY = h * 0.48;

    // Quadratic bezier along cable
    const u = 1 - ease;
    const midX = w * 0.5;
    const midY = (zipStartY + zipEndY) * 0.5 + 18;
    const cableX = u * u * zipStartX + 2 * u * ease * midX + ease * ease * zipEndX;
    const cableY = u * u * zipStartY + 2 * u * ease * midY + ease * ease * zipEndY;

    climberState.x = cableX;
    climberState.y = cableY + 52 * baseScale;

    // Draw Pulley & Harness Strap
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cableX, cableY);
    ctx.lineTo(climberState.x, climberState.y - 25 * baseScale);
    ctx.stroke();

    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(cableX, cableY, 6, 0, Math.PI * 2);
    ctx.fill();

    // Sparks from pulley
    if (Math.random() < 0.65 && t < 0.92) {
      spawnEmbers(cableX, cableY, 2, '#fde047');
    }

    const swing = Math.sin(t * Math.PI * 5) * 0.35;
    const pose = {
      bodyTilt: -0.22 + swing * 0.5,
      frontUpperArm: 2.5,
      frontForearm: 2.8,
      backUpperArm: 2.4,
      backForearm: 2.7,
      frontThigh: 0.5 + swing,
      frontShin: -0.6,
      backThigh: -0.3 + swing,
      backShin: -0.7,
      flipX: false
    };
    drawRealisticExplorer(climberState.x, climberState.y, baseScale, pose);
  }
  else if (climberState.action === 'pendulum') {
    // STUNT 2: Giant Grappling-Hook Pendulum Swing & Mid-Air Flip!
    climberState.progress += 0.014;
    const t = Math.min(1, climberState.progress);
    const pivotX = w * 0.5;
    const pivotY = h * 0.22;
    const ropeLen = h * 0.36;
    const angle = Math.cos(t * Math.PI) * 0.95;

    climberState.x = pivotX - Math.sin(angle) * ropeLen;
    climberState.y = pivotY + Math.cos(angle) * ropeLen;

    // Grappling Rope
    ctx.strokeStyle = '#fcd34d';
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(pivotX, pivotY);
    ctx.lineTo(climberState.x, climberState.y - 18 * baseScale);
    ctx.stroke();

    const flipRot = t > 0.35 && t < 0.75 ? ((t - 0.35) / 0.4) * Math.PI * 2 : 0;
    const pose = {
      bodyTilt: -angle * 0.6 + flipRot,
      frontUpperArm: 2.2,
      frontForearm: 2.6,
      backUpperArm: 1.9,
      backForearm: 2.3,
      frontThigh: 0.65,
      frontShin: -0.8,
      backThigh: 0.35,
      backShin: -0.85,
      flipX: false
    };
    drawRealisticExplorer(climberState.x, climberState.y, baseScale, pose);
  }
  else if (climberState.action === 'glider') {
    // STUNT 3: Delta Hang-Glider Soaring Over the Waterfall!
    climberState.progress += 0.014;
    const t = Math.min(1, climberState.progress);
    climberState.x = w * 0.18 + t * (w * 0.64);
    climberState.y = h * 0.44 - Math.sin(t * Math.PI) * (h * 0.14) + Math.sin(t * Math.PI * 3) * 14;

    // Draw vibrant Delta Glider Wing
    ctx.save();
    ctx.translate(climberState.x, climberState.y - 26 * baseScale);
    ctx.rotate(Math.cos(t * Math.PI) * 0.15);
    ctx.fillStyle = '#10b981';
    ctx.beginPath();
    ctx.moveTo(-48, 8);
    ctx.lineTo(15, -18);
    ctx.lineTo(54, 4);
    ctx.lineTo(0, -2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#fef08a';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();

    const pose = {
      bodyTilt: 1.15,
      frontUpperArm: 1.4,
      frontForearm: 1.7,
      backUpperArm: 1.2,
      backForearm: 1.5,
      frontThigh: -0.2,
      frontShin: -0.3,
      backThigh: -0.35,
      backShin: -0.4,
      flipX: false
    };
    drawRealisticExplorer(climberState.x, climberState.y, baseScale, pose);
  }
  else if (climberState.action === 'dive_kayak') {
    // STUNT 4: Graceful Cliff Dive Into the River & Expedition Kayak Paddle!
    climberState.progress += 0.014;
    const t = Math.min(1, climberState.progress);
    const riverY = h * 0.77;

    if (t < 0.45) {
      // Diving arc from left cliff into river
      const dt = t / 0.45;
      climberState.x = homeX + dt * (w * 0.18);
      climberState.y = homeY - Math.sin(dt * Math.PI) * 85 + dt * (riverY - homeY);
      if (dt > 0.88 && dt < 0.94) {
        audio.playSplash();
        spawnPebbles(climberState.x, riverY, 16, '#bae6fd');
      }
      const pose = {
        bodyTilt: dt * Math.PI * 1.65,
        frontUpperArm: 2.8,
        frontForearm: 3.0,
        backUpperArm: 2.7,
        backForearm: 2.9,
        frontThigh: 0.1,
        frontShin: 0.0,
        backThigh: -0.1,
        backShin: 0.0,
        flipX: false
      };
      drawRealisticExplorer(climberState.x, climberState.y, baseScale, pose);
    } else {
      // Kayaking across the emerald river!
      const kt = (t - 0.45) / 0.55;
      climberState.x = homeX + w * 0.18 + kt * (w * 0.36);
      climberState.y = riverY - 8 + Math.sin(kt * Math.PI * 6) * 4;

      const paddleCycle = Math.sin(kt * Math.PI * 8);
      const pose = {
        bodyTilt: 0.08,
        frontUpperArm: 0.8 + paddleCycle * 0.6,
        frontForearm: 1.3 + paddleCycle * 0.5,
        backUpperArm: 0.5 - paddleCycle * 0.6,
        backForearm: 1.1 - paddleCycle * 0.5,
        frontThigh: 1.4,
        frontShin: 1.5,
        backThigh: 1.4,
        backShin: 1.5,
        flipX: false
      };
      drawRealisticExplorer(climberState.x, climberState.y, baseScale, pose);

      // Draw Sleek Expedition Kayak Hull Around Seated Climber
      ctx.save();
      ctx.translate(climberState.x, climberState.y + 8 * baseScale);
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.moveTo(-48, 0);
      ctx.quadraticCurveTo(0, 18, 52, 0);
      ctx.quadraticCurveTo(0, -6, -48, 0);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Double-bladed Kayak Paddle
      ctx.rotate(paddleCycle * 0.45);
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-36, -14);
      ctx.lineTo(36, 14);
      ctx.stroke();
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(-44, -18, 12, 7);
      ctx.fillRect(32, 11, 12, 7);
      ctx.restore();
    }
  }
  else if (climberState.action === 'climb_flare') {
    // STUNT 5: Dynamic Leaping Ascent & Celebratory Flare Firework!
    climberState.progress += 0.015;
    const t = Math.min(1, climberState.progress);
    const jumpArc = Math.sin(t * Math.PI * 3) * 28;
    climberState.x = homeX + Math.sin(t * Math.PI) * 35;
    climberState.y = homeY - Math.abs(jumpArc);

    if (Math.abs(t - 0.45) < 0.02) {
      spawnFirework(climberState.x + 40, climberState.y - 120);
    }

    const pose = {
      bodyTilt: Math.sin(t * Math.PI * 4) * 0.15,
      frontUpperArm: 2.75,
      frontForearm: 2.95,
      backUpperArm: 2.4 + Math.sin(t * 18) * 0.4,
      backForearm: 2.7,
      frontThigh: 0.45 + Math.sin(t * 15) * 0.3,
      frontShin: -0.4,
      backThigh: -0.45 - Math.sin(t * 15) * 0.3,
      backShin: -0.35,
      flipX: false
    };
    drawRealisticExplorer(climberState.x, climberState.y, baseScale, pose);
  }
  else if (climberState.action === 'slip') {
    // WRONG ANSWER: Elastic Bungee Rope Bounce & Pebble Tumble
    climberState.progress += 0.032;
    const t = climberState.progress;
    const bounce = Math.sin(t * Math.PI * 3) * Math.exp(-t * 2.2) * 38;
    climberState.x = homeX + Math.sin(t * 24) * 6;
    climberState.y = homeY + Math.abs(bounce);

    // Safety Bungee Rope
    ctx.strokeStyle = '#f87171';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(homeX, homeY - 60);
    ctx.lineTo(climberState.x, climberState.y - 15 * baseScale);
    ctx.stroke();

    const pose = {
      bodyTilt: Math.sin(t * 20) * 0.35,
      frontUpperArm: 2.1,
      frontForearm: 1.5,
      backUpperArm: -1.8,
      backForearm: -1.2,
      frontThigh: 0.55,
      frontShin: -0.7,
      backThigh: -0.5,
      backShin: -0.6,
      flipX: false,
      surprised: true
    };
    drawRealisticExplorer(climberState.x, climberState.y, baseScale, pose);

    if (t >= 1) {
      climberState.action = 'idle';
      climberState.progress = 0;
    }
  }
}

/* ============================================================================
   PARTICLE SYSTEMS UPDATE & DRAW (Embers, Pebbles, Fireworks, Pinecones)
   ============================================================================ */
function updateAndDrawParticles(h) {
  // Embers & Sparks
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i];
    e.x += e.vx;
    e.y += e.vy;
    e.alpha -= 0.022;
    if (e.alpha <= 0) {
      embers.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.globalAlpha = e.alpha;
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Falling Pebbles & Water Droplets
  for (let i = pebbles.length - 1; i >= 0; i--) {
    const p = pebbles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.28; // gravity
    if (p.y > h) {
      pebbles.splice(i, 1);
      continue;
    }
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // Celebratory Fireworks
  for (let i = fireworks.length - 1; i >= 0; i--) {
    const fw = fireworks[i];
    fw.x += fw.vx;
    fw.y += fw.vy;
    fw.vy += 0.08;
    fw.vx *= 0.97;
    fw.vy *= 0.97;
    fw.alpha -= 0.018;
    if (fw.alpha <= 0) {
      fireworks.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.globalAlpha = fw.alpha;
    ctx.fillStyle = fw.color;
    ctx.beginPath();
    ctx.arc(fw.x, fw.y, fw.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Falling Pinecones
  for (let i = pinecones.length - 1; i >= 0; i--) {
    const pc = pinecones[i];
    pc.x += pc.vx;
    pc.y += pc.vy;
    pc.vy += 0.25;
    pc.rot += 0.1;
    if (pc.y > h) {
      pinecones.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.translate(pc.x, pc.y);
    ctx.rotate(pc.rot);
    ctx.fillStyle = '#78350f';
    ctx.beginPath();
    ctx.ellipse(0, 0, 5, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/* ============================================================================
   MAIN GAME LOOP & INITIALIZATION
   ============================================================================ */
function animate() {
  time += 0.016;
  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);
  drawBackground(w, h);
  updateAndDrawClimber(w, h);
  updateAndDrawParticles(h);

  requestAnimationFrame(animate);
}

window.onload = function () {
  resizeCanvas();
  initSceneObjects();
  initNumpad();
  loadNextProblem();
  animate();
};
</script>
