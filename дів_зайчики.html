<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Чарівна Математична Галявина</title>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        /* Скидання стилів та налаштування повноекранного режиму */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #87CEEB;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        #game-zoom-wrapper {
            width: 100%;
            height: 100%;
            transform-origin: center center;
            transition: transform 0.3s ease;
            position: relative;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: transparent;
        }

        /* --- ТАЄМНА ПАНЕЛЬ ВЧИТЕЛЯ --- */
        #teacher-panel {
            position: absolute;
            top: 15px;
            right: 20px;
            background: linear-gradient(to bottom, #8b5a2b, #6b4226);
            border: 3px solid #4a2e15;
            border-radius: 12px;
            padding: 10px 15px;
            box-shadow: 3px 5px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.15;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateY(-5px);
            z-index: 1000;
        }
        #teacher-panel:hover, #teacher-panel:focus-within {
            opacity: 1;
            transform: translateY(0);
        }
        #teacher-panel span {
            font-size: 12px;
            color: #f0ca8c;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #teacher-input {
            background: rgba(0,0,0,0.3);
            border: none;
            border-bottom: 2px dashed #f0ca8c;
            color: #fff;
            font-size: 24px;
            width: 90px;
            text-align: center;
            font-family: inherit;
            outline: none;
            padding: 2px;
            transition: color 0.2s, text-shadow 0.2s;
        }
        #teacher-input:focus {
            border-bottom-color: #FFD700;
        }
        .secret-text {
            color: transparent !important;
            text-shadow: 0 0 0 transparent !important;
        }
        .secret-text::selection {
            background: transparent;
            color: transparent;
        }
        #toggle-secret-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            padding: 0;
            color: #f0ca8c;
        }

        /* --- СЮЖЕТНИЙ ФОН (Оригінальний) --- */
        #background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes floatCloud { 0% { transform: translateX(0); } 50% { transform: translateX(40px); } 100% { transform: translateX(0); } }
        @keyframes sunGlow { 0% { filter: drop-shadow(0 0 20px #FFD700); transform: rotate(0deg); } 100% { filter: drop-shadow(0 0 45px #FFA500); transform: rotate(360deg); } }
        @keyframes floatDust { 0% { transform: translateY(0) scale(1); opacity: 0.3; } 50% { transform: translateY(-30px) scale(1.5); opacity: 0.8; } 100% { transform: translateY(-60px) scale(0.5); opacity: 0; } }

        .cloud-anim { animation: floatCloud 25s infinite ease-in-out; }
        .sun-anim { animation: sunGlow 60s infinite linear; transform-origin: 1700px 150px; }
        .dust-anim { animation: floatDust 4s infinite ease-in; transform-origin: center; }

        /* --- ЗОНА ПРИКЛАДУ --- */
        #math-zone {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 5vh;
            padding: 20px 50px;
            background: linear-gradient(135deg, #6b4423 0%, #4a2f18 100%);
            border: 8px solid #a67c52;
            border-radius: 50px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 8px 20px rgba(255,255,255,0.15);
            z-index: 10;
            position: relative;
            min-height: 120px;
            max-width: 90%;
            flex-wrap: wrap;
        }

        .vine-decoration {
            position: absolute;
            top: -25px;
            left: -35px;
            width: 140px;
            height: 140px;
            pointer-events: none;
        }

        #objects-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 350px;
            gap: 5px;
        }

        .balloon-icon {
            width: 45px;
            height: 70px;
            filter: drop-shadow(2px 5px 4px rgba(0,0,0,0.4));
            animation: floatBalloon 3s infinite ease-in-out alternate;
        }
        @keyframes floatBalloon { 0% { transform: translateY(0) rotate(-3deg); } 100% { transform: translateY(-8px) rotate(3deg); } }

        .math-text {
            font-size: 80px;
            color: #FFD700;
            text-shadow: 3px 3px 0 #D2691E, -2px -2px 0 #FFF8DC, 5px 5px 15px rgba(0,0,0,0.6);
            font-weight: bold;
            margin: 0 10px;
        }

        #answer-input {
            width: 120px;
            height: 100px;
            font-size: 70px;
            text-align: center;
            background: radial-gradient(circle, #fff3e0 0%, #ffcc80 100%);
            border: 6px solid #d84315;
            border-radius: 20px;
            color: #bf360c;
            font-family: inherit;
            font-weight: bold;
            outline: none;
            box-shadow: inset 0 8px 15px rgba(0,0,0,0.3);
            transition: background-color 0.4s;
        }

        /* --- ЗОНА КУЩІВ І ПЕРСОНАЖІВ --- */
        #bushes-zone {
            position: absolute;
            bottom: 5vh;
            display: flex;
            justify-content: space-evenly;
            width: 95%;
            align-items: flex-end;
            height: 45vh;
            z-index: 10;
        }

        .character-wrapper {
            position: relative;
            width: 250px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            cursor: pointer;
        }

        .bush-svg {
            position: absolute;
            bottom: -15px;
            width: 100%;
            height: 100%;
            z-index: 3;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.4s;
            transform-origin: bottom center;
            transform: scale(1.15);
        }

        .character-svg {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        @keyframes earTwitch {
            0%, 85%, 100% { transform: rotate(0deg); }
            90% { transform: rotate(12deg); }
            95% { transform: rotate(-5deg); }
        }
        .ear-left { transform-origin: 80px 100px; animation: earTwitch 5s infinite; }
        .ear-right { transform-origin: 120px 100px; animation: earTwitch 5s infinite 0.5s; }

        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }
        .eye-blink { transform-origin: center; animation: blink 4s infinite; }

        .hidden-bush {
            transform: translateY(180px) scale(0.6);
            opacity: 0;
            pointer-events: none;
        }

        .run-away { animation: runAwayAnim 2.5s forwards cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes runAwayAnim {
            0% { transform: translate(0, 0) scale(1) rotate(0); }
            15% { transform: translate(-20px, -30px) scale(1.05) rotate(-10deg); }
            30% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
            100% { transform: translate(120vw, -100px) scale(0.6) rotate(35deg); opacity: 0; }
        }

        .jump-joy { animation: jumpJoyAnim 0.7s infinite alternate ease-in-out; }
        @keyframes jumpJoyAnim {
            0% { transform: translateY(0); }
            100% { transform: translateY(-40px); }
        }

        /* --- THEME MANAGER UI --- */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #2c3e50;
            color: white;
            border: 2px solid #fff;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 85000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            background: #fff;
            border-radius: 15px;
            z-index: 86000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            padding: 20px;
            flex-direction: column;
        }
        #theme-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: bold;
        }
        #theme-modal-close {
            cursor: pointer;
            font-size: 24px;
            color: #c0392b;
        }
        #theme-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            overflow-y: auto;
            max-height: 60vh;
            padding: 10px;
        }
        .theme-card {
            position: relative;
            width: 100%;
            height: 90px;
            border-radius: 8px;
            cursor: pointer;
            border: 3px solid transparent;
            overflow: hidden;
            background-color: #eee;
            background-size: cover;
            background-position: center;
            transition: transform 0.2s;
        }
        .theme-card:hover { transform: scale(1.05); }
        .theme-card.active { border-color: #27ae60; }
        .theme-card-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: white;
            text-align: center;
            font-size: 12px;
            padding: 4px 0;
            pointer-events: none;
        }

        /* --- GLOBAL DRAWING UI --- */
        #global-draw-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 90000;
            pointer-events: none;
        }
        #toggle-draw-btn-global {
            position: fixed;
            bottom: 85px;
            right: 20px;
            background: #8e44ad;
            color: white;
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 90002;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #draw-panel-global {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background: #fff;
            border: 2px solid #8e44ad;
            border-radius: 10px;
            padding: 10px;
            z-index: 90003;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            flex-direction: column;
            gap: 10px;
            width: 150px;
        }
        #draw-panel-header {
            width: 100%;
            height: 20px;
            background: #ddd;
            border-radius: 5px;
            cursor: move;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 5px;
        }
        #draw-panel-close {
            cursor: pointer;
            color: red;
            font-weight: bold;
        }
        .draw-btn {
            padding: 5px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #f9f9f9;
            text-align: center;
        }
        .draw-btn.active { background: #8e44ad; color: white; border-color: #5e3370; }

        /* --- ZOOM CONTROLS --- */
        #zoom-controls {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 90005;
        }
        .zoom-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: #3498db;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        /* --- BLOCK OVERLAY --- */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            color: red;
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .math-text { font-size: 50px; }
            #answer-input { width: 80px; height: 70px; font-size: 45px; }
            .character-wrapper { width: 150px; height: 200px; }
            #math-zone { padding: 10px 20px; flex-direction: row; }
        }
    </style>
</head>
<body>

    <!-- ZOOM WRAPPER -->
    <div id="game-zoom-wrapper">
        <div id="game-container">
            <!-- Таємна панель для вчителя -->
            <div id="teacher-panel">
                <span>Таємне віконце</span>
                <div class="input-row">
                    <input type="text" id="teacher-input" class="secret-text" title="Введіть приклад, напр. 5+2 або 7-3">
                    <button id="toggle-secret-btn" title="Показати/Сховати">🙈</button>
                </div>
            </div>

            <!-- Зона математичного прикладу -->
            <div id="math-zone">
                <svg class="vine-decoration" viewBox="0 0 100 100">
                    <path d="M 10 90 Q 30 50 80 10" stroke="#228B22" stroke-width="7" fill="none" stroke-linecap="round"/>
                    <path d="M 30 70 Q 40 60 50 65" stroke="#228B22" stroke-width="4" fill="none"/>
                    <path d="M 80 10 Q 70 5 75 20 Q 90 25 80 10 Z" fill="#32CD32"/>
                    <path d="M 50 65 Q 40 60 45 75 Q 60 80 50 65 Z" fill="#32CD32"/>
                </svg>
                <div id="objects-container"></div>
                <div id="operator-display" class="math-text">+</div>
                <div id="num2-display" class="math-text">3</div>
                <div class="math-text">=</div>
                <input type="text" id="answer-input" autocomplete="off" maxlength="2">
            </div>

            <!-- Зона з кущами та персонажами -->
            <div id="bushes-zone"></div>
        </div>
        
        <!-- CANVAS ДЛЯ МАЛЮВАННЯ В МЕЖАХ ZOOM-КОНТЕЙНЕРА -->
        <canvas id="global-draw-canvas" width="1920" height="1080"></canvas>
    </div>

    <!-- Сюжетний фон (за замовчуванням) -->
    <svg id="background-layer" preserveAspectRatio="none" viewBox="0 0 1920 1080">
        <defs>
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#1e90ff" />
                <stop offset="60%" stop-color="#87cefa" />
                <stop offset="100%" stop-color="#e0ffff" />
            </linearGradient>
            <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#3cb371" />
                <stop offset="100%" stop-color="#006400" />
            </linearGradient>
            <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFF720" />
                <stop offset="70%" stop-color="#FFA500" />
            </radialGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="8" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>
        <rect width="1920" height="1080" fill="url(#skyGrad)" />
        <g class="sun-anim">
            <circle cx="1700" cy="150" r="110" fill="url(#sunGrad)" filter="url(#glow)"/>
            <path d="M 1700 10 L 1700 30 M 1700 270 L 1700 290 M 1560 150 L 1540 150 M 1840 150 L 1860 150" stroke="#FFD700" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
        </g>
        <g class="cloud-anim" opacity="0.8">
            <path d="M 250 180 C 250 140 310 130 340 160 C 370 120 450 130 470 180 C 510 180 520 230 480 250 C 460 270 270 270 240 250 C 200 230 210 180 250 180 Z" fill="#ffffff" filter="url(#glow)"/>
            <path d="M 1200 250 C 1200 220 1250 210 1270 230 C 1300 200 1360 210 1380 250 C 1410 250 1420 290 1390 300 C 1370 320 1220 320 1190 300 C 1160 280 1170 250 1200 250 Z" fill="#ffffff"/>
        </g>
        <path d="M 0 650 Q 400 450 800 680 T 1500 600 T 1920 720 L 1920 1080 L 0 1080 Z" fill="#2E8B57" opacity="0.5"/>
        <path d="M -100 750 Q 500 550 1000 780 T 2000 750 L 2000 1080 L -100 1080 Z" fill="#228B22" opacity="0.7"/>
        <path d="M 0 850 Q 500 800 1000 880 T 1920 850 L 1920 1080 L 0 1080 Z" fill="url(#grassGrad)"/>
        <circle cx="300" cy="900" r="4" fill="#FFFF00" filter="url(#glow)" class="dust-anim" style="animation-delay: 0s;"/>
        <circle cx="500" cy="850" r="3" fill="#FFFF00" filter="url(#glow)" class="dust-anim" style="animation-delay: 1.2s;"/>
        <circle cx="1500" cy="950" r="5" fill="#FFFF00" filter="url(#glow)" class="dust-anim" style="animation-delay: 2.5s;"/>
        <circle cx="1700" cy="880" r="3" fill="#FFFF00" filter="url(#glow)" class="dust-anim" style="animation-delay: 0.8s;"/>
    </svg>

    <!-- ДОДАТКОВІ ІНТЕРФЕЙСИ -->
    
    <!-- ZOOM -->
    <div id="zoom-controls">
        <button class="zoom-btn" onclick="adjustZoom(0.1)">🔍+</button>
        <button class="zoom-btn" onclick="adjustZoom(-0.1)">🔍-</button>
    </div>

    <!-- THEME MANAGER -->
    <button id="theme-btn" onclick="document.getElementById('theme-modal').style.display='flex'">⚙️</button>
    <div id="theme-modal">
        <div id="theme-modal-header">
            <span>Вибір фону</span>
            <span id="theme-modal-close" onclick="document.getElementById('theme-modal').style.display='none'">✕</span>
        </div>
        <div id="theme-gallery">
            <div class="theme-card" style="background:#87CEEB;" onclick="selectTheme('none')">
                <div class="theme-card-text">Без фону</div>
            </div>
            <!-- Галерея генерується скриптом -->
        </div>
    </div>

    <!-- GLOBAL DRAWING UI -->
    <button id="toggle-draw-btn-global">✏️ Малювати</button>
    <div id="draw-panel-global">
        <div id="draw-panel-header">
            <span id="draw-panel-close">✕</span>
        </div>
        <div class="draw-btn active" id="draw-pencil-btn">✏️ Олівець</div>
        <div class="draw-btn" id="draw-eraser-btn">🧽 Гумка</div>
        <input type="range" id="draw-size" min="1" max="50" value="5">
        <input type="color" id="draw-color" value="#ff0000">
        <div class="draw-btn" id="draw-clear-btn">🗑️ Очистити</div>
    </div>

    <!-- Універсальний блок контролю -->
    <div id="block-overlay">Зачекай! Зараз не твій урок.</div>

    <script>
        const CONFIG = {
            gameId: 'math_meadow_1',
            projectId: 'lesson-13c44'
        };

        // --- ІНІЦІАЛІЗАЦІЯ FIREBASE ---
        let db = null;
        let isFirebaseActive = false;
        try {
            const firebaseConfig = { databaseURL: `https://${CONFIG.projectId}-default-rtdb.firebaseio.com/` };
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            isFirebaseActive = true;
        } catch (e) {
            console.warn("Firebase не підключено, гра працює локально.");
        }

        // --- ІДЕНТИФІКАЦІЯ, РАДАР ТА БЛОКУВАННЯ ---
        let myName = new URLSearchParams(window.location.search).get('user');
        if (!myName) myName = sessionStorage.getItem('userName');
        if (!myName) {
            myName = 'Гість_' + Math.floor(Math.random() * 1000);
            sessionStorage.setItem('userName', myName);
        } else {
            sessionStorage.setItem('userName', myName);
        }

        let isRemoteAction = false;

        if (isFirebaseActive) {
            const tabId = Math.random().toString(36).substring(2, 15);
            const myPresenceRef = db.ref(`online_users/${myName}/${tabId}`);
            const connectedRef = db.ref('.info/connected');

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    myPresenceRef.set(true);
                    myPresenceRef.onDisconnect().remove();
                }
            });

            window.addEventListener('beforeunload', () => myPresenceRef.remove());

            // ВИПРАВЛЕНО: Захист від безкінечного циклу оновлення
            let initialRefreshLoad = true;
            db.ref('force_refresh').on('value', (snap) => {
                if (!initialRefreshLoad && snap.val()) window.location.reload();
                initialRefreshLoad = false;
            });

            db.ref(`blocked_users/${myName}`).on('value', (snap) => {
                document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
            });

            let immune = true;
            setTimeout(() => immune = false, 1500); // Імунітет 1.5 секунди при старті
            db.ref('current_activity').on('value', (snap) => {
                if (!immune && snap.val() === 'lobby') {
                    window.location.href = `https://olgazheltvai2.github.io/rizne/lobby.html?user=${encodeURIComponent(myName)}`;
                }
            });
        }

        function sendGameAction(type, data) {
            if (!isFirebaseActive || isRemoteAction) return;
            db.ref('game_action').set({
                senderId: myName,
                timestamp: Date.now(),
                type: type,
                data: data
            });
        }

        if (isFirebaseActive) {
            db.ref('game_action').on('value', (snap) => {
                const action = snap.val();
                if (!action || action.senderId === myName) return;
                const timeDiff = Date.now() - action.timestamp;
                if (timeDiff > 5000) return;

                isRemoteAction = true;
                if (action.type === 'update_game') {
                    updateGame(action.data.n1, action.data.op, action.data.n2);
                    teacherInput.value = `${action.data.n1}${action.data.op}${action.data.n2}`;
                } else if (action.type === 'bush_click') {
                    const wrappers = document.querySelectorAll('.character-wrapper');
                    if(wrappers[action.data.index]) {
                        processBushClick(action.data.index, wrappers[action.data.index]);
                    }
                } else if (action.type === 'draw_line') {
                    drawRemoteLine(action.data);
                } else if (action.type === 'clear_canvas') {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
                setTimeout(() => isRemoteAction = false, 50);
            });
        }

        // --- THEME MANAGER ---
        const themeGallery = document.getElementById('theme-gallery');
        const bgLayer = document.getElementById('background-layer');

        function applyTheme(url) {
            if (url === 'none') {
                document.body.style.backgroundImage = 'none';
                if(bgLayer) bgLayer.style.display = 'block';
            } else {
                document.body.style.backgroundImage = `url(${url})`;
                if(bgLayer) bgLayer.style.display = 'none';
            }
        }

        function selectTheme(url) {
            applyTheme(url);
            localStorage.setItem('mySavedBg_' + CONFIG.gameId, url);
            if (isFirebaseActive && !isRemoteAction) {
                db.ref('game_theme').set({ url: url, timestamp: Date.now(), sender: myName });
            }
        }

        async function loadThemes() {
            let savedBg = localStorage.getItem('mySavedBg_' + CONFIG.gameId);
            if (savedBg) {
                applyTheme(savedBg);
            } else {
                applyTheme('none');
            }

            if (isFirebaseActive) {
                db.ref('game_theme').on('value', (snap) => {
                    const data = snap.val();
                    if (data && data.sender !== myName) {
                        isRemoteAction = true;
                        applyTheme(data.url);
                        localStorage.setItem('mySavedBg_' + CONFIG.gameId, data.url);
                        setTimeout(() => isRemoteAction = false, 50);
                    }
                });
            }

            // ВИПРАВЛЕНО: Строге послідовне завантаження з break при першій помилці 404
            for (let i = 1; i <= 1000; i++) {
                const url = `https://olgazheltvai2.github.io/images/backgrounds/background_${i}.webp`;
                try {
                    const res = await fetch(url, { method: 'HEAD' });
                    if (!res.ok) {
                        break; // Зупинка перевірки, якщо файл не знайдено
                    }
                    
                    const card = document.createElement('div');
                    card.className = 'theme-card';
                    card.style.backgroundImage = `url(${url})`;
                    card.onclick = () => selectTheme(url);
                    card.innerHTML = `<div class="theme-card-text">Фон ${i}</div>`;
                    themeGallery.appendChild(card);
                } catch (e) {
                    break; // Зупинка при мережевій помилці
                }
            }
        }
        loadThemes();

        // --- ZOOM CONTROLS ---
        let currentZoom = 1;
        function adjustZoom(delta) {
            currentZoom += delta;
            if (currentZoom < 0.3) currentZoom = 0.3;
            if (currentZoom > 2) currentZoom = 2;
            document.getElementById('game-zoom-wrapper').style.transform = `scale(${currentZoom})`;
        }

        // --- GLOBAL DRAWING ---
        const canvas = document.getElementById('global-draw-canvas');
        const ctx = canvas.getContext('2d');
        const drawBtnGlobal = document.getElementById('toggle-draw-btn-global');
        const drawPanel = document.getElementById('draw-panel-global');
        const drawPanelHeader = document.getElementById('draw-panel-header');
        
        let isDrawingMode = false;
        let isDrawing = false;
        let currentTool = 'pencil';
        let lastX = 0, lastY = 0;

        drawBtnGlobal.onclick = () => {
            drawPanel.style.display = 'flex';
            isDrawingMode = true;
            canvas.style.pointerEvents = 'auto';
            document.getElementById('draw-pencil-btn').click(); // Автоматична активація олівця
        };

        document.getElementById('draw-panel-close').onclick = () => {
            drawPanel.style.display = 'none';
            isDrawingMode = false;
            canvas.style.pointerEvents = 'none';
        };

        document.getElementById('draw-pencil-btn').onclick = function() {
            currentTool = 'pencil';
            this.classList.add('active');
            document.getElementById('draw-eraser-btn').classList.remove('active');
        };

        document.getElementById('draw-eraser-btn').onclick = function() {
            currentTool = 'eraser';
            this.classList.add('active');
            document.getElementById('draw-pencil-btn').classList.remove('active');
        };

        document.getElementById('draw-clear-btn').onclick = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            sendGameAction('clear_canvas', {});
        };

        // ВИПРАВЛЕНО: Масштабування координат відносно Canvas
        function getDrawPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: ((clientX - rect.left) / rect.width) * canvas.width,
                y: ((clientY - rect.top) / rect.height) * canvas.height
            };
        }

        function startDraw(e) {
            if (!isDrawingMode) return;
            isDrawing = true;
            const pos = getDrawPos(e);
            lastX = pos.x; lastY = pos.y;
        }

        function draw(e) {
            if (!isDrawing || !isDrawingMode) return;
            e.preventDefault();
            const pos = getDrawPos(e);
            const size = document.getElementById('draw-size').value;
            const color = currentTool === 'eraser' ? null : document.getElementById('draw-color').value;
            
            drawLine(lastX, lastY, pos.x, pos.y, color, size);
            
            sendGameAction('draw_line', {
                x0: lastX / canvas.width, y0: lastY / canvas.height,
                x1: pos.x / canvas.width, y1: pos.y / canvas.height,
                color: color, size: size
            });

            lastX = pos.x; lastY = pos.y;
        }

        function stopDraw() { isDrawing = false; }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseout', stopDraw);
        canvas.addEventListener('touchstart', startDraw, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        canvas.addEventListener('touchend', stopDraw);

        function drawLine(x0, y0, x1, y1, color, size) {
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            if (color === null) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = size * 2;
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.lineWidth = size;
                ctx.strokeStyle = color;
            }
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawRemoteLine(data) {
            drawLine(data.x0 * canvas.width, data.y0 * canvas.height, data.x1 * canvas.width, data.y1 * canvas.height, data.color, data.size);
        }

        // Панель малювання - перетягування
        let isDraggingPanel = false, panelStartX, panelStartY, initialPanelX, initialPanelY;
        drawPanelHeader.onmousedown = (e) => {
            isDraggingPanel = true;
            panelStartX = e.clientX; panelStartY = e.clientY;
            initialPanelX = drawPanel.offsetLeft; initialPanelY = drawPanel.offsetTop;
        };
        drawPanelHeader.ontouchstart = (e) => {
            isDraggingPanel = true;
            panelStartX = e.touches[0].clientX; panelStartY = e.touches[0].clientY;
            initialPanelX = drawPanel.offsetLeft; initialPanelY = drawPanel.offsetTop;
        };
        document.addEventListener('mousemove', (e) => {
            if (!isDraggingPanel) return;
            drawPanel.style.left = initialPanelX + (e.clientX - panelStartX) + 'px';
            drawPanel.style.top = initialPanelY + (e.clientY - panelStartY) + 'px';
            drawPanel.style.right = 'auto';
        });
        document.addEventListener('touchmove', (e) => {
            if (!isDraggingPanel) return;
            drawPanel.style.left = initialPanelX + (e.touches[0].clientX - panelStartX) + 'px';
            drawPanel.style.top = initialPanelY + (e.touches[0].clientY - panelStartY) + 'px';
            drawPanel.style.right = 'auto';
        });
        document.addEventListener('mouseup', () => isDraggingPanel = false);
        document.addEventListener('touchend', () => isDraggingPanel = false);

        // --- ЛОГІКА ГРИ ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.5);
                gainNode.gain.setValueAtTime(0.4, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.15);
                osc.frequency.setValueAtTime(783.99, now + 0.3);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        let currentCorrectAnswer = 0;
        let correctAnswerIndex = 0;
        let levelActive = true;
        let pupilElements = [];

        // ІДЕНТИЧНІ ВУШКА ДЛЯ ВСІХ ПЕРСОНАЖІВ
        const standardEars = `
            <g class="ears-group">
                <g class="ear-left">
                    <path d="M 80 110 Q 40 20 80 20 Q 100 40 95 110 Z" fill="#ffffff"/>
                    <path d="M 82 105 Q 55 35 80 35 Q 90 45 90 105 Z" fill="#ffb3b3"/>
                </g>
                <g class="ear-right">
                    <path d="M 120 110 Q 160 20 120 20 Q 100 40 105 110 Z" fill="#ffffff"/>
                    <path d="M 118 105 Q 145 35 120 35 Q 110 45 110 105 Z" fill="#ffb3b3"/>
                </g>
            </g>
        `;

        function getBalloonSVG(color, delay) {
            return `
                <svg class="balloon-icon" style="animation-delay: ${delay}s" viewBox="0 0 100 150">
                    <defs>
                        <radialGradient id="ballGrad${color.replace('#','')}" cx="35%" cy="30%" r="60%">
                            <stop offset="0%" stop-color="#ffffff" />
                            <stop offset="30%" stop-color="${color}" />
                            <stop offset="100%" stop-color="#222" />
                        </radialGradient>
                    </defs>
                    <path d="M 50 110 Q 60 130 40 145" stroke="#f0e6d2" stroke-width="4" fill="none" />
                    <polygon points="43,105 57,105 50,115" fill="${color}"/>
                    <ellipse cx="50" cy="55" rx="45" ry="55" fill="url(#ballGrad${color.replace('#','')})" />
                </svg>
            `;
        }

        // КУЩ ЗБІЛЬШЕНО
        function getBushSVG() {
            return `
                <svg class="bush-svg" viewBox="0 0 200 250">
                    <defs>
                        <radialGradient id="bushGrad" cx="40%" cy="30%" r="60%">
                            <stop offset="0%" stop-color="#7cfc00" />
                            <stop offset="70%" stop-color="#228b22" />
                            <stop offset="100%" stop-color="#006400" />
                        </radialGradient>
                        <filter id="bushShadow">
                            <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
                        </filter>
                    </defs>
                    <g filter="url(#bushShadow)">
                        <circle cx="100" cy="130" r="60" fill="url(#bushGrad)"/>
                        <circle cx="45" cy="170" r="55" fill="url(#bushGrad)"/>
                        <circle cx="155" cy="170" r="55" fill="url(#bushGrad)"/>
                        <ellipse cx="100" cy="210" rx="100" ry="40" fill="url(#bushGrad)"/>
                        
                        <!-- Ягідки -->
                        <g fill="#ff3333">
                            <circle cx="60" cy="150" r="7"/><circle cx="58" cy="148" r="2" fill="#fff"/>
                            <circle cx="140" cy="160" r="7"/><circle cx="138" cy="158" r="2" fill="#fff"/>
                            <circle cx="100" cy="110" r="7"/><circle cx="98" cy="108" r="2" fill="#fff"/>
                        </g>
                    </g>
                </svg>
            `;
        }

        function getBunnySVG(number) {
            return `
                <svg class="character-svg" viewBox="0 0 200 250">
                    ${standardEars}
                    <!-- Тіло -->
                    <ellipse cx="100" cy="195" rx="60" ry="55" fill="#ffffff" />
                    <!-- Пузико -->
                    <ellipse cx="100" cy="205" rx="40" ry="35" fill="#ffe6e6" />
                    <text x="100" y="220" font-size="38" font-family="'Comic Sans MS', cursive" font-weight="bold" fill="#ff4d4d" text-anchor="middle">${number}</text>
                    <!-- Голова -->
                    <ellipse cx="100" cy="135" rx="50" ry="45" fill="#ffffff" />
                    <!-- Очі -->
                    <g class="eye-blink">
                        <circle cx="78" cy="125" r="10" fill="#ffffff" stroke="#000" stroke-width="2"/>
                        <circle cx="122" cy="125" r="10" fill="#ffffff" stroke="#000" stroke-width="2"/>
                        <circle class="pupil" cx="78" cy="125" r="5" fill="#000" data-base-x="78" data-base-y="125" data-range="3"/>
                        <circle class="pupil" cx="122" cy="125" r="5" fill="#000" data-base-x="122" data-base-y="125" data-range="3"/>
                        <circle cx="76" cy="123" r="1.5" fill="#fff"/>
                        <circle cx="120" cy="123" r="1.5" fill="#fff"/>
                    </g>
                    <!-- Мордочка -->
                    <polygon points="95,140 105,140 100,147" fill="#ff9999"/>
                    <path d="M 90 152 Q 100 162 110 152" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
            `;
        }

        function getMonsterSVG(number, type) {
            const color = type === 1 ? '#9933ff' : '#ff7733';
            return `
                <svg class="character-svg monster-svg" viewBox="0 0 200 250">
                    ${standardEars}
                    <!-- Обідок для фальшивих вух -->
                    <path d="M 55 125 Q 100 135 145 125" stroke="#ff3333" stroke-width="5" fill="none"/>
                    <path d="M 55 125 L 80 110 M 145 125 L 120 110" stroke="#ff3333" stroke-width="2"/>
                    
                    <!-- Тіло монстрика -->
                    <path d="M 100 120 C 30 120 40 190 40 250 L 160 250 C 160 190 170 120 100 120 Z" fill="${color}"/>
                    <!-- Пузико -->
                    <ellipse cx="100" cy="210" rx="35" ry="30" fill="#ffffff" opacity="0.9"/>
                    <text x="100" y="222" font-size="35" font-family="'Comic Sans MS', cursive" font-weight="bold" fill="#000000" text-anchor="middle">${number}</text>
                    
                    <g class="eye-blink">
                    ${type === 1 ? `
                        <circle cx="100" cy="155" r="18" fill="#ffffff" stroke="#000" stroke-width="2"/>
                        <circle class="pupil" cx="100" cy="155" r="8" fill="#000" data-base-x="100" data-base-y="155" data-range="6"/>
                    ` : `
                        <circle cx="80" cy="155" r="12" fill="#ffffff" stroke="#000" stroke-width="2"/>
                        <circle cx="120" cy="155" r="12" fill="#ffffff" stroke="#000" stroke-width="2"/>
                        <circle class="pupil" cx="80" cy="155" r="5" fill="#000" data-base-x="80" data-base-y="155" data-range="4"/>
                        <circle class="pupil" cx="120" cy="155" r="5" fill="#000" data-base-x="120" data-base-y="155" data-range="4"/>
                    `}
                    </g>
                    <!-- Ротик -->
                    <path d="M 85 185 Q 100 175 115 185" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                </svg>
            `;
        }

        const teacherInput = document.getElementById('teacher-input');
        const answerInput = document.getElementById('answer-input');
        const objContainer = document.getElementById('objects-container');
        const opDisplay = document.getElementById('operator-display');
        const num2Display = document.getElementById('num2-display');
        const bushesZone = document.getElementById('bushes-zone');
        const toggleSecretBtn = document.getElementById('toggle-secret-btn');

        toggleSecretBtn.onclick = () => {
            teacherInput.classList.toggle('secret-text');
            toggleSecretBtn.innerText = teacherInput.classList.contains('secret-text') ? '👁️' : '🙈';
        };

        function updateGame(num1, op, num2) {
            levelActive = true;
            answerInput.value = '';
            answerInput.style.background = '';
            answerInput.disabled = false;
            answerInput.focus();

            currentCorrectAnswer = op === '+' ? num1 + num2 : num1 - num2;

            opDisplay.innerText = op;
            num2Display.innerText = num2;
            
            objContainer.innerHTML = '';
            const colors = ['#ff4d4d', '#4d79ff', '#32CD32', '#ffb84d', '#b366ff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < num1; i++) {
                objContainer.innerHTML += getBalloonSVG(color, (Math.random() * 0.5).toFixed(2));
            }

            let answers = [currentCorrectAnswer];
            while (answers.length < 3) {
                let wrong = currentCorrectAnswer + (Math.floor(Math.random() * 5) - 2);
                if (wrong !== currentCorrectAnswer && wrong >= 0 && !answers.includes(wrong)) {
                    answers.push(wrong);
                }
            }
            answers.sort(() => Math.random() - 0.5);
            correctAnswerIndex = answers.indexOf(currentCorrectAnswer);

            bushesZone.innerHTML = '';
            pupilElements = [];

            for (let i = 0; i < 3; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'character-wrapper';
                wrapper.onclick = () => {
                    sendGameAction('bush_click', { index: i });
                    processBushClick(i, wrapper);
                };

                if (i === correctAnswerIndex) {
                    wrapper.innerHTML = getBunnySVG(answers[i]);
                } else {
                    wrapper.innerHTML = getMonsterSVG(answers[i], (i % 2) + 1);
                }
                wrapper.innerHTML += getBushSVG();
                bushesZone.appendChild(wrapper);
            }

            setTimeout(() => {
                const svgPupils = document.querySelectorAll('.pupil');
                svgPupils.forEach(p => {
                    pupilElements.push({
                        el: p,
                        baseX: parseFloat(p.getAttribute('data-base-x')),
                        baseY: parseFloat(p.getAttribute('data-base-y')),
                        range: parseFloat(p.getAttribute('data-range')),
                        svg: p.closest('svg')
                    });
                });
            }, 100);
        }

        teacherInput.addEventListener('change', (e) => {
            const val = e.target.value.replace(/\s/g, '');
            const match = val.match(/^(\d+)([\+\-])(\d+)$/);
            if(match) {
                const n1 = parseInt(match[1]), op = match[2], n2 = parseInt(match[3]);
                updateGame(n1, op, n2);
                sendGameAction('update_game', { n1, op, n2 });
            } else {
                const oldBg = teacherInput.style.background;
                teacherInput.style.background = 'rgba(255,0,0,0.5)';
                setTimeout(() => teacherInput.style.background = oldBg, 500);
            }
        });

        function autoGenerateLevel() {
            const isAddition = Math.random() > 0.5;
            let n1, n2, op;
            if (isAddition) {
                n1 = Math.floor(Math.random() * 5) + 1;
                n2 = Math.floor(Math.random() * 5) + 1;
                op = '+';
            } else {
                n1 = Math.floor(Math.random() * 5) + 5;
                n2 = Math.floor(Math.random() * (n1 - 1)) + 1;
                op = '-';
            }
            teacherInput.value = `${n1}${op}${n2}`;
            updateGame(n1, op, n2);
        }

        function handleWin() {
            levelActive = false;
            playSound('win');
            answerInput.value = currentCorrectAnswer;
            answerInput.style.background = 'radial-gradient(circle, #f0fff0 0%, #90ee90 100%)';
            answerInput.disabled = true;

            const wrappers = document.querySelectorAll('.character-wrapper');
            const correctWrapper = wrappers[correctAnswerIndex];
            correctWrapper.querySelector('.bush-svg').classList.add('hidden-bush');
            correctWrapper.querySelector('.character-svg').classList.add('jump-joy');

            setTimeout(autoGenerateLevel, 3500);
        }

        function processBushClick(index, wrapperElement) {
            if (!levelActive) return;
            const bush = wrapperElement.querySelector('.bush-svg');
            if (bush.classList.contains('hidden-bush')) return;

            bush.classList.add('hidden-bush');
            const character = wrapperElement.querySelector('.character-svg');

            if (index === correctAnswerIndex) {
                if(parseInt(answerInput.value) === currentCorrectAnswer || answerInput.value === '') {
                    handleWin();
                } else {
                    playSound('wrong'); 
                    setTimeout(() => { bush.classList.remove('hidden-bush'); }, 1000);
                }
            } else {
                playSound('wrong');
                setTimeout(() => { character.classList.add('run-away'); }, 400);
            }
            playSound('pop');
        }

        answerInput.addEventListener('input', (e) => {
            if (!levelActive) return;
            e.target.value = e.target.value.replace(/[^0-9-]/g, ''); 
            if (parseInt(e.target.value) === currentCorrectAnswer) {
                playSound('pop');
                e.target.style.background = 'radial-gradient(circle, #f0fff0 0%, #90ee90 100%)';
            } else {
                e.target.style.background = 'radial-gradient(circle, #fff3e0 0%, #ffcc80 100%)';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!pupilElements.length) return;
            pupilElements.forEach(pupil => {
                const rect = pupil.svg.getBoundingClientRect();
                const svgCenterX = rect.left + rect.width / 2;
                const svgCenterY = rect.top + rect.height / 2;
                const angle = Math.atan2(e.clientY - svgCenterY, e.clientX - svgCenterX);
                pupil.el.setAttribute('cx', pupil.baseX + Math.cos(angle) * pupil.range);
                pupil.el.setAttribute('cy', pupil.baseY + Math.sin(angle) * pupil.range);
            });
        });

        window.onload = autoGenerateLevel;
    </script>
</body>
</html>
