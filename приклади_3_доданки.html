<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Математичний Ескіз (Синхронізований)</title>
    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --game-width: 1100px;
            --game-height: 600px;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: transparent; 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow: hidden;
            font-family: Arial, sans-serif !important;
            transition: background-image 0.5s ease;
        }

        #gameContainer {
            position: relative;
            width: var(--game-width);
            height: var(--game-height);
            background-color: transparent;
            box-shadow: none; 
            border-radius: 15px;
            transform-origin: center center;
            z-index: 10;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        text {
            font-family: Arial, sans-serif !important;
            user-select: none;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid black;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, transform 0.2s;
            z-index: 20;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        
        .side-btn {
            padding: 15px 20px;
            font-size: 18px;
            border-radius: 15px;
            width: 230px;
            text-align: center;
            box-shadow: 2px 4px 0px rgba(0,0,0,0.2);
        }
        .side-btn:hover { background-color: #f0f0f0; transform: translateY(-2px); }
        .side-btn:active { transform: translateY(2px); box-shadow: 0px 1px 0px rgba(0,0,0,0.2); }

        .circle-btn {
            position: absolute;
            width: 60px; height: 60px; font-size: 28px; bottom: 20px;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }
        .circle-btn:hover { transform: scale(1.1) rotate(5deg); background-color: #f9f9f9; }
        .circle-btn:active { transform: scale(0.95); }
        
        #btnBack { left: 20px; }
        #btnNext { right: 20px; left: auto; } /* Кнопка Далі перенесена направо */

        .interactive-btn { cursor: pointer; }
        .interactive-btn:hover .btn-visual {
            transform: scale(1.05) rotate(-2deg);
        }
        .btn-visual {
            transition: transform 0.2s;
            transform-origin: center;
            transform-box: fill-box;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            75% { transform: translateX(5px) rotate(5deg); }
        }
        .shake-animation .btn-visual { animation: shake 0.4s ease-in-out; }

        /* Theme Manager UI */
        #theme-btn {
            position: fixed; bottom: 20px; right: 20px;
            width: 50px; height: 50px; border-radius: 50%;
            background: #2c3e50; color: white;
            font-size: 24px; border: none; cursor: pointer;
            z-index: 99990; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex; justify-content: center; align-items: center;
        }
        #theme-modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; max-width: 600px; max-height: 60vh;
            background: white; border-radius: 15px; padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 99991;
            overflow-y: auto; flex-direction: column;
            font-family: Arial, sans-serif;
        }
        .theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; margin-top: 15px; }
        .theme-card {
            position: relative; border-radius: 10px; overflow: hidden; cursor: pointer;
            border: 2px solid transparent; transition: 0.2s; height: 80px;
            background-color: #ddd; background-size: cover; background-position: center;
        }
        .theme-card:hover { border-color: #3498db; transform: scale(1.05); }
        .theme-card span {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.6); color: white; font-size: 12px;
            text-align: center; padding: 4px 0; font-family: Arial, sans-serif;
        }
        #theme-modal-close {
            position: absolute; top: 10px; right: 10px; background: none; border: none;
            font-size: 20px; cursor: pointer;
        }
        #theme-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5); z-index: 99990;
        }

        /* Радар & Block Overlay */
        #block-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); z-index: 999999;
            justify-content: center; align-items: center; color: red;
            font-size: 40px; font-family: Arial, sans-serif; font-weight: bold; text-align: center;
        }

        /* Лупа (Масштабування) */
        .zoom-controls {
            position: fixed; top: 20px; left: 20px; display: flex; gap: 10px; z-index: 1000;
        }
        .zoom-btn {
            width: 40px; height: 40px; font-size: 20px; border: none; border-radius: 50%;
            background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.3); cursor: pointer;
        }

        /* Малювання (Глобальне) */
        #draw-canvas-global {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 90000;
        }
        #toggle-draw-btn-global {
            position: fixed; bottom: 85px; right: 20px; background-color: #8e44ad; color: white;
            border: none; border-radius: 20px; padding: 10px 15px; font-size: 16px; cursor: pointer;
            z-index: 90001; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 5px;
            font-family: Arial, sans-serif;
        }
        #draw-panel-global {
            display: none; position: fixed; top: 20px; right: 20px; background: white;
            border-radius: 10px; padding: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 90002;
            width: 150px; font-family: Arial, sans-serif;
        }
        .draw-handle {
            width: 100%; height: 20px; background: #ddd; border-radius: 5px; margin-bottom: 10px;
            cursor: grab; display: flex; justify-content: flex-end; align-items: center; padding-right: 5px; box-sizing: border-box;
        }
        .draw-close { cursor: pointer; font-weight: bold; color: #555; }
        .draw-btn-row { display: flex; gap: 5px; margin-bottom: 10px; }
        .draw-tool-btn { flex: 1; padding: 8px 0; border: 1px solid #ccc; background: #f9f9f9; border-radius: 5px; cursor: pointer; text-align: center;}
        .draw-tool-btn.active { background: #8e44ad; color: white; border-color: #8e44ad; }
        #draw-color, #draw-size { width: 100%; margin-bottom: 10px; cursor: pointer; }
        #draw-clear { width: 100%; padding: 8px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; }

        @media (max-width: 1200px) { #gameContainer { transform: scale(0.9); } }
        @media (max-width: 1000px) { #gameContainer { transform: scale(0.7); } }
        @media (max-width: 800px) { #gameContainer { transform: scale(0.5); } }

        /* Секретні поля вводу */
        .secret-input { color: transparent !important; }
        .secret-input::selection { background: transparent !important; color: transparent !important; }
        .secret-input:focus { outline: none; }
    </style>
</head>
<body>

<div id="block-overlay">Зачекай!<br>Зараз не твій урок.</div>

<div class="zoom-controls">
    <button class="zoom-btn" onclick="zoomGame(0.1)">🔍+</button>
    <button class="zoom-btn" onclick="zoomGame(-0.1)">🔍-</button>
</div>

<button id="theme-btn">⚙️</button>
<div id="theme-overlay"></div>
<div id="theme-modal">
    <button id="theme-modal-close">✕</button>
    <h3 style="margin:0 0 10px 0; font-family: Arial;">Оберіть фон</h3>
    <div class="theme-grid" id="theme-grid">
        <div class="theme-card" onclick="selectTheme('none')" style="background-color: #f0f0f0;">
            <span>Без фону</span>
        </div>
    </div>
</div>

<canvas id="draw-canvas-global"></canvas>
<button id="toggle-draw-btn-global">✏️ Малювати</button>
<div id="draw-panel-global">
    <div class="draw-handle" id="draw-handle"><span class="draw-close" id="draw-close">✕</span></div>
    <div class="draw-btn-row">
        <button class="draw-tool-btn active" id="tool-pencil">✏️</button>
        <button class="draw-tool-btn" id="tool-eraser">🧽</button>
    </div>
    <input type="range" id="draw-size" min="1" max="50" value="5">
    <input type="color" id="draw-color" value="#ff0000">
    <button id="draw-clear">🗑️️ Очистити</button>
</div>

<div id="gameContainer">
    <div style="position: absolute; right: 20px; top: 120px; display: flex; flex-direction: column; gap: 15px; z-index: 20;">
        <button id="btnToggleMode" class="nav-btn side-btn">Режим: Відповідь</button>
        <button id="btnToggleCustom" class="nav-btn side-btn" style="background-color: #fff9c4;">✏️ Власний приклад</button>
    </div>
    
    <!-- Панель для вводу власного прикладу -->
    <div id="customProblemPanel" style="display:none; position:absolute; top:185px; right:20px; background:white; padding:15px; border-radius:10px; border: 3px solid black; z-index:30; font-family: Arial, sans-serif; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
        <div style="margin-bottom: 10px; font-weight: bold;">Приклад (напр. 5+3-2 або 4-1):</div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="customProblemInput" class="secret-input" style="font-size:18px; width:120px; padding:5px; border: 2px solid #ccc; border-radius:5px;" autocomplete="off">
            <button onclick="toggleSecret('customProblemInput')" style="cursor:pointer; font-size:18px; border-radius:5px; border:2px solid #ccc; background:#f9f9f9; width:40px;">👁️</button>
            <button id="applyCustomProblem" style="cursor:pointer; font-size:18px; border-radius:5px; border:2px solid black; background:#a5d6a7; font-weight:bold; padding: 0 10px;">ОК</button>
        </div>
    </div>
    
    <svg id="mathGameCanvas" viewBox="0 0 1100 600">
        <defs>
            <filter id="pencilSketch" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            
            <pattern id="boardPattern" width="15" height="15" patternTransform="rotate(-30 0 0)" patternUnits="userSpaceOnUse">
                <line x1="0" y1="0" x2="0" y2="15" stroke="#e0e0e0" stroke-width="0.5" />
                <line x1="0" y1="0" x2="15" y2="0" stroke="#e0e0e0" stroke-width="0.5" />
            </pattern>

            <pattern id="corkPattern" width="20" height="20" patternUnits="userSpaceOnUse">
                <circle cx="10" cy="10" r="1.5" fill="#c4a47c"/>
                <circle cx="4" cy="5" r="1" fill="#a8855a"/>
                <circle cx="16" cy="15" r="2" fill="#d4b48c"/>
            </pattern>
        </defs>

        <g id="bgLayer" filter="url(#pencilSketch)"></g>
        <g id="boardLayer" filter="url(#pencilSketch)"></g>
        <g id="answersLayer"></g>
        <g id="characterLayer" filter="url(#pencilSketch)"></g>
        <g id="fxLayer"></g>
    </svg>

    <button id="btnBack" class="nav-btn circle-btn" aria-label="Попереднє завдання">⬅</button>
    <button id="btnNext" class="nav-btn circle-btn" aria-label="Наступне завдання">➡</button>
</div>

<script>
// --- КОНФІГУРАЦІЯ ПРОЄКТУ ---
const CONFIG = {
    gameId: "math_sketch_v6", // Унікальний ID гри
    projectId: "lesson-13c44"
};

const firebaseConfig = { databaseURL: `https://${CONFIG.projectId}-default-rtdb.firebaseio.com/` };
let db;
let firebaseEnabled = false;

try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    firebaseEnabled = true;
    console.log("Firebase підключено");
} catch(e) {
    console.log("Локальний режим", e);
}

const urlParams = new URLSearchParams(window.location.search);
let myName = urlParams.get('user') || sessionStorage.getItem('userName');
if (!myName) {
    myName = "Гість_" + Math.floor(Math.random() * 1000);
}
sessionStorage.setItem('userName', myName);

let myTabId = sessionStorage.getItem('tabId');
if (!myTabId) {
    myTabId = Date.now().toString() + '_' + Math.floor(Math.random()*10000);
    sessionStorage.setItem('tabId', myTabId);
}

let isJustStarted = true;
setTimeout(() => { isJustStarted = false; }, 1000);

if (firebaseEnabled) {
    const userRef = db.ref(`online_users/${myName}/${myTabId}`);
    const connectedRef = db.ref('.info/connected');
    
    connectedRef.on('value', (snap) => {
        if (snap.val() === true) {
            userRef.set(true);
            userRef.onDisconnect().remove();
        }
    });

    window.addEventListener('beforeunload', () => { userRef.remove(); });

    db.ref(`force_refresh/${myName}`).on('value', (snap) => {
        if (snap.val()) {
            window.location.reload();
            db.ref(`force_refresh/${myName}`).remove();
        }
    });

    db.ref(`blocked_users/${myName}`).on('value', (snap) => {
        document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
    });

    db.ref('current_activity').on('value', (snap) => {
        if (isJustStarted) return;
        if (snap.val() === 'lobby') {
            window.location.href = `https://olgazheltvai2.github.io/rizne/lobby.html?user=${encodeURIComponent(myName)}`;
        }
    });
}

// 100% СИНХРОНІЗАЦІЯ СТАНУ ГРИ
let currentProblem = {};
let gameMode = 'answer';
let signSlots = [null, null];
let activeSignSlot = 0;
let levelHistory = [];
let isAnimating = false;

if (firebaseEnabled) {
    // Читаємо глобальний стан для цієї гри, щоб у всіх були однакові приклади
    db.ref(`game_states/${CONFIG.gameId}`).on('value', (snap) => {
        const state = snap.val();
        if (state && !isAnimating) {
            currentProblem = state.problem;
            gameMode = state.mode;
            signSlots = state.signSlots || [null, null];
            activeSignSlot = state.activeSignSlot || 0;
            
            document.getElementById('btnToggleMode').innerText = gameMode === 'answer' ? 'Режим: Відповідь' : 'Режим: Розстав знаки';
            renderBoard(currentProblem);
            renderAnswers(generateOptions(currentProblem));
        }
    });
}

function updateGameStateRemote() {
    if (firebaseEnabled) {
        db.ref(`game_states/${CONFIG.gameId}`).set({
            problem: currentProblem,
            mode: gameMode,
            signSlots: signSlots,
            activeSignSlot: activeSignSlot
        });
    }
}

// Події (анімації та миттєві дії)
function sendGameAction(type, data) {
    if (!firebaseEnabled) return;
    db.ref(`game_action`).set({
        senderId: myTabId, timestamp: firebase.database.ServerValue.TIMESTAMP, type: type, data: data
    });
}

let lastProcessedAction = 0;
if (firebaseEnabled) {
    db.ref(`game_action`).on('value', (snap) => {
        const action = snap.val();
        if (!action) return;
        const isRemoteAction = action.senderId !== myTabId;
        if (isRemoteAction && action.timestamp > lastProcessedAction) {
            lastProcessedAction = action.timestamp;
            handleRemoteAction(action);
        }
    });
}

function handleRemoteAction(action) {
    if (action.type === 'check_answer') {
        const selectedOpt = action.data.selected;
        const btnGroup = Array.from(document.querySelectorAll('.interactive-btn')).find(g => {
            const t = g.querySelector('text');
            return t && t.textContent.trim() === String(selectedOpt);
        });
        if(btnGroup) checkAnswer(selectedOpt, btnGroup, true);
    } else if (action.type === 'check_signs') {
        checkSigns(null, true);
    } else if (action.type === 'trigger_fail') {
        triggerFail(document.body);
    }
}

// --- СИСТЕМА ДИНАМІЧНИХ ФОНІВ ---
const themeBtn = document.getElementById('theme-btn');
const themeModal = document.getElementById('theme-modal');
const themeOverlay = document.getElementById('theme-overlay');
const themeClose = document.getElementById('theme-modal-close');
const themeGrid = document.getElementById('theme-grid');

themeBtn.onclick = () => { themeModal.style.display = 'flex'; themeOverlay.style.display = 'block'; };
themeClose.onclick = themeOverlay.onclick = () => { themeModal.style.display = 'none'; themeOverlay.style.display = 'none'; };

function applyTheme(url) {
    if (url === 'none') {
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = '#f0f0f0';
    } else {
        document.body.style.backgroundImage = `url(${url})`;
        document.body.style.backgroundColor = 'transparent';
    }
}

function selectTheme(url, isRemote = false) {
    applyTheme(url);
    localStorage.setItem('mySavedBg_' + CONFIG.gameId, url);
    themeModal.style.display = 'none'; themeOverlay.style.display = 'none';
    if (firebaseEnabled && !isRemote) db.ref('game_theme').set(url);
}

const savedTheme = localStorage.getItem('mySavedBg_' + CONFIG.gameId);
if (savedTheme) applyTheme(savedTheme);

if (firebaseEnabled) {
    db.ref('game_theme').on('value', (snap) => {
        const url = snap.val();
        if (url) selectTheme(url, true);
    });
}

function checkImageSequence(url) {
    return new Promise((resolve) => {
        const img = new Image(); img.onload = () => resolve(true); img.onerror = () => resolve(false); img.src = url;
    });
}

async function loadBackgrounds() {
    for(let i=1; i<=1000; i++) {
        let url = `https://olgazheltvai2.github.io/images/backgrounds/background_${i}.webp`;
        let exists = await checkImageSequence(url);
        if(exists) {
            let card = document.createElement('div'); card.className = 'theme-card';
            card.style.backgroundImage = `url(${url})`; card.onclick = () => selectTheme(url);
            card.innerHTML = `<span>Фон ${i}</span>`; themeGrid.appendChild(card);
        } else break; 
    }
}
loadBackgrounds();

// --- ІНСТРУМЕНТ МАЛЮВАННЯ (ГЛОБАЛЬНИЙ) ---
const drawCanvas = document.getElementById('draw-canvas-global');
const drawCtx = drawCanvas.getContext('2d');
const toggleDrawBtn = document.getElementById('toggle-draw-btn-global');
const drawPanel = document.getElementById('draw-panel-global');
const drawClose = document.getElementById('draw-close');
const drawHandle = document.getElementById('draw-handle');
let isDrawingMode = false, isDrawing = false, currentTool = 'pencil', lastX = 0, lastY = 0;

function resizeDrawCanvas() { drawCanvas.width = window.innerWidth; drawCanvas.height = window.innerHeight; }
window.addEventListener('resize', resizeDrawCanvas); resizeDrawCanvas();

toggleDrawBtn.onclick = () => { drawPanel.style.display = 'block'; isDrawingMode = true; drawCanvas.style.pointerEvents = 'auto'; };
drawClose.onclick = () => { drawPanel.style.display = 'none'; isDrawingMode = false; drawCanvas.style.pointerEvents = 'none'; };
document.getElementById('tool-pencil').onclick = function() { currentTool = 'pencil'; this.classList.add('active'); document.getElementById('tool-eraser').classList.remove('active'); };
document.getElementById('tool-eraser').onclick = function() { currentTool = 'eraser'; this.classList.add('active'); document.getElementById('tool-pencil').classList.remove('active'); };
document.getElementById('draw-clear').onclick = () => { drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height); if(firebaseEnabled) db.ref('game_action').set({ senderId: myTabId, type: 'clear_canvas', timestamp: Date.now() }); };

let isDraggingPanel = false, panX, panY;
drawHandle.onmousedown = drawHandle.ontouchstart = (e) => { isDraggingPanel = true; let evt = e.touches ? e.touches[0] : e; panX = evt.clientX - drawPanel.offsetLeft; panY = evt.clientY - drawPanel.offsetTop; };
window.onmouseup = window.ontouchend = () => { isDraggingPanel = false; isDrawing = false; };
window.onmousemove = window.ontouchmove = (e) => { if (isDraggingPanel) { let evt = e.touches ? e.touches[0] : e; drawPanel.style.left = (evt.clientX - panX) + 'px'; drawPanel.style.top = (evt.clientY - panY) + 'px'; drawPanel.style.right = 'auto'; } };

function getDrawPos(e) { let evt = e.touches ? e.touches[0] : e; return { x: evt.clientX, y: evt.clientY }; }

drawCanvas.onmousedown = drawCanvas.ontouchstart = (e) => { if(!isDrawingMode) return; isDrawing = true; let pos = getDrawPos(e); lastX = pos.x; lastY = pos.y; };
drawCanvas.onmousemove = drawCanvas.ontouchmove = (e) => {
    if(!isDrawing || !isDrawingMode) return; e.preventDefault(); let pos = getDrawPos(e);
    drawLine(lastX, lastY, pos.x, pos.y, document.getElementById('draw-color').value, document.getElementById('draw-size').value, currentTool);
    if (firebaseEnabled) db.ref('game_action').set({ senderId: myTabId, timestamp: Date.now(), type: 'draw_line', data: { x0: lastX/window.innerWidth, y0: lastY/window.innerHeight, x1: pos.x/window.innerWidth, y1: pos.y/window.innerHeight, color: document.getElementById('draw-color').value, size: document.getElementById('draw-size').value, tool: currentTool } });
    lastX = pos.x; lastY = pos.y;
};
function drawLine(x0, y0, x1, y1, color, size, tool) { drawCtx.beginPath(); drawCtx.moveTo(x0, y0); drawCtx.lineTo(x1, y1); drawCtx.strokeStyle = tool === 'eraser' ? 'rgba(0,0,0,1)' : color; drawCtx.lineWidth = size; drawCtx.lineCap = 'round'; drawCtx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over'; drawCtx.stroke(); drawCtx.closePath(); }
if (firebaseEnabled) { db.ref('game_action').on('value', snap => { let action = snap.val(); if (action && action.senderId !== myTabId) { if (action.type === 'draw_line') { let d = action.data; drawLine(d.x0*window.innerWidth, d.y0*window.innerHeight, d.x1*window.innerWidth, d.y1*window.innerHeight, d.color, d.size, d.tool); } else if (action.type === 'clear_canvas') { drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height); } } }); }

let currentZoom = 1;
function zoomGame(step) { currentZoom += step; if(currentZoom < 0.3) currentZoom = 0.3; if(currentZoom > 2) currentZoom = 2; document.getElementById('gameContainer').style.transform = `scale(${currentZoom})`; }

document.getElementById('btnToggleMode').addEventListener('click', () => {
    gameMode = gameMode === 'answer' ? 'signs' : 'answer';
    startLevel(currentProblem, false); // Перезавантажуємо поточний приклад у новому режимі
});

// Управління Секретними Полями
window.toggleSecret = function(id) {
    const el = document.getElementById(id);
    if (el.classList.contains('secret-input')) { el.classList.remove('secret-input'); } 
    else { el.classList.add('secret-input'); }
};

document.getElementById('btnToggleCustom').addEventListener('click', () => {
    const panel = document.getElementById('customProblemPanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
});

document.getElementById('applyCustomProblem').addEventListener('click', () => {
    let str = document.getElementById('customProblemInput').value;
    const parsed = parseCustomProblem(str);
    if (parsed) {
        document.getElementById('customProblemPanel').style.display = 'none';
        document.getElementById('customProblemInput').value = ''; // очищаємо
        startLevel(parsed, false);
    } else {
        alert("Помилка! Введіть приклад у форматі 5+3 або 10-2+1");
    }
});

function parseCustomProblem(str) {
    str = str.replace(/\s+/g, '');
    let tokens = str.split(/([+-])/);
    if (!tokens || tokens.length < 3) return null;
    let a = parseInt(tokens[0]);
    let op1 = tokens[1];
    let b = parseInt(tokens[2]);
    if (isNaN(a) || isNaN(b) || !['+', '-'].includes(op1)) return null;
    
    let result = op1 === '+' ? a + b : a - b;
    let op2 = null, c = null;
    
    if (tokens.length >= 5) {
        op2 = tokens[3]; 
        c = parseInt(tokens[4]);
        if (isNaN(c) || !['+', '-'].includes(op2)) return null;
        result = op2 === '+' ? result + c : result - c;
    }
    return { a, op1, b, op2, c, result };
}

const audioContext = new (window.AudioContext || window.webkitAudioContext)();
function playSynthSound(type) {
    if(audioContext.state === 'suspended') audioContext.resume();
    const osc = audioContext.createOscillator(); const gainNode = audioContext.createGain();
    osc.connect(gainNode); gainNode.connect(audioContext.destination); const now = audioContext.currentTime;
    if (type === 'correct') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554.37, now + 0.1); osc.frequency.setValueAtTime(659.25, now + 0.2); osc.frequency.setValueAtTime(880, now + 0.3); gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.5, now + 0.05); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5); osc.start(now); osc.stop(now + 0.5);
    } else if (type === 'incorrect') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.4); gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4); osc.start(now); osc.stop(now + 0.4);
    }
}

                <line x1="70" y1="90" x2="90" y2="-10" stroke="#32cd32" stroke-width="12" stroke-linecap="round"/>

                <circle cx="0" cy="0" r="45" fill="#ff0800" stroke="black" stroke-width="3"/>

            </g>
            
            <g transform="translate(350, 520) rotate(-4)">

            </g>
        </g>
    `
};

function generateMathProblem() {
    let a, b, c, op1, op2, result;
    let isValid = false;
    while (!isValid) {
        a = Math.floor(Math.random() * 11); b = Math.floor(Math.random() * 11); c = Math.floor(Math.random() * 11);
        op1 = Math.random() > 0.5 ? 1 : -1; op2 = Math.random() > 0.5 ? 1 : -1;
        let step1 = a + (op1 * b); result = step1 + (op2 * c);
        if (step1 >= 0 && step1 <= 10 && result >= 0 && result <= 10) isValid = true;
    }
    return { a: a, op1: op1 === 1 ? '+' : '-', b: b, op2: op2 === 1 ? '+' : '-', c: c, result: result };
}

window.setActiveSlot = function(index) {
    if (gameMode !== 'signs') return;
    activeSignSlot = index;
    renderBoard(currentProblem);
    updateGameStateRemote(); // Синхронізуємо клік на віконце
};

function renderBoard(problem) {
    const boardLayer = document.getElementById('boardLayer');
    const cx = gameConfig.problemPosition.x;
    const cy = gameConfig.problemPosition.y;
    const w = gameConfig.chalkboardSize.width;
    const h = gameConfig.chalkboardSize.height;
    
    let textSVG = "";
    let hasOp2 = problem.op2 !== null;
    
    // Динамічне центрування в залежності від кількості операндів
    let offsets;
    if (hasOp2) {
        offsets = { a: -300, op1: -200, b: -100, op2: 0, c: 100, eq: 200, res: 300 };
    } else {
        offsets = { a: -200, op1: -70, b: 60, eq: 190, res: 310 };
    }
    
    const textY = h/2 + 20; 
    const s0 = signSlots[0] || ' ';
    const s1 = signSlots[1] || ' ';

    if (gameMode === 'answer') {
        textSVG += `
            <text x="${w/2 + offsets.a}" y="${textY}" font-size="80" font-weight="bold" fill="black" text-anchor="middle" pointer-events="none">${problem.a}</text>
            <text x="${w/2 + offsets.op1}" y="${textY}" font-size="80" font-weight="bold" fill="black" text-anchor="middle" pointer-events="none">${problem.op1}</text>
            <text x="${w/2 + offsets.b}" y="${textY}" font-size="80" font-weight="bold" fill="black" text-anchor="middle" pointer-events="none">${problem.b}</text>
        `;
        if (hasOp2) {
            textSVG += `
                <text x="${w/2 + offsets.op2}" y="${textY}" font-size="80" font-weight="bold" fill="black" text-anchor="middle" pointer-events="none">${problem.op2}</text>
                <text x="${w/2 + offsets.c}" y="${textY}" font-size="80" font-weight="bold" fill="black" text-anchor="middle" pointer-events="none">${problem.c}</text>
            `;
        }
        textSVG += `
            <text x="${w/2 + offsets.eq}" y="${textY}" font-size="80" font-weight="bold" fill="black" text-anchor="middle" pointer-events="none">=</text>
            <text x="${w/2 + offsets.res}" y="${textY}" font-size="80" font-weight="bold" fill="black" text-anchor="middle" pointer-events="none">?</text>
        `;
    } else {
        const highlight0 = activeSignSlot === 0 ? "fill='rgba(255,0,0,0.15)' stroke='red'" : "fill='transparent' stroke='black'";
        
        textSVG += `
            <text x="${w/2 + offsets.a}" y="${textY}" font-size="80" font-weight="bold" fill="black" text-anchor="middle" pointer-events="none">${problem.a}</text>
            
            <rect x="${w/2 + offsets.op1 - 35}" y="${textY - 70}" width="70" height="90" ${highlight0} stroke-width="3" rx="10" cursor="pointer" onclick="setActiveSlot(0)" pointer-events="all"/>
            <text x="${w/2 + offsets.op1}" y="${textY - 5}" font-size="80" font-weight="bold" fill="black" text-anchor="middle" pointer-events="none">${s0}</text>
            
            <text x="${w/2 + offsets.b}" y="${textY}" font-size="80" font-weight="bold" fill="black" text-anchor="middle" pointer-events="none">${problem.b}</text>
        `;
        
        if (hasOp2) {
            const highlight1 = activeSignSlot === 1 ? "fill='rgba(255,0,0,0.15)' stroke='red'" : "fill='transparent' stroke='black'";
            textSVG += `
                <rect x="${w/2 + offsets.op2 - 35}" y="${textY - 70}" width="70" height="90" ${highlight1} stroke-width="3" rx="10" cursor="pointer" onclick="setActiveSlot(1)" pointer-events="all"/>
                <text x="${w/2 + offsets.op2}" y="${textY - 5}" font-size="80" font-weight="bold" fill="black" text-anchor="middle" pointer-events="none">${s1}</text>
                <text x="${w/2 + offsets.c}" y="${textY}" font-size="80" font-weight="bold" fill="black" text-anchor="middle" pointer-events="none">${problem.c}</text>
            `;
        }
        
        textSVG += `
            <text x="${w/2 + offsets.eq}" y="${textY}" font-size="80" font-weight="bold" fill="black" text-anchor="middle" pointer-events="none">=</text>
            <text x="${w/2 + offsets.res}" y="${textY}" font-size="80" font-weight="bold" fill="black" text-anchor="middle" pointer-events="none">${problem.result}</text>
        `;
    }

    let html = `
        <g transform="translate(${cx - w/2}, ${cy - h/2})">
            ${svgTemplates.roughLine(w/2, -60, w/4, 0)}
            ${svgTemplates.roughLine(w/2, -60, w*3/4, 0)}
            <circle cx="${w/2}" cy="-60" r="7" fill="black" />
            ${svgTemplates.roughRect(0, 0, w, h, "url(#boardPattern)")}
            ${svgTemplates.roughRect(7, 7, w-14, h-14, "white")}
            ${textSVG}
        </g>
    `;
    boardLayer.innerHTML = html;
}

function generateOptions(problem) {
    if (gameMode === 'answer') {
        let options = new Set([problem.result]);
        while (options.size < 4) {
            let wrong = problem.result + Math.floor(Math.random() * 5) - 2;
            if (wrong >= 0 && wrong <= 15 && wrong !== problem.result) options.add(wrong);
        }
        return Array.from(options).sort(() => Math.random() - 0.5);
    } else {
        return ['+', '-'];
    }
}

function renderAnswers(options) {
    const layer = document.getElementById('answersLayer');
    layer.innerHTML = '';
    const startX = gameMode === 'answer' ? gameConfig.inputButtonsStartPosition.x - 50 : gameConfig.inputButtonsStartPosition.x + 100;
    const startY = gameConfig.inputButtonsStartPosition.y;
    const gap = 180; 
    
    options.forEach((opt, index) => {
        const x = startX + index * gap;
        const y = startY;
        const w = gameConfig.buttonSize.width;
        const h = gameConfig.buttonSize.height;
        
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "interactive-btn");
        g.setAttribute("transform", `translate(${x}, ${y})`);
        
        g.innerHTML = `
            <g class="btn-visual">
                <path d="M0,0 Q${w/2},5 ${w},0 Q${w-5},${h/2} ${w},${h} Q${w/2},${h-5} 0,${h} Q5,${h/2} 0,0 Z" fill="#fff9c4" stroke="black" stroke-width="3"/>
                <text x="${w/2}" y="${h/2 + 20}" font-size="54" font-weight="bold" fill="black" text-anchor="middle" pointer-events="none">${opt}</text>
            </g>
            <rect x="0" y="0" width="${w}" height="${h}" fill="transparent" pointer-events="all"/>
        `;
        
        g.onclick = () => {
            if (!isAnimating) {
                checkAnswer(opt, g, false);
                sendGameAction('check_answer', { selected: opt });
            }
        };
        layer.appendChild(g);
    });

    if (gameMode === 'signs') {
        // Кнопка "ПЕРЕВІРИТИ" для режиму знаків
        const px = startX + options.length * gap;
        const gCheck = document.createElementNS("http://www.w3.org/2000/svg", "g");
        gCheck.setAttribute("class", "interactive-btn");
        gCheck.setAttribute("transform", `translate(${px}, ${startY})`);
        gCheck.innerHTML = `
            <g class="btn-visual">
                <rect x="0" y="0" width="220" height="90" fill="#a5d6a7" stroke="black" stroke-width="3" rx="15"/>
                <text x="110" y="55" font-size="32" font-weight="bold" fill="black" text-anchor="middle" pointer-events="none">ПЕРЕВІРИТИ</text>
            </g>
            <rect x="0" y="0" width="220" height="90" fill="transparent" pointer-events="all"/>
        `;
        gCheck.onclick = () => {
            checkSigns(gCheck, false);
            sendGameAction('check_signs', {});
        };
        layer.appendChild(gCheck);
    }
}

function renderSuccessEffects() {
    const layer = document.getElementById('fxLayer');
    layer.innerHTML = '';
    for(let i=0; i<30; i++) {
        const x = Math.random() * 1100;
        const y = Math.random() * 600;
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.innerHTML = svgTemplates.roughLine(x, y, x + Math.random()*20-10, y + Math.random()*20-10);
        layer.appendChild(g);
        setTimeout(() => {
            g.style.transform = `translateY(${Math.random()*200 + 100}px) rotate(${Math.random()*360}deg)`;
            g.style.opacity = '0';
            g.style.transition = 'all 1s ease-out';
        }, 50);
    }
    setTimeout(() => { layer.innerHTML = ''; }, 1100);
}

function checkAnswer(selected, elementGroup, isRemote = false) {
    if (isAnimating) return;
    
    if (gameMode === 'answer') {
        if (selected === currentProblem.result) triggerWin(elementGroup, isRemote);
        else triggerFail(elementGroup);
    } else {
        // У режимі знаків просто заповнюємо активний слот і перемикаємось
        signSlots[activeSignSlot] = selected;
        let hasOp2 = currentProblem.op2 !== null;
        
        if (activeSignSlot === 0 && hasOp2) activeSignSlot = 1;
        else if (activeSignSlot === 1) activeSignSlot = 0;
        else if (!hasOp2) activeSignSlot = 0;

        renderBoard(currentProblem);
        if (!isRemote) updateGameStateRemote(); // Синхронізуємо зміну знаків усім
    }
}

function checkSigns(btnElement, isRemote = false) {
    if (isAnimating) return;
    let hasOp2 = currentProblem.op2 !== null;
    let isCorrect = false;

    if (!hasOp2) {
        if (signSlots[0] === currentProblem.op1) isCorrect = true;
    } else {
        if (signSlots[0] === currentProblem.op1 && signSlots[1] === currentProblem.op2) isCorrect = true;
    }
    
    if (isCorrect) triggerWin(btnElement || document.body, isRemote);
    else {
        triggerFail(btnElement || document.body);
        if (!isRemote) sendGameAction('trigger_fail', {}); // Блимаємо червоним усім
    }
}

function triggerWin(elementGroup, isRemote) {
    isAnimating = true;
    playSynthSound('correct');
    renderSuccessEffects();
    if (elementGroup && elementGroup.querySelector('text')) {
        elementGroup.querySelector('text').setAttribute('fill', '#00cc00');
    }
    setTimeout(() => {
        if(!isRemote) {
            let nextProb = generateMathProblem();
            startLevel(nextProb, false);
        }
        isAnimating = false;
    }, 1500);
}

function triggerFail(elementGroup) {
    playSynthSound('incorrect');
    if (elementGroup && elementGroup.classList) {
        elementGroup.classList.add('shake-animation');
        setTimeout(() => { elementGroup.classList.remove('shake-animation'); }, 500);
    }
}

function startLevel(problem = null, isRemote = false) {
    if (!problem) problem = generateMathProblem();
    if (!isRemote && !levelHistory.includes(problem)) levelHistory.push(problem);
    
    currentProblem = problem;
    signSlots = [null, null];
    activeSignSlot = 0;
    
    renderBoard(currentProblem);
    renderAnswers(generateOptions(currentProblem));
    
    // Синхронізуємо новий стан
    if (!isRemote) updateGameStateRemote();
}

document.getElementById('btnNext').addEventListener('click', () => {
    if (isAnimating) return;
    let newProb = generateMathProblem();
    startLevel(newProb, false);
});

document.getElementById('btnBack').addEventListener('click', () => {
    if (isAnimating) return;
    if (levelHistory.length > 1) {
        levelHistory.pop();
        let prevProb = levelHistory[levelHistory.length - 1];
        startLevel(prevProb, false);
    }
});

window.onload = () => {
    document.getElementById('bgLayer').innerHTML = svgTemplates.background();
    
    // Запускаємо тільки якщо ми не підключені до Firebase (щоб не перезаписати чужий приклад)
    // Якщо firebaseEnabled == true, то перший рівень підтягнеться через db.on('value')
    if (!firebaseEnabled) {
        startLevel();
    }
};
