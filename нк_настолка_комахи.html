<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Луг</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #1a3314;
  }

  #game-viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* Живий фон на Canvas */
  #meadow-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Світ дошки, що рухається */
  #world-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  /* UI панель завдання (стилізована під природні об'єкти, жодних білих прямокутників) */
  #task-stage {
    position: absolute;
    top: 4%;
    left: 50%;
    transform: translateX(-50%);
    width: min(92vw, 1180px);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    pointer-events: none;
  }

  /* Гілка-основа для виразу */
  .bark-board {
    position: relative;
    pointer-events: auto;
    padding: 22px 48px;
    border-radius: 65px 45px 70px 40px / 38px 55px 35px 50px;
    background: 
      radial-gradient(ellipse at 25% 25%, rgba(168, 121, 72, 0.45), transparent 60%),
      radial-gradient(ellipse at 80% 75%, rgba(62, 38, 18, 0.7), transparent 65%),
      repeating-linear-gradient(12deg, #4e3219 0px, #4e3219 6px, #3b2310 6px, #3b2310 14px, #5a3a1e 14px, #5a3a1e 20px);
    box-shadow: 
      0 14px 28px rgba(10, 22, 6, 0.65),
      inset 0 4px 10px rgba(235, 195, 140, 0.35),
      inset 0 -8px 16px rgba(24, 12, 4, 0.8);
    border: 4px solid #2d1a0b;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Мох на корі */
  .bark-board::before {
    content: '';
    position: absolute;
    top: -8px;
    left: 28px;
    width: 110px;
    height: 22px;
    background: radial-gradient(circle at 30% 50%, #689f38, #33691e 80%);
    border-radius: 50% 60% 40% 50%;
    box-shadow: 40px 3px 0 -4px #558b2f, -15px 4px 0 -5px #7cb342;
    pointer-events: none;
  }

  .bark-board::after {
    content: '';
    position: absolute;
    bottom: -7px;
    right: 45px;
    width: 85px;
    height: 18px;
    background: radial-gradient(circle at 50% 50%, #7cb342, #33691e 85%);
    border-radius: 60% 40% 55% 45%;
    box-shadow: -30px -2px 0 -3px #558b2f;
    pointer-events: none;
  }

  /* Елементи математичного виразу (камінці, жолуді, краплі бурштину/роси) */
  .eq-part {
    position: relative;
    min-width: 86px;
    height: 76px;
    padding: 0 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(28px, 3.2vw, 44px);
    font-weight: 800;
    color: #fef3c7;
    text-shadow: 0 2px 4px rgba(0,0,0,0.75);
    border-radius: 46% 54% 48% 52% / 55% 45% 55% 45%;
    background: radial-gradient(circle at 35% 28%, #8d6e63, #4e342e 70%, #271815 100%);
    box-shadow: 
      0 6px 12px rgba(0,0,0,0.5),
      inset 0 3px 6px rgba(255,255,255,0.28),
      inset 0 -5px 8px rgba(0,0,0,0.6);
    border: 2px solid #3e2723;
    transition: all 0.25s ease;
  }

  .eq-sign {
    min-width: 54px;
    height: 54px;
    padding: 0;
    font-size: clamp(28px, 3vw, 40px);
    background: radial-gradient(circle at 35% 30%, #a1887f, #5d4037 75%);
    color: #fff8e1;
    border-radius: 50%;
  }

  /* Виділений компонент у Режимі 1 (під краплею роси / бурштиновою лінзою) */
  .eq-part.target-highlight {
    background: 
      radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 26%),
      radial-gradient(circle at 50% 45%, #ffd54f 0%, #ff8f00 68%, #bf360c 100%);
    color: #2b1200;
    text-shadow: 0 1px 2px rgba(255, 255, 255, 0.7);
    border: 3px solid #ffe082;
    transform: scale(1.14);
    box-shadow: 
      0 0 25px rgba(255, 193, 7, 0.75),
      0 10px 18px rgba(0,0,0,0.5),
      inset 0 4px 10px rgba(255,255,255,0.75);
    animation: dewPulse 2s infinite ease-in-out;
  }

  /* Інтерактивні числа у Режимі 2 */
  .eq-part.clickable-number {
    cursor: pointer;
    background: 
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.45) 0%, transparent 25%),
      radial-gradient(circle at 50% 45%, #5c8d24, #2e5210 75%, #172b06 100%);
    border: 3px solid #9ccc65;
  }

  .eq-part.clickable-number:hover {
    transform: translateY(-6px) scale(1.08);
    box-shadow: 0 12px 22px rgba(0,0,0,0.6), 0 0 18px rgba(156, 204, 101, 0.65);
    background: 
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.6) 0%, transparent 25%),
      radial-gradient(circle at 50% 45%, #7cb342, #33691e 75%, #1b3b08 100%);
  }

  @keyframes dewPulse {
    0%, 100% { transform: scale(1.13); box-shadow: 0 0 22px rgba(255, 193, 7, 0.7), 0 8px 16px rgba(0,0,0,0.5); }
    50% { transform: scale(1.2); box-shadow: 0 0 34px rgba(255, 213, 79, 0.95), 0 12px 20px rgba(0,0,0,0.55); }
  }

  /* Плашка-листок для запитання у Режимі 2 */
  .leaf-prompt-banner {
    pointer-events: auto;
    position: relative;
    padding: 12px 38px;
    border-radius: 50px 15px 50px 15px;
    background: 
      linear-gradient(135deg, #43a047 0%, #2e7d32 50%, #1b5e20 100%);
    border: 3px solid #81c784;
    box-shadow: 
      0 8px 20px rgba(0,0,0,0.5),
      inset 0 2px 8px rgba(255,255,255,0.35);
    color: #f1f8e9;
    font-size: clamp(22px, 2.4vw, 32px);
    font-weight: 800;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.65);
    display: none;
    align-items: center;
    gap: 14px;
  }

  /* Варіанти відповідей у вигляді живих листочків та пелюсток */
  #choices-container {
    pointer-events: auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    max-width: 1050px;
  }

  .leaf-choice {
    position: relative;
    cursor: pointer;
    padding: 15px 30px;
    border-radius: 42px 14px 46px 16px;
    font-size: clamp(19px, 2vw, 26px);
    font-weight: 800;
    color: #fffde7;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
    background: 
      repeating-linear-gradient(115deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 2px, transparent 2px, transparent 12px),
      radial-gradient(ellipse at 30% 30%, #66bb6a, #2e7d32 65%, #1b4d20 100%);
    border: 3px solid #a5d6a7;
    box-shadow: 
      0 8px 16px rgba(12, 28, 8, 0.55),
      inset 0 3px 6px rgba(255, 255, 255, 0.35),
      inset 0 -4px 8px rgba(0, 0, 0, 0.45);
    transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
  }

  .leaf-choice:nth-child(even) {
    border-radius: 16px 46px 14px 42px;
    background: 
      repeating-linear-gradient(65deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 2px, transparent 2px, transparent 12px),
      radial-gradient(ellipse at 70% 30%, #7cb342, #33691e 65%, #1c3d0f 100%);
    border-color: #c5e1a5;
  }

  /* Прожилка листка */
  .leaf-choice::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 10px;
    right: 10px;
    height: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0.35), rgba(255,255,255,0.08));
    transform: translateY(-50%) rotate(-2deg);
    pointer-events: none;
  }

  .leaf-choice:hover {
    transform: translateY(-5px) scale(1.06) rotate(-1deg);
    box-shadow: 
      0 14px 24px rgba(10, 24, 6, 0.7),
      0 0 18px rgba(165, 214, 167, 0.5),
      inset 0 3px 8px rgba(255, 255, 255, 0.5);
    filter: brightness(1.1);
  }

  .leaf-choice:active {
    transform: translateY(1px) scale(0.97);
  }

  /* Анімація помилки */
  .shake-error {
    animation: leafShake 0.48s cubic-bezier(0.36, 0.07, 0.19, 0.97) both !important;
    background: radial-gradient(ellipse at 50% 50%, #c62828, #6d1010 85%) !important;
    border-color: #ef9a9a !important;
  }

  @keyframes leafShake {
    10%, 90% { transform: translate3d(-5px, 0, 0) rotate(-3deg); }
    20%, 80% { transform: translate3d(6px, 0, 0) rotate(3deg); }
    30%, 50%, 70% { transform: translate3d(-8px, 0, 0) rotate(-4deg); }
    40%, 60% { transform: translate3d(8px, 0, 0) rotate(4deg); }
  }

  /* Мінімалістична кнопка "Далі" (стилізований листок зі стрілкою з гілочки) */
  #next-btn {
    position: fixed;
    bottom: 24px;
    right: 26px;
    width: 74px;
    height: 64px;
    z-index: 30;
    cursor: pointer;
    border: none;
    background: transparent;
    padding: 0;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s;
    filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.6));
  }

  #next-btn:hover {
    transform: scale(1.12) translateX(4px);
    filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.75)) brightness(1.12);
  }

  #next-btn:active {
    transform: scale(0.94);
  }

  /* Кнопка зміни комахи-фішки (мініатюрний медальйон з корою внизу зліва) */
  #insect-switcher {
    position: fixed;
    bottom: 24px;
    left: 26px;
    width: 68px;
    height: 68px;
    z-index: 30;
    cursor: pointer;
    border-radius: 50%;
    background: 
      radial-gradient(circle at 30% 30%, #8d6e63, #3e2723 80%);
    border: 3px solid #a1887f;
    box-shadow: 0 8px 18px rgba(0,0,0,0.65), inset 0 2px 6px rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #insect-switcher:hover {
    transform: scale(1.12) rotate(8deg);
  }

  /* Шар для ефектів зворотного зв'язку */
  #fx-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 25;
    pointer-events: none;
  }

  /* SVG-контейнер для ігрової стежки та комах */
  #board-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .Interactive-token {
    cursor: pointer;
    pointer-events: auto;
  }
</style>
</head>
<body>

<div id="game-viewport">
  <canvas id="meadow-canvas"></canvas>

  <div id="world-layer">
    <svg id="board-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- Градієнти для реалістичних комах та природних платформ -->
        <radialGradient id="stoneGrad" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#90a4ae"/>
          <stop offset="55%" stop-color="#546e7a"/>
          <stop offset="100%" stop-color="#263238"/>
        </radialGradient>

        <radialGradient id="woodSliceGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#d7ccc8"/>
          <stop offset="35%" stop-color="#bcaaa4"/>
          <stop offset="68%" stop-color="#8d6e63"/>
          <stop offset="85%" stop-color="#5d4037"/>
          <stop offset="100%" stop-color="#3e2723"/>
        </radialGradient>

        <radialGradient id="lilyGrad" cx="45%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#9ccc65"/>
          <stop offset="60%" stop-color="#558b2f"/>
          <stop offset="100%" stop-color="#2e5718"/>
        </radialGradient>

        <radialGradient id="mushroomGrad" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#ffcc80"/>
          <stop offset="45%" stop-color="#ca6f1e"/>
          <stop offset="100%" stop-color="#6e2c00"/>
        </radialGradient>

        <!-- Жук-олень (Lucanus cervus) -->
        <linearGradient id="stagElytra" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7b241c"/>
          <stop offset="35%" stop-color="#511610"/>
          <stop offset="70%" stop-color="#380e0a"/>
          <stop offset="100%" stop-color="#1f0705"/>
        </linearGradient>
        <radialGradient id="stagThorax" cx="40%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#3d342f"/>
          <stop offset="60%" stop-color="#1c1613"/>
          <stop offset="100%" stop-color="#0a0807"/>
        </radialGradient>
        <linearGradient id="stagHorn" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#641e16"/>
          <stop offset="50%" stop-color="#922b21"/>
          <stop offset="100%" stop-color="#3b100c"/>
        </linearGradient>

        <!-- Сонечко семикрапкове (Coccinella septempunctata) -->
        <radialGradient id="ladybirdShell" cx="35%" cy="28%" r="68%">
          <stop offset="0%" stop-color="#ff6f60"/>
          <stop offset="28%" stop-color="#e53935"/>
          <stop offset="75%" stop-color="#b71c1c"/>
          <stop offset="100%" stop-color="#5f0909"/>
        </radialGradient>

        <!-- Махаон (Papilio machaon) -->
        <linearGradient id="machaonWing" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fff9c4"/>
          <stop offset="55%" stop-color="#ffee58"/>
          <stop offset="100%" stop-color="#fbc02d"/>
        </linearGradient>

        <!-- Бабка-красуня (Calopteryx splendens) -->
        <linearGradient id="dragonflyBody" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00e5ff"/>
          <stop offset="50%" stop-color="#00897b"/>
          <stop offset="100%" stop-color="#004d40"/>
        </linearGradient>
        <radialGradient id="dragonflyWingSpot" cx="55%" cy="50%" r="48%">
          <stop offset="0%" stop-color="rgba(13, 71, 161, 0.78)"/>
          <stop offset="65%" stop-color="rgba(26, 35, 126, 0.55)"/>
          <stop offset="100%" stop-color="rgba(255, 255, 255, 0.12)"/>
        </radialGradient>

        <!-- Бронзівка золотиста (Cetonia aurata) -->
        <radialGradient id="cetoniaGrad" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#b9f6ca"/>
          <stop offset="25%" stop-color="#00c853"/>
          <stop offset="65%" stop-color="#1b5e20"/>
          <stop offset="88%" stop-color="#827717"/>
          <stop offset="100%" stop-color="#102912"/>
        </radialGradient>

        <!-- Тінь під об'єктами -->
        <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#091405" flood-opacity="0.65"/>
        </filter>
        <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
      </defs>

      <!-- Група всього ігрового шляху, що зсувається камерно -->
      <g id="camera-group">
        <g id="trail-connections"></g>
        <g id="trail-nodes"></g>
        <g id="ambient-meadow-bugs"></g>
        <g id="player-token" class="Interactive-token" filter="url(#dropShadow)"></g>
      </g>
    </svg>
  </div>

  <!-- Інтерактивна зона завдання -->
  <div id="task-stage">
    <div id="equation-board" class="bark-board"></div>
    <div id="mode2-prompt" class="leaf-prompt-banner"></div>
    <div id="choices-container"></div>
  </div>

  <!-- Кнопка перемикання комахи-героя -->
  <div id="insect-switcher" title="">
    <svg width="48" height="48" viewBox="-50 -50 100 100" id="switcher-icon"></svg>
  </div>

  <!-- Мінімалістична кнопка "Далі" без слів -->
  <button id="next-btn" aria-label="Next">
    <svg viewBox="0 0 110 90" width="100%" height="100%">
      <path d="M8,45 C12,15 55,5 98,42 C60,82 15,75 8,45 Z" fill="url(#lilyGrad)" stroke="#c5e1a5" stroke-width="3.5"/>
      <path d="M18,44 Q52,42 88,42" stroke="rgba(255,255,255,0.35)" stroke-width="2" fill="none"/>
      <path d="M36,27 L58,43 L36,59" fill="none" stroke="#fff9c4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M56,27 L78,43 L56,59" fill="none" stroke="#ffd54f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <canvas id="fx-canvas"></canvas>
</div>

<script>
(() => {
  /* =========================================================================
     1. WEB AUDIO СИНТЕЗАТОР ПРИРОДНИХ ЗВУКІВ (без зовнішніх файлів)
     ========================================================================= */
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  const SoundFX = {
    playSuccess(variant = 0) {
      ensureAudio();
      const now = audioCtx.currentTime;
      const scales = [
        [523.25, 659.25, 783.99, 1046.50, 1318.51],
        [587.33, 739.99, 880.00, 1174.66, 1479.98],
        [440.00, 554.37, 659.25, 880.00, 1108.73],
        [493.88, 622.25, 739.99, 987.77, 1244.51]
      ];
      const notes = scales[variant % scales.length];

      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.065);

        gain.gain.setValueAtTime(0.001, now + idx * 0.065);
        gain.gain.exponentialRampToValueAtTime(0.18, now + idx * 0.065 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.065 + 0.45);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.065);
        osc.stop(now + idx * 0.065 + 0.48);
      });

      // Тріпотіння крилець / крапля роси
      const dropOsc = audioCtx.createOscillator();
      const dropGain = audioCtx.createGain();
      dropOsc.type = 'sine';
      dropOsc.frequency.setValueAtTime(900, now + 0.15);
      dropOsc.frequency.exponentialRampToValueAtTime(2200, now + 0.32);
      dropGain.gain.setValueAtTime(0.12, now + 0.15);
      dropGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      dropOsc.connect(dropGain);
      dropGain.connect(audioCtx.destination);
      dropOsc.start(now + 0.15);
      dropOsc.stop(now + 0.36);
    },

    playError() {
      ensureAudio();
      const now = audioCtx.currentTime;
      // Низьке дзижчання жука / глухий стук по корі
      [155, 130].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now + i * 0.11);
        osc.frequency.linearRampToValueAtTime(freq * 0.78, now + i * 0.11 + 0.12);

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 420;

        gain.gain.setValueAtTime(0.16, now + i * 0.11);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.15);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.11);
        osc.stop(now + i * 0.11 + 0.16);
      });
    },

    playStep() {
      ensureAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(640, now + 0.09);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    }
  };

  /* =========================================================================
     2. ГЕНЕРАТОР ВИСОКОДЕТАЛІЗОВАНИХ РЕАЛІСТИЧНИХ КОМАХ (SVG)
     ========================================================================= */
  const InsectArt = {
    // 0: Жук-олень (Lucanus cervus)

  /* =========================================================================
     3. ГЕНЕРАТОР НЕСКІНЧЕННОЇ СТЕЖКИ НА ЛУЗІ ТА КАМЕРИ
     ========================================================================= */
  const trailNodesGroup = document.getElementById('trail-nodes');
  const trailConnGroup = document.getElementById('trail-connections');
  const ambientBugsGroup = document.getElementById('ambient-meadow-bugs');
  const playerTokenGroup = document.getElementById('player-token');
  const switcherIcon = document.getElementById('switcher-icon');

  let nodes = [];
  let currentStepIndex = 0;
  let selectedInsect = 0;
  let cameraX = 0;
  let targetCameraX = 0;

  // Player animation state
  let playerPos = { x: 350, y: 680, angle: 65, wingPhase: 0, moving: false };
  let moveAnim = null;

  function generateNode(index) {
    const x = 350 + index * 270;
    const wave = Math.sin(index * 0.85) * 145 + Math.cos(index * 0.4) * 55;
    const y = 690 + wave;
    const platformType = index % 4; // 0: камінець, 1: спил дерева, 2: латаття, 3: шапинка гриба
    const rotation = (index * 47) % 360;
    // Сусід-комаха біля деяких клітинок
    const hasCompanion = index % 2 === 1;
    const companionType = (index + 2) % 5;

    return { index, x, y, platformType, rotation, hasCompanion, companionType };
  }

  function renderPlatformSVG(node) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `translate(${node.x}, ${node.y})`);
    g.setAttribute('filter', 'url(#dropShadow)');
    g.dataset.index = node.index;

    let inner = '';
    if (node.platformType === 0) {
      // Річковий плаский камінець з мохом та краплею роси
      inner = `
        <path d="M-58,-12 C-64,-42 -18,-56 24,-48 C62,-40 70,-8 56,24 C42,52 -14,56 -46,36 C-62,24 -54,8 -58,-12 Z" fill="url(#stoneGrad)" stroke="#1c262b" stroke-width="3"/>
        <path d="M-36,-26 C-12,-38 22,-34 36,-18" stroke="rgba(255,255,255,0.25)" stroke-width="5" stroke-linecap="round" fill="none"/>
        <circle cx="-38" cy="18" r="12" fill="#558b2f"/>
        <circle cx="-26" cy="26" r="9" fill="#689f38"/>
      `;
    } else if (node.platformType === 1) {
      // Дерев'яний спил з річними кільцями
      inner = `
        <ellipse cx="0" cy="0" rx="62" ry="48" fill="url(#woodSliceGrad)" stroke="#2d1a0b" stroke-width="5"/>
        <ellipse cx="0" cy="0" rx="46" ry="35" fill="none" stroke="#6d4c41" stroke-width="2" stroke-dasharray="18 6"/>
        <ellipse cx="0" cy="0" rx="28" ry="21" fill="none" stroke="#6d4c41" stroke-width="2" stroke-dasharray="12 4"/>
        <ellipse cx="0" cy="0" rx="10" ry="8" fill="#5d4037"/>
      `;
    } else if (node.platformType === 2) {
      // Листок латаття / конюшини з прожилками
      inner = `
        <path d="M0,0 L-52,-22 C-68,8 -44,48 0,50 C46,52 68,14 52,-24 C32,-56 -26,-56 -44,-30 Z" fill="url(#lilyGrad)" stroke="#1b3d0c" stroke-width="3"/>
        <path d="M0,0 L0,44 M0,0 L-38,24 M0,0 L38,24 M0,0 L-40,-10 M0,0 L40,-10 M0,0 L0,-40" stroke="rgba(220, 237, 200, 0.35)" stroke-width="2" stroke-linecap="round"/>
      `;
    } else {
      // Шапинка лісового гриба з краплинками
      inner = `
        <ellipse cx="0" cy="4" rx="60" ry="46" fill="url(#mushroomGrad)" stroke="#4a1c00" stroke-width="3.5"/>
        <circle cx="-24" cy="-12" r="7" fill="rgba(255,248,225,0.45)"/>
        <circle cx="22" cy="-8" r="9" fill="rgba(255,248,225,0.4)"/>
        <circle cx="6" cy="20" r="6" fill="rgba(255,248,225,0.4)"/>
      `;
    }

    // Декоративна квітка або суниця біля деяких платформ
    if (node.index % 3 === 0) {
      inner += `
        <g transform="translate(48, -36) scale(0.75)">
          <circle cx="0" cy="-14" r="9" fill="#fff9c4"/>
          <circle cx="14" cy="-4" r="9" fill="#fff9c4"/>
          <circle cx="9" cy="12" r="9" fill="#fff9c4"/>
          <circle cx="-9" cy="12" r="9" fill="#fff9c4"/>
          <circle cx="-14" cy="-4" r="9" fill="#fff9c4"/>
          <circle cx="0" cy="0" r="8" fill="#ffb300"/>
        </g>
      `;
    }

    g.innerHTML = inner;
    return g;
  }

  function ensureTrailAhead() {
    const neededMaxIndex = currentStepIndex + 8;
    while (nodes.length <= neededMaxIndex) {
      const newNode = generateNode(nodes.length);
      nodes.push(newNode);

      // З'єднання (стежка з дрібних камінців та пилку)
      if (newNode.index > 0) {
        const prev = nodes[newNode.index - 1];
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const midX = (prev.x + newNode.x) / 2;
        const midY = (prev.y + newNode.y) / 2 - 28;
        path.setAttribute('d', `M ${prev.x} ${prev.y} Q ${midX} ${midY} ${newNode.x} ${newNode.y}`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'rgba(215, 204, 200, 0.55)');
        path.setAttribute('stroke-width', '10');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-dasharray', '2 26');
        trailConnGroup.appendChild(path);
      }

      trailNodesGroup.appendChild(renderPlatformSVG(newNode));

      // Додаємо комах-супутників на лузі вздовж маршруту
      if (newNode.hasCompanion) {
        const bugG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const offsetY = (newNode.index % 4 === 1) ? -125 : 120;
        const angle = (newNode.index * 67) % 360;
        bugG.setAttribute('transform', `translate(${newNode.x + 30}, ${newNode.y + offsetY}) rotate(${angle}) scale(0.78)`);
        bugG.setAttribute('filter', 'url(#dropShadow)');
        bugG.innerHTML = InsectArt.render(newNode.companionType, 0);
        ambientBugsGroup.appendChild(bugG);
      }
    }

    // Очищуємо старі елементи далеко позаду для швидкодії
    while (trailNodesGroup.children.length > 16) {
      trailNodesGroup.removeChild(trailNodesGroup.firstChild);
    }
    while (trailConnGroup.children.length > 16) {
      trailConnGroup.removeChild(trailConnGroup.firstChild);
    }
    while (ambientBugsGroup.children.length > 12) {
      ambientBugsGroup.removeChild(ambientBugsGroup.firstChild);
    }
  }

  function updatePlayerSVG() {
    playerTokenGroup.innerHTML = InsectArt.render(selectedInsect, playerPos.wingPhase);
    playerTokenGroup.setAttribute(
      'transform',
      `translate(${playerPos.x}, ${playerPos.y}) rotate(${playerPos.angle}) scale(1.22)`
    );
    switcherIcon.innerHTML = InsectArt.render(selectedInsect, 0);
  }

  function advancePlayerToStep(nextIndex) {
    const startNode = nodes[currentStepIndex];
    const endNode = nodes[nextIndex];
    currentStepIndex = nextIndex;
    ensureTrailAhead();

    targetCameraX = endNode.x - 520;

    const dx = endNode.x - startNode.x;
    const dy = endNode.y - startNode.y;
    // Орієнтація комахи вздовж вектора руху (0 градусів = вгору)
    const targetAngle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;

    moveAnim = {
      startX: playerPos.x,
      startY: playerPos.y,
      endX: endNode.x,
      endY: endNode.y,
      startAngle: playerPos.angle,
      endAngle: targetAngle,
      progress: 0
    };
  }

  // Перемикання виду комахи при кліку на фішку або кнопку зліва внизу
  function cycleInsect() {
    SoundFX.playStep();
    selectedInsect = (selectedInsect + 1) % 5;
    updatePlayerSVG();
    spawnPollenBurst(window.innerWidth * 0.28, window.innerHeight * 0.65, 18);
  }

  playerTokenGroup.addEventListener('click', cycleInsect);
  document.getElementById('insect-switcher').addEventListener('click', cycleInsect);

  /* =========================================================================
     4. НАВЧАЛЬНИЙ ГЕНЕРАТОР ЗАВДАНЬ (КОМПОНЕНТИ ДОДАВАННЯ ТА ВІДНІМАННЯ)
     ========================================================================= */
  const ALL_COMPONENTS = [
    'Перший доданок',
    'Другий доданок',
    'Сума',
    'Зменшуване',
    'Від\'ємник',
    'Різниця'
  ];

  const equationBoard = document.getElementById('equation-board');
  const mode2Prompt = document.getElementById('mode2-prompt');
  const choicesContainer = document.getElementById('choices-container');

  let currentTask = null;
  let isTransitioning = false;

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateMathTask() {
    const isAddition = Math.random() < 0.5;
    let num1, num2, res, opSign, compNames;

    if (isAddition) {
      num1 = randInt(4, 65);
      num2 = randInt(4, 34);
      // Гарантуємо різні числа для однозначності у Режимі 2
      if (num1 === num2) num2 += 3;
      res = num1 + num2;
      opSign = '+';
      compNames = ['Перший доданок', 'Другий доданок', 'Сума'];
    } else {
      num2 = randInt(5, 42);
      res = randInt(5, 55);
      if (num2 === res) res += 4;
      num1 = num2 + res;
      opSign = '−';
      compNames = ['Зменшуване', 'Від\'ємник', 'Різниця'];
    }

    const targetPos = randInt(0, 2); // 0, 1 або 2
    const targetName = compNames[targetPos];
    // Чергуємо або випадково обираємо режим:
    // Mode 1: підсвічено число в рівнянні -> обрати назву компонента на листках
    // Mode 2: написано назву компонента на зеленому листку -> клікнути відповідне число в рівнянні
    const mode = Math.random() < 0.62 ? 1 : 2;

    return {
      numbers: [num1, num2, res],
      opSign,
      targetPos,
      targetName,
      mode
    };
  }

  function renderTask() {
    isTransitioning = false;
    currentTask = generateMathTask();
    equationBoard.innerHTML = '';
    choicesContainer.innerHTML = '';

    const [n1, n2, n3] = currentTask.numbers;
    const parts = [
      { type: 'num', val: n1, pos: 0 },
      { type: 'sign', val: currentTask.opSign },
      { type: 'num', val: n2, pos: 1 },
      { type: 'sign', val: '=' },
      { type: 'num', val: n3, pos: 2 }
    ];

    parts.forEach(part => {
      const el = document.createElement('div');
      if (part.type === 'sign') {
        el.className = 'eq-part eq-sign';
        el.textContent = part.val;
      } else {
        el.className = 'eq-part';
        el.textContent = part.val;

        if (currentTask.mode === 1 && part.pos === currentTask.targetPos) {
          el.classList.add('target-highlight');
        } else if (currentTask.mode === 2) {
          el.classList.add('clickable-number');
          el.addEventListener('click', (e) => handleAnswer(part.pos === currentTask.targetPos, el, e));
        }
      }
      equationBoard.appendChild(el);
    });

    if (currentTask.mode === 1) {
      mode2Prompt.style.display = 'none';
      choicesContainer.style.display = 'flex';

      // Відображаємо всі 6 базових назв компонентів у випадковому порядку
      const shuffled = [...ALL_COMPONENTS].sort(() => Math.random() - 0.5);
      shuffled.forEach(compName => {
        const btn = document.createElement('div');
        btn.className = 'leaf-choice';
        btn.textContent = compName;
        btn.addEventListener('click', (e) => handleAnswer(compName === currentTask.targetName, btn, e));
        choicesContainer.appendChild(btn);
      });
    } else {
      choicesContainer.style.display = 'none';
      mode2Prompt.style.display = 'flex';
      mode2Prompt.innerHTML = `
        <svg width="32" height="32" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="14" fill="#ffd54f" stroke="#fff" stroke-width="2"/>
          <circle cx="15" cy="15" r="4" fill="#fff" opacity="0.8"/>
        </svg>
        <span>${currentTask.targetName}</span>
      `;
    }
  }

  function handleAnswer(isCorrect, clickedEl, event) {
    if (isTransitioning) return;

    const rect = clickedEl.getBoundingClientRect();
    const clickX = event?.clientX || (rect.left + rect.width / 2);
    const clickY = event?.clientY || (rect.top + rect.height / 2);

    if (isCorrect) {
      isTransitioning = true;
      const celebrationType = currentStepIndex % 4;
      SoundFX.playSuccess(celebrationType);
      triggerRichCelebration(clickX, clickY, celebrationType);
      advancePlayerToStep(currentStepIndex + 1);

      setTimeout(() => {
        renderTask();
      }, 950);
    } else {
      SoundFX.playError();
      clickedEl.classList.remove('shake-error');
      void clickedEl.offsetWidth;
      clickedEl.classList.add('shake-error');
      spawnRaindropSplash(clickX, clickY);
      setTimeout(() => clickedEl.classList.remove('shake-error'), 520);
    }
  }

  // Кнопка "Далі" — миттєвий перехід до наступної сходинки та завдання без проходження
  document.getElementById('next-btn').addEventListener('click', () => {
    SoundFX.playStep();
    advancePlayerToStep(currentStepIndex + 1);
    renderTask();
  });

  /* =========================================================================
     5. АКТИВНІ ТА РІЗНОМАНІТНІ ВІЗУАЛЬНІ ФІДБЕКИ (МЕТЕЛИКИ, СВІТЛЯЧКИ, РОСА)
     ========================================================================= */
  const fxCanvas = document.getElementById('fx-canvas');
  const fxCtx = fxCanvas.getContext('2d');
  let fxParticles = [];

  function resizeCanvases() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
    meadowCanvas.width = window.innerWidth;
    meadowCanvas.height = window.innerHeight;
  }

  function triggerRichCelebration(originX, originY, variant) {
    if (variant === 0) {
      // Зграя яскравих метеликів, що пурхають
      for (let i = 0; i < 24; i++) {
        const angle = (Math.PI * 2 * i) / 24 + (Math.random() - 0.5) * 0.4;
        const speed = 4 + Math.random() * 7;
        fxParticles.push({
          kind: 'butterfly',
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2.5,
          size: 14 + Math.random() * 12,
          wingPhase: Math.random() * Math.PI * 2,
          hue: [48, 28, 195, 330][i % 4],
          life: 1,
          decay: 0.011 + Math.random() * 0.006
        });
      }
    } else if (variant === 1) {
      // Вихор біолюмінесцентних світлячків та золотого пилку
      for (let i = 0; i < 45; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 9;
        fxParticles.push({
          kind: 'firefly',
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          radius: 4 + Math.random() * 7,
          phase: Math.random() * 6,
          color: i % 2 === 0 ? '#ccff90' : '#ffd740',
          life: 1,
          decay: 0.012 + Math.random() * 0.008
        });
      }
    } else if (variant === 2) {
      // Розліт польових квітів та пелюсток
      for (let i = 0; i < 32; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 8;
        fxParticles.push({
          kind: 'flower',
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.14,
          size: 12 + Math.random() * 14,
          petalColor: ['#fff9c4', '#f48fb1', '#81d4fa', '#ce93d8'][i % 4],
          life: 1,
          decay: 0.012
        });
      }
    } else {
      // Стрімкі смарагдові бабки та веселкові краплі роси
      for (let i = 0; i < 28; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 5 + Math.random() * 8;
        fxParticles.push({
          kind: 'dewRing',
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 6 + Math.random() * 12,
          hue: (i * 25) % 360,
          life: 1,
          decay: 0.014
        });
      }
    }
  }

  function spawnPollenBurst(x, y, count = 16) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 2 + Math.random() * 5;
      fxParticles.push({
        kind: 'firefly',
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        radius: 3 + Math.random() * 5,
        phase: i,
        color: '#ffe57f',
        life: 1,
        decay: 0.025
      });
    }
  }

  function spawnRaindropSplash(x, y) {
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 2 + Math.random() * 6;
      fxParticles.push({
        kind: 'splash',
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 2,
        radius: 3 + Math.random() * 4,
        life: 1,
        decay: 0.03
      });
    }
  }

  function updateAndDrawFX() {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

    for (let i = fxParticles.length - 1; i >= 0; i--) {
      const p = fxParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;

      if (p.life <= 0) {
        fxParticles.splice(i, 1);
        continue;
      }

      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, p.life);

      if (p.kind === 'butterfly') {
        p.wingPhase += 0.32;
        p.vy -= 0.04; // пурхають вгору
        const flap = Math.abs(Math.sin(p.wingPhase));
        const angle = Math.atan2(p.vy, p.vx) + Math.PI / 2;
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(angle);

        fxCtx.fillStyle = `hsl(${p.hue}, 92%, 58%)`;
        fxCtx.strokeStyle = '#1a1a1a';
        fxCtx.lineWidth = 1.5;

        // Ліве та праве крило
        [-1, 1].forEach(dir => {
          fxCtx.beginPath();
          fxCtx.ellipse(dir * p.size * 0.45 * flap, -3, p.size * 0.55 * flap, p.size * 0.4, dir * 0.3, 0, Math.PI * 2);
          fxCtx.fill();
          fxCtx.stroke();
        });
        // Тільце
        fxCtx.fillStyle = '#111';
        fxCtx.fillRect(-1.5, -p.size * 0.4, 3, p.size * 0.8);
      } else if (p.kind === 'firefly') {
        p.phase += 0.2;
        const glow = p.radius * (1.2 + Math.sin(p.phase) * 0.4);
        const grad = fxCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glow * 2.2);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.4, p.color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        fxCtx.fillStyle = grad;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, glow * 2.2, 0, Math.PI * 2);
        fxCtx.fill();
      } else if (p.kind === 'flower') {
        p.vy += 0.08;
        p.rot += p.vRot;
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.rot);
        fxCtx.fillStyle = p.petalColor;
        for (let k = 0; k < 5; k++) {
          fxCtx.rotate((Math.PI * 2) / 5);
          fxCtx.beginPath();
          fxCtx.ellipse(0, -p.size * 0.45, p.size * 0.28, p.size * 0.45, 0, 0, Math.PI * 2);
          fxCtx.fill();
        }
        fxCtx.fillStyle = '#ffb300';
        fxCtx.beginPath();
        fxCtx.arc(0, 0, p.size * 0.26, 0, Math.PI * 2);
        fxCtx.fill();
      } else if (p.kind === 'dewRing') {
        p.vx *= 0.96;
        p.vy *= 0.96;
        fxCtx.strokeStyle = `hsla(${p.hue}, 90%, 70%, ${p.life})`;
        fxCtx.lineWidth = 3;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.radius * (2 - p.life), 0, Math.PI * 2);
        fxCtx.stroke();
      } else if (p.kind === 'splash') {
        p.vy += 0.22;
        fxCtx.fillStyle = 'rgba(179, 229, 252, 0.85)';
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        fxCtx.fill();
      }

      fxCtx.restore();
    }
  }

  /* =========================================================================
     6. СЮЖЕТНИЙ "ЖИВИЙ" ФОН ЛУГУ (CANVAS АНІМАЦІЯ ТРАВИ, КВІТІВ ТА КОМАХ)
     ========================================================================= */
  const meadowCanvas = document.getElementById('meadow-canvas');
  const mCtx = meadowCanvas.getContext('2d');

  const grassBlades = [];
  const floatingSeeds = [];
  const meadowFlowers = [];

  function initMeadowWorld() {
    for (let i = 0; i < 130; i++) {
      grassBlades.push({
        worldX: i * 38 + Math.random() * 25,
        yBase: Math.random() < 0.5 ? 0.35 + Math.random() * 0.65 : 0.85 + Math.random() * 0.18,
        height: 65 + Math.random() * 110,
        width: 5 + Math.random() * 6,
        hue: 82 + Math.random() * 32,
        light: 22 + Math.random() * 22,
        swaySpeed: 0.0015 + Math.random() * 0.0015,
        swayOffset: Math.random() * Math.PI * 2
      });
    }

    for (let i = 0; i < 45; i++) {
      meadowFlowers.push({
        worldX: i * 95 + Math.random() * 60,
        yRatio: 0.38 + Math.random() * 0.56,
        size: 9 + Math.random() * 11,
        type: i % 3, // 0: ромашка, 1: конюшина, 2: дзвіночок/волошка
        phase: Math.random() * Math.PI * 2
      });
    }

    for (let i = 0; i < 28; i++) {
      floatingSeeds.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: 0.3 + Math.random() * 0.6,
        vy: -0.2 + (Math.random() - 0.5) * 0.4,
        size: 6 + Math.random() * 8,
        angle: Math.random() * Math.PI * 2
      });
    }
  }

  function drawMeadowBackground(time) {
    const w = meadowCanvas.width;
    const h = meadowCanvas.height;

    // Соковитий багатошаровий градієнт лугу у сонячному промінні
    const skyMeadowGrad = mCtx.createLinearGradient(0, 0, 0, h);
    skyMeadowGrad.addColorStop(0, '#558b2f');
    skyMeadowGrad.addColorStop(0.32, '#33691e');
    skyMeadowGrad.addColorStop(0.7, '#254d17');
    skyMeadowGrad.addColorStop(1, '#142b0b');
    mCtx.fillStyle = skyMeadowGrad;
    mCtx.fillRect(0, 0, w, h);

    // М'які сонячні галявини, що зміщуються разом з камерою
    for (let i = 0; i < 5; i++) {
      const spotX = ((i * 520 - cameraX * 0.4) % (w + 600) + (w + 600)) % (w + 600) - 300;
      const spotY = h * (0.45 + (i % 2) * 0.22);
      const rad = mCtx.createRadialGradient(spotX, spotY, 10, spotX, spotY, 340);
      rad.addColorStop(0, 'rgba(220, 237, 130, 0.22)');
      rad.addColorStop(1, 'rgba(220, 237, 130, 0)');
      mCtx.fillStyle = rad;
      mCtx.beginPath();
      mCtx.arc(spotX, spotY, 340, 0, Math.PI * 2);
      mCtx.fill();
    }

    // Польові квіти на галявині
    meadowFlowers.forEach(fl => {
      const screenX = ((fl.worldX - cameraX * 0.75) % (w + 200) + (w + 200)) % (w + 200) - 100;
      const screenY = fl.yRatio * h + Math.sin(time * 0.002 + fl.phase) * 4;

      mCtx.save();
      mCtx.translate(screenX, screenY);
      if (fl.type === 0) {
        // Ромашка
        mCtx.fillStyle = 'rgba(255, 253, 231, 0.85)';
        for (let p = 0; p < 8; p++) {
          mCtx.rotate(Math.PI / 4);
          mCtx.beginPath();
          mCtx.ellipse(0, -fl.size * 0.65, fl.size * 0.24, fl.size * 0.55, 0, 0, Math.PI * 2);
          mCtx.fill();
        }
        mCtx.fillStyle = '#ffb300';
        mCtx.beginPath();
        mCtx.arc(0, 0, fl.size * 0.35, 0, Math.PI * 2);
        mCtx.fill();
      } else if (fl.type === 1) {
        // Рожева конюшина
        mCtx.fillStyle = 'rgba(240, 98, 146, 0.78)';
        mCtx.beginPath();
        mCtx.arc(0, 0, fl.size * 0.75, 0, Math.PI * 2);
        mCtx.fill();
        mCtx.fillStyle = 'rgba(248, 187, 208, 0.85)';
        mCtx.beginPath();
        mCtx.arc(-2, -2, fl.size * 0.4, 0, Math.PI * 2);
        mCtx.fill();
      } else {
        // Блакитна волошка
        mCtx.fillStyle = 'rgba(66, 165, 245, 0.82)';
        for (let p = 0; p < 6; p++) {
          mCtx.rotate(Math.PI / 3);
          mCtx.beginPath();
          mCtx.moveTo(0, 0);
          mCtx.lineTo(-fl.size * 0.3, -fl.size * 0.85);
          mCtx.lineTo(fl.size * 0.3, -fl.size * 0.85);
          mCtx.closePath();
          mCtx.fill();
        }
      }
      mCtx.restore();
    });

    // Живі стебла трави, що колишуться від вітру
    grassBlades.forEach(b => {
      const screenX = ((b.worldX - cameraX * 0.88) % (w + 160) + (w + 160)) % (w + 160) - 80;
      const baseY = b.yBase * h;
      const sway = Math.sin(time * b.swaySpeed + b.swayOffset) * 18;

      mCtx.beginPath();
      mCtx.moveTo(screenX - b.width / 2, baseY);
      mCtx.quadraticCurveTo(screenX + sway * 0.4, baseY - b.height * 0.5, screenX + sway, baseY - b.height);
      mCtx.quadraticCurveTo(screenX + sway * 0.4 + b.width * 0.6, baseY - b.height * 0.5, screenX + b.width / 2, baseY);
      mCtx.fillStyle = `hsl(${b.hue}, 58%, ${b.light}%)`;
      mCtx.fill();
    });

    // Пушинки кульбаби та пилок у повітрі
    floatingSeeds.forEach(s => {
      s.x += s.vx;
      s.y += s.vy + Math.sin(time * 0.002 + s.angle) * 0.25;
      if (s.x > w + 30) s.x = -30;
      if (s.y < -30) s.y = h + 30;
      if (s.y > h + 30) s.y = -30;

      mCtx.save();
      mCtx.translate(s.x, s.y);
      mCtx.strokeStyle = 'rgba(255, 255, 240, 0.5)';
      mCtx.lineWidth = 1;
      for (let k = 0; k < 6; k++) {
        const a = (k * Math.PI) / 3;
        mCtx.beginPath();
        mCtx.moveTo(0, 0);
        mCtx.lineTo(Math.cos(a) * s.size, Math.sin(a) * s.size);
        mCtx.stroke();
      }
      mCtx.fillStyle = 'rgba(255, 249, 196, 0.85)';
      mCtx.beginPath();
      mCtx.arc(0, 0, 2, 0, Math.PI * 2);
      mCtx.fill();
      mCtx.restore();
    });
  }

  /* =========================================================================
     7. ГОЛОВНИЙ ІГРОВИЙ ЦИКЛ
     ========================================================================= */
  const cameraGroup = document.getElementById('camera-group');

  function animate(time) {
    // Плавний рух камери за комахою-гравцем
    cameraX += (targetCameraX - cameraX) * 0.075;
    cameraGroup.setAttribute('transform', `translate(${-cameraX}, 0)`);

    // Рух фішки гравця між природними платформами
    if (moveAnim) {
      moveAnim.progress += 0.032;
      if (moveAnim.progress >= 1) {
        playerPos.x = moveAnim.endX;
        playerPos.y = moveAnim.endY;
        playerPos.angle = moveAnim.endAngle;
        playerPos.wingPhase = 0;
        moveAnim = null;
      } else {
        const t = moveAnim.progress;
        const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        playerPos.x = moveAnim.startX + (moveAnim.endX - moveAnim.startX) * ease;
        // Дуга стрибка/польоту
        const arc = Math.sin(t * Math.PI) * 52;
        playerPos.y = moveAnim.startY + (moveAnim.endY - moveAnim.startY) * ease - arc;
        playerPos.angle = moveAnim.startAngle + (moveAnim.endAngle - moveAnim.startAngle) * ease;
        playerPos.wingPhase = Math.sin(t * Math.PI * 6) * 0.5 + 0.5;
      }
      updatePlayerSVG();
    } else {
      // Легке дихання комахи на місці
      playerPos.wingPhase = (Math.sin(time * 0.004) + 1) * 0.06;
      updatePlayerSVG();
    }

    drawMeadowBackground(time);
    updateAndDrawFX();

    requestAnimationFrame(animate);
  }

  // Ініціалізація
  window.addEventListener('resize', resizeCanvases);
  resizeCanvases();
  initMeadowWorld();
  ensureTrailAhead();

  // Початкова позиція на першій платформі
  playerPos.x = nodes[0].x;
  playerPos.y = nodes[0].y;
  targetCameraX = nodes[0].x - 520;
  cameraX = targetCameraX;
  updatePlayerSVG();
  renderTask();

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
