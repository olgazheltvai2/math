<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Гра з мишками та сиром</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.cdnfonts.com/css/propysy');

        :root {
            --primary-bg: #ffb74d;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2c1a12;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            touch-action: none;
            font-family: 'Propysy Bold', cursive, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            background: transparent;
            overflow: hidden;
            border-radius: 20px;
        }

        /* Деталізований напівпрозорий фон-фільтр */
        #background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.95; 
            pointer-events: none;
        }

        /* Живий персонаж (Рудий Кіт) */
        #character {
            position: absolute;
            bottom: 2%;
            right: 2%;
            width: 18%;
            height: auto;
            z-index: 5;
            cursor: pointer;
            transform-origin: bottom center;
        }

        /* Перетягувані шматки сиру */
        .draggable-leaf {
            position: absolute;
            z-index: 4;
            cursor: grab;
            filter: drop-shadow(3px 5px 6px rgba(0,0,0,0.4));
        }
        .draggable-leaf:active {
            cursor: grabbing;
        }

        /* 7 ВЕЛИКИХ груп сиру */
        #leaf-group-1 { top: 10%; left: 15%; width: 35%; height: 35%; transform: rotate(15deg); }
        #leaf-group-2 { top: 35%; left: 5%; width: 40%; height: 40%; transform: rotate(-35deg); }
        #leaf-group-3 { top: 12%; left: 50%; width: 38%; height: 38%; transform: rotate(50deg); }
        #leaf-group-4 { top: 40%; left: 55%; width: 45%; height: 45%; transform: rotate(-15deg); }
        #leaf-group-5 { top: 60%; left: 25%; width: 35%; height: 35%; transform: rotate(85deg); }
        #leaf-group-6 { top: 5%; left: 75%; width: 30%; height: 30%; transform: rotate(-65deg); }
        #leaf-group-7 { top: 65%; left: 75%; width: 32%; height: 32%; transform: rotate(120deg); }

        /* Генератори мишок */
        .generator {
            position: absolute;
            width: 8%;
            height: 12%;
            z-index: 10;
            cursor: grab;
            transition: transform 0.2s;
            filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.4));
        }

        .generator:active {
            cursor: grabbing;
            transform: scale(0.9);
        }

        #gen-up-right {
            top: 10%;
            left: 5%;
            transform: rotate(45deg);
        }

        #gen-down-left {
            top: 30%;
            left: 5%;
            transform: rotate(-135deg);
        }

        /* Зменшені мишки для перетягування */
        .draggable-bug {
            position: absolute;
            width: 7%; 
            height: 10%;
            z-index: 20;
            cursor: grab;
            filter: drop-shadow(2px 4px 5px rgba(0,0,0,0.6));
            transform-origin: center center;
        }

        .draggable-bug:active {
            cursor: grabbing;
        }

        /* Смітник - Паща голодного кота */
        #trash-zone {
            position: absolute;
            bottom: 5%;
            left: 3%;
            width: 14%;
            height: 14%;
            z-index: 5;
            opacity: 0.9;
            transition: opacity 0.3s, transform 0.3s;
        }

        #trash-zone.hovered {
            opacity: 1;
            transform: scale(1.2) rotate(-5deg);
            filter: drop-shadow(0 0 15px rgba(213, 0, 0, 0.8));
        }

        /* Панель генерації схеми */
        #schema-panel {
            position: absolute;
            bottom: 1%;
            left: 20%;
            width: 60%;
            height: 45%; 
            background: rgba(255, 255, 255, 0.9);
            border: 4px dashed #f57c00;
            border-radius: 25px;
            z-index: 6;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            padding: 1%;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        }

        .input-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 1%;
            width: 100%;
            justify-content: center;
        }

        #equation-input {
            width: 40%;
            padding: 5px 15px;
            font-size: 3vw; 
            border: 3px solid #ff9800;
            border-radius: 15px;
            text-align: center;
            background: #fff;
            color: #e65100;
            outline: none;
            font-family: 'Propysy Bold', cursive;
            transition: opacity 0.3s;
        }

        .toggle-btn {
            background: #ffb300;
            border: 3px solid #ff8f00;
            border-radius: 50%;
            width: 3.5vw;
            height: 3.5vw;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 0 #ff8f00;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .toggle-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #ff8f00;
        }

        .toggle-btn svg {
            width: 60%;
            height: 60%;
            fill: #fff;
        }

        #schema-svg-container {
            width: 100%;
            height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible; 
        }

        /* Theme Manager UI */
        #theme-manager-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #ff5722;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            color: white;
            cursor: pointer;
            z-index: 100000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
            font-family: Arial, sans-serif;
        }
        #theme-manager-btn:hover { transform: scale(1.1); }

        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            max-width: 600px;
            background: white;
            border-radius: 15px;
            z-index: 100001;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-family: Arial, sans-serif;
        }
        #theme-modal h2 { margin-top: 0; text-align: center; }
        #theme-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
        }
        .theme-card {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border 0.2s, transform 0.2s;
            overflow: hidden;
        }
        .theme-card:hover { transform: scale(1.05); border-color: #ff5722; }
        .theme-card.no-bg { background: #ccc; }
        .theme-label {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: white;
            text-align: center;
            font-size: 14px;
            padding: 4px 0;
        }
        #theme-modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #333;
        }

        /* Блок контролю */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            color: red;
            font-size: 5vw;
            font-weight: bold;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* Глобальний інструмент малювання */
        #draw-canvas-global {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 90000;
        }
        #toggle-draw-btn-global {
            position: fixed;
            bottom: 85px; right: 20px;
            width: 50px; height: 50px;
            background: #8e44ad;
            border: none; border-radius: 50%;
            font-size: 20px; color: white;
            cursor: pointer; z-index: 90001;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex; justify-content: center; align-items: center;
            font-family: Arial, sans-serif;
        }
        #draw-panel-global {
            display: none;
            position: fixed;
            top: 20%; left: 20px;
            background: white; border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            z-index: 90002; width: 220px;
            font-family: Arial, sans-serif; overflow: hidden;
        }
        #draw-panel-header {
            background: #8e44ad; color: white; padding: 10px;
            cursor: grab; display: flex; justify-content: space-between;
            align-items: center; font-weight: bold;
        }
        #draw-panel-header:active { cursor: grabbing; }
        .draw-panel-content { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .draw-btn-group { display: flex; gap: 5px; }
        .draw-tool-btn {
            flex: 1; padding: 8px; border: 1px solid #ccc;
            background: #f1f1f1; cursor: pointer; border-radius: 5px; font-size: 14px;
        }
        .draw-tool-btn.active { background: #8e44ad; color: white; border-color: #8e44ad; }
        #draw-clear-btn { background: #e74c3c; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; }
        #draw-color-picker, #draw-width-slider { width: 100%; cursor: pointer; }

        @media (max-width: 768px) {
            #schema-panel { width: 80%; left: 10%; }
            #equation-input { font-size: 5vw; width: 60%; }
            .toggle-btn { width: 8vw; height: 8vw; }
            #block-overlay { font-size: 8vw; }
        }
    </style>
</head>
<body>

<div id="game-container">
    
    <!-- Сюжетний фон (Кухня, мишача нора) -->
    <svg id="background-layer" viewBox="0 0 1600 900" preserveAspectRatio="none">
        <defs>
            <pattern id="floor-tile" x="0" y="0" width="160" height="160" patternUnits="userSpaceOnUse">
                <rect x="0" y="0" width="80" height="80" fill="#f5f5f5"/>
                <rect x="80" y="0" width="80" height="80" fill="#e0e0e0"/>
                <rect x="0" y="80" width="80" height="80" fill="#e0e0e0"/>
                <rect x="80" y="80" width="80" height="80" fill="#f5f5f5"/>
            </pattern>
            <linearGradient id="wall-grad" x1="0" y1="0" x2="0" y2="100%">
                <stop offset="0%" stop-color="#fff9c4"/>
                <stop offset="100%" stop-color="#ffecb3"/>
            </linearGradient>
        </defs>
        <!-- Стіна -->
        <rect x="0" y="0" width="100%" height="250" fill="url(#wall-grad)"/>
        
        <!-- Плінтус -->
        <rect x="0" y="230" width="100%" height="30" fill="#795548"/>
        <rect x="0" y="250" width="100%" height="10" fill="#5d4037"/>
        <path d="M 0 230 L 1600 230 L 1600 240 L 0 240 Z" fill="#8d6e63" opacity="0.5"/>
        
        <!-- Підлога -->
        <rect x="0" y="260" width="100%" height="640" fill="url(#floor-tile)"/>
        
        <!-- Мишача нора -->
        <path d="M 250 240 C 250 140 370 140 370 240 L 370 260 L 250 260 Z" fill="#212121"/>
        <path d="M 260 245 C 260 155 360 155 360 245 L 360 260 L 260 260 Z" fill="#000000"/>
        
        <!-- Розсипані крихти сиру -->
        <circle cx="450" cy="500" r="8" fill="#ffb300"/>
        <circle cx="470" cy="520" r="5" fill="#ffa000"/>
        <circle cx="1000" cy="700" r="10" fill="#ffb300"/>
        <circle cx="1200" cy="450" r="6" fill="#ffa000"/>
        <circle cx="1220" cy="440" r="4" fill="#ff8f00"/>
    </svg>

    <!-- Перетягуваний СИР (Група 1) -->
    <div class="draggable-leaf" id="leaf-group-1">
        <svg viewBox="-500 -500 1000 1000" overflow="visible" width="100%" height="100%">
            <defs>
                <linearGradient id="cheeseG1_1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fff176"/><stop offset="100%" stop-color="#fbc02d"/>
                </linearGradient>
            </defs>
            <g transform="rotate(25) translate(-150, -120) scale(3.5)">
                <path d="M0,10 L160,-20 L190,70 L10,100 Z" fill="url(#cheeseG1_1)" stroke="#f57f17" stroke-width="3" stroke-linejoin="round"/>
                <circle cx="30" cy="20" r="12" fill="#f57f17" opacity="0.7"/>
                <circle cx="110" cy="10" r="15" fill="#f57f17" opacity="0.7"/>
                <circle cx="150" cy="40" r="10" fill="#f57f17" opacity="0.7"/>
                <circle cx="70" cy="60" r="20" fill="#f57f17" opacity="0.7"/>
                <circle cx="120" cy="70" r="8" fill="#f57f17" opacity="0.7"/>
            </g>
        </svg>
    </div>

    <!-- Перетягуваний СИР (Група 2) -->
    <div class="draggable-leaf" id="leaf-group-2">
        <svg viewBox="-500 -500 1000 1000" overflow="visible" width="100%" height="100%">
            <defs>
                <linearGradient id="cheeseG1_2" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffee58"/><stop offset="100%" stop-color="#f9a825"/>
                </linearGradient>
            </defs>
            <g transform="rotate(60) translate(-150, -120) scale(3.5)">
                <path d="M10,-10 L170,-30 L200,60 L20,90 Z" fill="url(#cheeseG1_2)" stroke="#f57f17" stroke-width="3" stroke-linejoin="round"/>
                <circle cx="40" cy="10" r="14" fill="#f57f17" opacity="0.7"/>
                <circle cx="130" cy="-5" r="18" fill="#f57f17" opacity="0.7"/>
                <circle cx="160" cy="30" r="12" fill="#f57f17" opacity="0.7"/>
                <circle cx="80" cy="50" r="16" fill="#f57f17" opacity="0.7"/>
            </g>
        </svg>
    </div>

    <!-- Перетягуваний СИР (Група 3) -->
    <div class="draggable-leaf" id="leaf-group-3">
        <svg viewBox="-500 -500 1000 1000" overflow="visible" width="100%" height="100%">
            <defs>
                <linearGradient id="cheeseG1_3" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fff176"/><stop offset="100%" stop-color="#fbc02d"/>
                </linearGradient>
            </defs>
            <g transform="rotate(-50) translate(-150, -120) scale(3.2)">
                <path d="M-10,0 L140,-20 L160,80 L0,90 Z" fill="url(#cheeseG1_3)" stroke="#f57f17" stroke-width="3" stroke-linejoin="round"/>
                <circle cx="20" cy="20" r="10" fill="#f57f17" opacity="0.7"/>
                <circle cx="90" cy="10" r="16" fill="#f57f17" opacity="0.7"/>
                <circle cx="130" cy="50" r="12" fill="#f57f17" opacity="0.7"/>
                <circle cx="50" cy="60" r="18" fill="#f57f17" opacity="0.7"/>
            </g>
        </svg>
    </div>
    
    <!-- Перетягуваний СИР (Група 4) -->
    <div class="draggable-leaf" id="leaf-group-4">
        <svg viewBox="-500 -500 1000 1000" overflow="visible" width="100%" height="100%">
            <defs>
                <linearGradient id="cheeseG1_4" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffee58"/><stop offset="100%" stop-color="#f9a825"/>
                </linearGradient>
            </defs>
            <g transform="rotate(15) translate(-250, -150) scale(3.8)">
                <path d="M0,10 L160,-20 L190,70 L10,100 Z" fill="url(#cheeseG1_4)" stroke="#f57f17" stroke-width="3" stroke-linejoin="round"/>
                <circle cx="30" cy="20" r="12" fill="#f57f17" opacity="0.7"/>
                <circle cx="110" cy="10" r="15" fill="#f57f17" opacity="0.7"/>
                <circle cx="150" cy="40" r="10" fill="#f57f17" opacity="0.7"/>
                <circle cx="70" cy="60" r="20" fill="#f57f17" opacity="0.7"/>
            </g>
        </svg>
    </div>

    <!-- Перетягуваний СИР (Група 5) -->
    <div class="draggable-leaf" id="leaf-group-5">
        <svg viewBox="-500 -500 1000 1000" overflow="visible" width="100%" height="100%">
            <defs>
                <linearGradient id="cheeseG1_5" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fff176"/><stop offset="100%" stop-color="#fbc02d"/>
                </linearGradient>
            </defs>
            <g transform="rotate(-15) translate(-150, -120) scale(3.5)">
                <path d="M0,0 L150,-10 L160,80 L10,80 Z" fill="url(#cheeseG1_5)" stroke="#f57f17" stroke-width="3" stroke-linejoin="round"/>
                <circle cx="40" cy="20" r="15" fill="#f57f17" opacity="0.7"/>
                <circle cx="110" cy="15" r="12" fill="#f57f17" opacity="0.7"/>
                <circle cx="80" cy="55" r="18" fill="#f57f17" opacity="0.7"/>
            </g>
        </svg>
    </div>

    <!-- Перетягуваний СИР (Група 6) -->
    <div class="draggable-leaf" id="leaf-group-6">
        <svg viewBox="-500 -500 1000 1000" overflow="visible" width="100%" height="100%">
            <defs>
                <linearGradient id="cheeseG1_6" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffee58"/><stop offset="100%" stop-color="#f9a825"/>
                </linearGradient>
            </defs>
            <g transform="rotate(45) translate(-100, -100) scale(3.5)">
                <path d="M10,-10 L170,-30 L200,60 L20,90 Z" fill="url(#cheeseG1_6)" stroke="#f57f17" stroke-width="3" stroke-linejoin="round"/>
                <circle cx="40" cy="10" r="14" fill="#f57f17" opacity="0.7"/>
                <circle cx="130" cy="-5" r="18" fill="#f57f17" opacity="0.7"/>
                <circle cx="160" cy="30" r="12" fill="#f57f17" opacity="0.7"/>
                <circle cx="80" cy="50" r="16" fill="#f57f17" opacity="0.7"/>
            </g>
        </svg>
    </div>

    <!-- Перетягуваний СИР (Група 7) -->
    <div class="draggable-leaf" id="leaf-group-7">
        <svg viewBox="-500 -500 1000 1000" overflow="visible" width="100%" height="100%">
            <defs>
                <linearGradient id="cheeseG1_7" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fff176"/><stop offset="100%" stop-color="#fbc02d"/>
                </linearGradient>
            </defs>
            <g transform="rotate(-80) translate(-120, -120) scale(3.5)">
                <path d="M0,10 L160,-20 L190,70 L10,100 Z" fill="url(#cheeseG1_7)" stroke="#f57f17" stroke-width="3" stroke-linejoin="round"/>
                <circle cx="30" cy="20" r="12" fill="#f57f17" opacity="0.7"/>
                <circle cx="110" cy="10" r="15" fill="#f57f17" opacity="0.7"/>
                <circle cx="150" cy="40" r="10" fill="#f57f17" opacity="0.7"/>
                <circle cx="70" cy="60" r="20" fill="#f57f17" opacity="0.7"/>
            </g>
        </svg>
    </div>

    <!-- Смітник (Голодний Кіт - пастка) -->
    <svg id="trash-zone" viewBox="0 0 200 200">
        <defs>
            <radialGradient id="catMouthGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#000000"/>
                <stop offset="60%" stop-color="#311b92"/>
                <stop offset="100%" stop-color="#b71c1c"/>
            </radialGradient>
        </defs>
        <g id="trash-petals">
            <!-- Голова темного кота -->
            <path d="M30,100 C30,30 170,30 170,100 C170,180 30,180 30,100 Z" fill="#212121" stroke="#424242" stroke-width="4"/>
            <!-- Вуха -->
            <polygon points="30,80 15,10 80,45" fill="#212121" stroke="#424242" stroke-width="2"/>
            <polygon points="170,80 185,10 120,45" fill="#212121" stroke="#424242" stroke-width="2"/>
            <polygon points="35,75 25,25 70,50" fill="#ec407a"/>
            <polygon points="165,75 175,25 130,50" fill="#ec407a"/>
            
            <!-- Очі -->
            <ellipse cx="60" cy="65" rx="15" ry="10" fill="#ffeb3b" transform="rotate(-15 60 65)"/>
            <ellipse cx="140" cy="65" rx="15" ry="10" fill="#ffeb3b" transform="rotate(15 140 65)"/>
            <circle cx="65" cy="65" r="4" fill="#000"/>
            <circle cx="135" cy="65" r="4" fill="#000"/>

            <!-- Відкрита паща (зона поїдання) -->
            <ellipse cx="100" cy="120" rx="55" ry="40" fill="url(#catMouthGrad)" stroke="#d32f2f" stroke-width="3"/>
            
            <!-- Гострі зуби -->
            <polygon points="55,100 65,120 75,95" fill="#fff"/>
            <polygon points="75,95 85,125 95,95" fill="#fff"/>
            <polygon points="95,95 105,125 115,95" fill="#fff"/>
            <polygon points="115,95 125,120 135,100" fill="#fff"/>
            
            <polygon points="65,145 75,130 85,150" fill="#fff"/>
            <polygon points="85,150 95,125 105,150" fill="#fff"/>
            <polygon points="105,150 115,130 125,145" fill="#fff"/>
        </g>
    </svg>

    <!-- Живий персонаж (Рудий Кіт) -->
    <svg id="character" viewBox="0 0 300 300">
        <g id="frog"> 
            <!-- Хвіст -->
            <path d="M 220 250 Q 280 280 270 200 Q 260 180 250 190 Q 260 260 210 240 Z" fill="#f57c00" stroke="#e65100" stroke-width="4"/>
            <!-- Тіло -->
            <ellipse cx="150" cy="220" rx="100" ry="70" fill="#ff9800" stroke="#e65100" stroke-width="5"/>
            <!-- Пузико -->
            <ellipse cx="150" cy="240" rx="70" ry="40" fill="#ffe0b2"/>
            <!-- Голова -->

            <!-- Вуса -->

            <path d="M 210 160 L 260 150 M 210 170 L 265 170 M 210 180 L 255 190" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            
            <!-- Лапки -->

            <ellipse cx="200" cy="280" rx="20" ry="15" fill="#ff9800" stroke="#e65100" stroke-width="3"/>
            <line x1="90" y1="290" x2="90" y2="280" stroke="#e65100" stroke-width="2"/>
            <line x1="100" y1="295" x2="100" y2="285" stroke="#e65100" stroke-width="2"/>

    <!-- Шаблон жучка -> МИШКА -->
    <template id="bug-template">
        <svg viewBox="0 0 100 100" class="bug-svg" width="100%" height="100%">
            <defs>
                <radialGradient id="mouseFur" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#e0e0e0"/>
                    <stop offset="80%" stop-color="#9e9e9e"/>

                </radialGradient>
                <radialGradient id="earPink" cx="50%" cy="50%" r="50%">

            <!-- Хвостик -->

            <circle cx="43" cy="22" r="3" fill="#000"/>

    <div id="schema-panel">

            <div class="toggle-btn" id="toggle-text-btn">
                <svg viewBox="0 0 24 24" id="eye-icon">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </div>
        </div>
        <div id="schema-svg-container">
            <svg id="schema-svg" viewBox="0 0 800 450" width="100%" height="100%"></svg>

<!-- Блок контролю (Екран-заглушка) -->
<div id="block-overlay">Зачекай! Зараз не твій урок.</div>

<script>
    const CONFIG = { gameId: 'bug_math_game_v1' };

    // --- Firebase Initialization ---
    const firebaseConfig = {
        databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
        projectId: "lesson-13c44"
    };
    let db = null;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
    } catch(e) {
        console.warn("Firebase offline або помилка", e);
    }

    // --- Універсальний блок контролю (Ідентифікація, Радар та Блокування) ---
    const urlParams = new URLSearchParams(window.location.search);
    let myName = urlParams.get('user') || sessionStorage.getItem('userName');
    if (!myName) {
        myName = 'Гість_' + Math.floor(Math.random() * 1000);
    }
    sessionStorage.setItem('userName', myName);
    
    const myTabId = 'tab_' + Math.floor(Math.random() * 10000000);
    let isRemoteAction = false;

    if (db) {
        const radarRef = db.ref(`online_users/${myName}/${myTabId}`);
        db.ref('.info/connected').on('value', snap => {
            if (snap.val() === true) {
                radarRef.set(true);
                radarRef.onDisconnect().remove();
            }
        });
        window.addEventListener('beforeunload', () => radarRef.remove());

        db.ref('force_refresh').on('value', snap => {
            if(snap.val() && Date.now() - snap.val() < 5000) window.location.reload();
        });

        db.ref(`blocked_users/${myName}`).on('value', snap => {
            document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
        });

        let initTime = Date.now();
        db.ref('current_activity').on('value', snap => {
            if (Date.now() - initTime < 1000) return; 
            if (snap.val() === 'lobby') {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
        });
    }

    function sendGameAction(type, data) {
        if (!db || isRemoteAction) return;
        db.ref('game_action').set({
            senderId: myTabId,
            timestamp: firebase.database.ServerValue.TIMESTAMP,
            type: type,
            data: data
        });
    }

    // --- Звуки ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        
        switch(type) {
            case 'spawn':
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); break;
            case 'drop':
                osc.type = 'triangle'; osc.frequency.setValueAtTime(450, now); osc.frequency.exponentialRampToValueAtTime(250, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); break;
            case 'trash':
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(40, now + 0.25);
                gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25); osc.start(now); osc.stop(now + 0.25); break;
            case 'flip':
                osc.type = 'square'; osc.frequency.setValueAtTime(900, now); osc.frequency.linearRampToValueAtTime(1100, now + 0.05);
                gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05); osc.start(now); osc.stop(now + 0.05); break;
            case 'draw':
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.3);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3); osc.start(now); osc.stop(now + 0.3); break;
            case 'ribbit':
                osc.type = 'square'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(150, now + 0.2);
                gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.2); osc.start(now); osc.stop(now + 0.2); break;
            case 'btn':
                osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now); gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); break;
        }
    }

    // --- Логіка Жучків та Листя (Ідеальний Drag and Drop без лагів та стрибків) ---
    const template = document.getElementById('bug-template');
    const genUpRight = document.getElementById('gen-up-right');
    const genDownLeft = document.getElementById('gen-down-left');
    const container = document.getElementById('game-container');
    const trashZone = document.getElementById('trash-zone');

    genUpRight.appendChild(template.content.cloneNode(true));
    genDownLeft.appendChild(template.content.cloneNode(true));

    let activeDragElement = null;
    let initialX = 0, initialY = 0;
    
    function createBugElement(id, rotation, left, top) {
        let bug = document.getElementById(id);
        if (!bug) {
            bug = document.createElement('div');
            bug.className = 'draggable-bug';
            bug.id = id;
            bug.innerHTML = template.innerHTML;
            container.appendChild(bug);

            bug.addEventListener('dblclick', (ev) => {
                ev.stopPropagation();
                let currentRot = parseInt(bug.getAttribute('data-rotation'));
                let newRot = currentRot === 45 ? -135 : 45;
                bug.setAttribute('data-rotation', newRot);
                bug.style.transform = `rotate(${newRot}deg)`;
                playSound('flip');
                sendGameAction('rotate_bug', { id: id, rot: newRot });
            });
        }
        bug.setAttribute('data-rotation', rotation);
        bug.style.transform = `rotate(${rotation}deg)`;
        bug.style.left = left;
        bug.style.top = top;
        return bug;
    }

    function spawnBug(e, generator) {
        playSound('spawn');
        let rotation = parseInt(generator.getAttribute('data-orientation'));
        const id = 'bug_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        const containerRect = container.getBoundingClientRect();
        
        let bugWidth = containerRect.width * 0.06;
        let bugHeight = containerRect.width * 0.09; 
        
        let mouseX = clientX - containerRect.left;
        let mouseY = clientY - containerRect.top;
        
        let newLeft = (mouseX - (bugWidth / 2)) + 'px';
        let newTop = (mouseY - (bugHeight / 2)) + 'px';
        
        const bug = createBugElement(id, rotation, newLeft, newTop);
        sendGameAction('spawn_bug', { id, rotation, left: newLeft, top: newTop });
        
        startDrag(e, bug);
    }

    function startDrag(e, element) {
        e.preventDefault();
        activeDragElement = element;
        
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        const containerRect = container.getBoundingClientRect();
        
        let mouseX = clientX - containerRect.left;
        let mouseY = clientY - containerRect.top;
        
        let compStyle = window.getComputedStyle(element);
        let currentLeft = parseFloat(compStyle.left) || 0;
        let currentTop = parseFloat(compStyle.top) || 0;
        
        initialX = mouseX - currentLeft;
        initialY = mouseY - currentTop;
        
        if (element.classList.contains('draggable-bug')) {
            container.appendChild(element); 
        }
    }

    let lastMoveSync = 0; 

    function drag(e) {
        if (!activeDragElement) return;
        e.preventDefault();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        const containerRect = container.getBoundingClientRect();
        
        let mouseX = clientX - containerRect.left;
        let mouseY = clientY - containerRect.top;
        
        let newLeft = (mouseX - initialX) + 'px';
        let newTop = (mouseY - initialY) + 'px';
        
        activeDragElement.style.left = newLeft;
        activeDragElement.style.top = newTop;

        if (activeDragElement.classList.contains('draggable-bug')) {
            const trashRect = trashZone.getBoundingClientRect();
            const bugRect = activeDragElement.getBoundingClientRect();

            if (bugRect.left < trashRect.right && bugRect.right > trashRect.left &&
                bugRect.top < trashRect.bottom && bugRect.bottom > trashRect.top) {
                trashZone.classList.add('hovered');
            } else {
                trashZone.classList.remove('hovered');
            }
        }
        
        let now = Date.now();
        if(db && !isRemoteAction && (now - lastMoveSync > 40)) {
            if (activeDragElement.classList.contains('draggable-leaf')) {
                db.ref(`game_state/leaves/${activeDragElement.id}`).update({ left: newLeft, top: newTop });
                sendGameAction('move_leaf', { id: activeDragElement.id, left: newLeft, top: newTop });
            } else {
                db.ref(`game_state/bugs/${activeDragElement.id}`).update({ left: newLeft, top: newTop });
                sendGameAction('move_bug', { id: activeDragElement.id, left: newLeft, top: newTop });
            }
            lastMoveSync = now;
        }
    }

    function endDrag(e) {
        if (!activeDragElement) return;
        
        if (activeDragElement.classList.contains('draggable-bug') && trashZone.classList.contains('hovered')) {
            playSound('trash');
            let id = activeDragElement.id;
            activeDragElement.remove();
            trashZone.classList.remove('hovered');
            sendGameAction('trash_bug', { id });
            if(db) db.ref(`game_state/bugs/${id}`).remove();
        } else {
            if(activeDragElement.classList.contains('draggable-bug') || activeDragElement.classList.contains('draggable-leaf')) {
                playSound('drop');
                if(db) {
                    let path = activeDragElement.classList.contains('draggable-leaf') ? 'leaves' : 'bugs';
                    db.ref(`game_state/${path}/${activeDragElement.id}`).update({ 
                        left: activeDragElement.style.left, 
                        top: activeDragElement.style.top 
                    });
                }
            }
        }
        activeDragElement = null;
    }

    [genUpRight, genDownLeft].forEach(gen => {
        gen.addEventListener('mousedown', (e) => spawnBug(e, gen));
        gen.addEventListener('touchstart', (e) => spawnBug(e, gen), {passive: false});
    });

    container.addEventListener('mousedown', (e) => {
        const item = e.target.closest('.draggable-bug, .draggable-leaf');
        if (item) startDrag(e, item);
    });
    container.addEventListener('touchstart', (e) => {
        const item = e.target.closest('.draggable-bug, .draggable-leaf');
        if (item) startDrag(e, item);
    }, {passive: false});

    window.addEventListener('mousemove', drag);
    window.addEventListener('touchmove', drag, {passive: false});
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);

    // --- Анімація кота (збережені оригінальні ID: frog, pupils, frog-mouth) ---
    const frog = document.getElementById('character');
    const pupils = document.getElementById('pupils');
    
    setInterval(() => {
        frog.style.transform = `scaleY(0.95)`;
        setTimeout(() => frog.style.transform = `scaleY(1)`, 200);
    }, 2000);

    function triggerFrog() {
        playSound('ribbit');
        const mouth = document.getElementById('frog-mouth');
        mouth.setAttribute('d', 'M 110 180 Q 150 230 190 180');
        frog.style.transform = `translateY(-20px) scaleY(1.05)`;
        setTimeout(() => {
            mouth.setAttribute('d', 'M 110 180 Q 150 210 190 180');
            frog.style.transform = `translateY(0) scaleY(1)`;
        }, 300);
    }

    frog.addEventListener('click', () => {
        triggerFrog();
        sendGameAction('frog_click', {});
    });

    window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 20;
        const y = (e.clientY / window.innerHeight - 0.5) * 20;
        pupils.style.transform = `translate(${x}px, ${y}px)`;
    });

    // --- Логіка схеми ---
    const equationInput = document.getElementById('equation-input');
    const schemaSvg = document.getElementById('schema-svg');
    const toggleBtn = document.getElementById('toggle-text-btn');
    const eyeIcon = document.getElementById('eye-icon');
    
    let isTextVisible = true;
    
    function setToggleText(visible) {
        isTextVisible = visible;
        if(isTextVisible) {
            equationInput.style.color = '#e65100';
            eyeIcon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
        } else {
            equationInput.style.color = 'transparent';
            eyeIcon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';
        }
    }

    toggleBtn.addEventListener('click', () => {
        playSound('btn');
        setToggleText(!isTextVisible);
        sendGameAction('toggle_text', { visible: isTextVisible });
    });

    equationInput.addEventListener('input', () => {
        drawSchema();
        sendGameAction('schema_input', { value: equationInput.value });
    });

    function drawSchema(forceSound = true) {
        const text = equationInput.value.replace(/\s+/g, '');
        const match = text.match(/^(\d+)([+-])(\d+)=?/);
        schemaSvg.innerHTML = ''; 
        if (!match) return;
        if(forceSound) playSound('draw');

        const num1 = parseInt(match[1]);
        const op = match[2];
        const num2 = parseInt(match[3]);

        const width = 800;
        const height = 450; 
        const padding = 80;
        const lineY = 180;
        const startX = padding;
        const endX = width - padding;

        let totalSegments = (op === '+') ? (num1 + num2) : (Math.max(num1, num2));
        if (totalSegments === 0) return;
        const segmentWidth = (endX - startX) / totalSegments;

        let svgContent = `<line x1="${startX}" y1="${lineY}" x2="${endX}" y2="${lineY}" stroke="#e91e63" stroke-width="6" stroke-linecap="round"/>`;

        for (let i = 0; i <= totalSegments; i++) {
            const x = startX + i * segmentWidth;
            svgContent += `<line x1="${x}" y1="${lineY - 15}" x2="${x}" y2="${lineY + 15}" stroke="#333" stroke-width="3"/>`;
        }

        svgContent += `<circle cx="${startX}" cy="${lineY}" r="8" fill="#e91e63"/>`;
        svgContent += `<circle cx="${endX}" cy="${lineY}" r="8" fill="#4caf50"/>`;

        const drawArc = (x1, x2, isTop, label, color) => {
            const sweep = isTop ? 1 : 0;
            const rY = isTop ? 50 : 40; 
            const pathY = isTop ? lineY - 20 : lineY + 20;
            const textY = isTop ? pathY - rY - 30 : pathY + rY + 45;
            const cx = (x1 + x2) / 2;
            const path = `<path d="M ${x1} ${pathY} A ${(x2-x1)/2} ${rY} 0 0 ${sweep} ${x2} ${pathY}" fill="none" stroke="${color}" stroke-width="3"/>`;
            const textStr = `<text x="${cx}" y="${textY}" font-family="Propysy Bold, cursive" font-size="85" fill="${color}" text-anchor="middle" dominant-baseline="middle">${label}</text>`;
            return path + textStr;
        };

        if (op === '+') {
            const splitX = startX + num1 * segmentWidth;
            svgContent += `<circle cx="${splitX}" cy="${lineY}" r="8" fill="#03a9f4"/>`;
            svgContent += drawArc(startX, splitX, true, num1, '#2c3e50');
            svgContent += drawArc(splitX, endX, true, num2, '#2c3e50');
            svgContent += drawArc(startX, endX, false, '?', '#e91e63');
        } else if (op === '-') {
            if (num1 >= num2) {
                const splitX = startX + num2 * segmentWidth;
                svgContent += `<circle cx="${splitX}" cy="${lineY}" r="8" fill="#03a9f4"/>`;
                svgContent += drawArc(startX, endX, true, num1, '#2c3e50');
                svgContent += drawArc(startX, splitX, false, '?', '#e91e63');
                svgContent += drawArc(splitX, endX, false, num2, '#2c3e50');
            }
        }
        schemaSvg.innerHTML = svgContent;
    }

    // --- Зчитування синхронізації з Firebase ---
    if (db) {
        db.ref('game_action').on('value', snap => {
            const action = snap.val();
            if (!action || action.senderId === myTabId || Date.now() - action.timestamp > 10000) return;
            isRemoteAction = true;
            
            if (action.type === 'spawn_bug') {
                createBugElement(action.data.id, action.data.rotation, action.data.left, action.data.top);
                playSound('spawn');
            } else if (action.type === 'move_bug') {
                let el = document.getElementById(action.data.id);
                if (el && el !== activeDragElement) { el.style.left = action.data.left; el.style.top = action.data.top; }
            } else if (action.type === 'move_leaf') {
                let el = document.getElementById(action.data.id);
                if (el && el !== activeDragElement) { el.style.left = action.data.left; el.style.top = action.data.top; }
            } else if (action.type === 'rotate_bug') {
                let el = document.getElementById(action.data.id);
                if (el) { el.setAttribute('data-rotation', action.data.rot); el.style.transform = `rotate(${action.data.rot}deg)`; playSound('flip'); }
            } else if (action.type === 'trash_bug') {
                let el = document.getElementById(action.data.id);
                if (el) { el.remove(); playSound('trash'); }
            } else if (action.type === 'frog_click') {
                triggerFrog();
            } else if (action.type === 'schema_input') {
                equationInput.value = action.data.value;
                drawSchema(false);
            } else if (action.type === 'toggle_text') {
                setToggleText(action.data.visible);
            } else if (action.type === 'draw_line') {
                drawLineSync(action.data);
            } else if (action.type === 'clear_canvas') {
                clearCanvasSync();
            }
            isRemoteAction = false;
        });

        db.ref('game_state/bugs').once('value', snap => {
            isRemoteAction = true;
            snap.forEach(child => {
                const b = child.val();
                createBugElement(child.key, b.rot || 45, b.left, b.top);
            });
            isRemoteAction = false;
        });
        
        db.ref('game_state/leaves').once('value', snap => {
            isRemoteAction = true;
            snap.forEach(child => {
                const lf = child.val();
                let el = document.getElementById(child.key);
                if (el) { el.style.left = lf.left; el.style.top = lf.top; }
            });
            isRemoteAction = false;
        });
    }

    // --- Система динамічних фонів (Theme Manager) ---
    const applyBackground = (url) => {
        document.body.style.backgroundImage = url === 'none' ? 'none' : `url(${url})`;
    };

    const savedTheme = localStorage.getItem('mySavedBg_' + CONFIG.gameId);
    if (savedTheme) applyBackground(savedTheme);

    if (db) {
        db.ref('game_theme').on('value', snap => {
            const url = snap.val();
            if (url) {
                applyBackground(url);
                localStorage.setItem('mySavedBg_' + CONFIG.gameId, url);
            }
        });
    }

    const themeBtn = document.getElementById('theme-manager-btn');
    const themeModal = document.getElementById('theme-modal');
    const themeClose = document.getElementById('theme-modal-close');
    const themeGallery = document.getElementById('theme-gallery');
    let themesLoaded = false;

    themeBtn.addEventListener('click', () => {
        themeModal.style.display = 'block';
        if (!themesLoaded) loadThemes();
    });
    themeClose.addEventListener('click', () => themeModal.style.display = 'none');

    function createThemeCard(url, title, isNone = false) {
        const card = document.createElement('div');
        card.className = 'theme-card' + (isNone ? ' no-bg' : '');
        if (!isNone) card.style.backgroundImage = `url(${url})`;
        const label = document.createElement('div');
        label.className = 'theme-label';
        label.innerText = title;
        card.appendChild(label);
        card.onclick = () => {
            const val = isNone ? 'none' : url;
            applyBackground(val);
            localStorage.setItem('mySavedBg_' + CONFIG.gameId, val);
            if (db) db.ref('game_theme').set(val);
            themeModal.style.display = 'none';
        };
        themeGallery.appendChild(card);
    }

    async function loadThemes() {
        themesLoaded = true;
        createThemeCard('none', 'Без фону', true);
        const baseUrl = 'https://olgazheltvai2.github.io/images/backgrounds/background_';
        
        for (let i = 1; i <= 1000; i++) {
            const url = `${baseUrl}${i}.webp`;
            const exists = await checkImageExists(url);
            if (exists) createThemeCard(url, `Фон ${i}`);
            else break;
        }
    }

    function checkImageExists(url) {
        return new Promise(resolve => {
            const img = new Image();
            img.onload = () => resolve(true);
            img.onerror = () => resolve(false);
            img.src = url;
        });
    }

    // --- Глобальний інструмент малювання ---
    const drawCanvas = document.getElementById('draw-canvas-global');
    const drawCtx = drawCanvas.getContext('2d');
    const toggleDrawBtn = document.getElementById('toggle-draw-btn-global');
    const drawPanel = document.getElementById('draw-panel-global');
    const closeDrawBtn = document.getElementById('close-draw-panel');
    const pencilBtn = document.getElementById('draw-pencil-btn');
    const eraserBtn = document.getElementById('draw-eraser-btn');
    const widthSlider = document.getElementById('draw-width-slider');
    const colorPicker = document.getElementById('draw-color-picker');
    const clearBtn = document.getElementById('draw-clear-btn');
    const drawHeader = document.getElementById('draw-panel-header');

    let isDrawingEnabled = false;
    let isDrawing = false;
    let drawMode = 'pencil';
    let lastX = 0, lastY = 0;

    function resizeDrawCanvas() {
        drawCanvas.width = window.innerWidth;
        drawCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeDrawCanvas);
    resizeDrawCanvas();

    toggleDrawBtn.addEventListener('click', () => {
        drawPanel.style.display = 'block';
        enableDrawing();
    });

    closeDrawBtn.addEventListener('click', () => {
        drawPanel.style.display = 'none';
        disableDrawing();
    });

    function enableDrawing() {
        isDrawingEnabled = true;
        drawCanvas.style.pointerEvents = 'auto';
    }
    function disableDrawing() {
        isDrawingEnabled = false;
        drawCanvas.style.pointerEvents = 'none';
    }

    pencilBtn.onclick = () => { drawMode = 'pencil'; pencilBtn.classList.add('active'); eraserBtn.classList.remove('active'); };
    eraserBtn.onclick = () => { drawMode = 'eraser'; eraserBtn.classList.add('active'); pencilBtn.classList.remove('active'); };

    clearBtn.onclick = () => {
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        sendGameAction('clear_canvas', {});
    };

    function clearCanvasSync() {
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    }

    function getMousePos(e) {
        const rect = drawCanvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        return {
            x: (clientX - rect.left) / drawCanvas.width,
            y: (clientY - rect.top) / drawCanvas.height
        };
    }

    function drawStart(e) {
        if (!isDrawingEnabled) return;
        isDrawing = true;
        const pos = getMousePos(e);
        lastX = pos.x; lastY = pos.y;
    }

    function drawMove(e) {
        if (!isDrawing || !isDrawingEnabled) return;
        e.preventDefault();
        const pos = getMousePos(e);
        const color = drawMode === 'eraser' ? null : colorPicker.value;
        const size = widthSlider.value;
        
        drawLineLocal(lastX, lastY, pos.x, pos.y, color, size);
        sendGameAction('draw_line', { x0: lastX, y0: lastY, x1: pos.x, y1: pos.y, c: color, s: size });
        
        lastX = pos.x; lastY = pos.y;
    }

    function drawEnd() { isDrawing = false; }

    function drawLineLocal(x0, y0, x1, y1, color, size) {
        drawCtx.beginPath();
        drawCtx.moveTo(x0 * drawCanvas.width, y0 * drawCanvas.height);
        drawCtx.lineTo(x1 * drawCanvas.width, y1 * drawCanvas.height);
        drawCtx.lineWidth = size;
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
        if (color === null) {
            drawCtx.globalCompositeOperation = 'destination-out';
            drawCtx.strokeStyle = 'rgba(0,0,0,1)';
        } else {
            drawCtx.globalCompositeOperation = 'source-over';
            drawCtx.strokeStyle = color;
        }
        drawCtx.stroke();
    }

    function drawLineSync(data) {
        drawLineLocal(data.x0, data.y0, data.x1, data.y1, data.c, data.s);
    }

    drawCanvas.addEventListener('mousedown', drawStart);
    drawCanvas.addEventListener('mousemove', drawMove);
    drawCanvas.addEventListener('mouseup', drawEnd);
    drawCanvas.addEventListener('mouseout', drawEnd);
    drawCanvas.addEventListener('touchstart', drawStart, {passive: false});
    drawCanvas.addEventListener('touchmove', drawMove, {passive: false});
    drawCanvas.addEventListener('touchend', drawEnd);

    let dpDrag = false, dpX = 0, dpY = 0;
    drawHeader.addEventListener('mousedown', e => {
        dpDrag = true; dpX = e.clientX - drawPanel.offsetLeft; dpY = e.clientY - drawPanel.offsetTop;
    });
    drawHeader.addEventListener('touchstart', e => {
        dpDrag = true; dpX = e.touches[0].clientX - drawPanel.offsetLeft; dpY = e.touches[0].clientY - drawPanel.offsetTop;
    }, {passive: false});
    window.addEventListener('mousemove', e => {
        if(dpDrag) { drawPanel.style.left = (e.clientX - dpX) + 'px'; drawPanel.style.top = (e.clientY - dpY) + 'px'; }
    });
    window.addEventListener('touchmove', e => {
        if(dpDrag) { drawPanel.style.left = (e.touches[0].clientX - dpX) + 'px'; drawPanel.style.top = (e.touches[0].clientY - dpY) + 'px'; }
    }, {passive: false});
    window.addEventListener('mouseup', () => dpDrag = false);
    window.addEventListener('touchend', () => dpDrag = false);

</script>
</body>
</html>
