<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    /* Базове скидання стилів та адаптація під весь екран без прокрутки */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1c130d;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Головний контейнер гри */
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Сцена SVG заповнює весь екран */
    #scene {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Мінімалістичні навігаційні кнопки (Назад / Далі) у стилі латуні та дерева */
    .nav-controls {
      position: absolute;
      top: 18px;
      right: 22px;
      display: flex;
      gap: 12px;
      z-index: 40;
    }

    .nav-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 3px solid #d6a54b;
      background: radial-gradient(circle at 32% 28%, #6d462b 0%, #3d2415 70%, #241309 100%);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.55),
        inset 0 2px 4px rgba(255, 224, 155, 0.45),
        inset 0 -3px 6px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s, opacity 0.2s;
    }

    .nav-btn:hover:not(:disabled) {
      transform: scale(1.1);
      filter: brightness(1.15);
    }

    .nav-btn:active:not(:disabled) {
      transform: scale(0.94);
    }

    .nav-btn:disabled {
      opacity: 0.32;
      cursor: default;
      filter: grayscale(0.5);
    }

    .nav-btn svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: #f8de9d;
      stroke-width: 3.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.6));
    }

    /* Панель завдання (стилізована під різьблену дерев'яну табличку з латунню) */
    #task-overlay {
      position: absolute;
      top: 4%;
      left: 50%;
      transform: translateX(-50%) scale(0.76);
      width: min(650px, 90vw);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.32s ease, transform 0.4s cubic-bezier(0.22, 1.25, 0.36, 1);
    }

    #task-overlay.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
    }

    /* Дерев'яна основа таблички з текстурою волокон */
    .wood-plaque {
      position: relative;
      padding: 24px 30px 28px;
      border-radius: 28px;
      border: 4px solid #c9963e;
      background:
        repeating-linear-gradient(
          3deg,
          rgba(255, 210, 140, 0.05) 0px,
          rgba(255, 210, 140, 0.05) 2px,
          rgba(30, 15, 5, 0.09) 2px,
          rgba(30, 15, 5, 0.09) 7px
        ),
        radial-gradient(ellipse at 50% 15%, #7c4d2b 0%, #523019 55%, #341c0d 100%);
      box-shadow:
        0 24px 48px rgba(0, 0, 0, 0.68),
        0 0 0 2px #523117,
        inset 0 3px 10px rgba(255, 222, 165, 0.35),
        inset 0 -8px 18px rgba(0, 0, 0, 0.55);
    }

    /* Декоративні латунні заклепки по кутах таблички */
    .rivet {
      position: absolute;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff0b8 0%, #c89132 55%, #6e4810 100%);
      box-shadow: 0 2px 3px rgba(0, 0, 0, 0.6);
    }
    .rivet.tl { top: 12px; left: 12px; }
    .rivet.tr { top: 12px; right: 12px; }
    .rivet.bl { bottom: 12px; left: 12px; }
    .rivet.br { bottom: 12px; right: 12px; }

    /* Внутрішнє віконце прикладу (стилізоване під темно-смарагдовий оксамит) */
    .expression-display {
      position: relative;
      margin: 0 auto 22px;
      padding: 16px 24px;
      border-radius: 20px;
      border: 3px solid #a6772c;
      background:
        radial-gradient(ellipse at 50% 30%, #2a473b 0%, #192d25 75%, #11201a 100%);
      box-shadow:
        inset 0 6px 16px rgba(0, 0, 0, 0.65),
        0 2px 6px rgba(255, 224, 150, 0.25);
      text-align: center;
      font-size: clamp(2.3rem, 5vw, 3.7rem);
      font-weight: 700;
      letter-spacing: 4px;
      color: #fdf0c8;
      text-shadow: 0 4px 8px rgba(0, 0, 0, 0.65), 0 0 18px rgba(255, 225, 140, 0.2);
    }

    /* Сітка варіантів відповідей */
    .answers-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    /* Кнопки відповідей у стилі теплих медово-латунних медальйонів */
    .answer-btn {
      position: relative;
      padding: 15px 8px;
      border-radius: 20px;
      border: 3px solid #e6b85c;
      background:
        radial-gradient(ellipse at 35% 22%, #f4c869 0%, #cf8d2c 55%, #995d16 100%);
      box-shadow:
        0 8px 0 #5c3309,
        0 12px 20px rgba(0, 0, 0, 0.5),
        inset 0 3px 6px rgba(255, 248, 214, 0.65);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(1.8rem, 3.8vw, 2.6rem);
      font-weight: 700;
      color: #2e1605;
      text-shadow: 0 1px 0 rgba(255, 240, 190, 0.6);
      cursor: pointer;
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s, filter 0.2s;
    }

    .answer-btn:hover:not(:disabled) {
      transform: translateY(-4px) scale(1.04);
      filter: brightness(1.08);
      box-shadow:
        0 12px 0 #5c3309,
        0 18px 26px rgba(0, 0, 0, 0.55),
        inset 0 3px 8px rgba(255, 250, 225, 0.8);
    }

    .answer-btn:active:not(:disabled) {
      transform: translateY(4px) scale(0.98);
      box-shadow:
        0 3px 0 #5c3309,
        0 5px 10px rgba(0, 0, 0, 0.45);
    }

    /* Анімація правильної відповіді */
    .answer-btn.correct {
      border-color: #b7f587;
      background: radial-gradient(ellipse at 35% 22%, #92e655 0%, #48a825 60%, #266b12 100%);
      color: #ffffff;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.45);
      box-shadow:
        0 6px 0 #1a470c,
        0 0 28px rgba(130, 245, 90, 0.8);
      animation: popSuccess 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Анімація помилкової відповіді */
    .answer-btn.wrong {
      border-color: #d97a6c;
      background: radial-gradient(ellipse at 35% 22%, #c76252 0%, #8f3629 65%, #5c1e16 100%);
      color: #f5d2cc;
      opacity: 0.65;
      box-shadow: 0 4px 0 #3b110b;
      animation: shakeWrong 0.45s ease-in-out;
    }

    @keyframes popSuccess {
      0% { transform: scale(1); }
      45% { transform: scale(1.16) rotate(-2deg); }
      75% { transform: scale(0.96) rotate(2deg); }
      100% { transform: scale(1.06); }
    }

    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-9px) rotate(-3deg); }
      40% { transform: translateX(8px) rotate(3deg); }
      60% { transform: translateX(-6px) rotate(-2deg); }
      80% { transform: translateX(5px) rotate(1deg); }
    }

    /* Плавне дихання котика (на окремій обгортці без SVG transform) */
    @keyframes catBreathe {
      0%, 100% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-4px) scaleY(1.015); }
    }

    #cat-breathe {
      transform-origin: 0px 0px;
      animation: catBreathe 3.6s ease-in-out infinite;
    }

    /* Плаваючі пилинки в сонячному промені */
    @keyframes floatDust {
      0% { transform: translate(0, 0); opacity: 0.14; }
      50% { transform: translate(20px, -26px); opacity: 0.58; }
      100% { transform: translate(42px, -50px); opacity: 0.08; }
    }

    .dust-mote {
      animation: floatDust 10s ease-in-out infinite;
    }

    /* Анімація мишки ТІЛЬКИ після того, як її знайшли (під час ховання вона абсолютно нерухома) */
    @keyframes mouseCaughtJump {
      0% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-14px) scale(1.14) rotate(-6deg); }
      65% { transform: translateY(-4px) scale(1.08) rotate(5deg); }
      100% { transform: translateY(0) scale(1.06) rotate(0deg); }
    }

    #mouse-clickable {
      cursor: pointer;
    }

    #mouse-inner.caught {
      animation: mouseCaughtJump 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @media (max-width: 600px) {
      .answers-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .wood-plaque {
        padding: 18px 18px 22px;
      }
      .nav-controls {
        top: 12px;
        right: 12px;
      }
      .nav-btn {
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Мінімалістичні кнопки навігації: Назад та Далі -->
    <div class="nav-controls">
      <button id="btn-prev" class="nav-btn" aria-label="Назад" disabled>
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button id="btn-next" class="nav-btn" aria-label="Далі">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>

    <!-- Деталізована реалістична SVG-сцена: кімната з 20 схованками + котик крупним планом -->
    <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- ================= ПАТЕРНИ ТА ТЕКСТУРИ КІМНАТИ ================= -->
        <pattern id="wallpaperPattern" width="90" height="120" patternUnits="userSpaceOnUse">
          <rect width="90" height="120" fill="#d9c39e"/>
          <rect width="45" height="120" fill="#d0b78d" opacity="0.55"/>
          <path d="M45 18 C52 28, 52 42, 45 52 C38 42, 38 28, 45 18 Z" fill="#bfa073" opacity="0.45"/>
          <path d="M0 78 C7 88, 7 102, 0 112 C-7 102, -7 88, 0 78 Z" fill="#bfa073" opacity="0.45"/>
          <path d="M90 78 C97 88, 97 102, 90 112 C83 102, 83 88, 90 78 Z" fill="#bfa073" opacity="0.45"/>
          <circle cx="45" cy="35" r="2.8" fill="#ebd9b8" opacity="0.45"/>
        </pattern>

        <pattern id="parquetPattern" width="160" height="44" patternUnits="userSpaceOnUse">
          <rect width="160" height="44" fill="#8b5a34"/>
          <rect x="0" y="0" width="79" height="21" fill="#9c663b"/>
          <rect x="81" y="0" width="79" height="21" fill="#82512c"/>
          <rect x="40" y="22" width="79" height="21" fill="#925e35"/>
          <rect x="121" y="22" width="39" height="21" fill="#7a4a26"/>
          <rect x="0" y="22" width="39" height="21" fill="#7a4a26"/>
          <line x1="0" y1="21.5" x2="160" y2="21.5" stroke="#523017" stroke-width="1.2"/>
          <line x1="0" y1="43.5" x2="160" y2="43.5" stroke="#523017" stroke-width="1.2"/>
          <line x1="80" y1="0" x2="80" y2="21" stroke="#523017" stroke-width="1"/>
          <line x1="40" y1="22" x2="40" y2="44" stroke="#523017" stroke-width="1"/>
          <line x1="120" y1="22" x2="120" y2="44" stroke="#523017" stroke-width="1"/>
        </pattern>

        <pattern id="rugPattern" width="60" height="40" patternUnits="userSpaceOnUse">
          <rect width="60" height="40" fill="#8c2d27"/>
          <polygon points="30,4 54,20 30,36 6,20" fill="#b34934" stroke="#e0b25c" stroke-width="1.5"/>
          <polygon points="30,11 42,20 30,29 18,20" fill="#2c4f4d"/>
          <circle cx="30" cy="20" r="3" fill="#f0c975"/>
        </pattern>

        <pattern id="wickerPattern" width="16" height="12" patternUnits="userSpaceOnUse">
          <rect width="16" height="12" fill="#9c6c3c"/>
          <rect x="0" y="0" width="8" height="5" rx="2" fill="#bd8b52"/>
          <rect x="8" y="6" width="8" height="5" rx="2" fill="#bd8b52"/>
          <line x1="0" y1="6" x2="16" y2="6" stroke="#5e3c1b" stroke-width="1"/>
        </pattern>

        <!-- ================= ГРАДІЄНТИ ОСВІТЛЕННЯ ТА МЕБЛІВ ================= -->
        <linearGradient id="wallLight" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fff4d2" stop-opacity="0.36"/>
          <stop offset="45%" stop-color="#d4a76a" stop-opacity="0.06"/>
          <stop offset="100%" stop-color="#26160b" stop-opacity="0.54"/>
        </linearGradient>

        <linearGradient id="sunBeam" x1="0%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#fff9db" stop-opacity="0.34"/>
          <stop offset="65%" stop-color="#ffe7a8" stop-opacity="0.09"/>
          <stop offset="100%" stop-color="#ffe7a8" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="floorShade" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#2e180b" stop-opacity="0.55"/>
          <stop offset="35%" stop-color="#000000" stop-opacity="0"/>
          <stop offset="100%" stop-color="#170c05" stop-opacity="0.72"/>
        </linearGradient>

        <linearGradient id="woodDark" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#6e4325"/>
          <stop offset="50%" stop-color="#4d2c16"/>
          <stop offset="100%" stop-color="#2c160a"/>
        </linearGradient>

        <linearGradient id="woodWarm" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#a86d3e"/>
          <stop offset="50%" stop-color="#7a4924"/>
          <stop offset="100%" stop-color="#4d2a12"/>
        </linearGradient>

        <linearGradient id="velvetChair" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3e786c"/>
          <stop offset="55%" stop-color="#235249"/>
          <stop offset="100%" stop-color="#122e29"/>
        </linearGradient>

        <linearGradient id="velvetHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#589c8e"/>
          <stop offset="100%" stop-color="#214d44"/>
        </linearGradient>

        <linearGradient id="curtainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#521f24"/>
          <stop offset="28%" stop-color="#8c3b42"/>
          <stop offset="52%" stop-color="#592228"/>
          <stop offset="78%" stop-color="#99424a"/>
          <stop offset="100%" stop-color="#42171b"/>
        </linearGradient>

        <linearGradient id="skyOutside" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#7ab3d6"/>
          <stop offset="65%" stop-color="#c4e3f2"/>
          <stop offset="100%" stop-color="#f7ebd2"/>
        </linearGradient>

        <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#6fa649"/>
          <stop offset="55%" stop-color="#3c6e26"/>
          <stop offset="100%" stop-color="#1f3d12"/>
        </linearGradient>

        <linearGradient id="leafGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#80b858"/>
          <stop offset="100%" stop-color="#2a521b"/>
        </linearGradient>

        <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#c46b45"/>
          <stop offset="40%" stop-color="#d97d54"/>
          <stop offset="80%" stop-color="#8c4427"/>
          <stop offset="100%" stop-color="#592815"/>
        </linearGradient>

        <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff4bf" stop-opacity="0.82"/>
          <stop offset="45%" stop-color="#ffd573" stop-opacity="0.26"/>
          <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
        </radialGradient>

        <!-- ================= РЕАЛІСТИЧНІ ГРАДІЄНТИ КОТИКА ================= -->
        <radialGradient id="catFurHead" cx="48%" cy="36%" r="58%">
          <stop offset="0%" stop-color="#f7c07c"/>
          <stop offset="42%" stop-color="#db8839"/>
          <stop offset="78%" stop-color="#a8571a"/>
          <stop offset="100%" stop-color="#632f0c"/>
        </radialGradient>

        <radialGradient id="catFurBody" cx="50%" cy="22%" r="68%">
          <stop offset="0%" stop-color="#e89a4d"/>
          <stop offset="55%" stop-color="#b56421"/>
          <stop offset="100%" stop-color="#5c2b0b"/>
        </radialGradient>

        <radialGradient id="catChestCream" cx="50%" cy="32%" r="62%">
          <stop offset="0%" stop-color="#fff8ec"/>
          <stop offset="58%" stop-color="#edd4b2"/>
          <stop offset="100%" stop-color="#c4915e"/>
        </radialGradient>

        <radialGradient id="catMuzzleGrad" cx="50%" cy="35%" r="62%">
          <stop offset="0%" stop-color="#fffaf2"/>
          <stop offset="62%" stop-color="#f2dec4"/>
          <stop offset="100%" stop-color="#cc9b6d"/>
        </radialGradient>

        <linearGradient id="catEarInner" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f5b0a8"/>
          <stop offset="65%" stop-color="#d97b77"/>
          <stop offset="100%" stop-color="#964747"/>
        </linearGradient>

        <radialGradient id="catNoseGrad" cx="45%" cy="28%" r="65%">
          <stop offset="0%" stop-color="#ffc2c2"/>
          <stop offset="55%" stop-color="#d96b70"/>
          <stop offset="100%" stop-color="#803037"/>
        </radialGradient>

        <!-- Скляний реалістичний ефект котячих очей (смарагдово-бурштиновий) -->
        <radialGradient id="catIrisGrad" cx="50%" cy="46%" r="52%">
          <stop offset="0%" stop-color="#ede064"/>
          <stop offset="32%" stop-color="#94bf3b"/>
          <stop offset="70%" stop-color="#387529"/>
          <stop offset="92%" stop-color="#183b16"/>
          <stop offset="100%" stop-color="#0b1c0a"/>
        </radialGradient>

        <!-- ================= РЕАЛІСТИЧНІ ГРАДІЄНТИ МИШКИ ================= -->
        <radialGradient id="mouseFurGrad" cx="42%" cy="35%" r="62%">
          <stop offset="0%" stop-color="#ada49a"/>
          <stop offset="52%" stop-color="#787068"/>
          <stop offset="88%" stop-color="#4a443f"/>
          <stop offset="100%" stop-color="#2b2724"/>
        </radialGradient>

        <radialGradient id="mouseEarGrad" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#ebb0b0"/>
          <stop offset="65%" stop-color="#bf767b"/>
          <stop offset="100%" stop-color="#7a464b"/>
        </radialGradient>

        <!-- Фільтри тіней для об'єму та глибини -->
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#170c05" flood-opacity="0.5"/>
        </filter>
        <filter id="deepShadow" x="-25%" y="-25%" width="150%" height="150%">
          <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0d0602" flood-opacity="0.65"/>
        </filter>
      </defs>

      <!-- ======================================================================= -->
      <!-- ШАР 1: ЗАДНІЙ ПЛАН КІМНАТИ (СТІНИ, ПІДЛОГА, ВІКНО, КОМОД, МЕБЛІ)        -->
      <!-- ======================================================================= -->
      <g id="room-background">
        <!-- Стіна зі шпалерами -->
        <rect x="0" y="0" width="1600" height="585" fill="url(#wallpaperPattern)"/>
        <rect x="0" y="0" width="1600" height="585" fill="url(#wallLight)"/>

        <!-- Дерев'яна стінова панель та плінтус -->
        <rect x="0" y="475" width="1600" height="110" fill="url(#woodWarm)"/>
        <rect x="0" y="470" width="1600" height="12" fill="#ba7d49" stroke="#4f2c13" stroke-width="2"/>
        <g stroke="#4f2c13" stroke-width="2" fill="none" opacity="0.45">
          <rect x="30" y="492" width="140" height="70" rx="4"/>
          <rect x="195" y="492" width="140" height="70" rx="4"/>
          <rect x="360" y="492" width="140" height="70" rx="4"/>
          <rect x="525" y="492" width="140" height="70" rx="4"/>
          <rect x="690" y="492" width="140" height="70" rx="4"/>
          <rect x="855" y="492" width="140" height="70" rx="4"/>
          <rect x="1020" y="492" width="140" height="70" rx="4"/>
          <rect x="1185" y="492" width="140" height="70" rx="4"/>
          <rect x="1350" y="492" width="210" height="70" rx="4"/>
        </g>

  <script>
    /* =========================================================================
       1. ЗВУКОВИЙ РУШІЙ (WEB AUDIO API — БЕЗ ЗОВНІШНІХ ФАЙЛІВ ТА БЕЗ СЛІВ)
    ========================================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Писк мишки при знаходженні
      playMouseSqueak() {
        this.init();
        const now = this.ctx.currentTime;
        [0, 0.11].forEach((offset, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1480 + i * 240, now + offset);
          osc.frequency.exponentialRampToValueAtTime(2480 + i * 280, now + offset + 0.055);
          osc.frequency.exponentialRampToValueAtTime(1650, now + offset + 0.095);

          gain.gain.setValueAtTime(0.001, now + offset);
          gain.gain.linearRampToValueAtTime(0.16, now + offset + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.1);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.11);
        });
      }

      // Захоплене «мрр-мяу!» котика при виявленні мишки
      playCatTrill() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(620, now + 0.22);

        lfo.frequency.setValueAtTime(28, now);
        lfoGain.gain.setValueAtTime(24, now);
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.14, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        lfo.start(now);
        osc.stop(now + 0.3);
        lfo.stop(now + 0.3);
      }

      // Різноманітні святкові звуки при правильній відповіді (3 варіації)
      playSuccess(variant = 0) {
        this.init();
        const now = this.ctx.currentTime;
        const melodies = [
          [523.25, 659.25, 783.99, 1046.5],
          [587.33, 739.99, 880.0, 1174.66],
          [440.0, 554.37, 659.25, 880.0, 1108.7]
        ];
        const notes = melodies[variant % melodies.length];

        notes.forEach((freq, idx) => {
          const t = now + idx * 0.085;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = idx % 2 === 0 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(freq, t);

          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.18, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.36);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.38);
        });
      }

      // М'який кумедний звук при помилці (2 варіації)
      playError(variant = 0) {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = variant % 2 === 0 ? 'sawtooth' : 'triangle';

        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(145, now + 0.24);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(650, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.14, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }

      // Клацання для кнопок навігації
      playClick() {
        this.init();
        const now = this.ctx.currentTime;

        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.05);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.065);
      }
    }

    const sound = new SoundEngine();

    /* =========================================================================
       2. ГЕНЕРАТОР ПРИКЛАДІВ З ПЕРЕХОДОМ ЧЕРЕЗ ДЕСЯТОК
       Двозначне ± однозначне з обов'язковим переходом через десяток.
    ========================================================================= */
    function generateProblem(prevText = '') {
      let a, b, op, answer, text;
      let guard = 0;

      do {
        guard++;
        const isAddition = Math.random() < 0.5;

        if (isAddition) {
          // Додавання: одиниці a (2..9) + b > 10 (строгий перехід через десяток), сума <= 98
          const tens = Math.floor(Math.random() * 8) + 1;  // 1..8
          const units = Math.floor(Math.random() * 8) + 2; // 2..9
          a = tens * 10 + units;
          const minB = 11 - units;
          b = Math.floor(Math.random() * (9 - minB + 1)) + minB;
          op = '+';
          answer = a + b;
        } else {
          // Віднімання: одиниці a (1..8) менші за b (2..9)
          const tens = Math.floor(Math.random() * 8) + 2;  // 2..9
          const units = Math.floor(Math.random() * 8) + 1; // 1..8
          a = tens * 10 + units;
          const minB = units + 1;
          b = Math.floor(Math.random() * (9 - minB + 1)) + minB;
          op = '−';
          answer = a - b;
        }

        text = `${a} ${op} ${b}`;
      } while (text === prevText && guard < 20);

      // Підбираємо 3 реалістичні помилкові варіанти
      const candidates = new Set([answer]);
      const offsets = op === '+'
        ? [-10, -1, 1, 2, -2, 10, -9, 9]
        : [10, -1, 1, -2, 2, -10, 9, -9];

      for (let i = offsets.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [offsets[i], offsets[j]] = [offsets[j], offsets[i]];
      }

      for (const off of offsets) {
        if (candidates.size >= 4) break;
        const val = answer + off;
        if (val > 0 && val <= 99) {
          candidates.add(val);
        }
      }

      const options = Array.from(candidates);
      for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];
      }

      return { a, b, op, answer, text, options };
    }

    const catHead = document.getElementById('cat-head');
    const catMotion = document.getElementById('cat-motion');
    const pupilLeftWrap = document.getElementById('pupil-left-wrap');
    const pupilRightWrap = document.getElementById('pupil-right-wrap');
    const pupilLeft = document.getElementById('pupil-left');
    const pupilRight = document.getElementById('pupil-right');
    const eyelidLeft = document.getElementById('eyelid-left');
    const eyelidRight = document.getElementById('eyelid-right');
    const happyEyeLeft = document.getElementById('happy-eye-left');
    const happyEyeRight = document.getElementById('happy-eye-right');
    const earLeft = document.getElementById('ear-left');
    const earRight = document.getElementById('ear-right');
    const catTongue = document.getElementById('cat-tongue');

    /* =========================================================================
       5. ЖИВА АНІМАЦІЯ КОТИКА (ОЗИРАЄТЬСЯ ПО КІМНАТІ, МОРГАЄ, РЕАГУЄ)
    ========================================================================= */
    let catLookTarget = { x: 0, y: 0 };
    let catCurrentLook = { x: 0, y: 0 };
    let autoLookTimer = null;
    let isPointerActive = false;
    let pointerTimeout = null;

    // Плавний рух очей та голови котика у 60fps
    function animateCatLoop() {
      catCurrentLook.x += (catLookTarget.x - catCurrentLook.x) * 0.085;
      catCurrentLook.y += (catLookTarget.y - catCurrentLook.y) * 0.085;

      const px = catCurrentLook.x * 13;
      const py = catCurrentLook.y * 9;
      pupilLeftWrap.setAttribute('transform', `translate(${px.toFixed(2)}, ${py.toFixed(2)})`);
      pupilRightWrap.setAttribute('transform', `translate(${px.toFixed(2)}, ${py.toFixed(2)})`);

      // Поворот і нахил голови котика в бік, куди він дивиться
      if (state.phase === 'hunting') {
        const headRot = catCurrentLook.x * 8;
        const headShiftX = catCurrentLook.x * 14;
        const headShiftY = catCurrentLook.y * 7;
        catHead.setAttribute(
          'transform',
          `translate(${headShiftX.toFixed(1)}, ${(-238 + headShiftY).toFixed(1)}) rotate(${headRot.toFixed(2)})`
        );
      }

      requestAnimationFrame(animateCatLoop);
    }

    // Автономне озирання котика в різні боки кімнати під час пошуку мишки
    function scheduleAutoLook() {
      clearTimeout(autoLookTimer);
      autoLookTimer = setTimeout(() => {
        if (state.phase === 'hunting' && !isPointerActive) {
          const directions = [
            { x: -1.0, y: -0.45 }, // дивиться ліворуч на вікно/крісло
            { x: 1.0,  y: -0.5  }, // дивиться праворуч на книжкову шафу
            { x: -0.8, y: 0.35  }, // дивиться ліворуч вниз на клубок/книги
            { x: 0.85, y: 0.3   }, // дивиться праворуч вниз на килим/капець
            { x: 0.0,  y: -0.65 }, // дивиться вгору на картину/годинник
            { x: 0.0,  y: 0.0   }  // дивиться прямо на дитину
          ];
          const next = directions[Math.floor(Math.random() * directions.length)];
          catLookTarget = next;
          twitchEar(Math.random() < 0.5 ? 'left' : 'right');
        }
        scheduleAutoLook();
      }, 1300 + Math.random() * 1500);
    }

    // Легке стеження очима за курсором дитини
    document.getElementById('scene').addEventListener('pointermove', (e) => {
      if (state.phase !== 'hunting') return;
      const rect = e.currentTarget.getBoundingClientRect();
      const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      const ny = ((e.clientY - rect.top) / rect.height) * 2 - 1;
      catLookTarget = {
        x: Math.max(-1, Math.min(1, nx)),
        y: Math.max(-0.8, Math.min(0.6, ny))
      };
      isPointerActive = true;
      clearTimeout(pointerTimeout);
      pointerTimeout = setTimeout(() => { isPointerActive = false; }, 1100);
    });

    // Сіпання вухом котика
    function twitchEar(side) {
      const el = side === 'left' ? earLeft : earRight;
      const base = side === 'left' ? 'translate(-108, -108)' : 'translate(108, -108)';
      const angle = side === 'left' ? -15 : 15;
      el.style.transition = 'transform 0.12s ease-out';
      el.setAttribute('transform', `${base} rotate(${angle})`);
      setTimeout(() => {
        el.setAttribute('transform', `${base} rotate(0)`);
      }, 145);
    }

    // Природне моргання очима котика
    function scheduleBlink() {
      setTimeout(() => {
        if (state.phase !== 'celebrating') {
          eyelidLeft.setAttribute('d', 'M-42 -40 Q0 -46 42 -40 L42 36 Q0 44 -42 36 Z');
          eyelidRight.setAttribute('d', 'M-42 -40 Q0 -46 42 -40 L42 36 Q0 44 -42 36 Z');
          setTimeout(() => {
            eyelidLeft.setAttribute('d', 'M-42 -40 Q0 -46 42 -40 L42 -40 Q0 -40 -42 -40 Z');
            eyelidRight.setAttribute('d', 'M-42 -40 Q0 -46 42 -40 L42 -40 Q0 -40 -42 -40 Z');
          }, 135);
        }
        scheduleBlink();
      }, 2600 + Math.random() * 3200);
    }

    // Зміна емоційного стану котика: 'hunting' | 'excited' | 'happy' | 'confused'
    function setCatMood(mood, spot = null) {
      happyEyeLeft.setAttribute('opacity', '0');
      happyEyeRight.setAttribute('opacity', '0');
      catTongue.setAttribute('opacity', '0');
      pupilLeft.setAttribute('opacity', '1');
      pupilRight.setAttribute('opacity', '1');
      catMotion.style.transition = 'transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)';
      catMotion.setAttribute('transform', 'translate(0, 0) scale(1)');

      if (mood === 'hunting') {
        pupilLeft.setAttribute('rx', '12');
        pupilLeft.setAttribute('ry', '25');
        pupilRight.setAttribute('rx', '12');
        pupilRight.setAttribute('ry', '25');
        earLeft.setAttribute('transform', 'translate(-108, -108) rotate(0)');
        earRight.setAttribute('transform', 'translate(108, -108) rotate(0)');
      } else if (mood === 'excited') {
        // Котик помітив мишку — зіниці розширюються, вушка насторожені!
        pupilLeft.setAttribute('rx', '24');
        pupilLeft.setAttribute('ry', '28');
        pupilRight.setAttribute('rx', '24');
        pupilRight.setAttribute('ry', '28');
        if (spot) {
          catLookTarget = {
            x: Math.max(-1, Math.min(1, (spot.x - 800) / 550)),
            y: Math.max(-0.8, Math.min(0.5, (spot.y - 550) / 350))
          };
          const headRot = catLookTarget.x * 7;
          catHead.setAttribute('transform', `translate(${(catLookTarget.x * 12).toFixed(1)}, -234) rotate(${headRot.toFixed(1)})`);
        }
        catMotion.setAttribute('transform', 'translate(0, 18) scale(1.03, 0.96)');
        earLeft.setAttribute('transform', 'translate(-108, -108) rotate(8)');
        earRight.setAttribute('transform', 'translate(108, -108) rotate(-8)');
      } else if (mood === 'happy') {
        // Щасливий стрибок котика, примружені очі та язичок
        happyEyeLeft.setAttribute('opacity', '1');
        happyEyeRight.setAttribute('opacity', '1');
        pupilLeft.setAttribute('opacity', '0');
        pupilRight.setAttribute('opacity', '0');
        catTongue.setAttribute('opacity', '1');
        catMotion.setAttribute('transform', 'translate(0, -34) scale(1.06)');
        catHead.setAttribute('transform', 'translate(0, -242) rotate(-5)');
        setTimeout(() => {
          if (state.phase === 'celebrating') {
            catMotion.setAttribute('transform', 'translate(0, -10) scale(1.02)');
            catHead.setAttribute('transform', 'translate(0, -238) rotate(5)');
          }
        }, 280);
      } else if (mood === 'confused') {
        // Здивований нахил голови при помилці
        const tilt = state.errorCount % 2 === 0 ? -13 : 13;
        catHead.setAttribute('transform', `translate(0, -232) rotate(${tilt})`);
        earLeft.setAttribute('transform', 'translate(-108, -108) rotate(-20)');
        earRight.setAttribute('transform', 'translate(108, -108) rotate(20)');
        setTimeout(() => {
          if (state.phase === 'solving') {
            catHead.setAttribute('transform', 'translate(0, -238) rotate(0)');
            earLeft.setAttribute('transform', 'translate(-108, -108) rotate(5)');
            earRight.setAttribute('transform', 'translate(108, -108) rotate(-5)');
          }
        }, 550);
      }
    }

    /* =========================================================================
       6. СПЕЦЕФЕКТИ (ЗІРОЧКИ ТА КОНФЕТІ ПРИ УСПІШНІЙ ВІДПОВІДІ)
    ========================================================================= */
    function spawnCelebrationFX(originX = 800, originY = 440) {
      fxLayer.innerHTML = '';
      const colors = ['#ffd95c', '#ff7b54', '#7ce65e', '#6bc5ff', '#ff9ecd', '#fff4b8'];
      const count = 34;

      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const speed = 130 + Math.random() * 260;
        const dx = Math.cos(angle) * speed;
        const dy = Math.sin(angle) * speed - 70;
        const color = colors[i % colors.length];
        const size = 8 + Math.random() * 14;

        const el = document.createElementNS('http://www.w3.org/2000/svg', i % 2 === 0 ? 'polygon' : 'circle');
        if (i % 2 === 0) {
          const pts = [];
          for (let p = 0; p < 10; p++) {
            const r = p % 2 === 0 ? size : size * 0.45;
            const a = (Math.PI * p) / 5 - Math.PI / 2;
            pts.push(`${(Math.cos(a) * r).toFixed(1)},${(Math.sin(a) * r).toFixed(1)}`);
          }
          el.setAttribute('points', pts.join(' '));
        } else {
          el.setAttribute('r', (size * 0.55).toFixed(1));
        }

        el.setAttribute('fill', color);
        el.setAttribute('transform', `translate(${originX}, ${originY}) scale(0.2)`);
        el.style.transition = `transform ${0.75 + Math.random() * 0.45}s cubic-bezier(0.16, 0.9, 0.3, 1), opacity 0.9s ease-out`;
        el.style.opacity = '1';
        fxLayer.appendChild(el);

        requestAnimationFrame(() => {
          el.setAttribute(
            'transform',
            `translate(${(originX + dx).toFixed(1)}, ${(originY + dy).toFixed(1)}) rotate(${(Math.random() * 360).toFixed(0)}) scale(1)`
          );
          setTimeout(() => { el.style.opacity = '0'; }, 550);
        });
      }

      setTimeout(() => { fxLayer.innerHTML = ''; }, 1400);
    }

    /* =========================================================================
       7. ЛОГІКА РІВНІВ (ПОШУК НЕРУХОМОЇ МИШКИ -> ПРИКЛАД -> НОВИЙ РАУНД)
    ========================================================================= */
    function createNewLevel() {
      const prevLevel = state.levels[state.levels.length - 1];
      const problem = generateProblem(prevLevel ? prevLevel.problem.text : '');

      // Обираємо випадкову схованку, якої не було серед останніх 6 раундів
      const availableSpots = HIDING_SPOTS.filter(s => !state.recentSpots.includes(s.id));
      const pool = availableSpots.length > 0 ? availableSpots : HIDING_SPOTS;
      const spot = pool[Math.floor(Math.random() * pool.length)];

      state.recentSpots.push(spot.id);
      if (state.recentSpots.length > 6) {
        state.recentSpots.shift();
      }

      return { problem, spot };
    }

    function loadLevel(index) {
      clearTimeout(state.transitionTimer);

      state.currentIndex = index;
      state.phase = 'hunting';

      const level = state.levels[index];
      const { spot } = level;

      // Ховаємо панель прикладу
      taskOverlay.classList.remove('visible');

      // Розміщуємо мишку в новій схованці (абсолютно нерухомо!)
      mouseClickable.style.transition = 'none';
      mouseClickable.style.pointerEvents = 'auto';
      mouseClickable.style.opacity = '1';
      mouseClickable.setAttribute(
        'transform',
        `translate(${spot.x}, ${spot.y}) scale(${spot.scale * spot.flipX}, ${spot.scale}) rotate(${spot.rot})`
      );
      mouseInner.classList.remove('caught');

      // Повертаємо котика в режим активного озирання
      setCatMood('hunting');
      updateNavButtons();
    }

    function updateNavButtons() {
      btnPrev.disabled = state.currentIndex <= 0;
    }

    // Клік по знайденій мишці
    function onMouseFound() {
      if (state.phase !== 'hunting') return;

      state.phase = 'solving';
      const level = state.levels[state.currentIndex];

      sound.playMouseSqueak();
      setTimeout(() => sound.playCatTrill(), 120);
      setCatMood('excited', level.spot);

      // Мишка реагує стрибком тільки після виявлення
      mouseClickable.style.pointerEvents = 'none';
      mouseInner.classList.add('caught');

      expressionDisplay.textContent = `${level.problem.text} = ?`;
      answersGrid.innerHTML = '';

      level.problem.options.forEach((val) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = val;
        btn.addEventListener('click', () => handleAnswer(btn, val, level.problem.answer));
        answersGrid.appendChild(btn);
      });

      setTimeout(() => {
        if (state.phase === 'solving') {
          taskOverlay.classList.add('visible');
        }
      }, 240);
    }

    // Перевірка відповіді дитини
    function handleAnswer(btn, chosen, correct) {
      if (state.phase !== 'solving') return;

      if (chosen === correct) {
        state.phase = 'celebrating';
        state.successCount++;

        btn.classList.add('correct');
        expressionDisplay.textContent = `${state.levels[state.currentIndex].problem.text} = ${correct}`;
        Array.from(answersGrid.children).forEach(b => b.disabled = true);

        sound.playSuccess(state.successCount);
        setCatMood('happy');
        spawnCelebrationFX(800, 440);

        // Мишка швиденько ховається
        mouseClickable.style.transition = 'opacity 0.3s ease';
        mouseClickable.style.opacity = '0';

        state.transitionTimer = setTimeout(() => {
          goNextLevel();
        }, 1450);
      } else {
        state.errorCount++;
        btn.classList.add('wrong');
        btn.disabled = true;
        sound.playError(state.errorCount);
        setCatMood('confused');
      }
    }

    function goNextLevel() {
      if (state.currentIndex < state.levels.length - 1) {
        loadLevel(state.currentIndex + 1);
      } else {
        state.levels.push(createNewLevel());
        loadLevel(state.levels.length - 1);
      }
    }

    function goPrevLevel() {
      if (state.currentIndex > 0) {
        loadLevel(state.currentIndex - 1);
      }
    }

    /* =========================================================================
       8. ПІДКЛЮЧЕННЯ ПОДІЙ ТА СТАРТ ГРИ
    ========================================================================= */
    mouseClickable.addEventListener('click', onMouseFound);

    btnNext.addEventListener('click', () => {
      sound.playClick();
      goNextLevel();
    });

    btnPrev.addEventListener('click', () => {
      sound.playClick();
      goPrevLevel();
    });

    // Керування стрілками клавіатури для зручності на уроці
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        sound.playClick();
        goNextLevel();
      } else if (e.key === 'ArrowLeft' && state.currentIndex > 0) {
        sound.playClick();
        goPrevLevel();
      }
    });

    // Старт гри
    state.levels.push(createNewLevel());
    loadLevel(0);
    animateCatLoop();
    scheduleAutoLook();
    scheduleBlink();
  </script>
</body>
</html>
