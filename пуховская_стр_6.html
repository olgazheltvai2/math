<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зимова Математика</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        :root {
            --snow-color: #f0f8ff;
            --ice-color: rgba(200, 230, 255, 0.4);
            --wood-color: #5c4033;
            --text-color: #1a3b5c;
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(to bottom, #1e3c58 0%, #4a7a9e 50%, #a4c8e1 100%);
            color: var(--text-color);
            user-select: none;
        }

        /* Falling Snow Background */
        #snow-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .snowflake-bg {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0); }
            100% { transform: translateY(110vh) translateX(20px); }
        }

        /* Landscape */
        .landscape {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 40%;
            z-index: 2;
            pointer-events: none;
        }
        .hill-back {
            position: absolute; bottom: 0; left: -10%; width: 120%; height: 100%;
            background: #b0cde0;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }
        .hill-front {
            position: absolute; bottom: 0; left: -10%; width: 120%; height: 70%;
            background: #ffffff;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.1) inset;
        }
        
        /* Trees */
        .tree {
            position: absolute;
            bottom: 10%; width: 100px; height: 180px;
            z-index: 3;
        }
        .tree::before {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 12px; height: 50px; background: #4a3628;
        }
        .tree-leaves {
            position: absolute; bottom: 20px; left: 0; width: 100%; height: 100%;
            background: #2e5c4e;
            clip-path: polygon(50% 0%, 100% 40%, 80% 40%, 100% 70%, 80% 70%, 100% 100%, 0% 100%, 20% 70%, 0% 70%, 20% 40%, 0% 40%);
        }
        .tree-snow {
            position: absolute; bottom: 20px; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            clip-path: polygon(50% 0%, 60% 10%, 40% 10%, 80% 40%, 60% 40%, 90% 70%, 70% 70%, 100% 100%, 0% 100%, 30% 70%, 10% 70%, 40% 40%, 20% 40%);
        }

        .tree1 { left: 2%; transform: scale(1.3); }
        .tree2 { right: 5%; transform: scale(0.9); }

        /* Main UI Container */
        #game-area {
            position: relative;
            z-index: 10;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Language Toggle */
        #lang-toggle {
            position: absolute;
            top: 20px; right: 20px;
            width: 35px; height: 35px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.4);
        }
        #lang-toggle:hover { background: rgba(255,255,255,0.6); transform: rotate(90deg); }
        #lang-toggle::before, #lang-toggle::after {
            content: ''; position: absolute; background: #5b8db8; border-radius: 2px;
        }
        #lang-toggle::before { width: 2px; height: 20px; }
        #lang-toggle::after { width: 20px; height: 2px; }
        #lang-text { position: absolute; font-size: 11px; font-weight: 900; color: #1a3b5c; opacity: 0.6; top: 40px; right: 0; }

        /* Next Button (Inconspicuous) */
        #next-btn {
            position: absolute;
            bottom: 20px; right: 20px;
            width: 70px; height: 70px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #b0d4f1);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2), inset -2px -2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            opacity: 0.3;
            transition: all 0.3s;
            z-index: 100;
        }
        #next-btn:hover { opacity: 1; transform: scale(1.1); box-shadow: 0 6px 15px rgba(0,0,0,0.3); }
        #next-btn::after {
            content: ''; width: 18px; height: 18px;
            border-top: 5px solid #1a3b5c; border-right: 5px solid #1a3b5c;
            transform: rotate(45deg); margin-left: -6px;
        }

        /* Check Button */
        #check-btn {
            position: absolute;
            bottom: 25px; left: 50%;
            transform: translateX(-50%);
            padding: 12px 35px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: 900;
            color: #1a3b5c;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            z-index: 100;
            display: none;
        }
        #check-btn:hover { background: rgba(255, 255, 255, 0.8); transform: translateX(-50%) scale(1.05); }

        /* Task Container */
        .task-container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 40px;
            padding: 40px 60px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15), inset 0 0 30px rgba(255,255,255,0.3);
            display: flex; flex-direction: column; align-items: center;
            min-width: 65vw;
            max-width: 95vw;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .task-title {
            font-size: 2.5rem;
            font-weight: 900;
            color: #1a3b5c;
            margin-bottom: 40px;
            text-align: center;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.7);
            line-height: 1.2;
        }

        /* Task 1: Lines */
        .lines-row {
            display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; align-items: center;
        }
        .line-item {
            cursor: pointer; padding: 15px;
            border-radius: 20px; transition: all 0.3s;
            background: rgba(255,255,255,0.1);
            border: 3px solid transparent;
        }
        .line-item:hover { background: rgba(255,255,255,0.4); transform: translateY(-5px) scale(1.05); }
        .line-item.selected { background: rgba(46, 204, 113, 0.3); border-color: #2ecc71; }
        svg.line-svg { width: 140px; height: 100px; overflow: visible; }
        .line-path { fill: none; stroke: #1a3b5c; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
        .line-dot { fill: #1a3b5c; }

        /* Task 2 & 3: Math Grids */
        .math-grid {
            display: flex; flex-direction: column; gap: 25px; width: 100%;
        }
        .math-row {
            display: flex; justify-content: center; align-items: center; gap: 15px;
            font-size: 3rem; font-weight: 900; color: #1a3b5c;
            background: rgba(255,255,255,0.3);
            padding: 15px 40px; border-radius: 25px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
        }
        .input-box {
            width: 90px; height: 90px;
            font-size: 3rem; font-weight: 900; text-align: center;
            background: rgba(255,255,255,0.8);
            border: 4px solid #b5d1e8;
            border-radius: 20px;
            color: #1a3b5c;
            outline: none;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.1);
            transition: all 0.3s;
            font-family: inherit;
        }
        .input-box:focus {
            border-color: #4a90e2; background: #fff; transform: scale(1.05);
            box-shadow: 0 0 20px rgba(74,144,226,0.4);
        }
        .input-box.correct { border-color: var(--correct-color); background: rgba(46, 204, 113, 0.2); }
        .input-box.wrong { border-color: var(--wrong-color); background: rgba(231, 76, 60, 0.2); animation: shake 0.4s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        /* Task 4: Comparisons */
        .compare-row {
            display: flex; justify-content: center; align-items: center; gap: 20px;
            font-size: 2.5rem; font-weight: 900; color: #1a3b5c;
            background: rgba(255,255,255,0.3);
            padding: 15px 30px; border-radius: 25px;
        }
        .compare-btn {
            width: 70px; height: 70px;
            background: rgba(255,255,255,0.6);
            border: 4px solid #b5d1e8;
            border-radius: 50%;
            font-size: 2.5rem; font-weight: 900; color: #1a3b5c;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: all 0.2s; outline: none;
        }
        .compare-btn:hover { background: #fff; transform: scale(1.1); }
        .compare-btn.active { background: #4a90e2; color: #fff; border-color: #1a3b5c; }
        .compare-btn.correct { background: var(--correct-color); color: #fff; border-color: var(--correct-color); }
        .compare-btn.wrong { background: var(--wrong-color); color: #fff; border-color: var(--wrong-color); animation: shake 0.4s; }

        /* Task 5: Logic Table */
        .logic-layout { display: flex; align-items: center; gap: 50px; flex-wrap: wrap; justify-content: center; }
        .logic-table {
            border-collapse: collapse; font-size: 2.2rem; font-weight: 900;
            background: rgba(255,255,255,0.5); border-radius: 20px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .logic-table td {
            border: 4px solid rgba(255,255,255,0.9);
            padding: 20px 40px; text-align: center;
        }
        .logic-table tr:first-child td { border-top: none; }
        .logic-table tr:last-child td { border-bottom: none; }
        .logic-table td:first-child { border-left: none; text-align: left; }
        .logic-table td:last-child { border-right: none; }

        .logic-inputs { display: flex; flex-direction: column; gap: 30px; }
        .logic-input-row { display: flex; align-items: center; gap: 20px; font-size: 2rem; font-weight: 900; }
        .balloon-svg { width: 50px; height: 70px; }

        /* Splat Effects */
        .splat {
            position: absolute; width: 60px; height: 60px;
            background: #fff; border-radius: 50%;
            pointer-events: none; z-index: 9999;
            animation: splatAnim 0.6s ease-out forwards;
            box-shadow: 0 0 15px rgba(255,255,255,0.9);
        }
        @keyframes splatAnim {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* --- NEW ENDING SCENE: SNOWMAN BUILDING --- */
        #ending-scene {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364); /* Night sky */
            display: none; justify-content: center; align-items: center; flex-direction: column;
            z-index: 1000; overflow: hidden;
        }

        .snowman-container {
            position: relative;
            width: 300px;
            height: 500px; /* Fixed height to contain absolutely positioned balls */
            margin-bottom: 5vh;
        }

        .snow-part {
            position: absolute;
            left: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #c4d7e6);
            border-radius: 50%;
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.15), 0 10px 20px rgba(0,0,0,0.3);
            transform: translateX(-50%) scale(0); /* Hidden initially */
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Positioning from bottom up to fix the upside-down issue */
        .snow-bottom { width: 250px; height: 250px; bottom: 0; z-index: 1; }
        .snow-middle { width: 180px; height: 180px; bottom: 200px; z-index: 2; }
        .snow-head { width: 130px; height: 130px; bottom: 330px; z-index: 3; }

        /* Face elements */
        .face-element {
            position: absolute; opacity: 0; transition: opacity 0.4s ease;
        }
        .eye {
            width: 15px; height: 15px; background: #222; border-radius: 50%;
            top: 35px;
        }
        .eye.left { left: 30px; }
        .eye.right { right: 30px; }
        .nose {
            width: 0; height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 40px solid #ff8c00;
            top: 45px; left: 50%;
            transform: translateX(-50%) rotate(10deg);
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.3));
        }
        .smile {
            width: 40px; height: 20px;
            border-bottom: 5px solid #222;
            border-radius: 0 0 40px 40px;
            top: 65px; left: 50%; transform: translateX(-50%);
        }

        /* Scarf */
        .scarf {
            position: absolute; bottom: 320px; left: 50%;
            width: 160px; height: 40px;
            background: repeating-linear-gradient(45deg, #e74c3c, #e74c3c 10px, #c0392b 10px, #c0392b 20px);
            border-radius: 20px; box-shadow: 0 5px 10px rgba(0,0,0,0.3);
            transform: translateX(-50%) scale(0); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 4;
        }
        .scarf::after {
            content: ''; position: absolute; left: 10px; top: 30px;
            width: 40px; height: 80px;
            background: repeating-linear-gradient(45deg, #e74c3c, #e74c3c 10px, #c0392b 10px, #c0392b 20px);
            border-radius: 10px 0 10px 10px;
            transform-origin: top;
            transform: rotate(-5deg);
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }

        /* Twig arms */
        .arm {
            position: absolute;
            width: 80px; height: 8px;
            background: #5c4033;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }
        .arm.left { bottom: 230px; left: -20px; transform-origin: right center; transform: rotate(-30deg) scale(0); }
        .arm.right { bottom: 230px; right: -20px; transform-origin: left center; transform: rotate(30deg) scale(0); }
        
        /* Twig branches */
        .arm::before, .arm::after {
            content: ''; position: absolute; width: 30px; height: 6px; background: #5c4033; border-radius: 5px;
        }
        .arm.left::before { top: -15px; left: 10px; transform: rotate(30deg); }
        .arm.left::after { top: 15px; left: 10px; transform: rotate(-30deg); }
        .arm.right::before { top: -15px; right: 10px; transform: rotate(-30deg); }
        .arm.right::after { top: 15px; right: 10px; transform: rotate(30deg); }

        /* Glowing Christmas Lights */
        .lights {
            position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
            width: 250px; height: 100px;
            z-index: 5; opacity: 0; transition: opacity 0.5s;
        }
        .bulb {
            position: absolute; width: 15px; height: 15px; border-radius: 50%;
            box-shadow: 0 0 15px currentColor, 0 0 30px currentColor;
        }

        .ending-text {
            font-size: 4.5rem; color: #fff; font-weight: 900;
            text-shadow: 0 0 20px #f1c40f, 0 0 40px #e67e22;
            opacity: 0; transition: opacity 1s; text-align: center; z-index: 1002;
            margin-top: 20px; letter-spacing: 5px;
        }

        /* Stars */
        .star {
            position: absolute; background: #fff; border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px #fff; }
        }

    </style>
</head>
<body>

    <div id="snow-container"></div>

    <div class="landscape">
        <div class="hill-back"></div>
        <div class="hill-front"></div>
        <div class="tree tree1"><div class="tree-leaves"></div><div class="tree-snow"></div></div>
        <div class="tree tree2"><div class="tree-leaves"></div><div class="tree-snow"></div></div>
    </div>

    <div id="game-area">
        <div id="lang-toggle" title="Change Language"></div>
        <div id="lang-text">RU</div>
        
        <button id="check-btn">Перевірити</button>
        <div id="next-btn"></div>

        <div id="task-content"></div>
    </div>

    <!-- NEW ENDING SCENE -->
    <div id="ending-scene">
        <div class="snowman-container">
            <!-- Reordered logically, but positioned absolutely so visual order is guaranteed -->
            <div class="snow-part snow-bottom" id="part-bottom"></div>
            <div class="snow-part snow-middle" id="part-middle"></div>
            
            <div class="snow-part snow-head" id="part-head">
                <div class="face-element eye left" id="eye-l"></div>
                <div class="face-element eye right" id="eye-r"></div>
                <div class="face-element nose" id="nose"></div>
                <div class="face-element smile" id="smile"></div>
            </div>

            <div class="scarf" id="scarf"></div>
            <div class="arm left" id="arm-l"></div>
            <div class="arm right" id="arm-r"></div>
            
            <div class="lights" id="lights"></div>
        </div>
        <div class="ending-text" id="end-text">МОЛОДЕЦЬ!</div>
    </div>

    <script>
        // --- Audio Engine ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'pop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gainNode.gain.setValueAtTime(0.5, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'splat') {
                const bufferSize = audioCtx.sampleRate * 0.2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 800;
                noise.connect(filter); filter.connect(gainNode);
                gainNode.gain.setValueAtTime(1, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                noise.start(now);
            } else if (type === 'success') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554, now + 0.1); osc.frequency.setValueAtTime(659, now + 0.2);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'whoosh') {
                const bufferSize = audioCtx.sampleRate * 0.3;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.setValueAtTime(500, now); filter.frequency.exponentialRampToValueAtTime(2000, now + 0.2);
                noise.connect(filter); filter.connect(gainNode);
                gainNode.gain.setValueAtTime(0.5, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                noise.start(now);
            } else if (type === 'fanfare') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.type = 'square'; o.frequency.value = freq;
                    o.connect(g); g.connect(audioCtx.destination);
                    g.gain.setValueAtTime(0, now + i*0.1); g.gain.linearRampToValueAtTime(0.2, now + i*0.1 + 0.05);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i*0.1 + 0.3);
                    o.start(now + i*0.1); o.stop(now + i*0.1 + 0.3);
                });
            } else if (type === 'crunch') {
                const bufferSize = audioCtx.sampleRate * 0.4;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.sin(i / 50);
                const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 400;
                noise.connect(filter); filter.connect(gainNode);
                gainNode.gain.setValueAtTime(0.8, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                noise.start(now);
            }
        }

        // --- State & Localization ---
        let currentLang = 'uk';
        let currentTask = 0;
        const totalTasks = 5;

        const translations = {
            uk: {
                check: "Перевірити",
                t1: "Обери та обведи прямі лінії",
                t2: "Встав пропущені числа",
                t3: "Обчисли",
                t4: "Порівняй вирази",
                t5: "Дізнайся, скільки кульок кожного кольору",
                yellowGreen: "ЖОВТІ + ЗЕЛЕНІ",
                yellowRed: "ЖОВТІ + ЧЕРВОНІ",
                totalGreen: "Всього ЗЕЛЕНИХ",
                yellow: "Жовтих",
                red: "Червоних",
                win: "МОЛОДЕЦЬ!"
            },
            ru: {
                check: "Проверить",
                t1: "Выбери и обведи прямые линии",
                t2: "Вставь пропущенные числа",
                t3: "Вычисли",
                t4: "Сравни выражения",
                t5: "Узнай, сколько шаров каждого цвета",
                yellowGreen: "ЖЁЛТЫЕ + ЗЕЛЁНЫЕ",
                yellowRed: "ЖЁЛТЫЕ + КРАСНЫЕ",
                totalGreen: "Всего ЗЕЛЁНЫХ",
                yellow: "Жёлтых",
                red: "Красных",
                win: "МОЛОДЕЦ!"
            }
        };

        // --- Initialization ---
        document.addEventListener('click', () => { initAudio(); }, { once: true });

        const snowContainer = document.getElementById('snow-container');
        for (let i = 0; i < 60; i++) {
            let snowflake = document.createElement('div');
            snowflake.classList.add('snowflake-bg');
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.width = Math.random() * 8 + 4 + 'px';
            snowflake.style.height = snowflake.style.width;
            snowflake.style.animationDuration = Math.random() * 4 + 3 + 's';
            snowflake.style.animationDelay = Math.random() * 5 + 's';
            snowContainer.appendChild(snowflake);
        }

        const langToggle = document.getElementById('lang-toggle');
        const langText = document.getElementById('lang-text');
        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'uk' ? 'ru' : 'uk';
            langText.innerText = currentLang === 'uk' ? 'RU' : 'UK';
            playSound('pop');
            if (currentTask < totalTasks) loadTask(currentTask);
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            playSound('whoosh');
            if (currentTask < totalTasks - 1) {
                currentTask++;
                loadTask(currentTask);
            } else if (currentTask === totalTasks - 1) {
                startEnding();
            }
        });

        function createSplat(x, y) {
            const splat = document.createElement('div');
            splat.classList.add('splat');
            splat.style.left = x + 'px';
            splat.style.top = y + 'px';
            document.body.appendChild(splat);
            playSound('splat');
            setTimeout(() => splat.remove(), 600);
        }

        // --- Task Loader ---
        const taskContent = document.getElementById('task-content');
        const checkBtn = document.getElementById('check-btn');

        function loadTask(taskIndex) {
            taskContent.innerHTML = '';
            checkBtn.style.display = 'none';
            const container = document.createElement('div');
            container.classList.add('task-container');

            if (taskIndex === 0) buildTask1(container);
            else if (taskIndex === 1) { buildTask2(container); checkBtn.style.display = 'block'; }
            else if (taskIndex === 2) { buildTask3(container); checkBtn.style.display = 'block'; }
            else if (taskIndex === 3) { buildTask4(container); checkBtn.style.display = 'block'; }
            else if (taskIndex === 4) { buildTask5(container); checkBtn.style.display = 'block'; }

            taskContent.appendChild(container);
            checkBtn.innerText = translations[currentLang].check;
        }

        // --- Task 1: Lines ---
        function buildTask1(container) {
            container.innerHTML = `<div class="task-title">${translations[currentLang].t1}</div>`;
            const row = document.createElement('div');
            row.classList.add('lines-row');

            const lines = [
                { id: 'l1', type: 'straight', svg: '<line x1="10" y1="20" x2="130" y2="60" class="line-path"/>' },
                { id: 'l2', type: 'segment', svg: '<line x1="20" y1="70" x2="120" y2="70" class="line-path"/><circle cx="20" cy="70" r="7" class="line-dot"/><circle cx="120" cy="70" r="7" class="line-dot"/>' },
                { id: 'l3', type: 'wavy', svg: '<path d="M 10 40 Q 30 10 50 40 T 90 40 T 120 30" class="line-path"/>' },
                { id: 'l4', type: 'straight', svg: '<line x1="20" y1="20" x2="100" y2="90" class="line-path"/>' },
                { id: 'l5', type: 'curve', svg: '<path d="M 20 20 C 80 20, 120 60, 100 80 C 80 100, 40 90, 40 60 C 40 30, 80 30, 80 50" class="line-path"/>' }
            ];

            lines.forEach(line => {
                const item = document.createElement('div');
                item.classList.add('line-item');
                item.dataset.correct = (line.type === 'straight');
                item.innerHTML = `<svg class="line-svg">${line.svg}</svg>`;
                
                item.addEventListener('click', (e) => {
                    if (item.classList.contains('selected')) {
                        item.classList.remove('selected');
                        playSound('pop');
                    } else {
                        item.classList.add('selected');
                        if (line.type === 'straight') playSound('success');
                        else playSound('whoosh');
                        createSplat(e.pageX - 30, e.pageY - 30);
                    }
                });
                row.appendChild(item);
            });

            container.appendChild(row);
        }

        // --- Task 2: Missing Numbers ---
        function buildTask2(container) {
            container.innerHTML = `<div class="task-title">${translations[currentLang].t2}</div>`;
            const grid = document.createElement('div');
            grid.classList.add('math-grid');

            const eqs = [
                { text1: "6 + 3 = ", ans: "9" },
                { text1: "9 - ", text2: " = 6", ans: "3" },
                { text1: "9 - ", text2: " = 3", ans: "6" }
            ];

            eqs.forEach(eq => {
                const row = document.createElement('div');
                row.classList.add('math-row');
                
                if (eq.text2) row.innerHTML = `<span>${eq.text1}</span><input type="text" class="input-box" maxlength="2"><span>${eq.text2}</span>`;
                else row.innerHTML = `<span>${eq.text1}</span><input type="text" class="input-box" maxlength="2">`;

                const input = row.querySelector('input');
                input.dataset.ans = eq.ans;
                grid.appendChild(row);
            });
            container.appendChild(grid);
        }

        // --- Task 3: Calculations ---
        function buildTask3(container) {
            container.innerHTML = `<div class="task-title">${translations[currentLang].t3}</div>`;
            const grid = document.createElement('div');
            grid.classList.add('math-grid');
            grid.style.display = 'grid'; grid.style.gridTemplateColumns = '1fr 1fr'; grid.style.gap = '25px';

            const items = [
                { text: "10 ч + 4 ч = ", ans: "14" },
                { text: "20 см - 9 см = ", ans: "11" },
                { text: "1 дес. 9 ед. - 6 ед. = ", ans: "13" },
                { text: "1 дм 8 см - 1 дм = ", ans: "8" },
                { text: "16 л - 4 л = ", ans: "12" },
                { text: "19 см - 8 см = ", ans: "11" }
            ];

            items.forEach(item => {
                const row = document.createElement('div');
                row.classList.add('math-row');
                row.style.fontSize = '2rem';
                row.innerHTML = `<span>${item.text}</span><input type="text" class="input-box" style="width:70px; height:70px; font-size:2rem;" maxlength="2">`;

                const input = row.querySelector('input');
                input.dataset.ans = item.ans;
                grid.appendChild(row);
            });
            container.appendChild(grid);
        }

        // --- Task 4: Comparisons ---
        function buildTask4(container) {
            container.innerHTML = `<div class="task-title">${translations[currentLang].t4}</div>`;
            const grid = document.createElement('div');
            grid.classList.add('math-grid');

            const problems = [
                { left: "19 - 6 + 3", right: "17 - 7 + 8", ans: "<" },
                { left: "7 - 4 + 10", right: "5 + 5 + 3", ans: "=" },
                { left: "18 - 3 + 5", right: "19 - 5 + 2", ans: ">" }
            ];

            problems.forEach(p => {
                const row = document.createElement('div');
                row.classList.add('compare-row');
                row.innerHTML = `
                    <span>${p.left}</span>
                    <div style="display:flex; gap:10px;">
                        <button class="compare-btn" data-val="<">&lt;</button>
                        <button class="compare-btn" data-val="=">=</button>
                        <button class="compare-btn" data-val=">">&gt;</button>
                    </div>
                    <span>${p.right}</span>
                `;
                row.dataset.ans = p.ans;
                grid.appendChild(row);
            });
            container.appendChild(grid);
        }

        // --- Task 5: Logic Table ---
        function buildTask5(container) {
            container.innerHTML = `<div class="task-title">${translations[currentLang].t5}</div>`;
            
            const layout = document.createElement('div');
            layout.classList.add('logic-layout');

            const table = document.createElement('table');
            table.classList.add('logic-table');
            table.innerHTML = `
                <tr><td>${translations[currentLang].yellowGreen}</td><td>16</td></tr>
                <tr><td>${translations[currentLang].yellowRed}</td><td>14</td></tr>
                <tr><td>${translations[currentLang].totalGreen}</td><td>6</td></tr>
            `;
            layout.appendChild(table);

            const inputsDiv = document.createElement('div');
            inputsDiv.classList.add('logic-inputs');
            inputsDiv.innerHTML = `
                <div class="logic-input-row">
                    <svg class="balloon-svg" viewBox="0 0 50 70"><ellipse cx="25" cy="25" rx="20" ry="25" fill="#f1c40f"/><path d="M25 50 L25 65" stroke="#333" stroke-width="2"/><polygon points="23,50 27,50 25,55" fill="#f1c40f"/></svg>
                    <span>${translations[currentLang].yellow}:</span>
                    <input type="text" id="ans-yellow" class="input-box" style="width:80px; height:80px; font-size:2.5rem;" maxlength="2" data-ans="10">
                </div>
                <div class="logic-input-row">
                    <svg class="balloon-svg" viewBox="0 0 50 70"><ellipse cx="25" cy="25" rx="20" ry="25" fill="#e74c3c"/><path d="M25 50 L25 65" stroke="#333" stroke-width="2"/><polygon points="23,50 27,50 25,55" fill="#e74c3c"/></svg>
                    <span>${translations[currentLang].red}:</span>
                    <input type="text" id="ans-red" class="input-box" style="width:80px; height:80px; font-size:2.5rem;" maxlength="2" data-ans="4">
                </div>
            `;
            layout.appendChild(inputsDiv);
            container.appendChild(layout);
        }

        // --- Checking Logic ---
        checkBtn.addEventListener('click', () => {
            playSound('pop');
            let allCorrect = true;
            let incorrectElements = [];

            if (currentTask === 1 || currentTask === 2 || currentTask === 4) {
                const inputs = taskContent.querySelectorAll('input.input-box');
                inputs.forEach(input => {
                    if (input.value !== input.dataset.ans) {
                        allCorrect = false;
                        input.classList.add('wrong');
                        incorrectElements.push(input);
                        setTimeout(() => input.classList.remove('wrong'), 500);
                    } else {
                        input.classList.add('correct');
                    }
                });
            } else if (currentTask === 3) {
                const rows = taskContent.querySelectorAll('.compare-row');
                rows.forEach(row => {
                    const activeBtn = row.querySelector('.compare-btn.active');
                    if (!activeBtn || activeBtn.dataset.val !== row.dataset.ans) {
                        allCorrect = false;
                        row.classList.add('wrong');
                        incorrectElements.push(row);
                        setTimeout(() => row.classList.remove('wrong'), 500);
                    } else {
                        row.querySelectorAll('.compare-btn').forEach(b => b.classList.remove('active'));
                        activeBtn.classList.add('correct');
                    }
                });
            } else if (currentTask === 0) {
                const items = taskContent.querySelectorAll('.line-item');
                items.forEach(item => {
                    const isCorrectLine = item.dataset.correct === 'true';
                    const isSelected = item.classList.contains('selected');
                    if (isCorrectLine !== isSelected) {
                        allCorrect = false;
                        item.style.borderColor = 'var(--wrong-color)';
                        setTimeout(() => item.style.borderColor = 'transparent', 500);
                    }
                });
            }

            if (allCorrect) {
                playSound('fanfare');
                for(let i=0; i<20; i++) {
                    setTimeout(() => createSplat(Math.random() * window.innerWidth, Math.random() * window.innerHeight), i*50);
                }
                checkBtn.style.display = 'none'; 
            } else {
                playSound('whoosh');
                incorrectElements.forEach(el => el.classList.add('wrong'));
                setTimeout(() => incorrectElements.forEach(el => el.classList.remove('wrong')), 500);
            }
        });

        // Add active class logic for compare buttons
        taskContent.addEventListener('click', (e) => {
            if (e.target.classList.contains('compare-btn')) {
                const parent = e.target.parentElement;
                parent.querySelectorAll('.compare-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                playSound('pop');
            }
        });

        // --- NEW ENDING SCENE: Snowman Building ---
        function startEnding() {
            // Hide UI
            document.getElementById('task-content').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('lang-toggle').style.display = 'none';
            document.getElementById('check-btn').style.display = 'none';
            
            const scene = document.getElementById('ending-scene');
            scene.style.display = 'flex';

            // Create stars
            for(let i=0; i<40; i++) {
                let star = document.createElement('div');
                star.classList.add('star');
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 60 + 'vh';
                star.style.width = Math.random() * 4 + 2 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 2 + 's';
                scene.appendChild(star);
            }

            // Timeline of actions
            setTimeout(() => {
                document.getElementById('part-bottom').style.transform = 'translateX(-50%) scale(1)';
                playSound('crunch');
            }, 500);

            setTimeout(() => {
                document.getElementById('part-middle').style.transform = 'translateX(-50%) scale(1)';
                playSound('crunch');
            }, 1500);

            setTimeout(() => {
                document.getElementById('part-head').style.transform = 'translateX(-50%) scale(1)';
                playSound('crunch');
            }, 2500);

            setTimeout(() => {
                // Face appears
                document.getElementById('eye-l').style.opacity = '1';
                document.getElementById('eye-r').style.opacity = '1';
                document.getElementById('nose').style.opacity = '1';
                document.getElementById('smile').style.opacity = '1';
                playSound('success');
            }, 3200);

            setTimeout(() => {
                // Scarf and arms
                document.getElementById('scarf').style.transform = 'translateX(-50%) scale(1)';
                document.getElementById('arm-l').style.transform = 'rotate(-30deg) scale(1)';
                document.getElementById('arm-r').style.transform = 'rotate(30deg) scale(1)';
                playSound('whoosh');
            }, 3800);

            setTimeout(() => {
                // Lights
                const lightsContainer = document.getElementById('lights');
                const colors = ['#f1c40f', '#e74c3c', '#3498db', '#2ecc71'];
                for(let i=0; i<8; i++) {
                    let bulb = document.createElement('div');
                    bulb.classList.add('bulb');
                    bulb.style.color = colors[i%4];
                    bulb.style.background = colors[i%4];
                    const angle = (Math.PI / 7) * i - Math.PI/2;
                    const x = 125 + Math.cos(angle) * 110;
                    const y = 50 + Math.sin(angle) * 40;
                    bulb.style.left = x + 'px';
                    bulb.style.top = y + 'px';
                    lightsContainer.appendChild(bulb);
                }
                lightsContainer.style.opacity = '1';
                playSound('success');
            }, 4500);

            setTimeout(() => {
                // Finale text and snow explosion
                document.getElementById('end-text').style.opacity = '1';
                playSound('fanfare');
                
                for(let i=0; i<60; i++) {
                    setTimeout(() => {
                        createSplat(Math.random() * window.innerWidth, Math.random() * window.innerHeight);
                    }, i * 30);
                }
            }, 5200);
        }

        // Start game
        loadTask(currentTask);

    </script>
</body>
</html>
