<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Збираємо Монстра</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #111; /* Колір полів навколо екрану 16:9 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        
        /* Жорсткий контейнер 16:9 для ідеальної синхронізації на будь-якому екрані */
        #game-container {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 aspect ratio */
            max-height: 100vh;
            max-width: 177.78vh; /* 16/9 = 1.7778 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background 0.5s ease-in-out;
            overflow: hidden;
            background-color: #87CEEB; /* Фолбек */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #shared-text {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 60px;
            font-size: 18px;
            font-family: Arial, sans-serif;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #333;
            background: rgba(255, 255, 255, 0.8);
            resize: none;
            z-index: 10;
        }

        .draggable {
            position: absolute;
            cursor: pointer;
            user-select: none;
            touch-action: none;
            z-index: 5;
        }

        @keyframes starPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .star {
            position: absolute;
            font-size: 40px;
            cursor: pointer;
            z-index: 6;
            animation: starPulse 2s infinite;
        }

        .star:hover {
            animation: none;
            transform: scale(1.5);
        }

        .item-hidden {
            display: none;
        }

        .reveal-effect {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Екран старту */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            color: white;
            font-size: 40px;
            cursor: pointer;
            text-shadow: 2px 2px 5px black;
        }

        /* Кнопка завершення складання */
        #finish-btn {
            display: none;
            position: absolute;
            top: 5%;
            left: calc(50% + 170px);
            padding: 10px 30px;
            font-size: 20px;
            background: #4CAF50;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid white;
            font-weight: bold;
        }
        #finish-btn:hover {
            background: #45a049;
        }

        /* Theme Manager UI */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 40px;
            cursor: pointer;
            z-index: 9999;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            padding: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #theme-modal {
            display: none;
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 320px;
            max-height: 60vh;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 10000;
        }

        #theme-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .theme-thumb {
            position: relative;
            width: 100%;
            height: 100px;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border 0.2s;
        }

        .theme-thumb:hover {
            border-color: #007bff;
        }

        .theme-label {
            position: absolute;
            bottom: 5px;
            left: 5px;
            right: 5px;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 12px;
            text-align: center;
            padding: 2px;
            border-radius: 4px;
            pointer-events: none;
        }

        /* Блок контролю */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            color: red;
            font-size: 50px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
        }

        @media (max-width: 800px) {
            #finish-btn {
                left: auto;
                right: 5%;
                padding: 10px 15px;
                font-size: 16px;
            }
            #shared-text {
                left: 40%;
                width: 40%;
            }
        }

        @media (max-width: 600px) {
            .star { font-size: 30px; }
            #theme-modal { width: 90%; right: 5%; bottom: 80px; }
        }
    </style>
    
    <!-- Firebase (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<body>

    <div id="start-overlay" onclick="startGameClick(event)">Натисніть щоб почати гру</div>

    <div id="game-container">
        <textarea id="shared-text" placeholder=""></textarea>
        
        <!-- Монстр збільшений до width: 25% -->
        <img src="монстр.png" id="monster" class="draggable" style="left: -50%; top: 70%; width: 25%;">
        
        <div id="items-container"></div>

        <div id="finish-btn" onclick="finishGameClick()">Готово!</div>
    </div>

    <!-- Theme Manager -->
    <div id="theme-btn" onclick="toggleThemeModal()">⚙️</div>
    <div id="theme-modal">
        <h3 style="text-align:center; margin-top:0;">Виберіть фон</h3>
        <div id="theme-gallery"></div>
    </div>

    <!-- Блок заглушка -->
    <div id="block-overlay">Зачекай! Зараз не твій урок.</div>

    <script>
        // ==========================================
        // Ініціалізація Firebase та Базових Даних
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
            projectId: "lesson-13c44"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Ідентифікація
        const urlParams = new URLSearchParams(window.location.search);
        let myName = urlParams.get('user');
        if (!myName) myName = sessionStorage.getItem('myName');
        if (!myName) {
            myName = 'Гість_' + Math.floor(Math.random() * 1000);
        }
        sessionStorage.setItem('myName', myName);
        const tabId = 'tab_' + Math.random().toString(36).substr(2, 9);
        const localSenderId = myName + '_' + tabId;
        
        let isRemoteAction = false;
        let gameStarted = false;
        let finaleTriggered = false;
        let revealedItemsCount = 0;
        const totalItems = 7;
        const container = document.getElementById('game-container');

        // Очищення стану гри при старті, щоб не показувати монстра з попередньої сесії
        if (db) {
            db.ref('game_action').remove();
        }

        // ==========================================
        // Аудіо (Web Audio API для тихих звуків)
        // ==========================================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playFootstep() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playRevealSound() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(1000, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function playVictoryMusic() {
            if(!audioCtx) return;
            const notes = [261.63, 329.63, 392.00, 523.25];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, audioCtx.currentTime + index * 0.2);
                gain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + index * 0.2 + 0.05);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + index * 0.2 + 0.4);
                osc.start(audioCtx.currentTime + index * 0.2);
                osc.stop(audioCtx.currentTime + index * 0.2 + 0.5);
            });
        }

        // ==========================================
        // Логіка Гри (Усі координати у відсотках)
        // ==========================================
        const itemsList = [
            'шарф.png', 'окуляри.png', 'шапка.png', 
            'зброя1.png', 'зброя2.png', 'зброя3.png', 'зброя4.png'
        ];
        
        // Позиції у відсотках відносно 16:9 контейнера
        const starPositions = [
            {x: 15, y: 20}, {x: 80, y: 20},
            {x: 30, y: 40}, {x: 70, y: 40},
            {x: 10, y: 65}, {x: 85, y: 65},
            {x: 50, y: 30}
        ];

        const itemsContainer = document.getElementById('items-container');
        const monster = document.getElementById('monster');
        const sharedText = document.getElementById('shared-text');

        itemsList.forEach((src, index) => {
            const pos = starPositions[index];
            
            const star = document.createElement('div');
            star.className = 'star';
            star.innerHTML = '⭐';
            star.style.left = `${pos.x}%`;
            star.style.top = `${pos.y}%`;
            star.id = `star-${index}`;
            
            const img = document.createElement('img');
            img.src = src;
            img.className = 'draggable item-hidden';
            img.id = `item-${index}`;
            img.style.left = `${pos.x}%`;
            img.style.top = `${pos.y}%`;
            img.style.width = '13%'; // Предмети збільшено з 10% до 13% для збереження пропорцій

            star.onclick = () => {
                revealItemLocal(index);
                sendAction('REVEAL', { index: index });
            };

            itemsContainer.appendChild(star);
            itemsContainer.appendChild(img);
        });

        function revealItemLocal(index) {
            const star = document.getElementById(`star-${index}`);
            const img = document.getElementById(`item-${index}`);
            if (star && img && !img.classList.contains('reveal-effect')) {
                star.style.display = 'none';
                img.classList.remove('item-hidden');
                img.classList.add('reveal-effect');
                initAudio();
                playRevealSound();
                revealedItemsCount++;
                checkFinaleReady();
            }
        }

        function checkFinaleReady() {
            if (revealedItemsCount === totalItems && !finaleTriggered) {
                document.getElementById('finish-btn').style.display = 'block';
            }
        }

        function finishGameClick() {
            triggerFinaleLocal();
            sendAction('FINALE', {});
        }

        function triggerFinaleLocal() {
            if (finaleTriggered) return;
            finaleTriggered = true;
            document.getElementById('finish-btn').style.display = 'none';
            initAudio();
            playVictoryMusic();
            
            const wrapper = document.createElement('div');
            wrapper.id = 'finale-wrapper';
            wrapper.style.position = 'absolute';
            wrapper.style.left = '0%';
            wrapper.style.top = '0%';
            wrapper.style.width = '100%';
            wrapper.style.height = '100%';
            wrapper.style.zIndex = '100';
            container.appendChild(wrapper);
            
            const allElements = [monster, ...document.querySelectorAll('.draggable:not(.item-hidden)')];
            
            allElements.forEach(el => {
                wrapper.appendChild(el);
            });
            
            let moveAmount = 0;
            function walkOffScreen() {
                moveAmount += 0.2; // Швидкість у відсотках
                wrapper.style.left = moveAmount + '%';
                
                if (Math.round(moveAmount * 10) % 30 === 0) playFootstep();

                if (moveAmount < 150) {
                    requestAnimationFrame(walkOffScreen);
                }
            }
            requestAnimationFrame(walkOffScreen);
        }

        let waitingForMonsterTarget = false;

        function startGameClick(e) {
            if (e) {
                e.stopPropagation();
                e.preventDefault();
            }
            document.getElementById('start-overlay').style.display = 'none';
            initAudio();
            setTimeout(() => {
                waitingForMonsterTarget = true;
            }, 100);
            sendAction('START', {});
        }

        let monsterAnimId;
        function callMonsterLocal(targetPctX, targetPctY) {
            gameStarted = true;
            waitingForMonsterTarget = false;
            
            cancelAnimationFrame(monsterAnimId);
            
            let mRect = monster.getBoundingClientRect();
            let cRect = container.getBoundingClientRect();
            let mHeightPct = (mRect.height / cRect.height) * 100;
            let mWidthPct = 25; // width: 25% для збільшеного монстра

            monster.style.top = (targetPctY - (mHeightPct / 2)) + '%';
            
            let currentPctX = -35;
            const finalPctX = targetPctX - (mWidthPct / 2);
            
            function animateMonsterIn() {
                currentPctX += 0.5;
                monster.style.left = currentPctX + '%';
                
                if (Math.round(currentPctX * 10) % 30 === 0) playFootstep();
                
                if (currentPctX < finalPctX) {
                    monsterAnimId = requestAnimationFrame(animateMonsterIn);
                } else {
                    monster.style.left = finalPctX + '%'; 
                }
            }
            monsterAnimId = requestAnimationFrame(animateMonsterIn);
        }

        // ==========================================
        // Синхронізація (Firebase)
        // ==========================================
        function sendAction(type, data) {
            if(isRemoteAction || !db) return;
            db.ref('game_action').set({
                senderId: localSenderId,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                type: type,
                data: data
            });
        }

        db.ref('game_action').on('value', snap => {
            const val = snap.val();
            if(!val) return;
            if(val.senderId === localSenderId) return;
            
            isRemoteAction = true;
            
            if (val.type === 'START') {
                document.getElementById('start-overlay').style.display = 'none';
                initAudio();
                setTimeout(() => { waitingForMonsterTarget = true; }, 100);
            } else if (val.type === 'CALL_MONSTER') {
                initAudio();
                callMonsterLocal(val.data.x, val.data.y);
            } else if (val.type === 'REVEAL') {
                revealItemLocal(val.data.index);
            } else if (val.type === 'MOVE') {
                const el = document.getElementById(val.data.id);
                if (el) {
                    el.style.left = val.data.x;
                    el.style.top = val.data.y;
                }
            } else if (val.type === 'TEXT') {
                sharedText.value = val.data.text;
            } else if (val.type === 'FINALE' && !finaleTriggered) {
                triggerFinaleLocal();
            }

            isRemoteAction = false;
        });

        // ==========================================
        // Drag & Drop Кліком / Тапом (Усі розрахунки у %)
        // ==========================================
        let attachedElement = null;
        let attachOffsetX = 0, attachOffsetY = 0;

        function getRelativePos(clientX, clientY) {
            const rect = container.getBoundingClientRect();
            let x = ((clientX - rect.left) / rect.width) * 100;
            let y = ((clientY - rect.top) / rect.height) * 100;
            return {x, y};
        }

        function attachOrDrop(e) {
            if (finaleTriggered) return;
            
            if (e.target.id === 'finish-btn' || e.target.id === 'theme-btn' || e.target.closest('#theme-modal') || e.target.id === 'shared-text') return;

            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            let pos = getRelativePos(clientX, clientY);

            if (waitingForMonsterTarget) {
                callMonsterLocal(pos.x, pos.y);
                sendAction('CALL_MONSTER', { x: pos.x, y: pos.y });
                return; 
            }

            if (attachedElement) {
                if (e.type.includes('touch')) {
                    attachedElement.style.left = (pos.x - attachOffsetX) + '%';
                    attachedElement.style.top = (pos.y - attachOffsetY) + '%';
                }
                
                sendAction('MOVE', {
                    id: attachedElement.id,
                    x: attachedElement.style.left,
                    y: attachedElement.style.top
                });
                attachedElement.style.zIndex = 5;
                attachedElement = null;
            } else {
                let target = e.target;
                if (target.classList.contains('draggable') && !target.classList.contains('item-hidden')) {
                    attachedElement = target;
                    
                    const elRect = attachedElement.getBoundingClientRect();
                    const cRect = container.getBoundingClientRect();
                    
                    let elLeftPct = ((elRect.left - cRect.left) / cRect.width) * 100;
                    let elTopPct = ((elRect.top - cRect.top) / cRect.height) * 100;
                    
                    attachOffsetX = pos.x - elLeftPct;
                    attachOffsetY = pos.y - elTopPct;
                    
                    attachedElement.style.zIndex = 1000;
                    e.preventDefault(); 
                }
            }
        }

        function moveAttached(e) {
            if (!attachedElement || finaleTriggered) return;
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            let pos = getRelativePos(clientX, clientY);
            attachedElement.style.left = (pos.x - attachOffsetX) + '%';
            attachedElement.style.top = (pos.y - attachOffsetY) + '%';

            sendAction('MOVE', {
                id: attachedElement.id,
                x: attachedElement.style.left,
                y: attachedElement.style.top
            });
        }

        document.addEventListener('mousedown', attachOrDrop);
        document.addEventListener('mousemove', moveAttached);
        document.addEventListener('touchstart', attachOrDrop, {passive: false});
        document.addEventListener('touchmove', moveAttached, {passive: false});

        sharedText.addEventListener('input', () => {
            sendAction('TEXT', { text: sharedText.value });
        });

        // ==========================================
        // Theme Manager
        // ==========================================
        const themeModal = document.getElementById('theme-modal');
        const themeGallery = document.getElementById('theme-gallery');
        let themesLoaded = false;
        const bgPrefix = 'https://olgazheltvai2.github.io/images/backgrounds/background_';

        function toggleThemeModal() {
            themeModal.style.display = themeModal.style.display === 'block' ? 'none' : 'block';
            if (!themesLoaded) loadThemes();
        }

        async function loadThemes() {
            themesLoaded = true;
            for (let i = 1; i <= 1000; i++) {
                let url = `${bgPrefix}${i}.webp`;
                let img = new Image();
                img.onload = () => {
                    let div = document.createElement('div');
                    div.className = 'theme-thumb';
                    div.style.backgroundImage = `url('${url}')`;
                    div.innerHTML = `<div class="theme-label">Фон ${i}</div>`;
                    div.onclick = () => {
                        applyTheme(url);
                        db.ref('game_theme').set(url);
                    };
                    themeGallery.appendChild(div);
                };
                img.onerror = () => { i = 1001; }; 
                img.src = url;
            }
        }

        function applyTheme(url) {
            container.style.backgroundImage = `url('${url}')`;
            localStorage.setItem('mySavedGameBg', url);
        }

        db.ref('game_theme').on('value', snap => {
            if (snap.val()) applyTheme(snap.val());
        });

        const savedBg = localStorage.getItem('mySavedGameBg');
        if (savedBg) applyTheme(savedBg);

        // ==========================================
        // Універсальний Блок Контролю (Ідентифікація, Радар, Блокування)
        // ==========================================
        let startImmunity = true;
        setTimeout(() => { startImmunity = false; }, 1000);

        if (db) {
            const connectedRef = db.ref('.info/connected');
            const userRef = db.ref(`online_users/${myName}/${tabId}`);

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    userRef.set(true);
                    userRef.onDisconnect().remove();
                }
            });

            window.addEventListener('beforeunload', () => {
                userRef.remove();
            });

            db.ref('force_refresh').on('value', (snap) => {
                if (snap.val() && !startImmunity) {
                    window.location.reload();
                }
            });

            const blockOverlay = document.getElementById('block-overlay');
            db.ref(`blocked_users/${myName}`).on('value', (snap) => {
                if (snap.val() === true) {
                    blockOverlay.style.display = 'flex';
                } else {
                    blockOverlay.style.display = 'none';
                }
            });

            db.ref('current_activity').on('value', (snap) => {
                if (!startImmunity && snap.val() === 'lobby') {
                    window.location.href = `https://olgazheltvai2.github.io/rizne/lobby.html?user=${encodeURIComponent(myName)}`;
                }
            });
        }
    </script>
</html>
