<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roblox Obby Tic-Tac-Toe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Rubik:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Rubik', 'Fredoka', sans-serif;
      background: #38bdf8;
    }

    /* Cloud drift animations in the sunny Roblox sky */
    .cloud-slow {
      animation: cloudDrift 48s linear infinite;
    }
    .cloud-med {
      animation: cloudDrift 34s linear infinite reverse;
    }
    .cloud-fast {
      animation: cloudDrift 26s linear infinite;
    }
    @keyframes cloudDrift {
      0% { transform: translateX(-260px); }
      100% { transform: translateX(2100px); }
    }

    /* Gentle floating for distant sky obby islands */
    .island-float-1 {
      animation: islandBob 4.2s ease-in-out infinite alternate;
    }
    .island-float-2 {
      animation: islandBob 3.3s ease-in-out infinite alternate-reverse;
    }
    @keyframes islandBob {
      0% { transform: translateY(-8px); }
      100% { transform: translateY(10px); }
    }

    /* Main 3x3 Roblox Golden/Emerald Plastic Board Frame */
    .roblox-board-frame {
      background: linear-gradient(145deg, #fbbf24 0%, #f59e0b 55%, #d97706 100%);
      border: 6px solid #78350f;
      border-radius: 34px;
      box-shadow:
        inset 0 8px 0 rgba(255, 255, 255, 0.55),
        inset 0 -10px 0 rgba(120, 53, 15, 0.55),
        0 14px 0 #78350f,
        0 22px 38px rgba(15, 23, 42, 0.45);
      position: relative;
    }

    /* Recessed colorful Lego/Roblox stud tray inside board */
    .roblox-board-tray {
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      border: 5px solid #082f49;
      border-radius: 26px;
      box-shadow:
        inset 0 8px 16px rgba(8, 47, 73, 0.65),
        0 4px 0 rgba(255, 255, 255, 0.45);
      background-image:
        radial-gradient(circle at 50% 42%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.08) 42%, rgba(8,47,73,0.45) 54%, transparent 62%);
      background-size: 38px 38px;
    }

    /* Individual 3x3 Brick Cell */
    .math-cell {
      position: relative;
      border-radius: 22px;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4.5px solid #0f172a;
      box-shadow:
        inset 0 7px 0 rgba(255, 255, 255, 0.55),
        inset 0 -9px 0 rgba(0, 0, 0, 0.28),
        0 9px 0 #0f172a,
        0 14px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease, box-shadow 0.2s ease;
    }

    .math-cell:hover {
      transform: translateY(-5px) scale(1.03);
      filter: brightness(1.06);
      box-shadow:
        inset 0 7px 0 rgba(255, 255, 255, 0.7),
        inset 0 -9px 0 rgba(0, 0, 0, 0.28),
        0 14px 0 #0f172a,
        0 20px 26px rgba(0, 0, 0, 0.35);
    }

    .math-cell:active {
      transform: translateY(4px) scale(0.97);
      box-shadow:
        inset 0 4px 0 rgba(255, 255, 255, 0.45),
        inset 0 -4px 0 rgba(0, 0, 0, 0.28),
        0 4px 0 #0f172a;
    }

    /* Bright, cheerful inner plate for the math formula (NO gloomy black boxes, NO white rectangles) */
    .formula-plate {
      border-radius: 16px;
      padding: 0.45rem 0.7rem;
      width: 90%;
      min-height: 60%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      z-index: 3;
      border: 3.5px solid rgba(15, 23, 42, 0.75);
      box-shadow:
        inset 0 4px 0 rgba(255, 255, 255, 0.65),
        inset 0 -4px 0 rgba(0, 0, 0, 0.18),
        0 4px 0 rgba(15, 23, 42, 0.45);
      transition: transform 0.22s ease, opacity 0.18s ease;
    }

    .formula-text {
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(1.35rem, 2.3vw, 2.55rem);
      letter-spacing: 0.02em;
      line-height: 1.05;
      /* Bold cartoon outline around numbers for 100% legibility on bright blocks */
      text-shadow:
        -2.5px -2.5px 0 #0f172a,
         2.5px -2.5px 0 #0f172a,
        -2.5px  2.5px 0 #0f172a,
         2.5px  2.5px 0 #0f172a,
         0px    5px   0 #0f172a;
      white-space: nowrap;
    }

    /* CRITICAL RULE: When cell is clicked, the math expression COMPLETELY DISAPPEARS! */
    .math-cell.claimed .formula-plate {
      opacity: 0 !important;
      transform: scale(0) !important;
      pointer-events: none !important;
      display: none !important;
    }

    /* Full-Cell Symbol Reveal Container */
    .symbol-reveal {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
      transform: scale(0) rotate(-20deg);
      opacity: 0;
      transition: transform 0.38s cubic-bezier(0.34, 1.72, 0.64, 1), opacity 0.2s ease;
    }

    .math-cell.claimed .symbol-reveal {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }

    /* Winning cell bounce & golden glow */
    .math-cell.win-cell {
      animation: winCellPulse 0.6s ease-in-out infinite alternate;
      border-color: #fef08a !important;
      box-shadow:
        0 0 30px #facc15,
        inset 0 0 22px rgba(254, 240, 138, 0.75),
        0 10px 0 #78350f !important;
    }

    @keyframes winCellPulse {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.06) translateY(-6px); }
    }

    /* Board wiggle on draw */
    .board-wiggle {
      animation: boardJelly 0.65s ease-in-out;
    }
    @keyframes boardJelly {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-2.5deg) scale(1.02); }
      40% { transform: rotate(2.5deg) scale(0.98); }
      60% { transform: rotate(-1.8deg) scale(1.01); }
      80% { transform: rotate(1.8deg) scale(0.99); }
    }

    /* Top Navigation & Turn Switcher Buttons */
    .roblox-btn {
      position: relative;
      border-radius: 20px;
      border: 4px solid #0f172a;
      box-shadow:
        inset 0 5px 0 rgba(255, 255, 255, 0.55),
        inset 0 -6px 0 rgba(0, 0, 0, 0.28),
        0 7px 0 #0f172a,
        0 12px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.16s ease;
      cursor: pointer;
    }
    .roblox-btn:hover {
      transform: translateY(-3px) scale(1.06);
      filter: brightness(1.08);
    }
    .roblox-btn:active {
      transform: translateY(4px) scale(0.95);
    }
  </style>
</head>
<body class="select-none">

  <!-- 1. BRIGHT SUNNY ROBLOX PARKOUR (OBBY) & BRICKBATTLE WORLD BACKGROUND -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <svg class="w-full h-full" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- Sunny Daytime Sky Gradient -->
        <linearGradient id="sunnySky" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0284c7"/>
          <stop offset="42%" stop-color="#38bdf8"/>
          <stop offset="82%" stop-color="#7dd3fc"/>
          <stop offset="100%" stop-color="#bae6fd"/>
        </linearGradient>

        <!-- Rainbow Obby Bridge Gradient -->
        <linearGradient id="obbyRainbow" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ef4444"/>
          <stop offset="20%" stop-color="#f97316"/>
          <stop offset="40%" stop-color="#facc15"/>
          <stop offset="60%" stop-color="#22c55e"/>
          <stop offset="80%" stop-color="#3b82f6"/>
          <stop offset="100%" stop-color="#a855f7"/>
        </linearGradient>

        <!-- Baseplate Grass Stud Pattern -->
        <pattern id="grassStuds" width="44" height="22" patternUnits="userSpaceOnUse">
          <ellipse cx="22" cy="11" rx="13" ry="5.5" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
          <ellipse cx="19" cy="9.5" rx="6" ry="2" fill="rgba(255,255,255,0.45)"/>
        </pattern>
      </defs>

      <!-- Sky Fill -->
      <rect width="1920" height="1080" fill="url(#sunnySky)"/>

      <!-- Cool Blocky Roblox Sun in Top-Left Sky -->
      <g transform="translate(155, 130)">
        <circle cx="0" cy="0" r="105" fill="rgba(254, 240, 138, 0.28)"/>
        <circle cx="0" cy="0" r="78" fill="rgba(253, 224, 71, 0.45)"/>
        <!-- Rotating Blocky Sun Rays -->
        <g>
          <rect x="-56" y="-56" width="112" height="112" rx="18" fill="#facc15" stroke="#ca8a04" stroke-width="5" transform="rotate(45)"/>
          <rect x="-56" y="-56" width="112" height="112" rx="18" fill="#fde047" stroke="#ca8a04" stroke-width="5"/>
          <!-- Top Sun Studs -->
          <rect x="-34" y="-68" width="26" height="12" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="3.5"/>
          <rect x="8" y="-68" width="26" height="12" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="3.5"/>
          <!-- Cool Pixel Shades on Sun -->
          <rect x="-38" y="-16" width="32" height="18" rx="3" fill="#0f172a"/>
          <rect x="6" y="-16" width="32" height="18" rx="3" fill="#0f172a"/>
          <line x1="-6" y1="-9" x2="6" y2="-9" stroke="#0f172a" stroke-width="5"/>
          <line x1="-32" y1="-11" x2="-16" y2="-4" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
          <line x1="12" y1="-11" x2="28" y2="-4" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
          <path d="M -18 16 Q 0 30 20 14" fill="none" stroke="#9a3412" stroke-width="5" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Drifting 3D Blocky Clouds -->
      <g class="cloud-slow" opacity="0.92">
        <rect x="80" y="95" width="210" height="52" rx="14" fill="#f8fafc" stroke="#0284c7" stroke-width="4"/>
        <rect x="120" y="60" width="130" height="44" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
        <rect x="84" y="130" width="202" height="14" rx="6" fill="#bae6fd"/>
        <ellipse cx="155" cy="60" rx="15" ry="5" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
        <ellipse cx="215" cy="60" rx="15" ry="5" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
      </g>

      <g class="cloud-med" opacity="0.88">
        <rect x="820" y="140" width="250" height="56" rx="16" fill="#f8fafc" stroke="#0284c7" stroke-width="4"/>
        <rect x="870" y="100" width="150" height="48" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
        <rect x="824" y="178" width="242" height="15" rx="6" fill="#bae6fd"/>
        <ellipse cx="910" cy="100" rx="16" ry="5" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
        <ellipse cx="975" cy="100" rx="16" ry="5" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
      </g>

      <g class="cloud-fast" opacity="0.82">
        <rect x="420" y="210" width="175" height="44" rx="12" fill="#f8fafc" stroke="#0284c7" stroke-width="3.5"/>
        <rect x="455" y="182" width="105" height="34" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="3.5"/>
      </g>

      <!-- Giant Swooping Rainbow Obby Sky Bridge in the Distance -->
      <path d="M -80 690 Q 480 410 1020 580 T 2020 490" fill="none" stroke="#0f172a" stroke-width="44" stroke-linecap="round" opacity="0.35"/>
      <path d="M -80 682 Q 480 402 1020 572 T 2020 482" fill="none" stroke="url(#obbyRainbow)" stroke-width="34" stroke-linecap="round"/>
      <path d="M -80 674 Q 480 394 1020 564 T 2020 474" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="8" stroke-linecap="round" stroke-dasharray="36 24"/>

      <!-- Distant Classic Roblox Doomspire Brickbattle Towers (Background Horizon) -->
      <!-- Blue Spire Tower -->
      <g transform="translate(650, 560)">
        <rect x="0" y="0" width="86" height="260" rx="8" fill="#3b82f6" stroke="#0f172a" stroke-width="4"/>
        <rect x="10" y="-28" width="66" height="32" rx="6" fill="#60a5fa" stroke="#0f172a" stroke-width="4"/>
        <polygon points="43,-78 8,-28 78,-28" fill="#2563eb" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
        <!-- Tower Windows -->
        <rect x="20" y="30" width="18" height="26" rx="4" fill="#fef08a" stroke="#0f172a" stroke-width="3"/>
        <rect x="48" y="30" width="18" height="26" rx="4" fill="#fef08a" stroke="#0f172a" stroke-width="3"/>
        <rect x="20" y="80" width="46" height="22" rx="4" fill="#1d4ed8" stroke="#0f172a" stroke-width="3"/>
        <rect x="20" y="125" width="18" height="26" rx="4" fill="#fef08a" stroke="#0f172a" stroke-width="3"/>
        <rect x="48" y="125" width="18" height="26" rx="4" fill="#fef08a" stroke="#0f172a" stroke-width="3"/>
      </g>

      <!-- Red Spire Tower (Right Background) -->
      <g transform="translate(1740, 520)">
        <rect x="0" y="0" width="92" height="300" rx="8" fill="#ef4444" stroke="#0f172a" stroke-width="4"/>
        <rect x="12" y="-30" width="68" height="34" rx="6" fill="#f87171" stroke="#0f172a" stroke-width="4"/>
        <polygon points="46,-85 10,-30 82,-30" fill="#dc2626" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
        <rect x="22" y="34" width="18" height="28" rx="4" fill="#fef08a" stroke="#0f172a" stroke-width="3"/>
        <rect x="52" y="34" width="18" height="28" rx="4" fill="#fef08a" stroke="#0f172a" stroke-width="3"/>
        <rect x="22" y="90" width="48" height="24" rx="4" fill="#b91c1c" stroke="#0f172a" stroke-width="3"/>
      </g>

      <!-- Floating Sky Obby Island with Checkpoint Flag -->
      <g class="island-float-1" transform="translate(530, 290)">
        <rect x="0" y="22" width="150" height="32" rx="10" fill="#92400e" stroke="#0f172a" stroke-width="4"/>
        <rect x="-8" y="0" width="166" height="28" rx="10" fill="#22c55e" stroke="#0f172a" stroke-width="4"/>
        <ellipse cx="25" cy="0" rx="14" ry="5" fill="#4ade80" stroke="#0f172a" stroke-width="3"/>
        <ellipse cx="75" cy="0" rx="14" ry="5" fill="#4ade80" stroke="#0f172a" stroke-width="3"/>
        <ellipse cx="125" cy="0" rx="14" ry="5" fill="#4ade80" stroke="#0f172a" stroke-width="3"/>
        <!-- Checkpoint Flag -->
        <line x1="75" y1="0" x2="75" y2="-68" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
        <polygon points="75,-68 128,-50 75,-32" fill="#facc15" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="75" cy="-70" r="7" fill="#ef4444" stroke="#0f172a" stroke-width="3"/>
      </g>

      <!-- Rolling Green Roblox Block Hills & Baseplate Ground -->
      <g>
        <!-- Back Blocky Hill -->
        <rect x="-40" y="750" width="920" height="160" rx="28" fill="#16a34a" stroke="#0f172a" stroke-width="5"/>
        <rect x="960" y="770" width="1020" height="160" rx="28" fill="#15803d" stroke="#0f172a" stroke-width="5"/>

        <!-- Blocky Roblox Palm Tree on Left Horizon -->
        <g transform="translate(88, 560)">
          <!-- Segmented Blocky Trunk -->
          <rect x="0" y="135" width="34" height="58" rx="6" fill="#b45309" stroke="#0f172a" stroke-width="4"/>
          <rect x="4" y="82" width="34" height="58" rx="6" fill="#d97706" stroke="#0f172a" stroke-width="4" transform="rotate(4 21 110)"/>
          <rect x="10" y="30" width="32" height="58" rx="6" fill="#b45309" stroke="#0f172a" stroke-width="4" transform="rotate(8 26 58)"/>
          <!-- Blocky Stud Palm Leaves -->
          <g transform="translate(28, 24)">
            <rect x="-85" y="-12" width="80" height="24" rx="8" fill="#22c55e" stroke="#0f172a" stroke-width="4" transform="rotate(-18)"/>
            <rect x="5" y="-12" width="80" height="24" rx="8" fill="#22c55e" stroke="#0f172a" stroke-width="4" transform="rotate(22)"/>
            <rect x="-70" y="-18" width="75" height="22" rx="8" fill="#4ade80" stroke="#0f172a" stroke-width="4" transform="rotate(15)"/>
            <rect x="0" y="-18" width="75" height="22" rx="8" fill="#4ade80" stroke="#0f172a" stroke-width="4" transform="rotate(-24)"/>
            <rect x="-22" y="-24" width="44" height="24" rx="8" fill="#fde047" stroke="#0f172a" stroke-width="4"/>
          </g>
        </g>

        <!-- Main Foreground Studded Green Baseplate -->
        <rect x="-20" y="830" width="1960" height="270" fill="#22c55e" stroke="#0f172a" stroke-width="6"/>
        <rect x="-20" y="836" width="1960" height="24" fill="#86efac" opacity="0.65"/>
        <rect x="-20" y="840" width="1960" height="260" fill="url(#grassStuds)"/>
      </g>
    </svg>
  </div>

  <!-- 2. PARTICLE EXPLOSION & FIREWORKS CANVAS -->
  <canvas id="fx-canvas" class="fixed inset-0 pointer-events-none z-30"></canvas>

  <!-- 3. TOP-RIGHT MINIMALIST ICON CONTROLS (ZERO WORDS) -->
  <div class="fixed top-4 right-5 z-40 flex items-center gap-3">
    <!-- Undo Last Cell Move Button -->
    <button id="undo-btn" aria-label="Undo" class="roblox-btn w-14 h-14 md:w-16 md:h-16 bg-gradient-to-b from-amber-300 via-amber-400 to-orange-500 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200">
      <svg class="w-8 h-8 md:w-9 md:h-9 drop-shadow" viewBox="0 0 48 48" fill="none">
        <path d="M18 14L8 24L18 34" stroke="#0f172a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 24H30C35.5228 24 40 28.4772 40 34V35" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
        <path d="M18 14L8 24L18 34" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 24H30C35.5228 24 40 28.4772 40 34V35" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Sound Mute/Unmute Toggle Button -->
    <button id="sound-btn" aria-label="Sound" class="roblox-btn w-14 h-14 md:w-16 md:h-16 bg-gradient-to-b from-sky-300 via-sky-400 to-blue-600 flex items-center justify-center">
      <svg id="sound-on-icon" class="w-8 h-8 md:w-9 md:h-9 drop-shadow" viewBox="0 0 48 48" fill="none">
        <path d="M10 19H17L26 11V37L17 29H10V19Z" fill="#fde047" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
        <path d="M32 17C35 20 35 28 32 31" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M37 12C42 17 42 31 37 36" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
      </svg>
      <svg id="sound-off-icon" class="w-8 h-8 md:w-9 md:h-9 drop-shadow hidden" viewBox="0 0 48 48" fill="none">
        <path d="M10 19H17L26 11V37L17 29H10V19Z" fill="#cbd5e1" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
        <path d="M32 19L42 29M42 19L32 29" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Minimalist "NEXT" Button (Immediate new 3x3 board without finishing) -->
    <button id="next-btn" aria-label="Next" class="roblox-btn w-16 h-14 md:w-20 md:h-16 bg-gradient-to-b from-lime-300 via-emerald-400 to-green-600 flex items-center justify-center">
      <svg class="w-10 h-10 md:w-11 md:h-11 drop-shadow" viewBox="0 0 56 48" fill="none">
        <polygon points="8,10 27,24 8,38" fill="#fde047" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round"/>
        <polygon points="27,10 46,24 27,38" fill="#ffffff" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- 4. MAIN WIDESCREEN GAME STAGE -->
  <main class="relative z-10 w-screen h-screen flex flex-row items-center justify-between px-3 md:px-8 lg:px-12 py-2 gap-3 md:gap-6">

    <!-- LEFT COLUMN: TURN SWITCHER + PURE-JS ANIMATED ROBLOX HERO ON OBBY STAGE -->
    <section class="w-[36%] lg:w-[37%] h-full flex flex-col items-center justify-between py-3 relative">

      <!-- Top Turn Switcher Widget + Hat Rack Button -->
      <div class="w-full flex items-center justify-center gap-3 z-20 mt-1">
        <!-- Active Turn Switcher (Click to switch between X and O anytime) -->
        <div id="turn-indicator" class="roblox-btn bg-gradient-to-b from-amber-300 via-amber-400 to-orange-500 px-3.5 py-2 flex items-center gap-3">
          <!-- X Slot (Crossed Swords) -->
          <div id="turn-symbol-x" class="w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-sky-500 border-3 border-slate-900 flex items-center justify-center shadow-inner transition-all duration-200 scale-110">
            <svg viewBox="0 0 100 100" class="w-10 h-10">
              <g transform="rotate(-45 50 50)">
                <polygon points="50,8 58,22 56,70 44,70 42,22" fill="#22d3ee" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
                <rect x="32" y="66" width="36" height="9" rx="4" fill="#facc15" stroke="#0f172a" stroke-width="3.5"/>
                <rect x="44" y="75" width="12" height="16" rx="3" fill="#ef4444" stroke="#0f172a" stroke-width="3.5"/>
              </g>
              <g transform="rotate(45 50 50)">
                <polygon points="50,8 58,22 56,70 44,70 42,22" fill="#f43f5e" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>

        [copy[i], copy[j]] = [copy[j], copy[i]];

    /*************************************************************************
     * 4. WEB AUDIO API SYNTHESIZER (7 Distinct Roblox Sounds + Fanfare)
     *************************************************************************/
    class RobloxAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      tone(freq, type, duration, delay = 0, vol = 0.2, slideTo = null) {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
        }
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      playDance() {
        [330, 392, 493.88, 523.25, 392, 659.25].forEach((n, i) => {
          this.tone(n, 'square', 0.11, i * 0.08, 0.15);
        });
      }

      playCoilParkour() {
        this.tone(180, 'sine', 0.32, 0, 0.25, 780);
        this.tone(240, 'triangle', 0.32, 0.28, 0.25, 920);
        this.tone(320, 'sine', 0.36, 0.56, 0.25, 1180);

      playHammerSmash() {

    /*************************************************************************
     * 5. HTML5 CANVAS 3D ROBLOX BRICK & STUD PARTICLE SYSTEM
     *************************************************************************/
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let fireworksInterval = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const PARTICLE_COLORS = ['#ef4444', '#38bdf8', '#facc15', '#22c55e', '#ec4899', '#a855f7', '#fb923c'];

    function spawnParticles(x, y, count = 26, mode = 'mixed') {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
        const speed = 4 + Math.random() * 11;
        const shapes = mode === 'robux' ? ['hex', 'star'] : ['brick', 'stud', 'star', 'hex'];
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3.5,
          gravity: 0.34,
          size: 10 + Math.random() * 13,
          color: mode === 'robux' ? (Math.random() > 0.3 ? '#facc15' : '#10b981') : PARTICLE_COLORS[Math.floor(Math.random() * PARTICLE_COLORS.length)],
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.22,
          alpha: 1,
          decay: 0.015 + Math.random() * 0.012,
          shape: shapes[Math.floor(Math.random() * shapes.length)]
        });
      }
    }

    function drawStar(c, r) {
      c.beginPath();
      for (let i = 0; i < 5; i++) {
        c.lineTo(Math.cos(((18 + i * 72) * Math.PI) / 180) * r, -Math.sin(((18 + i * 72) * Math.PI) / 180) * r);
        c.lineTo(Math.cos(((54 + i * 72) * Math.PI) / 180) * (r * 0.45), -Math.sin(((54 + i * 72) * Math.PI) / 180) * (r * 0.45));
      }
      c.closePath();
      c.fill();
      c.stroke();
    }

    function drawHex(c, r) {
      c.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 3) * i;
        if (i === 0) c.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      c.closePath();
      c.fill();
      c.stroke();
    }

    function updateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rot += p.vRot;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2.5;

        if (p.shape === 'brick') {
          ctx.fillRect(-p.size * 0.7, -p.size * 0.45, p.size * 1.4, p.size * 0.9);
          ctx.strokeRect(-p.size * 0.7, -p.size * 0.45, p.size * 1.4, p.size * 0.9);
          ctx.fillRect(-p.size * 0.35, -p.size * 0.7, p.size * 0.7, p.size * 0.25);
          ctx.strokeRect(-p.size * 0.35, -p.size * 0.7, p.size * 0.7, p.size * 0.25);
        } else if (p.shape === 'stud') {
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.55, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        } else if (p.shape === 'hex') {
          drawHex(ctx, p.size * 0.65);
        } else {
          drawStar(ctx, p.size * 0.7);
        }
        ctx.restore();
      }
    }

          break;

        case 3:
          // 4. Fizzy Bloxy Cola Sip + Double Backflip on the Spot!
          charAnim.mode = 'colaFlip';
          charAnim.duration = 1450;
          propCola.setAttribute('opacity', '1');
          setFace('cool');
          sound.playColaFlip();
          spawnParticles(charScreenX, charScreenY - 40, 24, 'mixed');
          break;

        case 4:
          // 5. Neon Skateboard 360 Kickflip over the Spawn Pad!
          charAnim.mode = 'skateboard';
          charAnim.duration = 1450;
          propSkateboard.setAttribute('opacity', '1');
          setFace('cool');
          sound.playSkateboard();
          spawnParticles(charScreenX, charScreenY + 90, 24, 'mixed');
          break;

        case 5:
          // 6. Rocket Jetpack Hover Loop with Thruster Flames!
          charAnim.mode = 'jetpack';
          charAnim.duration = 1500;
          propJetpack.setAttribute('opacity', '1');
          setFace('star');
          sound.playJetpack();
          spawnParticles(charScreenX, charScreenY + 40, 26, 'robux');
          break;

        case 6:
          // 7. Rock Star Electric Guitar Solo with Jump!
          charAnim.mode = 'guitar';
          charAnim.duration = 1450;
          propGuitar.setAttribute('opacity', '1');
          setFace('happy');
          sound.playGuitarSolo();
          spawnParticles(charScreenX, charScreenY - 30, 24, 'mixed');
          break;
      }
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    // Main 60fps Animation Loop for Character Rig + Particles
    let spawnRingAngle = 0;

    function masterAnimationLoop(now) {
      updateParticles();

      // Slowly rotate the SpawnLocation decal ring
      spawnRingAngle = (spawnRingAngle + 0.8) % 360;
      spawnDecalRing.setAttribute('transform', `rotate(${spawnRingAngle})`);

      // Calculate character rig pose
      let x = HOME_X;
      let y = HOME_Y;
      let bodyRot = 0;
      let headRot = 0;
      let armLRot = 0;
      let armRRot = 0;
      let legLRot = 0;
      let legRRot = 0;

      const elapsed = now - charAnim.startTime;
      if (charAnim.mode !== 'idle' && elapsed >= charAnim.duration) {
        charAnim.mode = 'idle';
        hideAllProps();
        if (!gameWon) setFace('default');
      }

      const p = charAnim.duration > 0 ? Math.min(1, elapsed / charAnim.duration) : 0;

      if (charAnim.mode === 'idle') {
        // Gentle breathing & cheerful bobbing on the Spawn Pad
        const t = now * 0.004;
        y = HOME_Y + Math.sin(t) * 6;
        bodyRot = Math.sin(t * 0.5) * 1.5;
        headRot = Math.sin(t * 0.8) * 3;
        armLRot = 8 + Math.sin(t) * 6;
        armRRot = -8 - Math.sin(t) * 6;
        legLRot = Math.sin(t) * 2;
        legRRot = -Math.sin(t) * 2;
      } else if (charAnim.mode === 'dance') {
        // Groovy /e dance side-to-side with Boombox
        const beat = elapsed * 0.018;
        x = HOME_X + Math.sin(beat) * 26;
        y = HOME_Y - Math.abs(Math.cos(beat)) * 22;
        bodyRot = Math.sin(beat) * 10;
        headRot = -Math.sin(beat) * 12;
        armLRot = 115 + Math.sin(beat) * 15; // Holding Boombox by shoulder
        armRRot = -95 + Math.cos(beat) * 45;
        legLRot = Math.sin(beat) * 28;
        legRRot = -Math.sin(beat) * 28;
      } else if (charAnim.mode === 'parkour') {
        // Hops from Spawn (295,365) -> Pad 1 (105,245) -> Pad 2 (295,105) -> Pad 3 (495,230) -> Spawn (295,365)
        const waypoints = [
          { x: HOME_X, y: HOME_Y },
          { x: 105, y: 245 },
          { x: 295, y: 105 },
          { x: 495, y: 230 },
          { x: HOME_X, y: HOME_Y }
        ];
        const segCount = waypoints.length - 1;
        const rawSeg = p * segCount;
        const segIdx = Math.min(segCount - 1, Math.floor(rawSeg));
        const localT = rawSeg - segIdx;
        const startPt = waypoints[segIdx];
        const endPt = waypoints[segIdx + 1];

        x = lerp(startPt.x, endPt.x, localT);
        // Parabolic jump arc between pads
        const arcHeight = 95 * Math.sin(localT * Math.PI);
        y = lerp(startPt.y, endPt.y, localT) - arcHeight;
        bodyRot = (endPt.x > startPt.x ? 1 : -1) * Math.sin(localT * Math.PI) * 18;
        armLRot = 135;
        armRRot = -135;
        legLRot = 32 * Math.sin(localT * Math.PI);
        legRRot = -32 * Math.sin(localT * Math.PI);
      } else if (charAnim.mode === 'hammer') {
        // Wind up giant Ban Hammer and smash the orange crate!
        if (p < 0.35) {
          const w = p / 0.35;
          y = HOME_Y - Math.sin(w * Math.PI) * 35;
          bodyRot = -12 * w;
          armRRot = -165 * w;
          armLRot = 45 * w;
          smashCrate.setAttribute('transform', `translate(445, 515) scale(${Math.min(1, w * 1.3)})`);
        } else if (p < 0.55) {
          const s = (p - 0.35) / 0.2;
          bodyRot = lerp(-12, 16, s);
          armRRot = lerp(-165, -25, s);
          smashCrate.setAttribute('transform', `translate(445, 515) scale(${1 + s * 0.3}, ${1 - s * 0.5})`);
        } else {
          // Crate exploded! Hero cheers!
          smashCrate.setAttribute('opacity', '0');
          const c = (p - 0.55) / 0.45;
          y = HOME_Y - Math.abs(Math.sin(c * Math.PI * 2)) * 24;
          armLRot = 140;
          armRRot = -110 + Math.sin(c * Math.PI * 4) * 20;
        }
      } else if (charAnim.mode === 'colaFlip') {
        // Drink Bloxy Cola then perform an epic 360 backflip right above the Spawn Pad!
        if (p < 0.35) {
          const sip = p / 0.35;
          headRot = -18 * Math.sin(sip * Math.PI);
          armLRot = 135 * Math.sin(sip * Math.PI);
          armRRot = -25;
        } else {
          const flipT = (p - 0.35) / 0.65;
          y = HOME_Y - Math.sin(flipT * Math.PI) * 155;
          bodyRot = -flipT * 360;
          armLRot = 145;
          armRRot = -145;
          legLRot = 25;
          legRRot = -25;
        }
      } else if (charAnim.mode === 'skateboard') {
        // Skate side-to-side and do a mid-air kickflip!
        x = HOME_X + Math.sin(p * Math.PI * 2) * 85;
        const jumpArc = Math.sin(p * Math.PI);
        y = HOME_Y - jumpArc * 115;
        bodyRot = Math.sin(p * Math.PI * 2) * 14;
        armLRot = 95 + Math.sin(p * 15) * 25;
        armRRot = -95 - Math.sin(p * 15) * 25;
        legLRot = -18;
        legRRot = 18;
        // Spin the skateboard 360 degrees during jump peak
        const boardSpin = p > 0.2 && p < 0.8 ? ((p - 0.2) / 0.6) * 360 : 0;
        propSkateboard.setAttribute('transform', `translate(0, 152) rotate(${boardSpin})`);
      } else if (charAnim.mode === 'jetpack') {
        // Fly up in a figure-8 hover loop above the Spawn Pad with flickering flames
        x = HOME_X + Math.sin(p * Math.PI * 2) * 65;
        y = HOME_Y - Math.sin(p * Math.PI) * 165;
        bodyRot = Math.cos(p * Math.PI * 2) * 16;
        armLRot = 145;
        armRRot = -145;
        legLRot = 18 + Math.sin(now * 0.03) * 10;
        legRRot = -18 - Math.sin(now * 0.03) * 10;
        const flameScale = 0.8 + Math.random() * 0.5;
        document.getElementById('jetpack-flame-l').setAttribute('transform', `scale(1, ${flameScale})`);
        document.getElementById('jetpack-flame-r').setAttribute('transform', `scale(1, ${flameScale})`);
      } else if (charAnim.mode === 'guitar') {
        // Rock Star Guitar Shredding + Jump
        const rockBeat = elapsed * 0.022;
        y = HOME_Y - Math.abs(Math.sin(rockBeat)) * 38;
        bodyRot = -8 + Math.sin(rockBeat) * 10;
        headRot = Math.sin(rockBeat * 2) * 15;
        armLRot = 55;
        armRRot = -45 + Math.sin(rockBeat * 4) * 35; // Strumming hand
        legLRot = -22;
        legRRot = 22;
      }

      // Apply transforms directly to SVG elements (Anchored cleanly at HOME_X, HOME_Y)
      noobRig.setAttribute('transform', `translate(${x.toFixed(1)}, ${y.toFixed(1)}) rotate(${bodyRot.toFixed(1)})`);
      rigHead.setAttribute('transform', `translate(0, -92) rotate(${headRot.toFixed(1)})`);
      rigArmL.setAttribute('transform', `translate(-82, -72) rotate(${armLRot.toFixed(1)})`);
      rigArmR.setAttribute('transform', `translate(82, -72) rotate(${armRRot.toFixed(1)})`);
      rigLegL.setAttribute('transform', `translate(-32, 35) rotate(${legLRot.toFixed(1)})`);
      rigLegR.setAttribute('transform', `translate(32, 35) rotate(${legRRot.toFixed(1)})`);

      // Keep shadow anchored on the ground below the character
      const heightOffGround = Math.max(0, HOME_Y - y);
      const shadowScale = Math.max(0.35, 1 - heightOffGround / 260);
      noobShadow.setAttribute('transform', `translate(0, ${(200 + heightOffGround).toFixed(1)}) scale(${shadowScale.toFixed(2)})`);

      requestAnimationFrame(masterAnimationLoop);
    }

    // Clicking the Roblox Character triggers an immediate random stunt
    noobRig.addEventListener('click', () => {
      triggerCharacterAction();
    });

    // Clicking the Hat Customizer button swaps the character's Roblox hat with particles!
    document.getElementById('hat-btn').addEventListener('click', () => {
      sound.playClick();
      setHat(currentHatIndex + 1);
      const stageRect = document.getElementById('character-stage-svg').getBoundingClientRect();
      spawnParticles(stageRect.left + stageRect.width * 0.48, stageRect.top + stageRect.height * 0.25, 22, 'mixed');
      triggerCharacterAction(0);
    });

    /*************************************************************************
     * 7. TIC-TAC-TOE GAME LOGIC (Immediate Disappearance of Clicked Formula!)
     *************************************************************************/
    const gridEl = document.getElementById('grid-3x3');
    const boardContainer = document.getElementById('board-container');
    const turnIndicator = document.getElementById('turn-indicator');
    const turnSymbolX = document.getElementById('turn-symbol-x');
    const turnSymbolO = document.getElementById('turn-symbol-o');
    const undoBtn = document.getElementById('undo-btn');
    const nextBtn = document.getElementById('next-btn');
    const soundBtn = document.getElementById('sound-btn');

    const winLaserBorder = document.getElementById('win-laser-border');
    const winLaserOuter = document.getElementById('win-laser-outer');
    const winLaserInner = document.getElementById('win-laser-inner');

    let boardState = Array(9).fill(null);
    let currentTurn = 'X';
    let moveHistory = [];
    let gameWon = false;

    const WIN_LINES = [
      { indices: [0, 1, 2], coords: [80, 150, 820, 150] },
      { indices: [3, 4, 5], coords: [80, 450, 820, 450] },
      { indices: [6, 7, 8], coords: [80, 750, 820, 750] },
      { indices: [0, 3, 6], coords: [150, 80, 150, 820] },
      { indices: [1, 4, 7], coords: [450, 80, 450, 820] },
      { indices: [2, 5, 8], coords: [750, 80, 750, 820] },
      { indices: [0, 4, 8], coords: [85, 85, 815, 815] },
      { indices: [2, 4, 6], coords: [815, 85, 85, 815] }
    ];

    function updateTurnUI() {
      if (currentTurn === 'X') {
        turnSymbolX.className = "w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-sky-400 border-3 border-slate-900 flex items-center justify-center shadow-[0_0_16px_#38bdf8] transition-all duration-200 scale-110";
        turnSymbolO.className = "w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-amber-200/60 border-3 border-slate-900/40 flex items-center justify-center transition-all duration-200 opacity-50 scale-90";
      } else {
        turnSymbolO.className = "w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-amber-300 border-3 border-slate-900 flex items-center justify-center shadow-[0_0_16px_#facc15] transition-all duration-200 scale-110";
        turnSymbolX.className = "w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-sky-200/60 border-3 border-slate-900/40 flex items-center justify-center transition-all duration-200 opacity-50 scale-90";
      }

      if (moveHistory.length > 0) {
        undoBtn.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        undoBtn.classList.add('opacity-0', 'pointer-events-none');
      }
    }

    // Click Turn Switcher to manually toggle X or O anytime
    turnIndicator.addEventListener('click', () => {
      sound.playClick();
      currentTurn = currentTurn === 'X' ? 'O' : 'X';
      updateTurnUI();
      const rect = turnIndicator.getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 14, 'mixed');
    });

    function clearWinEffects() {
      if (fireworksInterval) {
        clearInterval(fireworksInterval);
        fireworksInterval = null;
      }
      [winLaserBorder, winLaserOuter, winLaserInner].forEach(el => el.setAttribute('opacity', '0'));
      document.querySelectorAll('.math-cell').forEach(c => c.classList.remove('win-cell'));
    }

    function checkWinOrDraw() {
      for (const line of WIN_LINES) {
        const [a, b, c] = line.indices;
        if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
          triggerWinCelebration(line);
          return true;
        }
      }
      if (boardState.every(cell => cell !== null)) {
        triggerDrawEffect();
        return true;
      }
      return false;
    }

    function triggerWinCelebration(winLine) {
      gameWon = true;
      sound.playWinFanfare();
      setHat(1); // Equip Golden King Crown on Win!
      setFace('star');

      const cells = document.querySelectorAll('.math-cell');
      winLine.indices.forEach(idx => cells[idx].classList.add('win-cell'));

      const [x1, y1, x2, y2] = winLine.coords;
      const isX = boardState[winLine.indices[0]] === 'X';
      winLaserOuter.setAttribute('stroke', isX ? '#22d3ee' : '#facc15');

      [winLaserBorder, winLaserOuter, winLaserInner].forEach(el => {
        el.setAttribute('x1', x1);
        el.setAttribute('y1', y1);
        el.setAttribute('x2', x2);
        el.setAttribute('y2', y2);
        el.setAttribute('opacity', '1');
      });

      triggerCharacterAction(1); // Parkour victory lap!

      fireworksInterval = setInterval(() => {
        const rx = window.innerWidth * (0.2 + Math.random() * 0.7);
        const ry = window.innerHeight * (0.15 + Math.random() * 0.65);
        spawnParticles(rx, ry, 28, isX ? 'mixed' : 'robux');
      }, 420);
    }

    function triggerDrawEffect() {
      sound.playDraw();
      boardContainer.classList.remove('board-wiggle');
      void boardContainer.offsetWidth;
      boardContainer.classList.add('board-wiggle');
      triggerCharacterAction(4);
    }

    function handleCellClick(index, cellEl) {
      if (boardState[index] !== null || gameWon) {
        triggerCharacterAction();
        return;
      }

      const symbol = currentTurn;
      boardState[index] = symbol;
      moveHistory.push({ index, symbol });

      // Inject full-size X or O SVG picture and COMPLETELY HIDE the math expression
      const symbolContainer = cellEl.querySelector('.symbol-reveal');
      symbolContainer.innerHTML = symbol === 'X' ? getRobloxXSvg() : getRobloxOSvg();
      cellEl.classList.add('claimed');

      const rect = cellEl.getBoundingClientRect();
      spawnParticles(
        rect.left + rect.width / 2,
        rect.top + rect.height / 2,
        30,
        symbol === 'O' ? 'robux' : 'mixed'
      );

      const ended = checkWinOrDraw();
      if (!ended) {
        triggerCharacterAction();
        currentTurn = currentTurn === 'X' ? 'O' : 'X';
      }
      updateTurnUI();
    }

    // Undo Last Move Button
    undoBtn.addEventListener('click', () => {
      if (moveHistory.length === 0) return;
      sound.playClick();
      clearWinEffects();
      gameWon = false;

      const last = moveHistory.pop();
      boardState[last.index] = null;
      currentTurn = last.symbol;

      const cells = document.querySelectorAll('.math-cell');
      const targetCell = cells[last.index];
      if (targetCell) {
        targetCell.classList.remove('claimed');
        targetCell.querySelector('.symbol-reveal').innerHTML = '';
      }
      setFace('default');
      updateTurnUI();
    });

    // Generate a fresh 3x3 board with 9 unique expressions from the 54-expression pool
    function generateNewBoard() {
      clearWinEffects();
      gameWon = false;
      boardState = Array(9).fill(null);
      moveHistory = [];
      currentTurn = 'X';
      setFace('default');
      updateTurnUI();

      const nineExpressions = getNineUniqueExpressions();
      const palettes = shuffleArray(BRICK_PALETTES);

      gridEl.innerHTML = '';

      nineExpressions.forEach((expr, idx) => {
        const pal = palettes[idx];
        const cell = document.createElement('div');
        cell.className = 'math-cell';
        cell.style.background = pal.brick;

        cell.innerHTML = `
          <!-- Top 3D Roblox Brick Studs -->
          <div class="absolute top-2 left-0 right-0 flex justify-around px-4 pointer-events-none">
            <span class="w-6 h-2.5 rounded-full border-2 border-slate-900" style="background:${pal.stud}"></span>
            <span class="w-6 h-2.5 rounded-full border-2 border-slate-900" style="background:${pal.stud}"></span>
            <span class="w-6 h-2.5 rounded-full border-2 border-slate-900" style="background:${pal.stud}"></span>
            <span class="w-6 h-2.5 rounded-full border-2 border-slate-900" style="background:${pal.stud}"></span>
          </div>

          <!-- Cheerful Colored Inner Formula Plate (Disappears 100% on click!) -->
          <div class="formula-plate" style="background:${pal.plate}">
            <span class="formula-text">${expr}</span>
          </div>

          <!-- Full-Cell Roblox X or O Symbol Reveal -->
          <div class="symbol-reveal"></div>
        `;

        cell.animate([
          { transform: 'scale(0.5) translateY(25px)', opacity: 0 },
          { transform: 'scale(1) translateY(0px)', opacity: 1 }
        ], {
          duration: 300,
          delay: idx * 35,
          easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)',
          fill: 'backwards'
        });

        cell.addEventListener('click', () => handleCellClick(idx, cell));
        gridEl.appendChild(cell);
      });
    }

    // Minimalist "NEXT" Button: Immediately load a new 3x3 board without finishing
    nextBtn.addEventListener('click', () => {
      sound.playCoilParkour();
      const rect = nextBtn.getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 24, 'mixed');
      triggerCharacterAction(1);
      generateNewBoard();
    });

    // Sound Toggle Button
    soundBtn.addEventListener('click', () => {
      sound.muted = !sound.muted;
      document.getElementById('sound-on-icon').classList.toggle('hidden', sound.muted);
      document.getElementById('sound-off-icon').classList.toggle('hidden', !sound.muted);
      if (!sound.muted) sound.playClick();
    });

    // Start Game & 60fps Master Animation Loop on Load
    window.onload = function () {
      generateNewBoard();
      requestAnimationFrame(masterAnimationLoop);
    };
  </script>
</body>
</html>
