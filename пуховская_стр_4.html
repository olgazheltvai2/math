<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Осіння Контрольна Робота</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap');

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }

    body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Nunito', sans-serif;
        background: linear-gradient(135deg, #2d1b15, #4a2c1c, #8a3b1c);
        background-size: 400% 400%;
        animation: bgAnimation 20s ease infinite;
        transition: background 2s ease-in-out;
    }

    body.finale-bg {
        background: linear-gradient(180deg, #ffb74d, #ff7043, #d84315);
        animation: none;
    }

    @keyframes bgAnimation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Language Toggle Button */
    #lang-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1000;
        background: transparent;
        color: rgba(255, 255, 255, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 5px 10px;
        border-radius: 8px;
        font-family: 'Nunito', sans-serif;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        opacity: 0.4;
    }

    #lang-btn:hover {
        opacity: 1;
        color: rgba(255, 255, 255, 0.8);
        border-color: rgba(255, 255, 255, 0.6);
        background: rgba(255, 255, 255, 0.1);
    }

    /* Weather Effects */
    #weather-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
    }

    .leaf {
        position: absolute;
        background: #ff9800;
        border-radius: 0 50% 0 50%;
        box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2);
        opacity: 0.8;
        animation: fall linear infinite;
    }

    .rain {
        position: absolute;
        width: 2px;
        height: 50px;
        background: linear-gradient(transparent, rgba(255,255,255,0.4));
        animation: rainFall linear infinite;
    }

    @keyframes fall {
        0% { transform: translateY(-100px) rotate(0deg) translateX(0); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translateY(100vh) rotate(720deg) translateX(100px); opacity: 0; }
    }

    @keyframes rainFall {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(100vh); }
    }

    /* Game Area */
    #game-area {
        position: relative;
        z-index: 10;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        transition: opacity 1s ease;
    }

    .task-card {
        background: rgba(46, 20, 10, 0.85);
        backdrop-filter: blur(10px);
        border: 4px solid #d84315;
        border-radius: 30px;
        padding: 50px 80px;
        max-width: 900px;
        width: 100%;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255, 152, 0, 0.2);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transition: transform 0.3s ease, opacity 0.5s ease;
    }

    .task-card.shake {
        animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
        10%, 90% { transform: translate3d(-2px, 0, 0); }
        20%, 80% { transform: translate3d(4px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
        40%, 60% { transform: translate3d(8px, 0, 0); }
    }

    .task-text {
        font-size: 2.5rem;
        color: #ffe0b2;
        line-height: 1.4;
        margin-bottom: 40px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .input-wrapper {
        position: relative;
        width: 300px;
    }

    input[type="text"] {
        width: 100%;
        padding: 15px 20px;
        font-size: 2.5rem;
        text-align: center;
        font-family: 'Nunito', sans-serif;
        font-weight: 800;
        color: #fff;
        background: rgba(0, 0, 0, 0.4);
        border: 3px solid #ff9800;
        border-radius: 20px;
        outline: none;
        transition: all 0.3s ease;
        caret-color: transparent;
    }

    input[type="text"]:focus {
        border-color: #ffc107;
        box-shadow: 0 0 20px rgba(255, 193, 7, 0.6);
    }

    input[type="text"].success {
        border-color: #4caf50;
        box-shadow: 0 0 30px rgba(76, 175, 80, 0.8);
        background: rgba(76, 175, 80, 0.2);
    }

    input[type="text"].error {
        border-color: #f44336;
        box-shadow: 0 0 20px rgba(244, 67, 54, 0.6);
    }

    /* Next Button */
    #next-btn {
        position: fixed;
        bottom: 40px;
        right: 40px;
        width: 80px;
        height: 80px;
        background: rgba(216, 67, 21, 0.8);
        border: 3px solid #ff9800;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        transition: all 0.3s ease, opacity 0.5s;
        z-index: 100;
    }

    #next-btn:hover {
        transform: scale(1.1) rotate(-5deg);
        background: rgba(255, 152, 0, 0.9);
        box-shadow: 0 0 30px rgba(255, 152, 0, 0.8);
    }

    #next-btn svg {
        width: 40px;
        height: 40px;
        fill: none;
        stroke: #fff;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    /* Finale Scene Elements */
    #finale-scene {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        overflow: hidden;
    }

    .sun {
        position: absolute;
        top: 15%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, #fff176, #ffb300, #ff5722);
        border-radius: 50%;
        box-shadow: 0 0 100px #ffb300, 0 0 200px #ff5722;
        transition: transform 2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        pointer-events: auto;
        cursor: pointer;
    }

    .sun.active {
        transform: translate(-50%, -50%) scale(1);
    }

    .sun::after {
        content: '';
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        border: 4px dashed rgba(255, 235, 59, 0.6);
        animation: spin 20s linear infinite;
    }

    @keyframes spin {
        100% { transform: rotate(360deg); }
    }

    .rainbow {
        position: absolute;
        top: 10%;
        left: 50%;
        transform: translateX(-50%);
        width: 800px;
        height: 400px;
        border-radius: 400px 400px 0 0;
        border: 25px solid;
        border-bottom: 0;
        border-color: #f44336 #ff9800 #ffeb3b #4caf50 #2196f3 #9c27b0;
        opacity: 0;
        transition: opacity 2s ease-in-out 1s;
        pointer-events: none;
        box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
    }

    .rainbow.active {
        opacity: 0.7;
    }

    .magic-tree {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 250px;
        background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg"><path d="M0 250 L0 150 Q100 180 200 120 Q300 80 400 130 Q500 200 600 100 Q700 50 800 140 Q900 190 1000 160 L1000 250 Z" fill="%233e2723"/></svg>') repeat-x bottom;
        background-size: 1000px 250px;
        transform: translateY(100%);
        transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        pointer-events: none;
    }

    .magic-tree.active {
        transform: translateY(0);
    }

    .magic-tree::before {
        content: '';
        position: absolute;
        top: -50px;
        left: 10%;
        width: 200px;
        height: 150px;
        background: radial-gradient(circle, rgba(255,152,0,0.8) 0%, transparent 70%);
        border-radius: 50%;
        filter: blur(10px);
        animation: pulse 3s alternate infinite;
    }
    
    .magic-tree::after {
        content: '';
        position: absolute;
        top: -80px;
        right: 15%;
        width: 300px;
        height: 200px;
        background: radial-gradient(circle, rgba(255,87,34,0.7) 0%, transparent 70%);
        border-radius: 50%;
        filter: blur(15px);
        animation: pulse 4s alternate infinite reverse;
    }

    @keyframes pulse {
        0% { transform: scale(1); opacity: 0.6; }
        100% { transform: scale(1.2); opacity: 1; }
    }

    /* Particles */
    .particle {
        position: absolute;
        width: 10px;
        height: 10px;
        background: #ffc107;
        border-radius: 50%;
        pointer-events: none;
        z-index: 1000;
    }

</style>
</head>
<body>

<button id="lang-btn">RU</button>

<div id="weather-container"></div>

<div id="finale-scene">
    <div class="rainbow" id="rainbow"></div>
    <div class="sun" id="sun"></div>
    <div class="magic-tree" id="magic-tree"></div>
</div>

<div id="game-area">
    <div class="task-card" id="task-card">
        <div class="task-text" id="task-text"></div>
        <div class="input-wrapper">
            <input type="text" id="answer-input" autocomplete="off">
        </div>
    </div>
</div>

<button id="next-btn" aria-label="Далі">
    <svg viewBox="0 0 24 24">
        <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
</button>

<script>
    // Bilingual Tasks Data
    const tasks = [
        { 
            ua: "1. Перший доданок — 10, другий — 9. Запиши суму.", 
            ru: "1. Первое слагаемое — 10, второе — 9. Запиши сумму.", 
            answer: "19" 
        },
        { 
            ua: "2. Зменшуване — 17, від'ємник — 3. Запиши різницю.", 
            ru: "2. Уменьшаемое — 17, вычитаемое — 3. Запиши разность.", 
            answer: "14" 
        },
        { 
            ua: "3. Запиши, яке число вийде, якщо від 18 відняти один десяток.", 
            ru: "3. Запиши, какое число получится, если от 18 отнять один десяток.", 
            answer: "8" 
        },
        { 
            ua: "4. Запиши, яке число вийде, якщо до одного десятка додати 10, а потім відняти 2.", 
            ru: "4. Запиши, какое число получится, если к одному десятку прибавить 10, а затем отнять 2.", 
            answer: "18" 
        },
        { 
            ua: "5. Довжина мотузки — 2 дм. Відрізали 4 см. Запиши, якої довжини залишилася у см.", 
            ru: "5. Длина тесьмы — 2 дм. Отрезали 4 см. Запиши, какой длины осталась тесьма.", 
            answer: "16" 
        },
        { 
            ua: "6. Місткість одного відра — 12 л. Запиши, якою є місткість другого відра, якщо вона на 2 л менша.", 
            ru: "6. Вместимость одного ведра — 12 л. Запиши, какова вместимость второго ведра, если она на 2 л меньше.", 
            answer: "10" 
        },
        { 
            ua: "7. Було 15 машин. Потім їх стало на 4 більше. Скільки машин стало?", 
            ru: "7. Было 15 машин. Потом их стало на 4 больше. Сколько машин стало?", 
            answer: "19" 
        },
        { 
            ua: "8. Яна намалювала 2 ромашки, 3 берези і 10 троянд. Скільки квітів намалювала Яна?", 
            ru: "8. Яна нарисовала 2 ромашки, 3 березы и 10 роз. Сколько цветов нарисовала Яна?", 
            answer: "12" 
        },
        { 
            ua: "9. До нуля спочатку додай 8, потім до отриманого результату додай ще 11. Запиши, яке число вийшло.", 
            ru: "9. К нулю сначала прибавь 8, затем к полученному результату прибавь ещё 11. Запиши, какое число получилось.", 
            answer: "19" 
        },
        { 
            ua: "10. Число 13 спочатку збільшили на 2, потім зменшили на якесь число і отримали нуль. Запиши, на яке число зменшили.", 
            ru: "10. Число 13 сначала увеличили на 2, потом уменьшили на какое-то число и получили нуль. Запиши, на какое число уменьшили.", 
            answer: "15" 
        }
    ];

    let currentIndex = 0;
    let isFinale = false;
    let currentLang = 'ua';
    
    const taskText = document.getElementById('task-text');
    const input = document.getElementById('answer-input');
    const nextBtn = document.getElementById('next-btn');
    const taskCard = document.getElementById('task-card');
    const weatherContainer = document.getElementById('weather-container');
    const gameArea = document.getElementById('game-area');
    const langBtn = document.getElementById('lang-btn');
    
    const sun = document.getElementById('sun');
    const rainbow = document.getElementById('rainbow');
    const magicTree = document.getElementById('magic-tree');

    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSuccess() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
        osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.1); 
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }

    function playError() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }

    function playFanfare() {
        if (!audioCtx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; 
        notes.forEach((freq, index) => {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            
            const startTime = audioCtx.currentTime + (index * 0.15);
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(0.4, startTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 1.5);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + 1.5);
        });
    }

    function createParticles(x, y) {
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            document.body.appendChild(particle);

            const angle = Math.random() * Math.PI * 2;
            const velocity = 100 + Math.random() * 200;
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;

            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;

            const colors = ['#ffc107', '#ff9800', '#f44336', '#4caf50', '#fff'];
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];

            particle.animate([
                { transform: `translate(0, 0) scale(1)`, opacity: 1 },
                { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
            ], {
                duration: 800 + Math.random() * 400,
                easing: 'cubic-bezier(0, .9, .57, 1)'
            }).onfinish = () => particle.remove();
        }
    }

    function triggerShake() {
        taskCard.classList.add('shake');
        setTimeout(() => taskCard.classList.remove('shake'), 500);
    }

    function loadTask() {
        const task = tasks[currentIndex];
        taskText.innerText = task[currentLang];
        input.value = '';
        input.classList.remove('success', 'error');
        input.disabled = false;
        input.focus();
    }

    function updateLanguage() {
        if (currentLang === 'ua') {
            currentLang = 'ru';
            langBtn.innerText = 'UA';
        } else {
            currentLang = 'ua';
            langBtn.innerText = 'RU';
        }
        
        // Update current task text if not in finale
        if (!isFinale) {
            taskText.innerText = tasks[currentIndex][currentLang];
        }
    }

    function checkAnswer() {
        const task = tasks[currentIndex];
        const userAnswer = input.value.replace(/\D/g, '');
        
        if (userAnswer === '') {
            input.classList.remove('success', 'error');
            return;
        }

        if (userAnswer === task.answer) {
            if (!input.classList.contains('success')) {
                input.classList.remove('error');
                input.classList.add('success');
                input.disabled = true;
                playSuccess();
                
                const rect = input.getBoundingClientRect();
                createParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
            }
        } else {
            if (userAnswer.length >= task.answer.length) {
                if (!input.classList.contains('error')) {
                    input.classList.add('error');
                    playError();
                    triggerShake();
                }
            } else {
                input.classList.remove('error');
            }
        }
    }

    function startFinale() {
        isFinale = true;
        initAudio();
        playFanfare();
        
        // Hide game elements and lang button
        gameArea.style.opacity = '0';
        nextBtn.style.opacity = '0';
        langBtn.style.opacity = '0';
        langBtn.style.pointerEvents = 'none';
        
        setTimeout(() => {
            gameArea.style.display = 'none';
            nextBtn.style.display = 'none';
        }, 500);

        document.querySelectorAll('.rain').forEach(el => el.style.animationPlayState = 'paused');
        document.body.classList.add('finale-bg');

        setTimeout(() => {
            sun.classList.add('active');
            rainbow.classList.add('active');
            magicTree.classList.add('active');
            
            const rect = sun.getBoundingClientRect();
            createParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
        }, 800);
    }

    function resetGame() {
        isFinale = false;
        currentIndex = 0;
        
        // Reset visuals
        document.body.classList.remove('finale-bg');
        sun.classList.remove('active');
        rainbow.classList.remove('active');
        magicTree.classList.remove('active');
        
        gameArea.style.display = 'flex';
        nextBtn.style.display = 'flex';
        langBtn.style.opacity = '0.4';
        langBtn.style.pointerEvents = 'auto';
        
        setTimeout(() => {
            gameArea.style.opacity = '1';
            nextBtn.style.opacity = '1';
        }, 100);

        document.querySelectorAll('.rain').forEach(el => el.style.animationPlayState = 'running');
        loadTask();
    }

    input.addEventListener('input', () => {
        initAudio();
        checkAnswer();
    });

    nextBtn.addEventListener('click', () => {
        if (isFinale) return;
        initAudio();
        
        if (currentIndex === tasks.length - 1 && input.classList.contains('success')) {
            startFinale();
        } else if (input.classList.contains('success')) {
            currentIndex++;
            loadTask();
        }
    });

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && input.classList.contains('success')) {
            nextBtn.click();
        }
    });

    langBtn.addEventListener('click', () => {
        initAudio();
        updateLanguage();
    });

    sun.addEventListener('click', () => {
        if (isFinale) {
            resetGame();
        }
    });

    function createWeather() {
        for (let i = 0; i < 25; i++) {
            const leaf = document.createElement('div');
            leaf.classList.add('leaf');
            leaf.style.left = `${Math.random() * 100}vw`;
            leaf.style.width = `${15 + Math.random() * 20}px`;
            leaf.style.height = leaf.style.width;
            leaf.style.animationDuration = `${6 + Math.random() * 8}s`;
            leaf.style.animationDelay = `${Math.random() * 10}s`;
            const colors = ['#ff9800', '#ff5722', '#ffc107', '#d84315', '#bf360c'];
            leaf.style.background = colors[Math.floor(Math.random() * colors.length)];
            weatherContainer.appendChild(leaf);
        }

        for (let i = 0; i < 60; i++) {
            const drop = document.createElement('div');
            drop.classList.add('rain');
            drop.style.left = `${Math.random() * 100}vw`;
            drop.style.animationDuration = `${0.4 + Math.random() * 0.4}s`;
            drop.style.animationDelay = `${Math.random() * 2}s`;
            drop.style.opacity = 0.1 + Math.random() * 0.3;
            weatherContainer.appendChild(drop);
        }
    }

    createWeather();
    loadTask();

</script>
</body>
</html>
