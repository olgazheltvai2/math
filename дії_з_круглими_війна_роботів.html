<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tactical Drones vs Machine Uprising Tic-Tac-Toe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Rubik:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Rubik', 'Orbitron', sans-serif;
      background: #070e1c;
    }

    /* Tactical Command Frame for the 3x3 Board */
    .tactical-board-frame {
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 55%, #172554 100%);
      border: 5px solid #38bdf8;
      border-radius: 30px;
      box-shadow:
        0 0 28px rgba(56, 189, 248, 0.35),
        inset 0 4px 0 rgba(125, 211, 252, 0.45),
        inset 0 -8px 0 rgba(2, 6, 23, 0.85),
        0 14px 0 #020617,
        0 24px 40px rgba(0, 0, 0, 0.65);
      position: relative;
    }

    /* Inner Cyber-Grid Recessed Tray */
    .tactical-board-tray {
      background:
        radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.22) 0%, rgba(15, 23, 42, 0.94) 100%),
        repeating-linear-gradient(0deg, rgba(56, 189, 248, 0.1) 0px, rgba(56, 189, 248, 0.1) 2px, transparent 2px, transparent 32px),
        repeating-linear-gradient(90deg, rgba(56, 189, 248, 0.1) 0px, rgba(56, 189, 248, 0.1) 2px, transparent 2px, transparent 32px);
      background-color: #09152b;
      border: 4px solid #0284c7;
      border-radius: 22px;
      box-shadow:
        inset 0 8px 20px rgba(2, 6, 23, 0.85),
        0 2px 0 rgba(125, 211, 252, 0.3);
    }

    /* Individual 3x3 Armored Cyber-Cell */
    .math-cell {
      position: relative;
      border-radius: 20px;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #020617;
      box-shadow:
        inset 0 6px 0 rgba(255, 255, 255, 0.4),
        inset 0 -8px 0 rgba(0, 0, 0, 0.4),
        0 8px 0 #020617,
        0 14px 20px rgba(0, 0, 0, 0.45);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.16s ease, box-shadow 0.18s ease;
    }

    .math-cell::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, transparent 45%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 6px, transparent 6px, transparent 12px);
      pointer-events: none;
      z-index: 1;
    }

    .math-cell:hover {
      transform: translateY(-4px) scale(1.025);
      filter: brightness(1.08);
      box-shadow:
        0 0 18px rgba(56, 189, 248, 0.55),
        inset 0 6px 0 rgba(255, 255, 255, 0.55),
        inset 0 -8px 0 rgba(0, 0, 0, 0.4),
        0 12px 0 #020617,
        0 18px 26px rgba(0, 0, 0, 0.5);
    }

    .math-cell:active {
      transform: translateY(4px) scale(0.97);
      box-shadow:
        inset 0 3px 0 rgba(255, 255, 255, 0.3),
        inset 0 -4px 0 rgba(0, 0, 0, 0.4),
        0 3px 0 #020617;
    }

    /* Stylized Tactical HUD Plate for the Math Expression (NO white rectangles!) */
    .formula-plate {
      border-radius: 14px;
      padding: 0.45rem 0.65rem;
      width: 92%;
      min-height: 62%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      z-index: 3;
      border: 3.5px solid #020617;
      box-shadow:
        inset 0 4px 0 rgba(255, 255, 255, 0.45),
        inset 0 -4px 0 rgba(0, 0, 0, 0.32),
        0 5px 0 rgba(2, 6, 23, 0.65);
      transition: transform 0.2s ease, opacity 0.15s ease;
    }

    .formula-text {
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(1.2rem, 2.05vw, 2.35rem);
      letter-spacing: 0.01em;
      line-height: 1.05;
      text-shadow:
        -2.5px -2.5px 0 #020617,
         2.5px -2.5px 0 #020617,
        -2.5px  2.5px 0 #020617,
         2.5px  2.5px 0 #020617,
         0px    4px   0 #020617;
      white-space: nowrap;
    }

    /* CRITICAL RULE: When cell is clicked, the math expression COMPLETELY DISAPPEARS! */
    .math-cell.claimed .formula-plate {
      opacity: 0 !important;
      transform: scale(0) !important;
      pointer-events: none !important;
      display: none !important;
    }

    /* Full-Cell Symbol Reveal Container (X-Drone or O-Core) */
    .symbol-reveal {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
      transform: scale(0) rotate(-25deg);
      opacity: 0;
      transition: transform 0.36s cubic-bezier(0.34, 1.68, 0.64, 1), opacity 0.2s ease;
    }

    .math-cell.claimed .symbol-reveal {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }

    /* Winning Cell Highlight */
    .math-cell.win-cell {
      animation: winCellPulse 0.55s ease-in-out infinite alternate;
      border-color: #fde047 !important;
      box-shadow:
        0 0 32px #facc15,
        inset 0 0 24px rgba(254, 240, 138, 0.75),
        0 9px 0 #713f12 !important;
    }

    @keyframes winCellPulse {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.055) translateY(-5px); }
    }

    /* Board EMP Shake on Draw */
    .board-wiggle {
      animation: empShake 0.65s ease-in-out;
    }
    @keyframes empShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-8px, -4px) rotate(-2deg); }
      30% { transform: translate(8px, 4px) rotate(2deg); }
      45% { transform: translate(-6px, 4px) rotate(-1.5deg); }
      60% { transform: translate(6px, -4px) rotate(1.5deg); }
      75% { transform: translate(-4px, 2px) rotate(-1deg); }
    }

    /* Tactical Icon Buttons */
    .tactical-btn {
      position: relative;
      border-radius: 18px;
      border: 3.5px solid #020617;
      box-shadow:
        inset 0 4px 0 rgba(255, 255, 255, 0.5),
        inset 0 -5px 0 rgba(0, 0, 0, 0.35),
        0 6px 0 #020617,
        0 10px 18px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease;
      cursor: pointer;
    }
    .tactical-btn:hover {
      transform: translateY(-3px) scale(1.06);
      filter: brightness(1.1);
    }
    .tactical-btn:active {
      transform: translateY(4px) scale(0.95);
    }

    .svg-interactive {
      cursor: pointer;
    }
    .svg-interactive:hover {
      filter: brightness(1.12);
    }
  </style>
</head>
<body class="select-none">

    /*************************************************************************
     * 1. INFINITE GENERATOR: MULTIPLICATION & DIVISION OF ROUND NUMBERS
     *    Covers all 8 pedagogical types with varying zero counts!
     *************************************************************************/
    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateRoundNumberExpression(typeIndex) {
      const t = typeIndex % 8;

      if (t === 0) {
        // Type 1: Tens × Single digit (30 · 4 =, 70 · 6 =, 80 · 9 =)
        const tens = pickRandom([20, 30, 40, 50, 60, 70, 80, 90]);
        const d = pickRandom([2, 3, 4, 5, 6, 7, 8, 9]);
        return Math.random() < 0.5 ? `${tens} · ${d} =` : `${d} · ${tens} =`;
      }

      if (t === 1) {
        // Type 2: Hundreds × Single digit (400 · 5 =, 600 · 3 =, 900 · 7 =)
        const hundreds = pickRandom([200, 300, 400, 500, 600, 700, 800, 900]);
        const d = pickRandom([2, 3, 4, 5, 6, 7, 8, 9]);
        return Math.random() < 0.5 ? `${hundreds} · ${d} =` : `${d} · ${hundreds} =`;
      }

      if (t === 2) {
        // Type 3: Thousands × Single digit (2000 · 4 =, 3000 · 3 =, 5000 · 2 =)
        const pairs = [
          [2000, 2], [2000, 3], [2000, 4], [3000, 2], [3000, 3],
          [4000, 2], [5000, 2], [1000, 6], [1000, 8], [1000, 9]
        ];
        const [th, d] = pickRandom(pairs);
        return Math.random() < 0.5 ? `${th} · ${d} =` : `${d} · ${th} =`;
      }

      if (t === 3) {
        // Type 4: Tens × Tens (20 · 30 =, 40 · 50 =, 60 · 70 =, 80 · 40 =)
        const a = pickRandom([20, 30, 40, 50, 60, 70, 80, 90]);
        const b = pickRandom([20, 30, 40, 50, 60, 70, 80, 90]);
        return `${a} · ${b} =`;
      }

      if (t === 4) {
        // Type 5: Hundreds × Tens (200 · 30 =, 400 · 20 =, 300 · 30 =)
        const h = pickRandom([200, 300, 400, 500]);
        const ten = pickRandom([20, 30]);
        return Math.random() < 0.5 ? `${h} · ${ten} =` : `${ten} · ${h} =`;
      }

      if (t === 5) {
        // Type 6: Dividing round tens/hundreds/thousands by single digit (120 : 4 =, 350 : 7 =, 2400 : 6 =, 4500 : 9 =, 8000 : 4 =)
        const divisor = pickRandom([2, 3, 4, 5, 6, 7, 8, 9]);
        const qBase = pickRandom([2, 3, 4, 5, 6, 7, 8, 9]);
        const zeroFactor = pickRandom([10, 100, 1000]);
        const dividend = divisor * qBase * zeroFactor;
        return `${dividend} : ${divisor} =`;
      }

      if (t === 6) {
        // Type 7: Dividing round numbers by round tens (80 : 20 =, 180 : 30 =, 420 : 70 =, 1600 : 40 =, 3600 : 90 =, 5400 : 60 =)
        const divBase = pickRandom([2, 3, 4, 5, 6, 7, 8, 9]);
        const qBase = pickRandom([2, 3, 4, 5, 6, 7, 8, 9]);
        const extraZero = pickRandom([1, 10]);
        const divisor = divBase * 10;
        const dividend = divBase * qBase * 10 * extraZero;
        return `${dividend} : ${divisor} =`;
      }

      // Type 8: Dividing round hundreds/thousands by round hundreds (600 : 200 =, 2700 : 900 =, 4800 : 600 =, 8000 : 400 =)
      const divBase = pickRandom([2, 3, 4, 5, 6, 7, 8, 9]);
      const qBase = pickRandom([2, 3, 4, 5, 6, 7, 8, 9]);
      const divisor = divBase * 100;
      const dividend = divBase * qBase * 100;
      return `${dividend} : ${divisor} =`;
    }

    function getNineUniqueExpressions() {
      const chosen = new Set();
      const typeOrder = [0, 1, 2, 3, 4, 5, 6, 7, Math.floor(Math.random() * 8)].sort(() => Math.random() - 0.5);
      let idx = 0;

      while (chosen.size < 9) {
        const expr = generateRoundNumberExpression(typeOrder[idx % typeOrder.length]);
        if (!chosen.has(expr)) {
          chosen.add(expr);
          idx++;
        }
      }
      return Array.from(chosen);
    }

    /*************************************************************************
     * 4. WEB AUDIO API TACTICAL SOUND SYNTHESIZER (7 Combat SFX + Fanfare)
     *************************************************************************/
    class TacticalAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      tone(freq, type, duration, delay = 0, vol = 0.2, slideTo = null) {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + duration);
        }
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      // 1. Twin Plasma Railgun Salvo
      playRailgun() {
        for (let i = 0; i < 4; i++) {
          this.tone(980, 'sawtooth', 0.14, i * 0.11, 0.18, 180);
          this.tone(1400, 'square', 0.09, i * 0.11, 0.12, 320);
        }
      }

      // 2. Swarm Micro-Missiles
      playMissiles() {
        for (let i = 0; i < 6; i++) {
          this.tone(280 + i * 60, 'triangle', 0.18, i * 0.07, 0.15, 760 + i * 80);
        }
        // Impact booms
        this.tone(150, 'sawtooth', 0.35, 0.45, 0.26, 35);
        this.tone(120, 'square', 0.38, 0.6, 0.24, 30);
      }

      // 3. EMP Super-Nova Shockwave
      playEMP() {
        this.tone(180, 'sine', 0.28, 0, 0.22, 960);
        this.tone(680, 'sawtooth', 0.55, 0.26, 0.26, 42);
        this.tone(520, 'square', 0.45, 0.3, 0.18, 65);
      }

      // 4. Orbital Ion Cannon Strike
      playOrbitalStrike() {
        // Lock-on beeps
        [880, 1174, 1567].forEach((f, i) => this.tone(f, 'sine', 0.08, i * 0.08, 0.16));
        // Massive sky laser beam
        this.tone(820, 'sawtooth', 0.6, 0.26, 0.26, 95);
        this.tone(410, 'square', 0.6, 0.26, 0.2, 55);
      }

      // 5. Laser Dodge & Deflector Shield
      playShieldReflect() {
        this.tone(640, 'sawtooth', 0.2, 0, 0.18, 220); // Enemy laser
        this.tone(440, 'sine', 0.25, 0.2, 0.24, 1320); // Shield ping deflection!
        this.tone(920, 'square', 0.28, 0.35, 0.2, 160); // Reflected hit
      }

      // 6. FPV Interceptor Swarm
      playSwarmBuzz() {
        [392, 523.25, 659.25, 783.99, 659.25, 1046.5].forEach((f, i) => {
          this.tone(f, 'sawtooth', 0.11, i * 0.085, 0.14, f * 1.15);
        });
      }

      // 7. Cyber-Hack Override Matrix Beam
      playCyberHack() {
        const notes = [587.33, 880, 659.25, 987.77, 783.99, 1174.66, 1046.5];
        notes.forEach((f, i) => {
          this.tone(f, 'square', 0.09, i * 0.075, 0.14);
          this.tone(f * 0.5, 'triangle', 0.09, i * 0.075, 0.12);
        });
      }

      playClick() {
        this.tone(720, 'triangle', 0.07, 0, 0.18, 1080);
      }

      playWinFanfare() {
        const notes = [
          { f: 523.25, t: 0, d: 0.13 },
          { f: 659.25, t: 0.13, d: 0.13 },
          { f: 783.99, t: 0.26, d: 0.13 },
          { f: 1046.5, t: 0.39, d: 0.28 },
          { f: 783.99, t: 0.7, d: 0.13 },
          { f: 1046.5, t: 0.85, d: 0.48 }
        ];
        notes.forEach(n => {
          this.tone(n.f, 'sawtooth', n.d, n.t, 0.16);
          this.tone(n.f * 0.5, 'triangle', n.d, n.t, 0.18);
        });
      }

      playDraw() {
        this.tone(440, 'sawtooth', 0.16, 0, 0.18, 310);
        this.tone(310, 'sawtooth', 0.18, 0.17, 0.18, 190);
        this.tone(240, 'triangle', 0.35, 0.35, 0.22, 480);
      }
    }

    /*************************************************************************
     * 5. FULL-SCREEN PARTICLE & SPARK FX CANVAS
     *************************************************************************/
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    let particles = [];
    let fireworksInterval = null;

    function resizeFxCanvas() {
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeFxCanvas);
    resizeFxCanvas();

    function spawnParticles(x, y, count = 26, mode = 'drone') {
      const palette = mode === 'core'
        ? ['#ef4444', '#f97316', '#facc15', '#fb7185', '#fef08a']
        : ['#22d3ee', '#38bdf8', '#facc15', '#4ade80', '#a855f7'];

      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
        const speed = 4 + Math.random() * 11;
        const shapes = ['hex', 'spark', 'ring', 'star'];
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3,
          gravity: 0.3,
          size: 9 + Math.random() * 12,
          color: palette[Math.floor(Math.random() * palette.length)],
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.24,
          alpha: 1,
          decay: 0.016 + Math.random() * 0.012,
          shape: shapes[Math.floor(Math.random() * shapes.length)]
        });
      }
    }

    function updateFxParticles() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rot += p.vRot;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        fxCtx.save();
        fxCtx.globalAlpha = Math.max(0, p.alpha);
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.rot);
        fxCtx.fillStyle = p.color;
        fxCtx.strokeStyle = '#020617';
        fxCtx.lineWidth = 2.5;

        if (p.shape === 'hex') {
          fxCtx.beginPath();
          for (let k = 0; k < 6; k++) {
            const a = (Math.PI / 3) * k;
            if (k === 0) fxCtx.moveTo(Math.cos(a) * p.size * 0.65, Math.sin(a) * p.size * 0.65);
            else fxCtx.lineTo(Math.cos(a) * p.size * 0.65, Math.sin(a) * p.size * 0.65);
          }
          fxCtx.closePath();
          fxCtx.fill();
          fxCtx.stroke();
        } else if (p.shape === 'ring') {
          fxCtx.beginPath();
          fxCtx.arc(0, 0, p.size * 0.55, 0, Math.PI * 2);
          fxCtx.strokeStyle = p.color;
          fxCtx.lineWidth = 4;
          fxCtx.stroke();
        } else if (p.shape === 'spark') {
          fxCtx.fillRect(-p.size * 0.8, -p.size * 0.22, p.size * 1.6, p.size * 0.44);
          fxCtx.strokeRect(-p.size * 0.8, -p.size * 0.22, p.size * 1.6, p.size * 0.44);
        } else {
          fxCtx.beginPath();
          for (let k = 0; k < 4; k++) {
            const a = (Math.PI / 2) * k;
            fxCtx.lineTo(Math.cos(a) * p.size * 0.75, Math.sin(a) * p.size * 0.75);
            fxCtx.lineTo(Math.cos(a + Math.PI / 4) * p.size * 0.28, Math.sin(a + Math.PI / 4) * p.size * 0.28);
          }
          fxCtx.closePath();
          fxCtx.fill();
          fxCtx.stroke();
        }
        fxCtx.restore();
      }
    }

    /*************************************************************************
     * 6. ANCHORED SVG BATTLEFIELD ENGINE (ZERO CSS style.transform on SVG!)
     *    - Drone Home Anchor: DRONE_HOME_X = 165, DRONE_HOME_Y = 420
     *      Strictly clamped within X: [110, 310], Y: [280, 500]
     *    - Mecha-Titan Home Anchor: MECH_HOME_X = 455, MECH_HOME_Y = 540

    const DRONE_HOME_X = 165;
    const DRONE_HOME_Y = 420;

    const MECH_HOME_Y = 540;

    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    const droneGroup = document.getElementById('droneGroup');

      { name: 'Spec-Ops Olive', body: '#3f6212', trim: '#84cc16', visor: '#fde047', rotor: '#bef264' },

    let combatState = {
      mode: 'idle',
      startTime: performance.now(),
      duration: 0,
      lastAttack: -1
    };

    function triggerCombatAction(forcedIndex = null) {
      let idx = forcedIndex;
      if (idx === null) {
        do {
          idx = Math.floor(Math.random() * 7);
        } while (idx === combatState.lastAttack);
      }
      combatState.lastAttack = idx;
      combatState.startTime = performance.now();

      switch (idx) {
        case 0:
          // 1. Twin Plasma Railgun Barrage
          combatState.mode = 'railgun';
          combatState.duration = 1350;
          sound.playRailgun();
          break;
        case 1:
          // 2. Homing Micro-Missile Swarm
          combatState.mode = 'missiles';
          combatState.duration = 1500;
          sound.playMissiles();
          break;
        case 2:
          // 3. EMP Overload Shockwave
          combatState.mode = 'emp';
          combatState.duration = 1450;
          sound.playEMP();
          break;
        case 3:
          // 4. Orbital Ion Cannon Strike
          combatState.mode = 'orbital';
          combatState.duration = 1500;
          sound.playOrbitalStrike();

        case 6:
          // 7. Cyber-Hack Override Beam
          combatState.mode = 'cyberHack';
          combatState.duration = 1550;

    function updateBattlefieldSVG(now) {
      // 1. Animate Background Radar & Distant Sky Patrol Drones strictly via setAttribute('transform')
      const radarAngle = (now * 0.04) % 360;
      radarSweepGroup.setAttribute('transform', `rotate(${radarAngle.toFixed(1)})`);

      const bg1X = 80 + ((now * 0.03) % 440);
      const bg1Y = 140 + Math.sin(now * 0.003) * 12;
      bgPatrolDrone1.setAttribute('transform', `translate(${bg1X.toFixed(1)}, ${bg1Y.toFixed(1)}) scale(0.58)`);

      const bg2X = 520 - ((now * 0.025) % 440);
      const bg2Y = 195 + Math.cos(now * 0.0035) * 10;
      bgPatrolDrone2.setAttribute('transform', `translate(${bg2X.toFixed(1)}, ${bg2Y.toFixed(1)}) scale(0.45)`);

      // 2. Animate Drone Rotor Blade Widths for High-Speed Spin Effect
      ['droneRotor1', 'droneRotor2', 'droneRotor3', 'droneRotor4'].forEach((id, idx) => {
        const baseRx = idx < 2 ? 28 : 25;
        const rx = baseRx * (0.65 + 0.35 * Math.abs(Math.sin(now * 0.065 + idx * 1.3)));
        document.getElementById(id).setAttribute('rx', rx.toFixed(1));
      });

      // 3. Calculate Base Hovering Coordinates around Home Anchors
      let droneX = DRONE_HOME_X + Math.sin(now * 0.0035) * 10;
      let droneY = DRONE_HOME_Y + Math.sin(now * 0.005) * 12;
      let droneRot = Math.sin(now * 0.0035) * 3.5;

      let mechX = MECH_HOME_X;
      let mechY = MECH_HOME_Y + Math.sin(now * 0.004) * 3;
      let mechRot = 0;
      let torsoY = 0;
      let torsoRot = 0;
      let leftArmRot = Math.sin(now * 0.004) * 5;
      let rightArmRot = -Math.sin(now * 0.004) * 5;
      let eyeX = -6 + Math.sin(now * 0.003) * 7;
      let eyeY = -13;
      let eyeColor = '#ef4444';
      let chassisColor = '#1e293b';
      let weaponRecoilX = 0;
      let podLiftY = 0;

      const elapsed = now - combatState.startTime;
      if (combatState.mode !== 'idle' && elapsed >= combatState.duration) {
        combatState.mode = 'idle';
        combatFxLayer.innerHTML = '';
      }

      const p = combatState.duration > 0 ? clamp(elapsed / combatState.duration, 0, 1) : 0;
      let fxMarkup = '';

      // 4. Execute Active Combat Mode within Strict Clamped Coordinate Bounds
      if (combatState.mode === 'railgun') {
        // 1. Twin Plasma Railgun Barrage
        droneX = DRONE_HOME_X + 18;
        droneY = DRONE_HOME_Y - 8 + Math.sin(p * Math.PI * 6) * 5;
        droneRot = 9;
        weaponRecoilX = -Math.abs(Math.sin(p * Math.PI * 8)) * 8;

        if (p > 0.15) {
          mechX = MECH_HOME_X + Math.sin(p * Math.PI * 10) * 18;
          torsoRot = Math.sin(p * Math.PI * 8) * 5;
          chassisColor = p % 0.2 < 0.1 ? '#7f1d1d' : '#1e293b';
        }

        // Twin Plasma Bolts traveling from Drone (X~225, Y~430) to Robot Chest (X~455, Y~525)
        for (let b = 0; b < 4; b++) {
          const bp = p * 2.8 - b * 0.42;
          if (bp > 0 && bp < 1) {
            const bx = lerp(droneX + 55, mechX - 25, bp);
            const by = lerp(droneY + 14, mechY - 15, bp);
            fxMarkup += `
              <g>
                <line x1="${(bx - 36).toFixed(1)}" y1="${(by - 12).toFixed(1)}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}" stroke="#22d3ee" stroke-width="14" stroke-linecap="round" opacity="0.65"/>
                <line x1="${(bx - 32).toFixed(1)}" y1="${(by - 10).toFixed(1)}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
                <line x1="${(bx - 36).toFixed(1)}" y1="${(by + 6).toFixed(1)}" x2="${bx.toFixed(1)}" y2="${(by + 16).toFixed(1)}" stroke="#facc15" stroke-width="10" stroke-linecap="round"/>
              </g>
            `;
          }
        }
        // Impact Sparks & Warning Flares on Robot
        if (p > 0.25 && p < 0.92) {
          const sparkR = 18 + Math.sin(p * 35) * 10;
          fxMarkup += `
            <circle cx="${(mechX - 15).toFixed(1)}" cy="${(mechY - 5).toFixed(1)}" r="${sparkR.toFixed(1)}" fill="rgba(250, 204, 21, 0.45)" stroke="#22d3ee" stroke-width="4"/>
            <circle cx="${(mechX - 10).toFixed(1)}" cy="${(mechY - 35 - (p * 50) % 40).toFixed(1)}" r="7" fill="#ef4444" stroke="#fef08a" stroke-width="2"/>
            <circle cx="${(mechX + 22).toFixed(1)}" cy="${(mechY - 40 - (p * 65) % 45).toFixed(1)}" r="6" fill="#f97316" stroke="#fef08a" stroke-width="2"/>
          `;
        }
      } else if (combatState.mode === 'missiles') {
        // 2. Homing Micro-Missile Swarm
        droneX = DRONE_HOME_X + 10;
        droneY = DRONE_HOME_Y - Math.sin(p * Math.PI) * 28;
        droneRot = -5;
        podLiftY = -8;

        for (let m = 0; m < 4; m++) {
          const mp = clamp((p - m * 0.08) / 0.68, 0, 1);
          if (mp > 0 && mp < 1) {
            const sx = droneX;
            const sy = droneY - 34;
            const cx = 310 + (m % 2 === 0 ? -30 : 30);
            const cy = m % 2 === 0 ? 250 - m * 15 : 590 - m * 15;
            const ex = mechX - 10;
            const ey = mechY - 25 + (m - 1.5) * 18;

            const mx = (1 - mp) * (1 - mp) * sx + 2 * (1 - mp) * mp * cx + mp * mp * ex;
            const my = (1 - mp) * (1 - mp) * sy + 2 * (1 - mp) * mp * cy + mp * mp * ey;

            fxMarkup += `
              <path d="M ${sx.toFixed(1)} ${sy.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}" fill="none" stroke="rgba(226, 232, 240, 0.5)" stroke-width="5" stroke-dasharray="8 6"/>

          } else if (mp >= 1 && p < 0.96) {

          rightArmRot = -Math.sin(p * 40) * 22;

      } else if (combatState.mode === 'emp') {
        // 3. EMP Overload Shockwave (Drone dashes to X=260, emits electric rings & arcs onto Robot)
        const dashFactor = Math.sin(p * Math.PI);
        droneX = lerp(DRONE_HOME_X, 260, dashFactor);
        droneY = DRONE_HOME_Y - dashFactor * 24;

        fxMarkup += `

          mechY = MECH_HOME_Y + (Math.random() - 0.5) * 10;
          leftArmRot = (Math.random() - 0.5) * 45;
          rightArmRot = (Math.random() - 0.5) * 45;
          eyeColor = Math.random() < 0.5 ? '#22d3ee' : '#ef4444';
          chassisColor = Math.random() < 0.4 ? '#1e3a8a' : '#1e293b';

          // Electric Lightning Arcs wrapping around the Robot
          fxMarkup += `
            <polyline points="${mechX - 55},${mechY - 50} ${mechX - 15},${mechY - 20} ${mechX + 35},${mechY - 45} ${mechX + 55},${mechY + 10}" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="${mechX - 45},${mechY + 25} ${mechX},${mechY - 5} ${mechX + 48},${mechY + 35}" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          `;
        }
      } else if (combatState.mode === 'orbital') {
        // 4. Orbital Ion Cannon Strike (Vertical beam at X=455 onto Robot)
        droneY = DRONE_HOME_Y - 15;
        droneRot = -4;

        // Targeting Lock Laser from Drone to Robot
        fxMarkup += `
          <line x1="${(droneX + 44).toFixed(1)}" y1="${(droneY - 4).toFixed(1)}" x2="${mechX.toFixed(1)}" y2="${(mechY - 15).toFixed(1)}" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="10 8"/>
          <circle cx="${mechX.toFixed(1)}" cy="${(mechY - 15).toFixed(1)}" r="38" fill="none" stroke="#fde047" stroke-width="3.5" stroke-dasharray="12 8"/>
        `;

        if (p > 0.22) {
          const beamOpacity = p < 0.85 ? 1 : (1 - p) / 0.15;
          const beamW = 78 + Math.sin(now * 0.08) * 18;
          const bx = mechX - beamW / 2;

          mechX = MECH_HOME_X + Math.sin(p * 45) * 12;
          torsoY = Math.abs(Math.sin(p * 30)) * 10;
          chassisColor = '#7f1d1d';

          fxMarkup += `
            <g opacity="${beamOpacity.toFixed(2)}">
              <rect x="${bx.toFixed(1)}" y="150" width="${beamW.toFixed(1)}" height="555" fill="url(#orbitalBeamGrad)"/>
              <ellipse cx="${mechX.toFixed(1)}" cy="695" rx="${(beamW * 0.95).toFixed(1)}" ry="22" fill="#ffffff" stroke="#22d3ee" stroke-width="5"/>
              <circle cx="${mechX.toFixed(1)}" cy="${(mechY - 10).toFixed(1)}" r="${(beamW * 0.65).toFixed(1)}" fill="rgba(254, 240, 138, 0.45)" stroke="#ffffff" stroke-width="4"/>
            </g>
          `;
        }
      } else if (combatState.mode === 'shieldReflect') {
        // 5. Counter-Laser Deflection (Robot shoots crimson beam -> Drone hexagonal shield blocks & reflects!)
        droneX = DRONE_HOME_X + 15;
        droneY = DRONE_HOME_Y - Math.sin(p * Math.PI) * 20;
        const shieldX = droneX + 76;
        const shieldY = droneY + 4;

        // Hexagonal Energy Shield in front of Drone
        fxMarkup += `
          <g transform="translate(${shieldX.toFixed(1)}, ${shieldY.toFixed(1)})">
            <polygon points="0,-54 26,-28 26,28 0,54 -26,28 -26,-28" fill="rgba(34, 211, 238, 0.35)" stroke="#67e8f9" stroke-width="5"/>
            <polygon points="0,-36 16,-18 16,18 0,36 -16,18 -16,-18" fill="rgba(254, 240, 138, 0.25)" stroke="#ffffff" stroke-width="2.5"/>
          </g>
        `;

        // Phase A (p < 0.65): Robot fires heavy crimson laser into Drone's Hex Shield
        if (p < 0.65) {
          fxMarkup += `
            <line x1="${(mechX - 12).toFixed(1)}" y1="${(mechY - 13).toFixed(1)}" x2="${shieldX.toFixed(1)}" y2="${shieldY.toFixed(1)}" stroke="#ef4444" stroke-width="16" stroke-linecap="round"/>
            <line x1="${(mechX - 12).toFixed(1)}" y1="${(mechY - 13).toFixed(1)}" x2="${shieldX.toFixed(1)}" y2="${shieldY.toFixed(1)}" stroke="#fef08a" stroke-width="6" stroke-linecap="round"/>
            <circle cx="${shieldX.toFixed(1)}" cy="${shieldY.toFixed(1)}" r="22" fill="#fef08a" stroke="#22d3ee" stroke-width="4"/>
          `;
        }

        // Phase B (p > 0.35): Reflected Cyan/Gold Concentrated Pulse slams back into Robot!
        if (p > 0.35) {
          const rp = clamp((p - 0.35) / 0.55, 0, 1);
          const rx = lerp(shieldX, mechX - 10, rp);
          const ry = lerp(shieldY, mechY - 5, rp);
          fxMarkup += `
            <line x1="${shieldX.toFixed(1)}" y1="${shieldY.toFixed(1)}" x2="${rx.toFixed(1)}" y2="${ry.toFixed(1)}" stroke="#22d3ee" stroke-width="14" stroke-linecap="round"/>
            <line x1="${shieldX.toFixed(1)}" y1="${shieldY.toFixed(1)}" x2="${rx.toFixed(1)}" y2="${ry.toFixed(1)}" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
            <circle cx="${rx.toFixed(1)}" cy="${ry.toFixed(1)}" r="16" fill="#fde047" stroke="#0284c7" stroke-width="4"/>
          `;
          if (rp > 0.7) {
            mechX = MECH_HOME_X + 20 * Math.sin(p * 30);
            torsoRot = 7;
            chassisColor = '#7f1d1d';
          }
        }
      } else if (combatState.mode === 'swarm') {
        // 6. FPV Mini-Drone Swarm (3 agile mini FPV drones zip in figure-8 loops around Robot X:400..500, Y:360..480)
        droneY = DRONE_HOME_Y - 12;
        mechX = MECH_HOME_X + Math.sin(p * 30) * 10;
        leftArmRot = Math.sin(p * 25) * 30;
        rightArmRot = -Math.sin(p * 25) * 30;

        for (let d = 0; d < 3; d++) {
          const phase = p * Math.PI * 4 + (d * Math.PI * 2) / 3;
          // Figure-eight loop strictly around X=450 (400..500), Y=420 (360..480)
          const targetX = 450 + Math.sin(phase) * 48;
          const targetY = 420 + Math.sin(phase * 2) * 48;

          const blend = Math.sin(p * Math.PI);
          const sx = clamp(lerp(droneX + 30, targetX, blend), 150, 515);
          const sy = clamp(lerp(droneY - 10, targetY, blend), 340, 495);

          // Micro-laser zaps onto Robot shoulders
          if (p > 0.18 && p < 0.88) {
            fxMarkup += `
              <line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${(mechX + (d - 1) * 35).toFixed(1)}" y2="${(mechY - 55).toFixed(1)}" stroke="#22d3ee" stroke-width="3.5"/>
              <circle cx="${(mechX + (d - 1) * 35).toFixed(1)}" cy="${(mechY - 55).toFixed(1)}" r="9" fill="#fde047"/>
            `;
          }

          // Mini FPV Drone SVG
          fxMarkup += `
            <g transform="translate(${sx.toFixed(1)}, ${sy.toFixed(1)})">
              <line x1="-16" y1="-8" x2="16" y2="-8" stroke="#020617" stroke-width="4" stroke-linecap="round"/>
              <ellipse cx="-16" cy="-10" rx="10" ry="3" fill="#67e8f9"/>
              <ellipse cx="16" cy="-10" rx="10" ry="3" fill="#67e8f9"/>
              <circle cx="0" cy="0" r="10" fill="#facc15" stroke="#020617" stroke-width="3"/>
              <circle cx="3" cy="0" r="4" fill="#0284c7"/>
            </g>
          `;
        }
      } else if (combatState.mode === 'cyberHack') {
        // 7. Cyber-Hack Override Beam (Green/Cyan holographic matrix cone; Robot eyes turn cyan & dances!)
        droneX = DRONE_HOME_X + 20;
        droneY = DRONE_HOME_Y - 10;
        droneRot = 5;

        // Holographic Matrix Scan Cone from Drone Visor to Robot
        const scanY = mechY - 70 + ((p * 260) % 140);
        fxMarkup += `
          <polygon points="${(droneX + 42).toFixed(1)},${(droneY - 2).toFixed(1)} ${(mechX - 65).toFixed(1)},${(mechY - 85).toFixed(1)} ${(mechX + 65).toFixed(1)},${(mechY + 65).toFixed(1)}" fill="url(#hackConeGrad)" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="10 6"/>
          <line x1="${(mechX - 70).toFixed(1)}" y1="${scanY.toFixed(1)}" x2="${(mechX + 70).toFixed(1)}" y2="${scanY.toFixed(1)}" stroke="#4ade80" stroke-width="5"/>
          <circle cx="${mechX.toFixed(1)}" cy="${(mechY - 95).toFixed(1)}" r="18" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="8 6"/>
        `;

        // Robot Eyes turn Cyan and it performs a hilarious robotic dance/boogie in place!
        eyeColor = '#22d3ee';
        eyeX = -6 + Math.sin(p * Math.PI * 10) * 14;
        torsoY = -Math.abs(Math.sin(p * Math.PI * 8)) * 16;
        torsoRot = Math.sin(p * Math.PI * 8) * 10;
        leftArmRot = -55 + Math.sin(p * Math.PI * 8) * 35;
        rightArmRot = 55 + Math.cos(p * Math.PI * 8) * 35;
        chassisColor = '#065f46';
      }

      // 5. STRICT CLAMPING OF DRONE & MECHA-TITAN COORDINATES BEFORE APPLYING SVG ATTRIBUTES
      const finalDroneX = clamp(droneX, 110, 310);
      const finalDroneY = clamp(droneY, 280, 500);
      const finalMechX = clamp(mechX, 410, 505);
      const finalMechY = clamp(mechY, 500, 560);

      droneGroup.setAttribute('transform', `translate(${finalDroneX.toFixed(1)}, ${finalDroneY.toFixed(1)}) rotate(${droneRot.toFixed(1)})`);
      droneWeaponGroup.setAttribute('transform', `translate(${weaponRecoilX.toFixed(1)}, 0)`);
      droneMissilePod.setAttribute('transform', `translate(-8, ${(-28 + podLiftY).toFixed(1)})`);

      mechGroup.setAttribute('transform', `translate(${finalMechX.toFixed(1)}, ${finalMechY.toFixed(1)}) rotate(${mechRot.toFixed(1)})`);
      mechTorsoGroup.setAttribute('transform', `translate(0, ${torsoY.toFixed(1)}) rotate(${torsoRot.toFixed(1)})`);
      mechLeftArm.setAttribute('transform', `translate(-68, -10) rotate(${leftArmRot.toFixed(1)})`);
      mechRightArm.setAttribute('transform', `translate(68, -10) rotate(${rightArmRot.toFixed(1)})`);
      mechEyeGroup.setAttribute('transform', `translate(${eyeX.toFixed(1)}, ${eyeY.toFixed(1)})`);
      mechEyeOuter.setAttribute('fill', eyeColor);
      mechChestCore.setAttribute('fill', eyeColor);
      mechChassisRect.setAttribute('fill', chassisColor);

      if (combatState.mode !== 'idle') {
        combatFxLayer.innerHTML = fxMarkup;
      }
    }

    // Clicking the Drone, the Mecha-Titan, or the Left Arena Zone triggers a combat interaction!
    droneGroup.addEventListener('click', () => triggerCombatAction());
    mechGroup.addEventListener('click', () => triggerCombatAction());
    document.getElementById('arena-click-zone').addEventListener('click', () => triggerCombatAction());

    // Clicking the Drone Camo/Skin Switcher button cycles through the 5 tactical skins and fires an attack!
    document.getElementById('skin-btn').addEventListener('click', () => {
      sound.playClick();
      currentSkinIndex = (currentSkinIndex + 1) % DRONE_SKINS.length;
      applyDroneSkin(currentSkinIndex);
      const rect = document.getElementById('skin-btn').getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 22, 'drone');
      triggerCombatAction();
    });

    /*************************************************************************
     * 7. TIC-TAC-TOE GAME LOGIC (Immediate Disappearance of Clicked Formula!)
     *************************************************************************/
    const gridEl = document.getElementById('grid-3x3');
    const boardContainer = document.getElementById('board-container');
    const turnIndicator = document.getElementById('turn-indicator');
    const turnSymbolX = document.getElementById('turn-symbol-x');
    const turnSymbolO = document.getElementById('turn-symbol-o');
    const undoBtn = document.getElementById('undo-btn');
    const nextBtn = document.getElementById('next-btn');
    const soundBtn = document.getElementById('sound-btn');

    const winLaserBorder = document.getElementById('win-laser-border');
    const winLaserOuter = document.getElementById('win-laser-outer');
    const winLaserInner = document.getElementById('win-laser-inner');

    let boardState = Array(9).fill(null);
    let currentTurn = 'X';
    let moveHistory = [];
    let gameWon = false;

    const WIN_LINES = [
      { indices: [0, 1, 2], coords: [80, 150, 820, 150] },
      { indices: [3, 4, 5], coords: [80, 450, 820, 450] },
      { indices: [6, 7, 8], coords: [80, 750, 820, 750] },
      { indices: [0, 3, 6], coords: [150, 80, 150, 820] },
      { indices: [1, 4, 7], coords: [450, 80, 450, 820] },
      { indices: [2, 5, 8], coords: [750, 80, 750, 820] },
      { indices: [0, 4, 8], coords: [85, 85, 815, 815] },
      { indices: [2, 4, 6], coords: [815, 85, 85, 815] }
    ];

    function updateTurnUI() {
      if (currentTurn === 'X') {
        turnSymbolX.className = "w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-cyan-500 border-3 border-slate-950 flex items-center justify-center shadow-[0_0_18px_#22d3ee] transition-all duration-200 scale-110";
        turnSymbolO.className = "w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-rose-950/70 border-3 border-slate-950/50 flex items-center justify-center transition-all duration-200 opacity-50 scale-90";
      } else {
        turnSymbolO.className = "w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-rose-600 border-3 border-slate-950 flex items-center justify-center shadow-[0_0_18px_#f43f5e] transition-all duration-200 scale-110";
        turnSymbolX.className = "w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-cyan-950/70 border-3 border-slate-950/50 flex items-center justify-center transition-all duration-200 opacity-50 scale-90";
      }

      if (moveHistory.length > 0) {
        undoBtn.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        undoBtn.classList.add('opacity-0', 'pointer-events-none');
      }
    }

    // Click Turn Switcher to manually toggle X-Drone or O-Core anytime
    turnIndicator.addEventListener('click', () => {
      sound.playClick();
      currentTurn = currentTurn === 'X' ? 'O' : 'X';
      updateTurnUI();
      const rect = turnIndicator.getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 14, currentTurn === 'X' ? 'drone' : 'core');
    });

    function clearWinEffects() {
      if (fireworksInterval) {
        clearInterval(fireworksInterval);
        fireworksInterval = null;
      }
      [winLaserBorder, winLaserOuter, winLaserInner].forEach(el => el.setAttribute('opacity', '0'));
      document.querySelectorAll('.math-cell').forEach(c => c.classList.remove('win-cell'));
    }

    function checkWinOrDraw() {
      for (const line of WIN_LINES) {
        const [a, b, c] = line.indices;
        if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
          triggerWinCelebration(line);
          return true;
        }
      }
      if (boardState.every(cell => cell !== null)) {
        triggerDrawEffect();
        return true;
      }
      return false;
    }

    function triggerWinCelebration(winLine) {
      gameWon = true;
      sound.playWinFanfare();

      const cells = document.querySelectorAll('.math-cell');
      winLine.indices.forEach(idx => cells[idx].classList.add('win-cell'));

      const [x1, y1, x2, y2] = winLine.coords;
      const isX = boardState[winLine.indices[0]] === 'X';
      winLaserOuter.setAttribute('stroke', isX ? '#22d3ee' : '#ef4444');

      [winLaserBorder, winLaserOuter, winLaserInner].forEach(el => {
        el.setAttribute('x1', x1);
        el.setAttribute('y1', y1);
        el.setAttribute('x2', x2);
        el.setAttribute('y2', y2);
        el.setAttribute('opacity', '1');
      });

      triggerCombatAction(3); // Orbital Ion Beam Finale!

      fireworksInterval = setInterval(() => {
        const rx = window.innerWidth * (0.18 + Math.random() * 0.72);
        const ry = window.innerHeight * (0.15 + Math.random() * 0.65);
        spawnParticles(rx, ry, 28, isX ? 'drone' : 'core');
      }, 420);
    }

    function triggerDrawEffect() {
      sound.playDraw();
      boardContainer.classList.remove('board-wiggle');
      void boardContainer.offsetWidth;
      boardContainer.classList.add('board-wiggle');
      triggerCombatAction(2); // EMP Blast!
    }

    function handleCellClick(index, cellEl) {
      if (boardState[index] !== null || gameWon) {
        triggerCombatAction();
        return;
      }

      const symbol = currentTurn;
      boardState[index] = symbol;
      moveHistory.push({ index, symbol });

      // Inject full-size X-Drone or O-Core SVG picture and COMPLETELY HIDE the math expression
      const symbolContainer = cellEl.querySelector('.symbol-reveal');
      symbolContainer.innerHTML = symbol === 'X' ? getDroneXSvg() : getRobotOSvg();
      cellEl.classList.add('claimed');

      const rect = cellEl.getBoundingClientRect();
      spawnParticles(
        rect.left + rect.width / 2,
        rect.top + rect.height / 2,
        30,
        symbol === 'O' ? 'core' : 'drone'
      );

      const ended = checkWinOrDraw();
      if (!ended) {
        triggerCombatAction();
        currentTurn = currentTurn === 'X' ? 'O' : 'X';
      }
      updateTurnUI();
    }

    // Undo Last Move Button
    undoBtn.addEventListener('click', () => {
      if (moveHistory.length === 0) return;
      sound.playClick();
      clearWinEffects();
      gameWon = false;

      const last = moveHistory.pop();
      boardState[last.index] = null;
      currentTurn = last.symbol;

      const cells = document.querySelectorAll('.math-cell');
      const targetCell = cells[last.index];
      if (targetCell) {
        targetCell.classList.remove('claimed');
        targetCell.querySelector('.symbol-reveal').innerHTML = '';
      }
      updateTurnUI();
    });

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Generate a fresh 3x3 board with 9 unique round-number multiplication/division expressions
    function generateNewBoard() {
      clearWinEffects();
      gameWon = false;
      boardState = Array(9).fill(null);
      moveHistory = [];
      currentTurn = 'X';
      updateTurnUI();

      const nineExpressions = getNineUniqueExpressions();
      const palettes = shuffleArray(ARMOR_PALETTES);

      gridEl.innerHTML = '';

      nineExpressions.forEach((expr, idx) => {
        const pal = palettes[idx];
        const cell = document.createElement('div');
        cell.className = 'math-cell';
        cell.style.background = pal.cell;

        cell.innerHTML = `
          <!-- Top Tactical Armor Rivets & LED Strip -->
          <div class="absolute top-2 left-0 right-0 flex justify-between items-center px-3.5 pointer-events-none z-10">
            <span class="w-3 h-3 rounded-full border-2 border-slate-950" style="background:${pal.rivet}"></span>
            <span class="w-12 h-1.5 rounded-full bg-slate-950/60 border border-white/30"></span>
            <span class="w-3 h-3 rounded-full border-2 border-slate-950" style="background:${pal.rivet}"></span>
          </div>

          <!-- Stylized Tactical HUD Plate for Formula (Disappears 100% on click!) -->
          <div class="formula-plate" style="background:${pal.plate}">
            <span class="formula-text">${expr}</span>
          </div>

          <!-- Bottom Tactical Corner Rivets -->
          <div class="absolute bottom-2 left-0 right-0 flex justify-between items-center px-3.5 pointer-events-none z-10">
            <span class="w-2.5 h-2.5 rounded-full border-2 border-slate-950" style="background:${pal.rivet}"></span>
            <span class="w-2.5 h-2.5 rounded-full border-2 border-slate-950" style="background:${pal.rivet}"></span>
          </div>

          <!-- Full-Cell X-Drone or O-Core Symbol Reveal -->
          <div class="symbol-reveal"></div>
        `;

        cell.animate([
          { transform: 'scale(0.5) translateY(25px)', opacity: 0 },
          { transform: 'scale(1) translateY(0px)', opacity: 1 }
        ], {
          duration: 280,
          delay: idx * 35,
          easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)',
          fill: 'backwards'
        });

        cell.addEventListener('click', () => handleCellClick(idx, cell));
        gridEl.appendChild(cell);
      });
    }

    // Minimalist "NEXT" Button: Immediately load a new 3x3 board of round-number problems
    nextBtn.addEventListener('click', () => {
      sound.playMissiles();
      const rect = nextBtn.getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 24, 'drone');
      triggerCombatAction(1);
      generateNewBoard();
    });

    // Sound Toggle Button
    soundBtn.addEventListener('click', () => {
      sound.muted = !sound.muted;
      document.getElementById('sound-on-icon').classList.toggle('hidden', sound.muted);
      document.getElementById('sound-off-icon').classList.toggle('hidden', !sound.muted);
      if (!sound.muted) sound.playClick();
    });

    // Master 60fps Loop
    function masterLoop(now) {
      updateFxParticles();
      updateBattlefieldSVG(now);
      requestAnimationFrame(masterLoop);
    }

    window.onload = function () {
      applyDroneSkin(0);
      generateNewBoard();
      requestAnimationFrame(masterLoop);
    };
  </script>
</body>
</html>
