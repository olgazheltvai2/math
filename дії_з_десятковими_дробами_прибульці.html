<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazaar</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #140a07;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  #game-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  #scene-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Minimalist Next Button */
  #next-btn {
    position: absolute;
    top: 2.2vh;
    right: 2vw;
    z-index: 30;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 3px solid #f5b942;
    background: radial-gradient(circle at 30% 30%, #4e2a14, #1f0d05);
    box-shadow: 0 6px 18px rgba(0,0,0,0.7), inset 0 0 12px rgba(245,185,66,0.4);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }
  #next-btn:hover {
    transform: scale(1.1) rotate(5deg);
  }
  #next-btn:active {
    transform: scale(0.94);
  }

  /* Bottom Answers Bar */
  #answers-bar {
    position: absolute;
    bottom: 2.4vh;
    left: 2.8vw;
    right: 2.8vw;
    z-index: 20;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.8vw;
    height: 16.5vh;
    min-height: 92px;
    max-height: 140px;
  }
  .ans-card {
    position: relative;
    cursor: pointer;
    border: none;
    background: transparent;
    padding: 0;
    outline: none;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ans-card:hover {
    transform: translateY(-7px) scale(1.03);
    filter: drop-shadow(0 12px 18px rgba(255, 190, 60, 0.35));
  }
  .ans-card:active {
    transform: translateY(-1px) scale(0.98);
  }
  .ans-card svg.plate-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .ans-text {
    position: relative;
    z-index: 2;
    font-size: clamp(2rem, 3.4vw, 3.4rem);
    font-weight: 900;
    color: #fff8e7;
    text-shadow: 0 4px 0 #261105, 0 6px 14px rgba(0,0,0,0.9);
    letter-spacing: 1px;
    white-space: nowrap;
  }

  @keyframes wrongShake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-15px) rotate(-3deg); }
    40% { transform: translateX(15px) rotate(3deg); }
    60% { transform: translateX(-10px) rotate(-2deg); }
    80% { transform: translateX(10px) rotate(2deg); }
  }
  .shake-wrong {
    animation: wrongShake 0.42s ease-in-out;
  }
</style>
</head>

<script>
(() => {
  // ==================== WEB AUDIO SYNTHESIZER & ALIEN SPEECH ENGINE ====================
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  window.addEventListener('pointerdown', ensureAudio, { once: true });

  // Active mouth talk state for lip-sync
  let keeperTalkUntil = 0;
  let customerTalkUntil = 0;

  // Procedural Alien Chatter ("Прибульська мова" - formant warble synthesis)
  function playAlienSpeech(who = 'keeper', mood = 'neutral') {
    if (!audioCtx) return;
    ensureAudio();
    const now = audioCtx.currentTime;
    const syllables = mood === 'angry' ? 4 : (2 + Math.floor(Math.random() * 4));
    const basePitch = who === 'keeper' ? 165 : (210 + Math.random() * 75);
    let totalDur = 0;

    for (let s = 0; s < syllables; s++) {
      const sylDur = 0.08 + Math.random() * 0.09;
      const gap = 0.025 + Math.random() * 0.03;
      const t0 = now + totalDur;
      totalDur += sylDur + gap;

      const osc = audioCtx.createOscillator();
      const sub = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc.type = mood === 'angry' ? 'sawtooth' : 'triangle';
      sub.type = 'sine';

      const fStart = basePitch * (0.85 + Math.random() * 0.35);
      const fMid = fStart * (mood === 'happy' ? 1.35 : (mood === 'angry' ? 0.72 : (0.8 + Math.random() * 0.5)));
      const fEnd = fStart * (0.9 + Math.random() * 0.25);

      osc.frequency.setValueAtTime(fStart, t0);
      osc.frequency.exponentialRampToValueAtTime(fMid, t0 + sylDur * 0.5);
      osc.frequency.exponentialRampToValueAtTime(fEnd, t0 + sylDur);

      sub.frequency.setValueAtTime(fStart * 0.5, t0);

      // Vowel formant filter
      filter.type = 'bandpass';
      filter.Q.value = 4.5;
      filter.frequency.setValueAtTime(500 + Math.random() * 900, t0);
      filter.frequency.exponentialRampToValueAtTime(400 + Math.random() * 1100, t0 + sylDur);

      gain.gain.setValueAtTime(0.001, t0);
      gain.gain.linearRampToValueAtTime(0.11, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + sylDur);

      osc.connect(filter);
      sub.connect(filter);
      filter.connect(gain).connect(audioCtx.destination);

      osc.start(t0);
      sub.start(t0);
      osc.stop(t0 + sylDur + 0.01);
      sub.stop(t0 + sylDur + 0.01);
    }

    const endMs = performance.now() + totalDur * 1000;
    if (who === 'keeper') keeperTalkUntil = Math.max(keeperTalkUntil, endMs);
    else customerTalkUntil = Math.max(customerTalkUntil, endMs);
  }

    if (!audioCtx) return;
    ensureAudio();

    const freqs = [2250 * pitchShift, 3420 * pitchShift, 4880 * pitchShift];
    freqs.forEach((f, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = idx === 0 ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(f, now);
      osc.frequency.exponentialRampToValueAtTime(f * 1.03, now + 0.11);
      gain.gain.setValueAtTime(volume / (idx + 1), now);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.12);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.13);

    let targetVal = 0;
    let correctExpr = '';
    let distractors = [];

    if (mode === 1) {
      const whole = Math.random() < 0.35 ? rInt(1, 3) : 0;
      let a = rInt(1, 8);
      let b = rInt(1, 9);
      if (a === b) b = (b % 9) + 1;
      targetVal = Number((whole + a / 10 + b / 100).toFixed(2));
      const p1 = whole + a / 10;
      const p2 = b / 100;
      const swap = Math.random() < 0.5;
      correctExpr = swap ? `${fmtDec(p2)}+${fmtDec(p1)}` : `${fmtDec(p1)}+${fmtDec(p2)}`;
      distractors = [
        swap ? `${fmtDec(b / 10)}+${fmtDec(whole + a / 100)}` : `${fmtDec(whole + a / 100)}+${fmtDec(b / 10)}`,
        `${fmtDec(whole + a / 10)}+${fmtDec(b / 10)}`,
        `${fmtDec(b / 10)}+${fmtDec(whole + a / 10)}0`,
        `${fmtDec(a / 100)}+${fmtDec(whole + b / 100)}`
      ];
    } else if (mode === 2) {
      const whole = Math.random() < 0.3 ? rInt(1, 2) : 0;
      const tenths = rInt(3, 9);
      const subHund = rInt(1, 8);
      const startNum = Number((whole + tenths / 10).toFixed(1));
      targetVal = Number((startNum - subHund / 100).toFixed(2));
      correctExpr = `${fmtDec(startNum)}-${fmtDec(subHund / 100)}`;
      distractors = [
        `${fmtDec(startNum)}-${fmtDec(subHund / 10)}`,
        `${fmtDec(Number((whole + tenths / 100).toFixed(2)))}-${fmtDec(subHund / 100)}`,
        `${fmtDec(startNum)}+${fmtDec(subHund / 100)}`,
        `${fmtDec(startNum)}0-${fmtDec(subHund / 10)}`
      ];
    } else if (mode === 3) {
      const t1 = rInt(1, 5);
      const t2 = rInt(1, 3);
      const h2 = rInt(1, 9);
      targetVal = Number(((t1 + t2) / 10 + h2 / 100).toFixed(2));
      const left = t1 / 10;
      const right = Number((t2 / 10 + h2 / 100).toFixed(2));
      const swap = Math.random() < 0.5;
      correctExpr = swap ? `${fmtDec(right)}+${fmtDec(left)}` : `${fmtDec(left)}+${fmtDec(right)}`;
      distractors = [
        swap ? `${fmtDec(right)}+${fmtDec(t1 / 100)}` : `${fmtDec(t1 / 100)}+${fmtDec(right)}`,
        `${fmtDec(left)}+${fmtDec(h2 / 100)}`,
        `${fmtDec((t1 + t2) / 10)}+${fmtDec(h2 / 10)}`,
        `${fmtDec(Number((t1 / 10 + h2 / 100).toFixed(2)))}+${fmtDec(t2 / 100)}`
      ];
    } else {
      const resT = rInt(1, 6);
      const resH = rInt(1, 8);
      const diffT = rInt(1, 3);
      targetVal = Number((resT / 10 + resH / 100).toFixed(2));
      const minuend = Number(((resT + diffT) / 10 + resH / 100).toFixed(2));
      correctExpr = `${fmtDec(minuend)}-${fmtDec(diffT / 10)}`;
      distractors = [
        `${fmtDec(minuend)}-${fmtDec(diffT / 100)}`,
        `${fmtDec((resT + diffT) / 10)}-${fmtDec(resH / 100)}`,
        `${fmtDec(minuend)}+${fmtDec(diffT / 100)}`,
        `${fmtDec(minuend)}-${fmtDec(diffT / 10)}0`
      ];
    }

    const uniqueDistractors = [];
    for (const d of distractors) {
      if (d !== correctExpr && !uniqueDistractors.includes(d)) uniqueDistractors.push(d);
      if (uniqueDistractors.length === 3) break;
    }

    const options = uniqueDistractors.map(expr => ({ expr, isCorrect: false }));
    const correctInsertPos = Math.floor(Math.random() * (options.length + 1));
    options.splice(correctInsertPos, 0, { expr: correctExpr, isCorrect: true });
    return { targetText: fmtDec(targetVal), options };
  }

  // ==================== CONTINUOUS LIFE ENGINE (GAZE SACCADES, CHATTER, BREATHING) ====================
  const keeperGaze = { x: 0, y: 0, tx: 3, ty: 1, nextChange: 0 };
  const custGaze = { x: 0, y: 0, tx: -3, ty: 1, nextChange: 0 };
  let nextAmbientTalk = performance.now() + 2400;

  function updateLivingWorld(now) {
    // 1. Non-blinking random eye gaze shifts for Shopkeeper
    if (now > keeperGaze.nextChange) {
      const targets = [
        { x: 6, y: 1 },   // Looking at customer
        { x: 4, y: 5 },   // Looking at item in hand
        { x: 5, y: 7 },   // Looking at counter coin mat
        { x: -3, y: -2 }, // Glancing at shelves
        { x: 0, y: 6 }    // Glancing at number tablet
      ];
      const pick = targets[Math.floor(Math.random() * targets.length)];
      keeperGaze.tx = pick.x + (Math.random() - 0.5) * 2;
      keeperGaze.ty = pick.y + (Math.random() - 0.5) * 2;
      keeperGaze.nextChange = now + 900 + Math.random() * 1700;
    }
    keeperGaze.x += (keeperGaze.tx - keeperGaze.x) * 0.14;
    keeperGaze.y += (keeperGaze.ty - keeperGaze.y) * 0.14;
    document.querySelectorAll('#keeper-eyes .k-pupil').forEach(el => {
      el.setAttribute('transform', `translate(${keeperGaze.x.toFixed(2)}, ${keeperGaze.y.toFixed(2)})`);
    });

    // 2. Non-blinking random eye gaze shifts for Customer
    if (now > custGaze.nextChange) {
      const targets = [
        { x: -6, y: 0 },  // Looking at shopkeeper
        { x: -5, y: 5 },  // Looking at the item on offer
        { x: -3, y: 7 },  // Looking at counter
        { x: 2, y: -2 }   // Looking around bazaar
      ];
      const pick = targets[Math.floor(Math.random() * targets.length)];
      custGaze.tx = pick.x + (Math.random() - 0.5) * 2;
      custGaze.ty = pick.y + (Math.random() - 0.5) * 2;
      custGaze.nextChange = now + 800 + Math.random() * 1600;
    }
    custGaze.x += (custGaze.tx - custGaze.x) * 0.14;
    custGaze.y += (custGaze.ty - custGaze.y) * 0.14;
    document.querySelectorAll('#customer-layer .c-pupil').forEach(el => {
      el.setAttribute('transform', `translate(${custGaze.x.toFixed(2)}, ${custGaze.y.toFixed(2)})`);
    });

    // 3. Procedural Alien Chatter while idle
    if (!isBusy && now > nextAmbientTalk) {
      const speaker = Math.random() < 0.5 ? 'keeper' : 'customer';
      playAlienSpeech(speaker, 'neutral');
      nextAmbientTalk = now + 3200 + Math.random() * 3500;
    }

    // 4. Mouth lip-sync animation
    const keeperMouth = document.getElementById('keeper-mouth');
    if (keeperMouth) {
      if (now < keeperTalkUntil) {
        const open = 58 + Math.sin(now * 0.045) * 14;
        keeperMouth.setAttribute('d', `M-38 48 Q0 ${open} 38 48 Q0 ${open - 22} -38 48 Z`);
      } else {
        keeperMouth.setAttribute('d', `M-38 50 Q0 64 38 50 Q0 54 -38 50 Z`);
      }
    }

    const custMouth = document.getElementById('cust-mouth');
    if (custMouth) {
      if (now < customerTalkUntil) {
        const open = 52 + Math.sin(now * 0.05) * 13;
        custMouth.setAttribute('d', `M-42 40 Q-14 ${open} 14 40 Q-14 ${open - 20} -42 40 Z`);
      } else {
        custMouth.setAttribute('d', `M-42 42 Q-14 54 14 42 Q-14 46 -42 42 Z`);
      }
    }

    // 5. Subtle breathing for Shopkeeper
    const kRig = document.getElementById('keeper-body-rig');
    if (kRig) {
      const breath = Math.sin(now * 0.0025) * 4;
      kRig.setAttribute('transform', `translate(0, ${breath.toFixed(2)})`);
    }

    requestAnimationFrame(updateLivingWorld);
  }

  // ==================== SCENE INTERACTION & REALISTIC TRANSACTION CHOREOGRAPHY ====================
  const keeperHeldItem = document.getElementById('keeper-held-item');
  const keeperArmR = document.getElementById('keeper-arm-r');
  const keeperArmL = document.getElementById('keeper-arm-l');
  const customerLayer = document.getElementById('customer-layer');
  const coinsLayer = document.getElementById('coins-layer');
  const fxLayer = document.getElementById('fx-layer');
  const targetNumberText = document.getElementById('target-number-text');
  const answersBar = document.getElementById('answers-bar');

  let currentItemSVG = '';
  let isBusy = false;
  let walkFrame = null;

  function walkCustomer(startX, endX, durationMs, dirScaleX, onComplete) {
    if (walkFrame) cancelAnimationFrame(walkFrame);
    const t0 = performance.now();
    let lastFootstep = 0;

    function step(now) {
      const p = Math.min(1, (now - t0) / durationMs);
      const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      const x = startX + (endX - startX) * ease;
      const cycle = Math.sin(p * Math.PI * 9);
      const bobY = Math.abs(cycle) * -13;

      customerLayer.setAttribute('transform', `translate(${x.toFixed(1)}, ${(175 + bobY).toFixed(1)}) scale(${dirScaleX}, 1)`);

      const legB = document.getElementById('cust-leg-b');
      const legF = document.getElementById('cust-leg-f');
      const armTake = document.getElementById('cust-arm-take');
      if (legB && legF) {
        legB.setAttribute('transform', `translate(-26, 360) rotate(${(cycle * 24).toFixed(1)})`);
        legF.setAttribute('transform', `translate(24, 365) rotate(${(-cycle * 24).toFixed(1)})`);
      }
      if (armTake) {
        armTake.setAttribute('transform', `translate(-52, 232) rotate(${(cycle * 10).toFixed(1)})`);
      }

      if (now - lastFootstep > 180 && p < 0.94) {
        playFootstep();
        lastFootstep = now;
      }

      if (p < 1) {
        walkFrame = requestAnimationFrame(step);
      } else {
        if (legB && legF) {
          legB.setAttribute('transform', `translate(-26, 360) rotate(0)`);
          legF.setAttribute('transform', `translate(24, 365) rotate(0)`);
        }
        customerLayer.setAttribute('transform', `translate(${endX}, 175) scale(${dirScaleX}, 1)`);
        if (onComplete) onComplete();
      }
    }
    walkFrame = requestAnimationFrame(step);
  }

  // Realistic physics simulation: Customer lifts pouch and pours bouncing, rolling gold coins onto counter
  function pourAndRollGoldCoins(onFinishedRolling) {
    coinsLayer.innerHTML = '';
    const payLimb = document.getElementById('cust-pay-limb');
    const paySkin = document.getElementById('cust-pay-skin');
    const payHand = document.getElementById('cust-pay-hand');
    const pouch = document.getElementById('cust-gold-pouch');

    // Raise customer's right arm over the counter and tilt leather pouch
    if (payLimb && paySkin && payHand && pouch) {
      payLimb.setAttribute('d', 'M0 0 C-55 5, -135 20, -195 35');
      paySkin.setAttribute('d', 'M0 0 C-55 5, -135 20, -195 35');
      payHand.setAttribute('transform', 'translate(-198, 35) rotate(-115)');
      pouch.setAttribute('opacity', '1');
    }

    const TOTAL_COINS = 32;
    const coins = [];

    for (let i = 0; i < TOTAL_COINS; i++) {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const r = 13 + (i % 3) * 1.5;
      g.innerHTML = `
        <g class="coin-spin">
          <ellipse cx="0" cy="3" rx="${r}" ry="${r * 0.72}" fill="#8c580c"/>
          <ellipse cx="0" cy="0" rx="${r}" ry="${r * 0.72}" fill="#ffd54f" stroke="#784705" stroke-width="2"/>
          <ellipse cx="0" cy="0" rx="${r * 0.62}" ry="${r * 0.42}" fill="none" stroke="#fff8e1" stroke-width="1.5"/>
        </g>
      `;
      g.setAttribute('opacity', '0');
      coinsLayer.appendChild(g);

      // Coins pour from pouch mouth at (1175, 435) down onto the counter mat (y ~ 565..584)
      const targetSpread = (Math.random() - 0.58) * 5.2;
      coins.push({
        el: g,
        inner: g.firstElementChild,
        spawnTime: i * 24,
        x: 1175 + (Math.random() - 0.5) * 18,
        y: 438 + (Math.random() - 0.5) * 10,
        vx: targetSpread - 1.1,
        vy: 1.5 + Math.random() * 2.2,
        floorY: 562 + (Math.random() - 0.5) * 24,
        rot: Math.random() * 360,
        vRot: (targetSpread >= 0 ? 1 : -1) * (10 + Math.random() * 12),
        bounces: 0,
        settled: false
      });
    }

    const startT = performance.now();
    function stepCoins(now) {
      const elapsed = now - startT;
      let allSettled = true;

      // Shake pouring pouch while coins stream out
      if (elapsed < 820 && payHand) {
        const shake = Math.sin(elapsed * 0.05) * 6;
        payHand.setAttribute('transform', `translate(-198, ${35 + shake}) rotate(-120)`);
      } else if (payLimb && paySkin && payHand && pouch) {
        // Return arm to side after pouring
        payLimb.setAttribute('d', 'M0 0 C25 45, 10 95, -20 118');
        paySkin.setAttribute('d', 'M0 0 C25 45, 10 95, -20 118');
        payHand.setAttribute('transform', 'translate(-22, 118) rotate(0)');
        pouch.setAttribute('opacity', '0');
      }

      for (let i = 0; i < coins.length; i++) {
        const c = coins[i];
        if (elapsed < c.spawnTime) {
          allSettled = false;
          continue;
        }
        c.el.setAttribute('opacity', '1');

        if (!c.settled) {
          allSettled = false;
          c.vy += 0.72; // Gravity
          c.x += c.vx;
          c.y += c.vy;
          c.rot += c.vRot;

          // Hit counter surface
          if (c.y >= c.floorY) {
            c.y = c.floorY;
            if (Math.abs(c.vy) > 2.1 && c.bounces < 3) {
              c.vy = -c.vy * (0.46 + Math.random() * 0.12);
              c.bounces++;
              if (i % 2 === 0 || c.bounces === 1) {
                playCoinClink(0.92 + (i % 7) * 0.05, 0.065 / c.bounces);
              }
            } else {
              // Roll along the wooden counter before lying flat
              c.vy = 0;
              c.vx *= 0.91;
              c.vRot = c.vx * 5.5;
              if (Math.abs(c.vx) < 0.08) {
                c.settled = true;
              }
            }
          }

          // While falling or rolling fast, stand slightly on edge; when settled, lie flat on counter
          const tiltScaleY = c.settled ? 1 : (0.65 + Math.abs(Math.sin(c.rot * Math.PI / 180)) * 0.35);
          c.el.setAttribute('transform', `translate(${c.x.toFixed(1)}, ${c.y.toFixed(1)})`);
          c.inner.setAttribute('transform', `rotate(${(c.rot * 0.35).toFixed(1)}) scale(1, ${tiltScaleY.toFixed(2)})`);
        }
      }

      if (!allSettled && elapsed < 1750) {
        requestAnimationFrame(stepCoins);
      } else if (onFinishedRolling) {
        onFinishedRolling(coins);
      }
    }
    requestAnimationFrame(stepCoins);
  }

  function runFullTransactionSequence() {
    isBusy = true;
    playAlienSpeech('customer', 'happy');

    // Step 1: Customer pours gold coins onto counter; coins bounce and roll into a pile
    pourAndRollGoldCoins((settledCoins) => {
      playAlienSpeech('keeper', 'happy');

      // Step 2: Shopkeeper extends right arm forward offering the item AND Customer reaches out to grab it
      const armTake = document.getElementById('cust-arm-take');
      keeperArmR.style.transition = 'transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1)';
      keeperArmR.setAttribute('transform', 'translate(135, 222) rotate(-10)');

      if (armTake) {
        armTake.style.transition = 'transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1)';
        armTake.setAttribute('transform', 'translate(-95, 225) rotate(14)');
      }

      setTimeout(() => {
        // Step 3: Transfer item directly from Shopkeeper's hand into Customer's hand!
        keeperHeldItem.innerHTML = '';
        const carriedSlot = document.getElementById('cust-carried-item');
        if (carriedSlot) carriedSlot.innerHTML = currentItemSVG;

        // Return arms to carry pose
        keeperArmR.setAttribute('transform', 'translate(88, 230) rotate(0)');
        if (armTake) {
          armTake.setAttribute('transform', 'translate(-52, 232) rotate(6)');
        }

        // Simultaneously, Shopkeeper sweeps the gold coins into the counter drawer
        keeperArmL.style.transition = 'transform 0.42s ease-in-out';
        keeperArmL.setAttribute('transform', 'translate(45, 240) rotate(-25)');

        const sweepStart = performance.now();
        function sweepCoinsAnim(now) {
          const p = Math.min(1, (now - sweepStart) / 380);
          settledCoins.forEach((c, idx) => {
            const cx = c.x + (560 - c.x) * p;
            const cy = c.y + (572 - c.y) * p - Math.sin(p * Math.PI) * 18;
            c.el.setAttribute('transform', `translate(${cx.toFixed(1)}, ${cy.toFixed(1)}) scale(${(1 - p * 0.6).toFixed(2)})`);
            if (p > 0.85) c.el.setAttribute('opacity', String((1 - p) * 6));
          });
          if (p < 1) {
            requestAnimationFrame(sweepCoinsAnim);
          } else {
            coinsLayer.innerHTML = '';
            keeperArmL.setAttribute('transform', 'translate(-85, 225) rotate(0)');
          }
        }
        playCoinClink(1.15, 0.08);
        requestAnimationFrame(sweepCoinsAnim);

        // Step 4: Customer turns around holding the item and walks off-screen right
        setTimeout(() => {
          walkCustomer(1350, 2220, 1050, -1, () => {
            loadNextRound();
          });
        }, 260);
      }, 400);
    });
  }

  function triggerWrongAnswerFX(btnEl) {
    playAlienSpeech('keeper', 'angry');
    btnEl.classList.remove('shake-wrong');
    void btnEl.offsetWidth;
    btnEl.classList.add('shake-wrong');

    // Sparks around the target tablet
    fxLayer.innerHTML = '';
    for (let i = 0; i < 10; i++) {
      const ang = (Math.PI * 2 * i) / 10;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const x1 = 960 + Math.cos(ang) * 150;
      const y1 = 705 + Math.sin(ang) * 75;
      const x2 = 960 + Math.cos(ang) * 260;
      const y2 = 705 + Math.sin(ang) * 135;
      path.setAttribute('d', `M${x1} ${y1} L${(x1 + x2) / 2 + (Math.random() - 0.5) * 28} ${(y1 + y2) / 2 + (Math.random() - 0.5) * 28} L${x2} ${y2}`);
      path.setAttribute('stroke', i % 2 === 0 ? '#ff3d00' : '#ffea00');
      path.setAttribute('stroke-width', '5');
      path.setAttribute('fill', 'none');
      fxLayer.appendChild(path);
    }
    setTimeout(() => { fxLayer.innerHTML = ''; }, 360);
  }

  function buildAnswerButtons(options) {
    answersBar.innerHTML = '';
    options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'ans-card';
      const tones = [
        ['#5c2c16', '#361608', '#1f0b03'],
        ['#4a2511', '#2b1306', '#170902'],
        ['#633219', '#3b1909', '#210c03'],
        ['#522813', '#301407', '#1a0a03']
      ][idx % 4];

      btn.innerHTML = `
        <svg class="plate-bg" viewBox="0 0 420 140" preserveAspectRatio="none">
          <defs>
            <linearGradient id="bGrad${idx}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${tones[0]}"/>
              <stop offset="55%" stop-color="${tones[1]}"/>
              <stop offset="100%" stop-color="${tones[2]}"/>
            </linearGradient>
          </defs>
          <polygon points="24,8 396,8 414,35 414,105 396,132 24,132 6,105 6,35"
                   fill="url(#bGrad${idx})" stroke="#f5b942" stroke-width="5" stroke-linejoin="round"/>
          <polygon points="32,18 388,18 402,40 402,100 388,122 32,122 18,100 18,40"
                   fill="none" stroke="#ffd54f" stroke-width="2" stroke-opacity="0.4"/>
          <circle cx="28" cy="70" r="6" fill="#ffd54f" opacity="0.8"/>
          <circle cx="392" cy="70" r="6" fill="#ffd54f" opacity="0.8"/>
        </svg>
        <span class="ans-text">${opt.expr}</span>
      `;

      btn.addEventListener('mouseenter', () => {
        if (!isBusy) playHoverTick();
      });

      btn.addEventListener('click', () => {
        ensureAudio();
        if (isBusy) return;
        if (opt.isCorrect) {
          runFullTransactionSequence();
        } else {
          triggerWrongAnswerFX(btn);
        }
      });

      answersBar.appendChild(btn);
    });
  }

  function loadNextRound() {
    isBusy = true;
    coinsLayer.innerHTML = '';
    fxLayer.innerHTML = '';

    // Place new unique item directly in Shopkeeper's hands
    currentItemSVG = getNextUniqueItemSVG();
    keeperHeldItem.innerHTML = currentItemSVG;

    const q = generateDecimalQuestion();
    targetNumberText.textContent = q.targetText;
    buildAnswerButtons(q.options);

    // Spawn new customer off-screen right and walk to counter
    customerLayer.innerHTML = createCustomerSVG();
    walkCustomer(2160, 1350, 920, 1, () => {
      isBusy = false;
      playAlienSpeech('keeper', 'neutral');
    });
  }

  document.getElementById('next-btn').addEventListener('click', () => {
    ensureAudio();
    playHoverTick();
    if (walkFrame) cancelAnimationFrame(walkFrame);
    loadNextRound();
  });

  // Start life engine & first round
  requestAnimationFrame(updateLivingWorld);
  loadNextRound();
})();
</script>
</body>
