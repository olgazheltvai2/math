<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 🐝</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #game-container {
        width: 100%;
        max-width: 1000px;
        min-height: 70vh;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
    }

    /* THEME MANAGER CSS */
    #theme-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        background: white;
        border: none;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        font-size: 30px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: transform 0.2s;
    }
    #theme-btn:hover {
        transform: scale(1.1);
    }
    #theme-menu {
        position: fixed;
        bottom: 90px;
        right: 20px;
        z-index: 9998;
        background: white;
        max-height: 60vh;
        width: 320px;
        overflow-y: auto;
        display: none;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        padding: 15px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }
    .theme-thumb {
        position: relative;
        cursor: pointer;
        width: 100%;
        aspect-ratio: 16/9;
        background-size: cover;
        background-position: center;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        transition: transform 0.2s;
    }
    .theme-thumb:hover {
        transform: scale(1.05);
    }
    .theme-thumb span {
        position: absolute;
        bottom: 5px;
        left: 5px;
        background: rgba(0,0,0,0.7);
        color: white;
        padding: 3px 6px;
        font-size: 14px;
        border-radius: 4px;
        font-weight: bold;
    }

    /* GAME CSS */
    #setup-screen, #play-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }
    #play-screen {
        display: none;
    }

    .input-large {
        font-family: Arial, sans-serif;
        font-size: 100px; 
        width: 180px;
        text-align: center;
        border: 4px solid #4CAF50;
        border-radius: 20px;
        padding: 10px;
        margin-bottom: 30px;
        outline: none;
        background: rgba(249, 255, 249, 0.9);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    
    .btn-large {
        font-size: 70px; 
        background: rgba(255, 255, 255, 0.8);
        border: none;
        border-radius: 50%;
        width: 100px;
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 0.2s;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .btn-large:hover {
        transform: scale(1.1);
    }

    #check-btn {
        position: fixed;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 1000;
        display: none;
    }

    .flower {
        width: 180px; 
        height: 180px;
        position: absolute; 
    }
    .petal {
        position: absolute;
        width: 70px; 
        height: 70px;
        background: #FF4081;
        border-radius: 50%;
        z-index: 1;
        transition: all 1.5s ease-in-out;
        box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1), 0 2px 5px rgba(0,0,0,0.2);
    }
    .petal.p1 { top: 5px; left: 55px; }
    .petal.p2 { top: 25px; left: 105px; }
    .petal.p3 { top: 85px; left: 105px; }
    .petal.p4 { top: 105px; left: 55px; }
    .petal.p5 { top: 85px; left: 5px; }
    .petal.p6 { top: 25px; left: 5px; }

    .center-input {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        width: 80px; 
        height: 80px;
        font-size: 44px; 
        font-family: Arial, sans-serif;
        font-weight: bold;
        text-align: center;
        border-radius: 50%;
        border: 4px solid #FFC107;
        background: #FFF9C4;
        outline: none;
        transition: all 0.3s ease-in-out;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* ERROR PULSING RED GLOW FOR WRONG FLOWERS */
    @keyframes pulseRedGlow {
        0%, 100% {
            background: #FFCDD2;
            border-color: #F44336;
            box-shadow: 0 0 15px #F44336, inset 0 0 10px #FF5252;
            color: #B71C1C;
            transform: translate(-50%, -50%) scale(1);
        }
        50% {
            background: #FF8A80;
            border-color: #D32F2F;
            box-shadow: 0 0 35px #FF1744, inset 0 0 15px #FF8A80;
            color: #5f0909;
            transform: translate(-50%, -50%) scale(1.12);
        }
    }
    .center-input.error-blink {
        animation: pulseRedGlow 0.8s infinite;
    }

    .flower.withered .petal {
        background: #757575;
        transform: scale(0.7) rotate(20deg);
        filter: grayscale(100%);
    }
    .flower.withered .center-input {
        background: #9E9E9E;
        border-color: #616161;
        color: transparent;
        box-shadow: none;
        animation: none; 
    }

    /* ANIMATIONS */
    #bee {
        position: fixed;
        font-size: 80px;
        z-index: 100;
        display: none;
        transition: top 1s ease-in-out, left 1s ease-in-out, transform 0.2s;
        pointer-events: none;
        filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
    }
    
    .rain-drop {
        position: fixed;
        font-size: 40px;
        pointer-events: none;
        z-index: 99;
        animation: fall linear forwards;
    }

    @keyframes fall {
        0% { top: -10%; opacity: 1; }
        100% { top: 110%; opacity: 0; }
    }
</style>
<body>

    <button id="theme-btn">⚙️</button>
    <div id="theme-menu"></div>

    <div id="game-container">
        <div id="setup-screen">
            <input type="number" id="base-number" class="input-large" min="1" max="99">
            <button class="btn-large" onclick="startGame()">▶️</button>
        </div>

        <div id="play-screen">
            <div id="flowers-container"></div>
        </div>
        
        <button id="check-btn" class="btn-large" onclick="checkAnswers()">✔️</button>
        <div id="bee">🐝</div>
    </div>

<script>
    /* АУДІО СИСТЕМА (ТИХІ ЗВУКИ) */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'success') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.3); 
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime); 
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'rain') {
            const bufferSize = audioCtx.sampleRate * 2; 
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.value = 800;
            
            noise.connect(noiseFilter);
            noiseFilter.connect(gain);
            gain.connect(audioCtx.destination);
            
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime); 
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2);
            noise.start();
        } else if (type === 'bee') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(90, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.005, audioCtx.currentTime); // Зроблено ще тихішим
            
            const lfo = audioCtx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 15;
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 15;
            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);
            lfo.start();
            
            osc.start();
            setTimeout(() => {
                osc.stop();
                lfo.stop();
            }, 6000);
        }
    }

    /* 1. THEME MANAGER LOGIC */
    const baseBgUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
    const themeMenu = document.getElementById('theme-menu');
    const themeBtn = document.getElementById('theme-btn');
    
    const savedBg = localStorage.getItem('mySavedGameBg') || `${baseBgUrl}background_1.webp`;
    document.body.style.backgroundImage = `url(${savedBg})`;

    themeBtn.onclick = () => {
        themeMenu.style.display = themeMenu.style.display === 'grid' ? 'none' : 'grid';
    };

    let errorCount = 0;
    const maxBackgrounds = 1000;
    
    for (let i = 1; i <= maxBackgrounds; i++) {
        if (errorCount >= 5) break; 

        let url = `${baseBgUrl}background_${i}.webp`;
        let img = new Image();
        
        img.onload = () => {
            errorCount = 0; 
            let thumb = document.createElement('div');
            thumb.className = 'theme-thumb';
            thumb.style.backgroundImage = `url(${url})`;
            thumb.innerHTML = `<span>🖼️ ${i}</span>`;
            thumb.dataset.index = i;
            
            thumb.onclick = () => {
                document.body.style.backgroundImage = `url(${url})`;
                localStorage.setItem('mySavedGameBg', url);
            };

            let thumbs = Array.from(themeMenu.children);
            let added = false;
            for (let t of thumbs) {
                if (i < parseInt(t.dataset.index)) {
                    themeMenu.insertBefore(thumb, t);
                    added = true;
                    break;
                }
            }
            if (!added) themeMenu.appendChild(thumb);
        };
        
        img.onerror = () => {
            errorCount++;
        };
        
        img.src = url;
    }

    /* 2. GAME LOGIC */
    let expectedAnswers = [];
    let gameActive = true;

    function startGame() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const inputVal = parseInt(document.getElementById('base-number').value);
        if (isNaN(inputVal) || inputVal <= 0) return;
        
        expectedAnswers = [];
        for (let i = 1; i <= 9; i++) {
            expectedAnswers.push(inputVal * i);
        }
        
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('play-screen').style.display = 'block';
        document.getElementById('check-btn').style.display = 'flex';
        
        const container = document.getElementById('flowers-container');
        container.innerHTML = '';
        container.style.position = 'fixed';
        container.style.top = '0';
        container.style.left = '0';
        container.style.width = '100vw';
        container.style.height = '100vh';
        container.style.pointerEvents = 'none'; 
        
        gameActive = true;
        document.getElementById('bee').style.display = 'none';

        let rows = 3;
        let cols = 3;
        let positions = [];
        
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                positions.push({r, c});
            }
        }
        
        positions.sort(() => Math.random() - 0.5);

        for (let i = 0; i < 9; i++) {
            let flower = document.createElement('div');
            flower.className = 'flower';
            flower.style.pointerEvents = 'auto'; 
            
            let pos = positions[i];
            let cellW = 100 / cols;
            let cellH = 100 / rows;
            
            let offsetX = (Math.random() * (cellW - 15)) + 2; 
            let offsetY = (Math.random() * (cellH - 25)) + 5; 
            
            let leftPercent = (pos.c * cellW) + offsetX;
            let topPercent = (pos.r * cellH) + offsetY;
            let randomRot = (Math.random() * 40) - 20;
            
            flower.style.left = `${leftPercent}vw`;
            flower.style.top = `${topPercent}vh`;
            flower.style.transform = `rotate(${randomRot}deg)`;
            
            for (let p = 1; p <= 6; p++) {
                let petal = document.createElement('div');
                petal.className = `petal p${p}`;
                flower.appendChild(petal);
            }
            
            let inp = document.createElement('input');
            inp.type = 'number';
            inp.className = 'center-input';
            flower.appendChild(inp);
            
            container.appendChild(flower);
        }
    }

    function checkAnswers() {
        if (!gameActive) return;

        let inputs = document.querySelectorAll('.center-input');
        let enteredValues = [];
        
        inputs.forEach(inp => {
            let val = parseInt(inp.value);
            enteredValues.push({ el: inp, val: isNaN(val) ? null : val });
            inp.classList.remove('error-blink'); 
        });

        let hasError = false;
        let pool = [...expectedAnswers];

        // Перший прохід: спочатку зіставимо правильні значення
        let itemStatuses = enteredValues.map(item => {
            let idx = pool.indexOf(item.val);
            if (idx !== -1) {
                pool.splice(idx, 1);
                return { el: item.el, correct: true };
            } else {
                return { el: item.el, correct: false };
            }
        });

        for (let status of itemStatuses) {
            if (!status.correct) {
                status.el.classList.add('error-blink');
                hasError = true;
            }
        }

        if (hasError) {
            gameActive = false;
            playSound('error');
            
            // Тільки неправильні квітки пульсують червоним 5 секунд, потім йде дощ
            setTimeout(() => {
                playSound('rain');
                triggerRainAndWither();
            }, 5000);
            
        } else {
            gameActive = false;
            playSound('success');
            setTimeout(() => playSound('bee'), 500);
            triggerBee();
        }
    }

    function triggerRainAndWither() {
        const container = document.body;
        let dropCount = 0;
        
        let rainInterval = setInterval(() => {
            if(dropCount > 50) {
                clearInterval(rainInterval);
                return;
            }
            let drop = document.createElement('div');
            drop.className = 'rain-drop';
            drop.innerHTML = '💧';
            drop.style.left = Math.random() * 100 + 'vw';
            drop.style.animationDuration = (0.8 + Math.random() * 1) + 's';
            container.appendChild(drop);
            
            setTimeout(() => drop.remove(), 2000);
            dropCount++;
        }, 40);

        setTimeout(() => {
            document.querySelectorAll('.flower').forEach(f => f.classList.add('withered'));
        }, 1000);
    }

    function triggerBee() {
        let bee = document.getElementById('bee');
        let flowers = document.querySelectorAll('.flower');
        if (flowers.length === 0) return;
        
        bee.style.display = 'block';
        
        function moveBee() {
            let targetFlower = flowers[Math.floor(Math.random() * flowers.length)];
            let fRect = targetFlower.getBoundingClientRect();
            
            let x = fRect.left + (fRect.width / 2) - 40; 
            let y = fRect.top + (fRect.height / 2) - 40;
            
            bee.style.left = x + 'px';
            bee.style.top = y + 'px';
        }

        moveBee(); 
        setInterval(moveBee, 1500); 
    }
</script>
</html>
