<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>I · II · III</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0b0806;
      font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
    }

    /* STRICT 3-ROW NON-OVERLAPPING WIDESCREEN ARCHITECTURE */
    .game-shell {
      display: grid;
      grid-template-rows: 58px 1fr 220px;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0907;
    }
    @media (min-height: 760px) {
      .game-shell {
        grid-template-rows: 64px 1fr 250px;
      }
    }
    @media (max-height: 600px) {
      .game-shell {
        grid-template-rows: 48px 1fr 185px;
      }
    }

    /* TOP BAR: Carved Dark Walnut & Weathered Bronze */
    .top-walnut-bar {
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 3px, transparent 3px, transparent 9px),
        linear-gradient(180deg, #2b1d14 0%, #1b120c 60%, #110b07 100%);
      border-bottom: 3px solid #6e5036;
      box-shadow: 0 6px 18px rgba(0,0,0,0.85), inset 0 1px 2px rgba(255,215,170,0.2);
      z-index: 20;
    }

    /* BOTTOM ALTAR DOCK: Ancient Basalt, Mahogany & Bronze (Never overlaps battlefield) */
    .bottom-altar-dock {
      background:
        radial-gradient(ellipse at 50% 0%, rgba(217, 119, 6, 0.14), transparent 70%),
        repeating-linear-gradient(135deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 2px, transparent 2px, transparent 8px),
        linear-gradient(180deg, #241913 0%, #17100c 45%, #0e0907 100%);
      border-top: 4px solid #7c5a3f;
      box-shadow:
        0 -10px 25px rgba(0,0,0,0.85),
        inset 0 2px 5px rgba(251, 191, 36, 0.22);
      z-index: 20;
    }

    /* Medallions for Heroes */
    .hero-medallion {
      background: radial-gradient(circle at 35% 25%, #3d2c20 0%, #1a120d 100%);
      border: 2px solid #634833;
      box-shadow: 0 3px 8px rgba(0,0,0,0.8), inset 0 1px 3px rgba(255,255,255,0.15);
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      position: relative;
    }
    .hero-medallion:hover {
      transform: translateY(-2px) scale(1.05);
      border-color: #d97706;
    }
    .hero-medallion.in-squad {
      border-color: #4d7c0f;
      background: radial-gradient(circle at 35% 25%, #2ec4b622 0%, #1e2918 50%, #11180e 100%);
    }
    .hero-medallion.active-attacker {
      border-color: #f59e0b;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.8), inset 0 0 8px rgba(245, 158, 11, 0.35);
      transform: scale(1.08);
    }

    /* Roman Numeral Level Buttons */
    .lvl-btn {
      background: linear-gradient(180deg, #3e2d21 0%, #211710 100%);
      border: 2px solid #785a40;
      color: #cbb299;
      box-shadow: 0 3px 8px rgba(0,0,0,0.7), inset 0 1px 2px rgba(255,255,255,0.15);
      transition: all 0.18s ease;
      cursor: pointer;
      text-shadow: 0 2px 3px rgba(0,0,0,0.95);
    }
    .lvl-btn:hover {
      border-color: #d97706;
      color: #fde68a;
    }
    .lvl-btn.active {
      background: radial-gradient(circle at 50% 25%, #b45309 0%, #78350f 70%, #3b1704 100%);
      border-color: #fbbf24;
      color: #fef3c7;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.6), inset 0 1px 4px rgba(255,251,235,0.45);
    }

    /* Carved Stone & Bronze Numpad Keys */
    .num-key {
      background:
        radial-gradient(circle at 30% 20%, #4a382b 0%, #2e221a 68%, #1d1510 100%);
      border: 2px solid #7c5e46;
      color: #f5e6d3;
      text-shadow: 0 2px 3px rgba(0,0,0,0.95);
      box-shadow:
        0 4px 0 #120c09,
        0 6px 10px rgba(0,0,0,0.75),
        inset 0 1px 2px rgba(255,235,205,0.22);
      transition: transform 0.07s ease, box-shadow 0.07s ease, border-color 0.15s ease;
      cursor: pointer;
    }
    .num-key:hover {
      border-color: #f59e0b;
      color: #fef3c7;
      background: radial-gradient(circle at 30% 20%, #5c4636 0%, #3b2c22 68%, #261c15 100%);
    }
    .num-key:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #120c09, 0 2px 4px rgba(0,0,0,0.8);
    }

    .key-clear {
      background: radial-gradient(circle at 30% 20%, #632626 0%, #3d1515 70%, #240b0b 100%);
      border-color: #994141;
      color: #fca5a5;
    }
    .key-clear:hover {
      border-color: #ef4444;
      background: radial-gradient(circle at 30% 20%, #7a2e2e 0%, #4d1b1b 70%, #2e0e0e 100%);
    }

    .key-fire {
      background: radial-gradient(circle at 30% 20%, #b45309 0%, #78350f 68%, #451a03 100%);
      border-color: #fbbf24;
      color: #fef3c7;
      box-shadow:
        0 4px 0 #290f02,
        0 0 14px rgba(245, 158, 11, 0.45),
        inset 0 1px 3px rgba(254, 243, 199, 0.4);
    }
    .key-fire:hover {
      border-color: #fde047;
      background: radial-gradient(circle at 30% 20%, #d97706 0%, #92400e 68%, #542105 100%);
    }

    /* Next / Skip Button ("Далі" ➔) */
    .next-btn {
      background: radial-gradient(circle at 30% 30%, #3f6212 0%, #1a2e05 85%);
      border: 2px solid #84cc16;
      color: #ecfccb;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8), inset 0 1px 3px rgba(217,249,157,0.35);
      transition: all 0.18s ease;
      cursor: pointer;
    }
    .next-btn:hover {
      transform: translateX(2px) scale(1.05);
      border-color: #bef264;
      box-shadow: 0 0 14px rgba(132, 204, 22, 0.6);
    }

    /* Expression Altar Slate & Operator Scratchpad Bubbles */
    .expression-slate {
      background:
        radial-gradient(circle at 50% 30%, #261b14 0%, #140e0a 75%, #0c0806 100%);
      border: 3px solid #634732;
      box-shadow:
        inset 0 4px 14px rgba(0,0,0,0.95),
        0 4px 12px rgba(0,0,0,0.7);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .op-helper-bubble {
      background: radial-gradient(circle at 50% 30%, #2b2018 0%, #16100c 100%);
      border: 1.5px dashed #785a40;
      color: #fcd34d;
      transition: all 0.15s ease;
      cursor: pointer;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.9);
    }
    .op-helper-bubble:hover {
      border-color: #f59e0b;
      transform: scale(1.07);
    }
    .op-helper-bubble.focused-slot {
      border-style: solid;
      border-color: #fbbf24;
      background: radial-gradient(circle at 50% 30%, #45270d 0%, #211205 100%);
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.65);
      transform: scale(1.1);
    }
    .op-helper-bubble.correct-step {
      border-style: solid;
      border-color: #65a30d;
      background: radial-gradient(circle at 50% 30%, #1a2e05 0%, #0d1702 100%);
      color: #bef264;
      box-shadow: 0 0 8px rgba(101, 163, 13, 0.55);
    }

    .final-answer-slot {
      background: radial-gradient(circle at 50% 30%, #2e1d0f 0%, #140c06 100%);
      border: 3px solid #b45309;
      color: #fde68a;
      box-shadow:
        0 0 14px rgba(217, 119, 6, 0.35),
        inset 0 3px 8px rgba(0,0,0,0.92);
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .final-answer-slot.focused-slot {
      border-color: #fbbf24;
      box-shadow:
        0 0 20px rgba(251, 191, 36, 0.7),
        inset 0 2px 6px rgba(251, 191, 36, 0.25);
      transform: scale(1.04);
    }

    @keyframes slateShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-12px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(6px); }
    }
    .shake-error {
      animation: slateShake 0.4s ease-in-out;
      border-color: #dc2626 !important;
      box-shadow: 0 0 25px rgba(220, 38, 38, 0.8) !important;
    }
  </style>
</head>
<body>

  <!-- NON-OVERLAPPING 3-ROW WIDESCREEN CONTAINER -->
  <div class="game-shell">

    <!-- ROW 1: TOP CONTROL BAR (Never overlaps battlefield) -->
    <header class="top-walnut-bar px-3 sm:px-6 flex items-center justify-between">
      <!-- Left: 5 Realistic Wildlife Hero Medallions (Toggle 1–5 Heroes & Select Active) -->
      <div class="flex items-center gap-1.5 sm:gap-2.5" id="heroMedallionBar">
        <!-- Populated dynamically with detailed anatomical SVG portraits -->
      </div>

      <!-- Center: Level Selectors (I, II, III) -->
      <div class="flex items-center gap-1.5 sm:gap-2.5">
        <button id="lvlBtn1" onclick="setLevel(1)" class="lvl-btn active w-10 h-9 sm:w-13 sm:h-10 rounded-lg font-black text-lg sm:text-xl flex items-center justify-center">I</button>
        <button id="lvlBtn2" onclick="setLevel(2)" class="lvl-btn w-10 h-9 sm:w-13 sm:h-10 rounded-lg font-black text-lg sm:text-xl flex items-center justify-center">II</button>
        <button id="lvlBtn3" onclick="setLevel(3)" class="lvl-btn w-10 h-9 sm:w-13 sm:h-10 rounded-lg font-black text-lg sm:text-xl flex items-center justify-center">III</button>
      </div>

      <!-- Right: Sound Toggle & Minimalist "Next" (➔) Button -->
      <div class="flex items-center gap-2 sm:gap-3">
        <button id="soundToggleBtn" onclick="toggleSound()" class="lvl-btn w-10 h-9 sm:w-11 sm:h-10 rounded-lg flex items-center justify-center">
          <svg id="soundOnIcon" class="w-5 h-5 sm:w-6 sm:h-6 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="rgba(251,191,36,0.25)"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg id="soundOffIcon" class="w-5 h-5 sm:w-6 sm:h-6 text-stone-400 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <button onclick="skipToNextTask()" class="next-btn w-11 h-9 sm:w-14 sm:h-10 rounded-lg flex items-center justify-center" aria-label="Next">
          <svg class="w-6 h-6 sm:w-7 sm:h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
    </header>

    <!-- ROW 2: DEDICATED WIDESCREEN BATTLEFIELD CANVAS (100% Unobstructed!) -->
    <main class="relative w-full h-full overflow-hidden bg-stone-950">
      <canvas id="arenaCanvas" class="w-full h-full block"></canvas>
    </main>

    <!-- ROW 3: DEDICATED BOTTOM CARVED ALTAR DOCK (Never overlaps characters!) -->
    <footer class="bottom-altar-dock px-3 sm:px-6 py-2 sm:py-3 flex flex-col lg:flex-row items-center justify-between gap-2 sm:gap-5">

      <!-- Left/Center: Active Attacker Crest + Speed-Power Decay Bar + Carved Math Expression Slate -->
      <div class="w-full lg:flex-1 flex flex-col gap-1.5 sm:gap-2">
        <!-- Power Meter Row -->
        <div class="flex items-center gap-2.5">
          <div id="activeHeroCrest" class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg border-2 border-amber-500 bg-stone-900 flex items-center justify-center shrink-0 shadow-inner"></div>

          <!-- Decaying Strike Power Gauge -->
          <div class="flex-1 h-4 sm:h-5 rounded-full bg-stone-950 border-2 border-stone-700 p-0.5 relative overflow-hidden shadow-inner">
            <div id="powerBarFill" class="h-full rounded-full transition-none" style="width: 100%; background: linear-gradient(90deg, #b91c1c 0%, #d97706 45%, #fbbf24 85%, #fef08a 100%);"></div>
            <div class="absolute inset-y-0 left-1/3 w-0.5 bg-stone-700/80"></div>
            <div class="absolute inset-y-0 left-2/3 w-0.5 bg-stone-700/80"></div>
          </div>

          <!-- Flame/Claw Power Icon -->
          <div class="w-7 h-7 flex items-center justify-center text-amber-400 shrink-0">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
            </svg>
          </div>
        </div>

        <!-- Expression Slate with Optional Intermediate Operator Bubbles -->
        <div id="expressionStage" class="expression-slate rounded-2xl px-3 py-1.5 sm:px-5 sm:py-2.5 flex flex-wrap items-end justify-center gap-1 sm:gap-2.5 min-h-[72px] sm:min-h-[96px]">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- Right: Tactile Carved Stone Keypad (6x2 grid on wide screens, never overlaps anything) -->
      <div class="w-full lg:w-[430px] xl:w-[470px] grid grid-cols-6 gap-1.5 sm:gap-2 shrink-0">
        <button onclick="pressDigit(1)" class="num-key h-10 sm:h-14 rounded-xl font-black text-xl sm:text-2xl flex items-center justify-center">1</button>
        <button onclick="pressDigit(2)" class="num-key h-10 sm:h-14 rounded-xl font-black text-xl sm:text-2xl flex items-center justify-center">2</button>
        <button onclick="pressDigit(3)" class="num-key h-10 sm:h-14 rounded-xl font-black text-xl sm:text-2xl flex items-center justify-center">3</button>
        <button onclick="pressDigit(4)" class="num-key h-10 sm:h-14 rounded-xl font-black text-xl sm:text-2xl flex items-center justify-center">4</button>
        <button onclick="pressDigit(5)" class="num-key h-10 sm:h-14 rounded-xl font-black text-xl sm:text-2xl flex items-center justify-center">5</button>
        <button onclick="pressBackspace()" class="num-key key-clear h-10 sm:h-14 rounded-xl flex items-center justify-center" aria-label="Backspace">
          <svg class="w-6 h-6 sm:w-7 sm:h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>

        <button onclick="pressDigit(6)" class="num-key h-10 sm:h-14 rounded-xl font-black text-xl sm:text-2xl flex items-center justify-center">6</button>
        <button onclick="pressDigit(7)" class="num-key h-10 sm:h-14 rounded-xl font-black text-xl sm:text-2xl flex items-center justify-center">7</button>
        <button onclick="pressDigit(8)" class="num-key h-10 sm:h-14 rounded-xl font-black text-xl sm:text-2xl flex items-center justify-center">8</button>
        <button onclick="pressDigit(9)" class="num-key h-10 sm:h-14 rounded-xl font-black text-xl sm:text-2xl flex items-center justify-center">9</button>
        <button onclick="pressDigit(0)" class="num-key h-10 sm:h-14 rounded-xl font-black text-xl sm:text-2xl flex items-center justify-center">0</button>
        <button onclick="submitAnswer()" class="num-key key-fire h-10 sm:h-14 rounded-xl flex items-center justify-center" aria-label="Attack">
          <svg class="w-7 h-7 sm:w-8 sm:h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </div>

    </footer>

  </div>

  <script>
    /**************************************************************************
     * 1. REALISTIC WEB AUDIO SYNTHESIZER (Roars, Strikes, Thunder, Fanfare)
     **************************************************************************/
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type, duration, vol = 0.2, slideFreq = null, delay = 0) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideFreq) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideFreq), now + duration);
        }

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      playNoise(duration, vol = 0.2, filterFreq = 800, delay = 0) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime + delay;
        const bufferSize = Math.floor(this.ctx.sampleRate * duration);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(filterFreq, now);
        filter.frequency.exponentialRampToValueAtTime(90, now + duration);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        noise.start(now);
        noise.stop(now + duration);
      }

      clickStone() {
        this.playTone(220, 'triangle', 0.05, 0.14, 110);
        this.playNoise(0.04, 0.08, 900);
      }

      animalCall(heroId) {
        if (heroId === 0) {
          // Tiger growl
          this.playTone(135, 'sawtooth', 0.28, 0.2, 65);
          this.playNoise(0.25, 0.16, 450);
        } else if (heroId === 1) {
          // Grizzly deep roar
          this.playTone(95, 'sawtooth', 0.34, 0.24, 48);
          this.playNoise(0.3, 0.2, 350);
        } else if (heroId === 2) {
          // Golden Eagle high cry
          this.playTone(1450, 'triangle', 0.24, 0.14, 920);
          this.playTone(1300, 'sine', 0.18, 0.1, 780, 0.12);
        } else if (heroId === 3) {
          // Timber Wolf howl-bark
          this.playTone(340, 'triangle', 0.32, 0.18, 520);
          this.playTone(520, 'sine', 0.22, 0.14, 380, 0.15);
        } else {
          // Crocodile hiss-bellow
          this.playTone(75, 'sawtooth', 0.3, 0.22, 42);
          this.playNoise(0.28, 0.2, 700);
        }
      }

      stepHelperCorrect() {
        this.playTone(523.25, 'triangle', 0.12, 0.15, 659.25);
        this.playTone(659.25, 'sine', 0.16, 0.15, 783.99, 0.06);
      }

      launchShot(powerRatio, heroId) {
        this.animalCall(heroId);
        const intensity = Math.max(0.3, powerRatio);
        if (intensity > 0.75) {
          this.playNoise(0.32, 0.26, 1800, 0);
          this.playTone(380, 'sawtooth', 0.3, 0.2, 110, 0);
        } else if (intensity > 0.5) {
          this.playNoise(0.22, 0.18, 1100, 0);
          this.playTone(300, 'triangle', 0.22, 0.15, 130, 0);
        } else {
          this.playNoise(0.12, 0.1, 600, 0);
          this.playTone(240, 'sine', 0.14, 0.1, 140, 0);
        }
      }

      bossImpact(powerRatio) {
        const intensity = Math.max(0.3, powerRatio);
        if (intensity > 0.75) {
          this.playNoise(0.55, 0.45, 1500, 0);
          this.playTone(115, 'sawtooth', 0.5, 0.36, 32, 0);
          this.playTone(82, 'square', 0.42, 0.24, 28, 0.04);
        } else if (intensity > 0.5) {
          this.playNoise(0.32, 0.28, 950, 0);
          this.playTone(130, 'sawtooth', 0.3, 0.24, 48, 0);
        } else {
          this.playNoise(0.16, 0.15, 450, 0);
          this.playTone(160, 'triangle', 0.16, 0.15, 80, 0);
        }
      }

      wrongAnswer() {
        this.playTone(150, 'sawtooth', 0.2, 0.2, 105, 0);
        this.playTone(130, 'sawtooth', 0.25, 0.2, 88, 0.12);
      }

      bossDefeatedFanfare() {
        this.playNoise(0.95, 0.42, 950, 0);
        this.playTone(98, 'sawtooth', 0.85, 0.34, 24, 0);

        const notes = [
          { f: 392.00, d: 0.16, t: 0.25 },
          { f: 523.25, d: 0.16, t: 0.42 },
          { f: 659.25, d: 0.16, t: 0.58 },
          { f: 783.99, d: 0.34, t: 0.75 },
          { f: 659.25, d: 0.16, t: 1.08 },
          { f: 1046.50, d: 0.65, t: 1.25 }
        ];
        notes.forEach(n => {
          this.playTone(n.f, 'triangle', n.d, 0.26, n.f * 1.005, n.t);

    // LEVEL I: Without parentheses (2–3 operations)
    // E.g. 45 - 24 : 3 + 12
    function generateLevel1() {
      const t = randInt(1, 5);

    /**************************************************************************
     * 4. UI CONTROLLERS (HERO MEDALLIONS, DOCK EXPRESSION, NUMPAD)
     **************************************************************************/
    function renderHeroMedallionBar() {
      const bar = document.getElementById('heroMedallionBar');
      bar.innerHTML = '';

      heroStates.forEach((hero) => {
        const isSelected = hero.id === selectedHeroId && hero.inSquad;
        const btn = document.createElement('div');
        btn.className = `hero-medallion w-10 h-10 sm:w-11 sm:h-11 rounded-xl flex items-center justify-center ${
          hero.inSquad ? 'in-squad' : 'opacity-40'
        } ${isSelected ? 'active-attacker' : ''}`;

        btn.onclick = (e) => {
          e.stopPropagation();
          if (!hero.inSquad) hero.inSquad = true;
          selectHeroAttacker(hero.id, true);
        };

        // Corner toggle badge to include/exclude up to 5 heroes
        const badge = document.createElement('button');
        badge.className = `absolute -top-1 -right-1 w-4 h-4 rounded-full border flex items-center justify-center ${
          hero.inSquad
            ? 'bg-lime-600 border-lime-200 text-stone-950'
            : 'bg-stone-800 border-stone-500 text-stone-400'
        }`;
        badge.innerHTML = hero.inSquad
          ? `<svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg>`
          : `<svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;

        badge.onclick = (e) => {
          e.stopPropagation();
          toggleHeroInSquad(hero.id);
        };

        btn.innerHTML = hero.svgPortrait;
        btn.appendChild(badge);
        bar.appendChild(btn);
      });

      const crest = document.getElementById('activeHeroCrest');
      const cur = heroStates[selectedHeroId];
      if (crest && cur) {
        crest.innerHTML = cur.svgPortrait;
        crest.style.borderColor = cur.colorSecondary;
      }
    }

    function toggleHeroInSquad(heroId) {
      const activeCount = heroStates.filter(h => h.inSquad).length;
      const hero = heroStates[heroId];
      if (hero.inSquad && activeCount <= 1) {
        sfx.wrongAnswer();
        return;
      }
      hero.inSquad = !hero.inSquad;
      sfx.clickStone();

      if (!hero.inSquad && selectedHeroId === heroId) {
        const firstActive = heroStates.find(h => h.inSquad);
        if (firstActive) selectedHeroId = firstActive.id;
      } else if (hero.inSquad) {
        selectedHeroId = heroId;
      }
      renderHeroMedallionBar();
    }

    function selectHeroAttacker(heroId, refreshProblem = true) {
      const hero = heroStates[heroId];
      if (!hero || !hero.inSquad) return;

      selectedHeroId = heroId;
      hero.roarAnim = 1.0;
      sfx.animalCall(heroId);
      renderHeroMedallionBar();

      if (refreshProblem) {
        startNewProblem();
      }
    }

    function setLevel(lvl) {
      currentLevel = lvl;
      sfx.clickStone();
      [1, 2, 3].forEach(n => {
        const b = document.getElementById(`lvlBtn${n}`);
        if (b) b.classList.toggle('active', n === lvl);
      });
      startNewProblem();
    }

    function startNewProblem() {
      if (bossState.isDefeated) {
        respawnBoss();
      }
      currentProblem = generateMathProblem(currentLevel);
      finalInputBuffer = '';
      stepHelperBuffers = {};
      activeInputTarget = 'final';
      taskStartTime = performance.now();
      currentPowerRatio = 1.0;
      renderExpressionStage();
    }

    function skipToNextTask() {
      sfx.clickStone();
      const activeHeroes = heroStates.filter(h => h.inSquad);
      if (activeHeroes.length > 1) {
        const idx = activeHeroes.findIndex(h => h.id === selectedHeroId);
        const nextHero = activeHeroes[(idx + 1) % activeHeroes.length];
        selectedHeroId = nextHero.id;
        nextHero.roarAnim = 0.8;
        renderHeroMedallionBar();
      }
      startNewProblem();
    }

    function renderExpressionStage() {
      const stage = document.getElementById('expressionStage');
      if (!stage || !currentProblem) return;
      stage.innerHTML = '';

      currentProblem.tokens.forEach((tok, idx) => {
        if (tok.type === 'num') {
          const el = document.createElement('div');
          el.className = 'flex flex-col items-center justify-end px-1 sm:px-1.5';
          el.innerHTML = `
            <div class="h-5 sm:h-6"></div>
            <span class="font-black text-2xl sm:text-4xl text-amber-100 tracking-tight drop-shadow-[0_2px_3px_rgba(0,0,0,0.95)]">${tok.val}</span>
          `;
          stage.appendChild(el);
        } else if (tok.type === 'paren') {
          const el = document.createElement('div');
          el.className = 'flex flex-col items-center justify-end px-0.5';
          el.innerHTML = `
            <div class="h-5 sm:h-6"></div>
            <span class="font-black text-2xl sm:text-4xl text-amber-400 drop-shadow-[0_2px_3px_rgba(0,0,0,0.95)]">${tok.val}</span>
          `;
          stage.appendChild(el);
        } else if (tok.type === 'op') {
          const valStr = stepHelperBuffers[idx] || '';
          const isFocused = activeInputTarget === idx;
          const isStepCorrect = valStr !== '' && parseInt(valStr, 10) === tok.stepAnswer;

          const col = document.createElement('div');
          col.className = 'flex flex-col items-center justify-end px-1 sm:px-1.5';

          const bubble = document.createElement('div');
          bubble.className = `op-helper-bubble min-w-[32px] sm:min-w-[40px] h-5 sm:h-6 px-1.5 rounded-md text-xs sm:text-sm font-extrabold flex items-center justify-center mb-0.5 ${
            isFocused ? 'focused-slot' : ''
          } ${isStepCorrect ? 'correct-step' : ''}`;
          bubble.textContent = valStr !== '' ? valStr : '·';
          bubble.onclick = (e) => {
            e.stopPropagation();
            sfx.clickStone();
            activeInputTarget = idx;
            renderExpressionStage();
          };

          const opSpan = document.createElement('span');
          opSpan.className = 'font-black text-2xl sm:text-4xl text-orange-400 drop-shadow-[0_2px_3px_rgba(0,0,0,0.95)]';
          opSpan.textContent = tok.val;

          col.appendChild(bubble);
          col.appendChild(opSpan);
          stage.appendChild(col);
        }
      });

      const eqCol = document.createElement('div');
      eqCol.className = 'flex flex-col items-center justify-end px-1 sm:px-2';
      eqCol.innerHTML = `
        <div class="h-5 sm:h-6"></div>
        <span class="font-black text-2xl sm:text-4xl text-amber-300 drop-shadow-[0_2px_3px_rgba(0,0,0,0.95)]">=</span>
      `;
      stage.appendChild(eqCol);

      const ansCol = document.createElement('div');
      ansCol.className = 'flex flex-col items-center justify-end pl-1';

      const ansBox = document.createElement('div');
      const isFinalFocused = activeInputTarget === 'final';
      ansBox.className = `final-answer-slot min-w-[64px] sm:min-w-[84px] h-10 sm:h-12 px-3 rounded-xl font-black text-2xl sm:text-4xl flex items-center justify-center ${
        isFinalFocused ? 'focused-slot' : ''
      }`;
      ansBox.textContent = finalInputBuffer !== '' ? finalInputBuffer : '?';
      ansBox.onclick = (e) => {
        e.stopPropagation();
        sfx.clickStone();
        activeInputTarget = 'final';
        renderExpressionStage();
      };

      ansCol.appendChild(ansBox);
      stage.appendChild(ansCol);
    }

    function pressDigit(d) {
      if (bossState.isDefeated) return;
      sfx.clickStone();

      if (activeInputTarget === 'final') {
        if (finalInputBuffer.length < 3) {
          finalInputBuffer += String(d);
        }
      } else {
        const cur = stepHelperBuffers[activeInputTarget] || '';
        if (cur.length < 3) {
          const nextVal = cur + String(d);
          stepHelperBuffers[activeInputTarget] = nextVal;
          const tok = currentProblem.tokens[activeInputTarget];
          if (tok && parseInt(nextVal, 10) === tok.stepAnswer) {
            sfx.stepHelperCorrect();
            activeInputTarget = 'final';
          }
        }
      }
      renderExpressionStage();
    }

    function pressBackspace() {
      if (bossState.isDefeated) return;
      sfx.clickStone();
      if (activeInputTarget === 'final') {
        finalInputBuffer = finalInputBuffer.slice(0, -1);
      } else {
        const cur = stepHelperBuffers[activeInputTarget] || '';
        stepHelperBuffers[activeInputTarget] = cur.slice(0, -1);
      }
      renderExpressionStage();
    }

    function submitAnswer() {
      if (bossState.isDefeated || !currentProblem) return;
      if (activeInputTarget !== 'final' && finalInputBuffer === '') {
        activeInputTarget = 'final';
        renderExpressionStage();
        return;
      }
      if (finalInputBuffer === '') {
        triggerSlateError();
        return;
      }

      const userAns = parseInt(finalInputBuffer, 10);
      if (userAns === currentProblem.answer) {
        fireHeroAttack(currentPowerRatio);
      } else {
        triggerSlateError();
      }
    }

    function triggerSlateError() {
      sfx.wrongAnswer();
      const slate = document.getElementById('expressionStage');
      slate.classList.remove('shake-error');
      void slate.offsetWidth;
      slate.classList.add('shake-error');
      finalInputBuffer = '';
      renderExpressionStage();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        e.preventDefault();
        pressDigit(parseInt(e.key, 10));
      } else if (e.key === 'Backspace' || e.key === 'Delete') {
        e.preventDefault();
        pressBackspace();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        submitAnswer();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        skipToNextTask();
      }
    });

    /**************************************************************************
     * 5. BATTLE ENGINE: PROJECTILES, TIME-DECAYED POWER & VICTORY
     **************************************************************************/
    const projectiles = [];
    const particles = [];
    const shockwaves = [];
    let screenShake = 0;

    function calculateCurrentPowerRatio(now) {
      const elapsed = Math.max(0, now - taskStartTime - GRACE_TIME_MS);
      const decayProgress = Math.min(1, elapsed / DECAY_DURATION_MS);
      // Scales from 1.0 (30 dmg -> 5 hits) down to 0.3333 (10 dmg -> 15 hits)
      return 1.0 - decayProgress * (2 / 3);
    }

    function updatePowerBarUI(now) {
      if (bossState.isDefeated) return;
      currentPowerRatio = calculateCurrentPowerRatio(now);
      const barFill = document.getElementById('powerBarFill');
      if (barFill) {
        barFill.style.width = `${(currentPowerRatio * 100).toFixed(1)}%`;
      }
    }

    function fireHeroAttack(powerRatio) {
      const attacker = heroStates[selectedHeroId] || heroStates[0];
      attacker.attackAnim = 1.0;
      attacker.roarAnim = 1.0;

      const damage = Math.round(30 * powerRatio);
      sfx.launchShot(powerRatio, attacker.id);

      const startX = attacker.screenX + 45;
      const startY = attacker.screenY - 22;
      const targetX = bossState.screenX - 45;
      const targetY = bossState.screenY - 55;

      projectiles.push({
        x: startX,
        y: startY,
        startX,
        startY,
        targetX,
        targetY,
        progress: 0,
        speed: 0.032 + powerRatio * 0.018,
        powerRatio,
        damage,
        colorPrimary: attacker.colorPrimary,
        colorSecondary: attacker.colorSecondary,
        projectileColor: attacker.projectileColor,
        angle: 0
      });

      const burstCount = Math.floor(12 + powerRatio * 24);
      for (let i = 0; i < burstCount; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * (4 + powerRatio * 6);
        particles.push({
          x: startX,
          y: startY,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          size: 2.5 + Math.random() * (3.5 + powerRatio * 5),
          color: i % 2 === 0 ? attacker.colorSecondary : attacker.projectileColor,
          alpha: 1,
          decay: 0.028 + Math.random() * 0.02,
          gravity: 0.06
        });
      }

      if (bossState.hp - damage > 0) {
        startNewProblem();
      } else {
        finalInputBuffer = '';
        renderExpressionStage();
      }
    }

    function onProjectileHitBoss(proj) {
      sfx.bossImpact(proj.powerRatio);
      bossState.hp = Math.max(0, bossState.hp - proj.damage);
      bossState.hurtAnim = 1.0;
      bossState.roarAnim = 1.0;

      screenShake = proj.powerRatio > 0.75 ? 20 : proj.powerRatio > 0.5 ? 10 : 4;

      shockwaves.push({
        x: proj.targetX,
        y: proj.targetY,
        radius: 10,
        maxRadius: 55 + proj.powerRatio * 125,
        color: proj.colorSecondary,
        alpha: 1.0,
        lineWidth: 3 + proj.powerRatio * 7
      });

      const count = Math.floor(18 + proj.powerRatio * 55);
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * (5 + proj.powerRatio * 12);
        particles.push({
          x: proj.targetX,
          y: proj.targetY,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 2,
          size: 2.5 + Math.random() * (4 + proj.powerRatio * 6),
          color: i % 3 === 0 ? '#fef3c7' : i % 2 === 0 ? proj.colorSecondary : proj.colorPrimary,
          alpha: 1,
          decay: 0.018 + Math.random() * 0.02,
          gravity: 0.16
        });
      }

      if (bossState.hp <= 0 && !bossState.isDefeated) {
        triggerBossDefeat();
      }
    }

    function triggerBossDefeat() {
      bossState.isDefeated = true;
      bossState.defeatAnim = 0.01;
      bossState.defeatTimer = 0;
      screenShake = 28;
      sfx.bossDefeatedFanfare();

      heroStates.forEach(h => {
        if (h.inSquad) h.roarAnim = 1.4;
      });

      for (let i = 0; i < 90; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 3 + Math.random() * 14;
        particles.push({
          x: bossState.screenX,
          y: bossState.screenY - 40,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 3,
          size: 4 + Math.random() * 9,
          color: pickRandom(['#f59e0b', '#ef4444', '#fde047', '#a8a29e']),
          alpha: 1,
          decay: 0.012 + Math.random() * 0.015,
          gravity: 0.14
        });
      }

      for (let f = 0; f < 8; f++) {
        setTimeout(() => {
          if (!bossState.isDefeated) return;
          spawnFirework();
        }, f * 440);
      }
    }

    function spawnFirework() {
      sfx.fireworkPop();
      const fx = canvas.width * (0.2 + Math.random() * 0.6);
      const fy = canvas.height * (0.15 + Math.random() * 0.38);
      const palette = pickRandom([
        ['#fde047', '#f59e0b', '#fef3c7'],
        ['#bef264', '#65a30d', '#ecfccb'],
        ['#38bdf8', '#0284c7', '#e0f2fe'],
        ['#fb923c', '#ea580c', '#ffedd5']
      ]);

      shockwaves.push({
        x: fx,
        y: fy,
        radius: 5,
        maxRadius: 85 + Math.random() * 45,
        color: palette[0],
        alpha: 0.85,
        lineWidth: 2.5
      });

      for (let i = 0; i < 40; i++) {
        const ang = (Math.PI * 2 * i) / 40;
        const spd = 2 + Math.random() * 6.5;
        particles.push({
          x: fx,
          y: fy,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          size: 3 + Math.random() * 4,
          color: pickRandom(palette),
          alpha: 1,
          decay: 0.016 + Math.random() * 0.012,
          gravity: 0.07
        });
      }
    }

    function respawnBoss() {
      bossState.hp = BOSS_MAX_HP;
      bossState.displayHp = BOSS_MAX_HP;
      bossState.isDefeated = false;
      bossState.defeatAnim = 0;
      bossState.hurtAnim = 0;
      bossState.variant = (bossState.variant + 1) % 3;
      startNewProblem();
    }

    /**************************************************************************
     * 6. REALISTIC WILDERNESS CANYON STAGE & ANATOMICAL CHARACTER RENDERING
     **************************************************************************/
    const canvas = document.getElementById('arenaCanvas');
    const ctx = canvas.getContext('2d');

    const waterfallDrops = Array.from({ length: 65 }, () => ({
      xOffset: (Math.random() - 0.5) * 44,
      yProgress: Math.random(),
      speed: 0.01 + Math.random() * 0.012,
      length: 16 + Math.random() * 24
    }));

    const embers = Array.from({ length: 38 }, () => ({
      x: Math.random(),
      y: Math.random(),
      size: 1.2 + Math.random() * 2.4,
      vx: (Math.random() - 0.5) * 0.0005,
      vy: -0.0004 - Math.random() * 0.0006,
      phase: Math.random() * Math.PI * 2
    }));

    function resizeCanvas() {
      const parent = canvas.parentElement;
      canvas.width = parent.clientWidth;
      canvas.height = parent.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    // Click directly on any realistic animal hero on the battlefield to select them & generate a problem
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      for (const hero of heroStates) {
        if (!hero.inSquad) continue;
        const dx = mx - hero.screenX;
        const dy = my - (hero.screenY - 25);
        if (Math.hypot(dx, dy) <= hero.hitRadius) {
          selectHeroAttacker(hero.id, true);
          shockwaves.push({
            x: hero.screenX,
            y: hero.screenY - 15,
            radius: 10,
            maxRadius: 65,
            color: hero.colorSecondary,
            alpha: 0.9,
            lineWidth: 3
          });
          return;
        }
      }
    });

    function drawRealisticWildernessStage(W, H, t) {
      // 1. Golden-Hour Dramatic Sunset Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
      skyGrad.addColorStop(0, '#131829');
      skyGrad.addColorStop(0.3, '#2d2438');
      skyGrad.addColorStop(0.62, '#7c3a2b');
      skyGrad.addColorStop(0.85, '#c25e29');
      skyGrad.addColorStop(1, '#e08e45');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, H);

      // Warm Golden Sun Glow in Canyon Gap
      const sunX = W * 0.49;
      const sunY = H * 0.48;
      const sunG = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, W * 0.32);
      sunG.addColorStop(0, 'rgba(254, 240, 138, 0.55)');
      sunG.addColorStop(0.35, 'rgba(245, 158, 11, 0.25)');
      sunG.addColorStop(1, 'rgba(245, 158, 11, 0)');
      ctx.fillStyle = sunG;
      ctx.fillRect(0, 0, W, H);

      // 2. Layered Distant Mountain Ridges with Atmospheric Perspective
      ctx.fillStyle = '#251e2b';
      ctx.beginPath();
      ctx.moveTo(0, H * 0.65);
      ctx.lineTo(W * 0.12, H * 0.28);
      ctx.lineTo(W * 0.24, H * 0.45);
      ctx.lineTo(W * 0.39, H * 0.22);
      ctx.lineTo(W * 0.52, H * 0.54);
      ctx.lineTo(W * 0.69, H * 0.18);
      ctx.lineTo(W * 0.84, H * 0.38);
      ctx.lineTo(W, H * 0.25);
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.closePath();
      ctx.fill();

      // Sunlit Mountain Ridge Highlights
      ctx.fillStyle = 'rgba(251, 146, 60, 0.14)';
      ctx.beginPath();
      ctx.moveTo(W * 0.39, H * 0.22);
      ctx.lineTo(W * 0.46, H * 0.42);
      ctx.lineTo(W * 0.38, H * 0.48);
      ctx.closePath();
      ctx.fill();

      // 3. Midground Pine Forest Ridge & Canyon Waterfall
      ctx.fillStyle = '#1b1d1c';
      ctx.beginPath();
      ctx.moveTo(0, H * 0.56);
      ctx.lineTo(W * 0.36, H * 0.46);
      ctx.lineTo(W * 0.48, H * 0.46);
      ctx.lineTo(W * 0.55, H * 0.72);
      ctx.lineTo(W, H * 0.52);
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.closePath();
      ctx.fill();

      // Pine Tree Silhouettes along Left & Right Ridges
      drawPineSilhouettes(W, H);

      // Realistic Cascading Waterfall at X = 0.43 * W
      const wfX = W * 0.43;
      const wfTop = H * 0.46;
      const wfBot = H * 0.92;
      const wfGrad = ctx.createLinearGradient(wfX, wfTop, wfX, wfBot);
      wfGrad.addColorStop(0, 'rgba(224, 242, 254, 0.55)');
      wfGrad.addColorStop(0.6, 'rgba(125, 211, 252, 0.35)');
      wfGrad.addColorStop(1, 'rgba(56, 189, 248, 0.08)');
      ctx.fillStyle = wfGrad;
      ctx.fillRect(wfX - 28, wfTop, 56, wfBot - wfTop);

      ctx.strokeStyle = 'rgba(240, 249, 255, 0.65)';
      ctx.lineWidth = 1.8;
      waterfallDrops.forEach(d => {
        d.yProgress = (d.yProgress + d.speed) % 1;
        const dy = wfTop + d.yProgress * (wfBot - wfTop);
        ctx.beginPath();
        ctx.moveTo(wfX + d.xOffset, dy);
        ctx.lineTo(wfX + d.xOffset, Math.min(wfBot, dy + d.length));
        ctx.stroke();
      });

      // 4. Foreground Left Rocky Outcrops (For the 5 Wildlife Heroes)
      const leftBankGrad = ctx.createLinearGradient(0, H * 0.55, 0, H);
      leftBankGrad.addColorStop(0, '#3a2e25');
      leftBankGrad.addColorStop(0.5, '#261d17');
      leftBankGrad.addColorStop(1, '#140f0c');
      ctx.fillStyle = leftBankGrad;
      ctx.beginPath();
      ctx.moveTo(0, H * 0.58);
      ctx.lineTo(W * 0.41, H * 0.68);
      ctx.lineTo(W * 0.46, H);
      ctx.lineTo(0, H);
      ctx.closePath();
      ctx.fill();

      // 5. Foreground Right Volcanic Boulder Crag (For the Anti-Hero Monster)
      const rightCragGrad = ctx.createLinearGradient(W * 0.55, H * 0.52, W, H);
      rightCragGrad.addColorStop(0, '#2e2220');
      rightCragGrad.addColorStop(0.5, '#1d1413');
      rightCragGrad.addColorStop(1, '#0f0a09');
      ctx.fillStyle = rightCragGrad;
      ctx.beginPath();
      ctx.moveTo(W, H * 0.54);
      ctx.lineTo(W * 0.58, H * 0.64);
      ctx.lineTo(W * 0.53, H);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();

      // Glowing Sunset Spores / Embers
      embers.forEach(e => {
        e.x = (e.x + e.vx + 1) % 1;
        e.y = (e.y + e.vy + 1) % 1;
        const alpha = 0.3 + 0.6 * Math.abs(Math.sin(t * 2 + e.phase));
        ctx.fillStyle = `rgba(253, 224, 71, ${alpha})`;
        ctx.beginPath();
        ctx.arc(e.x * W, e.y * H, e.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawPineSilhouettes(W, H) {
      ctx.fillStyle = '#141916';
      const trees = [
        [0.04, 0.55, 28], [0.09, 0.53, 34], [0.16, 0.51, 26],
        [0.23, 0.49, 32], [0.31, 0.47, 25], [0.62, 0.58, 28],
        [0.92, 0.51, 36], [0.96, 0.50, 30]
      ];
      trees.forEach(([xr, yr, h]) => {
        const tx = W * xr;
        const ty = H * yr;
        for (let tier = 0; tier < 3; tier++) {
          const tw = (12 - tier * 2.5);
          const th = ty - tier * (h * 0.28);
          ctx.beginPath();
          ctx.moveTo(tx - tw, th);
          ctx.lineTo(tx, th - h * 0.45);
          ctx.lineTo(tx + tw, th);
          ctx.closePath();
          ctx.fill();
        }
      });
    }

    /**************************************************************************
     * 7. ANATOMICAL MULTI-LAYERED REALISTIC WILDLIFE HEROES (NO PRIMITIVES!)
     **************************************************************************/
    function drawHeroesSquad(W, H, t) {
      // Non-overlapping tiered natural rock ledges across the left bank
      const ledges = [
        { x: W * 0.33, y: H * 0.78, scale: 0.96 }, // 0: Amur Tiger (Front Vanguard)
        { x: W * 0.19, y: H * 0.68, scale: 0.94 }, // 1: Grizzly Bear (Mid Center)
        { x: W * 0.27, y: H * 0.36, scale: 0.92 }, // 2: Golden Eagle (Perched/Hovering High)
        { x: W * 0.08, y: H * 0.58, scale: 0.88 }, // 3: Timber Wolf (Upper Left Ridge)
        { x: W * 0.11, y: H * 0.85, scale: 0.94 }  // 4: Saltwater Crocodile (Lower Riverbank)
      ];

      heroStates.forEach((hero, idx) => {
        if (!hero.inSquad) return;

        const pos = ledges[idx];
        hero.screenX = pos.x;
        hero.screenY = pos.y;

        if (hero.attackAnim > 0) hero.attackAnim = Math.max(0, hero.attackAnim - 0.04);
        if (hero.roarAnim > 0) hero.roarAnim = Math.max(0, hero.roarAnim - 0.035);

        const isSelected = hero.id === selectedHeroId;
        const lungeX = Math.sin(hero.attackAnim * Math.PI) * 34;
        const leapY = -Math.sin(hero.attackAnim * Math.PI) * 18;
        const breathe = Math.sin(t * 2.8 + hero.animPhase) * 2.2;
        const jawOpen = Math.sin(hero.roarAnim * Math.PI) * 0.38;

        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.scale(pos.scale, pos.scale);

        // Natural Stratified Granite Ledge under each hero
        drawNaturalRockOutcrop(0, 8, isSelected, hero.colorPrimary, hero.colorSecondary, t);

        ctx.translate(lungeX, leapY);

        // Subtle golden rim-light aura around active hero
        if (isSelected && !bossState.isDefeated) {
          const rad = 48 + currentPowerRatio * 18;
          const g = ctx.createRadialGradient(0, -25, 6, 0, -25, rad);
          g.addColorStop(0, hero.glowColor);
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(0, -25, rad, 0, Math.PI * 2);
          ctx.fill();
        }

        // Render detailed anatomical wildlife warrior
        if (hero.type === 'tiger') {
          drawRealisticTiger(t + hero.animPhase, breathe, jawOpen, hero.attackAnim);
        } else if (hero.type === 'bear') {
          drawRealisticGrizzly(t + hero.animPhase, breathe, jawOpen, hero.attackAnim);
        } else if (hero.type === 'eagle') {
          drawRealisticEagle(t + hero.animPhase, breathe, jawOpen, hero.attackAnim);
        } else if (hero.type === 'wolf') {
          drawRealisticWolf(t + hero.animPhase, breathe, jawOpen, hero.attackAnim);
        } else if (hero.type === 'croc') {
          drawRealisticCrocodile(t + hero.animPhase, breathe, jawOpen, hero.attackAnim);
        }

        ctx.restore();
      });
    }

    function drawNaturalRockOutcrop(x, y, isSelected, c1, c2, t) {

    // 1. REALISTIC AMUR TIGER (Multi-layered muscular anatomy, curved stripes, hinged roaring jaw)
    function drawRealisticTiger(t, breathe, jawOpen, attack) {

      ctx.beginPath();
      ctx.moveTo(-38, -22 + breathe * 0.5);
      ctx.bezierCurveTo(-32, -40 + breathe, -8, -38 + breathe, 10, -40 + breathe);
      ctx.bezierCurveTo(24, -42 + breathe, 32, -32 + breathe, 30, -18);
      ctx.bezierCurveTo(16, -10, -14, -10, -34, -14);

      // Near Hind Haunch & Muscular Foreleg

      ctx.beginPath();

      // Tiger Black Anatomical Stripes along flanks and shoulders

      const stripes = [
        [[-28, -34], [-24, -20], [-29, -12]],

        [[2, -38], [4, -24], [1, -17]],

      // Detailed Tiger Head, Cheek Ruff & Articulated Jaw

      ctx.restore();

    // 5. REALISTIC SALTWATER CROCODILE (Dorsal osteoderm scutes, serrated tail, snapping toothed maw)
    function drawRealisticCrocodile(t, breathe, jawOpen, attack) {
      const tailSway = Math.sin(t * 2.6) * 5;

      // Muscular Serrated Tail
      ctx.fillStyle = '#365314';
      ctx.strokeStyle = '#65a30d';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-24, -10);
      ctx.quadraticCurveTo(-52, -14 + tailSway, -68, -4 + tailSway);
      ctx.quadraticCurveTo(-48, 4 + tailSway, -20, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Tail Dorsal Scutes
      ctx.fillStyle = '#1a2e05';
      for (let sc = -28; sc >= -58; sc -= 8) {
        ctx.beginPath();
        ctx.moveTo(sc, -10 + tailSway * 0.5);
        ctx.lineTo(sc - 4, -17 + tailSway * 0.5);
        ctx.lineTo(sc - 7, -9 + tailSway * 0.5);
        ctx.fill();
      }

      // Armored Crocodilian Torso & Belly Scales
      const crocG = ctx.createLinearGradient(0, -24, 0, 4);
      crocG.addColorStop(0, '#1a2e05');
      crocG.addColorStop(0.6, '#3f6212');
      crocG.addColorStop(1, '#d9f99d');
      ctx.fillStyle = crocG;

      ctx.beginPath();
      ctx.ellipse(-2, -10 + breathe * 0.5, 28, 11, 0, 0, Math.PI * 2);
      ctx.fill();

      // Squat Muscular Reptile Legs with Webbed Claws
      ctx.fillStyle = '#365314';
      ctx.fillRect(-18, -6, 10, 12);
      ctx.fillRect(10, -6, 11, 12);

      // Long Toothed Reptilian Jaws (Upper Jaw lifts open on roar/attack!)
      ctx.save();
      ctx.translate(22, -12 + breathe * 0.6);

      // Lower Jaw
      ctx.fillStyle = '#4d7c0f';
      ctx.beginPath();
      ctx.moveTo(-2, 2);
      ctx.lineTo(28, 3);
      ctx.lineTo(25, 8);
      ctx.lineTo(-4, 8);
      ctx.closePath();
      ctx.fill();

      // Hinged Upper Skull & Snout
      ctx.save();
      ctx.rotate(-(jawOpen * 1.2 + attack * 0.35));

      // Interlocking Conical White Teeth
      ctx.fillStyle = '#fefce8';
      for (let th = 4; th <= 24; th += 4.5) {
        ctx.beginPath();
        ctx.moveTo(th, 1);
        ctx.lineTo(th + 1.5, 5.5);
        ctx.lineTo(th + 3, 1);
        ctx.fill();
      }

      ctx.fillStyle = '#365314';
      ctx.beginPath();
      ctx.moveTo(-6, -8);
      ctx.lineTo(6, -8);
      ctx.lineTo(28, -3);
      ctx.lineTo(28, 2);
      ctx.lineTo(-4, 2);
      ctx.closePath();
      ctx.fill();

      // Slit-Pupil Reptile Eye
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.ellipse(2, -6, 3.2, 2.4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.fillRect(1.5, -8, 1.2, 4);
      ctx.restore();

      ctx.restore();
    }

    /**************************************************************************
     * 8. TERRIFYING PREHISTORIC APEX BOSSES (Giganotosaur, Sabertooth, Leviathan)
     **************************************************************************/
    function drawAntiHeroBoss(W, H, t) {
      const bx = W * 0.78;
      const by = H * 0.72;
      bossState.screenX = bx;
      bossState.screenY = by;

      if (bossState.hurtAnim > 0) bossState.hurtAnim = Math.max(0, bossState.hurtAnim - 0.045);
      if (bossState.roarAnim > 0) bossState.roarAnim = Math.max(0, bossState.roarAnim - 0.035);

      if (bossState.isDefeated) {
        bossState.defeatAnim = Math.min(1, bossState.defeatAnim + 0.016);
        bossState.defeatTimer += 1 / 60;
        if (bossState.defeatTimer > 4.5) {
          respawnBoss();
        }
      }

      bossState.displayHp += (bossState.hp - bossState.displayHp) * 0.14;

      ctx.save();
      ctx.translate(bx, by);

      if (bossState.isDefeated) {
        const d = bossState.defeatAnim;
        ctx.translate(d * 40, d * 75);
        ctx.rotate(d * Math.PI * 0.55);
        ctx.globalAlpha = Math.max(0, 1 - d * 0.85);
      } else if (bossState.hurtAnim > 0) {
        const recoil = Math.sin(bossState.hurtAnim * Math.PI * 6) * 12;
        ctx.translate(recoil, -bossState.hurtAnim * 8);
      }

      const breathe = Math.sin(t * 2.4) * 4;
      const jawOpen = 0.14 + Math.abs(Math.sin(t * 1.8)) * 0.16 + bossState.roarAnim * 0.35;

      const variant = bossState.variant % 3;
      if (variant === 0) {
        drawApexGiganotosaur(t, breathe, jawOpen);
      } else if (variant === 1) {
        drawApexSabertoothBeast(t, breathe, jawOpen);
      } else {
        drawApexSwampLeviathan(t, breathe, jawOpen);
      }

      ctx.restore();

      if (!bossState.isDefeated) {
        drawBossHealthBar(bx, H * 0.14);
      }
    }

    // BOSS 1: Towering Scarred Apex Giganotosaur / Tyrannosaur
    function drawApexGiganotosaur(t, breathe, jawOpen) {
      const tailSway = Math.sin(t * 2) * 10;

      // Ground shadow
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.beginPath();
      ctx.ellipse(0, 12, 85, 18, 0, 0, Math.PI * 2);
      ctx.fill();

      // Heavy Muscular Tail Counterbalance
      const skinG = ctx.createLinearGradient(-40, -130, 60, 0);
      skinG.addColorStop(0, '#3f231c');
      skinG.addColorStop(0.55, '#5c3428');
      skinG.addColorStop(1, '#1f120e');
      ctx.fillStyle = skinG;

      ctx.beginPath();
      ctx.moveTo(35, -75 + breathe);
      ctx.quadraticCurveTo(105, -88 + tailSway, 145, -62 + tailSway);
      ctx.quadraticCurveTo(95, -42 + tailSway, 28, -42 + breathe);
      ctx.closePath();
      ctx.fill();

      // Far Muscular Hind Leg
      ctx.fillStyle = '#291712';
      ctx.beginPath();
      ctx.moveTo(-8, -50);
      ctx.lineTo(-24, -15);
      ctx.lineTo(-12, 8);
      ctx.lineTo(-28, 8);
      ctx.lineTo(4, -15);
      ctx.lineTo(14, -50);
      ctx.closePath();
      ctx.fill();

      // Massive Theropod Torso & Dorsal Ridge Osteoderms
      ctx.fillStyle = skinG;
      ctx.beginPath();
      ctx.ellipse(4, -68 + breathe, 56, 36, -0.25, 0, Math.PI * 2);
      ctx.fill();

      // Dorsal Spines along Back
      ctx.fillStyle = '#1c100c';
      for (let s = -32; s <= 44; s += 10) {
        ctx.beginPath();
        ctx.moveTo(s, -95 + s * 0.2 + breathe);
        ctx.lineTo(s + 4, -108 + s * 0.2 + breathe);
        ctx.lineTo(s + 9, -93 + s * 0.2 + breathe);
        ctx.fill();
      }

      // Near Powerful Hind Leg with Three Taloned Toes
      ctx.fillStyle = '#4a2920';
      ctx.beginPath();
      ctx.ellipse(16, -42, 22, 30, 0.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(6, -22);
      ctx.lineTo(-6, 10);
      ctx.lineTo(16, 10);
      ctx.lineTo(24, -22);
      ctx.closePath();
      ctx.fill();

      // Clawed Theropod Forearm
      ctx.strokeStyle = '#3f231c';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(-36, -62 + breathe);
      ctx.lineTo(-52, -46 + breathe);
      ctx.lineTo(-46, -38 + breathe);
      ctx.stroke();

      // Colossal Theropod Skull & Serrated Hinged Jaw (Facing Left toward Heroes)
      ctx.save();
      ctx.translate(-42, -96 + breathe * 1.2);

      // Hinged Lower Jaw with Curved Teeth
      ctx.save();
      ctx.translate(4, 12);
      ctx.rotate(-jawOpen);

      ctx.fillStyle = '#7f1d1d';
      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.lineTo(-32, 0);
      ctx.lineTo(0, 2);
      ctx.closePath();
      ctx.fill();

      // Lower Serrated Teeth
      ctx.fillStyle = '#fef3c7';
      for (let tx = -8; tx >= -44; tx -= 7) {
        ctx.beginPath();
        ctx.moveTo(tx, 0);
        ctx.lineTo(tx - 2, -8);
        ctx.lineTo(tx - 5, 0);
        ctx.fill();
      }

      ctx.fillStyle = '#3f231c';
      ctx.beginPath();
      ctx.moveTo(8, -2);
      ctx.lineTo(-48, 0);
      ctx.lineTo(-44, 12);
      ctx.lineTo(6, 12);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Upper Serrated Teeth
      ctx.fillStyle = '#fef3c7';
      for (let tx = -6; tx >= -48; tx -= 7.5) {
        ctx.beginPath();
        ctx.moveTo(tx, 8);
        ctx.lineTo(tx - 2.5, 18);
        ctx.lineTo(tx - 5.5, 8);
        ctx.fill();
      }

      // Upper Cranium, Nasal Horn Ridges & Fenestrae Shadows
      ctx.fillStyle = '#4a2920';
      ctx.beginPath();
      ctx.moveTo(14, -18);
      ctx.lineTo(-22, -22);
      ctx.lineTo(-54, -8);
      ctx.lineTo(-52, 10);
      ctx.lineTo(12, 10);
      ctx.closePath();
      ctx.fill();

      // Scarred Brow Horn & Glowing Predator Slit Eye
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.ellipse(-14, -8, 4.5, 3.2, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(-14.8, -11, 1.5, 6);

      ctx.restore();
    }

    // BOSS 2: Giant Prehistoric Sabertooth Smilodon Beast
    function drawApexSabertoothBeast(t, breathe, jawOpen) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.beginPath();
      ctx.ellipse(0, 12, 82, 16, 0, 0, Math.PI * 2);
      ctx.fill();

      // Heavy Muscular Fore & Hind Limbs
      ctx.fillStyle = '#27272a';
      ctx.beginPath();
      ctx.roundRect(-45, -45, 22, 55, 8);
      ctx.roundRect(22, -45, 22, 55, 8);
      ctx.fill();

      // Bristling Dark Prehistoric Mane & Massive Shoulders
      const bodyG = ctx.createLinearGradient(-50, -95, 50, -10);
      bodyG.addColorStop(0, '#18181b');
      bodyG.addColorStop(0.5, '#3f3f46');
      bodyG.addColorStop(1, '#27272a');
      ctx.fillStyle = bodyG;

      ctx.beginPath();
      ctx.moveTo(52, -32);
      ctx.bezierCurveTo(48, -75 + breathe, 10, -82 + breathe, -28, -92 + breathe);
      ctx.lineTo(-52, -35);
      ctx.closePath();
      ctx.fill();

      // Skull & Giant 25cm Curved Ivory Saber Canines
      ctx.save();
      ctx.translate(-48, -72 + breathe);

      // Lower Jaw
      ctx.save();
      ctx.rotate(-jawOpen);
      ctx.fillStyle = '#27272a';
      ctx.beginPath();
      ctx.moveTo(0, 6); ctx.lineTo(-32, 8); ctx.lineTo(-28, 16); ctx.lineTo(2, 14);
      ctx.fill();
      ctx.restore();

      // Cranium
      ctx.fillStyle = '#3f3f46';
      ctx.beginPath();
      ctx.arc(-8, -4, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(-36, -10, 28, 18);

      // Giant Curved Ivory Saber Tusks
      ctx.fillStyle = '#fef3c7';
      ctx.strokeStyle = '#d6d3d1';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-24, 6);
      ctx.quadraticCurveTo(-30, 26, -18, 34);
      ctx.quadraticCurveTo(-18, 20, -15, 6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Glowing Crimson Eye
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(-14, -6, 3.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // BOSS 3: Colossal Armored Swamp Leviathan
    function drawApexSwampLeviathan(t, breathe, jawOpen) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.beginPath();
      ctx.ellipse(0, 12, 88, 18, 0, 0, Math.PI * 2);
      ctx.fill();

      // Coiled Serpentine Armored Body Segments
      for (let c = 3; c >= 0; c--) {
        const cx = c * 22 - 15;
        const cy = -28 - c * 14 + Math.sin(t * 2.5 + c) * 6;
        ctx.fillStyle = c % 2 === 0 ? '#115e59' : '#134e4a';
        ctx.strokeStyle = '#2dd4bf';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 38 - c * 4, 24 - c * 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // Leviathan Head, Fin Frills & Fanged Maw
      ctx.save();
      ctx.translate(-38, -86 + breathe);

      ctx.save();
      ctx.rotate(-jawOpen);
      ctx.fillStyle = '#134e4a';
      ctx.beginPath();
      ctx.moveTo(0, 8); ctx.lineTo(-44, 12); ctx.lineTo(-38, 20); ctx.lineTo(4, 16);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#0f766e';
      ctx.beginPath();
      ctx.moveTo(12, -16);
      ctx.lineTo(-46, -4);
      ctx.lineTo(-44, 8);
      ctx.lineTo(12, 8);
      ctx.closePath();
      ctx.fill();

      // Venomous fangs
      ctx.fillStyle = '#ecfccb';
      ctx.beginPath();
      ctx.moveTo(-36, 8); ctx.lineTo(-34, 20); ctx.lineTo(-30, 8);
      ctx.moveTo(-22, 8); ctx.lineTo(-20, 18); ctx.lineTo(-16, 8);
      ctx.fill();

      ctx.fillStyle = '#a3e635';
      ctx.beginPath();
      ctx.arc(-14, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawBossHealthBar(x, y) {
      const barW = 210;
      const barH = 20;
      const left = x - barW / 2;

      ctx.fillStyle = '#140e0c';
      ctx.strokeStyle = '#785a40';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(left - 5, y - 4, barW + 10, barH + 8, 10);
      ctx.fill();
      ctx.stroke();

      const hpRatio = Math.max(0, bossState.displayHp / BOSS_MAX_HP);
      if (hpRatio > 0) {
        const fillGrad = ctx.createLinearGradient(left, y, left + barW, y);
        fillGrad.addColorStop(0, '#991b1b');
        fillGrad.addColorStop(0.5, '#dc2626');
        fillGrad.addColorStop(1, '#f59e0b');
        ctx.fillStyle = fillGrad;
        ctx.beginPath();
        ctx.roundRect(left, y, barW * hpRatio, barH, 6);
        ctx.fill();
      }

      // 15 Sub-Notches (10 HP each) & 5 Major Notches (30 HP each)
      for (let i = 1; i < 15; i++) {
        const nx = left + (barW * i) / 15;
        const isMajor = i % 3 === 0;
        ctx.strokeStyle = isMajor ? 'rgba(254, 243, 199, 0.75)' : 'rgba(0, 0, 0, 0.55)';
        ctx.lineWidth = isMajor ? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(nx, y);
        ctx.lineTo(nx, y + (isMajor ? barH : barH * 0.5));
        ctx.stroke();
      }
    }

    /**************************************************************************
     * 9. PROJECTILES, SHOCKWAVES & PARTICLES LOOP
     **************************************************************************/
    function updateAndDrawEffects() {
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.progress += p.speed;
        p.angle += 0.25;

        const arcHeight = 40 + p.powerRatio * 55;
        p.x = p.startX + (p.targetX - p.startX) * p.progress;
        p.y = p.startY + (p.targetY - p.startY) * p.progress - Math.sin(p.progress * Math.PI) * arcHeight;

        const trailCount = p.powerRatio > 0.75 ? 3 : p.powerRatio > 0.5 ? 2 : 1;
        for (let tr = 0; tr < trailCount; tr++) {
          particles.push({
            x: p.x + (Math.random() - 0.5) * 12 * p.powerRatio,
            y: p.y + (Math.random() - 0.5) * 12 * p.powerRatio,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            size: 2.5 + p.powerRatio * 7,
            color: tr % 2 === 0 ? p.colorSecondary : p.projectileColor,
            alpha: 0.85,
            decay: 0.045,
            gravity: 0
          });
        }

        const rad = 6 + p.powerRatio * 18;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);

        const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, rad * 2);
        glow.addColorStop(0, '#fef3c7');
        glow.addColorStop(0.45, p.colorSecondary);
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, rad * 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        if (p.progress >= 1.0) {
          onProjectileHitBoss(p);
          projectiles.splice(i, 1);
        }
      }

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += (sw.maxRadius - sw.radius) * 0.16;
        sw.alpha -= 0.04;
        if (sw.alpha <= 0) {
          shockwaves.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = Math.max(0, sw.alpha);
        ctx.strokeStyle = sw.color;
        ctx.lineWidth = sw.lineWidth;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vy += pt.gravity;
        pt.alpha -= pt.decay;
        if (pt.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = Math.max(0, pt.alpha);
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function animateLoop(now) {
      const t = now * 0.001;
      const W = canvas.width;
      const H = canvas.height;

      updatePowerBarUI(now);

      ctx.save();
      if (screenShake > 0.3) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        screenShake *= 0.88;
      } else {
        screenShake = 0;
      }

      drawRealisticWildernessStage(W, H, t);
      drawHeroesSquad(W, H, t);
      drawAntiHeroBoss(W, H, t);
      updateAndDrawEffects();

      ctx.restore();
      requestAnimationFrame(animateLoop);
    }

    window.onload = function () {
      resizeCanvas();
      renderHeroMedallionBar();
      startNewProblem();
      requestAnimationFrame(animateLoop);
    };
  </script>
