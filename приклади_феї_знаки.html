// ==========================================
// WEB AUDIO SYNTHESIZER (Zero External Files)
// ==========================================
class ForestAudio {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.ambientStarted = false;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        this.ctx = new AudioCtx();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  // Plucked harp / celesta note
  playNote(freq, timeOffset = 0, duration = 1.6, volume = 0.14, type = 'triangle') {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;

    const now = this.ctx.currentTime + timeOffset;
    const osc1 = this.ctx.createOscillator();
    const osc2 = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    const filter = this.ctx.createBiquadFilter();

    osc1.type = type;
    osc1.frequency.setValueAtTime(freq, now);

    // Harmonic overtone for realistic acoustic shimmer
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(freq * 2, now);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(freq * 4, now);
    filter.frequency.exponentialRampToValueAtTime(freq * 1.2, now + duration);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(volume, now + 0.025);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    const gain2 = this.ctx.createGain();
    gain2.gain.setValueAtTime(volume * 0.35, now);
    gain2.gain.exponentialRampToValueAtTime(0.0001, now + duration * 0.6);

    osc1.connect(filter);
    osc2.connect(gain2);
    gain2.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);

    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + duration + 0.05);
    osc2.stop(now + duration + 0.05);
  }

  // Stage-specific magical progression fanfare (stages 1..4)
  playSuccessStage(stage) {
    if (this.muted) return;
    this.init();
    const chords = [
      // Stage 1: Warm Lydian awakening (Blooming lower branches)
      [293.66, 369.99, 440.00, 554.37, 587.33, 739.99],
      // Stage 2: Ethereal Elf flight arpeggio + bird song
      [329.63, 415.30, 493.88, 622.25, 659.25, 830.61, 987.77],
      // Stage 3: Celestial harp cascade
      [349.23, 440.00, 523.25, 659.25, 783.99, 880.00, 1046.50, 1318.51],
      // Stage 4: Grand Sanctuary Finale
      [261.63, 329.63, 392.00, 493.88, 523.25, 659.25, 783.99, 987.77, 1046.50, 1318.51, 1567.98]
    ];
    const notes = chords[Math.min(stage - 1, 3)];
    notes.forEach((f, idx) => {
      this.playNote(f, idx * 0.085, 2.1, 0.13, 'triangle');
      if (idx % 2 === 0) {
        this.playNote(f * 2, idx * 0.085 + 0.04, 1.4, 0.05, 'sine');
      }
    });

    // Add gentle fairy wing flutter / wind chime shimmer
    this.playShimmer(0.2, stage === 4 ? 1.8 : 0.9);
    if (stage >= 2) {
      setTimeout(() => this.playBirdCall(), 450);
    }
  }

  playShimmer(delay = 0, duration = 0.8) {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    const highNotes = [1318.5, 1567.98, 1760.0, 2093.0, 2349.32, 2637.02];
    for (let i = 0; i < 8; i++) {
      const f = highNotes[Math.floor(Math.random() * highNotes.length)];
      this.playNote(f, delay + i * (duration / 8), 0.55, 0.035, 'sine');
    }
  }

  playBirdCall() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1650, now);
    osc.frequency.exponentialRampToValueAtTime(2450, now + 0.09);
    osc.frequency.exponentialRampToValueAtTime(1850, now + 0.18);
    osc.frequency.exponentialRampToValueAtTime(2600, now + 0.28);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.06, now + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.36);
  }

  // Hollow wooden knock + leaf rustle for wrong answer
  playWoodKnock() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;

    // Two-tone hollow log thud
    [155, 118].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.09);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.55, now + i * 0.09 + 0.16);

      gain.gain.setValueAtTime(0.001, now + i * 0.09);
      gain.gain.linearRampToValueAtTime(0.22, now + i * 0.09 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.09 + 0.18);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + i * 0.09);
      osc.stop(now + i * 0.09 + 0.2);
    });
  }

  // Soft breeze / leaf rustle when pressing "Next"
  playWindTransition() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    const notes = [440, 554.37, 659.25, 880];
    notes.forEach((f, i) => {
      this.playNote(f, i * 0.05, 0.7, 0.06, 'sine');
    });
  }

  playTap() {
    this.playNote(587.33, 0, 0.25, 0.07, 'sine');
  }
}

    // Center crown boughs

    { x1: 1330, y1: 480, cx: 1410, cy: 290, x2: 1460, y2: 120, w1: 50, w2: 11, tier: 3 },
    // Right upper bough
    { x1: 1355, y1: 535, cx: 1520, cy: 390, x2: 1740, y2: 240, w1: 52, w2: 13, tier: 2 },
    { x1: 1530, y1: 385, cx: 1620, cy: 260, x2: 1690, y2: 155, w1: 25, w2: 7, tier: 3 },
    // Right lower bough over the stream
    { x1: 1370, y1: 600, cx: 1560, cy: 555, x2: 1790, y2: 470, w1: 56, w2: 14, tier: 1 },
    { x1: 1575, y1: 540, cx: 1690, cy: 450, x2: 1830, y2: 375, w1: 26, w2: 8, tier: 1 }
  ];

  branchConfigs.forEach((b, idx) => {
    treeBranches.push(b);

    // Populate dense, realistic leaf clusters along each branch
    for (let t = 0.25; t <= 1.0; t += 0.18) {
      const px = (1 - t) * (1 - t) * b.x1 + 2 * (1 - t) * t * b.cx + t * t * b.x2;
      const py = (1 - t) * (1 - t) * b.y1 + 2 * (1 - t) * t * b.cy + t * t * b.y2;
      treeLeafClusters.push({
        x: px + (Math.random() * 50 - 25),
        y: py + (Math.random() * 40 - 25),
        rx: 65 + Math.random() * 45,
        ry: 42 + Math.random() * 30,
        phase: idx + t * 4,
        shade: Math.floor(Math.random() * 3),
        tier: b.tier
      });
    }

    // Populate magical flowers along branches (assigned to stages 1..4)
    const flowerCount = 5;
    for (let f = 1; f <= flowerCount; f++) {
      const t = f / (flowerCount + 0.3);
      const px = (1 - t) * (1 - t) * b.x1 + 2 * (1 - t) * t * b.cx + t * t * b.x2;
      const py = (1 - t) * (1 - t) * b.y1 + 2 * (1 - t) * t * b.cy + t * t * b.y2;
      const stageReq = ((idx + f) % 4) + 1;
      const types = ['LILY', 'LOTUS', 'ORCHID', 'CHERRY'];

        rot: Math.random() * Math.PI * 2,
        phase: Math.random() * Math.PI * 2,
        pulse: 0

  });

  // Luminescent hanging vines (awaken strongly in Stages 3 & 4)

      length: 130 + (i % 3) * 55,
      phase: i * 0.9,
      glow: 0
    });
  });
}

// ==========================================
// MATH GENERATOR (4 Equations, 3 Components, 2 Signs: ++, -+, --, +-)
// ==========================================
function generateEquations() {
  plaques.length = 0;
  solvedCount = 0;
  roundResetTimer = 0;

  // Reset tree blooms & elves for the new cycle
  treeFlowers.forEach(f => {
    f.targetBloom = 0;
  });
  elves.forEach(elf => {
    elf.active = false;
    if (elf.id === 0) { elf.x = 2040; elf.y = 220; }
    if (elf.id === 1) { elf.x = 1350; elf.y = -150; }
    if (elf.id === 2) { elf.x = 760; elf.y = -150; }
  });
  birds.length = 0;

  // Shuffle the 4 required sign combinations: ++, -+, --, +-
  const combos = ['++', '-+', '--', '+-'];
  for (let i = combos.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [combos[i], combos[j]] = [combos[j], combos[i]];
  }

  const yPositions = [195, 415, 635, 855];
  const xOffsets = [445, 475, 450, 480];

  for (let i = 0; i < 4; i++) {
    const combo = combos[i];
    const op1 = combo[0];
    const op2 = combo[1];

    // Collect all valid (a, b, c, r) strictly within 1..10 (including intermediate result)
    // and with b !== c so that +- and -+ never yield ambiguous solutions
    const candidates = [];
    for (let a = 1; a <= 10; a++) {
      for (let b = 1; b <= 10; b++) {
        if (b === a && Math.random() < 0.4) continue;
        const mid = op1 === '+' ? a + b : a - b;
        if (mid < 1 || mid > 10) continue;

        for (let c = 1; c <= 10; c++) {
          if (b === c) continue; // Prevents ambiguity between A + B - C and A - B + C
          const r = op2 === '+' ? mid + c : mid - c;
          if (r < 1 || r > 10) continue;
          candidates.push({ a, b, c, r });
        }
      }
    }

    const pick = candidates[Math.floor(Math.random() * candidates.length)];

    plaques.push({
      index: i,
      x: xOffsets[i],
      y: yPositions[i],
      w: 825,
      h: 164,
      a: pick.a,
      b: pick.b,
      c: pick.c,
      r: pick.r,
      op1,
      op2,
      chosenOp1: null,
      chosenOp2: null,
      wrongResetTimer: 0,
      solved: false,
      glow: 0,
      shakeTime: 0,
      shakeMag: 0,
      scalePop: 1,
      hover1Plus: 0,
      hover1Minus: 0,
      hover2Plus: 0,
      hover2Minus: 0,
      vineBloom: 0,
      seed: Math.random() * 100
    });
  }
}

function triggerMagicalFeedback(plaque) {
  plaque.solved = true;
  plaque.scalePop = 1.12;
  solvedCount++;

  const stage = solvedCount; // 1, 2, 3, or 4
  audio.playSuccessStage(stage);

  // Burst of golden sparkles around both solved sign sockets and plaque
  spawnSparkleBurst(plaque.x + SLOT1_X, plaque.y, 18, 48);
  spawnSparkleBurst(plaque.x + SLOT2_X, plaque.y, 18, 48);

  // Send stream of golden life-energy orbs along the roots up into the Sacred Tree
  for (let i = 0; i < 14; i++) {
    energyOrbs.push({
      x: plaque.x + 310,
      y: plaque.y,
      cx: 890 + (Math.random() * 160 - 80),
      cy: 920 + (Math.random() * 100 - 50),
      tx: 1290 + (Math.random() * 140 - 70),
      ty: 540 - stage * 65 + (Math.random() * 80 - 40),
      progress: -i * 0.045,
      speed: 0.016 + Math.random() * 0.006,
      size: 6 + Math.random() * 6,
      hue: 42 + Math.random() * 25
    });
  }

  // Awaken flowers for this stage
  treeFlowers.forEach(f => {
    if (f.stageReq <= stage) {
      f.targetBloom = 1;
      f.pulse = 1;
    }
  });

  // Spawn fluttering butterflies on every stage
  const butterflyCount = stage === 4 ? 7 : 3;
  for (let b = 0; b < butterflyCount; b++) {
    butterflies.push({
      x: plaque.x + (Math.random() * 120 - 60),
      y: plaque.y + (Math.random() * 40 - 20),
      tx: 920 + Math.random() * 820,
      ty: 160 + Math.random() * 480,
      vx: 2 + Math.random() * 3,
      vy: -1 - Math.random() * 2,
      wingPhase: Math.random() * Math.PI * 2,
      hue: [38, 185, 315, 130][(stage + b) % 4],
      scale: 0.75 + Math.random() * 0.45
    });
  }

  // Stage 2, 3, 4: Awaken Woodland Elves
  elves.forEach(elf => {
    if (elf.stageReq <= stage && !elf.active) {
      elf.active = true;
    }
  });

  // Stage 2+: Songbird lands on left welcoming branch
  if (stage === 2 && birds.length === 0) {
    birds.push({
      x: 650,
      y: -60,
      tx: 935,
      ty: 482,
      hopPhase: 0,
      singTimer: 1.5,
      wingFlap: 1
    });
  }

  // Stage 4: Grand Finale Shower of Golden Pollen & Cherry Blossoms
  if (stage === 4) {
    for (let p = 0; p < 85; p++) {
      fallingPetals.push({
        x: 780 + Math.random() * 1050,
        y: 60 + Math.random() * 520,
        vx: -0.8 + Math.random() * 1.6,
        vy: 0.9 + Math.random() * 1.8,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.06,
        size: 7 + Math.random() * 8,
        hue: Math.random() > 0.4 ? 335 : 48
      });
    }
    // Automatically generate next infinite round after enjoying the finale
    roundResetTimer = 6.2;
  }
}

function triggerWrongFeedback(plaque) {
  audio.playWoodKnock();
  plaque.shakeTime = 0.55;
  plaque.shakeMag = 15;
  plaque.wrongResetTimer = 0.55;

  // Puff of amber pollen & dry autumn leaves from the two sign sockets
  [SLOT1_X, SLOT2_X].forEach(slotX => {
    spawnSparkleBurst(plaque.x + slotX, plaque.y, 8, 28);
  });
  for (let i = 0; i < 8; i++) {
    fallingPetals.push({
      x: plaque.x + (Math.random() * 260 - 130),
      y: plaque.y + (Math.random() * 60 - 30),
      vx: (Math.random() - 0.5) * 4,
      vy: 1.5 + Math.random() * 2.5,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.12,
      size: 8 + Math.random() * 6,
      hue: 26 + Math.random() * 15
    });
  }
}

function evaluatePlaqueIfReady(plaque) {
  if (!plaque.chosenOp1 || !plaque.chosenOp2 || plaque.solved) return;

  const mid = plaque.chosenOp1 === '+' ? plaque.a + plaque.b : plaque.a - plaque.b;
  const res = plaque.chosenOp2 === '+' ? mid + plaque.c : mid - plaque.c;

  if (mid >= 1 && mid <= 10 && res === plaque.r) {
    triggerMagicalFeedback(plaque);
  } else {
    triggerWrongFeedback(plaque);
  }
}

function spawnSparkleBurst(x, y, count = 20, hue = 48) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.3 - 0.15);
    const speed = 1.5 + Math.random() * 6.5;
    sparkles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 0.8,
      size: 3 + Math.random() * 5.5,
      alpha: 1,
      decay: 0.015 + Math.random() * 0.02,
      hue: hue + (Math.random() * 30 - 15)
    });
  }
}

// ==========================================
// RESIZE & WIDESCREEN VIEWPORT MAPPING
// ==========================================
function handleResize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;

  const scaleX = window.innerWidth / VW;
  const scaleY = window.innerHeight / VH;
  scale = Math.min(scaleX, scaleY);
  offsetX = (window.innerWidth - VW * scale) * 0.5;
  offsetY = (window.innerHeight - VH * scale) * 0.5;
}

window.addEventListener('resize', handleResize);

function toVirtualCoords(clientX, clientY) {
  return {
    x: (clientX - offsetX) / scale,
    y: (clientY - offsetY) / scale
  };
}

// ==========================================
// INPUT HANDLING (Mouse & Touch)
// ==========================================
function onPointerMove(e) {
  const pt = e.touches ? e.touches[0] : e;
  const v = toVirtualCoords(pt.clientX, pt.clientY);
  pointer.x = v.x;
  pointer.y = v.y;
}

function onPointerDown(e) {
  if (e.cancelable) e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  const v = toVirtualCoords(pt.clientX, pt.clientY);
  pointer.x = v.x;
  pointer.y = v.y;
  pointer.down = true;

  audio.init();

  // 1. Check Top-Right Minimalist Organic UI Buttons
  if (Math.hypot(v.x - uiButtons.next.x, v.y - uiButtons.next.y) <= uiButtons.next.r + 8) {
    uiButtons.next.press = 1;
    audio.playWindTransition();
    transitionAlpha = 0.65;
    generateEquations();
    return;
  }

  if (Math.hypot(v.x - uiButtons.sound.x, v.y - uiButtons.sound.y) <= uiButtons.sound.r + 8) {
    uiButtons.sound.press = 1;
    audio.muted = !audio.muted;
    if (!audio.muted) audio.playTap();
    return;
  }

  // 2. Check 4 Equation Plaques (each has 2 missing sign slots: Slot 1 and Slot 2)
  for (let i = 0; i < plaques.length; i++) {
    const p = plaques[i];
    if (p.solved) {
      // Clicking a solved plaque plays a pleasant chord chime & sparkles
      if (Math.abs(v.x - p.x) < p.w * 0.48 && Math.abs(v.y - p.y) < p.h * 0.45) {
        audio.playShimmer(0, 0.5);
        spawnSparkleBurst(v.x, v.y, 14, 50);
        p.scalePop = 1.05;
        return;
      }
      continue;
    }

    // Ignore clicks while shaking/resetting from a wrong pair
    if (p.wrongResetTimer > 0) continue;

    const s1PlusX = p.x + SLOT1_X - RUNE_OFFSET;
    const s1MinusX = p.x + SLOT1_X + RUNE_OFFSET;
    const s2PlusX = p.x + SLOT2_X - RUNE_OFFSET;
    const s2MinusX = p.x + SLOT2_X + RUNE_OFFSET;
    const slotY = p.y;
    const hitR = RUNE_RADIUS + 5;

    // Slot 1 '+' rune
    if (Math.hypot(v.x - s1PlusX, v.y - slotY) <= hitR) {
      p.chosenOp1 = '+';
      audio.playTap();
      spawnSparkleBurst(s1PlusX, slotY, 8, 52);
      evaluatePlaqueIfReady(p);
      return;
    }
    // Slot 1 '-' rune
    if (Math.hypot(v.x - s1MinusX, v.y - slotY) <= hitR) {
      p.chosenOp1 = '-';
      audio.playTap();
      spawnSparkleBurst(s1MinusX, slotY, 8, 52);
      evaluatePlaqueIfReady(p);
      return;
    }
    // Slot 2 '+' rune
    if (Math.hypot(v.x - s2PlusX, v.y - slotY) <= hitR) {
      p.chosenOp2 = '+';
      audio.playTap();
      spawnSparkleBurst(s2PlusX, slotY, 8, 52);
      evaluatePlaqueIfReady(p);
      return;
    }
    // Slot 2 '-' rune
    if (Math.hypot(v.x - s2MinusX, v.y - slotY) <= hitR) {
      p.chosenOp2 = '-';
      audio.playTap();
      spawnSparkleBurst(s2MinusX, slotY, 8, 52);
      evaluatePlaqueIfReady(p);
      return;
    }
  }

  // 3. Interactive Living Forest Elements (Flowers, Elves, Mushrooms)
  for (let i = 0; i < treeFlowers.length; i++) {
    const f = treeFlowers[i];
    if (f.bloom > 0.3 && Math.hypot(v.x - f.x, v.y - f.y) <= f.maxR + 14) {
      f.pulse = 1.4;
      audio.playShimmer(0, 0.45);
      spawnSparkleBurst(f.x, f.y, 16, 330);
      return;
    }
  }

  for (let i = 0; i < elves.length; i++) {
    const elf = elves[i];
    if (elf.active && Math.hypot(v.x - elf.x, v.y - elf.y) <= 95) {
      audio.playBirdCall();
      audio.playShimmer(0.05, 0.7);
      spawnSparkleBurst(elf.x, elf.y, 28, elf.wingHue);
      elf.vy = -5.5;
      return;
    }
  }

  for (let i = 0; i < mushrooms.length; i++) {
    const m = mushrooms[i];
    if (Math.hypot(v.x - m.x, v.y - m.y) <= m.r + 18) {
      m.glow = 1.5;
      m.bounceVel = -0.35;
      audio.playNote(392 + i * 55, 0, 0.8, 0.12, 'sine');
      spawnSparkleBurst(m.x, m.y - 10, 12, m.hue);
      return;
    }
  }
}

function onPointerUp() {
  pointer.down = false;
}

canvas.addEventListener('mousemove', onPointerMove);
canvas.addEventListener('mousedown', onPointerDown);
window.addEventListener('mouseup', onPointerUp);
canvas.addEventListener('touchstart', onPointerDown, { passive: false });
canvas.addEventListener('touchmove', onPointerMove, { passive: false });
window.addEventListener('touchend', onPointerUp);

// ==========================================
// PHYSICS & ANIMATION UPDATE LOOP
// ==========================================
function update(dt) {
  time += dt;

  if (transitionAlpha > 0) {
    transitionAlpha = Math.max(0, transitionAlpha - dt * 1.4);
  }

  // Automatic infinite round generator countdown after Stage 4 finale
  if (roundResetTimer > 0) {
    roundResetTimer -= dt;
    if (roundResetTimer <= 0) {
      audio.playWindTransition();
      transitionAlpha = 0.7;
      generateEquations();
    }
  }

  // Update UI button hover states
  ['next', 'sound'].forEach(k => {
    const b = uiButtons[k];
    const dist = Math.hypot(pointer.x - b.x, pointer.y - b.y);
    const targetH = dist <= b.r + 6 ? 1 : 0;
    b.hover += (targetH - b.hover) * 0.2;
    b.press *= 0.82;
  });

  // Update Equation Plaques
  plaques.forEach(p => {
    p.scalePop += (1 - p.scalePop) * 0.14;
    if (p.shakeTime > 0) {
      p.shakeTime = Math.max(0, p.shakeTime - dt);
    }
    if (p.wrongResetTimer > 0) {
      p.wrongResetTimer -= dt;
      if (p.wrongResetTimer <= 0) {
        p.wrongResetTimer = 0;
        p.chosenOp1 = null;
        p.chosenOp2 = null;
      }
    }
    if (p.solved) {
      p.glow = Math.min(1, p.glow + dt * 2.2);
      p.vineBloom = Math.min(1, p.vineBloom + dt * 1.6);
    } else {
      const s1PlusDist = Math.hypot(pointer.x - (p.x + SLOT1_X - RUNE_OFFSET), pointer.y - p.y);
      const s1MinusDist = Math.hypot(pointer.x - (p.x + SLOT1_X + RUNE_OFFSET), pointer.y - p.y);
      const s2PlusDist = Math.hypot(pointer.x - (p.x + SLOT2_X - RUNE_OFFSET), pointer.y - p.y);
      const s2MinusDist = Math.hypot(pointer.x - (p.x + SLOT2_X + RUNE_OFFSET), pointer.y - p.y);

      p.hover1Plus += ((s1PlusDist <= RUNE_RADIUS + 4 ? 1 : 0) - p.hover1Plus) * 0.22;
      p.hover1Minus += ((s1MinusDist <= RUNE_RADIUS + 4 ? 1 : 0) - p.hover1Minus) * 0.22;
      p.hover2Plus += ((s2PlusDist <= RUNE_RADIUS + 4 ? 1 : 0) - p.hover2Plus) * 0.22;
      p.hover2Minus += ((s2MinusDist <= RUNE_RADIUS + 4 ? 1 : 0) - p.hover2Minus) * 0.22;
    }
  });

  // Update Golden Life-Energy Orbs traveling along roots into the Sacred Tree
  for (let i = energyOrbs.length - 1; i >= 0; i--) {
    const o = energyOrbs[i];
    o.progress += o.speed;
    if (o.progress >= 0 && Math.random() < 0.45) {
      const t = Math.min(1, o.progress);
      const px = (1 - t) * (1 - t) * o.x + 2 * (1 - t) * t * o.cx + t * t * o.tx;
      const py = (1 - t) * (1 - t) * o.y + 2 * (1 - t) * t * o.cy + t * t * o.ty;
      sparkles.push({
        x: px + (Math.random() * 14 - 7),
        y: py + (Math.random() * 14 - 7),
        vx: (Math.random() - 0.5) * 1.2,
        vy: -0.5 - Math.random() * 1.2,
        size: 2.5 + Math.random() * 3.5,
        alpha: 0.9,
        decay: 0.03,
        hue: o.hue
      });
    }
    if (o.progress >= 1) {
      spawnSparkleBurst(o.tx, o.ty, 6, o.hue);
      energyOrbs.splice(i, 1);
    }
  }

  // Update Tree Flowers blooming physics
  treeFlowers.forEach(f => {
    f.bloom += (f.targetBloom - f.bloom) * 0.06;
    if (f.pulse > 0) f.pulse = Math.max(0, f.pulse - dt * 1.8);
  });

  // Update Hanging Vines luminescence
  hangingVines.forEach(v => {
    const targetG = solvedCount >= 3 ? 1 : (solvedCount >= 1 ? 0.3 : 0);
    v.glow += (targetG - v.glow) * 0.04;
  });

  // Update Woodland Elves (Flight curves, hovering physics, Stage 4 aerial crown dance)
  elves.forEach(elf => {
    if (!elf.active) return;
    elf.wingPhase += dt * 28; // High-frequency realistic dragonfly wingbeat

    let targetX = elf.homeX + Math.sin(time * 1.6 + elf.id * 2) * 38;
    let targetY = elf.homeY + Math.cos(time * 2.1 + elf.id * 2) * 24;

    // In Stage 4 (all 4 equations solved), the elves perform a graceful orbital dance around the crown
    if (solvedCount === 4) {
      elf.danceAngle += dt * 0.85;
      targetX = 1320 + Math.cos(elf.danceAngle) * 340;
      targetY = 290 + Math.sin(elf.danceAngle * 2) * 85;
    }

    const dx = targetX - elf.x;
    const dy = targetY - elf.y;
    elf.vx = elf.vx * 0.86 + dx * 0.025;
    elf.vy = elf.vy * 0.86 + dy * 0.025;
    elf.x += elf.vx;
    elf.y += elf.vy;

    if (Math.abs(elf.vx) > 0.3) {
      elf.facing = elf.vx > 0 ? 1 : -1;
    } else {
      elf.facing = elf.x > 1310 ? -1 : 1;
    }

    // Elves continuously trail delicate fairy dust
    if (Math.random() < 0.35) {
      sparkles.push({
        x: elf.x + (Math.random() * 30 - 15),
        y: elf.y + 20 + (Math.random() * 30 - 15),
        vx: (Math.random() - 0.5) * 1.1,
        vy: 0.4 + Math.random() * 1.2,
        size: 2 + Math.random() * 3.5,
        alpha: 0.85,
        decay: 0.022,
        hue: elf.wingHue
      });
    }
  });

  // Update Butterflies
  for (let i = butterflies.length - 1; i >= 0; i--) {
    const b = butterflies[i];
    b.wingPhase += dt * 18;
    const dx = b.tx - b.x;
    const dy = b.ty - b.y;
    if (Math.hypot(dx, dy) < 40) {
      b.tx = 840 + Math.random() * 940;
      b.ty = 120 + Math.random() * 620;
    }
    b.vx = b.vx * 0.94 + dx * 0.003 + Math.sin(time * 4 + i) * 0.18;
    b.vy = b.vy * 0.94 + dy * 0.003 + Math.cos(time * 5 + i) * 0.18;
    b.x += b.vx;
    b.y += b.vy;
  }

  // Update Songbird
  birds.forEach(bird => {
    const dx = bird.tx - bird.x;
    const dy = bird.ty - bird.y;
    if (Math.hypot(dx, dy) > 4) {
      bird.x += dx * 0.06;
      bird.y += dy * 0.06;
      bird.wingFlap = 1;
    } else {
      bird.wingFlap *= 0.85;
      bird.hopPhase += dt * 4;
      bird.singTimer -= dt;
      if (bird.singTimer <= 0) {
        bird.singTimer = 4 + Math.random() * 4;
        spawnSparkleBurst(bird.x + 14, bird.y - 14, 5, 185);
      }
    }
  });

  // Update Interactive Mushrooms
  mushrooms.forEach(m => {
    m.glow += (0.45 - m.glow) * 0.05;
    m.bounce += m.bounceVel;
    m.bounceVel += (0 - m.bounce) * 0.25;
    m.bounceVel *= 0.82;
  });

  // Update Fireflies
  fireflies.forEach(f => {
    f.x += f.vx + Math.sin(time * 0.8 + f.phase) * 0.25;
    f.y += f.vy + Math.cos(time * 0.7 + f.phase) * 0.2;
    if (f.x < -20) f.x = VW + 20;
    if (f.x > VW + 20) f.x = -20;
    if (f.y < -20) f.y = VH + 20;
    if (f.y > VH + 20) f.y = -20;
  });

  // Update Falling Petals
  for (let i = fallingPetals.length - 1; i >= 0; i--) {
    const p = fallingPetals[i];
    p.x += p.vx + Math.sin(time * 2 + p.rot) * 0.6;
    p.y += p.vy;
    p.rot += p.vRot;
    if (p.y > VH + 30) {
      fallingPetals.splice(i, 1);
    }
  }

  // Update Sparkles
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i];
    s.x += s.vx;
    s.y += s.vy;
    s.alpha -= s.decay;
    if (s.alpha <= 0) {
      sparkles.splice(i, 1);
    }
  }
}

// ==========================================
// RENDERING ENGINE (Layered Realistic Painting)
// ==========================================
function render() {
  ctx.save();
  ctx.scale(dpr, dpr);

  // Outer letterbox background (deep enchanted canopy shadow)
  ctx.fillStyle = '#050e0a';
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  // Transform into 1920x1080 widescreen virtual canvas
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  // Clip to 1920x1080 virtual stage
  ctx.beginPath();
  ctx.rect(0, 0, VW, VH);
  ctx.clip();

  drawSkyAndCanopyGlow();
  drawDistantForest();
  drawGodRays();
  drawForestHillsAndStream();
  drawSacredTree();
  drawHangingVines();
  drawTreeFlowers();
  drawBirds();
  drawButterflies();
  drawElves();
  drawMushroomsAndFerns();
  drawEnergyOrbs();
  drawEquationPlaques();
  drawFirefliesAndPetals();
  drawSparkles();
  drawTopRightButtons();

  // Gentle golden mist overlay during round transition
  if (transitionAlpha > 0.01) {
    ctx.fillStyle = `rgba(255, 244, 195, ${transitionAlpha * 0.35})`;
    ctx.fillRect(0, 0, VW, VH);
  }

  ctx.restore();
}

// 1. Deep Atmospheric Forest Sky & Sunlit Canopy
function drawSkyAndCanopyGlow() {
  const warmth = solvedCount * 0.25; // Brighter golden warmth as equations are solved
  const skyGrad = ctx.createLinearGradient(0, 0, 0, VH);
  skyGrad.addColorStop(0, '#071c15');
  skyGrad.addColorStop(0.45, warmth > 0.5 ? '#153b2b' : '#0f2c21');
  skyGrad.addColorStop(0.8, '#0c231a');
  skyGrad.addColorStop(1, '#07140e');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, VW, VH);

  // Radiant sun-break behind the Sacred Tree crown
  const sunGlow = ctx.createRadialGradient(1320, 260, 40, 1320, 260, 780 + solvedCount * 90);
  sunGlow.addColorStop(0, `rgba(255, 242, 175, ${0.28 + warmth * 0.22})`);
  sunGlow.addColorStop(0.4, `rgba(140, 225, 165, ${0.14 + warmth * 0.1})`);
  sunGlow.addColorStop(1, 'rgba(15, 45, 30, 0)');
  ctx.fillStyle = sunGlow;
  ctx.fillRect(0, 0, VW, VH);
}

// 2. Distant Layered Forest Trunks & Drifting Mist
function drawDistantForest() {
  bgTrees.forEach(t => {
    const sway = Math.sin(time * 0.4 + t.swayPhase) * (t.layer === 0 ? 3 : 6);
    ctx.fillStyle = t.layer === 0 ? 'rgba(10, 32, 24, 0.65)' : 'rgba(14, 38, 27, 0.85)';
    ctx.beginPath();
    ctx.moveTo(t.x - t.width * 0.6, VH);
    ctx.quadraticCurveTo(t.x - t.width * 0.35, VH * 0.5, t.x - t.width * 0.3 + sway, 0);
    ctx.lineTo(t.x + t.width * 0.3 + sway, 0);
    ctx.quadraticCurveTo(t.x + t.width * 0.35, VH * 0.5, t.x + t.width * 0.6, VH);
    ctx.closePath();
    ctx.fill();
  });

  // Soft atmospheric forest mist band
  const mistGrad = ctx.createLinearGradient(0, 580, 0, 920);
  mistGrad.addColorStop(0, 'rgba(40, 95, 75, 0)');
  mistGrad.addColorStop(0.5, `rgba(65, 135, 105, ${0.12 + solvedCount * 0.03})`);
  mistGrad.addColorStop(1, 'rgba(20, 55, 42, 0)');
  ctx.fillStyle = mistGrad;
  ctx.fillRect(0, 580, VW, 340);
}

// 3. Volumetric God-Rays
function drawGodRays() {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  godRays.forEach(r => {
    const pulse = Math.sin(time * r.speed + r.phase) * 0.02;
    const alpha = r.alpha + pulse + solvedCount * 0.015;
    const grad = ctx.createLinearGradient(r.x, 0, r.x + 260, VH);
    grad.addColorStop(0, `rgba(255, 245, 185, ${alpha})`);
    grad.addColorStop(0.65, `rgba(170, 235, 175, ${alpha * 0.45})`);
    grad.addColorStop(1, 'rgba(120, 200, 150, 0)');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(r.x - r.width * 0.4, -20);
    ctx.lineTo(r.x + r.width * 0.4, -20);
    ctx.lineTo(r.x + 360 + r.width * 0.9, VH + 20);
    ctx.lineTo(r.x + 360 - r.width * 0.9, VH + 20);
    ctx.closePath();
    ctx.fill();
  });
  ctx.restore();
}

// 4. Mossy Forest Banks & Shimmering Stream with Reflections
function drawForestHillsAndStream() {
  // Back mossy ridge
  const hill1 = ctx.createLinearGradient(0, 760, 0, VH);
  hill1.addColorStop(0, '#163d28');
  hill1.addColorStop(0.6, '#0d291a');
  hill1.addColorStop(1, '#081a11');
  ctx.fillStyle = hill1;
  ctx.beginPath();
  ctx.moveTo(0, 820);
  ctx.bezierCurveTo(480, 750, 950, 780, 1420, 830);
  ctx.lineTo(VW, 810);
  ctx.lineTo(VW, VH);
  ctx.lineTo(0, VH);
  ctx.closePath();
  ctx.fill();

  // Enchanted Forest Stream (bottom center-right)
  const streamGrad = ctx.createLinearGradient(700, 890, 1920, VH);
  streamGrad.addColorStop(0, '#0f3c3e');
  streamGrad.addColorStop(0.5, '#165855');
  streamGrad.addColorStop(1, '#0a292c');
  ctx.fillStyle = streamGrad;
  ctx.beginPath();
  ctx.moveTo(640, VH);
  ctx.quadraticCurveTo(880, 895, 1280, 885);
  ctx.quadraticCurveTo(1640, 875, VW, 910);
  ctx.lineTo(VW, VH);
  ctx.closePath();
  ctx.fill();

  // Golden blossom reflections in the stream as the tree blooms
  if (solvedCount > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const reflGrad = ctx.createRadialGradient(1320, 980, 20, 1320, 980, 480);
    reflGrad.addColorStop(0, `rgba(255, 215, 140, ${solvedCount * 0.08})`);
    reflGrad.addColorStop(0.6, `rgba(255, 145, 195, ${solvedCount * 0.05})`);
    reflGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = reflGrad;
    ctx.fillRect(650, 885, 1270, 195);
    ctx.restore();
  }

  // Animated water ripples
  streamRipples.forEach(rp => {
    const waveX = Math.sin(time * rp.speed + rp.phase) * 18;
    const alpha = 0.18 + Math.sin(time * 2 + rp.phase) * 0.1;
    ctx.strokeStyle = `hsla(${rp.hue}, 70%, 72%, ${alpha})`;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(rp.x + waveX - rp.len * 0.5, rp.y);
    ctx.quadraticCurveTo(rp.x + waveX, rp.y - 3, rp.x + waveX + rp.len * 0.5, rp.y);
    ctx.stroke();
  });

  // Foreground mossy sanctuary bank under the Sacred Tree
  const bankGrad = ctx.createLinearGradient(750, 800, 1750, 1020);
  bankGrad.addColorStop(0, '#235332');
  bankGrad.addColorStop(0.5, '#193f26');
  bankGrad.addColorStop(1, '#0d2416');
  ctx.fillStyle = bankGrad;
  ctx.beginPath();
  ctx.moveTo(690, 960);
  ctx.bezierCurveTo(960, 830, 1480, 795, 1780, 935);
  ctx.bezierCurveTo(1600, 945, 1100, 920, 690, 960);
  ctx.closePath();
  ctx.fill();
}

// 5. The Sacred Ancient Tree (Gnarled Roots, Textured Bark, Swaying Canopy)
function drawSacredTree() {
  // Back canopy layer
  treeLeafClusters.forEach(lc => {
    if (lc.shade !== 0) return;
    drawLeafCluster(lc, '#0f2f1e', '#1a472e');
  });

  // Draw gnarled trunk and sweeping roots
  const trunkGrad = ctx.createLinearGradient(1150, 500, 1480, 880);
  trunkGrad.addColorStop(0, '#4c3222');
  trunkGrad.addColorStop(0.45, '#3b2518');
  trunkGrad.addColorStop(0.85, '#26170e');
  trunkGrad.addColorStop(1, '#1a0f09');
  ctx.fillStyle = trunkGrad;

  ctx.beginPath();
  // Left root sweeping toward the equation plaques
  ctx.moveTo(760, 945);
  ctx.bezierCurveTo(980, 910, 1170, 830, 1225, 690);
  ctx.bezierCurveTo(1250, 610, 1255, 540, 1260, 480);
  // Top of crown trunk
  ctx.lineTo(1375, 480);
  // Right trunk & root sweeping toward the stream
  ctx.bezierCurveTo(1380, 560, 1395, 640, 1430, 720);
  ctx.bezierCurveTo(1490, 825, 1610, 895, 1730, 930);
  // Bottom root hollows
  ctx.bezierCurveTo(1580, 930, 1480, 885, 1410, 845);
  ctx.bezierCurveTo(1360, 900, 1340, 935, 1290, 945);
  ctx.bezierCurveTo(1250, 910, 1235, 865, 1185, 855);
  ctx.bezierCurveTo(1070, 905, 920, 940, 760, 945);
  ctx.closePath();
  ctx.fill();

  // Main branches
  treeBranches.forEach(b => {
    const bGrad = ctx.createLinearGradient(b.x1, b.y1, b.x2, b.y2);
    bGrad.addColorStop(0, '#3e2719');
    bGrad.addColorStop(1, '#291910');
    ctx.fillStyle = bGrad;

    const nx = -(b.y2 - b.y1);
    const ny = (b.x2 - b.x1);
    const len = Math.hypot(nx, ny) || 1;
    const ux = nx / len;
    const uy = ny / len;

    ctx.beginPath();
    ctx.moveTo(b.x1 + ux * b.w1 * 0.5, b.y1 + uy * b.w1 * 0.5);
    ctx.quadraticCurveTo(b.cx + ux * b.w1 * 0.3, b.cy + uy * b.w1 * 0.3, b.x2 + ux * b.w2 * 0.5, b.y2 + uy * b.w2 * 0.5);
    ctx.lineTo(b.x2 - ux * b.w2 * 0.5, b.y2 - uy * b.w2 * 0.5);
    ctx.quadraticCurveTo(b.cx - ux * b.w1 * 0.3, b.cy - uy * b.w1 * 0.3, b.x1 - ux * b.w1 * 0.5, b.y1 - uy * b.w1 * 0.5);
    ctx.closePath();
    ctx.fill();
  });

  // Realistic bark ridges & glowing golden sap veins (awaken in Stages 2..4)
  ctx.save();
  for (let i = -3; i <= 3; i++) {
    const offset = i * 22;
    ctx.strokeStyle = i % 2 === 0 ? 'rgba(20, 11, 6, 0.55)' : 'rgba(110, 78, 52, 0.32)';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(1290 + offset * 2.5, 915);
    ctx.bezierCurveTo(1295 + offset * 1.4, 770, 1305 + offset * 0.9, 630, 1315 + offset * 0.7, 495);
    ctx.stroke();

    // Golden sap streams of light on the bark as equations are solved
    if (solvedCount >= 2 && Math.abs(i) <= 2) {
      const sapAlpha = (solvedCount - 1) * 0.22 + Math.sin(time * 3 + i) * 0.08;
      ctx.strokeStyle = `rgba(255, 215, 110, ${sapAlpha})`;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(1292 + offset * 2.4, 905);
      ctx.bezierCurveTo(1297 + offset * 1.3, 770, 1307 + offset * 0.85, 630, 1317 + offset * 0.65, 505);
      ctx.stroke();
    }
  }
  ctx.restore();

  // Carved glowing sanctuary hollow in the heart of the tree
  const hollowGlow = 0.25 + solvedCount * 0.18 + Math.sin(time * 2.4) * 0.06;
  const hGrad = ctx.createRadialGradient(1318, 685, 6, 1318, 685, 48);
  hGrad.addColorStop(0, `rgba(255, 235, 150, ${hollowGlow})`);
  hGrad.addColorStop(0.6, `rgba(180, 115, 40, ${hollowGlow * 0.6})`);
  hGrad.addColorStop(1, '#180d07');
  ctx.fillStyle = hGrad;
  ctx.beginPath();
  ctx.ellipse(1318, 685, 28, 44, -0.08, 0, Math.PI * 2);
  ctx.fill();

  // Mid and Foreground lush foliage clusters with wind sway
  treeLeafClusters.forEach(lc => {
    if (lc.shade === 1) {
      drawLeafCluster(lc, '#18472b', '#2b6c40');
    }
  });
  treeLeafClusters.forEach(lc => {
    if (lc.shade === 2) {
      const sunlit = solvedCount > 0 ? '#3f8c52' : '#327544';
      drawLeafCluster(lc, '#235c36', sunlit);
    }
  });
}

function drawLeafCluster(lc, darkColor, lightColor) {
  const swayX = Math.sin(time * 1.3 + lc.phase) * 7;
  const swayY = Math.cos(time * 1.1 + lc.phase) * 3.5;
  const cx = lc.x + swayX;
  const cy = lc.y + swayY;

  const grad = ctx.createRadialGradient(cx - lc.rx * 0.2, cy - lc.ry * 0.25, 8, cx, cy, lc.rx);
  grad.addColorStop(0, lightColor);
  grad.addColorStop(1, darkColor);
  ctx.fillStyle = grad;

  ctx.beginPath();
  const lobes = 7;
  for (let i = 0; i < lobes; i++) {
    const a = (i / lobes) * Math.PI * 2;
    const lx = cx + Math.cos(a) * lc.rx * 0.55;
    const ly = cy + Math.sin(a) * lc.ry * 0.55;
    ctx.moveTo(lx + lc.rx * 0.48, ly);
    ctx.arc(lx, ly, lc.rx * 0.48, 0, Math.PI * 2);
  }
  ctx.fill();
}

// 6. Luminescent Hanging Vines & Crystal Dewdrops
function drawHangingVines() {
  hangingVines.forEach(v => {
    const sway = Math.sin(time * 1.5 + v.phase) * 14;
    ctx.strokeStyle = v.glow > 0.2 ? `rgba(130, 235, 165, ${0.45 + v.glow * 0.45})` : 'rgba(45, 105, 65, 0.65)';
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(v.x, v.y);
    ctx.quadraticCurveTo(v.x + sway * 0.5, v.y + v.length * 0.5, v.x + sway, v.y + v.length);
    ctx.stroke();

    // Small vine leaves and glowing crystal dewdrops
    const steps = 5;
    for (let s = 1; s <= steps; s++) {
      const t = s / steps;
      const vx = (1 - t) * (1 - t) * v.x + 2 * (1 - t) * t * (v.x + sway * 0.5) + t * t * (v.x + sway);
      const vy = v.y + v.length * t;

      ctx.fillStyle = v.glow > 0.2 ? '#7ae89c' : '#2d6e44';
      ctx.beginPath();
      ctx.ellipse(vx + (s % 2 === 0 ? 7 : -7), vy, 7, 3.5, s % 2 === 0 ? 0.4 : -0.4, 0, Math.PI * 2);
      ctx.fill();

      if (v.glow > 0.15 && s === steps) {
        const dropGrad = ctx.createRadialGradient(vx, vy + 6, 1, vx, vy + 6, 14);
        dropGrad.addColorStop(0, 'rgba(255, 250, 195, 0.95)');
        dropGrad.addColorStop(0.5, `rgba(120, 245, 210, ${v.glow * 0.7})`);
        dropGrad.addColorStop(1, 'rgba(120, 245, 210, 0)');
        ctx.fillStyle = dropGrad;
        ctx.beginPath();
        ctx.arc(vx, vy + 6, 14, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  });
}

// 7. Realistic Multi-Petaled Magical Tree Flowers
function drawTreeFlowers() {
  treeFlowers.forEach(f => {
    if (f.bloom <= 0.02) return;
    const swayX = Math.sin(time * 1.4 + f.phase) * 6;
    const swayY = Math.cos(time * 1.2 + f.phase) * 3;
    const fx = f.x + swayX;
    const fy = f.y + swayY;
    const r = f.maxR * f.bloom * (1 + f.pulse * 0.28);

    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(f.rot + Math.sin(time * 0.8 + f.phase) * 0.12);

    // Soft magical aura behind each blossom
    const aura = ctx.createRadialGradient(0, 0, 2, 0, 0, r * 1.7);
    if (f.type === 'LILY') {
      aura.addColorStop(0, 'rgba(255, 245, 175, 0.55)');
      aura.addColorStop(1, 'rgba(255, 200, 90, 0)');
    } else if (f.type === 'LOTUS') {
      aura.addColorStop(0, 'rgba(255, 175, 215, 0.55)');
      aura.addColorStop(1, 'rgba(245, 110, 175, 0)');
    } else if (f.type === 'ORCHID') {
      aura.addColorStop(0, 'rgba(180, 245, 255, 0.55)');
      aura.addColorStop(1, 'rgba(95, 195, 245, 0)');
    } else {
      aura.addColorStop(0, 'rgba(255, 220, 235, 0.55)');
      aura.addColorStop(1, 'rgba(255, 150, 190, 0)');
    }
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.7, 0, Math.PI * 2);
    ctx.fill();

    // Outer & inner layered petals
    const petals = f.type === 'LILY' ? 6 : (f.type === 'LOTUS' ? 8 : 5);
    for (let layer = 0; layer < 2; layer++) {
      const layerScale = layer === 0 ? 1 : 0.68;
      const rotOffset = layer === 0 ? 0 : Math.PI / petals;
      for (let p = 0; p < petals; p++) {
        ctx.save();
        ctx.rotate((p * Math.PI * 2) / petals + rotOffset);

        const pGrad = ctx.createLinearGradient(0, 0, r * layerScale, 0);
        if (f.type === 'LILY') {
          pGrad.addColorStop(0, '#fff7cc');
          pGrad.addColorStop(0.6, '#ffd269');
          pGrad.addColorStop(1, '#f59e0b');
        } else if (f.type === 'LOTUS') {
          pGrad.addColorStop(0, '#fff0f7');
          pGrad.addColorStop(0.6, '#f9a8d4');
          pGrad.addColorStop(1, '#ec4899');
        } else if (f.type === 'ORCHID') {
          pGrad.addColorStop(0, '#ecfeff');
          pGrad.addColorStop(0.6, '#7dd3fc');
          pGrad.addColorStop(1, '#a855f7');
        } else {
          pGrad.addColorStop(0, '#ffffff');
          pGrad.addColorStop(0.7, '#fbcfe8');
          pGrad.addColorStop(1, '#f472b6');
        }
        ctx.fillStyle = pGrad;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(r * 0.45 * layerScale, -r * 0.36 * layerScale, r * 0.9 * layerScale, -r * 0.25 * layerScale, r * layerScale, 0);
        ctx.bezierCurveTo(r * 0.9 * layerScale, r * 0.25 * layerScale, r * 0.45 * layerScale, r * 0.36 * layerScale, 0, 0);
        ctx.fill();
        ctx.restore();
      }
    }

    // Glowing golden stamen heart
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  });
}

// 8. Realistic Woodland Elves with Articulated Iridescent Wings & Graceful Limbs
function drawElves() {
  elves.forEach(elf => {
    if (!elf.active) return;

    ctx.save();
    ctx.translate(elf.x, elf.y);
    ctx.scale(elf.facing * elf.scale, elf.scale);

    // Tilt slightly into flight velocity
    const tilt = Math.max(-0.25, Math.min(0.25, elf.vx * 0.03));
    ctx.rotate(tilt);

    // Radiant fairy aura
    const aura = ctx.createRadialGradient(0, 0, 8, 0, 0, 95);
    aura.addColorStop(0, `hsla(${elf.wingHue}, 95%, 82%, 0.42)`);
    aura.addColorStop(0.5, `hsla(${elf.wingHue}, 85%, 65%, 0.14)`);
    aura.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(0, 0, 95, 0, Math.PI * 2);
    ctx.fill();

    // 4 Articulated Translucent Dragonfly/Fairy Wings (2 upper, 2 lower) with delicate venation
    const flap1 = Math.sin(elf.wingPhase) * 0.42;
    const flap2 = Math.cos(elf.wingPhase - 0.5) * 0.36;

    // Upper & Lower Wings
    [
      { angle: -0.55 + flap1, len: 78, w: 28 },
      { angle: -0.15 + flap2, len: 62, w: 22 }
    ].forEach(w => {
      ctx.save();
      ctx.translate(-8, -12);
      ctx.rotate(w.angle);

      const wGrad = ctx.createLinearGradient(0, 0, -w.len, -w.w);
      wGrad.addColorStop(0, `hsla(${elf.wingHue}, 90%, 88%, 0.78)`);
      wGrad.addColorStop(0.6, `hsla(${(elf.wingHue + 35) % 360}, 85%, 75%, 0.48)`);
      wGrad.addColorStop(1, `hsla(${elf.wingHue}, 95%, 92%, 0.25)`);
      ctx.fillStyle = wGrad;
      ctx.strokeStyle = `hsla(${elf.wingHue}, 95%, 90%, 0.85)`;
      ctx.lineWidth = 1.4;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-w.len * 0.35, -w.w * 1.1, -w.len * 0.9, -w.w * 0.8, -w.len, 0);
      ctx.bezierCurveTo(-w.len * 0.85, w.w * 0.75, -w.len * 0.3, w.w * 0.5, 0, 0);
      ctx.fill();
      ctx.stroke();

      // Delicate wing veins
      ctx.strokeStyle = `hsla(${elf.wingHue}, 90%, 95%, 0.5)`;
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-w.len * 0.5, -w.w * 0.25, -w.len * 0.92, -w.w * 0.08);
      ctx.moveTo(-w.len * 0.35, -w.w * 0.18);
      ctx.lineTo(-w.len * 0.65, -w.w * 0.52);
      ctx.moveTo(-w.len * 0.45, -w.w * 0.2);
      ctx.lineTo(-w.len * 0.72, w.w * 0.28);
      ctx.stroke();

      ctx.restore();
    });

    // Graceful articulated legs swaying gently in flight
    const legSway = Math.sin(time * 3 + elf.id) * 6;
    ctx.strokeStyle = '#f6d5b8';
    ctx.lineWidth = 5.2;
    ctx.lineCap = 'round';
    // Back leg
    ctx.beginPath();
    ctx.moveTo(-4, 24);
    ctx.quadraticCurveTo(-10 + legSway * 0.5, 46, -16 + legSway, 66);
    ctx.stroke();
    // Front leg
    ctx.beginPath();
    ctx.moveTo(3, 24);
    ctx.quadraticCurveTo(2 + legSway * 0.4, 48, -4 + legSway * 0.8, 68);
    ctx.stroke();

    // Woodland Leaf-Petal Tunic Dress with organic layered petals
    const dressGrad = ctx.createLinearGradient(0, -18, 0, 36);
    dressGrad.addColorStop(0, `hsl(${elf.tunicHue}, 68%, 62%)`);
    dressGrad.addColorStop(0.6, `hsl(${elf.tunicHue}, 72%, 44%)`);
    dressGrad.addColorStop(1, `hsl(${(elf.tunicHue + 25) % 360}, 78%, 32%)`);
    ctx.fillStyle = dressGrad;

    ctx.beginPath();
    ctx.moveTo(-7, -16);
    ctx.lineTo(8, -16);
    ctx.quadraticCurveTo(15, 8, 19 + legSway * 0.3, 32);
    ctx.lineTo(6 + legSway * 0.2, 25);
    ctx.lineTo(-1 + legSway * 0.3, 35);
    ctx.lineTo(-8 + legSway * 0.2, 26);
    ctx.lineTo(-18 + legSway * 0.3, 31);
    ctx.quadraticCurveTo(-13, 8, -7, -16);
    ctx.closePath();
    ctx.fill();

    // Golden vine belt
    ctx.strokeStyle = '#fde047';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-9, 2);
    ctx.quadraticCurveTo(0, 6, 10, 2);
    ctx.stroke();

    // Neck & Head with delicate realistic woodland features and pointed elven ear
    ctx.fillStyle = '#fae0c8';
    ctx.beginPath();
    ctx.arc(2, -31, 12.5, 0, Math.PI * 2);
    ctx.fill();

    // Pointed Elven Ear
    ctx.beginPath();
    ctx.moveTo(-6, -31);
    ctx.quadraticCurveTo(-18, -38, -21, -35);
    ctx.quadraticCurveTo(-14, -27, -6, -28);
    ctx.fill();

    // Rosy cheek & serene eye
    ctx.fillStyle = 'rgba(244, 114, 182, 0.38)';
    ctx.beginPath();
    ctx.arc(7, -28, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#3e2723';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(7, -32, 2.5, 0.1, Math.PI - 0.1);
    ctx.stroke();

    // Flowing hair with wind motion & flower crown
    const hairWave = Math.sin(time * 3.5 + elf.id) * 5;
    ctx.fillStyle = `hsl(${elf.hairHue}, 75%, 52%)`;
    ctx.beginPath();
    ctx.moveTo(12, -38);
    ctx.bezierCurveTo(4, -48, -14, -44, -16, -28);
    ctx.bezierCurveTo(-22, -14, -28 + hairWave, 2, -20 + hairWave, 10);
    ctx.bezierCurveTo(-12 + hairWave * 0.5, 2, -8, -16, -3, -28);
    ctx.closePath();
    ctx.fill();

    // Tiny glowing blossom in hair
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(-4, -39, 4, 0, Math.PI * 2);
    ctx.fill();

    // Graceful arms & Woodland Instrument (Wand, Harp, or Flute)
    const armWave = Math.sin(time * 4 + elf.id) * 4;
    ctx.strokeStyle = '#fae0c8';
    ctx.lineWidth = 4.2;
    ctx.beginPath();
    ctx.moveTo(5, -13);
    ctx.quadraticCurveTo(18, -8 + armWave * 0.5, 26, -15 + armWave);
    ctx.stroke();

    if (elf.instrument === 'WAND') {
      ctx.strokeStyle = '#fcd34d';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(22, -11 + armWave);
      ctx.lineTo(38, -26 + armWave);
      ctx.stroke();
      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(38, -26 + armWave, 5, 0, Math.PI * 2);
      ctx.fill();
    } else if (elf.instrument === 'HARP') {
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(24, -14 + armWave * 0.5, 11, -Math.PI * 0.4, Math.PI * 0.7);
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#fde047';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(16, -24 + armWave * 0.5);
      ctx.lineTo(36, -20 + armWave);
      ctx.stroke();
    }

    ctx.restore();
  });
}

// 9. Butterflies & Forest Songbird
function drawButterflies() {
  butterflies.forEach(b => {
    ctx.save();
    ctx.translate(b.x, b.y);
    const angle = Math.atan2(b.vy, b.vx);
    ctx.rotate(angle * 0.35);
    ctx.scale(b.scale, b.scale);

    const wingW = Math.abs(Math.sin(b.wingPhase)) * 16 + 3;
    ctx.fillStyle = `hsla(${b.hue}, 90%, 68%, 0.88)`;
    ctx.beginPath();
    ctx.ellipse(-4, -6, wingW, 11, -0.3, 0, Math.PI * 2);
    ctx.ellipse(-4, 6, wingW * 0.8, 8, 0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.ellipse(0, 0, 6, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawBirds() {
  birds.forEach(bird => {
    ctx.save();
    ctx.translate(bird.x, bird.y - Math.abs(Math.sin(bird.hopPhase)) * 5);

    // Blue-emerald woodland songbird
    ctx.fillStyle = '#0ea5e9';
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 11, -0.15, 0, Math.PI * 2);
    ctx.fill();

    // Warm golden breast
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(6, 2, 8, -0.4, Math.PI * 0.7);
    ctx.fill();

    // Head & beak
    ctx.fillStyle = '#0284c7';
    ctx.beginPath();
    ctx.arc(12, -8, 8.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.moveTo(19, -10);
    ctx.lineTo(27, -7);
    ctx.lineTo(19, -5);
    ctx.closePath();
    ctx.fill();

    // Wing

    ctx.ellipse(-3, -2 - flap, 12, 6, -0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  });
}

// 10. Bioluminescent Mushrooms & Lush Swaying Ferns
function drawMushroomsAndFerns() {
  // Draw glowing mushrooms
  mushrooms.forEach(m => {
    const my = m.y + m.bounce * 18;
    ctx.save();
    ctx.translate(m.x, my);

    // Stem
    ctx.fillStyle = '#e2e8f0';
    ctx.beginPath();
    ctx.moveTo(-m.r * 0.22, 0);
    ctx.quadraticCurveTo(-m.r * 0.15, -m.r * 0.9, -m.r * 0.12, -m.r * 1.4);
    ctx.lineTo(m.r * 0.12, -m.r * 1.4);
    ctx.quadraticCurveTo(m.r * 0.15, -m.r * 0.9, m.r * 0.25, 0);
    ctx.closePath();
    ctx.fill();

    // Bioluminescent aura
    const aura = ctx.createRadialGradient(0, -m.r * 1.4, 2, 0, -m.r * 1.4, m.r * 2.4);
    aura.addColorStop(0, `hsla(${m.hue}, 95%, 72%, ${m.glow * 0.65})`);
    aura.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(0, -m.r * 1.4, m.r * 2.4, 0, Math.PI * 2);
    ctx.fill();

    // Cap
    const capGrad = ctx.createRadialGradient(0, -m.r * 1.7, 2, 0, -m.r * 1.3, m.r * 1.1);
    capGrad.addColorStop(0, `hsl(${m.hue}, 95%, 82%)`);
    capGrad.addColorStop(0.6, `hsl(${m.hue}, 85%, 55%)`);
    capGrad.addColorStop(1, `hsl(${m.hue}, 80%, 32%)`);
    ctx.fillStyle = capGrad;
    ctx.beginPath();
    ctx.arc(0, -m.r * 1.25, m.r, Math.PI, 0);
    ctx.quadraticCurveTo(0, -m.r * 1.0, -m.r, -m.r * 1.25);
    ctx.fill();

    ctx.restore();
  });

  // Draw swaying ferns
  ferns.forEach(fn => {
    ctx.save();
    ctx.translate(fn.x, fn.y);
    ctx.scale(fn.flip * fn.scale, fn.scale);
    for (let i = 0; i < fn.fronds; i++) {
      const baseAngle = -0.35 - (i / fn.fronds) * 1.15;
      const sway = Math.sin(time * 1.4 + fn.phase + i * 0.4) * 0.06;
      ctx.save();
      ctx.rotate(baseAngle + sway);
      ctx.fillStyle = i % 2 === 0 ? '#1e5231' : '#286a3f';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(65, -26, 135, -8);
      ctx.quadraticCurveTo(65, 10, 0, 0);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  });
}

// 11. Golden Energy Orbs Flowing into the Tree
function drawEnergyOrbs() {
  energyOrbs.forEach(o => {
    if (o.progress < 0) return;
    const t = Math.min(1, o.progress);
    const px = (1 - t) * (1 - t) * o.x + 2 * (1 - t) * t * o.cx + t * t * o.tx;
    const py = (1 - t) * (1 - t) * o.y + 2 * (1 - t) * t * o.cy + t * t * o.ty;

    const grad = ctx.createRadialGradient(px, py, 1, px, py, o.size * 3.2);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.35, `hsla(${o.hue}, 100%, 68%, 0.9)`);
    grad.addColorStop(1, 'rgba(255, 200, 60, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(px, py, o.size * 3.2, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ==========================================
// 12. ORGANIC CARVED WOOD & AMBER EQUATION PLAQUES (Zero White Rectangles)
// ==========================================
function drawEquationPlaques() {
  plaques.forEach(p => {
    ctx.save();

    const shakeOffset = p.shakeTime > 0 ? Math.sin(p.shakeTime * 55) * p.shakeMag * (p.shakeTime / 0.55) : 0;
    const bobY = Math.sin(time * 1.6 + p.index * 1.1) * 3.5;

    ctx.translate(p.x + shakeOffset, p.y + bobY);
    ctx.scale(p.scalePop, p.scalePop);

    const hw = p.w * 0.5;
    const hh = p.h * 0.5;

    // Connecting living vine tendrils to the forest edge
    ctx.strokeStyle = p.solved ? '#4ade80' : '#1f492d';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(-hw - 70, -18);
    ctx.quadraticCurveTo(-hw - 20, -28, -hw + 20, -14);
    ctx.moveTo(-hw - 70, 24);
    ctx.quadraticCurveTo(-hw - 25, 34, -hw + 20, 18);
    ctx.stroke();

    // Soft drop shadow beneath the carved wooden log plaque
    ctx.fillStyle = 'rgba(3, 10, 6, 0.62)';
    drawOrganicLogPath(0, 12, hw + 4, hh + 4, p.seed);
    ctx.fill();

    // Outer mossy bark rim
    const barkGrad = ctx.createLinearGradient(0, -hh, 0, hh);
    barkGrad.addColorStop(0, p.solved ? '#5b4027' : '#3a2416');
    barkGrad.addColorStop(0.5, '#29180e');
    barkGrad.addColorStop(1, '#1b0f08');
    ctx.fillStyle = barkGrad;
    drawOrganicLogPath(0, 0, hw, hh, p.seed);
    ctx.fill();

    // Inner carved warm heartwood face with rich wood-grain gradient
    const woodGrad = ctx.createLinearGradient(-hw, -hh, hw, hh);
    if (p.solved) {
      woodGrad.addColorStop(0, '#6e4726');
      woodGrad.addColorStop(0.5, '#59381d');
      woodGrad.addColorStop(1, '#442913');
    } else {
      woodGrad.addColorStop(0, '#4d311c');
      woodGrad.addColorStop(0.5, '#3b2414');
      woodGrad.addColorStop(1, '#2b190d');
    }
    ctx.fillStyle = woodGrad;
    drawOrganicLogPath(0, 0, hw - 12, hh - 11, p.seed);
    ctx.fill();

    // Subtle wood-grain rings & golden rim highlight
    ctx.strokeStyle = p.solved ? 'rgba(253, 224, 71, 0.55)' : 'rgba(160, 110, 70, 0.28)';
    ctx.lineWidth = p.solved ? 3 : 1.8;
    drawOrganicLogPath(0, 0, hw - 12, hh - 11, p.seed);
    ctx.stroke();

    // Wood grain lines inside plaque
    ctx.strokeStyle = 'rgba(24, 13, 7, 0.28)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-hw + 35, -hh + 28);
    ctx.quadraticCurveTo(0, -hh + 18, hw - 35, -hh + 30);
    ctx.moveTo(-hw + 40, hh - 26);
    ctx.quadraticCurveTo(0, hh - 16, hw - 40, hh - 28);
    ctx.stroke();

    // Lush emerald moss cushions along top & bottom edges of the plaque
    ctx.fillStyle = p.solved ? '#34d399' : '#255c36';
    for (let m = -4; m <= 4; m++) {
      const mx = m * 82 + Math.sin(p.seed + m) * 14;
      const my = (m % 2 === 0 ? -hh + 6 : hh - 6);
      ctx.beginPath();
      ctx.ellipse(mx, my, 28, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Tiny blooming flowers on the plaque itself once solved!
      if (p.solved && m % 2 === 0) {
        const fb = p.vineBloom;
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(mx, my - 2, 6 * fb, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#34d399';
      }
    }

    // ==========================================
    // DRAW 3-COMPONENT, 2-SIGN EQUATION: A [op1] B [op2] C = R
    // ==========================================
    drawAmberMedallionNumber(-335, 0, p.a, p.solved);

    // First Sign Slot (between A and B)
    if (p.solved) {
      drawSolvedSignMedallion(SLOT1_X, 0, p.op1);
    } else {
      drawInteractiveSignRunes(SLOT1_X, 0, p.hover1Plus, p.hover1Minus, p.chosenOp1, p.wrongResetTimer > 0);
    }

    drawAmberMedallionNumber(-75, 0, p.b, p.solved);

    // Second Sign Slot (between B and C)
    if (p.solved) {
      drawSolvedSignMedallion(SLOT2_X, 0, p.op2);
    } else {
      drawInteractiveSignRunes(SLOT2_X, 0, p.hover2Plus, p.hover2Minus, p.chosenOp2, p.wrongResetTimer > 0);
    }

    drawAmberMedallionNumber(185, 0, p.c, p.solved);
    drawCarvedEquals(262, 0, p.solved);
    drawAmberMedallionNumber(335, 0, p.r, p.solved);

    ctx.restore();
  });
}

// Helper: Organic curved wooden log contour (zero sharp rectangular corners)
function drawOrganicLogPath(cx, cy, hw, hh, seed) {
  const k1 = Math.sin(seed) * 7;
  const k2 = Math.cos(seed * 1.7) * 7;
  ctx.beginPath();
  ctx.moveTo(cx - hw + 45, cy - hh + k1);
  ctx.bezierCurveTo(cx - hw * 0.3, cy - hh - 8, cx + hw * 0.3, cy - hh + 6, cx + hw - 45, cy - hh + k2);
  ctx.bezierCurveTo(cx + hw + 8, cy - hh + 12, cx + hw + 10, cy + hh - 12, cx + hw - 45, cy + hh - k1);
  ctx.bezierCurveTo(cx + hw * 0.3, cy + hh + 8, cx - hw * 0.3, cy + hh - 6, cx - hw + 45, cy + hh - k2);
  ctx.bezierCurveTo(cx - hw - 8, cy + hh - 12, cx - hw - 10, cy - hh + 12, cx - hw + 45, cy - hh + k1);
  ctx.closePath();
}

// Amber Resin & Mossy Stone Medallion for Numbers
function drawAmberMedallionNumber(x, y, num, isSolved) {
  ctx.save();
  ctx.translate(x, y);

  const r = 39;
  // Recessed wood socket
  ctx.fillStyle = 'rgba(15, 8, 4, 0.65)';
  ctx.beginPath();
  ctx.arc(0, 3, r + 4, 0, Math.PI * 2);
  ctx.fill();

  // Translucent amber/forest gem base
  const gemGrad = ctx.createRadialGradient(-10, -12, 4, 0, 0, r);
  if (isSolved) {
    gemGrad.addColorStop(0, '#fef08a');
    gemGrad.addColorStop(0.55, '#f59e0b');
    gemGrad.addColorStop(1, '#78350f');
  } else {
    gemGrad.addColorStop(0, '#527955');
    gemGrad.addColorStop(0.6, '#27462d');
    gemGrad.addColorStop(1, '#132617');
  }
  ctx.fillStyle = gemGrad;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = isSolved ? '#fef08a' : '#86efac';
  ctx.lineWidth = 2.4;
  ctx.stroke();

  // Specular gem highlight
  ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
  ctx.beginPath();
  ctx.ellipse(-9, -15, 15, 7, -0.35, 0, Math.PI * 2);
  ctx.fill();

  // Carved glowing numeral
  ctx.font = 'bold 42px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(15, 10, 5, 0.6)';
  ctx.fillText(String(num), 2, 4);

  ctx.fillStyle = isSolved ? '#fffbeb' : '#fef3c7';
  ctx.fillText(String(num), 0, 1);

  ctx.restore();
}

// Interactive '+' and '-' Twig Runes inside each Missing Sign Socket
function drawInteractiveSignRunes(x, y, hoverPlus, hoverMinus, chosenSign, isWrongShake) {
  ctx.save();
  ctx.translate(x, y);

  // Carved twin-socket recess in the wood plaque
  ctx.fillStyle = 'rgba(14, 8, 4, 0.75)';
  ctx.beginPath();
  ctx.roundRect(-70, -39, 140, 78, 39);
  ctx.fill();

  ctx.strokeStyle = isWrongShake
    ? 'rgba(248, 113, 113, 0.7)'
    : (chosenSign ? 'rgba(74, 222, 128, 0.75)' : 'rgba(250, 204, 21, 0.38)');
  ctx.lineWidth = chosenSign ? 2.6 : 1.8;
  ctx.stroke();

  // Left Rune: '+' (Crossed Living Golden Twigs)
  drawRuneButton(-RUNE_OFFSET, 0, '+', hoverPlus, chosenSign === '+', isWrongShake);

  // Right Rune: '-' (Glowing Amber Branch)
  drawRuneButton(RUNE_OFFSET, 0, '-', hoverMinus, chosenSign === '-', isWrongShake);

  ctx.restore();
}

function drawRuneButton(x, y, sign, hover, isSelected, isWrongShake) {
  ctx.save();
  ctx.translate(x, y);
  const s = 1 + hover * 0.12 + (isSelected ? 0.1 : 0);
  ctx.scale(s, s);

  const r = RUNE_RADIUS;
  const grad = ctx.createRadialGradient(-7, -9, 3, 0, 0, r);
  if (isSelected && isWrongShake) {
    grad.addColorStop(0, '#fca5a5');
    grad.addColorStop(0.65, '#dc2626');
    grad.addColorStop(1, '#450a0a');
  } else if (isSelected) {
    grad.addColorStop(0, '#dcfce7');
    grad.addColorStop(0.6, '#22c55e');
    grad.addColorStop(1, '#14532d');
  } else {
    grad.addColorStop(0, hover > 0.2 ? '#fef08a' : '#fbbf24');
    grad.addColorStop(0.65, hover > 0.2 ? '#f59e0b' : '#b45309');
    grad.addColorStop(1, '#451a03');
  }
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = isSelected ? '#fef08a' : (hover > 0.2 ? '#ffffff' : '#fde047');
  ctx.lineWidth = isSelected ? 3 : 2.2;
  ctx.stroke();

  // Draw twig sign '+' or '-'
  ctx.strokeStyle = '#fffbeb';
  ctx.lineWidth = 6.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-12, 0);
  ctx.lineTo(12, 0);
  if (sign === '+') {
    ctx.moveTo(0, -12);
    ctx.lineTo(0, 12);
  }
  ctx.stroke();

  // Tiny leaf bud on twig rune
  ctx.fillStyle = isSelected ? '#fef08a' : '#4ade80';
  ctx.beginPath();
  ctx.ellipse(10, -4, 4.5, 2.2, -0.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawSolvedSignMedallion(x, y, sign, scaleFactor = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scaleFactor, scaleFactor);

  const r = 36;
  const grad = ctx.createRadialGradient(-8, -10, 4, 0, 0, r);
  grad.addColorStop(0, '#dcfce7');
  grad.addColorStop(0.55, '#22c55e');
  grad.addColorStop(1, '#14532d');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#fef08a';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.strokeStyle = '#fffbeb';
  ctx.lineWidth = 7.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-14, 0);
  ctx.lineTo(14, 0);
  if (sign === '+') {
    ctx.moveTo(0, -14);
    ctx.lineTo(0, 14);
  }
  ctx.stroke();

  ctx.restore();
}

// Carved Wooden Twig '=' Sign
function drawCarvedEquals(x, y, isSolved) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = isSolved ? '#fef08a' : '#fcd34d';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-14, -8);
  ctx.lineTo(14, -8);
  ctx.moveTo(-14, 8);
  ctx.lineTo(14, 8);
  ctx.stroke();
  ctx.restore();
}

// 13. Fireflies, Falling Petals & Sparkles
function drawFirefliesAndPetals() {
  // Fireflies
  fireflies.forEach(f => {
    const alpha = 0.35 + Math.sin(time * 3 + f.phase) * 0.35;
    const grad = ctx.createRadialGradient(f.x, f.y, 0.5, f.x, f.y, f.r * 4);
    grad.addColorStop(0, `hsla(${f.hue}, 100%, 88%, ${alpha})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r * 4, 0, Math.PI * 2);
    ctx.fill();
  });

  // Drifting Blossom Petals
  fallingPetals.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = `hsla(${p.hue}, 88%, 76%, 0.88)`;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawSparkles() {
  sparkles.forEach(s => {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.fillStyle = `hsla(${s.hue}, 100%, 78%, ${s.alpha})`;
    ctx.beginPath();
    // 4-point star sparkle
    const r = s.size;
    ctx.moveTo(0, -r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.quadraticCurveTo(0, 0, 0, r);
    ctx.quadraticCurveTo(0, 0, -r, 0);
    ctx.quadraticCurveTo(0, 0, 0, -r);
    ctx.fill();
    ctx.restore();
  });
}

// ==========================================
// 14. MINIMALIST ORGANIC ICON-ONLY BUTTONS (Top-Right)
// ==========================================
function drawTopRightButtons() {
  // 1. Minimalist "Next Round" Leaf-Arrow Medallion
  drawOrganicRoundButton(uiButtons.next, () => {
    ctx.strokeStyle = '#fef08a';
    ctx.fillStyle = '#fef08a';
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.lineTo(12, 0);
    ctx.moveTo(2, -11);
    ctx.lineTo(15, 0);
    ctx.lineTo(2, 11);
    ctx.stroke();
  });

  // 2. Sound Mute/Unmute Speaker Icon
  drawOrganicRoundButton(uiButtons.sound, () => {
    ctx.fillStyle = '#fef08a';
    ctx.strokeStyle = '#fef08a';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-12, -5);
    ctx.lineTo(-5, -5);
    ctx.lineTo(3, -12);
    ctx.lineTo(3, 12);
    ctx.lineTo(-5, 5);
    ctx.lineTo(-12, 5);
    ctx.closePath();
    ctx.fill();

    if (!audio.muted) {
      ctx.beginPath();
      ctx.arc(5, 0, 7, -0.7, 0.7);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(5, 0, 13, -0.7, 0.7);
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#f87171';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(-12, -12);
      ctx.lineTo(12, 12);
      ctx.stroke();
    }
  });
}

function drawOrganicRoundButton(btn, drawIconFn) {
  ctx.save();
  ctx.translate(btn.x, btn.y);
  const s = 1 + btn.hover * 0.1 - btn.press * 0.12;
  ctx.scale(s, s);

  // Carved mossy wood & amber rim
  const grad = ctx.createRadialGradient(-8, -8, 2, 0, 0, btn.r);
  grad.addColorStop(0, '#3a6b48');
  grad.addColorStop(0.65, '#1e3f29');
  grad.addColorStop(1, '#0f2316');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, btn.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = btn.hover > 0.2 ? '#fef08a' : 'rgba(253, 224, 71, 0.55)';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  drawIconFn();
  ctx.restore();
}

// ==========================================
// BOOTSTRAP & MAIN LOOP
// ==========================================
function mainLoop(timestamp) {
  if (!lastTimestamp) lastTimestamp = timestamp;
  const dt = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
  lastTimestamp = timestamp;

  update(dt);
  render();
  requestAnimationFrame(mainLoop);
}

window.onload = function () {
  handleResize();
  initEnvironment();
  generateEquations();
  requestAnimationFrame(mainLoop);
};
</script>
