<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1b2a38;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  #stage {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: default;
  }

  /* Wooden & Brass Harbor Dispatch Plaque (No white rectangles) */
  .dispatch-panel {
    position: fixed;
    top: 20px;
    left: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 14px;
    background:
      repeating-linear-gradient(
        88deg,
        rgba(255, 215, 160, 0.04) 0px,
        rgba(255, 215, 160, 0.04) 2px,
        rgba(0, 0, 0, 0.08) 2px,
        rgba(0, 0, 0, 0.08) 6px
      ),
      linear-gradient(160deg, #5c3a21 0%, #3d2413 55%, #2b180c 100%);
    border: 2.5px solid #b88a44;
    box-shadow:
      0 10px 28px rgba(0, 0, 0, 0.45),
      inset 0 2px 3px rgba(255, 224, 168, 0.35),
      inset 0 -3px 6px rgba(0, 0, 0, 0.6);
    z-index: 20;
    transition: transform 0.2s ease;
  }

  .dispatch-panel.shake {
    animation: panelShake 0.36s ease;
  }

  @keyframes panelShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(4px); }
  }

  .rivet {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #f5d896, #8f6324 70%, #4d320d 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.7);
    pointer-events: none;
  }
  .rivet.tl { top: 5px; left: 5px; }
  .rivet.tr { top: 5px; right: 5px; }
  .rivet.bl { bottom: 5px; left: 5px; }
  .rivet.br { bottom: 5px; right: 5px; }

  .slate-wrap {
    position: relative;
    border-radius: 9px;
    padding: 3px;
    background: linear-gradient(145deg, #21140a, #6b4c28);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.75);
  }

  #numInput {
    width: 96px;
    height: 52px;
    border: none;
    outline: none;
    border-radius: 7px;
    background:
      radial-gradient(ellipse at 30% 20%, #2c3e4c 0%, #1c2833 70%, #141d26 100%);
    color: #f6e7c8;
    font-size: 32px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 2px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.65);
    box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.7);
    caret-color: #f0b85b;
    appearance: textfield;
    -moz-appearance: textfield;
    transition: box-shadow 0.2s ease, background 0.2s ease;
  }

  #numInput::-webkit-outer-spin-button,
  #numInput::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  #numInput:focus {
    box-shadow:
      inset 0 3px 8px rgba(0, 0, 0, 0.7),
      0 0 0 2px rgba(240, 184, 91, 0.7);
  }

  .brass-btn {
    position: relative;
    width: 52px;
    height: 52px;
    border: 2px solid #e2bc72;
    border-radius: 11px;
    background: linear-gradient(160deg, #d9a74f 0%, #a87528 55%, #7a5015 100%);
    box-shadow:
      0 4px 10px rgba(0,0,0,0.45),
      inset 0 2px 3px rgba(255, 240, 195, 0.55),
      inset 0 -3px 5px rgba(55, 30, 5, 0.6);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, filter 0.15s ease, box-shadow 0.12s ease;
  }

  .brass-btn:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
  }

  .brass-btn:active {
    transform: translateY(2px) scale(0.96);
    box-shadow:
      0 1px 4px rgba(0,0,0,0.5),
      inset 0 2px 6px rgba(40, 20, 4, 0.65);
  }

  .brass-btn svg {
    width: 26px;
    height: 26px;
    fill: #291708;
    filter: drop-shadow(0 1px 0 rgba(255, 232, 180, 0.55));
  }

  /* Minimalist Top-Right Controls: Sound + Next */
  .top-right-controls {
    position: fixed;
    top: 20px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 20;
  }

  .mini-brass {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid #d7ae60;
    background: radial-gradient(circle at 32% 28%, #e4b863, #9e6e24 68%, #6d4710 100%);
    box-shadow:
      0 6px 16px rgba(0, 0, 0, 0.4),
      inset 0 2px 3px rgba(255, 242, 204, 0.6),
      inset 0 -2px 5px rgba(45, 25, 5, 0.6);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.14s ease, filter 0.15s ease;
  }

  .mini-brass:hover {
    filter: brightness(1.12);
    transform: scale(1.06);
  }

  .mini-brass:active {
    transform: scale(0.94);
  }

  .mini-brass svg {
    width: 22px;
    height: 22px;
    fill: #281607;
    filter: drop-shadow(0 1px 0 rgba(255, 236, 190, 0.5));
  }

  .mini-brass.pulse {
    animation: brassPulse 1.6s infinite ease-in-out;
  }

  @keyframes brassPulse {
    0%, 100% { box-shadow: 0 6px 16px rgba(0,0,0,0.4), 0 0 0 0 rgba(240, 194, 98, 0.65); }
    50% { box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 0 0 12px rgba(240, 194, 98, 0); }
  }

  /* Hidden-input mode */
  .dispatch-panel.masked .slate-wrap {
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,0.75),
      0 0 0 2px rgba(240, 184, 91, 0.28);
  }

  #numInput[type="password"] {
    letter-spacing: 4px;
    font-size: 34px;
  }

  .mini-brass.masked-on {
    box-shadow:
      0 0 0 2px rgba(240, 184, 91, 0.75),
      0 6px 16px rgba(0, 0, 0, 0.4),
      inset 0 2px 3px rgba(255, 242, 204, 0.6),
      inset 0 -2px 5px rgba(45, 25, 5, 0.6);
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div class="dispatch-panel" id="dispatchPanel">
  <span class="rivet tl"></span>
  <span class="rivet tr"></span>
  <span class="rivet bl"></span>
  <span class="rivet br"></span>
  <div class="slate-wrap">
    <input id="numInput" type="number" min="0" max="100" inputmode="numeric" autocomplete="off" aria-label="Number">
  </div>
  <button class="brass-btn" id="goBtn" aria-label="Dispatch">
    <svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg>
  </button>
</div>

<div class="top-right-controls">
  <button class="mini-brass" id="hideBtn" aria-label="Hidden input" title="Приховати число">
    <svg id="eyeIconOpen" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
    <svg id="eyeIconOff" viewBox="0 0 24 24" style="display:none"><path d="M12 6.5c2.76 0 5 2.24 5 5 0 .51-.1 1-.24 1.46l3.06 3.06c1.39-1.23 2.49-2.77 3.18-4.53C21.27 7.11 17 4 12 4c-1.27 0-2.49.2-3.64.57l2.17 2.17c.47-.14.96-.24 1.47-.24zM2.71 3.16c-.39.39-.39 1.02 0 1.41l1.97 1.97C3.06 7.83 1.77 9.53 1 11.5 2.73 15.89 7 19 12 19c1.52 0 2.97-.3 4.31-.82l2.72 2.72c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L4.13 3.16c-.39-.39-1.03-.39-1.42 0zM12 16.5c-2.76 0-5-2.24-5-5 0-.77.18-1.5.49-2.14l1.57 1.57c-.03.18-.06.37-.06.57 0 1.66 1.34 3 3 3 .2 0 .38-.03.57-.07L14.14 16c-.65.32-1.37.5-2.14.5zm2.97-5.33c-.15-1.4-1.25-2.49-2.64-2.64l2.64 2.64z"/></svg>
  </button>
  <button class="mini-brass" id="soundBtn" aria-label="Sound">
    <svg id="soundIconOn" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    <svg id="soundIconOff" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
  </button>
  <button class="mini-brass" id="nextBtn" aria-label="Next">
    <svg viewBox="0 0 24 24"><path d="M5 13h11.17l-4.88 4.88c-.39.39-.39 1.03 0 1.42.39.39 1.02.39 1.41 0l6.59-6.59c.39-.39.39-1.02 0-1.41l-6.58-6.6c-.39-.39-1.02-.39-1.41 0-.39.39-.39 1.02 0 1.41L16.17 11H5c-.55 0-1 .45-1 1s.45 1 1 1z"/></svg>
  </button>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const numInput = document.getElementById('numInput');
  const goBtn = document.getElementById('goBtn');
  const nextBtn = document.getElementById('nextBtn');
  const soundBtn = document.getElementById('soundBtn');
  const soundIconOn = document.getElementById('soundIconOn');
  const soundIconOff = document.getElementById('soundIconOff');
  const dispatchPanel = document.getElementById('dispatchPanel');
  const hideBtn = document.getElementById('hideBtn');
  const eyeIconOpen = document.getElementById('eyeIconOpen');
  const eyeIconOff = document.getElementById('eyeIconOff');
  let hiddenInput = false;

  function setHiddenInput(on) {
    hiddenInput = on;
    // Preserve current value while switching input type
    const v = numInput.value;
    numInput.type = on ? 'password' : 'number';
    numInput.value = v;
    eyeIconOpen.style.display = on ? 'none' : 'block';
    eyeIconOff.style.display = on ? 'block' : 'none';
    dispatchPanel.classList.toggle('masked', on);
    hideBtn.classList.toggle('masked-on', on);
    numInput.focus();
    numInput.select();
  }

  let W = window.innerWidth;
  let H = window.innerHeight;
  let DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    recomputeWorkerTargets();
  }

  // ==================== WEB AUDIO ENGINE ====================
  const Sound = {
    ctx: null,
    muted: false,
    lastStepTime: 0,
    leaveStreak: 0,

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    },

    playBell() {
      if (this.muted) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const freqs = [587.33, 880, 1174.66];
      freqs.forEach((f, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = i === 0 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(f, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(i === 0 ? 0.18 : 0.07, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.65 - i * 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.7);
      });
    },

    playFootstep(heavy = false) {
      if (this.muted || !this.ctx) return;
      const now = this.ctx.currentTime;
      if (now - this.lastStepTime < 0.075) return;
      this.lastStepTime = now;

      const dur = heavy ? 0.065 : 0.045;
      const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * dur), this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (data.length * 0.28));
      }
      const src = this.ctx.createBufferSource();
      src.buffer = buf;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = heavy ? 220 : 380;

      const gain = this.ctx.createGain();
      gain.gain.value = heavy ? 0.11 : 0.06;

      src.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      src.start(now);
    },

    playWoodThud(heavy = false) {
      if (this.muted || !this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      const base = heavy ? 95 : 145;
      osc.frequency.setValueAtTime(base * 1.4, now);
      osc.frequency.exponentialRampToValueAtTime(base * 0.65, now + 0.09);
      gain.gain.setValueAtTime(heavy ? 0.14 : 0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    },

    playLeave(isTen) {
      if (this.muted) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const pentatonic = [392.0, 440.0, 493.88, 587.33, 659.25, 783.99, 880.0, 987.77, 1174.66];
      const idx = this.leaveStreak % pentatonic.length;
      this.leaveStreak++;
      const freq = pentatonic[idx] * (isTen ? 0.75 : 1.0);

      // Warm marimba/kalimba double note
      [1, 1.5].forEach((mult, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = i === 0 ? 'sine' : 'triangle';
        const t = now + i * 0.055;
        osc.frequency.setValueAtTime(freq * mult, t);
        osc.frequency.exponentialRampToValueAtTime(freq * mult * 1.02, t + 0.18);
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.exponentialRampToValueAtTime(i === 0 ? 0.18 : 0.11, t + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.34);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.36);
      });

      // Soft air whoosh
      const dur = 0.12;
      const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * dur), this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.sin((i / data.length) * Math.PI);
      }
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(600, now);
      filter.frequency.exponentialRampToValueAtTime(1400, now + dur);
      const g = this.ctx.createGain();
      g.gain.value = 0.05;
      src.connect(filter);
      filter.connect(g);
      g.connect(this.ctx.destination);
      src.start(now);
    },

    playCelebration() {
      if (this.muted) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      notes.forEach((f, i) => {
        const t = now + i * 0.085;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, t);
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.exponentialRampToValueAtTime(0.15, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.55);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.6);
      });

      // Warm distant harbor horn harmony
      [130.81, 196.0].forEach((f) => {
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(f, now + 0.15);
        filter.type = 'lowpass';
        filter.frequency.value = 340;
        gain.gain.setValueAtTime(0.001, now + 0.15);
        gain.gain.linearRampToValueAtTime(0.055, now + 0.35);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.25);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + 0.15);
        osc.stop(now + 1.3);
      });
    },

    playBump() {
      if (this.muted) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.15);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    }
  };

  // ==================== UTILITIES ====================
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function shadeHex(hex, percent) {
    const num = parseInt(hex.replace('#', ''), 16);
    const r = clamp((num >> 16) + Math.round(2.55 * percent), 0, 255);
    const g = clamp(((num >> 8) & 0xff) + Math.round(2.55 * percent), 0, 255);
    const b = clamp((num & 0xff) + Math.round(2.55 * percent), 0, 255);
    return `rgb(${r},${g},${b})`;
  }

  // ==================== ENVIRONMENT ENTITIES ====================
  const clouds = Array.from({ length: 7 }, (_, i) => ({
    x: rand(-100, 1600),
    y: rand(35, 175),
    scale: rand(0.65, 1.45),
    speed: rand(6, 16),
    puffs: Array.from({ length: 5 }, () => ({
      ox: rand(-48, 48),
      oy: rand(-14, 14),
      r: rand(22, 42)
    }))
  }));

  const gulls = Array.from({ length: 6 }, () => ({
    x: rand(0, 1600),
    y: rand(55, 220),
    vx: rand(28, 56) * (Math.random() < 0.5 ? 1 : -1),
    wingPhase: rand(0, Math.PI * 2),
    wingSpeed: rand(4.5, 6.8),
    scale: rand(0.55, 1.05),
    swoop: 0
  }));

  const motes = Array.from({ length: 28 }, () => ({
    x: rand(0, 1),
    y: rand(0.25, 0.92),
    r: rand(1.1, 2.6),
    phase: rand(0, Math.PI * 2),
    speed: rand(0.25, 0.7)
  }));

  const particles = [];

  function spawnClickParticles(x, y, isTen) {
    const colors = isTen
      ? ['#f6c967', '#e09132', '#ffe7a8', '#c97a2b', '#8bc34a']
      : ['#f8d878', '#ff9e5e', '#7fd1e8', '#f2e2ba', '#e87a64'];
    const count = isTen ? 26 : 16;
    for (let i = 0; i < count; i++) {
      const ang = rand(-Math.PI, Math.PI);
      const spd = rand(70, isTen ? 260 : 200);
      particles.push({
        x: x + rand(-18, 18),
        y: y + rand(-30, 15),
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - rand(50, 130),
        size: rand(3, 7),
        color: pick(colors),
        rot: rand(0, Math.PI * 2),
        vrot: rand(-8, 8),
        life: 1,
        decay: rand(1.1, 1.9),
        shape: Math.random() < 0.45 ? 'star' : 'rect'
      });
    }
    // Ground dust puffs
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: x + rand(-24, 24),
        y: y + 55,
        vx: rand(-45, 45),
        vy: rand(-25, -5),
        size: rand(8, 16),
        color: 'rgba(225, 208, 182, 0.55)',
        rot: 0,
        vrot: 0,
        life: 1,
        decay: rand(1.6, 2.4),
        shape: 'dust'
      });
    }
  }

  // ==================== REALISTIC CHARACTER GENERATOR ====================
  const SKIN_TONES = [
    '#f6d5be', '#ecc0a1', '#dfaa84', '#c98b63', '#a66b47', '#7f4c2f', '#5b341e'
  ];
  const HAIR_COLORS = [

  function createPersonAppearance() {

  // ==================== WORKERS STATE ====================
  let workers = [];
  let currentNumber = null;
  let hoveredWorker = null;
  let waveHadWorkers = false;
  let celebrationGlow = 0;

  function computeLayoutSlots(tensCount, onesCount) {
    const total = tensCount + onesCount;
    const slots = [];
    if (total === 0) return slots;

    const pierTop = H * 0.63;
    const pierBottom = H * 0.87;
    const marginX = Math.max(70, W * 0.07);
    const usableW = W - marginX * 2;

    const twoRows = total > 9;
    const backY = pierTop + (pierBottom - pierTop) * 0.28;
    const frontY = pierTop + (pierBottom - pierTop) * 0.86;
    const midY = pierTop + (pierBottom - pierTop) * 0.62;

    const groupGap = (tensCount > 0 && onesCount > 0) ? Math.min(72, usableW * 0.055) : 0;

    // Proportional horizontal zones for tens and ones
    const tensWeight = tensCount > 0 ? Math.max(tensCount, 1.4) : 0;
    const onesWeight = onesCount > 0 ? Math.max(onesCount, 1.2) : 0;
    const totalWeight = tensWeight + onesWeight;

    const availW = usableW - groupGap;
    const tensZoneW = tensCount > 0 ? availW * (tensWeight / totalWeight) : 0;
    const onesZoneW = onesCount > 0 ? availW * (onesWeight / totalWeight) : 0;

    const tensStartX = marginX;
    const onesStartX = marginX + tensZoneW + groupGap;

    function placeGroup(count, startX, zoneW, isTen) {
      if (count === 0) return;
      if (!twoRows || count <= 4) {
        const step = count === 1 ? 0 : zoneW / (count - 1);
        for (let i = 0; i < count; i++) {
          const x = count === 1 ? startX + zoneW * 0.5 : startX + i * step;
          const yOffset = (i % 2 === 0 ? -1 : 1) * 10;
          slots.push({
            x,
            y: midY + yOffset,
            depthScale: 1.0,
            isTen
          });
        }
      } else {
        const backCount = Math.ceil(count / 2);
        const frontCount = count - backCount;
        const backStep = backCount === 1 ? 0 : zoneW / (backCount - 1);
        for (let i = 0; i < backCount; i++) {
          const x = backCount === 1 ? startX + zoneW * 0.5 : startX + i * backStep;
          slots.push({
            x,
            y: backY + (i % 2) * 8,
            depthScale: 0.86,
            isTen
          });
        }
        const frontPad = zoneW * 0.08;
        const frontSpan = Math.max(10, zoneW - frontPad * 2);
        const frontStep = frontCount === 1 ? 0 : frontSpan / (frontCount - 1);
        for (let i = 0; i < frontCount; i++) {
          const x = frontCount === 1 ? startX + zoneW * 0.5 : startX + frontPad + i * frontStep;
          slots.push({
            x,
            y: frontY + (i % 2) * 8,
            depthScale: 1.02,
            isTen
          });
        }
      }
    }

    placeGroup(tensCount, tensStartX, tensZoneW, true);
    placeGroup(onesCount, onesStartX, onesZoneW, false);

    return slots;
  }

  function recomputeWorkerTargets() {
    const active = workers.filter(w => w.state !== 'leaving');
    if (active.length === 0) return;
    const tens = active.filter(w => w.isTen);
    const ones = active.filter(w => !w.isTen);
    const slots = computeLayoutSlots(tens.length, ones.length);
    let ti = 0, oi = 0;
    slots.forEach(slot => {
      const w = slot.isTen ? tens[ti++] : ones[oi++];
      if (w) {
        w.targetX = slot.x;
        w.targetY = slot.y;
        w.depthScale = slot.depthScale;
        if (w.state === 'idle') {
          w.x = slot.x;
          w.y = slot.y;
        }
      }
    });
  }

  function spawnNumber(n) {
    Sound.init();
    n = Math.round(n);
    if (isNaN(n) || n < 0 || n > 100) {
      dispatchPanel.classList.remove('shake');
      void dispatchPanel.offsetWidth;
      dispatchPanel.classList.add('shake');
      Sound.playBump();
      return;
    }

    currentNumber = n;
    Sound.leaveStreak = 0;
    nextBtn.classList.remove('pulse');

    // Send any existing idle/entering workers off quickly
    workers.forEach(w => {
      if (w.state !== 'leaving') {
        w.state = 'leaving';
        w.leaveDir = w.x < W * 0.5 ? -1 : 1;
        w.facing = w.leaveDir;
        w.speed = rand(280, 360);
        w.smileTimer = 0.4;
      }
    });

    const tensCount = Math.floor(n / 10);
    const onesCount = n % 10;
    const slots = computeLayoutSlots(tensCount, onesCount);
    waveHadWorkers = slots.length > 0;

    if (slots.length > 0) {
      Sound.playBell();
    } else {
      Sound.playWoodThud(false);
    }

    slots.forEach((slot, idx) => {
      const fromLeft = slot.isTen ? true : (Math.random() < 0.35);
      const startX = fromLeft ? -rand(70, 260) - idx * 24 : W + rand(70, 260) + idx * 24;
      const facing = fromLeft ? 1 : -1;
      workers.push({
        id: Math.random().toString(36).slice(2),
        isTen: slot.isTen,
        x: startX,
        y: slot.y,
        targetX: slot.x,
        targetY: slot.y,
        depthScale: slot.depthScale,
        facing,
        leaveDir: facing,
        state: 'entering', // entering | idle | leaving
        speed: slot.isTen ? rand(145, 185) : rand(180, 230),
        walkPhase: rand(0, Math.PI * 2),
        breathPhase: rand(0, Math.PI * 2),
        blinkTimer: rand(1.2, 4.5),
        isBlinking: false,
        hopY: 0,
        hopVy: 0,
        smileTimer: 0,
        hoverAmt: 0,
        appearance: createPersonAppearance(),
        lastStepSin: 0
      });
    });
  }

  function generateNextNumber() {
    let candidate;
    const r = Math.random();
    do {
      if (r < 0.22) {
        candidate = Math.floor(rand(1, 10)); // 1..9
      } else if (r < 0.38) {
        candidate = Math.floor(rand(1, 10)) * 10; // 10, 20..90
      } else {
        candidate = Math.floor(rand(11, 99)); // 11..98
      }
    } while (candidate === currentNumber);
    numInput.value = candidate;
    spawnNumber(candidate);
  }

  // ==================== DRAWING: REALISTIC CRATES ====================
  function drawSingleCrate(ctx, x, y, w, h, seed = 0) {
    const depth = Math.max(4, w * 0.24);

    // Side 3D face (right)
    ctx.fillStyle = '#9c6835';
    ctx.beginPath();
    ctx.moveTo(x + w, y);
    ctx.lineTo(x + w + depth, y - depth * 0.45);
    ctx.lineTo(x + w + depth, y + h - depth * 0.45);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();

    // Top 3D face
    ctx.fillStyle = '#dfa96a';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + depth, y - depth * 0.45);
    ctx.lineTo(x + w + depth, y - depth * 0.45);
    ctx.lineTo(x + w, y);
    ctx.closePath();
    ctx.fill();

    // Front face wood gradient
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, '#d49a59');
    grad.addColorStop(0.5, '#be8142');
    grad.addColorStop(1, '#a66c31');
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);

    // Horizontal slat lines
    ctx.strokeStyle = 'rgba(72, 40, 14, 0.45)';
    ctx.lineWidth = Math.max(0.8, w * 0.035);
    ctx.beginPath();
    ctx.moveTo(x + 1, y + h * 0.34);
    ctx.lineTo(x + w - 1, y + h * 0.34);
    ctx.moveTo(x + 1, y + h * 0.68);
    ctx.lineTo(x + w - 1, y + h * 0.68);
    ctx.stroke();

    // Wooden frame border
    const bw = Math.max(1.8, w * 0.11);
    ctx.strokeStyle = '#7a4b1f';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);

    // Corner nails
    ctx.fillStyle = '#3a2412';
    const nr = Math.max(0.8, w * 0.035);
    [
      [x + bw * 0.5, y + bw * 0.5],
      [x + w - bw * 0.5, y + bw * 0.5],
      [x + bw * 0.5, y + h - bw * 0.5],
      [x + w - bw * 0.5, y + h - bw * 0.5]
    ].forEach(([nx, ny]) => {
      ctx.beginPath();
      ctx.arc(nx, ny, nr, 0, Math.PI * 2);
      ctx.fill();
    });

    // Subtle diagonal brace shadow
    ctx.strokeStyle = 'rgba(110, 62, 22, 0.25)';
    ctx.lineWidth = Math.max(1.2, w * 0.08);
    ctx.beginPath();
    ctx.moveTo(x + 2, y + h - 2);
    ctx.lineTo(x + w - 2, y + 2);
    ctx.stroke();
  }

  function drawCrateLoad(ctx, isTen, cx, cy, scale) {
    // Exact unit crate size so 10 crates are visually 10× the 1 crate!
    const cw = 21 * scale;
    const ch = 15.5 * scale;

    if (!isTen) {
      drawSingleCrate(ctx, cx - cw * 0.5, cy - ch * 0.5, cw, ch);
    } else {
      // 2 wide × 5 tall = 10 clearly distinct individual wooden crates strapped together
      const cols = 2;
      const rows = 5;
      const gapX = 1.5 * scale;
      const gapY = 1.2 * scale;
      const totalW = cols * cw + (cols - 1) * gapX;
      const totalH = rows * ch + (rows - 1) * gapY;
      const startX = cx - totalW * 0.5;
      const startY = cy - totalH + ch * 0.7;

      // Wooden carrying tray underneath
      ctx.fillStyle = '#5e3819';
      ctx.fillRect(startX - 3 * scale, startY + totalH - 1 * scale, totalW + 10 * scale, 4.5 * scale);

      // Draw from bottom to top, left to right for proper 3D overlap
      for (let r = rows - 1; r >= 0; r--) {
        for (let c = 0; c < cols; c++) {
          const bx = startX + c * (cw + gapX);
          const by = startY + r * (ch + gapY);
          drawSingleCrate(ctx, bx, by, cw, ch, r * 2 + c);
        }
      }

      // Hemp binding straps securing the 10-crate bundle
      ctx.strokeStyle = '#e5cfa3';
      ctx.lineWidth = Math.max(1.5, 2.2 * scale);
      ctx.beginPath();
      // Vertical strap
      ctx.moveTo(cx, startY - 3 * scale);
      ctx.lineTo(cx, startY + totalH + 2 * scale);
      // Horizontal mid strap
      ctx.moveTo(startX - 1 * scale, startY + totalH * 0.5);
      ctx.lineTo(startX + totalW + 5 * scale, startY + totalH * 0.5);
      ctx.stroke();

      // Brass buckle on strap
      ctx.fillStyle = '#c89b44';
      ctx.fillRect(cx - 3.5 * scale, startY + totalH * 0.5 - 3.5 * scale, 7 * scale, 7 * scale);
      ctx.strokeStyle = '#5e3e12';
      ctx.lineWidth = 1;
      ctx.strokeRect(cx - 3.5 * scale, startY + totalH * 0.5 - 3.5 * scale, 7 * scale, 7 * scale);
    }
  }

  // ==================== DRAWING: REALISTIC ARTICULATED PERSON ====================
  function drawTaperedLimb(ctx, x1, y1, x2, y2, r1, r2, color) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len;
    const ny = dx / len;

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1 + nx * r1, y1 + ny * r1);
    ctx.lineTo(x2 + nx * r2, y2 + ny * r2);
    ctx.arc(x2, y2, r2, Math.atan2(ny, nx), Math.atan2(-ny, -nx), false);
    ctx.lineTo(x1 - nx * r1, y1 - ny * r1);
    ctx.arc(x1, y1, r1, Math.atan2(-ny, -nx), Math.atan2(ny, nx), false);
    ctx.closePath();
    ctx.fill();
  }

  function drawWorker(ctx, w, time) {
    const app = w.appearance;
    const baseScale = Math.min(W / 1280, H / 720);
    const s = clamp(baseScale, 0.72, 1.25) * w.depthScale * app.heightScale;

    const walking = w.state === 'entering' || w.state === 'leaving';
    const phase = w.walkPhase;
    const stride = walking ? Math.sin(phase) : 0;
    const liftL = walking ? Math.max(0, Math.cos(phase)) : 0;
    const liftR = walking ? Math.max(0, -Math.cos(phase)) : 0;
    const bob = walking ? Math.abs(Math.sin(phase)) * (w.isTen ? 3.5 : 5.5) : Math.sin(w.breathPhase) * 1.4;
    const lean = (w.isTen ? -0.07 : 0.03) + (walking ? 0.05 : 0);

    ctx.save();
    ctx.translate(w.x, w.y + w.hopY);

    // Realistic soft cast ground shadow
    const shadowW = (w.isTen ? 36 : 28) * s;
    const shadowGrad = ctx.createRadialGradient(0, 2, 2, 0, 2, shadowW);
    shadowGrad.addColorStop(0, 'rgba(18, 12, 8, 0.48)');
    shadowGrad.addColorStop(0.65, 'rgba(18, 12, 8, 0.22)');
    shadowGrad.addColorStop(1, 'rgba(18, 12, 8, 0)');
    ctx.fillStyle = shadowGrad;
    ctx.beginPath();
    ctx.ellipse(0, 2, shadowW, 9 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // Hover warm sunlit aura
    if (w.hoverAmt > 0.01 && w.state !== 'leaving') {
      ctx.save();
      ctx.globalAlpha = w.hoverAmt * 0.45;
      const aura = ctx.createRadialGradient(0, -68 * s, 8 * s, 0, -68 * s, 72 * s);
      aura.addColorStop(0, '#ffe699');
      aura.addColorStop(1, 'rgba(255, 230, 153, 0)');
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.arc(0, -68 * s, 72 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.scale(w.facing, 1);

    // Body anchor coordinates (feet at y = 0)
    const hipY = -62 * s - bob * s;
    const shoulderY = -108 * s - bob * s;
    const headY = -126 * s - bob * s;
    const bw = app.buildWidth;

    // Leg kinematics
    const thighLen = 31 * s;
    const shinLen = 30 * s;

    function calcLeg(dir, lift) {
      const hipX = dir * 3 * s;
      const swing = dir * stride * (w.isTen ? 0.44 : 0.56);
      const kneeAngle = swing + (lift > 0.05 ? lift * 0.55 : 0.06);
      const kneeX = hipX + Math.sin(swing) * thighLen;
      const kneeY = hipY + Math.cos(swing) * thighLen - lift * 6 * s;
      const footX = kneeX + Math.sin(swing - lift * 0.45) * shinLen;
      const footY = Math.min(0, kneeY + Math.cos(swing - lift * 0.45) * shinLen);
      return { hipX, kneeX, kneeY, footX, footY, lift };
    }

    const backLeg = calcLeg(-1, liftL);
    const frontLeg = calcLeg(1, liftR);

    function drawLeg(leg, shade) {
      const pCol = shadeHex(app.pantColor, shade);
      drawTaperedLimb(ctx, leg.hipX, hipY, leg.kneeX, leg.kneeY, 7.5 * s * bw, 5.8 * s * bw, pCol);
      drawTaperedLimb(ctx, leg.kneeX, leg.kneeY, leg.footX, leg.footY - 4 * s, 5.6 * s * bw, 4.2 * s * bw, pCol);

      // Realistic shoe/boot
      ctx.save();
      ctx.translate(leg.footX, leg.footY);
      ctx.rotate(-leg.lift * 0.22);
      ctx.fillStyle = shadeHex(app.shoeColor, shade);
      ctx.beginPath();
      ctx.moveTo(-6 * s, -5 * s);
      ctx.lineTo(10 * s, -4 * s);
      ctx.quadraticCurveTo(15 * s, -2 * s, 14 * s, 1 * s);
      ctx.lineTo(-7 * s, 1 * s);
      ctx.closePath();
      ctx.fill();
      // Sole
      ctx.fillStyle = '#181412';
      ctx.fillRect(-7 * s, 0, 21 * s, 2.5 * s);
      ctx.restore();
    }

    // 1. Back leg
    drawLeg(backLeg, -14);

    // 2. Back arm (holding crate)
    const carryX = (w.isTen ? 24 : 21) * s;
    const carryY = (w.isTen ? -84 : -82) * s - bob * s;
    const shX = Math.sin(lean) * 14 * s;
    const backElbowX = shX + 10 * s;
    const backElbowY = shoulderY + 22 * s;
    drawTaperedLimb(ctx, shX + 3 * s, shoulderY + 4 * s, backElbowX, backElbowY, 5.5 * s, 4.4 * s, shadeHex(app.topColor, -16));
    drawTaperedLimb(ctx, backElbowX, backElbowY, carryX + 4 * s, carryY + 4 * s, 4.2 * s, 3.3 * s, shadeHex(app.skin, -12));

    // 3. Torso (tilted slightly with lean)
    ctx.save();
    ctx.translate(0, hipY);
    ctx.rotate(lean);

    const torsoH = 48 * s;
    const topW = 14.5 * s * bw;
    const waistW = (app.isFemale ? 10.5 : 12.8) * s * bw;

    // Shirt / Jacket body
    const shirtGrad = ctx.createLinearGradient(-topW, -torsoH, topW, 0);
    shirtGrad.addColorStop(0, shadeHex(app.topColor, -12));
    shirtGrad.addColorStop(0.55, app.topColor);
    shirtGrad.addColorStop(1, shadeHex(app.topColor, 14));
    ctx.fillStyle = shirtGrad;
    ctx.beginPath();
    ctx.moveTo(-waistW, 3 * s);
    ctx.lineTo(-topW, -torsoH + 5 * s);
    ctx.quadraticCurveTo(0, -torsoH - 3 * s, topW, -torsoH + 5 * s);
    ctx.lineTo(waistW, 3 * s);
    ctx.closePath();
    ctx.fill();

    // Clothing pattern details
    ctx.save();
    ctx.clip();
    if (app.topPattern === 'striped') {
      ctx.fillStyle = 'rgba(245, 240, 230, 0.32)';
      for (let sy = -torsoH; sy < 4 * s; sy += 7 * s) {
        ctx.fillRect(-topW - 4, sy, topW * 2 + 8, 2.5 * s);
      }
    } else if (app.topPattern === 'plaid') {
      ctx.fillStyle = 'rgba(20, 15, 10, 0.22)';
      for (let sy = -torsoH; sy < 4 * s; sy += 8 * s) {
        ctx.fillRect(-topW - 4, sy, topW * 2 + 8, 2.2 * s);
      }
      for (let sx = -topW; sx < topW; sx += 7 * s) {
        ctx.fillRect(sx, -torsoH, 2.2 * s, torsoH + 4);
      }
    } else if (app.topPattern === 'vest') {
      ctx.fillStyle = shadeHex(app.accentColor, -8);
      ctx.fillRect(-topW, -torsoH, topW * 1.45, torsoH + 4);
    } else if (app.topPattern === 'apron') {
      ctx.fillStyle = '#c8b496';
      ctx.fillRect(-2 * s, -torsoH * 0.72, topW + 4, torsoH * 0.78);
    } else if (app.topPattern === 'overalls') {
      ctx.fillStyle = app.pantColor;
      ctx.fillRect(-waistW, -torsoH * 0.45, waistW * 2, torsoH * 0.5);
      ctx.fillRect(-4 * s, -torsoH, 5 * s, torsoH * 0.6);
    }
    ctx.restore();

    // Collar & belt
    ctx.fillStyle = shadeHex(app.topColor, 18);
    ctx.beginPath();
    ctx.moveTo(-4 * s, -torsoH + 2 * s);
    ctx.lineTo(6 * s, -torsoH + 7 * s);
    ctx.lineTo(4 * s, -torsoH + 1 * s);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#332011';
    ctx.fillRect(-waistW - 0.5, -2 * s, waistW * 2 + 1, 4 * s);
    ctx.fillStyle = '#c89b44';
    ctx.fillRect(3 * s, -2 * s, 4 * s, 4 * s);

    // 4. Neck & Head
    const headOffY = -torsoH - 14 * s;
    // Neck
    ctx.fillStyle = shadeHex(app.skin, -10);
    ctx.fillRect(-4.5 * s, -torsoH - 6 * s, 9 * s, 10 * s);

    // Back hair (for long/wavy/ponytail)
    if (app.hairStyle === 'wavy' || app.hairStyle === 'bob') {
      ctx.fillStyle = shadeHex(app.hairColor, -10);
      ctx.beginPath();
      ctx.ellipse(-6 * s, headOffY + 6 * s, 10 * s, (app.hairStyle === 'wavy' ? 16 : 11) * s, 0.15, 0, Math.PI * 2);
      ctx.fill();
    } else if (app.hairStyle === 'ponytail') {
      const sway = Math.sin(phase) * 3.5 * s;
      ctx.fillStyle = app.hairColor;
      ctx.beginPath();
      ctx.moveTo(-10 * s, headOffY - 3 * s);
      ctx.quadraticCurveTo(-22 * s, headOffY + 2 * s + sway, -18 * s, headOffY + 18 * s + sway);
      ctx.quadraticCurveTo(-11 * s, headOffY + 12 * s, -9 * s, headOffY + 2 * s);
      ctx.closePath();
      ctx.fill();
    } else if (app.hairStyle === 'bun') {
      ctx.fillStyle = app.hairColor;
      ctx.beginPath();
      ctx.arc(-11 * s, headOffY - 7 * s, 6.5 * s, 0, Math.PI * 2);
      ctx.fill();
    }

    // Head shape (realistic 3/4 profile with jaw)
    const headGrad = ctx.createRadialGradient(4 * s, headOffY - 3 * s, 2 * s, 0, headOffY, 15 * s);
    headGrad.addColorStop(0, shadeHex(app.skin, 10));
    headGrad.addColorStop(0.7, app.skin);
    headGrad.addColorStop(1, shadeHex(app.skin, -14));
    ctx.fillStyle = headGrad;
    ctx.beginPath();
    ctx.ellipse(0, headOffY, 11.5 * s, 13.5 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // Ear
    ctx.fillStyle = shadeHex(app.skin, -6);
    ctx.beginPath();
    ctx.ellipse(-8.5 * s, headOffY + 1.5 * s, 2.8 * s, 4 * s, -0.1, 0, Math.PI * 2);
    ctx.fill();

    // Nose
    ctx.fillStyle = shadeHex(app.skin, -12);
    ctx.beginPath();
    ctx.moveTo(9.5 * s, headOffY - 2 * s);
    ctx.lineTo(13 * s, headOffY + 2.5 * s);
    ctx.lineTo(9.5 * s, headOffY + 3.5 * s);
    ctx.closePath();
    ctx.fill();

    // Eye (blinking)
    const eyeX = 6.2 * s;
    const eyeY = headOffY - 1.5 * s;
    if (w.isBlinking) {
      ctx.strokeStyle = '#2b1e16';
      ctx.lineWidth = 1.4 * s;
      ctx.beginPath();
      ctx.moveTo(eyeX - 2.4 * s, eyeY);
      ctx.lineTo(eyeX + 2.4 * s, eyeY);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#f8f5f0';
      ctx.beginPath();
      ctx.ellipse(eyeX, eyeY, 2.6 * s, 2.0 * s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = app.eyeColor;
      ctx.beginPath();
      ctx.arc(eyeX + 0.7 * s, eyeY, 1.4 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(eyeX + 1.1 * s, eyeY - 0.5 * s, 0.5 * s, 0, Math.PI * 2);
      ctx.fill();
    }

    // Eyebrow
    ctx.strokeStyle = shadeHex(app.hairColor, -10);
    ctx.lineWidth = 1.5 * s;
    ctx.beginPath();
    ctx.moveTo(eyeX - 3 * s, eyeY - 3.6 * s);
    ctx.quadraticCurveTo(eyeX, eyeY - 4.8 * s, eyeX + 3 * s, eyeY - 3.4 * s);
    ctx.stroke();

    // Glasses
    if (app.hasGlasses) {
      ctx.strokeStyle = '#2f2925';
      ctx.lineWidth = 1.2 * s;
      ctx.beginPath();
      ctx.arc(eyeX, eyeY, 3.8 * s, 0, Math.PI * 2);
      ctx.moveTo(eyeX - 3.8 * s, eyeY);
      ctx.lineTo(-7.5 * s, eyeY - 0.5 * s);
      ctx.stroke();
    }

    // Beard
    if (app.hasBeard) {
      ctx.fillStyle = app.hairColor;
      ctx.beginPath();
      ctx.moveTo(0, headOffY + 5 * s);
      ctx.quadraticCurveTo(9 * s, headOffY + 6 * s, 10.5 * s, headOffY + 9 * s);
      ctx.quadraticCurveTo(7 * s, headOffY + 15 * s, -2 * s, headOffY + 12 * s);
      ctx.closePath();
      ctx.fill();
    }

    // Mouth (warm smile when leaving or hovered)
    ctx.strokeStyle = '#6e342b';
    ctx.lineWidth = 1.4 * s;
    ctx.beginPath();
    if (w.smileTimer > 0 || w.hoverAmt > 0.3) {
      ctx.arc(6.5 * s, headOffY + 5.2 * s, 3.2 * s, 0.15, Math.PI * 0.82);
    } else {
      ctx.moveTo(4.5 * s, headOffY + 6.5 * s);
      ctx.quadraticCurveTo(7.5 * s, headOffY + 7.2 * s, 9.5 * s, headOffY + 6.0 * s);
    }
    ctx.stroke();

    // Top Hair
    ctx.fillStyle = app.hairColor;
    ctx.beginPath();
    if (app.hairStyle === 'curly') {
      for (let a = Math.PI * 0.85; a <= Math.PI * 2.12; a += 0.35) {
        ctx.arc(Math.cos(a) * 10 * s, headOffY - 2 * s + Math.sin(a) * 11 * s, 4.8 * s, 0, Math.PI * 2);
      }
    } else {
      ctx.arc(-0.5 * s, headOffY - 2.5 * s, 12.2 * s, Math.PI * 0.82, Math.PI * 2.08);
      ctx.quadraticCurveTo(4 * s, headOffY - 6 * s, -9 * s, headOffY + 3 * s);
    }
    ctx.fill();

    // Headwear
    if (app.hat === 'beanie') {
      ctx.fillStyle = shadeHex(app.accentColor, 8);
      ctx.beginPath();
      ctx.arc(-1 * s, headOffY - 5 * s, 12.2 * s, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = shadeHex(app.accentColor, -12);
      ctx.fillRect(-13 * s, headOffY - 8 * s, 24.5 * s, 4.5 * s);
    } else if (app.hat === 'cap') {
      ctx.fillStyle = app.accentColor;
      ctx.beginPath();
      ctx.arc(-0.5 * s, headOffY - 5 * s, 12 * s, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(-4 * s, headOffY - 7.5 * s, 21 * s, 3.2 * s);
    } else if (app.hat === 'flatcap') {
      ctx.fillStyle = '#5c4b3c';
      ctx.beginPath();
      ctx.ellipse(1 * s, headOffY - 9 * s, 14.5 * s, 5.2 * s, 0.08, 0, Math.PI * 2);
      ctx.fill();
    } else if (app.hat === 'straw') {
      ctx.fillStyle = '#d9b870';
      ctx.beginPath();
      ctx.ellipse(0, headOffY - 8.5 * s, 18 * s, 3.8 * s, -0.05, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(-10 * s, headOffY - 15 * s, 20 * s, 7 * s);
      ctx.fillStyle = '#8c3b2b';
      ctx.fillRect(-10 * s, headOffY - 10 * s, 20 * s, 2.2 * s);
    }

    ctx.restore(); // end torso lean

    // 5. Front leg
    drawLeg(frontLeg, 6);

    // 6. Crates (held in front of torso)
    const crateBob = walking ? Math.sin(phase * 2) * 1.5 * s : 0;
    drawCrateLoad(ctx, w.isTen, carryX, carryY + crateBob, s);

    // 7. Front arm & hand gripping the crate
    const fShX = shX - 2 * s;
    const fShY = shoulderY + 5 * s;
    const fElbX = fShX + 6 * s;
    const fElbY = fShY + 23 * s;
    const handX = carryX - (w.isTen ? 10 : 7) * s;
    const handY = carryY + crateBob + (w.isTen ? 4 : 1) * s;

    drawTaperedLimb(ctx, fShX, fShY, fElbX, fElbY, 5.8 * s, 4.6 * s, shadeHex(app.topColor, 8));
    drawTaperedLimb(ctx, fElbX, fElbY, handX, handY, 4.4 * s, 3.4 * s, app.skin);

    // Hand
    ctx.fillStyle = app.skin;
    ctx.beginPath();
    ctx.arc(handX + 1.5 * s, handY, 4.2 * s, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // ==================== DRAWING: ALIVE SUNLIT HARBOR SCENE ====================
  function drawBackground(time) {
    const horizonY = H * 0.44;
    const pierY = H * 0.60;

    // 1. Sky gradient (warm golden coastal morning)
    const sky = ctx.createLinearGradient(0, 0, 0, horizonY);
    sky.addColorStop(0, '#4f86b8');
    sky.addColorStop(0.55, '#8ab7d6');
    sky.addColorStop(0.85, '#d6cfbe');
    sky.addColorStop(1, '#f0d5a8');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, horizonY + 2);

    // Warm sun & atmospheric glow
    const sunX = W * 0.74;
    const sunY = H * 0.19;
    const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, W * 0.28);
    sunGlow.addColorStop(0, 'rgba(255, 248, 215, 0.95)');
    sunGlow.addColorStop(0.18, 'rgba(255, 224, 155, 0.42)');
    sunGlow.addColorStop(1, 'rgba(255, 210, 140, 0)');
    ctx.fillStyle = sunGlow;
    ctx.fillRect(0, 0, W, horizonY + 40);

    if (celebrationGlow > 0.01) {
      ctx.save();
      ctx.globalAlpha = celebrationGlow * 0.35;
      const cg = ctx.createRadialGradient(W * 0.5, H * 0.35, 20, W * 0.5, H * 0.35, W * 0.65);
      cg.addColorStop(0, '#fff2b2');
      cg.addColorStop(1, 'rgba(255, 220, 120, 0)');
      ctx.fillStyle = cg;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // 2. Drifting realistic clouds
    clouds.forEach(c => {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(c.scale, c.scale * 0.65);
      c.puffs.forEach(p => {
        const cg = ctx.createRadialGradient(p.ox, p.oy - p.r * 0.3, p.r * 0.2, p.ox, p.oy, p.r);
        cg.addColorStop(0, 'rgba(255, 250, 242, 0.82)');
        cg.addColorStop(0.75, 'rgba(232, 228, 225, 0.55)');
        cg.addColorStop(1, 'rgba(210, 215, 222, 0)');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.arc(p.ox, p.oy, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    });

    // 3. Distant coastal headland & lighthouse
    ctx.fillStyle = '#6f8ea1';
    ctx.beginPath();
    ctx.moveTo(0, horizonY);
    ctx.quadraticCurveTo(W * 0.14, horizonY - 46, W * 0.28, horizonY - 14);
    ctx.quadraticCurveTo(W * 0.40, horizonY - 32, W * 0.54, horizonY);
    ctx.closePath();
    ctx.fill();

    // Distant lighthouse
    const lhX = W * 0.17;
    const lhY = horizonY - 24;
    ctx.fillStyle = '#e8dfd1';
    ctx.beginPath();
    ctx.moveTo(lhX - 4, lhY);
    ctx.lineTo(lhX - 2.5, lhY - 26);
    ctx.lineTo(lhX + 2.5, lhY - 26);
    ctx.lineTo(lhX + 4, lhY);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#b33f32';
    ctx.fillRect(lhX - 3.3, lhY - 16, 6.6, 5);
    ctx.fillRect(lhX - 3.5, lhY - 29, 7, 3.5);

    // 4. Shimmering harbor sea
    const sea = ctx.createLinearGradient(0, horizonY, 0, pierY);
    sea.addColorStop(0, '#3e6e8f');
    sea.addColorStop(0.45, '#2b5876');
    sea.addColorStop(1, '#1c3e54');
    ctx.fillStyle = sea;
    ctx.fillRect(0, horizonY, W, pierY - horizonY + 4);

    // Sunlight reflection path on water
    for (let i = 0; i < 18; i++) {
      const t = i / 18;
      const wy = horizonY + 6 + t * (pierY - horizonY - 12);
      const ww = (22 + t * 95) * (0.75 + 0.25 * Math.sin(time * 2.2 + i * 1.4));
      const wx = sunX + Math.sin(time * 1.5 + i * 2.1) * (10 + t * 22);
      ctx.fillStyle = `rgba(255, 232, 175, ${0.26 - t * 0.14})`;
      ctx.fillRect(wx - ww * 0.5, wy, ww, 2 + t * 2.5);
    }

    // Gentle wave ripples
    ctx.strokeStyle = 'rgba(180, 218, 238, 0.18)';
    ctx.lineWidth = 1.4;
    for (let r = 0; r < 9; r++) {
      const ry = horizonY + 12 + r * ((pierY - horizonY) / 9);
      ctx.beginPath();
      for (let x = 0; x <= W; x += 48) {
        const yOff = Math.sin(x * 0.015 + time * 1.6 + r) * 2.2;
        if (x === 0) ctx.moveTo(x, ry + yOff);
        else ctx.lineTo(x, ry + yOff);
      }
      ctx.stroke();
    }

    // 5. Gently bobbing cargo ship in harbor
    const shipX = W * 0.78;
    const shipBob = Math.sin(time * 1.3) * 3.5;
    const shipTilt = Math.cos(time * 1.1) * 0.018;
    const shipY = horizonY + (pierY - horizonY) * 0.52 + shipBob;

    ctx.save();
    ctx.translate(shipX, shipY);
    ctx.rotate(shipTilt);
    // Hull
    ctx.fillStyle = '#2d3b45';
    ctx.beginPath();
    ctx.moveTo(-95, -6);
    ctx.lineTo(95, -10);
    ctx.lineTo(78, 16);
    ctx.lineTo(-82, 16);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#993a2e';
    ctx.fillRect(-82, 9, 160, 7);
    // Cabin & funnel
    ctx.fillStyle = '#e6decb';
    ctx.fillRect(-62, -34, 42, 26);
    ctx.fillStyle = '#263847';
    ctx.fillRect(-56, -28, 8, 6);
    ctx.fillRect(-42, -28, 8, 6);
    ctx.fillStyle = '#c45b33';
    ctx.fillRect(-46, -50, 12, 17);
    ctx.fillStyle = '#222222';
    ctx.fillRect(-46, -50, 12, 4);
    // Deck crates on ship
    ctx.fillStyle = '#b57b3d';
    ctx.fillRect(-8, -22, 26, 15);
    ctx.fillStyle = '#99652f';
    ctx.fillRect(22, -26, 30, 19);
    // Mast & rigging
    ctx.strokeStyle = '#3c4a54';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(58, -10);
    ctx.lineTo(58, -58);
    ctx.moveTo(58, -46);
    ctx.lineTo(24, -30);
    ctx.stroke();
    ctx.restore();

    // 6. Flying Seagulls
    gulls.forEach(g => {
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.scale(g.scale * (g.vx > 0 ? 1 : -1), g.scale);
      const flap = Math.sin(g.wingPhase) * 9;
      ctx.strokeStyle = '#f2ede4';
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-12, flap * 0.7);
      ctx.quadraticCurveTo(-5, -4 - flap * 0.4, 0, 0);
      ctx.quadraticCurveTo(5, -4 - flap * 0.4, 12, flap * 0.7);
      ctx.stroke();
      ctx.restore();
    });

    // 7. Wooden Harbor Crane Silhouette (far left background)
    ctx.save();
    const craneX = W * 0.08;
    const craneBaseY = pierY + 4;
    const sway = Math.sin(time * 0.85) * 0.025;
    ctx.strokeStyle = '#4a3525';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(craneX - 18, craneBaseY);
    ctx.lineTo(craneX, craneBaseY - 120);
    ctx.lineTo(craneX + 18, craneBaseY);
    ctx.stroke();
    ctx.translate(craneX, craneBaseY - 115);
    ctx.rotate(-0.35 + sway);
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(-25, 0);
    ctx.lineTo(115, 0);
    ctx.stroke();
    // Hanging rope & hook
    ctx.rotate(0.35 - sway);
    ctx.strokeStyle = '#735a42';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(92, -32);
    ctx.lineTo(92 + Math.sin(time * 1.4) * 5, 16);
    ctx.stroke();
    ctx.restore();

    // 8. Harbor Quay / Weathered Timber Pier Deck
    // Stone seawall edge
    const wallGrad = ctx.createLinearGradient(0, pierY - 8, 0, pierY + 14);
    wallGrad.addColorStop(0, '#968775');
    wallGrad.addColorStop(0.5, '#6e6152');
    wallGrad.addColorStop(1, '#473e34');
    ctx.fillStyle = wallGrad;
    ctx.fillRect(0, pierY - 6, W, 16);

    // Main timber quay deck
    const deckGrad = ctx.createLinearGradient(0, pierY + 6, 0, H);
    deckGrad.addColorStop(0, '#94785a');
    deckGrad.addColorStop(0.35, '#82674b');
    deckGrad.addColorStop(0.75, '#6e543b');
    deckGrad.addColorStop(1, '#543e2a');
    ctx.fillStyle = deckGrad;
    ctx.fillRect(0, pierY + 6, W, H - pierY);

    // Perspective wooden planks
    const plankCount = 11;
    for (let i = 1; i < plankCount; i++) {
      const t = Math.pow(i / plankCount, 1.25);
      const py = pierY + 6 + t * (H - pierY - 6);
      ctx.strokeStyle = 'rgba(42, 26, 14, 0.34)';
      ctx.lineWidth = 1.2 + t * 1.2;
      ctx.beginPath();
      ctx.moveTo(0, py);
      ctx.lineTo(W, py);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 224, 178, 0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, py + 1.5);
      ctx.lineTo(W, py + 1.5);
      ctx.stroke();
    }

    // Subtle perspective board joints
    ctx.strokeStyle = 'rgba(38, 22, 10, 0.22)';
    ctx.lineWidth = 1.2;
    for (let j = -4; j <= 14; j++) {
      const topX = (j / 10) * W;
      const botX = W * 0.5 + (topX - W * 0.5) * 1.65;
      ctx.beginPath();
      ctx.moveTo(topX, pierY + 6);
      ctx.lineTo(botX, H);
      ctx.stroke();
    }

    // Mooring bollards along the pier edge
    [0.14, 0.5, 0.88].forEach(pos => {
      const bx = W * pos;
      const by = pierY + 2;
      ctx.fillStyle = '#2e2b29';
      ctx.fillRect(bx - 10, by - 16, 20, 18);
      ctx.fillStyle = '#45413e';
      ctx.beginPath();
      ctx.ellipse(bx, by - 16, 13, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();
      // Coiled rope
      ctx.strokeStyle = '#c4a472';
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.ellipse(bx, by - 5, 12, 3.5, 0, 0, Math.PI * 2);
      ctx.stroke();
    });

    // Warm sunlit air motes
    motes.forEach(m => {
      const mx = m.x * W + Math.sin(time * m.speed + m.phase) * 18;
      const my = m.y * H + Math.cos(time * m.speed * 0.7 + m.phase) * 10;
      const alpha = 0.16 + 0.14 * Math.sin(time * 1.8 + m.phase);
      ctx.fillStyle = `rgba(255, 238, 190, ${alpha})`;
      ctx.beginPath();
      ctx.arc(mx, my, m.r, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = clamp(p.life, 0, 1);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;

      if (p.shape === 'dust') {
        ctx.beginPath();
        ctx.arc(0, 0, p.size * (1.4 - p.life * 0.5), 0, Math.PI * 2);
        ctx.fill();
      } else if (p.shape === 'star') {
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a = (i * Math.PI * 2) / 5 - Math.PI / 2;
          const b = a + Math.PI / 5;
          ctx.lineTo(Math.cos(a) * p.size, Math.sin(a) * p.size);
          ctx.lineTo(Math.cos(b) * p.size * 0.45, Math.sin(b) * p.size * 0.45);
        }
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(-p.size * 0.5, -p.size * 0.35, p.size, p.size * 0.7);
      }
      ctx.restore();
    });
  }

  // ==================== UPDATE LOOP ====================
  let lastTime = performance.now();

  function update(dt, time) {
    // Clouds
    clouds.forEach(c => {
      c.x += c.speed * dt;
      if (c.x > W + 180) c.x = -180;
    });

    // Seagulls
    gulls.forEach(g => {
      g.x += g.vx * dt * (1 + g.swoop * 1.4);
      g.wingPhase += g.wingSpeed * dt * (1 + g.swoop * 0.6);
      if (g.swoop > 0) {
        g.y += Math.sin(g.swoop * Math.PI * 2) * 45 * dt;
        g.swoop = Math.max(0, g.swoop - dt * 0.45);
      }
      if (g.vx > 0 && g.x > W + 80) g.x = -80;
      if (g.vx < 0 && g.x < -80) g.x = W + 80;
    });

    celebrationGlow = Math.max(0, celebrationGlow - dt * 0.45);

    // Workers
    for (let i = workers.length - 1; i >= 0; i--) {
      const w = workers[i];
      w.breathPhase += dt * 2.2;
      w.smileTimer = Math.max(0, w.smileTimer - dt);

      // Blinking
      w.blinkTimer -= dt;
      if (w.blinkTimer <= 0) {
        if (!w.isBlinking) {
          w.isBlinking = true;
          w.blinkTimer = 0.13;
        } else {
          w.isBlinking = false;
          w.blinkTimer = rand(2.0, 5.2);
        }
      }

      // Hover smoothing
      const targetHover = (hoveredWorker === w && w.state !== 'leaving') ? 1 : 0;
      w.hoverAmt += (targetHover - w.hoverAmt) * Math.min(1, dt * 12);

      // Hop physics
      if (w.hopY < 0 || w.hopVy !== 0) {
        w.hopVy += 820 * dt;
        w.hopY += w.hopVy * dt;
        if (w.hopY >= 0) {
          w.hopY = 0;
          w.hopVy = 0;
        }
      }

      if (w.state === 'entering') {
        const dx = w.targetX - w.x;
        const dist = Math.abs(dx);
        if (dist <= w.speed * dt + 2) {
          w.x = w.targetX;
          w.state = 'idle';
          w.facing = w.isTen ? 1 : -1;
          Sound.playWoodThud(w.isTen);
        } else {
          const dir = Math.sign(dx);
          w.facing = dir;
          w.x += dir * w.speed * dt;
          w.walkPhase += dt * (w.isTen ? 7.6 : 9.6);
          const sVal = Math.sin(w.walkPhase);
          if (w.lastStepSin <= 0 && sVal > 0) Sound.playFootstep(w.isTen);
          w.lastStepSin = sVal;
        }
      } else if (w.state === 'leaving') {
        w.facing = w.leaveDir;
        w.x += w.leaveDir * w.speed * dt;
        w.walkPhase += dt * (w.isTen ? 9.5 : 11.5);
        const sVal = Math.sin(w.walkPhase);
        if (w.lastStepSin <= 0 && sVal > 0) Sound.playFootstep(w.isTen);
        w.lastStepSin = sVal;

        if (w.x < -160 || w.x > W + 160) {
          workers.splice(i, 1);
        }
      }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.shape !== 'dust') {
        p.vy += 290 * dt;
      } else {
        p.vx *= 0.94;
      }
      p.rot += p.vrot * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function render(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    const time = now / 1000;

    update(dt, time);

    ctx.clearRect(0, 0, W, H);
    drawBackground(time);

    // Depth-sorted workers
    const sorted = [...workers].sort((a, b) => a.y - b.y);
    sorted.forEach(w => drawWorker(ctx, w, time));

    drawParticles();

    requestAnimationFrame(render);
  }

  // ==================== INTERACTION ====================
  function hitTestWorker(mx, my) {
    const baseScale = clamp(Math.min(W / 1280, H / 720), 0.72, 1.25);
    // Check front-most first
    const sorted = [...workers].sort((a, b) => b.y - a.y);
    for (const w of sorted) {
      if (w.state === 'leaving') continue;
      const s = baseScale * w.depthScale * w.appearance.heightScale;
      const halfW = (w.isTen ? 42 : 34) * s;
      const topY = w.y - (w.isTen ? 168 : 152) * s;
      const botY = w.y + 12 * s;
      if (mx >= w.x - halfW && mx <= w.x + halfW && my >= topY && my <= botY) {
        return w;
      }
    }
    return null;
  }

  canvas.addEventListener('pointermove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    hoveredWorker = hitTestWorker(mx, my);
    canvas.style.cursor = hoveredWorker ? 'pointer' : 'default';
  });

  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const target = hitTestWorker(mx, my);
    if (!target) return;

    target.state = 'leaving';
    target.leaveDir = target.x < W * 0.5 ? -1 : 1;
    target.facing = target.leaveDir;
    target.speed = target.isTen ? rand(230, 280) : rand(270, 330);
    target.hopVy = -240;
    target.smileTimer = 2.0;

    Sound.playLeave(target.isTen);
    spawnClickParticles(target.x, target.y - 70, target.isTen);

    // Check if all workers have now been dismissed
    const remaining = workers.filter(w => w.state !== 'leaving');
    if (remaining.length === 0 && waveHadWorkers) {
      waveHadWorkers = false;
      celebrationGlow = 1.0;
      nextBtn.classList.add('pulse');
      setTimeout(() => {
        Sound.playCelebration();
        spawnCelebrationConfetti();
      }, 180);
    }
  });

  function submitInput() {
    if (numInput.value.trim() === '') {
      generateNextNumber();
      return;
    }
    spawnNumber(parseInt(numInput.value, 10));
    numInput.blur();
  }

  goBtn.addEventListener('click', submitInput);

  numInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitInput();
    }
  });

  numInput.addEventListener('focus', () => {
    numInput.select();
  });

  nextBtn.addEventListener('click', () => {
    generateNextNumber();
  });

  soundBtn.addEventListener('click', () => {
    Sound.muted = !Sound.muted;
    soundIconOn.style.display = Sound.muted ? 'none' : 'block';
    soundIconOff.style.display = Sound.muted ? 'block' : 'none';
  });

  hideBtn.addEventListener('click', () => {
    setHiddenInput(!hiddenInput);
  });

  window.addEventListener('resize', resize);
  resize();
  numInput.focus();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
