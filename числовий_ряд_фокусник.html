<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Number Ray</title>
<style>
  :root {
    --gold: #f5c85b;
    --gold-dark: #b67d1e;
    --gold-light: #fff0b3;
    --velvet: #5a0b1d;
    --velvet-dark: #2c040e;
    --velvet-bright: #8a1530;
    --stage-wood: #3b1e12;
    --teal: #104e5b;
    --plum: #3e1957;
    --emerald: #114b37;
    --royal: #1a2d6b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #14050a;
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  }

  /* === LIVING THEATER STAGE BACKGROUND === */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background:
      radial-gradient(ellipse 75% 58% at 50% 34%, #3c1438 0%, #1d091d 55%, #0c030c 100%);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Subtle starry damask backdrop pattern */
  .backdrop-pattern {
    position: absolute;
    inset: 0;
    opacity: 0.22;
    background-image:
      radial-gradient(circle at 25% 25%, rgba(245, 200, 91, 0.35) 1.5px, transparent 2px),
      radial-gradient(circle at 75% 75%, rgba(245, 200, 91, 0.25) 1.5px, transparent 2px),
      repeating-linear-gradient(45deg, rgba(245, 200, 91, 0.05) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(-45deg, rgba(245, 200, 91, 0.05) 0 2px, transparent 2px 26px);
    background-size: 90px 90px, 90px 90px, 36px 36px, 36px 36px;
    pointer-events: none;
  }

  /* Volumetric sweeping spotlights */
  .spotlight {
    position: absolute;
    top: -12vh;
    width: 34vw;
    height: 115vh;
    background: conic-gradient(from 165deg at 50% 0%, transparent 0deg, rgba(255, 232, 165, 0.13) 14deg, rgba(255, 240, 195, 0.22) 18deg, rgba(255, 232, 165, 0.11) 22deg, transparent 34deg);
    transform-origin: 50% 0%;
    pointer-events: none;
    mix-blend-mode: screen;
    filter: blur(4px);
  }
  .spot-left { left: 10vw; animation: sweepLeft 9s ease-in-out infinite alternate; }
  .spot-right { right: 10vw; animation: sweepRight 11s ease-in-out infinite alternate; }
  .spot-center {
    left: 33vw;
    background: conic-gradient(from 166deg at 50% 0%, transparent 0deg, rgba(255, 215, 130, 0.16) 15deg, rgba(255, 244, 210, 0.24) 18deg, transparent 32deg);
    animation: pulseSpot 6s ease-in-out infinite alternate;
  }

  @keyframes sweepLeft { from { transform: rotate(-16deg); } to { transform: rotate(10deg); } }
  @keyframes sweepRight { from { transform: rotate(16deg); } to { transform: rotate(-10deg); } }
  @keyframes pulseSpot { from { opacity: 0.65; } to { opacity: 1; } }

  /* Velvet Curtains */
  .curtain {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 11vw;
    z-index: 6;
    pointer-events: none;
    background:
      repeating-linear-gradient(90deg,
        #320510 0%, #6d0e24 14%, #911734 25%, #55091a 38%, #2a030c 50%);
    box-shadow: inset -18px 0 32px rgba(0,0,0,0.65), 10px 0 30px rgba(0,0,0,0.6);
  }
  .curtain-left {
    left: 0;
    border-bottom-right-radius: 45% 22%;
    transform-origin: top left;
    animation: curtainSwayL 7s ease-in-out infinite alternate;
  }
  .curtain-right {
    right: 0;
    border-bottom-left-radius: 45% 22%;
    transform-origin: top right;
    box-shadow: inset 18px 0 32px rgba(0,0,0,0.65), -10px 0 30px rgba(0,0,0,0.6);
    animation: curtainSwayR 7.5s ease-in-out infinite alternate;
  }
  @keyframes curtainSwayL { from { transform: skewX(0deg); } to { transform: skewX(1.4deg); } }
  @keyframes curtainSwayR { from { transform: skewX(0deg); } to { transform: skewX(-1.4deg); } }

  /* Top Valance */
  .valance {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 7.5vh;
    z-index: 7;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 0%, #8e1532 0%, #4b0818 75%, #2b030c 100%);
    border-bottom: 4px solid var(--gold);
    box-shadow: 0 8px 24px rgba(0,0,0,0.65), inset 0 -4px 12px rgba(245,200,91,0.3);
  }

  /* Wooden Theater Floor & Footlights */
  .stage-floor {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 33vh;
    background:
      linear-gradient(180deg, #27110b 0%, #4a2315 18%, #34160d 62%, #1d0b06 100%);
    border-top: 5px solid #c9922b;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.7), inset 0 6px 24px rgba(255, 200, 95, 0.2);
    z-index: 2;
  }
  .stage-floor::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg,
      rgba(0,0,0,0.22) 0 2px, transparent 2px 72px);
    opacity: 0.45;
    pointer-events: none;
  }

  .footlights {
    position: absolute;
    top: -10px; left: 10vw; right: 10vw;
    display: flex;
    justify-content: space-around;
    pointer-events: none;
  }
  .bulb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffce0, #ffd15c 55%, #b36b00 100%);
    box-shadow: 0 0 12px 3px rgba(255, 210, 90, 0.75);
    animation: bulbTwinkle 3s ease-in-out infinite alternate;
  }
  .bulb:nth-child(odd) { animation-delay: 1.5s; }
  @keyframes bulbTwinkle { from { opacity: 0.7; transform: scale(0.92); } to { opacity: 1; transform: scale(1.08); } }

  /* Canvas for 60fps Magic FX (stardust, doves, confetti, smoke, fireworks) */
  #fxCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 25;
    pointer-events: none;
  }

  /* === TOP CONTROL BAR (WORDLESS, ORNATE BRASS) === */
  .top-bar {
    position: relative;
    z-index: 30;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.2vh 2.5vw;
    height: 8.5vh;
  }

  .btn-group {
    display: flex;
    gap: 0.8vw;
    align-items: center;
  }

  .brass-btn {
    position: relative;
    height: clamp(40px, 5.6vh, 56px);
    min-width: clamp(46px, 5.6vh, 62px);
    padding: 0 12px;
    border-radius: 16px;
    border: 2.5px solid var(--gold);
    background: linear-gradient(160deg, #4b122b 0%, #240717 100%);
    color: var(--gold-light);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.55), inset 0 1px 4px rgba(255,240,180,0.3);
    transition: transform 0.16s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s, background 0.2s;
  }
  .brass-btn:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 6px 18px rgba(245, 200, 91, 0.45), inset 0 1px 8px rgba(255,240,180,0.5);
  }
  .brass-btn:active { transform: scale(0.95); }
  .brass-btn.active {
    background: linear-gradient(160deg, #f7ce68 0%, #c88719 100%);
    color: #2c0714;
    border-color: #fff3c4;
    box-shadow: 0 0 20px rgba(245, 200, 91, 0.75), inset 0 2px 6px rgba(255,255,255,0.65);
  }
  .brass-btn svg {
    width: clamp(22px, 3vh, 30px);
    height: clamp(22px, 3vh, 30px);
    stroke: currentColor;
    fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .range-btn {
    font-size: clamp(18px, 2.5vh, 24px);
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  .next-btn {
    background: linear-gradient(160deg, #166b52 0%, #0b3c2d 100%);
    border-color: #7ef2c2;
    color: #e9fff6;
    min-width: clamp(54px, 6.8vh, 72px);
  }
  .next-btn:hover {
    box-shadow: 0 0 20px rgba(126, 242, 194, 0.6);
  }

  /* === MAGICIAN STAGE AREA === */
  .magician-zone {
    position: relative;
    z-index: 10;
    height: 36vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
  }

  .magician-wrap {
    position: relative;
    height: 35vh;
    width: 34vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    filter: drop-shadow(0 12px 18px rgba(0,0,0,0.65));
  }

  #magicianSvg {
    height: 100%;
    width: 100%;
    overflow: visible;
  }

  /* Magician organic animations */
  .mag-body-group {
    transform-origin: 150px 260px;
    animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50% { transform: translateY(-2.5px) scaleY(1.012); }
  }

  .mag-cape {
    transform-origin: 150px 145px;
    animation: capeFlow 4.2s ease-in-out infinite alternate;
  }
  @keyframes capeFlow {
    from { transform: skewX(-1.5deg); }
    to { transform: skewX(1.8deg); }
  }

  .mag-wand-arm {
    transform-origin: 192px 168px;
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
  }
  .mag-left-arm {
    transform-origin: 108px 168px;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .mag-head {
    transform-origin: 150px 132px;
    transition: transform 0.25s ease-out;
  }
  .mag-hat {
    transform-origin: 150px 76px;
    transition: transform 0.45s cubic-bezier(.34,1.56,.64,1);
  }
  .mag-rabbit {
    transform-origin: 150px 82px;
    transform: translateY(34px) scale(0.3);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(.34,1.56,.64,1), opacity 0.25s;
  }
  .mag-bouquet {
    transform-origin: 248px 110px;
    transform: scale(0);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), opacity 0.25s;
  }

  /* Reaction states */
  .magician-wrap.trick-rabbit .mag-hat { transform: translateY(-54px) rotate(-14deg); }
  .magician-wrap.trick-rabbit .mag-rabbit { transform: translateY(-10px) scale(1); opacity: 1; }
  .magician-wrap.trick-rabbit .mag-left-arm { transform: rotate(34deg) translateY(-12px); }

  .magician-wrap.trick-flourish .mag-wand-arm { animation: wandWave 0.65s ease-in-out 2; }
  .magician-wrap.trick-flourish .mag-hat { transform: translateY(-28px) rotate(12deg); }

  .magician-wrap.trick-bouquet .mag-wand-arm { transform: rotate(-28deg); }
  .magician-wrap.trick-bouquet .mag-bouquet { transform: scale(1.1); opacity: 1; }

  .magician-wrap.trick-levitate .mag-hat { animation: hatLevitate 1.5s ease-in-out; }
  .magician-wrap.trick-levitate .mag-left-arm { transform: rotate(40deg); }
  .magician-wrap.trick-levitate .mag-wand-arm { transform: rotate(-35deg); }

  .magician-wrap.react-oops .mag-head { animation: headShake 0.48s ease-in-out; }
  .magician-wrap.react-oops .mag-wand-arm { transform: rotate(24deg); }

  @keyframes wandWave {
    0%, 100% { transform: rotate(0deg); }
    35% { transform: rotate(-42deg); }
    70% { transform: rotate(10deg); }
  }
  @keyframes hatLevitate {
    0% { transform: translateY(0) rotate(0deg); }
    30% { transform: translateY(-48px) rotate(-18deg); }
    65% { transform: translateY(-54px) rotate(18deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }
  @keyframes headShake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-10deg); }
    75% { transform: rotate(10deg); }
  }

  /* === NUMBER RAY STAGE (CENTER) === */
  .ray-zone {
    position: relative;
    z-index: 15;
    width: 100vw;
    height: 25vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 3.2vw;
  }

  .ray-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
  }

  /* Ornate Brass Number Ray Track */
  .ray-bar {
    position: absolute;
    left: 1.5%;
    right: 2.2%;
    top: 50%;
    height: 12px;
    transform: translateY(-50%);
    background: linear-gradient(180deg, #fff0ad 0%, #e0a32e 45%, #8f570c 100%);
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.7), 0 0 18px rgba(245,200,91,0.35);
    z-index: 1;
  }
  /* Arrowhead on the right (true mathematical ray) */
  .ray-arrow {
    position: absolute;
    right: 0.4%;
    top: 50%;
    transform: translateY(-50%);
    width: 0; height: 0;
    border-top: 17px solid transparent;
    border-bottom: 17px solid transparent;
    border-left: 28px solid #f2bc49;
    filter: drop-shadow(0 0 10px rgba(245, 200, 91, 0.7));
    z-index: 2;
  }

  .ray-nodes {
    position: relative;
    z-index: 5;
    width: 96%;
    margin-left: 1%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Stylized Colored Patterned Medallions (NO white rectangles!) */
  .ray-node {
    position: relative;
    width: var(--node-size, 68px);
    height: var(--node-size, 68px);
    border-radius: 50%;
    border: 3.5px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-weight: 900;
    font-size: var(--node-font, 30px);
    color: #fff7dc;
    text-shadow: 0 2px 5px rgba(0,0,0,0.7);
    box-shadow:
      0 6px 16px rgba(0,0,0,0.65),
      inset 0 0 12px rgba(255, 232, 160, 0.35);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s, filter 0.25s;
    background-size: 18px 18px, 100% 100%;
  }

  /* Jewel-tone patterned backgrounds cycling across the ray */
  .ray-node[data-tint="0"] {
    background-image:
      radial-gradient(rgba(255,230,150,0.18) 1.5px, transparent 2px),
      radial-gradient(circle at 32% 28%, #2d6fa8, #122c57 82%);
  }
  .ray-node[data-tint="1"] {
    background-image:
      radial-gradient(rgba(255,230,150,0.18) 1.5px, transparent 2px),
      radial-gradient(circle at 32% 28%, #8f2d74, #420f3a 82%);
  }
  .ray-node[data-tint="2"] {
    background-image:
      radial-gradient(rgba(255,230,150,0.18) 1.5px, transparent 2px),
      radial-gradient(circle at 32% 28%, #1e8268, #0c3d30 82%);
  }
  .ray-node[data-tint="3"] {
    background-image:
      radial-gradient(rgba(255,230,150,0.18) 1.5px, transparent 2px),
      radial-gradient(circle at 32% 28%, #b3384a, #54101d 82%);
  }

  .ray-node:hover {
    transform: translateY(-6px) scale(1.1);
    box-shadow: 0 10px 22px rgba(0,0,0,0.7), 0 0 22px rgba(245, 200, 91, 0.7);
    z-index: 12;
  }

  /* Hidden state (Velvet Magic Hat covers the number) */
  .ray-node.hidden-num {
    background: radial-gradient(circle at 40% 35%, #5b1d5e, #24092b 85%) !important;
    border-color: #ffd76a;
    border-style: dashed;
    animation: mysteryBob 2.2s ease-in-out infinite;
  }
  .ray-node.hidden-num .num-val { opacity: 0; transform: scale(0.3); }
  .ray-node .hat-cover {
    position: absolute;
    inset: -14%;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .ray-node.hidden-num .hat-cover { display: flex; }
  @keyframes mysteryBob {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-5px) scale(1.04); }
  }

  /* Target active slot (e.g. Before/After current slot) */
  .ray-node.active-target {
    box-shadow: 0 0 0 5px rgba(102, 255, 204, 0.85), 0 0 28px rgba(102, 255, 204, 0.9);
    border-color: #a3ffe0;
    z-index: 11;
  }

  /* Spotlighted Anchor (Mode 3 & Teacher Mode) */
  .ray-node.spotlighted {
    border-color: #fff4b8;
    box-shadow: 0 0 0 6px rgba(255, 215, 90, 0.85), 0 0 36px 8px rgba(255, 215, 90, 0.8);
    transform: scale(1.16);
    z-index: 14;
  }
  .ray-node.spotlighted::before {
    content: "";
    position: absolute;
    bottom: 92%;
    left: 50%;
    transform: translateX(-50%);
    width: 140%;
    height: 22vh;
    background: linear-gradient(180deg, rgba(255, 236, 150, 0) 0%, rgba(255, 230, 130, 0.28) 100%);
    clip-path: polygon(28% 0%, 72% 0%, 100% 100%, 0% 100%);
    pointer-events: none;
  }

  /* Selected node in Swap mode */
  .ray-node.selected {
    border-color: #7df9ff;
    box-shadow: 0 0 0 5px rgba(125, 249, 255, 0.85), 0 0 26px rgba(125, 249, 255, 0.9);
    transform: translateY(-10px) scale(1.15);
    z-index: 15;
  }

  /* Reveal pop animation */
  .ray-node.pop-reveal {
    animation: revealPop 0.55s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes revealPop {
    0% { transform: scale(0.5) rotate(-18deg); }
    60% { transform: scale(1.24) rotate(8deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .ray-node.wobble-err {
    animation: errWobble 0.42s ease-in-out;
  }
  @keyframes errWobble {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-6deg); }
    45% { transform: translateX(8px) rotate(6deg); }
    70% { transform: translateX(-5px) rotate(-3deg); }
  }

  /* Directional indicator arrow above target neighbor */
  .neighbor-arrow {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    width: 34px;
    height: 34px;
    pointer-events: none;
    animation: arrowBounce 1s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 8px rgba(102, 255, 204, 0.9));
  }
  @keyframes arrowBounce {
    from { transform: translateX(-50%) translateY(0); }
    to { transform: translateX(-50%) translateY(-8px); }
  }

  /* === BOTTOM INTERACTIVE DECK / TEACHER DOCK === */
  .bottom-zone {
    position: relative;
    z-index: 20;
    height: 27vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 2vh;
  }

  .choices-deck {
    display: flex;
    gap: clamp(16px, 2.6vw, 36px);
    align-items: center;
    justify-content: center;
  }

  /* Ornate Patterned Illusionist Cards (NO white rectangles!) */
  .magic-card {
    position: relative;
    width: clamp(84px, 8.2vw, 126px);
    height: clamp(106px, 16.5vh, 152px);
    border-radius: 18px;
    border: 3.5px solid var(--gold);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(34px, 5.2vh, 52px);
    font-weight: 900;
    color: #fff6d1;
    text-shadow: 0 3px 8px rgba(0,0,0,0.75);
    box-shadow:
      0 10px 24px rgba(0,0,0,0.65),
      inset 0 0 0 5px rgba(245, 200, 91, 0.25);
    transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), box-shadow 0.22s;
    overflow: hidden;
  }
  .magic-card::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1.5px dashed rgba(255, 232, 165, 0.45);
    border-radius: 11px;
    pointer-events: none;
  }
  .magic-card[data-c="0"] {
    background:
      repeating-linear-gradient(45deg, rgba(255,215,110,0.08) 0 8px, transparent 8px 16px),
      linear-gradient(155deg, #9c1d3d 0%, #4b091c 100%);
  }
  .magic-card[data-c="1"] {
    background:
      repeating-linear-gradient(-45deg, rgba(255,215,110,0.08) 0 8px, transparent 8px 16px),
      linear-gradient(155deg, #1b5e7a 0%, #0b2b3d 100%);
  }
  .magic-card[data-c="2"] {
    background:
      repeating-linear-gradient(45deg, rgba(255,215,110,0.08) 0 8px, transparent 8px 16px),
      linear-gradient(155deg, #5c247a 0%, #270c38 100%);
  }
  .magic-card[data-c="3"] {
    background:
      repeating-linear-gradient(-45deg, rgba(255,215,110,0.08) 0 8px, transparent 8px 16px),
      linear-gradient(155deg, #1b6b4c 0%, #0a3323 100%);
  }

  .magic-card:hover {
    transform: translateY(-12px) scale(1.08) rotate(-1.5deg);
    box-shadow: 0 18px 30px rgba(0,0,0,0.7), 0 0 26px rgba(245, 200, 91, 0.7);
  }
  .magic-card:active { transform: scale(0.95); }
  .magic-card.wrong-card {
    animation: errWobble 0.42s ease-in-out;
    filter: grayscale(0.5) brightness(0.7);
  }

  /* Teacher Mode Sub-dock */
  .teacher-dock {
    display: flex;
    gap: 1.2vw;
    padding: 1.2vh 2vw;
    border-radius: 26px;
    background: linear-gradient(180deg, rgba(66, 16, 38, 0.92), rgba(30, 6, 18, 0.95));
    border: 2.5px solid var(--gold);
    box-shadow: 0 10px 28px rgba(0,0,0,0.7), inset 0 1px 6px rgba(255,240,180,0.3);
  }

  /* Swap Mode Visual Hint Pill */
  .swap-cue {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 28px;
    border-radius: 999px;
    background: linear-gradient(160deg, rgba(72, 18, 52, 0.88), rgba(28, 7, 25, 0.92));
    border: 2.5px solid var(--gold);

<script>
(() => {
  /* ================= AUDIO ENGINE (Web Audio API, zero external files) ================= */
  let audioCtx = null;
  let soundOn = true;

  function ensureAudio() {
    if (!soundOn) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, type, start, dur, vol = 0.14, slideTo = null) {
    const ctx = ensureAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
    if (slideTo) {
      osc.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + start + dur);
    }
    gain.gain.setValueAtTime(0.001, ctx.currentTime + start);
    gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + dur + 0.02);
  }

  function playNoisePoof(dur = 0.25, vol = 0.16) {
    const ctx = ensureAudio();
    if (!ctx) return;
    const bufSize = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(900, ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + dur);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    src.start();
  }

  const SFX = {
    click() {
      playTone(520, 'triangle', 0, 0.07, 0.12, 740);
    },
    poof() {
      playNoisePoof(0.22, 0.14);
      playTone(340, 'sine', 0, 0.12, 0.08, 620);
    },
    swap() {
      playTone(392, 'triangle', 0, 0.12, 0.13, 587);
      playTone(587, 'triangle', 0.08, 0.14, 0.13, 784);
    },
    miniOk() {
      playTone(523.25, 'sine', 0, 0.14, 0.14);
      playTone(659.25, 'sine', 0.08, 0.18, 0.14);
      playTone(783.99, 'triangle', 0.16, 0.24, 0.15);
    },
    wrong() {
      playNoisePoof(0.18, 0.12);
      playTone(270, 'sawtooth', 0, 0.18, 0.07, 175);
      playTone(195, 'triangle', 0.12, 0.22, 0.1, 130);
    },
    success(variant) {
      if (variant === 0) {
        // Harp glissando
        [523, 587, 659, 784, 880, 1046, 1318].forEach((f, i) =>
          playTone(f, 'triangle', i * 0.055, 0.36, 0.13));
      } else if (variant === 1) {
        // Circus brass fanfare
        playTone(523, 'sawtooth', 0, 0.12, 0.06);
        playTone(659, 'sawtooth', 0.11, 0.12, 0.06);
        playTone(784, 'sawtooth', 0.22, 0.14, 0.07);
        playTone(1046, 'triangle', 0.34, 0.45, 0.16);
        playTone(784, 'sine', 0.34, 0.45, 0.1);
      } else if (variant === 2) {
        // Celesta magical chimes
        [659, 988, 784, 1175, 1046, 1568].forEach((f, i) =>
          playTone(f, 'sine', i * 0.07, 0.42, 0.13));
      } else {
        // Playful marimba flourish
        [440, 554, 659, 880, 1108, 1318].forEach((f, i) =>
          playTone(f, 'triangle', i * 0.06, 0.28, 0.14));
      }
    }
  };

  /* ================= 60FPS MAGIC CANVAS FX ================= */
  const canvas = document.getElementById('fxCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let dustMotes = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Ambient golden dust motes in spotlights
  for (let i = 0; i < 36; i++) {
    dustMotes.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight * 0.72,
      r: 1 + Math.random() * 2.2,
      vx: (Math.random() - 0.5) * 0.25,
      vy: -0.15 - Math.random() * 0.25,
      a: Math.random() * Math.PI * 2
    });
  }

  function spawnBurst(x, y, type = 'stars', count = 34) {
    const colors = ['#ffe169', '#ff5c8a', '#5ce1e6', '#b77bff', '#7ef2c2', '#ff9f43'];
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
      const speed = (type === 'smoke' ? 1.5 : 3.5) + Math.random() * 6.5;
      particles.push({
        type,
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - (type === 'confetti' || type === 'cards' ? 4 : 1.5),
        size: type === 'smoke' ? 14 + Math.random() * 16 : 6 + Math.random() * 8,
        color: colors[i % colors.length],
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.2,
        life: 1,
        decay: type === 'smoke' ? 0.025 : 0.014 + Math.random() * 0.01
      });
    }
  }

  function spawnDoves(x, y) {
    for (let i = 0; i < 5; i++) {
      const dir = i % 2 === 0 ? 1 : -1;
      particles.push({
        type: 'dove',
        x: x + (Math.random() - 0.5) * 40,
        y: y + (Math.random() - 0.5) * 20,
        vx: dir * (3.2 + Math.random() * 3.2),
        vy: -(2.4 + Math.random() * 2.5),
        wing: Math.random() * Math.PI * 2,
        size: 16 + Math.random() * 7,
        life: 1,
        decay: 0.009
      });
    }
  }

  function drawStar(c, r) {
    c.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
      c[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(a) * r, Math.sin(a) * r);
    }
    c.closePath();
    c.fill();
  }

  function fxLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Floating dust motes
    for (const m of dustMotes) {
      m.x += m.vx + Math.sin(m.a) * 0.15;
      m.y += m.vy;
      m.a += 0.02;
      if (m.y < -10) { m.y = canvas.height * 0.72; m.x = Math.random() * canvas.width; }
      const alpha = 0.22 + Math.sin(m.a) * 0.18;
      ctx.fillStyle = `rgba(255, 232, 160, ${alpha})`;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Active FX particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }

      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      if (p.type === 'dove') {
        p.x += p.vx;
        p.y += p.vy;
        p.wing += 0.28;
        ctx.translate(p.x, p.y);
        if (p.vx < 0) ctx.scale(-1, 1);
        const flap = Math.sin(p.wing) * p.size * 0.7;
        ctx.fillStyle = '#fffaf0';
        ctx.strokeStyle = '#d9d2c5';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size * 0.6, p.size * 0.3, -0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-2, -2);
        ctx.quadraticCurveTo(-p.size * 0.6, -p.size - flap, -p.size * 1.1, -flap * 0.4);
        ctx.quadraticCurveTo(-p.size * 0.4, 2, -2, -2);
        ctx.fill();
        ctx.stroke();
      } else if (p.type === 'smoke') {
        p.x += p.vx; p.y += p.vy - 0.5;
        p.vx *= 0.96; p.vy *= 0.96;
        p.size += 0.6;
        ctx.fillStyle = `rgba(215, 210, 225, ${p.life * 0.55})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'cards') {
        p.x += p.vx; p.y += p.vy; p.vy += 0.16; p.rot += p.vrot;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.strokeStyle = '#ffe285';
        ctx.lineWidth = 1.6;
        ctx.fillRect(-p.size * 0.65, -p.size, p.size * 1.3, p.size * 2);
        ctx.strokeRect(-p.size * 0.65, -p.size, p.size * 1.3, p.size * 2);
      } else {
        p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.rot += p.vrot;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.type === 'confetti') {
          ctx.fillRect(-p.size * 0.5, -p.size * 0.3, p.size, p.size * 0.6);
        } else {
          drawStar(ctx, p.size);
        }
      }
      ctx.restore();
    }
    requestAnimationFrame(fxLoop);
  }
  fxLoop();

  /* ================= MAGICIAN CHARACTER CONTROLLER ================= */
  const magWrap = document.getElementById('magicianWrap');
  const pupils = document.getElementById('pupils');
  const wandArm = document.getElementById('wandArm');
  const lidL = document.getElementById('lidL');
  const lidR = document.getElementById('lidR');
  const browL = document.getElementById('browL');
  const browR = document.getElementById('browR');
  const magMouth = document.getElementById('magMouth');

  // Realistic blinking
  setInterval(() => {
    lidL.setAttribute('height', '19');
    lidR.setAttribute('height', '19');
    setTimeout(() => {
      lidL.setAttribute('height', '0');
      lidR.setAttribute('height', '0');
    }, 135);
  }, 3600);

  // Eyes & wand subtly track cursor
  window.addEventListener('pointermove', (e) => {
    const rect = magWrap.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height * 0.38;
    const dx = Math.max(-1, Math.min(1, (e.clientX - cx) / 360));
    const dy = Math.max(-1, Math.min(1, (e.clientY - cy) / 280));
    pupils.setAttribute('transform', `translate(${dx * 3.2}, ${dy * 2.6})`);
    if (!magWrap.className.includes('trick-') && !magWrap.className.includes('react-')) {
      wandArm.style.transform = `rotate(${dx * 10 + dy * 8}deg)`;
    }
  });

  let trickTimer = null;
  function triggerMagicTrick(targetEl) {
    clearTimeout(trickTimer);
    magWrap.classList.remove('trick-rabbit', 'trick-flourish', 'trick-bouquet', 'trick-levitate', 'react-oops');
    wandArm.style.transform = '';
    const tricks = ['trick-rabbit', 'trick-flourish', 'trick-bouquet', 'trick-levitate'];
    const pick = Math.floor(Math.random() * tricks.length);
    magWrap.classList.add(tricks[pick]);

    // Delighted face
    browL.setAttribute('d', 'M125 87 Q135 80 144 87');
    browR.setAttribute('d', 'M156 87 Q165 80 175 87');
    magMouth.setAttribute('d', 'M137 126 Q150 140 163 126');

    SFX.success(pick);

    const mRect = magWrap.getBoundingClientRect();
    const mx = mRect.left + mRect.width * 0.5;
    const my = mRect.top + mRect.height * 0.3;

    if (pick === 0) {
      spawnBurst(mx, my, 'stars', 34);
    } else if (pick === 1) {
      spawnDoves(mx, my);
      spawnBurst(mx + 60, my + 20, 'stars', 28);
    } else if (pick === 2) {
      spawnBurst(mx + 65, my + 30, 'cards', 32);
      spawnBurst(mx, my, 'confetti', 40);
    } else {
      spawnBurst(mx, my - 20, 'stars', 42);
      spawnBurst(mx, my, 'confetti', 36);
    }

    if (targetEl) {
      const r = targetEl.getBoundingClientRect();
      spawnBurst(r.left + r.width / 2, r.top + r.height / 2, 'stars', 24);
    }

    trickTimer = setTimeout(() => {
      magWrap.classList.remove('trick-rabbit', 'trick-flourish', 'trick-bouquet', 'trick-levitate');
      browL.setAttribute('d', 'M125 91 Q135 85 144 90');
      browR.setAttribute('d', 'M156 90 Q165 85 175 91');
      magMouth.setAttribute('d', 'M139 128 Q150 137 161 128');
    }, 1750);
  }

  function triggerOops(targetEl) {
    clearTimeout(trickTimer);
    magWrap.classList.remove('trick-rabbit', 'trick-flourish', 'trick-bouquet', 'trick-levitate', 'react-oops');
    void magWrap.offsetWidth;
    magWrap.classList.add('react-oops');
    browL.setAttribute('d', 'M125 93 Q135 89 144 92');
    browR.setAttribute('d', 'M156 88 Q165 81 175 87');
    magMouth.setAttribute('d', 'M143 132 Q150 128 157 132');

    SFX.wrong();
    const mRect = magWrap.getBoundingClientRect();
    spawnBurst(mRect.left + mRect.width * 0.78, mRect.top + mRect.height * 0.35, 'smoke', 10);
    if (targetEl) {
      const r = targetEl.getBoundingClientRect();
      spawnBurst(r.left + r.width / 2, r.top + r.height / 2, 'smoke', 8);
    }

    trickTimer = setTimeout(() => {
      magWrap.classList.remove('react-oops');
      browL.setAttribute('d', 'M125 91 Q135 85 144 90');
      browR.setAttribute('d', 'M156 90 Q165 85 175 91');
      magMouth.setAttribute('d', 'M139 128 Q150 137 161 128');
    }, 750);
  }

  /* ================= GAME STATE & LOGIC ================= */
  const state = {
    mode: 'missing',      // 'missing' | 'swap' | 'neighbors' | 'teacher'
    maxNum: 10,           // 10 | 20
    values: [],           // displayed numbers along the ray
    hidden: new Set(),    // indices hidden under magic hats
    spotlight: new Set(), // spotlighted indices
    targetQueue: [],      // active target index(es) to fill
    swapPair: [],         // [idxA, idxB] true swapped indices
    selected: [],         // user's selected indices
    choices: [],          // bottom cards
    teacherTool: 'hide',  // 'hide' | 'swap' | 'spot'
    locked: false,
    nextTimer: null
  };

  const rayNodesEl = document.getElementById('rayNodes');
  const bottomZoneEl = document.getElementById('bottomZone');

  // Build decorative stage footlights
  const footlights = document.getElementById('footlights');
  for (let i = 0; i < 15; i++) {
    const b = document.createElement('div');
    b.className = 'bulb';
    footlights.appendChild(b);
  }

  function updateNodeSizing() {
    const is20 = state.maxNum === 20;
    const size = is20 ? 'clamp(34px, 4vw, 62px)' : 'clamp(52px, 6.4vw, 84px)';
    const font = is20 ? 'clamp(16px, 2vw, 28px)' : 'clamp(24px, 3.2vw, 38px)';
    rayNodesEl.style.setProperty('--node-size', size);
    rayNodesEl.style.setProperty('--node-font', font);
  }

  function makeChoices(correctSet, count = 4) {
    const arr = Array.from(correctSet);
    const pool = [];
    for (let n = 0; n <= state.maxNum; n++) {
      if (!correctSet.has(n)) pool.push(n);
    }
    // Prefer nearby distractors for better math challenge
    const anchor = arr[0];
    pool.sort((a, b) => (Math.abs(a - anchor) + Math.random() * 3) - (Math.abs(b - anchor) + Math.random() * 3));
    while (arr.length < count && pool.length) arr.push(pool.shift());
    // Shuffle
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function generateRound() {
    clearTimeout(state.nextTimer);
    state.locked = false;
    state.values = Array.from({ length: state.maxNum + 1 }, (_, i) => i);
    state.hidden = new Set();
    state.spotlight = new Set();
    state.targetQueue = [];
    state.swapPair = [];
    state.selected = [];
    state.choices = [];

    updateNodeSizing();

    if (state.mode === 'missing') {
      const idx = Math.floor(Math.random() * (state.maxNum + 1));
      state.hidden.add(idx);
      state.targetQueue = [idx];
      state.choices = makeChoices(new Set([idx]), 4);
    }
    else if (state.mode === 'swap') {
      const a = Math.floor(Math.random() * (state.maxNum + 1));
      let b;
      // 50% adjacent swap, 50% further swap
      if (Math.random() < 0.5) {
        b = a === state.maxNum ? a - 1 : (a === 0 ? 1 : (Math.random() < 0.5 ? a - 1 : a + 1));
      } else {
        do { b = Math.floor(Math.random() * (state.maxNum + 1)); } while (b === a);
      }
      [state.values[a], state.values[b]] = [state.values[b], state.values[a]];
      state.swapPair = [a, b];
    }
    else if (state.mode === 'neighbors') {
      const anchor = 1 + Math.floor(Math.random() * (state.maxNum - 1));
      state.spotlight.add(anchor);
      const roll = Math.random();
      if (roll < 0.36) {
        // Before
        state.hidden.add(anchor - 1);
        state.targetQueue = [anchor - 1];
        state.choices = makeChoices(new Set([anchor - 1]), 4);
      } else if (roll < 0.72) {
        // After
        state.hidden.add(anchor + 1);
        state.targetQueue = [anchor + 1];
        state.choices = makeChoices(new Set([anchor + 1]), 4);
      } else {
        // Both before & after
        state.hidden.add(anchor - 1);
        state.hidden.add(anchor + 1);
        state.targetQueue = [anchor - 1, anchor + 1];
        state.choices = makeChoices(new Set([anchor - 1, anchor + 1]), 4);
      }
    }
    // Teacher mode starts clean & fully clickable

    renderRay();
    renderBottom();
  }

  /* Custom SVG Miniature Magic Hat for hidden numbers */
  const MINI_HAT_SVG = `
    <svg viewBox="0 0 64 64" width="100%" height="100%">
      <ellipse cx="32" cy="48" rx="26" ry="8" fill="#171724" stroke="#f5c85b" stroke-width="2"/>
      <path d="M16 46 L20 14 Q32 9 44 14 L48 46 Z" fill="#232438" stroke="#10101a" stroke-width="1.5"/>
      <path d="M17 39 Q32 44 47 39 L48 45 Q32 50 16 45 Z" fill="#c4193b"/>
      <path d="M29 24a4 4 0 1 1 6 3.5c-1 .7-2 1.3-2 2.7" fill="none" stroke="#ffe17d" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="32" cy="34.5" r="1.8" fill="#ffe17d"/>
    </svg>`;

  const DOWN_ARROW_SVG = `
    <svg class="neighbor-arrow" viewBox="0 0 36 36">
      <path d="M18 4v22M9 18l9 10 9-10" fill="none" stroke="#7ef2c2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;

  function renderRay() {
    rayNodesEl.innerHTML = '';
    const activeTarget = state.targetQueue[0];

    state.values.forEach((val, idx) => {
      const node = document.createElement('div');
      node.className = 'ray-node';
      node.dataset.idx = idx;
      node.dataset.tint = idx % 4;

      if (state.hidden.has(idx)) node.classList.add('hidden-num');
      if (state.spotlight.has(idx)) node.classList.add('spotlighted');
      if (state.selected.includes(idx)) node.classList.add('selected');
      if (activeTarget === idx && (state.mode === 'missing' || state.mode === 'neighbors')) {
        node.classList.add('active-target');
      }

      node.innerHTML = `
        <span class="num-val">${val}</span>
        <div class="hat-cover">${MINI_HAT_SVG}</div>
        ${activeTarget === idx && state.mode === 'neighbors' ? DOWN_ARROW_SVG : ''}
      `;

      node.addEventListener('click', () => onNodeClick(idx, node));
      rayNodesEl.appendChild(node);
    });
  }

  function renderBottom() {
    bottomZoneEl.innerHTML = '';

    if (state.mode === 'missing' || state.mode === 'neighbors') {
      const deck = document.createElement('div');
      deck.className = 'choices-deck';
      state.choices.forEach((num, i) => {
        const card = document.createElement('button');
        card.className = 'magic-card';
        card.dataset.c = i % 4;
        card.textContent = num;
        card.addEventListener('click', () => onChoiceClick(num, card));
        deck.appendChild(card);
      });
      bottomZoneEl.appendChild(deck);
    }
    else if (state.mode === 'swap') {
      const cue = document.createElement('div');
      cue.className = 'swap-cue';
      const s0 = state.selected[0] !== undefined ? state.values[state.selected[0]] : '?';
      const s1 = state.selected[1] !== undefined ? state.values[state.selected[1]] : '?';
      cue.innerHTML = `
        <div class="swap-slot ${state.selected[0] !== undefined ? 'filled' : ''}">${s0}</div>
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#f5c85b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 8h11l-3-3M18 8l-3 3M17 16H6l3-3M6 16l3 3"/>
        </svg>
        <div class="swap-slot ${state.selected[1] !== undefined ? 'filled' : ''}">${s1}</div>
      `;
      bottomZoneEl.appendChild(cue);
    }
    else if (state.mode === 'teacher') {
      const dock = document.createElement('div');
      dock.className = 'teacher-dock';
      const tools = [
        {
          id: 'hide',
          svg: `<path d="M5 17h14M7 17l1.5-10h7L17 17"/><path d="M8 13h8"/>`
        },
        {
          id: 'swap',
          svg: `<path d="M7 7h11l-3.5-3.5M18 7l-3.5 3.5"/><path d="M17 17H6l3.5-3.5M6 17l3.5 3.5"/>`
        },
        {
          id: 'spot',
          svg: `<circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>`
        },
        {
          id: 'trick',
          svg: `<path d="M12 3l2.2 5.4L20 9l-4.4 3.8L17 18.5 12 15.4 7 18.5l1.4-5.7L4 9l5.8-.6z"/>`
        },
        {
          id: 'reset',
          svg: `<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>`
        }
      ];
      tools.forEach(t => {
        const b = document.createElement('button');
        b.className = 'brass-btn' + (state.teacherTool === t.id ? ' active' : '');
        b.innerHTML = `<svg viewBox="0 0 24 24">${t.svg}</svg>`;
        b.addEventListener('click', () => {
          SFX.click();
          if (t.id === 'trick') {
            triggerMagicTrick();
          } else if (t.id === 'reset') {
            state.values = Array.from({ length: state.maxNum + 1 }, (_, i) => i);
            state.hidden.clear();
            state.spotlight.clear();
            state.selected = [];
            SFX.poof();
            renderRay();
          } else {
            state.teacherTool = t.id;
            state.selected = [];
            renderRay();
            renderBottom();
          }
        });
        dock.appendChild(b);
      });
      bottomZoneEl.appendChild(dock);
    }
  }

  /* ================= INTERACTION HANDLERS ================= */
  function onChoiceClick(num, cardEl) {
    if (state.locked) return;
    const targetIdx = state.targetQueue[0];
    if (targetIdx === undefined) return;

    if (num === targetIdx) {
      state.hidden.delete(targetIdx);
      state.targetQueue.shift();

      renderRay();
      const revealedNode = rayNodesEl.querySelector(`[data-idx="${targetIdx}"]`);
      if (revealedNode) revealedNode.classList.add('pop-reveal');

      if (state.targetQueue.length > 0) {
        // One more neighbor left (e.g. both before & after)
        SFX.miniOk();
        if (revealedNode) {
          const r = revealedNode.getBoundingClientRect();
          spawnBurst(r.left + r.width / 2, r.top + r.height / 2, 'stars', 18);
        }
        cardEl.style.opacity = '0.25';
        cardEl.style.pointerEvents = 'none';
      } else {
        state.locked = true;
        triggerMagicTrick(revealedNode);
        state.nextTimer = setTimeout(generateRound, 2100);
      }
    } else {
      cardEl.classList.remove('wrong-card');
      void cardEl.offsetWidth;
      cardEl.classList.add('wrong-card');
      triggerOops(cardEl);
    }
  }

  function onNodeClick(idx, nodeEl) {
    if (state.locked) return;

    if (state.mode === 'swap') {
      SFX.click();
      const pos = state.selected.indexOf(idx);
      if (pos !== -1) {
        state.selected.splice(pos, 1);
        renderRay();
        renderBottom();
        return;
      }
      state.selected.push(idx);
      renderRay();
      renderBottom();

      if (state.selected.length === 2) {
        const [s1, s2] = state.selected;
        const [p1, p2] = state.swapPair;
        const isCorrect = (s1 === p1 && s2 === p2) || (s1 === p2 && s2 === p1);
        if (isCorrect) {
          state.locked = true;
          SFX.swap();
          setTimeout(() => {
            [state.values[p1], state.values[p2]] = [state.values[p2], state.values[p1]];
            state.selected = [];
            renderRay();
            const n1 = rayNodesEl.querySelector(`[data-idx="${p1}"]`);
            const n2 = rayNodesEl.querySelector(`[data-idx="${p2}"]`);
            if (n1) n1.classList.add('pop-reveal');
            if (n2) n2.classList.add('pop-reveal');
            triggerMagicTrick(n1);
            if (n2) {
              const r2 = n2.getBoundingClientRect();
              spawnBurst(r2.left + r2.width / 2, r2.top + r2.height / 2, 'stars', 22);
            }
            state.nextTimer = setTimeout(generateRound, 2200);
          }, 260);
        } else {
          state.locked = true;
          const n1 = rayNodesEl.querySelector(`[data-idx="${s1}"]`);
          const n2 = rayNodesEl.querySelector(`[data-idx="${s2}"]`);
          if (n1) n1.classList.add('wobble-err');
          if (n2) n2.classList.add('wobble-err');
          triggerOops(n2);
          setTimeout(() => {
            state.selected = [];
            state.locked = false;
            renderRay();
            renderBottom();
          }, 620);
        }
      }
    }
    else if (state.mode === 'teacher') {
      const rect = nodeEl.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      if (state.teacherTool === 'hide') {
        if (state.hidden.has(idx)) {
          state.hidden.delete(idx);
          SFX.miniOk();
          spawnBurst(cx, cy, 'stars', 16);
        } else {
          state.hidden.add(idx);
          SFX.poof();
          spawnBurst(cx, cy, 'smoke', 7);
        }
        renderRay();
      }
      else if (state.teacherTool === 'spot') {
        SFX.click();
        if (state.spotlight.has(idx)) state.spotlight.delete(idx);
        else {
          state.spotlight.add(idx);
          spawnBurst(cx, cy, 'stars', 12);
        }
        renderRay();
      }
      else if (state.teacherTool === 'swap') {
        SFX.click();
        const pos = state.selected.indexOf(idx);
        if (pos !== -1) {
          state.selected.splice(pos, 1);
        } else {
          state.selected.push(idx);
          if (state.selected.length === 2) {
            const [a, b] = state.selected;
            [state.values[a], state.values[b]] = [state.values[b], state.values[a]];
            state.selected = [];
            SFX.swap();
            spawnBurst(cx, cy, 'stars', 16);
          }
        }
        renderRay();
      }
    }
  }

  /* ================= TOP BAR LISTENERS ================= */
  document.querySelectorAll('#modeBtns .brass-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      SFX.click();
      document.querySelectorAll('#modeBtns .brass-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.mode = btn.dataset.mode;
      generateRound();
    });
  });

  document.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      SFX.click();
      document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.maxNum = Number(btn.dataset.range);
      generateRound();
    });
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    SFX.poof();
    const mRect = magWrap.getBoundingClientRect();
    spawnBurst(mRect.left + mRect.width * 0.5, mRect.top + mRect.height * 0.5, 'stars', 16);
    generateRound();
  });

  const soundBtn = document.getElementById('soundBtn');
  const soundIcon = document.getElementById('soundIcon');
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.classList.toggle('active', !soundOn);
    soundIcon.innerHTML = soundOn
      ? `<path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>`
      : `<path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M22 9l-6 6M16 9l6 6"/>`;
  });

  generateRound();
})();
</script>
</body>
</html>
