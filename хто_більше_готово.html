<html lang="uk"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Більше, Менше, Дорівнює</title>
    
    <!-- Підключення Firebase (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-database-compat.js"></script>

    <style>
        /* Базові налаштування */
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #222;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Ігровий контейнер */
        #game-container {
            width: 98%;
            max-width: 1400px;
            margin-top: 30px;
            margin-bottom: 80px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 20px;
        }

        /* Ліва панель */
        #left-panel {
            width: 35%;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 2px dashed rgba(255, 255, 255, 0.2);
            padding-right: 20px;
        }

        /* Права панель */
        #right-panel {
            width: 65%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Керування гравцями */
        .players-control {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
            width: 100%;
        }
        .players-control input {
            padding: 12px 15px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 16px;
            width: 100%;
            max-width: 250px;
            background: rgba(255, 255, 255, 0.9);
            text-align: center;
        }
        .players-control button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            width: 100%;
            max-width: 250px;
        }
        .players-control button:active {
            transform: scale(0.95);
        }

        /* Візуальний лічильник */
        #visual-scoreboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
            min-height: 150px;
            align-items: flex-end;
            justify-content: center;
            width: 100%;
        }
        .player-column-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 10px;
            border-radius: 15px;
            transition: background 0.3s;
        }
        .player-column-wrapper.active {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        .player-name-label {
            color: white;
            font-weight: bold;
            font-size: 18px;
            margin-top: 10px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 100px;
            word-wrap: break-word;
        }
        .score-column {
            display: flex;
            flex-direction: column-reverse;
            gap: 5px;
            width: 40px;
            align-items: center;
        }
        .score-block {
            width: 35px;
            height: 15px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* Ігрова зона */
        .play-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
            flex-wrap: wrap;
        }

        /* Картки */
        .card-container {
            width: 160px;
            height: 230px;
            perspective: 1000px;
            cursor: pointer;
        }
        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 0 0 2px rgba(255,255,255,0.2);
        }
        .card-container.is-flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 15px;
            background-size: cover;
            background-position: center;
            background-color: rgba(255, 255, 255, 0.9);
        }

        /* Анімація перемішування */
        .shuffling .card-inner {
            animation: shake 0.4s ease-in-out infinite;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            50% { transform: translateX(5px) rotate(5deg); }
            75% { transform: translateX(-5px) rotate(-5deg); }
        }

        /* Панель кнопок-операторів */
        .operators {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .op-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            font-size: 35px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .op-btn:hover:not(:disabled) {
            background: #fff;
            transform: scale(1.15);
        }
        .op-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Кнопка дії */
        #action-btn {
            margin-top: 50px;
            padding: 15px 50px;
            font-size: 22px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #ff4081, #d50000);
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(213, 0, 0, 0.4);
            transition: transform 0.2s;
        }
        #action-btn:active {
            transform: scale(0.95);
        }
        #action-btn:disabled {
            background: gray;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Фідбек (Світіння та частинки) */
        .glow-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 8000;
            opacity: 0;
            transition: opacity 0.4s ease-out;
        }
        .glow-overlay.correct {
            background: radial-gradient(circle, rgba(76,175,80,0.35) 0%, rgba(0,0,0,0) 80%);
        }
        .glow-overlay.wrong {
            background: radial-gradient(circle, rgba(244,67,54,0.4) 0%, rgba(0,0,0,0) 80%);
        }
        .glow-overlay.show { opacity: 1; }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 9000;
            animation: particleAnim 1s ease-out forwards;
        }
        @keyframes particleAnim {
            0% { opacity: 1; transform: scale(1) translate(0, 0) rotate(0deg); }
            100% { opacity: 0; transform: scale(0.2) translate(var(--tx), var(--ty)) rotate(var(--rot)); }
        }

        /* Адаптивність */
        @media (max-width: 800px) {
            #game-container {
                flex-direction: column;
                align-items: center;
                padding: 15px;
            }
            #left-panel {
                width: 100%;
                border-right: none;
                border-bottom: 2px dashed rgba(255, 255, 255, 0.2);
                padding-right: 0;
                padding-bottom: 20px;
            }
            #right-panel {
                width: 100%;
                padding-top: 20px;
            }
            .play-area { flex-direction: column; gap: 20px; }
            .operators { flex-direction: row; }
            .card-container { width: 140px; height: 200px; }
            .op-btn { width: 60px; height: 60px; font-size: 28px; }
        }

        /* Theme Manager UI */
        #theme-settings-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 24px;
            border: 2px solid white;
            cursor: pointer;
            z-index: 9500;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        #theme-settings-btn:hover {
            transform: rotate(45deg);
        }
        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            background: rgba(30, 30, 30, 0.95);
            border-radius: 15px;
            padding: 20px;
            z-index: 9501;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }
        #theme-modal h2 {
            margin-top: 0;
            text-align: center;
        }
        #theme-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
        }
        .theme-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            height: 80px;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .theme-item:hover {
            border-color: #4CAF50;
        }
        .theme-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .theme-item span {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            font-size: 12px;
            padding: 4px 0;
            font-weight: bold;
        }
        .close-modal-btn {
            display: block;
            margin: 20px auto 0;
            padding: 10px 20px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Заглушка екрану */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: #ff3333;
            z-index: 999999;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
</head>

        for (let i = 1; i <= 7; i++) {
            if (cardImages[i] === `MAGIC_TOKEN_${i}`) {
                cardImages[i] = `./kartka_${i}.webp`;
            }
        }

        // Генерація "Сорочки" кодом
        const backSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300"><rect width="200" height="300" rx="20" fill="#1e88e5"/><path d="M0 0 L200 300 M200 0 L0 300" stroke="#1565c0" stroke-width="20"/><circle cx="100" cy="150" r="50" fill="#fff" opacity="0.2"/><circle cx="100" cy="150" r="30" fill="none" stroke="#fff" stroke-width="5" opacity="0.5"/></svg>`;
        const cardBackBase64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(backSvg)));

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('card1-back').style.backgroundImage = `url("${cardBackBase64}")`;
            document.getElementById('card2-back').style.backgroundImage = `url("${cardBackBase64}")`;

            if (window.__EMBEDDED__) return;
            
            const hostname = window.location.hostname;
            if (hostname !== '127.0.0.1' && hostname !== 'localhost') return;

            // Створення чарівної кнопки
            const btn = document.createElement('button');
            btn.innerHTML = '✨ ЗАШИТИ КАРТИНКИ В КОД ✨';
            btn.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99999;padding:20px 40px;font-size:24px;background:linear-gradient(135deg, #ff0055, #ff5500);color:white;border:none;border-radius:15px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,0.5);font-weight:bold;';
            document.body.appendChild(btn);

            btn.onclick = async () => {
                btn.innerText = 'Триває перетворення...';
                let htmlStr = document.documentElement.outerHTML;
                let successCount = 0;
                
                for (let i = 1; i <= 7; i++) {
                    try {
                        const res = await fetch(`./kartka_${i}.webp`);
                        if (res.ok) {
                            const blob = await res.blob();
                            const reader = new FileReader();
                            const base64 = await new Promise(r => {
                                reader.onloadend = () => r(reader.result);
                                reader.readAsDataURL(blob);
                            });
                            
                            // Замінюємо точний токен на згенерований код
                            const targetToken = `MAGIC_TOKEN_${i}`;
                            htmlStr = htmlStr.replace(targetToken, base64);
                            successCount++;
                        }
                    } catch (e) {
                        console.error("Помилка:", e);
                    }
                }

                if (successCount > 0) {
                    htmlStr = htmlStr.replace('window.__EMBEDDED__ = false;', 'window.__EMBEDDED__ = true;');
                    
                    const blobBlob = new Blob(['<!DOCTYPE html>\n<html lang="uk">\n' + htmlStr], {type: 'text/html'});
                    const url = URL.createObjectURL(blobBlob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'хто_більше_готово.html';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);

                    btn.innerText = `УСПІХ! (${successCount} карток зашито)`;
                    btn.style.background = '#4CAF50';
                    setTimeout(() => btn.remove(), 4000);
                } else {
                    btn.innerText = 'ПОМИЛКА: КАРТИНКИ НЕ ЗНАЙДЕНО';
                    btn.style.background = '#f44336';
                    setTimeout(() => { btn.innerHTML = '✨ ЗАШИТИ КАРТИНКИ В КОД ✨'; btn.style.background = 'linear-gradient(135deg, #ff0055, #ff5500)'; }, 3000);
                }
            };
        });

        // ==========================================
        // 1. УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ ТА FIREBASE СИНХРОНІЗАЦІЯ
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
            projectId: "lesson-13c44"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let myName = sessionStorage.getItem('userName');
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('user')) {
            myName = urlParams.get('user');
            sessionStorage.setItem('userName', myName);
        } else if (!myName) {
            myName = "Гість_" + Math.floor(Math.random() * 1000);
            sessionStorage.setItem('userName', myName);
        }

        const tabId = 'tab_' + Math.random().toString(36).substr(2, 9);
        const myPresenceRef = db.ref(`online_users/${myName}/${tabId}`);
        const connectedRef = db.ref('.info/connected');

        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                myPresenceRef.onDisconnect().remove();
                myPresenceRef.set(true);
            }
        });
        window.addEventListener('beforeunload', () => {
            myPresenceRef.remove();
        });

        db.ref(`blocked_users/${myName}`).on('value', (snapshot) => {
            document.getElementById('block-overlay').style.display = snapshot.val() === true ? 'flex' : 'none';
        });

        let skipFirstRefresh = true;
        db.ref('force_refresh').on('value', (snapshot) => {
            if (skipFirstRefresh) { skipFirstRefresh = false; return; }
            if (snapshot.val()) location.reload();
        });

        let immunity = true;
        setTimeout(() => { immunity = false; }, 1000); 
        
        db.ref('current_activity').on('value', (snapshot) => {
            if (immunity) return;
            if (snapshot.val() === 'lobby') {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
        });

        // ==========================================
        // 3. ЗВУК (Web Audio API - дуже тихі)
        // ==========================================
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(isCorrect) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (isCorrect) {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.015, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // ==========================================
        // 4. РАНДОМ КАРТОК (Система "Мішечків")
        // ==========================================
        let deck1 = [];
        let deck2 = [];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function drawCardFromDeck(deckNum) {
            let deck = deckNum === 1 ? deck1 : deck2;
            if (deck.length === 0) {
                for (let i = 1; i <= 7; i++) deck.push(i);
                shuffle(deck);
            }
            return deck.pop();
        }

        // ==========================================
        // 5. ЛОГІКА ГРИ ТА СИНХРОНІЗАЦІЯ Firebase
        // ==========================================
        let players = [];
        let activePlayerIndex = -1;
        let currentCard1Value = 0;
        let currentCard2Value = 0;
        let gameState = 'idle';

        const c1Container = document.getElementById('card1-container');
        const c2Container = document.getElementById('card2-container');
        const actionBtn = document.getElementById('action-btn');
        const opButtons = document.querySelectorAll('.op-btn');
        const scoreboard = document.getElementById('visual-scoreboard');

        function sendGameAction(actionData) {
            actionData.senderId = myName;
            actionData.timestamp = Date.now();
            db.ref('game_action').set(actionData);
        }

        function addPlayerAction() {
            initAudio(); 
            const input = document.getElementById('new-player-name');
            const name = input.value.trim();
            if (name && !players.find(p => p.name === name)) {
                const newPlayers = [...players, { name: name, score: 0 }];
                const newActive = newPlayers.length === 1 ? 0 : activePlayerIndex;
                input.value = '';
                
                sendGameAction({ type: 'update_players', players: newPlayers, activePlayerIndex: newActive });
                applyPlayerUpdate(newPlayers, newActive);
            }
        }

        function setActivePlayerAction(index) {
            sendGameAction({ type: 'update_players', players: players, activePlayerIndex: index });
            applyPlayerUpdate(players, index);
        }

        function startRoundAction() {
            initAudio();
            if (players.length === 0) return alert("Додайте хоча б одного гравця!");
            if (gameState === 'playing') return;

            const c1 = drawCardFromDeck(1);
            const c2 = drawCardFromDeck(2);

            sendGameAction({ type: 'start_round', c1: c1, c2: c2 });
            executeStartRound(c1, c2);
        }

        function makeGuessAction(guess) {
            if (gameState !== 'playing') return;
            
            let isCorrect = false;
            if (guess === '<' && currentCard1Value < currentCard2Value) isCorrect = true;
            if (guess === '=' && currentCard1Value === currentCard2Value) isCorrect = true;
            if (guess === '>' && currentCard1Value > currentCard2Value) isCorrect = true;

            const newPlayers = JSON.parse(JSON.stringify(players));
            if (isCorrect && activePlayerIndex !== -1) newPlayers[activePlayerIndex].score++;

            sendGameAction({ type: 'make_guess', guess: guess, isCorrect: isCorrect, players: newPlayers });
            executeMakeGuess(guess, isCorrect, newPlayers);
        }

        function applyPlayerUpdate(newPlayers, newActiveIndex) {
            players = newPlayers || [];
            activePlayerIndex = newActiveIndex;
            renderScoreboard();
        }

        function executeStartRound(c1, c2) {
            gameState = 'playing';
            actionBtn.disabled = true;
            opButtons.forEach(b => b.disabled = true);
            
            c1Container.classList.remove('is-flipped');
            c2Container.classList.remove('is-flipped');

            setTimeout(() => {
                c1Container.classList.add('shuffling');
                c2Container.classList.add('shuffling');

                setTimeout(() => {
                    c1Container.classList.remove('shuffling');
                    c2Container.classList.remove('shuffling');

                    currentCard1Value = c1;
                    currentCard2Value = c2;

                    document.getElementById('card1-front').style.backgroundImage = `url('${cardImages[currentCard1Value]}')`;
                    document.getElementById('card2-front').style.backgroundImage = `url('${cardImages[currentCard2Value]}')`;

                    c1Container.classList.add('is-flipped');
                    
                    opButtons.forEach(b => b.disabled = false);
                    actionBtn.innerText = "Оберіть знак...";

                }, 1000);
            }, 300);
        }

        function executeMakeGuess(guess, isCorrect, newPlayers) {
            gameState = 'guessed';
            opButtons.forEach(b => b.disabled = true);
            c2Container.classList.add('is-flipped');

            setTimeout(() => {
                triggerFeedback(isCorrect);
                applyPlayerUpdate(newPlayers, activePlayerIndex);
                
                actionBtn.innerText = "Наступний раунд";
                actionBtn.disabled = false;
                gameState = 'idle';
            }, 600);
        }

        function renderScoreboard() {
            scoreboard.innerHTML = '';
            players.forEach((p, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'player-column-wrapper' + (index === activePlayerIndex ? ' active' : '');
                wrapper.onclick = () => setActivePlayerAction(index);

                const column = document.createElement('div');
                column.className = 'score-column';
                for (let i = 0; i < p.score; i++) {
                    const block = document.createElement('div');
                    block.className = 'score-block';
                    column.appendChild(block);
                }

                const label = document.createElement('div');
                label.className = 'player-name-label';
                label.innerText = p.name;

                wrapper.appendChild(column);
                wrapper.appendChild(label);
                scoreboard.appendChild(wrapper);
            });
        }

        // Firebase Listener
        db.ref('game_action').on('value', snap => {
            const action = snap.val();
            if (!action || action.senderId === myName) return; 

            if (action.type === 'update_players') {
                applyPlayerUpdate(action.players, action.activePlayerIndex);
            } else if (action.type === 'start_round') {
                executeStartRound(action.c1, action.c2);
            } else if (action.type === 'make_guess') {
                executeMakeGuess(action.guess, action.isCorrect, action.players);
            }
        });

        // ==========================================
        // 6. ВІЗУАЛЬНІ ЕФЕКТИ
        // ==========================================
        function triggerFeedback(isCorrect) {
            playSound(isCorrect);
            const glow = document.getElementById('feedback-glow');
            glow.className = `glow-overlay show ${isCorrect ? 'correct' : 'wrong'}`;
            setTimeout(() => { glow.classList.remove('show'); }, 1000);
            createParticles(isCorrect);
        }

        function createParticles(isCorrect) {
            const numParticles = isCorrect ? 60 : 40;
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            for (let i = 0; i < numParticles; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 10 + 5;
                p.style.width = size + 'px'; p.style.height = size + 'px';
                p.style.left = centerX + 'px'; p.style.top = centerY + 'px';

                if (isCorrect) {
                    const colors = ['#f44336', '#e91e63', '#9c27b0', '#3f51b5', '#2196f3', '#4caf50', '#ffeb3b', '#ff9800'];
                    p.style.background = colors[Math.floor(Math.random() * colors.length)];
                    p.style.borderRadius = (Math.random() > 0.5) ? '50%' : '2px';
                } else {
                    const colors = ['#ff5722', '#ff9800', '#ffc107', '#424242'];
                    p.style.background = colors[Math.floor(Math.random() * colors.length)];
                    p.style.borderRadius = '50%';
                }

                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * (isCorrect ? 300 : 200) + 50;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                const rot = Math.random() * 360 + 180;
                
                p.style.setProperty('--tx', tx + 'px'); p.style.setProperty('--ty', ty + 'px');
                p.style.setProperty('--rot', rot + 'deg');

                document.body.appendChild(p);
                setTimeout(() => { p.remove(); }, 1000);
            }
        }

        // ==========================================
        // 7. СИСТЕМА ДИНАМІЧНИХ ФОНІВ (Theme Manager)
        // ==========================================
        const themeGallery = document.getElementById('theme-gallery');
        const baseUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
        
        async function loadBackgrounds() {
            for (let i = 1; i <= 1000; i++) {
                const url = `${baseUrl}background_${i}.webp`;
                try {
                    const response = await fetch(url, { method: 'HEAD' });
                    if (response.ok) {
                        const div = document.createElement('div');
                        div.className = 'theme-item';
                        div.onclick = () => selectTheme(url);
                        
                        const img = document.createElement('img');
                        img.src = url; img.alt = `Фон ${i}`; img.loading = "lazy";
                        
                        const span = document.createElement('span');
                        span.innerText = `Фон ${i}`;
                        
                        div.appendChild(img); div.appendChild(span);
                        themeGallery.appendChild(div);
                    } else { break; }
                } catch (e) { break; }
            }
        }

        function selectTheme(url) {
            db.ref('game_theme').set(url);
            document.getElementById('theme-modal').style.display = 'none';
        }

        db.ref('game_theme').on('value', (snapshot) => {
            const url = snapshot.val();
            if (url) {
                document.body.style.backgroundImage = `url('${url}')`;
                localStorage.setItem('mySavedGameBg', url);
            }
        });

        const savedBg = localStorage.getItem('mySavedGameBg');
        if (savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;
        loadBackgrounds();

    </script>
