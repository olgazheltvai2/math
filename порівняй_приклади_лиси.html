  <canvas id="global-draw-canvas"></canvas>
  <button type="button" id="toggle-draw-btn-global">✏️ Малювати</button>

  <div id="draw-panel-global">
    <div id="draw-panel-header">
      <div id="draw-drag-grip"></div>
      <button type="button" id="close-draw-panel-btn">✕</button>
    </div>
    <div id="draw-panel-body">
      <div class="draw-tools-row">
        <button type="button" class="draw-tool-btn active" id="tool-pencil-btn">✏️ Олівець</button>
        <button type="button" class="draw-tool-btn" id="tool-eraser-btn">🧽 Гумка</button>
      </div>
      <div class="draw-controls-row">
        <input type="range" id="draw-size-slider" min="1" max="50" value="6" />
        <input type="color" id="draw-color-picker" value="#ffeb3b" />
      </div>
      <button type="button" id="draw-clear-btn">🗑️ Очистити</button>
    </div>
  </div>

  <script>
    (function () {
      const drawCanvas = document.getElementById('global-draw-canvas');
      const dCtx = drawCanvas.getContext('2d');
      const toggleBtn = document.getElementById('toggle-draw-btn-global');
      const drawPanel = document.getElementById('draw-panel-global');
      const closeBtn = document.getElementById('close-draw-panel-btn');
      const pencilBtn = document.getElementById('tool-pencil-btn');
      const eraserBtn = document.getElementById('tool-eraser-btn');
      const sizeSlider = document.getElementById('draw-size-slider');
      const colorPicker = document.getElementById('draw-color-picker');
      const clearBtn = document.getElementById('draw-clear-btn');
      const panelHeader = document.getElementById('draw-panel-header');

      let drawingEnabled = false;
      let isDrawing = false;
      let currentTool = 'pencil';
      let lastPos = { x: 0, y: 0 };

      function resizeDrawCanvas() {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = drawCanvas.width;
        tempCanvas.height = drawCanvas.height;
        if (drawCanvas.width > 0 && drawCanvas.height > 0) {
          tempCanvas.getContext('2d').drawImage(drawCanvas, 0, 0);
        }
        drawCanvas.width = window.innerWidth;
        drawCanvas.height = window.innerHeight;
        if (tempCanvas.width > 0 && tempCanvas.height > 0) {
          dCtx.drawImage(tempCanvas, 0, 0, tempCanvas.width, tempCanvas.height, 0, 0, drawCanvas.width, drawCanvas.height);
        }
      }
      window.addEventListener('resize', resizeDrawCanvas);
      resizeDrawCanvas();

      // Перерахунок координат відносно ігрової області (1600x900), щоб лінії збігалися на різних екранах
      function getGameViewportRect() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const scale = Math.min(w / 1600, h / 900);
        const rw = 1600 * scale;
        const rh = 900 * scale;
        const rx = (w - rw) / 2;
        const ry = (h - rh) / 2;
        return { rx, ry, rw, rh, scale };
      }

      function toNormalizedCoords(clientX, clientY) {
        const r = getGameViewportRect();
        return {
          nx: (clientX - r.rx) / r.rw,
          ny: (clientY - r.ry) / r.rh
        };
      }

      function fromNormalizedCoords(nx, ny) {
        const r = getGameViewportRect();
        return {
          x: r.rx + nx * r.rw,
          y: r.ry + ny * r.rh,
          scale: r.scale
        };
      }

      function renderStroke(nx1, ny1, nx2, ny2, color, size, tool) {
        const p1 = fromNormalizedCoords(nx1, ny1);
        const p2 = fromNormalizedCoords(nx2, ny2);
        dCtx.save();
        dCtx.lineCap = 'round';
        dCtx.lineJoin = 'round';
        dCtx.lineWidth = Math.max(1, size * p1.scale);
        if (tool === 'eraser') {
          dCtx.globalCompositeOperation = 'destination-out';
          dCtx.strokeStyle = 'rgba(0,0,0,1)';
        } else {
          dCtx.globalCompositeOperation = 'source-over';
          dCtx.strokeStyle = color;
        }
        dCtx.beginPath();
        dCtx.moveTo(p1.x, p1.y);
        dCtx.lineTo(p2.x, p2.y);
        dCtx.stroke();
        dCtx.restore();
      }

      window.handleRemoteDrawLine = function (data) {
        renderStroke(data.nx1, data.ny1, data.nx2, data.ny2, data.color, data.size, data.tool);
      };

      window.handleRemoteClearCanvas = function () {
        dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      };

      // Відкриття панелі одразу вмикає олівець
      toggleBtn.addEventListener('click', () => {
        drawPanel.style.display = 'flex';
        drawingEnabled = true;
        currentTool = 'pencil';
        pencilBtn.classList.add('active');
        eraserBtn.classList.remove('active');
        drawCanvas.style.pointerEvents = 'auto';
      });

      // Закриття панелі на хрестик вимикає малювання
      closeBtn.addEventListener('click', () => {
        drawPanel.style.display = 'none';
        drawingEnabled = false;
        isDrawing = false;
        drawCanvas.style.pointerEvents = 'none';
      });

      pencilBtn.addEventListener('click', () => {
        currentTool = 'pencil';
        pencilBtn.classList.add('active');
        eraserBtn.classList.remove('active');
      });

      eraserBtn.addEventListener('click', () => {
        currentTool = 'eraser';
        eraserBtn.classList.add('active');
        pencilBtn.classList.remove('active');
      });

      clearBtn.addEventListener('click', () => {
        dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        sendGameAction('clear_canvas', {});
      });

      function startDraw(clientX, clientY) {
        if (!drawingEnabled) return;
        isDrawing = true;
        lastPos = toNormalizedCoords(clientX, clientY);
      }

      function moveDraw(clientX, clientY) {
        if (!drawingEnabled || !isDrawing) return;
        const curPos = toNormalizedCoords(clientX, clientY);
        const color = colorPicker.value;
        const size = parseFloat(sizeSlider.value) || 6;

        renderStroke(lastPos.nx, lastPos.ny, curPos.nx, curPos.ny, color, size, currentTool);
        sendGameAction('draw_line', {
          nx1: lastPos.nx,
          ny1: lastPos.ny,
          nx2: curPos.nx,
          ny2: curPos.ny,
          color: color,
          size: size,
          tool: currentTool
        });
        lastPos = curPos;
      }

      function endDraw() {
        isDrawing = false;
      }

      drawCanvas.addEventListener('mousedown', (e) => startDraw(e.clientX, e.clientY));
      window.addEventListener('mousemove', (e) => moveDraw(e.clientX, e.clientY));
      window.addEventListener('mouseup', endDraw);

      drawCanvas.addEventListener('touchstart', (e) => {
        if (!drawingEnabled) return;
        const t = e.touches[0];
        startDraw(t.clientX, t.clientY);
      }, { passive: false });

      drawCanvas.addEventListener('touchmove', (e) => {
        if (!drawingEnabled || !isDrawing) return;
        e.preventDefault();
        const t = e.touches[0];
        moveDraw(t.clientX, t.clientY);
      }, { passive: false });

      drawCanvas.addEventListener('touchend', endDraw);

      // Перетягування панелі малювання мишкою та тачем
      let draggingPanel = false;
      let dragOffsetX = 0;
      let dragOffsetY = 0;

      function startPanelDrag(clientX, clientY) {
        draggingPanel = true;
        const rect = drawPanel.getBoundingClientRect();
        dragOffsetX = clientX - rect.left;
        dragOffsetY = clientY - rect.top;
        drawPanel.style.bottom = 'auto';
        drawPanel.style.right = 'auto';
        drawPanel.style.left = rect.left + 'px';
        drawPanel.style.top = rect.top + 'px';
      }

      function movePanelDrag(clientX, clientY) {
        if (!draggingPanel) return;
        const maxX = window.innerWidth - drawPanel.offsetWidth;
        const maxY = window.innerHeight - drawPanel.offsetHeight;
        const nx = Math.max(0, Math.min(maxX, clientX - dragOffsetX));
        const ny = Math.max(0, Math.min(maxY, clientY - dragOffsetY));
        drawPanel.style.left = nx + 'px';
        drawPanel.style.top = ny + 'px';
      }

      panelHeader.addEventListener('mousedown', (e) => {
        if (e.target === closeBtn) return;
        startPanelDrag(e.clientX, e.clientY);
      });
      window.addEventListener('mousemove', (e) => movePanelDrag(e.clientX, e.clientY));
      window.addEventListener('mouseup', () => { draggingPanel = false; });

      panelHeader.addEventListener('touchstart', (e) => {
        if (e.target === closeBtn) return;
        const t = e.touches[0];
        startPanelDrag(t.clientX, t.clientY);
      }, { passive: true });
      window.addEventListener('touchmove', (e) => {
        if (!draggingPanel) return;
        const t = e.touches[0];
        movePanelDrag(t.clientX, t.clientY);
      }, { passive: true });
      window.addEventListener('touchend', () => { draggingPanel = false; });
    })();
  </script>

  <script>
    (function () {
      const blockOverlay = document.getElementById('block-overlay');

      // 1. Отримання та збереження імені користувача
      const urlParams = new URLSearchParams(window.location.search);
      let myName = urlParams.get('user');
      if (myName && myName.trim() !== '') {
        myName = myName.trim();
        sessionStorage.setItem('myUserName', myName);
      } else {
        myName = sessionStorage.getItem('myUserName');
        if (!myName) {
          myName = 'Гість_' + Math.floor(Math.random() * 1000);
          sessionStorage.setItem('myUserName', myName);
        }
      }

      if (!window.db) return;

      // 2. Радар та унікальні вкладки
      const tabId = 'tab_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now();
      const safeName = myName.replace(/[.#$[\]/]/g, '_');
      const myTabRef = window.db.ref('online_users/' + safeName + '/' + tabId);

      function registerPresence() {
        window.db.ref('.info/connected').on('value', (snap) => {
          if (snap.val() === true) {
            myTabRef.onDisconnect().remove();
            myTabRef.set({
              name: myName,
              game: CONFIG.gameId,
              timestamp: firebase.database.ServerValue.TIMESTAMP
            });
          }
        });
      }
      registerPresence();

      window.addEventListener('beforeunload', () => {
        try {
          myTabRef.remove();
        } catch (e) {}
      });

      // 3. Примусове оновлення списку та блокування
      let firstRefreshSnap = true;
      window.db.ref('force_refresh').on('value', () => {
        if (firstRefreshSnap) {
          firstRefreshSnap = false;
          return;
        }
        myTabRef.set({
          name: myName,
          game: CONFIG.gameId,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });
      });

      window.db.ref('blocked_users/' + safeName).on('value', (snap) => {
        if (snap.val() === true) {
          blockOverlay.style.display = 'flex';
        } else {
          blockOverlay.style.display = 'none';
        }
      });

      // 4. Повернення в Лобі (з імунітетом першої секунди при прямому відкритті)
      let isImmunityActive = true;
      setTimeout(() => {
        isImmunityActive = false;
      }, 1200);

      window.db.ref('current_activity').on('value', (snap) => {
        if (isImmunityActive) return;
        const val = snap.val();
        if (val === 'lobby' || (val && val.status === 'lobby')) {
          window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
        }
      });
    })();
  </script>
