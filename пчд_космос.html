<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Складання через десяток - Космічна станція</title>
    
    <!-- Підключення Firebase (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-database-compat.js"></script>
    
    <style>
        /* Основне скидання та налаштування повноекранного режиму */
        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050914;
            touch-action: none;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            transition: background-image 0.5s ease;
        }

        /* Живий сюжетний SVG фон (Sci-Fi космічна станція) */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
        }

        /* Анімації фону */
        @keyframes rotateGalaxy {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .galaxy-spin {
            transform-origin: 1500px 400px;
            animation: rotateGalaxy 120s linear infinite;
        }
        @keyframes floatAsteroid {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-30px, 20px) rotate(15deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .asteroid {
            animation: floatAsteroid 15s ease-in-out infinite;
        }
        @keyframes pulseNeon {
            0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 5px #00f3ff); }
            50% { opacity: 1; filter: drop-shadow(0 0 15px #00f3ff); }
        }
        .neon-line {
            animation: pulseNeon 3s infinite;
        }

        /* Інтерфейс керування зверху */
        #controls {
            position: absolute;
            top: 20px;
            right: 20px; /* Змінено для надійності, щоб не вилазило за екран */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(10, 20, 40, 0.85);
            padding: 15px 30px;
            border-radius: 20px;
            border: 2px solid #00f3ff;
            box-shadow: 0 10px 30px rgba(0,243,255,0.2), inset 0 0 20px rgba(0, 243, 255, 0.1);
            z-index: 100;
            backdrop-filter: blur(10px);
            max-width: calc(100vw - 40px);
            flex-wrap: wrap;
        }

        input[type="number"] {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #b829ff;
            border-radius: 12px;
            color: #00f3ff;
            font-size: 2.5rem;
            font-weight: bold;
            width: 100px;
            height: 70px;
            text-align: center;
            outline: none;
            box-shadow: inset 0 0 15px rgba(184, 41, 255, 0.4);
            transition: all 0.3s;
            text-shadow: 0 0 10px #00f3ff;
        }
        input[type="number"]:focus {
            border-color: #00f3ff;
            box-shadow: 0 0 20px #00f3ff, inset 0 0 10px #b829ff;
            color: #fff;
        }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .math-sign {
            color: #fff;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 15px #b829ff, 0 0 30px #00f3ff;
        }

        #btn-play {
            background: linear-gradient(135deg, #00f3ff, #b829ff);
            border: 2px solid #ffffff;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
            transition: all 0.2s;
            flex-shrink: 0;
        }
        #btn-play:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 0 30px rgba(184, 41, 255, 0.9);
        }
        #btn-play:active {
            transform: scale(0.95);
        }

        /* Живий персонаж (Робот праворуч) */
        #robot-char {
            position: absolute;
            bottom: 110px;
            right: 35px;
            width: 250px;
            height: 350px;
            z-index: 80;
            pointer-events: none;
            animation: robotHover 4s ease-in-out infinite;
            transform-origin: center bottom;
        }
        @keyframes robotHover {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .bot-eye {
            transform-origin: center;
            animation: blink 4s infinite;
        }
        @keyframes blink {
            0%, 45%, 48%, 100% { transform: scaleY(1); }
            46.5% { transform: scaleY(0.08); }
        }
        .bot-thruster {
            animation: thrusterFlicker 0.1s infinite alternate;
        }
        @keyframes thrusterFlicker {
            0% { opacity: 0.8; transform: scaleY(0.9); }
            100% { opacity: 1; transform: scaleY(1.15); }
        }
        /* Анімації рук (обертання навколо точного суглобу) */
        .bot-arm-left {
            animation: armSwayLeft 5s infinite alternate ease-in-out;
        }
        .bot-arm-right {
            animation: armSwayRight 5s infinite alternate ease-in-out;
        }
        @keyframes armSwayLeft {
            0% { transform: rotate(-8deg); }
            100% { transform: rotate(18deg); }
        }
        @keyframes armSwayRight {
            0% { transform: rotate(-18deg); }
            100% { transform: rotate(8deg); }
        }
        
        /* Радісна реакція персонажа */
        #robot-char.happy .bot-eye {
            animation: none;
        }
        #robot-char.happy .eye-normal {
            display: none;
        }
        #robot-char.happy .eye-happy {
            display: block !important;
        }
        #robot-char.happy .bot-screen {
            stroke: #ff0077;
            box-shadow: 0 0 20px #ff0077;
        }
        #robot-char.happy {
            animation: happyJump 0.5s ease 3;
        }
        @keyframes happyJump {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-45px) scale(1.08); }
        }

        /* Робоча область */
        #workspace-wrapper {
            position: absolute;
            top: 55%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #workspace {
            position: relative;
            width: 1400px;
            height: 700px;
            z-index: 10;
            pointer-events: auto;
            transform-origin: center center;
            transition: transform 0.3s ease;
        }

        /* Батарея замість ящика */
        .crate {
            position: absolute;
            width: 220px;
            height: 120px;
            border-radius: 15px;
            transition: all 0.5s;
        }
        .crate.glow {
            animation: crateGlow 1.5s infinite alternate;
        }
        @keyframes crateGlow {
            0% { filter: drop-shadow(0 0 10px #00f3ff); transform: scale(1); }
            100% { filter: drop-shadow(0 0 40px #b829ff); transform: scale(1.03); }
        }

        /* Плазмова сфера замість яблука */
        .apple {
            position: absolute;
            width: 40px;
            height: 40px;
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
            pointer-events: none;
        }

        #interactive-zone {
            position: absolute;
            cursor: pointer;
            z-index: 50;
            display: none;
            border-radius: 20px;
            background: rgba(0, 243, 255, 0.05);
            border: 2px dashed #00f3ff;
            animation: pulseZone 2s infinite;
        }
        @keyframes pulseZone {
            0%, 100% { background: rgba(0, 243, 255, 0.05); box-shadow: 0 0 0px #00f3ff; }
            50% { background: rgba(0, 243, 255, 0.15); box-shadow: 0 0 15px #00f3ff; }
        }
        #interactive-zone:hover ~ #indicator {
            filter: drop-shadow(0 0 25px #ff00ea);
        }

        #indicator {
            position: absolute;
            width: 60px;
            height: 60px;
            pointer-events: none;
            z-index: 60;
            display: none;
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .particle {
            position: absolute;
            width: 25px;
            height: 25px;
            pointer-events: none;
            z-index: 100;
            transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Кнопки Лупи */
        .zoom-btn {
            position: absolute;
            left: 20px;
            width: 50px;
            height: 50px;
            background: rgba(10, 20, 40, 0.6);
            border: 2px solid #00f3ff;
            border-radius: 50%;
            color: #00f3ff;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px rgba(0,243,255,0.3);
        }
        .zoom-btn:hover { background: #00f3ff; color: #000; }
        #btn-zoom-in { bottom: 90px; }
        #btn-zoom-out { bottom: 30px; }

        /* Екран-заглушка */
        #block-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 9, 20, 0.95);
            color: #ff003c;
            font-size: 50px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            visibility: hidden;
            text-shadow: 0 0 20px #ff003c;
        }

        /* --- Theme Manager CSS --- */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #1a0b2e;
            color: #00f3ff;
            border: 2px solid #00f3ff;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 100000;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0,243,255,0.4);
        }
        #theme-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 20, 40, 0.95);
            padding: 20px;
            border: 2px solid #b829ff;
            border-radius: 15px;
            z-index: 100001;
            display: none;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(184, 41, 255, 0.5);
            color: white;
        }
        #theme-modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            color: #ff003c;
        }
        #theme-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
            padding-top: 10px;
        }
        .theme-card {
            position: relative;
            width: 100%;
            height: 80px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            overflow: hidden;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
        }
        .theme-card:hover { border-color: #00f3ff; box-shadow: 0 0 10px #00f3ff; }
        .theme-card span {
            background: rgba(0,0,0,0.8);
            color: #00f3ff;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
        }

        /* --- Global Draw Tool CSS --- */
        #global-draw-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 90000;
            pointer-events: none;
        }
        #toggle-draw-btn-global {
            position: fixed;
            bottom: 85px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #b829ff;
            color: white;
            border: 2px solid #fff;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 100000;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(184, 41, 255, 0.5);
        }
        #draw-panel-global {
            position: fixed;
            top: 120px; /* Трохи нижче щоб не перекривало панель керування відразу */
            right: 20px;
            background: rgba(10, 20, 40, 0.95);
            border: 2px solid #b829ff;
            border-radius: 10px;
            padding: 10px;
            display: none;
            z-index: 100001;
            box-shadow: 0 10px 30px rgba(184,41,255,0.5);
            width: 180px;
            cursor: default;
            color: #fff;
        }
        .draw-panel-header {
            width: 100%;
            height: 20px;
            background: #2a1542;
            border-radius: 5px;
            margin-bottom: 10px;
            cursor: grab;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 5px;
        }
        .draw-panel-header:active { cursor: grabbing; }
        .close-draw-btn { cursor: pointer; font-weight: bold; color: #ff003c; font-size: 16px; }
        .draw-btn-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .draw-btn {
            flex: 1; padding: 5px; border: 1px solid #00f3ff; border-radius: 5px; cursor: pointer; background: transparent; font-size: 14px; color: #00f3ff;
        }
        .draw-btn.active { background: #00f3ff; color: #000; }
        .draw-slider { width: 100%; margin-bottom: 10px; }
        .draw-color { width: 100%; height: 30px; border: none; cursor: pointer; margin-bottom: 10px; background: transparent; }
        .draw-clear { width: 100%; padding: 5px; background: #ff003c; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        @media (max-width: 768px) {
            #controls { right: 10px; top: 10px; transform: scale(0.7); transform-origin: top right; }
            #workspace { transform: scale(0.6); transform-origin: top center; }
            #robot-char { transform: scale(0.6); right: -10px; bottom: 60px; transform-origin: bottom right; }
        }
    </style>
</head>
<body>

    <!-- ВЕЛИКИЙ СЮЖЕТНИЙ SVG ФОН (КОСМІЧНА СТАНЦІЯ) -->
    <svg id="bg-canvas" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <defs>
            <radialGradient id="spaceBg" cx="50%" cy="50%" r="70%">
                <stop offset="0%" stop-color="#0e172e"/>
                <stop offset="60%" stop-color="#060914"/>
                <stop offset="100%" stop-color="#020308"/>
            </radialGradient>
            <radialGradient id="nebula1" cx="30%" cy="40%" r="40%">
                <stop offset="0%" stop-color="rgba(184, 41, 255, 0.4)"/>
                <stop offset="100%" stop-color="rgba(184, 41, 255, 0)"/>
            </radialGradient>
            <radialGradient id="nebula2" cx="80%" cy="60%" r="50%">
                <stop offset="0%" stop-color="rgba(0, 243, 255, 0.2)"/>
                <stop offset="100%" stop-color="rgba(0, 243, 255, 0)"/>
            </radialGradient>
            <linearGradient id="metalWall" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#121824"/>
                <stop offset="5%" stop-color="#212a3d"/>
                <stop offset="95%" stop-color="#1a2233"/>
                <stop offset="100%" stop-color="#0c111a"/>
            </linearGradient>
            <linearGradient id="windowFrame" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3b4a6b"/>
                <stop offset="50%" stop-color="#1b253b"/>
                <stop offset="100%" stop-color="#0e1424"/>
            </linearGradient>
        </defs>

        <!-- Відкритий космос -->
        <rect width="1920" height="1080" fill="url(#spaceBg)"/>
        <rect width="1920" height="1080" fill="url(#nebula1)"/>
        <rect width="1920" height="1080" fill="url(#nebula2)"/>
        
        <!-- Галактика -->
        <g class="galaxy-spin">
            <circle cx="1500" cy="400" r="300" fill="rgba(184, 41, 255, 0.1)" filter="blur(30px)"/>
            <path d="M1200 400 Q 1500 200 1800 400 Q 1500 600 1200 400" fill="none" stroke="#00f3ff" stroke-width="4" opacity="0.3" filter="blur(4px)"/>
            <path d="M1300 300 Q 1500 100 1700 500 Q 1500 700 1300 300" fill="none" stroke="#b829ff" stroke-width="6" opacity="0.4" filter="blur(6px)"/>
            <circle cx="1500" cy="400" r="15" fill="#fff" filter="blur(2px)"/>
        </g>

        <!-- Астероїди -->
        <g class="asteroid">
            <path d="M 400 200 Q 420 180 450 190 Q 480 200 470 230 Q 460 260 420 250 Q 380 240 400 200 Z" fill="#2a3040" opacity="0.8"/>
            <circle cx="430" cy="210" r="8" fill="#1b202e"/>
            <circle cx="450" cy="230" r="5" fill="#1b202e"/>
        </g>
        <g class="asteroid" style="animation-delay: -5s; animation-duration: 20s;">
            <path d="M 1200 700 Q 1230 680 1260 710 Q 1280 750 1240 760 Q 1200 770 1180 740 Z" fill="#1f2430" opacity="0.7"/>
            <circle cx="1230" cy="730" r="12" fill="#11141c"/>
        </g>

        <!-- Зірки -->
        <circle cx="200" cy="300" r="2" fill="#fff" opacity="0.8"/>
        <circle cx="800" cy="150" r="3" fill="#00f3ff" opacity="0.9"/>
        <circle cx="1600" cy="800" r="2" fill="#b829ff" opacity="0.8"/>
        <circle cx="500" cy="850" r="1.5" fill="#fff" opacity="0.6"/>
        <circle cx="1000" cy="500" r="2.5" fill="#00f3ff" opacity="0.7"/>

        <!-- Інтер'єр станції -->
        <path d="M0 0 L1920 0 L1920 1080 L0 1080 Z M 150 150 L 1770 150 L 1770 800 L 150 800 Z" fill="url(#metalWall)"/>
        <rect x="145" y="145" width="1630" height="660" fill="none" stroke="#00f3ff" stroke-width="10" rx="20" class="neon-line" opacity="0.5"/>
        <rect x="150" y="150" width="1620" height="650" fill="none" stroke="url(#windowFrame)" stroke-width="30" rx="15"/>
        
        <!-- Технічні панелі -->
        <rect x="0" y="900" width="1920" height="180" fill="#0e131f"/>
        <path d="M0 900 L 1920 900" stroke="#00f3ff" stroke-width="4" opacity="0.6"/>
        <path d="M0 905 L 1920 905" stroke="#b829ff" stroke-width="2" opacity="0.4"/>
        
        <rect x="0" y="0" width="1920" height="80" fill="#0a0e17"/>
        <path d="M0 80 L 1920 80" stroke="#00f3ff" stroke-width="3" opacity="0.5"/>

        <g transform="translate(50, 400)">
            <rect width="60" height="200" rx="5" fill="#05080f" stroke="#00f3ff" stroke-width="2"/>
            <rect x="10" y="10" width="40" height="10" fill="#00f3ff" class="neon-line"/>
            <rect x="10" y="30" width="40" height="10" fill="#00f3ff" class="neon-line" style="animation-delay: 0.5s"/>
            <rect x="10" y="50" width="40" height="10" fill="#ff003c" opacity="0.8"/>
            <rect x="10" y="170" width="40" height="20" fill="#b829ff" opacity="0.5"/>
        </g>
        <g transform="translate(1810, 300)">
            <rect width="60" height="300" rx="5" fill="#05080f" stroke="#b829ff" stroke-width="2"/>
            <circle cx="30" cy="40" r="15" fill="none" stroke="#00f3ff" stroke-width="4"/>
            <circle cx="30" cy="40" r="5" fill="#00f3ff" class="neon-line"/>
            <path d="M10 100 Q 30 70 50 100 Q 30 130 10 100" fill="none" stroke="#b829ff" stroke-width="3"/>
        </g>
    </svg>

    <!-- ЖИВИЙ ПЕРСОНАЖ -->
    <div id="robot-char">
        <!-- transform scaleX(-1) щоб робот дивився ліворуч на батареї -->
        <svg viewBox="0 0 200 350" width="100%" height="100%" style="transform: scaleX(-1);">
            <defs>
                <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <linearGradient id="eyeIris" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="35%" stop-color="#00f3ff"/>
                    <stop offset="100%" stop-color="#0066cc"/>
                </linearGradient>
            </defs>

            <!-- Двигун і плазмовий струмінь -->
            <path d="M 85 280 L 115 280 L 125 310 L 75 310 Z" fill="#303b4d"/>
            <path class="bot-thruster" d="M 82 310 Q 100 365 118 310 Z" fill="#00f3ff" filter="blur(4px)"/>
            <path class="bot-thruster" d="M 92 310 Q 100 340 108 310 Z" fill="#ffffff"/>
            
            <!-- РУКИ під тілом, щоб суглоби ховалися за корпусом і не відривалися -->
            <g class="bot-arm-left" style="transform-origin: 60px 210px;">
                <circle cx="60" cy="210" r="10" fill="#d3dce6"/> <!-- прихований шарнір -->
                <path d="M 60 210 Q 20 230 30 270" fill="none" stroke="#d3dce6" stroke-width="12" stroke-linecap="round"/>
                <circle cx="30" cy="270" r="10" fill="#00f3ff" stroke="#fff" stroke-width="2"/>
            </g>
            <g class="bot-arm-right" style="transform-origin: 140px 210px; animation-delay: -2.5s;">
                <circle cx="140" cy="210" r="10" fill="#d3dce6"/> <!-- прихований шарнір -->
                <path d="M 140 210 Q 180 230 170 270" fill="none" stroke="#d3dce6" stroke-width="12" stroke-linecap="round"/>
                <circle cx="170" cy="270" r="10" fill="#00f3ff" stroke="#fff" stroke-width="2"/>
            </g>

            <!-- Тіло робота (перекриває шарніри рук) -->
            <rect x="60" y="180" width="80" height="100" rx="30" fill="#f0f4f8" stroke="#7b8eab" stroke-width="2"/>
            <rect x="70" y="190" width="60" height="80" rx="20" fill="#1b2433"/>
            <!-- Енергетичне серце в грудях -->
            <circle cx="100" cy="230" r="16" fill="#00f3ff" filter="drop-shadow(0 0 8px #00f3ff)" class="neon-line"/>
            
            <!-- Шия -->
            <rect x="90" y="158" width="20" height="30" fill="#506177"/>
            <line x1="90" y1="168" x2="110" y2="168" stroke="#1b2433" stroke-width="3"/>
            <line x1="90" y1="176" x2="110" y2="176" stroke="#1b2433" stroke-width="3"/>

            <!-- Голова (Шолом) -->
            <rect x="36" y="46" width="128" height="124" rx="42" fill="#f0f4f8" stroke="#7b8eab" stroke-width="3"/>
            
            <!-- Глибокий чорний глянцевий екран (OLED) -->
            <rect class="bot-screen" x="52" y="66" width="96" height="84" rx="28" fill="#02050c" stroke="#00f3ff" stroke-width="3"/>
            <!-- Глянцевий відблиск на склі екрана -->
            <path d="M 56 80 Q 100 68 144 80 Q 130 92 56 80 Z" fill="#ffffff" opacity="0.12"/>
            
            <!-- ВИСОКОКОНТРАСТНІ ОЧІ -->
            <g class="bot-eye">
                <!-- Звичайний стан очей -->
                <g class="eye-normal">
                    <g filter="url(#eyeGlow)">
                        <ellipse cx="80" cy="108" rx="14" ry="18" fill="url(#eyeIris)" stroke="#ffffff" stroke-width="2"/>
                        <ellipse cx="78" cy="108" rx="7" ry="10" fill="#020a17"/>
                        <circle cx="75" cy="101" r="4.5" fill="#ffffff"/>
                        <circle cx="83" cy="114" r="2" fill="#ffffff"/>
                    </g>
                    <g filter="url(#eyeGlow)">
                        <ellipse cx="120" cy="108" rx="14" ry="18" fill="url(#eyeIris)" stroke="#ffffff" stroke-width="2"/>
                        <ellipse cx="118" cy="108" rx="7" ry="10" fill="#020a17"/>
                        <circle cx="115" cy="101" r="4.5" fill="#ffffff"/>
                        <circle cx="123" cy="114" r="2" fill="#ffffff"/>
                    </g>
                </g>
                <!-- Щасливий стан очей (сердечка) -->
                <g class="eye-happy" style="display: none;" filter="url(#eyeGlow)">
                    <path d="M 80 116 Q 70 100 70 92 A 7 7 0 0 1 80 96 A 7 7 0 0 1 90 92 Q 90 100 80 116 Z" fill="#ff0077" stroke="#ffffff" stroke-width="2"/>
                    <circle cx="77" cy="94" r="2.5" fill="#ffffff"/>
                    <path d="M 120 116 Q 110 100 110 92 A 7 7 0 0 1 120 96 A 7 7 0 0 1 130 92 Q 130 100 120 116 Z" fill="#ff0077" stroke="#ffffff" stroke-width="2"/>
                    <circle cx="117" cy="94" r="2.5" fill="#ffffff"/>
                </g>
            </g>

            <!-- Антена зв'язку -->
            <line x1="100" y1="46" x2="100" y2="15" stroke="#506177" stroke-width="4"/>
            <circle cx="100" cy="12" r="8" fill="#ff003c" class="neon-line"/>
        </svg>
    </div>

    <!-- ВЕРХНЯ ПАНЕЛЬ КЕРУВАННЯ -->
    <div id="controls">
        <input type="number" id="valA" value="18" min="1" max="89">
        <span class="math-sign">+</span>
        <input type="number" id="valB" value="8" min="1" max="19">
        <button id="btn-play">
            <svg viewBox="0 0 24 24" width="35" height="35">
                <path d="M8 5v14l11-7z" fill="#ffffff" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.5))"/>
            </svg>
        </button>
    </div>

    <!-- Лупа для масштабування -->
    <button id="btn-zoom-in" class="zoom-btn">🔍+</button>
    <button id="btn-zoom-out" class="zoom-btn">🔍-</button>

    <div id="workspace-wrapper">
        <div id="workspace">
            <div id="interactive-zone"></div>
            <div id="indicator">
                <svg viewBox="0 0 24 24" width="100%" height="100%">
                    <path d="M12 2L4 10h4v12h8V10h4L12 2z" fill="#b829ff" filter="drop-shadow(0 0 10px #00f3ff)" transform="rotate(180 12 12)"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- Theme Manager UI -->
    <button id="theme-btn">⚙️</button>
    <div id="theme-modal">
        <div id="theme-modal-close">✕</div>
        <h3 style="margin-top:0; text-align:center;">Оберіть фон</h3>
        <div id="theme-gallery">
            <div class="theme-card" onclick="selectTheme('none')" style="background: #1a2233;">
                <span>Без фону</span>
            </div>
        </div>
    </div>

    <!-- Global Draw Tool -->
    <canvas id="global-draw-canvas"></canvas>
    <button id="toggle-draw-btn-global">✏️</button>
    <div id="draw-panel-global">
        <div class="draw-panel-header" id="draw-panel-header">
            <div class="close-draw-btn" id="close-draw-btn">✕</div>
        </div>
        <div class="draw-btn-group">
            <button class="draw-btn active" id="tool-pencil">✏️ Олівець</button>
            <button class="draw-btn" id="tool-eraser">🧽 Гумка</button>
        </div>
        <input type="range" class="draw-slider" id="draw-size" min="1" max="50" value="5">
        <input type="color" class="draw-color" id="draw-color" value="#00f3ff">
        <button class="draw-clear" id="draw-clear">🗑️ Очистити</button>
    </div>

    <!-- Екран-заглушка -->
    <div id="block-overlay">СИСТЕМУ ЗАБЛОКОВАНО! ЗАЧЕКАЙ СВОГО УРОКУ.</div>

    <script>
        // ==========================================
        // 1. КОНФІГУРАЦІЯ ТА ІДЕНТИФІКАЦІЯ
        // ==========================================
        const CONFIG = { gameId: 'add_over_ten_v1' };
        
        let myName = new URLSearchParams(window.location.search).get('user');
        if (myName) {
            sessionStorage.setItem('userName', myName);
        } else {
            myName = sessionStorage.getItem('userName');
            if (!myName) {
                myName = 'Космонавт_' + Math.floor(Math.random() * 1000);
                sessionStorage.setItem('userName', myName);
            }
        }
        
        const tabId = Math.random().toString(36).substr(2, 9);
        let currentScale = 1;

        // Firebase Init
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
            projectId: "lesson-13c44"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function sendGameAction(actionData) {
            db.ref('game_action').set({
                senderId: tabId,
                timestamp: Date.now(),
                ...actionData
            });
        }

        // ==========================================
        // 2. РАДАР, БЛОКУВАННЯ ТА ЛОБІ
        // ==========================================
        const userRef = db.ref(`online_users/${myName}/${tabId}`);
        db.ref('.info/connected').on('value', snap => {
            if (snap.val() === true) {
                userRef.set(true);
                userRef.onDisconnect().remove();
            }
        });
        window.addEventListener('beforeunload', () => userRef.remove());

        db.ref(`blocked_users/${myName}`).on('value', snap => {
            document.getElementById('block-overlay').style.visibility = snap.val() ? 'visible' : 'hidden';
        });

        let isInitialRefreshLoad = true;
        db.ref('force_refresh').on('value', snap => {
            if (isInitialRefreshLoad) {
                isInitialRefreshLoad = false;
                return;
            }
            if (snap.val() === true) {
                window.location.reload();
            }
        });

        setTimeout(() => {
            db.ref('current_activity').on('value', snap => {
                if (snap.val() === 'lobby') {
                    window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
                }
            });
        }, 1000);

        // ==========================================
        // 3. СИСТЕМА ДИНАМІЧНИХ ФОНІВ (THEME MANAGER)
        // ==========================================
        const themeBtn = document.getElementById('theme-btn');
        const themeModal = document.getElementById('theme-modal');
        const themeGallery = document.getElementById('theme-gallery');
        const bgCanvas = document.getElementById('bg-canvas');

        themeBtn.onclick = () => themeModal.style.display = 'block';
        document.getElementById('theme-modal-close').onclick = () => themeModal.style.display = 'none';

        function applyTheme(url) {
            if (url === 'none') {
                document.body.style.backgroundImage = 'none';
                bgCanvas.style.display = 'block';
            } else {
                document.body.style.backgroundImage = `url(${url})`;
                bgCanvas.style.display = 'none';
            }
        }

        const savedBg = localStorage.getItem('mySavedBg_' + CONFIG.gameId);
        if (savedBg) applyTheme(savedBg);

        window.selectTheme = function(url) {
            localStorage.setItem('mySavedBg_' + CONFIG.gameId, url);
            applyTheme(url);
            db.ref('game_theme').set(url);
        };

        db.ref('game_theme').on('value', snap => {
            const url = snap.val();
            if (url) {
                localStorage.setItem('mySavedBg_' + CONFIG.gameId, url);
                applyTheme(url);
            }
        });

        async function loadBackgrounds() {
            let i = 1;
            while(true) {
                const url = `https://olgazheltvai2.github.io/images/backgrounds/background_${i}.webp`;
                try {
                    const response = await fetch(url, { method: 'HEAD' });
                    if (!response.ok) break;

                    const card = document.createElement('div');
                    card.className = 'theme-card';
                    card.style.backgroundImage = `url(${url})`;
                    card.onclick = () => selectTheme(url);
                    
                    const span = document.createElement('span');
                    span.innerText = `Фон ${i}`;
                    card.appendChild(span);
                    
                    themeGallery.appendChild(card);
                    i++;
                } catch (e) {
                    break;
                }
            }
        }
        loadBackgrounds();

        // ==========================================
        // 4. ГЛОБАЛЬНИЙ ІНСТРУМЕНТ МАЛЮВАННЯ
        // ==========================================
        const drawCanvas = document.getElementById('global-draw-canvas');
        const ctxDraw = drawCanvas.getContext('2d');
        const toggleDrawBtn = document.getElementById('toggle-draw-btn-global');
        const drawPanel = document.getElementById('draw-panel-global');
        
        let isDrawingMode = false;
        let isDrawing = false;
        let currentTool = 'pencil';
        let lastX = 0, lastY = 0;

        function resizeCanvas() {
            drawCanvas.width = window.innerWidth;
            drawCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        toggleDrawBtn.onclick = () => {
            drawPanel.style.display = 'block';
            isDrawingMode = true;
            drawCanvas.style.pointerEvents = 'auto';
            
            currentTool = 'pencil';
            document.getElementById('tool-pencil').classList.add('active');
            document.getElementById('tool-eraser').classList.remove('active');
        };

        document.getElementById('close-draw-btn').onclick = () => {
            drawPanel.style.display = 'none';
            isDrawingMode = false;
            drawCanvas.style.pointerEvents = 'none';
        };

        document.getElementById('tool-pencil').onclick = function() {
            currentTool = 'pencil';
            this.classList.add('active');
            document.getElementById('tool-eraser').classList.remove('active');
        };
        document.getElementById('tool-eraser').onclick = function() {
            currentTool = 'eraser';
            this.classList.add('active');
            document.getElementById('tool-pencil').classList.remove('active');
        };
        
        document.getElementById('draw-clear').onclick = () => {
            ctxDraw.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            sendGameAction({ type: 'clear_canvas' });
        };

        function drawLine(x0, y0, x1, y1, tool, size, color, emit) {
            ctxDraw.beginPath();
            ctxDraw.moveTo(x0, y0);
            ctxDraw.lineTo(x1, y1);
            ctxDraw.lineCap = 'round';
            ctxDraw.lineWidth = size;
            ctxDraw.strokeStyle = tool === 'eraser' ? 'rgba(0,0,0,1)' : color;
            if (tool === 'eraser') ctxDraw.globalCompositeOperation = 'destination-out';
            else {
                ctxDraw.globalCompositeOperation = 'source-over';
                ctxDraw.shadowBlur = 10;
                ctxDraw.shadowColor = color;
            }
            ctxDraw.stroke();
            ctxDraw.closePath();
            ctxDraw.shadowBlur = 0;

            if (emit) {
                sendGameAction({
                    type: 'draw_line',
                    x0: x0 / drawCanvas.width, y0: y0 / drawCanvas.height,
                    x1: x1 / drawCanvas.width, y1: y1 / drawCanvas.height,
                    tool, size, color
                });
            }
        }

        function getMousePos(e) {
            const rect = drawCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        drawCanvas.addEventListener('mousedown', (e) => {
            if (!isDrawingMode) return;
            isDrawing = true;
            const pos = getMousePos(e);
            lastX = pos.x; lastY = pos.y;
        });
        drawCanvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || !isDrawingMode) return;
            const pos = getMousePos(e);
            const size = document.getElementById('draw-size').value;
            const color = document.getElementById('draw-color').value;
            drawLine(lastX, lastY, pos.x, pos.y, currentTool, size, color, true);
            lastX = pos.x; lastY = pos.y;
        });
        drawCanvas.addEventListener('mouseup', () => isDrawing = false);
        drawCanvas.addEventListener('mouseout', () => isDrawing = false);
        
        drawCanvas.addEventListener('touchstart', (e) => {
            if (!isDrawingMode) return;
            isDrawing = true;
            const pos = getMousePos(e);
            lastX = pos.x; lastY = pos.y;
        }, {passive: false});
        drawCanvas.addEventListener('touchmove', (e) => {
            if (!isDrawing || !isDrawingMode) return;
            e.preventDefault();
            const pos = getMousePos(e);
            const size = document.getElementById('draw-size').value;
            const color = document.getElementById('draw-color').value;
            drawLine(lastX, lastY, pos.x, pos.y, currentTool, size, color, true);
            lastX = pos.x; lastY = pos.y;
        }, {passive: false});
        drawCanvas.addEventListener('touchend', () => isDrawing = false);

        const header = document.getElementById('draw-panel-header');
        let isDraggingPanel = false, panOffsetX, panOffsetY;
        
        header.onmousedown = (e) => { 
            isDraggingPanel = true; 
            panOffsetX = e.clientX - drawPanel.offsetLeft; 
            panOffsetY = e.clientY - drawPanel.offsetTop; 
        };
        
        document.onmousemove = (e) => { 
            if(isDraggingPanel) { 
                let newLeft = e.clientX - panOffsetX;
                let newTop = e.clientY - panOffsetY;
                
                // Математичні обмеження - плашка не виходить за екран
                const maxLeft = window.innerWidth - drawPanel.offsetWidth;
                const maxTop = window.innerHeight - drawPanel.offsetHeight;
                
                newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                newTop = Math.max(0, Math.min(newTop, maxTop));
                
                drawPanel.style.left = newLeft + 'px'; 
                drawPanel.style.top = newTop + 'px'; 
                drawPanel.style.right = 'auto'; 
            }
        };
        document.onmouseup = () => isDraggingPanel = false;

        // Синхронізація дій
        db.ref('game_action').on('value', snap => {
            const data = snap.val();
            if (!data || data.senderId === tabId) return; 

            if (data.type === 'draw_line') {
                const w = drawCanvas.width, h = drawCanvas.height;
                drawLine(data.x0 * w, data.y0 * h, data.x1 * w, data.y1 * h, data.tool, data.size, data.color, false);
            } else if (data.type === 'clear_canvas') {
                ctxDraw.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            } else if (data.type === 'play_game') {
                document.getElementById('valA').value = data.valA;
                document.getElementById('valB').value = data.valB;
                startGameLocal();
            } else if (data.type === 'split_apples') {
                splitApplesLocal();
            } else if (data.type === 'fly_apples') {
                flyApplesLocal();
            }
        });

        // ==========================================
        // 5. МАСШТАБУВАННЯ (ЛУПА)
        // ==========================================
        const ws = document.getElementById('workspace');
        document.getElementById('btn-zoom-in').onclick = () => { currentScale += 0.1; ws.style.transform = `scale(${currentScale})`; };
        document.getElementById('btn-zoom-out').onclick = () => { currentScale = Math.max(0.3, currentScale - 0.1); ws.style.transform = `scale(${currentScale})`; };

        // ==========================================
        // 6. ІГРОВА ЛОГІКА
        // ==========================================
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type, duration, vol=0.1) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playSound(type) {
            initAudio();
            if (type === 'split') {
                playTone(800, 'square', 0.1, 0.1);
                setTimeout(() => playTone(1200, 'square', 0.1, 0.1), 100);
            } else if (type === 'fly') {
                if(!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } else if (type === 'success') {
                playTone(523.25, 'triangle', 0.2, 0.1);
                setTimeout(() => playTone(659.25, 'triangle', 0.2, 0.1), 100);
                setTimeout(() => playTone(783.99, 'triangle', 0.2, 0.15), 200);
                setTimeout(() => playTone(1046.50, 'triangle', 0.6, 0.2), 350);
            } else if (type === 'pop') {
                playTone(600 + Math.random()*300, 'sine', 0.1, 0.05);
            }
        }

        // Енергетична батарея
        const svgCrate = `
            <svg viewBox="0 0 220 120" width="100%" height="100%">
                <defs>
                    <linearGradient id="batteryGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#2a3345"/><stop offset="100%" stop-color="#0f141f"/>
                    </linearGradient>
                </defs>
                <rect x="5" y="5" width="210" height="110" rx="15" fill="url(#batteryGrad)" stroke="#00f3ff" stroke-width="4"/>
                <path d="M5 25 L 215 25 M 5 95 L 215 95" stroke="#00f3ff" stroke-width="2" opacity="0.3"/>
                ${(() => {
                    let holes = '';
                    for(let r=0; r<2; r++) {
                        for(let c=0; c<5; c++) {
                            holes += `<circle cx="${30 + c*40}" cy="${35 + r*50}" r="16" fill="#04060a" stroke="#1f2c42" stroke-width="2"/>`;
                            holes += `<circle cx="${30 + c*40}" cy="${35 + r*50}" r="18" fill="none" stroke="#00f3ff" stroke-width="1" opacity="0.2"/>`;
                        }
                    }
                    return holes;
                })()}
                <rect x="200" y="45" width="5" height="30" rx="2" fill="#ff003c" opacity="0.8"/>
            </svg>
        `;

        // Неонова плазмова сфера
        const svgApple = `
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <defs>
                    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#fff"/>
                        <stop offset="30%" stop-color="#00f3ff"/>
                        <stop offset="80%" stop-color="#b829ff"/>
                        <stop offset="100%" stop-color="rgba(184, 41, 255, 0)"/>
                    </radialGradient>
                </defs>
                <circle cx="50" cy="50" r="45" fill="url(#orbGlow)"/>
                <circle cx="50" cy="50" r="20" fill="#fff" filter="blur(4px)"/>
                <circle cx="50" cy="50" r="8" fill="#fff"/>
                <ellipse cx="50" cy="50" rx="35" ry="10" fill="none" stroke="#00f3ff" stroke-width="2" transform="rotate(45 50 50)"/>
                <ellipse cx="50" cy="50" rx="35" ry="10" fill="none" stroke="#b829ff" stroke-width="2" transform="rotate(-45 50 50)"/>
            </svg>
        `;

        // Цифрова іскра
        const svgStar = `
            <svg viewBox="0 0 24 24" width="100%" height="100%">
                <path d="M12 0 L 14 10 L 24 12 L 14 14 L 12 24 L 10 14 L 0 12 L 10 10 Z" fill="#00f3ff" filter="drop-shadow(0 0 8px #b829ff)"/>
            </svg>
        `;

        let gameState = 0;
        let valA, valB, neededToTen;
        let rightApples = [];
        let emptySlotCoords = []; 
        let partialCrateEl = null;
        let rightStartX = 500; 
        let partialCrateX = 0, partialCrateY = 0;

        const clickZone = document.getElementById('interactive-zone');
        const indicator = document.getElementById('indicator');

        function createCrate(x, y) {
            const el = document.createElement('div');
            el.className = 'crate';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.innerHTML = svgCrate;
            ws.appendChild(el);
            return el;
        }

        function createApple(x, y, delay = 0) {
            const el = document.createElement('div');
            el.className = 'apple';
            el.style.left = x + 'px';
            el.style.top = (y - 100) + 'px';
            el.style.opacity = '0';
            el.innerHTML = svgApple;
            ws.appendChild(el);
            setTimeout(() => { el.style.top = y + 'px'; el.style.opacity = '1'; playSound('pop'); }, delay);
            return el;
        }

        function spawnParticles(cx, cy) {
            for(let i=0; i<20; i++) {
                let star = document.createElement('div');
                star.className = 'particle';
                star.innerHTML = svgStar;
                star.style.left = cx + 'px';
                star.style.top = cy + 'px';
                ws.appendChild(star);
                setTimeout(() => {
                    let angle = Math.random() * Math.PI * 2;
                    let dist = 80 + Math.random() * 100;
                    star.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(${Math.random()*1.5}) rotate(${Math.random()*360}deg)`;
                    star.style.opacity = '0';
                }, 10);
                setTimeout(() => star.remove(), 1200);
            }
        }

        document.getElementById('btn-play').addEventListener('click', () => {
            valA = parseInt(document.getElementById('valA').value);
            valB = parseInt(document.getElementById('valB').value);
            if (isNaN(valA) || isNaN(valB) || valA < 1 || valB < 1) return;
            
            sendGameAction({ type: 'play_game', valA, valB });
            startGameLocal();
        });

        function startGameLocal() {
            initAudio();
            valA = parseInt(document.getElementById('valA').value);
            valB = parseInt(document.getElementById('valB').value);
            
            ws.innerHTML = '';
            ws.appendChild(clickZone);
            ws.appendChild(indicator);
            rightApples = [];
            emptySlotCoords = [];
            partialCrateEl = null;

            // Скидаємо емоцію персонажа
            document.getElementById('robot-char').classList.remove('happy');

            let tensA = Math.floor(valA / 10);
            let onesA = valA % 10;
            neededToTen = onesA > 0 ? 10 - onesA : 0;
            if (neededToTen === 0) neededToTen = 10; 

            let currentCrateX = 20;
            let currentCrateY = 20;
            let delayCounter = 0;

            const CRATE_WIDTH = 220, CRATE_HEIGHT = 120;

            for (let i = 0; i < tensA; i++) {
                createCrate(currentCrateX, currentCrateY);
                for(let r=0; r<2; r++) {
                    for(let c=0; c<5; c++) {
                        let ax = currentCrateX + 10 + c*40; 
                        let ay = currentCrateY + 15 + r*50;
                        createApple(ax, ay, delayCounter);
                        delayCounter += 30;
                    }
                }
                currentCrateY += CRATE_HEIGHT + 20;
                if (currentCrateY > 400) { 
                    currentCrateY = 20;
                    currentCrateX += CRATE_WIDTH + 20;
                }
            }

            partialCrateX = currentCrateX;
            partialCrateY = currentCrateY;
            partialCrateEl = createCrate(currentCrateX, currentCrateY);
            
            let slotIndex = 0;
            for(let r=0; r<2; r++) {
                for(let c=0; c<5; c++) {
                    let ax = currentCrateX + 10 + c*40; 
                    let ay = currentCrateY + 15 + r*50;
                    if (slotIndex < onesA) {
                        createApple(ax, ay, delayCounter);
                    } else {
                        emptySlotCoords.push({x: ax, y: ay});
                    }
                    slotIndex++;
                    delayCounter += 20;
                }
            }

            rightStartX = currentCrateX + CRATE_WIDTH + 80;

            for(let i = 0; i < valB; i++) {
                let col = i % 4;
                let row = Math.floor(i / 4);
                let ax = rightStartX + col * 55;
                let ay = 100 + row * 55;
                
                let app = createApple(ax, ay, delayCounter);
                rightApples.push(app);
                delayCounter += 40;
            }

            gameState = 1;
            
            setTimeout(() => {
                clickZone.style.display = 'block';
                clickZone.style.left = (rightStartX - 50) + 'px';
                clickZone.style.top = '50px';
                clickZone.style.width = '350px';
                clickZone.style.height = '350px';
                
                indicator.style.display = 'block';
                indicator.style.left = (rightStartX + 100) + 'px';
                indicator.style.top = '40px';
            }, delayCounter + 200);
        }

        clickZone.addEventListener('click', () => {
            if (gameState === 1) {
                sendGameAction({ type: 'split_apples' });
                splitApplesLocal();
            } else if (gameState === 2) {
                sendGameAction({ type: 'fly_apples' });
                flyApplesLocal();
            }
        });

        function splitApplesLocal() {
            initAudio();
            let amountToFly = Math.min(valB, neededToTen);
            
            if (gameState === 1) {
                playSound('split');
                
                let flyStartX = partialCrateX + 220 + 50;
                let flyStartY = partialCrateY;
                
                let remStartX = flyStartX;
                let remStartY = flyStartY + 140; 
                
                if (remStartY > 500) {
                    remStartY = flyStartY;
                    remStartX = flyStartX + 160;
                }

                for(let i=0; i < valB; i++) {
                    let app = rightApples[i];
                    if (i < amountToFly) {
                        let col = i % 3;
                        let row = Math.floor(i / 3);
                        app.style.left = (flyStartX + col * 45) + 'px';
                        app.style.top = (flyStartY + row * 45) + 'px';
                    } else {
                        let idx = i - amountToFly;
                        let col = idx % 3;
                        let row = Math.floor(idx / 3);
                        app.style.left = (remStartX + col * 45) + 'px';
                        app.style.top = (remStartY + row * 45) + 'px';
                    }
                }
                
                gameState = 2; 
                
                clickZone.style.display = 'block';
                clickZone.style.left = (flyStartX - 50) + 'px';
                clickZone.style.top = (flyStartY - 50) + 'px';
                clickZone.style.width = '300px';
                clickZone.style.height = '300px';
                
                indicator.style.display = 'block';
                indicator.style.left = (flyStartX + 15) + 'px';
                indicator.style.top = (flyStartY - 60) + 'px';
            }
        }

        function flyApplesLocal() {
            if (gameState !== 2) return;
            
            let amountToFly = Math.min(valB, neededToTen);
            playSound('fly');
            clickZone.style.display = 'none';
            indicator.style.display = 'none';
            
            for(let i=0; i < amountToFly; i++) {
                let app = rightApples[i];
                let target = emptySlotCoords[i];
                setTimeout(() => {
                    app.style.left = target.x + 'px';
                    app.style.top = target.y + 'px';
                }, i * 150);
            }

            let totalFlyTime = (amountToFly - 1) * 150 + 1200;
            setTimeout(() => {
                if (amountToFly === neededToTen) {
                    playSound('success');
                    partialCrateEl.classList.add('glow');
                    let rect = partialCrateEl.getBoundingClientRect();
                    let wsRect = ws.getBoundingClientRect();
                    let cx = (rect.left - wsRect.left) + 110; 
                    let cy = (rect.top - wsRect.top) + 60; 
                    spawnParticles(cx, cy);
                    
                    // Реакція робота: радість та зміна очей на серця
                    const robot = document.getElementById('robot-char');
                    robot.classList.add('happy');
                }
            }, totalFlyTime);

            gameState = 3;
        }
    </script>
</body>
</html>
