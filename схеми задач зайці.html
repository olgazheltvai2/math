<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Bunnies Schema</title>
    <style>
        /* Основні налаштування стилю для пропорції 16:9 */
        body {
            margin: 0;
            padding: 0;
            background-color: #1e3a29;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            max-width: 177.78vh; /* Співвідношення 16:9 */
            height: 56.25vw;
            max-height: 100vh;
            background: linear-gradient(180deg, #4facfe 0%, #00f2fe 40%, #76b852 40%, #8DC26F 100%);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border-radius: 15px;
        }

        /* Деталізований векторний фон (не розмитий) */
        .bg-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Сцена для зайців */
        #stage {
            position: absolute;
            bottom: 15%;
            width: 100%;
            height: 30%;
            z-index: 10;
            display: flex;
            align-items: flex-end;
        }

        .bunny-wrapper {
            position: absolute;
            bottom: 0;
            width: 8%;
            transition: left 1s ease-in-out, opacity 0.5s;
            transform-origin: bottom center;
        }

        /* Анімації руху та стрибків */
        @keyframes hop {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30%) scale(0.9, 1.1); }
        }

        @keyframes dance {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20%) rotate(-10deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-20%) rotate(10deg); }
        }

        .hopping {
            animation: hop 0.4s infinite alternate;
        }

        .dancing {
            animation: dance 0.6s infinite;
        }

        /* Інтерфейс схеми та введення */
        #ui-layer {
            position: absolute;
            top: 3%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #schema-board {
            background: radial-gradient(circle, #f9d976 0%, #e9b646 100%);
            padding: 15px 30px;
            border-radius: 30px;
            border: 6px solid #8b5a2b;
            box-shadow: inset 0 0 15px rgba(139, 90, 43, 0.6), 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #schema-display {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 5px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Стилізація інпутів без білих прямокутників */
        input[type="number"], .sign-toggle {
            width: 4vw;
            height: 4vw;
            min-width: 40px;
            min-height: 40px;
            font-size: 2.5vw;
            font-weight: bold;
            text-align: center;
            border: 4px solid #5a3a1a;
            border-radius: 15px;
            background: linear-gradient(135deg, #ffb347 0%, #ff7b00 100%);
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            box-shadow: inset 0 3px 5px rgba(255,255,255,0.4), 0 5px 10px rgba(0,0,0,0.3);
            outline: none;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            appearance: none;
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            transform: scale(1.1);
            filter: brightness(1.2);
            border-color: #ffd700;
        }

        .sign-toggle {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            user-select: none;
        }

        .equals-sign {
            font-size: 3vw;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        /* Мінімалістичні кнопки навігації */
        .nav-container {
            position: absolute;
            bottom: 5%;
            right: 5%;
            display: flex;
            gap: 15px;
            z-index: 30;
        }

        .nav-btn {
            width: 4vw;
            height: 4vw;
            min-width: 50px;
            min-height: 50px;
            border-radius: 50%;
            border: 4px solid #006a5a;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            font-size: 2vw;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.4), inset 0 4px 6px rgba(255,255,255,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .nav-btn:hover {
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 12px 20px rgba(0,0,0,0.5), inset 0 4px 6px rgba(255,255,255,0.6);
        }

        .nav-btn:active {
            transform: translateY(2px) scale(0.95);
        }
    </style>
<style id="canvas-click-fix">canvas#draw-canvas { pointer-events: none !important; } .drawing-active canvas#draw-canvas { pointer-events: auto !important; }</style></head>
<body>

<div id="game-container">
    <!-- Сюжетний фон у векторі. Сонце та нижня хмара підняті вище. Хмари пливуть. -->
    <svg class="bg-layer" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMax slice">
        <defs>
            <radialGradient id="sun" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#fff5a0"/>
                <stop offset="50%" stop-color="#ffd500"/>
                <stop offset="100%" stop-color="#ff8c00" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#8DC26F"/>
                <stop offset="100%" stop-color="#387a22"/>
            </linearGradient>
        </defs>
        <!-- Сонце (піднято) -->
        <circle cx="850" cy="50" r="120" fill="url(#sun)" />
        
        <!-- Хмари (пливуть по небу) -->
        <path d="M 150 120 Q 170 90 200 120 Q 230 100 250 130 Q 270 160 220 160 L 170 160 Q 130 160 150 120 Z" fill="rgba(255,255,255,0.8)">
            <animateTransform attributeName="transform" type="translate" from="-400 0" to="1100 0" dur="45s" repeatCount="indefinite" />
        </path>
        <path d="M 650 100 Q 670 70 700 100 Q 730 80 750 110 Q 770 140 720 140 L 670 140 Q 630 140 650 100 Z" fill="rgba(255,255,255,0.6)">
            <animateTransform attributeName="transform" type="translate" from="-900 0" to="500 0" dur="35s" repeatCount="indefinite" />
        </path>
        
        <!-- Дальні пагорби та трава -->
        <path d="M 0 350 Q 250 250 500 350 T 1000 350 L 1000 500 L 0 500 Z" fill="#66a84f" />
        <path d="M 0 380 Q 300 300 600 380 T 1000 380 L 1000 500 L 0 500 Z" fill="url(#grass)" />
        
        <!-- Квіти на галявині -->
        <g transform="translate(150, 420) scale(0.5)">
            <circle cx="0" cy="0" r="10" fill="#ffeb3b"/>
            <circle cx="-12" cy="-12" r="8" fill="#e91e63"/><circle cx="12" cy="-12" r="8" fill="#e91e63"/>
            <circle cx="-12" cy="12" r="8" fill="#e91e63"/><circle cx="12" cy="12" r="8" fill="#e91e63"/>
        </g>
        <g transform="translate(800, 450) scale(0.6)">
            <circle cx="0" cy="0" r="10" fill="#ffeb3b"/>
            <circle cx="-12" cy="-12" r="8" fill="#9c27b0"/><circle cx="12" cy="-12" r="8" fill="#9c27b0"/>
            <circle cx="-12" cy="12" r="8" fill="#9c27b0"/><circle cx="12" cy="12" r="8" fill="#9c27b0"/>
        </g>
    </svg>

    <!-- Сцена для анімації -->
    <div id="stage"></div>

    <!-- UI: Схема задачі та поля для введення прикладу -->
    <div id="ui-layer">
        <div id="schema-board">
            <!-- Графічна схема генерується динамічно -->
            <div id="schema-display"></div>
            <div class="input-group">
                <input type="number" id="inp-a" min="0" max="10">
                <div class="sign-toggle" id="inp-sign">+</div>
                <input type="number" id="inp-b" min="0" max="10">
                <span class="equals-sign">=</span>
                <input type="number" id="inp-c" min="0" max="20">
            </div>
        </div>
    </div>

    <!-- Мінімалістична кнопка навігації (тільки вперед) -->
    <div class="nav-container">
        <button id="btn-next" class="nav-btn">➔</button>
    </div>

</div>

<script>
    // Аудіо контекст для генерації звуків 
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playTone(freq, type, duration, vol=0.5, slideFreq=null) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if(slideFreq) {
            osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
        }
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // Звуки
    function soundHop() { playTone(400, 'sine', 0.15, 0.3, 600); }
    function soundPop() { playTone(600, 'square', 0.1, 0.2, 800); }
    function soundSuccess() {
        playTone(440, 'triangle', 0.2, 0.4);
        setTimeout(() => playTone(554, 'triangle', 0.2, 0.4), 150);
        setTimeout(() => playTone(659, 'triangle', 0.4, 0.4), 300);
        setTimeout(() => playTone(880, 'triangle', 0.6, 0.5), 450);
    }
    function soundError() { playTone(150, 'sawtooth', 0.3, 0.5, 100); }

    // Деталізований SVG зайця
    const bunnySVG = `
    <svg viewBox="0 0 100 120" style="width: 100%; height: 100%; filter: drop-shadow(2px 5px 3px rgba(0,0,0,0.3));">
        <defs>
            <radialGradient id="fur" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="80%" stop-color="#e0e0e0"/>
                <stop offset="100%" stop-color="#c0c0c0"/>
            </radialGradient>
            <linearGradient id="earInner" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffb6c1"/>
                <stop offset="100%" stop-color="#ff69b4"/>
            </linearGradient>
        </defs>
        <ellipse cx="35" cy="30" rx="8" ry="25" fill="url(#fur)" transform="rotate(-15 35 30)"/>
        <ellipse cx="35" cy="30" rx="4" ry="18" fill="url(#earInner)" transform="rotate(-15 35 30)"/>
        <ellipse cx="65" cy="30" rx="8" ry="25" fill="url(#fur)" transform="rotate(15 65 30)"/>
        <ellipse cx="65" cy="30" rx="4" ry="18" fill="url(#earInner)" transform="rotate(15 65 30)"/>
        <ellipse cx="50" cy="90" rx="25" ry="28" fill="url(#fur)"/>
        <ellipse cx="35" cy="110" rx="10" ry="6" fill="url(#fur)"/>
        <ellipse cx="65" cy="110" rx="10" ry="6" fill="url(#fur)"/>
        <ellipse cx="30" cy="85" rx="7" ry="12" fill="url(#fur)" transform="rotate(30 30 85)"/>
        <ellipse cx="70" cy="85" rx="7" ry="12" fill="url(#fur)" transform="rotate(-30 70 85)"/>
        <circle cx="50" cy="60" r="22" fill="url(#fur)"/>
        <circle cx="43" cy="55" r="3" fill="#333"/>
        <circle cx="57" cy="55" r="3" fill="#333"/>
        <circle cx="50" cy="62" r="2" fill="#ff69b4"/>
        <path d="M 50 64 Q 45 68 40 64" stroke="#333" fill="transparent" stroke-width="1.5"/>
        <path d="M 50 64 Q 55 68 60 64" stroke="#333" fill="transparent" stroke-width="1.5"/>
        <circle cx="50" cy="64" r="0.5" fill="#333"/>
        <circle cx="72" cy="100" r="8" fill="#fff"/>
    </svg>`;

    // Змінні гри
    let valA = 0;
    let valB = 0;
    let valResult = 0;
    let operation = '+'; 
    let activeBunnies = [];
    let isSolved = false;

    // DOM Елементи
    const stage = document.getElementById('stage');
    const schemaDisplay = document.getElementById('schema-display');
    const inpA = document.getElementById('inp-a');
    const inpB = document.getElementById('inp-b');
    const inpC = document.getElementById('inp-c');
    const inpSign = document.getElementById('inp-sign');
    const btnNext = document.getElementById('btn-next');

    // Обробники подій
    inpSign.addEventListener('click', () => {
        if(isSolved) return;
        soundPop();
        inpSign.textContent = inpSign.textContent === '+' ? '-' : '+';
        checkWinCondition();
    });

    [inpA, inpB, inpC].forEach(inp => {
        inp.addEventListener('input', () => {
            soundPop();
            checkWinCondition();
        });
    });

    btnNext.addEventListener('click', () => { soundPop(); generateLevel(); });

    // Генерація векторної схеми задачі
    function renderSchema(a, b, op) {
        const W = 200;
        const startX = 20;
        let svg = '';

        if (op === '+') {
            const total = a + b;
            const splitX = startX + (a / total) * W;
            
            svg = `
            <svg width="240" height="120" viewBox="0 0 240 120" style="font-family: 'Segoe UI', sans-serif; font-weight: 900; font-size: 22px; fill: #4a2f1d; filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.3));">
                <line x1="20" y1="60" x2="220" y2="60" stroke="#4a2f1d" stroke-width="5" stroke-linecap="round"/>
                <line x1="20" y1="48" x2="20" y2="72" stroke="#4a2f1d" stroke-width="5" stroke-linecap="round"/>
                <line x1="${splitX}" y1="48" x2="${splitX}" y2="72" stroke="#4a2f1d" stroke-width="5" stroke-linecap="round"/>
                <line x1="220" y1="48" x2="220" y2="72" stroke="#4a2f1d" stroke-width="5" stroke-linecap="round"/>

                <path d="M 20,42 Q ${(20+splitX)/2},10 ${splitX},42" fill="none" stroke="#6b4226" stroke-width="3"/>
                <text x="${(20+splitX)/2}" y="22" text-anchor="middle">${a}</text>

                <path d="M ${splitX},42 Q ${(splitX+220)/2},10 220,42" fill="none" stroke="#6b4226" stroke-width="3"/>
                <text x="${(splitX+220)/2}" y="22" text-anchor="middle">${b}</text>

                <path d="M 20,78 Q 120,115 220,78" fill="none" stroke="#b33939" stroke-width="3" stroke-dasharray="6,6"/>
                <text x="120" y="115" text-anchor="middle" fill="#b33939">?</text>
            </svg>`;
        } else {
            // Для віднімання a - це загальна сума (ціле), b - відома частина
            const splitX = startX + (b / a) * W;
            
            svg = `
            <svg width="240" height="120" viewBox="0 0 240 120" style="font-family: 'Segoe UI', sans-serif; font-weight: 900; font-size: 22px; fill: #4a2f1d; filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.3));">
                <line x1="20" y1="60" x2="220" y2="60" stroke="#4a2f1d" stroke-width="5" stroke-linecap="round"/>
                <line x1="20" y1="48" x2="20" y2="72" stroke="#4a2f1d" stroke-width="5" stroke-linecap="round"/>
                <line x1="${splitX}" y1="48" x2="${splitX}" y2="72" stroke="#4a2f1d" stroke-width="5" stroke-linecap="round"/>
                <line x1="220" y1="48" x2="220" y2="72" stroke="#4a2f1d" stroke-width="5" stroke-linecap="round"/>

                <path d="M 20,42 Q 120,5 220,42" fill="none" stroke="#6b4226" stroke-width="3"/>
                <text x="120" y="22" text-anchor="middle">${a}</text>

                <path d="M 20,78 Q ${(20+splitX)/2},110 ${splitX},78" fill="none" stroke="#6b4226" stroke-width="3"/>
                <text x="${(20+splitX)/2}" y="115" text-anchor="middle">${b}</text>

                <path d="M ${splitX},78 Q ${(splitX+220)/2},110 220,78" fill="none" stroke="#b33939" stroke-width="3" stroke-dasharray="6,6"/>
                <text x="${(splitX+220)/2}" y="115" text-anchor="middle" fill="#b33939">?</text>
            </svg>`;
        }
        schemaDisplay.innerHTML = svg;
    }

    // Робота з персонажами
    function createBunny(id) {
        const div = document.createElement('div');
        div.className = 'bunny-wrapper';
        div.id = `bunny-${id}`;
        div.innerHTML = bunnySVG;
        div.style.left = '-20%'; 
        stage.appendChild(div);
        return div;
    }

    function updateBunnyPositions() {
        const total = activeBunnies.length;
        const spacing = 80 / (total + 1); 
        activeBunnies.forEach((bunny, index) => {
            const targetLeft = 10 + spacing * (index + 1);
            bunny.style.left = `${targetLeft}%`;
        });
    }

    function animateHopIn(count, onComplete = null) {
        let spawned = 0;
        const interval = setInterval(() => {
            if(spawned >= count) {
                clearInterval(interval);
                setTimeout(() => { if(onComplete) onComplete(); }, 1000);
                return;
            }
            const bunny = createBunny(Date.now() + spawned);
            activeBunnies.push(bunny);
            bunny.classList.add('hopping');
            soundHop();
            
            setTimeout(() => { updateBunnyPositions(); }, 50);
            setTimeout(() => { bunny.classList.remove('hopping'); }, 1000);

            spawned++;
        }, 400);
    }

    function animateHopOut(count, onComplete = null) {
        let removed = 0;
        const toRemove = activeBunnies.slice(-count);
        
        const interval = setInterval(() => {
            if(removed >= count) {
                clearInterval(interval);
                setTimeout(() => { if(onComplete) onComplete(); }, 1000);
                return;
            }
            const bunny = toRemove[removed];
            bunny.classList.add('hopping');
            bunny.style.left = '120%'; 
            soundHop();
            
            activeBunnies = activeBunnies.filter(b => b !== bunny);
            setTimeout(() => {
                bunny.remove();
                updateBunnyPositions(); 
            }, 1000);

            removed++;
        }, 400);
    }

    function generateLevel() {
        isSolved = false;
        
        // Очищення сцени
        stage.innerHTML = '';
        activeBunnies = [];
        inpA.value = '';
        inpB.value = '';
        inpC.value = '';
        inpA.disabled = false;
        inpB.disabled = false;
        inpC.disabled = false;
        
        // Генерація в межах десятка
        operation = Math.random() > 0.5 ? '+' : '-';
        if (operation === '+') {
            valA = Math.floor(Math.random() * 5) + 2; 
            valB = Math.floor(Math.random() * (10 - valA)) + 1; 
            valResult = valA + valB;
        } else {
            valA = Math.floor(Math.random() * 6) + 5; 
            valB = Math.floor(Math.random() * (valA - 2)) + 2; 
            valResult = valA - valB;
        }

        // Відображення схеми
        renderSchema(valA, valB, operation);
        
        // Початкова кількість зайців: 
        // Для додавання - це частина A, для віднімання - це ціле A
        animateHopIn(valA);
    }

    function checkWinCondition() {
        if(isSolved) return;
        
        const uA = parseInt(inpA.value);
        const uB = parseInt(inpB.value);
        const uC = parseInt(inpC.value);
        const uSign = inpSign.textContent;

        if(isNaN(uA) || isNaN(uB) || isNaN(uC)) return;

        if (uA === valA && uB === valB && uC === valResult && uSign === operation) {
            isSolved = true;
            inpA.disabled = true;
            inpB.disabled = true;
            inpC.disabled = true;
            soundSuccess();

            // Анімація згідно зі схемою
            if (operation === '+') {
                animateHopIn(valB, triggerDance);
            } else {
                animateHopOut(valB, triggerDance);
            }
        } else if (uA.toString().length > 0 && uB.toString().length > 0 && uC.toString().length > 0) {
             if (uA !== valA || uB !== valB || uC !== valResult || uSign !== operation) {
                 soundError();
             }
        }
    }

    function triggerDance() {
        activeBunnies.forEach(bunny => {
            bunny.classList.add('dancing');
        });
    }

    // Старт
    window.onload = generateLevel;

</script>
</html>
