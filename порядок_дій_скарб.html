<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crystal Mine Cart Math</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=swap');

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Nunito', 'Fredoka', sans-serif;
    background: #0d071c;
  }

  /* Living Cavern Animations */
  @keyframes lanternSway {
    0%, 100% { transform: rotate(-3.5deg); }
    50% { transform: rotate(3.5deg); }
  }
  @keyframes crystalPulse {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(192, 132, 252, 0.45)); opacity: 0.9; }
    50% { filter: drop-shadow(0 0 22px rgba(232, 121, 249, 0.95)); opacity: 1; }
  }
  @keyframes cyanCrystalPulse {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.45)); }
    50% { filter: drop-shadow(0 0 24px rgba(103, 232, 249, 0.95)); }
  }
  @keyframes lavaGlow {
    0%, 100% { opacity: 0.78; transform: scaleY(1); }
    50% { opacity: 1; transform: scaleY(1.04); }
  }
  @keyframes cartIdleFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-3px); }
  }
  @keyframes badgeErrorShake {
    0%, 100% { transform: translateX(0) rotate(0deg) scale(1); }
    18% { transform: translateX(-10px) rotate(-12deg) scale(1.14); }
    36% { transform: translateX(10px) rotate(12deg) scale(1.14); }
    54% { transform: translateX(-8px) rotate(-8deg) scale(1.1); }
    72% { transform: translateX(8px) rotate(8deg) scale(1.06); }
  }
  @keyframes cartErrorWobble {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-9px) rotate(-2.5deg); }
    40% { transform: translateX(9px) rotate(2.5deg); }
    60% { transform: translateX(-6px) rotate(-1.5deg); }
    80% { transform: translateX(6px) rotate(1.5deg); }
  }
  @keyframes cartVictoryJump {
    0% { transform: translateY(0) scale(1); }
    35% { transform: translateY(-22px) scale(1.08) rotate(-2deg); }
    70% { transform: translateY(3px) scale(0.97) rotate(1deg); }
    100% { transform: translateY(0) scale(1) rotate(0deg); }
  }
  @keyframes raccoonCelebrate {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    25% { transform: translateY(-18px) rotate(-5deg) scale(1.05); }
    50% { transform: translateY(0) rotate(4deg) scale(0.98); }
    75% { transform: translateY(-14px) rotate(-3deg) scale(1.04); }
  }
  @keyframes salamanderCelebrate {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    30% { transform: translateY(-20px) rotate(7deg) scale(1.06); }
    60% { transform: translateY(2px) rotate(-5deg) scale(0.97); }
    85% { transform: translateY(-12px) rotate(4deg) scale(1.03); }
  }
  @keyframes gearSpinSlow {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .lantern-sway {
    transform-origin: top center;
    animation: lanternSway 5.4s ease-in-out infinite;
  }
  .crystal-glow {
    animation: crystalPulse 4.2s ease-in-out infinite;
  }
  .cyan-glow {
    animation: cyanCrystalPulse 3.6s ease-in-out infinite;
  }

  /* Mine Cart Number Block */
  .mine-cart {
    position: relative;
    min-width: clamp(86px, 9.2vw, 148px);
    height: clamp(96px, 12.6vh, 154px);
    padding: 0 clamp(14px, 1.6vw, 26px);
    border-radius: 22px 22px 28px 28px;
    background:
      radial-gradient(circle at 28% 22%, rgba(253, 224, 71, 0.35) 0%, transparent 48%),
      linear-gradient(135deg, rgba(255,255,255,0.16) 0%, transparent 40%),
      linear-gradient(180deg, #b45309 0%, #78350f 48%, #3f1d0b 100%);
    border: 5px solid #94a3b8;
    box-shadow:
      0 12px 0 #1e293b,
      0 20px 28px rgba(0, 0, 0, 0.65),
      inset 0 4px 8px rgba(254, 240, 138, 0.45),
      inset 0 -10px 14px rgba(15, 23, 42, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.28s ease, border-color 0.28s ease;
    z-index: 3;
  }

  /* Faceted Gem Ore Inner Core inside the Mine Cart */
  .mine-cart::before {
    content: '';
    position: absolute;
    inset: 7px 7px 14px 7px;
    border-radius: 14px 14px 18px 18px;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 42%),
      radial-gradient(circle at 70% 80%, rgba(217, 119, 6, 0.8), transparent 60%),
      linear-gradient(180deg, #f59e0b 0%, #d97706 55%, #92400e 100%);
    border: 2px solid rgba(254, 243, 199, 0.5);
    box-shadow: inset 0 3px 6px rgba(255, 255, 255, 0.5);
    z-index: -1;
  }

  /* Heavy Iron Rim & Rivets at bottom of cart */
  .cart-wheel-left, .cart-wheel-right {
    position: absolute;
    bottom: -16px;
    width: clamp(22px, 2.2vw, 32px);
    height: clamp(22px, 2.2vw, 32px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #cbd5e1 0%, #475569 55%, #0f172a 100%);
    border: 4px solid #1e293b;
    box-shadow: 0 4px 6px rgba(0,0,0,0.7);
    z-index: 4;
  }
  .cart-wheel-left::after, .cart-wheel-right::after {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: #f59e0b;
    border: 2px solid #451a03;
  }
  .cart-wheel-left { left: 14%; }
  .cart-wheel-right { right: 14%; }

  /* Highlighted Cart when enclosed by active brackets */
  .mine-cart.grouped-cart {
    border-color: #67e8f9;
    box-shadow:
      0 12px 0 #0e7490,
      0 0 30px rgba(34, 211, 238, 0.75),
      inset 0 4px 12px rgba(207, 250, 254, 0.85);
    transform: translateY(-5px);
  }
  .mine-cart.grouped-cart::before {
    background:
      linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 45%),
      linear-gradient(180deg, #38bdf8 0%, #0284c7 55%, #0369a1 100%);
    border-color: #cffafe;
  }

  .number-text {
    font-size: clamp(42px, 5.2vw, 76px);
    font-weight: 900;
    line-height: 1;
    color: #fffbeb;
    text-shadow:
      0 4px 0 #451a03,
      0 -1px 0 #451a03,
      2px 0 0 #451a03,
      -2px 0 0 #451a03,
      0 6px 12px rgba(0,0,0,0.6);
    letter-spacing: -1px;
    transform: translateY(-2px);
  }

  /* Interactive Crystal Bracket Clamp Slot */
  .bracket-slot {
    position: relative;
    width: clamp(38px, 4vw, 60px);
    height: clamp(104px, 14vh, 168px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 6;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .bracket-slot:hover {
    transform: scale(1.13);
  }

  .bracket-slot:active {
    transform: scale(0.92);
  }

  .bracket-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .bracket-slot:not(.active) .bracket-ghost {
    opacity: 0.45;
    transition: opacity 0.2s ease, filter 0.2s ease;
  }

  .bracket-slot:not(.active):hover .bracket-ghost {
    opacity: 0.92;
    filter: drop-shadow(0 0 12px rgba(103, 232, 249, 0.95));
  }

  .bracket-slot.active .bracket-solid {
    opacity: 1;
    transform: scale(1);
    filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 18px rgba(34, 211, 238, 0.85));
  }

  .bracket-slot:not(.active) .bracket-solid {
    opacity: 0;
    transform: scale(0.45);
    pointer-events: none;
  }

  .bracket-slot.active .bracket-ghost {
    opacity: 0;
  }

  /* Operator Column (Crystal Lantern Step Badge + Brass Chain + Gear Medallion) */
  .operator-column {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 clamp(2px, 0.45vw, 9px);
    z-index: 5;
  }

  .step-badge-wrapper {
    position: absolute;
    bottom: calc(100% + clamp(14px, 2.2vh, 28px));
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }

  /* Crystal Lantern Badge (1, 2, 3) */
  .step-badge {
    width: clamp(50px, 4.8vw, 72px);
    height: clamp(54px, 5.2vw, 76px);
    clip-path: polygon(22% 0%, 78% 0%, 100% 28%, 84% 100%, 16% 100%, 0% 28%);
    background:
      radial-gradient(circle at 35% 30%, #fef08a 0%, #f59e0b 52%, #92400e 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(25px, 2.6vw, 38px);
    font-weight: 900;
    color: #3b0764;
    text-shadow: 0 1px 0 rgba(255,255,255,0.8);
    position: relative;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: inset 0 4px 8px rgba(255,255,255,0.75);
  }

  .step-badge-frame {
    padding: 4px;
    border-radius: 18px;
    background: linear-gradient(180deg, #e2e8f0, #64748b, #1e293b);
    box-shadow:
      0 8px 18px rgba(0,0,0,0.65),
      0 0 16px rgba(251, 191, 36, 0.45);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Activated/Verified Step Lantern (Only lights up green when Check is pressed and correct!) */
  .step-badge-frame.step-verified {
    background: linear-gradient(180deg, #fef08a, #4ade80, #15803d);
    box-shadow:
      0 0 32px rgba(74, 222, 128, 0.95),
      0 0 60px rgba(250, 204, 21, 0.8);
    transform: scale(1.18) translateY(-6px);
  }
  .step-badge-frame.step-verified .step-badge {
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, #86efac 45%, #16a34a 100%);
    color: #052e16;
  }

  /* Conflict Step Lantern (Shakes red ONLY when Check is pressed and wrong!) */
  .step-badge-frame.step-conflict {
    background: linear-gradient(180deg, #fecaca, #ef4444, #7f1d1d);
    box-shadow: 0 0 28px rgba(239, 68, 68, 0.95);
    animation: badgeErrorShake 0.6s ease;
  }
  .step-badge-frame.step-conflict .step-badge {
    background: radial-gradient(circle at 35% 30%, #fecaca 0%, #ef4444 55%, #991b1b 100%);
    color: #ffffff;
    text-shadow: 0 2px 0 #450a0a;
  }

  .brass-chain {
    width: 8px;
    height: clamp(18px, 2.5vh, 32px);
    background: repeating-linear-gradient(
      180deg,
      #f59e0b 0px,
      #f59e0b 5px,
      #78350f 5px,
      #78350f 9px
    );
    border-left: 2px solid #451a03;
    border-right: 2px solid #451a03;
    border-radius: 4px;
  }

  /* Bronze Mechanical Gear Operator Medallion (+ - × :) */
  .operator-medallion {
    position: relative;
    width: clamp(60px, 6.2vw, 92px);
    height: clamp(60px, 6.2vw, 92px);
    border-radius: 50%;
    background:
      radial-gradient(circle at 32% 30%, #fcd34d 0%, #d97706 52%, #78350f 100%);
    border: 5px solid #451a03;
    box-shadow:
      0 8px 0 #271003,
      0 12px 20px rgba(0,0,0,0.65),
      inset 0 3px 6px rgba(254, 243, 199, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .operator-medallion::before {
    content: '';
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 4px dashed #b45309;
    pointer-events: none;
  }

  .operator-medallion.grouped-op {
    background:
      radial-gradient(circle at 32% 30%, #a5f3fc 0%, #06b6d4 52%, #0e7490 100%);
    border-color: #cffafe;
    box-shadow:
      0 8px 0 #164e63,
      0 0 26px rgba(34, 211, 238, 0.85),
      inset 0 3px 8px rgba(255,255,255,0.8);
  }

  .operator-symbol {
    font-size: clamp(34px, 4vw, 56px);
    font-weight: 900;
    color: #fffbeb;
    text-shadow:
      0 3px 0 #451a03,
      0 -1px 0 #451a03,
      2px 0 0 #451a03,
      -2px 0 0 #451a03;
    line-height: 1;
  }

  /* Tactile Forge & Crystal Buttons */
  .forge-btn {
    position: relative;
    border-radius: 22px;
    background:
      linear-gradient(180deg, #475569 0%, #334155 52%, #0f172a 100%);
    border: 4px solid #94a3b8;
    box-shadow:
      0 8px 0 #090d16,
      0 12px 22px rgba(0,0,0,0.65),
      inset 0 3px 6px rgba(255, 255, 255, 0.35);
    color: #f8fafc;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .forge-btn:hover {
    transform: translateY(-3px) scale(1.04);
    filter: brightness(1.1);
  }

  .forge-btn:active {
    transform: translateY(4px) scale(0.96);
    box-shadow:
      0 3px 0 #090d16,
      0 6px 12px rgba(0,0,0,0.55);
  }

  .forge-btn.mode-active {
    background:
      radial-gradient(circle at 30% 25%, rgba(240, 171, 252, 0.45), transparent 60%),
      linear-gradient(180deg, #a855f7 0%, #7e22ce 55%, #4c1d95 100%);
    border-color: #f0abfc;
    box-shadow:
      0 8px 0 #2e1065,
      0 0 24px rgba(192, 132, 252, 0.75),
      inset 0 3px 6px rgba(255, 255, 255, 0.6);
    color: #ffffff;
  }

  .next-arrow-btn {
    background:
      radial-gradient(circle at 30% 25%, rgba(254, 240, 138, 0.5), transparent 55%),
      linear-gradient(180deg, #f59e0b 0%, #d97706 55%, #78350f 100%);
    border: 4px solid #fde68a;
    box-shadow:
      0 8px 0 #451a03,
      0 14px 24px rgba(0,0,0,0.6),
      inset 0 3px 6px rgba(255,255,255,0.65);
  }

  /* Prominent Emerald-Crystal Check Button ("✔") */
  .crystal-check-btn {
    background:
      radial-gradient(circle at 30% 22%, rgba(167, 243, 208, 0.65), transparent 55%),
      linear-gradient(180deg, #10b981 0%, #059669 52%, #064e3b 100%);
    border: 5px solid #6ee7b7;
    box-shadow:
      0 10px 0 #022c22,
      0 0 28px rgba(16, 185, 129, 0.65),
      0 18px 28px rgba(0,0,0,0.65),
      inset 0 4px 8px rgba(255,255,255,0.75);
  }

  .crystal-check-btn:hover {
    box-shadow:
      0 10px 0 #022c22,
      0 0 42px rgba(52, 211, 153, 0.95),
      0 20px 32px rgba(0,0,0,0.75),
      inset 0 4px 10px rgba(255,255,255,0.9);
  }

  .reset-gear-btn {
    background:
      radial-gradient(circle at 30% 25%, rgba(254, 215, 170, 0.45), transparent 55%),
      linear-gradient(180deg, #ea580c 0%, #c2410c 55%, #7c2d12 100%);
    border: 4px solid #fdba74;
    box-shadow:
      0 9px 0 #431407,
      0 14px 24px rgba(0,0,0,0.6),
      inset 0 4px 7px rgba(255,255,255,0.5);
  }

  .victory-raccoon-anim {
    animation: raccoonCelebrate 0.65s ease-in-out infinite;
  }
  .victory-salamander-anim {
    animation: salamanderCelebrate 0.65s ease-in-out infinite;
  }
  .victory-cart-anim {
    animation: cartVictoryJump 0.72s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .error-cart-wobble {
    animation: cartErrorWobble 0.55s ease;
  }
</style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">

  <!-- ==================== LAYER 1: LIVING UNDERGROUND CRYSTAL CAVERN & RAILWAY SVG ==================== -->
  <svg class="absolute inset-0 w-full h-full object-cover pointer-events-none" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Deep Cavern Wall Gradient -->
      <linearGradient id="cavernBg" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#090414"/>
        <stop offset="38%" stop-color="#160b2e"/>
        <stop offset="75%" stop-color="#231145"/>
        <stop offset="100%" stop-color="#3b0d1e"/>
      </linearGradient>

      <!-- Glowing Magma River at Bottom -->
      <linearGradient id="magmaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="30%" stop-color="#f97316"/>
        <stop offset="75%" stop-color="#dc2626"/>
        <stop offset="100%" stop-color="#7f1d1d"/>
      </linearGradient>

      <!-- Amethyst Crystal Cluster Gradient -->
      <linearGradient id="amethystGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f0abfc"/>
        <stop offset="45%" stop-color="#c084fc"/>
        <stop offset="100%" stop-color="#6b21a8"/>
      </linearGradient>

      <!-- Turquoise Crystal Cluster Gradient -->
      <linearGradient id="cyanCrystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#cffafe"/>
        <stop offset="45%" stop-color="#22d3ee"/>
        <stop offset="100%" stop-color="#0e7490"/>
      </linearGradient>

      <!-- Amber Gold Crystal Gradient -->
      <linearGradient id="amberCrystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="50%" stop-color="#f59e0b"/>
        <stop offset="100%" stop-color="#92400e"/>
      </linearGradient>

      <!-- Lantern Light Cone -->
      <linearGradient id="lanternBeam" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fde047" stop-opacity="0.32"/>
        <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
      </linearGradient>

      <!-- Dark Stone Ledge Gradient -->
      <linearGradient id="stoneLedge" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#334155"/>
        <stop offset="45%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>
    </defs>

    <!-- Base Cavern Backdrop -->
    <rect width="1920" height="1080" fill="url(#cavernBg)"/>

    <!-- Distant Cavern Archways & Pillars -->
    <path d="M0,380 Q280,180 580,360 L640,1080 L0,1080 Z" fill="#120826" opacity="0.8"/>
    <path d="M1920,350 Q1620,170 1320,360 L1260,1080 L1920,1080 Z" fill="#120826" opacity="0.8"/>
    <path d="M520,420 Q960,210 1400,420 L1490,1080 L430,1080 Z" fill="#1b0c38" opacity="0.65"/>

    <!-- Ceiling Stalactites -->
    <path d="M0,0 L1920,0 L1920,140 L1790,230 L1710,110 L1580,260 L1460,95 L1310,190 L1180,85 L1040,210 L930,90 L790,220 L670,80 L530,250 L410,105 L260,240 L140,115 L0,210 Z" fill="#0d061a"/>

    <!-- Swaying Wrought-Iron Cavern Lanterns -->
    <g class="lantern-sway" style="transform-origin: 360px 0px;">
      <line x1="360" y1="0" x2="360" y2="145" stroke="#475569" stroke-width="6"/>
      <polygon points="360,155 180,880 540,880" fill="url(#lanternBeam)"/>
      <polygon points="335,145 385,145 395,195 325,195" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
      <circle cx="360" cy="172" r="15" fill="#fef08a"/>
    </g>
    <g class="lantern-sway" style="transform-origin: 1560px 0px; animation-delay: -2.4s;">
      <line x1="1560" y1="0" x2="1560" y2="140" stroke="#475569" stroke-width="6"/>
      <polygon points="1560,150 1380,880 1740,880" fill="url(#lanternBeam)"/>
      <polygon points="1535,140 1585,140 1595,190 1525,190" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
      <circle cx="1560" cy="167" r="15" fill="#fef08a"/>
    </g>

    <!-- Glowing Background Crystal Formations -->
    <g class="crystal-glow" transform="translate(640, 740)">
      <polygon points="0,120 -28,20 -8,-35 22,10 15,120" fill="url(#amethystGrad)"/>
      <polygon points="12,120 25,0 56,-25 65,35 42,120" fill="url(#amethystGrad)"/>
      <polygon points="-15,120 -58,45 -45,5 -12,40" fill="url(#amethystGrad)"/>
    </g>
    <g class="cyan-glow" transform="translate(1230, 730)">
      <polygon points="0,130 -25,15 5,-40 32,12 18,130" fill="url(#cyanCrystalGrad)"/>
      <polygon points="18,130 42,10 72,-15 68,45 45,130" fill="url(#cyanCrystalGrad)"/>
    </g>

    <!-- Bubbling Golden-Orange Magma River at Bottom -->
    <g style="animation: lavaGlow 3.2s ease-in-out infinite; transform-origin: bottom;">
      <path d="M0,930 Q480,890 960,930 Q1440,970 1920,920 L1920,1080 L0,1080 Z" fill="url(#magmaGrad)"/>
      <path d="M120,965 Q420,940 720,970 Q1120,1000 1560,955 Q1760,945 1880,965" fill="none" stroke="#fef08a" stroke-width="8" stroke-linecap="round" opacity="0.65"/>

<script>
/* ============================================================================
   1. WEB AUDIO SYNTHESIZER (Crystal Chimes, Forge Clanks, Fanfares & Boings)
   ============================================================================ */
class CrystalForgeSoundEngine {
  constructor() {
    this.ctx = null;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  // Crisp crystal clamp click when toggling a bracket slot (no win/lose judgment sound!)
  playBracketToggle(isActivating) {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;

    const baseFreq = isActivating ? 698.46 : 466.16; // F5 or Bb4 crystal tap
    const osc = this.ctx.createOscillator();
    const harmonic = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sine';
    harmonic.type = 'triangle';

    osc.frequency.setValueAtTime(baseFreq, now);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.08, now + 0.09);
    harmonic.frequency.setValueAtTime(baseFreq * 2.5, now);

    gain.gain.setValueAtTime(0.24, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

    osc.connect(gain);
    harmonic.connect(gain);
    gain.connect(this.ctx.destination);

    osc.start(now);
    harmonic.start(now);
    osc.stop(now + 0.15);
    harmonic.stop(now + 0.08);
  }

  // Subtle mechanical switch click for mode & skip buttons
  playUiSwitch() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(420, now);
    osc.frequency.exponentialRampToValueAtTime(680, now + 0.08);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.11);
  }

  // Sequential crystal bell chime as steps 1 -> 2 -> 3 light up on Check!
  playStepLightUp(stepNumber) {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const stepFreqs = [587.33, 739.99, 880.00, 1174.66]; // D5, F#5, A5, D6
    const freq = stepFreqs[(stepNumber - 1) % stepFreqs.length];

    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.24, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

  // 3 Distinct Victory Fanfares when Check is pressed and correct!
  playVictoryFanfare(variant = 0) {

        osc.start(now + offset);
        osc.stop(now + offset + 0.25);

        osc.frequency.linearRampToValueAtTime(freq * 0.88, start + 0.12);
        gain.gain.setValueAtTime(0.26, start);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(start);
        osc.stop(start + 0.16);

      osc.frequency.exponentialRampToValueAtTime(140, now + 0.28);
      osc.frequency.exponentialRampToValueAtTime(280, now + 0.38);
      gain.gain.setValueAtTime(0.28, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.43);
    }

const sound = new CrystalForgeSoundEngine();

/* ============================================================================
   2. ORDER OF OPERATIONS EVALUATOR & INFINITE TASK GENERATOR
   ============================================================================ */
let currentMode = 1; // 1: [+ -], 2: [+ - × :]
let currentTask = null;
let leftBrackets = [];  // boolean array for each number index
let rightBrackets = []; // boolean array for each number index
let isSolvedTransition = false;
let celebrationCounter = 0;
let errorCounter = 0;
let lastSignature = '';

function opPrecedence(op) {
  return (op === '×' || op === ':') ? 2 : 1;
}

/**
 * Given operators array `ops` (length N-1) and non-overlapping bracket pairs `pairs = [[L, R], ...]`,
 * returns the 1-based execution order array `steps` of length N-1, where `steps[k]` is the step number
 * (1, 2, 3...) at which operator `k` is executed.
 */
function computeOperatorSteps(ops, pairs) {
  const m = ops.length;
  const opMeta = [];

  for (let k = 0; k < m; k++) {
    let enclosingPair = null;
    for (const [L, R] of pairs) {
      if (k >= L && k < R) {
        enclosingPair = [L, R];
        break;
      }
    }
    opMeta.push({
      opIndex: k,
      inBracket: enclosingPair ? 1 : 0,
      bracketStart: enclosingPair ? enclosingPair[0] : 999,
      prec: opPrecedence(ops[k])
    });
  }

  const sorted = [...opMeta].sort((a, b) => {
    if (b.inBracket !== a.inBracket) return b.inBracket - a.inBracket;
    if (a.inBracket === 1 && a.bracketStart !== b.bracketStart) {
      return a.bracketStart - b.bracketStart;
    }
    if (b.prec !== a.prec) return b.prec - a.prec;
    return a.opIndex - b.opIndex;
  });

  const steps = new Array(m);
  sorted.forEach((item, rank) => {
    steps[item.opIndex] = rank + 1;
  });
  return steps;
}

/**
 * Evaluates whether the expression with given numbers, operators, and bracket pairs
 * produces valid positive whole numbers at every single intermediate step.
 */
function evaluateWithSteps(nums, ops, pairs) {
  const steps = computeOperatorSteps(ops, pairs);
  let items = nums.map(n => ({ val: n }));
  let activeOps = ops.map((op, idx) => ({ op, step: steps[idx] }));

  for (let s = 1; s <= ops.length; s++) {
    const idx = activeOps.findIndex(o => o.step === s);
    if (idx === -1) return { valid: false };
    const a = items[idx].val;
    const b = items[idx + 1].val;
    const op = activeOps[idx].op;
    let res = 0;
    if (op === '+') res = a + b;
    else if (op === '−') {
      res = a - b;
      if (res < 0) return { valid: false };
    } else if (op === '×') {
      res = a * b;
      if (res > 240) return { valid: false };
    } else if (op === ':') {
      if (b === 0 || a % b !== 0) return { valid: false };
      res = a / b;
    }
    items.splice(idx, 2, { val: res });
    activeOps.splice(idx, 1);
  }
  return { valid: true, result: items[0].val, steps };
}

/**
 * Checks if any bracket pair in `pairs` is redundant (removing it leaves step order unchanged)
 */
function hasRedundantPair(ops, pairs) {
  const targetSteps = computeOperatorSteps(ops, pairs);
  for (let i = 0; i < pairs.length; i++) {
    const subset = pairs.filter((_, idx) => idx !== i);
    const subSteps = computeOperatorSteps(ops, subset);
    if (subSteps.every((val, idx) => val === targetSteps[idx])) {
      return true;
    }
  }
  return false;
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateTask(mode) {
  const templates3 = [
    { n: 3, pairs: [[0, 1]] },
    { n: 3, pairs: [[1, 2]] }
  ];
  const templates4 = [
    { n: 4, pairs: [[0, 1]] },
    { n: 4, pairs: [[1, 2]] },
    { n: 4, pairs: [[2, 3]] },
    { n: 4, pairs: [[0, 2]] },
    { n: 4, pairs: [[1, 3]] },
    { n: 4, pairs: [[0, 1], [2, 3]] }
  ];

  for (let attempt = 0; attempt < 400; attempt++) {
    const use4 = Math.random() < 0.55;
    const pool = use4 ? templates4 : templates3;
    const tpl = pool[randInt(0, pool.length - 1)];
    const n = tpl.n;
    const pairs = tpl.pairs;

    let ops = [];
    let nums = [];

    if (mode === 1) {
      const allowedOps = ['+', '−'];
      for (let i = 0; i < n - 1; i++) {
        ops.push(allowedOps[randInt(0, 1)]);
      }
      if (hasRedundantPair(ops, pairs)) continue;

      for (let i = 0; i < n; i++) {
        nums.push(randInt(4, 55));
      }
      const check = evaluateWithSteps(nums, ops, pairs);
      if (!check.valid || check.result <= 0 || check.result > 100) continue;

      const sig = nums.join(',') + '|' + ops.join(',');
      if (sig === lastSignature) continue;
      lastSignature = sig;

      return {
        nums,
        ops,
        targetPairs: pairs,
        targetSteps: check.steps,
        result: check.result
      };
    } else {
      const allOps = ['+', '−', '×', ':'];
      for (let i = 0; i < n - 1; i++) {
        ops.push(allOps[randInt(0, 3)]);
      }
      if (!ops.some(o => o === '×' || o === ':')) {
        ops[randInt(0, n - 2)] = Math.random() < 0.5 ? '×' : ':';
      }
      if (hasRedundantPair(ops, pairs)) continue;

      nums = new Array(n).fill(0).map(() => randInt(2, 18));
      for (let i = 0; i < n - 1; i++) {
        if (ops[i] === '×') {
          nums[i] = randInt(2, 9);
          nums[i + 1] = randInt(2, 9);
        } else if (ops[i] === ':') {
          nums[i + 1] = randInt(2, 9);
          nums[i] = nums[i + 1] * randInt(2, 9);
        } else {
          if (nums[i] < 6) nums[i] = randInt(6, 45);
        }
      }

      const check = evaluateWithSteps(nums, ops, pairs);
      if (!check.valid || check.result <= 0 || check.result > 120) continue;

      const sig = nums.join(',') + '|' + ops.join(',');
      if (sig === lastSignature) continue;
      lastSignature = sig;

      return {
        nums,
        ops,
        targetPairs: pairs,
        targetSteps: check.steps,
        result: check.result
      };
    }
  }

  if (mode === 1) {
    return {
      nums: [65, 25, 15],
      ops: ['−', '+'],
      targetPairs: [[1, 2]],
      targetSteps: [2, 1],
      result: 25
    };
  } else {
    return {
      nums: [24, 16, 4],
      ops: ['+', ':'],
      targetPairs: [[0, 1]],
      targetSteps: [1, 2],
      result: 10
    };
  }
}

/* ============================================================================
   3. PARSE USER BRACKETS
   ============================================================================ */
function parseUserBrackets() {
  const n = currentTask.nums.length;
  const stack = [];
  const pairs = [];
  let totalPlaced = 0;

  for (let i = 0; i < n; i++) {
    if (leftBrackets[i]) {
      totalPlaced++;
      stack.push(i);
    }
    if (rightBrackets[i]) {
      totalPlaced++;
      if (stack.length === 0) {
        return { balanced: false, totalPlaced, pairs: [] };
      }
      const start = stack.pop();
      if (start === i || (start === 0 && i === n - 1)) {
        return { balanced: false, totalPlaced, pairs: [], invalidSpan: true };
      }
      pairs.push([start, i]);
    }
  }

  if (stack.length > 0) {
    return { balanced: false, totalPlaced, pairs };
  }

  pairs.sort((a, b) => a[0] - b[0]);
  for (let i = 1; i < pairs.length; i++) {
    if (pairs[i][0] <= pairs[i - 1][1]) {
      return { balanced: false, totalPlaced, pairs, overlapping: true };
    }
  }

  return { balanced: true, totalPlaced, pairs };
}

function renderTask() {
  const row = document.getElementById('expressionRow');
  row.innerHTML = '';

  const n = currentTask.nums.length;

  for (let i = 0; i < n; i++) {
    // 1. Left Bracket Slot "(" (Valid on indices 0 .. n-2)
    if (i < n - 1) {
      const leftSlot = document.createElement('div');
      leftSlot.className = `bracket-slot ${leftBrackets[i] ? 'active' : ''}`;
      leftSlot.id = `leftSlot-${i}`;
      leftSlot.innerHTML = createCrystalBracketSVG('left');
      leftSlot.onclick = (e) => toggleBracket('left', i, e);
      row.appendChild(leftSlot);
    }

    // 2. Gem Ore Mine Cart (Number Block)
    const cart = document.createElement('div');
    cart.className = 'mine-cart';
    cart.id = `cart-${i}`;
    cart.innerHTML = `
      <div class="cart-wheel-left"></div>
      <div class="cart-wheel-right"></div>
      <span class="number-text">${currentTask.nums[i]}</span>
    `;
    row.appendChild(cart);

    // 3. Right Bracket Slot ")" (Valid on indices 1 .. n-1)
    if (i > 0) {
      const rightSlot = document.createElement('div');
      rightSlot.className = `bracket-slot ${rightBrackets[i] ? 'active' : ''}`;
      rightSlot.id = `rightSlot-${i}`;
      rightSlot.innerHTML = createCrystalBracketSVG('right');
      rightSlot.onclick = (e) => toggleBracket('right', i, e);
      row.appendChild(rightSlot);
    }

    // 4. Operator Column (Crystal Lantern Step Badge + Brass Chain + Gear Medallion)
    if (i < n - 1) {
      const opCol = document.createElement('div');
      opCol.className = 'operator-column';
      opCol.id = `opCol-${i}`;

      const stepNum = currentTask.targetSteps[i];
      opCol.innerHTML = `
        <div class="step-badge-wrapper">
          <div id="stepFrame-${i}" class="step-badge-frame">
            <div id="stepBadge-${i}" class="step-badge">${stepNum}</div>
          </div>
          <div class="brass-chain"></div>
        </div>
        <div id="opMedallion-${i}" class="operator-medallion">
          <span class="operator-symbol">${currentTask.ops[i]}</span>
        </div>
      `;
      row.appendChild(opCol);
    }
  }

  updateBracketConnectionPreview();
}

/**
 * Updates neutral cyan visual grouping for balanced bracket pairs WITHOUT giving away
 * whether the answer is right or wrong (step badges DO NOT turn green/red until Check is clicked!).
 */
function updateBracketConnectionPreview() {
  const n = currentTask.nums.length;
  const parsed = parseUserBrackets();

  for (let i = 0; i < n; i++) {
    const c = document.getElementById(`cart-${i}`);
    if (c) c.classList.remove('grouped-cart', 'error-cart-wobble');
  }
  for (let i = 0; i < n - 1; i++) {
    const opM = document.getElementById(`opMedallion-${i}`);
    const frame = document.getElementById(`stepFrame-${i}`);
    if (opM) opM.classList.remove('grouped-op');
    if (frame) frame.classList.remove('step-verified', 'step-conflict');
  }

  // Show which carts/operators are currently clamped together by user's brackets
  if (parsed.pairs && parsed.pairs.length > 0) {
    parsed.pairs.forEach(([L, R]) => {
      for (let idx = L; idx <= R; idx++) {
        const c = document.getElementById(`cart-${idx}`);
        if (c) c.classList.add('grouped-cart');
      }
      for (let idx = L; idx < R; idx++) {
        const opM = document.getElementById(`opMedallion-${idx}`);
        if (opM) opM.classList.add('grouped-op');
      }
    });
  }

  drawEnergyConduitOverlay(parsed.pairs || []);
}

/**
 * Draws decorative energy lines between step lanterns (1 -> 2 -> 3)
 * and glowing cyan-gold crystal beams underneath active bracket pairs.
 */
function drawEnergyConduitOverlay(activePairs) {
  const svg = document.getElementById('bridgeOverlaySvg');
  const assembly = document.getElementById('railwayAssembly');
  if (!svg || !assembly) return;

  const rect = assembly.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
  let html = '';

  // 1. Subtle overhead brass/energy conduits connecting step lanterns ① -> ② -> ③
  const m = currentTask.ops.length;
  const badgeCenters = {};
  for (let i = 0; i < m; i++) {
    const el = document.getElementById(`stepFrame-${i}`);
    if (el) {
      const bRect = el.getBoundingClientRect();
      badgeCenters[currentTask.targetSteps[i]] = {
        x: bRect.left - rect.left + bRect.width / 2,
        y: bRect.top - rect.top + bRect.height / 2
      };
    }
  }

  for (let s = 1; s < m; s++) {
    const p1 = badgeCenters[s];
    const p2 = badgeCenters[s + 1];
    if (p1 && p2) {
      const midX = (p1.x + p2.x) / 2;
      const arcHeight = Math.min(46, Math.abs(p2.x - p1.x) * 0.2 + 20);
      const midY = Math.min(p1.y, p2.y) - arcHeight;
      html += `
        <path d="M ${p1.x} ${p1.y - 20} Q ${midX} ${midY} ${p2.x} ${p2.y - 20}"
              fill="none" stroke="#c084fc" stroke-width="3.5" stroke-dasharray="8 8" stroke-linecap="round" opacity="0.55"/>
      `;
    }
  }

  // 2. Glowing cyan-gold crystal clamp beam underneath each active bracket pair [L, R]
  activePairs.forEach(([L, R]) => {
    const leftEl = document.getElementById(`leftSlot-${L}`);
    const rightEl = document.getElementById(`rightSlot-${R}`);
    if (leftEl && rightEl) {
      const lRect = leftEl.getBoundingClientRect();
      const rRect = rightEl.getBoundingClientRect();
      const x1 = lRect.left - rect.left + lRect.width * 0.65;
      const x2 = rRect.left - rect.left + rRect.width * 0.35;
      const y = lRect.bottom - rect.top - 6;
      const ctrlY = y + 30;

      html += `
        <path d="M ${x1} ${y} Q ${(x1 + x2) / 2} ${ctrlY} ${x2} ${y}"
              fill="none" stroke="#0e7490" stroke-width="11" stroke-linecap="round"/>
        <path d="M ${x1} ${y} Q ${(x1 + x2) / 2} ${ctrlY} ${x2} ${y}"
              fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/>
      `;
    }
  });

  svg.innerHTML = html;
}

/* ============================================================================
   5. INTERACTION LOGIC (BRACKET CLICK = TOGGLE ONLY; CHECK BUTTON = VERIFY!)
   ============================================================================ */
function toggleBracket(side, index, event) {
  if (isSolvedTransition) return;

  if (event) {
    lookAtPoint(event.clientX, event.clientY);
  }
  setCharacterEmotion('focus');

  let activated = false;
  if (side === 'left') {
    leftBrackets[index] = !leftBrackets[index];
    activated = leftBrackets[index];
    const slotEl = document.getElementById(`leftSlot-${index}`);
    if (slotEl) slotEl.classList.toggle('active', activated);
  } else {
    rightBrackets[index] = !rightBrackets[index];
    activated = rightBrackets[index];
    const slotEl = document.getElementById(`rightSlot-${index}`);
    if (slotEl) slotEl.classList.toggle('active', activated);
  }

  // ONLY play crystal mechanical click & small spark burst — NO automatic win/lose check!
  sound.playBracketToggle(activated);
  updateBracketConnectionPreview();

  if (event && activated) {
    spawnBracketSparkles(event.clientX, event.clientY);
  }
}

/**
 * Triggered ONLY when the child clicks the Check ("✔") button!
 */
function verifyOnCheckButton() {
  if (isSolvedTransition) return;

  const checkBtnEl = document.getElementById('checkBtn');
  if (checkBtnEl) {
    const r = checkBtnEl.getBoundingClientRect();
    lookAtPoint(r.left + r.width / 2, r.top + r.height / 2);
  }

  const parsed = parseUserBrackets();

  if (parsed.balanced && parsed.pairs.length > 0) {
    const userSteps = computeOperatorSteps(currentTask.ops, parsed.pairs);
    const matchesTarget = userSteps.every((s, idx) => s === currentTask.targetSteps[idx]);
    const redundant = hasRedundantPair(currentTask.ops, parsed.pairs);

    if (matchesTarget && !redundant) {
      triggerVictorySequence();
      return;
    }
    triggerErrorSequence(userSteps);
  } else {
    triggerErrorSequence(null);
  }
}

function clearUserBrackets() {
  if (isSolvedTransition) return;
  sound.playUiSwitch();
  const n = currentTask.nums.length;
  leftBrackets = new Array(n).fill(false);
  rightBrackets = new Array(n).fill(false);
  renderTask();
  setCharacterEmotion('idle');
}

function setMode(mode) {
  if (currentMode === mode && !isSolvedTransition) return;
  sound.playUiSwitch();
  currentMode = mode;
  document.getElementById('mode1Btn').classList.toggle('mode-active', mode === 1);
  document.getElementById('mode2Btn').classList.toggle('mode-active', mode === 2);
  startNewTask();
}

function skipToNextTask() {
  sound.playUiSwitch();
  isSolvedTransition = false;
  startNewTask();
}

function startNewTask() {
  isSolvedTransition = false;
  currentTask = generateTask(currentMode);
  const n = currentTask.nums.length;
  leftBrackets = new Array(n).fill(false);
  rightBrackets = new Array(n).fill(false);

  document.getElementById('raccoonContainer').classList.remove('victory-raccoon-anim');
  document.getElementById('salamanderContainer').classList.remove('victory-salamander-anim');
  setCharacterEmotion('idle');

  renderTask();
}

/* ============================================================================
   6. ACTIVE NON-VERBAL FEEDBACKS (ONLY ON CHECK BUTTON!)
   ============================================================================ */
function triggerVictorySequence() {
  isSolvedTransition = true;
  const variant = celebrationCounter % 3;
  celebrationCounter++;

  const m = currentTask.ops.length;
  // Light up step lanterns sequentially in exact order: 1 -> 2 (-> 3)
  for (let stepNum = 1; stepNum <= m; stepNum++) {
    const opIdx = currentTask.targetSteps.findIndex(s => s === stepNum);
    if (opIdx !== -1) {
      setTimeout(() => {
        const frame = document.getElementById(`stepFrame-${opIdx}`);
        if (frame) {
          frame.classList.remove('step-conflict');
          frame.classList.add('step-verified');
          const bRect = frame.getBoundingClientRect();
          spawnBracketSparkles(bRect.left + bRect.width / 2, bRect.top + bRect.height / 2);
        }
        sound.playStepLightUp(stepNum);
      }, (stepNum - 1) * 190);
    }
  }

  sound.playVictoryFanfare(variant);
  setCharacterEmotion('victory', variant);

  document.getElementById('raccoonContainer').classList.add('victory-raccoon-anim');
  document.getElementById('salamanderContainer').classList.add('victory-salamander-anim');

  // Bounce mine carts in wave
  const n = currentTask.nums.length;
  for (let i = 0; i < n; i++) {
    const c = document.getElementById(`cart-${i}`);
    if (c) {
      setTimeout(() => {
        c.classList.add('victory-cart-anim');
      }, 200 + i * 85);
    }
  }

  // Launch rich visual celebration on canvas
  spawnVictoryCelebration(variant);

  // Advance to next generated puzzle after ~2.6s
  setTimeout(() => {
    if (isSolvedTransition) {
      startNewTask();
    }
  }, 2600);
}

function triggerErrorSequence(userSteps) {
  const variant = errorCounter % 3;
  errorCounter++;

  sound.playErrorSound(variant);
  setCharacterEmotion('error', variant);

  // Wobble mine carts and puff smoke
  const n = currentTask.nums.length;
  for (let i = 0; i < n; i++) {
    const c = document.getElementById(`cart-${i}`);
    if (c) {
      c.classList.remove('error-cart-wobble');
      void c.offsetWidth;
      c.classList.add('error-cart-wobble');
    }
  }

  // Shake step lanterns that do not match target order (or all if unbalanced/empty)
  const m = currentTask.ops.length;
  for (let i = 0; i < m; i++) {
    const frame = document.getElementById(`stepFrame-${i}`);
    if (!frame) continue;
    if (!userSteps || userSteps[i] !== currentTask.targetSteps[i]) {
      frame.classList.remove('step-verified', 'step-conflict');
      void frame.offsetWidth;
      frame.classList.add('step-conflict');
      const bRect = frame.getBoundingClientRect();
      spawnErrorSmokeAndSparks(bRect.left + bRect.width / 2, bRect.top + bRect.height / 2);
    }
  }

  setTimeout(() => {
    if (!isSolvedTransition) {
      setCharacterEmotion('idle');
    }
  }, 1500);
}

/* ============================================================================
   7. CHARACTER EMOTIONS & NEVER-BLINKING DYNAMIC GAZE CONTROLLER
   ============================================================================ */
let gazeState = {
  racCurrX: 2, racCurrY: 0,
  racTargetX: 2, racTargetY: 0,
  salCurrX: -2, salCurrY: 0,
  salTargetX: -2, salTargetY: 0
};

function lookAtPoint(clientX, clientY) {
  const w = window.innerWidth;
  const h = window.innerHeight;

  const normX = (clientX / w - 0.5) * 2;
  const normY = (clientY / h - 0.35) * 2;

  gazeState.racTargetX = Math.max(-5.5, Math.min(6.5, normX * 6));
  gazeState.racTargetY = Math.max(-4.5, Math.min(5.5, normY * 5));

  gazeState.salTargetX = Math.max(-6.5, Math.min(5.5, normX * 6));
  gazeState.salTargetY = Math.max(-4.5, Math.min(5.5, normY * 5));
}

// Smoothly shift gaze to random points in the cavern (NEVER BLINKING!)
function scheduleRandomGaze() {
  const angle = Math.random() * Math.PI * 2;
  const radius = 1.5 + Math.random() * 4.5;
  gazeState.racTargetX = Math.cos(angle) * radius;
  gazeState.racTargetY = Math.sin(angle) * (radius * 0.75);

  const angle2 = Math.random() * Math.PI * 2;
  const radius2 = 1.5 + Math.random() * 4.5;
  gazeState.salTargetX = Math.cos(angle2) * radius2;
  gazeState.salTargetY = Math.sin(angle2) * (radius2 * 0.75);

  setTimeout(scheduleRandomGaze, 1400 + Math.random() * 1800);
}

function setCharacterEmotion(state, variant = 0) {
  // Raccoon Elements
  const racMouth = document.getElementById('raccoonMouth');
  const racBrowL = document.getElementById('raccoonBrowLeft');
  const racBrowR = document.getElementById('raccoonBrowRight');
  const racEarL = document.getElementById('raccoonEarLeft');
  const racEarR = document.getElementById('raccoonEarRight');
  const racArmL = document.getElementById('raccoonArmLeft');
  const racArmR = document.getElementById('raccoonArmRight');
  const racTail = document.getElementById('raccoonTail');
  const headlampGem = document.getElementById('headlampGem');
  const headlampBeam = document.getElementById('headlampBeam');

  // Salamander Elements
  const salStop1 = document.getElementById('salStop1');
  const salStop2 = document.getElementById('salStop2');
  const salStop3 = document.getElementById('salStop3');
  const salMouth = document.getElementById('salMouth');
  const salBrowL = document.getElementById('salBrowLeft');
  const salBrowR = document.getElementById('salBrowRight');
  const salFrills = document.getElementById('salFrills');

  if (state === 'idle') {
    racMouth.setAttribute('d', 'M120,126 Q136,136 152,126');
    racBrowL.style.transform = 'rotate(0deg) translateY(0px)';
    racBrowR.style.transform = 'rotate(0deg) translateY(0px)';
    racEarL.style.transform = 'rotate(0deg)';
    racEarR.style.transform = 'rotate(0deg)';
    racArmL.style.transform = 'rotate(0deg)';
    racArmR.style.transform = 'rotate(0deg)';
    racTail.style.transform = 'rotate(0deg)';
    headlampGem.setAttribute('fill', '#22d3ee');
    headlampBeam.setAttribute('opacity', '0.65');

    salStop1.setAttribute('stop-color', '#fde047');
    salStop2.setAttribute('stop-color', '#f97316');
    salStop3.setAttribute('stop-color', '#be123c');
    salMouth.setAttribute('d', 'M88,122 Q116,136 146,120');
    salBrowL.style.transform = 'rotate(0deg) translateY(0px)';
    salBrowR.style.transform = 'rotate(0deg) translateY(0px)';
    salFrills.style.transform = 'scale(1)';
  } else if (state === 'focus') {
    racMouth.setAttribute('d', 'M124,127 Q136,133 148,127');
    racBrowL.style.transform = 'rotate(5deg) translateY(-3px)';
    racBrowR.style.transform = 'rotate(-5deg) translateY(-3px)';
    racEarL.style.transform = 'rotate(8deg)';
    racEarR.style.transform = 'rotate(-8deg)';
    headlampGem.setAttribute('fill', '#fde047');
    headlampBeam.setAttribute('opacity', '0.9');

    salStop1.setAttribute('stop-color', '#a5f3fc');
    salStop2.setAttribute('stop-color', '#38bdf8');
    salStop3.setAttribute('stop-color', '#7e22ce');
    salBrowL.style.transform = 'translateY(-4px)';
    salBrowR.style.transform = 'translateY(-4px)';
    salFrills.style.transform = 'scale(1.08)';
  } else if (state === 'victory') {
    // 3 Ecstatic Victory Variations
    racMouth.setAttribute('d', 'M114,122 Q136,148 158,122');
    racBrowL.style.transform = 'rotate(-10deg) translateY(-6px)';
    racBrowR.style.transform = 'rotate(10deg) translateY(-6px)';
    racEarL.style.transform = 'rotate(14deg)';
    racEarR.style.transform = 'rotate(-14deg)';
    racArmL.style.transform = 'rotate(38deg)';
    racArmR.style.transform = 'rotate(-42deg)';
    racTail.style.transform = 'rotate(16deg)';
    headlampGem.setAttribute('fill', variant === 0 ? '#4ade80' : (variant === 1 ? '#f472b6' : '#fef08a'));
    headlampBeam.setAttribute('opacity', '1');

    salStop1.setAttribute('stop-color', '#fef08a');
    salStop2.setAttribute('stop-color', '#4ade80');
    salStop3.setAttribute('stop-color', '#06b6d4');
    salMouth.setAttribute('d', 'M82,118 Q116,148 152,116');
    salBrowL.style.transform = 'rotate(-12deg) translateY(-6px)';
    salBrowR.style.transform = 'rotate(12deg) translateY(-6px)';
    salFrills.style.transform = 'scale(1.18)';
  } else if (state === 'error') {
    // 3 Comical Shock / Confusion Variations (Eyes stay wide open!)
    if (variant % 3 === 0) {
      racMouth.setAttribute('d', 'M118,132 Q128,120 136,132 Q144,140 154,126');
      racBrowL.style.transform = 'rotate(-18deg) translateY(-5px)';
      racBrowR.style.transform = 'rotate(16deg) translateY(4px)';
      salMouth.setAttribute('d', 'M88,130 Q104,116 118,130 Q132,140 146,124');
    } else if (variant % 3 === 1) {
      racMouth.setAttribute('d', 'M126,132 Q136,122 146,132');
      racBrowL.style.transform = 'rotate(15deg) translateY(3px)';
      racBrowR.style.transform = 'rotate(-18deg) translateY(-5px)';
      salMouth.setAttribute('d', 'M96,130 Q116,118 138,130');
    } else {
      racMouth.setAttribute('d', 'M116,130 Q136,120 156,134');
      racBrowL.style.transform = 'translateY(-6px)';
      racBrowR.style.transform = 'translateY(4px)';
      salMouth.setAttribute('d', 'M86,128 Q116,116 146,132');
    }
    racEarL.style.transform = 'rotate(-18deg)';
    racEarR.style.transform = 'rotate(18deg)';
    headlampGem.setAttribute('fill', '#ef4444');

    salStop1.setAttribute('stop-color', '#e879f9');
    salStop2.setAttribute('stop-color', '#6366f1');
    salStop3.setAttribute('stop-color', '#312e81');
    salBrowL.style.transform = 'rotate(-16deg) translateY(-4px)';
    salBrowR.style.transform = 'rotate(14deg) translateY(4px)';
    salFrills.style.transform = 'scale(0.88)';

    // Comical dizzy eye spin (wide open!)
    gazeState.racTargetX = (variant % 2 === 0 ? 6 : -6);
    gazeState.salTargetX = (variant % 2 === 0 ? -6 : 6);
  }
}

/* ============================================================================
   8. CANVAS PARTICLE ENGINE (Rising Cavern Embers, Smoke & 3 Celebrations)
   ============================================================================ */
const canvas = document.getElementById('fxCanvas');
const ctx = canvas.getContext('2d');
let ambientEmbers = [];
let activeEffects = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (currentTask) {
    const parsed = parseUserBrackets();
    drawEnergyConduitOverlay(parsed.pairs || []);
  }
}
window.addEventListener('resize', resizeCanvas);

function initAmbientEmbers() {
  ambientEmbers = [];
  for (let i = 0; i < 36; i++) {
    ambientEmbers.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: 2 + Math.random() * 3.5,
      vx: -0.25 + Math.random() * 0.5,
      vy: -0.35 - Math.random() * 0.65,
      phase: Math.random() * Math.PI * 2,
      color: Math.random() < 0.6 ? '#fb923c' : (Math.random() < 0.5 ? '#c084fc' : '#22d3ee')
    });
  }
}

function spawnBracketSparkles(x, y) {
  const colors = ['#67e8f9', '#fde047', '#f0abfc', '#ffffff'];
  for (let i = 0; i < 16; i++) {
    const angle = (Math.PI * 2 * i) / 16 + (Math.random() - 0.5) * 0.3;
    const speed = 2.5 + Math.random() * 5.5;
    activeEffects.push({
      type: 'sparkle',
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 4 + Math.random() * 5,
      color: colors[i % colors.length],
      alpha: 1,
      decay: 0.03 + Math.random() * 0.015
    });
  }
}

function spawnErrorSmokeAndSparks(x, y) {
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 4;
    activeEffects.push({
      type: 'smoke',
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1.5,
      size: 10 + Math.random() * 14,
      color: i % 2 === 0 ? '#94a3b8' : '#f87171',
      alpha: 0.85,
      decay: 0.022
    });
  }
}

/**
 * 3 Distinct Non-Verbal Victory Celebrations:
 * 0: Sparkling Faceted Diamond & Ruby Gem Shower from the Cavern Ceiling
 * 1: Salamander's Glowing Golden Star-Ring & Firework Fountain
 * 2: Rainbow Crystal Prism Shockwave & Floating Gem Bubbles
 */
function spawnVictoryCelebration(variant) {
  const w = canvas.width;
  const h = canvas.height;

  if (variant === 0) {
    // 0: Faceted Gem Shower
    const gemColors = ['#22d3ee', '#e879f9', '#facc15', '#4ade80', '#fb7185'];
    for (let i = 0; i < 48; i++) {
      activeEffects.push({
        type: 'gem',
        x: Math.random() * w,
        y: -30 - Math.random() * 240,
        vx: -1.5 + Math.random() * 3,
        vy: 4 + Math.random() * 4.5,
        rot: Math.random() * Math.PI * 2,
        vRot: -0.07 + Math.random() * 0.14,
        size: 12 + Math.random() * 12,
        color: gemColors[i % gemColors.length],
        alpha: 1,
        decay: 0.007
      });
    }
  } else if (variant === 1) {
    // 1: Golden Star-Rings & Lava Fountain Fireworks
    const starColors = ['#fde047', '#fb923c', '#67e8f9', '#f472b6', '#4ade80'];
    for (let i = 0; i < 65; i++) {
      const launchX = w * (0.2 + 0.6 * Math.random());
      activeEffects.push({
        type: 'fountain',
        x: launchX,
        y: h - 40,
        vx: -5 + Math.random() * 10,
        vy: -14 - Math.random() * 9,
        gravity: 0.34,
        size: 7 + Math.random() * 7,
        color: starColors[i % starColors.length],
        alpha: 1,
        decay: 0.01
      });
    }
  } else {
    // 2: Crystal Starburst around the Railway + Salamander Star Rings
    const cx = w / 2;
    const cy = h / 2;
    const burstColors = ['#67e8f9', '#f0abfc', '#fde047', '#4ade80'];
    for (let i = 0; i < 60; i++) {
      const angle = (Math.PI * 2 * i) / 60;
      const speed = 3.5 + Math.random() * 9.5;
      activeEffects.push({
        type: 'sparkle',
        x: cx + (Math.random() - 0.5) * 320,
        y: cy + (Math.random() - 0.5) * 120,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 6 + Math.random() * 8,
        color: burstColors[i % burstColors.length],
        alpha: 1,
        decay: 0.013
      });
    }
  }
}

function animateLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Smooth pupil interpolation (Characters NEVER blink, only shift gaze smoothly)
  gazeState.racCurrX += (gazeState.racTargetX - gazeState.racCurrX) * 0.08;
  gazeState.racCurrY += (gazeState.racTargetY - gazeState.racCurrY) * 0.08;
  gazeState.salCurrX += (gazeState.salTargetX - gazeState.salCurrX) * 0.08;
  gazeState.salCurrY += (gazeState.salTargetY - gazeState.salCurrY) * 0.08;

  const racPL = document.getElementById('raccoonPupilLeft');
  const racPR = document.getElementById('raccoonPupilRight');
  const salPL = document.getElementById('salPupilLeft');
  const salPR = document.getElementById('salPupilRight');

  if (racPL) racPL.setAttribute('transform', `translate(${gazeState.racCurrX.toFixed(2)}, ${gazeState.racCurrY.toFixed(2)})`);
  if (racPR) racPR.setAttribute('transform', `translate(${gazeState.racCurrX.toFixed(2)}, ${gazeState.racCurrY.toFixed(2)})`);
  if (salPL) salPL.setAttribute('transform', `translate(${gazeState.salCurrX.toFixed(2)}, ${gazeState.salCurrY.toFixed(2)})`);
  if (salPR) salPR.setAttribute('transform', `translate(${gazeState.salCurrX.toFixed(2)}, ${gazeState.salCurrY.toFixed(2)})`);

  // Draw rising cavern embers & crystal dust
  ambientEmbers.forEach(p => {
    p.x += p.vx + Math.sin(p.phase) * 0.25;
    p.y += p.vy;
    p.phase += 0.03;
    if (p.y < -10) p.y = canvas.height + 10;
    if (p.x < -10) p.x = canvas.width + 10;
    if (p.x > canvas.width + 10) p.x = -10;

    ctx.save();
    ctx.globalAlpha = 0.45 + 0.35 * Math.sin(p.phase);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // Draw active interactive & celebration particles
  for (let i = activeEffects.length - 1; i >= 0; i--) {
    const ef = activeEffects[i];
    ef.x += ef.vx;
    ef.y += ef.vy;
    ef.alpha -= ef.decay;

    if (ef.alpha <= 0) {
      activeEffects.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = Math.max(0, ef.alpha);

    if (ef.type === 'sparkle') {
      ctx.fillStyle = ef.color;
      ctx.shadowColor = ef.color;
      ctx.shadowBlur = 12;
      ctx.translate(ef.x, ef.y);
      ctx.beginPath();
      for (let s = 0; s < 4; s++) {
        ctx.rotate(Math.PI / 2);
        ctx.moveTo(0, 0);
        ctx.lineTo(ef.size * 0.35, ef.size * 0.35);
        ctx.lineTo(0, ef.size * 1.45);
        ctx.lineTo(-ef.size * 0.35, ef.size * 0.35);
      }
      ctx.closePath();
      ctx.fill();
    } else if (ef.type === 'gem') {
      ef.rot += ef.vRot;
      ctx.translate(ef.x, ef.y);
      ctx.rotate(ef.rot);
      ctx.fillStyle = ef.color;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -ef.size);
      ctx.lineTo(ef.size * 0.75, 0);
      ctx.lineTo(0, ef.size);
      ctx.lineTo(-ef.size * 0.75, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if (ef.type === 'fountain') {
      ef.vy += ef.gravity;
      ctx.fillStyle = ef.color;
      ctx.shadowColor = ef.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(ef.x, ef.y, ef.size, 0, Math.PI * 2);
      ctx.fill();
    } else if (ef.type === 'smoke') {
      ef.size += 0.35;
      ctx.fillStyle = ef.color;
      ctx.beginPath();
      ctx.arc(ef.x, ef.y, ef.size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  requestAnimationFrame(animateLoop);
}

window.addEventListener('pointermove', (e) => {
  lookAtPoint(e.clientX, e.clientY);
});

window.onload = function () {
  resizeCanvas();
  initAmbientEmbers();
  startNewTask();
  scheduleRandomGaze();
  animateLoop();
};
</script>
</body>
</html>
