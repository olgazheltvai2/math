<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розгадай слово</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e0e0e0;
            transition: background-image 0.5s ease;
            user-select: none;
            overflow: hidden; /* Забороняємо прокрутку всього екрану */
        }

        #game-container {
            background: linear-gradient(135deg, rgba(255, 240, 245, 0.9), rgba(240, 248, 255, 0.9));
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            width: 98vw;
            height: 98vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-y: auto;
        }

        /* Setup Screen */
        #setup-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: auto;
            width: 100%;
            max-width: 1000px;
        }

        #word-input {
            font-size: 36px;
            padding: 15px;
            width: 80%;
            border: 2px solid #ccc;
            border-radius: 10px;
            background-color: #ffffff;
            color: #ffffff; /* Текст невидимий */
            caret-color: #000000;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #word-input:focus {
            outline: none;
            border-color: #888;
        }

        .settings-container {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: left;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .checkbox-label:hover {
            background: #e0e0e0;
        }

        .checkbox-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .mul-div-settings {
            width: 100%;
            margin-top: 10px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            align-items: center;
            box-sizing: border-box;
        }

        .mul-div-settings span {
            font-size: 18px;
            font-weight: bold;
        }

        .num-checkbox {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        .num-checkbox input {
            width: 18px;
            height: 18px;
        }

        #start-btn, #restart-btn {
            font-size: 28px;
            padding: 15px 40px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }

        #start-btn:hover, #restart-btn:hover {
            background-color: #45a049;
        }

        /* Play Screen */
        #play-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            height: 100%;
            width: 100%;
        }

        #slots-area {
            display: flex;
            justify-content: center;
            flex-wrap: nowrap; /* Заборона перенесення на новий рядок */
            width: 100%;
            gap: 1vw; /* Динамічний відступ */
            margin-bottom: 20px;
        }

        .slot-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            flex: 1 1 0; /* Дозволяє коміркам пропорційно стискатися */
            min-width: 0;
            max-width: 130px; /* Обмеження, щоб короткі слова не були гігантами */
        }

        .slot {
            width: 100%;
            aspect-ratio: 3/4; /* Пропорція замість жорстких пікселів */
            border: 4px dashed #888;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(200, 200, 200, 0.2);
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            box-sizing: border-box;
        }

        .slot.filled {
            border-style: solid;
            border-color: #4CAF50;
            background: transparent;
        }

        .expression {
            font-size: clamp(24px, 4vw, 56px); /* Дуже великий шрифт прикладів, який адаптується */
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        /* Fraction styling */
        .frac {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            font-size: 0.7em;
            line-height: 1.1;
            margin: 0 4px;
        }

        .frac span:first-child {
            border-bottom: 2px solid currentColor;
            padding: 0 4px;
            width: 100%;
            text-align: center;
        }

        .frac span:last-child {
            padding: 0 4px;
        }

        #cards-area {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Карткам дозволено переноситися для зручності */
            gap: 15px;
            padding: 20px;
            background: rgba(0,0,0,0.05);
            border-radius: 20px;
            min-height: 120px;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            width: 90px;
            height: 110px;
            background: white;
            border: 3px solid #2196F3;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .card.selected {
            border-color: #FF9800;
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 10px 20px rgba(255, 152, 0, 0.4);
        }

        .card .char {
            font-size: 46px;
            font-weight: bold;
            color: #000;
            line-height: 1.1;
        }

        .card .num {
            font-size: 34px; /* Збільшено з 26px */
            font-weight: bold;
            color: #d32f2f;
            display: flex;
            align-items: center;
        }

        #win-message {
            display: none;
            font-size: 64px;
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .error-anim {
            animation: shake 0.4s;
            border-color: #f44336 !important;
        }

        /* Theme Manager */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: white;
            border: 2px solid #ccc;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        #theme-modal {
            position: fixed;
            bottom: 90px;
            right: 20px;
            z-index: 9998;
            width: 320px;
            max-height: 60vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow-y: auto;
            padding: 15px;
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .theme-thumb {
            height: 100px;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            border: 3px solid transparent;
        }

        .theme-thumb:hover { border-color: #4CAF50; }
        .theme-thumb span {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            font-size: 14px;
            padding: 4px 0;
            border-bottom-left-radius: 7px;
            border-bottom-right-radius: 7px;
        }
    </style>
<body>

    <div id="game-container">
        <div id="setup-screen">
            <input type="text" id="word-input" autocomplete="off" spellcheck="false" placeholder="ВВЕДІТЬ СЛОВО ТУТ">
            
            <div class="settings-container" id="types-container">
                </div>

            <div class="mul-div-settings" id="mul-div-settings">
                <span>Числа для множення/ділення:</span>
                </div>

            <button id="start-btn">ПОЧАТИ ГРУ</button>
        </div>

        <div id="play-screen">
            <div id="win-message"></div>
            <div id="slots-area"></div>
            <div id="cards-area"></div>
            <button id="restart-btn" style="display: none;">НОВЕ СЛОВО</button>
        </div>
    </div>

    <button id="theme-btn">⚙️</button>
    <div id="theme-modal"></div>

    <script>
        /* === THEME MANAGER === */
        const baseBgUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
        let currentBgIndex = 1;
        const themeModal = document.getElementById('theme-modal');
        const themeBtn = document.getElementById('theme-btn');

        themeBtn.onclick = () => {
            themeModal.style.display = themeModal.style.display === 'grid' ? 'none' : 'grid';
        };

        function setBackground(url) {
            document.body.style.backgroundImage = `url(${url})`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundAttachment = 'fixed';
            localStorage.setItem('mySavedGameBg', url);
        }

        function checkAndLoadNextBg() {
            if (currentBgIndex > 100) return;
            const url = `${baseBgUrl}background_${currentBgIndex}.webp`;
            const img = new Image();
            
            img.onload = () => {
                const thumb = document.createElement('div');
                thumb.className = 'theme-thumb';
                thumb.style.backgroundImage = `url(${url})`;
                
                const label = document.createElement('span');
                label.innerText = `Фон ${currentBgIndex}`;
                
                thumb.appendChild(label);
                thumb.onclick = () => {
                    setBackground(url);
                    themeModal.style.display = 'none';
                };
                
                themeModal.appendChild(thumb);
                currentBgIndex++;
                checkAndLoadNextBg();
            };
            img.onerror = () => {};
            img.src = url;
        }

        setBackground(localStorage.getItem('mySavedGameBg') || `${baseBgUrl}background_1.webp`);
        checkAndLoadNextBg();

        /* === SOUND SYSTEM (Web Audio API) === */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'success') {
                    // Короткий приємний тихий звук правильної дії
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now); // Ре5
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // Ля5
                    gain.gain.setValueAtTime(0.08, now); // Тихий рівень
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.16);
                } else if (type === 'error') {
                    // М'який низький звук помилки
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now); // Ля3
                    osc.frequency.linearRampToValueAtTime(110, now + 0.25); // Ля2
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.26);
                } else if (type === 'win') {
                    // Святкові мажорні фанфари перемоги
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // До5 - Мі5 - Соль5 - До6
                    notes.forEach((freq, idx) => {
                        const noteOsc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(audioCtx.destination);
                        noteOsc.type = 'sine';
                        noteOsc.frequency.setValueAtTime(freq, now + idx * 0.12);
                        noteGain.gain.setValueAtTime(0.06, now + idx * 0.12);
                        noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.4);
                        noteOsc.start(now + idx * 0.12);
                        noteOsc.stop(now + idx * 0.12 + 0.45);
                    });
                }
            } catch (e) {
                console.log("Audio failed to play", e);
            }
        }

        /* === MATH TYPES CONFIGURATION === */
        const mathTypesDef = {
            t1: "додавання в межах першого десятка",
            t2: "віднімання в межах першого десятка",
            t3: "додавання з переходом через десяток в межах першого десятка",
            t4: "віднімання з переходом через десяток в межах першого десятка",
            t5: "додавання двозначних без перехода через десяток",
            t6: "віднімання двозначних без перехода через десяток",
            t7: "додавання двозначних з переходом через десяток",
            t8: "віднімання двозначних з переходом через десяток",
            t9: "додавання однозначного до круглого двозначного",
            t10: "віднімання однозначного від круглого двозначного",
            t11: "додавання однозначного до двозначного без перехода через десяток",
            t12: "віднімання однозначного від двозначного з переходом через десяток",
            t13: "додавання круглих двозначних",
            t14: "віднімання круглих двозначних",
            t15: "множення з вибором на які множити",
            t16: "ділення з вибором на які ділити",
            t17: "складання звичайних дробів з однаковим знаменником",
            t18: "віднімання звичайних дробів з однаковим знаменником",
            t19: "складання звичайних дробів з різним знаменником",
            t20: "віднімання звичайних дробів з різним знаменником"
        };

        const typesContainer = document.getElementById('types-container');
        for (let key in mathTypesDef) {
            const label = document.createElement('label');
            label.className = 'checkbox-label';
            label.innerHTML = `<input type="checkbox" value="${key}" ${key === 't1' ? 'checked' : ''}> ${mathTypesDef[key]}`;
            typesContainer.appendChild(label);
        }

        const mulDivContainer = document.getElementById('mul-div-settings');
        for (let i = 2; i <= 9; i++) {
            const label = document.createElement('label');
            label.className = 'num-checkbox';
            label.innerHTML = `<input type="checkbox" value="${i}" class="mul-div-val" checked> ${i}`;
            mulDivContainer.appendChild(label);
        }

        /* === MATH GENERATORS === */
        const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const renderFrac = (n, d) => `<div class="frac"><span>${n}</span><span>${d}</span></div>`;

        function generateMathProblem(types, mulDivOpts) {
            const type = types[Math.floor(Math.random() * types.length)];
            let e = "", tStr = "";
            try {
                switch(type) {
                    case 't1': { 
                        // Виключаємо банальні +1 і +2, якщо це можливо для широкого охоплення
                        let a = rnd(2, 7), b = rnd(2, 10 - a); 
                        if (Math.random() > 0.8) { a = rnd(1, 9); b = rnd(1, 10 - a); }
                        e = `${a} + ${b}`; tStr = `${a+b}`; return {e, tStr}; 
                    }
                    case 't2': { 
                        let a = rnd(4, 10), b = rnd(2, a - 2); 
                        if (b < 1) b = 1;
                        if (Math.random() > 0.8) { a = rnd(2, 10); b = rnd(1, a - 1); }
                        e = `${a} - ${b}`; tStr = `${a-b}`; return {e, tStr}; 
                    }
                    case 't3': { 
                        let a = rnd(3, 9), b = rnd(11 - a, 9); 
                        e = `${a} + ${b}`; tStr = `${a+b}`; return {e, tStr}; 
                    }
                    case 't4': { 
                        let target = rnd(3, 8), b = rnd(11 - target, 9); 
                        e = `${target+b} - ${b}`; tStr = `${target}`; return {e, tStr}; 
                    }
                    case 't5': { 
                        let a_tens = rnd(1, 7), a_ones = rnd(2, 7);
                        let b_tens = rnd(1, 8 - a_tens), b_ones = rnd(2, 9 - a_ones);
                        let a = a_tens*10 + a_ones, b = b_tens*10 + b_ones; e = `${a} + ${b}`; tStr = `${a+b}`; return {e, tStr}; 
                    }
                    case 't6': { 
                        let a_tens = rnd(3, 9), a_ones = rnd(3, 9);
                        let b_tens = rnd(1, a_tens - 2), b_ones = rnd(1, a_ones - 2);
                        let a = a_tens*10 + a_ones, b = b_tens*10 + b_ones; e = `${a} - ${b}`; tStr = `${a-b}`; return {e, tStr}; 
                    }
                    case 't7': { 
                        let a_tens = rnd(1, 7), a_ones = rnd(3, 9);
                        let b_tens = rnd(1, 8 - a_tens), b_ones = rnd(10 - a_ones, 9);
                        let a = a_tens*10 + a_ones, b = b_tens*10 + b_ones; e = `${a} + ${b}`; tStr = `${a+b}`; return {e, tStr}; 
                    }
                    case 't8': { 
                        let a_tens = rnd(3, 9), a_ones = rnd(1, 7);
                        let b_tens = rnd(1, a_tens - 2), b_ones = rnd(a_ones + 2, 9);
                        let a = a_tens*10 + a_ones, b = b_tens*10 + b_ones; e = `${a} - ${b}`; tStr = `${a-b}`; return {e, tStr}; 
                    }
                    case 't9': { 
                        let a = rnd(2, 9) * 10, b = rnd(3, 9); 
                        e = Math.random()>0.5 ? `${a} + ${b}` : `${b} + ${a}`; tStr = `${a+b}`; return {e, tStr}; 
                    }
                    case 't10': { 
                        let a = rnd(3, 10) * 10, b = rnd(3, 9); 
                        e = `${a} - ${b}`; tStr = `${a-b}`; return {e, tStr}; 
                    }
                    case 't11': { 
                        let a = rnd(13, 85); 
                        if(a%10 === 9) a -= 2;
                        let b = rnd(2, 9 - (a%10 || 9)); 
                        if (b < 1) b = 1;
                        e = `${a} + ${b}`; tStr = `${a+b}`; return {e, tStr}; 
                    }
                    case 't12': { 
                        let a = rnd(23, 98); 
                        if(a%10 === 0) a++;
                        let b = rnd((a%10)+1, 9); 
                        e = `${a} - ${b}`; tStr = `${a-b}`; return {e, tStr}; 
                    }
                    case 't13': { 
                        let a = rnd(2, 7)*10, b = rnd(2, 9 - a/10)*10; 
                        e = `${a} + ${b}`; tStr = `${a+b}`; return {e, tStr}; 
                    }
                    case 't14': { 
                        let a = rnd(4, 9)*10, b = rnd(2, a/10 - 2)*10; 
                        if (b < 10) b = 10;
                        e = `${a} - ${b}`; tStr = `${a-b}`; return {e, tStr}; 
                    }
                    case 't15': { 
                        let a = mulDivOpts[rnd(0, mulDivOpts.length-1)] || rnd(2,9);
                        let b = rnd(3, 9); 
                        e = Math.random()>0.5 ? `${a} * ${b}` : `${b} * ${a}`; tStr = `${a*b}`; return {e, tStr}; 
                    }
                    case 't16': { 
                        let b = mulDivOpts[rnd(0, mulDivOpts.length-1)] || rnd(2,9);
                        let ans = rnd(3, 9); 
                        let a = b * ans; e = `${a} : ${b}`; tStr = `${ans}`; return {e, tStr}; 
                    }
                    case 't17': { 
                        let d = rnd(4, 10); 
                        let a = rnd(1, d-3); 
                        let b = rnd(2, d-a-1); 
                        e = `${renderFrac(a, d)} + ${renderFrac(b, d)}`; tStr = renderFrac(a+b, d); return {e, tStr}; 
                    }
                    case 't18': { 
                        let d = rnd(4, 10); 
                        let a = rnd(3, d-1); 
                        let b = rnd(2, a-1); 
                        e = `${renderFrac(a, d)} - ${renderFrac(b, d)}`; tStr = renderFrac(a-b, d); return {e, tStr}; 
                    }
                    case 't19': { 
                        let d1 = rnd(2, 5), d2 = rnd(2, 5); if(d1 === d2) d2 = d1 === 5 ? 4 : d1 + 1;
                        let a = rnd(1, 2), b = rnd(1, 2); 
                        let n_res = a*d2 + b*d1; let d_res = d1*d2;
                        e = `${renderFrac(a, d1)} + ${renderFrac(b, d2)}`; tStr = renderFrac(n_res, d_res); return {e, tStr}; 
                    }
                    case 't20': { 
                        let d1 = rnd(3, 5), d2 = rnd(2, 4); if(d1 === d2) d2 = d1 === 5 ? 4 : d1 + 1;
                        let a = d1-1, b = 1; let n_res = a*d2 - b*d1; let d_res = d1*d2;
                        if(n_res <= 0) { a=d1*2; n_res = a*d2 - b*d1; }
                        e = `${renderFrac(a, d1)} - ${renderFrac(b, d2)}`; tStr = renderFrac(n_res, d_res); return {e, tStr}; 
                    }
                }
            } catch(err) {}
            // Fallback
            let fallbackA = rnd(15, 45), fallbackB = rnd(15, 45);
            return { e: `${fallbackA} + ${fallbackB}`, tStr: `${fallbackA + fallbackB}` };
        }

        /* === GAME LOGIC === */
        let gameWord = "";
        let slotsData = [];
        let cardsData = [];
        let selectedCardId = null;
        let selectedTypes = [];
        let selectedMulDiv = [];

        const alphabet = "АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯ".split('');

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', resetToSetup);

        function resetToSetup() {
            document.getElementById('play-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('win-message').style.display = 'none';
            document.getElementById('slots-area').style.display = 'flex';
            document.getElementById('cards-area').style.display = 'flex';
            slotsData = []; cardsData = []; selectedCardId = null;
        }

        function startGame() {
            const inputEl = document.getElementById('word-input');
            const rawWord = inputEl.value.trim().toUpperCase();
            inputEl.value = ''; 
            
            gameWord = rawWord.replace(/[^А-ЯІЇЄҐ]/g, '');
            if (gameWord.length === 0) { alert('Введіть слово українською!'); return; }

            selectedTypes = Array.from(document.querySelectorAll('#types-container input:checked')).map(cb => cb.value);
            if(selectedTypes.length === 0) { alert('Оберіть хоча б один тип прикладів!'); return; }

            selectedMulDiv = Array.from(document.querySelectorAll('.mul-div-val:checked')).map(cb => parseInt(cb.value));
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('play-screen').style.display = 'flex';

            generateLevel();
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function generateLevel() {
            slotsData = []; cardsData = []; selectedCardId = null;
            const usedTargets = new Set();
            const usedExpressions = new Set();
            let cardIdCounter = 1;

            // ЗМІНЕНО: Тепер ми генеруємо повністю унікальний приклад для КОЖНОГО слота в слові, 
            // навіть якщо літери однакові. Це виключає ситуацію з однаковими прикладами.
            gameWord.split('').forEach((char, index) => {
                let p;
                let failsafe = 0;
                let fallbackTarget = 20; 
                do {
                    p = generateMathProblem(selectedTypes, selectedMulDiv);
                    failsafe++;
                    if (failsafe > 250) { 
                        while (usedTargets.has(`${fallbackTarget}`)) fallbackTarget++;
                        let a = Math.floor(fallbackTarget / 2);
                        let b = fallbackTarget - a;
                        p = { e: `${a} + ${b}`, tStr: `${fallbackTarget}` };
                    }
                } while ((usedTargets.has(p.tStr) || usedExpressions.has(p.e)) && failsafe < 500);
                
                // Зберігаємо, щоб ніколи не повторилося в цій грі
                usedTargets.add(p.tStr);
                usedExpressions.add(p.e);

                slotsData.push({
                    index: index,
                    char: char,
                    target: p.tStr,
                    expression: p.e,
                    filledWithId: null
                });

                cardsData.push({
                    id: cardIdCounter++,
                    char: char,
                    target: p.tStr,
                    placedInSlot: null
                });
            });

            // Жорстка унікальність для плутаючих літер (декоїв)
            const uniqueLetters = [...new Set(gameWord.split(''))];
            const decoysCount = Math.max(5, Math.floor(gameWord.length / 2));
            const decoyLetters = shuffle(alphabet.filter(c => !uniqueLetters.includes(c))).slice(0, decoysCount);
            
            let decoyFallbackTarget = 60; 
            decoyLetters.forEach(char => {
                let p;
                let failsafe = 0;
                do {
                    p = generateMathProblem(selectedTypes, selectedMulDiv);
                    failsafe++;
                    if (failsafe > 250) {
                        while (usedTargets.has(`${decoyFallbackTarget}`)) decoyFallbackTarget++;
                        let a = Math.floor(decoyFallbackTarget / 2);
                        let b = decoyFallbackTarget - a;
                        p = { e: `${a} + ${b}`, tStr: `${decoyFallbackTarget}` };
                    }
                } while ((usedTargets.has(p.tStr) || usedExpressions.has(p.e)) && failsafe < 500);
                
                usedTargets.add(p.tStr);
                usedExpressions.add(p.e);

                cardsData.push({
                    id: cardIdCounter++,
                    char: char,
                    target: p.tStr,
                    placedInSlot: null
                });
            });

            cardsData = shuffle(cardsData);
            renderGame();
        }

        function renderGame() {
            const slotsArea = document.getElementById('slots-area');
            const cardsArea = document.getElementById('cards-area');
            
            slotsArea.innerHTML = '';
            cardsArea.innerHTML = '';

            slotsData.forEach((slot, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'slot-wrapper';

                const slotEl = document.createElement('div');
                slotEl.className = 'slot' + (slot.filledWithId ? ' filled' : '');
                
                if (slot.filledWithId) {
                    const cardData = cardsData.find(c => c.id === slot.filledWithId);
                    slotEl.innerHTML = `
                        <div style="text-align:center;">
                            <div class="char" style="font-size:clamp(30px, 4vw, 56px); font-weight:bold; line-height:1.1; color:#000;">${cardData.char}</div>
                            <div class="num" style="font-size:clamp(22px, 3.5vw, 36px); font-weight:bold; color:#d32f2f;">${cardData.target}</div>
                        </div>
                    `;
                }

                slotEl.onclick = () => handleSlotClick(idx, slotEl);

                const expEl = document.createElement('div');
                expEl.className = 'expression';
                expEl.innerHTML = slot.expression;

                wrapper.appendChild(slotEl);
                wrapper.appendChild(expEl);
                slotsArea.appendChild(wrapper);
            });

            cardsData.filter(c => c.placedInSlot === null).forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card' + (selectedCardId === card.id ? ' selected' : '');
                cardEl.innerHTML = `
                    <div class="char">${card.char}</div>
                    <div class="num">${card.target}</div>
                `;
                cardEl.onclick = () => handleCardClick(card.id);
                cardsArea.appendChild(cardEl);
            });

            checkWin();
        }

        function handleCardClick(id) {
            selectedCardId = selectedCardId === id ? null : id;
            renderGame();
        }

        function handleSlotClick(slotIndex, slotEl) {
            const slot = slotsData[slotIndex];

            if (slot.filledWithId) {
                const card = cardsData.find(c => c.id === slot.filledWithId);
                card.placedInSlot = null;
                slot.filledWithId = null;
                renderGame();
                return;
            }

            if (selectedCardId) {
                const card = cardsData.find(c => c.id === selectedCardId);
                if (card.target === slot.target) {
                    card.placedInSlot = slotIndex;
                    slot.filledWithId = card.id;
                    selectedCardId = null;
                    playSound('success'); // ТИХИЙ ЗВУК УСПІХУ
                    renderGame();
                } else {
                    slotEl.classList.add('error-anim');
                    playSound('error'); // М'ЯКИЙ ЗВУК ПОМИЛКИ
                    setTimeout(() => slotEl.classList.remove('error-anim'), 400);
                    selectedCardId = null;
                    renderGame();
                }
            }
        }

        function checkWin() {
            const isWin = slotsData.every(s => s.filledWithId !== null);
            if (isWin && slotsData.length > 0) {
                document.getElementById('win-message').innerText = gameWord;
                document.getElementById('win-message').style.display = 'block';
                document.getElementById('slots-area').style.display = 'none';
                document.getElementById('cards-area').style.display = 'none';
                document.getElementById('restart-btn').style.display = 'block';
                playSound('win'); // ФАНФАРИ ПЕРЕМОГИ
            }
        }
    </script>
</html>
