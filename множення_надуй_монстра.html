        const eyeR = baseR * (0.24 + (this.state === 'gulp' ? 0.03 : 0));
        this._drawEye(ctx, -eyeSpacing, faceY, eyeR, -1);
        this._drawEye(ctx, eyeSpacing, faceY, eyeR, 1);
        this._drawEyebrows(ctx, eyeSpacing, faceY - eyeR * 1.28, eyeR);

        // 12. Dynamic Mouth (+ wiggling pink tongue on wrong answer giggle!)
        this._drawMouth(ctx, 0, faceY + eyeR * 1.25, baseR, time);

        // 13. Sweat drops on high pressure
        for (const s of this.sweatDrops) {
          ctx.save();
          ctx.translate(s.x * rx, s.y * ry);
          ctx.globalAlpha = Math.max(0, s.life);
          ctx.fillStyle = '#b9f3ff';
          ctx.strokeStyle = '#3896b8';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(0, -9);
          ctx.quadraticCurveTo(6, 2, 0, 7);
          ctx.quadraticCurveTo(-6, 2, 0, -9);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        ctx.restore();

        // 14. Hissing Air Wisps (in world coordinates)
        for (const w of this.airWisps) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, w.life * 0.72);
          ctx.fillStyle = '#f2fdff';
          ctx.beginPath();
          ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      _drawParachute(ctx, x, y, r, time) {
        const sway = Math.sin(time * 5.5) * 0.12;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(sway);

        // Cords
        ctx.strokeStyle = '#6e451b';
        ctx.lineWidth = 2.2;
        [-0.75, -0.25, 0.25, 0.75].forEach(f => {
          ctx.beginPath();
          ctx.moveTo(0, 12);
          ctx.lineTo(f * r, -r * 0.55);
          ctx.stroke();
        });

        // Striped colorful meadow canopy
        const stripes = ['#ff6f61', '#ffd166', '#4ecdc4', '#ff6f61', '#ffd166'];
        for (let i = 0; i < stripes.length; i++) {
          const a0 = Math.PI + (i / stripes.length) * Math.PI;
          const a1 = Math.PI + ((i + 1) / stripes.length) * Math.PI;
          ctx.fillStyle = stripes[i];
          ctx.beginPath();
          ctx.moveTo(0, -r * 0.55);
          ctx.arc(0, -r * 0.55, r * 0.85, a0, a1);
          ctx.closePath();
          ctx.fill();
        }
        ctx.strokeStyle = '#5e3210';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, -r * 0.55, r * 0.85, Math.PI, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      _drawFoot(ctx, x, y, r, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        const g = ctx.createRadialGradient(-r * 0.2, -r * 0.2, 2, 0, 0, r * 1.2);
        g.addColorStop(0, this.palette.mid);
        g.addColorStop(1, this.palette.dark);
        ctx.fillStyle = g;
        ctx.strokeStyle = this.palette.dark;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 1.12, r * 0.68, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // Cute toes
        ctx.fillStyle = this.palette.horn;
        [-0.45, 0, 0.45].forEach(t => {
          ctx.beginPath();
          ctx.arc(t * r * 0.72, r * 0.26, r * 0.18, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      _drawArm(ctx, x, y, len, angle, dir) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        const g = ctx.createLinearGradient(0, -len * 0.3, dir * len, len * 0.3);
        g.addColorStop(0, this.palette.light);
        g.addColorStop(0.55, this.palette.mid);
        g.addColorStop(1, this.palette.dark);
        ctx.fillStyle = g;
        ctx.strokeStyle = this.palette.dark;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(dir * len * 0.45, 0, len * 0.62, len * 0.34, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      _drawEars(ctx, rx, ry, baseR, time) {
        const w = Math.sin(time * 3.5) * 0.06;
        const droop = this.visualLevel < 0 ? Math.abs(this.visualLevel) * 0.18 : 0;
        const p = this.palette;

        [-1, 1].forEach(side => {
          ctx.save();
          if (this.earStyle === 'roundedHorns') {
            ctx.translate(side * rx * 0.42, -ry * 0.82);
            ctx.rotate(side * (0.28 + droop) + w);
            const hg = ctx.createLinearGradient(0, 0, 0, -baseR * 0.55);
            hg.addColorStop(0, p.hornDark);
            hg.addColorStop(0.5, p.horn);
            hg.addColorStop(1, '#fff7cc');
            ctx.fillStyle = hg;
            ctx.strokeStyle = p.hornDark;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-baseR * 0.14, 4);
            ctx.quadraticCurveTo(side * baseR * 0.08, -baseR * 0.52, side * baseR * 0.16, -baseR * 0.50);
            ctx.quadraticCurveTo(baseR * 0.18, -baseR * 0.2, baseR * 0.14, 4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else if (this.earStyle === 'floppyEars') {
            ctx.translate(side * rx * 0.62, -ry * 0.66);
            ctx.rotate(side * (0.62 + droop * 1.4) + w * 1.6);
            ctx.fillStyle = p.mid;
            ctx.strokeStyle = p.dark;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(side * baseR * 0.25, baseR * 0.08, baseR * 0.36, baseR * 0.18, side * 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = p.belly;
            ctx.beginPath();
            ctx.ellipse(side * baseR * 0.25, baseR * 0.10, baseR * 0.22, baseR * 0.09, side * 0.3, 0, Math.PI * 2);
            ctx.fill();
          } else if (this.earStyle === 'bouncyAntennae') {
            const bob = Math.sin(time * 5.2 + side) * 6;
            ctx.translate(side * rx * 0.34, -ry * 0.86);
            ctx.strokeStyle = p.dark;
            ctx.lineWidth = 4.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(0, 6);
            ctx.quadraticCurveTo(side * 12, -baseR * 0.38, side * 22 + bob * 0.4, -baseR * 0.52 + bob * 0.3);
            ctx.stroke();
            ctx.fillStyle = p.horn;
            ctx.strokeStyle = p.hornDark;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(side * 22 + bob * 0.4, -baseR * 0.52 + bob * 0.3, baseR * 0.13, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          } else if (this.earStyle === 'catTufts') {
            ctx.translate(side * rx * 0.46, -ry * 0.78);
            ctx.rotate(side * (0.22 + droop) + w);
            ctx.fillStyle = p.mid;
            ctx.strokeStyle = p.dark;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-baseR * 0.2, 8);
            ctx.quadraticCurveTo(0, -baseR * 0.58, baseR * 0.2, 8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = p.cheek;
            ctx.beginPath();
            ctx.moveTo(-baseR * 0.1, 4);
            ctx.quadraticCurveTo(0, -baseR * 0.32, baseR * 0.1, 4);
            ctx.closePath();
            ctx.fill();
          } else if (this.earStyle === 'leafEars') {
            ctx.translate(side * rx * 0.45, -ry * 0.82);
            ctx.rotate(side * (0.55 + droop) + w * 1.4);
            ctx.fillStyle = '#53bd49';
            ctx.strokeStyle = '#236622';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(side * baseR * 0.18, -baseR * 0.12, baseR * 0.32, baseR * 0.14, side * -0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          } else {
            // bearEars
            ctx.translate(side * rx * 0.54, -ry * 0.76);
            ctx.fillStyle = p.mid;
            ctx.strokeStyle = p.dark;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, baseR * 0.23, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = p.belly;
            ctx.beginPath();
            ctx.arc(0, 2, baseR * 0.13, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        });
      }

      _drawBodyShape(ctx, rx, ry) {
        const p = this.palette;
        const tension = Math.max(0, this.visualLevel) / 10;

        ctx.beginPath();
        if (this.visualLevel < -0.4) {
          // Slightly wobbly skinny deflated balloon silhouette
          const squeeze = Math.min(1, Math.abs(this.visualLevel) / 3) * 0.16;
          ctx.moveTo(0, -ry);
          ctx.bezierCurveTo(rx * 1.08, -ry, rx * (1 - squeeze), -ry * 0.1, rx * 1.04, ry * 0.45);
          ctx.bezierCurveTo(rx * 1.08, ry * 0.96, rx * 0.5, ry, 0, ry);
          ctx.bezierCurveTo(-rx * 0.5, ry, -rx * 1.08, ry * 0.96, -rx * 1.04, ry * 0.45);
          ctx.bezierCurveTo(-rx * (1 - squeeze), -ry * 0.1, -rx * 1.08, -ry, 0, -ry);
        } else {
          // Plush pear-round monster turning into a super-round taut balloon!
          const pear = (1 - tension) * 0.10;
          ctx.moveTo(0, -ry);
          ctx.bezierCurveTo(rx * (0.64 - pear), -ry, rx * (1.02 - pear * 0.4), -ry * 0.48, rx, ry * 0.08);
          ctx.bezierCurveTo(rx * (1.04 + pear * 0.5), ry * 0.68, rx * 0.62, ry, 0, ry);
          ctx.bezierCurveTo(-rx * 0.62, ry, -rx * (1.04 + pear * 0.5), ry * 0.68, -rx, ry * 0.08);
          ctx.bezierCurveTo(-rx * (1.02 - pear * 0.4), -ry * 0.48, -rx * (0.64 - pear), -ry, 0, -ry);
        }
        ctx.closePath();

        // Volumetric radial body gradient
        const grad = ctx.createRadialGradient(-rx * 0.34, -ry * 0.36, rx * 0.08, 0, 0, Math.max(rx, ry) * 1.16);
        grad.addColorStop(0, p.light);
        grad.addColorStop(0.55, p.mid);
        grad.addColorStop(1, p.dark);
        ctx.fillStyle = grad;
        ctx.fill();

        // Warm rim-light crescent + glossy taut balloon sheen as it inflates!
        ctx.save();
        ctx.clip();

        // Warm rim light on upper-right edge
        ctx.strokeStyle = p.rim;
        ctx.lineWidth = 7;
        ctx.globalAlpha = 0.36;
        ctx.beginPath();
        ctx.ellipse(-rx * 0.08, ry * 0.08, rx * 0.96, ry * 0.96, 0, -Math.PI * 0.85, -Math.PI * 0.18);
        ctx.stroke();

        // Glossy stretched balloon highlight (grows shinier from level 2..10)
        const glossAlpha = 0.18 + tension * 0.42;
        ctx.fillStyle = `rgba(255, 255, 255, ${glossAlpha})`;
        ctx.beginPath();
        ctx.ellipse(-rx * 0.36, -ry * 0.46, rx * (0.20 + tension * 0.08), ry * (0.11 + tension * 0.04), -0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-rx * 0.56, -ry * 0.25, rx * 0.06, ry * 0.04, -0.45, 0, Math.PI * 2);
        ctx.fill();

        // Reddish strained inner glow at very high inflation (levels 8..10)
        if (this.visualLevel > 7.2) {
          const glowStr = Math.min(0.32, (this.visualLevel - 7.2) * 0.11);
          const strain = ctx.createRadialGradient(0, ry * 0.1, rx * 0.1, 0, ry * 0.1, rx * 0.95);
          strain.addColorStop(0, `rgba(255, 236, 175, ${glowStr})`);
          strain.addColorStop(0.65, `rgba(255, 92, 92, ${glowStr * 0.7})`);
          strain.addColorStop(1, 'rgba(255, 92, 92, 0)');
          ctx.fillStyle = strain;
          ctx.fillRect(-rx, -ry, rx * 2, ry * 2);
        }
        ctx.restore();

        // Clean organic outer stroke
        ctx.strokeStyle = p.dark;
        ctx.lineWidth = 3.8;
        ctx.stroke();
      }

      _drawBellyPatch(ctx, rx, ry) {
        const p = this.palette;
        const bx = 0;
        const by = ry * 0.32;
        const brx = rx * 0.58;
        const bry = ry * 0.46;

        ctx.save();
        ctx.beginPath();
        ctx.ellipse(bx, by, brx, bry, 0, 0, Math.PI * 2);
        ctx.fillStyle = p.belly;
        ctx.globalAlpha = 0.78;
        ctx.fill();
        ctx.clip();

        ctx.fillStyle = p.spot;
        ctx.globalAlpha = 0.26;
        if (this.bellyPattern === 'spots') {
          const spots = [
            [-0.42, -0.22, 0.22], [0.44, -0.18, 0.19], [0.02, 0.35, 0.24],
            [-0.48, 0.38, 0.17], [0.46, 0.40, 0.20]
          ];
          for (const [sx, sy, sr] of spots) {
            ctx.beginPath();
            ctx.ellipse(bx + sx * brx, by + sy * bry, brx * sr, bry * sr * 0.9, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (this.bellyPattern === 'stripes') {
          for (let i = -2; i <= 2; i++) {
            ctx.beginPath();
            ctx.roundRect(bx - brx, by + i * bry * 0.38 - 5, brx * 2, 10, 5);
            ctx.fill();
          }
        } else if (this.bellyPattern === 'rings') {
          ctx.strokeStyle = p.spot;
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.ellipse(bx, by + bry * 0.08, brx * 0.62, bry * 0.58, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.ellipse(bx, by + bry * 0.08, brx * 0.32, bry * 0.3, 0, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          // Clover dots
          for (let i = 0; i < 4; i++) {
            const a = (i / 4) * Math.PI * 2 + 0.4;
            ctx.beginPath();
            ctx.arc(bx + Math.cos(a) * brx * 0.34, by + Math.sin(a) * bry * 0.34, brx * 0.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();
      }

      _drawCracks(ctx, rx, ry, time) {
        const pulse = 0.72 + Math.sin(time * (this.state === 'prepop' ? 32 : 9)) * 0.28;
        const glowStrength = this.state === 'prepop' ? 1.0 : Math.min(0.95, (this.visualLevel - 3.2) / 6.5);

        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        for (const c of this.cracks) {
          if (this.level < c.minLevel && this.visualLevel < c.minLevel - 0.3) continue;
          const progress = Math.min(1, Math.max(0.25, (this.visualLevel - c.minLevel + 1.15) / 1.4));

          const drawPolyline = (pts, frac) => {
            const totalSegs = pts.length - 1;
            const maxSeg = totalSegs * frac;
            ctx.beginPath();
            ctx.moveTo(pts[0].x * rx, pts[0].y * ry);
            for (let i = 1; i <= totalSegs; i++) {
              if (i <= maxSeg) {
                ctx.lineTo(pts[i].x * rx, pts[i].y * ry);
              } else {
                const rem = maxSeg - (i - 1);
                if (rem > 0) {
                  const px = pts[i - 1].x + (pts[i].x - pts[i - 1].x) * rem;
                  const py = pts[i - 1].y + (pts[i].y - pts[i - 1].y) * rem;
                  ctx.lineTo(px * rx, py * ry);
                }
                break;
              }
            }
          };

          // Outer glowing pressure aura along crack
          ctx.strokeStyle = `rgba(255, 245, 175, ${glowStrength * pulse * 0.85})`;
          ctx.lineWidth = this.state === 'prepop' ? 8.5 : 5.5;
          drawPolyline(c.pts, progress);
          ctx.stroke();

          // Dark crisp fracture core
          ctx.strokeStyle = this.state === 'prepop' ? '#fff9d6' : '#3a1728';
          ctx.lineWidth = this.state === 'prepop' ? 3.5 : 2.6;
          drawPolyline(c.pts, progress);
          ctx.stroke();

          // Branches appear once crack grows past halfway
          if (progress > 0.55) {
            const bFrac = Math.min(1, (progress - 0.55) / 0.45);
            for (const b of c.branches) {
              ctx.strokeStyle = `rgba(255, 245, 175, ${glowStrength * pulse * 0.75})`;
              ctx.lineWidth = 4.2;
              drawPolyline(b, bFrac);
              ctx.stroke();

              ctx.strokeStyle = this.state === 'prepop' ? '#fff9d6' : '#3a1728';
              ctx.lineWidth = 2.0;
              drawPolyline(b, bFrac);
              ctx.stroke();
            }
          }
        }
        ctx.restore();
      }

      _drawEye(ctx, x, y, r, side) {
        ctx.save();
        ctx.translate(x, y);

        // Cheeky squinted happy arcs when giggling on wrong answer!
        if (this.state === 'giggle') {
          ctx.strokeStyle = '#2d1222';
          ctx.lineWidth = 4.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(0, r * 0.25, r * 0.72, Math.PI * 1.15, Math.PI * 1.85);
          ctx.stroke();
          ctx.restore();
          return;
        }

        // Tightly squeezed shut "> <" eyes right before POP!
        if (this.state === 'prepop') {
          ctx.strokeStyle = '#2d1222';
          ctx.lineWidth = 4.6;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          if (side === -1) {
            ctx.moveTo(-r * 0.55, -r * 0.45);
            ctx.lineTo(r * 0.45, 0);
            ctx.lineTo(-r * 0.55, r * 0.45);
          } else {
            ctx.moveTo(r * 0.55, -r * 0.45);
            ctx.lineTo(-r * 0.45, 0);
            ctx.lineTo(r * 0.55, r * 0.45);
          }
          ctx.stroke();
          ctx.restore();
          return;
        }

        // Glossy sclera
        const sg = ctx.createRadialGradient(-r * 0.2, -r * 0.25, r * 0.1, 0, 0, r);
        sg.addColorStop(0, '#fffef9');
        sg.addColorStop(0.85, '#f2efe4');
        sg.addColorStop(1, '#d4cdb8');
        ctx.fillStyle = sg;
        ctx.strokeStyle = '#2e1624';
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Colored Iris + Pupil tracking cursor
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, r - 1.5, 0, Math.PI * 2);
        ctx.clip();

        const px = this.eyeLookX * r * 0.34;
        const py = this.eyeLookY * r * 0.32;
        const irisR = r * 0.58;

        const ig = ctx.createRadialGradient(px - irisR * 0.2, py - irisR * 0.2, 1, px, py, irisR);
        ig.addColorStop(0, '#ffffff');
        ig.addColorStop(0.18, this.palette.iris);
        ig.addColorStop(1, '#18242e');
        ctx.fillStyle = ig;
        ctx.beginPath();
        ctx.arc(px, py, irisR, 0, Math.PI * 2);
        ctx.fill();

        // Dark pupil
        const pupilR = r * (this.level >= 7 ? 0.28 : 0.34);
        ctx.fillStyle = '#150d1a';
        ctx.beginPath();
        ctx.arc(px, py, pupilR, 0, Math.PI * 2);
        ctx.fill();

        // Dual crisp specular highlights
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(px - r * 0.2, py - r * 0.22, r * 0.17, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(px + r * 0.18, py + r * 0.16, r * 0.08, 0, Math.PI * 2);
        ctx.fill();

        // Eyelid blink curtain
        if (this.blinkAmount > 0.02) {
          ctx.fillStyle = this.palette.mid;
          ctx.fillRect(-r - 2, -r - 2, r * 2 + 4, (r * 2 + 4) * this.blinkAmount);
          ctx.strokeStyle = this.palette.dark;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(-r, -r + r * 2 * this.blinkAmount);
          ctx.lineTo(r, -r + r * 2 * this.blinkAmount);
          ctx.stroke();
        }
        ctx.restore();
        ctx.restore();
      }

      _drawEyebrows(ctx, spacing, y, eyeR) {
        ctx.strokeStyle = this.palette.dark;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        [-1, 1].forEach(side => {
          ctx.save();
          ctx.translate(side * spacing, y);
          if (this.level >= 7 || this.state === 'prepop') {
            // Worried furrowed brows
            ctx.rotate(side * -0.35);
            ctx.beginPath();
            ctx.moveTo(-eyeR * 0.55, 2);
            ctx.quadraticCurveTo(0, -5, eyeR * 0.55, 2);
            ctx.stroke();
          } else if (this.state === 'gulp') {
            // Surprised raised brows
            ctx.beginPath();
            ctx.arc(0, -3, eyeR * 0.55, Math.PI * 1.15, Math.PI * 1.85);
            ctx.stroke();
          } else if (this.state === 'giggle') {
            // Mischievous tilted brows
            ctx.rotate(side * 0.22);
            ctx.beginPath();
            ctx.moveTo(-eyeR * 0.5, 0);
            ctx.quadraticCurveTo(0, -6, eyeR * 0.5, 0);
            ctx.stroke();
          } else {
            // Friendly gentle arch
            ctx.beginPath();
            ctx.arc(0, 4, eyeR * 0.52, Math.PI * 1.2, Math.PI * 1.8);
            ctx.stroke();
          }
          ctx.restore();
        });
      }

      _drawMouth(ctx, x, y, baseR, time) {
        ctx.save();
        ctx.translate(x, y);
        const s = baseR * 0.34;

        if (this.state === 'giggle') {
          // Cheeky open laughing mouth with animated undulating pink tongue sticking out!
          ctx.fillStyle = '#5e1429';
          ctx.strokeStyle = '#2d0c17';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, -s * 0.1, s * 0.92, 0, Math.PI);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Cute upper tooth
          ctx.fillStyle = '#fffdf4';
          ctx.beginPath();
          ctx.roundRect(-s * 0.42, -s * 0.1, s * 0.28, s * 0.24, 3);
          ctx.fill();

          // Wiggling pink tongue sticking far out!
          const wiggle = Math.sin(time * 24) * 7;
          const tongueLen = s * 1.55 + Math.sin(time * 16) * 4;
          const tg = ctx.createLinearGradient(0, 0, wiggle, tongueLen);
          tg.addColorStop(0, '#ff6b8b');
          tg.addColorStop(1, '#ff9ebb');
          ctx.fillStyle = tg;
          ctx.strokeStyle = '#9c2243';
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.moveTo(-s * 0.46, s * 0.14);
          ctx.quadraticCurveTo(-s * 0.55 + wiggle * 0.5, tongueLen * 0.72, wiggle, tongueLen);
          ctx.quadraticCurveTo(s * 0.55 + wiggle * 0.5, tongueLen * 0.72, s * 0.46, s * 0.14);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Tongue center crease
          ctx.strokeStyle = 'rgba(156, 34, 67, 0.45)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, s * 0.22);
          ctx.quadraticCurveTo(wiggle * 0.45, tongueLen * 0.58, wiggle * 0.85, tongueLen * 0.82);
          ctx.stroke();
        } else if (this.state === 'gulp') {
          // Surprised "O" gulping air mouth
          ctx.fillStyle = '#591529';
          ctx.strokeStyle = '#2b0d17';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(0, s * 0.1, s * 0.52, s * 0.62, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ff7b9c';
          ctx.beginPath();
          ctx.ellipse(0, s * 0.42, s * 0.28, s * 0.18, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.state === 'prepop' || this.level >= 7) {
          // Straining puffed-cheek wavy mouth
          ctx.strokeStyle = '#2b0d17';
          ctx.lineWidth = 3.6;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-s * 0.75, 0);
          ctx.bezierCurveTo(-s * 0.35, -s * 0.35, -s * 0.15, s * 0.35, 0, 0);
          ctx.bezierCurveTo(s * 0.15, -s * 0.35, s * 0.35, s * 0.35, s * 0.75, 0);
          ctx.stroke();
          // Puffed cheek brackets
          ctx.beginPath();
          ctx.arc(-s * 0.92, 0, s * 0.28, Math.PI * 0.65, Math.PI * 1.35);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(s * 0.92, 0, s * 0.28, -Math.PI * 0.35, Math.PI * 0.35);
          ctx.stroke();
        } else if (this.level < 0) {
          // Smug goofy deflated smirk
          ctx.strokeStyle = '#2b0d17';
          ctx.lineWidth = 3.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-s * 0.65, s * 0.12);
          ctx.quadraticCurveTo(s * 0.15, s * 0.32, s * 0.75, -s * 0.18);
          ctx.stroke();
        } else {
          // Happy friendly monster smile with cute tiny fang
          ctx.fillStyle = '#5e1429';
          ctx.strokeStyle = '#2b0d17';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-s * 0.85, -s * 0.08);
          ctx.quadraticCurveTo(0, s * 0.95, s * 0.85, -s * 0.08);
          ctx.quadraticCurveTo(0, s * 0.16, -s * 0.85, -s * 0.08);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Cute tiny white tooth
          ctx.fillStyle = '#fffef2';
          ctx.beginPath();
          ctx.moveTo(-s * 0.45, s * 0.04);
          ctx.lineTo(-s * 0.28, s * 0.34);
          ctx.lineTo(-s * 0.15, s * 0.08);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }
    }

    /* =========================================================================
       5. VINTAGE MECHANICAL AIR PUMP & STRIPED RUBBER HOSE
       ========================================================================= */
    class AirPumpRig {
      constructor() {
        this.handlePos = 0;       // 0 = up, 1 = fully slammed down
        this.handleVel = 0;
        this.targetHandle = 0;
        this.bulgeProgress = -1;  // 0..1 traveling air bulge inside hose
        this.gaugeNeedle = 0;
        this.hoseLoose = false;
      }

      slam() {
        this.handlePos = 0.05;
        this.handleVel = 14;
        this.targetHandle = 1;
        this.bulgeProgress = 0;
      }

      update(dt, inflationLevel, isPopped) {
        this.hoseLoose = isPopped;

        // Slam down quickly, then spring back up smoothly
        if (this.targetHandle === 1 && this.handlePos > 0.92) {
          this.targetHandle = 0;
        }
        const k = this.targetHandle === 1 ? 180 : 32;
        const damp = Math.pow(this.targetHandle === 1 ? 0.08 : 0.03, dt);
        this.handleVel = (this.handleVel + (this.targetHandle - this.handlePos) * k * dt) * damp;
        this.handlePos = Math.max(0, Math.min(1.08, this.handlePos + this.handleVel * dt));

        // Traveling pressurized air bulge along the hose
        if (this.bulgeProgress >= 0) {
          this.bulgeProgress += dt * 3.8;
          if (this.bulgeProgress > 1.05) this.bulgeProgress = -1;
        }

        // Smooth analog pressure gauge on the pump cylinder
        const targetNeedle = isPopped ? 0 : Math.max(0, Math.min(1, inflationLevel / 10));
        this.gaugeNeedle += (targetNeedle - this.gaugeNeedle) * Math.min(1, dt * 6);
      }

      draw(ctx, time, pumpX, pumpY, scale, valvePt) {
        const s = scale;
        const outletX = pumpX + 22 * s;
        const outletY = pumpY - 18 * s;

        // Determine hose endpoint (connected to monster valve, or whipping playfully if popped)
        let endX = valvePt.x;
        let endY = valvePt.y;
        if (this.hoseLoose) {
          endX = pumpX + 125 * s + Math.sin(time * 12) * 14 * s;
          endY = pumpY - 12 * s + Math.cos(time * 15) * 10 * s;
        }

        // 1. Curved Striped Rubber Hose (drawn behind pump outlet lip)
        this._drawHose(ctx, outletX, outletY, endX, endY, s, time);

        // 2. Vintage Crimson & Brass Mechanical Air Pump
        ctx.save();
        ctx.translate(pumpX, pumpY);

        // Ground shadow
        ctx.fillStyle = 'rgba(42, 22, 6, 0.34)';
        ctx.beginPath();
        ctx.ellipse(0, 6 * s, 44 * s, 11 * s, 0, 0, Math.PI * 2);
        ctx.fill();

        // Piston shaft & wooden T-handle (animates vertically with handlePos)
        const travel = 54 * s;
        const handleY = -126 * s + this.handlePos * travel;

        // Shiny steel piston rod
        const rodGrad = ctx.createLinearGradient(-5 * s, 0, 5 * s, 0);
        rodGrad.addColorStop(0, '#96a5ad');
        rodGrad.addColorStop(0.45, '#f2f7fa');
        rodGrad.addColorStop(1, '#5d6b73');
        ctx.fillStyle = rodGrad;
        ctx.strokeStyle = '#333b40';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.rect(-5.5 * s, handleY + 6 * s, 11 * s, (-66 * s) - (handleY + 6 * s) + 12 * s);
        ctx.fill();
        ctx.stroke();

        // Carved wooden T-handle
        const handGrad = ctx.createLinearGradient(0, handleY - 9 * s, 0, handleY + 9 * s);
        handGrad.addColorStop(0, '#f5c77e');
        handGrad.addColorStop(0.55, '#c77f30');
        handGrad.addColorStop(1, '#7c4412');
        ctx.fillStyle = handGrad;
        ctx.strokeStyle = '#522908';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(-38 * s, handleY - 9 * s, 76 * s, 18 * s, 9 * s);
        ctx.fill();
        ctx.stroke();
        // Brass center collar on handle
        ctx.fillStyle = '#f2c85b';
        ctx.beginPath();
        ctx.roundRect(-10 * s, handleY - 10 * s, 20 * s, 20 * s, 4 * s);
        ctx.fill();
        ctx.stroke();

        // Crimson enamel pump cylinder barrel
        const cylW = 42 * s;
        const cylH = 82 * s;
        const cylGrad = ctx.createLinearGradient(-cylW * 0.5, 0, cylW * 0.5, 0);
        cylGrad.addColorStop(0, '#a62321');
        cylGrad.addColorStop(0.32, '#f05246');
        cylGrad.addColorStop(0.5, '#ff897d');
        cylGrad.addColorStop(0.85, '#c92d29');
        cylGrad.addColorStop(1, '#7a1514');
        ctx.fillStyle = cylGrad;
        ctx.strokeStyle = '#4e1210';
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.roundRect(-cylW * 0.5, -cylH - 8 * s, cylW, cylH, 10 * s);
        ctx.fill();
        ctx.stroke();

        // Brass top collar
        const brassGrad = ctx.createLinearGradient(-25 * s, 0, 25 * s, 0);
        brassGrad.addColorStop(0, '#996715');
        brassGrad.addColorStop(0.35, '#fce48d');
        brassGrad.addColorStop(0.7, '#d99e2e');
        brassGrad.addColorStop(1, '#754b0c');
        ctx.fillStyle = brassGrad;
        ctx.strokeStyle = '#523206';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.roundRect(-24 * s, -cylH - 14 * s, 48 * s, 14 * s, 6 * s);
        ctx.fill();
        ctx.stroke();

        // Mini analog pressure gauge mounted on pump barrel
        const gy = -cylH * 0.55 - 8 * s;
        ctx.fillStyle = '#f8e6b4';
        ctx.strokeStyle = '#9e6814';
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.arc(0, gy, 15 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // Danger red arc on mini gauge
        ctx.strokeStyle = '#de3c31';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, gy, 10.5 * s, -Math.PI * 0.3, Math.PI * 0.25);
        ctx.stroke();
        // Gauge needle
        const nAng = Math.PI * 0.8 + this.gaugeNeedle * Math.PI * 1.4;
        ctx.strokeStyle = '#2e1608';
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, gy);
        ctx.lineTo(Math.cos(nAng) * 10 * s, gy + Math.sin(nAng) * 10 * s);
        ctx.stroke();
        ctx.fillStyle = '#c4372d';
        ctx.beginPath();
        ctx.arc(0, gy, 3 * s, 0, Math.PI * 2);
        ctx.fill();

        // Brass foot-base pedals
        ctx.fillStyle = brassGrad;
        ctx.strokeStyle = '#523206';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(-38 * s, -12 * s, 76 * s, 14 * s, 7 * s);
        ctx.fill();
        ctx.stroke();

        // Brass side nozzle
        ctx.beginPath();
        ctx.roundRect(16 * s, -24 * s, 12 * s, 12 * s, 3 * s);
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      }

      _drawHose(ctx, x0, y0, x3, y3, s, time) {
        const sag = 34 * s;
        const cp1x = x0 + (x3 - x0) * 0.34;
        const cp1y = Math.max(y0, y3) + sag;
        const cp2x = x0 + (x3 - x0) * 0.68;
        const cp2y = Math.max(y0, y3) + sag * 0.65;

        const evalBezier = (t) => {
          const mt = 1 - t;
          return {
            x: mt * mt * mt * x0 + 3 * mt * mt * t * cp1x + 3 * mt * t * t * cp2x + t * t * t * x3,
            y: mt * mt * mt * y0 + 3 * mt * mt * t * cp1y + 3 * mt * t * t * cp2y + t * t * t * y3
          };
        };

        // Soft shadow on deck under hose
        ctx.strokeStyle = 'rgba(42, 22, 6, 0.22)';
        ctx.lineWidth = 14 * s;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x0, y0 + 10 * s);
        ctx.bezierCurveTo(cp1x, cp1y + 10 * s, cp2x, cp2y + 10 * s, x3, y3 + 10 * s);
        ctx.stroke();

        // Dark outer hose outline
        ctx.strokeStyle = '#294854';
        ctx.lineWidth = 15 * s;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x3, y3);
        ctx.stroke();

        // Teal rubber hose base
        ctx.strokeStyle = '#36a8b5';
        ctx.lineWidth = 10.5 * s;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x3, y3);
        ctx.stroke();

        // Vintage warm cream-gold stripes along the hose
        ctx.save();
        ctx.strokeStyle = '#ffe599';
        ctx.lineWidth = 10.5 * s;
        ctx.setLineDash([8 * s, 10 * s]);
        ctx.lineDashOffset = this.bulgeProgress >= 0 ? -this.bulgeProgress * 60 * s : 0;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x3, y3);
        ctx.stroke();
        ctx.restore();

        // Specular highlight along top of hose
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
        ctx.lineWidth = 3 * s;
        ctx.beginPath();
        ctx.moveTo(x0, y0 - 2.5 * s);
        ctx.bezierCurveTo(cp1x, cp1y - 2.5 * s, cp2x, cp2y - 2.5 * s, x3, y3 - 2.5 * s);
        ctx.stroke();

        // Glowing pressurized bulge racing along the hose!
        if (this.bulgeProgress >= 0 && this.bulgeProgress <= 1) {
          const p = evalBezier(this.bulgeProgress);
          const br = 14 * s;
          const bg = ctx.createRadialGradient(p.x - 3 * s, p.y - 3 * s, 2, p.x, p.y, br);
          bg.addColorStop(0, '#fffce0');
          bg.addColorStop(0.55, '#8af0d8');
          bg.addColorStop(1, '#268a96');
          ctx.fillStyle = bg;
          ctx.strokeStyle = '#1d4f59';
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.arc(p.x, p.y, br, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
      }
    }

    /* =========================================================================
       6. DIVERSE CELEBRATION & COMEDIC POP PARTICLE FX SYSTEM
       ========================================================================= */
    class FxSystem {
      constructor() {
        this.particles = [];
        this.rings = [];

      // Diverse celebratory bursts for levels 1..9 (rotates through 5 visual styles!)

              x: x + (Math.random() - 0.5) * 60,
              y: y + (Math.random() - 0.5) * 40,

              size: 10 + Math.random() * 16,
              phase: Math.random() * Math.PI * 2,

              life: 1.6 + Math.random() * 0.6,
              maxLife: 2.2,
              gravity: -65
            });
          }
        } else if (mode === 2) {
          // 3. Golden & rainbow star-sparks
          for (let i = 0; i < 26; i++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = 150 + Math.random() * 260;
            this.particles.push({
              kind: 'star',
              x, y,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd - 70,
              rot: Math.random() * Math.PI * 2,
              vrot: (Math.random() - 0.5) * 9,
              size: 9 + Math.random() * 9,
              color: i % 2 === 0 ? '#ffe156' : brightColors[i % brightColors.length],
              life: 1.15 + Math.random() * 0.45,
              maxLife: 1.6,
              gravity: 260
            });

        } else if (mode === 3) {

              size: 8 + Math.random() * 7,

          this.rings.push({ x, y, r: 22, maxR: 210, color: '#ffe66d', life: 0.75, maxLife: 0.75, width: 8 });

      // GIANT COMEDIC LEVEL-10 POP EXPLOSION!
      spawnBigPopExplosion(x, y, palette) {
        // Shockwave rings
        this.rings.push({ x, y, r: 30, maxR: 380, color: '#fff6b3', life: 0.65, maxLife: 0.65, width: 14 });
        this.rings.push({ x, y, r: 16, maxR: 290, color: palette.light, life: 0.55, maxLife: 0.55, width: 10 });

        const colors = [palette.light, palette.mid, palette.horn, '#ff6b6b', '#ffd166', '#4ecdc4', '#a0e85c', '#ff9ff3'];

        // 75 tumbling confetti ribbons
        for (let i = 0; i < 75; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 180 + Math.random() * 520;
          this.particles.push({
            kind: 'confetti',
            x, y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 160,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 14,
            flip: Math.random() * Math.PI * 2,
            vflip: 7 + Math.random() * 10,
            size: 9 + Math.random() * 9,
            color: colors[i % colors.length],
            life: 2.0 + Math.random() * 1.1,
            maxLife: 3.1,
            gravity: 270
          });
        }

        // 28 bouncy monster-colored jelly droplets
        for (let i = 0; i < 28; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 140 + Math.random() * 380;
          this.particles.push({
            kind: 'droplet',
            x, y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 130,
            size: 8 + Math.random() * 12,
            color: i % 2 === 0 ? palette.light : palette.mid,
            life: 1.5 + Math.random() * 0.7,
            maxLife: 2.2,
            gravity: 520
          });
        }

        // 24 golden stars & party spirals
        for (let i = 0; i < 24; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 160 + Math.random() * 400;
          this.particles.push({
            kind: i % 2 === 0 ? 'star' : 'spiral',
            x, y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 110,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 12,
            size: 11 + Math.random() * 10,
            color: colors[i % colors.length],
            life: 1.6 + Math.random() * 0.8,
            maxLife: 2.4,
            gravity: 220
          });
        }

        // 16 celebratory soap bubbles floating upward
        for (let i = 0; i < 16; i++) {
          this.particles.push({
            kind: 'bubble',
            x: x + (Math.random() - 0.5) * 120,
            y: y + (Math.random() - 0.5) * 100,
            vx: (Math.random() - 0.5) * 160,
            vy: -90 - Math.random() * 170,
            size: 12 + Math.random() * 18,
            phase: Math.random() * Math.PI * 2,
            color: colors[i % colors.length],
            life: 2.0 + Math.random() * 0.9,
            maxLife: 2.9,
            gravity: -45
          });
        }
      }

      update(dt, time) {
        for (let i = this.rings.length - 1; i >= 0; i--) {
          const rg = this.rings[i];
          rg.life -= dt;
          const t = 1 - Math.max(0, rg.life / rg.maxLife);
          rg.r = 20 + (rg.maxR - 20) * (1 - Math.pow(1 - t, 3));
          if (rg.life <= 0) this.rings.splice(i, 1);
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            this.particles.splice(i, 1);
            continue;
          }
          p.vy += p.gravity * dt;
          // Air drag
          const drag = p.kind === 'confetti' || p.kind === 'petal' ? 0.25 : 0.45;
          p.vx *= Math.pow(drag, dt);
          if (p.kind === 'confetti' || p.kind === 'petal') {
            p.x += Math.sin(time * 5 + p.rot) * 35 * dt;
          }
          if (p.kind === 'bubble') {
            p.x += Math.sin(time * 4 + p.phase) * 28 * dt;
          }
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.vrot) p.rot += p.vrot * dt;
          if (p.vflip) p.flip += p.vflip * dt;
        }
      }

      draw(ctx) {
        // Shockwave rings
        for (const rg of this.rings) {
          const alpha = Math.max(0, rg.life / rg.maxLife);
          ctx.save();
          ctx.globalAlpha = alpha * 0.85;
          ctx.strokeStyle = rg.color;
          ctx.lineWidth = rg.width * alpha;
          ctx.beginPath();
          ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // Particles
        for (const p of this.particles) {
          const alpha = Math.min(1, Math.max(0, p.life / (p.maxLife * 0.35)));
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(p.x, p.y);

          if (p.kind === 'confetti') {
            ctx.rotate(p.rot);
            ctx.scale(1, Math.cos(p.flip));
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.roundRect(-p.size * 0.65, -p.size * 0.35, p.size * 1.3, p.size * 0.7, 2);
            ctx.fill();
          } else if (p.kind === 'petal') {
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, p.size * 0.75, p.size * 0.42, 0, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.kind === 'bubble') {
            const g = ctx.createRadialGradient(-p.size * 0.3, -p.size * 0.3, 1, 0, 0, p.size);
            g.addColorStop(0, 'rgba(255,255,255,0.85)');
            g.addColorStop(0.55, 'rgba(200,248,255,0.22)');
            g.addColorStop(0.9, 'rgba(255,190,245,0.45)');
            g.addColorStop(1, 'rgba(255,255,255,0.75)');
            ctx.fillStyle = g;
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.arc(0, 0, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          } else if (p.kind === 'droplet') {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(0, 0, p.size * 0.55, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.beginPath();
            ctx.arc(-p.size * 0.18, -p.size * 0.18, p.size * 0.18, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.kind === 'star') {
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            for (let k = 0; k < 10; k++) {
              const rad = k % 2 === 0 ? p.size : p.size * 0.44;
              const a = (k / 10) * Math.PI * 2 - Math.PI / 2;
              if (k === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
              else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
            }
            ctx.closePath();
            ctx.fill();
          } else if (p.kind === 'sparkle') {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.moveTo(0, -p.size);
            ctx.quadraticCurveTo(0, 0, p.size, 0);
            ctx.quadraticCurveTo(0, 0, 0, p.size);
            ctx.quadraticCurveTo(0, 0, -p.size, 0);
            ctx.quadraticCurveTo(0, 0, 0, -p.size);
            ctx.fill();
          } else if (p.kind === 'spiral') {
            ctx.rotate(p.rot);
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 3.2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            for (let a = 0; a < Math.PI * 3.5; a += 0.35) {
              const rr = (a / (Math.PI * 3.5)) * p.size;
              const sx = Math.cos(a) * rr;
              const sy = Math.sin(a) * rr;
              if (a === 0) ctx.moveTo(sx, sy);
              else ctx.lineTo(sx, sy);
            }
            ctx.stroke();
          }
          ctx.restore();
        }
      }
    }

    /* =========================================================================
       7. MAIN GAME CONTROLLER & ANIMATION LOOP
       ========================================================================= */
    class GameApp {
      constructor() {
        this.stageCanvas = document.getElementById('stageCanvas');
        this.stageCtx = this.stageCanvas.getContext('2d');
        this.fxCanvas = document.getElementById('fxCanvas');
        this.fxCtx = this.fxCanvas.getContext('2d');

        this.exprEl = document.getElementById('expressionDisplay');
        this.plaqueHanger = document.getElementById('plaqueHanger');
        this.answerEl = document.getElementById('answerDisplay');
        this.dialEl = document.getElementById('pressureDial');
        this.submitBtn = document.getElementById('submitBtn');
        this.backBtn = document.getElementById('backBtn');
        this.nextBtn = document.getElementById('nextBtn');
        this.muteBtn = document.getElementById('muteBtn');
        this.soundOnIcon = document.getElementById('soundOnIcon');
        this.soundOffIcon = document.getElementById('soundOffIcon');

        this.sound = new SoundEngine();
        this.math = new MathGenerator();
        this.meadow = new MeadowWorld();
        this.monster = new MonsterCharacter();
        this.pump = new AirPumpRig();
        this.fx = new FxSystem();

        this.currentTask = null;
        this.inputDigits = '';
        this.locked = false;
        this.popSequenceActive = false;

        // Pendulum spring physics for the hanging wooden plaque
        this.plaqueAngle = 0;
        this.plaqueVel = 0;

        this.w = window.innerWidth;
        this.h = window.innerHeight;
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);

        this.bindEvents();
        this.resize();
        this.loadNextTask(false);

        this.lastTime = performance.now();
        requestAnimationFrame(this.loop.bind(this));
      }

      bindEvents() {
        window.addEventListener('resize', () => this.resize());

        // Track pointer for monster's glossy eyes
        const onPointer = (clientX, clientY) => {
          this.monster.mouseX = clientX / Math.max(1, this.w);
          this.monster.mouseY = clientY / Math.max(1, this.h);
        };
        window.addEventListener('mousemove', e => onPointer(e.clientX, e.clientY));
        window.addEventListener('touchstart', e => {
          this.sound.unlock();
          if (e.touches[0]) onPointer(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        window.addEventListener('pointerdown', () => this.sound.unlock());

        // Digit buttons
        document.querySelectorAll('[data-digit]').forEach(btn => {
          btn.addEventListener('click', () => {
            this.sound.unlock();
            this.appendDigit(btn.dataset.digit);
          });
        });

        this.backBtn.addEventListener('click', () => {
          this.sound.unlock();
          this.deleteDigit();
        });

        this.submitBtn.addEventListener('click', () => {
          this.sound.unlock();
          this.submitAnswer();
        });

        // Minimalist Next / Skip icon button
        this.nextBtn.addEventListener('click', () => {
          this.sound.unlock();
          if (this.popSequenceActive) return;
          this.sound.playSkipWhoosh();
          this.locked = false;
          this.loadNextTask(true);
        });

        // Sound Mute toggle button
        this.muteBtn.addEventListener('click', () => {
          this.sound.unlock();
          const muted = this.sound.toggleMute();
          this.soundOnIcon.style.display = muted ? 'none' : 'block';
          this.soundOffIcon.style.display = muted ? 'block' : 'none';
        });

        // Full physical keyboard support
        window.addEventListener('keydown', e => {
          this.sound.unlock();
          if (e.key >= '0' && e.key <= '9') {
            this._flashKey(`[data-digit="${e.key}"]`);
            this.appendDigit(e.key);
          } else if (e.key === 'Backspace' || e.key === 'Delete') {
            e.preventDefault();
            this._flashKey('#backBtn');
            this.deleteDigit();
          } else if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            this._flashKey('#submitBtn');
            this.submitAnswer();
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            if (!this.popSequenceActive) {
              this.sound.playSkipWhoosh();
              this.locked = false;
              this.loadNextTask(true);
            }
          }
        });
      }

      _flashKey(selector) {
        const el = document.querySelector(selector);
        if (!el) return;
        el.classList.add('pressed');
        setTimeout(() => el.classList.remove('pressed'), 120);
      }

      resize() {
        this.w = window.innerWidth;
        this.h = window.innerHeight;
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);

        [this.stageCanvas, this.fxCanvas].forEach(c => {
          c.width = Math.floor(this.w * this.dpr);
          c.height = Math.floor(this.h * this.dpr);
        });
        this.stageCtx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
        this.fxCtx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      }

      _getStageMetrics() {
        const isStacked = this.w / Math.max(1, this.h) <= 1.1;
        if (isStacked) {
          const deckY = this.h * 0.41;
          const baseR = Math.min(this.w * 0.095, this.h * 0.085, 62);
          return {
            deckY,
            baseR,
            monsterX: this.w * 0.57,
            monsterY: deckY + 8,
            pumpX: this.w * 0.25,
            pumpY: deckY + 12,
            pumpScale: baseR / 62
          };
        }
        const deckY = this.h * 0.80;
        const baseR = Math.min(this.w * 0.062, this.h * 0.115, 76);
        return {
          deckY,
          baseR,
          monsterX: this.w * 0.34,
          monsterY: deckY + 14,
          pumpX: this.w * 0.115,
          pumpY: deckY + 20,
          pumpScale: Math.max(0.75, baseR / 66)
        };
      }

      loadNextTask(withSwing = true) {
        this.currentTask = this.math.generate();
        this.inputDigits = '';
        this.renderAnswer();
        this.renderExpression();
        if (withSwing) {
          this.plaqueVel += (Math.random() > 0.5 ? 1 : -1) * 26;
        }
      }

      renderExpression() {
        const raw = this.currentTask.text;
        // Colorize operators and parentheses subtly while keeping ONLY math characters
        const html = raw
          .replace(/([+−×:])/g, '<span class="op">$1</span>')
          .replace(/([()])/g, '<span class="paren">$1</span>');
        this.exprEl.innerHTML = html;

        // Auto-fit font size for longer 3-step expressions
        const len = raw.length;
        if (len >= 16) {
          this.exprEl.style.fontSize = 'clamp(22px, 2.7vw, 38px)';
        } else if (len >= 12) {
          this.exprEl.style.fontSize = 'clamp(25px, 3.2vw, 44px)';
        } else {
          this.exprEl.style.fontSize = 'clamp(28px, 3.7vw, 52px)';
        }

        this.exprEl.classList.remove('expr-pop');
        void this.exprEl.offsetWidth;
        this.exprEl.classList.add('expr-pop');
      }

      renderAnswer() {
        if (this.inputDigits.length === 0) {
          this.answerEl.innerHTML = '<span class="dial-dot"></span>';
          this.submitBtn.classList.remove('ready-pulse');
        } else {
          this.answerEl.textContent = this.inputDigits;
          this.submitBtn.classList.add('ready-pulse');
        }
      }

      appendDigit(d) {
        if (this.locked || this.popSequenceActive) return;
        if (this.inputDigits.length >= 3) return;
        if (this.inputDigits === '0') {
          this.inputDigits = d;
        } else {
          this.inputDigits += d;
        }
        this.sound.playDigit(parseInt(d, 10));
        this.renderAnswer();
      }

      deleteDigit() {
        if (this.locked || this.popSequenceActive) return;
        if (this.inputDigits.length === 0) return;
        this.inputDigits = this.inputDigits.slice(0, -1);
        this.sound.playBackspace();
        this.renderAnswer();
      }

      submitAnswer() {
        if (this.locked || this.popSequenceActive) return;
        if (this.inputDigits.length === 0) {
          this.dialEl.classList.remove('shake-wrong');
          void this.dialEl.offsetWidth;
          this.dialEl.classList.add('shake-wrong');
          this.sound.playBackspace();
          return;
        }

        const guess = parseInt(this.inputDigits, 10);
        if (guess === this.currentTask.answer) {
          this.handleCorrect();
        } else {
          this.handleWrong();
        }
      }

      handleCorrect() {
        this.locked = true;
        const nextLevel = this.monster.level + 1;
        const metrics = this._getStageMetrics();

        // Glow dial & slam mechanical air pump
        this.dialEl.classList.add('glow-correct');
        this.pump.slam();
        this.sound.playPumpInflate(nextLevel);
        this.plaqueVel += 12;

        // Moment the pressurized bulge reaches the monster (~220ms)
        setTimeout(() => {
          this.monster.triggerInflate(nextLevel);
          const burstY = metrics.monsterY - metrics.baseR * (1.2 + nextLevel * 0.08);

          if (nextLevel >= 10) {
            // LEVEL 10: Dramatic buildup -> HILARIOUS POP -> Brand-new monster!
            this.popSequenceActive = true;
            this.sound.playPrePopTension();

            setTimeout(() => {
              const popPalette = this.monster.palette;
              this.monster.triggerPop();
              this.sound.playBigPop();
              this.fx.spawnBigPopExplosion(metrics.monsterX, burstY - 18, popPalette);
              this.plaqueVel -= 38;
              this.dialEl.classList.remove('glow-correct');

              // After celebratory explosion (~2.2s), parachute in a fresh new monster!
              setTimeout(() => {
                this.monster.resetSpecies(true);
                this.popSequenceActive = false;
                this.locked = false;
                this.loadNextTask(true);
              }, 2200);
            }, 950);
          } else {
            // Normal level 1..9 celebration & smooth next task
            this.fx.spawnCorrectBurst(metrics.monsterX, burstY);
            setTimeout(() => {
              this.dialEl.classList.remove('glow-correct');
              this.locked = false;
              this.loadNextTask(true);
            }, 640);
          }
        }, 220);
      }

      handleWrong() {
        this.locked = true;
        const nextLevel = Math.max(-3, this.monster.level - 1);

        // Shake brass pressure dial & clear input
        this.dialEl.classList.remove('shake-wrong');
        void this.dialEl.offsetWidth;
        this.dialEl.classList.add('shake-wrong');

        // Monster giggles, sticks out undulating pink tongue, and deflates!
        this.monster.triggerDeflateGiggle(nextLevel);
        this.sound.playWrongGiggleDeflate();
        this.plaqueVel -= 18;

        setTimeout(() => {
          this.inputDigits = '';
          this.renderAnswer();
          this.locked = false;
        }, 520);
      }

      loop(now) {
        const dt = Math.min(0.05, (now - this.lastTime) / 1000);
        this.lastTime = now;
        const time = now * 0.001;

        const m = this._getStageMetrics();

        // Update hanging wooden plaque pendulum physics
        const pForce = -this.plaqueAngle * 34;
        this.plaqueVel = (this.plaqueVel + pForce * dt) * Math.pow(0.06, dt);
        this.plaqueAngle += this.plaqueVel * dt;
        const gentleBreeze = Math.sin(time * 1.45) * 0.55;
        this.plaqueHanger.style.transform = `rotate(${(this.plaqueAngle + gentleBreeze).toFixed(2)}deg)`;

        // Update living world, monster, pump & celebration particles
        this.meadow.update(dt, time);
        this.monster.update(dt, time, m.monsterX, m.monsterY, m.baseR, () => {
          this.sound.playMonsterArrive();
        });
        this.pump.update(dt, this.monster.visualLevel, this.monster.state === 'popped');
        this.fx.update(dt, time);

        // Render Stage Canvas
        const sctx = this.stageCtx;
        sctx.clearRect(0, 0, this.w, this.h);
        this.meadow.draw(sctx, this.w, this.h, time, m.deckY);

        const valvePt = this.monster.getValvePoint(m.monsterX, m.monsterY, m.baseR);
        // Compute accurate valve Y accounting for current monster center
        const dims = this.monster._computeBodyDims(m.baseR);
        valvePt.y = (m.monsterY - dims.ry * 0.96 - dims.lift + this.monster.dropY) + dims.ry * 0.14;

        this.pump.draw(sctx, time, m.pumpX, m.pumpY, m.pumpScale, valvePt);
        this.monster.draw(sctx, time, m.monsterX, m.monsterY, m.baseR);

        // Render Foreground Particle FX Canvas
        const fctx = this.fxCtx;
        fctx.clearRect(0, 0, this.w, this.h);
        this.fx.draw(fctx);

        requestAnimationFrame(this.loop.bind(this));
      }
    }

    window.addEventListener('load', () => {
      try {
        new GameApp();
      } catch (err) {
        console.error(err);
      }
    });
  })();
  </script>
