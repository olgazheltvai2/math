<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3–4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-main: 'Fredoka', 'Trebuchet MS', 'Rounded Mplus 1c', system-ui, sans-serif;
      --wood-light: #e7b36b;
      --wood-mid: #c9883e;
      --wood-dark: #8e531f;
      --wood-deep: #5e3210;
      --brass-light: #f9df8b;
      --brass-mid: #d69f3a;
      --brass-dark: #8e5e14;
      --teal-console-1: #237c75;
      --teal-console-2: #165956;
      --teal-console-3: #0e3d3c;
      --cream-ink: #2c180a;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-main);
      background: #77c6eb;
    }

    /* Full-screen living background + monster stage canvas */
    #stageCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }

    /* Foreground celebration & pop particle overlay canvas */
    #fxCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 20;
      pointer-events: none;
    }

    /* Minimalist top-right icon controls (Next / Mute) */
    .top-controls {
      position: fixed;
      top: clamp(12px, 2vh, 22px);
      right: clamp(14px, 2vw, 26px);
      display: flex;
      gap: 12px;
      z-index: 30;
    }

    .mini-icon-btn {
      width: clamp(44px, 4.4vw, 56px);
      height: clamp(44px, 4.4vw, 56px);
      border-radius: 50%;
      border: 3px solid #f7dc88;
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 250, 220, 0.55), transparent 50%),
        linear-gradient(155deg, #429e68 0%, #236d4a 65%, #164b33 100%);
      box-shadow:
        0 6px 0 #123b28,
        0 10px 20px rgba(15, 42, 28, 0.35),
        inset 0 2px 3px rgba(255, 255, 255, 0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease, filter 0.14s ease;
      position: relative;
      overflow: hidden;
    }

    .mini-icon-btn.next-btn {
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 245, 200, 0.65), transparent 50%),
        linear-gradient(155deg, #f3a83b 0%, #d46d1e 65%, #a1440d 100%);
      box-shadow:
        0 6px 0 #783008,
        0 10px 20px rgba(78, 30, 5, 0.35),
        inset 0 2px 3px rgba(255, 255, 255, 0.5);
    }

    .mini-icon-btn:hover {
      transform: translateY(-2px) scale(1.06);
      filter: brightness(1.08);
    }

    .mini-icon-btn:active {
      transform: translateY(4px) scale(0.95);
      box-shadow: 0 2px 0 #123b28, 0 4px 8px rgba(0, 0, 0, 0.25);
    }

    .mini-icon-btn.next-btn:active {
      box-shadow: 0 2px 0 #783008, 0 4px 8px rgba(0, 0, 0, 0.25);
    }

    .mini-icon-btn svg {
      width: 56%;
      height: 56%;
      filter: drop-shadow(0 2px 2px rgba(20, 12, 4, 0.35));
    }

    /* Main widescreen UI layout: Right ~46% panel over living meadow */
    .ui-shell {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      pointer-events: none;
    }

    .stage-spacer {
      flex: 0 0 53%;
      height: 100%;
    }

    .right-panel {
      flex: 1 1 47%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(14px, 2.2vh, 28px) clamp(18px, 3vw, 44px) clamp(16px, 2.4vh, 28px) clamp(8px, 1.2vw, 20px);
      gap: clamp(14px, 2.5vh, 28px);
      pointer-events: none;
    }

    /* Hanging Carved Wooden Math Plaque */
    .plaque-hanger {
      position: relative;
      width: 100%;
      max-width: 560px;
      pointer-events: auto;
      transform-origin: 50% -60px;
      will-change: transform;
    }

    /* Two braided ropes hanging from top of viewport */
    .rope {
      position: absolute;
      bottom: calc(100% - 14px);
      width: 10px;
      height: 36vh;
      border-radius: 6px;
      background:
        repeating-linear-gradient(
          -45deg,
          #d7a65c 0px,
          #d7a65c 5px,
          #9e6b2d 5px,
          #9e6b2d 10px
        );
      box-shadow:
        inset 2px 0 2px rgba(255, 240, 195, 0.45),
        inset -2px 0 3px rgba(68, 38, 10, 0.5),
        3px 0 8px rgba(34, 24, 8, 0.25);
      z-index: 1;
    }

    .rope.left { left: 15%; }
    .rope.right { right: 15%; }

    .wood-plaque {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: clamp(104px, 15.5vh, 148px);
      padding: clamp(16px, 2.4vh, 26px) clamp(22px, 3vw, 38px);
      border-radius: 36px 38px 34px 36px / 32px 30px 36px 34px;
      border: 5px solid #6b3b13;
      /* Carved layered warm honey-oak wood with organic woodgrain stripes */
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255, 240, 190, 0.42), transparent 58%),
        radial-gradient(ellipse at 50% 100%, rgba(102, 49, 12, 0.35), transparent 55%),
        repeating-linear-gradient(
          3deg,
          rgba(128, 66, 18, 0.08) 0px,
          rgba(128, 66, 18, 0.08) 3px,
          transparent 3px,
          transparent 13px
        ),
        repeating-linear-gradient(
          -2deg,
          rgba(255, 224, 156, 0.14) 0px,
          rgba(255, 224, 156, 0.14) 4px,
          transparent 4px,
          transparent 19px
        ),
        linear-gradient(180deg, #f1c176 0%, #d99744 48%, #b77125 100%);
      box-shadow:
        0 10px 0 #6b3b13,
        0 18px 34px rgba(38, 22, 6, 0.38),
        inset 0 4px 6px rgba(255, 242, 200, 0.65),
        inset 0 -6px 10px rgba(96, 48, 12, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Inner carved recessed wood tablet */
    .wood-plaque-inner {
      position: relative;
      width: 100%;
      min-height: clamp(72px, 10.5vh, 102px);
      border-radius: 24px;
      border: 3px solid rgba(114, 58, 15, 0.45);
      background:
        radial-gradient(circle at 20% 25%, rgba(255, 244, 206, 0.52), transparent 55%),
        radial-gradient(circle at 82% 80%, rgba(240, 193, 114, 0.45), transparent 60%),
        repeating-linear-gradient(
          1deg,
          rgba(160, 95, 32, 0.06) 0px,
          rgba(160, 95, 32, 0.06) 2px,
          transparent 2px,
          transparent 10px
        ),
        linear-gradient(180deg, #fae0a5 0%, #f1c87a 55%, #e5b35e 100%);
      box-shadow:
        inset 0 4px 10px rgba(105, 55, 14, 0.35),
        inset 0 -2px 4px rgba(255, 246, 214, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
    }

    /* Folk botanical corner ornaments inside the wooden plaque */
    .plaque-ornament {
      position: absolute;
      width: clamp(32px, 3.6vw, 46px);
      height: clamp(32px, 3.6vw, 46px);
      pointer-events: none;
      opacity: 0.9;
    }
    .plaque-ornament.tl { top: 4px; left: 5px; }
    .plaque-ornament.tr { top: 4px; right: 5px; transform: scaleX(-1); }
    .plaque-ornament.bl { bottom: 4px; left: 5px; transform: scaleY(-1); }
    .plaque-ornament.br { bottom: 4px; right: 5px; transform: scale(-1, -1); }

    /* Brass rivets where ropes attach */
    .rivet {
      position: absolute;
      top: 9px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff4bd, #d59a2e 55%, #7d4e0b 100%);
      border: 2px solid #5a3408;
      box-shadow: 0 2px 3px rgba(45, 20, 4, 0.45);
      z-index: 4;
    }
    .rivet.left { left: 15%; transform: translateX(-2px); }
    .rivet.right { right: 15%; transform: translateX(2px); }

    /* Expression text (ONLY math digits & operators) */
    #expressionDisplay {
      position: relative;
      z-index: 3;
      font-size: clamp(28px, 3.7vw, 52px);
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #3a1d0b;
      text-shadow:
        0 2px 0 rgba(255, 244, 210, 0.85),
        0 4px 10px rgba(96, 44, 10, 0.16);
      white-space: nowrap;
      line-height: 1.1;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.18s ease;
    }

    #expressionDisplay .op {
      color: #b73b1d;
      margin: 0 0.06em;
    }

    #expressionDisplay .paren {
      color: #1d6b66;
      font-weight: 700;
    }

    #expressionDisplay.expr-pop {
      animation: exprPopIn 0.36s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes exprPopIn {
      0% { transform: scale(0.72) rotate(-3deg); opacity: 0; }
      65% { transform: scale(1.07) rotate(1.2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    /* Stylized Botanical Enamel Input Console */
    .console-body {
      position: relative;
      width: 100%;
      max-width: 500px;
      padding: clamp(16px, 2.2vh, 24px) clamp(18px, 2.4vw, 28px) clamp(18px, 2.5vh, 26px);
      border-radius: 42px 44px 48px 46px / 38px 40px 44px 42px;
      border: 5px solid #f0cd79;
      background:
        radial-gradient(circle at 18% 12%, rgba(133, 232, 206, 0.25), transparent 45%),
        radial-gradient(circle at 86% 88%, rgba(15, 58, 56, 0.55), transparent 55%),
        radial-gradient(circle at 12px 12px, rgba(246, 212, 130, 0.14) 2px, transparent 2.5px),
        linear-gradient(165deg, #278a81 0%, #196863 52%, #114746 100%);
      background-size: 100% 100%, 100% 100%, 24px 24px, 100% 100%;
      box-shadow:
        0 12px 0 #0c3332,
        0 22px 40px rgba(10, 38, 36, 0.42),
        inset 0 4px 8px rgba(178, 250, 235, 0.35),
        inset 0 -6px 12px rgba(8, 34, 34, 0.55);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 1.9vh, 18px);
    }

    /* Brass Pressure Dial Row */
    .dial-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .pressure-dial {
      position: relative;
      flex: 1;
      max-width: 310px;
      height: clamp(62px, 8.6vh, 78px);
      border-radius: 999px;
      border: 5px solid #e7b854;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(255, 253, 240, 0.72), transparent 52%),
        repeating-linear-gradient(
          90deg,
          rgba(165, 118, 42, 0.08) 0px,
          rgba(165, 118, 42, 0.08) 2px,
          transparent 2px,
          transparent 18px
        ),
        linear-gradient(180deg, #f8e9be 0%, #edd395 60%, #dfb86b 100%);
      box-shadow:
        0 5px 0 #7b4d12,
        0 10px 18px rgba(10, 35, 34, 0.36),
        inset 0 5px 12px rgba(96, 58, 12, 0.34),
        inset 0 -3px 6px rgba(255, 248, 224, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.16s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* Curved specular glass arc across the dial */
    .pressure-dial::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 8%;
      right: 8%;
      height: 36%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.04));
      pointer-events: none;
    }

    /* Decorative brass gauge tick arcs on left/right of dial */
    .dial-ticks {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.45;
    }

    #answerDisplay {
      position: relative;
      z-index: 2;
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 700;
      color: #2c190a;
      letter-spacing: 0.1em;
      text-shadow: 0 2px 0 rgba(255, 248, 224, 0.8);
      min-height: 1em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animated subtle amber cursor dot when dial is empty */
    .dial-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f5b95b, #b7671a);
      opacity: 0.55;
      animation: dotBreathe 1.4s ease-in-out infinite;
    }

    @keyframes dotBreathe {
      0%, 100% { transform: scale(0.85); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.75; }
    }

    .pressure-dial.shake-wrong {
      animation: dialShake 0.46s cubic-bezier(0.36, 0.07, 0.19, 0.97);
      border-color: #ef6a4e;
    }

    .pressure-dial.glow-correct {
      border-color: #8bf07e;
      box-shadow:
        0 5px 0 #3f7d24,
        0 0 24px rgba(139, 240, 126, 0.75),
        inset 0 5px 10px rgba(56, 130, 32, 0.28);
      transform: scale(1.04);
    }

    @keyframes dialShake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      18% { transform: translateX(-10px) rotate(-2deg); }
      38% { transform: translateX(9px) rotate(2deg); }
      58% { transform: translateX(-7px) rotate(-1.2deg); }
      78% { transform: translateX(5px) rotate(0.8deg); }
    }

    /* Number & Action Keypad Grid (4 columns x 3 rows) */
    .keypad-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(9px, 1.3vw, 14px);
    }

    /* Tactile Colorful Glossy Pebble/Enamel Buttons */
    .key-btn {
      position: relative;
      height: clamp(54px, 8.2vh, 74px);
      border-radius: 22px 24px 20px 22px / 20px 22px 24px 20px;
      border: 3px solid rgba(255, 244, 210, 0.65);
      font-family: var(--font-main);
      font-size: clamp(24px, 3vw, 36px);
      font-weight: 700;
      color: #fffdf5;
      text-shadow: 0 2px 3px rgba(40, 18, 6, 0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, filter 0.12s ease;
    }

    /* Soft glossy highlight bubble on top of each enamel button */
    .key-btn::before {
      content: "";
      position: absolute;
      top: 4px;
      left: 10%;
      right: 10%;
      height: 36%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.46), rgba(255, 255, 255, 0.04));
      pointer-events: none;
    }

    /* Decorative subtle polka-dot shimmer inside each enamel key */
    .key-btn::after {
      content: "";
      position: absolute;
      bottom: 6px;
      right: 8px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      box-shadow: -13px 3px 0 -2px rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }

    .key-btn:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.07);
    }

    .key-btn:active,
    .key-btn.pressed {
      transform: translateY(4px) scale(0.95);
    }

    /* Vibrant storybook color themes across keys */
    .key-c1 {
      background: linear-gradient(160deg, #ffbe4f 0%, #ea8a1d 70%, #c7680d 100%);
      box-shadow: 0 6px 0 #8d4506, 0 10px 16px rgba(10, 32, 30, 0.3);
    }
    .key-c1:active, .key-c1.pressed { box-shadow: 0 2px 0 #8d4506; }

    .key-c2 {
      background: linear-gradient(160deg, #65c97a 0%, #339b56 70%, #1e733c 100%);
      box-shadow: 0 6px 0 #144f29, 0 10px 16px rgba(10, 32, 30, 0.3);
    }
    .key-c2:active, .key-c2.pressed { box-shadow: 0 2px 0 #144f29; }

    .key-c3 {
      background: linear-gradient(160deg, #56b9e8 0%, #2686c5 70%, #186299 100%);
      box-shadow: 0 6px 0 #104269, 0 10px 16px rgba(10, 32, 30, 0.3);
    }
    .key-c3:active, .key-c3.pressed { box-shadow: 0 2px 0 #104269; }

    .key-c4 {
      background: linear-gradient(160deg, #f37f8c 0%, #d94b63 70%, #ad2f46 100%);
      box-shadow: 0 6px 0 #761b2d, 0 10px 16px rgba(10, 32, 30, 0.3);
    }
    .key-c4:active, .key-c4.pressed { box-shadow: 0 2px 0 #761b2d; }

    .key-c5 {
      background: linear-gradient(160deg, #b686e8 0%, #8653c4 70%, #64369c 100%);
      box-shadow: 0 6px 0 #44216e, 0 10px 16px rgba(10, 32, 30, 0.3);
    }
    .key-c5:active, .key-c5.pressed { box-shadow: 0 2px 0 #44216e; }

    /* Backspace pebble button */
    .key-back {
      background: linear-gradient(160deg, #f29263 0%, #cf572b 70%, #a03814 100%);
      box-shadow: 0 6px 0 #6e2309, 0 10px 16px rgba(10, 32, 30, 0.32);
    }
    .key-back:active, .key-back.pressed { box-shadow: 0 2px 0 #6e2309; }

    /* Hero Pump-Trigger Submit Button (spans 2 vertical rows on right column or wide bottom) */
    .key-submit {
      grid-column: 4;
      grid-row: 2 / span 2;
      height: auto;
      border-radius: 26px;
      border: 4px solid #fff0a6;
      background:
        radial-gradient(circle at 35% 22%, rgba(255, 255, 220, 0.5), transparent 50%),
        linear-gradient(165deg, #87e04d 0%, #3cb83c 55%, #1d872c 100%);
      box-shadow:
        0 7px 0 #125c1d,
        0 14px 24px rgba(10, 40, 20, 0.38),
        inset 0 3px 5px rgba(255, 255, 220, 0.55);
    }
    .key-submit:active, .key-submit.pressed {
      box-shadow: 0 2px 0 #125c1d;
    }

    .key-submit.ready-pulse {
      animation: submitPulse 1.35s ease-in-out infinite;
    }

    @keyframes submitPulse {
      0%, 100% {
        filter: brightness(1);
        box-shadow: 0 7px 0 #125c1d, 0 0 12px rgba(154, 245, 92, 0.45);
      }
      50% {
        filter: brightness(1.1);
        box-shadow: 0 7px 0 #125c1d, 0 0 26px rgba(182, 255, 112, 0.85);
      }
    }

    .key-btn svg {
      width: 44%;
      height: 44%;
      max-width: 44px;
      max-height: 44px;
      filter: drop-shadow(0 2px 3px rgba(32, 16, 4, 0.4));
    }

    .key-submit svg {
      width: 60%;
      height: 60%;
      max-width: 62px;
      max-height: 62px;
    }

    /* Responsive adjustments for smaller or portrait-ish screens */
    @media (max-width: 900px) {
      .stage-spacer {
        flex: 0 0 46%;
      }
      .right-panel {
        flex: 1 1 54%;
        padding: 12px 14px;
        gap: 12px;
      }
      .wood-plaque {
        padding: 12px 14px;
      }
      .console-body {
        padding: 12px 14px 14px;
        border-radius: 30px;
      }
    }

    @media (max-aspect-ratio: 11/10) {
      .ui-shell {
        flex-direction: column;
      }
      .stage-spacer {
        flex: 0 0 46%;
        width: 100%;
      }
      .right-panel {
        flex: 1 1 54%;
        width: 100%;
        padding: 8px 16px 14px;
        justify-content: flex-start;
        gap: 10px;
      }
      .rope {
        display: none;
      }
      .wood-plaque {
        min-height: 76px;
        padding: 10px 14px;
      }
      .wood-plaque-inner {
        min-height: 54px;
      }
      .key-btn {
        height: 48px;
      }
      .pressure-dial {
        height: 50px;
      }
    }
  </style>
</head>
<body>
  <!-- Fullscreen living meadow + monster + mechanical air pump canvas -->
  <canvas id="stageCanvas"></canvas>

  <!-- Minimalist Top-Right Icon Buttons (NO words) -->
  <div class="top-controls">
    <button id="nextBtn" class="mini-icon-btn next-btn" type="button" aria-label="Next">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M9 12.5L23.5 24L9 35.5V12.5Z" fill="#FFF7DF" stroke="#5E2908" stroke-width="3" stroke-linejoin="round"/>
        <path d="M24.5 12.5L39 24L24.5 35.5V12.5Z" fill="#FFF7DF" stroke="#5E2908" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="muteBtn" class="mini-icon-btn" type="button" aria-label="Sound">
      <svg id="soundOnIcon" viewBox="0 0 48 48" fill="none">
        <path d="M9 18H17.5L27.5 10V38L17.5 30H9C7.3 30 6 28.7 6 27V21C6 19.3 7.3 18 9 18Z" fill="#FFF7DF" stroke="#133D28" stroke-width="3" stroke-linejoin="round"/>
        <path d="M33.5 17C36.3 19.8 36.3 28.2 33.5 31" stroke="#FFF7DF" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M38.5 12.5C43 17.5 43 30.5 38.5 35.5" stroke="#FFF7DF" stroke-width="3.6" stroke-linecap="round"/>
      </svg>
      <svg id="soundOffIcon" viewBox="0 0 48 48" fill="none" style="display:none;">

  <script>
  (() => {
    'use strict';

    /* =========================================================================
       1. WEB AUDIO API PROCEDURAL SOUND ENGINE (PLAYFUL, DIVERSE, ZERO WORDS)
       ========================================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.celebrationIndex = 0;
        // Pleasant C-major pentatonic frequencies for keypad digits 0..9
        this.digitFreqs = [
          261.63, // 0: C4
          293.66, // 1: D4
          329.63, // 2: E4
          392.00, // 3: G4
          440.00, // 4: A4
          523.25, // 5: C5
          587.33, // 6: D5
          659.25, // 7: E5
          783.99, // 8: G5
          880.00  // 9: A5
        ];
      }

      unlock() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        } catch (e) {
          // Audio unavailable gracefully
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }

      _now() {
        this.unlock();
        return this.ctx ? this.ctx.currentTime : 0;
      }

      _makeNoiseBuffer(duration = 0.6) {
        const sr = this.ctx.sampleRate;
        const len = Math.floor(sr * duration);
        const buf = this.ctx.createBuffer(1, len, sr);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        return buf;
      }

      // Warm wooden marimba tap for digits
      playDigit(digit) {
        if (this.muted) return;
        const t = this._now();
        if (!this.ctx) return;
        const freq = this.digitFreqs[digit % 10] || 440;

        const osc = this.ctx.createOscillator();
        const over = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        over.type = 'triangle';
        over.frequency.setValueAtTime(freq * 2.01, t);

        const overGain = this.ctx.createGain();
        overGain.gain.setValueAtTime(0.18, t);
        overGain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.22, t + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);

        osc.connect(gain);
        over.connect(overGain);
        overGain.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(t);
        over.start(t);
        osc.stop(t + 0.24);
        over.stop(t + 0.12);
      }

      playBackspace() {
        if (this.muted) return;
        const t = this._now();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(340, t);
        osc.frequency.exponentialRampToValueAtTime(175, t + 0.11);
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.13);
      }

      playSkipWhoosh() {
        if (this.muted) return;
        const t = this._now();
        if (!this.ctx) return;
        const src = this.ctx.createBufferSource();
        src.buffer = this._makeNoiseBuffer(0.28);
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 2.4;
        filter.frequency.setValueAtTime(500, t);
        filter.frequency.exponentialRampToValueAtTime(2100, t + 0.14);
        filter.frequency.exponentialRampToValueAtTime(800, t + 0.26);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.16, t + 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.27);

        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        src.start(t);

        // Light wooden chime
        const osc = this.ctx.createOscillator();
        const og = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, t + 0.04);
        osc.frequency.exponentialRampToValueAtTime(659.25, t + 0.16);
        og.gain.setValueAtTime(0.09, t + 0.04);
        og.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(og);
        og.connect(this.ctx.destination);
        osc.start(t + 0.04);
        osc.stop(t + 0.22);
      }

      // Pump slam + pressurized air hose whoosh + monster inflate bloop
      playPumpInflate(level) {
        if (this.muted) return;
        const t = this._now();
        if (!this.ctx) return;

        // 1. Mechanical pump handle slam thump
        const thump = this.ctx.createOscillator();
        const tg = this.ctx.createGain();
        thump.type = 'sine';
        thump.frequency.setValueAtTime(150, t);
        thump.frequency.exponentialRampToValueAtTime(52, t + 0.12);
        tg.gain.setValueAtTime(0.28, t);
        tg.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
        thump.connect(tg);
        tg.connect(this.ctx.destination);
        thump.start(t);
        thump.stop(t + 0.15);

        // 2. Air rushing through hose
        const air = this.ctx.createBufferSource();
        air.buffer = this._makeNoiseBuffer(0.32);
        const filt = this.ctx.createBiquadFilter();
        filt.type = 'bandpass';
        filt.Q.value = 1.8;
        filt.frequency.setValueAtTime(750, t + 0.03);
        filt.frequency.exponentialRampToValueAtTime(2400, t + 0.25);
        const ag = this.ctx.createGain();
        ag.gain.setValueAtTime(0.001, t + 0.02);
        ag.gain.linearRampToValueAtTime(0.18, t + 0.1);
        ag.gain.exponentialRampToValueAtTime(0.001, t + 0.31);
        air.connect(filt);
        filt.connect(ag);
        ag.connect(this.ctx.destination);
        air.start(t + 0.02);

        // 3. Elastic rising balloon bloop (pitch climbs with level)
        const basePitch = 190 + Math.max(0, level) * 32;
        const bloop = this.ctx.createOscillator();
        const bg = this.ctx.createGain();
        bloop.type = 'sine';
        bloop.frequency.setValueAtTime(basePitch * 0.78, t + 0.16);
        bloop.frequency.exponentialRampToValueAtTime(basePitch * 1.48, t + 0.42);
        bg.gain.setValueAtTime(0.001, t + 0.16);
        bg.gain.linearRampToValueAtTime(0.24, t + 0.22);
        bg.gain.exponentialRampToValueAtTime(0.001, t + 0.46);
        bloop.connect(bg);
        bg.connect(this.ctx.destination);
        bloop.start(t + 0.16);
        bloop.stop(t + 0.48);

        // 4. High tension taut rubber squeak + hiss at levels 7..9
        if (level >= 7 && level < 10) {
          const squeak = this.ctx.createOscillator();
          const sg = this.ctx.createGain();
          squeak.type = 'triangle';
          const sqBase = 980 + (level - 7) * 190;
          squeak.frequency.setValueAtTime(sqBase, t + 0.36);
          squeak.frequency.linearRampToValueAtTime(sqBase * 1.32, t + 0.45);
          squeak.frequency.linearRampToValueAtTime(sqBase * 0.92, t + 0.56);
          sg.gain.setValueAtTime(0.001, t + 0.36);
          sg.gain.linearRampToValueAtTime(0.09, t + 0.41);
          sg.gain.exponentialRampToValueAtTime(0.001, t + 0.58);
          squeak.connect(sg);
          sg.connect(this.ctx.destination);
          squeak.start(t + 0.36);
          squeak.stop(t + 0.6);
        }

        // 5. Rotating joyful celebratory motif (for levels < 10)
        if (level < 10) {
          this.playCelebrationMotif(t + 0.28);
        }
      }

      playCelebrationMotif(startTime) {
        if (this.muted || !this.ctx) return;
        const motifs = [
          // 0: Marimba sunny triad
          { type: 'sine', notes: [523.25, 659.25, 783.99, 1046.5], step: 0.075, dur: 0.24 },
          // 1: Xylophone bouncy skip
          { type: 'triangle', notes: [587.33, 739.99, 880.0, 1174.66], step: 0.068, dur: 0.22 },
          // 2: Harp bubbly glissando
          { type: 'sine', notes: [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5], step: 0.045, dur: 0.25 },
          // 3: Cheerful double-hop
          { type: 'triangle', notes: [440, 554.37, 659.25, 880, 1108.73], step: 0.065, dur: 0.23 },
          // 4: Kalimba sparkle
          { type: 'sine', notes: [659.25, 783.99, 987.77, 1318.5], step: 0.07, dur: 0.26 },
          // 5: Playful jump-up chord
          { type: 'triangle', notes: [523.25, 659.25, 987.77, 1046.5], step: 0.06, dur: 0.28 }
        ];
        const m = motifs[this.celebrationIndex % motifs.length];
        this.celebrationIndex++;

        m.notes.forEach((freq, i) => {
          const nt = startTime + i * m.step;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = m.type;
          osc.frequency.setValueAtTime(freq, nt);
          gain.gain.setValueAtTime(0.001, nt);
          gain.gain.linearRampToValueAtTime(0.15, nt + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.001, nt + m.dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(nt);
          osc.stop(nt + m.dur + 0.02);
        });
      }

      // Dramatic rising tension whistle + crackle hiss before level 10 POP
      playPrePopTension() {
        if (this.muted) return;
        const t = this._now();
        if (!this.ctx) return;

        // Rising slide whistle
        const whistle = this.ctx.createOscillator();
        const wg = this.ctx.createGain();
        whistle.type = 'sine';
        whistle.frequency.setValueAtTime(420, t);
        whistle.frequency.exponentialRampToValueAtTime(1750, t + 0.88);
        wg.gain.setValueAtTime(0.001, t);
        wg.gain.linearRampToValueAtTime(0.16, t + 0.14);
        wg.gain.linearRampToValueAtTime(0.22, t + 0.84);
        wg.gain.exponentialRampToValueAtTime(0.001, t + 0.92);
        whistle.connect(wg);
        wg.connect(this.ctx.destination);
        whistle.start(t);
        whistle.stop(t + 0.94);

        // Pressurized hissing steam
        const hiss = this.ctx.createBufferSource();
        hiss.buffer = this._makeNoiseBuffer(0.95);
        const hp = this.ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.setValueAtTime(2200, t);
        hp.frequency.linearRampToValueAtTime(4800, t + 0.88);
        const hg = this.ctx.createGain();
        hg.gain.setValueAtTime(0.02, t);
        hg.gain.linearRampToValueAtTime(0.16, t + 0.85);
        hg.gain.exponentialRampToValueAtTime(0.001, t + 0.92);
        hiss.connect(hp);
        hp.connect(hg);
        hg.connect(this.ctx.destination);
        hiss.start(t);
      }

      // Comical giant balloon POP + celebratory carnival fanfare!
      playBigPop() {
        if (this.muted) return;
        const t = this._now();
        if (!this.ctx) return;

        // 1. Crisp balloon POP snap
        const popNoise = this.ctx.createBufferSource();
        popNoise.buffer = this._makeNoiseBuffer(0.22);
        const popFilt = this.ctx.createBiquadFilter();
        popFilt.type = 'bandpass';
        popFilt.frequency.setValueAtTime(1400, t);
        popFilt.Q.value = 0.8;
        const popGain = this.ctx.createGain();
        popGain.gain.setValueAtTime(0.65, t);
        popGain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        popNoise.connect(popFilt);
        popFilt.connect(popGain);
        popGain.connect(this.ctx.destination);
        popNoise.start(t);

        // 2. Sub-bass cartoon pop punch
        const boom = this.ctx.createOscillator();
        const bg = this.ctx.createGain();
        boom.type = 'sine';
        boom.frequency.setValueAtTime(280, t);
        boom.frequency.exponentialRampToValueAtTime(44, t + 0.16);
        bg.gain.setValueAtTime(0.5, t);
        bg.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        boom.connect(bg);
        bg.connect(this.ctx.destination);
        boom.start(t);
        boom.stop(t + 0.2);

        // 3. Joyful carnival glockenspiel fanfare!
        const fanfare = [
          { f: 523.25, dt: 0.14, d: 0.14 },
          { f: 659.25, dt: 0.24, d: 0.14 },
          { f: 783.99, dt: 0.34, d: 0.14 },
          { f: 1046.5, dt: 0.45, d: 0.34 },
          { f: 880.00, dt: 0.62, d: 0.14 },
          { f: 1046.5, dt: 0.74, d: 0.48 },
          { f: 1318.5, dt: 0.74, d: 0.48 },
          { f: 1567.98, dt: 0.82, d: 0.55 }
        ];
        fanfare.forEach(n => {
          const nt = t + n.dt;
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(n.f, nt);
          g.gain.setValueAtTime(0.001, nt);
          g.gain.linearRampToValueAtTime(0.16, nt + 0.015);
          g.gain.exponentialRampToValueAtTime(0.001, nt + n.d);
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.start(nt);
          osc.stop(nt + n.d + 0.03);
        });
      }

      // Wrong answer: comical balloon deflate pfffft + mischievous giggling chirps + boing
      playWrongGiggleDeflate() {
        if (this.muted) return;
        const t = this._now();
        if (!this.ctx) return;

        // 1. Sputtering balloon deflate (pfffft-prrrrt)
        const sputter = this.ctx.createOscillator();
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        const sg = this.ctx.createGain();

        sputter.type = 'sawtooth';
        sputter.frequency.setValueAtTime(240, t);
        sputter.frequency.exponentialRampToValueAtTime(92, t + 0.52);

        lfo.type = 'sine';
        lfo.frequency.setValueAtTime(28, t);
        lfoGain.gain.setValueAtTime(34, t);
        lfo.connect(lfoGain);
        lfoGain.connect(sputter.frequency);

        const sFilt = this.ctx.createBiquadFilter();
        sFilt.type = 'bandpass';
        sFilt.frequency.setValueAtTime(620, t);
        sFilt.Q.value = 2.0;

        sg.gain.setValueAtTime(0.001, t);
        sg.gain.linearRampToValueAtTime(0.18, t + 0.04);
        sg.gain.exponentialRampToValueAtTime(0.001, t + 0.54);

        sputter.connect(sFilt);
        sFilt.connect(sg);
        sg.connect(this.ctx.destination);
        sputter.start(t);
        lfo.start(t);
        sputter.stop(t + 0.56);
        lfo.stop(t + 0.56);

        // Airy hiss layer
        const hiss = this.ctx.createBufferSource();
        hiss.buffer = this._makeNoiseBuffer(0.45);
        const hf = this.ctx.createBiquadFilter();
        hf.type = 'bandpass';
        hf.frequency.setValueAtTime(1900, t);
        hf.frequency.exponentialRampToValueAtTime(680, t + 0.42);
        const hg = this.ctx.createGain();
        hg.gain.setValueAtTime(0.14, t);
        hg.gain.exponentialRampToValueAtTime(0.001, t + 0.43);
        hiss.connect(hf);
        hf.connect(hg);
        hg.connect(this.ctx.destination);
        hiss.start(t);

        // 2. Mischievous high-pitched cartoon giggle ("hee-hee-hee-hee!")
        const chirps = [0.14, 0.25, 0.36, 0.47, 0.58];
        chirps.forEach((dt, idx) => {
          const ct = t + dt;
          const osc = this.ctx.createOscillator();
          const cg = this.ctx.createGain();
          osc.type = 'sine';
          const base = 660 + (idx % 2) * 140 - idx * 22;
          osc.frequency.setValueAtTime(base * 0.85, ct);
          osc.frequency.exponentialRampToValueAtTime(base * 1.28, ct + 0.045);
          osc.frequency.exponentialRampToValueAtTime(base * 0.92, ct + 0.09);

          cg.gain.setValueAtTime(0.001, ct);
          cg.gain.linearRampToValueAtTime(0.15, ct + 0.015);
          cg.gain.exponentialRampToValueAtTime(0.001, ct + 0.095);
          osc.connect(cg);
          cg.connect(this.ctx.destination);
          osc.start(ct);
          osc.stop(ct + 0.1);
        });
      }

      // Cute squishy bounce when new monster lands
      playMonsterArrive() {
        if (this.muted) return;
        const t = this._now();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(175, t);
        osc.frequency.exponentialRampToValueAtTime(420, t + 0.14);
        osc.frequency.exponentialRampToValueAtTime(260, t + 0.26);
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.22, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.29);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.31);
      }
    }

    /* =========================================================================
       2. NUS 3rd–4th GRADE ORDER OF OPERATIONS INFINITE MATH GENERATOR
       ========================================================================= */
    class MathGenerator {
      constructor() {
        this.lastExpr = '';
        this.lastTemplateIdx = -1;
      }

      _randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      _pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      generate() {
        const templates = [
          // 1. a + b × c
          () => {
            const b = this._randInt(2, 9);
            const c = this._randInt(2, 9);
            const prod = b * c;
            const a = this._randInt(4, Math.min(48, 120 - prod));
            return { text: `${a} + ${b} × ${c}`, answer: a + prod };
          },
          // 2. a − b × c
          () => {
            const b = this._randInt(2, 9);
            const c = this._randInt(2, 9);
            const prod = b * c;
            const a = this._randInt(prod + 2, Math.min(115, prod + 45));
            return { text: `${a} − ${b} × ${c}`, answer: a - prod };
          },
          // 3. b × c + a
          () => {
            const b = this._randInt(2, 9);
            const c = this._randInt(2, 9);
            const prod = b * c;
            const a = this._randInt(5, Math.min(45, 120 - prod));
            return { text: `${b} × ${c} + ${a}`, answer: prod + a };
          },
          // 4. b × c − a
          () => {
            const b = this._randInt(3, 9);
            const c = this._randInt(3, 9);
            const prod = b * c;
            const a = this._randInt(3, prod - 2);
            return { text: `${b} × ${c} − ${a}`, answer: prod - a };
          },
          // 5. a + b : c
          () => {
            const c = this._randInt(2, 9);
            const q = this._randInt(2, 10);
            const b = c * q;
            const a = this._randInt(6, 75);
            return { text: `${a} + ${b} : ${c}`, answer: a + q };
          },
          // 6. a − b : c
          () => {
            const c = this._randInt(2, 9);
            const q = this._randInt(2, 10);
            const b = c * q;
            const a = this._randInt(q + 4, 88);
            return { text: `${a} − ${b} : ${c}`, answer: a - q };
          },
          // 7. b : c + a
          () => {
            const c = this._randInt(2, 9);
            const q = this._randInt(2, 10);
            const b = c * q;
            const a = this._randInt(5, 72);
            return { text: `${b} : ${c} + ${a}`, answer: q + a };
          },
          // 8. b : c − a
          () => {
            const c = this._randInt(2, 9);
            const q = this._randInt(5, 12);
            const b = c * q;
            const a = this._randInt(2, q - 1);
            return { text: `${b} : ${c} − ${a}`, answer: q - a };
          },
          // 9. (a + b) × c
          () => {
            const c = this._randInt(2, 9);
            const sumMax = Math.min(12, Math.floor(110 / c));
            const sum = this._randInt(4, Math.max(5, sumMax));
            const a = this._randInt(2, sum - 2);
            const b = sum - a;
            return { text: `(${a} + ${b}) × ${c}`, answer: sum * c };
          },
          // 10. (a − b) × c
          () => {
            const c = this._randInt(2, 9);
            const diff = this._randInt(2, 10);
            const b = this._randInt(4, 38);
            const a = b + diff;
            return { text: `(${a} − ${b}) × ${c}`, answer: diff * c };
          },
          // 11. (a + b) : c
          () => {
            const c = this._randInt(2, 9);
            const q = this._randInt(2, 10);
            const total = c * q;
            if (total < 6) return null;
            const a = this._randInt(2, total - 2);
            const b = total - a;
            return { text: `(${a} + ${b}) : ${c}`, answer: q };
          },
          // 12. (a − b) : c
          () => {
            const c = this._randInt(2, 9);
            const q = this._randInt(2, 9);
            const diff = c * q;
            const b = this._randInt(4, Math.min(45, 98 - diff));
            const a = diff + b;
            return { text: `(${a} − ${b}) : ${c}`, answer: q };
          },
          // 13. a × b + c × d
          () => {
            const a = this._randInt(2, 8);
            const b = this._randInt(2, 8);
            const c = this._randInt(2, 8);
            const d = this._randInt(2, 8);
            const ans = a * b + c * d;
            if (ans > 120) return null;
            return { text: `${a} × ${b} + ${c} × ${d}`, answer: ans };
          },
          // 14. a × b − c × d
          () => {
            const a = this._randInt(4, 9);
            const b = this._randInt(4, 9);
            const c = this._randInt(2, 7);
            const d = this._randInt(2, 7);
            const p1 = a * b;
            const p2 = c * d;
            if (p1 <= p2 + 1) return null;
            return { text: `${a} × ${b} − ${c} × ${d}`, answer: p1 - p2 };
          },
          // 15. a × b + c : d
          () => {
            const a = this._randInt(2, 9);
            const b = this._randInt(2, 9);
            const d = this._randInt(2, 9);
            const q = this._randInt(2, 9);
            const c = d * q;
            const ans = a * b + q;
            if (ans > 110) return null;
            return { text: `${a} × ${b} + ${c} : ${d}`, answer: ans };
          },
          // 16. a × b − c : d
          () => {
            const a = this._randInt(3, 9);
            const b = this._randInt(3, 9);
            const d = this._randInt(2, 9);
            const q = this._randInt(2, 9);
            const c = d * q;
            const p = a * b;
            if (p <= q + 1) return null;
            return { text: `${a} × ${b} − ${c} : ${d}`, answer: p - q };
          },
          // 17. a : b + c × d
          () => {
            const b = this._randInt(2, 9);
            const q = this._randInt(2, 9);
            const a = b * q;
            const c = this._randInt(2, 9);
            const d = this._randInt(2, 9);
            const ans = q + c * d;
            if (ans > 110) return null;
            return { text: `${a} : ${b} + ${c} × ${d}`, answer: ans };
          },
          // 18. a + b × (c − d)
          () => {
            const b = this._randInt(2, 8);
            const diff = this._randInt(2, 8);
            const d = this._randInt(3, 22);
            const c = d + diff;
            const a = this._randInt(4, Math.min(40, 100 - b * diff));
            return { text: `${a} + ${b} × (${c} − ${d})`, answer: a + b * diff };
          },
          // 19. a × (b + c) − d
          () => {
            const a = this._randInt(2, 8);
            const sum = this._randInt(4, 10);
            const b = this._randInt(2, sum - 2);
            const c = sum - b;
            const prod = a * sum;
            const d = this._randInt(3, prod - 2);
            return { text: `${a} × (${b} + ${c}) − ${d}`, answer: prod - d };
          },
          // 20. (a + b × c) : d
          () => {
            const d = this._randInt(2, 9);
            const q = this._randInt(3, 10);
            const total = d * q;
            const b = this._randInt(2, 8);
            const c = this._randInt(2, 8);
            const prod = b * c;
            const a = total - prod;
            if (a < 2 || a > 48) return null;
            return { text: `(${a} + ${b} × ${c}) : ${d}`, answer: q };
          }
        ];

        for (let tries = 0; tries < 60; tries++) {
          let idx = this._randInt(0, templates.length - 1);
          if (idx === this.lastTemplateIdx) {
            idx = (idx + 1 + this._randInt(0, templates.length - 3)) % templates.length;
          }
          const res = templates[idx]();
          if (!res) continue;
          if (res.answer < 0 || res.answer > 140) continue;
          if (res.text === this.lastExpr) continue;
          this.lastExpr = res.text;
          this.lastTemplateIdx = idx;
          return res;
        }
        return { text: '12 + 4 × 5', answer: 32 };
      }
    }

    /* =========================================================================
       3. LIVING SUNLIT STORYBOOK MEADOW BACKGROUND
       ========================================================================= */
    class MeadowWorld {
      constructor() {
        this.clouds = [];
        this.flowers = [];
        this.butterflies = [];
        this.dragonflies = [];
        this.seeds = [];
        this.grassTufts = [];
        this.init();
      }

      init() {
        // Painterly drifting clouds
        for (let i = 0; i < 6; i++) {
          this.clouds.push({
            x: (i / 6) * 1.2 - 0.1 + Math.random() * 0.12,
            y: 0.08 + Math.random() * 0.2,
            scale: 0.7 + Math.random() * 0.75,
            speed: 0.006 + Math.random() * 0.008,
            puffs: [
              { dx: -38, dy: 8, r: 26 + Math.random() * 8 },
              { dx: -14, dy: -8, r: 34 + Math.random() * 10 },
              { dx: 18, dy: -4, r: 30 + Math.random() * 10 },
              { dx: 44, dy: 10, r: 22 + Math.random() * 8 }
            ]
          });
        }

        // Blooming meadow wildflowers
        const flowerColors = [
          { petal: '#ff6f61', center: '#ffd74c' },
          { petal: '#ffd54f', center: '#d96b1f' },
          { petal: '#74b9ff', center: '#fff3a8' },
          { petal: '#fff4d6', center: '#f2a922' },
          { petal: '#f78fb3', center: '#ffe57f' },
          { petal: '#b892ff', center: '#fff099' }
        ];
        for (let i = 0; i < 36; i++) {
          const c = flowerColors[i % flowerColors.length];
          this.flowers.push({
            x: Math.random(),
            yRatio: 0.61 + Math.random() * 0.24,
            stemH: 18 + Math.random() * 26,
            size: 5 + Math.random() * 5.5,
            petals: 5 + (i % 3),
            phase: Math.random() * Math.PI * 2,
            petalColor: c.petal,
            centerColor: c.center
          });
        }

        // Grass tufts
        for (let i = 0; i < 55; i++) {
          this.grassTufts.push({
            x: Math.random(),
            yRatio: 0.60 + Math.random() * 0.27,
            h: 10 + Math.random() * 18,
            phase: Math.random() * Math.PI * 2,
            tone: i % 2 === 0 ? '#4ca949' : '#65bf55'
          });
        }

        // Colorful fluttering butterflies
        const bColors = [
          ['#ff9f43', '#ffeaa7'],
          ['#fd79a8', '#ffe0ec'],
          ['#74b9ff', '#dff3ff'],
          ['#ffbe76', '#ff6b6b']
        ];
        for (let i = 0; i < 4; i++) {
          const bc = bColors[i % bColors.length];
          this.butterflies.push({
            x: 0.1 + Math.random() * 0.85,
            y: 0.18 + Math.random() * 0.45,
            vx: (Math.random() > 0.5 ? 1 : -1) * (0.018 + Math.random() * 0.018),
            vy: 0,
            phase: Math.random() * Math.PI * 2,
            flapPhase: Math.random() * Math.PI * 2,
            size: 9 + Math.random() * 5,
            c1: bc[0],
            c2: bc[1]
          });
        }

        // Darting iridescent dragonflies
        for (let i = 0; i < 2; i++) {
          this.dragonflies.push({
            x: 0.2 + Math.random() * 0.6,
            y: 0.35 + Math.random() * 0.28,
            dir: i === 0 ? 1 : -1,
            speed: 0.045 + Math.random() * 0.03,
            pauseTimer: Math.random() * 2,
            phase: Math.random() * Math.PI * 2
          });
        }

        // Drifting sunny dandelion seeds / pollen motes
        for (let i = 0; i < 20; i++) {
          this.seeds.push({
            x: Math.random(),
            y: Math.random() * 0.85,
            r: 1.8 + Math.random() * 2.5,
            speedX: 0.005 + Math.random() * 0.01,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      update(dt, time) {
        for (const c of this.clouds) {
          c.x += c.speed * dt;
          if (c.x > 1.18) c.x = -0.18;
        }

        for (const b of this.butterflies) {
          b.flapPhase += dt * 15;
          b.phase += dt * 2.1;
          b.x += b.vx * dt;
          b.y += Math.sin(b.phase) * 0.025 * dt;
          if (b.x > 1.06) b.x = -0.06;
          if (b.x < -0.06) b.x = 1.06;
          if (b.y < 0.12) b.y = 0.12;
          if (b.y > 0.68) b.y = 0.68;
        }

        for (const d of this.dragonflies) {
          d.phase += dt * 28;
          d.pauseTimer -= dt;
          if (d.pauseTimer < 0) {
            d.x += d.dir * d.speed * dt;
            d.y += Math.sin(time * 3 + d.phase * 0.1) * 0.018 * dt;
            if (d.pauseTimer < -1.8) {
              d.pauseTimer = 0.8 + Math.random() * 1.4;
              if (Math.random() < 0.35) d.dir *= -1;
            }
          }
          if (d.x > 1.05) { d.x = 1.05; d.dir = -1; }
          if (d.x < -0.05) { d.x = -0.05; d.dir = 1; }
        }

        for (const s of this.seeds) {
          s.x += s.speedX * dt;
          s.y += Math.sin(time * 0.9 + s.phase) * 0.008 * dt;
          if (s.x > 1.04) {
            s.x = -0.04;
            s.y = 0.1 + Math.random() * 0.7;
          }
        }
      }

      draw(ctx, w, h, time, deckY) {
        // 1. Warm sunlit storybook sky gradient
        const sky = ctx.createLinearGradient(0, 0, 0, h * 0.72);
        sky.addColorStop(0, '#59b9e8');
        sky.addColorStop(0.45, '#92dcf5');
        sky.addColorStop(0.82, '#e2f6cf');
        sky.addColorStop(1, '#fff3bf');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        // 2. Soft golden sun + gentle rotating sunbeams in upper-left
        const sunX = w * 0.13;
        const sunY = h * 0.15;
        ctx.save();
        ctx.translate(sunX, sunY);
        ctx.rotate(time * 0.035);
        for (let i = 0; i < 10; i++) {
          ctx.rotate((Math.PI * 2) / 10);
          const rayGrad = ctx.createLinearGradient(0, 0, Math.max(w, h) * 0.55, 0);
          rayGrad.addColorStop(0, 'rgba(255, 249, 196, 0.20)');
          rayGrad.addColorStop(0.6, 'rgba(255, 245, 175, 0.06)');
          rayGrad.addColorStop(1, 'rgba(255, 245, 175, 0)');
          ctx.fillStyle = rayGrad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.max(w, h) * 0.55, -h * 0.045);
          ctx.lineTo(Math.max(w, h) * 0.55, h * 0.045);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, Math.min(w, h) * 0.24);
        sunGlow.addColorStop(0, 'rgba(255, 252, 224, 0.96)');
        sunGlow.addColorStop(0.28, 'rgba(255, 238, 152, 0.65)');
        sunGlow.addColorStop(1, 'rgba(255, 238, 152, 0)');
        ctx.fillStyle = sunGlow;
        ctx.beginPath();
        ctx.arc(sunX, sunY, Math.min(w, h) * 0.24, 0, Math.PI * 2);
        ctx.fill();

        // 3. Drifting painterly clouds
        for (const c of this.clouds) {
          const cx = c.x * w;
          const cy = c.y * h;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(c.scale, c.scale);
          // Warm underside tint
          ctx.fillStyle = 'rgba(222, 238, 242, 0.72)';
          for (const p of c.puffs) {
            ctx.beginPath();
            ctx.arc(p.dx, p.dy + 5, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          // Cream-gold sunlit tops
          ctx.fillStyle = 'rgba(255, 253, 244, 0.92)';
          for (const p of c.puffs) {
            ctx.beginPath();
            ctx.arc(p.dx, p.dy, p.r * 0.96, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // 4. Distant soft sage rolling hills
        const hill1 = ctx.createLinearGradient(0, h * 0.46, 0, h * 0.76);
        hill1.addColorStop(0, '#9bd68f');
        hill1.addColorStop(1, '#68b56b');
        ctx.fillStyle = hill1;
        ctx.beginPath();
        ctx.moveTo(0, h * 0.62);
        ctx.bezierCurveTo(w * 0.22, h * 0.44, w * 0.42, h * 0.56, w * 0.66, h * 0.50);
        ctx.bezierCurveTo(w * 0.84, h * 0.46, w * 0.94, h * 0.54, w, h * 0.52);
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();

        // Subtle stylized treeline silhouettes on distant hill
        ctx.fillStyle = '#73be6d';
        const trees = [0.06, 0.11, 0.34, 0.39, 0.56, 0.91, 0.96];
        for (let i = 0; i < trees.length; i++) {
          const tx = w * trees[i];
          const ty = h * (0.52 + (i % 3) * 0.025);
          const tr = 18 + (i % 3) * 8;
          ctx.beginPath();
          ctx.arc(tx, ty, tr, 0, Math.PI * 2);
          ctx.arc(tx - tr * 0.6, ty + 6, tr * 0.72, 0, Math.PI * 2);
          ctx.arc(tx + tr * 0.65, ty + 7, tr * 0.68, 0, Math.PI * 2);
          ctx.fill();
        }

        // 5. Midground lush sunlit meadow hill
        const hill2 = ctx.createLinearGradient(0, h * 0.54, 0, h * 0.9);
        hill2.addColorStop(0, '#85d160');
        hill2.addColorStop(0.5, '#59b549');
        hill2.addColorStop(1, '#37893b');
        ctx.fillStyle = hill2;
        ctx.beginPath();
        ctx.moveTo(0, h * 0.60);
        ctx.bezierCurveTo(w * 0.18, h * 0.54, w * 0.38, h * 0.67, w * 0.62, h * 0.58);
        ctx.bezierCurveTo(w * 0.80, h * 0.52, w * 0.92, h * 0.62, w, h * 0.59);
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();

        // Warm sunlit patch across meadow
        const sunPatch = ctx.createRadialGradient(w * 0.28, h * 0.70, 20, w * 0.28, h * 0.72, w * 0.36);
        sunPatch.addColorStop(0, 'rgba(232, 248, 128, 0.26)');
        sunPatch.addColorStop(1, 'rgba(232, 248, 128, 0)');
        ctx.fillStyle = sunPatch;
        ctx.fillRect(0, h * 0.52, w, h * 0.48);

        // 6. Swaying grass tufts
        for (const g of this.grassTufts) {
          const gx = g.x * w;
          const gy = g.yRatio * h;
          if (gy > deckY + 12) continue;
          const sway = Math.sin(time * 2.2 + g.phase) * 4.5;
          ctx.strokeStyle = g.tone;
          ctx.lineWidth = 2.4;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(gx, gy);
          ctx.quadraticCurveTo(gx + sway * 0.5 - 3, gy - g.h * 0.55, gx + sway - 5, gy - g.h);
          ctx.moveTo(gx, gy);
          ctx.quadraticCurveTo(gx + sway * 0.5 + 3, gy - g.h * 0.55, gx + sway + 5, gy - g.h * 0.86);
          ctx.stroke();
        }

        // 7. Blooming swaying meadow wildflowers
        for (const f of this.flowers) {
          const fx = f.x * w;
          const fy = f.yRatio * h;
          if (fy > deckY + 8) continue;
          const sway = Math.sin(time * 2.0 + f.phase) * 5.5;
          const topX = fx + sway;
          const topY = fy - f.stemH;

          // Stem
          ctx.strokeStyle = '#2d7d34';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(fx, fy);
          ctx.quadraticCurveTo(fx + sway * 0.4, fy - f.stemH * 0.5, topX, topY);
          ctx.stroke();

          // Petals
          ctx.save();
          ctx.translate(topX, topY);
          ctx.fillStyle = f.petalColor;
          for (let p = 0; p < f.petals; p++) {
            const ang = (p / f.petals) * Math.PI * 2 + sway * 0.03;
            ctx.beginPath();
            ctx.ellipse(
              Math.cos(ang) * f.size * 0.72,
              Math.sin(ang) * f.size * 0.72,
              f.size * 0.55,
              f.size * 0.36,
              ang,
              0,
              Math.PI * 2
            );
            ctx.fill();
          }
          ctx.fillStyle = f.centerColor;
          ctx.beginPath();
          ctx.arc(0, 0, f.size * 0.36, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 8. Foreground Meadow Clearing Wooden Deck & Mossy Stones
        this._drawWoodenDeck(ctx, w, h, deckY);

        // 9. Fluttering butterflies
        for (const b of this.butterflies) {
          const bx = b.x * w;
          const by = b.y * h;
          const flap = Math.abs(Math.cos(b.flapPhase));
          ctx.save();
          ctx.translate(bx, by);
          ctx.scale(b.vx >= 0 ? 1 : -1, 1);
          ctx.rotate(Math.sin(b.phase) * 0.18);
          // Back wing
          ctx.fillStyle = b.c2;
          ctx.beginPath();
          ctx.ellipse(-2, -b.size * 0.45 * flap, b.size * 0.75, b.size * 0.52 * (0.25 + 0.75 * flap), -0.35, 0, Math.PI * 2);
          ctx.fill();
          // Front wing
          ctx.fillStyle = b.c1;
          ctx.beginPath();
          ctx.ellipse(3, -b.size * 0.55 * flap, b.size * 0.9, b.size * 0.62 * (0.25 + 0.75 * flap), 0.25, 0, Math.PI * 2);
          ctx.fill();
          // Tiny body
          ctx.strokeStyle = '#3b2416';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-4, 0);
          ctx.lineTo(5, 0);
          ctx.stroke();
          ctx.restore();
        }

        // 10. Iridescent dragonflies
        for (const d of this.dragonflies) {
          const dx = d.x * w;
          const dy = d.y * h;
          const flutter = Math.sin(d.phase) * 0.45;
          ctx.save();
          ctx.translate(dx, dy);
          ctx.scale(d.dir, 1);
          ctx.fillStyle = 'rgba(220, 250, 255, 0.72)';
          ctx.beginPath();
          ctx.ellipse(-1, -4, 9, 2.8, -0.3 + flutter, 0, Math.PI * 2);
          ctx.ellipse(-3, 4, 8, 2.4, 0.3 - flutter, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#1b8a99';
          ctx.lineWidth = 2.6;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-12, 0);
          ctx.lineTo(6, 0);
          ctx.stroke();
          ctx.restore();
        }

        // 11. Floating sunny dandelion motes
        ctx.fillStyle = 'rgba(255, 252, 224, 0.75)';
        for (const s of this.seeds) {
          ctx.beginPath();
          ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      _drawWoodenDeck(ctx, w, h, deckY) {
        const deckH = h - deckY;

        // Lush foreground grass verge
        const grassGrad = ctx.createLinearGradient(0, deckY - 14, 0, h);
        grassGrad.addColorStop(0, '#46a13f');
        grassGrad.addColorStop(1, '#26652c');
        ctx.fillStyle = grassGrad;
        ctx.fillRect(0, deckY - 8, w, deckH + 10);

        // Curved rustic wooden stage platform on the left clearing
        const platCX = w * 0.285;
        const platW = Math.min(w * 0.50, 620);
        const platH = Math.max(deckH * 0.76, 86);
        const platTop = deckY - 8;

        // Soft ambient shadow beneath wooden platform
        ctx.fillStyle = 'rgba(18, 48, 22, 0.38)';
        ctx.beginPath();
        ctx.ellipse(platCX, platTop + platH * 0.52, platW * 0.53, platH * 0.44, 0, 0, Math.PI * 2);
        ctx.fill();

        // Wooden edge thickness
        const sideGrad = ctx.createLinearGradient(platCX - platW * 0.5, platTop, platCX + platW * 0.5, platTop + platH);
        sideGrad.addColorStop(0, '#78451a');
        sideGrad.addColorStop(0.5, '#995b26');
        sideGrad.addColorStop(1, '#633612');
        ctx.fillStyle = sideGrad;
        ctx.beginPath();
        ctx.ellipse(platCX, platTop + 26, platW * 0.5, platH * 0.36, 0, 0, Math.PI * 2);
        ctx.fill();

        // Warm honey-timber top surface of platform
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(platCX, platTop + 14, platW * 0.5, platH * 0.35, 0, 0, Math.PI * 2);
        ctx.clip();

        const topGrad = ctx.createLinearGradient(platCX, platTop - 22, platCX, platTop + 56);
        topGrad.addColorStop(0, '#e3ad67');
        topGrad.addColorStop(0.55, '#c78842');
        topGrad.addColorStop(1, '#a36527');
        ctx.fillStyle = topGrad;
        ctx.fillRect(platCX - platW * 0.55, platTop - 40, platW * 1.1, platH);

        // Wooden plank seams & subtle grain
        ctx.strokeStyle = 'rgba(92, 46, 12, 0.38)';
        ctx.lineWidth = 2.2;
        for (let i = -3; i <= 3; i++) {
          const py = platTop + 14 + i * 12;
          ctx.beginPath();
          ctx.moveTo(platCX - platW * 0.52, py);
          ctx.lineTo(platCX + platW * 0.52, py);
          ctx.stroke();
        }
        ctx.restore();

        // Warm rim border around platform top
        ctx.strokeStyle = '#6c3b13';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.ellipse(platCX, platTop + 14, platW * 0.5, platH * 0.35, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Mossy river stones around platform edges
        this._drawMossyStone(ctx, platCX - platW * 0.47, platTop + 34, 28, 16);
        this._drawMossyStone(ctx, platCX - platW * 0.39, platTop + 44, 18, 11);
        this._drawMossyStone(ctx, platCX + platW * 0.45, platTop + 36, 26, 15);
        this._drawMossyStone(ctx, platCX + platW * 0.38, platTop + 45, 16, 10);
      }

      _drawMossyStone(ctx, x, y, rx, ry) {
        const g = ctx.createRadialGradient(x - rx * 0.3, y - ry * 0.4, 2, x, y, rx * 1.1);
        g.addColorStop(0, '#aeb5ac');
        g.addColorStop(0.7, '#768277');
        g.addColorStop(1, '#4f5a51');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
        // Bright moss cap
        ctx.fillStyle = '#5eb84d';
        ctx.beginPath();
        ctx.ellipse(x - rx * 0.15, y - ry * 0.45, rx * 0.65, ry * 0.45, -0.15, Math.PI, Math.PI * 2);
        ctx.fill();
      }
    }

    /* =========================================================================
       4. PROCEDURAL MONSTER CHARACTER (SOFT-BODY PHYSICS, CRACKS, EXPRESSIONS)
       ========================================================================= */
    const MONSTER_PALETTES = [
      {
        name: 'berry',
        light: '#c98aff', mid: '#8e44dd', dark: '#561b9e', rim: '#f5d0ff',
        belly: '#f5e1ff', spot: '#b26ef0', horn: '#ffd166', hornDark: '#c98912',
        iris: '#2ab7a9', cheek: '#ff7096'
      },
      {
        name: 'mint',
        light: '#72f0d4', mid: '#26b89d', dark: '#117466', rim: '#d9fff5',
        belly: '#d6fff2', spot: '#1f9987', horn: '#ff8a65', hornDark: '#c44b27',
        iris: '#f59f00', cheek: '#ff7e8f'
      },
      {
        name: 'tangerine',
        light: '#ffba66', mid: '#f27824', dark: '#b3430c', rim: '#ffe9b8',
        belly: '#fff0c7', spot: '#de6216', horn: '#70d6ff', hornDark: '#2684b5',
        iris: '#3b8c47', cheek: '#ff5d73'
      },
      {
        name: 'meadow',
        light: '#a4ec60', mid: '#56b835', dark: '#29751c', rim: '#e9ffbf',
        belly: '#e6ffbe', spot: '#429c26', horn: '#ff7eb3', hornDark: '#bf3672',
        iris: '#8b46d9', cheek: '#ff8a75'
      },
      {
        name: 'coral',
        light: '#ff9ca8', mid: '#ec566d', dark: '#a6233c', rim: '#ffe0e6',
        belly: '#ffe3e8', spot: '#d13d55', horn: '#ffe066', hornDark: '#c79712',
        iris: '#2b95d6', cheek: '#ff4268'
      },
      {
        name: 'blueberry',
        light: '#7ec8ff', mid: '#358be6', dark: '#1a4ea3', rim: '#d9f2ff',
        belly: '#dcf2ff', spot: '#266fc4', horn: '#ffd452', hornDark: '#c78a14',
        iris: '#ef6c35', cheek: '#ff85a2'
      }
    ];

    const EAR_STYLES = ['roundedHorns', 'floppyEars', 'bouncyAntennae', 'catTufts', 'leafEars', 'bearEars'];
    const BELLY_PATTERNS = ['spots', 'stripes', 'rings', 'clover'];

    class MonsterCharacter {
      constructor() {
        this.paletteIndex = -1;
        this.earIndex = -1;
        this.resetSpecies(false);
        this.mouseX = 0.5;
        this.mouseY = 0.5;
        this.eyeLookX = 0;
        this.eyeLookY = 0;
      }

      resetSpecies(withParachute = true) {
        let pIdx = Math.floor(Math.random() * MONSTER_PALETTES.length);
        if (pIdx === this.paletteIndex) pIdx = (pIdx + 1) % MONSTER_PALETTES.length;
        this.paletteIndex = pIdx;
        this.palette = MONSTER_PALETTES[pIdx];

        let eIdx = Math.floor(Math.random() * EAR_STYLES.length);
        if (eIdx === this.earIndex) eIdx = (eIdx + 1) % EAR_STYLES.length;
        this.earIndex = eIdx;
        this.earStyle = EAR_STYLES[eIdx];
        this.bellyPattern = BELLY_PATTERNS[Math.floor(Math.random() * BELLY_PATTERNS.length)];

        // Inflation & state
        this.level = 0;           // -3 to 10 (pops at 10)
        this.visualLevel = 0;     // Smooth spring-interpolated level
        this.visualLevelVel = 0;

        // Soft-body squash & stretch spring
        this.squashX = 1;
        this.squashY = 1;
        this.squashVelX = 0;
        this.squashVelY = 0;

        // Expression state: 'idle' | 'gulp' | 'giggle' | 'prepop' | 'popped' | 'arriving'
        this.state = withParachute ? 'arriving' : 'idle';
        this.stateTimer = 0;

        // Blinking
        this.blinkTimer = 2 + Math.random() * 2.5;
        this.blinkAmount = 0;

        // Parachute descent
        this.dropY = withParachute ? -420 : 0;
        this.dropVel = 0;
        this.parachuteOpen = withParachute;
        this.landedOnce = !withParachute;

        // Sweat drops & crack air-wisps
        this.sweatDrops = [];
        this.airWisps = [];

        // Pre-generate organic branching crack paths in normalized body coords (-1..1)
        this.cracks = this._generateCracks();
      }

      _generateCracks() {
        // 6 distinct branching crack roots that activate progressively from level 4 to 10
        const defs = [
          { minLevel: 4, sx: -0.25, sy: 0.12, ang: 0.35, len: 0.42 },
          { minLevel: 5, sx: 0.34, sy: -0.05, ang: 2.65, len: 0.45 },
          { minLevel: 6, sx: -0.05, sy: 0.42, ang: -1.15, len: 0.44 },
          { minLevel: 7, sx: -0.46, sy: -0.18, ang: 0.65, len: 0.46 },
          { minLevel: 8, sx: 0.22, sy: 0.38, ang: -2.2, len: 0.48 },
          { minLevel: 9, sx: 0.04, sy: -0.36, ang: 1.45, len: 0.46 }
        ];
        return defs.map(d => {
          const pts = [{ x: d.sx, y: d.sy }];
          let cx = d.sx, cy = d.sy, a = d.ang;
          const segs = 5;
          const branches = [];
          for (let i = 1; i <= segs; i++) {
            a += (Math.random() - 0.5) * 0.72;
            const step = (d.len / segs) * (0.85 + Math.random() * 0.35);
            cx += Math.cos(a) * step;
            cy += Math.sin(a) * step;
            pts.push({ x: cx, y: cy });
            if (i === 2 || i === 3) {
              const ba = a + (Math.random() > 0.5 ? 1 : -1) * (0.65 + Math.random() * 0.45);
              const bLen = step * 1.45;
              const midX = cx + Math.cos(ba) * bLen * 0.55;
              const midY = cy + Math.sin(ba) * bLen * 0.55;
              const endX = midX + Math.cos(ba + (Math.random() - 0.5) * 0.5) * bLen * 0.55;
              const endY = midY + Math.sin(ba + (Math.random() - 0.5) * 0.5) * bLen * 0.55;
              branches.push([{ x: cx, y: cy }, { x: midX, y: midY }, { x: endX, y: endY }]);
            }
          }
          return { minLevel: d.minLevel, pts, branches };
        });
      }

      triggerInflate(newLevel) {
        this.level = newLevel;
        // Juicy outward elastic kick
        this.squashVelX += 3.8;
        this.squashVelY -= 2.4;
        this.visualLevelVel += 4.2;

        if (newLevel >= 10) {
          this.state = 'prepop';
          this.stateTimer = 0.95;
        } else {
          this.state = 'gulp';
          this.stateTimer = 0.65;
        }
      }

      triggerDeflateGiggle(newLevel) {
        this.level = newLevel;
        this.state = 'giggle';
        this.stateTimer = 1.25;
        this.squashVelX -= 3.2;
        this.squashVelY += 3.6;
        this.visualLevelVel -= 3.5;
      }

      triggerPop() {
        this.state = 'popped';
        this.stateTimer = 0;
      }

      getValvePoint(baseX, baseY, baseR) {
        const dims = this._computeBodyDims(baseR);
        return {
          x: baseX - dims.rx * 0.94,
          y: dims.cy + dims.ry * 0.14
        };
      }

      _computeBodyDims(baseR) {
        const v = this.visualLevel;
        let rxScale, ryScale, lift;
        if (v >= 0) {
          // Plump & round swelling from 0 to 10
          const t = v / 10;
          rxScale = 1 + t * 0.98 + t * t * 0.24;
          ryScale = 1 + t * 0.86 + t * t * 0.20;
          lift = v >= 6 ? Math.pow((v - 5.5) / 4.5, 1.5) * baseR * 0.52 : 0;
        } else {
          // Comically skinny deflated noodle when -1..-3
          const t = Math.abs(v) / 3;
          rxScale = 1 - t * 0.44;
          ryScale = 1 + t * 0.18;
          lift = 0;
        }
        const rx = baseR * rxScale * this.squashX;
        const ry = baseR * ryScale * this.squashY;
        return { rx, ry, lift };
      }

      update(dt, time, baseX, baseY, baseR, onLandCallback) {
        if (this.state === 'popped') return;

        // Parachute descent arrival
        if (this.state === 'arriving') {
          this.dropY += 235 * dt;
          if (this.dropY >= 0) {
            this.dropY = 0;
            this.parachuteOpen = false;
            this.state = 'idle';
            this.squashX = 1.26;
            this.squashY = 0.76;
            this.squashVelX = -1.2;
            this.squashVelY = 1.8;
            if (!this.landedOnce) {
              this.landedOnce = true;
              if (onLandCallback) onLandCallback();
            }
          }
        }

        // Spring-damper for inflation level
        const lvlForce = (this.level - this.visualLevel) * 28;
        this.visualLevelVel = (this.visualLevelVel + lvlForce * dt) * Math.pow(0.06, dt);
        this.visualLevel += this.visualLevelVel * dt;

        // Soft-body squash-and-stretch spring
        const k = 120;
        const damp = Math.pow(0.015, dt);
        this.squashVelX = (this.squashVelX + (1 - this.squashX) * k * dt) * damp;
        this.squashVelY = (this.squashVelY + (1 - this.squashY) * k * dt) * damp;
        this.squashX += this.squashVelX * dt;
        this.squashY += this.squashVelY * dt;

        // State timers
        if (this.stateTimer > 0) {
          this.stateTimer -= dt;
          if (this.stateTimer <= 0 && (this.state === 'gulp' || this.state === 'giggle')) {
            this.state = 'idle';
          }
        }

        // Natural blinking
        this.blinkTimer -= dt;
        if (this.blinkTimer <= 0) {
          this.blinkAmount = Math.min(1, this.blinkAmount + dt * 16);
          if (this.blinkTimer <= -0.14) {
            this.blinkTimer = 2.2 + Math.random() * 3.0;
          }
        } else {
          this.blinkAmount = Math.max(0, this.blinkAmount - dt * 14);
        }

        // Smooth eye pupil tracking (or nervous glance at huge belly at levels 6..9)
        let targetLookX = (this.mouseX - 0.3) * 1.4;
        let targetLookY = (this.mouseY - 0.55) * 1.2;
        if (this.level >= 7 && this.state === 'idle' && Math.sin(time * 2.1) > 0.15) {
          targetLookX = 0;
          targetLookY = 0.95; // glance nervously down at belly!
        }
        targetLookX = Math.max(-1, Math.min(1, targetLookX));
        targetLookY = Math.max(-1, Math.min(1, targetLookY));
        this.eyeLookX += (targetLookX - this.eyeLookX) * Math.min(1, dt * 8);
        this.eyeLookY += (targetLookY - this.eyeLookY) * Math.min(1, dt * 8);

        // Spawn nervous sweat drops at high inflation (7..9)
        if ((this.level >= 7 || this.state === 'prepop') && Math.random() < dt * (this.state === 'prepop' ? 9 : 2.6)) {
          this.sweatDrops.push({
            x: (Math.random() > 0.5 ? 1 : -1) * (0.52 + Math.random() * 0.25),
            y: -0.58 + Math.random() * 0.18,
            vy: 0.35 + Math.random() * 0.3,
            life: 1
          });
        }
        for (let i = this.sweatDrops.length - 1; i >= 0; i--) {
          const s = this.sweatDrops[i];
          s.y += s.vy * dt;
          s.life -= dt * 1.15;
          if (s.life <= 0) this.sweatDrops.splice(i, 1);
        }

        // Spawn tiny hissing air wisps from cracks at levels 7..10 or during deflate
        const dims = this._computeBodyDims(baseR);
        const cy = baseY - dims.ry - dims.lift + this.dropY;
        if (this.level >= 7 || this.state === 'prepop') {
          const rate = this.state === 'prepop' ? 24 : 5;
          if (Math.random() < dt * rate) {
            const activeCracks = this.cracks.filter(c => this.level >= c.minLevel);
            if (activeCracks.length) {
              const c = activeCracks[Math.floor(Math.random() * activeCracks.length)];
              const pt = c.pts[Math.floor(Math.random() * c.pts.length)];
              const ang = Math.atan2(pt.y, pt.x) + (Math.random() - 0.5) * 0.5;
              this.airWisps.push({
                x: baseX + pt.x * dims.rx,
                y: cy + pt.y * dims.ry,
                vx: Math.cos(ang) * (55 + Math.random() * 65),
                vy: Math.sin(ang) * (55 + Math.random() * 65),
                r: 4 + Math.random() * 5,
                life: 1
              });
            }
          }
        }
        if (this.state === 'giggle' && this.stateTimer > 0.65 && Math.random() < dt * 22) {
          // Comical air jets puffing out as monster deflates!
          const side = Math.random() > 0.5 ? 1 : -1;
          this.airWisps.push({
            x: baseX + side * dims.rx * 0.85,
            y: cy + (Math.random() - 0.3) * dims.ry * 0.5,
            vx: side * (95 + Math.random() * 80),
            vy: -20 + (Math.random() - 0.5) * 70,
            r: 5 + Math.random() * 7,
            life: 1
          });
        }
        for (let i = this.airWisps.length - 1; i >= 0; i--) {
          const wisp = this.airWisps[i];
          wisp.x += wisp.vx * dt;
          wisp.y += wisp.vy * dt;
          wisp.vx *= Math.pow(0.18, dt);
          wisp.vy *= Math.pow(0.18, dt);
          wisp.r += dt * 18;
          wisp.life -= dt * 1.9;
          if (wisp.life <= 0) this.airWisps.splice(i, 1);
        }
      }

      draw(ctx, time, baseX, baseY, baseR) {
        if (this.state === 'popped') return;

        const dims = this._computeBodyDims(baseR);
        // Gentle idle breathing
        const breathe = Math.sin(time * 2.8) * 0.024;
        const rx = dims.rx * (1 + breathe);
        const ry = dims.ry * (1 - breathe * 0.8);

        // Micro-tremble at high tension or rapid giggle bounce
        let shakeX = 0, shakeY = 0;
        if (this.state === 'prepop') {
          const intensity = 4 + (1 - Math.max(0, this.stateTimer)) * 12;
          shakeX = Math.sin(time * 68) * intensity;
          shakeY = Math.cos(time * 79) * intensity * 0.8;
        } else if (this.level >= 7) {
          const intensity = (this.level - 6) * 1.3;
          shakeX = Math.sin(time * 42) * intensity;
          shakeY = Math.cos(time * 48) * intensity * 0.6;
        } else if (this.state === 'giggle') {
          shakeY = -Math.abs(Math.sin(time * 28)) * 11;
          shakeX = Math.sin(time * 18) * 4;
        }

        const hoverBob = dims.lift > 2 ? Math.sin(time * 3.4) * 5 : 0;
        const cx = baseX + shakeX;
        const cy = baseY - ry * 0.96 - dims.lift + hoverBob + shakeY + this.dropY;

        // 1. Ground contact shadow (shrinks/softens with height)
        const heightFactor = Math.max(0.25, 1 - (dims.lift - this.dropY) / 360);
        const shadowRx = rx * 0.92 * heightFactor;
        const shadowRy = Math.max(10, baseR * 0.24 * heightFactor);
        ctx.fillStyle = `rgba(48, 28, 8, ${0.32 * heightFactor})`;
        ctx.beginPath();
        ctx.ellipse(baseX, baseY + 6, shadowRx, shadowRy, 0, 0, Math.PI * 2);
        ctx.fill();

        // 2. Cute striped leaf-parachute during arrival
        if (this.parachuteOpen) {
          this._drawParachute(ctx, cx, cy - ry * 1.05, baseR * 1.25, time);
        }

        ctx.save();
        ctx.translate(cx, cy);

        // 3. Cute stubby feet (spread wider when inflated)
        const footSpread = rx * (0.44 + Math.max(0, this.visualLevel) * 0.015);
        const footY = ry * 0.84;
        this._drawFoot(ctx, -footSpread, footY, baseR * 0.28, -0.18 - Math.max(0, this.visualLevel) * 0.03);
        this._drawFoot(ctx, footSpread, footY, baseR * 0.28, 0.18 + Math.max(0, this.visualLevel) * 0.03);

        // 4. Cute stubby arms (splay outward & wiggle when giggling/inflating!)
        const armWave = this.state === 'giggle'
          ? Math.sin(time * 26) * 0.45
          : this.state === 'gulp' || this.state === 'prepop'
            ? -0.45
            : Math.sin(time * 2.8) * 0.08;
        this._drawArm(ctx, -rx * 0.86, ry * 0.05, baseR * 0.34, -0.45 - Math.max(0, this.visualLevel) * 0.05 + armWave, -1);
        this._drawArm(ctx, rx * 0.86, ry * 0.05, baseR * 0.34, 0.45 + Math.max(0, this.visualLevel) * 0.05 - armWave, 1);

        // 5. Ears / Horns / Antennae (behind or on top of head)
        this._drawEars(ctx, rx, ry, baseR, time);

        // 6. Volumetric Main Body (soft pear-sphere when idle, ultra-taut glossy sphere when inflated, wrinkly noodle when <0)
        this._drawBodyShape(ctx, rx, ry);

        // 7. Side Brass/Rubber Inflation Valve Plug (left side)
        ctx.save();
        ctx.translate(-rx * 0.96, ry * 0.14);
        ctx.fillStyle = '#d9a13b';
        ctx.strokeStyle = '#5e340b';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(-10, -9, 14, 18, 5);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // 8. Patterned Belly Patch (stretches with body)
        this._drawBellyPatch(ctx, rx, ry);

        // 9. Progressive Branching Pressure Cracks (levels 4..10)
        if (this.level >= 4 || this.visualLevel >= 3.6) {
          this._drawCracks(ctx, rx, ry, time);
        }

        // 10. Rosy Cheeks (get brighter & larger as pressure rises!)
        const rosyAlpha = 0.32 + Math.max(0, this.visualLevel) * 0.05;
        const cheekR = baseR * (0.17 + Math.max(0, this.visualLevel) * 0.012);
        const faceY = -ry * (0.14 - Math.max(0, this.visualLevel) * 0.008);
        const eyeSpacing = Math.min(rx * 0.44, baseR * 0.42 + Math.max(0, this.visualLevel) * 1.4);

        ctx.fillStyle = this.palette.cheek;
        ctx.globalAlpha = Math.min(0.85, rosyAlpha);
        ctx.beginPath();
        ctx.ellipse(-eyeSpacing * 1.38, faceY + baseR * 0.2, cheekR * 1.15, cheekR * 0.72, -0.1, 0, Math.PI * 2);
        ctx.ellipse(eyeSpacing * 1.38, faceY + baseR * 0.2, cheekR * 1.15, cheekR * 0.72, 0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        // 11. Expressive Glossy Eyes & Eyebrows
