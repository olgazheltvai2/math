  <script>
    /* ==========================================================================
       1. COLOR PALETTE FOR THE 10 YARN BALLS (Rich, cozy, distinct colors)
       ========================================================================== */
    const YARN_PALETTE = [
      { base: '#d95b43', light: '#f79c88', dark: '#7d2616', strand: '#ffbfb0' }, // 1: Terracotta Coral
      { base: '#e09b36', light: '#fad082', dark: '#80500c', strand: '#ffe4ad' }, // 2: Warm Mustard Gold
      { base: '#5a9e6f', light: '#9cd9ae', dark: '#245233', strand: '#c2f0d0' }, // 3: Sage Meadow Green
      { base: '#4a8db8', light: '#8fc9ed', dark: '#1c4966', strand: '#bae2fa' }, // 4: Cerulean Sky Blue
      { base: '#9468b0', light: '#cba6e3', dark: '#462859', strand: '#e5cdf5' }, // 5: Heather Lavender
      { base: '#cf6387', light: '#f5a6c0', dark: '#6e223b', strand: '#ffd1e0' }, // 6: Dusty Rose Berry
      { base: '#3d9991', light: '#82d9d1', dark: '#174f4a', strand: '#b6f2ed' }, // 7: Deep Sea Teal
      { base: '#d67438', light: '#f7ad7e', dark: '#75340d', strand: '#ffd0b3' }, // 8: Burnt Apricot Orange
      { base: '#6e7ab8', light: '#abb5eb', dark: '#2c3466', strand: '#d3dafc' }, // 9: Periwinkle Indigo
      { base: '#b85449', light: '#eb978d', dark: '#611d16', strand: '#ffc4bd' }  // 10: Crimson Cinnamon
    ];

    /* ==========================================================================
       HELPER: Bounce any inner visual <g> smoothly via JS without touching
       the outer <g transform="translate(X, Y)"> positioning!
       ========================================================================== */
    function animateInnerScale(el, peakScale = 1.14, duration = 320) {
      if (!el) return;
      const start = performance.now();
      function step(now) {
        const t = Math.min(1, (now - start) / duration);
        const s = 1 + (peakScale - 1) * Math.sin(t * Math.PI);
        el.setAttribute('transform', `scale(${s.toFixed(3)})`);
        if (t < 1) requestAnimationFrame(step);
        else el.setAttribute('transform', 'scale(1)');
      }
      requestAnimationFrame(step);
    }

    /* ==========================================================================
       2. SYNTHESIZED WEB AUDIO ENGINE (Realistic Quiet Purr, Marimba, Celebration)
       ========================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.purrGain = null;
        this.purrStopTimer = null;
        this.isPurring = false;
        this.numberFreqs = [
          261.63, // 1: C4
          293.66, // 2: D4
          329.63, // 3: E4
          392.00, // 4: G4
          440.00, // 5: A4
          523.25, // 6: C5
          587.33, // 7: D5
          659.25, // 8: E5
          783.99, // 9: G5
          880.00  // 10: A5
        ];
      }

      init() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
              this.setupPurrGenerator();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        } catch (err) {
          // Ignore audio context restrictions if blocked
        }
      }

      setupPurrGenerator() {
        if (!this.ctx) return;
        const ctx = this.ctx;

        this.purrGain = ctx.createGain();
        this.purrGain.gain.value = 0.0001;
        this.purrGain.connect(ctx.destination);

        const subOsc = ctx.createOscillator();
        subOsc.type = 'triangle';
        subOsc.frequency.value = 25.5;

        const breathLfo = ctx.createOscillator();
        breathLfo.type = 'sine';
        breathLfo.frequency.value = 0.42;
        const breathFreqGain = ctx.createGain();
        breathFreqGain.gain.value = 1.8;
        breathLfo.connect(breathFreqGain);
        breathFreqGain.connect(subOsc.frequency);

        const subFilter = ctx.createBiquadFilter();
        subFilter.type = 'lowpass';
        subFilter.frequency.value = 95;

        const subLevel = ctx.createGain();
        subLevel.gain.value = 0.35;

        subOsc.connect(subFilter);
        subFilter.connect(subLevel);
        subLevel.connect(this.purrGain);

        const bufferSize = ctx.sampleRate * 2;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.04;
          b6 = white * 0.115926;
        }

        const noiseNode = ctx.createBufferSource();
        noiseNode.buffer = noiseBuffer;
        noiseNode.loop = true;

        const bandpass = ctx.createBiquadFilter();
        bandpass.type = 'bandpass';
        bandpass.frequency.value = 240;
        bandpass.Q.value = 2.2;

        const rattleModGain = ctx.createGain();
        rattleModGain.gain.value = 0.25;

        const rattleLfo = ctx.createOscillator();
        rattleLfo.type = 'sine';
        rattleLfo.frequency.value = 25.5;
        const rattleDepth = ctx.createGain();
        rattleDepth.gain.value = 0.22;
        rattleLfo.connect(rattleDepth);
        rattleDepth.connect(rattleModGain.gain);

        noiseNode.connect(bandpass);
        bandpass.connect(rattleModGain);
        rattleModGain.connect(this.purrGain);

        subOsc.start();
        breathLfo.start();
        noiseNode.start();
        rattleLfo.start();
      }

      triggerQuietPurr(durationMs = 3400, intensity = 0.085) {
        if (this.muted) return;
        this.init();
        if (!this.ctx || !this.purrGain) return;

        const now = this.ctx.currentTime;
        this.isPurring = true;
        this.purrGain.gain.cancelScheduledValues(now);
        this.purrGain.gain.setValueAtTime(Math.max(0.001, this.purrGain.gain.value), now);
        this.purrGain.gain.linearRampToValueAtTime(intensity, now + 0.4);

        if (this.purrStopTimer) clearTimeout(this.purrStopTimer);
        this.purrStopTimer = setTimeout(() => {
          if (!this.ctx || !this.purrGain) return;
          const t = this.ctx.currentTime;
          this.purrGain.gain.cancelScheduledValues(t);
          this.purrGain.gain.setValueAtTime(this.purrGain.gain.value, t);
          this.purrGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
          this.isPurring = false;
        }, durationMs);
      }

      playPawStep() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(115 + Math.random() * 25, now);
        osc.frequency.exponentialRampToValueAtTime(48, now + 0.065);

        gain.gain.setValueAtTime(0.045, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.075);
      }

      playNumberReveal(numberOneToTen) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const idx = Math.max(0, Math.min(9, numberOneToTen - 1));
        const freq = this.numberFreqs[idx];

        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        const gain2 = this.ctx.createGain();

        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(freq, now);

        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(freq * 2, now);

        gain1.gain.setValueAtTime(0.001, now);
        gain1.gain.linearRampToValueAtTime(0.22, now + 0.018);
        gain1.gain.exponentialRampToValueAtTime(0.0008, now + 0.75);

        gain2.gain.setValueAtTime(0.001, now);
        gain2.gain.linearRampToValueAtTime(0.07, now + 0.012);
        gain2.gain.exponentialRampToValueAtTime(0.0005, now + 0.28);

        osc1.connect(gain1);
        osc2.connect(gain2);
        gain1.connect(this.ctx.destination);
        gain2.connect(this.ctx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.78);
        osc2.stop(now + 0.30);
      }

      playKittenChirp() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const mod = this.ctx.createOscillator();
        const modGain = this.ctx.createGain();
        const mainGain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(780, now + 0.14);
        osc.frequency.exponentialRampToValueAtTime(640, now + 0.24);

        mod.type = 'sine';
        mod.frequency.value = 32;
        modGain.gain.value = 28;

        mod.connect(modGain);
        modGain.connect(osc.frequency);

        mainGain.gain.setValueAtTime(0.001, now);
        mainGain.gain.linearRampToValueAtTime(0.08, now + 0.04);
        mainGain.gain.exponentialRampToValueAtTime(0.0008, now + 0.26);

        osc.connect(mainGain);
        mainGain.connect(this.ctx.destination);

        osc.start(now);
        mod.start(now);
        osc.stop(now + 0.28);
        mod.stop(now + 0.28);
      }

      playCelebrationFanfare(styleIndex = 0) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const chordPatterns = [
          [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50],
          [329.63, 392.00, 523.25, 587.33, 659.25, 783.99, 1046.50],
          [261.63, 392.00, 440.00, 523.25, 659.25, 880.00, 1046.50],
          [293.66, 392.00, 493.88, 587.33, 783.99, 987.77, 1174.66]
        ];

        const notes = chordPatterns[styleIndex % chordPatterns.length];
        notes.forEach((freq, idx) => {
          const delay = idx * 0.085;
          const now = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const oscHarm = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = styleIndex % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, now);

          oscHarm.type = 'sine';
          oscHarm.frequency.setValueAtTime(freq * 1.5, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.14, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.9);

          const harmGain = this.ctx.createGain();
          harmGain.gain.setValueAtTime(0.03, now);
          harmGain.gain.exponentialRampToValueAtTime(0.0005, now + 0.45);

          osc.connect(gain);
          oscHarm.connect(harmGain);
          gain.connect(this.ctx.destination);
          harmGain.connect(this.ctx.destination);

          osc.start(now);
          oscHarm.start(now);
          osc.stop(now + 0.95);
          oscHarm.stop(now + 0.5);
        });
      }

      playWoodClick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.055);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.065);
      }
    }

    const sound = new SoundEngine();

    /* ==========================================================================
       3. CANVAS PARTICLE & SUNBEAM DUST ENGINE
       Maps stage-svg (1600x900 meet) coordinates accurately to screen pixels
       ========================================================================== */
    class ParticleSystem {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.dustMotes = [];
        this.particles = [];
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.initDustMotes();
      }

      resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
      }

      // Convert stage-svg (1600x900 meet) coordinates to screen canvas coordinates
      svgToScreen(svgX, svgY) {
        const scale = Math.min(this.width / 1600, this.height / 900);
        const offsetX = (this.width - 1600 * scale) / 2;
        const offsetY = (this.height - 900 * scale) / 2;
        return {
          x: offsetX + svgX * scale,
          y: offsetY + svgY * scale,
          scale
        };
      }

      initDustMotes() {
        this.dustMotes = [];
        for (let i = 0; i < 50; i++) {
          this.dustMotes.push({
            x: Math.random() * this.width,
            y: Math.random() * this.height,
            r: 1.2 + Math.random() * 2.4,
            vx: 0.12 + Math.random() * 0.2,
            vy: -0.08 + Math.random() * 0.22,
            phase: Math.random() * Math.PI * 2,
            alpha: 0.2 + Math.random() * 0.55
          });
        }
      }

      spawnYarnRevealBurst(svgX, svgY, colorObj) {
        const pos = this.svgToScreen(svgX, svgY);
        const colors = [colorObj.base, colorObj.light, colorObj.strand, '#ffe58f', '#fff6d6'];

        for (let i = 0; i < 28; i++) {
          const angle = (Math.PI * 2 * i) / 28 + (Math.random() - 0.5) * 0.3;
          const speed = (2.5 + Math.random() * 6.2) * pos.scale;
          this.particles.push({
            type: i % 3 === 0 ? 'star' : 'yarn',
            x: pos.x,
            y: pos.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2 * pos.scale,
            gravity: 0.14 * pos.scale,
            size: (6 + Math.random() * 7) * pos.scale,
            color: colors[i % colors.length],
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.15,
            life: 1,
            decay: 0.016 + Math.random() * 0.012
          });
        }
      }

      spawnPurrHearts(svgX, svgY) {
        const pos = this.svgToScreen(svgX, svgY);
        const colors = ['#ff8fa3', '#ffb3c1', '#ffd6a5', '#ffe599'];
        for (let i = 0; i < 6; i++) {
          this.particles.push({
            type: 'heart',
            x: pos.x + (Math.random() - 0.5) * 55 * pos.scale,
            y: pos.y - 18 * pos.scale,
            vx: (Math.random() - 0.5) * 1.2 * pos.scale,
            vy: (-1.4 - Math.random() * 1.4) * pos.scale,
            gravity: -0.01 * pos.scale,
            size: (10 + Math.random() * 7) * pos.scale,
            color: colors[i % colors.length],
            rot: (Math.random() - 0.5) * 0.4,
            vRot: (Math.random() - 0.5) * 0.02,
            life: 1,
            decay: 0.012 + Math.random() * 0.008
          });
        }
      }

      spawnRoundCelebration(styleIndex, ballPositions, catPos) {
        const palette = ['#ff758f', '#ffd166', '#06d6a0', '#4ea8de', '#c77dff', '#ff9f1c'];

        if (styleIndex === 0) {
          ballPositions.forEach((b) => {
            const pos = this.svgToScreen(b.x, b.y);
            for (let i = 0; i < 5; i++) {
              this.particles.push({
                type: 'butterfly',
                x: pos.x + (Math.random() - 0.5) * 45 * pos.scale,
                y: pos.y,
                vx: (Math.random() - 0.5) * 3.2 * pos.scale,
                vy: (-2.0 - Math.random() * 2.4) * pos.scale,
                gravity: -0.015 * pos.scale,
                size: (13 + Math.random() * 8) * pos.scale,
                color: palette[(i + b.num) % palette.length],
                wingPhase: Math.random() * Math.PI * 2,
                rot: 0,
                vRot: 0,
                life: 1,
                decay: 0.007 + Math.random() * 0.005
              });
            }
          });
        } else if (styleIndex === 1) {
          const cPos = this.svgToScreen(catPos.x, catPos.y - 60);
          for (let i = 0; i < 36; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = (1.5 + Math.random() * 4.8) * cPos.scale;
            this.particles.push({
              type: i % 2 === 0 ? 'heart' : 'star',
              x: cPos.x + (Math.random() - 0.5) * 160 * cPos.scale,
              y: cPos.y + (Math.random() - 0.5) * 50 * cPos.scale,
              vx: Math.cos(angle) * speed * 0.7,
              vy: -Math.abs(Math.sin(angle) * speed) - 1.2 * cPos.scale,
              gravity: -0.01 * cPos.scale,
              size: (10 + Math.random() * 9) * cPos.scale,
              color: palette[i % palette.length],
              rot: (Math.random() - 0.5) * 0.5,
              vRot: (Math.random() - 0.5) * 0.03,
              life: 1,
              decay: 0.009 + Math.random() * 0.006
            });
          }
        } else if (styleIndex === 2) {
          ballPositions.forEach((b) => {
            const pos = this.svgToScreen(b.x, b.y - 25);
            for (let i = 0; i < 20; i++) {
              const angle = (Math.PI * 2 * i) / 20;
              const speed = (2.8 + Math.random() * 6.0) * pos.scale;
              this.particles.push({
                type: 'ribbon',
                x: pos.x,
                y: pos.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 3.2 * pos.scale,
                gravity: 0.12 * pos.scale,
                size: (11 + Math.random() * 9) * pos.scale,
                color: palette[(i + b.num) % palette.length],
                rot: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 0.14,
                life: 1,
                decay: 0.01 + Math.random() * 0.007
              });
            }
          });
        } else {
          ballPositions.forEach((b) => {
            const pos = this.svgToScreen(b.x, b.y);
            for (let i = 0; i < 18; i++) {
              const angle = (Math.PI * 2 * i) / 18;
              const speed = (2 + Math.random() * 4.2) * pos.scale;
              this.particles.push({
                type: 'star',
                x: pos.x,
                y: pos.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 1.5 * pos.scale,
                gravity: 0.04 * pos.scale,
                size: (9 + Math.random() * 8) * pos.scale,
                color: i % 2 === 0 ? '#ffe885' : '#9bf6ff',
                rot: Math.random() * Math.PI,
                vRot: 0.08,
                life: 1,
                decay: 0.01 + Math.random() * 0.006
              });
            }
          });
        }
      }

      updateAndDraw(time) {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.width, this.height);

        for (let m of this.dustMotes) {
          m.x += m.vx + Math.sin(time * 0.001 + m.phase) * 0.18;
          m.y += m.vy + Math.cos(time * 0.0012 + m.phase) * 0.12;
          if (m.x > this.width + 10) m.x = -10;
          if (m.y > this.height + 10) m.y = -10;
          if (m.y < -10) m.y = this.height + 10;

          const twinkle = 0.5 + 0.5 * Math.sin(time * 0.003 + m.phase);
          ctx.save();
          ctx.globalAlpha = m.alpha * twinkle;
          ctx.fillStyle = '#fff2b2';
          ctx.shadowColor = '#ffd966';
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.rot += p.vRot;
          p.life -= p.decay;

          if (p.life <= 0) {
            this.particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);

          if (p.type === 'star') {
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 8;
            this.drawFourPointStar(ctx, 0, 0, p.size, p.size * 0.38);
          } else if (p.type === 'heart') {
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 6;
            this.drawHeart(ctx, 0, 0, p.size);
          } else if (p.type === 'yarn' || p.type === 'ribbon') {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = p.type === 'ribbon' ? 4 : 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-p.size, 0);
            ctx.quadraticCurveTo(-p.size * 0.3, -p.size * 0.7, 0, 0);
            ctx.quadraticCurveTo(p.size * 0.3, p.size * 0.7, p.size, 0);
            ctx.stroke();
          } else if (p.type === 'butterfly') {
            p.wingPhase += 0.24;
            p.x += Math.sin(p.wingPhase * 0.3) * 1.2;
            const wingW = Math.abs(Math.cos(p.wingPhase)) * p.size;
            ctx.fillStyle = p.color;
            ctx.shadowColor = '#fff3b0';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.ellipse(-wingW * 0.5, -2, wingW * 0.65, p.size * 0.5, -0.3, 0, Math.PI * 2);
            ctx.ellipse(wingW * 0.5, -2, wingW * 0.65, p.size * 0.5, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#4a2508';
            ctx.fillRect(-1.5, -p.size * 0.35, 3, p.size * 0.7);
          }

          ctx.restore();
        }
      }

      drawFourPointStar(ctx, x, y, outerR, innerR) {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const r = i % 2 === 0 ? outerR : innerR;
          const a = (i * Math.PI) / 4;
          if (i === 0) ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
          else ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();
      }

      drawHeart(ctx, x, y, size) {
        const s = size * 0.55;
        ctx.beginPath();
        ctx.moveTo(x, y + s * 0.6);
        ctx.bezierCurveTo(x - s * 1.3, y - s * 0.2, x - s * 0.7, y - s * 1.2, x, y - s * 0.4);
        ctx.bezierCurveTo(x + s * 0.7, y - s * 1.2, x + s * 1.3, y - s * 0.2, x, y + s * 0.6);
        ctx.closePath();
        ctx.fill();
      }
    }

    /* ==========================================================================
       4. SVG YARN BALL GENERATOR (Detailed 3D Wound Yarn Strands + Stitched Tag)
       Uses a static outer <g transform="translate(x,y)"> and a large static
       <circle class="hit-target"> so clicking NEVER misses or moves the group!
       ========================================================================== */
    function createYarnBallSVG(number, x, y, radius, isRevealed, isNextHint = false) {
      const palette = YARN_PALETTE[(number - 1) % YARN_PALETTE.length];
      const ns = 'http://www.w3.org/2000/svg';
      const g = document.createElementNS(ns, 'g');
      g.setAttribute('class', 'interactive-node');
      g.setAttribute('transform', `translate(${x}, ${y})`);
      g.dataset.number = number;

      const gradId = `yarn-grad-${number}-${Math.round(x)}-${Math.round(y)}`;
      const r = radius;
      const fontSize = Math.round(r * 0.92);
      const badgeScale = isRevealed ? 1 : 0.001;
      const badgeOpacity = isRevealed ? 1 : 0;
      const mysteryOpacity = isRevealed ? 0 : 1;

      const pawHintHtml = (!isRevealed && isNextHint) ? `
        <g class="paw-hint-indicator" transform="translate(0, ${-r * 1.25})">
          <circle cx="0" cy="0" r="19" fill="#ffe484" fill-opacity="0.45" filter="url(#glow-gold)" />
          <ellipse cx="0" cy="4" rx="8" ry="6" fill="#fff3c4" stroke="#8c5319" stroke-width="1.5" />
          <circle cx="-8.5" cy="-4.5" r="3.5" fill="#fff3c4" stroke="#8c5319" stroke-width="1.3" />
          <circle cx="-3" cy="-8.5" r="3.5" fill="#fff3c4" stroke="#8c5319" stroke-width="1.3" />
          <circle cx="3" cy="-8.5" r="3.5" fill="#fff3c4" stroke="#8c5319" stroke-width="1.3" />
          <circle cx="8.5" cy="-4.5" r="3.5" fill="#fff3c4" stroke="#8c5319" stroke-width="1.3" />
        </g>
      ` : '';

      g.innerHTML = `
        <defs>
          <radialGradient id="${gradId}" cx="36%" cy="32%" r="68%">
            <stop offset="0%" stop-color="${palette.light}" />
            <stop offset="52%" stop-color="${palette.base}" />
            <stop offset="88%" stop-color="${palette.dark}" />
            <stop offset="100%" stop-color="#261107" />
          </radialGradient>
        </defs>

        <!-- Floor Shadow -->
        <ellipse cx="0" cy="${r * 0.85}" rx="${r * 0.92}" ry="${r * 0.28}" fill="#1f0e05" fill-opacity="0.52" />

        <!-- Loose curly yarn tail -->
        <path d="M${r * 0.65} ${r * 0.55} Q${r * 1.15} ${r * 0.82} ${r * 1.32} ${r * 0.52} T${r * 1.55} ${r * 0.68}"
              fill="none" stroke="${palette.base}" stroke-width="${Math.max(4, r * 0.1)}" stroke-linecap="round" />
        <path d="M${r * 0.65} ${r * 0.55} Q${r * 1.15} ${r * 0.82} ${r * 1.32} ${r * 0.52} T${r * 1.55} ${r * 0.68}"
              fill="none" stroke="${palette.strand}" stroke-width="${Math.max(1.5, r * 0.035)}" stroke-dasharray="4 4" stroke-linecap="round" />

        <!-- Inner Rotator / Scaler Group at local (0,0) -->
        <g class="yarn-ball-rotator" transform="scale(1)">
          <!-- Soft Golden Highlight Ring if this is the next suggested ball to click -->
          <circle class="next-ball-halo" cx="0" cy="0" r="${r + 7}" fill="none" stroke="#ffe27a" stroke-width="4" opacity="${(!isRevealed && isNextHint) ? '0.8' : '0'}" />

          <g class="yarn-sphere-inner">
            <circle cx="0" cy="0" r="${r}" fill="url(#${gradId})" stroke="${palette.dark}" stroke-width="2.5" />

            <!-- Criss-crossing curved yarn wind lines -->
            <g fill="none" stroke="${palette.strand}" stroke-opacity="0.45" stroke-width="${r * 0.085}" stroke-linecap="round">
              <path d="M${-r * 0.82} ${-r * 0.35} Q${-r * 0.1} ${-r * 0.88} ${r * 0.78} ${-r * 0.25}" />
              <path d="M${-r * 0.88} ${-r * 0.08} Q0 ${-r * 0.62} ${r * 0.86} ${r * 0.05}" />
              <path d="M${-r * 0.75} ${r * 0.22} Q${r * 0.08} ${-r * 0.32} ${r * 0.82} ${r * 0.35}" />

              <path d="M${-r * 0.45} ${-r * 0.82} Q${-r * 0.65} 0 ${-r * 0.15} ${r * 0.88}" />
              <path d="M${-r * 0.15} ${-r * 0.92} Q${-r * 0.35} 0 ${r * 0.18} ${r * 0.92}" />
              <path d="M${r * 0.18} ${-r * 0.86} Q${-r * 0.05} 0 ${r * 0.48} ${r * 0.82}" />

              <path d="M${-r * 0.65} ${r * 0.58} Q${r * 0.15} ${r * 0.85} ${r * 0.75} ${r * 0.15}" />
              <path d="M${-r * 0.55} ${r * 0.75} Q${r * 0.25} ${r * 0.95} ${r * 0.82} ${r * 0.38}" />
            </g>

            <!-- Darker depth grooves -->
            <g fill="none" stroke="${palette.dark}" stroke-opacity="0.48" stroke-width="${r * 0.045}" stroke-linecap="round">
              <path d="M${-r * 0.85} ${-r * 0.2} Q0 ${-r * 0.75} ${r * 0.82} ${-r * 0.1}" />
              <path d="M${-r * 0.3} ${-r * 0.88} Q${-r * 0.5} 0 ${0} ${r * 0.9}" />
              <path d="M${-r * 0.6} ${r * 0.68} Q${r * 0.2} ${r * 0.9} ${r * 0.78} ${r * 0.28}" />
            </g>

            <!-- Specular highlight -->
            <ellipse cx="${-r * 0.32}" cy="${-r * 0.34}" rx="${r * 0.34}" ry="${r * 0.2}" transform="rotate(-28 ${-r * 0.32} ${-r * 0.34})" fill="#ffffff" fill-opacity="0.22" />
          </g>

          <!-- Mystery Yarn Knot Swirl (Shown when unrevealed) -->
          <g class="mystery-knot-overlay" opacity="${mysteryOpacity}">
            <circle cx="0" cy="0" r="${r * 0.32}" fill="${palette.dark}" fill-opacity="0.38" />
            <path d="M${-r * 0.22} ${-r * 0.1} Q0 ${-r * 0.32} ${r * 0.22} ${-r * 0.08} Q${r * 0.32} ${r * 0.18} 0 ${r * 0.24} Q${-r * 0.28} ${r * 0.16} ${-r * 0.12} 0"
                  fill="none" stroke="${palette.strand}" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
          </g>

          <!-- Cozy Stitched Felt Number Badge -->
          <g class="yarn-number-badge" transform="scale(${badgeScale})" opacity="${badgeOpacity}">
            <circle cx="0" cy="0" r="${r * 0.64}" fill="url(#felt-badge-grad)" stroke="#5c3818" stroke-width="2.5" />
            <circle cx="0" cy="0" r="${r * 0.55}" fill="none" stroke="#8c5830" stroke-width="1.8" stroke-dasharray="5 4" />
            <text x="0" y="${fontSize * 0.35}" text-anchor="middle" font-size="${fontSize}" font-weight="bold" fill="#3b1d0a" stroke="#fff6e6" stroke-width="1.5" paint-order="stroke">${number}</text>
          </g>
        </g>

        ${pawHintHtml}

        <!-- Generous Static Transparent Hit Target so clicks NEVER fail -->
        <circle class="hit-target" cx="0" cy="0" r="${r * 1.18}" />
      `;

      return g;
    }

    /* ==========================================================================
       5. KITTEN ANIMATION & EMOTION CONTROLLER
       Handles smooth walking between balls, 5+ emotional states, blinking, purring
       ========================================================================== */
    class KittenController {
      constructor() {
        this.root = document.getElementById('kitten-root');
        this.flipGroup = document.getElementById('kitten-flip-group');
        this.bodyRig = document.getElementById('kitten-body-rig');
        this.head = document.getElementById('cat-head');
        this.tailGroup = document.getElementById('cat-tail-group');
        this.earL = document.getElementById('ear-l');
        this.earR = document.getElementById('ear-r');
        this.legFL = document.getElementById('leg-fl');
        this.legFR = document.getElementById('leg-fr');
        this.legBL = document.getElementById('leg-bl');
        this.legBR = document.getElementById('leg-br');
        this.eyesOpen = document.getElementById('cat-eyes-open');
        this.eyesHappy = document.getElementById('cat-eyes-happy');
        this.eyelidL = document.getElementById('eyelid-l');
        this.eyelidR = document.getElementById('eyelid-r');
        this.pupilL = document.getElementById('pupil-l');
        this.pupilR = document.getElementById('pupil-r');
        this.blush = document.getElementById('cat-blush');
        this.mouthOpen = document.getElementById('cat-mouth-open');
        this.purrRipples = document.getElementById('purr-ripples');

        this.x = 800;
        this.y = 645;
        this.facing = 1;
        this.emotion = 'calm';
        this.emotionTimer = null;
        this.walkState = null;
        this.lastStepTime = 0;

        this.nextBlinkTime = performance.now() + 2400;
        this.isBlinking = false;
      }

      setPositionImmediate(x, y, facing = 1) {
        this.walkState = null;
        this.x = x;
        this.y = y;
        this.facing = facing;
        this.root.setAttribute('transform', `translate(${this.x}, ${this.y})`);
        this.flipGroup.setAttribute('transform', `scale(${this.facing}, 1)`);
        this.setEmotion('calm');
      }

      setEmotion(emotionName, durationMs = 0) {
        this.emotion = emotionName;
        if (this.emotionTimer) {
          clearTimeout(this.emotionTimer);
          this.emotionTimer = null;
        }

        this.eyesOpen.setAttribute('opacity', '1');
        this.eyesHappy.setAttribute('opacity', '0');
        this.blush.style.opacity = '0';
        this.mouthOpen.setAttribute('opacity', '0');
        this.pupilL.setAttribute('rx', '5');
        this.pupilR.setAttribute('rx', '5');

        if (emotionName === 'curious') {
          this.pupilL.setAttribute('rx', '7.8');
          this.pupilR.setAttribute('rx', '7.8');
          this.mouthOpen.setAttribute('opacity', '0.7');
        } else if (emotionName === 'purring') {
          this.eyesOpen.setAttribute('opacity', '0');
          this.eyesHappy.setAttribute('opacity', '1');
          this.blush.style.opacity = '1';
        } else if (emotionName === 'excited') {
          this.pupilL.setAttribute('rx', '8.2');
          this.pupilR.setAttribute('rx', '8.2');
          this.blush.style.opacity = '0.85';
          this.mouthOpen.setAttribute('opacity', '1');
        } else if (emotionName === 'celebrating') {
          this.eyesOpen.setAttribute('opacity', '0');
          this.eyesHappy.setAttribute('opacity', '1');
          this.blush.style.opacity = '1';
          this.mouthOpen.setAttribute('opacity', '1');
        }

        if (durationMs > 0) {
          this.emotionTimer = setTimeout(() => {
            if (this.emotion !== 'walking') {
              this.setEmotion('calm');
            }
          }, durationMs);
        }
      }

      walkTo(targetX, targetY, onArrive) {
        const dx = targetX - this.x;
        const dy = targetY - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 6) {
          this.x = targetX;
          this.y = targetY;
          this.root.setAttribute('transform', `translate(${this.x}, ${this.y})`);
          if (onArrive) onArrive();
          return;
        }

        this.facing = dx >= 0 ? 1 : -1;
        this.flipGroup.setAttribute('transform', `scale(${this.facing}, 1)`);
        this.setEmotion('walking');

        const duration = Math.min(900, Math.max(340, dist * 1.35));
        this.walkState = {
          startX: this.x,
          startY: this.y,
          targetX,
          targetY,
          startTime: performance.now(),
          duration,
          onArrive
        };
      }

      update(now) {
        if (this.walkState) {
          const elapsed = now - this.walkState.startTime;
          const t = Math.min(1, elapsed / this.walkState.duration);
          const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

          this.x = this.walkState.startX + (this.walkState.targetX - this.walkState.startX) * ease;
          this.y = this.walkState.startY + (this.walkState.targetY - this.walkState.startY) * ease;

          const stepPhase = elapsed * 0.026;
          const bounceY = -Math.abs(Math.sin(stepPhase)) * 10;
          const bodyTilt = Math.sin(stepPhase) * 3.2;

          this.root.setAttribute('transform', `translate(${this.x}, ${this.y})`);
          this.bodyRig.setAttribute('transform', `translate(0, ${bounceY}) rotate(${bodyTilt})`);

          const flSwing = Math.sin(stepPhase) * 22;
          const frSwing = -Math.sin(stepPhase) * 22;
          this.legFL.setAttribute('transform', `translate(-14, 11) rotate(${flSwing})`);
          this.legFR.setAttribute('transform', `translate(18, 11) rotate(${frSwing})`);
          this.legBL.setAttribute('transform', `translate(-34, 16) rotate(${frSwing * 0.6})`);
          this.legBR.setAttribute('transform', `translate(30, 18) rotate(${flSwing * 0.6})`);

          if (now - this.lastStepTime > 170) {
            sound.playPawStep();
            this.lastStepTime = now;
          }

          if (t >= 1) {
            const cb = this.walkState.onArrive;
            this.walkState = null;
            this.legFL.setAttribute('transform', 'translate(-14, 11)');
            this.legFR.setAttribute('transform', 'translate(18, 11)');
            this.legBL.setAttribute('transform', 'translate(-34, 16)');
            this.legBR.setAttribute('transform', 'translate(30, 18)');
            this.bodyRig.setAttribute('transform', 'translate(0, 0)');
            if (cb) cb();
          }
          return;
        }

        const breath = Math.sin(now * 0.0032);
        const tailAngle = Math.sin(now * 0.0028) * 14 + (this.emotion === 'celebrating' ? Math.sin(now * 0.015) * 18 : 0);
        this.tailGroup.setAttribute('transform', `translate(-44, 10) rotate(${tailAngle})`);

        if (sound.isPurring || this.emotion === 'purring') {
          const vibX = Math.sin(now * 0.16) * 0.8;
          const vibY = Math.cos(now * 0.18) * 0.6;
          this.bodyRig.setAttribute('transform', `translate(${vibX}, ${breath * 1.8 + vibY}) scale(1, ${1 + breath * 0.012})`);
          const ripplePulse = 0.4 + 0.35 * Math.sin(now * 0.008);
          this.purrRipples.setAttribute('opacity', ripplePulse.toFixed(2));
        } else if (this.emotion === 'celebrating') {
          const hopY = -Math.abs(Math.sin(now * 0.009)) * 20;
          const stretch = 1 + Math.sin(now * 0.009) * 0.06;
          this.bodyRig.setAttribute('transform', `translate(0, ${hopY}) scale(${1 / stretch}, ${stretch})`);
          const pawWave = Math.sin(now * 0.018) * 24;
          this.legFL.setAttribute('transform', `translate(-14, 6) rotate(${pawWave})`);
          this.legFR.setAttribute('transform', `translate(18, 6) rotate(${-pawWave})`);
          this.purrRipples.setAttribute('opacity', '0');
        } else {
          this.bodyRig.setAttribute('transform', `translate(0, ${breath * 1.8}) scale(1, ${1 + breath * 0.01})`);
          this.legFL.setAttribute('transform', 'translate(-14, 11)');
          this.legFR.setAttribute('transform', 'translate(18, 11)');
          this.purrRipples.setAttribute('opacity', '0');
        }

        let headTilt = Math.sin(now * 0.0018) * 2.5;
        if (this.emotion === 'curious') headTilt = 11 + Math.sin(now * 0.004) * 3;
        else if (this.emotion === 'purring') headTilt = -6 + Math.sin(now * 0.003) * 2;
        else if (this.emotion === 'excited') headTilt = -4 + Math.cos(now * 0.006) * 4;
        this.head.setAttribute('transform', `translate(4, -68) rotate(${headTilt})`);

        const earTwitchL = Math.sin(now * 0.0025) * 4 + (this.emotion === 'curious' ? -8 : 0);
        const earTwitchR = -Math.cos(now * 0.0029) * 4 + (this.emotion === 'curious' ? 8 : 0);
        this.earL.setAttribute('transform', `translate(-32, -30) rotate(${earTwitchL})`);
        this.earR.setAttribute('transform', `translate(32, -30) rotate(${earTwitchR})`);

        if (!this.isBlinking && now > this.nextBlinkTime) {
          this.isBlinking = true;
          this.blinkStart = now;
          this.nextBlinkTime = now + 2600 + Math.random() * 2800;
        }

        if (this.isBlinking) {
          const bt = (now - this.blinkStart) / 180;
          if (bt >= 1) {
            this.isBlinking = false;
            this.eyelidL.setAttribute('transform', 'scale(1, 0)');
            this.eyelidR.setAttribute('transform', 'scale(1, 0)');
          } else {
            const closeAmt = Math.sin(bt * Math.PI);
            this.eyelidL.setAttribute('transform', `scale(1, ${closeAmt})`);
            this.eyelidR.setAttribute('transform', `scale(1, ${closeAmt})`);
          }
        }
      }
    }

    /* ==========================================================================
       6. MAIN GAME CONTROLLER
       ========================================================================== */
    class NumberLineCatGame {
      constructor() {
        this.canvas = document.getElementById('fx-canvas');
        this.particles = new ParticleSystem(this.canvas);
        this.kitten = new KittenController();

        this.yarnLayer = document.getElementById('yarn-balls-layer');
        this.connectingLayer = document.getElementById('yarn-connecting-layer');
        this.pawTrailLayer = document.getElementById('paw-trail-layer');
        this.taskEmblemContent = document.getElementById('task-emblem-content');
        this.shelfContainer = document.getElementById('shelf-balls-container');
        this.helperShelfWrapper = document.getElementById('helper-shelf-wrapper');
        this.helperActiveRing = document.getElementById('helper-active-ring');
        this.nextPulseHalo = document.getElementById('next-pulse-halo');

        // Optional teacher filters (0 = All, 1 = Forward +, -1 = Backward -)
        this.dirFilter = 0;
        // Step filter (0 = All 1..3, or 1, 2, 3)
        this.stepFilter = 0;

        this.roundData = null;
        this.lastSignature = '';
        this.celebrationCounter = 0;
        this.helperOpen = false;
        this.shelfCurrentY = -220;
        this.shelfTargetY = -220;

        this.buildHelperShelf();
        this.bindEvents();
        this.generateNewRound(true);
        this.startLoop();
      }

      /* ------------------------------------------------------------------------
         Build the 1..10 Collapsible Helper Shelf at the top of the room
         ------------------------------------------------------------------------ */
      buildHelperShelf() {
        this.shelfContainer.innerHTML = '';
        const ns = 'http://www.w3.org/2000/svg';
        const startX = 346;
        const spacing = 101;

        for (let num = 1; num <= 10; num++) {
          const cx = startX + (num - 1) * spacing;
          const cy = 73;

          const itemGroup = document.createElementNS(ns, 'g');
          itemGroup.setAttribute('id', `shelf-item-${num}`);

          const ring = document.createElementNS(ns, 'circle');
          ring.setAttribute('id', `shelf-ring-${num}`);
          ring.setAttribute('cx', cx);
          ring.setAttribute('cy', cy);
          ring.setAttribute('r', '36');
          ring.setAttribute('fill', 'none');
          ring.setAttribute('stroke', '#ffe27a');
          ring.setAttribute('stroke-width', '3.5');
          ring.setAttribute('opacity', '0');
          itemGroup.appendChild(ring);

          const miniBall = createYarnBallSVG(num, cx, cy, 28, true, false);
          miniBall.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            sound.init();
            sound.playNumberReveal(num);
            sound.triggerQuietPurr(1800, 0.06);
            this.particles.spawnYarnRevealBurst(cx, cy, YARN_PALETTE[num - 1]);
            const rotator = miniBall.querySelector('.yarn-ball-rotator');
            animateInnerScale(rotator, 1.2, 320);
          });

          itemGroup.appendChild(miniBall);
          this.shelfContainer.appendChild(itemGroup);
        }
      }

      updateHelperShelfHighlights() {
        if (!this.roundData) return;
        for (let num = 1; num <= 10; num++) {
          const ring = document.getElementById(`shelf-ring-${num}`);
          if (!ring) continue;

          const ballItem = this.roundData.balls.find((b) => b.num === num);
          if (!ballItem) {
            ring.setAttribute('opacity', '0');
          } else if (ballItem.num === this.roundData.startNum) {
            ring.setAttribute('stroke', '#ffd966');
            ring.setAttribute('stroke-dasharray', 'none');
            ring.setAttribute('opacity', '0.95');
          } else {
            ring.setAttribute('stroke', ballItem.revealed ? '#9ef0b6' : '#ffd966');
            ring.setAttribute('stroke-dasharray', ballItem.revealed ? 'none' : '6 4');
            ring.setAttribute('opacity', '0.8');
          }
        }
      }

      /* ------------------------------------------------------------------------
         Render the visual non-verbal Task Emblem on the rug (+1/+2/+3 or -1/-2/-3)
         ------------------------------------------------------------------------ */
      renderTaskEmblem() {
        if (!this.roundData || !this.taskEmblemContent) return;
        const { dir, steps } = this.roundData;
        const signStr = dir === 1 ? `+${steps}` : `-${steps}`;
        const arrowColor = dir === 1 ? '#3c8c50' : '#c95238';

        // Draw direction arrow, step badge, and step pips (small yarn dots)
        let pipsHtml = '';
        for (let i = 0; i < steps; i++) {
          const px = 38 + i * 22;
          pipsHtml += `<circle cx="${px}" cy="0" r="7.5" fill="${arrowColor}" stroke="#fff6e6" stroke-width="1.8" />`;
        }

        const arrowPath = dir === 1
          ? `<path d="M-88 0 L-46 0 M-58 -11 L-44 0 L-58 11" fill="none" stroke="${arrowColor}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />`
          : `<path d="M-44 0 L-86 0 M-74 -11 L-88 0 L-74 11" fill="none" stroke="${arrowColor}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />`;

        this.taskEmblemContent.innerHTML = `
          ${arrowPath}
          <text x="-6" y="10" text-anchor="middle" font-size="30" font-weight="bold" fill="#3b1d0a" stroke="#fff8eb" stroke-width="1.5" paint-order="stroke">${signStr}</text>
          ${pipsHtml}
        `;
      }

      /* ------------------------------------------------------------------------
         Generate a New Counting Task:
         steps in {1, 2, 3}, direction in {+1 (forward), -1 (backward)}
         ------------------------------------------------------------------------ */
      generateNewRound(isFirstRound = false) {
        let steps, dir, startNum, sig;
        let attempts = 0;

        do {
          steps = this.stepFilter !== 0 ? this.stepFilter : [1, 2, 3][Math.floor(Math.random() * 3)];
          dir = this.dirFilter !== 0 ? this.dirFilter : (Math.random() < 0.5 ? 1 : -1);

          if (dir === 1) {
            const maxStart = 10 - steps;
            startNum = 1 + Math.floor(Math.random() * maxStart);
          } else {
            const minStart = 1 + steps;
            startNum = minStart + Math.floor(Math.random() * (10 - minStart + 1));
          }
          sig = `${startNum}:${dir}:${steps}`;
          attempts++;
        } while (sig === this.lastSignature && attempts < 15);

        this.lastSignature = sig;

        const totalBalls = steps + 1;
        const nums = [];
        for (let i = 0; i <= steps; i++) {
          nums.push(startNum + dir * i);
        }
        // Sort left-to-right in ascending order so:
        // Forward (+): startNum is on the LEFT, hidden balls on the RIGHT.
        // Backward (-): startNum is on the RIGHT, hidden balls on the LEFT.
        nums.sort((a, b) => a - b);

        const spacing = totalBalls === 4 ? 225 : totalBalls === 3 ? 255 : 280;
        const centerX = 800;
        const baseY = 745;

        const balls = nums.map((num, idx) => {
          const x = centerX + (idx - (totalBalls - 1) / 2) * spacing;
          const y = baseY + Math.abs(idx - (totalBalls - 1) / 2) * 7;
          return {
            num,
            x,
            y,
            revealed: num === startNum
          };
        });

        this.roundData = {
          startNum,
          dir,
          steps,
          balls,
          completed: false
        };

        if (this.nextPulseHalo) {
          this.nextPulseHalo.setAttribute('opacity', '0');
        }

        this.renderTaskEmblem();
        this.renderRoundScene(isFirstRound);
        this.updateHelperShelfHighlights();
      }

      getNextSequentialBall() {
        if (!this.roundData) return null;
        const { startNum, dir, steps, balls } = this.roundData;
        for (let i = 1; i <= steps; i++) {
          const targetNum = startNum + dir * i;
          const found = balls.find((b) => b.num === targetNum);
          if (found && !found.revealed) return found;
        }
        return null;
      }

      /* ------------------------------------------------------------------------
         Render Connecting Yarn Strand, Directional Paw Prints, and Yarn Balls
         ------------------------------------------------------------------------ */
      renderRoundScene(placeCatImmediately = false) {
        this.yarnLayer.innerHTML = '';
        this.connectingLayer.innerHTML = '';
        this.pawTrailLayer.innerHTML = '';

        const ns = 'http://www.w3.org/2000/svg';
        const { balls, startNum, dir } = this.roundData;
        const nextBall = this.getNextSequentialBall();

        // 1) Unwinding yarn strand connecting the balls on the rug
        if (balls.length >= 2) {
          let pathD = `M ${balls[0].x} ${balls[0].y + 36}`;
          for (let i = 1; i < balls.length; i++) {
            const prev = balls[i - 1];
            const curr = balls[i];
            const midX = (prev.x + curr.x) / 2;
            const waveY = prev.y + 44 + (i % 2 === 0 ? -12 : 12);
            pathD += ` Q ${midX} ${waveY} ${curr.x} ${curr.y + 36}`;
          }

          const strandShadow = document.createElementNS(ns, 'path');
          strandShadow.setAttribute('d', pathD);
          strandShadow.setAttribute('fill', 'none');
          strandShadow.setAttribute('stroke', '#331809');
          strandShadow.setAttribute('stroke-width', '8');
          strandShadow.setAttribute('stroke-linecap', 'round');
          strandShadow.setAttribute('opacity', '0.45');
          this.connectingLayer.appendChild(strandShadow);

          const strandMain = document.createElementNS(ns, 'path');
          strandMain.setAttribute('d', pathD);
          strandMain.setAttribute('fill', 'none');
          strandMain.setAttribute('stroke', '#f5dec2');
          strandMain.setAttribute('stroke-width', '5.5');
          strandMain.setAttribute('stroke-linecap', 'round');
          this.connectingLayer.appendChild(strandMain);

          const strandTwist = document.createElementNS(ns, 'path');
          strandTwist.setAttribute('d', pathD);
          strandTwist.setAttribute('fill', 'none');
          strandTwist.setAttribute('stroke', '#c97b53');
          strandTwist.setAttribute('stroke-width', '2.8');
          strandTwist.setAttribute('stroke-dasharray', '7 7');
          strandTwist.setAttribute('stroke-linecap', 'round');
          this.connectingLayer.appendChild(strandTwist);
        }

        // 2) Directional glowing paw-print trail on the rug
        const startBall = balls.find((b) => b.num === startNum);
        const endBall = balls.find((b) => b.num === startNum + dir * this.roundData.steps);
        if (startBall && endBall) {
          const totalDist = endBall.x - startBall.x;
          const pawCount = this.roundData.steps * 2;
          for (let p = 1; p <= pawCount; p++) {
            const frac = p / (pawCount + 1);
            const px = startBall.x + totalDist * frac;
            const py = 695 + (p % 2 === 0 ? -6 : 6);
            const angle = dir === 1 ? 90 : -90;

            const paw = document.createElementNS(ns, 'g');
            paw.setAttribute('transform', `translate(${px}, ${py}) rotate(${angle}) scale(0.72)`);
            paw.setAttribute('opacity', '0.35');
            paw.innerHTML = `
              <ellipse cx="0" cy="4" rx="7" ry="5" fill="#fff0c2" />
              <circle cx="-7" cy="-4" r="3" fill="#fff0c2" />
              <circle cx="-2.5" cy="-7" r="3" fill="#fff0c2" />
              <circle cx="2.5" cy="-7" r="3" fill="#fff0c2" />
              <circle cx="7" cy="-4" r="3" fill="#fff0c2" />
            `;
            this.pawTrailLayer.appendChild(paw);
          }
        }

        // 3) Render each interactive Yarn Ball (radius 58)
        balls.forEach((b) => {
          const isHint = nextBall && nextBall.num === b.num;
          const ballEl = createYarnBallSVG(b.num, b.x, b.y, 58, b.revealed, isHint);
          b.element = ballEl;

          // Bind pointerdown so every single tap/click registers immediately!
          ballEl.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            this.handleYarnBallClick(b);
          });

          this.yarnLayer.appendChild(ballEl);
        });

        // 4) Position Kitten beside the starting yarn ball
        if (startBall) {
          const catTargetX = startBall.x;
          const catTargetY = startBall.y - 88;
          const faceDir = dir === 1 ? 1 : -1;

          if (placeCatImmediately) {
            this.kitten.setPositionImmediate(catTargetX, catTargetY, faceDir);
            sound.triggerQuietPurr(2600, 0.065);
          } else {
            this.kitten.walkTo(catTargetX, catTargetY, () => {
              this.kitten.facing = faceDir;
              this.kitten.flipGroup.setAttribute('transform', `scale(${faceDir}, 1)`);
              this.kitten.setEmotion('curious', 2000);
              sound.triggerQuietPurr(2600, 0.075);
            });
          }
        }
      }

      /* ------------------------------------------------------------------------
         Handle Clicking a Yarn Ball:
         1) Immediately reveals the number on the yarn ball with sound & sparkles
         2) Walks the kitten right over to sit beside the clicked yarn ball,
            changes its emotion, and purrs!
         ------------------------------------------------------------------------ */
      handleYarnBallClick(ballObj) {
        sound.init();

        const rotator = ballObj.element ? ballObj.element.querySelector('.yarn-ball-rotator') : null;
        animateInnerScale(rotator, 1.16, 360);

        if (!ballObj.revealed) {
          // Immediately reveal the number badge so the child gets instant responsive feedback!
          ballObj.revealed = true;

          const badge = ballObj.element.querySelector('.yarn-number-badge');
          const knot = ballObj.element.querySelector('.mystery-knot-overlay');

          if (knot) knot.setAttribute('opacity', '0');
          if (badge) {
            badge.setAttribute('opacity', '1');
            animateInnerScale(badge, 1.18, 380);
          }

          this.refreshPawHints();
          this.updateHelperShelfHighlights();

          sound.playNumberReveal(ballObj.num);
          this.particles.spawnYarnRevealBurst(ballObj.x, ballObj.y, YARN_PALETTE[ballObj.num - 1]);
        } else {
          // Clicking an already revealed ball plays its note & sparkles
          sound.playNumberReveal(ballObj.num);
          this.particles.spawnYarnRevealBurst(ballObj.x, ballObj.y, YARN_PALETTE[ballObj.num - 1]);
        }

        // Walk the kitten over to sit beside the clicked yarn ball
        const targetCatX = ballObj.x;
        const targetCatY = ballObj.y - 88;

        this.kitten.walkTo(targetCatX, targetCatY, () => {
          const nextUnrevealed = this.getNextSequentialBall();
          if (nextUnrevealed && nextUnrevealed.num !== ballObj.num) {
            const lookDir = nextUnrevealed.x >= ballObj.x ? 1 : -1;
            this.kitten.facing = lookDir;
            this.kitten.flipGroup.setAttribute('transform', `scale(${lookDir}, 1)`);
          }

          const emotions = ['purring', 'excited', 'curious'];
          const chosenEmotion = emotions[ballObj.num % emotions.length];
          this.kitten.setEmotion(chosenEmotion, 3200);
          sound.triggerQuietPurr(3500, 0.088);
          this.particles.spawnPurrHearts(this.kitten.x, this.kitten.y - 55);

          // Check if all balls in this round are now revealed
          const allDone = this.roundData.balls.every((b) => b.revealed);
          if (allDone && !this.roundData.completed) {
            this.roundData.completed = true;
            setTimeout(() => this.triggerRoundCompleteCelebration(), 260);
          }
        });
      }

      refreshPawHints() {
        const oldHints = this.yarnLayer.querySelectorAll('.paw-hint-indicator');
        oldHints.forEach((h) => h.remove());

        const allHalos = this.yarnLayer.querySelectorAll('.next-ball-halo');
        allHalos.forEach((h) => h.setAttribute('opacity', '0'));

        const nextBall = this.getNextSequentialBall();
        if (nextBall && nextBall.element) {
          const halo = nextBall.element.querySelector('.next-ball-halo');
          if (halo) halo.setAttribute('opacity', '0.85');

          const ns = 'http://www.w3.org/2000/svg';
          const hintG = document.createElementNS(ns, 'g');
          hintG.setAttribute('class', 'paw-hint-indicator');
          hintG.setAttribute('transform', 'translate(0, -73)');
          hintG.innerHTML = `
            <circle cx="0" cy="0" r="19" fill="#ffe484" fill-opacity="0.45" filter="url(#glow-gold)" />
            <ellipse cx="0" cy="4" rx="8" ry="6" fill="#fff3c4" stroke="#8c5319" stroke-width="1.5" />
            <circle cx="-8.5" cy="-4.5" r="3.5" fill="#fff3c4" stroke="#8c5319" stroke-width="1.3" />
            <circle cx="-3" cy="-8.5" r="3.5" fill="#fff3c4" stroke="#8c5319" stroke-width="1.3" />
            <circle cx="3" cy="-8.5" r="3.5" fill="#fff3c4" stroke="#8c5319" stroke-width="1.3" />
            <circle cx="8.5" cy="-4.5" r="3.5" fill="#fff3c4" stroke="#8c5319" stroke-width="1.3" />
          `;
          // Insert before hit-target so hit-target stays on top
          const hitTarget = nextBall.element.querySelector('.hit-target');
          nextBall.element.insertBefore(hintG, hitTarget);
        }
      }

      /* ------------------------------------------------------------------------
         Active, Varied Non-Verbal Celebration when all balls are revealed
         ------------------------------------------------------------------------ */
      triggerRoundCompleteCelebration() {
        const styleIdx = this.celebrationCounter % 4;
        this.celebrationCounter++;

        sound.playCelebrationFanfare(styleIdx);
        sound.triggerQuietPurr(4200, 0.095);
        this.kitten.setEmotion('celebrating', 3400);

        if (this.nextPulseHalo) {
          this.nextPulseHalo.setAttribute('opacity', '0.9');
        }

        this.particles.spawnRoundCelebration(styleIdx, this.roundData.balls, {
          x: this.kitten.x,
          y: this.kitten.y
        });

        const orderedBalls = [...this.roundData.balls].sort((a, b) =>
          this.roundData.dir === 1 ? a.num - b.num : b.num - a.num
        );

        orderedBalls.forEach((b, idx) => {
          setTimeout(() => {
            if (!b.element) return;
            const rotator = b.element.querySelector('.yarn-ball-rotator');
            animateInnerScale(rotator, 1.2, 420);
          }, idx * 120);
        });
      }

      /* ------------------------------------------------------------------------
         Bind UI Controls & Kitten Petting Interaction via reliable pointerdown
         ------------------------------------------------------------------------ */
      bindEvents() {
        // Petting / Clicking directly on the kitten
        const catHitbox = document.getElementById('kitten-interactive-hitbox');
        catHitbox.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          sound.init();
          sound.playKittenChirp();
          sound.triggerQuietPurr(3800, 0.095);
          this.kitten.setEmotion('purring', 3200);
          this.particles.spawnPurrHearts(this.kitten.x, this.kitten.y - 65);
        });

        // Toggle 1..10 Full Number Line Helper Shelf
        const btnHelper = document.getElementById('btn-toggle-helper');
        const btnHelperVisual = document.getElementById('btn-helper-visual');
        btnHelper.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          sound.init();
          sound.playWoodClick();
          animateInnerScale(btnHelperVisual, 0.9, 180);
          this.helperOpen = !this.helperOpen;
          this.shelfTargetY = this.helperOpen ? 0 : -220;
          this.helperActiveRing.setAttribute('opacity', this.helperOpen ? '0.95' : '0');
        });

        // Teacher Direction Filter Peg (Cycles: Both ⇄ -> Forward → -> Backward ←)
        const btnDir = document.getElementById('btn-filter-dir');
        const btnDirVisual = document.getElementById('btn-dir-visual');
        const dirIcon = document.getElementById('dir-filter-icon');
        btnDir.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          sound.init();
          sound.playWoodClick();
          animateInnerScale(btnDirVisual, 0.9, 180);

          if (this.dirFilter === 0) {
            this.dirFilter = 1;
            dirIcon.innerHTML = `<path d="M-15 0 L13 0 M4 -9 L15 0 L4 9" fill="none" stroke="#a8f0b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />`;
          } else if (this.dirFilter === 1) {
            this.dirFilter = -1;
            dirIcon.innerHTML = `<path d="M15 0 L-13 0 M-4 -9 L-15 0 L-4 9" fill="none" stroke="#ffbfa3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />`;
          } else {
            this.dirFilter = 0;
            dirIcon.innerHTML = `
              <path d="M-14 -5 L10 -5 M5 -10 L12 -5 L5 0" fill="none" stroke="#ffe49e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M14 6 L-10 6 M-5 1 L-12 6 L-5 11" fill="none" stroke="#ffbfa3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            `;
          }
          this.generateNewRound(false);
        });

        // Teacher Step Filter Peg (Cycles: 1-3 -> 1 -> 2 -> 3)
        const btnStep = document.getElementById('btn-filter-step');
        const btnStepVisual = document.getElementById('btn-step-visual');
        const stepText = document.getElementById('step-filter-text');
        btnStep.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          sound.init();
          sound.playWoodClick();
          animateInnerScale(btnStepVisual, 0.9, 180);

          this.stepFilter = (this.stepFilter + 1) % 4;
          stepText.textContent = this.stepFilter === 0 ? '1-3' : String(this.stepFilter);
          this.generateNewRound(false);
        });

        // Toggle Sound Mute / Unmute
        const btnSound = document.getElementById('btn-toggle-sound');
        const btnSoundVisual = document.getElementById('btn-sound-visual');
        const muteSlash = document.getElementById('sound-mute-slash');
        const soundWaves = document.getElementById('sound-waves-icon');
        btnSound.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          sound.init();
          animateInnerScale(btnSoundVisual, 0.9, 180);
          sound.muted = !sound.muted;
          if (sound.muted) {
            muteSlash.setAttribute('opacity', '1');
            soundWaves.setAttribute('opacity', '0.25');
            if (sound.purrGain && sound.ctx) {
              sound.purrGain.gain.setValueAtTime(0.0001, sound.ctx.currentTime);
            }
          } else {
            muteSlash.setAttribute('opacity', '0');
            soundWaves.setAttribute('opacity', '1');
            sound.playWoodClick();
          }
        });

        // Minimalist "Next" ("Далі") Button — immediately generates a new round
        const btnNext = document.getElementById('btn-next-round');
        const btnNextVisual = document.getElementById('btn-next-visual');
        btnNext.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          sound.init();
          sound.playWoodClick();
          animateInnerScale(btnNextVisual, 0.9, 180);
          this.generateNewRound(false);
        });

        window.addEventListener('pointerdown', () => {
          sound.init();
        }, { once: true });
      }

      /* ------------------------------------------------------------------------
         Main Animation Loop (Kitten, Shelf Slide, Particles, Wall Clock Hands)
         ------------------------------------------------------------------------ */
      startLoop() {
        const hourHand = document.getElementById('clock-hour-hand');
        const minHand = document.getElementById('clock-min-hand');

        const loop = (now) => {
          this.kitten.update(now);
          this.particles.updateAndDraw(now);

          // Smoothly animate collapsible 1..10 helper shelf
          if (Math.abs(this.shelfTargetY - this.shelfCurrentY) > 0.4) {
            this.shelfCurrentY += (this.shelfTargetY - this.shelfCurrentY) * 0.14;
            this.helperShelfWrapper.setAttribute('transform', `translate(0, ${this.shelfCurrentY.toFixed(1)})`);
          }

          // Subtle breathing pulse on paw hint & next button halo
          const hintPulse = 1 + Math.sin(now * 0.005) * 0.08;
          const pawHint = this.yarnLayer.querySelector('.paw-hint-indicator');
          if (pawHint) {
            const floatY = -73 + Math.sin(now * 0.004) * 5;
            pawHint.setAttribute('transform', `translate(0, ${floatY.toFixed(1)}) scale(${hintPulse.toFixed(3)})`);
          }

          // Wall clock hands
          const minAngle = (now * 0.0004) % 360;
          const hourAngle = (now * 0.000033) % 360 - 45;
          if (minHand && hourHand) {
            minHand.setAttribute('transform', `rotate(${minAngle} 1235 140)`);
            hourHand.setAttribute('transform', `rotate(${hourAngle} 1235 140)`);
          }

          requestAnimationFrame(loop);
        };

        requestAnimationFrame(loop);
      }
    }

    window.onload = function () {
      new NumberLineCatGame();
    };
  </script>
