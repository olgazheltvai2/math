<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1-10</title>
  <style>
    /* ==========================================================================
       RESET & FULL-VIEWPORT WIDESCREEN SETUP
       Two-layer SVG architecture:
       1) #bg-svg (preserveAspectRatio="xMidYMid slice") fills 100vw x 100vh
       2) #stage-svg (preserveAspectRatio="xMidYMid meet") keeps all interactive
          yarn balls, cat, and buttons 100% inside the screen on any aspect ratio.
       CRITICAL: Never apply CSS transform to SVG elements positioned via
       transform="translate(X,Y)", so buttons and yarn balls NEVER jump/run away!
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #2a1810;
      font-family: 'Georgia', 'Trebuchet MS', serif;
      cursor: default;
      touch-action: manipulation;
    }

    #game-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 35% 30%, #4a2e1b 0%, #24130b 100%);
    }

    /* Layer 1: Full-bleed Cozy Room Background */
    #bg-svg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      pointer-events: none;
    }

    /* Layer 2: Contained Interactive Stage (Cat, Yarn Balls, Wooden UI Controls) */
    #stage-svg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 10;
      pointer-events: auto;
    }

    /* Layer 3: Particle & Sunbeam Dust Canvas overlay */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 20;
    }

    /* ==========================================================================
       AMBIENT ROOM ANIMATIONS
       ========================================================================== */
    @keyframes pendulumSwing {
      0%   { transform: rotate(-14deg); }
      50%  { transform: rotate(14deg); }
      100% { transform: rotate(-14deg); }
    }

    @keyframes curtainSwayLeft {
      0%, 100% { transform: skewX(0deg) scaleX(1); }
      50%      { transform: skewX(-1.8deg) scaleX(1.02); }
    }

    @keyframes curtainSwayRight {
      0%, 100% { transform: skewX(0deg) scaleX(1); }
      50%      { transform: skewX(-1.4deg) scaleX(0.98); }
    }

    @keyframes leafSway1 {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(3.2deg); }
    }

    @keyframes leafSway2 {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-2.8deg); }
    }

    @keyframes cloudDrift {
      0%   { transform: translateX(-35px); }
      50%  { transform: translateX(35px); }
      100% { transform: translateX(-35px); }
    }

    @keyframes sunbeamPulse {
      0%, 100% { opacity: 0.48; }
      50%      { opacity: 0.72; }
    }

    #clock-pendulum {
      transform-origin: 1235px 225px;
      animation: pendulumSwing 2.2s ease-in-out infinite;
    }

    #curtain-left {
      transform-origin: 160px 50px;
      animation: curtainSwayLeft 7s ease-in-out infinite;
    }

    #curtain-right {
      transform-origin: 560px 50px;
      animation: curtainSwayRight 8.5s ease-in-out infinite;
    }

    #plant-foliage-1 {
      transform-origin: 375px 365px;
      animation: leafSway1 5.5s ease-in-out infinite;
    }

    #plant-foliage-2 {
      transform-origin: 375px 365px;
      animation: leafSway2 6.8s ease-in-out infinite;
    }

    #window-clouds {
      animation: cloudDrift 38s ease-in-out infinite;
    }

    .sunbeam-ray {
      animation: sunbeamPulse 6s ease-in-out infinite;
      mix-blend-mode: screen;
    }

    /* ==========================================================================
       SAFE INTERACTIVE STATES (NO CSS TRANSFORM ON POSITIONED <g> ELEMENTS!)
       All hover/active feedback uses filter on outer group or inner local visual
       ========================================================================== */
    .interactive-node {
      cursor: pointer;
      pointer-events: all;
      transition: filter 0.2s ease;
    }

    .interactive-node:hover {
      filter: brightness(1.12) drop-shadow(0 6px 14px rgba(255, 210, 110, 0.55));
    }

    .interactive-node:active {
      filter: brightness(0.95) drop-shadow(0 2px 6px rgba(255, 190, 80, 0.4));
    }

    .hit-target {
      fill: rgba(255, 255, 255, 0.001);
      pointer-events: all;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-viewport">
    <!-- ========================================================================
         LAYER 1: BACKGROUND LIVING ROOM SVG (1600x900, slice to fill any screen)
         ======================================================================== -->
    <svg id="bg-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="bg-shadow-deep" x="-20%" y="-20%" width="150%" height="150%">
          <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1a0d06" flood-opacity="0.55" />
        </filter>
        <filter id="bg-shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#231107" flood-opacity="0.45" />
        </filter>
        <filter id="bg-sun-blur" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="16" />
        </filter>

        <!-- Wallpaper & Room Gradients -->
        <linearGradient id="wall-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e8cbb1" />
          <stop offset="45%" stop-color="#d5b08e" />
          <stop offset="100%" stop-color="#9e7352" />
        </linearGradient>

        <pattern id="wallpaper-pattern" width="100" height="100" patternUnits="userSpaceOnUse">
          <rect width="100" height="100" fill="none" />
          <path d="M50 12 C62 28, 62 46, 50 62 C38 46, 38 28, 50 12 Z" fill="#c39873" fill-opacity="0.18" />
          <path d="M50 20 C70 33, 78 20, 86 33 C74 46, 62 46, 50 37 Z" fill="#c39873" fill-opacity="0.14" />
          <path d="M50 20 C30 33, 22 20, 14 33 C26 46, 38 46, 50 37 Z" fill="#c39873" fill-opacity="0.14" />
          <circle cx="50" cy="80" r="4" fill="#b58863" fill-opacity="0.18" />
          <path d="M0 0 Q50 25 100 0" stroke="#b88a64" stroke-width="1" fill="none" stroke-opacity="0.14" />
        </pattern>

        <linearGradient id="wainscot-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#8c5836" />
          <stop offset="15%" stop-color="#724427" />
          <stop offset="85%" stop-color="#59331b" />
          <stop offset="100%" stop-color="#3d2110" />
        </linearGradient>

        <linearGradient id="wood-trim-gold" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ba8256" />
          <stop offset="50%" stop-color="#875330" />
          <stop offset="100%" stop-color="#4f2c16" />
        </linearGradient>

        <!-- Floor Perspective Gradient -->
        <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#6b3d20" />
          <stop offset="35%" stop-color="#844e2c" />
          <stop offset="75%" stop-color="#693b1e" />
          <stop offset="100%" stop-color="#472611" />
        </linearGradient>

        <pattern id="parquet-pattern" width="200" height="46" patternUnits="userSpaceOnUse">
          <rect width="200" height="46" fill="none" stroke="#3d200e" stroke-width="1.6" stroke-opacity="0.55" />
          <line x1="100" y1="0" x2="100" y2="46" stroke="#3d200e" stroke-width="1.4" stroke-opacity="0.45" />
          <path d="M10 15 Q50 10 90 17 M110 30 Q150 36 190 27" stroke="#9e643c" stroke-width="1.1" fill="none" stroke-opacity="0.3" />
        </pattern>

        <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#7ec8f5" />
          <stop offset="55%" stop-color="#b8e5fc" />
          <stop offset="100%" stop-color="#fef4c9" />
        </linearGradient>

        <linearGradient id="curtain-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#fff8eb" stop-opacity="0.88" />
          <stop offset="35%" stop-color="#faeacc" stop-opacity="0.65" />
          <stop offset="70%" stop-color="#fffdf7" stop-opacity="0.82" />
          <stop offset="100%" stop-color="#ebd5b3" stop-opacity="0.45" />
        </linearGradient>

        <linearGradient id="sunbeam-grad" x1="0%" y1="0%" x2="60%" y2="100%">
          <stop offset="0%" stop-color="#fff6cc" stop-opacity="0.42" />
          <stop offset="50%" stop-color="#ffe484" stop-opacity="0.2" />
          <stop offset="100%" stop-color="#ffcc4d" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="armchair-fabric" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#6b8e78" />
          <stop offset="55%" stop-color="#4f6e5b" />
          <stop offset="100%" stop-color="#334a3c" />
        </linearGradient>
      </defs>

      <!-- Upper Wallpaper -->
      <rect x="0" y="0" width="1600" height="525" fill="url(#wall-grad)" />
      <rect x="0" y="0" width="1600" height="525" fill="url(#wallpaper-pattern)" />

      <!-- Ambient Warm Sunlight Wash on Wall -->
      <ellipse cx="520" cy="280" rx="480" ry="260" fill="#ffefc2" fill-opacity="0.22" filter="url(#bg-sun-blur)" />

      <!-- Wooden Chair Rail & Lower Wainscoting Paneling -->
      <rect x="0" y="415" width="1600" height="115" fill="url(#wainscot-grad)" />
      <rect x="0" y="408" width="1600" height="12" fill="url(#wood-trim-gold)" filter="url(#bg-shadow-soft)" />

      <!-- Carved Wainscot Recessed Panels -->
      <g stroke="#3d2110" stroke-width="2.5" fill="#633a1f" fill-opacity="0.45">
        <rect x="35" y="432" width="165" height="72" rx="4" />
        <rect x="235" y="432" width="165" height="72" rx="4" />
        <rect x="435" y="432" width="165" height="72" rx="4" />
        <rect x="635" y="432" width="165" height="72" rx="4" />
        <rect x="835" y="432" width="165" height="72" rx="4" />
        <rect x="1035" y="432" width="165" height="72" rx="4" />
        <rect x="1235" y="432" width="165" height="72" rx="4" />
        <rect x="1435" y="432" width="130" height="72" rx="4" />

      <!-- Baseboard Molding -->
      <rect x="0" y="510" width="1600" height="22" fill="#472612" />
      <line x1="0" y1="510" x2="1600" y2="510" stroke="#9e6740" stroke-width="2" />

      <!-- SUNNY WINDOW WITH GARDEN, SONGBIRD, CURTAINS & HOUSEPLANT -->
      <g id="window-unit" filter="url(#bg-shadow-deep)">
        <rect x="150" y="45" width="430" height="365" rx="10" fill="#6e4124" stroke="#422411" stroke-width="4" />
        <g clip-path="url(#window-clip)">
          <clipPath id="window-clip">
            <rect x="168" y="62" width="394" height="330" rx="5" />
          </clipPath>
          <rect x="168" y="62" width="394" height="330" fill="url(#sky-grad)" />
          <circle cx="260" cy="130" r="48" fill="#fffbe0" fill-opacity="0.85" filter="url(#bg-sun-blur)" />
          <circle cx="260" cy="130" r="28" fill="#fffdf2" />

          <g id="window-clouds" fill="#ffffff" fill-opacity="0.82">
            <path d="M210 158 Q225 140 245 148 Q265 132 290 146 Q310 142 320 160 Z" />
            <path d="M390 120 Q408 104 432 110 Q452 98 478 112 Q498 110 506 126 Z" />
          </g>

          <path d="M160 340 Q260 275 385 320 Q485 280 580 325 L580 400 L160 400 Z" fill="#8cc96b" />
          <path d="M160 362 Q300 310 430 350 Q505 320 580 355 L580 400 L160 400 Z" fill="#5da64e" />
          <circle cx="205" cy="330" r="40" fill="#6ab856" />
          <circle cx="238" cy="342" r="34" fill="#82cf67" />
          <circle cx="518" cy="316" r="45" fill="#539944" />
          <circle cx="480" cy="336" r="35" fill="#74c25e" />

          <!-- Cute little songbird perched on outer branch -->
          <g transform="translate(295, 328)">
            <ellipse cx="0" cy="0" rx="11" ry="8" fill="#e07a47" />
            <circle cx="8" cy="-5" r="6.5" fill="#d96534" />
            <polygon points="14,-6 20,-4 14,-2" fill="#f5b841" />
            <circle cx="10" cy="-6.5" r="1.5" fill="#1f0e06" />
            <path d="M-8 0 L-17 -5 L-15 3 Z" fill="#8c3f1f" />
          </g>
        </g>

        <!-- Window Mullions -->
        <rect x="360" y="62" width="10" height="330" fill="#784727" stroke="#4a2a14" stroke-width="1.8" />
        <rect x="168" y="212" width="394" height="10" fill="#784727" stroke="#4a2a14" stroke-width="1.8" />
        <rect x="168" y="62" width="394" height="330" rx="5" fill="none" stroke="#4d2c16" stroke-width="5" />

        <!-- Flowing Sheer Curtains -->
        <path id="curtain-left" d="M160 54 L278 54 C262 158, 240 258, 216 394 C195 398, 170 394, 154 390 C152 265, 156 150, 160 54 Z" fill="url(#curtain-grad)" />
        <path id="curtain-right" d="M462 54 L574 54 C580 158, 582 265, 578 392 C558 396, 534 396, 515 392 C495 262, 478 158, 462 54 Z" fill="url(#curtain-grad)" />

        <!-- Curtain Rod -->
        <rect x="130" y="40" width="470" height="10" rx="5" fill="#4f2c15" stroke="#2e180a" stroke-width="2" />
        <circle cx="130" cy="45" r="9" fill="#b88244" />
        <circle cx="600" cy="45" r="9" fill="#b88244" />

        <!-- Windowsill -->
        <rect x="134" y="392" width="462" height="22" rx="5" fill="url(#wood-trim-gold)" stroke="#3d2110" stroke-width="2.5" />

        <!-- Potted Houseplant on Windowsill -->
        <g id="windowsill-plant">
          <g id="plant-foliage-1">
            <path d="M375 362 C345 328, 308 324, 295 345 C316 360, 350 366, 375 362 Z" fill="#3c7a34" />
            <path d="M375 358 C354 308, 328 286, 312 300 C325 328, 354 350, 375 358 Z" fill="#4f9644" />
            <path d="M379 358 C404 308, 438 292, 450 310 C432 335, 400 352, 379 358 Z" fill="#468a3c" />
            <path d="M376 354 C375 300, 388 274, 404 284 C402 316, 388 340, 376 354 Z" fill="#62ad53" />
          </g>
          <g id="plant-foliage-2">
            <path d="M373 364 C338 345, 316 362, 308 378 C335 380, 358 372, 373 364 Z" fill="#549e48" />
            <path d="M379 362 C412 336, 445 345, 454 364 C429 372, 402 368, 379 362 Z" fill="#5cad4e" />
            <path d="M375 360 C360 318, 354 288, 368 279 C382 296, 380 328, 375 360 Z" fill="#74c263" />
          </g>
          <polygon points="348,354 404,354 394,396 358,396" fill="#c76743" stroke="#7d3920" stroke-width="2" />
          <rect x="343" y="346" width="66" height="10" rx="3" fill="#d97852" stroke="#7d3920" stroke-width="2" />
        </g>
      </g>

      <!-- FRAMED LANDSCAPE PAINTING ON THE WALL -->
      <g id="wall-painting" transform="translate(880, 95)" filter="url(#bg-shadow-deep)">
        <rect x="0" y="0" width="250" height="180" rx="8" fill="url(#wood-trim-gold)" stroke="#3b200e" stroke-width="3.5" />
        <rect x="11" y="11" width="228" height="158" rx="3" fill="#d4a359" stroke="#5e3619" stroke-width="2.5" />
        <g clip-path="url(#painting-clip)">
          <clipPath id="painting-clip">
            <rect x="18" y="18" width="214" height="144" rx="2" />
          </clipPath>
          <linearGradient id="paint-sky" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f7c588" />
            <stop offset="60%" stop-color="#fae2b4" />
            <stop offset="100%" stop-color="#e89d6b" />
          </linearGradient>
          <rect x="18" y="18" width="214" height="144" fill="url(#paint-sky)" />
          <circle cx="165" cy="66" r="20" fill="#fff5d6" fill-opacity="0.8" />
          <polygon points="18,130 75,75 142,130" fill="#8c7aa8" />
          <polygon points="95,130 168,70 234,130" fill="#72628f" />
          <path d="M18 130 Q80 102 145 122 T232 116 L232 162 L18 162 Z" fill="#6b8f56" />
          <path d="M18 142 Q102 124 232 140 L232 162 L18 162 Z" fill="#486b3a" />
        </g>
      </g>

      <!-- VINTAGE WOODEN PENDULUM WALL CLOCK -->
      <g id="wall-clock" filter="url(#bg-shadow-deep)">
        <path d="M1185 92 L1235 58 L1285 92 L1278 278 C1278 290, 1192 290, 1192 278 Z" fill="#5e3419" stroke="#331a0a" stroke-width="3.5" />
        <path d="M1175 96 L1235 52 L1295 96" fill="none" stroke="#8f5630" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
        <rect x="1205" y="192" width="60" height="76" rx="6" fill="#2b160a" stroke="#85512d" stroke-width="2.5" />
        <g id="clock-pendulum">
          <line x1="1235" y1="194" x2="1235" y2="246" stroke="#d4a24c" stroke-width="3" />
          <circle cx="1235" cy="248" r="12.5" fill="#f5ca69" stroke="#9e6d1e" stroke-width="2" />
        </g>
        <circle cx="1235" cy="140" r="38" fill="#ba8543" stroke="#3b1f0c" stroke-width="2.5" />
        <circle cx="1235" cy="140" r="33" fill="#faeed7" stroke="#875927" stroke-width="1.8" />
        <g stroke="#4a2a12" stroke-width="2.2" stroke-linecap="round">
          <line x1="1235" y1="111" x2="1235" y2="116" />
          <line x1="1235" y1="164" x2="1235" y2="169" />
          <line x1="1206" y1="140" x2="1211" y2="140" />
          <line x1="1259" y1="140" x2="1264" y2="140" />
        </g>
        <line id="clock-hour-hand" x1="1235" y1="140" x2="1220" y2="128" stroke="#2b1608" stroke-width="3.5" stroke-linecap="round" />

        <circle cx="1235" cy="140" r="4" fill="#b87e2e" />
      </g>

      <!-- COZY ARMCHAIR CORNER WITH KNITTED THROW PILLOW (Right background) -->
      <g id="cozy-armchair" transform="translate(1330, 325)" filter="url(#bg-shadow-deep)">

        <path d="M195 205 L208 245 L194 245 L182 205 Z" fill="#4a250d" />

        <circle cx="78" cy="58" r="4" fill="#27382e" opacity="0.6" />
        <circle cx="115" cy="52" r="4" fill="#27382e" opacity="0.6" />
        <circle cx="152" cy="58" r="4" fill="#27382e" opacity="0.6" />
        <circle cx="95" cy="95" r="4" fill="#27382e" opacity="0.6" />
        <circle cx="135" cy="95" r="4" fill="#27382e" opacity="0.6" />
        <!-- Knitted Cushion Pillow -->
        <g transform="translate(95, 112) rotate(-12)">
          <rect x="-38" y="-28" width="76" height="56" rx="16" fill="#d97b54" stroke="#7d391e" stroke-width="2.5" />

      <!-- WOODEN PARQUET FLOOR -->
      <rect x="0" y="530" width="1600" height="370" fill="url(#floor-grad)" />
      <rect x="0" y="530" width="1600" height="370" fill="url(#parquet-pattern)" />

      <!-- Perspective Plank Lines -->
      <g stroke="#2e1709" stroke-width="1.8" stroke-opacity="0.38">
        <line x1="210" y1="530" x2="-100" y2="900" />
        <line x1="460" y1="530" x2="260" y2="900" />
        <line x1="710" y1="530" x2="635" y2="900" />
        <line x1="960" y1="530" x2="1015" y2="900" />
        <line x1="1210" y1="530" x2="1400" y2="900" />
        <line x1="1460" y1="530" x2="1750" y2="900" />
      </g>

      <!-- Sunlit Floor Reflection Patch -->
      <polygon points="200,545 635,545 985,870 350,870" fill="#ffe79e" fill-opacity="0.12" filter="url(#bg-sun-blur)" />

      <!-- Volumetric Diagonal Golden Sunbeams -->
      <g id="volumetric-sunbeams" pointer-events="none">
        <polygon class="sunbeam-ray" points="175,65 360,65 875,900 430,900" fill="url(#sunbeam-grad)" />
        <polygon class="sunbeam-ray" style="animation-delay: -2.5s;" points="370,65 562,65 1230,900 800,900" fill="url(#sunbeam-grad)" />
      </g>
    </svg>

    <!-- ========================================================================
         LAYER 2: INTERACTIVE STAGE & UI SVG (1600x900, preserveAspectRatio="xMidYMid meet")
         Guaranteed 100% visible inside any screen aspect ratio!
         ======================================================================== -->
    <svg id="stage-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="shadow-deep" x="-20%" y="-20%" width="150%" height="150%">
          <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1a0d06" flood-opacity="0.55" />
        </filter>
        <filter id="shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#231107" flood-opacity="0.45" />
        </filter>
        <filter id="glow-gold" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="6" result="blur" />
