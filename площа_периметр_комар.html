<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>S & P — Macro Insect Arcade</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap');

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #071712;
    font-family: 'Fredoka', sans-serif;
  }

  /* Razor-sharp high-contrast typography without any blurry glow */
  .crisp-math-text {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    fill: #FFFFFF;
    paint-order: stroke fill;
    stroke: #09130c;
    stroke-width: 7px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .crisp-gold-text {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    fill: #FFE45E;
    paint-order: stroke fill;
    stroke: #140d04;
    stroke-width: 7px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .crisp-cyan-text {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    fill: #70F8FF;
    paint-order: stroke fill;
    stroke: #06151c;
    stroke-width: 7px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Stationary, rock-solid interactive buttons that NEVER jump or run away */
  .game-btn {
    cursor: pointer;
    position: relative;
    transition: filter 0.14s ease;
    outline: none;
    border: none;
    background: transparent;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .game-btn:hover {
    filter: brightness(1.15);
  }
  .game-btn:active .btn-inner-svg {
    transform: scale(0.95);
  }
  .btn-inner-svg {
    transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: center center;
    display: block;
  }

  /* Grass sway only on background blades */
  @keyframes grassSway {
    0%, 100% { transform: rotate(-2.5deg); }
    50% { transform: rotate(2.5deg); }
  }
  .anim-grass {
    animation: grassSway 4.8s ease-in-out infinite;
    transform-origin: bottom center;
  }
</style>
</head>
<body>

<div id="game-root" class="relative w-screen h-screen overflow-hidden select-none">

  <!-- ========================================================================= -->
  <!-- 1. LIVING MACRO INSECT WORLD BACKGROUND SVG                               -->
  <!-- ========================================================================= -->
  <svg id="bg-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" class="absolute inset-0 w-full h-full pointer-events-none z-0">
    <defs>
      <linearGradient id="canopySky" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#061612"/>
        <stop offset="40%" stop-color="#0d2e24"/>
        <stop offset="78%" stop-color="#174936"/>
        <stop offset="100%" stop-color="#0c261d"/>
      </linearGradient>

      <radialGradient id="sunbeamGlow" cx="50%" cy="20%" r="60%">
        <stop offset="0%" stop-color="#bef264" stop-opacity="0.32"/>
        <stop offset="50%" stop-color="#34d399" stop-opacity="0.1"/>
        <stop offset="100%" stop-color="#061612" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="barkPlank" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#693b1c"/>
        <stop offset="50%" stop-color="#472610"/>
        <stop offset="100%" stop-color="#2b1507"/>
      </linearGradient>

      <linearGradient id="barkDark" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#361c0b"/>
        <stop offset="100%" stop-color="#1c0d04"/>
      </linearGradient>

      <linearGradient id="amberRim" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="45%" stop-color="#f59e0b"/>
        <stop offset="85%" stop-color="#b45309"/>
        <stop offset="100%" stop-color="#fde047"/>
      </linearGradient>

      <linearGradient id="leafBlade" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4ade80"/>
        <stop offset="55%" stop-color="#16a34a"/>
        <stop offset="100%" stop-color="#065f46"/>
      </linearGradient>

      <linearGradient id="leafDark" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#14532d"/>
        <stop offset="100%" stop-color="#062e16"/>
      </linearGradient>

      <linearGradient id="dewCyan" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#e0f2fe"/>
        <stop offset="45%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#0369a1"/>
      </linearGradient>

      <linearGradient id="honeyGold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef9c3"/>
        <stop offset="45%" stop-color="#facc15"/>
        <stop offset="100%" stop-color="#ca8a04"/>
      </linearGradient>

      <linearGradient id="berryMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbcfe8"/>
        <stop offset="50%" stop-color="#ec4899"/>
        <stop offset="100%" stop-color="#831843"/>
      </linearGradient>

      <linearGradient id="beetleShell" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fb923c"/>
        <stop offset="50%" stop-color="#b45309"/>
        <stop offset="100%" stop-color="#451a03"/>
      </linearGradient>

      <linearGradient id="pondWater" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#083344"/>
        <stop offset="50%" stop-color="#0e5a6f"/>
        <stop offset="100%" stop-color="#062c3a"/>
      </linearGradient>

      <linearGradient id="mossGround" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#143d27"/>
        <stop offset="55%" stop-color="#0c291a"/>
        <stop offset="100%" stop-color="#06170e"/>
      </linearGradient>
    </defs>

    <!-- Lush Macro Forest Canopy Sky -->
    <rect width="1920" height="1080" fill="url(#canopySky)"/>
    <ellipse cx="960" cy="180" rx="900" ry="460" fill="url(#sunbeamGlow)"/>

    <!-- Floating Pollen & Fireflies Layer -->
    <g id="fireflies-layer"></g>

    <!-- Distant Giant Fern & Grass Silhouettes -->
    <path d="M0 720 Q120 420 260 320 Q180 520 210 720 Z" fill="#0b291e"/>
    <path d="M220 720 Q360 390 520 290 Q410 510 430 720 Z" fill="#0e3627"/>
    <path d="M1720 720 Q1580 380 1420 280 Q1540 500 1510 720 Z" fill="#0b291e"/>
    <path d="M1920 720 Q1790 410 1640 330 Q1760 530 1750 720 Z" fill="#0e3627"/>

    <!-- Swaying Giant Macro Grass Blades with Sparkling Dewdrops -->
    <g class="anim-grass" style="transform-origin: 140px 760px;">
      <path d="M 110 760 Q 70 430 220 190 Q 145 450 175 760 Z" fill="url(#leafBlade)" opacity="0.75"/>
      <circle cx="158" cy="340" r="14" fill="url(#dewCyan)"/>
      <circle cx="154" cy="336" r="4" fill="#ffffff"/>
    </g>

    <g class="anim-grass" style="transform-origin: 1790px 760px; animation-delay: -2.2s;">
      <path d="M 1760 760 Q 1840 420 1690 175 Q 1775 450 1825 760 Z" fill="url(#leafBlade)" opacity="0.75"/>
      <circle cx="1750" cy="330" r="15" fill="url(#dewCyan)"/>
      <circle cx="1746" cy="325" r="4.5" fill="#ffffff"/>
    </g>

    <!-- Left Giant Honeycomb & Mossy Branch -->
    <g transform="translate(40, 390)">
      <path d="M -40 90 Q 110 75 230 115 L 210 165 Q 95 130 -40 155 Z" fill="url(#barkPlank)" stroke="#241105" stroke-width="4"/>
      <!-- Hanging Golden Beehive -->
      <g transform="translate(135, 138)">
        <ellipse cx="0" cy="32" rx="46" ry="18" fill="#d97706" stroke="#78350f" stroke-width="3"/>
        <ellipse cx="0" cy="54" rx="58" ry="22" fill="#f59e0b" stroke="#78350f" stroke-width="3"/>
        <ellipse cx="0" cy="78" rx="64" ry="24" fill="#fbbf24" stroke="#78350f" stroke-width="3"/>
        <ellipse cx="0" cy="102" rx="52" ry="20" fill="#f59e0b" stroke="#78350f" stroke-width="3"/>
        <ellipse cx="0" cy="122" rx="34" ry="15" fill="#d97706" stroke="#78350f" stroke-width="3"/>
        <circle cx="0" cy="82" r="12" fill="#271203"/>
      </g>
    </g>

    <!-- Right Giant Bioluminescent Toadstools -->
    <g transform="translate(1655, 470)">
      <path d="M 75 240 Q 68 150 86 90 L 116 90 Q 130 150 122 240 Z" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
      <path d="M 10 100 Q 100 -15 190 100 Z" fill="url(#berryMagenta)" stroke="#fdf2f8" stroke-width="3"/>
      <circle cx="65" cy="58" r="12" fill="#fef08a"/>
      <circle cx="115" cy="42" r="9" fill="#fef08a"/>
      <circle cx="145" cy="68" r="11" fill="#fef08a"/>
    </g>

    <!-- Shimmering Forest Pond & Sprouting Lily-Pad Flowers Layer -->
    <path d="M0 675 Q480 640 960 665 Q1440 690 1920 655 L1920 775 L0 775 Z" fill="url(#pondWater)"/>
    <g id="pond-sprouts-layer"></g>

    <!-- Foreground Mossy Macro Floor -->
    <path d="M0 745 Q960 695 1920 745 L1920 1080 L0 1080 Z" fill="url(#mossGround)"/>
    <path d="M0 745 Q960 695 1920 745" stroke="#22c55e" stroke-width="6" fill="none" opacity="0.45"/>

    <!-- Foreground Decorative Clover & Dew -->
    <g transform="translate(75, 955)">
      <circle cx="20" cy="20" r="18" fill="url(#leafBlade)"/>
      <circle cx="46" cy="20" r="18" fill="url(#leafBlade)"/>
      <circle cx="33" cy="4" r="18" fill="url(#leafBlade)"/>
      <circle cx="33" cy="18" r="6" fill="url(#dewCyan)"/>
    </g>
    <g transform="translate(1810, 960)">
      <circle cx="20" cy="20" r="18" fill="url(#leafBlade)"/>
      <circle cx="46" cy="20" r="18" fill="url(#leafBlade)"/>
      <circle cx="33" cy="4" r="18" fill="url(#leafBlade)"/>
      <circle cx="33" cy="18" r="6" fill="url(#amberRim)"/>
    </g>
  </svg>

  <!-- ========================================================================= -->
  <!-- 2. SAFE-AREA UI LAYOUT CONTAINER (100vw x 100vh, NEVER CROPPED!)          -->
  <!-- ========================================================================= -->
  <div class="relative z-10 w-full h-full flex flex-col justify-between p-3 sm:p-5 md:px-7 md:py-4">

    <!-- TOP NAVIGATION BAR -->
    <div class="w-full flex items-center justify-between gap-2 sm:gap-4 shrink-0">

      <!-- TOP-LEFT: Math Mode Selector Buttons (No extra words, pure math symbols & icons) -->
      <div class="flex items-center gap-1.5 sm:gap-2.5 px-2.5 py-1.5 rounded-2xl border-4 border-[#f59e0b] shadow-2xl"
           style="background: linear-gradient(180deg, #472610 0%, #1f0e04 100%);">

        <!-- Mode 1 (Default): Find Unknown Side `?` from S or P (Mixed) -->
        <button id="mode-btn-side-all" class="game-btn" aria-label="Find Side from S or P">
          <svg class="btn-inner-svg w-16 h-11 sm:w-20 sm:h-12" viewBox="0 0 84 54">
            <rect id="mode-bg-side-all" x="3" y="3" width="78" height="48" rx="13" fill="#143823" stroke="#FFE45E" stroke-width="4"/>
            <rect x="11" y="13" width="28" height="28" rx="5" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-dasharray="5,3"/>
            <text x="56" y="37" text-anchor="middle" font-size="28" class="crisp-gold-text">a=?</text>
          </svg>
        </button>

        <!-- Mode 2: Find Unknown Side `?` from Area `S` (`S ➔ ?`) -->
        <button id="mode-btn-side-s" class="game-btn" aria-label="Find Side from Area S">
          <svg class="btn-inner-svg w-16 h-11 sm:w-20 sm:h-12" viewBox="0 0 84 54">
            <rect id="mode-bg-side-s" x="3" y="3" width="78" height="48" rx="13" fill="#1b120c" stroke="#78553a" stroke-width="3"/>
            <text x="42" y="36" text-anchor="middle" font-size="25" class="crisp-math-text">S➔?</text>
          </svg>
        </button>

        <!-- Mode 3: Find Unknown Side `?` from Perimeter `P` (`P ➔ ?`) -->
        <button id="mode-btn-side-p" class="game-btn" aria-label="Find Side from Perimeter P">
          <svg class="btn-inner-svg w-16 h-11 sm:w-20 sm:h-12" viewBox="0 0 84 54">
            <rect id="mode-bg-side-p" x="3" y="3" width="78" height="48" rx="13" fill="#1b120c" stroke="#78553a" stroke-width="3"/>
            <text x="42" y="36" text-anchor="middle" font-size="25" class="crisp-cyan-text">P➔?</text>
          </svg>
        </button>

        <!-- Mode 4: Classic Find `S = ?` or `P = ?` from two known sides -->
        <button id="mode-btn-classic" class="game-btn" aria-label="Find S or P">
          <svg class="btn-inner-svg w-16 h-11 sm:w-20 sm:h-12" viewBox="0 0 84 54">
            <rect id="mode-bg-classic" x="3" y="3" width="78" height="48" rx="13" fill="#1b120c" stroke="#78553a" stroke-width="3"/>
            <text x="42" y="36" text-anchor="middle" font-size="25" class="crisp-gold-text">S / P</text>
          </svg>
        </button>

        <!-- Mode 5: Interactive Leaf-Web Builder Mode -->
        <button id="mode-btn-builder" class="game-btn" aria-label="Leaf Builder Mode">
          <svg class="btn-inner-svg w-12 h-11 sm:w-14 sm:h-12" viewBox="0 0 60 54">
            <rect id="mode-bg-builder" x="3" y="3" width="54" height="48" rx="13" fill="#1b120c" stroke="#78553a" stroke-width="3"/>
            <rect x="14" y="13" width="28" height="28" rx="4" fill="#22c55e" stroke="#052e16" stroke-width="2.5"/>
            <line x1="28" y1="13" x2="28" y2="41" stroke="#052e16" stroke-width="2.5"/>
            <line x1="14" y1="27" x2="42" y2="27" stroke="#052e16" stroke-width="2.5"/>
            <circle cx="42" cy="41" r="6.5" fill="#ef4444" stroke="#09130c" stroke-width="2"/>
          </svg>
        </button>
      </div>

      <!-- CENTER TOP: HIGH-CONTRAST BARK & AMBER QUESTION PLAQUE (`S = 24`, `P = 18`, etc.) -->
      <button id="question-plaque" class="game-btn" aria-label="Formula Plaque">
        <svg class="btn-inner-svg w-64 h-16 sm:w-80 sm:h-20 md:w-96 md:h-22" viewBox="0 0 430 96">
          <!-- Carved Tree Bark & Amber Frame with Dark High-Contrast Interior -->
          <path d="M 26 8 L 404 8 L 424 48 L 404 88 L 26 88 L 6 48 Z" fill="url(#barkPlank)" stroke="url(#amberRim)" stroke-width="6"/>
          <path d="M 36 16 L 394 16 L 410 48 L 394 80 L 36 80 L 20 48 Z" fill="#0d1912" stroke="#15803d" stroke-width="3"/>

          <!-- Decorative Leaf Sprouts on Plaque Corners -->
          <path d="M 18 24 Q 4 8 28 12 Z" fill="#4ade80"/>
          <path d="M 412 24 Q 426 8 402 12 Z" fill="#4ade80"/>

          <!-- Left Visual Concept Icon (Area tiles vs Perimeter outline) -->
          <g id="plaque-concept-icon" transform="translate(82, 48)"></g>

          <!-- Razor-Sharp High-Contrast Formula Text (`S = 24` or `P = 18` or `S = ?`) -->
          <text id="plaque-formula-text" x="248" y="65" text-anchor="middle" font-size="50" class="crisp-math-text" letter-spacing="1.5">S = 24</text>
        </svg>
      </button>

      <!-- TOP-RIGHT: Hero Switcher, Sound Toggle & Mandatory Minimalist "NEXT" (`>>`) Button -->
      <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        <!-- Insect Hero Switcher Button (Switch Mosquito / Fly / Beetle anytime) -->
        <button id="switch-hero-btn" class="game-btn" aria-label="Switch Insect Hero">
          <svg class="btn-inner-svg w-13 h-13 sm:w-15 sm:h-14" viewBox="0 0 70 64">
            <rect x="4" y="4" width="62" height="56" rx="18" fill="#0d1912" stroke="url(#amberRim)" stroke-width="4.5"/>
            <!-- Mini Winged Bug Emblem -->
            <path d="M 35 28 C 20 12 10 20 18 32 C 23 36 30 33 35 28 Z" fill="url(#dewCyan)" stroke="#ffffff" stroke-width="1.5"/>
            <path d="M 35 28 C 50 12 60 20 52 32 C 47 36 40 33 35 28 Z" fill="url(#dewCyan)" stroke="#ffffff" stroke-width="1.5"/>
            <ellipse cx="35" cy="34" rx="9" ry="13" fill="url(#leafBlade)" stroke="#FFE45E" stroke-width="2.5"/>
            <circle cx="35" cy="19" r="6" fill="#f59e0b"/>
          </svg>
        </button>

        <!-- Sound Toggle Button -->
        <button id="sound-toggle-btn" class="game-btn" aria-label="Toggle Sound">
          <svg class="btn-inner-svg w-13 h-13 sm:w-15 sm:h-14" viewBox="0 0 70 64">
            <rect x="4" y="4" width="62" height="56" rx="18" fill="#0d1912" stroke="url(#amberRim)" stroke-width="4.5"/>
            <path d="M 18 26 L 28 26 L 42 14 L 42 50 L 28 38 L 18 38 Z" fill="#FFE45E"/>
            <path id="sound-waves-icon" d="M 48 22 Q 56 32 48 42 M 53 16 Q 64 32 53 48" stroke="#4ade80" stroke-width="4" fill="none" stroke-linecap="round"/>
            <line id="sound-mute-slash" x1="15" y1="14" x2="55" y2="50" stroke="#ef4444" stroke-width="6" stroke-linecap="round" style="display: none;"/>
          </svg>
        </button>

        <!-- ALWAYS-VISIBLE MINIMALIST "NEXT" BUTTON (Skip immediately to next task) -->
        <button id="next-task-btn" class="game-btn" aria-label="Next Task">
          <svg class="btn-inner-svg w-18 h-13 sm:w-22 sm:h-14" viewBox="0 0 92 64">
            <rect x="4" y="4" width="84" height="56" rx="18" fill="#14532d" stroke="url(#amberRim)" stroke-width="5"/>
            <rect x="10" y="10" width="72" height="44" rx="13" fill="#16a34a"/>
            <polygon points="24,16 48,32 24,48" fill="#FFE45E" stroke="#09130c" stroke-width="2.5" stroke-linejoin="round"/>
            <polygon points="46,16 70,32 46,48" fill="#FFFFFF" stroke="#09130c" stroke-width="2.5" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- ========================================================================= -->
    <!-- 3. THREE-COLUMN MAIN GAMEPLAY STAGE (LEFT INSECT | BOARD | RIGHT 2x2)     -->
    <!-- ========================================================================= -->
    <div class="w-full flex-1 min-h-0 grid grid-cols-12 gap-3 sm:gap-5 items-center my-1">

      <!-- LEFT COLUMN (3 cols): INTERACTIVE INSECT HERO STATION (100% SOCKETED RIGS) -->
      <div class="col-span-3 h-full flex items-end justify-center pb-2">
        <button id="character-station-btn" class="game-btn w-full max-w-[305px] h-full max-h-[445px]" aria-label="Insect Hero Interactive">
          <svg id="character-svg" viewBox="0 0 340 440" class="w-full h-full overflow-visible">
            <!-- Mossy Tree Stump & Reed Pad Pedestal -->
            <path d="M 35 415 L 55 365 L 285 365 L 305 415 Z" fill="url(#barkPlank)" stroke="#1c0d04" stroke-width="4"/>
            <ellipse cx="170" cy="368" rx="124" ry="24" fill="#15803d" stroke="url(#amberRim)" stroke-width="4"/>
            <ellipse cx="170" cy="364" rx="102" ry="16" fill="#166534"/>

            <!-- =============================================================== -->
            <!-- CHARACTER 1: MOSQUITO SNIPER (Комар-снайпер)                    -->
            <!-- All wings & limbs anchored at (0,0) inside thoracic sockets!    -->
            <!-- =============================================================== -->
            <g id="char-mosquito" transform="translate(168, 232)" style="display: none;">
              <g id="mosquito-reaction-wrap">
                <!-- Gentle SVG hover motion that never conflicts with wing sockets -->
                <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="2.3s" repeatCount="indefinite"/>

                <!-- Socketed Jointed Legs anchored to lower thorax -->
                <g stroke="#1e293b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
                  <path d="M -18 22 L -56 68 L -42 128"/>
                  <path d="M -4 28 L -20 82 L -12 132"/>
                  <path d="M 16 22 L 52 68 L 38 128"/>
                </g>

                <!-- Striped Abdomen firmly joined to thorax -->
                <g transform="translate(-14, 46) rotate(18)">
                  <ellipse cx="0" cy="0" rx="21" ry="40" fill="#475569" stroke="#0f172a" stroke-width="3.5"/>
                  <path d="M -17 -14 Q 0 -6 17 -14 M -20 0 Q 0 8 20 0 M -18 14 Q 0 22 18 14" stroke="#fde047" stroke-width="4" fill="none"/>
                </g>

                <!-- LEFT WING SOCKET: (0,0) is the exact left thoracic hinge! -->
                <g transform="translate(-18, -18)">
                  <g>
                    <animateTransform attributeName="transform" type="rotate" values="0 0 0; -26 0 0; 0 0 0" dur="0.11s" repeatCount="indefinite"/>
                    <!-- Wing blade starts directly at M 0,0 (thorax socket) -->
                    <path d="M 0,0 C -32,-42 -96,-48 -112,-22 C -122,-4 -76,18 -20,8 C -8,5 -3,2 0,0 Z"
                          fill="rgba(186, 230, 253, 0.62)" stroke="#38bdf8" stroke-width="3"/>
                    <!-- Wing veins rooted at M 0,0 -->
                    <path d="M 0,0 Q -54,-20 -102,-20 M -38,-13 L -72,2 M -64,-18 L -88,-5"
                          stroke="#bae6fd" stroke-width="2" fill="none" stroke-linecap="round"/>
                  </g>
                  <!-- Physical Chitin Hinge Scale covering (0,0) socket -->
                  <ellipse cx="0" cy="0" rx="8" ry="6" fill="#15803d" stroke="#FFE45E" stroke-width="2.5"/>
                </g>

                <!-- RIGHT WING SOCKET: (0,0) is the exact right thoracic hinge! -->
                <g transform="translate(18, -18)">
                  <g>
                    <animateTransform attributeName="transform" type="rotate" values="0 0 0; 26 0 0; 0 0 0" dur="0.11s" repeatCount="indefinite"/>
                    <!-- Wing blade starts directly at M 0,0 (thorax socket) -->
                    <path d="M 0,0 C 32,-42 96,-48 112,-22 C 122,-4 76,18 20,8 C 8,5 3,2 0,0 Z"
                          fill="rgba(186, 230, 253, 0.62)" stroke="#38bdf8" stroke-width="3"/>
                    <!-- Wing veins rooted at M 0,0 -->
                    <path d="M 0,0 Q 54,-20 102,-20 M 38,-13 L 72,2 M 64,-18 L 88,-5"
                          stroke="#bae6fd" stroke-width="2" fill="none" stroke-linecap="round"/>
                  </g>
                  <!-- Physical Chitin Hinge Scale covering (0,0) socket -->
                  <ellipse cx="0" cy="0" rx="8" ry="6" fill="#15803d" stroke="#FFE45E" stroke-width="2.5"/>
                </g>

                <!-- Armored Thorax & Emerald Leaf-Tunic -->
                <ellipse cx="0" cy="-4" rx="31" ry="36" fill="#334155" stroke="#0f172a" stroke-width="3.5"/>
                <path d="M -25 -22 L 25 -22 L 28 20 L -28 20 Z" fill="url(#leafBlade)" stroke="url(#amberRim)" stroke-width="3"/>

  /* ============================================================================
   * 1. PROCEDURAL WEB AUDIO SYNTHESIZER (INSECT BUZZES, DEWDROPS & MARIMBA)
   * ============================================================================ */
  class InsectSoundEngine {
    constructor() {
      this.ctx = null;
      this.muted = false;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    toggleMute() {
      this.init();
      this.muted = !this.muted;
      return this.muted;
    }

    playTone(freq, type = 'sine', duration = 0.2, startTime = 0, vol = 0.18, slideTo = null) {
      if (this.muted) return;
      this.init();
      if (!this.ctx) return;

      const now = this.ctx.currentTime + startTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + duration);
      }

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    playTileTick(index = 0) {
      const scale = [293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
      const freq = scale[index % scale.length];
      this.playTone(freq, 'triangle', 0.14, 0, 0.2);
      this.playTone(freq * 2, 'sine', 0.08, 0.01, 0.08);
    }

    playHoverTick() {
      this.playTone(659.25, 'sine', 0.045, 0, 0.06, 783.99);
    }

    playMosquitoShoot() {
      // High-pitched mosquito zip + water droplet pop
      this.playTone(680, 'sawtooth', 0.14, 0, 0.12, 1180);
      this.playTone(520, 'sine', 0.18, 0.05, 0.22, 1040);
    }

    playMosquitoSong() {
      const notes = [659.25, 783.99, 880.00, 1046.50, 987.77, 1174.66];
      notes.forEach((n, i) => this.playTone(n, 'sawtooth', 0.11, i * 0.065, 0.1, n * 1.06));
    }

    playFlyShoot() {
      this.playTone(280, 'triangle', 0.18, 0, 0.2, 760);
      this.playTone(440, 'sine', 0.16, 0.04, 0.18, 880);
    }

    playFlyBuzz() {
      [320, 420, 360, 520, 480].forEach((f, i) => {
        this.playTone(f, 'sawtooth', 0.08, i * 0.055, 0.12, f * 1.18);
      });
    }

    playBeetleShoot() {
      this.playTone(140, 'triangle', 0.22, 0, 0.25, 420);
      this.playTone(260, 'square', 0.14, 0.04, 0.14, 520);
    }

    playBeetleClack() {
      this.playTone(180, 'square', 0.09, 0, 0.22, 95);
      this.playTone(240, 'triangle', 0.12, 0.09, 0.24, 120);
    }

    playVictory(charType) {
      if (charType === 'mosquito') {
        const melody = [587.33, 783.99, 880.00, 1174.66, 880.00, 1174.66, 1567.98];
        melody.forEach((f, i) => {
          this.playTone(f, 'triangle', 0.3, i * 0.075, 0.22);
          this.playTone(f * 1.5, 'sine', 0.2, i * 0.075 + 0.02, 0.09);
        });
      } else if (charType === 'fly') {
        const bounce = [392.00, 493.88, 587.33, 783.99, 659.25, 783.99, 987.77];

  /* ============================================================================
   * 3. GAME STATE & MATH TASK GENERATOR (FOCUSED ON FINDING SIDE FROM S OR P!)
   * ============================================================================ */
  const state = {
    // 'side_all' (Find unknown side from S or P) | 'side_s' | 'side_p' | 'classic' | 'builder'
    gameMode: 'side_all',
    charOrder: ['mosquito', 'fly', 'beetle'],
    charIndex: 0,
    solvedCount: 0,
    currentTask: null,
    locked: false,
    gridVisible: false,
    projectiles: [],
    particles: [],
    builderW: 3,
    builderH: 3
  };

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateTask() {
    state.locked = false;
    state.gridVisible = false;
    state.projectiles = [];
    document.getElementById('completed-building-layer').innerHTML = '';
    document.getElementById('blueprint-perimeter-fx').innerHTML = '';
    document.getElementById('projectile-layer').innerHTML = '';

    const charType = state.charOrder[state.charIndex % 3];
    state.charIndex++;

    let mechanic = 'arcade';
    let questionType = 'find_side'; // 'find_side' | 'find_total'
    let concept = 'S';              // 'S' | 'P'

    if (state.gameMode === 'side_all') {
      questionType = 'find_side';
      concept = Math.random() < 0.5 ? 'S' : 'P';
    } else if (state.gameMode === 'side_s') {
      questionType = 'find_side';
      concept = 'S';
    } else if (state.gameMode === 'side_p') {
      questionType = 'find_side';
      concept = 'P';
    } else if (state.gameMode === 'classic') {
      questionType = 'find_total';
      concept = Math.random() < 0.5 ? 'S' : 'P';
    } else if (state.gameMode === 'builder') {
      mechanic = 'builder';
      questionType = 'builder';
      concept = Math.random() < 0.5 ? 'S' : 'P';
    }

    const w = randInt(2, 9);
    const h = randInt(2, 7);
    const areaVal = w * h;
    const perimVal = 2 * (w + h);

    // Decide which side is unknown ('top' = w, or 'left' = h)
    const unknownSidePos = Math.random() < 0.5 ? 'top' : 'left';
    const knownSideVal = unknownSidePos === 'top' ? h : w;
    const unknownSideVal = unknownSidePos === 'top' ? w : h;

    let correctValue = 0;
    if (mechanic === 'builder') {
      correctValue = concept === 'S' ? areaVal : perimVal;
      state.builderW = w === 4 ? 2 : 4;
      state.builderH = h === 3 ? 2 : 3;
    } else if (questionType === 'find_side') {
      correctValue = unknownSideVal;
    } else {
      correctValue = concept === 'S' ? areaVal : perimVal;
    }

    // Generate smart 3rd-4th grade distractors tailored to the question type!
    const optionsSet = new Set([correctValue]);

    if (questionType === 'find_side') {
      // Common student mistakes when finding unknown side from S or P:
      // 1. For Perimeter P = 2*(a+b): forgetting to divide by 2 (doing P - a instead of P/2 - a)
      const forgotHalfPerim = perimVal - knownSideVal;
      if (forgotHalfPerim > 0 && forgotHalfPerim !== correctValue) optionsSet.add(forgotHalfPerim);

      // 2. Half-perimeter itself (P / 2)
      const halfPerim = w + h;
      if (halfPerim > 0 && halfPerim !== correctValue) optionsSet.add(halfPerim);

      // 3. Confusing S and P rules (e.g., dividing P by known side, or subtracting from S)
      if (concept === 'S' && areaVal - knownSideVal > 1 && areaVal - knownSideVal !== correctValue) {
        optionsSet.add(areaVal - knownSideVal);
      }

      // 4. Off-by-one or nearby side lengths (2..12)
      [correctValue - 1, correctValue + 1, correctValue + 2,correctValue - 2, knownSideVal].forEach(cand => {
        if (cand >= 2 && cand !== correctValue) optionsSet.add(cand);
      });

      while (optionsSet.size < 4) {
        const cand = randInt(2, 12);
        if (cand !== correctValue) optionsSet.add(cand);
      }
    } else {
      // Classic S or P distractors
      const oppositeVal = concept === 'S' ? perimVal : areaVal;
      if (oppositeVal !== correctValue) optionsSet.add(oppositeVal);
      if (w + h !== correctValue) optionsSet.add(w + h);
      if (w * (h + 1) !== correctValue) optionsSet.add(w * (h + 1));
      if ((w - 1) * h > 0 && (w - 1) * h !== correctValue) optionsSet.add((w - 1) * h);

      while (optionsSet.size < 4) {
        const cand = correctValue + randInt(-5, 7);
        if (cand > 3 && cand !== correctValue) optionsSet.add(cand);
      }
    }

    const options = Array.from(optionsSet).slice(0, 4).sort(() => Math.random() - 0.5);

    state.currentTask = {
      charType,
      mechanic,
      questionType,
      concept,
      w,
      h,
      areaVal,
      perimVal,
      unknownSidePos,
      knownSideVal,
      unknownSideVal,
      correctValue,
      options
    };

    renderCharacter(charType);
    renderQuestionPlaque();
    renderBlueprint();

    const targetsGrid = document.getElementById('targets-grid-container');
    const leverBox = document.getElementById('architect-lever-container');

    if (mechanic === 'arcade') {
      targetsGrid.classList.remove('hidden');
      targetsGrid.classList.add('grid');
      leverBox.classList.add('hidden');
      leverBox.classList.remove('flex');
      renderStationaryTargets();
    } else {
      targetsGrid.classList.add('hidden');
      targetsGrid.classList.remove('grid');
      leverBox.classList.remove('hidden');
      leverBox.classList.add('flex');
    }
  }

  /* ============================================================================

  function renderQuestionPlaque() {
    const { concept, questionType, areaVal, perimVal, correctValue, mechanic } = state.currentTask;
    const iconGroup = document.getElementById('plaque-concept-icon');
    const formulaText = document.getElementById('plaque-formula-text');
    iconGroup.innerHTML = '';

    if (concept === 'S') {
      const positions = [[-22, -22], [3, -22], [-22, 3], [3, 3]];
      positions.forEach(([x, y]) => {

          x, y, width: 21, height: 21, rx: 4,

        }));

        x: -22, y: -22, width: 44, height: 44, rx: 6,
        fill: 'none',
        stroke: '#38bdf8',
        'stroke-width': 6
      }));
      [[-22, -22], [22, -22], [22, 22], [-22, 22]].forEach(([cx, cy]) => {

      const givenTotal = concept === 'S' ? areaVal : perimVal;
      formulaText.textContent = `${concept} = ${givenTotal}`;
    } else {
      formulaText.textContent = `${concept} = ?`;

  function renderBlueprint() {
    const bgGrid = document.getElementById('blueprint-bg-grid');
    const shapeLayer = document.getElementById('blueprint-shape-layer');
    const dimLayer = document.getElementById('blueprint-dimensions-layer');

    bgGrid.innerHTML = '';
    shapeLayer.innerHTML = '';
    dimLayer.innerHTML = '';

    const task = state.currentTask;
    const isBuilder = task.mechanic === 'builder';

    const maxCols = 10;
    const maxRows = 8;
    const cellSize = 46;
    const startX = 370 - (maxCols * cellSize) / 2;
    const startY = 295 - (maxRows * cellSize) / 2;

    for (let r = 0; r <= maxRows; r++) {
      bgGrid.appendChild(el('line', {
        x1: startX, y1: startY + r * cellSize,
        x2: startX + maxCols * cellSize, y2: startY + r * cellSize,
        stroke: '#4ade80', 'stroke-width': 1.5
      }));
    }
    for (let c = 0; c <= maxCols; c++) {
      bgGrid.appendChild(el('line', {
        x1: startX + c * cellSize, y1: startY,
        x2: startX + c * cellSize, y2: startY + maxRows * cellSize,
        stroke: '#4ade80', 'stroke-width': 1.5
      }));
    }

    if (isBuilder) {
      renderInteractiveBuilderGrid(startX, startY, cellSize, maxCols, maxRows);
      return;
    }

    const { w, h, concept, questionType, unknownSidePos, areaVal, perimVal } = task;
    const shapeX = 370 - (w * cellSize) / 2;
    const shapeY = 295 - (h * cellSize) / 2;

    let tileIndex = 0;
    for (let r = 0; r < h; r++) {
      for (let c = 0; c < w; c++) {
        const tx = shapeX + c * cellSize;
        const ty = shapeY + r * cellSize;
        const idx = tileIndex++;

        const tile = el('rect', {
          x: tx + 2,
          y: ty + 2,
          width: cellSize - 4,
          height: cellSize - 4,
          rx: 6,
          'data-row': r,
          'data-col': c,
          fill: state.gridVisible ? '#16a34a' : '#0f3524',
          stroke: state.gridVisible ? '#bbf7d0' : '#1b5e3c',
          'stroke-width': state.gridVisible ? 2.5 : 1.5,
          class: 'cursor-pointer'
        });

        tile.addEventListener('click', (e) => {
          e.stopPropagation();
          sfx.playTileTick(idx);
          tile.setAttribute('fill', '#22c55e');
          tile.setAttribute('stroke', '#FFE45E');
          tile.setAttribute('stroke-width', '3');
        });

        shapeLayer.appendChild(tile);
      }
    }

    // Outer Rectangle Border
    const outlinePath = `M ${shapeX} ${shapeY} L ${shapeX + w * cellSize} ${shapeY} L ${shapeX + w * cellSize} ${shapeY + h * cellSize} L ${shapeX} ${shapeY + h * cellSize} Z`;
    shapeLayer.appendChild(el('path', {
      d: outlinePath,
      fill: 'none',
      stroke: concept === 'P' ? '#38bdf8' : '#f59e0b',
      'stroke-width': 6.5,
      'stroke-linejoin': 'round',
      style: 'pointer-events: none;'
    }));

    // Highlight the unknown side in bright glowing gold/cyan when questionType === 'find_side'
    if (questionType === 'find_side') {
      const unkLine = unknownSidePos === 'top'
        ? { x1: shapeX, y1: shapeY, x2: shapeX + w * cellSize, y2: shapeY }
        : { x1: shapeX, y1: shapeY, x2: shapeX, y2: shapeY + h * cellSize };

      shapeLayer.appendChild(el('line', {
        ...unkLine,
        stroke: '#FFE45E',
        'stroke-width': 10,
        'stroke-dasharray': '12,6',
        'stroke-linecap': 'round',
        style: 'pointer-events: none;'
      }));

      // Center watermark badge inside the rectangle showing `S = 24` or `P = 18` right on the figure too!
      const centerX = shapeX + (w * cellSize) / 2;
      const centerY = shapeY + (h * cellSize) / 2;
      const centerGroup = el('g', {
        transform: `translate(${centerX}, ${centerY})`,
        style: 'pointer-events: none;'
      });
      centerGroup.appendChild(el('rect', {
        x: -64, y: -24, width: 128, height: 48, rx: 14,
        fill: '#09140e',
        opacity: '0.86',
        stroke: concept === 'S' ? '#4ade80' : '#38bdf8',
        'stroke-width': 3
      }));
      const cText = el('text', {
        x: 0, y: 10,
        'text-anchor': 'middle',
        'font-size': '28',
        class: concept === 'S' ? 'crisp-math-text' : 'crisp-cyan-text'
      });
      cText.textContent = `${concept} = ${concept === 'S' ? areaVal : perimVal}`;
      centerGroup.appendChild(cText);
      shapeLayer.appendChild(centerGroup);
    }

    // Corner Amber Dewdrop Vertices
    [
      [shapeX, shapeY],
      [shapeX + w * cellSize, shapeY],
      [shapeX + w * cellSize, shapeY + h * cellSize],
      [shapeX, shapeY + h * cellSize]
    ].forEach(([vx, vy]) => {
      shapeLayer.appendChild(el('circle', {
        cx: vx, cy: vy, r: 6.5,
        fill: '#FFE45E',
        stroke: '#1c0d04',
        'stroke-width': 2.5
      }));
    });

    // Side Dimension Badges (`?` on the unknown side, number on the known side!)
    if (questionType === 'find_side') {
      const topLabel = unknownSidePos === 'top' ? '?' : w;
      const leftLabel = unknownSidePos === 'left' ? '?' : h;
      createDimensionBadge(dimLayer, shapeX + (w * cellSize) / 2, shapeY - 34, topLabel, unknownSidePos === 'top');
      createDimensionBadge(dimLayer, shapeX - 38, shapeY + (h * cellSize) / 2, leftLabel, unknownSidePos === 'left');
    } else {
      createDimensionBadge(dimLayer, shapeX + (w * cellSize) / 2, shapeY - 34, w, false);
      createDimensionBadge(dimLayer, shapeX - 38, shapeY + (h * cellSize) / 2, h, false);
    }
  }

  function renderInteractiveBuilderGrid(startX, startY, cellSize, maxCols, maxRows) {
    const shapeLayer = document.getElementById('blueprint-shape-layer');
    const dimLayer = document.getElementById('blueprint-dimensions-layer');

    const bw = state.builderW;
    const bh = state.builderH;
    const originC = 1;
    const originR = 1;

    for (let r = 0; r < maxRows; r++) {
      for (let c = 0; c < maxCols; c++) {
        const inRect = c >= originC && c < originC + bw && r >= originR && r < originR + bh;
        const cx = startX + c * cellSize;
        const cy = startY + r * cellSize;

        const cell = el('rect', {
          x: cx + 2,
          y: cy + 2,
          width: cellSize - 4,
          height: cellSize - 4,
          rx: 6,
          fill: inRect ? '#22c55e' : 'rgba(15, 53, 36, 0.45)',
          stroke: inRect ? '#FFE45E' : '#164e33',
          'stroke-width': inRect ? 2.5 : 1,
          class: 'cursor-pointer'
        });

        const resizeToHere = () => {
          if (state.locked) return;
          const newW = Math.max(1, Math.min(8, c - originC + 1));
          const newH = Math.max(1, Math.min(6, r - originR + 1));
          if (newW !== state.builderW || newH !== state.builderH) {
            state.builderW = newW;
            state.builderH = newH;
            sfx.playTileTick(newW + newH);
            renderBlueprint();
          }
        };

        cell.addEventListener('pointerdown', resizeToHere);
        cell.addEventListener('pointerenter', (e) => {
          if (e.buttons === 1) resizeToHere();
        });

        shapeLayer.appendChild(cell);
      }
    }

    const rx = startX + originC * cellSize;
    const ry = startY + originR * cellSize;
    shapeLayer.appendChild(el('rect', {
      x: rx, y: ry,
      width: bw * cellSize,
      height: bh * cellSize,
      fill: 'none',
      stroke: '#FFE45E',
      'stroke-width': 5,
      rx: 8,
      style: 'pointer-events: none;'
    }));

    // Cute Socketed Ladybug Corner Drag Handle!
    const handleX = rx + bw * cellSize;
    const handleY = ry + bh * cellSize;
    const ladybug = el('g', {
      transform: `translate(${handleX}, ${handleY})`,
      style: 'pointer-events: none;'
    });
    // Tiny legs attached to body
    ladybug.appendChild(el('path', {
      d: 'M -16 -6 L -22 -10 M -17 0 L -24 0 M -16 6 L -22 10 M 16 -6 L 22 -10 M 17 0 L 24 0 M 16 6 L 22 10',
      stroke: '#09130c', 'stroke-width': 3, 'stroke-linecap': 'round'
    }));
    ladybug.appendChild(el('circle', { cx: 0, cy: -14, r: 7, fill: '#09130c' }));
    ladybug.appendChild(el('circle', { cx: 0, cy: 0, r: 16, fill: '#ef4444', stroke: '#09130c', 'stroke-width': 3.5 }));
    ladybug.appendChild(el('line', { x1: 0, y1: -15, x2: 0, y2: 15, stroke: '#09130c', 'stroke-width': 2.5 }));
    ladybug.appendChild(el('circle', { cx: -6, cy: -4, r: 3, fill: '#09130c' }));
    ladybug.appendChild(el('circle', { cx: 6, cy: -4, r: 3, fill: '#09130c' }));
    ladybug.appendChild(el('circle', { cx: -5, cy: 6, r: 2.5, fill: '#09130c' }));
    ladybug.appendChild(el('circle', { cx: 5, cy: 6, r: 2.5, fill: '#09130c' }));
    shapeLayer.appendChild(ladybug);

    createDimensionBadge(dimLayer, rx + (bw * cellSize) / 2, ry - 32, bw, false);
    createDimensionBadge(dimLayer, rx - 36, ry + (bh * cellSize) / 2, bh, false);
  }

  function createDimensionBadge(container, x, y, labelValue, isUnknown = false) {

    g.appendChild(txt);
    container.appendChild(g);
  }

      }

      // Razor-sharp high-contrast number with solid dark stroke and zero blur!
      const txt = el('text', {
        x: 75, y: 92,
        'text-anchor': 'middle',
        'font-size': '50',
        class: 'crisp-math-text'
      });
      txt.textContent = val;
      svg.appendChild(txt);

      btn.appendChild(svg);

      // Insect Hero reacts when hovering a target using pure SVG attributes (never breaks sockets!)
      btn.addEventListener('pointerenter', () => {
        if (state.locked) return;
        sfx.playHoverTick();
        if (charType === 'mosquito') {
          const rect = btn.getBoundingClientRect();
          const charRect = document.getElementById('character-station-btn').getBoundingClientRect();
          const dy = (rect.top + rect.height / 2) - (charRect.top + charRect.height * 0.45);
          const dx = (rect.left + rect.width / 2) - (charRect.left + charRect.width * 0.55);
          const angle = Math.max(-24, Math.min(20, Math.atan2(dy, dx) * (180 / Math.PI)));
          document.getElementById('mosquito-head-group').setAttribute('transform', `translate(4, -56) rotate(${angle})`);
        } else if (charType === 'fly') {
          document.getElementById('fly-paws-group').setAttribute('transform', 'translate(0, 6) scale(1.12)');
        } else {
          document.getElementById('beetle-launcher-arm').setAttribute('transform', 'translate(48, -2) rotate(-22)');
        }
      });

      btn.addEventListener('pointerleave', () => {
        if (charType === 'fly') {
          document.getElementById('fly-paws-group').setAttribute('transform', 'translate(0, 10) scale(1)');
        } else if (charType === 'beetle') {
          document.getElementById('beetle-launcher-arm').setAttribute('transform', 'translate(48, -2) rotate(0)');
        }
      });

      btn.addEventListener('click', () => {
        handleStationaryTargetClick(btn, svg, val);
      });

      container.appendChild(btn);
    });
  }

  /* ============================================================================
   * 6. TARGET CLICK, PROJECTILES & INSECT REACTIONS
   * ============================================================================ */
  function screenToOverlayCoords(clientX, clientY) {
    return {
      x: (clientX / window.innerWidth) * 1920,
      y: (clientY / window.innerHeight) * 1080
    };
  }

  function handleStationaryTargetClick(btn, svgNode, chosenVal) {
    if (state.locked || btn.dataset.hit === 'true') return;

    const { charType, correctValue } = state.currentTask;
    const isCorrect = chosenVal === correctValue;
    btn.dataset.hit = 'true';
    if (isCorrect) state.locked = true;

    const charBtn = document.getElementById('character-station-btn');
    const cRect = charBtn.getBoundingClientRect();
    const tRect = btn.getBoundingClientRect();

    const startPt = screenToOverlayCoords(cRect.left + cRect.width * 0.65, cRect.top + cRect.height * 0.45);
    const endPt = screenToOverlayCoords(tRect.left + tRect.width / 2, tRect.top + tRect.height / 2);

    if (charType === 'mosquito') {
      sfx.playMosquitoShoot();
      document.getElementById('mosquito-loaded-dew').style.display = 'none';
    } else if (charType === 'fly') {
      sfx.playFlyShoot();
      document.getElementById('fly-honey-ammo').style.display = 'none';
    } else {
      sfx.playBeetleShoot();
      document.getElementById('beetle-acorn-ammo').style.display = 'none';
      const arm = document.getElementById('beetle-launcher-arm');
      arm.setAttribute('transform', 'translate(48, -2) rotate(38)');
      setTimeout(() => { arm.setAttribute('transform', 'translate(48, -2) rotate(0)'); }, 240);
    }

    const projLayer = document.getElementById('projectile-layer');
    const pNode = el('g');

    if (charType === 'mosquito') {
      // Glowing Dewdrop Dart
      pNode.appendChild(el('path', {
        d: 'M -28 0 Q 0 -16 24 0 Q 0 16 -28 0 Z',
        fill: 'url(#dewCyan)', stroke: '#ffffff', 'stroke-width': 2.5
      }));
    } else if (charType === 'fly') {
      // Golden Honey Sphere
      pNode.appendChild(el('circle', {
        cx: 0, cy: 0, r: 20,
        fill: 'url(#honeyGold)', stroke: '#ffffff', 'stroke-width': 3
      }));
    } else {
      // Flying Acorn
      pNode.appendChild(el('ellipse', {
        cx: 0, cy: 0, rx: 22, ry: 16,
        fill: '#d97706', stroke: '#fde047', 'stroke-width': 3
      }));
    }

    projLayer.appendChild(pNode);

    state.projectiles.push({
      node: pNode,
      startX: startPt.x,
      startY: startPt.y,
      endX: endPt.x,
      endY: endPt.y,
      progress: 0,
      speed: 0.088,
      isCorrect,
      btn,
      svgNode
    });
  }

  function resolveTargetImpact(p) {
    const { charType, questionType, unknownSidePos, correctValue, w, h } = state.currentTask;
    document.getElementById('mosquito-loaded-dew').style.display = 'block';
    document.getElementById('fly-honey-ammo').style.display = 'block';
    document.getElementById('beetle-acorn-ammo').style.display = 'block';

    if (p.isCorrect) {
      // Replace ? on the blueprint with the discovered side number!
      if (questionType === 'find_side') {
        const dimLayer = document.getElementById('blueprint-dimensions-layer');
        dimLayer.innerHTML = '';
        const cellSize = 46;
        const shapeX = 370 - (w * cellSize) / 2;
        const shapeY = 295 - (h * cellSize) / 2;
        createDimensionBadge(dimLayer, shapeX + (w * cellSize) / 2, shapeY - 34, w, unknownSidePos === 'top');
        createDimensionBadge(dimLayer, shapeX - 38, shapeY + (h * cellSize) / 2, h, unknownSidePos === 'left');
      }

      // Transform target into glowing golden flower star
      p.svgNode.innerHTML = '';
      p.svgNode.appendChild(el('circle', {
        cx: 75, cy: 75, r: 58,
        fill: '#14532d', stroke: '#FFE45E', 'stroke-width': 7
      }));
      p.svgNode.appendChild(el('polygon', {
        points: '75,22 90,55 126,59 99,83 106,118 75,100 44,118 51,83 24,59 60,55',
        fill: '#FFE45E', stroke: '#09130c', 'stroke-width': 3
      }));
      triggerCorrectCelebration(p.endX, p.endY, charType);
    } else {
      p.btn.style.opacity = '0.42';
      triggerWrongReaction(p.endX, p.endY, charType);
    }
  }

  // Builder Mode Submit
  document.getElementById('architect-submit-btn').addEventListener('click', (e) => {
    if (state.locked || !state.currentTask) return;
    const { concept, correctValue, charType } = state.currentTask;
    const currentVal = concept === 'S'
      ? state.builderW * state.builderH
      : 2 * (state.builderW + state.builderH);

    const rect = e.currentTarget.getBoundingClientRect();
    const pt = screenToOverlayCoords(rect.left + rect.width / 2, rect.top + rect.height / 2);

    if (currentVal === correctValue) {
      state.locked = true;
      triggerCorrectCelebration(pt.x, pt.y, charType);
    } else {
      triggerWrongReaction(pt.x, pt.y, charType);
    }
  });

  function animateCharacterReaction(charType, isSuccess) {
    const groupId = charType === 'mosquito' ? 'char-mosquito' : (charType === 'fly' ? 'char-fly' : 'char-beetle');
    const rootGroup = document.getElementById(groupId);
    const baseCoords = charType === 'mosquito' ? [168, 232] : (charType === 'fly' ? [168, 240] : [168, 250]);
    const startTime = performance.now();
    const duration = isSuccess ? 900 : 560;

    function step(now) {
      const t = Math.min(1, (now - startTime) / duration);
      if (t < 1) {
        if (isSuccess) {
          const jumpY = -Math.abs(Math.sin(t * Math.PI * 2)) * 26;
          const tilt = Math.sin(t * Math.PI * 4) * 8;
          rootGroup.setAttribute('transform', `translate(${baseCoords[0]}, ${baseCoords[1] + jumpY}) rotate(${tilt})`);
        } else {
          const shakeX = Math.sin(t * Math.PI * 6) * 12 * (1 - t);
          rootGroup.setAttribute('transform', `translate(${baseCoords[0] + shakeX}, ${baseCoords[1]})`);
        }
        requestAnimationFrame(step);
      } else {
        rootGroup.setAttribute('transform', `translate(${baseCoords[0]}, ${baseCoords[1]})`);
      }
    }
    requestAnimationFrame(step);
  }

  function triggerCorrectCelebration(fxX, fxY, charType) {
    sfx.playVictory(charType);
    spawnPollenBurst(fxX, fxY, '#FFE45E', 26);
    spawnPollenBurst(960, 540, '#4ade80', 32);

    animateCharacterReaction(charType, true);
    sproutMacroSanctuary(charType);
    addPondLilySprout(charType);

    setTimeout(() => {
      generateTask();
    }, 2000);
  }

  function triggerWrongReaction(fxX, fxY, charType) {
    sfx.playWrong(charType);
    spawnPollenBurst(fxX, fxY, '#ec4899', 16);

    animateCharacterReaction(charType, false);

    if (charType === 'mosquito') {
      document.getElementById('mosquito-proboscis-straight').style.display = 'none';
      document.getElementById('mosquito-proboscis-bent').style.display = 'block';
    } else if (charType === 'fly') {
      document.getElementById('fly-jam-fx').style.display = 'block';
    } else {
      document.getElementById('beetle-dizzy-fx').style.display = 'block';
    }

    setTimeout(() => {
      document.getElementById('mosquito-proboscis-straight').style.display = 'block';
      document.getElementById('mosquito-proboscis-bent').style.display = 'none';
      document.getElementById('fly-jam-fx').style.display = 'none';
      document.getElementById('beetle-dizzy-fx').style.display = 'none';
    }, 900);
  }

  function sproutMacroSanctuary(charType) {
    const layer = document.getElementById('completed-building-layer');
    layer.innerHTML = '';
    const g = el('g', { class: 'anim-pop' });

    if (charType === 'mosquito') {
      // Giant Blooming Lotus & Dew Crown
      g.appendChild(el('ellipse', { cx: 0, cy: 38, rx: 95, ry: 26, fill: 'url(#leafBlade)', stroke: '#FFE45E', 'stroke-width': 4 }));
      g.appendChild(el('path', { d: 'M -65 30 Q -40 -65 0 -20 Q 40 -65 65 30 Z', fill: 'url(#berryMagenta)', stroke: '#ffffff', 'stroke-width': 3 }));
      g.appendChild(el('circle', { cx: 0, cy: -38, r: 28, fill: 'url(#dewCyan)', stroke: '#ffffff', 'stroke-width': 3 }));
    } else if (charType === 'fly') {
      // Royal Golden Beehive Palace
      g.appendChild(el('ellipse', { cx: 0, cy: 35, rx: 76, ry: 26, fill: 'url(#honeyGold)', stroke: '#78350f', 'stroke-width': 4 }));
      g.appendChild(el('ellipse', { cx: 0, cy: 0, rx: 64, ry: 24, fill: 'url(#honeyGold)', stroke: '#78350f', 'stroke-width': 4 }));
      g.appendChild(el('ellipse', { cx: 0, cy: -35, rx: 46, ry: 20, fill: 'url(#honeyGold)', stroke: '#78350f', 'stroke-width': 4 }));
      g.appendChild(el('circle', { cx: 0, cy: 8, r: 16, fill: '#271203' }));
    } else {
      // Giant Glowing Acorn Lantern House
      g.appendChild(el('path', { d: 'M -65 45 L -52 -35 L 52 -35 L 65 45 Z', fill: 'url(#barkPlank)', stroke: 'url(#amberRim)', 'stroke-width': 4.5 }));
      g.appendChild(el('path', { d: 'M -85 -30 Q 0 -125 85 -30 Z', fill: 'url(#leafBlade)', stroke: 'url(#amberRim)', 'stroke-width': 4.5 }));
      g.appendChild(el('circle', { cx: 0, cy: 8, r: 22, fill: '#FFE45E', stroke: '#451a03', 'stroke-width': 4 }));
    }

    layer.appendChild(g);
  }

  function addPondLilySprout(charType) {
    const pond = document.getElementById('pond-sprouts-layer');
    const slotX = 310 + (state.solvedCount % 9) * 150;
    state.solvedCount++;

    const g = el('g', {
      transform: `translate(${slotX}, 695)`,
      class: 'anim-pop'
    });

    g.appendChild(el('ellipse', { cx: 0, cy: 0, rx: 38, ry: 11, fill: '#16a34a', stroke: '#4ade80', 'stroke-width': 2 }));
    if (charType === 'mosquito') {
      g.appendChild(el('circle', { cx: 0, cy: -10, r: 11, fill: 'url(#dewCyan)' }));
    } else if (charType === 'fly') {
      g.appendChild(el('polygon', { points: '-14,-4 0,-24 14,-4', fill: '#facc15' }));
    } else {
      g.appendChild(el('path', { d: 'M -16 -4 Q 0 -28 16 -4 Z', fill: '#ec4899' }));
    }

    pond.appendChild(g);
  }

  /* ============================================================================
   * 7. VISUAL SCAFFOLDING HINT SYSTEM (TAILORED TO FINDING UNKNOWN SIDE!)
   * ============================================================================ */
  function triggerVisualScaffolding() {
    if (!state.currentTask) return;
    const { concept, questionType, unknownSidePos, w, h } = state.currentTask;
    const fxLayer = document.getElementById('blueprint-perimeter-fx');
    fxLayer.innerHTML = '';

    const cellSize = 46;
    const shapeX = 370 - (w * cellSize) / 2;
    const shapeY = 295 - (h * cellSize) / 2;

    if (questionType === 'find_side' && concept === 'S') {
      // Visual Hint for S -> ?: Light up strips of the KNOWN side one by one so the child counts how many strips make S!
      state.gridVisible = true;
      renderBlueprint();
      const tiles = Array.from(document.querySelectorAll('#blueprint-shape-layer rect[data-row]'));
      const totalStrips = unknownSidePos === 'top' ? w : h;

      for (let s = 0; s < totalStrips; s++) {
        setTimeout(() => {
          sfx.playTileTick(s);
          tiles.forEach(t => {
            const r = Number(t.getAttribute('data-row'));
            const c = Number(t.getAttribute('data-col'));
            const match = unknownSidePos === 'top' ? (c === s) : (r === s);
            if (match) {
              t.setAttribute('fill', s % 2 === 0 ? '#22c55e' : '#10b981');
              t.setAttribute('stroke', '#FFE45E');
              t.setAttribute('stroke-width', '3');
            }
          });
        }, s * 180);
      }
    } else if (questionType === 'find_side' && concept === 'P') {
      // Visual Hint for P -> ?:
      // Step 1: Highlight BOTH opposite KNOWN sides (e.g. left & right) and show the known number on the opposite side too!
      // Step 2: Pulse the TWO remaining equal UNKNOWN sides (`?` and `?`) in gold!
      const knownLines = unknownSidePos === 'top'
        ? [
            [shapeX, shapeY, shapeX, shapeY + h * cellSize],
            [shapeX + w * cellSize, shapeY, shapeX + w * cellSize, shapeY + h * cellSize]
          ]
        : [
            [shapeX, shapeY, shapeX + w * cellSize, shapeY],
            [shapeX, shapeY + h * cellSize, shapeX + w * cellSize, shapeY + h * cellSize]
          ];

      const unknownLines = unknownSidePos === 'top'
        ? [
            [shapeX, shapeY, shapeX + w * cellSize, shapeY],
            [shapeX, shapeY + h * cellSize, shapeX + w * cellSize, shapeY + h * cellSize]
          ]
        : [
            [shapeX, shapeY, shapeX, shapeY + h * cellSize],
            [shapeX + w * cellSize, shapeY, shapeX + w * cellSize, shapeY + h * cellSize]
          ];

      // Step 1: Known opposite sides
      sfx.playTileTick(1);
      knownLines.forEach(seg => {
        fxLayer.appendChild(el('line', {
          x1: seg[0], y1: seg[1], x2: seg[2], y2: seg[3],
          stroke: '#4ade80',
          'stroke-width': 12,
          'stroke-linecap': 'round'
        }));
      });

      // Also display the opposite known side badge so the child sees both known sides clearly
      if (unknownSidePos === 'top') {
        createDimensionBadge(fxLayer, shapeX + w * cellSize + 38, shapeY + (h * cellSize) / 2, h, false);
      } else {
        createDimensionBadge(fxLayer, shapeX + (w * cellSize) / 2, shapeY + h * cellSize + 34, w, false);
      }

      // Step 2: Highlight both equal unknown sides (`?` and `?`)
      setTimeout(() => {
        sfx.playTileTick(5);
        unknownLines.forEach(seg => {
          fxLayer.appendChild(el('line', {
            x1: seg[0], y1: seg[1], x2: seg[2], y2: seg[3],
            stroke: '#FFE45E',
            'stroke-width': 12,
            'stroke-dasharray': '14,8',
            'stroke-linecap': 'round'
          }));
        });
        if (unknownSidePos === 'top') {
          createDimensionBadge(fxLayer, shapeX + (w * cellSize) / 2, shapeY + h * cellSize + 34, '?', true);
        } else {
          createDimensionBadge(fxLayer, shapeX + w * cellSize + 38, shapeY + (h * cellSize) / 2, '?', true);
        }
      }, 450);

    } else if (concept === 'S') {
      state.gridVisible = !state.gridVisible;
      renderBlueprint();
      const tiles = document.querySelectorAll('#blueprint-shape-layer rect[data-row]');
      tiles.forEach((t, i) => {
        setTimeout(() => {
          sfx.playTileTick(i);
          t.setAttribute('fill', '#22c55e');
          t.setAttribute('stroke', '#FFE45E');
        }, i * 28);
      });
    } else {
      const segments = [
        [shapeX, shapeY, shapeX + w * cellSize, shapeY],
        [shapeX + w * cellSize, shapeY, shapeX + w * cellSize, shapeY + h * cellSize],
        [shapeX + w * cellSize, shapeY + h * cellSize, shapeX, shapeY + h * cellSize],
        [shapeX, shapeY + h * cellSize, shapeX, shapeY]
      ];
      segments.forEach((seg, idx) => {
        setTimeout(() => {
          sfx.playTileTick(idx * 2);
          fxLayer.appendChild(el('line', {
            x1: seg[0], y1: seg[1], x2: seg[2], y2: seg[3],
            stroke: '#FFE45E',
            'stroke-width': 11,
            'stroke-linecap': 'round'
          }));
        }, idx * 200);
      });
    }
  }

  document.getElementById('scaffolding-hint-btn').addEventListener('click', triggerVisualScaffolding);
  document.getElementById('question-plaque').addEventListener('click', triggerVisualScaffolding);

  // Clicking directly on the insect hero triggers a fun unique reaction & sound
  document.getElementById('character-station-btn').addEventListener('click', () => {
    if (!state.currentTask) return;
    const { charType } = state.currentTask;
    if (charType === 'mosquito') sfx.playMosquitoSong();
    else if (charType === 'fly') sfx.playFlyBuzz();
    else sfx.playBeetleClack();
    spawnPollenBurst(250, 660, '#FFE45E', 15);
  });

  function updateModeButtonsUI() {
    const map = {
      side_all: 'mode-bg-side-all',
      side_s: 'mode-bg-side-s',
      side_p: 'mode-bg-side-p',
      classic: 'mode-bg-classic',
      builder: 'mode-bg-builder'
    };
    for (const [key, id] of Object.entries(map)) {
      const rect = document.getElementById(id);
      if (state.gameMode === key) {
        rect.setAttribute('fill', '#143823');
        rect.setAttribute('stroke', '#FFE45E');
        rect.setAttribute('stroke-width', '4');
      } else {
        rect.setAttribute('fill', '#1b120c');
        rect.setAttribute('stroke', '#78553a');
        rect.setAttribute('stroke-width', '3');
      }
    }
  }

  document.getElementById('mode-btn-side-all').addEventListener('click', () => {
    state.gameMode = 'side_all';
    updateModeButtonsUI();
    sfx.playNextSkip();
    generateTask();
  });
  document.getElementById('mode-btn-side-s').addEventListener('click', () => {
    state.gameMode = 'side_s';
    updateModeButtonsUI();
    sfx.playNextSkip();
    generateTask();
  });
  document.getElementById('mode-btn-side-p').addEventListener('click', () => {
    state.gameMode = 'side_p';
    updateModeButtonsUI();
    sfx.playNextSkip();
    generateTask();
  });
  document.getElementById('mode-btn-classic').addEventListener('click', () => {
    state.gameMode = 'classic';
    updateModeButtonsUI();
    sfx.playNextSkip();
    generateTask();
  });
  document.getElementById('mode-btn-builder').addEventListener('click', () => {
    state.gameMode = 'builder';
    updateModeButtonsUI();
    sfx.playNextSkip();
    generateTask();
  });

  document.getElementById('sound-toggle-btn').addEventListener('click', () => {
    const isMuted = sfx.toggleMute();
    document.getElementById('sound-mute-slash').style.display = isMuted ? 'block' : 'none';
    document.getElementById('sound-waves-icon').style.display = isMuted ? 'none' : 'block';
  });

  // Switch Insect Hero on demand (Mosquito -> Fly -> Stag Beetle)
  document.getElementById('switch-hero-btn').addEventListener('click', () => {
    if (state.locked || !state.currentTask) return;
    const nextChar = state.charOrder[state.charIndex % 3];
    state.charIndex++;
    state.currentTask.charType = nextChar;
    sfx.playNextSkip();
    renderCharacter(nextChar);
    if (state.currentTask.mechanic === 'arcade') {
      renderStationaryTargets();
    }
  });

  document.getElementById('next-task-btn').addEventListener('click', () => {
    sfx.playNextSkip();
    generateTask();
  });

  function spawnPollenBurst(x, y, color, count = 18) {
    const pLayer = document.getElementById('particles-layer');
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
      const speed = 4 + Math.random() * 8;
      const r = 5 + Math.random() * 6;
      const node = el('circle', {
        cx: 0, cy: 0, r,
        fill: i % 2 === 0 ? color : '#ffffff',
        transform: `translate(${x}, ${y})`
      });
      pLayer.appendChild(node);
      state.particles.push({
        node, x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        life: 1.0,
        decay: 0.03 + Math.random() * 0.02
      });
    }
  }

  function animateLoop() {
    // 1. Float Fireflies & Golden Pollen
    fireflies.forEach(f => {
      f.x += f.vx;
      f.y += f.vy;
      f.phase += 0.04;
      if (f.x < 0) f.x = 1920;
      if (f.x > 1920) f.x = 0;
      if (f.y < 60) f.vy = Math.abs(f.vy);
      if (f.y > 680) f.vy = -Math.abs(f.vy);
      f.node.setAttribute('cx', f.x.toFixed(1));
      f.node.setAttribute('cy', f.y.toFixed(1));
      f.node.setAttribute('opacity', (0.35 + 0.55 * Math.abs(Math.sin(f.phase))).toFixed(2));
    });

    // 2. Update Flying Projectiles
    for (let i = state.projectiles.length - 1; i >= 0; i--) {
      const p = state.projectiles[i];
      p.progress += p.speed;
      if (p.progress >= 1) {
        p.node.remove();
        state.projectiles.splice(i, 1);
        resolveTargetImpact(p);
      } else {
        const curX = p.startX + (p.endX - p.startX) * p.progress;
        const arcLift = Math.sin(p.progress * Math.PI) * -55;
        const curY = p.startY + (p.endY - p.startY) * p.progress + arcLift;
        const angle = Math.atan2(p.endY - p.startY, p.endX - p.startX) * (180 / Math.PI);
        p.node.setAttribute('transform', `translate(${curX}, ${curY}) rotate(${angle})`);
      }
    }

    // 3. Update Pollen Particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vy += 0.18;
      pt.life -= pt.decay;
      if (pt.life <= 0) {
        pt.node.remove();
        state.particles.splice(i, 1);
      } else {
        pt.node.setAttribute('transform', `translate(${pt.x}, ${pt.y}) scale(${pt.life})`);
        pt.node.setAttribute('opacity', pt.life.toFixed(2));
      }
    }

    requestAnimationFrame(animateLoop);
  }

  window.onload = () => {
    generateTask();
    animateLoop();
  };
})();
</script>
</body>
</html>
