<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Математичні Овечки</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@600;700;800;900&display=swap');

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #2b4c28;
    font-family: 'Rubik', sans-serif;
  }

  #gameCanvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: pointer;
  }

  .hud-bar {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 20;
    padding: 8px 16px;
    border-radius: 26px;
    background: linear-gradient(180deg, #5c3a1e 0%, #3d2410 55%, #291709 100%);
    border: 3px solid #8c6239;
    box-shadow:
      0 8px 20px rgba(0, 0, 0, 0.45),
      inset 0 2px 3px rgba(255, 225, 175, 0.35),
      inset 0 -3px 6px rgba(0, 0, 0, 0.6);
  }

  .hud-bar::before,
  .hud-bar::after {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffe699, #b58024 70%, #593a08 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.7);
  }

  .wood-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    padding: 0 18px;
    border-radius: 16px;
    font-family: 'Rubik', sans-serif;
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: 0.5px;
    color: #fff3d1;
    text-shadow: 0 2px 3px rgba(25, 10, 0, 0.85);
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 6px, rgba(0,0,0,0.04) 6px, rgba(0,0,0,0.04) 12px),
      linear-gradient(180deg, #8b5a2b 0%, #6b421b 50%, #4e2e10 100%);
    border: 2px solid #b8864c;
    box-shadow:
      0 4px 0 #2b1706,
      0 6px 10px rgba(0, 0, 0, 0.4),
      inset 0 2px 2px rgba(255, 232, 189, 0.4);
    cursor: pointer;
    transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, filter 0.15s ease;
  }

  .wood-btn:hover {
    filter: brightness(1.12);
    transform: translateY(-2px);
    box-shadow:
      0 6px 0 #2b1706,
      0 8px 14px rgba(0, 0, 0, 0.45),
      inset 0 2px 3px rgba(255, 240, 200, 0.55);
  }

  .wood-btn:active {
    transform: translateY(3px);
    box-shadow:
      0 1px 0 #2b1706,
      0 2px 4px rgba(0, 0, 0, 0.4),
      inset 0 2px 4px rgba(0, 0, 0, 0.4);
  }

  .wood-btn.active-mode {
    background:
      radial-gradient(circle at 50% 15%, rgba(255, 235, 140, 0.35), transparent 70%),
      linear-gradient(180deg, #e09f2d 0%, #b87414 55%, #874f08 100%);
    border-color: #ffe38f;
    color: #2b1400;
    text-shadow: 0 1px 0 rgba(255, 240, 190, 0.7);
    box-shadow:
      0 4px 0 #4a2803,
      0 0 14px rgba(255, 196, 61, 0.55),
      inset 0 2px 3px rgba(255, 250, 220, 0.75);
  }

  .lang-btn {
    background: linear-gradient(180deg, #3a6b4c 0%, #254d34 55%, #173322 100%);
    border-color: #6eb386;
    box-shadow:
      0 4px 0 #0e2115,
      0 6px 10px rgba(0, 0, 0, 0.4),
      inset 0 2px 2px rgba(190, 255, 210, 0.35);
    min-width: 68px;
  }

  .skip-btn {
    background: linear-gradient(180deg, #b85d29 0%, #8f3d13 55%, #632608 100%);
    border-color: #eb9860;
    box-shadow:
      0 4px 0 #3b1503,
      0 6px 10px rgba(0, 0, 0, 0.4),
      inset 0 2px 2px rgba(255, 210, 175, 0.45);
    padding: 0 16px;
  }

  .divider-gem {
    width: 6px;
    height: 26px;
    border-radius: 3px;
    background: linear-gradient(180deg, #b58024, #593a08);
    box-shadow: inset 0 1px 1px rgba(255,230,160,0.5);
  }

  @media (max-width: 768px) {
    .hud-bar {
      top: 8px;
      gap: 6px;
      padding: 6px 10px;
    }
    .wood-btn {
      height: 36px;
      padding: 0 10px;
      font-size: 0.85rem;
    }
  }
</style>
</head>
<body>

<div class="hud-bar">
  <button class="wood-btn active-mode" id="mode0" data-mode="0">+ − (20)</button>
  <button class="wood-btn" id="mode1" data-mode="1">× ÷</button>
  <button class="wood-btn" id="mode2" data-mode="2">+ − (100) × ÷</button>
  <div class="divider-gem"></div>
  <button class="wood-btn lang-btn" id="langBtn">УКР</button>
  <button class="wood-btn skip-btn" id="skipBtn" aria-label="Next">
    <svg width="26" height="20" viewBox="0 0 26 20" fill="none">
      <path d="M2 3L11 10L2 17V3Z" fill="#FFF3D1" stroke="#3B1503" stroke-width="2" stroke-linejoin="round"/>
      <path d="M13 3L22 10L13 17V3Z" fill="#FFF3D1" stroke="#3B1503" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // ==========================================
  // 1. WEB AUDIO SYNTHESIZER
  // ==========================================
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.lastHoofTime = 0;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    playWoodTick(pitch = 1) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(240 * pitch, now);
      osc.frequency.exponentialRampToValueAtTime(95 * pitch, now + 0.055);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.065);
    }

    playHoof(intensity = 1) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      if (now - this.lastHoofTime < 0.07) return;
      this.lastHoofTime = now;

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      const baseFreq = 115 + Math.random() * 35;
      osc.frequency.setValueAtTime(baseFreq, now);
      osc.frequency.exponentialRampToValueAtTime(38, now + 0.07);
      gain.gain.setValueAtTime(0.16 * intensity, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    }

    playSheepBaa(happy = true) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const dur = happy ? 0.55 : 0.42;

      const osc = this.ctx.createOscillator();
      osc.type = 'sawtooth';

      const lfo = this.ctx.createOscillator();
      const lfoGain = this.ctx.createGain();
      lfo.frequency.value = 26;
      lfoGain.gain.value = 18;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);

      const basePitch = happy ? 275 : 210;
      osc.frequency.setValueAtTime(basePitch, now);
      osc.frequency.linearRampToValueAtTime(basePitch * (happy ? 1.15 : 0.82), now + dur * 0.4);
      osc.frequency.linearRampToValueAtTime(basePitch * (happy ? 0.96 : 0.72), now + dur);

      const filter1 = this.ctx.createBiquadFilter();
      filter1.type = 'bandpass';
      filter1.frequency.setValueAtTime(750, now);
      filter1.Q.value = 4.5;

      const filter2 = this.ctx.createBiquadFilter();
      filter2.type = 'bandpass';
      filter2.frequency.setValueAtTime(1650, now);
      filter2.Q.value = 5.0;

      const masterGain = this.ctx.createGain();
      masterGain.gain.setValueAtTime(0.001, now);
      masterGain.gain.linearRampToValueAtTime(0.18, now + 0.05);
      masterGain.gain.setValueAtTime(0.16, now + dur - 0.12);
      masterGain.gain.exponentialRampToValueAtTime(0.001, now + dur);

      osc.connect(filter1);
      osc.connect(filter2);
      filter1.connect(masterGain);
      filter2.connect(masterGain);
      masterGain.connect(this.ctx.destination);

      lfo.start(now);
      osc.start(now);
      lfo.stop(now + dur);
      osc.stop(now + dur);
    }

    playJumpWhoosh() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const bufferSize = this.ctx.sampleRate * 0.35;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = 3.0;
      filter.frequency.setValueAtTime(280, now);
      filter.frequency.exponentialRampToValueAtTime(1200, now + 0.22);
      filter.frequency.exponentialRampToValueAtTime(400, now + 0.35);

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.22, now + 0.14);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start(now);
    }

    playSuccessFanfare(variant = 0) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const chords = [
        [523.25, 659.25, 783.99, 1046.50, 1318.51],
        [587.33, 739.99, 880.00, 1174.66, 1479.98],
        [440.00, 554.37, 659.25, 880.00, 1108.73]
      ];
      const notes = chords[variant % chords.length];

      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = idx % 2 === 0 ? 'triangle' : 'sine';
        const startTime = now + idx * 0.065;
        osc.frequency.setValueAtTime(freq, startTime);

        gain.gain.setValueAtTime(0.001, startTime);
        gain.gain.linearRampToValueAtTime(0.18, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.55);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.58);
      });

      setTimeout(() => this.playSheepBaa(true), 120);
    }

    playWrongSound(variant = 0) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      if (variant === 0) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.linearRampToValueAtTime(130, now + 0.35);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 600;

        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (variant === 1) {
        this.playWoodTick(0.7);
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, now + 0.05);
        osc.frequency.exponentialRampToValueAtTime(290, now + 0.18);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.5);

        lfo.frequency.value = 18;
        lfoGain.gain.value = 35;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);

        gain.gain.setValueAtTime(0.22, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.52);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        lfo.start(now + 0.05);
        osc.start(now + 0.05);
        lfo.stop(now + 0.52);
        osc.stop(now + 0.55);
      } else {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(580, now + 0.09);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.11);

        setTimeout(() => this.playSheepBaa(false), 90);
      }
    }
  }

  const sound = new SoundEngine();

  // ==========================================
  // 2. BILINGUAL DICTIONARY & PROBLEM GENERATOR
  // ==========================================
  const DICT = {
    uk: {
      add1: 'Доданок',
      add2: 'Доданок',
      sum:  'Сума',
      minuend: 'Зменшуване',
      subtrahend: "Від'ємник",
      diff: 'Різниця',
      mult1: 'Множник',
      mult2: 'Множник',
      prod: 'Добуток',
      dividend: 'Ділене',
      divisor: 'Дільник',
      quotient: 'Частка'
    },
    ru: {
      add1: 'Слагаемое',
      add2: 'Слагаемое',
      sum:  'Сумма',
      minuend: 'Уменьшаемое',
      subtrahend: 'Вычитаемое',
      diff: 'Разность',
      mult1: 'Множитель',
      mult2: 'Множитель',
      prod: 'Произведение',
      dividend: 'Делимое',
      divisor: 'Делитель',
      quotient: 'Частное'
    }
  };

  let currentLang = 'uk';
  let currentMode = 0;

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function generateProblem(mode) {
    let opType;
    if (mode === 0) {
      opType = Math.random() < 0.5 ? '+' : '-';
    } else if (mode === 1) {
      opType = Math.random() < 0.5 ? '×' : ':';
    } else {
      const ops = ['+', '-', '×', ':'];
      opType = ops[Math.floor(Math.random() * ops.length)];
    }

    let a, b, c, compKeys;

    if (opType === '+') {
      const limit = mode === 0 ? 20 : 100;
      const minSum = mode === 0 ? 5 : 15;
      c = randInt(minSum, limit);
      a = randInt(2, c - 2);
      b = c - a;
      compKeys = ['add1', 'add2', 'sum'];
    } else if (opType === '-') {
      const limit = mode === 0 ? 20 : 100;
      const minA = mode === 0 ? 6 : 16;
      a = randInt(minA, limit);
      b = randInt(2, a - 2);
      c = a - b;
      compKeys = ['minuend', 'subtrahend', 'diff'];
    } else if (opType === '×') {
      a = randInt(2, 9);
      b = randInt(2, 9);
      c = a * b;
      compKeys = ['mult1', 'mult2', 'prod'];
    } else {
      b = randInt(2, 9);
      c = randInt(2, 9);
      a = b * c;
      compKeys = ['dividend', 'divisor', 'quotient'];
    }

    const targetIdx = randInt(0, 2);
    const correctKey = compKeys[targetIdx];

    let poolKeys;
    if (mode === 0) {
      poolKeys = ['add1', 'sum', 'minuend', 'subtrahend', 'diff'];
    } else if (mode === 1) {
      poolKeys = ['mult1', 'prod', 'dividend', 'divisor', 'quotient'];
    } else {
      poolKeys = [
        'add1', 'sum', 'minuend', 'subtrahend', 'diff',
        'mult1', 'prod', 'dividend', 'divisor', 'quotient'
      ];
    }

    const sameOpKeys = compKeys
      .map(k => (k === 'add2' ? 'add1' : k === 'mult2' ? 'mult1' : k))
      .filter((v, i, self) => self.indexOf(v) === i);

    const normalizedCorrect =
      correctKey === 'add2' ? 'add1' : correctKey === 'mult2' ? 'mult1' : correctKey;

    const chosenKeys = [normalizedCorrect];

    for (const k of shuffle(sameOpKeys)) {
      if (!chosenKeys.includes(k) && chosenKeys.length < 3) {
        chosenKeys.push(k);
      }
    }
    for (const k of shuffle(poolKeys)) {
      if (!chosenKeys.includes(k) && chosenKeys.length < 3) {
        chosenKeys.push(k);
      }
    }

    const shuffledOptions = shuffle(chosenKeys);
    return {
      a,
      b,
      c,
      op: opType,
      targetIdx,
      correctKey: normalizedCorrect,
      optionKeys: shuffledOptions
    };
  }

  // ==========================================
  // 3. SCENE STATE
  // ==========================================
  let W = window.innerWidth;
  let H = window.innerHeight;

  const clouds = [];
  const birds = [];
  const grassTufts = [];
  const dandelionSeeds = [];
  const particles = [];
  const butterflies = [];
  const bgSheepList = [];
  let windmillAngle = 0;
  let rainbowAlpha = 0;
  let rainbowFenceIdx = 0;

  function initEnvironment() {
    clouds.length = 0;
    for (let i = 0; i < 6; i++) {
      clouds.push({
        x: Math.random() * W,
        y: H * (0.08 + Math.random() * 0.18),
        scale: 0.65 + Math.random() * 0.7,
        speed: 8 + Math.random() * 12
      });
    }

    birds.length = 0;
    for (let i = 0; i < 5; i++) {
      birds.push({
        x: Math.random() * W,
        y: H * (0.12 + Math.random() * 0.15),
        vx: 28 + Math.random() * 18,
        wingPhase: Math.random() * Math.PI * 2,
        scale: 0.6 + Math.random() * 0.5
      });
    }

    grassTufts.length = 0;
    const count = Math.floor(W / 18);
    for (let i = 0; i < count; i++) {
      const depth = Math.random();
      grassTufts.push({
        x: Math.random() * W,
        y: H * (0.55 + depth * 0.43),
        h: 14 + depth * 22,
        phase: Math.random() * Math.PI * 2,
        hasFlower: Math.random() < 0.32,
        flowerColor: ['#ffdf4d', '#ff7eb6', '#ffffff', '#7ec8ff', '#ffa64d'][Math.floor(Math.random() * 5)]
      });
    }

    dandelionSeeds.length = 0;
    for (let i = 0; i < 18; i++) {
      dandelionSeeds.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: 12 + Math.random() * 18,
        vy: -4 + Math.random() * 8,
        phase: Math.random() * Math.PI * 2,
        size: 3 + Math.random() * 3
      });
    }

    bgSheepList.length = 0;
    for (let i = 0; i < 3; i++) {
      bgSheepList.push({
        x: W * (0.12 + i * 0.25),
        y: H * (0.48 + (i % 2) * 0.03),
        dir: i % 2 === 0 ? 1 : -1,
        phase: Math.random() * 10,
        bounceY: 0,
        bounceVy: 0
      });
    }
  }

  // ==========================================
  // 4. FENCES
  // ==========================================
  const fences = [
    { idx: 0, x: 0, y: 0, scale: 0.88, hover: 0, shake: 0, signTilt: 0, signVel: 0, molePop: 0, cloudPuff: 0 },
    { idx: 1, x: 0, y: 0, scale: 0.96, hover: 0, shake: 0, signTilt: 0, signVel: 0, molePop: 0, cloudPuff: 0 },
    { idx: 2, x: 0, y: 0, scale: 1.05, hover: 0, shake: 0, signTilt: 0, signVel: 0, molePop: 0, cloudPuff: 0 }
  ];

  function updateLayoutPositions() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;

    fences[0].x = W * 0.63;
    fences[0].y = H * 0.56;
    fences[0].scale = Math.min(1.05, Math.max(0.75, W / 1450)) * 0.90;

    fences[1].x = W * 0.75;
    fences[1].y = H * 0.72;
    fences[1].scale = Math.min(1.08, Math.max(0.78, W / 1450)) * 0.98;

    fences[2].x = W * 0.61;
    fences[2].y = H * 0.88;
    fences[2].scale = Math.min(1.12, Math.max(0.82, W / 1450)) * 1.05;
  }

  // ==========================================
  // 5. SHEEP
  // ==========================================
  const sheep = {
    x: 0, y: 0, z: 0,
    vx: 0, vy: 0, vz: 0,
    pitch: 0, scale: 1,
    state: 'enter',
    stateTimer: 0,
    gaitPhase: 0, breathPhase: 0, earFlick: 0,
    blinkTimer: 0, isBlinking: false, tailPhase: 0,
    targetFenceIdx: -1, failVariant: 0,
    hasCrown: false, woolTint: 0, hasHorns: false,
    jumpStartX: 0, jumpStartY: 0,
    jumpEndX: 0, jumpEndY: 0, jumpProgress: 0,
    squishY: 1, dizzyStars: 0
  };

  let currentProblem = generateProblem(currentMode);
  let hoveredFenceIdx = -1;
  let mouseX = W * 0.7;
  let mouseY = H * 0.6;
  let celebrationCounter = 0;

  function homePos() {
    return { x: W * 0.25, y: H * 0.73 };
  }

  function spawnNextSheep(instant = false) {
    currentProblem = generateProblem(currentMode);
    const home = homePos();
    sheep.x = instant ? home.x : -W * 0.14;
    sheep.y = home.y;
    sheep.z = 0;
    sheep.pitch = 0;
    sheep.squishY = 1;
    sheep.state = instant ? 'idle' : 'enter';
    sheep.stateTimer = 0;
    sheep.targetFenceIdx = -1;
    sheep.hasCrown = false;
    sheep.dizzyStars = 0;
    sheep.woolTint = (Math.random() - 0.5) * 12;
    sheep.hasHorns = Math.random() < 0.35;

    fences.forEach(f => {
      f.shake = 0; f.signTilt = 0; f.signVel = 0;
      f.molePop = 0; f.cloudPuff = 0;
    });
  }

  // ==========================================
  // 6. VISUAL EFFECTS
  // ==========================================
  function spawnDust(x, y, count = 6, spread = 25) {
    for (let i = 0; i < count; i++) {
      particles.push({
        type: 'dust',
        x: x + (Math.random() - 0.5) * spread,
        y: y + (Math.random() - 0.5) * 8,
        vx: -35 + (Math.random() - 0.5) * 50,
        vy: -15 - Math.random() * 35,
        size: 7 + Math.random() * 11,
        alpha: 0.75, life: 0,
        maxLife: 0.45 + Math.random() * 0.35,
        color: Math.random() < 0.35 ? '#73a942' : '#d6c39c'
      });
    }
  }

  function triggerSuccessCelebration(fence) {
    const variant = celebrationCounter % 3;
    celebrationCounter++;
    sound.playSuccessFanfare(variant);

    const flowerColors = ['#ff598f', '#ffd93d', '#6bcB77', '#4d96ff', '#ff8c42', '#ffffff'];
    for (let i = 0; i < 34; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 70 + Math.random() * 210;
      particles.push({
        type: i % 2 === 0 ? 'flower' : 'sparkle',
        x: fence.x, y: fence.y - 55 * fence.scale,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 90,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 8,
        size: 8 + Math.random() * 10,
        alpha: 1, life: 0,
        maxLife: 1.1 + Math.random() * 0.7,
        color: flowerColors[i % flowerColors.length]
      });
    }

    for (let i = 0; i < 7; i++) {
      butterflies.push({
        x: fence.x + (Math.random() - 0.5) * 80,
        y: fence.y - 40,
        vx: (Math.random() - 0.3) * 110,
        vy: -55 - Math.random() * 65,
        wingPhase: Math.random() * Math.PI * 2,
        color: ['#ff9f1c', '#ff598f', '#3ec1d3', '#ffe66d'][i % 4],
        life: 0, maxLife: 2.6
      });
    }

    if (variant === 0) {
      sheep.hasCrown = true;
    } else if (variant === 1) {
      rainbowAlpha = 1.0;
      rainbowFenceIdx = fence.idx;
    } else {
      bgSheepList.forEach(bgs => { bgs.bounceVy = -140; });
    }
  }

  // ==========================================
  // 7. UPDATE
  // ==========================================
  function update(dt) {
    windmillAngle += dt * 0.65;
    if (rainbowAlpha > 0) rainbowAlpha = Math.max(0, rainbowAlpha - dt * 0.45);

    clouds.forEach(c => {
      c.x += c.speed * dt;
      if (c.x > W + 180) c.x = -180;
    });

    birds.forEach(b => {
      b.x += b.vx * dt;
      b.wingPhase += dt * 7;
      if (b.x > W + 100) {
        b.x = -100;
        b.y = H * (0.1 + Math.random() * 0.16);
      }
    });

    dandelionSeeds.forEach(d => {
      d.phase += dt * 2.2;
      d.x += (d.vx + Math.sin(d.phase) * 8) * dt;
      d.y += (d.vy + Math.cos(d.phase * 0.8) * 6) * dt;
      if (d.x > W + 20) d.x = -20;
      if (d.y < -20) d.y = H + 10;
      if (d.y > H + 20) d.y = -10;
    });

    bgSheepList.forEach(bgs => {
      bgs.phase += dt * 2;
      if (bgs.bounceVy !== 0 || bgs.bounceY < 0) {
        bgs.bounceY += bgs.bounceVy * dt;
        bgs.bounceVy += 420 * dt;
        if (bgs.bounceY >= 0) {
          bgs.bounceY = 0;
          bgs.bounceVy = 0;
        }
      }
    });

    fences.forEach((f, idx) => {
      const targetHover = hoveredFenceIdx === idx ? 1 : 0;
      f.hover += (targetHover - f.hover) * Math.min(1, dt * 10);
      if (f.shake > 0) f.shake = Math.max(0, f.shake - dt * 2.5);
      if (f.molePop > 0) f.molePop = Math.max(0, f.molePop - dt * 0.85);
      if (f.cloudPuff > 0) f.cloudPuff = Math.max(0, f.cloudPuff - dt * 0.8);

      if (Math.abs(f.signTilt) > 0.001 || Math.abs(f.signVel) > 0.001) {
        const springK = 38;
        const damping = 4.2;
        const acc = -springK * f.signTilt - damping * f.signVel;
        f.signVel += acc * dt;
        f.signTilt += f.signVel * dt;
      }
    });

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life += dt;
      if (p.life >= p.maxLife) {
        particles.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.type !== 'dust') {
        p.vy += 260 * dt;
        p.rot += (p.vRot || 0) * dt;
      } else {
        p.size += 12 * dt;
      }
      p.alpha = 1 - p.life / p.maxLife;
    }

    for (let i = butterflies.length - 1; i >= 0; i--) {
      const bf = butterflies[i];
      bf.life += dt;
      if (bf.life >= bf.maxLife) {
        butterflies.splice(i, 1);
        continue;
      }
      bf.wingPhase += dt * 24;
      bf.x += (bf.vx + Math.sin(bf.life * 6) * 45) * dt;
      bf.y += (bf.vy + Math.cos(bf.life * 5) * 35) * dt;
    }

    sheep.stateTimer += dt;
    sheep.breathPhase += dt * 3.2;
    sheep.tailPhase += dt * (sheep.state === 'idle' ? 4 : 14);
    sheep.squishY += (1 - sheep.squishY) * Math.min(1, dt * 12);
    if (sheep.dizzyStars > 0) sheep.dizzyStars = Math.max(0, sheep.dizzyStars - dt);

    sheep.blinkTimer -= dt;
    if (sheep.blinkTimer <= 0) {
      sheep.isBlinking = true;
      if (sheep.blinkTimer < -0.14) {
        sheep.isBlinking = false;
        sheep.blinkTimer = 2.2 + Math.random() * 3.5;
      }
    }
    if (Math.random() < dt * 0.7) {
      sheep.earFlick = 1.0;
    }
    if (sheep.earFlick > 0) sheep.earFlick = Math.max(0, sheep.earFlick - dt * 6);

    const home = homePos();
    sheep.scale = Math.min(1.28, Math.max(0.86, W / 1200));

    if (sheep.state === 'enter') {
      const dx = home.x - sheep.x;
      const dy = home.y - sheep.y;
      const dist = Math.hypot(dx, dy);
      const speed = Math.max(240, W * 0.28);
      sheep.gaitPhase += dt * 15;
      if (Math.sin(sheep.gaitPhase) > 0.9) {
        sound.playHoof(0.6);
        spawnDust(sheep.x - 30 * sheep.scale, sheep.y + 52 * sheep.scale, 1, 10);
      }

      if (dist < 12) {
        sheep.x = home.x;
        sheep.y = home.y;
        sheep.state = 'idle';
        sheep.stateTimer = 0;
        sheep.squishY = 0.92;
      } else {
        sheep.x += (dx / dist) * speed * dt;
        sheep.y += (dy / dist) * speed * dt;
      }
    } else if (sheep.state === 'idle') {
      sheep.pitch *= 0.85;
      sheep.z = 0;
    } else if (sheep.state === 'runToFence') {
      const f = fences[sheep.targetFenceIdx];
      const takeOffX = f.x - 145 * f.scale;
      const takeOffY = f.y + 8 * f.scale;
      const dx = takeOffX - sheep.x;
      const dy = takeOffY - sheep.y;
      const dist = Math.hypot(dx, dy);
      const speed = Math.max(440, W * 0.42);

      sheep.gaitPhase += dt * 21;
      if (Math.sin(sheep.gaitPhase) > 0.85) {
        sound.playHoof(0.95);
        spawnDust(sheep.x - 25 * sheep.scale, sheep.y + 50 * sheep.scale, 2, 16);
      }

      if (dist < 18) {
        sheep.x = takeOffX;
        sheep.y = takeOffY;
        const chosenKey = currentProblem.optionKeys[sheep.targetFenceIdx];
        const isCorrect = chosenKey === currentProblem.correctKey;

        if (isCorrect) {
          sheep.state = 'crouch';
          sheep.stateTimer = 0;
          sheep.squishY = 0.78;
        } else {
          sheep.failVariant = (sheep.failVariant + 1) % 3;
          sound.playWrongSound(sheep.failVariant);
          sheep.stateTimer = 0;
          if (sheep.failVariant === 0) {
            sheep.state = 'failSkid';
            f.shake = 1.0;
            sheep.dizzyStars = 1.1;
            spawnDust(sheep.x + 40 * sheep.scale, sheep.y + 50 * sheep.scale, 14, 40);
          } else if (sheep.failVariant === 1) {
            sheep.state = 'failBonk';
            f.shake = 0.8;
            f.signTilt = 0.65;
            f.signVel = -2.5;
            f.cloudPuff = 1.2;
            sheep.squishY = 0.82;
          } else {
            sheep.state = 'failMole';
            f.molePop = 1.25;
            sheep.vz = 260;
          }
        }
      } else {
        sheep.x += (dx / dist) * speed * dt;
        sheep.y += (dy / dist) * speed * dt;
      }
    } else if (sheep.state === 'crouch') {
      sheep.squishY = 0.76;
      sheep.pitch = -0.14;
      if (sheep.stateTimer >= 0.14) {
        const f = fences[sheep.targetFenceIdx];
        sheep.state = 'jump';
        sheep.stateTimer = 0;
        sheep.jumpStartX = sheep.x;
        sheep.jumpStartY = sheep.y;
        sheep.jumpEndX = f.x + 155 * f.scale;
        sheep.jumpEndY = f.y + 8 * f.scale;
        sheep.jumpProgress = 0;
        sheep.squishY = 1.14;
        spawnDust(sheep.x - 20 * sheep.scale, sheep.y + 52 * sheep.scale, 10, 28);
        sound.playJumpWhoosh();
        triggerSuccessCelebration(f);
      }
    } else if (sheep.state === 'jump') {
      const jumpDuration = 0.68;
      sheep.jumpProgress += dt / jumpDuration;
      const t = Math.min(1, sheep.jumpProgress);

      sheep.x = sheep.jumpStartX + (sheep.jumpEndX - sheep.jumpStartX) * t;
      sheep.y = sheep.jumpStartY + (sheep.jumpEndY - sheep.jumpStartY) * t;

      const peakHeight = 165 * fences[sheep.targetFenceIdx].scale;
      sheep.z = 4 * peakHeight * t * (1 - t);

      const dzdt = 4 * peakHeight * (1 - 2 * t);
      const dxdt = sheep.jumpEndX - sheep.jumpStartX;
      sheep.pitch = -Math.atan2(dzdt, dxdt) * 0.75;

      if (Math.random() < 0.65) {
        particles.push({
          type: 'sparkle',
          x: sheep.x - 30 * sheep.scale,
          y: sheep.y - sheep.z,
          vx: -30 + (Math.random() - 0.5) * 30,
          vy: (Math.random() - 0.5) * 30,
          rot: Math.random() * 6,
          vRot: 4,
          size: 5 + Math.random() * 5,
          alpha: 1, life: 0, maxLife: 0.45,
          color: '#ffe66d'
        });
      }

      if (t >= 1) {
        sheep.z = 0;
        sheep.pitch = 0.16;
        sheep.squishY = 0.78;
        sheep.state = 'land';
        sheep.stateTimer = 0;
        sound.playHoof(1.2);
        spawnDust(sheep.x + 20 * sheep.scale, sheep.y + 52 * sheep.scale, 12, 35);
      }
    } else if (sheep.state === 'land') {
      sheep.pitch *= 0.82;
      if (sheep.stateTimer >= 0.18) {
        sheep.state = 'exitRight';
        sheep.stateTimer = 0;
      }
    } else if (sheep.state === 'exitRight') {
      const speed = Math.max(460, W * 0.45);
      sheep.x += speed * dt;
      sheep.gaitPhase += dt * 20;
      if (Math.sin(sheep.gaitPhase) > 0.85) {
        sound.playHoof(0.7);
        spawnDust(sheep.x - 25 * sheep.scale, sheep.y + 50 * sheep.scale, 2, 12);
      }
      if (sheep.x > W + 190) {
        spawnNextSheep(false);
      }
    } else if (sheep.state === 'failSkid') {
      sheep.pitch = 0.18 * Math.sin(sheep.stateTimer * 18) * (1 - sheep.stateTimer);
      if (sheep.stateTimer >= 0.85) {
        sheep.state = 'returnHome';
        sheep.stateTimer = 0;
      }
    } else if (sheep.state === 'failBonk') {
      sheep.x -= 45 * (1 - sheep.stateTimer) * dt;
      sheep.pitch = -0.18 * Math.sin(sheep.stateTimer * 14);
      if (sheep.stateTimer >= 0.9) {
        sheep.state = 'returnHome';
        sheep.stateTimer = 0;
      }
    } else if (sheep.state === 'failMole') {
      sheep.z += sheep.vz * dt;
      sheep.vz -= 680 * dt;
      if (sheep.z < 0) {
        sheep.z = 0;
        sheep.vz = 0;
      }
      if (sheep.stateTimer >= 0.9) {
        sheep.z = 0;
        sheep.state = 'returnHome';
        sheep.stateTimer = 0;
      }
    } else if (sheep.state === 'returnHome') {
      const dx = home.x - sheep.x;
      const dy = home.y - sheep.y;
      const dist = Math.hypot(dx, dy);
      const speed = Math.max(380, W * 0.36);
      sheep.gaitPhase -= dt * 18;
      if (dist < 14) {
        sheep.x = home.x;
        sheep.y = home.y;
        sheep.pitch = 0;
        sheep.state = 'idle';
        sheep.stateTimer = 0;
      } else {
        sheep.x += (dx / dist) * speed * dt;
        sheep.y += (dy / dist) * speed * dt;
      }
    }
  }

  // ==========================================
  // 8. BACKGROUND RENDERING
  // ==========================================
  function drawBackground(time) {
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.55);
    skyGrad.addColorStop(0, '#4ea8de');
    skyGrad.addColorStop(0.55, '#90dbf4');
    skyGrad.addColorStop(1, '#fef9ef');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H * 0.56);

    const sunX = W * 0.14;
    const sunY = H * 0.16;
    const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, W * 0.35);
    sunGlow.addColorStop(0, 'rgba(255, 250, 210, 0.95)');
    sunGlow.addColorStop(0.2, 'rgba(255, 230, 150, 0.45)');
    sunGlow.addColorStop(1, 'rgba(255, 230, 150, 0)');
    ctx.fillStyle = sunGlow;
    ctx.fillRect(0, 0, W, H * 0.6);

    ctx.save();
    ctx.translate(sunX, sunY);
    ctx.rotate(time * 0.03);
    ctx.fillStyle = 'rgba(255, 250, 210, 0.07)';
    for (let i = 0; i < 8; i++) {
      ctx.rotate(Math.PI / 4);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(W * 0.7, -45);
      ctx.lineTo(W * 0.7, 45);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    clouds.forEach(c => {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(c.scale, c.scale);
      const cg = ctx.createLinearGradient(0, -35, 0, 25);
      cg.addColorStop(0, '#ffffff');
      cg.addColorStop(1, '#dceefb');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(0, 0, 34, 0, Math.PI * 2);
      ctx.arc(32, -8, 42, 0, Math.PI * 2);
      ctx.arc(70, 2, 30, 0, Math.PI * 2);
      ctx.arc(-30, 6, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    ctx.strokeStyle = '#3b5978';
    ctx.lineWidth = 2;
    birds.forEach(b => {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.scale(b.scale, b.scale);
      const wingY = Math.sin(b.wingPhase) * 6;
      ctx.beginPath();
      ctx.moveTo(-10, wingY);
      ctx.quadraticCurveTo(-4, -5, 0, 0);
      ctx.quadraticCurveTo(4, -5, 10, wingY);
      ctx.stroke();
      ctx.restore();
    });

    const mtGrad1 = ctx.createLinearGradient(0, H * 0.22, 0, H * 0.52);
    mtGrad1.addColorStop(0, '#6c8ead');
    mtGrad1.addColorStop(1, '#a3c1ad');
    ctx.fillStyle = mtGrad1;
    ctx.beginPath();
    ctx.moveTo(0, H * 0.5);
    ctx.lineTo(0, H * 0.34);
    ctx.lineTo(W * 0.15, H * 0.23);
    ctx.lineTo(W * 0.31, H * 0.36);
    ctx.lineTo(W * 0.52, H * 0.21);
    ctx.lineTo(W * 0.72, H * 0.35);
    ctx.lineTo(W * 0.88, H * 0.25);
    ctx.lineTo(W, H * 0.33);
    ctx.lineTo(W, H * 0.52);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 252, 245, 0.35)';
    ctx.beginPath();
    ctx.moveTo(W * 0.15, H * 0.23);
    ctx.lineTo(W * 0.19, H * 0.26);
    ctx.lineTo(W * 0.14, H * 0.29);
    ctx.closePath();
    ctx.moveTo(W * 0.52, H * 0.21);
    ctx.lineTo(W * 0.57, H * 0.25);
    ctx.lineTo(W * 0.50, H * 0.28);
    ctx.closePath();
    ctx.fill();

    const hillGrad1 = ctx.createLinearGradient(0, H * 0.38, 0, H * 0.58);
    hillGrad1.addColorStop(0, '#7cb554');
    hillGrad1.addColorStop(1, '#4f8732');
    ctx.fillStyle = hillGrad1;
    ctx.beginPath();
    ctx.moveTo(0, H * 0.55);
    ctx.quadraticCurveTo(W * 0.25, H * 0.36, W * 0.58, H * 0.47);
    ctx.quadraticCurveTo(W * 0.82, H * 0.54, W, H * 0.42);
    ctx.lineTo(W, H * 0.6);
    ctx.lineTo(0, H * 0.6);
    ctx.closePath();
    ctx.fill();

    const treePositions = [0.06, 0.08, 0.11, 0.39, 0.42, 0.85, 0.88, 0.91];
    treePositions.forEach((tp, idx) => {
      const tx = W * tp;
      const ty = H * (0.43 + Math.sin(tp * 8) * 0.03);
      const th = 26 + (idx % 3) * 8;
      ctx.fillStyle = idx % 2 === 0 ? '#2f5e27' : '#3a6e30';
      ctx.beginPath();
      ctx.moveTo(tx, ty - th);
      ctx.lineTo(tx - th * 0.38, ty);
      ctx.lineTo(tx + th * 0.38, ty);
      ctx.closePath();
      ctx.fill();
    });

    drawWindmill(W * 0.82, H * 0.44, Math.min(1, W / 1300) * 0.85);

    bgSheepList.forEach(bgs => {
      ctx.save();
      ctx.translate(bgs.x, bgs.y + bgs.bounceY);
      ctx.scale(bgs.dir * 0.35, 0.35);
      ctx.strokeStyle = '#2f2926';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-10, 5); ctx.lineTo(-10, 22);
      ctx.moveTo(10, 5); ctx.lineTo(10, 22);
      ctx.stroke();
      ctx.fillStyle = '#f7f3e3';
      ctx.beginPath();
      ctx.arc(-10, 0, 14, 0, Math.PI * 2);
      ctx.arc(4, -3, 16, 0, Math.PI * 2);
      ctx.arc(16, 1, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#38302c';
      ctx.beginPath();
      ctx.ellipse(24, -4 + Math.sin(bgs.phase) * 3, 9, 7, 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    const meadowGrad = ctx.createLinearGradient(0, H * 0.48, 0, H);
    meadowGrad.addColorStop(0, '#8cd156');
    meadowGrad.addColorStop(0.35, '#68b038');
    meadowGrad.addColorStop(1, '#3b731e');
    ctx.fillStyle = meadowGrad;
    ctx.beginPath();
    ctx.moveTo(0, H * 0.52);
    ctx.quadraticCurveTo(W * 0.35, H * 0.46, W * 0.68, H * 0.50);
    ctx.quadraticCurveTo(W * 0.88, H * 0.52, W, H * 0.49);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();

    const home = homePos();
    ctx.save();
    fences.forEach(f => {
      const pathGrad = ctx.createLinearGradient(home.x, home.y, f.x + 220, f.y);
      pathGrad.addColorStop(0, 'rgba(186, 152, 102, 0.38)');
      pathGrad.addColorStop(0.5, 'rgba(176, 140, 88, 0.48)');
      pathGrad.addColorStop(1, 'rgba(162, 125, 74, 0.15)');
      ctx.strokeStyle = pathGrad;
      ctx.lineWidth = 42 * f.scale;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(home.x - 90, home.y + 48 * sheep.scale);
      ctx.quadraticCurveTo(
        (home.x + f.x) * 0.5,
        (home.y + f.y) * 0.5 + 32,
        f.x + 190 * f.scale,
        f.y + 42 * f.scale
      );
      ctx.stroke();
    });
    ctx.restore();

    if (rainbowAlpha > 0) {
      const rf = fences[rainbowFenceIdx];
      ctx.save();
      ctx.globalAlpha = rainbowAlpha * 0.65;
      const colors = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93'];
      colors.forEach((col, i) => {
        ctx.strokeStyle = col;
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(rf.x, rf.y + 20, (165 - i * 8) * rf.scale, Math.PI, 0);
        ctx.stroke();
      });
      ctx.restore();
    }

    grassTufts.forEach(g => {
      const sway = Math.sin(time * 2.2 + g.phase) * 5;
      ctx.strokeStyle = '#346919';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(g.x, g.y);
      ctx.quadraticCurveTo(g.x - 4 + sway * 0.5, g.y - g.h * 0.6, g.x - 7 + sway, g.y - g.h);
      ctx.moveTo(g.x, g.y);
      ctx.quadraticCurveTo(g.x + 4 + sway * 0.5, g.y - g.h * 0.6, g.x + 8 + sway, g.y - g.h * 0.85);
      ctx.stroke();

      if (g.hasFlower) {
        ctx.fillStyle = g.flowerColor;
        ctx.beginPath();
        ctx.arc(g.x - 7 + sway, g.y - g.h, 3.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff3b0';
        ctx.beginPath();
        ctx.arc(g.x - 7 + sway, g.y - g.h, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  function drawWindmill(x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    ctx.fillStyle = '#7f674c';
    ctx.beginPath();
    ctx.moveTo(-22, 0);
    ctx.lineTo(-14, -68);
    ctx.lineTo(14, -68);
    ctx.lineTo(22, 0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#4a2f18';
    ctx.beginPath();
    ctx.moveTo(-18, -66);
    ctx.lineTo(0, -86);
    ctx.lineTo(18, -66);
    ctx.closePath();
    ctx.fill();

    ctx.translate(0, -56);
    ctx.rotate(windmillAngle);
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.fillStyle = '#3d2410';
      ctx.fillRect(-2, 0, 4, 54);
      ctx.fillStyle = '#f5ebd6';
      ctx.strokeStyle = '#6e4720';
      ctx.lineWidth = 1.5;
      ctx.fillRect(2, 10, 14, 40);
      ctx.strokeRect(2, 10, 14, 40);
    }
    ctx.fillStyle = '#d49b35';
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // ==========================================
  // 9. FENCES RENDERING
  // ==========================================
  function drawFenceBack(f) {
    ctx.save();
    const shakeX = f.shake > 0 ? Math.sin(performance.now() * 0.06) * 8 * f.shake : 0;
    ctx.translate(f.x + shakeX, f.y);
    ctx.scale(f.scale, f.scale);

    ctx.fillStyle = 'rgba(20, 45, 10, 0.28)';
    ctx.beginPath();
    ctx.ellipse(0, 42, 115, 16, 0, 0, Math.PI * 2);
    ctx.fill();

    const postGrad = ctx.createLinearGradient(-12, -85, 12, -85);
    postGrad.addColorStop(0, '#6e4726');
    postGrad.addColorStop(0.5, '#8c5d34');
    postGrad.addColorStop(1, '#472c14');
    ctx.fillStyle = postGrad;
    ctx.strokeStyle = '#2e1a0a';
    ctx.lineWidth = 2.5;

    roundRectPath(-86, -85, 22, 118, 5);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#a67446';
    ctx.beginPath();
    ctx.ellipse(-75, -83, 11, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawFenceFront(f, time) {
    ctx.save();
    const shakeX = f.shake > 0 ? Math.sin(performance.now() * 0.06) * 8 * f.shake : 0;
    const hoverLift = f.hover * -5;
    ctx.translate(f.x + shakeX, f.y + hoverLift);
    ctx.scale(f.scale, f.scale);

    if (f.hover > 0.02) {
      ctx.save();
      ctx.shadowColor = '#ffe57f';
      ctx.shadowBlur = 28 * f.hover;
      ctx.strokeStyle = `rgba(255, 235, 130, ${0.55 * f.hover})`;
      ctx.lineWidth = 5;
      roundRectPath(-145, -96, 290, 100, 20);
      ctx.stroke();
      ctx.restore();
    }

    const railGrad = ctx.createLinearGradient(0, -70, 0, 20);
    railGrad.addColorStop(0, '#9c6b3b');
    railGrad.addColorStop(0.5, '#7a4f28');
    railGrad.addColorStop(1, '#543418');
    ctx.fillStyle = railGrad;
    ctx.strokeStyle = '#331d0a';
    ctx.lineWidth = 2.5;

    ctx.beginPath();
    ctx.moveTo(-84, -64);
    ctx.lineTo(84, -48);
    ctx.lineTo(84, -30);
    ctx.lineTo(-84, -46);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-84, -22);
    ctx.lineTo(84, -6);
    ctx.lineTo(84, 12);
    ctx.lineTo(-84, -4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    const postGrad = ctx.createLinearGradient(64, -70, 90, -70);
    postGrad.addColorStop(0, '#7c512b');
    postGrad.addColorStop(0.45, '#9e6b3e');
    postGrad.addColorStop(1, '#4a2d14');
    ctx.fillStyle = postGrad;
    roundRectPath(64, -72, 24, 118, 6);
    ctx.fill();
    ctx.stroke();

    ctx.save();
    ctx.translate(-92, -58);
    ctx.rotate(f.signTilt);
    ctx.translate(92, 58);

    const signW = 270;
    const signH = 84;
    const signX = -signW / 2;
    const signY = -88;

    const frameGrad = ctx.createLinearGradient(0, signY, 0, signY + signH);
    frameGrad.addColorStop(0, '#5e3a1c');
    frameGrad.addColorStop(0.5, '#3d230e');
    frameGrad.addColorStop(1, '#261406');
    ctx.fillStyle = frameGrad;
    roundRectPath(signX, signY, signW, signH, 18);
    ctx.fill();

    const innerGrad = ctx.createLinearGradient(0, signY + 6, 0, signY + signH - 6);
    if (f.hover > 0.1) {
      innerGrad.addColorStop(0, '#f3c65f');
      innerGrad.addColorStop(0.5, '#d99b26');
      innerGrad.addColorStop(1, '#a86e11');
    } else {
      innerGrad.addColorStop(0, '#d9a15b');
      innerGrad.addColorStop(0.5, '#b87b38');
      innerGrad.addColorStop(1, '#8c561e');
    }
    ctx.fillStyle = innerGrad;
    roundRectPath(signX + 6, signY + 6, signW - 12, signH - 12, 13);
    ctx.fill();

    ctx.strokeStyle = 'rgba(65, 32, 8, 0.22)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(signX + 22, signY + 24);
    ctx.bezierCurveTo(-30, signY + 20, 30, signY + 28, signX + signW - 22, signY + 23);
    ctx.moveTo(signX + 22, signY + signH - 22);
    ctx.bezierCurveTo(-20, signY + signH - 18, 40, signY + signH - 26, signX + signW - 22, signY + signH - 21);
    ctx.stroke();

    const rivets = [
      [signX + 18, signY + 18],
      [signX + signW - 18, signY + 18],
      [signX + 18, signY + signH - 18],
      [signX + signW - 18, signY + signH - 18]
    ];
    rivets.forEach(([rx, ry]) => {
      ctx.fillStyle = '#ffe082';
      ctx.beginPath();
      ctx.arc(rx, ry, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#5c3808';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    });

    const key = currentProblem.optionKeys[f.idx];
    const label = DICT[currentLang][key] || '';
    ctx.font = '900 34px Rubik, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#2b1504';
    ctx.fillText(label, 0, signY + signH / 2 + 3);
    ctx.fillStyle = f.hover > 0.2 ? '#fffbe6' : '#fff2cc';
    ctx.fillText(label, 0, signY + signH / 2);

    ctx.restore();

    ctx.fillStyle = '#316317';
    [-78, 74].forEach(px => {
      ctx.beginPath();
      ctx.moveTo(px - 18, 44);
      ctx.quadraticCurveTo(px - 10, 22, px - 14, 14);
      ctx.quadraticCurveTo(px - 4, 28, px, 44);
      ctx.quadraticCurveTo(px + 6, 20, px + 14, 16);
      ctx.quadraticCurveTo(px + 10, 32, px + 16, 44);
      ctx.closePath();
      ctx.fill();
    });

    if (f.molePop > 0) {
      const mY = 38 - Math.sin(Math.min(1, f.molePop) * Math.PI) * 36;
      ctx.save();
      ctx.translate(-125, mY);
      ctx.fillStyle = '#6b4728';
      ctx.beginPath();
      ctx.ellipse(0, 14, 24, 9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#4a3525';
      ctx.beginPath();
      ctx.roundRect(-14, -18, 28, 30, [14, 14, 4, 4]);
      ctx.fill();
      ctx.fillStyle = '#ff8fab';
      ctx.beginPath();
      ctx.ellipse(0, -6, 6, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(-6, -12, 2.2, 0, Math.PI * 2);
      ctx.arc(6, -12, 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    if (f.cloudPuff > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, f.cloudPuff);
      ctx.translate(0, -140);
      ctx.fillStyle = '#6c7a89';
      ctx.beginPath();
      ctx.arc(-18, 0, 16, 0, Math.PI * 2);
      ctx.arc(0, -6, 20, 0, Math.PI * 2);
      ctx.arc(18, 0, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.moveTo(0, 8);
      ctx.lineTo(-8, 22);
      ctx.lineTo(0, 22);
      ctx.lineTo(-4, 34);
      ctx.lineTo(10, 18);
      ctx.lineTo(2, 18);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }

  // ==========================================
  // 10. SHEEP RENDERING
  // ==========================================
  function drawArticulatedLeg(hipX, hipY, phaseOffset, isBackLeg, time) {
    let thighAngle = 0;
    let calfAngle = 0;

    if (sheep.state === 'idle') {
      thighAngle = Math.sin(sheep.breathPhase * 0.5 + phaseOffset) * 0.03;
      calfAngle = 0.05;
    } else if (sheep.state === 'crouch') {
      thighAngle = 0.48;
      calfAngle = -0.85;
    } else if (sheep.state === 'jump') {
      const t = sheep.jumpProgress;
      if (!isBackLeg) {
        if (t < 0.55) {
          thighAngle = -0.75;
          calfAngle = 1.45;
        } else {
          thighAngle = -0.55;
          calfAngle = 0.15;
        }
      } else {
        if (t < 0.4) {
          thighAngle = 0.85;
          calfAngle = 0.15;
        } else {
          thighAngle = 0.45;
          calfAngle = 0.95;
        }
      }
    } else if (sheep.state === 'failSkid') {
      thighAngle = -0.58;
      calfAngle = -0.15;
    } else {
      const s = Math.sin(sheep.gaitPhase + phaseOffset);
      const c = Math.cos(sheep.gaitPhase + phaseOffset);
      thighAngle = s * 0.52;
      calfAngle = Math.max(0, c) * 0.72;
    }

    const upperLen = 24;
    const lowerLen = 24;
    const kneeX = hipX + Math.sin(thighAngle) * upperLen;
    const kneeY = hipY + Math.cos(thighAngle) * upperLen;
    const totalCalfAngle = thighAngle - calfAngle;
    const ankleX = kneeX + Math.sin(totalCalfAngle) * lowerLen;
    const ankleY = kneeY + Math.cos(totalCalfAngle) * lowerLen;

    ctx.save();
    ctx.strokeStyle = isBackLeg ? '#cfc5b0' : '#e6dec8';
    ctx.lineWidth = 13;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo((hipX + kneeX) * 0.5, (hipY + kneeY) * 0.5);
    ctx.stroke();

    ctx.strokeStyle = isBackLeg ? '#29221e' : '#3d332e';
    ctx.lineWidth = 8.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(kneeX, kneeY);
    ctx.lineTo(ankleX, ankleY);
    ctx.stroke();

    ctx.fillStyle = isBackLeg ? '#382f2a' : '#4f433d';
    ctx.beginPath();
    ctx.arc(kneeX, kneeY, 4.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.translate(ankleX, ankleY);
    ctx.rotate(-totalCalfAngle * 0.5);
    ctx.fillStyle = '#1c1613';
    ctx.beginPath();
    ctx.moveTo(-5, -2);
    ctx.lineTo(8, -2);
    ctx.lineTo(11, 7);
    ctx.lineTo(2, 7);
    ctx.lineTo(0, 3);
    ctx.lineTo(-2, 7);
    ctx.lineTo(-7, 7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawSheep(time) {
    ctx.save();
    ctx.translate(sheep.x, sheep.y);
    ctx.scale(sheep.scale, sheep.scale);

    const shadowScale = Math.max(0.35, 1 - sheep.z / 260);
    ctx.fillStyle = `rgba(22, 48, 12, ${0.32 * shadowScale})`;
    ctx.beginPath();
    ctx.ellipse(0, 54, 78 * shadowScale, 16 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();

    const breathOffset = sheep.state === 'idle' ? Math.sin(sheep.breathPhase) * 2.5 : 0;
    ctx.translate(0, -sheep.z + breathOffset);
    ctx.rotate(sheep.pitch);
    ctx.scale(2 - sheep.squishY, sheep.squishY);

    drawArticulatedLeg(-44, 12, Math.PI * 0.8, true, time);
    drawArticulatedLeg(40, 12, 0.3, true, time);

    ctx.save();
    ctx.translate(-74, -12);
    ctx.rotate(Math.sin(sheep.tailPhase) * 0.25);
    ctx.fillStyle = '#dfd7c2';
    ctx.beginPath();
    ctx.arc(-8, 4, 12, 0, Math.PI * 2);
    ctx.arc(-16, 12, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const woolGrad = ctx.createRadialGradient(0, -28, 15, 0, -8, 88);
    woolGrad.addColorStop(0, '#fffdf5');
    woolGrad.addColorStop(0.65, '#f2ead5');
    woolGrad.addColorStop(1, '#cfc3a8');
    ctx.fillStyle = woolGrad;
    ctx.beginPath();
    ctx.ellipse(0, -14, 78, 50, 0, 0, Math.PI * 2);
    ctx.fill();

    const puffs = [
      [-64, -14, 24], [-54, -36, 26], [-30, -48, 28], [0, -52, 30],
      [30, -48, 28], [54, -34, 26], [64, -10, 25], [52, 14, 24],
      [25, 22, 26], [-5, 24, 27], [-36, 20, 25], [-58, 8, 23]
    ];
    ctx.fillStyle = '#cbbd9f';
    puffs.forEach(([px, py, pr]) => {
      ctx.beginPath();
      ctx.arc(px, py + 4, pr, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.fillStyle = woolGrad;
    puffs.forEach(([px, py, pr]) => {
      ctx.beginPath();
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.fill();
    });

    drawArticulatedLeg(-32, 16, 0, false, time);
    drawArticulatedLeg(50, 16, Math.PI * 1.1, false, time);

    // Дзвіночок
    ctx.save();
    ctx.strokeStyle = '#703818';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(52, -22, 28, -0.4, 1.2);
    ctx.stroke();
    ctx.translate(68, 4);
    ctx.rotate(Math.sin(sheep.gaitPhase) * 0.25);
    const bellGrad = ctx.createLinearGradient(-8, 0, 8, 14);
    bellGrad.addColorStop(0, '#ffe57f');
    bellGrad.addColorStop(1, '#b57c1e');
    ctx.fillStyle = bellGrad;
    ctx.beginPath();
    ctx.moveTo(-6, 0);
    ctx.lineTo(6, 0);
    ctx.lineTo(10, 13);
    ctx.lineTo(-10, 13);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#5c3a08';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    // ГОЛОВА
    ctx.save();
    ctx.translate(72, -32);
    const headBob = sheep.state === 'idle' ? Math.sin(sheep.breathPhase * 1.2) * 0.04 : Math.sin(sheep.gaitPhase) * 0.08;
    ctx.rotate(headBob);

    ctx.save();
    ctx.translate(-8, -14);
    ctx.rotate(-0.4 - sheep.earFlick * 0.35);
    ctx.fillStyle = '#2b2320';
    ctx.beginPath();
    ctx.ellipse(-12, 0, 14, 6.5, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const headGrad = ctx.createLinearGradient(-15, -22, 28, 22);
    headGrad.addColorStop(0, '#4f433e');
    headGrad.addColorStop(0.6, '#362d29');
    headGrad.addColorStop(1, '#211b18');
    ctx.fillStyle = headGrad;
    ctx.beginPath();
    ctx.moveTo(-16, -12);
    ctx.quadraticCurveTo(8, -22, 24, -4);
    ctx.quadraticCurveTo(36, 8, 26, 18);
    ctx.quadraticCurveTo(10, 24, -8, 14);
    ctx.quadraticCurveTo(-22, 6, -16, -12);
    ctx.closePath();
    ctx.fill();

    if (sheep.state === 'idle') {
      const chew = Math.sin(time * 5) * 0.15;
      ctx.save();
      ctx.translate(24, 15);
      ctx.rotate(chew);
      ctx.strokeStyle = '#8ac926';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(14, 4, 24, -2);
      ctx.stroke();
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(25, -2, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.strokeStyle = '#171210';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(24, 8, 3, 0.2, Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(14, 15);
    ctx.quadraticCurveTo(21, 18, 26, 14);
    ctx.stroke();

    const eyeX = 8;
    const eyeY = -5;
    if (sheep.isBlinking) {
      ctx.strokeStyle = '#171210';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(eyeX - 6, eyeY);
      ctx.quadraticCurveTo(eyeX, eyeY + 3, eyeX + 6, eyeY);
      ctx.stroke();
    } else {
      const eyeRadius = sheep.state === 'failMole' ? 8.5 : 6.5;
      ctx.fillStyle = '#fffdf7';
      ctx.beginPath();
      ctx.arc(eyeX, eyeY, eyeRadius, 0, Math.PI * 2);
      ctx.fill();

      const angleToMouse = Math.atan2(mouseY - (sheep.y - 32), mouseX - (sheep.x + 72));
      const px = eyeX + Math.cos(angleToMouse) * 2.2;
      const py = eyeY + Math.sin(angleToMouse) * 2.2;

      ctx.fillStyle = '#d48b28';
      ctx.beginPath();
      ctx.arc(px, py, 4.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#14100e';
      ctx.beginPath();
      ctx.ellipse(px, py, 3.2, 2.2, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(px - 1.5, py - 1.5, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }

    if (sheep.hasHorns) {
      ctx.strokeStyle = '#c49e6c';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(-6, -8, 12, -Math.PI * 0.6, Math.PI * 0.75);
      ctx.stroke();
    }

    ctx.fillStyle = '#f7f1de';
    ctx.beginPath();
    ctx.arc(-8, -18, 11, 0, Math.PI * 2);
    ctx.arc(2, -19, 9, 0, Math.PI * 2);
    ctx.arc(-16, -14, 9, 0, Math.PI * 2);
    ctx.fill();

    if (sheep.hasCrown) {
      const crownColors = ['#ff598f', '#ffd166', '#4ea8de', '#ff8c42'];
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = crownColors[i];
        ctx.beginPath();
        ctx.arc(-14 + i * 7, -23 + Math.abs(1.5 - i) * 2, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-14 + i * 7, -23 + Math.abs(1.5 - i) * 2, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.save();
    ctx.translate(-12, -8);
    ctx.rotate(-0.2 + sheep.earFlick * 0.45);
    ctx.fillStyle = '#382e2a';
    ctx.beginPath();
    ctx.ellipse(-14, 2, 15, 7, -0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6e4f49';
    ctx.beginPath();
    ctx.ellipse(-13, 2, 9, 3.5, -0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (sheep.dizzyStars > 0) {
      for (let i = 0; i < 3; i++) {
        const a = time * 6 + (i * Math.PI * 2) / 3;
        const sx = Math.cos(a) * 24;
        const sy = -36 + Math.sin(a) * 8;
        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        ctx.arc(sx, sy, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.restore(); // End head

    ctx.restore(); // End sheep transform

    // Приклад — ОКРЕМО, НАД овечкою, не обертається з нею
    drawEquationPlaqueAbove(time);
  }

  // ==========================================
  // 11. ПРИКЛАД — НАД ОВЕЧКОЮ
  // ==========================================
  function drawEquationPlaqueAbove(time) {
    if (sheep.state !== 'idle' && sheep.state !== 'enter' && sheep.state !== 'returnHome') {
      return;
    }

    ctx.save();
    ctx.translate(sheep.x, sheep.y - sheep.z);
    ctx.scale(sheep.scale, sheep.scale);

    const bob = Math.sin(time * 2.5) * 3;
    ctx.translate(0, -145 + bob);

    const pw = 200;
    const ph = 70;
    const px = -pw / 2;
    const py = -ph / 2;

    // М'яка тінь під табличкою
    ctx.save();
    ctx.fillStyle = 'rgba(20, 40, 10, 0.14)';
    ctx.beginPath();
    ctx.ellipse(0, ph / 2 + 14, pw * 0.42, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Темна дерев'яна рамка
    const bezelGrad = ctx.createLinearGradient(0, py, 0, py + ph);
    bezelGrad.addColorStop(0, '#6b3e19');
    bezelGrad.addColorStop(0.5, '#47280e');
    bezelGrad.addColorStop(1, '#2b1606');
    ctx.fillStyle = bezelGrad;
    roundRectPath(px, py, pw, ph, 16);
    ctx.fill();

    // Тепла медово-пергаментна поверхня
    const faceGrad = ctx.createLinearGradient(0, py + 5, 0, py + ph - 5);
    faceGrad.addColorStop(0, '#f5d799');
    faceGrad.addColorStop(0.5, '#e8be6b');
    faceGrad.addColorStop(1, '#cfa048');
    ctx.fillStyle = faceGrad;
    ctx.strokeStyle = '#b07b25';
    ctx.lineWidth = 2;
    roundRectPath(px + 5, py + 5, pw - 10, ph - 10, 12);
    ctx.fill();
    ctx.stroke();

    // Затінення під рамкою для об'єму
    ctx.fillStyle = 'rgba(60, 30, 5, 0.18)';
    roundRectPath(px + 8, py + 8, pw - 16, 6, 3);
    ctx.fill();

    const parts = [
      String(currentProblem.a),
      currentProblem.op,
      String(currentProblem.b),
      '=',
      String(currentProblem.c)
    ];

    ctx.font = '900 28px Rubik, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const xs = [-68, -34, 0, 34, 68];
    const targetPartIndex = currentProblem.targetIdx * 2;

    parts.forEach((text, i) => {
      const x = xs[i];
      const isTarget = i === targetPartIndex;

      if (isTarget) {
        const pulse = 1 + Math.sin(time * 6) * 0.08;
        ctx.save();
        ctx.translate(x, 0);
        ctx.scale(pulse, pulse);

        const badgeGrad = ctx.createRadialGradient(0, -4, 2, 0, 0, 24);
        badgeGrad.addColorStop(0, '#fff3b0');
        badgeGrad.addColorStop(0.65, '#ff9f1c');
        badgeGrad.addColorStop(1, '#c95b0c');
        ctx.fillStyle = badgeGrad;
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#5c2402';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        const arrowBounce = -35 - Math.abs(Math.sin(time * 5.5)) * 8;
        ctx.fillStyle = '#e63946';
        ctx.strokeStyle = '#fff3b0';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, arrowBounce + 12);
        ctx.lineTo(-11, arrowBounce);
        ctx.lineTo(11, arrowBounce);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();

        ctx.fillStyle = '#2b1000';
        ctx.fillText(text, x, 1);
      } else {
        ctx.fillStyle = 'rgba(255, 245, 210, 0.6)';
        ctx.fillText(text, x, 1.5);
        ctx.fillStyle = '#381d06';
        ctx.fillText(text, x, 0);
      }
    });

    ctx.restore();
  }

  // ==========================================
  // 12. FOREGROUND EFFECTS
  // ==========================================
  function drawForegroundEffects() {
    dandelionSeeds.forEach(d => {
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.strokeStyle = 'rgba(255, 252, 235, 0.65)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-d.size, -d.size * 1.6);
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -d.size * 1.9);
      ctx.moveTo(0, 0);
      ctx.lineTo(d.size, -d.size * 1.6);
      ctx.stroke();
      ctx.fillStyle = '#e0c088';
      ctx.beginPath();
      ctx.arc(0, 1, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.translate(p.x, p.y);
      if (p.type === 'dust') {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(0, 0, p.size, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'flower') {
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        for (let i = 0; i < 5; i++) {
          ctx.rotate((Math.PI * 2) / 5);
          ctx.beginPath();
          ctx.ellipse(0, -p.size * 0.55, p.size * 0.35, p.size * 0.55, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#fff3b0';
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.28, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          ctx.rotate(Math.PI / 2);
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(p.size * 0.2, p.size * 0.2, p.size, 0);
          ctx.quadraticCurveTo(p.size * 0.2, -p.size * 0.2, 0, 0);
        }
        ctx.fill();
      }
      ctx.restore();
    });

    butterflies.forEach(bf => {
      ctx.save();
      ctx.globalAlpha = Math.min(1, (bf.maxLife - bf.life) * 1.5);
      ctx.translate(bf.x, bf.y);
      const wingFlap = Math.cos(bf.wingPhase);
      ctx.scale(1, 0.3 + Math.abs(wingFlap) * 0.7);
      ctx.fillStyle = bf.color;
      ctx.beginPath();
      ctx.ellipse(-6, -4, 8, 5, -0.4, 0, Math.PI * 2);
      ctx.ellipse(6, -4, 8, 5, 0.4, 0, Math.PI * 2);
      ctx.ellipse(-5, 4, 6, 4, 0.4, 0, Math.PI * 2);
      ctx.ellipse(5, 4, 6, 4, -0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#2b1d14';
      ctx.fillRect(-1.5, -6, 3, 12);
      ctx.restore();
    });
  }

  // ==========================================
  // 13. RENDER LOOP
  // ==========================================
  let lastTime = performance.now();

  function gameLoop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    const time = now / 1000;

    update(dt);
    drawBackground(time);

    const renderItems = [];
    fences.forEach(f => {
      renderItems.push({ y: f.y - 2, draw: () => drawFenceBack(f) });
      renderItems.push({ y: f.y + 10, draw: () => drawFenceFront(f, time) });
    });
    renderItems.sort((a, b) => a.y - b.y);
    renderItems.forEach(item => item.draw());

    drawSheep(time);

    drawForegroundEffects();
    requestAnimationFrame(gameLoop);
  }

  // ==========================================
  // 14. INTERACTION
  // ==========================================
  function getFenceAtPoint(px, py) {
    for (let i = fences.length - 1; i >= 0; i--) {
      const f = fences[i];
      const dx = (px - f.x) / f.scale;
      const dy = (py - f.y) / f.scale;
      if (dx >= -140 && dx <= 140 && dy >= -100 && dy <= 55) {
        return i;
      }
    }
    return -1;
  }

  function handlePointerMove(clientX, clientY) {
    mouseX = clientX;
    mouseY = clientY;
    const hit = getFenceAtPoint(clientX, clientY);
    if (hit !== hoveredFenceIdx) {
      hoveredFenceIdx = hit;
      if (hit !== -1) {
        sound.playWoodTick(1 + hit * 0.12);
      }
    }
  }

  function handlePointerDown(clientX, clientY) {
    sound.init();
    mouseX = clientX;
    mouseY = clientY;

    if (sheep.state !== 'idle' && sheep.state !== 'enter' && sheep.state !== 'returnHome') {
      return;
    }

    const hit = getFenceAtPoint(clientX, clientY);
    if (hit !== -1) {
      sound.playWoodTick(1.25);
      sheep.targetFenceIdx = hit;
      sheep.state = 'runToFence';
      sheep.stateTimer = 0;
    } else {
      const dx = clientX - sheep.x;
      const dy = clientY - sheep.y;
      if (Math.hypot(dx, dy) < 95 * sheep.scale) {
        sheep.earFlick = 1.0;
        sheep.squishY = 0.88;
        sound.playSheepBaa(true);
      }
    }
  }

  canvas.addEventListener('mousemove', e => handlePointerMove(e.clientX, e.clientY));
  canvas.addEventListener('mousedown', e => handlePointerDown(e.clientX, e.clientY));
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length > 0) {
      handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  const modeButtons = [
    document.getElementById('mode0'),
    document.getElementById('mode1'),
    document.getElementById('mode2')
  ];

  modeButtons.forEach((btn, idx) => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      sound.playWoodTick(1.1);
      currentMode = idx;
      modeButtons.forEach((b, i) => b.classList.toggle('active-mode', i === idx));
      spawnNextSheep(false);
    });
  });

  const langBtn = document.getElementById('langBtn');
  langBtn.addEventListener('click', e => {
    e.stopPropagation();
    sound.playWoodTick(1.3);
    currentLang = currentLang === 'uk' ? 'ru' : 'uk';
    langBtn.textContent = currentLang === 'uk' ? 'УКР' : 'РУС';
  });

  const skipBtn = document.getElementById('skipBtn');
  skipBtn.addEventListener('click', e => {
    e.stopPropagation();
    sound.playJumpWhoosh();
    spawnNextSheep(false);
  });

  window.addEventListener('resize', () => {
    updateLayoutPositions();
    initEnvironment();
  });

  updateLayoutPositions();
  initEnvironment();
  spawnNextSheep(false);
  requestAnimationFrame(gameLoop);
})();
</script>
