<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Доісторичне Округлення Чисел</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, -apple-system, sans-serif;
    background: #1b0f18;
    color: #fff5dc;
  }

  /* ================= MAIN WIDESCREEN LAYOUT ================= */
  #game-root {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
  }

  .bg-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    z-index: 1;
  }

  #fx-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 20;
  }

  /* ================= TOP NAVIGATION BAR ================= */
  .top-bar {
    position: relative;
    z-index: 30;
    width: 100%;
    padding: clamp(10px, 1.8vh, 22px) clamp(16px, 2.5vw, 42px) 0;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .modes-group {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    gap: clamp(8px, 1vw, 16px);
  }

  .controls-group {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: clamp(10px, 1.2vw, 18px);
  }

  /* Stone UI Buttons */
  .stone-btn {
    position: relative;
    background: linear-gradient(180deg, #68574a 0%, #483a30 62%, #2f251e 100%);
    border: 3px solid #211711;
    box-shadow: 
      inset 0 3px 0 rgba(255, 232, 202, 0.3),
      inset 0 -4px 0 rgba(0, 0, 0, 0.55),
      0 6px 0 #18100b,
      0 10px 18px rgba(0, 0, 0, 0.6);
    color: #f6e3ba;
    text-shadow: 0 2px 0 #1a110b, 0 3px 6px rgba(0, 0, 0, 0.85);
    border-radius: 18px 24px 16px 22px;
    padding: clamp(8px, 1.1vh, 14px) clamp(14px, 1.6vw, 26px);
    font-size: clamp(15px, 1.45vw, 23px);
    font-weight: 900;
    letter-spacing: 0.02em;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.14s ease, box-shadow 0.14s ease;
    outline: none;
  }

  .stone-btn:hover {
    transform: translateY(-3px) scale(1.04);
    filter: brightness(1.1);
  }

  .stone-btn:active {
    transform: translateY(3px) scale(0.98);
    box-shadow: 
      inset 0 2px 0 rgba(255, 228, 196, 0.2),
      0 2px 0 #18100b,
      0 4px 8px rgba(0, 0, 0, 0.5);
  }

  .stone-btn.active-mode {
    background: linear-gradient(180deg, #e07f26 0%, #ad4b11 65%, #782d07 100%);
    border-color: #ffbe55;
    color: #fff9eb;
    box-shadow: 
      inset 0 3px 0 rgba(255, 240, 190, 0.6),
      inset 0 -4px 0 rgba(70, 20, 0, 0.65),
      0 6px 0 #471903,
      0 0 22px rgba(255, 145, 0, 0.6);
  }

  .next-arrow-svg {
    width: clamp(24px, 2.2vw, 34px);
    height: clamp(24px, 2.2vw, 34px);
    transition: transform 0.2s ease;
  }

  .stone-btn:hover .next-arrow-svg {
    transform: translateX(4px);
  }

  /* ================= CENTER STAGE ================= */
  .stage-main {
    position: relative;
    z-index: 10;
    flex: 1;
    width: 100%;
    max-width: 1780px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 clamp(12px, 2vw, 32px);
  }

  /* Task Instruction Stone Banner */
  .task-banner {
    background: linear-gradient(180deg, #574639 0%, #3b2e25 55%, #261d17 100%);
    border: 4px solid #1c140f;
    border-radius: 30px 38px 26px 34px;
    box-shadow:
      inset 0 4px 0 rgba(255, 225, 185, 0.28),
      inset 0 -5px 0 rgba(0, 0, 0, 0.65),
      0 7px 0 #130d09,
      0 14px 25px rgba(0, 0, 0, 0.7);
    padding: clamp(6px, 1vh, 12px) clamp(20px, 2.4vw, 38px);
    margin-bottom: clamp(6px, 1.2vh, 16px);
    display: inline-flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 1.2vw, 18px);
  }

  .banner-crystal {
    width: clamp(24px, 2.2vw, 34px);
    height: clamp(24px, 2.2vw, 34px);
    flex-shrink: 0;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
  }

  #instruction-text {
    font-size: clamp(22px, 2.6vw, 40px);
    font-weight: 900;
    letter-spacing: 0.02em;
    color: #ffdf80;
    text-shadow: 
      0 3px 0 #1c120b,
      2px 0 0 #1c120b,
      -2px 0 0 #1c120b,
      0 5px 12px rgba(0, 0, 0, 0.9);
    white-space: nowrap;
  }

  /* Stage Row: Caveman + Monolith + Mammoth */
  .stage-row {
    width: 100%;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 3vw, 54px);
  }

  .character-box {
    width: clamp(180px, 24vw, 340px);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .mammoth-box {
    width: clamp(200px, 26vw, 380px);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .character-svg {
    width: 100%;
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 16px 20px rgba(0, 0, 0, 0.7));
  }

  /* Central Monolith */
  #monolith-container {
    position: relative;
    width: clamp(290px, 38vw, 530px);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .monolith-svg {
    width: 100%;
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 22px 32px rgba(0, 0, 0, 0.85));
  }

  .monolith-number-wrap {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  /* Big Target Monolith Number */
  .monolith-number {
    font-weight: 900;
    font-size: clamp(82px, 10.5vw, 152px);
    line-height: 1;
    letter-spacing: 0.02em;
    color: #ffbe3b;
    -webkit-text-stroke: 6px #21130b;
    paint-order: stroke fill;
    text-shadow: 
      0 8px 0 #1a0f08,
      0 14px 24px rgba(0, 0, 0, 0.85);
  }

  /* ================= BOTTOM ROW: 4 ANSWER BOULDERS ================= */
  .bottom-footer {
    position: relative;
    z-index: 30;
    width: 100%;
    padding: 0 clamp(16px, 3vw, 48px) clamp(14px, 2.6vh, 32px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #answers-container {
    width: 100%;
    max-width: 1480px;
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 2.6vw, 42px);
  }

  .answer-boulder {
    position: relative;
    flex: 1 1 0;
    max-width: 285px;
    min-width: 135px;
    height: clamp(92px, 13.5vh, 146px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
  }

  .answer-boulder:hover {
    transform: translateY(-9px) scale(1.05);
    filter: drop-shadow(0 16px 20px rgba(0, 0, 0, 0.7)) brightness(1.09);
  }

  .answer-boulder:active {
    transform: translateY(3px) scale(0.97);
  }

  .boulder-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.7));
  }

  .boulder-number {
    position: relative;
    z-index: 10;
    font-weight: 900;
    font-size: clamp(40px, 4.6vw, 72px);
    line-height: 1;
    color: #fff6e0;
    -webkit-text-stroke: 4px #21150c;
    paint-order: stroke fill;
    text-shadow: 
      0 5px 0 #140c07,
      0 8px 14px rgba(0, 0, 0, 0.85);
    letter-spacing: 0.02em;
    pointer-events: none;
  }

  /* ================= PREHISTORIC ANIMATIONS ================= */
  @keyframes swaySlow {
    0%, 100% { transform: rotate(-2.5deg); }
    50% { transform: rotate(3deg); }
  }
  @keyframes swayMedium {
    0%, 100% { transform: rotate(2deg) scaleY(1); }
    50% { transform: rotate(-3.5deg) scaleY(1.02); }
  }
  @keyframes breatheCaveman {
    0%, 100% { transform: translateY(0px) scaleY(1); }
    50% { transform: translateY(-5px) scaleY(1.018); }
  }
  @keyframes breatheMammoth {
    0%, 100% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-4px) scale(1.012); }
  }
  @keyframes mammothEarFlap {
    0%, 80%, 100% { transform: rotate(0deg); }
    85% { transform: rotate(-12deg); }
    92% { transform: rotate(6deg); }
  }
  @keyframes clubIdle {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(6deg); }
  }
  @keyframes flameOuter {
    0%, 100% { transform: scale(1, 1) skewX(-1.5deg); }
    25% { transform: scale(0.96, 1.07) skewX(2deg); }
    50% { transform: scale(1.04, 0.94) skewX(-2deg); }
    75% { transform: scale(0.98, 1.08) skewX(1.5deg); }
  }
  @keyframes flameMid {
    0%, 100% { transform: scale(1, 1) skewX(1.5deg); }
    33% { transform: scale(1.05, 0.93) skewX(-2.5deg); }
    66% { transform: scale(0.95, 1.07) skewX(2deg); }
  }
  @keyframes flameInner {
    0%, 100% { transform: scale(1, 1); opacity: 0.9; }
    50% { transform: scale(0.92, 1.09); opacity: 1; }
  }
  @keyframes fireGlowPulse {
    0%, 100% { transform: scale(1); opacity: 0.55; }
    50% { transform: scale(1.05); opacity: 0.75; }
  }
  @keyframes lavaBubble {
    0% { transform: translateY(0) scale(0.5); opacity: 0.95; }
    70% { transform: translateY(-14px) scale(1.15); opacity: 0.9; }
    100% { transform: translateY(-20px) scale(1.4); opacity: 0; }
  }
  @keyframes pteroFly1 {
    0% { transform: translate(-15vw, 6vh) scale(0.75) rotate(4deg); }
    50% { transform: translate(45vw, 2vh) scale(0.85) rotate(-3deg); }
    100% { transform: translate(115vw, 9vh) scale(0.75) rotate(5deg); }
  }
  @keyframes pteroFly2 {
    0% { transform: translate(115vw, 14vh) scale(-0.55, 0.55) rotate(-3deg); }
    50% { transform: translate(50vw, 10vh) scale(-0.6, 0.6) rotate(4deg); }
    100% { transform: translate(-15vw, 16vh) scale(-0.55, 0.55) rotate(-2deg); }
  }
  @keyframes wingBeat {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.35); }
  }
  @keyframes numberPop {
    0% { transform: scale(0.45) rotate(-6deg); opacity: 0; }
    70% { transform: scale(1.08) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes boulderShake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-12px) rotate(-4deg); }
    40% { transform: translateX(12px) rotate(4deg); }
    60% { transform: translateX(-9px) rotate(-3deg); }
    80% { transform: translateX(9px) rotate(3deg); }
  }
  @keyframes cavemanCelebrate {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    25% { transform: translateY(-34px) rotate(-6deg) scale(1.05); }
    50% { transform: translateY(0) rotate(0deg) scale(0.96); }
    75% { transform: translateY(-28px) rotate(6deg) scale(1.05); }
  }
  @keyframes mammothCelebrate {
    0%, 100% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-26px) scale(1.04) rotate(3deg); }
    60% { transform: translateY(0) scale(0.97) rotate(-2deg); }
    85% { transform: translateY(-18px) scale(1.03) rotate(2deg); }
  }

  .sway-slow { animation: swaySlow 5.5s ease-in-out infinite; }
  .sway-medium { animation: swayMedium 4.2s ease-in-out infinite; }
  .caveman-idle { animation: breatheCaveman 3.2s ease-in-out infinite; transform-origin: bottom center; }
  .caveman-jump { animation: cavemanCelebrate 0.8s ease-in-out 2; transform-origin: bottom center; }
  .mammoth-idle { animation: breatheMammoth 3.8s ease-in-out infinite; transform-origin: bottom center; }
  .mammoth-jump { animation: mammothCelebrate 0.85s ease-in-out 2; transform-origin: bottom center; }
  .ear-flap { animation: mammothEarFlap 5s ease-in-out infinite; transform-origin: 30% 25%; }
  .club-idle { animation: clubIdle 3.2s ease-in-out infinite; transform-origin: 25% 80%; }

  .flame-outer {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: flameOuter 1.15s ease-in-out infinite;
  }
  .flame-mid {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: flameMid 0.85s ease-in-out infinite;
  }
  .flame-inner {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: flameInner 0.65s ease-in-out infinite;
  }
  .fire-glow-pulse {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: fireGlowPulse 1.8s ease-in-out infinite;
  }
  .lava-bubble-1 {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: lavaBubble 2.1s ease-out infinite;
  }
  .lava-bubble-2 {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: lavaBubble 2.6s ease-out 0.8s infinite;
  }
  .lava-bubble-3 {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: lavaBubble 1.9s ease-out 1.4s infinite;
  }
  .ptero-1 { animation: pteroFly1 26s linear infinite; }
  .ptero-2 { animation: pteroFly2 34s linear infinite; }
  .ptero-wing { animation: wingBeat 0.55s ease-in-out infinite; transform-origin: center; }
  .number-enter { animation: numberPop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .boulder-wrong { animation: boulderShake 0.5s ease-in-out; }
</style>
</head>
<body>

<div id="game-root">

  <!-- ================= LAYER 1: PREHISTORIC LIVING SKY & LANDSCAPE SVG ================= -->
  <svg class="bg-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Dusk Sunset Sky Gradient -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#221333"/>
        <stop offset="28%" stop-color="#4e2040"/>
        <stop offset="56%" stop-color="#943937"/>
        <stop offset="78%" stop-color="#d96b27"/>
        <stop offset="100%" stop-color="#f7b145"/>
      </linearGradient>

      <!-- Sun Glow -->
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff3a1" stop-opacity="0.95"/>
        <stop offset="35%" stop-color="#ffae33" stop-opacity="0.65"/>
        <stop offset="70%" stop-color="#e04f26" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#e04f26" stop-opacity="0"/>
      </radialGradient>

      <!-- Volcano Lava Gradient -->
      <linearGradient id="lavaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fff36b"/>
        <stop offset="40%" stop-color="#ff7700"/>
        <stop offset="85%" stop-color="#c91e00"/>
        <stop offset="100%" stop-color="#590900"/>
      </linearGradient>

      <!-- Distant Mountains -->
      <linearGradient id="mountFar" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#52263b"/>
        <stop offset="100%" stop-color="#2e1526"/>
      </linearGradient>

      <!-- Midground Valley -->
      <linearGradient id="valleyMid" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#3c2329"/>
        <stop offset="100%" stop-color="#1e1318"/>
      </linearGradient>

      <!-- Foreground Prehistoric Ground -->
      <linearGradient id="groundFore" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#3b281e"/>
        <stop offset="45%" stop-color="#291b14"/>
        <stop offset="100%" stop-color="#170f0b"/>
      </linearGradient>

      <!-- Moss Gradient -->
      <linearGradient id="mossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#76a034"/>
        <stop offset="100%" stop-color="#3e5918"/>
      </linearGradient>

      <!-- Campfire Radial Glow -->
      <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff9d2e" stop-opacity="0.55"/>
        <stop offset="50%" stop-color="#ff5100" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#ff5100" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Sky Backdrop -->
    <rect width="1920" height="1080" fill="url(#skyGrad)"/>

    <!-- Ancient Giant Setting Sun -->
    <circle cx="960" cy="540" r="390" fill="url(#sunGlow)"/>
    <circle cx="960" cy="540" r="135" fill="#ffe484" opacity="0.85"/>

    <!-- Layered Dusk Clouds -->
    <g fill="#732938" opacity="0.45">
      <path d="M120,230 Q200,190 290,220 Q380,180 460,230 Q510,250 450,265 L110,265 Z"/>
      <path d="M1350,170 Q1440,130 1540,165 Q1620,140 1690,180 L1320,190 Z"/>
      <path d="M620,130 Q710,95 810,125 Q880,105 940,140 L600,145 Z"/>
    </g>

    <!-- Flying Pterodactyls -->
    <g class="ptero-1">
      <g class="ptero-wing">
        <path d="M0,0 Q-35,-28 -75,-12 Q-45,2 -15,6 L-30,14 L-8,8 L25,-6 L55,-14 L25,2 Q45,0 80,-14 Q40,-30 0,0 Z" fill="#381728"/>
      </g>
      <path d="M-25,4 L18,-6 L45,-12 L18,4 L-18,10 Z" fill="#260e1b"/>
    </g>

    <g class="ptero-2">
      <g class="ptero-wing">
        <path d="M0,0 Q-35,-28 -75,-12 Q-45,2 -15,6 L-30,14 L-8,8 L25,-6 L55,-14 L25,2 Q45,0 80,-14 Q40,-30 0,0 Z" fill="#471d31"/>
      </g>
    </g>

    <!-- Distant Jagged Mountain Range -->
    <path d="M0,690 L120,540 L230,610 L390,450 L540,590 L690,480 L830,620 L1080,610 L1210,490 L1340,595 L1540,360 L1630,360 L1790,590 L1920,510 L1920,800 L0,800 Z" fill="url(#mountFar)"/>

    <!-- Active Prehistoric Volcano (Right-Center Background) -->
    <g id="volcano-group">
      <path d="M1330,680 L1515,365 L1645,365 L1825,680 Z" fill="#2d1421"/>
      <!-- Volcano Crater Rim Glow (Anchored Reference for Steam & Bubbles) -->
      <ellipse id="volcano-crater-rim" cx="1580" cy="363" rx="65" ry="12" fill="#ff6a00" opacity="0.9"/>
      <ellipse cx="1580" cy="363" rx="46" ry="7" fill="#fff066" opacity="0.85"/>
      <!-- Bubbling Lava right in the Crater Mouth -->
      <circle class="lava-bubble-1" cx="1552" cy="360" r="7" fill="#ffae00" stroke="#fff385" stroke-width="2"/>
      <circle class="lava-bubble-2" cx="1582" cy="358" r="9" fill="#ff7700" stroke="#fff385" stroke-width="2"/>
      <circle class="lava-bubble-3" cx="1608" cy="361" r="6.5" fill="#ffbe3b" stroke="#fff385" stroke-width="2"/>
      <!-- Flowing Magma Veins -->
      <path d="M1545,370 Q1560,415 1535,460 Q1515,500 1530,555 Q1542,500 1558,465 Q1578,420 1568,372 Z" fill="url(#lavaGrad)"/>
      <path d="M1590,372 Q1610,410 1600,450 Q1592,485 1618,530 Q1625,480 1615,442 Q1625,405 1608,370 Z" fill="url(#lavaGrad)"/>
      <path d="M1630,368 Q1655,395 1668,435 Q1645,405 1622,372 Z" fill="url(#lavaGrad)"/>
    </g>

    <!-- Left Ancient Cave Cliff Wall with Ochre Cave Paintings -->
    <path d="M0,220 Q160,250 230,390 Q290,520 260,720 L0,720 Z" fill="#291916"/>
    <path d="M0,250 Q135,280 195,410 Q245,525 220,710 L0,710 Z" fill="#38221c"/>
    <!-- Cave Paintings (Bison, Hunters, Spiral in glowing ochre) -->
    <g stroke="#d97b38" stroke-width="3.5" fill="none" opacity="0.48" stroke-linecap="round" stroke-linejoin="round">
      <path d="M55,440 Q85,425 115,438 Q130,445 135,460 Q110,468 75,465 Q55,462 55,440 Z"/>
      <path d="M62,463 L58,488 M78,465 L80,488 M115,464 L112,488 M128,462 L134,486"/>
      <path d="M132,442 Q148,430 142,418 M135,447 Q152,440 150,428"/>
      <circle cx="172" cy="435" r="7" fill="#d97b38"/>
      <path d="M172,442 L168,472 M168,472 L158,494 M168,472 L180,494 M170,454 L154,446 M170,454 L186,442"/>

  /********************************************************************
   * 2. WEB AUDIO API SYNTHESIZER
   ********************************************************************/
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playStoneClack(pitch = 1) {
    try {
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(190 * pitch, now);
      osc.frequency.exponentialRampToValueAtTime(65 * pitch, now + 0.065);

      gain.gain.setValueAtTime(0.28, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.07);
    } catch (e) {}
  }

  function playWrongSound() {
    try {
      const ctx = getAudioCtx();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(165, now);
      osc.frequency.linearRampToValueAtTime(95, now + 0.18);
      osc.frequency.linearRampToValueAtTime(125, now + 0.28);
      osc.frequency.exponentialRampToValueAtTime(58, now + 0.48);

      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

      filter.connect(gain);
      gain.connect(ctx.destination);

  /********************************************************************
   * 4. MATH ROUNDING GENERATOR & PEDAGOGICAL DISTRACTORS
   ********************************************************************/
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function generateRoundingTask() {
    let roundTo = 10;
    let num = 0;

    if (currentMode === '2') {
      roundTo = 10;
      do {
        num = randInt(11, 94);
      } while (num % 10 === 0);

    } else if (currentMode === '3a') {
      roundTo = 10;
      do {
        num = randInt(101, 994);
      } while (num % 10 === 0);

    } else if (currentMode === '3b') {
      roundTo = 100;
      do {
        num = randInt(105, 949);
      } while (num % 100 === 0);

    } else {
      roundTo = Math.random() < 0.5 ? 10 : 100;
      if (roundTo === 10) {
        do {
          num = randInt(101, 994);
        } while (num % 10 === 0);
      } else {
        do {
          num = randInt(105, 949);
        } while (num % 100 === 0);
      }
    }

    const correct = Math.round(num / roundTo) * roundTo;
    const distractors = new Set();

    if (roundTo === 10) {
      const lowerTen = Math.floor(num / 10) * 10;
      const upperTen = lowerTen + 10;
      const oppositeTen = (correct === lowerTen) ? upperTen : lowerTen;
      distractors.add(oppositeTen);

      if (num >= 100) {
        const lowerHundred = Math.floor(num / 100) * 100;
        const upperHundred = lowerHundred + 100;
        const candidates = [
          lowerHundred,
          upperHundred,
          lowerTen - 10,
          upperTen + 10,
          lowerTen + 5
        ];
        for (const c of shuffleArray(candidates)) {
          if (c > 0 && c <= 1000 && c !== correct && !distractors.has(c)) {
            distractors.add(c);
            if (distractors.size >= 3) break;
          }
        }
      } else {
        const candidates = [
          lowerTen - 10,
          upperTen + 10,
          lowerTen + 5,
          100
        ];
        for (const c of shuffleArray(candidates)) {
          if (c >= 10 && c <= 100 && c !== correct && !distractors.has(c)) {
            distractors.add(c);
            if (distractors.size >= 3) break;
          }
        }
      }
    } else {
      const lowerHundred = Math.floor(num / 100) * 100;
      const upperHundred = lowerHundred + 100;
      const oppositeHundred = (correct === lowerHundred) ? upperHundred : lowerHundred;
      distractors.add(oppositeHundred);

      const lowerTen = Math.floor(num / 10) * 10;
      const upperTen = lowerTen + 10;
      const candidates = [
        lowerTen,
        upperTen,
        lowerHundred - 100,
        upperHundred + 100
      ];
      for (const c of shuffleArray(candidates)) {
        if (c >= 100 && c <= 1000 && c !== correct && !distractors.has(c)) {
          distractors.add(c);
          if (distractors.size >= 3) break;
        }
      }
    }

    while (distractors.size < 3) {
      const step = roundTo;
      const candidate = correct + randInt(-3, 3) * step;
      if (candidate > 0 && candidate !== correct) {
        distractors.add(candidate);
      }
    }

    const choices = shuffleArray([correct, ...Array.from(distractors).slice(0, 3)]);
    return { num, roundTo, correct, choices };
  }

    "M32,18 Q115,12 195,14 Q248,26 254,75 Q245,122 192,132 Q105,138 38,124 Q8,98 15,55 Q20,26 32,18 Z",
    "M24,28 Q85,10 165,12 Q235,16 252,58 Q260,105 222,126 Q145,138 62,130 Q14,118 12,75 Q10,42 24,28 Z"
  ];

  function renderNewTask() {
    isCelebrating = false;
    currentTask = generateRoundingTask();

    updateBannerText();

    const targetEl = document.getElementById('target-number');
    const color = MINERAL_COLORS[Math.floor(Math.random() * MINERAL_COLORS.length)];
    targetEl.style.color = color;
    targetEl.classList.remove('number-enter');
    void targetEl.offsetWidth;
    targetEl.textContent = currentTask.num;
    targetEl.classList.add('number-enter');

    randomizeCharacterEmotions();

    const container = document.getElementById('answers-container');
    container.innerHTML = '';

    currentTask.choices.forEach((val, idx) => {
      const btn = document.createElement('div');
      btn.className = 'answer-boulder';
      btn.onclick = () => handleChoiceClick(val, btn);

      const pathData = BOULDER_SHAPES[idx % BOULDER_SHAPES.length];
      btn.innerHTML = `
        <svg class="boulder-svg" viewBox="0 0 268 146" preserveAspectRatio="none">
          <defs>
            <linearGradient id="boulderGrad${idx}" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#786659"/>
              <stop offset="55%" stop-color="#54453b"/>
              <stop offset="100%" stop-color="#362b24"/>
            </linearGradient>
            <linearGradient id="boulderCorrectGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#52cc47"/>
              <stop offset="55%" stop-color="#2ca324"/>
              <stop offset="100%" stop-color="#186612"/>
            </linearGradient>
            <linearGradient id="boulderWrongGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#c94a38"/>
              <stop offset="55%" stop-color="#8f291b"/>
              <stop offset="100%" stop-color="#54140b"/>
            </linearGradient>
          </defs>
          <path class="boulder-body" d="${pathData}" fill="url(#boulderGrad${idx})" stroke="#1f1610" stroke-width="6" stroke-linejoin="round"/>
          <path d="M36,28 Q125,18 222,30" stroke="rgba(255,235,205,0.28)" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M42,95 L58,78 L52,62 M218,45 L202,68 L214,84" stroke="#261b14" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <circle cx="38" cy="52" r="5" fill="#d97b38" opacity="0.5"/>
          <circle cx="228" cy="96" r="6" fill="#d97b38" opacity="0.5"/>
        </svg>
        <span class="boulder-number">${val}</span>
      `;
      container.appendChild(btn);
    });
  }

  function updateBannerText() {
    const dict = I18N[currentLang];
    const instrEl = document.getElementById('instruction-text');
    const c1 = document.getElementById('banner-crystal');
    const c2 = document.getElementById('banner-crystal-2');

    if (currentTask && currentTask.roundTo === 100) {
      instrEl.textContent = dict.roundHundreds;
      instrEl.style.color = '#7bf1a8';
      c1.innerHTML = `<polygon points="20,2 35,14 29,37 11,37 5,14" fill="#2ec4b6" stroke="#1b1109" stroke-width="3"/><polygon points="20,2 29,14 20,37 11,14" fill="#cbf3f0" opacity="0.65"/>`;
      c2.innerHTML = c1.innerHTML;
    } else {
      instrEl.textContent = dict.roundTens;
      instrEl.style.color = '#ffdf80';
      c1.innerHTML = `<polygon points="20,2 35,14 29,37 11,37 5,14" fill="#ffb703" stroke="#1b1109" stroke-width="3"/><polygon points="20,2 29,14 20,37 11,14" fill="#ffe169" opacity="0.65"/>`;
      c2.innerHTML = c1.innerHTML;
    }
  }

  /********************************************************************
   * 6. INTERACTION HANDLERS
   ********************************************************************/
  function handleChoiceClick(selectedVal, boulderEl) {
    if (isCelebrating) return;

    const bodyPath = boulderEl.querySelector('.boulder-body');
    const rect = boulderEl.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    if (selectedVal === currentTask.correct) {
      isCelebrating = true;
      bodyPath.setAttribute('fill', 'url(#boulderCorrectGrad)');
      bodyPath.setAttribute('stroke', '#b7ff9e');

      renderCavemanEmotion('starry');
      renderMammothEmotion('joyful');

      const cavemanWrap = document.getElementById('caveman-wrapper');
      const mammothWrap = document.getElementById('mammoth-wrapper');
      cavemanWrap.classList.add('caveman-jump');
      mammothWrap.classList.add('mammoth-jump');

      const variant = Math.floor(Math.random() * 4);
      playVictorySound(variant);
      triggerCelebrationParticles(variant, centerX, centerY);

      setTimeout(() => {
        cavemanWrap.classList.remove('caveman-jump');
        mammothWrap.classList.remove('mammoth-jump');
        renderNewTask();
      }, 1650);

    } else {
      playWrongSound();
      bodyPath.setAttribute('fill', 'url(#boulderWrongGrad)');
      boulderEl.classList.remove('boulder-wrong');
      void boulderEl.offsetWidth;
      boulderEl.classList.add('boulder-wrong');

      spawnBoulderDust(centerX, centerY);

      renderCavemanEmotion('shocked');
      renderMammothEmotion('shocked');

      setTimeout(() => {
        if (!isCelebrating) {
          randomizeCharacterEmotions();
        }
      }, 950);
    }
  }

  function setGameMode(mode) {
    playStoneClack(1.15);
    currentMode = mode;
    ['2', '3a', '3b', '3c'].forEach(m => {
      const btn = document.getElementById('mode-' + m);
      if (m === mode) btn.classList.add('active-mode');
      else btn.classList.remove('active-mode');
    });
    renderNewTask();
  }

  function skipToNextTask() {
    playStoneClack(1.3);
    renderNewTask();
  }

  function toggleLanguage() {
    playStoneClack(1.2);
    currentLang = (currentLang === 'uk') ? 'ru' : 'uk';
    const dict = I18N[currentLang];

    document.getElementById('lang-btn').textContent = dict.langBtn;
    document.getElementById('mode-2').textContent = dict.mode2;
    document.getElementById('mode-3a').textContent = dict.mode3a;
    document.getElementById('mode-3b').textContent = dict.mode3b;
    document.getElementById('mode-3c').textContent = dict.mode3c;
    updateBannerText();
  }

  /********************************************************************
   * 7. HTML5 CANVAS ENGINE: AMBIENT VOLCANO/CAMPFIRE + 4 CELEBRATIONS
   ********************************************************************/
  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d');
  let cw = window.innerWidth;
  let ch = window.innerHeight;

  function resizeCanvas() {
    cw = window.innerWidth;
    ch = window.innerHeight;
    canvas.width = cw;
    canvas.height = ch;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const ambientParticles = [];
  const activeParticles = [];

  function getVolcanoCraterScreenPos() {
    const el = document.getElementById('volcano-crater-rim');
    if (el) {
      const rect = el.getBoundingClientRect();
      if (rect.width > 0) {
        return {
          x: rect.left + rect.width / 2,
          y: rect.top + rect.height * 0.35,
          spreadX: rect.width * 0.72
        };
      }
    }
    return { x: cw * 0.823, y: ch * 0.336, spreadX: cw * 0.05 };
  }

  function getCampfireScreenPos() {
    const el = document.getElementById('campfire-core');
    if (el) {
      const rect = el.getBoundingClientRect();
      if (rect.width > 0) {
        return {
          x: rect.left + rect.width / 2,
          y: rect.top + rect.height / 2,
          spreadX: rect.width * 2.2
        };
      }
    }
    return { x: cw * 0.138, y: ch * 0.708, spreadX: 28 };
  }

  for (let i = 0; i < 34; i++) {
    ambientParticles.push(createAmbientParticle(true));
  }

  function createAmbientParticle(randomProgress = false) {
    const isVolcano = Math.random() < 0.68;
    if (isVolcano) {
      const crater = getVolcanoCraterScreenPos();
      const isBubble = Math.random() < 0.38;
      const startY = crater.y - (randomProgress ? Math.random() * 55 : 0);
      return {
        type: 'volcano',
        x: crater.x + (Math.random() - 0.5) * crater.spreadX,
        y: startY,
        originY: crater.y,
        vx: (Math.random() - 0.45) * 0.45,
        vy: isBubble ? (-0.45 - Math.random() * 0.65) : (-0.65 - Math.random() * 0.95),
        r: isBubble ? (3.5 + Math.random() * 5.5) : (9 + Math.random() * 15),
        alpha: isBubble ? (0.75 + Math.random() * 0.2) : (0.32 + Math.random() * 0.25),
        isSpark: isBubble,
        color: Math.random() < 0.5 ? '#ff7b00' : '#ffd047'
      };
    } else {
      const fire = getCampfireScreenPos();
      const startY = fire.y - 12 - (randomProgress ? Math.random() * 35 : 0);
      return {
        type: 'campfire',
        x: fire.x + (Math.random() - 0.5) * fire.spreadX,
        y: startY,
        originY: fire.y,
        vx: (Math.random() - 0.5) * 0.45,
        vy: -0.65 - Math.random() * 0.85,
        r: 1.8 + Math.random() * 2.6,
        alpha: 0.75 + Math.random() * 0.25,
        color: Math.random() < 0.5 ? '#ffae00' : '#fff066'
      };
    }
  }

  function spawnBoulderDust(x, y) {
    for (let i = 0; i < 24; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 7;
      activeParticles.push({
        kind: 'dust',
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        gravity: 0.25,
        r: 5 + Math.random() * 10,
        alpha: 0.85,
        decay: 0.025 + Math.random() * 0.015,
        color: i % 2 === 0 ? '#8c7a6b' : '#594a3e'
      });
    }
  }

  function triggerCelebrationParticles(variant, clickX, clickY) {
    for (let i = 0; i < 30; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 3 + Math.random() * 9;
      activeParticles.push({
        kind: 'star',
        x: clickX,
        y: clickY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3,
        gravity: 0.18,
        r: 7 + Math.random() * 8,
        rot: Math.random() * Math.PI,
        vRot: (Math.random() - 0.5) * 0.2,
        alpha: 1,
        decay: 0.016,
        color: ['#ffe66d', '#4ecdc4', '#ff6b6b', '#a8eb34'][i % 4]
      });
    }

    if (variant === 0) {
      const mammothEl = document.getElementById('mammoth-wrapper');
      const rect = mammothEl.getBoundingClientRect();
      const trunkX = rect.left + rect.width * 0.22;
      const trunkY = rect.top + rect.height * 0.28;

      for (let i = 0; i < 65; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.25;
        const speed = 7 + Math.random() * 11;
        activeParticles.push({
          kind: i % 3 === 0 ? 'flower' : 'droplet',
          x: trunkX,
          y: trunkY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          gravity: 0.28,
          r: i % 3 === 0 ? 11 : 6 + Math.random() * 5,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.15,
          alpha: 1,
          decay: 0.012,
          color: i % 3 === 0
            ? ['#ff6b8b', '#ffbe3b', '#c77dff', '#4ce0b3'][i % 4]
            : ['#72efdd', '#48bfe3', '#caf0f8'][i % 3]
        });
      }

    } else if (variant === 1) {
      const crater = getVolcanoCraterScreenPos();
      const vx = crater.x;
      const vy = crater.y;
      for (let i = 0; i < 70; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.4;
        const speed = 8 + Math.random() * 14;
        activeParticles.push({
          kind: 'gem',
          x: vx,
          y: vy,
          vx: Math.cos(angle) * speed - 2,
          vy: Math.sin(angle) * speed,
          gravity: 0.26,
          r: 9 + Math.random() * 9,
          rot: Math.random() * Math.PI,
          vRot: (Math.random() - 0.5) * 0.2,
          alpha: 1,
          decay: 0.011,
          color: ['#ffbe0b', '#fb5607', '#ff006e', '#3a86ff', '#06d6a0'][i % 5]
        });
      }

    } else if (variant === 2) {
      const monoEl = document.getElementById('monolith-container');
      const rect = monoEl.getBoundingClientRect();
      const mx = rect.left + rect.width / 2;
      const my = rect.top + rect.height / 2;

      for (let i = 0; i < 65; i++) {
        const angle = (i / 65) * Math.PI * 2;
        const speed = 3 + Math.random() * 7;
        activeParticles.push({
          kind: 'star',
          x: mx + Math.cos(angle) * (rect.width * 0.35),
          y: my + Math.sin(angle) * (rect.height * 0.35),
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          gravity: 0.04,
          r: 8 + Math.random() * 8,
          rot: angle,
          vRot: 0.12,
          alpha: 1,
          decay: 0.013,
          color: ['#ffe66d', '#7bf1a8', '#ff9248', '#4ce0b3'][i % 4]
        });
      }

    } else {
      for (let i = 0; i < 55; i++) {
        activeParticles.push({
          kind: 'star',
          x: Math.random() * cw * 0.9,
          y: -20 - Math.random() * 180,
          vx: 3 + Math.random() * 5,
          vy: 6 + Math.random() * 7,
          gravity: 0.08,
          r: 10 + Math.random() * 10,
          rot: Math.random() * Math.PI,
          vRot: 0.18,
          alpha: 1,
          decay: 0.011,
          color: ['#ffbe3b', '#ff6b6b', '#4ce0b3', '#ffe66d'][i % 4]
        });
      }
    }
  }

  function drawStar(ctx, x, y, radius, rot, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * radius,
                 -Math.sin((18 + i * 72) * Math.PI / 180) * radius);
      ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (radius * 0.45),
                 -Math.sin((54 + i * 72) * Math.PI / 180) * (radius * 0.45));
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  function drawGem(ctx, x, y, radius, rot, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(0, -radius);
    ctx.lineTo(radius * 0.85, 0);
    ctx.lineTo(0, radius);
    ctx.lineTo(-radius * 0.85, 0);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();
    ctx.restore();
  }

  function drawFlower(ctx, x, y, radius, rot, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = color;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.arc(Math.cos(i * 2 * Math.PI / 5) * (radius * 0.55),
              Math.sin(i * 2 * Math.PI / 5) * (radius * 0.55),
              radius * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = '#fff385';
    ctx.fill();
    ctx.restore();
  }

  function animateCanvas() {
    ctx.clearRect(0, 0, cw, ch);

    for (let i = 0; i < ambientParticles.length; i++) {
      const p = ambientParticles[i];
      p.x += p.vx;
      p.y += p.vy;

      if (p.type === 'volcano') {
        if (!p.isSpark) {
          p.r += 0.07;
          p.alpha -= 0.0024;
        } else {
          p.alpha -= 0.012;
        }
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.isSpark ? p.color : '#4a2533';
        ctx.fill();
        ctx.restore();
      } else {
        p.alpha -= 0.014;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
      }

      if (p.alpha <= 0 || p.y < -40) {
        ambientParticles[i] = createAmbientParticle(false);
      }
    }

    for (let i = activeParticles.length - 1; i >= 0; i--) {
      const p = activeParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity || 0;
      if (p.rot !== undefined) p.rot += p.vRot || 0;
      p.alpha -= p.decay;

      if (p.alpha <= 0) {
        activeParticles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);

      if (p.kind === 'star') {
        drawStar(ctx, p.x, p.y, p.r, p.rot, p.color);
      } else if (p.kind === 'gem') {
        drawGem(ctx, p.x, p.y, p.r, p.rot, p.color);
      } else if (p.kind === 'flower') {
        drawFlower(ctx, p.x, p.y, p.r, p.rot, p.color);
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }

      ctx.restore();
    }

    requestAnimationFrame(animateCanvas);
  }

  window.onload = () => {
    renderNewTask();
    animateCanvas();
  };
</script>
</body>
</html>
