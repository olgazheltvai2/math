<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лісова Майстерня Схем</title>
<style>
  /* ==========================================================================
     ОСНОВНІ СТИЛІ ТА СКИДАННЯ (КРУПНИЙ ШРИФТ, ЖОДНИХ БІЛИХ ПРЯМОКУТНИКІВ)
     ========================================================================== */
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Trebuchet MS', 'Comic Sans MS', 'Segoe UI', sans-serif;
    background: #1d4d2b;
    color: #2c1810;
  }

  /* Головна сітка гри: оптимізовані пропорції для великого шрифту */
  #game-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 245px 1fr;
    gap: 10px;
    padding: 10px 14px;
    z-index: 2;
  }

  /* Живий сюжетний SVG-фон на весь екран */
  #scene-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Шар для святкових частинок (листя, зірки, іскри) */
  #fx-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 50;
    pointer-events: none;
  }

  /* ==========================================================================
     ВЕРХНЯ ДОШКА: ТЕКСТ ЗАДАЧІ ТА КНОПКИ НАВІГАЦІЇ (НАЗАД / ДАЛІ)
     ========================================================================== */
  #top-bar {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 64px 1fr 64px;
    align-items: center;
    gap: 12px;
    background: linear-gradient(180deg, #e8b974 0%, #cf9246 55%, #b3742a 100%);
    border: 4px solid #6b3b10;
    border-radius: 24px;
    padding: 10px 16px;
    box-shadow: 0 7px 0 #4d2807, inset 0 3px 0 rgba(255, 240, 200, 0.65);
    position: relative;
  }

  #top-bar::before {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 18px;
    border: 2px dashed rgba(107, 59, 16, 0.35);
    pointer-events: none;
  }

  /* Мінімалістичні кнопки "Назад" та "Далі" (завжди активні) */
  .nav-btn {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 4px solid #4e2a08;
    background: radial-gradient(circle at 35% 30%, #ffd86b, #e08b19 75%, #9c5506 100%);
    box-shadow: 0 5px 0 #3d1f05, inset 0 3px 4px rgba(255,255,255,0.5);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, filter 0.15s ease;
    z-index: 3;
  }
  .nav-btn:hover {
    transform: translateY(-2px) scale(1.06);
    filter: brightness(1.08);
  }
  .nav-btn:active {
    transform: translateY(3px) scale(0.96);
    box-shadow: 0 2px 0 #3d1f05;
  }
  .nav-btn svg {
    width: 34px;
    height: 34px;
  }

  /* Пергамент із текстом задачі та індикаторами рівнів */
  #problem-banner {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: radial-gradient(ellipse at center, #f9e3b4 0%, #ebd69c 70%, #d8b872 100%);
    border: 3px solid #8c521a;
    border-radius: 18px;
    padding: 8px 20px;
    box-shadow: inset 0 2px 8px rgba(110, 62, 14, 0.35);
    position: relative;
  }

  /* Смужка візуальних зірочок (зразки) та жолудів (самостійні задачі) */
  #level-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    align-items: center;
  }
  .lvl-gem {
    width: 22px;
    height: 22px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .lvl-gem:hover {
    transform: scale(1.25);
  }
  .lvl-gem.active {
    transform: scale(1.38);
    filter: drop-shadow(0 0 6px #ffae00);
  }

  /* Збільшений крупний текст умови задачі */
  #problem-text-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #problem-text {
    font-size: clamp(24px, 2.45vw, 35px);
    line-height: 1.28;
    font-weight: 900;
    color: #361b05;
    text-align: center;
    text-shadow: 0 1px 0 rgba(255, 244, 214, 0.85);
  }
  .num-highlight {
    display: inline-block;
    background: linear-gradient(180deg, #ffdf78, #f2a922);
    color: #4a1c00;
    padding: 0 10px;
    border-radius: 10px;
    border: 2px solid #964b00;
    box-shadow: 0 2px 0 #6b3500;
    margin: 0 2px;
  }
  .word-highlight {
    display: inline-block;
    background: linear-gradient(180deg, #b8f28b, #73c93c);
    color: #163d04;
    padding: 0 10px;
    border-radius: 10px;
    border: 2px solid #2f6e0e;
    box-shadow: 0 2px 0 #1f4d08;
  }

  /* ==========================================================================
     ЛІВА КОЛОНКА: ВІТРИНА ОБ'ЄКТІВ ЗАДАЧІ + ЖИВЕ ЛИСЕНЯ-МАЙСТЕР
     ========================================================================== */
  #character-panel {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, rgba(46, 107, 52, 0.85) 0%, rgba(28, 74, 35, 0.92) 100%);
    border: 4px solid #6b3b10;
    border-radius: 24px;
    padding: 10px;
    box-shadow: 0 7px 0 #381e06, inset 0 2px 12px rgba(255, 232, 166, 0.3);
    position: relative;
    overflow: hidden;
  }

  /* Вітрина предметів поточної задачі над персонажем */
  #items-showcase {
    width: 100%;
    background: linear-gradient(180deg, #f3d79b 0%, #dfb265 100%);
    border: 3px solid #754110;
    border-radius: 16px;
    padding: 8px 6px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: inset 0 2px 6px rgba(90, 48, 8, 0.35), 0 4px 0 #4d2907;
  }
  .showcase-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .showcase-icon {
    width: 52px;
    height: 52px;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.25));
  }
  .showcase-badge {
    font-size: 24px;
    font-weight: 900;
    color: #3d1c02;
    background: linear-gradient(180deg, #ffe794, #f5b638);
    border: 2px solid #7a4108;
    border-radius: 11px;
    padding: 2px 10px;
  }

  /* Контейнер анімованого SVG Лисеняти */
  #fox-stage {
    width: 100%;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
  }
  #fox-svg {
    width: 220px;
    height: 260px;
    max-height: 100%;
    overflow: visible;
    filter: drop-shadow(0 8px 8px rgba(0,0,0,0.35));
    transition: transform 0.3s ease;
  }

  /* Кнопка демонстрації зразка (активна у перших 3 задачах-зразках) */
  #sample-guide-btn {
    width: 94%;
    height: 54px;
    border-radius: 16px;
    border: 3px solid #6e3700;
    background: linear-gradient(180deg, #ffe97d 0%, #ffad1f 60%, #d97700 100%);
    box-shadow: 0 5px 0 #572b00, inset 0 2px 3px rgba(255,255,255,0.7);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    animation: pulseGlow 1.8s infinite alternate;
  }
  #sample-guide-btn svg {
    width: 36px;
    height: 36px;
  }
  @keyframes pulseGlow {
    0% { transform: scale(1); filter: drop-shadow(0 0 4px #ffd000); }
    100% { transform: scale(1.04); filter: drop-shadow(0 0 14px #ffee55); }
  }

  /* Анімації емоцій персонажа */
  .fox-jump {
    animation: foxJumpAnim 0.65s ease-in-out 2;
  }
  @keyframes foxJumpAnim {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    40% { transform: translateY(-24px) rotate(-6deg) scale(1.06); }
    70% { transform: translateY(-8px) rotate(6deg); }
  }
  .fox-sad {
    animation: foxSadAnim 0.55s ease-in-out;
  }
  @keyframes foxSadAnim {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    25% { transform: translateX(-10px) rotate(-5deg); }
    75% { transform: translateX(10px) rotate(5deg); }
  }

  /* ==========================================================================
     РОБОЧИЙ СТІЛ: 4 СТИЛІЗОВАНІ ДОШКИ (КОРОТКА УМОВА, СХЕМА, РОЗВ'ЯЗАННЯ, ВІДПОВІДЬ)
     ========================================================================== */
  #workbench {
    display: grid;
    grid-template-columns: 1fr 1.28fr;
    grid-template-rows: 1.22fr 0.78fr;
    gap: 12px;
    height: 100%;
    min-height: 0;
  }

  /* Загальний стиль фігурних дощечок з візерунком */
  .work-card {
    position: relative;
    border-radius: 24px;
    padding: 12px 16px;
    border: 4px solid #6b3b10;
    box-shadow: 0 7px 0 #3d2006, inset 0 3px 0 rgba(255, 248, 220, 0.55);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.3s;
  }

  /* Кожна дошка має свій природний колір і декоративний візерунок */
  #card-condition {
    background:
      radial-gradient(circle at 18% 20%, rgba(255, 224, 130, 0.45) 0%, transparent 45%),
      repeating-linear-gradient(45deg, rgba(196, 133, 53, 0.12) 0px, rgba(196, 133, 53, 0.12) 12px, transparent 12px, transparent 24px),
      linear-gradient(160deg, #fae2a5 0%, #edc374 100%);
  }
  #card-scheme {
    background:
      radial-gradient(circle at 80% 20%, rgba(182, 240, 150, 0.35) 0%, transparent 50%),
      repeating-linear-gradient(0deg, rgba(72, 138, 60, 0.1) 0px, rgba(72, 138, 60, 0.1) 24px, transparent 24px, transparent 48px),
      repeating-linear-gradient(90deg, rgba(72, 138, 60, 0.1) 0px, rgba(72, 138, 60, 0.1) 24px, transparent 24px, transparent 48px),
      linear-gradient(160deg, #dff5c6 0%, #b7e094 100%);
    border-color: #386b20;
    box-shadow: 0 7px 0 #1f4210, inset 0 3px 0 rgba(235, 255, 220, 0.65);
    padding: 8px 12px;
  }
  #card-solution {
    background:
      radial-gradient(circle at 25% 80%, rgba(255, 200, 150, 0.4) 0%, transparent 50%),
      repeating-linear-gradient(-45deg, rgba(180, 95, 45, 0.1) 0px, rgba(180, 95, 45, 0.1) 14px, transparent 14px, transparent 28px),
      linear-gradient(160deg, #ffd8b5 0%, #f2b17e 100%);
    border-color: #853d16;
    box-shadow: 0 7px 0 #522208, inset 0 3px 0 rgba(255, 240, 225, 0.6);
  }
  #card-answer {
    background:
      radial-gradient(circle at 75% 75%, rgba(255, 238, 135, 0.5) 0%, transparent 55%),
      repeating-linear-gradient(30deg, rgba(168, 120, 30, 0.1) 0px, rgba(168, 120, 30, 0.1) 16px, transparent 16px, transparent 32px),
      linear-gradient(160deg, #fce89c 0%, #e8c15a 100%);
    border-color: #78530d;
    box-shadow: 0 7px 0 #4a3104, inset 0 3px 0 rgba(255, 250, 210, 0.65);
  }

  /* Декоративні кутові значки на дошках */
  .card-corner-badge {
    position: absolute;
    top: 8px;
    left: 10px;
    width: 32px;
    height: 32px;
    opacity: 0.85;
    pointer-events: none;
  }

  /* Крупні інтерактивні комірки (слоти) для введення чисел, знаків та слів */
  .slot-btn {
    min-width: 74px;
    height: 64px;
    padding: 4px 14px;
    border-radius: 16px;
    border: 3.5px solid #6b3b10;
    background: linear-gradient(180deg, #fff0c2 0%, #f0ca78 100%);
    box-shadow: 0 4px 0 #4d2907, inset 0 2px 2px rgba(255,255,255,0.65);
    font-size: clamp(27px, 2.65vw, 37px);
    font-weight: 900;
    color: #3b1b03;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.2s, border-color 0.2s;
    position: relative;
  }
  .slot-btn:hover {
    transform: translateY(-2px) scale(1.04);
    background: linear-gradient(180deg, #fff5d6 0%, #f7d688 100%);
    border-color: #9e540b;
  }
  .slot-btn.active-slot {
    border-color: #ff6a00;
    box-shadow: 0 0 0 4px rgba(255, 136, 0, 0.45), 0 4px 0 #4d2907;
    transform: scale(1.06);
  }

  /* Напівпрозора підказка у задачах-зразках */
  .slot-btn .ghost-hint {
    color: rgba(135, 76, 12, 0.42);
    font-weight: 900;
    border-bottom: 2px dashed rgba(135, 76, 12, 0.45);
  }

  /* Підсвітка правильно та неправильно заповнених слотів */
  .slot-correct {
    background: linear-gradient(180deg, #c9f79c 0%, #86d649 100%) !important;
    border-color: #2b6e08 !important;
    color: #133b00 !important;
    box-shadow: 0 4px 0 #1c4a04 !important;
  }
  .slot-wrong {
    background: linear-gradient(180deg, #ffb399 0%, #e85d3b 100%) !important;
    border-color: #7a1600 !important;
    color: #420800 !important;
    animation: shakeErr 0.45s ease;
  }
  @keyframes shakeErr {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  /* ==========================================================================
     1. БЛОК КОРОТКОЇ УМОВИ (ЗБІЛЬШЕНИЙ ШРИФТ)
     ========================================================================== */
  #condition-layout {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
  }
  .cond-rows {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .cond-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: clamp(26px, 2.55vw, 35px);
    font-weight: 900;
    color: #3b1c04;
  }
  .cond-row-icon {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
  }
  .cond-label-box {
    min-width: 68px;
    text-align: right;
    color: #4d2303;
  }

  /* Інтерактивна кругла дужка порівняння / відношення */
  #bracket-arc-btn {
    width: 54px;
    height: 132px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    border: 3px dashed #8a5017;
    background: rgba(255, 232, 175, 0.45);
    transition: transform 0.15s, background 0.2s;
    flex-shrink: 0;
  }
  #bracket-arc-btn:hover {
    transform: scale(1.05);
    background: rgba(255, 240, 195, 0.75);
  }
  #bracket-arc-btn.placed {
    border-style: solid;
    border-color: #5c3106;
    background: linear-gradient(180deg, #ffeaad, #f0be62);
    box-shadow: 0 3px 0 #4d2804;
  }

  /* Блок "на [? / число] од. [> / <]" біля дужки */
  .cond-compare-box {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: clamp(25px, 2.4vw, 33px);
    font-weight: 900;
    color: #3b1c04;
  }

  /* ==========================================================================
     2. БЛОК ІНТЕРАКТИВНОЇ СХЕМИ (БЕЗ ЖОДНИХ НАКЛАДАНЬ ЕЛЕМЕНТІВ)
     ========================================================================== */
  #scheme-container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #scheme-svg {
    width: 100%;
    height: 100%;
    max-height: 295px;
    overflow: visible;
  }
  .seg-handle {
    cursor: pointer;
    transition: filter 0.15s;
  }
  .seg-handle:hover {
    filter: brightness(1.18) drop-shadow(0 0 6px #ffae00);
  }
  .svg-slot-group {
    cursor: pointer;
  }
  .svg-slot-group:hover rect {
    stroke: #ff6a00;
    stroke-width: 4px;
  }

  /* ==========================================================================
     3. БЛОК РОЗВ'ЯЗАННЯ ТА 4. БЛОК ВІДПОВІДІ (КРУПНИЙ ШРИФТ)
     ========================================================================== */
  .equation-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: clamp(29px, 2.85vw, 40px);
    font-weight: 900;
    color: #3d1803;
  }

  .answer-layout {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 12px;
  }
  .answer-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    font-size: clamp(25px, 2.45vw, 34px);
    font-weight: 900;
    color: #3b2004;
    flex: 1;
    justify-content: center;
  }

  /* Велика кнопка перевірки у вигляді смарагдового кристала з галочкою */
  #check-btn {
    width: 82px;
    height: 82px;
    border-radius: 24px;
    border: 4px solid #194d09;
    background: radial-gradient(circle at 35% 25%, #a8ff6b 0%, #4ec918 65%, #267804 100%);
    box-shadow: 0 6px 0 #123805, inset 0 3px 5px rgba(255,255,255,0.65);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.15s, filter 0.15s;
  }
  #check-btn:hover {
    transform: translateY(-3px) scale(1.06);
    filter: brightness(1.08);
  }
  #check-btn:active {
    transform: translateY(3px) scale(0.96);
    box-shadow: 0 2px 0 #123805;
  }
  #check-btn svg {
    width: 48px;
    height: 48px;
  }

  /* ==========================================================================
     СПЛИВАЮЧА ДЕРЕВ'ЯНА ПАНЕЛЬ ВИБОРУ ЧИСЕЛ, ПИТАННЯ ТА ЗНАКІВ
     ========================================================================== */
  #picker-popover {
    position: fixed;
    z-index: 40;
    background: linear-gradient(180deg, #f5cf87 0%, #d99b43 100%);
    border: 4px solid #5c3008;
    border-radius: 24px;
    padding: 12px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.45), 0 6px 0 #3b1d03, inset 0 2px 3px rgba(255,245,215,0.7);
    display: none;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    max-width: 440px;
  }
  .picker-item {
    min-width: 64px;
    height: 60px;
    padding: 0 14px;
    border-radius: 14px;
    border: 3px solid #663508;
    background: linear-gradient(180deg, #fff1c2 0%, #f0be67 100%);
    box-shadow: 0 4px 0 #422103;
    font-size: 28px;
    font-weight: 900;
    color: #381802;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    transition: transform 0.12s, filter 0.12s;
  }
  .picker-item:hover {
    transform: translateY(-2px) scale(1.06);
    filter: brightness(1.08);
    background: linear-gradient(180deg, #ffffd8 0%, #ffd27d 100%);
  }
  .picker-item:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #422103;
  }

  /* Анімації фонових хмар та дерев */
  .cloud-drift-1 { animation: drift1 38s linear infinite alternate; }
  .cloud-drift-2 { animation: drift2 46s linear infinite alternate; }
  @keyframes drift1 { from { transform: translateX(-30px); } to { transform: translateX(60px); } }
  @keyframes drift2 { from { transform: translateX(40px); } to { transform: translateX(-50px); } }
  .tree-sway { transform-origin: bottom center; animation: swayTree 5s ease-in-out infinite alternate; }
  @keyframes swayTree { from { transform: rotate(-1.2deg); } to { transform: rotate(1.5deg); } }
</style>
</head>
<body>

<!-- ==========================================================================
     ЖИВИЙ СЮЖЕТНИЙ SVG-ФОН: СОНЯЧНА ЛІСОВА ГАЛЯВИНА ТА ДЕРЕВ'ЯНА МАЙСТЕРНЯ
     ========================================================================== -->
<svg id="scene-bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ec6ff"/>
      <stop offset="55%" stop-color="#b6ebff"/>
      <stop offset="100%" stop-color="#e8f7c5"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#76bd68"/>
      <stop offset="100%" stop-color="#45873b"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">

<script>
/* ============================================================================
   1. АУДІО-РУШІЙ (WEB AUDIO API): АКТИВНІ ЗВУКОВІ ФІДБЕКИ БЕЗ СЛІВ
   ============================================================================ */
const SoundFX = (() => {
  let ctx = null;
  function init() {
    if (!ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      ctx = new AudioCtx();
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function pop(freq = 520) {
    init();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.45, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.22, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.09);
  }

  function slide(up = true) {
    init();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(up ? 330 : 540, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(up ? 620 : 310, ctx.currentTime + 0.14);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  }

  function sparkle() {
    init();
    const notes = [587.33, 783.99, 987.77, 1174.66];
    notes.forEach((f, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      const t = ctx.currentTime + idx * 0.055;
      osc.frequency.setValueAtTime(f, t);
      gain.gain.setValueAtTime(0.16, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.23);
    });
  }

  function winFanfare() {
    init();
    const melodies = [
      [523.25, 659.25, 783.99, 1046.50, 1318.51],
      [440.00, 554.37, 659.25, 880.00, 1108.73],
      [587.33, 739.99, 880.00, 1174.66, 1479.98]
    ];
    const seq = melodies[Math.floor(Math.random() * melodies.length)];
    seq.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = i % 2 === 0 ? 'triangle' : 'sine';
      const start = ctx.currentTime + i * 0.09;
      const dur = i === seq.length - 1 ? 0.45 : 0.18;
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.26, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + dur + 0.02);
    });
  }

  function errorBoing() {
    init();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    const now = ctx.currentTime;
    osc.frequency.setValueAtTime(240, now);
    osc.frequency.linearRampToValueAtTime(140, now + 0.18);
    osc.frequency.linearRampToValueAtTime(195, now + 0.28);
    osc.frequency.linearRampToValueAtTime(115, now + 0.45);
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.46);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.47);
  }

  return { pop, slide, sparkle, winFanfare, errorBoing };
})();

// Завдяки відстані 280px між коротким (260) і довгим (540) та окремому ярусу по Y, нічого ніколи не налізає!

let userState = {};

function getExpectedValues(task) {
  if (task.taskType === 'diff') {
    const big = Math.max(task.val1, task.val2);
    const small = Math.min(task.val1, task.val2);
    return {
      condVal1: task.val1,
      condVal2: task.val2,
      condQ: '?',
      condSign: task.qSign,
      schemeVal1: task.val1,
      schemeVal2: task.val2,
      schemeDiff: '?',
      solNum1: big,
      solOp: '-',
      solNum2: small,
      solRes: task.diffVal,
      ansNum: task.diffVal,
      ansWord: task.ansWord
    };
  } else {
    // Задачі на знаходження невідомого числа ("на K менше" або "на K більше")
    const op = task.qSign === '>' ? '+' : '-';
    return {
      condVal1: task.val1,
      condVal2: '?',
      condQ: task.diffVal,
      condSign: task.qSign,
      schemeVal1: task.val1,
      schemeVal2: '?',
      schemeDiff: task.diffVal,
      solNum1: task.val1,
      solOp: op,
      solNum2: task.diffVal,
      solRes: task.val2,
      ansNum: task.val2,
      ansWord: task.ansWord
    };
  }
}

  const wrap = document.getElementById('level-dots');
  wrap.innerHTML = '';

    gem.className = 'lvl-gem' + (idx === currentLevel ? ' active' : '');

    gem.addEventListener('click', () => {

// Формування шляху фігурної дужки між x1 та x2
function makeHorizontalBrace(x1, x2, y, dir = -1) {
  const mid = (x1 + x2) / 2;
  const h = 10 * dir;
  return `M ${x1} ${y} Q ${x1} ${y + h} ${x1 + 14} ${y + h} L ${mid - 10} ${y + h} Q ${mid} ${y + h} ${mid} ${y + h * 1.6} Q ${mid} ${y + h} ${mid + 10} ${y + h} L ${x2 - 14} ${y + h} Q ${x2} ${y + h} ${x2} ${y}`;
}

// Оновлення інтерактивної SVG-схеми з чітким рознесенням по вертикальних ярусах
function updateSchemeSVG() {
  const task = TASKS[currentLevel];
  const exp = getExpectedValues(task);
  const xStart = 95;

  const x1 = SEG_STOPS[userState.seg1Stop];
  const x2 = SEG_STOPS[userState.seg2Stop];

  document.getElementById('svg-lbl-1').textContent = task.lbl1;
  document.getElementById('svg-lbl-2').textContent = task.lbl2;

  // ВЕРХНІЙ ВІДРІЗОК (Y = 82)
  document.getElementById('svg-seg-1').setAttribute('x2', x1);
  document.getElementById('handle-seg-1').setAttribute('transform', `translate(${x1}, 82)`);
  document.getElementById('svg-brace-1').setAttribute('d', makeHorizontalBrace(xStart, x1, 68, -1));
  const mid1 = (xStart + x1) / 2;
  document.getElementById('svg-slot-val1').setAttribute('transform', `translate(${mid1}, 4)`);
  const txt1 = document.getElementById('svg-txt-val1');
  txt1.textContent = userState.schemeVal1 !== null ? userState.schemeVal1 : (task.isSample ? exp.schemeVal1 : '...');
  txt1.setAttribute('fill', userState.schemeVal1 !== null ? '#3b1c03' : 'rgba(120,68,14,0.42)');

  // НИЖНІЙ ВІДРІЗОК (Y = 208)
  document.getElementById('svg-seg-2').setAttribute('x2', x2);
  document.getElementById('handle-seg-2').setAttribute('transform', `translate(${x2}, 208)`);
  document.getElementById('svg-brace-2').setAttribute('d', makeHorizontalBrace(xStart, x2, 222, 1));
  const mid2 = (xStart + x2) / 2;
  document.getElementById('svg-slot-val2').setAttribute('transform', `translate(${mid2}, 240)`);
  const txt2 = document.getElementById('svg-txt-val2');
  txt2.textContent = userState.schemeVal2 !== null ? userState.schemeVal2 : (task.isSample ? exp.schemeVal2 : '...');
  txt2.setAttribute('fill', userState.schemeVal2 !== null ? '#3b1c03' : 'rgba(120,68,14,0.42)');

  // СЕРЕДНІЙ ЯРУС: ПУНКТИР ТА ДУЖКА РІЗНИЦІ (строго у коридорі Y = 98..192, плашка на Y = 145)
  const diffGroup = document.getElementById('svg-diff-group');
  const dashLine = document.getElementById('svg-dash-line');
  const diffBrace = document.getElementById('svg-diff-brace');
  const diffSlot = document.getElementById('svg-slot-diff');

  if (x1 === x2) {
    diffGroup.style.opacity = '0.5';
    dashLine.setAttribute('x1', x1);
    dashLine.setAttribute('x2', x1);
    diffBrace.setAttribute('d', '');
    diffSlot.setAttribute('transform', `translate(${Math.min(x1 + 95, 555)}, 145)`);
  } else {
    diffGroup.style.opacity = '1';
    const xShort = Math.min(x1, x2);
    const xLong = Math.max(x1, x2);
    dashLine.setAttribute('x1', xShort);
    dashLine.setAttribute('x2', xShort);

    const isTopLonger = x1 > x2;
    // Якщо довший верхній відрізок — дужка під ним (Y=98), якщо нижній — над нижнім (Y=192)
    // А сама плашка "на ..." завжди рівно посередині (Y=145), де вона не перетинає жодної лінії чи ручки!
    const braceY = isTopLonger ? 98 : 192;
    const dir = isTopLonger ? 1 : -1;
    diffBrace.setAttribute('d', makeHorizontalBrace(xShort, xLong, braceY, dir));

    const midDiff = (xShort + xLong) / 2;
    diffSlot.setAttribute('transform', `translate(${midDiff}, 145)`);
  }

  const diffTxt = document.getElementById('svg-txt-diff');
  const shownDiff = userState.schemeDiff !== null ? userState.schemeDiff : (task.isSample ? exp.schemeDiff : '...');
  diffTxt.textContent = `на ${shownDiff}`;
  diffTxt.setAttribute('fill', userState.schemeDiff !== null ? '#6e1800' : 'rgba(120,45,10,0.45)');
}

const popover = document.getElementById('picker-popover');

function openPickerForSlot(slotKey, anchorEl, options) {
  activeSlotKey = slotKey;
  document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('active-slot'));
  if (anchorEl.classList && anchorEl.classList.contains('slot-btn')) {
    anchorEl.classList.add('active-slot');
  }

  popover.innerHTML = '';
  const cols = options.some(o => String(o).length > 4) ? 2 : Math.min(options.length, 5);
  popover.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  options.forEach(opt => {
    const item = document.createElement('button');
    item.className = 'picker-item';
    item.textContent = opt;
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      SoundFX.pop(660);
      userState[slotKey] = opt;
      updateAllSlotsUI();
      updateSchemeSVG();
      hidePicker();
      foxReact('nod');
    });
    popover.appendChild(item);
  });

  popover.style.display = 'grid';
  const rect = anchorEl.getBoundingClientRect();
  const popRect = popover.getBoundingClientRect();

  let left = rect.left + rect.width / 2 - popRect.width / 2;
  let top = rect.bottom + 10;
  if (top + popRect.height > window.innerHeight - 12) {
    top = rect.top - popRect.height - 10;
  }
  left = Math.max(12, Math.min(left, window.innerWidth - popRect.width - 12));

  popover.style.left = `${left}px`;
  popover.style.top = `${top}px`;
}

function hidePicker() {
  popover.style.display = 'none';
  activeSlotKey = null;
  document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('active-slot'));
}

// Формування списку чисел для вибору (разом зі знаком '?' для умови та схеми)
function getNumberChoices(includeQuestionMark = false) {
  const t = TASKS[currentLevel];
  const sum = t.val1 + t.val2;
  const set = new Set([t.val1, t.val2, t.diffVal]);
  const minN = Math.max(1, Math.min(t.val1, t.val2, t.diffVal) - 2);
  const maxN = Math.max(t.val1, t.val2, t.diffVal) + 2;
  for (let n = minN; n <= maxN; n++) {
    if (set.size < 9) set.add(n);
  }
  if (sum <= 25 && set.size < 9) set.add(sum);
  const nums = Array.from(set).sort((a, b) => a - b);
  return includeQuestionMark ? ['?', ...nums] : nums;
}

// Перетягування та клік по ручках зміни довжини відрізків у схемі
// При кліку відрізок перемикається між Коротким (індекс 0 -> 260px) та Довгим (індекс 2 -> 540px)
function setupSegmentHandle(handleId, stateKey) {
  const handle = document.getElementById(handleId);
  let dragging = false;
  let moved = false;

  handle.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    dragging = true;
    moved = false;
    handle.setPointerCapture(e.pointerId);
  });

  handle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const svg = document.getElementById('scheme-svg');
    const pt = svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    const cursor = pt.matrixTransform(svg.getScreenCTM().inverse());

    // При перетягуванні примагнічуємо до Короткого (0) або Довгого (2) відрізка
    const bestIdx = cursor.x < 400 ? 0 : 2;
    if (userState[stateKey] !== bestIdx) {
      moved = true;
      userState[stateKey] = bestIdx;
      SoundFX.slide(bestIdx === 2);
      updateSchemeSVG();
    }
  });

  handle.addEventListener('pointerup', (e) => {
    if (!dragging) return;
    dragging = false;
    handle.releasePointerCapture(e.pointerId);
    if (!moved) {
      // Якщо це був просто клік — перемикаємо між Коротким (0) та Довгим (2)
      userState[stateKey] = userState[stateKey] === 2 ? 0 : 2;
      SoundFX.slide(userState[stateKey] === 2);
      updateSchemeSVG();
    }
  });
}

   ============================================================================ */
document.getElementById('check-btn').addEventListener('click', () => {
  const t = TASKS[currentLevel];
  const exp = getExpectedValues(t);

  // Для дії додавання дозволяємо переставний закон (наприклад, 8 + 5 або 5 + 8)
  const isAddCommutativeOk = (exp.solOp === '+') &&
    ((userState.solNum1 === exp.solNum1 && userState.solNum2 === exp.solNum2) ||
     (userState.solNum1 === exp.solNum2 && userState.solNum2 === exp.solNum1));

  const checks = {
    condVal1: userState.condVal1 === exp.condVal1,
    condVal2: userState.condVal2 === exp.condVal2,
    condQ: userState.condQ === exp.condQ,
    condSign: userState.condSign === exp.condSign,
    solNum1: exp.solOp === '+' ? isAddCommutativeOk : (userState.solNum1 === exp.solNum1),
    solOp: userState.solOp === exp.solOp,
    solNum2: exp.solOp === '+' ? isAddCommutativeOk : (userState.solNum2 === exp.solNum2),
    solRes: userState.solRes === exp.solRes,
    ansNum: userState.ansNum === exp.ansNum,
    ansWord: userState.ansWord === exp.ansWord
  };

  let allCorrect = true;

  document.querySelectorAll('.slot-btn').forEach(btn => {
    const key = btn.dataset.slot;
    btn.classList.remove('slot-correct', 'slot-wrong');
    if (checks[key]) {
      btn.classList.add('slot-correct');
    } else {
      btn.classList.add('slot-wrong');
      allCorrect = false;
    }
  });

  // Перевірка схеми:
  // 1) Значення у дужках відрізків та дужці різниці мають збігатися з умовою
  // 2) Довжина відрізків має відповідати співвідношенню величин
  const schemeSlotsOk = (
    userState.schemeVal1 === exp.schemeVal1 &&
    userState.schemeVal2 === exp.schemeVal2 &&
    userState.schemeDiff === exp.schemeDiff
  );
  const schemeLengthsOk = (t.val1 > t.val2)
    ? (userState.seg1Stop > userState.seg2Stop)
    : (userState.seg2Stop > userState.seg1Stop);

  const schemeCard = document.getElementById('card-scheme');
  if (!schemeSlotsOk || !schemeLengthsOk) {
    allCorrect = false;
    schemeCard.classList.remove('slot-wrong');
    void schemeCard.offsetWidth;
    schemeCard.classList.add('slot-wrong');
    setTimeout(() => schemeCard.classList.remove('slot-wrong'), 600);
  }

  if (allCorrect) {
    SoundFX.winFanfare();
    foxReact('celebrate');
    launchCelebrationParticles();
  } else {
    SoundFX.errorBoing();
    foxReact('sad');
  }
});

/* ============================================================================

   ============================================================================ */
const fxCanvas = document.getElementById('fx-canvas');
const fxCtx = fxCanvas.getContext('2d');
let particles = [];

function resizeFxCanvas() {
  fxCanvas.width = window.innerWidth;
  fxCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeFxCanvas);
resizeFxCanvas();

function launchCelebrationParticles() {
  const colors = ['#ffd700', '#ff8c1a', '#76e038', '#ff4d6d', '#ffe866', '#4dd2ff'];
  for (let i = 0; i < 95; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 4 + Math.random() * 11;
    particles.push({
      x: fxCanvas.width * 0.55,
      y: fxCanvas.height * 0.5,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 4,
      size: 8 + Math.random() * 12,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.2,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 1,
      shape: i % 2 === 0 ? 'star' : 'leaf'
    });
  }
}

function updateParticles() {
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.24;
    p.rot += p.vRot;
    p.life -= 0.014;

    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    fxCtx.save();
    fxCtx.translate(p.x, p.y);
    fxCtx.rotate(p.rot);
    fxCtx.globalAlpha = Math.max(0, p.life);
    fxCtx.fillStyle = p.color;
    fxCtx.strokeStyle = '#4a2400';
    fxCtx.lineWidth = 1.5;

    if (p.shape === 'star') {
      fxCtx.beginPath();
      for (let s = 0; s < 5; s++) {
        const a1 = (s * 72) * Math.PI / 180;
        const a2 = ((s * 72) + 36) * Math.PI / 180;
        fxCtx.lineTo(Math.cos(a1) * p.size, Math.sin(a1) * p.size);
        fxCtx.lineTo(Math.cos(a2) * (p.size * 0.45), Math.sin(a2) * (p.size * 0.45));
      }
      fxCtx.closePath();
      fxCtx.fill();
      fxCtx.stroke();
    } else {
      fxCtx.beginPath();
      fxCtx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.stroke();
    }
    fxCtx.restore();
  }
  requestAnimationFrame(updateParticles);
}
requestAnimationFrame(updateParticles);

// Запуск першого рівня при старті
loadLevel(0);
</script>
