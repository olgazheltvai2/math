<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Тотожні вирази — Сонячна Галявина</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Nunito:wght@800;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #2f73b8;
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
    }

    /* Keyframe animations for living background & characters */
    @keyframes sunRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes cloudDrift1 {
      0% { transform: translateX(-15vw); }
      100% { transform: translateX(115vw); }
    }

    @keyframes cloudDrift2 {
      0% { transform: translateX(-25vw) scale(0.85); }
      100% { transform: translateX(115vw) scale(0.85); }
    }

    @keyframes treeSway {
      0%, 100% { transform: rotate(-1.6deg); }
      50% { transform: rotate(1.8deg); }
    }

    @keyframes flowerSway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(5deg); }
    }

    @keyframes windmillSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes charIdleLeft {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(0px, -5px) rotate(-1.2deg); }
    }

    @keyframes charIdleRight {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(0px, -6px) rotate(1.2deg); }
    }

    @keyframes bannerFloat {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(0px, -4px) scale(1.008); }
    }

    @keyframes armWaveLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-12deg); }
    }

    @keyframes armWaveRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(14deg); }
    }

    @keyframes catPeek {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      40% { transform: translate(0px, -5px) rotate(1.2deg); }
      75% { transform: translate(0px, -2px) rotate(-1.2deg); }
    }

    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }

    @keyframes charCelebrate {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      25% { transform: translate(0px, -22px) scale(1.04) rotate(-3deg); }
      50% { transform: translate(0px, -2px) scale(0.98) rotate(2deg); }
      75% { transform: translate(0px, -18px) scale(1.03) rotate(-2deg); }
    }

    @keyframes charShrug {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      20% { transform: translate(-7px, -3px) rotate(-3.5deg); }
      40% { transform: translate(7px, -3px) rotate(3.5deg); }
      60% { transform: translate(-5px, -1px) rotate(-2deg); }
      80% { transform: translate(5px, -1px) rotate(2deg); }
    }

    @keyframes emotionPop {
      0% { transform: scale(0.86); }
      55% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes plaqueWrongShake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      18% { transform: translateX(-14px) rotate(-3.5deg); }
      36% { transform: translateX(13px) rotate(3.5deg); }
      54% { transform: translateX(-10px) rotate(-2deg); }
      72% { transform: translateX(8px) rotate(2deg); }
      90% { transform: translateX(-4px) rotate(-1deg); }
    }

    @keyframes plaqueCorrectPop {
      0% { transform: scale(1); }
      35% { transform: scale(1.16) translateY(-10px); }
      70% { transform: scale(1.06) translateY(-6px); }
      100% { transform: scale(1.1) translateY(-8px); }
    }

    @keyframes sceneEnter {
      0% { opacity: 0; transform: scale(0.88) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .sun-rays {
      transform-origin: center;
      animation: sunRotate 70s linear infinite;
    }

    .windmill-blades {
      transform-origin: 0px 0px;
      animation: windmillSpin 14s linear infinite;
    }

    .tree-sway-1 {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: treeSway 5.5s ease-in-out infinite;
    }

    .tree-sway-2 {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: treeSway 6.8s ease-in-out infinite reverse;
    }

    .flower-sway {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: flowerSway 3.4s ease-in-out infinite;
    }

    /* CRITICAL FIX: Inner character body groups NEVER have SVG transform="translate(...)" attributes,
       so CSS animations never overwrite their meadow coordinates! */
    .char-left {
      transform-box: fill-box;
      transform-origin: 50% 95%;
      animation: charIdleLeft 3.2s ease-in-out infinite;
      cursor: pointer;
    }

    .char-right {
      transform-box: fill-box;
      transform-origin: 50% 95%;
      animation: charIdleRight 3.5s ease-in-out infinite;
      cursor: pointer;
    }

    .banner-group {
      transform-box: fill-box;
      transform-origin: center;
      animation: bannerFloat 3.8s ease-in-out infinite;
    }

    .cat-group {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: catPeek 4.2s ease-in-out infinite;
      cursor: pointer;
    }

    .face-pop {
      transform-box: fill-box;
      transform-origin: center;
      animation: emotionPop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .blink-eyes {
      transform-box: fill-box;
      transform-origin: center;
      animation: eyeBlink 4.2s infinite;
    }

    .blink-eyes-delayed {
      transform-box: fill-box;
      transform-origin: center;
      animation: eyeBlink 4.8s 1.4s infinite;
    }

    .wave-left {
      transform-box: fill-box;
      transform-origin: right center;
      animation: armWaveLeft 2.2s ease-in-out infinite;
    }

    .wave-right {
      transform-box: fill-box;
      transform-origin: left center;
      animation: armWaveRight 2.4s ease-in-out infinite;
    }

    .celebrate-anim .char-left,
    .celebrate-anim .char-right {
      animation: charCelebrate 0.65s ease-in-out infinite !important;
    }

    .shrug-anim .char-left,
    .shrug-anim .char-right {
      animation: charShrug 0.55s ease-in-out 1 !important;
    }

    .scene-enter {
      animation: sceneEnter 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Stylized Answer Plaques (No white rectangles!) */
    .answer-plaque {
      position: relative;
      cursor: pointer;
      transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.24s ease;
      filter: drop-shadow(0 10px 14px rgba(15, 38, 18, 0.32));
    }

    .answer-plaque:hover {
      transform: translateY(-9px) scale(1.055);
      filter: drop-shadow(0 16px 22px rgba(15, 38, 18, 0.4)) brightness(1.04);
    }

    .answer-plaque:active {
      transform: translateY(-2px) scale(0.98);
    }

    .answer-plaque.wrong-shake {
      animation: plaqueWrongShake 0.52s ease-in-out;
    }

    .answer-plaque.correct-pop {
      animation: plaqueCorrectPop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      filter: drop-shadow(0 0 26px rgba(255, 230, 80, 0.95));
      z-index: 30;
    }

    /* Minimalist Top-Right Controls */
    .control-btn {
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      filter: drop-shadow(0 6px 12px rgba(14, 42, 71, 0.35));
    }

    .control-btn:hover {
      transform: scale(1.1) translateY(-2px);
      filter: drop-shadow(0 10px 16px rgba(14, 42, 71, 0.45)) brightness(1.06);
    }

    .control-btn:active {
      transform: scale(0.94);
    }

    .math-text-main {
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      font-weight: 700;
      letter-spacing: 0.02em;
      fill: #071d36;
      filter: drop-shadow(0 2px 0px rgba(255, 255, 255, 0.65));
    }

    .math-text-option {
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">

  <!-- LIVING STORY BACKGROUND: SUNNY MEADOW & PARK (100% Custom SVG) -->
  <svg id="meadow-bg" class="absolute inset-0 w-full h-full object-cover pointer-events-none" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Sky Gradient -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2c6eb5" />
        <stop offset="38%" stop-color="#4790d6" />
        <stop offset="72%" stop-color="#7ec0f2" />
        <stop offset="100%" stop-color="#c9ecff" />
      </linearGradient>

      <!-- Sun Glow -->
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff8b8" stop-opacity="1" />
        <stop offset="35%" stop-color="#ffe26a" stop-opacity="0.75" />
        <stop offset="70%" stop-color="#ffd042" stop-opacity="0.22" />
        <stop offset="100%" stop-color="#ffd042" stop-opacity="0" />
      </radialGradient>

      <!-- Distant Hills Gradients -->
      <linearGradient id="farHillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#86cf7e" />
        <stop offset="100%" stop-color="#539e57" />
      </linearGradient>

      <linearGradient id="midHillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#9be06c" />
        <stop offset="100%" stop-color="#5cad46" />
      </linearGradient>

      <linearGradient id="nearMeadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ade868" />
        <stop offset="45%" stop-color="#76c442" />
        <stop offset="100%" stop-color="#3f8f29" />
      </linearGradient>

      <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f5deb3" />
        <stop offset="50%" stop-color="#e3be82" />
        <stop offset="100%" stop-color="#c99b59" />
      </linearGradient>

      <!-- Tree Foliage Gradients -->
      <radialGradient id="foliageLight" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#b6f065" />
        <stop offset="55%" stop-color="#6bbd35" />
        <stop offset="100%" stop-color="#3d8519" />
      </radialGradient>

      <radialGradient id="foliageWarm" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#d2f261" />
        <stop offset="55%" stop-color="#83c938" />
        <stop offset="100%" stop-color="#488f1c" />
      </radialGradient>
    </defs>

    <!-- Sky Base -->
    <rect width="1920" height="1080" fill="url(#skyGrad)" />

    <!-- Animated Sun & Sunbeams in Top-Left Sky -->
    <g transform="translate(230, 145)">
      <circle cx="0" cy="0" r="240" fill="url(#sunGlow)" />
      <g class="sun-rays" opacity="0.28">
        <polygon points="0,0 -28,-380 28,-380" fill="#fff7b2" />
        <polygon points="0,0 -28,-380 28,-380" fill="#fff7b2" transform="rotate(30)" />
        <polygon points="0,0 -28,-380 28,-380" fill="#fff7b2" transform="rotate(60)" />
        <polygon points="0,0 -28,-380 28,-380" fill="#fff7b2" transform="rotate(90)" />
        <polygon points="0,0 -28,-380 28,-380" fill="#fff7b2" transform="rotate(120)" />
        <polygon points="0,0 -28,-380 28,-380" fill="#fff7b2" transform="rotate(150)" />
        <polygon points="0,0 -28,-380 28,-380" fill="#fff7b2" transform="rotate(180)" />
        <polygon points="0,0 -28,-380 28,-380" fill="#fff7b2" transform="rotate(210)" />
        <polygon points="0,0 -28,-380 28,-380" fill="#fff7b2" transform="rotate(240)" />
        <polygon points="0,0 -28,-380 28,-380" fill="#fff7b2" transform="rotate(270)" />
        <polygon points="0,0 -28,-380 28,-380" fill="#fff7b2" transform="rotate(300)" />
        <polygon points="0,0 -28,-380 28,-380" fill="#fff7b2" transform="rotate(330)" />
      </g>
      <circle cx="0" cy="0" r="64" fill="#fff6a1" />
      <circle cx="-12" cy="-12" r="48" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Soft Fluffy Clouds -->
    <g opacity="0.88" style="animation: cloudDrift1 95s linear infinite;">
      <g transform="translate(150, 95)">
        <ellipse cx="0" cy="20" rx="85" ry="32" fill="#e6f5ff" />
        <circle cx="-35" cy="5" r="42" fill="#ffffff" />
        <circle cx="15" cy="-8" r="52" fill="#ffffff" />
        <circle cx="60" cy="10" r="36" fill="#f2faff" />
      </g>
    </g>

    <g opacity="0.82" style="animation: cloudDrift2 125s -45s linear infinite;">
      <g transform="translate(800, 130)">
        <ellipse cx="0" cy="24" rx="110" ry="36" fill="#e1f2ff" />
        <circle cx="-48" cy="6" r="46" fill="#ffffff" />
        <circle cx="8" cy="-10" r="58" fill="#ffffff" />
        <circle cx="65" cy="8" r="42" fill="#f5fbff" />
      </g>
    </g>

    <g opacity="0.75" style="animation: cloudDrift1 110s -80s linear infinite;">
      <g transform="translate(420, 65) scale(0.75)">
        <ellipse cx="0" cy="20" rx="95" ry="30" fill="#e8f6ff" />
        <circle cx="-30" cy="2" r="40" fill="#ffffff" />
        <circle cx="22" cy="-6" r="48" fill="#ffffff" />
        <circle cx="64" cy="10" r="34" fill="#ffffff" />
      </g>
    </g>

    <!-- Distant Rolling Hills -->
    <path d="M-100,660 Q320,490 780,600 T1620,560 Q1820,540 2020,620 L2020,1080 L-100,1080 Z" fill="url(#farHillGrad)" />

    <!-- Charming Countryside Windmill on Distant Right Hill -->
    <g transform="translate(1615, 445)">
      <!-- Mill Body -->
      <polygon points="-26,125 -15,0 15,0 26,125" fill="#d98245" stroke="#7d4118" stroke-width="3" />
      <path d="M-18,0 Q0,-26 18,0 Z" fill="#a8382b" stroke="#691c14" stroke-width="3" />
      <rect x="-8" y="32" width="16" height="22" rx="8" fill="#4f2912" stroke="#f7d69c" stroke-width="2" />
      <path d="M-10,125 L-10,92 Q0,82 10,92 L10,125 Z" fill="#5e3114" />
      <!-- Spinning Sails -->
      <g transform="translate(0, 12)">
        <g class="windmill-blades">
          <line x1="-78" y1="0" x2="78" y2="0" stroke="#5e3114" stroke-width="4" />
          <line x1="0" y1="-78" x2="0" y2="78" stroke="#5e3114" stroke-width="4" />
          <rect x="10" y="-14" width="62" height="14" rx="2" fill="#fff3d1" stroke="#8c5327" stroke-width="2" />
          <rect x="-72" y="0" width="62" height="14" rx="2" fill="#fff3d1" stroke="#8c5327" stroke-width="2" />
          <rect x="0" y="10" width="14" height="62" rx="2" fill="#fff3d1" stroke="#8c5327" stroke-width="2" />
          <rect x="-14" y="-72" width="14" height="62" rx="2" fill="#fff3d1" stroke="#8c5327" stroke-width="2" />
          <circle cx="0" cy="0" r="8" fill="#f7c14d" stroke="#5e3114" stroke-width="3" />
        </g>
      </g>
    </g>

    <!-- Midground Sunlit Hills -->
    <path d="M-120,700 Q260,560 660,670 T1460,640 Q1760,610 2040,690 L2040,1080 L-120,1080 Z" fill="url(#midHillGrad)" />

    <!-- Winding Country Meadow Path -->
    <path d="M960,665 Q1080,735 910,835 Q740,940 880,1080 L1180,1080 Q1010,930 1120,825 Q1210,735 1030,665 Z" fill="url(#pathGrad)" opacity="0.65" />

    <!-- Foreground Main Meadow Lawn -->
    <path d="M-100,770 Q480,660 980,730 T2020,740 L2020,1080 L-100,1080 Z" fill="url(#nearMeadowGrad)" />

    <!-- Left Deciduous Park Tree (Static Anchor + Animated Inner Group) -->
    <g transform="translate(155, 695)">
      <g class="tree-sway-1">
        <!-- Trunk & Branches -->
        <path d="M-24,60 Q-16,-40 -10,-150 L14,-150 Q18,-40 28,60 Z" fill="#7c4b27" />
        <path d="M-6,-95 Q-55,-140 -85,-185" stroke="#7c4b27" stroke-width="14" stroke-linecap="round" fill="none" />
        <path d="M8,-110 Q55,-155 78,-195" stroke="#7c4b27" stroke-width="12" stroke-linecap="round" fill="none" />
        <!-- Lush Canopy -->
        <circle cx="-75" cy="-195" r="78" fill="url(#foliageLight)" />
        <circle cx="72" cy="-200" r="74" fill="url(#foliageLight)" />
        <circle cx="0" cy="-255" r="96" fill="url(#foliageWarm)" />
        <circle cx="-48" cy="-145" r="65" fill="url(#foliageWarm)" />
        <circle cx="48" cy="-145" r="65" fill="url(#foliageLight)" />
        <!-- Red Apples on Left Tree -->
        <circle cx="-68" cy="-175" r="9" fill="#e83b3b" />
        <circle cx="-22" cy="-235" r="10" fill="#e83b3b" />
        <circle cx="45" cy="-185" r="9" fill="#e83b3b" />
        <circle cx="15" cy="-145" r="8.5" fill="#e83b3b" />
      </g>
    </g>

    <!-- Right Deciduous Park Tree (Static Anchor + Animated Inner Group) -->
    <g transform="translate(1785, 720)">
      <g class="tree-sway-2">
        <path d="M-22,55 Q-14,-40 -8,-140 L12,-140 Q16,-40 24,55 Z" fill="#754522" />
        <circle cx="-65" cy="-180" r="72" fill="url(#foliageWarm)" />
        <circle cx="58" cy="-185" r="68" fill="url(#foliageLight)" />
        <circle cx="-5" cy="-235" r="88" fill="url(#foliageLight)" />
        <circle cx="-35" cy="-135" r="62" fill="url(#foliageLight)" />
        <circle cx="42" cy="-135" r="58" fill="url(#foliageWarm)" />
      </g>
    </g>

    <!-- Decorative Wooden Park Fence on Distant Slope -->
    <g transform="translate(260, 625)" opacity="0.85">
      <rect x="0" y="14" width="210" height="7" rx="3" fill="#d9a166" stroke="#8c5828" stroke-width="1.5" />
      <rect x="0" y="32" width="210" height="7" rx="3" fill="#d9a166" stroke="#8c5828" stroke-width="1.5" />
      <path d="M12,50 L12,6 L18,0 L24,6 L24,50 Z" fill="#edd6ff" fill-opacity="0" />
      <rect x="14" y="2" width="12" height="48" rx="4" fill="#e8b882" stroke="#8c5828" stroke-width="1.5" />
      <rect x="60" y="2" width="12" height="48" rx="4" fill="#e8b882" stroke="#8c5828" stroke-width="1.5" />
      <rect x="106" y="2" width="12" height="48" rx="4" fill="#e8b882" stroke="#8c5828" stroke-width="1.5" />
      <rect x="152" y="2" width="12" height="48" rx="4" fill="#e8b882" stroke="#8c5828" stroke-width="1.5" />
      <rect x="192" y="2" width="12" height="48" rx="4" fill="#e8b882" stroke="#8c5828" stroke-width="1.5" />
    </g>

    <!-- Foreground Meadow Bushes & Swaying Wildflowers -->
    <g transform="translate(80, 740)">
      <ellipse cx="40" cy="20" rx="65" ry="34" fill="#4ea32a" />
      <ellipse cx="95" cy="26" rx="52" ry="28" fill="#64bd38" />
      <circle cx="25" cy="12" r="6" fill="#ff6b8b" />
      <circle cx="58" cy="6" r="7" fill="#ffd93d" />
      <circle cx="92" cy="18" r="6" fill="#ff6b8b" />
    </g>

    <g transform="translate(1660, 745)">
      <ellipse cx="50" cy="20" rx="70" ry="35" fill="#4ea32a" />
      <ellipse cx="0" cy="26" rx="55" ry="28" fill="#64bd38" />
      <circle cx="10" cy="18" r="6.5" fill="#ffd93d" />
      <circle cx="48" cy="10" r="7" fill="#ff7597" />
      <circle cx="80" cy="22" r="6" fill="#ffd93d" />
    </g>

    <!-- Swaying Meadow Flowers Across Foreground (Static Anchor + Animated Inner Group) -->
    <g transform="translate(310, 815)">
      <g class="flower-sway">
        <path d="M0,0 Q-6,-22 -2,-42" stroke="#397d1d" stroke-width="3.5" fill="none" />
        <circle cx="-2" cy="-42" r="11" fill="#ff5c77" />
        <circle cx="-2" cy="-42" r="4.5" fill="#ffe14d" />
      </g>
    </g>

    <g transform="translate(460, 785)">
      <g class="flower-sway">
        <path d="M0,0 Q5,-18 2,-34" stroke="#397d1d" stroke-width="3" fill="none" />
        <circle cx="2" cy="-34" r="9" fill="#fff7d6" />
        <circle cx="2" cy="-34" r="4" fill="#ffae00" />
      </g>
    </g>

    <g transform="translate(1470, 805)">
      <g class="flower-sway">
        <path d="M0,0 Q-5,-20 -2,-38" stroke="#397d1d" stroke-width="3.5" fill="none" />
        <circle cx="-2" cy="-38" r="10" fill="#68b5ff" />
        <circle cx="-2" cy="-38" r="4.5" fill="#ffe14d" />
      </g>
    </g>

    <g transform="translate(1590, 835)">
      <g class="flower-sway">
        <path d="M0,0 Q6,-18 3,-35" stroke="#397d1d" stroke-width="3" fill="none" />
        <circle cx="3" cy="-35" r="10" fill="#ff7597" />
        <circle cx="3" cy="-35" r="4" fill="#fff078" />
      </g>
    </g>
  </svg>

  <!-- AMBIENT & CELEBRATION CANVAS (Butterflies, Floating Petals, Confetti, Starbursts) -->
  <canvas id="fx-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-20"></canvas>

  <!-- MINIMALIST TOP-RIGHT CONTROLS (Sound Toggle + Immediate "Next" Button) -->
  <div class="fixed top-4 right-4 sm:top-6 sm:right-7 z-40 flex items-center gap-3 sm:gap-4">
    <!-- Sound Toggle Icon Button -->
    <button id="sound-btn" aria-label="Sound" class="control-btn w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center focus:outline-none">

  <!-- MAIN INTERACTIVE STAGE (Full Widescreen 16:9 Layout) -->
  <main class="relative z-10 w-full h-full flex flex-col justify-between items-center px-3 sm:px-8 pt-2 pb-4 sm:pb-7">

    <!-- UPPER / CENTER STAGE: 4 ROTATING CHARACTER SCENES WITH STITCHED BANNERS (NO WHITE RECTANGLES!) -->
    <div id="scene-stage" class="relative w-full flex-1 flex items-center justify-center max-h-[68vh] min-h-[260px]">
      <!-- Dynamically populated with one of the 4 detailed animated character scenes -->
    </div>

    <!-- BOTTOM STAGE: 4 STYLIZED COLORFUL PATTERNED PLAQUES FOR THE 4 EXPRESSIONS -->
    <div id="options-container" class="w-full max-w-[1520px] grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-5 md:gap-7 px-2 sm:px-6 z-30">
      <!-- Dynamically populated with 4 tactile patterned plaques -->
    </div>

  </main>

  <script>
    /*************************************************************************
     * 1. WEB AUDIO API SYNTHESIZER (Rich, Active, Non-Verbal Musical Feedbacks)
     *************************************************************************/
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.init();
        this.muted = !this.muted;
        return this.muted;
      }

      playTone(freq, type, duration, startTime = 0, volume = 0.18, slideTo = null) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime + startTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
        }

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      playHover() {
        this.playTone(587.33, 'sine', 0.06, 0, 0.05, 659.25);
      }

      playEmotionPop() {
        const notes = [523.25, 587.33, 659.25, 783.99, 880];
        const f = notes[Math.floor(Math.random() * notes.length)];
        this.playTone(f, 'sine', 0.09, 0, 0.09, f * 1.18);
      }

      playSkip() {
        this.playTone(392.00, 'triangle', 0.09, 0, 0.12, 523.25);
        this.playTone(523.25, 'triangle', 0.12, 0.06, 0.14, 783.99);
      }

      playWrong() {
        // Playful springy boing / wooden clack (non-harsh, bouncy feedback)
        this.playTone(240, 'triangle', 0.18, 0, 0.22, 145);
        this.playTone(195, 'sine', 0.24, 0.09, 0.20, 120);
        this.playTone(310, 'sine', 0.08, 0.02, 0.09, 160);
      }

      playWinVariant(variantIndex) {
        if (this.muted) return;
        this.init();

        const v = variantIndex % 4;
        if (v === 0) {
          // Variant 0: Bright Marimba & Bell Fanfare
          const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
          notes.forEach((f, i) => {
            this.playTone(f, 'triangle', 0.28, i * 0.075, 0.2);
            this.playTone(f * 2, 'sine', 0.18, i * 0.075, 0.07);
          });
        } else if (v === 1) {
          // Variant 1: Magical Harp Glissando
          const scale = [440, 493.88, 554.37, 659.25, 739.99, 880, 987.77, 1108.73, 1318.51];
          scale.forEach((f, i) => {
            this.playTone(f, 'sine', 0.36, i * 0.055, 0.16);
          });
        } else if (v === 2) {
          // Variant 2: Joyful Meadow Brass / Flute Chord Melody
          const melody = [
            { f: 587.33, t: 0, d: 0.14 },
            { f: 739.99, t: 0.11, d: 0.14 },
            { f: 880.00, t: 0.22, d: 0.14 },
            { f: 1174.66, t: 0.34, d: 0.42 },
            { f: 880.00, t: 0.34, d: 0.42 }
          ];
          melody.forEach(n => {
            this.playTone(n.f, 'triangle', n.d, n.t, 0.18);
          });
        } else {
          // Variant 3: Bubbly Xylophone Cascade
          const cascade = [659.25, 783.99, 987.77, 1174.66, 1318.51, 1567.98];
          cascade.forEach((f, i) => {
            this.playTone(f, 'sine', 0.22, i * 0.065, 0.18, f * 1.05);
          });
        }
      }
    }

    const sound = new SoundEngine();

    /*************************************************************************
     * 2. INFINITE MATH GENERATOR (Equivalent Expressions / Тотожні Вирази)
     *    - Strictly 1 correct answer out of 4 options.
     *    - Options always feature a rich mix of +, −, ×, :
     *    - First 4 tasks showcase the 4 iconic reference examples (with shuffled options),
     *      followed by an infinite stream of unique procedural tasks!
     *************************************************************************/
    const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Create an expression of a specific operation type that evaluates to targetVal
    function buildExprForValue(targetVal, opType, forbidText = '') {
      for (let attempt = 0; attempt < 40; attempt++) {
        let text = '';
        if (opType === '+') {
          if (targetVal < 4) continue;
          const a = randInt(2, targetVal - 2);
          const b = targetVal - a;
          text = `${a} + ${b}`;
        } else if (opType === '−') {
          // Can use 2-digit or 3-digit subtraction like 53 − 23 or 200 − 146
          const useThreeDigit = targetVal >= 35 && Math.random() < 0.45;
          const b = useThreeDigit ? randInt(45, 155) : randInt(7, 45);
          const a = targetVal + b;
          text = `${a} − ${b}`;
        } else if (opType === '×') {
          // Find factor pairs in 2..10
          const pairs = [];
          for (let f1 = 2; f1 <= 10; f1++) {
            if (targetVal % f1 === 0) {
              const f2 = targetVal / f1;
              if (f2 >= 2 && f2 <= 10) {
                pairs.push([f1, f2]);
              }
            }
          }
          if (pairs.length === 0) return null;
          const [f1, f2] = pairs[randInt(0, pairs.length - 1)];
          text = `${f1} × ${f2}`;
        } else if (opType === ':') {
          if (targetVal > 10 || targetVal < 2) return null;
          const divisor = randInt(2, 9);
          const dividend = targetVal * divisor;
          text = `${dividend} : ${divisor}`;
        }

        if (text && text !== forbidText) {
          return { text, val: targetVal, op: opType };
        }
      }
      return null;
    }

    // Create a plausible distractor expression of opType whose value is NOT in usedValues
    function buildDistractorExpr(opType, usedValues) {
      for (let attempt = 0; attempt < 60; attempt++) {
        let a, b, val, text;
        if (opType === '+') {
          if (Math.random() < 0.25) {
            a = randInt(100, 160);
            b = randInt(15, 45);
          } else {
            a = randInt(12, 48);
            b = randInt(11, 45);
          }
          val = a + b;
          text = `${a} + ${b}`;
        } else if (opType === '−') {
          if (Math.random() < 0.3) {
            a = randInt(110, 200);
            b = randInt(80, a - 12);
          } else {
            a = randInt(35, 95);
            b = randInt(8, a - 8);
          }
          val = a - b;
          text = `${a} − ${b}`;
        } else if (opType === '×') {
          a = randInt(3, 9);
          b = randInt(3, 9);
          val = a * b;
          text = `${a} × ${b}`;
        } else if (opType === ':') {
          b = randInt(6, 9);
          val = randInt(4, 9);
          a = b * val;
          text = `${a} : ${b}`;
        }

        if (!usedValues.has(val)) {
          return { text, val, op: opType };
        }
      }
      // Fallback guaranteed unique
      let fallbackVal = 99;
      while (usedValues.has(fallbackVal)) fallbackVal++;
      return { text: `${fallbackVal - 10} + 10`, val: fallbackVal, op: '+' };
    }

    // Seed tasks from the 4 reference images so the experience immediately honors the teacher's examples,
    // followed by endless unique algorithmically generated tasks!
    const SEED_TASKS = [
      {
        sceneIndex: 0,
        mainText: '28 + 28',
        targetVal: 56,
        options: [
          { text: '8 × 7', val: 56, isCorrect: true },
          { text: '28 + 20', val: 48, isCorrect: false },
          { text: '53 − 23', val: 30, isCorrect: false },
          { text: '72 : 8', val: 9, isCorrect: false }
        ]
      },
      {
        sceneIndex: 1,
        mainText: '51 − 30',
        targetVal: 21,
        options: [
          { text: '81 : 9', val: 9, isCorrect: false },
          { text: '123 − 109', val: 14, isCorrect: false },
          { text: '155 + 20', val: 175, isCorrect: false },
          { text: '7 × 3', val: 21, isCorrect: true }
        ]
      },
      {
        sceneIndex: 2,
        mainText: '54 : 6',
        targetVal: 9,
        options: [
          { text: '56 : 8', val: 7, isCorrect: false },
          { text: '6 + 3', val: 9, isCorrect: true },
          { text: '5 × 9', val: 45, isCorrect: false },
          { text: '40 − 9', val: 31, isCorrect: false }
        ]
      },
      {
        sceneIndex: 3,
        mainText: '6 × 9',
        targetVal: 54,
        options: [
          { text: '63 : 9', val: 7, isCorrect: false },
          { text: '35 + 41', val: 76, isCorrect: false },
          { text: '200 − 146', val: 54, isCorrect: true },
          { text: '4 × 8', val: 32, isCorrect: false }
        ]
      }
    ];

    let roundCounter = 0;
    const recentMainTexts = new Set();

    function generateNextTask() {
      // First 4 tasks use the iconic reference tasks (with fresh option shuffling after round 0)
      if (roundCounter < SEED_TASKS.length) {
        const seed = SEED_TASKS[roundCounter];
        roundCounter++;
        recentMainTexts.add(seed.mainText);
        return {
          sceneIndex: seed.sceneIndex,
          mainText: seed.mainText,
          targetVal: seed.targetVal,
          options: roundCounter === 1 ? [...seed.options] : shuffleArray(seed.options)
        };
      }

      const sceneIndex = roundCounter % 4;
      roundCounter++;

      // Choose the archetype based on sceneIndex or random so all 4 operation types rotate smoothly
      const archetypes = ['mainAdd', 'mainSub', 'mainDiv', 'mainMul'];
      const archetype = archetypes[sceneIndex % 4];

      let mainExpr = null;
      let correctOption = null;

      for (let tries = 0; tries < 50; tries++) {
        if (archetype === 'mainAdd') {
          // Pick a composite product from 2..9 * 3..9 so the equivalent option can be multiplication
          const f1 = randInt(3, 9);
          const f2 = randInt(4, 9);
          const targetVal = f1 * f2;
          // Create an addition expression for targetVal (often doubles like 28 + 28 or two 2-digit numbers)
          const half = targetVal % 2 === 0 && Math.random() < 0.55 ? targetVal / 2 : randInt(11, targetVal - 11);
          const mainText = `${half} + ${targetVal - half}`;
          if (recentMainTexts.has(mainText)) continue;

          mainExpr = { text: mainText, val: targetVal, op: '+' };
          correctOption = { text: `${f1} × ${f2}`, val: targetVal, op: '×', isCorrect: true };
          break;
        } else if (archetype === 'mainSub') {
          // Pick a composite product so subtraction matches a multiplication or addition
          const f1 = randInt(3, 9);
          const f2 = randInt(3, 9);
          const targetVal = f1 * f2;
          const subtrahend = randInt(15, 45);
          const minuend = targetVal + subtrahend;
          const mainText = `${minuend} − ${subtrahend}`;
          if (recentMainTexts.has(mainText)) continue;

          mainExpr = { text: mainText, val: targetVal, op: '−' };
          const correctOp = Math.random() < 0.75 ? '×' : '+';
          const built = buildExprForValue(targetVal, correctOp, mainText);
          if (built) {
            correctOption = { ...built, isCorrect: true };
            break;
          }
        } else if (archetype === 'mainDiv') {
          // Division main expression e.g. 54 : 6 = 9, equivalent to 6 + 3 or 72 : 8 or 25 − 16
          const targetVal = randInt(6, 9);
          const divisor = randInt(4, 9);
          const dividend = targetVal * divisor;
          const mainText = `${dividend} : ${divisor}`;
          if (recentMainTexts.has(mainText)) continue;

          mainExpr = { text: mainText, val: targetVal, op: ':' };
          const built = buildExprForValue(targetVal, '+', mainText);
          if (built) {
            correctOption = { ...built, isCorrect: true };
            break;
          }
        } else {
          // Multiplication main expression e.g. 6 × 9 = 54, equivalent to 200 − 146 or 27 + 27
          const f1 = randInt(4, 9);
          const f2 = randInt(4, 9);
          const targetVal = f1 * f2;
          const mainText = `${f1} × ${f2}`;
          if (recentMainTexts.has(mainText)) continue;

          mainExpr = { text: mainText, val: targetVal, op: '×' };
          const correctOp = Math.random() < 0.65 ? '−' : '+';
          const built = buildExprForValue(targetVal, correctOp, mainText);
          if (built) {
            correctOption = { ...built, isCorrect: true };
            break;
          }
        }
      }

      recentMainTexts.add(mainExpr.text);
      if (recentMainTexts.size > 25) {
        const first = recentMainTexts.values().next().value;
        recentMainTexts.delete(first);
      }

      // Build the 3 distractors using the remaining 3 operations so we always have a balanced set of (+, −, ×, :)
      const allOps = ['+', '−', '×', ':'];
      const remainingOps = allOps.filter(op => op !== correctOption.op);
      const usedValues = new Set([mainExpr.val]);

      const options = [correctOption];
      remainingOps.forEach(op => {
        const distractor = buildDistractorExpr(op, usedValues);
        usedValues.add(distractor.val);
        options.push({ ...distractor, isCorrect: false });
      });

      return {
        sceneIndex,
        mainText: mainExpr.text,
        targetVal: mainExpr.val,
        options: shuffleArray(options)
      };
    }

    /*************************************************************************
     * 3. INDEPENDENT DYNAMIC EMOTION ENGINE FOR EVERY CHILD & CAT
     *    - Each child has 8 rich, expressive facial states that change
     *      independently and randomly every 2–4 seconds, or on click/answer!
     *************************************************************************/
    const EMOTION_LIST = [
      'happy',      // Cheerful big smile & blinking eyes
      'laugh',      // Squinting happy eyes (^ ^) & wide laughing mouth with tongue
      'wink',       // Playful wink + tongue sticking out (:P)
      'curious',    // Looking toward the banner with raised eyebrow & "O" mouth
      'starry',     // Big sparkling starry eyes & ecstatic grin
      'surprised',  // Wide round eyes & "Wow" oval mouth
      'smirk',      // Mischievous sideways glance & asymmetric grin
      'dreamy'      // Soft happy arcs & cute wavy cat-smile (:3)
    ];

    function buildKidFaceMarkup(emotion, opts = {}) {
      const {
        eyeLeftX = -20,
        eyeRightX = 20,
        eyeY = -3,
        mouthX = 0,
        mouthY = 18,
        cheekLeftX = -34,
        cheekRightX = 34,
        cheekY = 15,
        cheekColor = '#ff8b78',
        freckles = false,
        lookDir = 1 // 1 means banner is to the right, -1 means banner is to the left
      } = opts;

      const midX = (eyeLeftX + eyeRightX) / 2;
      const span = Math.abs(eyeRightX - eyeLeftX) / 2;

      // Cheeks + Optional Freckles
      let cheeksMarkup = `
        <circle cx="${cheekLeftX}" cy="${cheekY}" r="${emotion === 'laugh' || emotion === 'starry' ? 11.5 : 9.5}" fill="${cheekColor}" opacity="${emotion === 'laugh' || emotion === 'starry' ? 0.8 : 0.62}" />
        <circle cx="${cheekRightX}" cy="${cheekY}" r="${emotion === 'laugh' || emotion === 'starry' ? 11.5 : 9.5}" fill="${cheekColor}" opacity="${emotion === 'laugh' || emotion === 'starry' ? 0.8 : 0.62}" />
      `;
      if (freckles) {
        cheeksMarkup += `
          <circle cx="${midX - 11}" cy="${eyeY + 8}" r="1.8" fill="#8c4a27" />
          <circle cx="${midX}" cy="${eyeY + 6}" r="1.8" fill="#8c4a27" />
          <circle cx="${midX + 11}" cy="${eyeY + 8}" r="1.8" fill="#8c4a27" />
        `;
      }

      // Nose
      const noseMarkup = `<path d="M${midX - 2},${eyeY + 8} Q${midX},${eyeY + 13} ${midX + 3},${eyeY + 10}" fill="none" stroke="#4f2a12" stroke-width="2.6" stroke-linecap="round" />`;

      let eyesMarkup = '';
      let browsMarkup = '';
      let mouthMarkup = '';

      if (emotion === 'happy') {
        browsMarkup = `
          <path d="M${eyeLeftX - 7},${eyeY - 11} Q${eyeLeftX},${eyeY - 15} ${eyeLeftX + 7},${eyeY - 11}" fill="none" stroke="#4f2a12" stroke-width="2.5" stroke-linecap="round" />
          <path d="M${eyeRightX - 7},${eyeY - 11} Q${eyeRightX},${eyeY - 15} ${eyeRightX + 7},${eyeY - 11}" fill="none" stroke="#4f2a12" stroke-width="2.5" stroke-linecap="round" />
        `;
        eyesMarkup = `
          <g class="blink-eyes">
            <circle cx="${eyeLeftX}" cy="${eyeY}" r="5.2" fill="#3b2212" />
            <circle cx="${eyeLeftX - 1.5}" cy="${eyeY - 1.8}" r="1.8" fill="#ffffff" />
            <circle cx="${eyeRightX}" cy="${eyeY}" r="5.2" fill="#3b2212" />
            <circle cx="${eyeRightX - 1.5}" cy="${eyeY - 1.8}" r="1.8" fill="#ffffff" />
          </g>
        `;
        mouthMarkup = `
          <path d="M${mouthX - 24},${mouthY} Q${mouthX},${mouthY + 22} ${mouthX + 24},${mouthY}" fill="none" stroke="#4f2a12" stroke-width="3.4" stroke-linecap="round" />
          <path d="M${mouthX - 26},${mouthY - 2} L${mouthX - 21},${mouthY + 3} M${mouthX + 26},${mouthY - 2} L${mouthX + 21},${mouthY + 3}" stroke="#4f2a12" stroke-width="2.6" stroke-linecap="round" />
        `;
      } else if (emotion === 'laugh') {
        browsMarkup = `
          <path d="M${eyeLeftX - 8},${eyeY - 12} Q${eyeLeftX},${eyeY - 18} ${eyeLeftX + 8},${eyeY - 12}" fill="none" stroke="#4f2a12" stroke-width="2.6" stroke-linecap="round" />
          <path d="M${eyeRightX - 8},${eyeY - 12} Q${eyeRightX},${eyeY - 18} ${eyeRightX + 8},${eyeY - 12}" fill="none" stroke="#4f2a12" stroke-width="2.6" stroke-linecap="round" />
        `;
        eyesMarkup = `
          <path d="M${eyeLeftX - 8},${eyeY + 2} Q${eyeLeftX},${eyeY - 9} ${eyeLeftX + 8},${eyeY + 2}" fill="none" stroke="#3b2212" stroke-width="3.4" stroke-linecap="round" />
          <path d="M${eyeRightX - 8},${eyeY + 2} Q${eyeRightX},${eyeY - 9} ${eyeRightX + 8},${eyeY + 2}" fill="none" stroke="#3b2212" stroke-width="3.4" stroke-linecap="round" />
        `;
        mouthMarkup = `
          <path d="M${mouthX - 23},${mouthY - 2} Q${mouthX},${mouthY + 28} ${mouthX + 23},${mouthY - 2} Z" fill="#702915" stroke="#4f2a12" stroke-width="3" stroke-linejoin="round" />
          <ellipse cx="${mouthX}" cy="${mouthY + 10}" rx="10" ry="5.5" fill="#ff7070" />
        `;
      } else if (emotion === 'wink') {
        browsMarkup = `
          <path d="M${eyeLeftX - 7},${eyeY - 10} Q${eyeLeftX},${eyeY - 13} ${eyeLeftX + 7},${eyeY - 9}" fill="none" stroke="#4f2a12" stroke-width="2.5" stroke-linecap="round" />
          <path d="M${eyeRightX - 7},${eyeY - 13} Q${eyeRightX},${eyeY - 18} ${eyeRightX + 7},${eyeY - 12}" fill="none" stroke="#4f2a12" stroke-width="2.5" stroke-linecap="round" />
        `;
        eyesMarkup = `
          <path d="M${eyeLeftX - 7},${eyeY - 3} L${eyeLeftX + 6},${eyeY + 1} L${eyeLeftX - 7},${eyeY + 5}" fill="none" stroke="#3b2212" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="${eyeRightX}" cy="${eyeY}" r="5.4" fill="#3b2212" />
          <circle cx="${eyeRightX - 1.5}" cy="${eyeY - 1.8}" r="1.9" fill="#ffffff" />
        `;
        mouthMarkup = `

      const theme = PLAQUE_THEMES[index % PLAQUE_THEMES.length];
      return `
        <button type="button"
                class="answer-plaque w-full h-24 sm:h-28 md:h-32 focus:outline-none"
                data-correct="${option.isCorrect}"
                data-index="${index}">
          <svg viewBox="0 0 360 130" class="w-full h-full overflow-visible">
            <defs>
              <linearGradient id="${theme.gradId}-${index}" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="${theme.c1}" />
                <stop offset="100%" stop-color="${theme.c2}" />
              </linearGradient>
            </defs>

            <!-- 3D Bottom Rim of Carved Wooden Plaque -->
            <path d="M28,22 Q180,12 332,22 Q350,24 348,68 Q350,112 330,116 Q180,126 30,116 Q10,112 12,68 Q10,24 28,22 Z"
                  fill="${theme.border}" />

            <!-- Main Patterned Plaque Body -->
            <path d="M28,14 Q180,4 332,14 Q350,16 348,60 Q350,104 330,108 Q180,118 30,108 Q10,104 12,60 Q10,16 28,14 Z"
                  fill="url(#${theme.gradId}-${index})"
                  stroke="${theme.border}"
                  stroke-width="4" />

            <!-- Subtle Woodgrain / Decorative Wave Stripes Inside Plaque -->
            <path d="M35,34 Q180,24 325,34" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.28" stroke-linecap="round" />
            <path d="M40,92 Q180,100 320,92" fill="none" stroke="${theme.border}" stroke-width="2.5" opacity="0.18" stroke-linecap="round" />

            <!-- Stitched Inner Border -->
            <path d="M34,23 Q180,14 326,23 Q338,25 336,60 Q338,95 324,98 Q180,107 36,98 Q22,95 24,60 Q22,25 34,23 Z"
                  fill="none"
                  stroke="${theme.stitch}"
                  stroke-width="3"
                  stroke-dasharray="9 7"
                  stroke-linecap="round" />

            <!-- Corner Botanical Sprouts / Rivets -->
            <circle cx="38" cy="36" r="5" fill="${theme.leafFill}" stroke="${theme.border}" stroke-width="2" />
            <circle cx="322" cy="36" r="5" fill="${theme.leafFill}" stroke="${theme.border}" stroke-width="2" />

            <!-- Huge Crisp Option Expression -->
            <text x="180" y="79"
                  text-anchor="middle"
                  fill="${theme.textFill}"
                  class="math-text-option"
                  font-size="58"
                  style="filter: drop-shadow(0 2px 0px rgba(255,255,255,0.65));">${option.text}</text>
          </svg>
        </button>
      `;
    }

    /*************************************************************************
     * 5. HTML5 CANVAS ENGINE (Living Butterflies, Petals & 4 Celebration FX)
     *************************************************************************/
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Ambient Butterflies fluttering across the meadow
    const butterflies = Array.from({ length: 6 }, (_, i) => ({
      x: Math.random() * window.innerWidth,
      y: window.innerHeight * (0.35 + Math.random() * 0.45),
      vx: (Math.random() * 1.1 + 0.5) * (i % 2 === 0 ? 1 : -1),
      vy: (Math.random() - 0.5) * 0.4,
      wingPhase: Math.random() * Math.PI * 2,
      size: 10 + Math.random() * 6,
      color: ['#ff7eb3', '#ffd84d', '#6bd5ff', '#ff964f'][i % 4]
    }));

    // Ambient Floating Blossom Petals
    const ambientPetals = Array.from({ length: 18 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: 0.4 + Math.random() * 0.6,
      vy: 0.3 + Math.random() * 0.5,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.03,
      size: 4 + Math.random() * 4,
      color: Math.random() < 0.5 ? '#fff6d6' : '#ffd1dc'
    }));

    // Active Celebration & Feedback Particles
    let activeParticles = [];

    function drawStar(c, x, y, radius, points = 5) {
      c.beginPath();
      for (let i = 0; i < points * 2; i++) {
        const r = i % 2 === 0 ? radius : radius * 0.45;
        const angle = (i * Math.PI) / points - Math.PI / 2;
        const px = x + Math.cos(angle) * r;
        const py = y + Math.sin(angle) * r;
        if (i === 0) c.moveTo(px, py);
        else c.lineTo(px, py);
      }
      c.closePath();
      c.fill();
    }

    function drawFlowerParticle(c, x, y, radius, petalColor, centerColor) {
      c.fillStyle = petalColor;
      for (let i = 0; i < 5; i++) {
        const a = (i * Math.PI * 2) / 5;
        c.beginPath();
        c.arc(x + Math.cos(a) * (radius * 0.6), y + Math.sin(a) * (radius * 0.6), radius * 0.5, 0, Math.PI * 2);
        c.fill();
      }
      c.fillStyle = centerColor;
      c.beginPath();
      c.arc(x, y, radius * 0.4, 0, Math.PI * 2);
      c.fill();
    }

    function drawButterflyShape(c, x, y, size, wingScale, color) {
      c.save();
      c.translate(x, y);
      c.fillStyle = color;
      // Left wings
      c.beginPath();
      c.ellipse(-size * 0.55 * wingScale, -size * 0.3, size * 0.65 * wingScale, size * 0.45, -0.3, 0, Math.PI * 2);
      c.ellipse(-size * 0.45 * wingScale, size * 0.35, size * 0.5 * wingScale, size * 0.35, 0.3, 0, Math.PI * 2);
      c.fill();
      // Right wings
      c.beginPath();
      c.ellipse(size * 0.55 * wingScale, -size * 0.3, size * 0.65 * wingScale, size * 0.45, 0.3, 0, Math.PI * 2);
      c.ellipse(size * 0.45 * wingScale, size * 0.35, size * 0.5 * wingScale, size * 0.35, -0.3, 0, Math.PI * 2);
      c.fill();
      // Body
      c.fillStyle = '#3b2314';
      c.beginPath();
      c.ellipse(0, 0, size * 0.14, size * 0.6, 0, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    // Spawn wrong-click leaf/dust puff around the clicked plaque
    function spawnWrongPuff(rect) {
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const colors = ['#a8d656', '#85b835', '#e3c588', '#d4a359'];
      for (let i = 0; i < 22; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;
        activeParticles.push({
          type: 'leaf',
          x: cx + (Math.random() - 0.5) * rect.width * 0.5,
          y: cy + (Math.random() - 0.5) * 20,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          gravity: 0.16,
          size: 6 + Math.random() * 7,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.18,
          alpha: 1,
          decay: 0.025,
          color: colors[i % colors.length]
        });
      }
    }

    // Spawn rich celebration effects connecting the chosen plaque to the children's banner
    function spawnCelebration(plaqueRect, variantIndex) {
      const startX = plaqueRect.left + plaqueRect.width / 2;
      const startY = plaqueRect.top + plaqueRect.height / 2;

      const bannerEl = document.getElementById('main-banner-target');
      const bannerRect = bannerEl
        ? bannerEl.getBoundingClientRect()
        : { left: window.innerWidth / 2 - 100, top: window.innerHeight * 0.3, width: 200, height: 100 };

      const targetX = bannerRect.left + bannerRect.width / 2;
      const targetY = bannerRect.top + bannerRect.height / 2;

      // 1. Golden Sparkle Stream from Plaque to Banner
      for (let i = 0; i < 28; i++) {
        const t = i / 28;
        const lx = startX + (targetX - startX) * t + (Math.random() - 0.5) * 50;
        const ly = startY + (targetY - startY) * t + (Math.random() - 0.5) * 40;
        activeParticles.push({
          type: 'star',
          x: lx,
          y: ly,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4 - 1,
          gravity: 0.04,
          size: 10 + Math.random() * 10,
          rot: Math.random() * Math.PI,
          vRot: 0.08,
          alpha: 1,
          decay: 0.018,
          color: i % 2 === 0 ? '#ffe84d' : '#ffffff'
        });
      }

      // 2. Variant-specific Grand Burst around the Banner & Meadow
      const v = variantIndex % 4;
      const palette = ['#ff5983', '#ffcf33', '#52d6ff', '#7af556', '#ff8c3b', '#b87aff'];

      for (let i = 0; i < 65; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 11;
        const pType = v === 0 ? 'star' : v === 1 ? 'butterfly' : v === 2 ? 'flower' : 'ribbon';

        activeParticles.push({
          type: pType,
          x: targetX + (Math.random() - 0.5) * 140,
          y: targetY + (Math.random() - 0.5) * 60,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2.5,
          gravity: pType === 'butterfly' ? -0.03 : 0.14,
          size: pType === 'butterfly' ? 14 + Math.random() * 8 : 10 + Math.random() * 11,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.14,
          wingPhase: Math.random() * Math.PI * 2,
          alpha: 1,
          decay: 0.013 + Math.random() * 0.006,
          color: palette[i % palette.length],
          centerColor: '#fff599'
        });
      }
    }

    function animateCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Render Ambient Floating Blossom Petals
      ambientPetals.forEach(p => {
        p.x += p.vx;
        p.y += p.vy + Math.sin(p.x * 0.01) * 0.2;
        p.rot += p.vRot;
        if (p.x > canvas.width + 20) p.x = -20;
        if (p.y > canvas.height + 20) p.y = -20;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 2. Render Ambient Meadow Butterflies
      butterflies.forEach(b => {
        b.x += b.vx;
        b.y += b.vy + Math.sin(b.wingPhase * 0.25) * 0.45;
        b.wingPhase += 0.24;

        if (b.x > canvas.width + 40) b.x = -40;
        if (b.x < -40) b.x = canvas.width + 40;

        const wingScale = 0.35 + Math.abs(Math.sin(b.wingPhase)) * 0.65;
        drawButterflyShape(ctx, b.x, b.y, b.size, wingScale, b.color);
      });

      // 3. Render Active Feedback & Celebration Particles
      for (let i = activeParticles.length - 1; i >= 0; i--) {
        const p = activeParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rot += p.vRot || 0;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          activeParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);

        if (p.type === 'star') {
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          drawStar(ctx, 0, 0, p.size, 5);
        } else if (p.type === 'flower') {
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          drawFlowerParticle(ctx, 0, 0, p.size, p.color, p.centerColor);
        } else if (p.type === 'butterfly') {
          p.wingPhase += 0.35;
          const ws = 0.3 + Math.abs(Math.sin(p.wingPhase)) * 0.7;
          drawButterflyShape(ctx, p.x, p.y, p.size, ws, p.color);
        } else {
          // Leaf or Ribbon
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size, p.size * 0.48, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      requestAnimationFrame(animateCanvas);
    }

    /*************************************************************************
     * 6. GAME CONTROLLER & INTERACTION LOOP
     *************************************************************************/
    const sceneStage = document.getElementById('scene-stage');
    const optionsContainer = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const soundBtn = document.getElementById('sound-btn');
    const soundMuteLine = document.getElementById('sound-mute-line');

    let currentTask = null;
    let isLocked = false;
    let autoAdvanceTimer = null;
    let celebrationCounter = 0;

    // Independent Random Emotion Timers for Left Child, Right Child, and Cat
    let leftEmotionTimer = null;
    let rightEmotionTimer = null;
    let catEmotionTimer = null;
    let currentLeftEmotion = 'happy';
    let currentRightEmotion = 'happy';

    function setKidEmotion(side, emotionName = null) {
      if (!currentTask) return;
      const cfg = SCENE_FACE_CONFIGS[currentTask.sceneIndex];
      const targetEl = document.getElementById(side === 'left' ? 'face-left' : 'face-right');
      if (!targetEl) return;

      const prevEmotion = side === 'left' ? currentLeftEmotion : currentRightEmotion;
      let chosen = emotionName;
      if (!chosen) {
        const pool = EMOTION_LIST.filter(e => e !== prevEmotion);
        chosen = pool[randInt(0, pool.length - 1)];
      }

      if (side === 'left') currentLeftEmotion = chosen;
      else currentRightEmotion = chosen;

      targetEl.innerHTML = buildKidFaceMarkup(chosen, side === 'left' ? cfg.left : cfg.right);
    }

    function setCatEmotion(emotionName = null) {
      const catEl = document.getElementById('face-cat');
      if (!catEl) return;
      const catPool = ['happy', 'laugh', 'wink', 'surprised'];
      const chosen = emotionName || catPool[randInt(0, catPool.length - 1)];
      catEl.innerHTML = buildCatFaceMarkup(chosen);
    }

    function stopEmotionTimers() {
      if (leftEmotionTimer) clearTimeout(leftEmotionTimer);
      if (rightEmotionTimer) clearTimeout(rightEmotionTimer);
      if (catEmotionTimer) clearTimeout(catEmotionTimer);
    }

    function scheduleLeftEmotion() {
      if (leftEmotionTimer) clearTimeout(leftEmotionTimer);
      leftEmotionTimer = setTimeout(() => {
        if (!isLocked) setKidEmotion('left');
        scheduleLeftEmotion();
      }, randInt(2000, 3800));
    }

    function scheduleRightEmotion() {
      if (rightEmotionTimer) clearTimeout(rightEmotionTimer);
      rightEmotionTimer = setTimeout(() => {
        if (!isLocked) setKidEmotion('right');
        scheduleRightEmotion();
      }, randInt(2200, 4100));
    }

    function scheduleCatEmotion() {
      if (catEmotionTimer) clearTimeout(catEmotionTimer);
      catEmotionTimer = setTimeout(() => {
        if (!isLocked) setCatEmotion();
        scheduleCatEmotion();
      }, randInt(2600, 4500));
    }

    function bindCharacterEmotionClicks() {
      const leftKid = document.getElementById('kid-left-clickable');
      const rightKid = document.getElementById('kid-right-clickable');
      const cat = document.getElementById('cat-clickable');

      if (leftKid) {
        leftKid.addEventListener('click', () => {
          sound.playEmotionPop();
          setKidEmotion('left');
        });
      }
      if (rightKid) {
        rightKid.addEventListener('click', () => {
          sound.playEmotionPop();
          setKidEmotion('right');
        });
      }
      if (cat) {
        cat.addEventListener('click', () => {
          sound.playEmotionPop();
          setCatEmotion();
        });
      }
    }

    function loadNextRound() {
      if (autoAdvanceTimer) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
      }
      stopEmotionTimers();
      isLocked = false;
      currentTask = generateNextTask();

      // Render Scene SVG
      sceneStage.className = 'relative w-full flex-1 flex items-center justify-center max-h-[68vh] min-h-[260px]';
      sceneStage.innerHTML = getSceneSVG(currentTask.sceneIndex, currentTask.mainText);

      // Start independent random emotion loops & click reactions for each child
      bindCharacterEmotionClicks();
      scheduleLeftEmotion();
      scheduleRightEmotion();
      if (SCENE_FACE_CONFIGS[currentTask.sceneIndex].hasCat) {
        scheduleCatEmotion();
      }

      // Render 4 Option Plaques
      optionsContainer.innerHTML = currentTask.options
        .map((opt, idx) => createOptionPlaqueHTML(opt, idx))
        .join('');

      // Attach Event Listeners to Option Plaques
      const plaques = optionsContainer.querySelectorAll('.answer-plaque');
      plaques.forEach(btn => {
        btn.addEventListener('mouseenter', () => {
          if (!isLocked) sound.playHover();
        });

        btn.addEventListener('click', () => {
          if (isLocked) return;
          const isCorrect = btn.getAttribute('data-correct') === 'true';
          const rect = btn.getBoundingClientRect();

          if (isCorrect) {
            isLocked = true;
            btn.classList.add('correct-pop');
            sceneStage.classList.remove('shrug-anim');
            sceneStage.classList.add('celebrate-anim');

            // Both children switch to ecstatic cheering emotions!
            setKidEmotion('left', Math.random() < 0.5 ? 'starry' : 'laugh');
            setKidEmotion('right', Math.random() < 0.5 ? 'laugh' : 'starry');
            setCatEmotion('laugh');

            sound.playWinVariant(celebrationCounter);
            spawnCelebration(rect, celebrationCounter);
            celebrationCounter++;

            autoAdvanceTimer = setTimeout(() => {
              loadNextRound();
            }, 1650);
          } else {
            btn.classList.remove('wrong-shake');
            void btn.offsetWidth; // trigger reflow
            btn.classList.add('wrong-shake');

            sceneStage.classList.remove('shrug-anim');
            void sceneStage.offsetWidth;
            sceneStage.classList.add('shrug-anim');

            // Both children briefly show funny surprised/puzzled faces, then resume independent random emotions
            setKidEmotion('left', Math.random() < 0.5 ? 'puzzled' : 'surprised');
            setKidEmotion('right', Math.random() < 0.5 ? 'surprised' : 'puzzled');
            setCatEmotion('surprised');

            sound.playWrong();
            spawnWrongPuff(rect);
          }
        });
      });
    }

    // Minimalist "Next" Button: Immediately skips to the next generated task
    nextBtn.addEventListener('click', () => {
      sound.playSkip();
      loadNextRound();
    });

    // Sound Toggle Button
    soundBtn.addEventListener('click', () => {
      const muted = sound.toggleMute();
      soundMuteLine.classList.toggle('hidden', !muted);
      if (!muted) sound.playHover();
    });

    // Start Game & Animation Loop on Window Load
    window.onload = function () {
      loadNextRound();
      animateCanvas();
    };
  </script>
</body>
</html>
