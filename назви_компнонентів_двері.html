<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>20 Doors Math</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap');

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #070504;
    font-family: 'Montserrat', sans-serif;
  }

  /* Main 3D Viewport */
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    perspective: 1400px;
    background: #060403;
  }

  /* 
   * TRUE 2-LAYER 3D PORTAL ARCHITECTURE
   * #nextSceneLayer sits directly behind #currentSceneLayer's transparent doorway cutout.
   * Both layers contain their full room architecture AND their respective 3D doors!
   * During walk-through, BOTH scale up together around the doorway vanishing point (50% 56.5%).
   */
  .scene-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform-origin: 50% 56.5%;
    transform-style: preserve-3d;
    will-change: transform, filter, opacity;
    pointer-events: none;
  }

  #nextSceneLayer {
    z-index: 2;
    transform: translate3d(0, 0, 0) scale(0.2916);
    filter: brightness(0.42);
  }

  #currentSceneLayer {
    z-index: 5;
    transform: translate3d(0, 0, 0) scale(1);
    filter: brightness(1);
  }

  /* 16:9 Coordinate Stage inside each Scene Layer so SVG room & 3D HTML Door align with pixel precision */
  .room-stage-box {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1920px;
    height: 1080px;
    transform: translate(-50%, -50%);
    transform-style: preserve-3d;
  }

  .room-svg-layer {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    pointer-events: none;
  }

  /* 
   * 3D Door Assembly anchored directly inside the 1920x1080 room wall cutout
   * Cutout coordinates in SVG: x=680, y=190, width=560, height=730 (floor at y=920)
   */
  .scene-door-assembly {
    position: absolute;
    left: 680px;
    top: 190px;
    width: 560px;
    height: 730px;
    perspective: 1500px;
    transform-style: preserve-3d;
    pointer-events: none;
  }

  /* Outer Heavy Architectural Doorframe (moves WITH the room & door!) */
  .scene-door-frame-trim {
    position: absolute;
    inset: -18px -18px 0 -18px;
    border: 18px solid #593b1d;
    border-bottom: none;
    border-radius: 14px 14px 0 0;
    box-shadow: 
      0 12px 38px rgba(0,0,0,0.9),
      inset 0 0 22px rgba(0,0,0,0.95),
      0 0 0 4px #a87934;
    pointer-events: none;
    z-index: 6;
  }

  /* 3D Swinging Door Leaf attached to left hinge of the doorway */
  .scene-door-leaf {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform-origin: 0% 50%;
    transform-style: preserve-3d;
    transform: rotateY(0deg);
    transition: transform 0.86s cubic-bezier(0.32, 0.04, 0.24, 1), filter 0.86s ease, box-shadow 0.86s ease;
    box-shadow: inset 0 0 35px rgba(0,0,0,0.85), 10px 0 28px rgba(0,0,0,0.85);
    z-index: 4;
    will-change: transform;
  }

  .scene-door-leaf.swung-open {
    transform: rotateY(-106deg);
    filter: brightness(0.62);
    box-shadow: inset 0 0 45px rgba(0,0,0,0.95), 45px 15px 65px rgba(0,0,0,0.92);
  }

  /* Door Edge Thickness (visible when door swings open in 3D) */
  .scene-door-leaf::after {
    content: '';
    position: absolute;
    top: 0;
    right: -16px;
    width: 16px;
    height: 100%;
    background: linear-gradient(180deg, #3b2410 0%, #1c1006 50%, #3b2410 100%);
    transform-origin: left center;
    transform: rotateY(90deg);
    border-left: 2px solid #966b2d;
    border-right: 2px solid #140b04;
  }

  /* Heavy Mechanical Sliding Bolts mounted on the Door Frame */
  .scene-bolt {
    position: absolute;
    top: 335px;
    height: 58px;
    width: 270px;
    z-index: 8;
    transition: transform 0.58s cubic-bezier(0.34, 1.45, 0.64, 1), filter 0.35s ease;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,0.92));
  }

  .scene-bolt-left {
    left: -34px;
    transform: translateX(0);
  }
  .scene-bolt-left.retracted {
    transform: translateX(-215px);
  }

  .scene-bolt-right {
    right: -34px;
    transform: translateX(0);
  }
  .scene-bolt-right.retracted {
    transform: translateX(215px);
  }

  /* Central Rotary Wheel Lock on Door */
  .scene-wheel-lock {
    position: absolute;
    left: 50%;
    top: 364px;
    width: 136px;
    height: 136px;
    transform: translate(-50%, -50%) rotate(0deg);
    z-index: 9;
    transition: transform 0.78s cubic-bezier(0.4, 0.0, 0.2, 1), opacity 0.45s ease, filter 0.45s ease;
    filter: drop-shadow(0 12px 18px rgba(0,0,0,0.95));
  }

  .scene-wheel-lock.unlocked {
    transform: translate(-50%, -50%) rotate(240deg) scale(0.85);
    filter: drop-shadow(0 0 26px rgba(75, 227, 149, 0.95));
    opacity: 0;
  }

  /* Ambient & Burst Particle Canvas */
  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 25;
  }

  /* Foreground Interactive Lock UI Layer */
  #interactive-stage {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1.4vh 2.2vw 2.4vh 2.2vw;
    pointer-events: none;
  }

  /* Smooth hide/reveal of puzzle panels when walking through a doorway */
  #puzzle-hud-wrapper {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: opacity 0.38s ease, transform 0.48s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: opacity, transform;
  }

  #puzzle-hud-wrapper.walking-hide {
    opacity: 0;
    transform: scale(1.16) translateY(12px);
    pointer-events: none !important;
  }

  /* Top Control Bar */
  .hud-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    z-index: 45;
    pointer-events: auto;
  }

  /* Stylized Brass & Wrought Iron Mechanical Buttons */
  .mech-btn {
    position: relative;
    cursor: pointer;
    border-radius: 14px;
    background: 
      radial-gradient(circle at 25% 25%, rgba(255, 236, 179, 0.35), transparent 60%),
      linear-gradient(160deg, #594122 0%, #382611 48%, #211508 100%);
    border: 2px solid #b58942;
    box-shadow: 
      0 6px 14px rgba(0,0,0,0.8),
      inset 0 2px 3px rgba(255, 235, 180, 0.45),
      inset 0 -3px 6px rgba(0,0,0,0.85);
    color: #f7e2b2;
    font-weight: 800;
    letter-spacing: 0.04em;
    transition: all 0.18s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-shadow: 0 2px 4px rgba(0,0,0,0.95);
  }

  .mech-btn::before, .mech-btn::after {
    content: '';
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffe6a3, #6e4e1e);
    box-shadow: 0 1px 2px rgba(0,0,0,0.9);
    top: 50%;
    transform: translateY(-50%);
  }
  .mech-btn::before { left: 7px; }
  .mech-btn::after { right: 7px; }

  .mech-btn:hover {
    transform: translateY(-2px) scale(1.03);
    border-color: #f3c86b;
    box-shadow: 
      0 8px 18px rgba(0,0,0,0.85),
      0 0 14px rgba(245, 190, 80, 0.45),
      inset 0 2px 4px rgba(255, 240, 195, 0.65);
    color: #fff5d6;
  }

  .mech-btn:active {
    transform: translateY(2px) scale(0.97);
  }

  .mech-btn.active-mode {
    background: 
      radial-gradient(circle at 50% 20%, rgba(255, 230, 130, 0.48), transparent 70%),
      linear-gradient(160deg, #9c6f27 0%, #694612 52%, #3d2607 100%);
    border-color: #ffdf85;
    color: #ffffff;
    box-shadow: 
      0 0 18px rgba(255, 200, 70, 0.65),
      0 6px 14px rgba(0,0,0,0.85),
      inset 0 2px 6px rgba(255, 245, 200, 0.8);
  }

  /* Non-Verbal 20-Gem Arch Progress */
  #progress-arch {
    display: flex;
    align-items: center;
    gap: 0.36vw;
    padding: 6px 15px;
    border-radius: 999px;
    background: linear-gradient(180deg, #2b1e14 0%, #140d08 100%);
    border: 2px solid #8c6630;
    box-shadow: 0 6px 16px rgba(0,0,0,0.85), inset 0 2px 5px rgba(0,0,0,0.9);
  }

  .arch-gem {
    width: clamp(8px, 0.88vw, 14px);
    height: clamp(8px, 0.88vw, 14px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #3d3228, #17110c);
    border: 1.5px solid #634926;
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.9);
    transition: all 0.35s ease;
  }

  .arch-gem.lit {
    background: radial-gradient(circle at 35% 30%, #fff8c4 0%, #ffc13b 45%, #b85d00 100%);
    border-color: #ffe89e;
    box-shadow: 0 0 10px #ffae19, 0 0 4px #fff2b2;
    transform: scale(1.12);
  }

  .arch-gem.current {
    background: radial-gradient(circle at 35% 30%, #d4ffea 0%, #2bd980 50%, #096b38 100%);
    border-color: #a6ffcf;
    box-shadow: 0 0 12px #2bd980;
    animation: pulseGem 1.5s infinite ease-in-out;
  }

  @keyframes pulseGem {
    0%, 100% { transform: scale(1.1); filter: brightness(1); }
    50% { transform: scale(1.28); filter: brightness(1.3); }
  }

  /* Overhead Archway Equation Plaque */
  #equation-banner-wrap {
    position: relative;
    margin: 0.6vh auto 0 auto;
    z-index: 35;
    pointer-events: auto;
    display: flex;
    justify-content: center;
  }

  #equation-plaque {
    position: relative;
    padding: clamp(10px, 1.4vh, 18px) clamp(26px, 3.4vw, 56px);
    border-radius: 22px;
    background: 
      radial-gradient(ellipse at 50% 0%, rgba(255, 224, 140, 0.25), transparent 70%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 4px, transparent 4px, transparent 8px),
      linear-gradient(180deg, #2d1f12 0%, #1b1109 55%, #110a05 100%);
    border: 4px solid #c8963e;
    box-shadow: 
      0 16px 34px rgba(0,0,0,0.92),
      0 0 0 3px #3d2710,
      inset 0 2px 10px rgba(255, 215, 120, 0.35),
      inset 0 -6px 16px rgba(0,0,0,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 1.6vw, 26px);
    min-width: clamp(320px, 39vw, 660px);
  }

  .plaque-corner {
    position: absolute;
    width: 16px;
    height: 16px;
    border: 3px solid #f5cb73;
    pointer-events: none;
  }
  .plaque-corner.tl { top: 5px; left: 5px; border-right: none; border-bottom: none; border-top-left-radius: 8px; }
  .plaque-corner.tr { top: 5px; right: 5px; border-left: none; border-bottom: none; border-top-right-radius: 8px; }
  .plaque-corner.bl { bottom: 5px; left: 5px; border-right: none; border-top: none; border-bottom-left-radius: 8px; }
  .plaque-corner.br { bottom: 5px; right: 5px; border-left: none; border-top: none; border-bottom-right-radius: 8px; }

  .eq-token {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: clamp(2.2rem, 4.4vw, 4.3rem);
    line-height: 1;
    color: #fff3d1;
    text-shadow: 
      0 4px 8px rgba(0,0,0,0.95),
      0 0 18px rgba(255, 196, 87, 0.45);
    letter-spacing: -0.02em;
  }

  .eq-op {
    color: #f7b948;
    font-weight: 900;
    padding: 0 2px;
  }

  /* Shuttered Mystery Slot [ ? ] */
  .mystery-box {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: clamp(72px, 7vw, 122px);
    height: clamp(56px, 6vw, 94px);
    padding: 0 16px;
    border-radius: 16px;
    background: 
      radial-gradient(circle at 50% 35%, #3c2c17 0%, #1c1208 75%, #0e0904 100%);
    border: 3px solid #eab354;
    box-shadow: 
      inset 0 4px 12px rgba(0,0,0,0.95),
      0 0 16px rgba(234, 179, 84, 0.5);
    color: #ffd166;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .mystery-box.solved {
    background: radial-gradient(circle at 50% 30%, #266b44 0%, #103822 80%, #071f11 100%);
    border-color: #6bffb0;
    color: #e3ffef;
    box-shadow: 
      inset 0 2px 10px rgba(107, 255, 176, 0.4),
      0 0 24px rgba(43, 217, 128, 0.85);
    transform: scale(1.06);
  }

  #solved-comp-tag {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%) scale(0.85);
    background: linear-gradient(180deg, #1b5e3a 0%, #0d331e 100%);
    border: 2px solid #6bffb0;
    color: #dcffec;
    font-size: clamp(0.74rem, 0.98vw, 0.98rem);
    font-weight: 800;
    padding: 3px 16px;
    border-radius: 999px;
    white-space: nowrap;
    box-shadow: 0 4px 10px rgba(0,0,0,0.85), 0 0 12px rgba(43, 217, 128, 0.55);
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }

  #solved-comp-tag.visible {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }

  /* 3-Column Lock & Door Layout */
  #main-work-area {
    position: relative;
    flex: 1;
    display: grid;
    grid-template-columns: minmax(225px, 26.5vw) 1fr minmax(225px, 26.5vw);
    align-items: center;
    gap: 1.5vw;
    width: 100%;
    max-width: 1800px;
    margin: 0 auto;
    pointer-events: none;
  }

  /* Left & Right Mechanical Lock Panels */
  .lock-housing {
    position: relative;
    pointer-events: auto;
    border-radius: 22px;
    padding: clamp(12px, 1.8vh, 22px) clamp(12px, 1.4vw, 20px);
    background: 
      radial-gradient(circle at 50% 15%, rgba(212, 160, 76, 0.16), transparent 65%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 6px),
      linear-gradient(165deg, #2b1d12 0%, #191009 55%, #0e0905 100%);
    border: 3px solid #9e7332;
    box-shadow: 
      0 18px 38px rgba(0,0,0,0.92),
      0 0 0 3px #2b1c0c,
      inset 0 2px 8px rgba(255, 220, 145, 0.25),
      inset 0 -8px 18px rgba(0,0,0,0.9);
    transition: transform 0.3s ease, border-color 0.35s ease, box-shadow 0.35s ease;
  }

  .lock-housing.unlocked {
    border-color: #4be395;
    box-shadow: 
      0 18px 38px rgba(0,0,0,0.92),
      0 0 28px rgba(75, 227, 149, 0.5),
      inset 0 2px 12px rgba(75, 227, 149, 0.3);
  }

  .lock-lamp-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: clamp(10px, 1.4vh, 16px);
    padding: 6px 12px;
    border-radius: 12px;
    background: linear-gradient(180deg, #140d07 0%, #24180d 100%);
    border: 1.5px solid #63461f;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.9);
  }

  .lamp-bulb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff9d5c, #8f2d00 70%, #3d0f00 100%);
    border: 2px solid #8a5a2b;
    box-shadow: 0 0 8px rgba(255, 110, 40, 0.7);
    transition: all 0.35s ease;
  }

  .lock-housing.unlocked .lamp-bulb {
    background: radial-gradient(circle at 35% 35%, #d6ffea, #25e07f 65%, #07592d 100%);
    border-color: #9effc9;
    box-shadow: 0 0 16px #25e07f, 0 0 6px #ffffff;
  }

  .gear-wheel {
    width: 28px;
    height: 28px;
    transition: transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .lock-housing.unlocked .gear-wheel {
    transform: rotate(180deg);
  }

  /* Component Name Plaques (Left Lock) */
  .comp-btn-list {
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.25vh, 14px);
  }

  .comp-plaque-btn {
    position: relative;
    width: 100%;
    padding: clamp(11px, 1.65vh, 18px) 18px;
    border-radius: 14px;
    cursor: pointer;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: clamp(0.95rem, 1.32vw, 1.38rem);
    color: #fce8c3;
    background: 
      radial-gradient(circle at 50% 0%, rgba(255, 226, 160, 0.2), transparent 70%),
      linear-gradient(180deg, #4f351c 0%, #362210 52%, #241508 100%);
    border: 2.5px solid #b5843b;
    box-shadow: 
      0 6px 12px rgba(0,0,0,0.75),
      inset 0 2px 3px rgba(255, 232, 175, 0.4),
      inset 0 -3px 6px rgba(0,0,0,0.85);
    text-shadow: 0 2px 4px rgba(0,0,0,0.95);
    transition: all 0.16s ease;
  }

  .comp-plaque-btn::before, .comp-plaque-btn::after {
    content: '';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffdf9a, #5c3d14);
    box-shadow: 0 1px 2px rgba(0,0,0,0.9);
  }
  .comp-plaque-btn::before { left: 9px; }
  .comp-plaque-btn::after { right: 9px; }

  .comp-plaque-btn:hover:not(:disabled) {
    transform: translateY(-2px) scale(1.015);
    border-color: #ffd275;
    background: 
      radial-gradient(circle at 50% 0%, rgba(255, 235, 175, 0.35), transparent 70%),
      linear-gradient(180deg, #634323 0%, #452c15 52%, #2e1b0a 100%);
    box-shadow: 
      0 8px 16px rgba(0,0,0,0.85),
      0 0 14px rgba(255, 198, 84, 0.35),
      inset 0 2px 4px rgba(255, 240, 195, 0.55);
    color: #ffffff;
  }

  .comp-plaque-btn:active:not(:disabled) {
    transform: translateY(2px) scale(0.985);
  }

  .comp-plaque-btn.correct-choice {
    background: linear-gradient(180deg, #257a4c 0%, #154d2e 55%, #0c301c 100%) !important;
    border-color: #7affb9 !important;
    color: #ffffff !important;
    box-shadow: 0 0 20px rgba(75, 227, 149, 0.75), inset 0 2px 6px rgba(255,255,255,0.45) !important;
  }

  .comp-plaque-btn.wrong-choice, .num-dial-btn.wrong-choice {
    animation: mechShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    background: linear-gradient(180deg, #7a221d 0%, #4d120f 60%, #2e0806 100%) !important;
    border-color: #ff6e63 !important;
  }

  /* Number Dial Buttons (Right Lock - 2x2 Grid) */
  .num-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: clamp(10px, 1.4vh, 16px);
  }

  .num-dial-btn {
    position: relative;
    aspect-ratio: 1.15 / 1;
    border-radius: 18px;
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: clamp(1.65rem, 2.7vw, 2.75rem);
    color: #fff2cf;
    background: 
      radial-gradient(circle at 50% 28%, rgba(255, 228, 158, 0.25), transparent 65%),
      radial-gradient(circle at 50% 50%, #3b2814 0%, #24170a 68%, #140c05 100%);
    border: 3px solid #c28e3e;
    box-shadow: 
      0 8px 16px rgba(0,0,0,0.8),
      inset 0 3px 6px rgba(255, 232, 175, 0.4),
      inset 0 -5px 10px rgba(0,0,0,0.9);
    text-shadow: 0 3px 6px rgba(0,0,0,0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.16s ease;
  }

  .num-dial-btn::before {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 12px;
    border: 1.5px dashed rgba(242, 198, 114, 0.38);
    pointer-events: none;
  }

  .num-dial-btn:hover:not(:disabled) {
    transform: translateY(-3px) scale(1.03);
    border-color: #ffda85;
    box-shadow: 
      0 12px 22px rgba(0,0,0,0.9),
      0 0 18px rgba(255, 202, 89, 0.45),
      inset 0 3px 8px rgba(255, 240, 195, 0.65);
    color: #ffffff;
  }

  .num-dial-btn:active:not(:disabled) {
    transform: translateY(2px) scale(0.97);
  }

  .num-dial-btn.correct-choice {
    background: radial-gradient(circle at 50% 35%, #2f965e 0%, #165432 70%, #0b2e1a 100%) !important;
    border-color: #82ffbe !important;
    color: #ffffff !important;
    box-shadow: 0 0 24px rgba(75, 227, 149, 0.8), inset 0 3px 8px rgba(255,255,255,0.5) !important;
  }

  @keyframes mechShake {
    0%, 100% { transform: translateX(0); }

/* ============================================================================
   3. GAME STATE & PORTAL SCALE CONSTANTS
   ============================================================================ */

const PORTAL_ZOOM_FACTOR = 1920 / 560; // ~3.42857

let state = {
  lang: 'uk',
  mode: 10,
  doorIndex: 0, // 0..19 = 20 doors, 20 = Surprise Room #21
  isTransitioning: false,
  compSolved: false,
  numSolved: false,
  muted: false,
  currentProblem: null,
  lasersActive: true,
  gramophoneFast: false
};

/* ============================================================================
   4. WEB AUDIO API MECHANICAL & MUSICAL SYNTHESIZER
   ============================================================================ */
let audioCtx = null;

function ensureAudio() {
  if (state.muted) return;
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function toggleMute() {
  state.muted = !state.muted;
  const waves = document.getElementById('speaker-waves');
  if (waves) {
    waves.style.opacity = state.muted ? '0.18' : '1';
  }
  if (!state.muted) playSound('click');
}

function playSound(type) {
  if (state.muted) return;
  try {
    ensureAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    if (type === 'click') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(180, now + 0.06);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.065);
    } 
    else if (type === 'boltUnlock') {
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sawtooth';
      osc1.frequency.setValueAtTime(140, now);
      osc1.frequency.linearRampToValueAtTime(95, now + 0.12);
      osc1.frequency.linearRampToValueAtTime(220, now + 0.28);
      gain1.gain.setValueAtTime(0.22, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.33);

      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + 0.05 + idx * 0.055);
        gain.gain.setValueAtTime(0.15, now + 0.05 + idx * 0.055);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45 + idx * 0.055);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + 0.05 + idx * 0.055);
        osc.stop(now + 0.48 + idx * 0.055);
      });
    }
    else if (type === 'wrong') {
      [135, 192].forEach((f) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(f, now);
        osc.frequency.linearRampToValueAtTime(f * 0.72, now + 0.26);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.29);
      });
    }
    else if (type === 'doorCreak') {
      // Heavy iron latch + wooden hinge swing creak
      const creak = audioCtx.createOscillator();
      const creakGain = audioCtx.createGain();
      creak.type = 'triangle';
      creak.frequency.setValueAtTime(210, now);
      creak.frequency.linearRampToValueAtTime(130, now + 0.28);
      creak.frequency.linearRampToValueAtTime(185, now + 0.58);
      creak.frequency.linearRampToValueAtTime(112, now + 0.82);
      creakGain.gain.setValueAtTime(0.18, now);
      creakGain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
      creak.connect(creakGain);
      creakGain.connect(audioCtx.destination);
      creak.start(now);
      creak.stop(now + 0.86);
    }
    else if (type === 'footstep') {
      const stepOsc = audioCtx.createOscillator();
      const stepGain = audioCtx.createGain();
      stepOsc.type = 'sine';
      stepOsc.frequency.setValueAtTime(115, now);
      stepOsc.frequency.exponentialRampToValueAtTime(36, now + 0.11);
      stepGain.gain.setValueAtTime(0.26, now);
      stepGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      stepOsc.connect(stepGain);
      stepGain.connect(audioCtx.destination);
      stepOsc.start(now);
      stepOsc.stop(now + 0.13);
    }
    else if (type === 'duck') {
      [0, 0.16].forEach((offset, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        const base = idx === 0 ? 680 : 820;
        osc.frequency.setValueAtTime(base, now + offset);
        osc.frequency.exponentialRampToValueAtTime(base * 1.45, now + offset + 0.07);
        osc.frequency.exponentialRampToValueAtTime(base * 0.85, now + offset + 0.14);
        gain.gain.setValueAtTime(0.25, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + offset);
        osc.stop(now + offset + 0.16);
      });
    }
    else if (type === 'dumplings') {
      const chord = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      chord.forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now + idx * 0.06);
        gain.gain.setValueAtTime(0.2, now + idx * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.55);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.06);
        osc.stop(now + idx * 0.06 + 0.56);
      });
    }
    else if (type === 'gramophone') {
      const melody = [392, 440, 493.88, 523.25, 587.33, 523.25, 493.88, 659.25];
      const speed = state.gramophoneFast ? 0.075 : 0.11;
      melody.forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(f, now + idx * speed);
        gain.gain.setValueAtTime(0.11, now + idx * speed);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * speed + speed * 0.9);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * speed);
        osc.stop(now + idx * speed + speed);
      });
    }
    else if (type === 'laser') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(980, now);
      osc.frequency.exponentialRampToValueAtTime(240, now + 0.19);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.21);
    }
  } catch (e) {}
}

/* ============================================================================
   5. INFINITE MATH GENERATOR (4 MODES + PLAUSIBLE DISTRACTORS)
   ============================================================================ */
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function generateMathProblem() {
  let op = '+';
  let a = 0, b = 0, c = 0;

  if (state.mode === 10) {
    op = Math.random() < 0.5 ? '+' : '−';
    if (op === '+') {
      a = randInt(1, 9);
      b = randInt(1, 10 - a);
      c = a + b;
    } else {
      a = randInt(2, 10);
      b = randInt(1, a - 1);
      c = a - b;
    }
  } 
  else if (state.mode === 20) {
    op = Math.random() < 0.5 ? '+' : '−';
    if (op === '+') {
      a = randInt(2, 17);
      b = randInt(2, 20 - a);
      c = a + b;
    } else {
      a = randInt(6, 20);
      b = randInt(2, a - 1);
      c = a - b;
    }
  } 
  else if (state.mode === 100) {
    op = Math.random() < 0.5 ? '+' : '−';
    if (op === '+') {
      a = randInt(11, 84);
      b = randInt(6, 100 - a);
      c = a + b;
    } else {
      a = randInt(22, 100);
      b = randInt(7, a - 5);
      c = a - b;
    }
  } 
  else {
    const ops = ['+', '−', '·', ':'];
    op = ops[randInt(0, ops.length - 1)];
    if (op === '+') {
      a = randInt(12, 85);
      b = randInt(8, 100 - a);
      c = a + b;
    } else if (op === '−') {
      a = randInt(24, 100);
      b = randInt(8, a - 6);
      c = a - b;
    } else if (op === '·') {
      a = randInt(2, 9);
      b = randInt(2, 9);
      c = a * b;
    } else {
      b = randInt(2, 9);
      c = randInt(2, 9);
      a = b * c;
    }
  }

  const hiddenIndex = randInt(0, 2);
  const values = [a, b, c];
  const answerValue = values[hiddenIndex];

  const numSet = new Set([answerValue]);
  const maxLimit = (state.mode === 10) ? 10 : (state.mode === 20 ? 20 : 100);
  const offsets = [-10, -3, -2, -1, 1, 2, 3, 4, 10];
  let safety = 0;
  while (numSet.size < 4 && safety < 100) {
    safety++;
    let candidate;
    if (safety < 25) {
      const delta = offsets[randInt(0, offsets.length - 1)];
      candidate = answerValue + delta;
    } else {
      candidate = randInt(1, maxLimit);
    }
    if (candidate >= 0 && candidate <= maxLimit && candidate !== answerValue) {
      numSet.add(candidate);
    }
  }

  const inverseOpMap = { '+': '−', '−': '+', '·': ':', ':': '·' };
  const invOp = inverseOpMap[op];
  const distractorRoleIndex = randInt(0, 2);

  const compOptions = shuffleArray([
    { op: op, roleIndex: 0, isCorrect: hiddenIndex === 0 },
    { op: op, roleIndex: 1, isCorrect: hiddenIndex === 1 },
    { op: op, roleIndex: 2, isCorrect: hiddenIndex === 2 },
    { op: invOp, roleIndex: distractorRoleIndex, isCorrect: false }
  ]);

  return {
    a, b, c, op,
    hiddenIndex,
    answerValue,
    compOptions,
    numOptions: shuffleArray(Array.from(numSet))
  };
}

/* ============================================================================
   8. RESPONSIVE SCALING FOR THE 1920x1080 3D ROOM STAGES
   ============================================================================ */
function fitRoomStagesToViewport() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const scale = Math.max(vw / 1920, vh / 1080);

  const curBox = document.getElementById('currentRoomStageBox');
  const nextBox = document.getElementById('nextRoomStageBox');
  if (curBox) curBox.style.transform = `translate(-50%, -50%) scale(${scale})`;
  if (nextBox) nextBox.style.transform = `translate(-50%, -50%) scale(${scale})`;
}
window.addEventListener('resize', fitRoomStagesToViewport);

/* ============================================================================
   9. RENDERING & UI UPDATES
   ============================================================================ */
function renderProgressArch() {
  const arch = document.getElementById('progress-arch');
  let html = '';
  for (let i = 0; i < 20; i++) {
    let cls = 'arch-gem';
    if (i < state.doorIndex) cls += ' lit';
    else if (i === state.doorIndex && state.doorIndex < 20) cls += ' current';
    html += `<div class="${cls}"></div>`;
  }
  arch.innerHTML = html;
}

function resetPortalLayerTransforms() {
  const curLayer = document.getElementById('currentSceneLayer');
  const nextLayer = document.getElementById('nextSceneLayer');

  curLayer.style.opacity = '1';
  curLayer.style.transform = 'translate3d(0px, 0px, 0px) scale(1)';
  curLayer.style.filter = 'brightness(1)';

  nextLayer.style.opacity = '1';
  nextLayer.style.transform = `translate3d(0px, 0px, 0px) scale(${PORTAL_BASE_SCALE})`;
  nextLayer.style.filter = 'brightness(0.42)';
}

function updateRoomScene() {
  renderProgressArch();
  resetPortalLayerTransforms();
  fitRoomStagesToViewport();

  const curBox = document.getElementById('currentRoomStageBox');
  const nextBox = document.getElementById('nextRoomStageBox');
  const puzzleHud = document.getElementById('puzzle-hud-wrapper');

  // Check if we are inside Surprise Room #21 (index 20)
  if (state.doorIndex === 20) {
    puzzleHud.style.display = 'none';
    curBox.innerHTML = buildCompleteRoomStageHTML(20, 'cur');
    nextBox.innerHTML = buildCompleteRoomStageHTML(0, 'next');
    playSound('dumplings');
    spawnBurst(window.innerWidth * 0.5, window.innerHeight * 0.45, '#ffd25a', 65);
    return;
  }

  puzzleHud.style.display = 'flex';
  puzzleHud.classList.remove('walking-hide');

  const nextIndex = (state.doorIndex + 1) % 21;
  curBox.innerHTML = buildCompleteRoomStageHTML(state.doorIndex, 'cur');
  nextBox.innerHTML = buildCompleteRoomStageHTML(nextIndex, 'next');

  // Reset UI Lock Panels
  document.getElementById('left-lock-panel').classList.remove('unlocked');
  document.getElementById('right-lock-panel').classList.remove('unlocked');

  state.compSolved = false;
  state.numSolved = false;
  state.currentProblem = generateMathProblem();

  renderEquationPlaque();
  renderComponentButtons();
  renderNumberButtons();
}

function renderEquationPlaque() {
  const p = state.currentProblem;
  if (!p) return;

  const parts = [p.a, p.b, p.c];
  document.getElementById('eq-op-symbol').textContent = p.op;

  for (let i = 0; i < 3; i++) {
    const el = document.getElementById(`eq-part-${i}`);
    if (i === p.hiddenIndex) {
      if (state.numSolved) {
        el.innerHTML = `<span class="mystery-box solved">${p.answerValue}</span>`;
      } else {
        el.innerHTML = `<span class="mystery-box">?</span>`;
      }
    } else {
      el.textContent = parts[i];
    }
  }

  const compTag = document.getElementById('solved-comp-tag');
  const correctCompName = COMPONENT_NAMES[state.lang][p.op][p.hiddenIndex];
  compTag.textContent = correctCompName;
  if (state.compSolved) {
    compTag.classList.add('visible');
  } else {
    compTag.classList.remove('visible');
  }
}

function renderComponentButtons() {
  const p = state.currentProblem;
  if (!p) return;
  const container = document.getElementById('comp-buttons-container');
  container.innerHTML = '';

  p.compOptions.forEach((opt) => {
    const btn = document.createElement('button');
    btn.className = 'comp-plaque-btn';
    if (state.compSolved && opt.isCorrect) {
      btn.classList.add('correct-choice');
    }
    if (state.compSolved) {
      btn.disabled = true;
    }
    btn.textContent = COMPONENT_NAMES[state.lang][opt.op][opt.roleIndex];
    btn.onclick = (e) => handleComponentChoice(opt, btn, e);
    container.appendChild(btn);
  });
}

function renderNumberButtons() {
  const p = state.currentProblem;
  if (!p) return;
  const container = document.getElementById('num-buttons-container');
  container.innerHTML = '';

  p.numOptions.forEach((val) => {
    const btn = document.createElement('button');
    btn.className = 'num-dial-btn';
    const isCorrect = val === p.answerValue;
    if (state.numSolved && isCorrect) {
      btn.classList.add('correct-choice');
    }
    if (state.numSolved) {
      btn.disabled = true;
    }
    btn.textContent = val;
    btn.onclick = (e) => handleNumberChoice(val, btn, e);
    container.appendChild(btn);
  });
}

/* ============================================================================
   10. INTERACTION & TRUE 2-PHASE 3D WALK-THROUGH ANIMATION
   ============================================================================ */
function handleComponentChoice(opt, btnElement) {
  if (state.isTransitioning || state.compSolved) return;

  const rect = btnElement.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  if (opt.isCorrect) {
    state.compSolved = true;
    playSound('boltUnlock');
    btnElement.classList.add('correct-choice');

    const boltL = document.getElementById('cur-bolt-left');
    const ledL = document.getElementById('cur-bolt-left-led');
    if (boltL) boltL.classList.add('retracted');
    if (ledL) ledL.setAttribute('fill', '#2bd980');
    document.getElementById('left-lock-panel').classList.add('unlocked');

    renderEquationPlaque();
    renderComponentButtons();

    spawnBurst(cx, cy, '#4be395', 28);
    checkBothLocksSolved();
  } else {
    playSound('wrong');
    btnElement.classList.remove('wrong-choice');
    void btnElement.offsetWidth;
    btnElement.classList.add('wrong-choice');
    spawnBurst(cx, cy, '#ff594f', 16);
  }
}

function handleNumberChoice(val, btnElement) {
  if (state.isTransitioning || state.numSolved) return;

  const rect = btnElement.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  if (val === state.currentProblem.answerValue) {
    state.numSolved = true;
    playSound('boltUnlock');
    btnElement.classList.add('correct-choice');

    const boltR = document.getElementById('cur-bolt-right');
    const ledR = document.getElementById('cur-bolt-right-led');
    if (boltR) boltR.classList.add('retracted');
    if (ledR) ledR.setAttribute('fill', '#2bd980');
    document.getElementById('right-lock-panel').classList.add('unlocked');

    renderEquationPlaque();
    renderNumberButtons();

    spawnBurst(cx, cy, '#ffd25a', 28);
    checkBothLocksSolved();
  } else {
    playSound('wrong');
    btnElement.classList.remove('wrong-choice');
    void btnElement.offsetWidth;
    btnElement.classList.add('wrong-choice');
    spawnBurst(cx, cy, '#ff594f', 16);
  }
}

function checkBothLocksSolved() {
  if (state.compSolved && state.numSolved && !state.isTransitioning) {
    triggerDoorOpenAndWalk();
  }
}

/*
 * TWO-PHASE REALISTIC 3D DOOR SWING + CAMERA WALK-THROUGH:
 * Phase 1 (0.0s - 0.78s): The 3D door leaf inside #currentSceneLayer swings open on its hinges,
 *                         revealing #nextSceneLayer waiting inside the transparent doorway cutout!
 * Phase 2 (0.78s - 2.15s): We physically walk forward through the open doorway!
 *                         BOTH #currentSceneLayer (with its open door & frame) AND #nextSceneLayer
 *                         zoom forward in locked 3D perspective with a 3-step walking camera bob.
 */
function triggerDoorOpenAndWalk() {
  if (state.isTransitioning) return;
  state.isTransitioning = true;

  const wheel = document.getElementById('cur-wheel-lock');
  const gem = document.getElementById('cur-wheel-gem');
  const doorLeaf = document.getElementById('cur-door-leaf');
  const puzzleHud = document.getElementById('puzzle-hud-wrapper');
  const curLayer = document.getElementById('currentSceneLayer');
  const nextLayer = document.getElementById('nextSceneLayer');

  if (gem) gem.setAttribute('fill', '#2bd980');
  if (wheel) wheel.classList.add('unlocked');

  // Spark burst on the central door wheel
  spawnBurst(window.innerWidth * 0.5, window.innerHeight * 0.54, '#6bffb0', 44);

  // Phase 1: Swing open the 3D door attached to the current room's wall
  setTimeout(() => {
    playSound('doorCreak');
    if (doorLeaf) doorLeaf.classList.add('swung-open');
    // Smoothly retract the foreground lock panels so we have a clear view as we walk through
    puzzleHud.classList.add('walking-hide');
  }, 220);

  // Phase 2: Simultaneous Camera Walk-In Through the Open Doorway
  setTimeout(() => {
    const walkDuration = 1320; // ms
    const startTime = performance.now();
    let step1Played = false;
    let step2Played = false;
    let step3Played = false;

    function walkStep(now) {
      const elapsed = now - startTime;
      const t = Math.min(1, elapsed / walkDuration);

      // Smooth easeInOutCubic curve for walking forward
      const ease = t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;

      // Trigger 3 distinct footstep sounds synced with the 3 camera walking bobs
      if (t >= 0.12 && !step1Played) { step1Played = true; playSound('footstep'); }
      if (t >= 0.45 && !step2Played) { step2Played = true; playSound('footstep'); }
      if (t >= 0.78 && !step3Played) { step3Played = true; playSound('footstep'); }

      // Realistic 3-step vertical walking bob (damped at start and end)
      const bobEnvelope = Math.sin(t * Math.PI);
      const bobY = Math.sin(t * Math.PI * 3) * 14 * bobEnvelope;

      // Exponential scale progression so both layers zoom together in locked 3D perspective:
      // curScale goes from 1.0 -> 3.42857 (so the open door & frame zoom past the camera edges!)
      // nextScale goes from 0.29166 -> 1.0 (so the next room grows from the doorway to fill the screen!)
      const curScale = Math.pow(PORTAL_ZOOM_FACTOR, ease);
      const nextScale = PORTAL_BASE_SCALE * curScale;

      curLayer.style.transform = `translate3d(0px, ${bobY.toFixed(1)}px, 0px) scale(${curScale.toFixed(4)})`;
      nextLayer.style.transform = `translate3d(0px, ${(bobY * 0.35).toFixed(1)}px, 0px) scale(${nextScale.toFixed(4)})`;

      // Next room brightens from deep corridor shadow (0.42) to full room lighting (1.0)
      const nextBright = 0.42 + 0.58 * ease;
      nextLayer.style.filter = `brightness(${nextBright.toFixed(3)})`;

      // Only in the final 18% of the walk (after the open doorway frame has passed outside the viewport)
      // fade out #currentSceneLayer
      if (t > 0.82) {
        const fade = 1 - (t - 0.82) / 0.18;
        curLayer.style.opacity = Math.max(0, fade).toFixed(3);
      }

      if (t < 1) {
        requestAnimationFrame(walkStep);
      } else {
        // Walk complete! Promote next room to current room seamlessly
        state.doorIndex = (state.doorIndex + 1) % 21;
        updateRoomScene();
        state.isTransitioning = false;
      }
    }

    requestAnimationFrame(walkStep);
  }, 780);
}

  playSound('click');
  state.mode = newMode;

  document.querySelectorAll('[data-mode]').forEach((btn) => {
    const btnMode = btn.getAttribute('data-mode');
    if (String(btnMode) === String(newMode)) {
      btn.classList.add('active-mode');
    } else {
      btn.classList.remove('active-mode');
    }
  });

  if (state.doorIndex === 20) {
    state.doorIndex = 0;
  }
  updateRoomScene();
}

function skipToNextRoom() {
  if (state.isTransitioning) return;
  playSound('click');

  if (state.doorIndex === 20) {
    state.doorIndex = 0;
    updateRoomScene();
    return;
  }

  const boltL = document.getElementById('cur-bolt-left');
  const boltR = document.getElementById('cur-bolt-right');
  if (boltL) boltL.classList.add('retracted');
  if (boltR) boltR.classList.add('retracted');
  triggerDoorOpenAndWalk();
}

function interactDumplings(e) {
  playSound('dumplings');
  spawnBurst(e.clientX || window.innerWidth * 0.5, e.clientY || window.innerHeight * 0.5, '#ffd24c', 55);
}

function interactDuck(e) {
  playSound('duck');
  spawnBurst(e.clientX || window.innerWidth * 0.35, e.clientY || window.innerHeight * 0.7, '#ffe047', 35);
}

function interactGramophone(e) {
  state.gramophoneFast = !state.gramophoneFast;
  playSound('gramophone');
  spawnBurst(e.clientX || window.innerWidth * 0.7, e.clientY || window.innerHeight * 0.6, '#6bffb0', 38);
}

function toggleVaultLasers(e) {
  state.lasersActive = !state.lasersActive;
  playSound('laser');
  document.getElementById('currentRoomStageBox').innerHTML = buildCompleteRoomStageHTML(20, 'cur');
  spawnBurst(e.clientX || window.innerWidth * 0.25, e.clientY || window.innerHeight * 0.5, '#ff3b56', 28);
}

/* ============================================================================
   12. AMBIENT & FEEDBACK PARTICLE ENGINE (CANVAS)
   ============================================================================ */
const canvas = document.getElementById('fx-canvas');
const ctx = canvas.getContext('2d');
let ambientParticles = [];
let burstParticles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function initAmbientParticles() {
  ambientParticles = [];
  for (let i = 0; i < 48; i++) {
    ambientParticles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2.6 + 1,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5,
      alpha: Math.random() * 0.55 + 0.15
    });
  }
}

function spawnBurst(x, y, color, count = 28) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 7 + 2;
    burstParticles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1.5,
      r: Math.random() * 4.5 + 2,
      color,
      life: 1.0,
      decay: Math.random() * 0.024 + 0.016
    });
  }
}

function animateFX() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const currentTheme = ROOM_THEMES[state.doorIndex % 20];
  const pType = state.doorIndex === 20 ? 'sparks' : currentTheme.particleType;

  for (let p of ambientParticles) {
    if (pType === 'rain') {
      p.y += 8.5;
      p.x -= 1.2;
      ctx.strokeStyle = `rgba(180, 225, 255, ${p.alpha * 0.65})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - 3, p.y + 16);
      ctx.stroke();
    } else if (pType === 'snow') {
      p.y += 1.4;
      p.x += Math.sin(p.y * 0.02) * 0.6;
      ctx.fillStyle = `rgba(240, 248, 255, ${p.alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 1.2, 0, Math.PI * 2);
      ctx.fill();
    } else if (pType === 'embers' || pType === 'sparks') {
      p.y -= 0.9;
      p.x += Math.sin(p.y * 0.03) * 0.5;
      ctx.fillStyle = `rgba(255, 195, 85, ${p.alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    } else if (pType === 'bubbles') {
      p.y -= 1.1;
      ctx.strokeStyle = `rgba(140, 255, 220, ${p.alpha})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 1.6, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      p.x += p.vx;
      p.y += p.vy;
      ctx.fillStyle = `rgba(255, 232, 175, ${p.alpha * 0.7})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }

    if (p.y > canvas.height + 20) p.y = -10;
    if (p.y < -20) p.y = canvas.height + 10;
    if (p.x > canvas.width + 20) p.x = -10;
    if (p.x < -20) p.x = canvas.width + 10;
  }

  for (let i = burstParticles.length - 1; i >= 0; i--) {
    const b = burstParticles[i];
    b.x += b.vx;
    b.y += b.vy;
    b.vy += 0.18;
    b.life -= b.decay;

    if (b.life <= 0) {
      burstParticles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = Math.max(0, b.life);
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(animateFX);
}

/* ============================================================================
   13. INITIALIZATION ON WINDOW LOAD
   ============================================================================ */
window.onload = function () {
  initAmbientParticles();
  updateRoomScene();
  animateFX();
};
</script>
