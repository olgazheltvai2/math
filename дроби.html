<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractions Game</title>
    <style>
        /* Базові налаштування та шрифт */
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f8ff;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.5s ease;
            padding: 20px;
        }

        /* Широкоформатний головний контейнер */
        #game-wrapper {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 1800px; /* Трохи розширено для вміщення двох панелей */
            display: flex;
            flex-direction: row;
            position: relative;
        }

        /* Ігрова зона для 2-х дітей (включає їхні персональні налаштування) */
        #play-area {
            flex: 1;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: stretch;
            gap: 20px;
        }

        .player-zone {
            display: flex;
            flex-direction: row; /* Налаштування зліва, гра справа для кожного гравця */
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 20px;
            width: 49%;
            gap: 20px;
        }

        /* Персональна панель налаштувань гравця */
        .player-setup {
            background: rgba(0, 0, 0, 0.05);
            padding: 20px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
            min-width: 200px;
        }

        .shapes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        .shape-btn {
            font-size: 30px;
            background: #fff;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            padding: 10px;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shape-btn.active {
            border-color: #007bff;
            background: #e7f1ff;
            transform: scale(1.1);
        }

        .inputs-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            font-size: 30px;
            font-weight: bold;
            width: 100%;
        }

        .fraction-inputs {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .fraction-line {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
        }

        /* Вдвічі збільшений шрифт полів вводу за запитом */
        .inputs-column input {
            width: 90px;
            height: 60px;
            font-size: 48px; 
            text-align: center;
            border: 3px solid #ccc;
            border-radius: 10px;
            outline: none;
        }

        .parts-input {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .generate-btn {
            font-size: 30px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            transition: 0.2s;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,123,255,0.3);
        }
        .generate-btn:hover { background: #0056b3; transform: translateY(-2px); }

        /* Власне ігрове поле гравця (де фігура) */
        .player-game {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .task-display {
            font-size: 60px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            letter-spacing: 5px;
        }

        .svg-container {
            width: 350px;
            height: 350px;
            margin: 0 auto;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.15));
        }

        /* Стилі для частинок фігури */
        .fraction-part {
            fill: #ffffff;
            stroke: #333333;
            stroke-width: 3;
            cursor: pointer;
            transition: fill 0.2s, filter 0.2s;
        }
        
        .fraction-part:hover { filter: brightness(0.9); }
        .fraction-part.selected { fill: #ffce00; }

        /* Обводка для складних фігур */
        .shape-outline {
            fill: none;
            stroke: #333333;
            stroke-width: 6;
            pointer-events: none;
        }

        /* Кнопки перевірки */
        .check-btn {
            font-size: 50px;
            background: none;
            border: none;
            cursor: pointer;
            margin-top: 30px;
            transition: transform 0.2s;
            filter: grayscale(20%);
        }
        .check-btn:hover {
            transform: scale(1.2);
            filter: grayscale(0%);
        }

        /* Анімації */
        @keyframes tada {
            0% { transform: scale(1); }
            10%, 20% { transform: scale(0.9) rotate(-3deg); }
            30%, 50%, 70%, 90% { transform: scale(1.1) rotate(3deg); }
            40%, 60%, 80% { transform: scale(1.1) rotate(-3deg); }
            100% { transform: scale(1) rotate(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        .animate-win { animation: tada 1s ease-in-out; }
        .animate-error { animation: shake 0.5s ease-in-out; }

        /* --- Theme Manager CSS --- */
        #tm-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-size: 30px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s;
        }
        #tm-btn:hover { transform: rotate(45deg) scale(1.1); }

        #tm-modal {
            display: none;
            position: fixed;
            bottom: 90px;
            right: 20px;
            z-index: 9998;
            background: #ffffff;
            width: 320px;
            max-height: 60vh;
            overflow-y: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 15px;
        }

        #tm-gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .tm-thumb {
            width: 100%;
            height: 100px;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .tm-thumb:hover {
            border-color: #007bff;
            transform: scale(1.05);
        }
        .tm-thumb span {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
        }

        /* Ефекти конфеті */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="play-area">
            
            <!-- Гравець 1 -->
            <div class="player-zone" id="player-1">
                <div class="player-setup">
                    <div class="shapes-grid" id="shapes-container-1"></div>
                    <div class="inputs-column">
                        🎯 
                        <div class="fraction-inputs">
                            <input type="number" id="target-num-1" value="1" min="1">
                            <div class="fraction-line"></div>
                            <input type="number" id="target-den-1" value="3" min="1">
                        </div>
                        <div class="parts-input">
                            🧩 <input type="number" id="total-parts-1" value="3" min="1">
                        </div>
                        <button class="generate-btn" data-player="1">🔄</button>
                    </div>
                </div>
                <div class="player-game">
                    <div class="task-display" id="task-display-1">1 / 3</div>
                    <div class="svg-container" id="svg-container-1"></div>
                    <button class="check-btn" id="check-btn-1" data-player="1">✔️</button>
                </div>
            </div>

            <!-- Гравець 2 -->
            <div class="player-zone" id="player-2">
                <div class="player-setup">
                    <div class="shapes-grid" id="shapes-container-2"></div>
                    <div class="inputs-column">
                        🎯 
                        <div class="fraction-inputs">
                            <input type="number" id="target-num-2" value="1" min="1">
                            <div class="fraction-line"></div>
                            <input type="number" id="target-den-2" value="2" min="1">
                        </div>
                        <div class="parts-input">
                            🧩 <input type="number" id="total-parts-2" value="2" min="1">
                        </div>
                        <button class="generate-btn" data-player="2">🔄</button>
                    </div>
                </div>
                <div class="player-game">
                    <div class="task-display" id="task-display-2">1 / 2</div>
                    <div class="svg-container" id="svg-container-2"></div>
                    <button class="check-btn" id="check-btn-2" data-player="2">✔️</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Theme Manager UI -->
    <button id="tm-btn">⚙️</button>
    <div id="tm-modal">
        <div id="tm-gallery"></div>
    </div>

    <script>
        // ==========================================
// 1. НАЛАШТУВАННЯ ФІГУР ТА СТАН ГРИ (6 ФІГУР)
// ==========================================
const shapesConfig = [
    { id: 'circle', icon: '🔴', type: 'circle' },
    { id: 'square', icon: '🟦', type: 'rect', w: 300, h: 300 },
    { id: 'rect', icon: '▭', type: 'rect', w: 340, h: 200 },
    { id: 'triangle', icon: '🔺', type: 'polygon', sides: 3 },
    { id: 'pentagon', icon: '⬟', type: 'polygon', sides: 5 },
    { id: 'hexagon', icon: '⬢', type: 'polygon', sides: 6 }
];

// Незалежні стани для двох гравців
let currentShape1 = 'circle';
let currentShape2 = 'square'; // Хай за замовчуванням будуть різні фігури

// Ініціалізація кнопок вибору фігур для кожного гравця
function initShapesList(playerNum) {
    const container = document.getElementById(`shapes-container-${playerNum}`);
    container.innerHTML = '';
    
    shapesConfig.forEach(shape => {
        const btn = document.createElement('button');
        // Перевіряємо, чи активна кнопка для конкретного гравця
        const isActive = (playerNum === 1 && currentShape1 === shape.id) || (playerNum === 2 && currentShape2 === shape.id);
        
        btn.className = 'shape-btn' + (isActive ? ' active' : '');
        btn.innerHTML = shape.icon;
        
        btn.onclick = () => {
            container.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Записуємо вибір у відповідну змінну
            if (playerNum === 1) currentShape1 = shape.id;
            if (playerNum === 2) currentShape2 = shape.id;
            
            generateGame(playerNum);
        };
        container.appendChild(btn);
    });
}

initShapesList(1);
initShapesList(2);

// ==========================================
// 2. ГЕНЕРАТОР SVG (МАТЕМАТИКА ТА CLIP-PATH)
// ==========================================
function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
    const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
    return {
        x: centerX + (radius * Math.cos(angleInRadians)),
        y: centerY + (radius * Math.sin(angleInRadians))
    };
}

function createPieSlice(cx, cy, r, startAngle, endAngle) {
    if (Math.abs(endAngle - startAngle) >= 360) {
        return `<circle cx="${cx}" cy="${cy}" r="${r}" class="fraction-part" />`;
    }
    const start = polarToCartesian(cx, cy, r, endAngle);
    const end = polarToCartesian(cx, cy, r, startAngle);
    const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
    return `<path d="M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArcFlag} 0 ${end.x} ${end.y} Z" class="fraction-part" />`;
}

// Функція тепер приймає номер гравця
function generateGame(playerNum) {
    const totalParts = parseInt(document.getElementById(`total-parts-${playerNum}`).value) || 1;
    const targetNum = parseInt(document.getElementById(`target-num-${playerNum}`).value) || 1;
    const targetDen = parseInt(document.getElementById(`target-den-${playerNum}`).value) || 1;

    // Оновлюємо табло лише для потрібного гравця
    document.getElementById(`task-display-${playerNum}`).innerHTML = `${targetNum} / ${targetDen}`;
    
    // Визначаємо фігуру для поточного гравця
    const currentShapeId = playerNum === 1 ? currentShape1 : currentShape2;
    const shape = shapesConfig.find(s => s.id === currentShapeId);
    
    let svgContent = '';
    let clipStyle = '';
    let outlineContent = '';

    // Математика генерації для круга та багатокутників (через сектори)
    if (shape.type === 'circle' || shape.type === 'polygon') {
        const angleStep = 360 / totalParts;
        for (let i = 0; i < totalParts; i++) {
            svgContent += createPieSlice(175, 175, 175, i * angleStep, (i + 1) * angleStep);
        }

        if (shape.type === 'polygon') {
            // Математичний алгоритм обрізки для багатокутників
            let points = [];
            let outlinePoints = [];
            for (let i = 0; i < shape.sides; i++) {
                let angle = -Math.PI / 2 + (i * 2 * Math.PI / shape.sides);
                let x = 175 + 175 * Math.cos(angle);
                let y = 175 + 175 * Math.sin(angle);
                points.push(`${((x/350)*100).toFixed(2)}% ${((y/350)*100).toFixed(2)}%`);
                outlinePoints.push(`${x},${y}`);
            }
            clipStyle = `clip-path: polygon(${points.join(', ')}); -webkit-clip-path: polygon(${points.join(', ')});`;
            outlineContent = `<polygon points="${outlinePoints.join(' ')}" class="shape-outline" />`;
        } else {
            // Для круга обводка
            outlineContent = `<circle cx="175" cy="175" r="173" class="shape-outline" />`;
        }
    } 
    // Математика генерації для квадратів та прямокутників (вертикальні смуги)
    else if (shape.type === 'rect') {
        const xOffset = (350 - shape.w) / 2;
        const yOffset = (350 - shape.h) / 2;
        const step = shape.w / totalParts;
        
        for (let i = 0; i < totalParts; i++) {
            svgContent += `<rect x="${xOffset + i*step}" y="${yOffset}" width="${step}" height="${shape.h}" class="fraction-part" />`;
        }
        outlineContent = `<rect x="${xOffset}" y="${yOffset}" width="${shape.w}" height="${shape.h}" class="shape-outline" />`;
    }

    // Вставляємо згенеровану фігуру тільки у контейнер гравця, якого оновлюємо
    const container = document.getElementById(`svg-container-${playerNum}`);
    container.innerHTML = `<svg viewBox="0 0 350 350" style="${clipStyle}">${svgContent}${outlineContent}</svg>`;
    
    // Знімаємо класи анімацій попередніх відповідей
    container.classList.remove('animate-win', 'animate-error');

    // Навішуємо події кліку незалежно для цієї зони
    container.querySelectorAll('.fraction-part').forEach(part => {
        part.addEventListener('click', function() {
            this.classList.toggle('selected');
        });
    });
}

// ==========================================
// 3. ЛОГІКА ПЕРЕВІРКИ ТА ФІДБЕК (НЕЗАЛЕЖНО)
// ==========================================

// Окремо обробляємо кнопки генерації для кожного гравця
document.querySelectorAll('.generate-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const playerNum = parseInt(this.getAttribute('data-player'));
        generateGame(playerNum);
    });
});

// Перевірка
document.querySelectorAll('.check-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const player = parseInt(this.getAttribute('data-player'));
        const container = document.getElementById(`svg-container-${player}`);
        const selectedCount = container.querySelectorAll('.fraction-part.selected').length;
        
        const totalParts = parseInt(document.getElementById(`total-parts-${player}`).value) || 1;
        const targetNum = parseInt(document.getElementById(`target-num-${player}`).value) || 1;
        const targetDen = parseInt(document.getElementById(`target-den-${player}`).value) || 1;

        // Перевірка еквівалентності дробів
        const isCorrect = (selectedCount * targetDen) === (targetNum * totalParts) && selectedCount > 0;
        
        container.classList.remove('animate-win', 'animate-error');
        void container.offsetWidth; // Тригер рефлоу

        if (isCorrect) {
            container.classList.add('animate-win');
            playWinSound();
            createConfetti(player);
        } else {
            container.classList.add('animate-error');
        }
    });
});

// Автономний тихий звук перемоги (Web Audio API)
function playWinSound() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playNote(frequency, startTime, duration) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.value = frequency;
            
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(0.1, startTime + 0.05); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start(startTime);
            oscillator.stop(startTime + duration);
        }

        const now = audioCtx.currentTime;
        playNote(523.25, now, 0.2);       // C5
        playNote(659.25, now + 0.15, 0.2); // E5
        playNote(783.99, now + 0.3, 0.4);  // G5
    } catch(e) { console.log('Audio error'); }
}

// Конфеті падає лише в зоні того гравця, який відповів правильно
function createConfetti(playerNum) {
    const colors = ['#ff0', '#f0f', '#0ff', '#0f0', '#f00'];
    const playerZone = document.getElementById(`player-${playerNum}`);
    const rect = playerZone.getBoundingClientRect();

    for (let i = 0; i < 40; i++) {
        const conf = document.createElement('div');
        conf.className = 'confetti';
        conf.style.left = rect.left + (Math.random() * rect.width) + 'px';
        conf.style.top = rect.top + 'px';
        conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.transform = `rotate(${Math.random() * 360}deg)`;
        document.body.appendChild(conf);

        const fallDuration = Math.random() * 2 + 1.5;
        conf.animate([
            { transform: `translateY(0) rotate(0deg)` },
            { transform: `translateY(${rect.height + 50}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
        ], {
            duration: fallDuration * 1000,
            easing: 'cubic-bezier(.37,0,.63,1)'
        });

        setTimeout(() => conf.remove(), fallDuration * 1000);
    }
}

// ==========================================
// 4. СИСТЕМА ДИНАМІЧНИХ ФОНІВ (THEME MANAGER)
// ==========================================
const baseUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
const tmBtn = document.getElementById('tm-btn');
const tmModal = document.getElementById('tm-modal');
const tmGallery = document.getElementById('tm-gallery');

// Відкриття/закриття меню
tmBtn.addEventListener('click', () => {
    tmModal.style.display = tmModal.style.display === 'block' ? 'none' : 'block';
});

// Асинхронна перевірка картинки
function checkImage(url) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
    });
}

// Завантаження фонів
async function initThemeManager() {
    let savedBg = localStorage.getItem('mySavedGameBg');
    if (savedBg) {
        document.body.style.backgroundImage = `url(${savedBg})`;
    } else {
        document.body.style.backgroundImage = `url(${baseUrl}background_1.webp)`;
    }

    let consecutiveErrors = 0;
    
    for (let i = 1; i <= 1000; i++) {
        if (consecutiveErrors >= 3) break; 
        
        let bgUrl = `${baseUrl}background_${i}.webp`;
        try {
            let exists = await checkImage(bgUrl);
            if (exists) {
                consecutiveErrors = 0;
                
                // Створення мініатюри
                const thumb = document.createElement('div');
                thumb.className = 'tm-thumb';
                thumb.style.backgroundImage = `url(${bgUrl})`;
                thumb.innerHTML = `<span>Фон ${i}</span>`;
                
                thumb.onclick = () => {
                    document.body.style.backgroundImage = `url(${bgUrl})`;
                    localStorage.setItem('mySavedGameBg', bgUrl);
                };
                
                tmGallery.appendChild(thumb);
            } else {
                consecutiveErrors++;
            }
        } catch (e) {
            consecutiveErrors++;
        }
    }
}

// Запуск при завантаженні
window.onload = () => {
    generateGame(1);
    generateGame(2);
    initThemeManager();
};
    </script>
<script src="https://olgazheltvai2.github.io/rizne/pencil.js"></script></body>
