<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтерактивна гра: Додавання та Множення</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 90vw;
            max-width: 1200px;
            text-align: center;
        }

        /* Основний рядок, де все знаходиться на одній лінії */
        .main-row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 30px;
            width: 100%;
        }

        /* Відображення додавання (зліва) */
        .math-display {
            font-size: 4rem;
            font-weight: bold;
            color: #2c3e50;
            word-break: break-all;
            text-align: right;
        }

        /* Знак дорівнює */
        .equals-sign {
            font-size: 4rem;
            font-weight: bold;
            color: #2c3e50;
            display: none; /* Приховано, поки немає вводу */
        }

        /* Секція вводу множення (справа) */
        .inputs-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Видимі вікна для вводу з прихованим текстом */
        .inputs-section input {
            width: 90px;
            height: 90px;
            font-size: 4rem;
            text-align: center;
            border: 4px solid #3498db; /* Видима рамка */
            border-radius: 12px;
            background: #fff; /* Видимий фон віконця */
            color: #fff; /* Колір тексту зливається з фоном (невидимий для дитини) */
            caret-color: transparent; /* Ховає курсор */
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .inputs-section input:focus {
            border-color: #2980b9;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.5);
            color: #fff; /* Залишається невидимим при виділенні */
        }

        /* Прибираємо стрілочки у полів type="number" */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Видимий знак множення між вікнами */
        .multiply-sign {
            font-size: 4rem;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Стилі для Theme Manager */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            font-size: 28px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }

        #theme-btn:hover {
            transform: scale(1.1);
        }

        #theme-modal {
            position: fixed;
            bottom: 90px;
            right: 20px;
            z-index: 9998;
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 320px;
            max-height: 60vh;
            overflow-y: auto;
            display: none;
        }

        #theme-modal h3 {
            margin-top: 0;
            text-align: center;
            color: #333;
            font-size: 1.5rem;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .theme-thumb {
            position: relative;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid transparent;
            transition: border-color 0.2s;
            background-size: cover;
            background-position: center;
        }

        .theme-thumb:hover {
            border-color: #3498db;
        }

        .theme-thumb span {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 0.8rem;
            padding: 3px;
            text-align: center;
        }
    </style>
<style id="canvas-click-fix">canvas#draw-canvas { pointer-events: none !important; } .drawing-active canvas#draw-canvas { pointer-events: auto !important; }</style></head>
<body>

    <div class="game-container">
        <div class="main-row">
            <!-- Відображення додавання (Зліва) -->
            <div class="math-display" id="addition-display"></div>
            
            <!-- Знак дорівнює (Між ними) -->
            <span class="equals-sign" id="equals-sign">=</span>

            <!-- Множення (Справа) -->
            <div class="inputs-section">
                <!-- Ліве вікно -->
                <input type="number" id="num1" value="">
                
                <!-- Видимий знак множення -->
                <span class="multiply-sign">×</span>
                
                <!-- Праве вікно -->
                <input type="number" id="num2" value="">
            </div>
        </div>
    </div>

    <!-- Theme Manager Elements -->
    <button id="theme-btn" title="Змінити фон">⚙️</button>
    <div id="theme-modal">
        <h3>Виберіть фон</h3>
        <div class="theme-grid" id="theme-grid"></div>
    </div>

    <script>
        const num1Input = document.getElementById('num1');
        const num2Input = document.getElementById('num2');
        const additionDisplay = document.getElementById('addition-display');
        const equalsSign = document.getElementById('equals-sign');

        function updateMath() {
            let n1 = parseInt(num1Input.value);
            let n2 = parseInt(num2Input.value);

            if (isNaN(n1) || isNaN(n2) || n2 <= 0) {
                additionDisplay.textContent = '';
                equalsSign.style.display = 'none'; // Ховаємо "=", якщо вікна пусті або некоректні
                return;
            }

            let terms = [];
            for (let i = 0; i < n2; i++) {
                terms.push(n1);
            }

            // Формуємо рядок додавання
            additionDisplay.textContent = terms.join(' + ');
            // Показуємо знак "="
            equalsSign.style.display = 'inline-block';
        }

        // Оновлюємо вираз одразу під час вводу
        num1Input.addEventListener('input', updateMath);
        num2Input.addEventListener('input', updateMath);

        // Theme Manager Logic
        const baseUrl = "https://olgazheltvai2.github.io/images/backgrounds/";
        const defaultBg = baseUrl + "background_1.webp";
        const themeBtn = document.getElementById('theme-btn');
        const themeModal = document.getElementById('theme-modal');
        const themeGrid = document.getElementById('theme-grid');

        // Автозбереження та завантаження фону
        const savedBg = localStorage.getItem('mySavedGameBg');
        if (savedBg) {
            document.body.style.backgroundImage = `url('${savedBg}')`;
        } else {
            document.body.style.backgroundImage = `url('${defaultBg}')`;
        }

        themeBtn.addEventListener('click', () => {
            themeModal.style.display = themeModal.style.display === 'block' ? 'none' : 'block';
        });

        window.addEventListener('click', (e) => {
            if (!themeModal.contains(e.target) && e.target !== themeBtn) {
                themeModal.style.display = 'none';
            }
        });

        // Автоматичне завантаження та перевірка фонів від 1 до 1000
        for (let i = 1; i <= 1000; i++) {
            const bgUrl = `${baseUrl}background_${i}.webp`;
            const img = new Image();
            img.src = bgUrl;
            img.onload = function() {
                const thumb = document.createElement('div');
                thumb.className = 'theme-thumb';
                thumb.style.backgroundImage = `url('${bgUrl}')`;
                thumb.innerHTML = `<span>Фон ${i}</span>`;
                
                thumb.addEventListener('click', () => {
                    document.body.style.backgroundImage = `url('${bgUrl}')`;
                    localStorage.setItem('mySavedGameBg', bgUrl);
                    themeModal.style.display = 'none';
                });

                themeGrid.appendChild(thumb);
            };
        }
    </script>
</html>
