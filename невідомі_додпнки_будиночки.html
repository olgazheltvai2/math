<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магічні Будиночки</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        :root {
            --sky-top: #3b82f6;
            --sky-bottom: #93c5fd;
            --grass-back: #22c55e;
            --grass-front: #16a34a;
            --roof-color: #ef4444;
            --roof-shadow: #b91c1c;
            --house-wall: #fde047;
            --house-shadow: #ca8a04;
            --wood: #78350f;
            --wood-light: #b45309;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Nunito', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
        }

        /* --- ЖИВИЙ БАГАТОШАРОВИЙ ФОН --- */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .sun {
            position: absolute;
            top: 5%;
            left: 5%;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #fef08a 30%, #fde047 70%, #eab308 100%);
            border-radius: 50%;
            box-shadow: 0 0 60px 20px rgba(253, 224, 71, 0.4);
            animation: pulseSun 4s infinite alternate;
        }

        @keyframes pulseSun {
            from { transform: scale(1); box-shadow: 0 0 50px 15px rgba(253, 224, 71, 0.4); }
            to { transform: scale(1.05); box-shadow: 0 0 80px 30px rgba(253, 224, 71, 0.6); }
        }

        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 50px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            opacity: 0.85;
            animation: floatClouds linear infinite;
        }
        
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 50%;
        }

        .cloud1 { width: 120px; height: 50px; top: 15%; left: -150px; animation-duration: 30s; }
        .cloud1::before { width: 60px; height: 60px; top: -30px; left: 15px; }
        .cloud1::after { width: 80px; height: 80px; top: -40px; left: 50px; }

        .cloud2 { width: 180px; height: 60px; top: 25%; left: -250px; animation-duration: 45s; animation-delay: 10s; }
        .cloud2::before { width: 80px; height: 80px; top: -40px; left: 30px; }
        .cloud2::after { width: 100px; height: 100px; top: -50px; left: 80px; }

        @keyframes floatClouds {
            from { transform: translateX(0); }
            to { transform: translateX(120vw); }
        }

        .hill-back {
            position: absolute;
            bottom: 10%;
            left: -10%;
            width: 120%;
            height: 35%;
            background: var(--grass-back);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            z-index: 2;
            box-shadow: inset 0 20px 30px rgba(0,0,0,0.1);
        }

        .hill-front {
            position: absolute;
            bottom: 0;
            left: -5%;
            width: 110%;
            height: 25%;
            background: var(--grass-front);
            border-radius: 40% 60% 0 0 / 100% 100% 0 0;
            z-index: 3;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.15);
        }

        /* CSS Дерева */
        .tree {
            position: absolute;
            bottom: 15%;
            z-index: 4;
            width: 40px;
            height: 80px;
        }
        .tree::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 15px;
            width: 10px;
            height: 40px;
            background: #5c3a21;
            border-radius: 5px;
        }
        .tree::after {
            content: '';
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 40px;
            height: 60px;
            background: #166534;
            border-radius: 50% 50% 20% 20%;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3);
        }
        .tree1 { left: 5%; transform: scale(1.2); }
        .tree2 { left: 15%; transform: scale(0.8); bottom: 12%; }
        .tree3 { right: 8%; transform: scale(1.5); bottom: 18%; }

        /* --- ГОЛОВНИЙ КОНТЕЙНЕР --- */
        .game-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            gap: 40px;
        }

        /* Верхня панель (кнопки) */
        .top-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .btn-toggle {
            background: linear-gradient(145deg, #8e44ad, #732d91);
            color: #fff;
            border: 3px solid #fff;
            border-radius: 20px;
            padding: 10px 25px;
            font-size: 22px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 0 #4a154b, 0 10px 10px rgba(0,0,0,0.2);
            transition: all 0.1s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .btn-toggle:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #4a154b;
        }

        .btn-next {
            background: linear-gradient(145deg, #2ecc71, #27ae60);
            color: #fff;
            border: 3px solid #fff;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 35px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 0 #1e8449, 0 10px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .btn-next:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #1e8449;
        }

        /* Дошка з будиночками */
        .board {
            display: flex;
            gap: 25px;
            perspective: 1000px;
        }

        .house-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: dropIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes dropIn {
            0% { transform: translateY(-50px) scale(0.8); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* --- БУДИНОЧОК --- */
        .house {
            position: relative;
            width: 240px;
            height: 200px;
            margin-bottom: 20px;
        }

        .roof {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 135px solid transparent;
            border-right: 135px solid transparent;
            border-bottom: 120px solid var(--roof-color);
            filter: drop-shadow(0 8px 0 var(--roof-shadow));
        }
        
        /* Текстура черепиці */
        .roof::after {
            content: '';
            position: absolute;
            top: 0;
            left: -135px;
            width: 270px;
            height: 120px;
            background-image: 
                radial-gradient(circle at 50% 120%, transparent 20%, rgba(255,255,255,0.1) 21%, rgba(255,255,255,0.1) 25%, transparent 26%),
                linear-gradient(to right, transparent 48%, rgba(0,0,0,0.1) 49%, rgba(0,0,0,0.1) 51%, transparent 52%);
            background-size: 30px 30px, 30px 100%;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .roof-input-container {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
        }

        .body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 100px;
            background: var(--house-wall);
            border-radius: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.1), 0 8px 0 var(--house-shadow);
            border: 4px solid #facc15;
        }

        /* Віконечка/клітинки */
        .circle-input {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #ffb3b3);
            border: 5px solid #991b1b;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.3), 0 0 15px rgba(255,255,255,0.8);
            font-size: 46px; /* Збільшено шрифт */
            font-weight: 900;
            color: #991b1b;
            text-align: center;
            outline: none;
            transition: all 0.2s;
            line-height: 1;
        }

        .square-input {
            width: 65px;
            height: 65px;
            border-radius: 10px;
            background: linear-gradient(135deg, #e0f2fe, #bae6fd);
            border: 4px solid #0284c7;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.2), 0 4px 0 #0369a1;
            font-size: 40px; /* Збільшено шрифт */
            font-weight: 900;
            color: #0c4a6e;
            text-align: center;
            outline: none;
            transition: all 0.2s;
            line-height: 1;
        }

        /* Стани клітинок */
        .empty-box {
            background: linear-gradient(135deg, #ffffff, #e2e8f0);
            cursor: pointer;
            border: 4px dashed #94a3b8;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        .empty-box:focus, .empty-box.active {
            background: #fff;
            box-shadow: 0 0 20px #facc15, inset 0 0 10px #facc15;
            border-color: #eab308;
            border-style: solid;
            transform: scale(1.1);
        }
        .filled-box {
            background: linear-gradient(135deg, #bbf7d0, #86efac);
            border-color: #16a34a;
            color: #14532d;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.1), 0 4px 0 #15803d;
            cursor: default;
            pointer-events: none;
            transform: scale(1);
        }
        .wrong-box {
            animation: shake 0.4s;
            background: #fecaca !important;
            border-color: #dc2626 !important;
            color: #7f1d1d !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            50% { transform: translateX(5px) rotate(5deg); }
            75% { transform: translateX(-5px) rotate(-5deg); }
        }

        /* --- ДЕРЕВ'ЯНА ДОШКА З РІВНЯННЯМИ --- */
        .equations {
            background: linear-gradient(to bottom, #d97706, #b45309);
            padding: 20px 15px;
            border-radius: 15px;
            box-shadow: 0 10px 0 #78350f, inset 0 0 20px rgba(0,0,0,0.5);
            border: 5px solid #fcd34d;
            width: 250px; /* Збільшено ширину */
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        /* Цвяшки на дошці */
        .equations::before, .equations::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: #64748b;
            border-radius: 50%;
            box-shadow: inset 0 2px 3px #fff, 0 2px 2px rgba(0,0,0,0.5);
        }
        .equations::before { top: 10px; left: 10px; }
        .equations::after { top: 10px; right: 10px; }

        .eq-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            font-size: 32px; /* Значно збільшено шрифт рівнянь */
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 0 #78350f;
        }

        .eq-input {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            background: #fffbeb;
            border: 3px solid #78350f;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.2);
            font-size: 32px; /* Збільшено шрифт вводу */
            font-weight: 900;
            color: #78350f;
            text-align: center;
            outline: none;
            transition: all 0.2s;
            line-height: 1;
        }
        
        .eq-input.empty-box {
            border: 3px dashed #78350f;
            background: #fef3c7;
        }
        
        .eq-input.active {
            background: #fff;
            box-shadow: 0 0 15px #facc15;
            border-color: #facc15;
            border-style: solid;
            transform: scale(1.05);
        }

        /* --- ПАНЕЛЬ ВВОДУ СПРАВА --- */
        .numpad-container {
            position: relative;
            padding: 30px;
            background: linear-gradient(135deg, #475569, #1e293b);
            border-radius: 35px;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.4), 
                inset 0 2px 5px rgba(255,255,255,0.2),
                inset 0 -10px 20px rgba(0,0,0,0.5);
            border: 5px solid #94a3b8;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            animation: slideInRight 0.6s ease-out;
        }

        /* Декоративні гвинти на панелі */
        .numpad-container::before, .numpad-container::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #cbd5e1, #64748b);
            border-radius: 50%;
            box-shadow: inset 0 2px 3px #fff, 0 2px 3px #000;
        }
        .numpad-container::before { top: 12px; left: 12px; }
        .numpad-container::after { bottom: 12px; right: 12px; }

        @keyframes slideInRight {
            0% { transform: translateX(100px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .num-btn {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(to bottom, #f8fafc, #cbd5e1);
            border: none;
            font-size: 34px; /* Збільшено шрифт кнопок */
            font-weight: 900;
            color: #1e293b;
            box-shadow: 
                0 7px 0 #94a3b8,
                inset 0 2px 2px #fff;
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
        }

        .num-btn::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            height: 40%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.8), transparent);
            border-radius: 14px;
            pointer-events: none;
        }

        .num-btn:active {
            transform: translateY(7px);
            box-shadow: 0 0 0 #94a3b8, inset 0 2px 5px rgba(0,0,0,0.3);
        }

        .num-btn.action {
            background: linear-gradient(to bottom, #f59e0b, #d97706);
            color: #fff;
            box-shadow: 0 7px 0 #92400e, inset 0 2px 2px #fde68a;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .num-btn.action:active {
            box-shadow: 0 0 0 #92400e, inset 0 2px 5px rgba(0,0,0,0.3);
        }

        .num-btn.check {
            background: linear-gradient(to bottom, #10b981, #059669);
            color: #fff;
            box-shadow: 0 7px 0 #064e3b, inset 0 2px 2px #a7f3d0;
            grid-column: span 3;
            width: 100%;
            height: 70px;
            font-size: 38px;
        }
        .num-btn.check:active {
            box-shadow: 0 0 0 #064e3b, inset 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Анімації святкування */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: fall linear forwards;
            z-index: 100;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }

        .house-win {
            animation: bounceWin 0.5s ease infinite alternate;
        }

        @keyframes bounceWin {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-15px) scale(1.02); }
        }

    </style>
</head>
<body>

    <div class="background">
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="hill-back"></div>
        <div class="tree tree1"></div>
        <div class="tree tree2"></div>
        <div class="hill-front"></div>
        <div class="tree tree3"></div>
    </div>

    <div class="game-container">
        <div class="top-bar">
            <button class="btn-toggle" id="btn-diff">1-10</button>
            <button class="btn-next" id="btn-next">&#10140;</button>
        </div>

        <!-- Будиночки зліва -->
        <div class="board" id="board">
            <!-- Генеруються JS -->
        </div>

        <!-- Панель вводу справа -->
        <div class="numpad-container" id="numpad">
            <button class="num-btn" data-val="1">1</button>
            <button class="num-btn" data-val="2">2</button>
            <button class="num-btn" data-val="3">3</button>
            <button class="num-btn" data-val="4">4</button>
            <button class="num-btn" data-val="5">5</button>
            <button class="num-btn" data-val="6">6</button>
            <button class="num-btn" data-val="7">7</button>
            <button class="num-btn" data-val="8">8</button>
            <button class="num-btn" data-val="9">9</button>
            <button class="num-btn action" id="btn-del">&#9003;</button>
            <button class="num-btn" data-val="0">0</button>
            <button class="num-btn check" id="btn-check">&#10004;</button>
        </div>
    </div>

    <script>
        // --- АУДІО СИСТЕМА ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(freq, type, duration, vol=0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function soundCorrect() {
            playTone(600, 'sine', 0.1);
            setTimeout(() => playTone(900, 'sine', 0.2), 100);
        }

        function soundWrong() {
            playTone(200, 'sawtooth', 0.3, 0.1);
            setTimeout(() => playTone(150, 'sawtooth', 0.3, 0.1), 100);
        }

        function soundWin() {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                setTimeout(() => playTone(freq, 'triangle', 0.3, 0.15), i * 100);
            });
        }

        // --- ІГРОВА ЛОГІКА ---
        let maxNumber = 10;
        let isHundredMode = false;
        let activeInput = null;
        let totalHouses = 3;
        let solvedHouses = 0;

        const board = document.getElementById('board');
        const numpad = document.getElementById('numpad');
        const btnDiff = document.getElementById('btn-diff');
        const btnNext = document.getElementById('btn-next');

        document.body.addEventListener('click', () => {
            initAudio();
        }, { once: true });

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateHouseData() {
            let s = getRandomInt(2, maxNumber);
            let a = getRandomInt(1, s - 1);
            let b = s - a;
            const hideLeft = Math.random() > 0.5;
            return { s, a, b, hideLeft };
        }

        function createHouseElement(data, index) {
            const wrapper = document.createElement('div');
            wrapper.className = 'house-wrapper';
            wrapper.dataset.index = index;
            wrapper.dataset.solved = "false";

            const leftVal = data.hideLeft ? '' : data.a;
            const rightVal = data.hideLeft ? data.b : '';

            let knownPart = data.hideLeft ? data.b : data.a;
            let unknownPart = data.hideLeft ? data.a : data.b;
            let sum = data.s;

            let eq1Html = '';
            let eq2Html = '';
            let eq3Html = '';

            // Рівняння 1
            if (Math.random() > 0.5) {
                eq1Html = `${knownPart} + <input class="eq-input empty-box" data-ans="${unknownPart}" maxlength="2"> = ${sum}`;
            } else {
                eq1Html = `<input class="eq-input empty-box" data-ans="${unknownPart}" maxlength="2"> + ${knownPart} = ${sum}`;
            }

            // Рівняння 2
            if (Math.random() > 0.5) {
                eq2Html = `${sum} - ${knownPart} = <input class="eq-input empty-box" data-ans="${unknownPart}" maxlength="2">`;
            } else {
                eq2Html = `<input class="eq-input empty-box" data-ans="${sum}" maxlength="2"> - ${knownPart} = ${unknownPart}`;
            }

            // Рівняння 3
            eq3Html = `<input class="eq-input empty-box" data-ans="${sum}" maxlength="2"> - <input class="eq-input empty-box" data-ans="${unknownPart}" maxlength="2"> = ${knownPart}`;

            wrapper.innerHTML = `
                <div class="house">
                    <div class="roof"></div>
                    <div class="roof-input-container">
                        <input type="text" class="circle-input" value="${sum}" readonly>
                    </div>
                    <div class="body">
                        ${data.hideLeft ? 
                            `<input type="text" class="square-input empty-box" data-ans="${leftVal}" maxlength="2">` : 
                            `<input type="text" class="square-input" value="${leftVal}" readonly>`
                        }
                        ${!data.hideLeft ? 
                            `<input type="text" class="square-input empty-box" data-ans="${rightVal}" maxlength="2">` : 
                            `<input type="text" class="square-input" value="${rightVal}" readonly>`
                        }
                    </div>
                </div>
                <div class="equations">
                    <div class="eq-row">${eq1Html}</div>
                    <div class="eq-row">${eq2Html}</div>
                    <div class="eq-row">${eq3Html}</div>
                </div>
            `;

            return wrapper;
        }

        function initLevel() {
            board.innerHTML = '';
            solvedHouses = 0;
            activeInput = null;

            for (let i = 0; i < totalHouses; i++) {
                const data = generateHouseData();
                const houseEl = createHouseElement(data, i);
                board.appendChild(houseEl);
            }

            attachInputListeners();
        }

        function attachInputListeners() {
            const inputs = document.querySelectorAll('.empty-box');
            inputs.forEach(input => {
                input.addEventListener('click', (e) => {
                    if (input.classList.contains('filled-box')) return;
                    
                    if (activeInput) {
                        activeInput.classList.remove('active');
                    }
                    activeInput = input;
                    activeInput.classList.add('active');
                });
            });
        }

        numpad.addEventListener('click', (e) => {
            if (!activeInput) return;
            const btn = e.target.closest('.num-btn');
            if (!btn) return;

            const val = btn.dataset.val;
            if (val) {
                if (activeInput.value.length < 2) {
                    activeInput.value += val;
                    playTone(400, 'square', 0.05, 0.05);
                }
            } else if (btn.id === 'btn-del') {
                activeInput.value = activeInput.value.slice(0, -1);
                playTone(300, 'square', 0.05, 0.05);
            } else if (btn.id === 'btn-check') {
                checkAnswer();
            }
        });

        function checkAnswer() {
            if (!activeInput || activeInput.value === '') return;

            const userAns = parseInt(activeInput.value);
            const correctAns = parseInt(activeInput.dataset.ans);

            if (userAns === correctAns) {
                activeInput.classList.remove('empty-box', 'active');
                activeInput.classList.add('filled-box');
                activeInput.readOnly = true;
                soundCorrect();
                createParticles(activeInput);
                activeInput = null;
                checkHouseCompletion();
            } else {
                activeInput.classList.add('wrong-box');
                soundWrong();
                const tempInput = activeInput;
                setTimeout(() => {
                    tempInput.classList.remove('wrong-box');
                    tempInput.value = '';
                }, 500);
            }
        }

        function checkHouseCompletion() {
            const houses = document.querySelectorAll('.house-wrapper');
            
            houses.forEach(house => {
                if (house.dataset.solved === "false") {
                    const emptyInputs = house.querySelectorAll('.empty-box');
                    if (emptyInputs.length === 0) {
                        house.dataset.solved = "true";
                        house.classList.add('house-win');
                        setTimeout(() => house.classList.remove('house-win'), 1000);
                        createBigConfetti(house);
                        solvedHouses++;
                    }
                }
            });

            if (solvedHouses === totalHouses) {
                setTimeout(() => {
                    soundWin();
                    setTimeout(initLevel, 1500);
                }, 500);
            }
        }

        function createParticles(element) {
            const rect = element.getBoundingClientRect();
            for (let i = 0; i < 12; i++) {
                const p = document.createElement('div');
                p.className = 'confetti';
                p.style.left = rect.left + rect.width / 2 + 'px';
                p.style.top = rect.top + rect.height / 2 + 'px';
                p.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
                p.style.width = Math.random() * 6 + 4 + 'px';
                p.style.height = Math.random() * 6 + 4 + 'px';
                p.style.borderRadius = '50%';
                p.style.position = 'fixed';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 60 + 30;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;

                p.animate([
                    { transform: `translate(0, 0) scale(1)`, opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 600 + Math.random() * 400,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                });

                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        }

        function createBigConfetti(houseElement) {
            const rect = houseElement.getBoundingClientRect();
            const colors = ['#f1c40f', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#f39c12'];
            
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'confetti';
                p.style.left = rect.left + rect.width / 2 + 'px';
                p.style.top = rect.top + 'px';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.width = Math.random() * 12 + 6 + 'px';
                p.style.height = Math.random() * 12 + 6 + 'px';
                p.style.position = 'fixed';
                p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';

                const tx = (Math.random() - 0.5) * 400;
                const ty = Math.random() * -250 - 50;

                p.animate([
                    { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) rotate(360deg)`, opacity: 1, offset: 0.4 },
                    { transform: `translate(${tx}px, 400px) rotate(720deg)`, opacity: 0 }
                ], {
                    duration: 1500 + Math.random() * 1000,
                    easing: 'ease-out'
                });

                document.body.appendChild(p);
                setTimeout(() => p.remove(), 2500);
            }
        }

        btnNext.addEventListener('click', () => {
            initLevel();
            playTone(500, 'sine', 0.1);
        });

        btnDiff.addEventListener('click', () => {
            isHundredMode = !isHundredMode;
            maxNumber = isHundredMode ? 100 : 10;
            btnDiff.textContent = isHundredMode ? '1-100' : '1-10';
            btnDiff.style.background = isHundredMode ? 'linear-gradient(145deg, #c0392b, #962d22)' : 'linear-gradient(145deg, #8e44ad, #732d91)';
            btnDiff.style.boxShadow = isHundredMode ? '0 6px 0 #5a1a12, 0 10px 10px rgba(0,0,0,0.2)' : '0 6px 0 #4a154b, 0 10px 10px rgba(0,0,0,0.2)';
            initLevel();
            playTone(600, 'triangle', 0.2);
        });

        window.addEventListener('keydown', (e) => {
            if (!activeInput) return;
            
            if (/^[0-9]$/.test(e.key)) {
                if (activeInput.value.length < 2) {
                    activeInput.value += e.key;
                    playTone(400, 'square', 0.05, 0.05);
                }
            } else if (e.key === 'Backspace') {
                activeInput.value = activeInput.value.slice(0, -1);
            } else if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        window.addEventListener('load', () => {
            initLevel();
        });

    </script>
</body>
</html>
