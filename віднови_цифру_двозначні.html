<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приховані цифри 🦋 - КОД 2</title>
    <style>
        /* Базові стилі */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease;
        }

        /* Заголовок та інтерфейс */
        .ui-panel {
            text-align: center;
            margin-bottom: 20px;
            width: 90%;
            max-width: 900px;
        }

        h1 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 28px;
            font-weight: bold;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .btn.active {
            background-color: #2980b9;
        }

        .btn-refresh {
            background-color: #2ecc71;
        }

        .btn-refresh:hover {
            background-color: #27ae60;
        }

        /* Контейнер гри (без білого прямокутника) */
        .game-area {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 90%;
            max-width: 900px;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .game-area {
                grid-template-columns: 1fr;
            }
        }

        /* Картка прикладу */
        .problem-card {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #333;
            background: rgba(255, 255, 255, 0.7); /* Легке підсвічування картки */
            border-radius: 15px;
            padding: 20px;
            position: relative;
        }

        .operator {
            color: #7f8c8d;
            margin: 0 5px;
        }

        /* Інпут-кружечок */
        .input-container {
            position: relative;
            display: inline-block;
            margin: 0 3px;
        }

        .digit-input {
            width: 50px;
            height: 50px;
            border: 3px solid #f39c12; /* Помаранчевий кружечок, як на фото */
            border-radius: 50%;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            outline: none;
            background-color: #fff;
            color: #333;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 1; /* Нижче метелика */
            caret-color: #f39c12;
            pointer-events: none; /* Забороняємо взаємодію за замовчуванням */
        }

        .digit-input:focus {
            border-color: #e67e22;
        }

        .digit-input.enabled {
            pointer-events: auto; /* Вмикаємо взаємодію, коли це потрібно */
        }

        /* Метелик (емодзі 🦋) */
        .butterfly-placeholder {
            position: absolute;
            top: -25px; /* Над інпутом */
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            cursor: pointer;
            z-index: 2; /* Вище інпуту */
            transition: opacity 0.3s ease;
        }

        /* Анімація метелика */
        @keyframes flyAway {
            0% {
                transform: translateX(-50%) translateY(0) scale(1) rotate(0deg);
                opacity: 1;
            }
            10% {
                transform: translateX(-150%) translateY(-20px) scale(1.1) rotate(-10deg);
            }
            30% {
                transform: translateX(150%) translateY(-50px) scale(1.2) rotate(10deg);
            }
            50% {
                transform: translateX(-100%) translateY(-100px) scale(1.3) rotate(-15deg);
            }
            70% {
                transform: translateX(100%) translateY(-150px) scale(1.4) rotate(15deg);
            }
            100% {
                transform: translateX(-50%) translateY(-300px) scale(0) rotate(0deg);
                opacity: 0;
            }
        }

        .fly-away {
            animation: flyAway 2s ease-in-out forwards;
            pointer-events: none; /* Не дати клікати під час анімації */
        }

        /* Анімація помилки (трясіння) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.5s;
        }

        /* Перемога */
        .win-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10000;
        }

        .win-content h2 {
            font-size: 48px;
            color: #2ecc71;
            margin-bottom: 20px;
        }

        .win-content p {
            font-size: 24px;
            margin-bottom: 30px;
        }

        /* Theme Manager UI */
        .settings-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #fff;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: transform 0.3s ease;
            outline: none;
        }

        .settings-btn:hover {
            transform: rotate(45deg) scale(1.1);
        }

        .theme-modal {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 300px;
            max-height: 60vh;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 0, 0, 0.1);
            z-index: 9998;
            display: none;
            padding: 15px;
        }

        .theme-modal h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #2c3e50;
            font-size: 18px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .theme-thumb {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            background-size: cover;
            background-position: center;
            background-color: #ddd;
        }

        .theme-thumb:hover {
            transform: scale(1.05);
        }

        .theme-thumb.active {
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
        }

        .theme-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 11px;
            text-align: center;
            padding: 3px 0;
            font-weight: bold;
        }
    </style>
<body>

    <!-- UI Panel -->
    <div class="ui-panel">
        <h1>Приховані цифри 🦋</h1>
        <div class="controls-row">
            <button class="btn active" id="btn-no-carry" onclick="setMode('no-carry')">Без переходу через десяток</button>
            <button class="btn" id="btn-carry" onclick="setMode('carry')">З переходом через десяток</button>
            <button class="btn btn-refresh" onclick="restartGame()">Оновити приклади 🔄</button>
        </div>
    </div>

    <!-- Гра (без прямокутника) -->
    <div class="game-area" id="game-area"></div>

    <!-- Theme Manager UI -->
    <button class="settings-btn" onclick="toggleThemeMenu(event)" title="Змінити тему">⚙️</button>
    
    <div class="theme-modal" id="theme-modal" onclick="event.stopPropagation()">
        <h3>Оберіть фонову тему</h3>
        <div class="theme-grid" id="theme-grid"></div>
    </div>

    <!-- Перемога -->
    <div class="win-overlay" id="win-overlay">
        <div class="win-content">
            <h2>Чудово! 🎉</h2>
            <p>Усі приклади розв'язано правильно!</p>
            <button class="btn btn-refresh" onclick="restartGame()">Грати знову 🔄</button>
        </div>
    </div>

    <<script>
        // ================= ЗВУКОВИЙ РУШІЙ (ТИХІ ЗВУКИ) =================
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playCorrectSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sine';
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.05, now + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
            
            osc.frequency.setValueAtTime(659.25, now); // Нота E5
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start(now);
            osc.stop(now + 0.4);
        }

        function playIncorrectSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'triangle';
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.05, now + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
            
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start(now);
            osc.stop(now + 0.3);
        }

        function playWinSound() {
            initAudio();
            if (!audioCtx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            const now = audioCtx.currentTime;
            
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                
                gainNode.gain.setValueAtTime(0, now + idx * 0.1);
                gainNode.gain.linearRampToValueAtTime(0.05, now + idx * 0.1 + 0.02);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.1 + 0.3);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start(now + idx * 0.1);
                osc.stop(now + idx * 0.1 + 0.3);
            });
        }


        // ================= ЛОГІКА ГРИ =================
        let currentGameMode = 'no-carry';
        let currentProblems = [];

        function setMode(mode) {
            if (currentGameMode === mode) return;
            currentGameMode = mode;
            document.getElementById('btn-no-carry').classList.toggle('active', mode === 'no-carry');
            document.getElementById('btn-carry').classList.toggle('active', mode === 'carry');
            restartGame();
        }

        // Генерація ВИКЛЮЧНО двозначних чисел для уникнення 'undefined'
        function generateEquation(mode) {
            let A, B, C, op;
            let attempts = 0;

            while (attempts < 1000) {
                op = Math.random() < 0.5 ? '+' : '-';

                if (op === '+') {
                    // Додавання: обидва доданки і сума - двозначні (A: 10-89, B: 10-(99-A))
                    A = Math.floor(Math.random() * 80) + 10; 
                    const maxB = 99 - A;
                    if (maxB < 10) continue; 
                    B = Math.floor(Math.random() * (maxB - 9)) + 10; 
                    C = A + B;

                    const hasCarry = (A % 10 + B % 10) >= 10;
                    if ((mode === 'carry' && hasCarry) || (mode === 'no-carry' && !hasCarry)) {
                        break;
                    }
                } else {
                    // Віднімання: зменшуване, від'ємник і різниця - двозначні
                    A = Math.floor(Math.random() * 80) + 20; // 20..99
                    const maxB = A - 10; 
                    if (maxB < 10) continue;
                    B = Math.floor(Math.random() * (maxB - 9)) + 10; // B >= 10, C = A-B >= 10
                    C = A - B;

                    const hasCarry = (A % 10 < B % 10);
                    if ((mode === 'carry' && hasCarry) || (mode === 'no-carry' && !hasCarry)) {
                        break;
                    }
                }
                attempts++;
            }
            return { A, B, C, op };
        }

        function initProblems() {
            currentProblems = [];
            const targets = ['A_tens', 'A_units', 'B_tens', 'B_units', 'C_tens', 'C_units'];
            
            for (let i = 0; i < 6; i++) {
                const eq = generateEquation(currentGameMode);
                const maskTarget = targets[Math.floor(Math.random() * targets.length)];
                
                let correctDigit = '';
                const strA = String(eq.A);
                const strB = String(eq.B);
                const strC = String(eq.C);

                if (maskTarget === 'A_tens') correctDigit = strA[0];
                else if (maskTarget === 'A_units') correctDigit = strA[1];
                else if (maskTarget === 'B_tens') correctDigit = strB[0];
                else if (maskTarget === 'B_units') correctDigit = strB[1];
                else if (maskTarget === 'C_tens') correctDigit = strC[0];
                else if (maskTarget === 'C_units') correctDigit = strC[1];

                currentProblems.push({
                    A: eq.A, B: eq.B, C: eq.C, op: eq.op,
                    maskTarget: maskTarget, correctDigit: correctDigit, solved: false
                });
            }
        }

        function renderNumberSpan(num, numKey, problem, problemIndex) {
            const strNum = String(num); // Завжди 2 цифри
            const d0 = strNum[0];
            const d1 = strNum[1];

            const isD0Masked = (problem.maskTarget === numKey + '_tens');
            const isD1Masked = (problem.maskTarget === numKey + '_units');

            let html = '';

            // Десятки
            if (isD0Masked) {
                html += `
                <div class="input-container">
                    <div class="butterfly-placeholder" id="bf-${problemIndex}">🦋</div>
                    <input type="text" pattern="[0-9]*" inputmode="numeric" maxlength="1" class="digit-input enabled" oninput="validateAndCheck(this, ${problemIndex})" onclick="initAudio()" />
                </div>`;
            } else {
                html += `<span>${d0}</span>`;
            }

            // Одиниці
            if (isD1Masked) {
                html += `
                <div class="input-container">
                    <div class="butterfly-placeholder" id="bf-${problemIndex}">🦋</div>
                    <input type="text" pattern="[0-9]*" inputmode="numeric" maxlength="1" class="digit-input enabled" oninput="validateAndCheck(this, ${problemIndex})" onclick="initAudio()" />
                </div>`;
            } else {
                html += `<span>${d1}</span>`;
            }

            return html;
        }

        function renderProblems() {
            const container = document.getElementById('game-area');
            container.innerHTML = '';

            currentProblems.forEach((prob, index) => {
                const card = document.createElement('div');
                card.className = 'problem-card';

                const partA = renderNumberSpan(prob.A, 'A', prob, index);
                const partB = renderNumberSpan(prob.B, 'B', prob, index);
                const partC = renderNumberSpan(prob.C, 'C', prob, index);

                card.innerHTML = `
                    ${partA}
                    <span class="operator">${prob.op}</span>
                    ${partB}
                    <span class="operator">=</span>
                    ${partC}
                `;

                container.appendChild(card);
            });
        }

        function validateAndCheck(input, index) {
            input.value = input.value.replace(/[^0-9]/g, '');
            const val = input.value.trim();
            if (val === '') return;

            const problem = currentProblems[index];

            if (val === problem.correctDigit) {
                // ПРАВИЛЬНО
                problem.solved = true;
                input.classList.remove('enabled');
                input.disabled = true; // Блокуємо інпут
                
                // Запускаємо анімацію метелика (злітає і зникає)
                const butterfly = document.getElementById(`bf-${index}`);
                if (butterfly) {
                    butterfly.classList.add('fly-away');
                }

                playCorrectSound();

                // Перевірка на завершення гри
                if (currentProblems.every(p => p.solved)) {
                    setTimeout(() => {
                        document.getElementById('win-overlay').style.display = 'flex';
                        playWinSound();
                    }, 1500); // Чекаємо поки метелик відлетить
                }
            } else {
                // ПОМИЛКА
                playIncorrectSound();
                input.classList.add('shake');
                input.style.borderColor = '#e74c3c';
                input.style.color = '#e74c3c';
                
                setTimeout(() => {
                    input.classList.remove('shake');
                    input.style.borderColor = '#f39c12';
                    input.style.color = '#333';
                    input.value = '';
                    input.focus();
                }, 500);
            }
        }

        function restartGame() {
            document.getElementById('win-overlay').style.display = 'none';
            initProblems();
            renderProblems();
        }


        // ================= THEME MANAGER (Система динамічних фонів) =================
        const bgBaseUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';

        function toggleThemeMenu(event) {
            event.stopPropagation();
            const modal = document.getElementById('theme-modal');
            modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
        }

        document.addEventListener('click', () => {
            document.getElementById('theme-modal').style.display = 'none';
        });

        // Асинхронна перевірка наявності фону
        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        // Створення плитки у галереї
        function addThemeTile(index, url) {
            const grid = document.getElementById('theme-grid');

            const thumb = document.createElement('div');
            thumb.className = 'theme-thumb';
            thumb.style.backgroundImage = `url('${url}')`;
            thumb.dataset.index = index;
            thumb.dataset.url = url;

            const label = document.createElement('div');
            label.className = 'theme-label';
            label.innerText = `Фон ${index}`;
            thumb.appendChild(label);

            thumb.addEventListener('click', () => {
                selectBackground(url);
            });

            // Збереження правильного порядку плиток
            const children = Array.from(grid.children);
            let inserted = false;
            for (let child of children) {
                if (parseInt(child.dataset.index) > index) {
                    grid.insertBefore(thumb, child);
                    inserted = true;
                    break;
                }
            }
            if (!inserted) {
                grid.appendChild(thumb);
            }

            const savedBg = localStorage.getItem('mySavedGameBg');
            if (savedBg === url) {
                thumb.classList.add('active');
            }
        }

        // Зміна та збереження фону
        function selectBackground(url) {
            document.body.style.backgroundImage = `url('${url}')`;
            localStorage.setItem('mySavedGameBg', url);

            document.querySelectorAll('.theme-thumb').forEach(tile => {
                if (tile.dataset.url === url) {
                    tile.classList.add('active');
                } else {
                    tile.classList.remove('active');
                }
            });
        }

        // Цикл автоматичного завантаження
        async function loadBackgrounds() {
            for (let i = 1; i <= 1000; i++) {
                const url = `${bgBaseUrl}background_${i}.webp`;
                checkImageExists(url).then(exists => {
                    if (exists) {
                        addThemeTile(i, url);
                    }
                });
            }
        }

        function initTheme() {
            const savedBg = localStorage.getItem('mySavedGameBg');
            if (savedBg) {
                document.body.style.backgroundImage = `url('${savedBg}')`;
            } else {
                document.body.style.backgroundImage = `url('${bgBaseUrl}background_1.webp')`;
            }
        }

        // Запуск
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadBackgrounds();
            restartGame();
        });
    </script>>
</html>
