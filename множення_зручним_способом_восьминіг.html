<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зручне множення - Біолюмінесцентний Океан</title>
    <style>
        /* Скидання базових стилів */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #011126 0%, #000712 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* SVG Фон - Глибокий Океан */
        #background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Анімації фону */
        @keyframes sway-seaweed {
            0%, 100% { transform: skewX(0deg) rotate(0deg); }
            50% { transform: skewX(-5deg) rotate(-3deg); }
        }

        @keyframes sway-seaweed-reverse {
            0%, 100% { transform: skewX(0deg) rotate(0deg); }
            50% { transform: skewX(5deg) rotate(3deg); }
        }

        @keyframes pulse-coral {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 255, 204, 0.4)); }
            50% { filter: drop-shadow(0 0 25px rgba(0, 255, 204, 0.8)); }
        }

        .bubble {
            animation: rise linear infinite;
        }

        @keyframes rise {
            0% { transform: translateY(1100px) scale(0.5); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        /* Навігація */
        .nav-panel {
            position: absolute;
            top: 30px;
            width: 100%;
            padding: 0 50px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }

        .nav-btn {
            background: rgba(0, 153, 255, 0.1);
            border: 2px solid #00d2ff;
            color: #00d2ff;
            padding: 12px 35px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
            letter-spacing: 2px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .nav-btn:hover {
            background: rgba(0, 210, 255, 0.2);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.6), inset 0 0 10px rgba(0, 210, 255, 0.4);
            transform: translateY(-3px);
        }

        .nav-btn:active {
            transform: translateY(2px);
        }

        /* Персонаж - Восьминіг */
        #character-area {
            position: absolute;
            bottom: 8vh;
            left: 8vw;
            width: 350px;
            height: 350px;
            z-index: 6;
            transition: all 0.5s ease;
        }

        .idle-anim {
            animation: float-octo 4s infinite ease-in-out;
        }
        
        .happy-anim {
            animation: spin-happy 0.8s ease-in-out;
        }

        .sad-anim {
            animation: hide-octo 0.6s ease-in-out;
        }

        @keyframes float-octo {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-25px) scale(1.02); }
        }

        @keyframes spin-happy {
            0%, 100% { transform: translateY(0) scale(1); }
            25% { transform: translateY(-40px) scale(1.1) rotate(10deg); }
            50% { transform: translateY(-60px) scale(1.15) rotate(-10deg); }
            75% { transform: translateY(-20px) scale(1.05) rotate(5deg); }
        }

        @keyframes hide-octo {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(40px) scale(0.9, 0.8); }
        }

        /* Ігрова зона (Стиль: Підводне скло) */
        #game-board {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(0, 40, 80, 0.6), rgba(0, 15, 30, 0.8));
            border: 2px solid rgba(0, 210, 255, 0.3);
            border-radius: 40px;
            padding: 60px 80px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 40px rgba(0, 210, 255, 0.1);
            backdrop-filter: blur(15px);
            min-width: 800px;
            min-height: 400px;
            margin-left: 20vw;
        }

        #equation-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-bottom: 50px;
            min-height: 120px;
        }

        /* Числа - Кристали */
        .number-block {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 30% 30%, #005c99, #001f3f);
            border: 2px solid #00aaff;
            border-radius: 25px;
            font-size: 3.5rem;
            color: #ccf2ff;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5), inset 0 0 20px rgba(0, 170, 255, 0.4);
            text-shadow: 0 0 15px rgba(204, 242, 255, 0.8);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .number-block::after {
            content: '';
            position: absolute;
            top: 5px; left: 15px; right: 15px; height: 30%;
            background: linear-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0));
            border-radius: 15px 15px 0 0;
            pointer-events: none;
        }

        .number-block:hover {
            transform: translateY(-8px) scale(1.05);
            border-color: #00ffff;
            box-shadow: 0 20px 30px rgba(0,0,0,0.6), 0 0 20px rgba(0, 255, 255, 0.4), inset 0 0 30px rgba(0, 170, 255, 0.6);
        }

        .number-block.selected {
            background: radial-gradient(circle at 30% 30%, #00e676, #004d40);
            border-color: #69f0ae;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 1);
            box-shadow: 0 0 40px rgba(0, 230, 118, 0.6), inset 0 0 30px rgba(0, 230, 118, 0.8);
            transform: scale(1.15) translateY(-5px);
        }

        .number-block.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        .operator {
            font-size: 4rem;
            color: #00d2ff;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
            font-weight: 300;
        }

        /* Варіанти відповідей */
        #options-area {
            display: flex;
            gap: 40px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #options-area.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .option-btn {
            background: linear-gradient(135deg, #6200ea, #311b92);
            border: 2px solid #b388ff;
            border-radius: 20px;
            padding: 15px 45px;
            font-size: 2.8rem;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 0 15px rgba(179, 136, 255, 0.3);
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            transform: scale(1.08) translateY(-5px);
            box-shadow: 0 15px 25px rgba(0,0,0,0.5), 0 0 30px rgba(179, 136, 255, 0.6);
            background: linear-gradient(135deg, #7c4dff, #4527a0);
            border-color: #e040fb;
        }

        /* Помилка */
        .shake {
            animation: errorShake 0.4s ease-in-out;
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-15px) rotate(-3deg); }
            40%, 80% { transform: translateX(15px) rotate(3deg); }
        }
    </style>
</head>
<body>

    <!-- Сюжетний фон: Глибинний Океан -->
    <svg id="background-layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <defs>
            <radialGradient id="ocean-glow" cx="50%" cy="0%" r="100%">
                <stop offset="0%" stop-color="rgba(0, 153, 255, 0.15)" />
                <stop offset="50%" stop-color="rgba(0, 50, 120, 0.05)" />
                <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
            </radialGradient>
            <!-- Біолюмінесцентний корал -->
            <linearGradient id="coral-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00ffcc" />
                <stop offset="100%" stop-color="#006699" />
            </linearGradient>
        </defs>

        <rect width="100%" height="100%" fill="url(#ocean-glow)"/>

        <!-- Дальній план водоростей -->
        <g style="animation: sway-seaweed 12s infinite ease-in-out; transform-origin: bottom center;" opacity="0.4">
            <path d="M 300 1080 Q 250 900 350 700 T 300 400" fill="none" stroke="#004d40" stroke-width="40" stroke-linecap="round"/>
            <path d="M 1600 1080 Q 1700 800 1550 600 T 1650 300" fill="none" stroke="#004d40" stroke-width="60" stroke-linecap="round"/>
        </g>

        <!-- Передній план: Сяючі корали та водорості -->
        <g style="animation: sway-seaweed-reverse 8s infinite ease-in-out; transform-origin: bottom center;">
            <path d="M 100 1080 Q 150 950 80 850 Q 140 750 100 650" fill="none" stroke="url(#coral-grad)" stroke-width="20" stroke-linecap="round" style="animation: pulse-coral 4s infinite;"/>
            <path d="M 150 1080 Q 80 1000 130 920 Q 90 850 140 800" fill="none" stroke="#00e676" stroke-width="12" stroke-linecap="round"/>
            
            <path d="M 1800 1080 Q 1750 900 1850 800 Q 1780 700 1820 550" fill="none" stroke="url(#coral-grad)" stroke-width="25" stroke-linecap="round" style="animation: pulse-coral 5s infinite;"/>
            <path d="M 1750 1080 Q 1820 950 1760 880 Q 1800 800 1770 700" fill="none" stroke="#69f0ae" stroke-width="15" stroke-linecap="round"/>
        </g>

        <!-- Каміння/Дно -->
        <path d="M -50 1080 Q 150 1000 350 1080 Z" fill="#001122"/>
        <path d="M 1500 1080 Q 1700 950 1950 1080 Z" fill="#001122"/>

        <!-- Бульбашки (динамічно генеруються) -->
        <g id="bubbles-container"></g>
    </svg>

    <div class="nav-panel">
        <button id="btn-back" class="nav-btn">Назад</button>
        <button id="btn-next" class="nav-btn">Далі</button>
    </div>

    <!-- Персонаж: Восьминіг-Дослідник -->
    <div id="character-area">
        <svg id="char-svg" class="idle-anim" viewBox="0 0 400 400" width="100%" height="100%">
            <defs>
                <radialGradient id="octo-body" cx="50%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#9d4edd" id="octo-color-light"/>
                    <stop offset="80%" stop-color="#3c096c" id="octo-color-dark"/>
                    <stop offset="100%" stop-color="#240046"/>
                </radialGradient>
                <radialGradient id="octo-spots" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#e0aaff" />
                    <stop offset="100%" stop-color="rgba(224, 170, 255, 0)" />
                </radialGradient>
            </defs>
            
            <!-- Тінь на дні -->
            <ellipse cx="200" cy="380" rx="90" ry="15" fill="rgba(0,0,0,0.4)"/>
            
            <!-- Задні щупальця -->
            <path d="M 130 250 Q 50 380 90 350 Q 120 330 150 280" fill="#3c096c"/>
            <path d="M 270 250 Q 350 380 310 350 Q 280 330 250 280" fill="#3c096c"/>
            <path d="M 160 260 Q 140 390 180 370 Q 200 350 190 280" fill="#3c096c"/>
            <path d="M 240 260 Q 260 390 220 370 Q 200 350 210 280" fill="#3c096c"/>

            <!-- Голова/Мантія -->
            <path d="M 100 150 C 100 20 300 20 300 150 C 300 220 280 270 200 280 C 120 270 100 220 100 150 Z" fill="url(#octo-body)"/>
            
            <!-- Плями (Біолюмінесценція) -->
            <circle cx="140" cy="80" r="15" fill="url(#octo-spots)"/>
            <circle cx="260" cy="90" r="20" fill="url(#octo-spots)"/>
            <circle cx="180" cy="50" r="12" fill="url(#octo-spots)"/>
            <circle cx="280" cy="150" r="10" fill="url(#octo-spots)"/>
            <circle cx="110" cy="180" r="14" fill="url(#octo-spots)"/>

            <!-- Передні щупальця -->
            <path id="tentacle-1" d="M 120 260 Q 20 350 60 380 Q 90 400 130 330" fill="url(#octo-body)"/>
            <path id="tentacle-2" d="M 280 260 Q 380 350 340 380 Q 310 400 270 330" fill="url(#octo-body)"/>
            <path id="tentacle-3" d="M 160 275 Q 120 400 160 400 Q 190 400 180 320" fill="url(#octo-body)"/>
            <path id="tentacle-4" d="M 240 275 Q 280 400 240 400 Q 210 400 220 320" fill="url(#octo-body)"/>

            <!-- Присоски на передніх щупальцях -->
            <circle cx="65" cy="365" r="5" fill="#e0aaff"/>
            <circle cx="95" cy="360" r="6" fill="#e0aaff"/>
            <circle cx="335" cy="365" r="5" fill="#e0aaff"/>
            <circle cx="305" cy="360" r="6" fill="#e0aaff"/>
            
            <!-- Обличчя -->
            <g id="octo-face">
                <!-- Очі -->
                <ellipse cx="150" cy="180" rx="22" ry="25" fill="#fff"/>
                <ellipse cx="250" cy="180" rx="22" ry="25" fill="#fff"/>
                
                <ellipse id="pupil-l" cx="155" cy="180" rx="10" ry="12" fill="#000"/>
                <ellipse id="pupil-r" cx="245" cy="180" rx="10" ry="12" fill="#000"/>
                
                <circle cx="158" cy="175" r="4" fill="#fff"/>
                <circle cx="248" cy="175" r="4" fill="#fff"/>

                <!-- Рот -->
                <path id="mouth" d="M 185 220 Q 200 235 215 220" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
                
                <!-- Рум'янець -->
                <ellipse cx="120" cy="200" rx="15" ry="8" fill="#ff007f" opacity="0.4"/>
                <ellipse cx="280" cy="200" rx="15" ry="8" fill="#ff007f" opacity="0.4"/>
            </g>
        </svg>
    </div>

    <!-- Ігрова зона -->
    <div id="game-board">
        <div id="equation-area"></div>
        <div id="options-area"></div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Звуки (залишено оригінальну логіку)
        function playSound(type) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            switch (type) {
                case 'select':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                    
                case 'merge':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.15);
                    osc.frequency.linearRampToValueAtTime(900, now + 0.3);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.3, now + 0.15);
                    gain.gain.linearRampToValueAtTime(0, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                    break;

                case 'wrong':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;

                case 'win':
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'sine';
                        o.frequency.value = freq;
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        
                        const time = now + i * 0.1;
                        g.gain.setValueAtTime(0, time);
                        g.gain.linearRampToValueAtTime(0.2, time + 0.05);
                        g.gain.linearRampToValueAtTime(0, time + 0.2);
                        o.start(time);
                        o.stop(time + 0.2);
                    });
                    break;
            }
        }

        // Дані рівнів (логіка без змін)
        const levels = [
            { numbers: [5, 7, 2], pair: [5, 2], correctFinal: 70, options: [70, 75, 17] },
            { numbers: [4, 9, 25], pair: [4, 25], correctFinal: 900, options: [900, 360, 225] },
            { numbers: [2, 34, 5], pair: [2, 5], correctFinal: 340, options: [340, 304, 68] },
            { numbers: [20, 8, 5], pair: [20, 5], correctFinal: 800, options: [800, 160, 400] },
            { numbers: [7, 50, 2], pair: [50, 2], correctFinal: 700, options: [70, 700, 350] }
        ];

        let currentLevelIndex = 0;
        let selectedBlocks = [];
        let currentState = 'select_pair';

        const equationArea = document.getElementById('equation-area');
        const optionsArea = document.getElementById('options-area');
        
        const charSvg = document.getElementById('char-svg');
        const colorLight = document.getElementById('octo-color-light');
        const colorDark = document.getElementById('octo-color-dark');
        const mouth = document.getElementById('mouth');
        const pupilL = document.getElementById('pupil-l');
        const pupilR = document.getElementById('pupil-r');

        // Бульбашки на фоні
        function createBubbles() {
            const container = document.getElementById('bubbles-container');
            container.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                const cx = Math.random() * 1920;
                const r = Math.random() * 8 + 2;
                circle.setAttribute("cx", cx);
                circle.setAttribute("cy", "0");
                circle.setAttribute("r", r);
                circle.setAttribute("fill", "rgba(255, 255, 255, 0.3)");
                circle.setAttribute("stroke", "rgba(255, 255, 255, 0.6)");
                circle.setAttribute("stroke-width", "1");
                circle.setAttribute("class", "bubble");
                circle.style.animationDuration = `${Math.random() * 10 + 5}s`;
                circle.style.animationDelay = `${Math.random() * -15}s`;
                container.appendChild(circle);
            }
        }

        // Анімації емоцій Восьминога
        function setEmotion(emotion) {
            charSvg.classList.remove('idle-anim', 'happy-anim', 'sad-anim');
            void charSvg.offsetWidth; // Reflow

            if (emotion === 'happy') {
                charSvg.classList.add('happy-anim');
                colorLight.setAttribute('stop-color', '#ff007f'); // Яскраво-рожевий
                colorDark.setAttribute('stop-color', '#c9184a');
                mouth.setAttribute('d', 'M 180 220 Q 200 250 220 220'); // Велика посмішка
                pupilL.setAttribute('ry', '12'); pupilR.setAttribute('ry', '12');
            } else if (emotion === 'sad') {
                charSvg.classList.add('sad-anim');
                colorLight.setAttribute('stop-color', '#0077b6'); // Блідо-синій
                colorDark.setAttribute('stop-color', '#03045e');
                mouth.setAttribute('d', 'M 185 230 Q 200 220 215 230'); // Сумний рот
                pupilL.setAttribute('ry', '4'); pupilR.setAttribute('ry', '4'); // Звужені очі
            } else {
                charSvg.classList.add('idle-anim');
                colorLight.setAttribute('stop-color', '#9d4edd'); // Фіолетовий
                colorDark.setAttribute('stop-color', '#3c096c');
                mouth.setAttribute('d', 'M 185 220 Q 200 235 215 220'); // Нейтральна посмішка
                pupilL.setAttribute('ry', '12'); pupilR.setAttribute('ry', '12');
            }

            if (emotion !== 'idle') {
                setTimeout(() => setEmotion('idle'), 800);
            }
        }

        function loadLevel(index) {
            currentLevelIndex = index;
            const levelData = levels[index];
            selectedBlocks = [];
            currentState = 'select_pair';
            
            equationArea.innerHTML = '';
            optionsArea.innerHTML = '';
            optionsArea.classList.remove('visible');

            levelData.numbers.forEach((num, i) => {
                const block = document.createElement('div');
                block.className = 'number-block';
                block.textContent = num;
                block.dataset.val = num;
                block.dataset.index = i;
                block.addEventListener('click', () => handleNumberClick(block, levelData));
                equationArea.appendChild(block);

                if (i < levelData.numbers.length - 1) {
                    const op = document.createElement('div');
                    op.className = 'operator';
                    op.textContent = '×';
                    equationArea.appendChild(op);
                }
            });
        }

        function handleNumberClick(block, levelData) {
            if (currentState !== 'select_pair') return;
            if (block.classList.contains('selected')) {
                block.classList.remove('selected');
                selectedBlocks = selectedBlocks.filter(b => b !== block);
                return;
            }

            if (selectedBlocks.length < 2) {
                playSound('select');
                block.classList.add('selected');
                selectedBlocks.push(block);
            }

            if (selectedBlocks.length === 2) {
                checkPair(levelData);
            }
        }

        function checkPair(levelData) {
            const val1 = parseInt(selectedBlocks[0].dataset.val);
            const val2 = parseInt(selectedBlocks[1].dataset.val);
            
            const isCorrect = (val1 === levelData.pair[0] && val2 === levelData.pair[1]) ||
                              (val1 === levelData.pair[1] && val2 === levelData.pair[0]);

            const allBlocks = document.querySelectorAll('.number-block');
            allBlocks.forEach(b => b.classList.add('disabled'));

            if (isCorrect) {
                playSound('merge');
                setEmotion('happy');
                animateMerge(levelData, val1 * val2);
            } else {
                playSound('wrong');
                setEmotion('sad');
                
                const board = document.getElementById('game-board');
                board.classList.add('shake');
                
                setTimeout(() => {
                    board.classList.remove('shake');
                    selectedBlocks.forEach(b => b.classList.remove('selected'));
                    selectedBlocks = [];
                    allBlocks.forEach(b => b.classList.remove('disabled'));
                }, 500);
            }
        }

        function animateMerge(levelData, mergedValue) {
            setTimeout(() => {
                const remainingNum = levelData.numbers.find(n => n !== levelData.pair[0] && n !== levelData.pair[1]) 
                                   || levelData.numbers.find(n => !selectedBlocks.find(b => parseInt(b.dataset.val) === n));

                equationArea.innerHTML = '';
                
                // Злите число - Золота перлина
                const mergedBlock = document.createElement('div');
                mergedBlock.className = 'number-block';
                mergedBlock.style.background = 'radial-gradient(circle at 30% 30%, #ffd54f, #ff8f00)';
                mergedBlock.style.borderColor = '#ffe082';
                mergedBlock.style.color = '#fff';
                mergedBlock.style.boxShadow = '0 15px 25px rgba(0,0,0,0.5), 0 0 30px rgba(255, 143, 0, 0.6)';
                mergedBlock.textContent = mergedValue;
                equationArea.appendChild(mergedBlock);

                const op = document.createElement('div');
                op.className = 'operator';
                op.textContent = '×';
                equationArea.appendChild(op);

                const remainBlock = document.createElement('div');
                remainBlock.className = 'number-block';
                remainBlock.textContent = remainingNum;
                equationArea.appendChild(remainBlock);

                const eqSign = document.createElement('div');
                eqSign.className = 'operator';
                eqSign.textContent = '=';
                equationArea.appendChild(eqSign);

                const questionBlock = document.createElement('div');
                questionBlock.className = 'number-block';
                questionBlock.style.background = 'transparent';
                questionBlock.style.border = '3px dashed #00d2ff';
                questionBlock.style.color = '#00d2ff';
                questionBlock.style.boxShadow = 'none';
                questionBlock.style.textShadow = 'none';
                questionBlock.textContent = '?';
                equationArea.appendChild(questionBlock);

                showOptions(levelData);
            }, 600);
        }

        function showOptions(levelData) {
            currentState = 'select_answer';
            const shuffledOptions = [...levelData.options].sort(() => Math.random() - 0.5);
            
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.addEventListener('click', () => handleAnswerClick(btn, opt, levelData.correctFinal));
                optionsArea.appendChild(btn);
            });

            setTimeout(() => {
                optionsArea.classList.add('visible');
            }, 100);
        }

        function handleAnswerClick(btn, selectedVal, correctVal) {
            if (selectedVal === correctVal) {
                playSound('win');
                setEmotion('happy');
                
                btn.style.background = 'linear-gradient(135deg, #00e676, #00c853)';
                btn.style.borderColor = '#b2ff59';
                btn.style.boxShadow = '0 15px 25px rgba(0,0,0,0.5), 0 0 30px rgba(0, 230, 118, 0.6)';
                
                const questionBlock = equationArea.lastChild;
                questionBlock.style.background = 'radial-gradient(circle at 30% 30%, #00e676, #00c853)';
                questionBlock.style.border = '2px solid #b2ff59';
                questionBlock.style.color = '#fff';
                questionBlock.style.boxShadow = '0 15px 25px rgba(0,0,0,0.5), inset 0 0 20px rgba(178, 255, 89, 0.6)';
                questionBlock.textContent = correctVal;

                Array.from(optionsArea.children).forEach(b => b.style.pointerEvents = 'none');

                setTimeout(nextLevel, 2000);
            } else {
                playSound('wrong');
                setEmotion('sad');
                btn.classList.add('shake');
                setTimeout(() => btn.classList.remove('shake'), 400);
            }
        }

        function nextLevel() {
            currentLevelIndex++;
            if (currentLevelIndex >= levels.length) currentLevelIndex = 0;
            loadLevel(currentLevelIndex);
        }

        function prevLevel() {
            currentLevelIndex--;
            if (currentLevelIndex < 0) currentLevelIndex = levels.length - 1;
            loadLevel(currentLevelIndex);
        }

        document.getElementById('btn-next').addEventListener('click', () => {
            playSound('select');
            nextLevel();
        });
        
        document.getElementById('btn-back').addEventListener('click', () => {
            playSound('select');
            prevLevel();
        });

        window.addEventListener('DOMContentLoaded', () => {
            createBubbles();
            loadLevel(0);
            document.body.addEventListener('click', initAudio, { once: true });
        });

    </script>
</body>
</html>
