<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>20 / 100</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Nunito:wght@800;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #2998e0;
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
    }

    /* Living Background Keyframes */
    @keyframes sunRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes cloudDrift1 {
      0% { transform: translateX(-260px); }
      100% { transform: translateX(1520px); }
    }

    @keyframes cloudDrift2 {
      0% { transform: translateX(-340px) scale(0.85); }
      100% { transform: translateX(1520px) scale(0.85); }
    }

    @keyframes palmSwayLeft {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2.2deg); }
    }

    @keyframes palmSwayRight {
      0%, 100% { transform: rotate(2deg); }
      50% { transform: rotate(-2.2deg); }
    }

    @keyframes waterfallFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes foamPulse {
      0%, 100% { transform: scale(1) translateY(0px); opacity: 0.9; }
      50% { transform: scale(1.06) translateY(-2px); opacity: 1; }
    }

    @keyframes waveShimmer {
      0%, 100% { transform: translateX(-10px); opacity: 0.45; }
      50% { transform: translateX(10px); opacity: 0.85; }
    }

    /* Character & Board Keyframes (Strictly applied to non-translated inner groups!) */
    @keyframes charIdleLeft {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(0px, -4px) rotate(-1deg); }
    }

    @keyframes charIdleRight {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(0px, -5px) rotate(1deg); }
    }

    @keyframes bannerFloat {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(0px, -3.5px); }
    }

    @keyframes armWaveLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-10deg); }
    }

    @keyframes armWaveRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(10deg); }
    }

    @keyframes petIdle {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      40% { transform: translate(0px, -3.5px) rotate(2.5deg); }
      75% { transform: translate(0px, -1px) rotate(-2deg); }
    }

    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }

    @keyframes charCelebrate {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      25% { transform: translate(0px, -18px) scale(1.04) rotate(-2deg); }
      50% { transform: translate(0px, -2px) scale(0.98) rotate(2deg); }
      75% { transform: translate(0px, -14px) scale(1.03) rotate(-1.5deg); }
    }

    @keyframes charShrug {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      20% { transform: translate(-6px, -2px) rotate(-2.5deg); }
      40% { transform: translate(6px, -2px) rotate(2.5deg); }
      60% { transform: translate(-4px, -1px) rotate(-1.5deg); }
      80% { transform: translate(4px, -1px) rotate(1.5deg); }
    }

    @keyframes emotionPop {
      0% { transform: scale(0.86); }
      55% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes plaqueWrongShake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      18% { transform: translateX(-11px) rotate(-2.5deg); }
      36% { transform: translateX(10px) rotate(2.5deg); }
      54% { transform: translateX(-7px) rotate(-1.8deg); }
      72% { transform: translateX(6px) rotate(1.8deg); }
      90% { transform: translateX(-3px) rotate(-0.8deg); }
    }

    @keyframes plaqueCorrectPop {
      0% { transform: scale(1); }
      35% { transform: scale(1.12) translateY(-8px); }
      70% { transform: scale(1.05) translateY(-5px); }
      100% { transform: scale(1.08) translateY(-6px); }
    }

    @keyframes sceneEnter {
      0% { opacity: 0; transform: scale(0.94) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .sun-rays {
      transform-origin: center;
      animation: sunRotate 75s linear infinite;
    }

    .palm-sway-left {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: palmSwayLeft 5.4s ease-in-out infinite;
    }

    .palm-sway-right {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: palmSwayRight 6.2s ease-in-out infinite;
    }

    .waterfall-stream {
      stroke-dasharray: 14 14;
      animation: waterfallFlow 0.85s linear infinite;
    }

    .waterfall-stream-slow {
      stroke-dasharray: 18 16;
      animation: waterfallFlow 1.25s linear infinite;
    }

    .foam-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: foamPulse 2.4s ease-in-out infinite;
    }

    .wave-shimmer {
      animation: waveShimmer 4.2s ease-in-out infinite;
    }

    .wave-shimmer-delayed {
      animation: waveShimmer 5.1s 1.7s ease-in-out infinite;
    }

    /* Character animation classes: applied ONLY to inner groups that have no SVG translate */
    .char-left {
      transform-box: fill-box;
      transform-origin: 50% 94%;
      animation: charIdleLeft 3.2s ease-in-out infinite;
      cursor: pointer;
    }

    .char-right {
      transform-box: fill-box;
      transform-origin: 50% 94%;
      animation: charIdleRight 3.6s ease-in-out infinite;
      cursor: pointer;
    }

    .banner-group {
      transform-box: fill-box;
      transform-origin: center;
      animation: bannerFloat 3.8s ease-in-out infinite;
    }

    .pet-group {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: petIdle 3.4s ease-in-out infinite;
      cursor: pointer;
    }

    .face-pop {
      transform-box: fill-box;
      transform-origin: center;
      animation: emotionPop 0.26s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .blink-eyes {
      transform-box: fill-box;
      transform-origin: center;
      animation: eyeBlink 4.1s infinite;
    }

    .wave-left {
      transform-box: fill-box;
      transform-origin: 85% 20%;
      animation: armWaveLeft 2.4s ease-in-out infinite;
    }

    .wave-right {
      transform-box: fill-box;
      transform-origin: 15% 20%;
      animation: armWaveRight 2.6s ease-in-out infinite;
    }

    .celebrate-anim .char-left,
    .celebrate-anim .char-right {
      animation: charCelebrate 0.65s ease-in-out infinite !important;
    }

    .shrug-anim .char-left,
    .shrug-anim .char-right {
      animation: charShrug 0.55s ease-in-out 1 !important;
    }

    .scene-enter {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: sceneEnter 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Stylized Answer Plaques (Zero white rectangles!) */
    .answer-plaque {
      position: relative;
      cursor: pointer;
      transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.24s ease, opacity 0.24s ease;
      filter: drop-shadow(0 8px 12px rgba(38, 18, 4, 0.42));
    }

    .answer-plaque:hover {
      transform: translateY(-7px) scale(1.045);
      filter: drop-shadow(0 14px 18px rgba(38, 18, 4, 0.52)) brightness(1.04);
    }

    .answer-plaque:active {
      transform: translateY(-2px) scale(0.98);
    }

    .answer-plaque.wrong-shake {
      animation: plaqueWrongShake 0.5s ease-in-out;
      opacity: 0.68;
    }

    .answer-plaque.correct-pop {
      animation: plaqueCorrectPop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      filter: drop-shadow(0 0 26px rgba(255, 232, 85, 0.98));
      z-index: 30;
    }

    /* Top Controls & Mode Switcher */
    .control-btn {
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      filter: drop-shadow(0 6px 12px rgba(8, 43, 56, 0.36));
    }

    .control-btn:hover {
      transform: scale(1.09) translateY(-2px);
      filter: drop-shadow(0 10px 16px rgba(8, 43, 56, 0.48)) brightness(1.05);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .mode-btn {
      transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.24s ease;
      filter: drop-shadow(0 6px 10px rgba(8, 43, 56, 0.32));
      opacity: 0.78;
    }

    .mode-btn:hover {
      transform: translateY(-2px) scale(1.06);
      opacity: 0.95;
    }

    .mode-btn.active-mode {
      opacity: 1;
      transform: scale(1.1);
      filter: drop-shadow(0 0 18px rgba(255, 230, 92, 0.95)) drop-shadow(0 8px 14px rgba(8, 43, 56, 0.45));
    }

    .math-text-main {
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      font-weight: 700;
      letter-spacing: 0.02em;
      fill: #1b2838;
      filter: drop-shadow(0 2px 0px rgba(255, 255, 255, 0.78));
    }

    .math-text-option {
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .mode-label-text {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">

  <!-- UNIFIED 1280x720 WIDESCREEN WORLD & CHARACTER STAGE SVG
       Guarantees palm trees and children ALWAYS stand firmly on the grassy/sandy meadow (y: 365-555),
       while the lagoon water & waterfall stay strictly in the background (y: 280-348)! -->
  <svg id="world-svg" class="absolute inset-0 w-full h-full" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- 1. Sky & Sun Gradients -->
      <linearGradient id="tropSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2292de" />
        <stop offset="52%" stop-color="#64c8f7" />
        <stop offset="100%" stop-color="#caf4ff" />
      </linearGradient>

      <radialGradient id="tropSunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fffbd1" stop-opacity="1" />
        <stop offset="40%" stop-color="#ffe268" stop-opacity="0.65" />
        <stop offset="75%" stop-color="#ffc233" stop-opacity="0.18" />
        <stop offset="100%" stop-color="#ffc233" stop-opacity="0" />
      </radialGradient>

      <!-- 2. Distant Islands & Waterfall Cliff Gradients -->
      <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#4fb07b" />
        <stop offset="60%" stop-color="#2f855c" />
        <stop offset="100%" stop-color="#1f6143" />
      </linearGradient>

      <linearGradient id="rockWallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8c7765" />
        <stop offset="55%" stop-color="#6b5648" />
        <stop offset="100%" stop-color="#4d3c32" />
      </linearGradient>

      <linearGradient id="waterfallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ebfcff" />
        <stop offset="50%" stop-color="#96f2fc" />
        <stop offset="100%" stop-color="#3cd2e6" />
      </linearGradient>

      <!-- 3. Distant Lagoon Water Gradient (y: 280 to 350) -->
      <linearGradient id="lagoonWaterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#19b5cc" />
        <stop offset="55%" stop-color="#22d1d6" />
        <stop offset="100%" stop-color="#5cf2eb" />
      </linearGradient>

      <!-- 4. Dry Land Gradients: Golden Sandy Beach & Lush Grassy Island Meadow (y: 345 to 565) -->
      <linearGradient id="beachSandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fff1bd" />
        <stop offset="50%" stop-color="#fae08c" />
        <stop offset="100%" stop-color="#e8c264" />
      </linearGradient>

      <linearGradient id="meadowGrassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#8ee64c" />
        <stop offset="45%" stop-color="#62c934" />
        <stop offset="100%" stop-color="#3a9c22" />
      </linearGradient>

      <linearGradient id="meadowMoundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#9df056" />
        <stop offset="100%" stop-color="#55b82b" />
      </linearGradient>

      <linearGradient id="sandyPathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f5d98c" />
        <stop offset="50%" stop-color="#ffe8a8" />
        <stop offset="100%" stop-color="#ebca75" />
      </linearGradient>

      <!-- 5. Palm Tree & Foreground Deck Gradients -->
      <linearGradient id="palmTrunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#b07038" />
        <stop offset="55%" stop-color="#875020" />
        <stop offset="100%" stop-color="#5e3410" />
      </linearGradient>

      <linearGradient id="palmLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#adeb46" />
        <stop offset="55%" stop-color="#5ec227" />
        <stop offset="100%" stop-color="#297d10" />
      </linearGradient>

      <linearGradient id="pierDeckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#de9e54" />
        <stop offset="50%" stop-color="#ba7832" />
        <stop offset="100%" stop-color="#874f17" />
      </linearGradient>

      <filter id="sceneShadow" x="-12%" y="-12%" width="124%" height="128%">
        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#183d14" flood-opacity="0.32" />
      </filter>
    </defs>

    <!-- ================= LAYER 1: TROPICAL SKY & SUN (y: 0 to 295) ================= -->
    <rect width="1280" height="320" fill="url(#tropSkyGrad)" />

    <!-- Glowing Sun & Rotating Sunbeams -->
    <g transform="translate(235, 96)">
      <circle cx="0" cy="0" r="155" fill="url(#tropSunGlow)" />
      <g class="sun-rays" opacity="0.25">
        <polygon points="0,0 -18,-250 18,-250" fill="#fff7b2" />
        <polygon points="0,0 -18,-250 18,-250" fill="#fff7b2" transform="rotate(30)" />
        <polygon points="0,0 -18,-250 18,-250" fill="#fff7b2" transform="rotate(60)" />
        <polygon points="0,0 -18,-250 18,-250" fill="#fff7b2" transform="rotate(90)" />
        <polygon points="0,0 -18,-250 18,-250" fill="#fff7b2" transform="rotate(120)" />
        <polygon points="0,0 -18,-250 18,-250" fill="#fff7b2" transform="rotate(150)" />
        <polygon points="0,0 -18,-250 18,-250" fill="#fff7b2" transform="rotate(180)" />
        <polygon points="0,0 -18,-250 18,-250" fill="#fff7b2" transform="rotate(210)" />
        <polygon points="0,0 -18,-250 18,-250" fill="#fff7b2" transform="rotate(240)" />
        <polygon points="0,0 -18,-250 18,-250" fill="#fff7b2" transform="rotate(270)" />
        <polygon points="0,0 -18,-250 18,-250" fill="#fff7b2" transform="rotate(300)" />
        <polygon points="0,0 -18,-250 18,-250" fill="#fff7b2" transform="rotate(330)" />
      </g>
      <circle cx="0" cy="0" r="42" fill="#fff59e" />
      <circle cx="-8" cy="-8" r="30" fill="#ffffff" opacity="0.65" />
    </g>

    <!-- Drifting Fluffy Clouds -->
    <g opacity="0.9" style="animation: cloudDrift1 85s linear infinite;">
      <g transform="translate(120, 62)">
        <ellipse cx="0" cy="14" rx="64" ry="20" fill="#e8f9ff" />
        <circle cx="-24" cy="4" r="28" fill="#ffffff" />
        <circle cx="10" cy="-5" r="34" fill="#ffffff" />
        <circle cx="42" cy="7" r="24" fill="#f2fcff" />
      </g>
    </g>
    <g opacity="0.82" style="animation: cloudDrift2 110s -45s linear infinite;">
      <g transform="translate(620, 78)">
        <ellipse cx="0" cy="16" rx="78" ry="22" fill="#e3f7ff" />
        <circle cx="-32" cy="4" r="30" fill="#ffffff" />
        <circle cx="8" cy="-7" r="38" fill="#ffffff" />
        <circle cx="45" cy="6" r="27" fill="#f5fdff" />
      </g>
    </g>

    <!-- Distant Green Volcanic Islands on Horizon (y: 220 to 290) -->
    <path d="M-60,290 Q110,210 310,265 T710,255 Q880,215 1040,275 L1040,300 L-60,300 Z" fill="url(#cliffGrad)" opacity="0.88" />

    <!-- ================= LAYER 2: DISTANT LAGOON WATER & WATERFALL CLIFF (y: 282 to 350) ================= -->
    <!-- Lagoon Water Strip strictly in the background -->
    <rect x="-40" y="282" width="1360" height="72" fill="url(#lagoonWaterGrad)" />

    <!-- Right-Side Waterfall Cliff (x: 925..1165, y: 155..342) splashing into the distant lagoon -->
    <g transform="translate(935, 165)">
      <path d="M-25,175 L22,26 Q45,-8 98,0 L215,0 L265,175 Z" fill="url(#rockWallGrad)" />
      <path d="M22,26 L64,72 L46,165 L-12,172 Z" fill="#59473f" opacity="0.65" />
      <path d="M150,12 L188,84 L175,172 L128,172 Z" fill="#59473f" opacity="0.65" />
      <!-- Cliff Top Jungle Canopy -->
      <ellipse cx="42" cy="6" rx="44" ry="20" fill="#46ad31" />
      <ellipse cx="98" cy="-3" rx="38" ry="18" fill="#68cc39" />
      <ellipse cx="158" cy="5" rx="48" ry="21" fill="#3b9628" />
      <ellipse cx="206" cy="12" rx="42" ry="19" fill="#59bf32" />

      <!-- Waterfall Stream cascading into Lagoon at y=172 (world y=337) -->
      <path d="M66,8 Q98,12 130,8 L148,172 L48,172 Z" fill="url(#waterfallGrad)" />
      <line x1="78" y1="12" x2="64" y2="166" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.85" class="waterfall-stream" />
      <line x1="98" y1="10" x2="98" y2="168" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9" class="waterfall-stream-slow" />
      <line x1="118" y1="12" x2="132" y2="166" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.85" class="waterfall-stream" />

      <!-- Waterfall Mist & Foam in the Lagoon -->
      <g class="foam-pulse">
        <ellipse cx="98" cy="171" rx="64" ry="12" fill="#e8fdff" />
        <circle cx="58" cy="170" r="13" fill="#ffffff" opacity="0.9" />
        <circle cx="84" cy="168" r="16" fill="#ffffff" />
        <circle cx="112" cy="168" r="15" fill="#ffffff" />
        <circle cx="136" cy="170" r="12" fill="#ffffff" opacity="0.9" />
      </g>
    </g>

    <!-- Gentle Shimmering Wave Lines in the Distant Lagoon (y: 298 to 335) -->
    <g class="wave-shimmer">
      <path d="M70,304 Q145,298 220,304 T370,304" fill="none" stroke="#b8fcff" stroke-width="2.8" stroke-linecap="round" />
      <path d="M510,318 Q590,312 670,318 T830,318" fill="none" stroke="#b8fcff" stroke-width="3" stroke-linecap="round" />
      <path d="M950,342 Q1030,336 1110,342" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>
    <g class="wave-shimmer-delayed">
      <path d="M180,326 Q265,320 350,326 T520,326" fill="none" stroke="#8cf7ff" stroke-width="2.4" stroke-linecap="round" />
      <path d="M720,302 Q800,296 880,302" fill="none" stroke="#8cf7ff" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- ================= LAYER 3: SOLID DRY LAND — GOLDEN BEACH & LUSH GRASSY MEADOW (y: 342 to 565) ================= -->
    <!-- Gently lapping white shoreline foam separating the distant water from the dry sandy beach -->
    <path d="M-40,346 Q320,332 640,344 T1320,342 L1320,362 L-40,362 Z" fill="#e6ffff" opacity="0.92" />
    <path d="M-40,347 Q320,333 640,345 T1320,343" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

    <!-- Wide Golden Sandy Beach Band (y: 348 to 395) -->
    <path d="M-40,350 Q320,336 640,348 T1320,346 L1320,415 L-40,415 Z" fill="url(#beachSandGrad)" />

    <!-- Cute Seashells & Starfish resting on the Dry Golden Sand -->
    <g transform="translate(275, 368) scale(0.75)">
      <polygon points="0,-12 4,-3 14,-2 6,4 9,14 0,8 -9,14 -6,4 -14,-2 -4,-3" fill="#ff735c" stroke="#802214" stroke-width="2" stroke-linejoin="round" />
      <circle cx="0" cy="1" r="2.5" fill="#ffe680" />
    </g>
    <g transform="translate(915, 366) scale(0.8)">
      <path d="M-12,4 Q0,-12 12,4 Q6,10 0,10 Q-6,10 -12,4 Z" fill="#fff3db" stroke="#8c5828" stroke-width="2" />
      <path d="M0,9 L-5,0 M0,9 L0,-3 M0,9 L5,0" stroke="#b5835a" stroke-width="1.6" />
    </g>

    <!-- Main Lush Green Grassy Island Meadow (y: 374 down to 565) -->
    <path d="M-40,382 Q280,364 640,376 T1320,374 L1320,570 L-40,570 Z" fill="url(#meadowGrassGrad)" stroke="#48a825" stroke-width="2.5" />

    <!-- Soft Rolling Grassy Hills & Mounds on the Left and Right where the Palm Trees Grow -->
    <path d="M-40,415 Q140,378 330,425 Q180,455 -40,450 Z" fill="url(#meadowMoundGrad)" />
    <path d="M1320,418 Q1140,380 950,428 Q1100,455 1320,450 Z" fill="url(#meadowMoundGrad)" />

    <!-- Warm Winding Sandy Footpath across the Grassy Clearing where the Children Stand (y: 425 to 505) -->
    <path d="M120,468 Q380,432 640,446 T1160,465 Q1020,502 640,492 T120,468 Z" fill="url(#sandyPathGrad)" stroke="#deb862" stroke-width="2" opacity="0.92" />

    <!-- Grass Tufts, Pebbles & Meadow Wildflowers on the Dry Clearing -->

  <script>
    /*************************************************************************
     * 1. WEB AUDIO API SYNTHESIZER (Tropical Marimba, Kalimba, Steel Drum)
     *************************************************************************/
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.init();
        this.muted = !this.muted;
        return this.muted;
      }

      playTone(freq, type, duration, startTime = 0, volume = 0.18, slideTo = null) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime + startTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
        }

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      playHover() {
        this.playTone(659.25, 'sine', 0.055, 0, 0.045, 783.99);
      }

      playModeSwitch() {
        this.playTone(523.25, 'triangle', 0.09, 0, 0.14, 659.25);
        this.playTone(783.99, 'sine', 0.14, 0.06, 0.14, 1046.5);
      }

      playEmotionPop() {
        const notes = [523.25, 587.33, 659.25, 783.99, 880, 987.77];
        const f = notes[Math.floor(Math.random() * notes.length)];
        this.playTone(f, 'sine', 0.09, 0, 0.09, f * 1.16);
      }

      playSkip() {
        this.playTone(440, 'triangle', 0.08, 0, 0.12, 587.33);
        this.playTone(587.33, 'triangle', 0.12, 0.06, 0.14, 880);
      }

      playWrong() {
        // Playful hollow bamboo / coconut woodblock "bonk-bonk"
        this.playTone(230, 'triangle', 0.16, 0, 0.22, 140);
        this.playTone(185, 'sine', 0.22, 0.09, 0.2, 115);
      }

      playWinVariant(variantIndex) {
        if (this.muted) return;
        this.init();

        const v = variantIndex % 4;
        if (v === 0) {
          // Variant 0: Tropical Steel Drum & Marimba Arpeggio
          const notes = [523.25, 659.25, 783.99, 1046.5, 1318.51, 1567.98];
          notes.forEach((f, i) => {
            this.playTone(f, 'triangle', 0.28, i * 0.07, 0.2);
            this.playTone(f * 2, 'sine', 0.15, i * 0.07, 0.06);
          });
        } else if (v === 1) {
          // Variant 1: Lagoon Kalimba Sparkling Glissando
          const scale = [493.88, 587.33, 659.25, 783.99, 880, 987.77, 1174.66, 1318.51];
          scale.forEach((f, i) => {
            this.playTone(f, 'sine', 0.34, i * 0.055, 0.17);
          });
        } else if (v === 2) {
          // Variant 2: Island Sun Chord Fanfare
          const melody = [
            { f: 587.33, t: 0, d: 0.13 },
            { f: 739.99, t: 0.1, d: 0.13 },
            { f: 880.0, t: 0.2, d: 0.13 },
            { f: 1174.66, t: 0.32, d: 0.42 },
            { f: 880.0, t: 0.32, d: 0.42 }
          ];
          melody.forEach(n => {
            this.playTone(n.f, 'triangle', n.d, n.t, 0.18);
          });
        } else {
          // Variant 3: Cascading Waterfall Bell Chimes
          const cascade = [659.25, 783.99, 987.77, 1174.66, 1318.51, 1567.98];
          cascade.forEach((f, i) => {
            this.playTone(f, 'sine', 0.24, i * 0.065, 0.18, f * 1.04);
          });
        }
      }
    }

    const sound = new SoundEngine();

    /*************************************************************************
     * 2. INFINITE MATH GENERATOR (ADDITION & SUBTRACTION ONLY!)
     *    - Mode 20 (1st Grade): addition & subtraction within 20 (target 3..20, operands 1..20)
     *    - Mode 100 (2nd Grade): addition & subtraction within 100 (target 12..95, operands up to 100)
     *    - Strictly 1 correct answer out of 4 options.
     *    - Main expression and correct option never have identical text or trivial reversed operands.
     *************************************************************************/
    let currentMaxLimit = 100; // Default: 2nd Grade Mode (100), toggleable to 1st Grade Mode (20)
    let roundCounter = 0;
    const recentMainTexts = new Set();

    const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Build an addition or subtraction expression that evaluates to `targetVal` within `maxLimit`
    function buildAddSubExpr(targetVal, opType, maxLimit, forbidTexts = new Set()) {
      for (let attempt = 0; attempt < 60; attempt++) {
        let a, b, text;
        if (opType === '+') {
          if (maxLimit === 20) {
            if (targetVal < 3) return null;
            a = randInt(1, targetVal - 1);
            b = targetVal - a;
          } else {
            // Mode 100: favor meaningful 2nd-grade addition (two-digit + two-digit, round tens, or crossing ten)
            if (targetVal < 12) return null;
            const minA = Math.max(4, Math.floor(targetVal * 0.2));
            const maxA = Math.min(targetVal - 4, Math.floor(targetVal * 0.8));
            a = randInt(minA, maxA);
            b = targetVal - a;
          }
          text = `${a} + ${b}`;
        } else {
          // Subtraction: a - b = targetVal, where a <= maxLimit
          if (maxLimit === 20) {
            if (targetVal >= 19) return null;
            a = randInt(targetVal + 1, 20);
            b = a - targetVal;
          } else {
            if (targetVal >= 96) return null;
            // Occasionally use round tens or 100 as minuend (e.g. 100 - 35, 80 - 24)
            if (Math.random() < 0.28 && targetVal <= 85) {
              const roundTens = [40, 50, 60, 70, 80, 90, 100].filter(t => t > targetVal + 4);
              a = roundTens[randInt(0, roundTens.length - 1)];
            } else {
              a = randInt(targetVal + 6, 100);
            }
            b = a - targetVal;
          }
          text = `${a} − ${b}`;
        }

        // Avoid exact duplicate or simple commutative duplicate (e.g., 14 + 5 vs 5 + 14)
        const commuted = opType === '+' ? `${b} + ${a}` : '';
        if (!forbidTexts.has(text) && (!commuted || !forbidTexts.has(commuted))) {
          return { text, val: targetVal, op: opType };
        }
      }
      return null;
    }

    function generateNextTask() {
      const sceneIndex = roundCounter % 4;
      roundCounter++;

      let targetVal;
      let mainOp = Math.random() < 0.5 ? '+' : '−';
      let mainExpr = null;
      let correctOption = null;

      for (let tries = 0; tries < 60; tries++) {
        if (currentMaxLimit === 20) {
          targetVal = randInt(5, 18);
        } else {
          targetVal = randInt(18, 86);
        }

        mainExpr = buildAddSubExpr(targetVal, mainOp, currentMaxLimit, recentMainTexts);
        if (!mainExpr) continue;

        // Correct option can use the opposite operation (e.g. main is +, correct is −) or a distinct same-op pair
        const preferOppositeOp = Math.random() < 0.65 ? (mainOp === '+' ? '−' : '+') : mainOp;
        const forbid = new Set([mainExpr.text]);
        correctOption = buildAddSubExpr(targetVal, preferOppositeOp, currentMaxLimit, forbid);
        if (!correctOption) {
          const fallbackOp = preferOppositeOp === '+' ? '−' : '+';
          correctOption = buildAddSubExpr(targetVal, fallbackOp, currentMaxLimit, forbid);
        }
        if (correctOption) {
          correctOption.isCorrect = true;
          break;
        }
      }

      recentMainTexts.add(mainExpr.text);
      if (recentMainTexts.size > 30) {
        const oldest = recentMainTexts.values().next().value;
        recentMainTexts.delete(oldest);
      }

      // Build 3 plausible distractors (mix of + and −) whose values are strictly != targetVal and unique
      const usedValues = new Set([targetVal]);
      const usedTexts = new Set([mainExpr.text, correctOption.text]);
      const options = [correctOption];

      // Ensure 2 addition options and 2 subtraction options among the 4 bottom plaques
      const desiredOps = correctOption.op === '+' ? ['+', '−', '−'] : ['+', '+', '−'];

      for (const op of desiredOps) {
        let distractor = null;
        for (let attempt = 0; attempt < 50; attempt++) {
          let distVal;
          if (currentMaxLimit === 20) {
            // Close plausible values within 2..20
            const offset = randInt(1, 6) * (Math.random() < 0.5 ? 1 : -1);
            distVal = targetVal + offset;
            if (distVal < 3 || distVal > 19) distVal = randInt(3, 19);
          } else {
            // Plausible values in 2nd grade: either +/-10, +/-1..8, or general range 12..94
            const r = Math.random();
            if (r < 0.35) {
              distVal = targetVal + (Math.random() < 0.5 ? 10 : -10);
            } else if (r < 0.7) {
              distVal = targetVal + randInt(2, 9) * (Math.random() < 0.5 ? 1 : -1);
            } else {
              distVal = randInt(14, 92);
            }
            if (distVal < 12 || distVal > 94) distVal = randInt(14, 90);
          }

          if (usedValues.has(distVal)) continue;

          const built = buildAddSubExpr(distVal, op, currentMaxLimit, usedTexts);
          if (built) {
            distractor = { ...built, isCorrect: false };
            usedValues.add(distVal);
            usedTexts.add(built.text);
            break;
          }
        }

        if (!distractor) {
          // Guaranteed unique fallback
          let fbVal = currentMaxLimit === 20 ? 4 : 25;
          while (usedValues.has(fbVal)) fbVal++;
          usedValues.add(fbVal);
          distractor = {
            text: op === '+' ? `${fbVal - 2} + 2` : `${fbVal + 2} − 2`,
            val: fbVal,
            op,
            isCorrect: false
          };
        }
        options.push(distractor);
      }

      return {
        sceneIndex,
        mainText: mainExpr.text,
        targetVal: mainExpr.val,
        options: shuffleArray(options)
      };
    }

    /*************************************************************************
     * 6. HTML5 CANVAS ENGINE (Dragonflies, Jumping Lagoon Fish, Celebrations)
     *************************************************************************/
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Ambient Shimmering Lagoon Dragonflies
    const dragonflies = Array.from({ length: 5 }, (_, i) => ({
      x: Math.random() * window.innerWidth,
      y: window.innerHeight * (0.28 + Math.random() * 0.4),
      vx: (Math.random() * 1.3 + 0.6) * (i % 2 === 0 ? 1 : -1),
      vy: (Math.random() - 0.5) * 0.4,
      wingPhase: Math.random() * Math.PI * 2,
      size: 11 + Math.random() * 5,
      color: ['#47f5d8', '#ff7597', '#ffe14d', '#70c4ff'][i % 4]
    }));

    // Ambient Floating Hibiscus Petals
    const floatingPetals = Array.from({ length: 14 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: 0.35 + Math.random() * 0.55,
      vy: 0.25 + Math.random() * 0.45,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.03,
      size: 4.5 + Math.random() * 4,
      color: Math.random() < 0.5 ? '#ff8da6' : '#ffe985'
    }));

    let activeParticles = [];

    function drawStar(c, x, y, radius, points = 5) {
      c.beginPath();
      for (let i = 0; i < points * 2; i++) {
        const r = i % 2 === 0 ? radius : radius * 0.45;
        const angle = (i * Math.PI) / points - Math.PI / 2;
        const px = x + Math.cos(angle) * r;
        const py = y + Math.sin(angle) * r;
        if (i === 0) c.moveTo(px, py);
        else c.lineTo(px, py);
      }
      c.closePath();
      c.fill();
    }

    function drawTropicalFlower(c, x, y, radius, petalColor, centerColor) {
      c.fillStyle = petalColor;
      for (let i = 0; i < 5; i++) {
        const a = (i * Math.PI * 2) / 5;
        c.beginPath();
        c.arc(x + Math.cos(a) * (radius * 0.6), y + Math.sin(a) * (radius * 0.6), radius * 0.5, 0, Math.PI * 2);
        c.fill();
      }
      c.fillStyle = centerColor;
      c.beginPath();
      c.arc(x, y, radius * 0.38, 0, Math.PI * 2);
      c.fill();
    }

    function drawDragonfly(c, x, y, size, wingScale, color, dir = 1) {
      c.save();
      c.translate(x, y);
      if (dir < 0) c.scale(-1, 1);
      // Translucent shimmering wings
      c.fillStyle = 'rgba(220, 252, 255, 0.75)';
      c.beginPath();
      c.ellipse(0, -size * 0.45 * wingScale, size * 0.28, size * 0.7 * wingScale, 0.25, 0, Math.PI * 2);
      c.ellipse(-size * 0.2, -size * 0.4 * wingScale, size * 0.24, size * 0.6 * wingScale, -0.2, 0, Math.PI * 2);
      c.fill();
      // Slender iridescent body
      c.fillStyle = color;
      c.beginPath();
      c.ellipse(0, 0, size * 0.85, size * 0.16, 0, 0, Math.PI * 2);
      c.fill();
      c.beginPath();
      c.arc(size * 0.8, 0, size * 0.24, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    function drawTropicalFish(c, x, y, size, color, angle) {
      c.save();
      c.translate(x, y);
      c.rotate(angle);
      c.fillStyle = color;
      // Fish body
      c.beginPath();
      c.ellipse(0, 0, size, size * 0.58, 0, 0, Math.PI * 2);
      c.fill();
      // Tail fin
      c.beginPath();
      c.moveTo(-size * 0.85, 0);
      c.lineTo(-size * 1.45, -size * 0.55);
      c.lineTo(-size * 1.45, size * 0.55);
      c.closePath();
      c.fill();
      // Eye
      c.fillStyle = '#ffffff';
      c.beginPath();
      c.arc(size * 0.48, -size * 0.15, size * 0.18, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#111111';
      c.beginPath();
      c.arc(size * 0.52, -size * 0.15, size * 0.09, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    function spawnWrongPuff(rect) {
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const colors = ['#74e8de', '#ffe082', '#d9a15b', '#ffffff'];
      for (let i = 0; i < 18; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5.5;
        activeParticles.push({
          type: 'bubble',
          x: cx + (Math.random() - 0.5) * rect.width * 0.45,
          y: cy + (Math.random() - 0.5) * 18,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.2,
          gravity: 0.12,
          size: 5 + Math.random() * 6,
          alpha: 1,
          decay: 0.028,
          color: colors[i % colors.length]
        });
      }
    }

    function spawnCelebration(plaqueRect, variantIndex) {
      const startX = plaqueRect.left + plaqueRect.width / 2;
      const startY = plaqueRect.top + plaqueRect.height / 2;

      const bannerEl = document.getElementById('main-banner-target');
      const bannerRect = bannerEl
        ? bannerEl.getBoundingClientRect()
        : { left: window.innerWidth / 2 - 100, top: window.innerHeight * 0.3, width: 200, height: 100 };

      const targetX = bannerRect.left + bannerRect.width / 2;
      const targetY = bannerRect.top + bannerRect.height / 2;

      // 1. Golden Star Stream from Clicked Plaque to Central Board
      for (let i = 0; i < 26; i++) {
        const t = i / 26;
        const lx = startX + (targetX - startX) * t + (Math.random() - 0.5) * 45;
        const ly = startY + (targetY - startY) * t + (Math.random() - 0.5) * 35;
        activeParticles.push({
          type: 'star',
          x: lx,
          y: ly,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4 - 1,
          gravity: 0.04,
          size: 10 + Math.random() * 10,
          rot: Math.random() * Math.PI,
          vRot: 0.08,
          alpha: 1,
          decay: 0.018,
          color: i % 2 === 0 ? '#ffe84d' : '#70f8ff'
        });
      }

      // 2. 4 Distinct Tropical Lagoon Celebration Bursts!
      const v = variantIndex % 4;
      const palette = ['#ff5983', '#ffcf33', '#38e8ff', '#7af556', '#ff8c3b', '#b87aff'];

      for (let i = 0; i < 62; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3.5 + Math.random() * 10.5;
        const pType = v === 0 ? 'fish' : v === 1 ? 'flower' : v === 2 ? 'bubble' : 'star';

        activeParticles.push({
          type: pType,
          x: targetX + (Math.random() - 0.5) * 150,
          y: targetY + (Math.random() - 0.5) * 65,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - (pType === 'bubble' ? 3.5 : 2.5),
          gravity: pType === 'bubble' ? -0.05 : 0.15,
          size: pType === 'fish' ? 13 + Math.random() * 7 : 10 + Math.random() * 11,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.14,
          alpha: 1,
          decay: 0.013 + Math.random() * 0.006,
          color: palette[i % palette.length],
          centerColor: '#fff599'
        });
      }
    }

    function animateCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Floating Hibiscus Petals
      floatingPetals.forEach(p => {
        p.x += p.vx;
        p.y += p.vy + Math.sin(p.x * 0.01) * 0.2;
        p.rot += p.vRot;
        if (p.x > canvas.width + 20) p.x = -20;
        if (p.y > canvas.height + 20) p.y = -20;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = 0.72;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 2. Shimmering Lagoon Dragonflies
      dragonflies.forEach(d => {
        d.x += d.vx;
        d.y += d.vy + Math.sin(d.wingPhase * 0.2) * 0.4;
        d.wingPhase += 0.35;

        if (d.x > canvas.width + 45) d.x = -45;
        if (d.x < -45) d.x = canvas.width + 45;

        const wingScale = 0.35 + Math.abs(Math.sin(d.wingPhase)) * 0.65;
        drawDragonfly(ctx, d.x, d.y, d.size, wingScale, d.color, d.vx >= 0 ? 1 : -1);
      });

      // 3. Active Celebration Particles
      for (let i = activeParticles.length - 1; i >= 0; i--) {
        const p = activeParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rot = (p.rot || 0) + (p.vRot || 0);
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          activeParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);

        if (p.type === 'star') {
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          drawStar(ctx, 0, 0, p.size, 5);
        } else if (p.type === 'flower') {
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          drawTropicalFlower(ctx, 0, 0, p.size, p.color, p.centerColor);
        } else if (p.type === 'fish') {
          const moveAngle = Math.atan2(p.vy, p.vx);
          drawTropicalFish(ctx, p.x, p.y, p.size, p.color, moveAngle);
        } else {
          // Shimmering Lagoon Bubble
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 0.65, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        ctx.restore();
      }

      requestAnimationFrame(animateCanvas);
    }

    /*************************************************************************
     * 7. GAME CONTROLLER, INDEPENDENT EMOTION TIMERS & MODE SWITCHING
     *************************************************************************/
    const sceneStage = document.getElementById('scene-stage');
    const optionsContainer = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const soundBtn = document.getElementById('sound-btn');
    const soundMuteLine = document.getElementById('sound-mute-line');
    const mode20Btn = document.getElementById('mode-20-btn');
    const mode100Btn = document.getElementById('mode-100-btn');

    let currentTask = null;
    let isLocked = false;
    let autoAdvanceTimer = null;
    let celebrationCounter = 0;

    let leftEmotionTimer = null;
    let rightEmotionTimer = null;
    let currentLeftEmotion = 'happy';
    let currentRightEmotion = 'happy';

    function setKidEmotion(side, emotionName = null) {
      if (!currentTask) return;
      const cfg = SCENE_FACE_CONFIGS[currentTask.sceneIndex];
      const targetEl = document.getElementById(side === 'left' ? 'face-left' : 'face-right');
      if (!targetEl) return;

      const prevEmotion = side === 'left' ? currentLeftEmotion : currentRightEmotion;
      let chosen = emotionName;
      if (!chosen) {
        const pool = EMOTION_LIST.filter(e => e !== prevEmotion);
        chosen = pool[randInt(0, pool.length - 1)];
      }

      if (side === 'left') currentLeftEmotion = chosen;
      else currentRightEmotion = chosen;

      targetEl.innerHTML = buildKidFaceMarkup(chosen, side === 'left' ? cfg.left : cfg.right);
    }

    function stopEmotionTimers() {
      if (leftEmotionTimer) clearTimeout(leftEmotionTimer);
      if (rightEmotionTimer) clearTimeout(rightEmotionTimer);
    }

    function scheduleLeftEmotion() {
      if (leftEmotionTimer) clearTimeout(leftEmotionTimer);
      leftEmotionTimer = setTimeout(() => {
        if (!isLocked) setKidEmotion('left');
        scheduleLeftEmotion();
      }, randInt(2000, 3700));
    }

    function scheduleRightEmotion() {
      if (rightEmotionTimer) clearTimeout(rightEmotionTimer);
      rightEmotionTimer = setTimeout(() => {
        if (!isLocked) setKidEmotion('right');
        scheduleRightEmotion();
      }, randInt(2200, 3900));
    }

    function bindCharacterEmotionClicks() {
      const leftKid = document.getElementById('kid-left-clickable');
      const rightKid = document.getElementById('kid-right-clickable');
      const pet = document.getElementById('pet-clickable');

      if (leftKid) {
        leftKid.addEventListener('click', () => {
          sound.playEmotionPop();
          setKidEmotion('left');
        });
      }
      if (rightKid) {
        rightKid.addEventListener('click', () => {
          sound.playEmotionPop();
          setKidEmotion('right');
        });
      }
      if (pet) {
        pet.addEventListener('click', () => {
          sound.playEmotionPop();
          setKidEmotion(Math.random() < 0.5 ? 'left' : 'right');
        });
      }
    }

    function loadNextRound() {
      if (autoAdvanceTimer) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
      }
      stopEmotionTimers();
      isLocked = false;
      currentTask = generateNextTask();

      sceneStage.setAttribute('class', '');
      sceneStage.innerHTML = getSceneSVG(currentTask.sceneIndex, currentTask.mainText);

      bindCharacterEmotionClicks();
      scheduleLeftEmotion();
      scheduleRightEmotion();

      optionsContainer.innerHTML = currentTask.options
        .map((opt, idx) => createOptionPlaqueHTML(opt, idx))
        .join('');

      const plaques = optionsContainer.querySelectorAll('.answer-plaque');
      plaques.forEach(btn => {
        btn.addEventListener('mouseenter', () => {
          if (!isLocked) sound.playHover();
        });

        btn.addEventListener('click', () => {
          if (isLocked) return;
          const isCorrect = btn.getAttribute('data-correct') === 'true';
          const rect = btn.getBoundingClientRect();

          if (isCorrect) {
            isLocked = true;
            btn.classList.add('correct-pop');
            sceneStage.setAttribute('class', 'celebrate-anim');

            setKidEmotion('left', Math.random() < 0.5 ? 'starry' : 'laugh');
            setKidEmotion('right', Math.random() < 0.5 ? 'laugh' : 'starry');

            sound.playWinVariant(celebrationCounter);
            spawnCelebration(rect, celebrationCounter);
            celebrationCounter++;

            autoAdvanceTimer = setTimeout(() => {
              loadNextRound();
            }, 1650);
          } else {
            btn.classList.remove('wrong-shake');
            void btn.offsetWidth;
            btn.classList.add('wrong-shake');

            sceneStage.setAttribute('class', '');
            void sceneStage.offsetWidth;
            sceneStage.setAttribute('class', 'shrug-anim');

            setKidEmotion('left', Math.random() < 0.5 ? 'puzzled' : 'surprised');
            setKidEmotion('right', Math.random() < 0.5 ? 'surprised' : 'puzzled');

            sound.playWrong();
            spawnWrongPuff(rect);
          }
        });
      });
    }

    // Mode Switching: 20 (1st Grade) vs 100 (2nd Grade)
    function switchMode(newMax) {
      if (currentMaxLimit === newMax) return;
      currentMaxLimit = newMax;
      recentMainTexts.clear();
      mode20Btn.classList.toggle('active-mode', newMax === 20);
      mode100Btn.classList.toggle('active-mode', newMax === 100);
      sound.playModeSwitch();
      loadNextRound();
    }

    mode20Btn.addEventListener('click', () => switchMode(20));
    mode100Btn.addEventListener('click', () => switchMode(100));

    // Minimalist "Next" Button
    nextBtn.addEventListener('click', () => {
      sound.playSkip();
      loadNextRound();
    });

    // Sound Toggle Button
    soundBtn.addEventListener('click', () => {
      const muted = sound.toggleMute();
      soundMuteLine.classList.toggle('hidden', !muted);
      if (!muted) sound.playHover();
    });

    window.onload = function () {
      loadNextRound();
      animateCanvas();
    };
  </script>
</body>
</html>
