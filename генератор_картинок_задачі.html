<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтерактивний Генератор та Нотатки (Квадрат)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #222;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            background: rgba(255, 255, 255, 0.9);
            width: 95vw;
            max-width: 1800px;
            height: 90vh;
            min-height: 600px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .generator-section {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 2px dashed #ccc;
        }

        .notepad-section {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Квадратний контейнер для картинки, щоб запобігти сплющуванню */
        .image-preview {
            width: 100%;
            aspect-ratio: 1 / 1; 
            background: #e0e0e0;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Заповнює квадрат без спотворень */
            display: none;
        }

        .loader {
            display: none;
            position: absolute;
            font-size: 18px;
            font-weight: bold;
            color: #555;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="text"], select {
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 8px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-family: Arial, sans-serif;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        /* Notepad */
        .notepad-toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .notepad-toolbar button {
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: #28a745;
        }

        .notepad-toolbar button:hover {
            background: #218838;
        }

        textarea {
            flex: 1;
            width: 100%;
            padding: 15px;
            border: 1px solid #aaa;
            border-radius: 8px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            resize: none;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.7);
        }

        /* Theme Manager */
        .theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #ccc;
            font-size: 30px;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .theme-btn:hover {
            transform: scale(1.1);
        }

        .theme-modal {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 350px;
            max-height: 60vh;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 9998;
            overflow-y: auto;
            display: none;
            padding: 15px;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            box-sizing: border-box;
        }

        .theme-tile {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid transparent;
            transition: 0.2s;
            background-size: cover;
            background-position: center;
        }

        .theme-tile:hover {
            border-color: #007bff;
            transform: scale(1.05);
        }

        .theme-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            text-align: center;
            font-size: 14px;
            padding: 5px;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        @media (max-width: 800px) {
            .main-container {
                flex-direction: column;
                height: 95vh;
                overflow-y: auto;
            }
            .generator-section {
                border-right: none;
                border-bottom: 2px dashed #ccc;
            }
        }
    </style>
<body>

    <div class="main-container">
        <!-- Generator Section -->
        <div class="generator-section">
            <div class="image-preview">
                <div class="loader" id="loader">Малюємо...</div>
                <img id="outputImage" alt="Згенерована картинка">
            </div>
            <div class="controls">
                <!-- ДОДАНО ПЕРЕДВСТАНОВЛЕНИЙ ТЕКСТ ІЗ ЗОБРАЖЕННЯ ДО PLACEHOLDER -->
                <input type="text" id="promptInput" placeholder="Шрек з каструлею на голові в рожевих тапках біля морі в мультяшному стилі нач">
                <select id="serviceSelect">
                    <option value="pollinations">Сервіс 1 (Pollinations AI)</option>
                    <!-- ЗАМІНЕНО НЕПРАЦЮЮЧИЙ AIRFORCE НА PIXART -->
                    <option value="pixart">Сервіс 2 (PixArt-α)</option> 
                    <option value="flux">Сервіс 3 (Flux AI)</option>
                </select>
                <button id="generateBtn" onclick="generateImage()">Згенерувати</button>
            </div>
        </div>

        <!-- Notepad Section -->
        <div class="notepad-section">
            <div class="notepad-toolbar">
                <button onclick="changeFontSize(2)">+</button>
                <button onclick="changeFontSize(-2)">-</button>
            </div>
            <textarea id="notepadText" placeholder="Пишіть тут свої ідеї або історії..."></textarea>
        </div>
    </div>

    <!-- Theme Manager -->
    <button class="theme-btn" onclick="toggleThemeModal()">⚙️</button>
    <div class="theme-modal" id="themeModal"></div>

    <script>
        // ==========================================
        // ГЕНЕРАТОР ЗОБРАЖЕНЬ ТА ПЕРЕКЛАДАЧ
        // ==========================================
        async function translateToEnglish(text) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=uk&tl=en&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();
                return data[0][0][0];
            } catch (error) {
                console.error('Помилка перекладу:', error);
                return text; 
            }
        }

        async function generateImage() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) {
                alert('Будь ласка, введіть опис картинки!');
                return;
            }

            const service = document.getElementById('serviceSelect').value;
            const imgEl = document.getElementById('outputImage');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('generateBtn');

            imgEl.style.display = 'none';
            loader.style.display = 'block';
            btn.disabled = true;

            try {
                const translatedPrompt = await translateToEnglish(prompt);
                
                // ЗМІНЕНО: 16:9 aspect ratio -> 1:1 aspect ratio для квадратного формату
                const styleModifier = ", cartoon style, highly detailed, vibrant, slightly blurred background, 1:1 aspect ratio";
                const finalPrompt = encodeURIComponent(translatedPrompt + styleModifier);
                
                let imageUrl = "";
                const randomSeed = Math.floor(Math.random() * 1000000);

                // ОНОВЛЕНО URL ТА ПАРАМЕТРИ ДЛЯ ВСІХ СЕРВІСІВ (КВАДРАТ 1024x1024)
                if (service === 'pollinations') {
                    // SDXL
                    imageUrl = `https://image.pollinations.ai/prompt/${finalPrompt}?width=1024&height=1024&nologo=true&seed=${randomSeed}`;
                } else if (service === 'pixart') { // airforce -> pixart
                    // PixArt-α через Pollinations (ЗАМІНА AIRFORCE)
                    imageUrl = `https://image.pollinations.ai/prompt/${finalPrompt}?width=1024&height=1024&model=pixart&nologo=true&seed=${randomSeed}`;
                } else if (service === 'flux') {
                    // Flux
                    imageUrl = `https://image.pollinations.ai/prompt/${finalPrompt}?width=1024&height=1024&model=flux&nologo=true&seed=${randomSeed}`;
                }

                await new Promise((resolve, reject) => {
                    imgEl.onload = resolve;
                    imgEl.onerror = reject;
                    imgEl.src = imageUrl;
                });

                imgEl.style.display = 'block';
            } catch (error) {
                alert('Сталася помилка при генерації або сервер перевантажений. Спробуйте інший сервіс!');
                console.error(error);
            } finally {
                loader.style.display = 'none';
                btn.disabled = false;
            }
        }

        // ==========================================
        // ЛОГІКА НОТАТОК (ШРИФТ)
        // ==========================================
        let currentFontSize = 16;
        const textarea = document.getElementById('notepadText');

        function changeFontSize(delta) {
            currentFontSize += delta;
            if (currentFontSize < 10) currentFontSize = 10; 
            if (currentFontSize > 40) currentFontSize = 40; 
            textarea.style.fontSize = currentFontSize + 'px';
        }

        // ==========================================
        // СИСТЕМА ДИНАМІЧНИХ ФОНІВ (THEME MANAGER)
        // ==========================================
        const themeModal = document.getElementById('themeModal');
        const baseUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
        const defaultBg = `${baseUrl}background_1.webp`;

        function toggleThemeModal() {
            if (themeModal.style.display === 'grid') {
                themeModal.style.display = 'none';
            } else {
                themeModal.style.display = 'grid';
            }
        }

        function setBackground(url) {
            document.body.style.backgroundImage = `url('${url}')`;
            localStorage.setItem('mySavedGameBg', url);
        }

        const savedBg = localStorage.getItem('mySavedGameBg');
        if (savedBg) {
            setBackground(savedBg);
        } else {
            setBackground(defaultBg);
        }

        async function checkAndLoadThemes() {
            let consecutiveFails = 0;
            for (let i = 1; i <= 1000; i++) {
                const url = `${baseUrl}background_${i}.webp`;
                
                try {
                    await new Promise((resolve, reject) => {
                        const img = new Image();
                        img.onload = () => {
                            const tile = document.createElement('div');
                            tile.className = 'theme-tile';
                            tile.style.backgroundImage = `url('${url}')`;
                            tile.onclick = () => setBackground(url);
                            
                            const label = document.createElement('div');
                            label.className = 'theme-label';
                            label.innerText = `Фон ${i}`;
                            
                            tile.appendChild(label);
                            themeModal.appendChild(tile);
                            
                            consecutiveFails = 0; 
                            resolve();
                        };
                        img.onerror = () => {
                            consecutiveFails++;
                            resolve(); 
                        };
                        img.src = url;
                    });

                    if (consecutiveFails > 5) break; 
                } catch (e) {
                    console.error(e);
                }
            }
        }

        window.onload = checkAndLoadThemes;
    </script>
</html>
