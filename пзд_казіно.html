<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Domino Turntable Casino</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Montserrat:wght@700;800;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #031812;
      font-family: 'Montserrat', sans-serif;
    }

    /* Main Widescreen Emerald Casino Felt Viewport */
    .casino-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(circle at 30% 44%, #117859 0%, #09523c 38%, #053325 72%, #021710 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.8vh 2.4vw 1.6vh;
      overflow: hidden;
    }

    /* Outer Mahogany & Brass Casino Rail */
    .mahogany-rail {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border: min(1.6vh, 14px) solid #381109;
      border-radius: 26px;
      box-shadow:
        inset 0 0 0 3px #d4af37,
        inset 0 0 0 7px #571b0f,
        inset 0 0 55px rgba(0, 0, 0, 0.88),
        0 0 0 10px #1a0603;
      z-index: 6;
    }

    /* Inner Gold Art Deco Filigree Frame */
    .felt-filigree {
      position: absolute;
      inset: min(2.4vh, 20px);
      border: 2px solid rgba(212, 175, 55, 0.26);
      border-radius: 18px;
      pointer-events: none;
      box-shadow: inset 0 0 0 4px rgba(212, 175, 55, 0.08);
      z-index: 2;
    }

    /* Theatre Dimming Overlay for Accentuated Rotation Focus */
    .theatre-spotlight-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 22;
      opacity: 0;
      transition: opacity 0.5s ease;
      background: radial-gradient(
        circle at var(--spot-x, 31%) var(--spot-y, 44%),
        rgba(254, 240, 138, 0.14) 0%,
        rgba(15, 23, 42, 0.35) 23%,
        rgba(2, 10, 8, 0.86) 52%,
        rgba(1, 6, 5, 0.94) 100%
      );
    }
    .theatre-spotlight-overlay.active {
      opacity: 1;
    }

    /* Main Widescreen Split Stage (Left: Giant Turntable, Right: Commutative Board) */
    .main-stage-grid {
      position: relative;
      z-index: 25;
      width: 100%;
      max-width: 1640px;
      flex: 1;
      display: grid;
      grid-template-columns: 1.15fr 0.95fr;
      align-items: center;
      gap: clamp(14px, 2.4vw, 42px);
      padding: 0 clamp(8px, 1.5vw, 24px);
      min-height: 0;
    }

    /* =================================================================
       LEFT STAGE: GIANT ORNATE GOLDEN CASINO TURNTABLE & DOMINO
       ================================================================= */
    .turntable-zone {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .turntable-assembly {
      position: relative;
      width: min(68vh, 48vw, 540px);
      height: min(68vh, 48vw, 540px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer Stationary Brass & Mahogany Turntable Base */
    .turntable-base-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 18px 32px rgba(0, 0, 0, 0.85));
      pointer-events: none;
    }

    /* Rotating Inner Mechanical Wheel (rotates in sync with Domino) */
    .turntable-rotor-wheel {
      position: absolute;
      inset: 9%;
      width: 82%;
      height: 82%;
      pointer-events: none;
      will-change: transform;
    }

    /* Pulsing Golden Prompt Ring around Turntable when awaiting click */
    @keyframes promptOrbitPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 14px rgba(253, 224, 71, 0.85));
      }
      50% {
        transform: scale(1.03);
        filter: drop-shadow(0 0 28px rgba(254, 240, 138, 1));
      }
    }
    @keyframes slowArrowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .turntable-prompt-ring {
      position: absolute;
      inset: -3%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 30;
    }
    .turntable-assembly.awaiting-flip .turntable-prompt-ring {
      opacity: 1;
      animation: promptOrbitPulse 1.5s ease-in-out infinite;
    }
    .turntable-prompt-ring svg {
      width: 100%;
      height: 100%;
      animation: slowArrowSpin 11s linear infinite;
    }

    /* The Physical Domino Wrapper on the Turntable */
    .domino-turntable-mount {
      position: relative;
      width: 72%;
      height: 36%;
      z-index: 28;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
      filter: drop-shadow(0 14px 20px rgba(0, 0, 0, 0.78));
      transition: filter 0.35s ease;
    }

    .turntable-assembly.awaiting-flip {
      cursor: pointer;
    }

    @keyframes dominoInvitePulse {
      0%, 100% {
        filter: drop-shadow(0 0 22px rgba(250, 204, 21, 0.9)) drop-shadow(0 16px 22px rgba(0, 0, 0, 0.85));
      }
      50% {
        filter: drop-shadow(0 0 42px rgba(254, 240, 138, 1)) drop-shadow(0 22px 28px rgba(0, 0, 0, 0.9));
      }
    }
    .turntable-assembly.awaiting-flip .domino-turntable-mount {
      animation: dominoInvitePulse 1.4s ease-in-out infinite;
    }

    /* Elevated 3D Shadow during Active Rotation */
    .domino-turntable-mount.elevated-rotating {
      filter:
        drop-shadow(0 0 28px rgba(253, 224, 71, 0.75))
        drop-shadow(0 28px 36px rgba(0, 0, 0, 0.92));
    }

    /* Luxury Domino Tile Body */
    .domino-tile {
      width: 100%;
      height: 100%;
      border-radius: clamp(18px, 2.2vw, 28px);
      background: linear-gradient(145deg, #2b131d 0%, #14070d 50%, #240f18 100%);
      border: 4px solid #f3cf7a;
      box-shadow:
        inset 0 0 0 3px #784f12,
        inset 0 4px 12px rgba(255, 243, 196, 0.4),
        inset 0 -6px 16px rgba(0, 0, 0, 0.9);
      display: grid;
      grid-template-columns: 1fr 14px 1fr;
      align-items: center;
      padding: clamp(7px, 0.9vw, 12px);
      position: relative;
    }

    /* Corner Brass Rivets on Domino */
    .domino-stud {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fffbeb, #d97706 70%, #451a03 100%);
      z-index: 5;
    }
    .stud-tl { top: 7px; left: 7px; }
    .stud-tr { top: 7px; right: 7px; }
    .stud-bl { bottom: 7px; left: 7px; }
    .stud-br { bottom: 7px; right: 7px; }

    /* Domino Halves: Distinct Ruby-Gold vs Sapphire-Turquoise Filigree Trim */
    .domino-half {
      width: 100%;
      height: 100%;
      border-radius: clamp(12px, 1.5vw, 20px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 9%;
      place-items: center;
      position: relative;
      transition: box-shadow 0.35s ease;
    }

    /* Half A: Warm Ruby-Amber Royal Velvet Well */
    .domino-half.half-warm {
      background: radial-gradient(circle at 50% 50%, #3b1022 0%, #210712 72%, #120309 100%);
      border: 2.5px solid #fb7185;
      box-shadow:
        inset 0 0 0 2px rgba(251, 191, 36, 0.4),
        inset 0 5px 14px rgba(0, 0, 0, 0.9);
    }

    /* Half B: Cool Sapphire-Turquoise Royal Velvet Well */
    .domino-half.half-cool {
      background: radial-gradient(circle at 50% 50%, #0c2b3d 0%, #071926 72%, #030d14 100%);
      border: 2.5px solid #38bdf8;
      box-shadow:
        inset 0 0 0 2px rgba(52, 211, 153, 0.4),
        inset 0 5px 14px rgba(0, 0, 0, 0.9);
    }

    /* Center Brass Pivot Bar & Axis Jewel */
    .domino-divider {
      width: 9px;
      height: 88%;
      margin: 0 auto;
      border-radius: 999px;
      background: linear-gradient(180deg, #784f12 0%, #fef08a 50%, #784f12 100%);
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .domino-center-pin {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef9c3, #f59e0b 55%, #78350f 100%);
      border: 2px solid #ffffff;
      box-shadow: 0 0 12px rgba(251, 191, 36, 1);
      flex-shrink: 0;
    }

    /* 3D Recessed Jewel Pips (Dots) */
    .pip-gem {
      width: clamp(18px, 2.3vw, 31px);
      height: clamp(18px, 2.3vw, 31px);
      border-radius: 50%;
      position: relative;
      transform: scale(0);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
    }
    .pip-gem.visible {
      transform: scale(1);
    }
    .pip-gem::after {
      content: '';
      position: absolute;
      top: 15%;
      left: 18%;
      width: 35%;
      height: 35%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
    }

    /* Spotlight Halo Flash on Each Pip before & after Rotation */
    .pip-gem.pip-halo-flash {
      transform: scale(1.36) !important;
      filter: brightness(1.45) drop-shadow(0 0 16px #ffffff) drop-shadow(0 0 26px #fde047);
      z-index: 10;
    }

    /* Replay 180° Rotation Button on Turntable Rim (Appears in Row 2) */
    .replay-turn-btn {
      position: absolute;
      bottom: -2%;
      right: 4%;
      width: clamp(48px, 4.6vw, 62px);
      height: clamp(48px, 4.6vw, 62px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fef08a 0%, #d97706 60%, #78350f 100%);
      border: 3px solid #fef9c3;
      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.8),
        0 0 18px rgba(251, 191, 36, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 35;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.7);
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .replay-turn-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }
    .replay-turn-btn:hover {
      transform: scale(1.12) rotate(-18deg);
      filter: brightness(1.15);
    }
    .replay-turn-btn:active {
      transform: scale(0.95);
    }

    /* =================================================================
       RIGHT STAGE: MAHOGANY & GOLD COMMUTATIVE EQUATION BOARD
       ================================================================= */
    .commutative-board-cabinet {
      position: relative;
      width: 100%;
      max-width: 680px;
      justify-self: center;
      padding: clamp(16px, 2.5vh, 28px) clamp(18px, 2.4vw, 34px);
      border-radius: 30px;
      background:
        linear-gradient(160deg, #38120c 0%, #1f0805 52%, #2c0d08 100%);
      border: 4px solid #d4af37;
      box-shadow:
        0 20px 42px rgba(0, 0, 0, 0.85),
        inset 0 0 0 3px #6b4c1b,
        inset 0 0 32px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    .equation-row {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.3vw, 18px);
      padding: clamp(10px, 1.6vh, 18px) clamp(12px, 1.8vw, 24px);
      border-radius: 22px;
      background: linear-gradient(180deg, #1a0b12 0%, #0e0509 100%);
      border: 3px solid #9a7022;
      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.7),
        inset 0 0 18px rgba(212, 175, 55, 0.12);
      transition: all 0.4s ease;
      z-index: 5;
    }

    .equation-row.row-solved {
      border-color: #fde047;
      box-shadow:
        0 0 26px rgba(250, 204, 21, 0.45),
        inset 0 0 22px rgba(250, 204, 21, 0.22);
    }

    /* Ornate Golden Mechanical Shutter over Row 2 before Rotation */
    .row-shutter-cover {
      position: absolute;
      inset: -3px;
      border-radius: 22px;
      background:
        repeating-linear-gradient(
          135deg,
          #3b160d 0px,
          #3b160d 14px,
          #280d07 14px,
          #280d07 28px
        );
      border: 3px solid #c89b3c;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 15;
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .equation-row.shutter-open .row-shutter-cover {
      opacity: 0;
      transform: scale(0.92);
      pointer-events: none;
    }

    /* Crossover Commutative Bridge (X-Tracks between Row 1 and Row 2) */
    .crossover-bridge {
      width: 100%;
      height: clamp(54px, 8.5vh, 88px);
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .crossover-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .track-glow-line {
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
      transition: stroke-dashoffset 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .crossover-bridge.bridge-active .track-glow-line {
      stroke-dashoffset: 0;
    }

    /* Number Slots inside Equation Rows */
    .math-slot {
      width: clamp(62px, 7.2vw, 98px);
      height: clamp(62px, 7.2vw, 98px);
      border-radius: 18px;
      background: radial-gradient(circle at 50% 35%, #2e101c 0%, #16050c 75%, #0c0206 100%);
      border: 3.5px solid #8c6520;
      box-shadow:
        inset 0 5px 12px rgba(0, 0, 0, 0.9),
        0 3px 6px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel Decorative', 'Montserrat', serif;
      font-weight: 900;
      font-size: clamp(26px, 3.3vw, 46px);
      color: #fef08a;
      text-shadow: 0 0 14px rgba(250, 204, 21, 0.75), 0 3px 4px rgba(0, 0, 0, 0.9);
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    /* Color-Coded Subtle Inner Rim matching Domino Halves (Warm vs Cool) */
    .math-slot.slot-warm-hint::before {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 12px;
      border: 2px solid rgba(251, 113, 133, 0.42);
      pointer-events: none;
    }
    .math-slot.slot-cool-hint::before {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 12px;
      border: 2px solid rgba(56, 189, 248, 0.42);
      pointer-events: none;
    }
    .math-slot.slot-sum-hint::before {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 12px;
      border: 2px solid rgba(250, 204, 21, 0.38);
      pointer-events: none;
    }

    @keyframes slotPulseGlow {
      0%, 100% {
        border-color: #fde047;
        box-shadow:
          0 0 16px rgba(250, 204, 21, 0.8),
          inset 0 0 14px rgba(250, 204, 21, 0.3);
        transform: translateY(-2px) scale(1.04);
      }
      50% {
        border-color: #f59e0b;
        box-shadow:
          0 0 28px rgba(254, 240, 138, 1),
          inset 0 0 22px rgba(250, 204, 21, 0.5);
        transform: translateY(-4px) scale(1.07);
      }
    }

    .math-slot.active-slot {
      animation: slotPulseGlow 1.3s ease-in-out infinite;
    }

    .math-slot.slot-correct {
      background: radial-gradient(circle at 50% 35%, #065f46 0%, #064e3b 75%, #022c22 100%);
      border-color: #6ee7b7;
      color: #ecfdf5;
      text-shadow: 0 0 16px rgba(110, 231, 183, 0.9), 0 2px 4px rgba(0, 0, 0, 0.8);
      box-shadow:
        0 0 16px rgba(16, 185, 129, 0.6),
        inset 0 0 14px rgba(52, 211, 153, 0.35);
    }

    @keyframes wrongSlotShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px) rotate(-3deg); }
      40% { transform: translateX(10px) rotate(3deg); }
      60% { transform: translateX(-7px) rotate(-2deg); }
      80% { transform: translateX(7px) rotate(2deg); }
    }
    .math-slot.slot-wrong {
      animation: wrongSlotShake 0.44s ease;
      border-color: #fb7185 !important;
      background: radial-gradient(circle at 50% 35%, #881337 0%, #4c0519 85%) !important;
      box-shadow: 0 0 24px rgba(244, 63, 94, 0.95) !important;
    }

    .math-symbol {
      width: clamp(28px, 3.2vw, 44px);
      height: clamp(28px, 3.2vw, 44px);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.75));
      flex-shrink: 0;
    }

    /* =================================================================
       BOTTOM DOCK: CASINO CHIPS (0 - 12 + Backspace/Clear Chip)
       ================================================================= */
    .chip-rack-wrapper {
      position: relative;
      z-index: 25;
      width: 95vw;
      max-width: 1380px;
      padding: clamp(7px, 1.2vh, 13px) clamp(10px, 1.8vw, 22px);
      border-radius: 26px;
      background: linear-gradient(180deg, #32110b 0%, #180603 100%);
      border: 3px solid #c89b3c;
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.85),
        inset 0 3px 10px rgba(255, 215, 0, 0.22),
        inset 0 -4px 12px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: clamp(4px, 0.75vw, 12px);
    }

    .casino-chip-btn {
      position: relative;
      width: clamp(42px, 5.4vw, 72px);
      height: clamp(42px, 5.4vw, 72px);
      border-radius: 50%;
      border: none;
      padding: 0;
      background: transparent;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.7));
      flex-shrink: 1;
    }
    .casino-chip-btn:hover {
      transform: translateY(-7px) scale(1.1);
      filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.85)) brightness(1.12);
    }
    .casino-chip-btn:active {
      transform: translateY(1px) scale(0.94);
    }

    /* Corner Utility Buttons (Sound & Next) */
    .corner-dealer-btn {
      position: absolute;
      top: clamp(16px, 2.6vh, 28px);
      width: clamp(48px, 4.8vw, 64px);
      height: clamp(48px, 4.8vw, 64px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fef08a 0%, #d97706 55%, #78350f 100%);
      border: 3px solid #fef9c3;
      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.75),
        inset 0 2px 6px rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 45;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
    }
    .corner-dealer-btn:hover {
      transform: scale(1.1) rotate(6deg);
      filter: brightness(1.12) drop-shadow(0 0 12px rgba(253, 224, 71, 0.8));
    }
    .corner-dealer-btn:active {
      transform: scale(0.94);
    }
    .btn-left { left: clamp(18px, 2.4vw, 34px); }
    .btn-right { right: clamp(18px, 2.4vw, 34px); }

    /* Fullscreen Canvas for Trajectory Trails, Beams & Celebrations */
    #fxCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 32;
    }

    @media (max-width: 900px) {
      .main-stage-grid {
        grid-template-columns: 1fr;
        gap: 1vh;
      }
      .turntable-assembly {
        width: min(40vh, 72vw);
        height: min(40vh, 72vw);
      }
      .chip-rack-wrapper {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="casino-viewport" id="casinoViewport">
    <!-- Outer Mahogany & Brass Rail -->
    <div class="mahogany-rail"></div>
    <div class="felt-filigree"></div>

    <!-- Ambient Emerald Felt Filigree SVG Background -->
    <svg class="absolute inset-0 w-full h-full pointer-events-none z-[3]" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fef08a" />
          <stop offset="50%" stop-color="#d97706" />
          <stop offset="100%" stop-color="#78350f" />
        </linearGradient>
        <linearGradient id="warmTrackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fb7185" />
          <stop offset="100%" stop-color="#fde047" />
        </linearGradient>
        <linearGradient id="coolTrackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="100%" stop-color="#34d399" />
        </linearGradient>
      </defs>

      <!-- Subtle Casino Felt Table Arcs -->
      <path d="M 140 900 A 680 480 0 0 1 1460 900" fill="none" stroke="rgba(212,175,55,0.12)" stroke-width="3" stroke-dasharray="16 12" />

  <script>
    /********************************************************************
     * 1. PROCEDURAL WEB AUDIO ENGINE
     *    - Crystal dot chimes, 10-degree roulette ratchet ticks, heavy
     *      brass latch lock, low bass error thud, and 4 grand fanfares
     ********************************************************************/
    class CasinoAudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }

      // Ceramic Casino Chip Tap
      playChipClick(pitchOffset = 0) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        const baseFreq = 900 + pitchOffset * 32;
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.6, now + 0.06);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }

      // Crystal Halo Chime when highlighting dots before/after rotation
      playDotCrystalChime(index = 0, total = 6) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const pentatonic = [587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.5, 1567.98];
        const freq = pentatonic[index % pentatonic.length];
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.02, now + 0.28);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.32);
      }

      // Mechanical Roulette Gear Tick (Triggered every 10 degrees of rotation!)
      playRatchetTick(progress0to1 = 0) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        // Pitch rises slightly in the middle of the turn and settles as it slows down
        const pitch = 420 + Math.sin(progress0to1 * Math.PI) * 260;
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.038);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200, now);

        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.042);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.046);
      }

      // Heavy Brass Latch Lock + Harmonic Chord at exactly 180 degrees
      playTurntableLock180() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;

        // 1. Metallic Brass Latch Click
        const clack = this.ctx.createOscillator();
        const clackGain = this.ctx.createGain();
        clack.type = 'square';
        clack.frequency.setValueAtTime(220, now);
        clack.frequency.exponentialRampToValueAtTime(65, now + 0.09);
        clackGain.gain.setValueAtTime(0.28, now);
        clackGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        clack.connect(clackGain);
        clackGain.connect(this.ctx.destination);
        clack.start(now);
        clack.stop(now + 0.11);

        // 2. Bright Golden Resolution Chord
        const chord = [523.25, 659.25, 783.99, 1046.5];
        chord.forEach((freq, i) => {
          const start = now + 0.06 + i * 0.04;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.18, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.55);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(start);
          osc.stop(start + 0.56);
        });
      }

      // Slot Correct Chime
      playSlotCorrect(stepIndex = 0) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const notes = [523.25, 659.25, 783.99, 1046.5];
        const freq = notes[stepIndex % notes.length];
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.34);
      }

      // Soft Low Bass Thud on Wrong Slot
      playWrongThud() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.linearRampToValueAtTime(72, now + 0.28);

        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.32);
      }

      // Row 1 Solved Chord
      playRowSolved() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const chord = [523.25, 659.25, 783.99, 987.77, 1046.5];
        chord.forEach((freq, i) => {
          const now = this.ctx.currentTime + i * 0.055;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.52);
        });
      }

      // 4 Distinct Grand Celebration Audio Fanfares
      playGrandCelebration(variant = 0) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const scales = [
          [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98, 2093.0],
          [587.33, 739.99, 880.0, 1174.66, 1479.98, 1760.0, 2349.32],
          [440.0, 554.37, 659.25, 880.0, 1108.73, 1318.51, 1760.0],
          [493.88, 622.25, 739.99, 987.77, 1244.51, 1479.98, 1975.53]
        ];
        const notes = scales[variant % scales.length];

        notes.forEach((freq, idx) => {
          const start = this.ctx.currentTime + idx * 0.08;
          const osc = this.ctx.createOscillator();
          const sub = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          sub.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);
          sub.frequency.setValueAtTime(freq * 0.5, start);

          gain.gain.setValueAtTime(0.22, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.85);

          osc.connect(gain);
          sub.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(start);
          sub.start(start);
          osc.stop(start + 0.88);
          sub.stop(start + 0.88);
        });
      }
    }

    const sound = new CasinoAudioEngine();

    /********************************************************************
     * 2. DOMINO PIP LAYOUTS & WARM/COOL HALF STYLING
     ********************************************************************/
    const PIP_PATTERNS = {
      0: [],
      1: [4],
      2: [0, 8],
      3: [0, 4, 8],
      4: [0, 2, 6, 8],
      5: [0, 2, 4, 6, 8],
      6: [0, 2, 3, 5, 6, 8]
    };

    // Half A (Warm Ruby-Gold Pips) vs Half B (Cool Sapphire-Turquoise Pips)
    // so children can clearly track every single dot along its 180° arc!
    const WARM_PIP_GRAD = 'radial-gradient(circle at 35% 35%, #fef08a, #fb7185 52%, #be123c 88%, #4c0519 100%)';
    const WARM_PIP_SHADOW = '0 0 12px rgba(251, 113, 133, 0.95), inset 0 -2px 4px rgba(0,0,0,0.65)';

    const COOL_PIP_GRAD = 'radial-gradient(circle at 35% 35%, #e0f2fe, #38bdf8 52%, #0284c7 88%, #082f49 100%)';
    const COOL_PIP_SHADOW = '0 0 12px rgba(56, 189, 248, 0.95), inset 0 -2px 4px rgba(0,0,0,0.65)';

    function renderDominoHalf(container, value, isWarmHalf) {
      container.innerHTML = '';
      const activeIndices = PIP_PATTERNS[value] || [];
      for (let i = 0; i < 9; i++) {
        const pip = document.createElement('div');
        pip.className = 'pip-gem';
        if (activeIndices.includes(i)) {
          pip.dataset.activePip = 'true';
          pip.dataset.halfType = isWarmHalf ? 'warm' : 'cool';
          pip.style.background = isWarmHalf ? WARM_PIP_GRAD : COOL_PIP_GRAD;
          pip.style.boxShadow = isWarmHalf ? WARM_PIP_SHADOW : COOL_PIP_SHADOW;
          pip.style.border = '2px solid rgba(255, 255, 255, 0.78)';
          requestAnimationFrame(() => {
            pip.classList.add('visible');
          });
        }
        container.appendChild(pip);
      }
    }

    /********************************************************************
     * 3. BOTTOM CASINO CHIP RACK (0 - 12 + Clear/Backspace Chip)
     ********************************************************************/
    const CHIP_PALETTES = [
      { main: '#334155', rim: '#94a3b8', accent: '#f8fafc' }, // 0
      { main: '#be123c', rim: '#fda4af', accent: '#ffe4e6' }, // 1
      { main: '#1d4ed8', rim: '#93c5fd', accent: '#dbeafe' }, // 2
      { main: '#047857', rim: '#6ee7b7', accent: '#d1fae5' }, // 3
      { main: '#b45309', rim: '#fde047', accent: '#fef9c3' }, // 4
      { main: '#6d28d9', rim: '#d8b4fe', accent: '#f3e8ff' }, // 5
      { main: '#0e7490', rim: '#67e8f9', accent: '#cffafe' }, // 6
      { main: '#9d174d', rim: '#f9a8d4', accent: '#fce7f3' }, // 7
      { main: '#3f6212', rim: '#bef264', accent: '#ecfccb' }, // 8
      { main: '#c2410c', rim: '#fdba74', accent: '#ffedd5' }, // 9
      { main: '#4338ca', rim: '#a5b4fc', accent: '#e0e7ff' }, // 10
      { main: '#0f766e', rim: '#5eead4', accent: '#ccfbf1' }, // 11
      { main: '#854d0e', rim: '#fef08a', accent: '#ffffff' }  // 12
    ];

    function buildCasinoChipRack() {
      const rack = document.getElementById('chipRack');
      rack.innerHTML = '';

      for (let num = 0; num <= 12; num++) {
        const pal = CHIP_PALETTES[num];
        const btn = document.createElement('button');
        btn.className = 'casino-chip-btn';
        btn.dataset.val = num;
        btn.setAttribute('aria-label', String(num));

        btn.innerHTML = `
          <svg viewBox="0 0 100 100" class="w-full h-full">
            <circle cx="50" cy="50" r="46" fill="${pal.main}" stroke="#fde047" stroke-width="3" />
            <circle cx="50" cy="50" r="41" fill="none" stroke="${pal.rim}" stroke-width="7" stroke-dasharray="14 28.9" />
            <circle cx="50" cy="50" r="32" fill="${pal.main}" stroke="#fde047" stroke-width="2.2" />
            <circle cx="50" cy="50" r="27" fill="none" stroke="${pal.accent}" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.75" />
            <text x="50" y="53" text-anchor="middle" dominant-baseline="central"
                  fill="#fffbeb" font-family="'Montserrat', sans-serif" font-weight="900"
                  font-size="${num >= 10 ? '27' : '31'}"
                  style="filter: drop-shadow(0 2px 3px rgba(0,0,0,0.85));">
              ${num}
            </text>
          </svg>
        `;

        btn.addEventListener('click', () => handleNumberInput(num, true));
        rack.appendChild(btn);
      }

      // Add Backspace / Clear Undo Casino Chip at the end of the rack
      const clearBtn = document.createElement('button');
      clearBtn.className = 'casino-chip-btn';
      clearBtn.setAttribute('aria-label', 'Clear Slot');
      clearBtn.innerHTML = `
        <svg viewBox="0 0 100 100" class="w-full h-full">
          <circle cx="50" cy="50" r="46" fill="#4c0519" stroke="#fda4af" stroke-width="3" />
          <circle cx="50" cy="50" r="41" fill="none" stroke="#fb7185" stroke-width="7" stroke-dasharray="14 28.9" />
          <circle cx="50" cy="50" r="32" fill="#881337" stroke="#fde047" stroke-width="2.2" />
          <path d="M62 38 L42 38 L30 50 L42 62 L62 62 Z" fill="none" stroke="#fff1f2" stroke-width="3.5" stroke-linejoin="round" />
          <line x1="46" y1="45" x2="56" y2="55" stroke="#fff1f2" stroke-width="3.5" stroke-linecap="round" />
          <line x1="56" y1="45" x2="46" y2="55" stroke="#fff1f2" stroke-width="3.5" stroke-linecap="round" />
        </svg>
      `;
      clearBtn.addEventListener('click', () => clearActiveSlot());
      rack.appendChild(clearBtn);
    }

    /********************************************************************
     * 4. CANVAS ENGINE: PERSISTENT DOT TRAJECTORY TRAILS & CELEBRATIONS
     ********************************************************************/
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    let cw = window.innerWidth;
    let ch = window.innerHeight;

    function resizeCanvas() {
      cw = window.innerWidth;
      ch = window.innerHeight;
      canvas.width = cw;
      canvas.height = ch;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Ambient floating golden dust
    const ambientDust = Array.from({ length: 38 }, () => ({
      x: Math.random() * cw,
      y: Math.random() * ch,
      r: 1.2 + Math.random() * 2.2,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -0.2 - Math.random() * 0.4,
      alpha: 0.2 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2
    }));

    // Persistent Dot Orbit Trails recorded frame-by-frame during 180° Rotation!
    // Map of pipIndex -> { halfType: 'warm'|'cool', points: [{x, y}], alpha: 1.0, fading: false }
    let pipOrbitTrails = [];
    let activeParticles = [];
    let activeSpotlights = [];
    let connectorBeams = [];

    function resetPipOrbitTrails() {
      const pipEls = document.querySelectorAll('.pip-gem[data-active-pip="true"]');
      pipOrbitTrails = Array.from(pipEls).map((el) => ({
        el,
        halfType: el.dataset.halfType,
        points: [],
        alpha: 1.0,
        fading: false
      }));
    }

    function samplePipOrbitPositions() {
      for (const trail of pipOrbitTrails) {
        const rect = trail.el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        trail.points.push({ x: cx, y: cy });
      }
    }

    function fadeOutPipOrbitTrails() {
      for (const trail of pipOrbitTrails) {
        trail.fading = true;
      }
    }

    function spawnSlotSparkles(element, color = '#fde047', count = 20) {
      if (!element) return;
      const rect = element.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.3;
        const speed = 2.2 + Math.random() * 6.0;
        activeParticles.push({
          type: 'star',
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.2,
          gravity: 0.1,
          size: 5 + Math.random() * 6,
          color: i % 2 === 0 ? color : '#fffbeb',
          rotation: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.2,
          life: 1,
          decay: 0.022 + Math.random() * 0.015
        });
      }
    }

    // Visual Energy Beams from Rotated Domino Halves to Row 2 Slots
    function spawnDominoToRow2Beams() {
      const leftHalfEl = document.getElementById('dominoLeftHalf');   // Warm Half A (now physically on the RIGHT after 180°!)
      const rightHalfEl = document.getElementById('dominoRightHalf'); // Cool Half B (now physically on the LEFT after 180°!)

      const warmRect = leftHalfEl.getBoundingClientRect();
      const coolRect = rightHalfEl.getBoundingClientRect();

      const slot10Rect = document.getElementById('slot-1-0').getBoundingClientRect(); // First addend in Row 2 (Cool B)
      const slot11Rect = document.getElementById('slot-1-1').getBoundingClientRect(); // Second addend in Row 2 (Warm A)

      connectorBeams.push({
        x1: coolRect.left + coolRect.width / 2,
        y1: coolRect.top + coolRect.height / 2,
        x2: slot10Rect.left + slot10Rect.width / 2,
        y2: slot10Rect.top + slot10Rect.height / 2,
        color: '#38bdf8',
        life: 1.0
      });

      connectorBeams.push({
        x1: warmRect.left + warmRect.width / 2,
        y1: warmRect.top + warmRect.height / 2,
        x2: slot11Rect.left + slot11Rect.width / 2,
        y2: slot11Rect.top + slot11Rect.height / 2,
        color: '#fb7185',
        life: 1.0
      });
    }

    // 4 Distinct Non-Verbal Grand Celebrations
    let celebrationCounter = 0;
    function triggerGrandCelebration() {
      const mode = celebrationCounter % 4;
      celebrationCounter++;
      sound.playGrandCelebration(mode);

      if (mode === 0) {
        // 1) Golden Chip Volcano & Fountain
        for (let i = 0; i < 68; i++) {
          const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.15;
          const speed = 11 + Math.random() * 13;
          const palette = CHIP_PALETTES[Math.floor(Math.random() * CHIP_PALETTES.length)];
          activeParticles.push({
            type: 'chip',
            x: cw * (0.2 + Math.random() * 0.6),
            y: ch + 20,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 0.34,
            size: 15 + Math.random() * 12,
            color: palette.main,
            rim: palette.rim,
            rotation: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.25,
            life: 1,
            decay: 0.008 + Math.random() * 0.005
          });
        }
      } else if (mode === 1) {
        // 2) Royal Roulette Jackpot Lightshow & Fireworks
        activeSpotlights.push(
          { x: cw * 0.22, angle: 0.32, vAngle: 0.024, color: 'rgba(253, 224, 71, 0.24)', life: 1 },
          { x: cw * 0.78, angle: -0.32, vAngle: -0.024, color: 'rgba(56, 189, 248, 0.24)', life: 1 }
        );
        for (let b = 0; b < 5; b++) {
          setTimeout(() => {
            const bx = cw * (0.18 + Math.random() * 0.64);
            const by = ch * (0.18 + Math.random() * 0.45);
            const colors = ['#fde047', '#34d399', '#fb7185', '#38bdf8', '#c084fc'];
            const col = colors[b % colors.length];
            for (let i = 0; i < 32; i++) {
              const ang = (Math.PI * 2 * i) / 32;
              const spd = 3 + Math.random() * 7;
              activeParticles.push({
                type: 'star',
                x: bx,
                y: by,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd,
                gravity: 0.08,
                size: 7 + Math.random() * 6,
                color: col,
                rotation: ang,
                vRot: 0.12,
                life: 1,
                decay: 0.014
              });
            }
          }, b * 240);
        }
      } else if (mode === 2) {
        // 3) Jewel & Diamond Rain
        const gemColors = ['#fb7185', '#34d399', '#38bdf8', '#fde047', '#c084fc'];
        for (let i = 0; i < 72; i++) {
          activeParticles.push({
            type: 'gem',
            x: Math.random() * cw,
            y: -30 - Math.random() * 240,
            vx: (Math.random() - 0.5) * 3,
            vy: 3.5 + Math.random() * 5.5,
            gravity: 0.08,
            size: 12 + Math.random() * 10,
            color: gemColors[i % gemColors.length],
            rotation: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.18,
            life: 1,
            decay: 0.008
          });
        }
      } else {
        // 4) Velvet Card Suit & Golden Star Spiral Vortex
        const suits = ['spade', 'heart', 'diamond', 'club'];
        for (let i = 0; i < 58; i++) {
          const angle = i * 0.34;
          const speed = 3 + (i % 7) * 1.4;
          activeParticles.push({
            type: 'suit',
            suit: suits[i % 4],
            x: cw / 2,
            y: ch / 2,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 0.04,
            size: 14 + (i % 3) * 5,
            color: i % 2 === 0 ? '#fde047' : '#fb7185',
            rotation: angle,
            vRot: (Math.random() - 0.5) * 0.1,
            life: 1,
            decay: 0.01
          });
        }
      }
    }

    function drawStar(ctx, r) {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a1 = (i * 2 * Math.PI) / 5 - Math.PI / 2;
        const a2 = a1 + Math.PI / 5;
        ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
        ctx.lineTo(Math.cos(a2) * (r * 0.42), Math.sin(a2) * (r * 0.42));
      }
      ctx.closePath();
      ctx.fill();
    }

    function drawGem(ctx, r) {
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.lineTo(r * 0.85, 0);
      ctx.lineTo(0, r);
      ctx.lineTo(-r * 0.85, 0);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    function drawSuitShape(ctx, suit, r) {
      ctx.beginPath();
      if (suit === 'diamond') {
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.8, 0);
        ctx.lineTo(0, r);
        ctx.lineTo(-r * 0.8, 0);
      } else if (suit === 'heart') {
        ctx.arc(-r * 0.35, -r * 0.25, r * 0.45, Math.PI, 0, false);
        ctx.arc(r * 0.35, -r * 0.25, r * 0.45, Math.PI, 0, false);
        ctx.lineTo(0, r * 0.9);
      } else {
        ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2);
      }
      ctx.closePath();
      ctx.fill();
    }

    function animateCanvas() {
      ctx.clearRect(0, 0, cw, ch);

      // 1. Ambient Floating Gold Dust
      for (const d of ambientDust) {
        d.x += d.vx;
        d.y += d.vy;
        d.phase += 0.03;
        if (d.y < -10) d.y = ch + 10;
        if (d.x < -10) d.x = cw + 10;
        if (d.x > cw + 10) d.x = -10;

        ctx.save();
        ctx.globalAlpha = d.alpha * (0.6 + 0.4 * Math.sin(d.phase));
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 2. Persistent Semicircular Dot Orbit Trails (Drawn during & right after 180° rotation)
      for (let i = pipOrbitTrails.length - 1; i >= 0; i--) {
        const trail = pipOrbitTrails[i];
        if (trail.fading) {
          trail.alpha -= 0.018;
          if (trail.alpha <= 0) {
            pipOrbitTrails.splice(i, 1);
            continue;
          }
        }
        if (trail.points.length < 2) continue;

        ctx.save();
        ctx.globalAlpha = Math.max(0, trail.alpha);
        const isWarm = trail.halfType === 'warm';
        const strokeCol = isWarm ? '#fb7185' : '#38bdf8';
        const glowCol = isWarm ? '#fde047' : '#34d399';

        ctx.strokeStyle = strokeCol;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = glowCol;
        ctx.shadowBlur = 14;

        ctx.beginPath();
        ctx.moveTo(trail.points[0].x, trail.points[0].y);
        for (let p = 1; p < trail.points.length; p++) {
          ctx.lineTo(trail.points[p].x, trail.points[p].y);
        }
        ctx.stroke();

        // Draw origin dot marker & current head halo
        const startPt = trail.points[0];
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(startPt.x, startPt.y, 4, 0, Math.PI * 2);
        ctx.fill();

        const endPt = trail.points[trail.points.length - 1];
        ctx.fillStyle = glowCol;
        ctx.beginPath();
        ctx.arc(endPt.x, endPt.y, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // 3. Sweeping Spotlights
      for (let i = activeSpotlights.length - 1; i >= 0; i--) {
        const sp = activeSpotlights[i];
        sp.angle += sp.vAngle;
        if (Math.abs(sp.angle) > 0.65) sp.vAngle *= -1;
        sp.life -= 0.008;
        if (sp.life <= 0) {
          activeSpotlights.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = sp.life;
        ctx.translate(sp.x, ch + 20);
        ctx.rotate(sp.angle);
        const grad = ctx.createLinearGradient(0, 0, 0, -ch * 1.2);
        grad.addColorStop(0, sp.color);
        grad.addColorStop(1, 'rgba(253, 224, 71, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(-25, 0);
        ctx.lineTo(-220, -ch * 1.2);
        ctx.lineTo(220, -ch * 1.2);
        ctx.lineTo(25, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // 4. Post-Rotation Connector Beams from Domino Halves to Row 2
      for (let i = connectorBeams.length - 1; i >= 0; i--) {
        const b = connectorBeams[i];
        b.life -= 0.016;
        if (b.life <= 0) {
          connectorBeams.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = b.life;
        ctx.strokeStyle = b.color;
        ctx.lineWidth = 6 * b.life;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.moveTo(b.x1, b.y1);
        ctx.lineTo(b.x2, b.y2);
        ctx.stroke();
        ctx.restore();
      }

      // 5. Celebration & Sparkle Particles
      for (let i = activeParticles.length - 1; i >= 0; i--) {
        const p = activeParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rotation += p.vRot;
        p.life -= p.decay;

        if (p.life <= 0) {
          activeParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);

        if (p.type === 'star') {
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          drawStar(ctx, p.size);
        } else if (p.type === 'chip') {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(0, 0, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = p.rim;
          ctx.lineWidth = 3;
          ctx.setLineDash([5, 5]);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.strokeStyle = '#fde047';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.65, 0, Math.PI * 2);
          ctx.stroke();
        } else if (p.type === 'gem') {
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 10;
          drawGem(ctx, p.size);
        } else if (p.type === 'suit') {
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          drawSuitShape(ctx, p.suit, p.size);
        }

        ctx.restore();
      }

      requestAnimationFrame(animateCanvas);
    }

    /********************************************************************
     * 5. GAME STATE & ACCENTUATED 3-STEP ROTATION CHOREOGRAPHY
     ********************************************************************/
    const state = {
      taskId: 0,
      a: 2,
      b: 5,
      sum: 7,
      phase: 'ROW1', // 'ROW1' -> 'WAIT_FLIP' -> 'ROTATING' -> 'ROW2' -> 'CELEBRATING'
      activeRow: 0,
      activeCol: 0,
      pendingDigit: '',
      pendingTimer: null,
      currentDeg: 0,
      solved: [
        [false, false, false],
        [false, false, false]
      ]
    };

    function getExpectedValue(row, col) {
      if (row === 0) {
        if (col === 0) return state.a;
        if (col === 1) return state.b;
        return state.sum;
      } else {
        if (col === 0) return state.b;
        if (col === 1) return state.a;
        return state.sum;
      }
    }

    function setTurntableAngle(deg, scale = 1) {
      state.currentDeg = deg;
      const dominoRotator = document.getElementById('dominoRotator');
      const wheelRotor = document.getElementById('turntableRotorWheel');
      dominoRotator.style.transform = `rotate(${deg}deg) scale(${scale})`;
      wheelRotor.style.transform = `rotate(${deg}deg)`;
    }

    function generateNewTask() {
      state.taskId++;
      if (state.pendingTimer) {
        clearTimeout(state.pendingTimer);
        state.pendingTimer = null;
      }

      // Generate two unequal halves (A != B)
      let nextA, nextB;
      do {
        const allowZero = Math.random() < 0.16;
        const minPip = allowZero ? 0 : 1;
        nextA = minPip + Math.floor(Math.random() * (7 - minPip));
        nextB = minPip + Math.floor(Math.random() * (7 - minPip));
      } while (
        nextA === nextB ||
        (nextA === state.a && nextB === state.b) ||
        (nextA === state.b && nextB === state.a)
      );

      state.a = nextA;
      state.b = nextB;
      state.sum = nextA + nextB;
      state.phase = 'ROW1';
      state.activeRow = 0;
      state.activeCol = 0;
      state.pendingDigit = '';
      state.solved = [
        [false, false, false],
        [false, false, false]
      ];

      // Clear overlays & trails
      pipOrbitTrails = [];
      document.getElementById('spotlightOverlay').classList.remove('active');
      document.getElementById('turntableAssembly').classList.remove('awaiting-flip');
      document.getElementById('dominoRotator').classList.remove('elevated-rotating');
      document.getElementById('replayTurnBtn').classList.remove('visible');
      document.getElementById('crossoverBridge').classList.remove('bridge-active');

      // Reset Turntable & Domino to 0 deg
      setTurntableAngle(0, 1);
      renderDominoHalf(document.getElementById('dominoLeftHalf'), state.a, true);
      renderDominoHalf(document.getElementById('dominoRightHalf'), state.b, false);

      // Reset Equation Rows
      const row0 = document.getElementById('eqRow0');
      const row1 = document.getElementById('eqRow1');
      row0.classList.remove('row-solved');
      row1.classList.remove('row-solved', 'shutter-open');

      for (let r = 0; r < 2; r++) {
        for (let c = 0; c < 3; c++) {
          const slot = document.getElementById(`slot-${r}-${c}`);
          slot.textContent = '';
          slot.classList.remove('slot-correct', 'slot-wrong', 'active-slot');
        }
      }

      updateActiveSlotHighlight();
    }

    function updateActiveSlotHighlight() {
      for (let r = 0; r < 2; r++) {
        for (let c = 0; c < 3; c++) {
          const slot = document.getElementById(`slot-${r}-${c}`);
          slot.classList.remove('active-slot');
        }
      }

      if (state.phase === 'ROW1' || state.phase === 'ROW2') {
        const activeSlot = document.getElementById(`slot-${state.activeRow}-${state.activeCol}`);
        if (activeSlot && !state.solved[state.activeRow][state.activeCol]) {
          activeSlot.classList.add('active-slot');
        }
      }
    }

    function advanceToNextUnsolvedSlot(row) {
      for (let c = 0; c < 3; c++) {
        if (!state.solved[row][c]) {
          state.activeCol = c;
          updateActiveSlotHighlight();
          return;
        }
      }

      if (row === 0) {
        completeRow1();
      } else {
        completeRow2();
      }
    }

    function completeRow1() {
      state.phase = 'WAIT_FLIP';
      updateActiveSlotHighlight();

      const row0 = document.getElementById('eqRow0');
      row0.classList.add('row-solved');
      sound.playRowSolved();

      for (let c = 0; c < 3; c++) {
        spawnSlotSparkles(document.getElementById(`slot-0-${c}`), '#fde047', 16);
      }

      // Highlight the Turntable & Domino inviting the child to click & rotate!
      document.getElementById('turntableAssembly').classList.add('awaiting-flip');
    }

    // Flash every active dot on the domino with a crystal halo so the child sees them clearly
    function flashAllDominoDots(durationMs = 550) {
      const pips = document.querySelectorAll('.pip-gem[data-active-pip="true"]');
      pips.forEach((pip, idx) => {
        setTimeout(() => {
          pip.classList.add('pip-halo-flash');
          sound.playDotCrystalChime(idx, pips.length);
          setTimeout(() => {
            pip.classList.remove('pip-halo-flash');
          }, durationMs);
        }, idx * 45);
      });
    }

    /********************************************************************
     * THE CORE FEATURE: ACCENTUATED SLOW 180° ROTATION CHOREOGRAPHY
     *   - Step A (0.6s): Theatre spotlight dims room, dots flash & chime,
     *                    domino elevates slightly.
     *   - Step B (3.2s): Smooth requestAnimationFrame rotation 0° -> 180°
     *                    with persistent canvas light trails for every dot
     *                    and 10-degree roulette ratchet ticks.
     *   - Step C (0.8s): Brass lock at 180°, all dots flash again to prove
     *                    none vanished, crossover bridge lights up, Row 2 opens.
     ********************************************************************/
    function startAccentuatedRotation(isReplay = false) {
      if (!isReplay && state.phase !== 'WAIT_FLIP') return;
      if (isReplay && state.phase !== 'ROW2') return;

      const currentTask = state.taskId;
      state.phase = 'ROTATING';
      updateActiveSlotHighlight();

      const assembly = document.getElementById('turntableAssembly');
      const dominoRotator = document.getElementById('dominoRotator');
      const spotlight = document.getElementById('spotlightOverlay');
      const replayBtn = document.getElementById('replayTurnBtn');

      assembly.classList.remove('awaiting-flip');
      replayBtn.classList.remove('visible');

      // Position Theatre Spotlight directly over the Turntable center
      const assemblyRect = assembly.getBoundingClientRect();
      const spotX = ((assemblyRect.left + assemblyRect.width / 2) / window.innerWidth) * 100;
      const spotY = ((assemblyRect.top + assemblyRect.height / 2) / window.innerHeight) * 100;
      spotlight.style.setProperty('--spot-x', `${spotX.toFixed(1)}%`);
      spotlight.style.setProperty('--spot-y', `${spotY.toFixed(1)}%`);
      spotlight.classList.add('active');

      // Reset angle to 0° so even on Replay the child sees the full 0° -> 180° movement
      setTurntableAngle(0, 1.06);
      dominoRotator.classList.add('elevated-rotating');

      // STEP A (0.6s): Highlight every dot with glowing halo & crystal chime before moving
      flashAllDominoDots(520);

      setTimeout(() => {
        if (state.taskId !== currentTask) return;

        // STEP B (3.2s): Frame-by-frame 180-degree rotation with persistent dot trails
        resetPipOrbitTrails();
        samplePipOrbitPositions();

        const duration = 3200; // 3.2 seconds slow pedagogical turn
        const startTime = performance.now();
        let lastRatchetStep = 0;

        // EaseInOutCubic so it accelerates smoothly and slows down as it approaches 180°
        function easeInOutCubic(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function stepRotation(now) {
          if (state.taskId !== currentTask) return;

          const elapsed = now - startTime;
          const rawT = Math.min(1, elapsed / duration);
          const easedT = easeInOutCubic(rawT);
          const currentDeg = easedT * 180;

          setTurntableAngle(currentDeg, 1.06);
          samplePipOrbitPositions();

          // Play roulette ratchet click every 10 degrees (10°, 20°, ..., 170°)
          const currentStep = Math.floor(currentDeg / 10);
          if (currentStep > lastRatchetStep && currentStep < 18) {
            lastRatchetStep = currentStep;
            sound.playRatchetTick(rawT);
          }

          if (rawT < 1) {
            requestAnimationFrame(stepRotation);
          } else {
            // Locked at exact 180.0 degrees!
            setTurntableAngle(180, 1.0);
            dominoRotator.classList.remove('elevated-rotating');
            sound.playTurntableLock180();

            // STEP C (0.8s): Flash every dot again to prove zero dots disappeared!
            flashAllDominoDots(600);
            spawnDominoToRow2Beams();

            // Illuminate the X-shaped Crossover Bridge & open Row 2 Shutter
            document.getElementById('crossoverBridge').classList.add('bridge-active');
            const row1 = document.getElementById('eqRow1');
            row1.classList.add('shutter-open');

            setTimeout(() => {
              if (state.taskId !== currentTask) return;
              spotlight.classList.remove('active');
              fadeOutPipOrbitTrails();

              state.phase = 'ROW2';
              state.activeRow = 1;
              // Find first unsolved slot in Row 2
              state.activeCol = 0;
              for (let c = 0; c < 3; c++) {
                if (!state.solved[1][c]) {
                  state.activeCol = c;
                  break;
                }
              }
              replayBtn.classList.add('visible');
              updateActiveSlotHighlight();
            }, 800);
          }
        }

        requestAnimationFrame(stepRotation);
      }, 620);
    }

    function completeRow2() {
      state.phase = 'CELEBRATING';
      updateActiveSlotHighlight();

      const row1 = document.getElementById('eqRow1');
      row1.classList.add('row-solved');
      document.getElementById('replayTurnBtn').classList.remove('visible');

      for (let c = 0; c < 3; c++) {
        spawnSlotSparkles(document.getElementById(`slot-1-${c}`), '#fde047', 18);
      }

      triggerGrandCelebration();

      const currentTask = state.taskId;
      setTimeout(() => {
        if (state.taskId === currentTask && state.phase === 'CELEBRATING') {
          generateNewTask();
        }
      }, 2850);
    }

    /********************************************************************
     * 6. INPUT HANDLING (Casino Chips + Physical Keyboard + Backspace)
     ********************************************************************/
    function clearActiveSlot() {
      if (state.phase !== 'ROW1' && state.phase !== 'ROW2') return;
      if (state.pendingTimer) {
        clearTimeout(state.pendingTimer);
        state.pendingTimer = null;
      }
      state.pendingDigit = '';
      const slot = document.getElementById(`slot-${state.activeRow}-${state.activeCol}`);
      if (slot && !state.solved[state.activeRow][state.activeCol]) {
        slot.textContent = '';
        sound.playChipClick(1);
      }
    }

    function validateAndCommitValue(enteredValue) {
      if (state.pendingTimer) {
        clearTimeout(state.pendingTimer);
        state.pendingTimer = null;
      }
      state.pendingDigit = '';

      const row = state.activeRow;
      const col = state.activeCol;
      const slot = document.getElementById(`slot-${row}-${col}`);
      const expected = getExpectedValue(row, col);

      slot.textContent = enteredValue;

      if (enteredValue === expected) {
        state.solved[row][col] = true;
        slot.classList.remove('active-slot', 'slot-wrong');
        slot.classList.add('slot-correct');
        sound.playSlotCorrect(col + row * 3);
        spawnSlotSparkles(slot, '#fde047', 16);
        advanceToNextUnsolvedSlot(row);
      } else {
        sound.playWrongThud();
        slot.classList.remove('slot-wrong');
        void slot.offsetWidth;
        slot.classList.add('slot-wrong');
        setTimeout(() => {
          if (!state.solved[row][col]) {
            slot.textContent = '';
            slot.classList.remove('slot-wrong');
          }
        }, 440);
      }
    }

    function handleNumberInput(num, fromChipClick = false) {
      if (state.phase === 'WAIT_FLIP') {
        // Visual & audio nudge toward the pulsing Domino Turntable
        spawnSlotSparkles(document.getElementById('dominoRotator'), '#fde047', 16);
        sound.playDotCrystalChime(2, 6);
        return;
      }

      if (state.phase !== 'ROW1' && state.phase !== 'ROW2') return;

      const row = state.activeRow;
      const col = state.activeCol;
      if (state.solved[row][col]) return;

      const expected = getExpectedValue(row, col);
      const slot = document.getElementById(`slot-${row}-${col}`);

      sound.playChipClick(num);

      // Clicking a Casino Chip (0..12) directly enters the full number
      if (fromChipClick) {
        validateAndCommitValue(num);
        return;
      }

      // Physical Keyboard Input (0..9)
      if (state.pendingDigit === '1') {
        const combined = parseInt('1' + String(num), 10);
        validateAndCommitValue(combined);
        return;
      }

      // If expected value is 10, 11, or 12 and child presses '1', wait briefly for second digit
      if (expected >= 10 && num === 1) {
        state.pendingDigit = '1';
        slot.textContent = '1';
        state.pendingTimer = setTimeout(() => {
          if (state.pendingDigit === '1') {
            validateAndCommitValue(1);
          }
        }, 900);
        return;
      }

      validateAndCommitValue(num);
    }

    // Slot selection by clicking
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 3; c++) {
        const slot = document.getElementById(`slot-${r}-${c}`);
        slot.addEventListener('click', () => {
          if (
            (state.phase === 'ROW1' && r === 0) ||
            (state.phase === 'ROW2' && r === 1)
          ) {
            if (!state.solved[r][c]) {
              state.activeCol = c;
              state.pendingDigit = '';
              slot.textContent = '';
              sound.playChipClick(2);
              updateActiveSlotHighlight();
            }
          }
        });
      }
    }

    // Clicking the Turntable Assembly triggers the accentuated 180° rotation
    document.getElementById('turntableAssembly').addEventListener('click', (e) => {
      if (e.target.closest('#replayTurnBtn')) return;
      if (state.phase === 'WAIT_FLIP') {
        startAccentuatedRotation(false);
      }
    });

    // Clicking the Replay Rotation button during Row 2 replays the 180° turn
    document.getElementById('replayTurnBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (state.phase === 'ROW2') {
        startAccentuatedRotation(true);
      }
    });

    // Keyboard Support
    window.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        e.preventDefault();
        handleNumberInput(parseInt(e.key, 10), false);
      } else if (e.key === 'Backspace' || e.key === 'Delete') {
        e.preventDefault();
        clearActiveSlot();
      } else if ((e.key === 'Enter' || e.key === ' ') && state.phase === 'WAIT_FLIP') {
        e.preventDefault();
        startAccentuatedRotation(false);
      }
    });

    // Top-Right Minimalist "Next" Button
    document.getElementById('nextBtn').addEventListener('click', () => {
      sound.playChipClick(6);
      spawnSlotSparkles(document.getElementById('nextBtn'), '#fde047', 16);
      generateNewTask();
    });

    // Top-Left Sound Toggle Button
    document.getElementById('soundBtn').addEventListener('click', () => {
      const isMuted = sound.toggleMute();
      document.getElementById('soundIconOn').classList.toggle('hidden', isMuted);
      document.getElementById('soundIconOff').classList.toggle('hidden', !isMuted);
      if (!isMuted) sound.playChipClick(3);
    });

    /********************************************************************
     * 7. START GAME ON WINDOW LOAD
     ********************************************************************/
    window.onload = function () {
      buildCasinoChipRack();
      generateNewTask();
      animateCanvas();
    };
  </script>
</body>
