<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Віднімання двоцифрових чисел</title>
    <style>
        /* Базові стилі та архітектура */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #87CEEB; /* Колір-заглушка на час завантаження */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.5s ease-in-out;
            overflow: hidden;
        }

        /* Контейнер гри */
        #game-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
            text-align: center;
            position: relative;
        }

        #question {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 40px;
            color: #333;
            letter-spacing: 2px;
        }

        #options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .option-btn {
            font-family: Arial, sans-serif;
            font-size: 2rem;
            padding: 20px;
            border: 3px solid #ddd;
            border-radius: 15px;
            background: #fff;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s, border-color 0.2s;
            color: #333;
            font-weight: bold;
            position: relative;
        }

        .option-btn:active {
            transform: scale(0.95);
        }

        /* Посилені анімації фідбеку */
        @keyframes correctAnim {
            0% { transform: scale(1); background-color: #fff; box-shadow: 0 0 0 transparent; }
            20% { transform: scale(1.3); background-color: #4CAF50; color: white; border-color: #4CAF50; box-shadow: 0 0 40px rgba(76, 175, 80, 0.8); }
            40% { transform: scale(1.4) rotate(3deg); background-color: #4CAF50; color: white; border-color: #4CAF50; box-shadow: 0 0 50px rgba(76, 175, 80, 1); }
            60% { transform: scale(1.4) rotate(-3deg); background-color: #4CAF50; color: white; border-color: #4CAF50; box-shadow: 0 0 50px rgba(76, 175, 80, 1); }
            80% { transform: scale(1.2); background-color: #4CAF50; color: white; border-color: #4CAF50; box-shadow: 0 0 20px rgba(76, 175, 80, 0.5); }
            100% { transform: scale(1); background-color: #4CAF50; color: white; border-color: #4CAF50; box-shadow: 0 0 0 transparent; }
        }

        @keyframes wrongAnim {
            0% { transform: translateX(0) scale(1); background-color: #fff; }
            10% { transform: translateX(-20px) scale(1.1); background-color: #F44336; color: white; border-color: #F44336; }
            20% { transform: translateX(20px) scale(1.1); background-color: #F44336; color: white; border-color: #F44336; }
            30% { transform: translateX(-20px) scale(1.1); background-color: #F44336; color: white; border-color: #F44336; }
            40% { transform: translateX(20px) scale(1.1); background-color: #F44336; color: white; border-color: #F44336; }
            50% { transform: translateX(-20px) scale(1.1); background-color: #F44336; color: white; border-color: #F44336; }
            60% { transform: translateX(20px) scale(1.1); background-color: #F44336; color: white; border-color: #F44336; }
            70% { transform: translateX(-20px) scale(1.1); background-color: #F44336; color: white; border-color: #F44336; }
            80% { transform: translateX(20px) scale(1.1); background-color: #F44336; color: white; border-color: #F44336; }
            90% { transform: translateX(-10px) scale(1.05); background-color: #F44336; color: white; border-color: #F44336; }
            100% { transform: translateX(0) scale(1); background-color: #F44336; color: white; border-color: #F44336; }
        }

        .anim-correct { animation: correctAnim 0.8s forwards; z-index: 10; }
        .anim-wrong { animation: wrongAnim 0.6s forwards; z-index: 10; }

        /* Ефект вибуху для правильної відповіді */
        .explosion-particle {
            position: fixed;
            font-size: 2.5rem;
            pointer-events: none;
            z-index: 10000;
            animation: explodeAnim 0.8s ease-out forwards;
            transform: translate(-50%, -50%);
        }

        @keyframes explodeAnim {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5) rotate(var(--rot)); opacity: 0; }
        }

        /* Екран завершення */
        #end-emoji {
            font-size: 5rem;
            margin-bottom: 30px;
        }

        #restart-btn {
            font-size: 3rem;
            padding: 10px 30px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            background: #f0f0f0;
            transition: background 0.2s;
        }

        #restart-btn:hover {
            background: #e0e0e0;
        }

        /* Theme Manager UI */
        #settings-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #fff;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            font-size: 30px;
            cursor: pointer;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }

        #settings-btn:hover {
            transform: scale(1.1);
        }

        #settings-modal {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 320px;
            max-height: 60vh;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
            overflow-y: auto;
            z-index: 9998;
            padding: 15px;
            display: none; /* Приховано за замовчуванням */
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Стиль скролбару для меню */
        #settings-modal::-webkit-scrollbar { width: 8px; }
        #settings-modal::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        #settings-modal::-webkit-scrollbar-thumb { background: #bbb; border-radius: 10px; }
        #settings-modal::-webkit-scrollbar-thumb:hover { background: #888; }

        .thumbnail {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: border-color 0.2s, transform 0.2s;
        }

        .thumbnail:hover {
            border-color: #4CAF50;
            transform: scale(1.05);
        }

        .thumbnail span {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 3px 6px;
            font-size: 12px;
            border-radius: 4px;
            pointer-events: none;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Екран вікторини -->
        <div id="quiz-screen">
            <div id="question"></div>
            <div id="options"></div>
        </div>

        <!-- Екран завершення (без слів) -->
        <div id="end-screen" style="display: none;">
            <div id="end-emoji">🏆🎉👏</div>
            <button id="restart-btn">🔄</button>
        </div>
    </div>

    <!-- Theme Manager UI -->
    <button id="settings-btn">⚙️</button>
    <div id="settings-modal"></div>

    <script>
        /* ==============================================================
           АУДІО СИСТЕМА (Web Audio API для автономності)
           ============================================================== */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            // Браузери вимагають відновлення аудіоконтексту після взаємодії користувача
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'correct') {
                // Звук перемоги (радісний висхідний дзвінькіт)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                // Звук помилки (різке низьке гудіння)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'winGame') {
                // Звук завершення гри (арпеджіо)
                const t = audioCtx.currentTime;
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, t);
                osc.frequency.setValueAtTime(554, t + 0.1);
                osc.frequency.setValueAtTime(659, t + 0.2);
                osc.frequency.setValueAtTime(880, t + 0.3);
                
                gainNode.gain.setValueAtTime(0.2, t);
                gainNode.gain.exponentialRampToValueAtTime(0.01, t + 0.6);
                
                osc.start(t);
                osc.stop(t + 0.6);
            }
        }


        /* ==============================================================
           THEME MANAGER (Система динамічних фонів)
           ============================================================== */
        const baseUrl = "https://olgazheltvai2.github.io/images/backgrounds/";
        const defaultBg = `${baseUrl}background_1.webp`;
        const savedBg = localStorage.getItem('mySavedGameBg') || defaultBg;
        
        // Встановлюємо збережений або дефолтний фон при завантаженні
        document.body.style.backgroundImage = `url('${savedBg}')`;

        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');

        // Відкриття/закриття меню
        settingsBtn.addEventListener('click', () => {
            if (settingsModal.style.display === 'none' || settingsModal.style.display === '') {
                settingsModal.style.display = 'grid';
            } else {
                settingsModal.style.display = 'none';
            }
        });

        let currentBgIndex = 1;
        let consecutiveFails = 0;
        const maxFails = 5; // Зупиняємо перевірку після 5 невдалих завантажень поспіль

        function loadThemes() {
            // Теоретичний ліміт до 1000, але зупиняється якщо файлів більше немає
            if (currentBgIndex > 1000 || consecutiveFails >= maxFails) return;

            const bgUrl = `${baseUrl}background_${currentBgIndex}.webp`;
            const img = new Image();

            img.onload = () => {
                consecutiveFails = 0; // Скидаємо лічильник помилок
                createThumbnail(bgUrl, currentBgIndex);
                currentBgIndex++;
                loadThemes(); // Запускаємо перевірку наступного
            };

            img.onerror = () => {
                consecutiveFails++;
                currentBgIndex++;
                loadThemes(); // Продовжуємо перевірку
            };

            img.src = bgUrl;
        }

        function createThumbnail(url, id) {
            const thumb = document.createElement('div');
            thumb.className = 'thumbnail';
            thumb.style.backgroundImage = `url('${url}')`;

            const label = document.createElement('span');
            label.textContent = `Фон ${id}`;
            thumb.appendChild(label);

            thumb.addEventListener('click', () => {
                document.body.style.backgroundImage = `url('${url}')`;
                localStorage.setItem('mySavedGameBg', url);
            });

            settingsModal.appendChild(thumb);
        }

        // Запуск системи фонів
        loadThemes();


        /* ==============================================================
           ЛОГІКА ГРИ (Віднімання двоцифрових чисел)
           ============================================================== */
        const totalQuestions = 30;
        let questions = [];
        let currentQuestionIndex = 0;

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const quizScreen = document.getElementById('quiz-screen');
        const endScreen = document.getElementById('end-screen');
        const restartBtn = document.getElementById('restart-btn');

        // Генератор 30 унікальних прикладів
        function generateQuestions() {
            questions = [];
            while (questions.length < totalQuestions) {
                let num1 = Math.floor(Math.random() * (99 - 20 + 1)) + 20; // 20...99
                let num2 = Math.floor(Math.random() * (num1 - 10 + 1)) + 10; // 10...num1
                let answer = num1 - num2;
                
                let qText = `${num1} - ${num2}`;

                // Перевірка на унікальність прикладу
                if (!questions.some(q => q.question === qText)) {
                    let optionsSet = new Set();
                    optionsSet.add(answer);

                    // Генерація 3 хибних відповідей
                    while (optionsSet.size < 4) {
                        let offset = Math.floor(Math.random() * 21) - 10; // Відхилення від -10 до +10
                        if (offset === 0) offset = 5;
                        let wrongAnswer = answer + offset;
                        
                        if (wrongAnswer >= 0 && wrongAnswer <= 99) {
                            optionsSet.add(wrongAnswer);
                        }
                    }

                    // Перемішуємо варіанти
                    let optionsArray = Array.from(optionsSet).sort(() => Math.random() - 0.5);

                    questions.push({
                        question: qText,
                        answer: answer,
                        options: optionsArray
                    });
                }
            }
        }

        function loadQuestion() {
            if (currentQuestionIndex >= totalQuestions) {
                quizScreen.style.display = 'none';
                endScreen.style.display = 'block';
                playSound('winGame');
                return;
            }

            const currentQ = questions[currentQuestionIndex];
            questionEl.textContent = currentQ.question;
            optionsEl.innerHTML = '';

            currentQ.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => handleAnswer(btn, opt, currentQ.answer);
                optionsEl.appendChild(btn);
            });
        }

        // Функція візуального вибуху емодзі
        function createExplosion(element) {
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const emojis = ['💥', '✨', '🎉', '🌟'];

            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'explosion-particle';
                particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                document.body.appendChild(particle);

                const angle = Math.random() * 2 * Math.PI;
                const velocity = 80 + Math.random() * 120; // Сила розльоту
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                const rot = (Math.random() - 0.5) * 360;

                particle.style.left = `${centerX}px`;
                particle.style.top = `${centerY}px`;
                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                particle.style.setProperty('--rot', `${rot}deg`);

                setTimeout(() => particle.remove(), 800);
            }
        }

        function handleAnswer(btn, selected, correct) {
            // Відновлюємо аудіоконтекст при першому кліку
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Блокуємо всі кнопки під час анімації
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correct) {
                playSound('correct');
                btn.classList.add('anim-correct');
                createExplosion(btn);
                setTimeout(() => {
                    currentQuestionIndex++;
                    loadQuestion();
                }, 900); // Чекаємо завершення анімації
            } else {
                playSound('wrong');
                btn.classList.add('anim-wrong');
                setTimeout(() => {
                    btn.classList.remove('anim-wrong');
                    // Розблоковуємо кнопки для повторної спроби
                    allBtns.forEach(b => b.style.pointerEvents = 'auto');
                }, 600);
            }
        }

        restartBtn.addEventListener('click', () => {
            currentQuestionIndex = 0;
            generateQuestions(); // Генеруємо нові 30 прикладів для повторної гри
            quizScreen.style.display = 'block';
            endScreen.style.display = 'none';
            loadQuestion();
        });

        // Ініціалізація гри при першому запуску
        generateQuestions();
        loadQuestion();
    </script>
<script src="https://olgazheltvai2.github.io/rizne/pencil.js"></script></body>
</html>
