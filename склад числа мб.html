<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Співвідношення сторін 16:9, темний фон для країв -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #051119;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial Black', Impact, sans-serif; /* Жирний шрифт для кращої читабельності */
            user-select: none;
        }

        /* Головний контейнер з фіксованою пропорцією 16:9 */
        #game-container {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 100 * 9 / 16 */
            max-height: 100vh;
            max-width: 177.78vh; /* 100 * 16 / 9 */
            background-color: #4facfe;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Універсальні стилі для SVG */
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.1s ease-in-out, filter 0.1s;
        }
        
        .interactive:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .interactive:active {
            transform: scale(0.95);
        }

        /* Екрани */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.5s;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        /* Стартовий екран */
        #start-menu {
            flex-direction: column;
            gap: 20px;
        }
        
        .name-input {
            background: linear-gradient(to bottom, #d4a373, #a97142);
            border: 4px solid #5c3a21;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 3vh;
            font-family: 'Arial Black', sans-serif;
            color: #fff;
            text-shadow: 2px 2px 0 #3d2616;
            outline: none;
            text-align: center;
            width: 30vw;
            pointer-events: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 5px 15px rgba(0,0,0,0.5);
        }

        .name-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Ігровий інтерфейс */
        .player-area {
            position: absolute;
            top: 20%;
            width: 30%;
            height: 70%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        #player1-area { left: 5%; }
        #player2-area { right: 5%; }

        .inactive-player {
            opacity: 0.4;
            transform: scale(0.9);
            filter: grayscale(0.5);
            pointer-events: none;
        }
        
        .active-player {
            filter: drop-shadow(0 0 20px #ffd700);
        }

        .player-name {
            font-size: 4vh;
            color: #ffd700;
            text-shadow: 3px 3px 0 #5c3a21, -1px -1px 0 #5c3a21, 1px -1px 0 #5c3a21, -1px 1px 0 #5c3a21, 1px 1px 0 #5c3a21;
            margin-bottom: 2vh;
            text-transform: uppercase;
        }

        .grid-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1vh;
            background: rgba(92, 58, 33, 0.9);
            padding: 1.5vh;
            border: 0.5vh solid #3d2616;
            border-radius: 2vh;
            box-shadow: inset 0 0 20px #000, 0 10px 30px rgba(0,0,0,0.8);
            width: 100%;
            aspect-ratio: 1;
        }

        .cell {
            position: relative;
            background: linear-gradient(135deg, #c48c5a, #8e582e);
            border: 0.4vh solid #4a2f1d;
            border-radius: 1vh;
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.2), inset -2px -2px 5px rgba(0,0,0,0.5);
            transition: transform 0.2s, filter 0.2s;
        }

        .cell.pickable {
            cursor: pointer;
            pointer-events: auto;
            animation: pulse-glow 1.5s infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 5px #ffd700); }
            50% { filter: brightness(1.3) drop-shadow(0 0 15px #ffd700); }
        }

        /* Центральна панель: завдання та варіанти */
        #task-panel {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 35%;
        }

        .equation-box {
            background: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="5" width="calc(100% - 10px)" height="calc(100% - 10px)" fill="%23e8d2a6" stroke="%235c3a21" stroke-width="6" rx="15" ry="15"/><line x1="20" y1="20" x2="calc(100% - 20px)" y2="20" stroke="%23c4a473" stroke-width="2"/><line x1="20" y1="calc(100% - 20px)" x2="calc(100% - 20px)" y2="calc(100% - 20px)" stroke="%23c4a473" stroke-width="2"/></svg>') no-repeat center center;
            background-size: 100% 100%;
            padding: 3vh 5vh;
            font-size: 7vh;
            color: #3d2616;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.6);
            width: 100%;
            height: 12vh;
            pointer-events: auto;
        }

        .options-container {
            display: flex;
            justify-content: center;
            gap: 2vw;
            margin-top: 3vh;
            pointer-events: auto;
            width: 100%;
        }

        .coin-btn {
            width: 8vh;
            height: 8vh;
            background: radial-gradient(circle at 30% 30%, #fffacd, #ffd700, #b8860b);
            border-radius: 50%;
            border: 0.4vh solid #8b6508;
            box-shadow: 0 1vh 2vh rgba(0,0,0,0.5), inset 0 0 1vh rgba(255,255,255,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4vh;
            color: #5c3a21;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.8);
            cursor: pointer;
            transition: transform 0.1s;
            position: relative;
        }

        .coin-btn:active {
            transform: translateY(0.5vh);
            box-shadow: 0 0.5vh 1vh rgba(0,0,0,0.5), inset 0 0 1vh rgba(255,255,255,0.8);
        }

        .coin-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(1);
        }

        /* Навігація */
        .nav-controls {
            position: absolute;
            bottom: 3vh;
            right: 3vh;
            display: flex;
            gap: 1.5vh;
            pointer-events: auto;
        }

        .nav-btn {
            width: 6vh;
            height: 6vh;
            background: linear-gradient(135deg, #5c3a21, #2d180b);
            border: 0.3vh solid #d4a373;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0.5vh 1vh rgba(0,0,0,0.5);
            transition: transform 0.2s, border-color 0.2s;
        }

        .nav-btn:hover {
            transform: scale(1.1);
            border-color: #ffd700;
        }

        .nav-btn svg {
            width: 60%;
            height: 60%;
            fill: none;
            stroke: #d4a373;
        }
        .nav-btn:hover svg { stroke: #ffd700; }
        
        /* Персонаж (Восьминіг-капітан відцентрований) */
        #character {
            position: absolute;
            bottom: 5vh;
            left: 51%;
            margin-left: -15vh; /* Половина ширини для точного центрування */
            width: 30vh;
            height: 30vh;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center;
        }

        .eye-pupil {
            transition: transform 0.1s linear; /* Плавний рух очей без кліпання */
        }
    </style>
<body>

<div id="game-container">
    
    <!-- ФОН: Деталізований корабель та море -->
    <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" id="background-svg">
        <defs>
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#0b3d60" />
                <stop offset="60%" stop-color="#1e7399" />
                <stop offset="100%" stop-color="#4facfe" />
            </linearGradient>
            <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#005073" />
                <stop offset="100%" stop-color="#001829" />
            </linearGradient>
            <pattern id="woodPattern" width="100" height="40" patternUnits="userSpaceOnUse">
                <rect width="100" height="40" fill="#5c3a21" />
                <path d="M0,20 Q50,25 100,20 M0,40 L100,40" fill="none" stroke="#3d2616" stroke-width="2" />
                <circle cx="10" cy="10" r="1.5" fill="#2d180b" />
                <circle cx="90" cy="30" r="1.5" fill="#2d180b" />
                <!-- Текстура дерева -->
                <path d="M20,5 Q40,10 60,5 M30,15 Q60,20 80,15" fill="none" stroke="#4a2f1d" stroke-width="1" />
            </pattern>
            <linearGradient id="sailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#e3dac9" />
                <stop offset="50%" stop-color="#fff5e6" />
                <stop offset="100%" stop-color="#c9bba6" />
            </linearGradient>
            <filter id="shadow">
                <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
            </filter>
        </defs>

        <!-- Небо -->
        <rect width="1920" height="1080" fill="url(#skyGrad)" />
        
        <!-- Хмари -->
        <path d="M 200,300 Q 250,250 300,300 Q 350,280 400,320 Q 300,350 200,300" fill="rgba(255,255,255,0.2)" />
        <path d="M 1500,200 Q 1550,150 1600,200 Q 1650,180 1700,220 Q 1600,250 1500,200" fill="rgba(255,255,255,0.15)" />

        <!-- Море (задній план) -->
        <path d="M 0,600 Q 480,580 960,610 T 1920,600 L 1920,1080 L 0,1080 Z" fill="url(#seaGrad)" />
        <path d="M 0,630 Q 480,660 960,620 T 1920,640 L 1920,1080 L 0,1080 Z" fill="#003d5c" opacity="0.8" />

        <!-- Вітрила та щогли -->
        <rect x="300" y="-100" width="30" height="900" fill="#2d180b" />
        <rect x="1600" y="-50" width="40" height="850" fill="#2d180b" />
        <path d="M 150,100 Q 315,300 480,100 Q 315,150 150,100" fill="url(#sailGrad)" stroke="#8b7355" stroke-width="4" filter="url(#shadow)"/>
        <path d="M 1400,150 Q 1620,400 1840,150 Q 1620,200 1400,150" fill="url(#sailGrad)" stroke="#8b7355" stroke-width="4" filter="url(#shadow)"/>

        <!-- Палуба корабля -->
        <path d="M -100,1080 L 300,750 L 1620,750 L 2020,1080 Z" fill="url(#woodPattern)" filter="url(#shadow)" />
        
        <!-- Борт (поручні) -->
        <rect x="0" y="700" width="1920" height="20" fill="#3d2616" />
        <rect x="0" y="740" width="1920" height="30" fill="#2d180b" />
        <!-- Стовпчики поручнів -->
        <g fill="#4a2f1d">
            <rect x="300" y="700" width="15" height="50" />
            <rect x="600" y="700" width="15" height="50" />
            <rect x="900" y="700" width="15" height="50" />
            <rect x="1200" y="700" width="15" height="50" />
            <rect x="1500" y="700" width="15" height="50" />
        </g>
    </svg>

    <!-- СТАРТОВИЙ ЕКРАН -->
    <div id="start-menu" class="screen">
        <!-- SVG Декор меню -->
        <svg viewBox="0 0 800 500" style="width: 800px; height: 500px; position: absolute; z-index: -1;">
            <rect x="50" y="50" width="700" height="400" rx="30" fill="#e8d2a6" stroke="#8b5a2b" stroke-width="10" filter="url(#shadow)"/>
            <!-- Піратські шаблі декор -->
            <path d="M 100,100 L 200,200 M 200,100 L 100,200" stroke="#5c3a21" stroke-width="8" stroke-linecap="round"/>
            <path d="M 700,100 L 600,200 M 600,100 L 700,200" stroke="#5c3a21" stroke-width="8" stroke-linecap="round"/>
        </svg>

        <input type="text" id="p1-input" class="name-input" placeholder="Ім'я Пірата 1" maxlength="12">
        <input type="text" id="p2-input" class="name-input" placeholder="Ім'я Пірата 2" maxlength="12">
        
        <svg viewBox="0 0 150 150" style="width: 15vh; height: 15vh; position: relative;" class="interactive" onclick="startGame()">
            <circle cx="75" cy="75" r="70" fill="#4caf50" stroke="#2e7d32" stroke-width="5" filter="url(#shadow)"/>
            <path d="M 55,40 L 105,75 L 55,110 Z" fill="#fff" />
        </svg>
    </div>

    <!-- ІГРОВИЙ ЕКРАН -->
    <div id="game-screen" class="screen hidden">
        
        <!-- Панель гравця 1 (зліва) -->
        <div id="player1-area" class="player-area active-player">
            <div class="player-name" id="p1-name-display">Гравець 1</div>
            <div class="grid-board" id="p1-grid"></div>
        </div>

        <!-- Центральна панель: рівняння та відповіді -->
        <div id="task-panel">
            <div class="equation-box" id="equation-display"></div>
            <div class="options-container" id="options-box"></div>
        </div>

        <!-- Панель гравця 2 (справа) -->
        <div id="player2-area" class="player-area inactive-player">
            <div class="player-name" id="p2-name-display">Гравець 2</div>
            <div class="grid-board" id="p2-grid"></div>
        </div>

        <!-- Персонаж Капітан Восьминіг (очі рандомно рухаються, відцентрований) -->
        <div id="character">
            <svg viewBox="0 0 300 300">
                <defs>
                    <radialGradient id="octoGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#ff5252" />
                        <stop offset="100%" stop-color="#b71c1c" />
                    </radialGradient>
                </defs>
                <!-- Щупальця -->
                <path d="M 150,200 Q 50,280 20,200 Q 50,230 100,200" fill="url(#octoGrad)" stroke="#7f0000" stroke-width="4"/>
                <path d="M 150,200 Q 250,280 280,200 Q 250,230 200,200" fill="url(#octoGrad)" stroke="#7f0000" stroke-width="4"/>
                <path d="M 120,210 Q 80,300 100,320 Q 120,270 140,210" fill="url(#octoGrad)" stroke="#7f0000" stroke-width="4"/>
                <path d="M 180,210 Q 220,300 200,320 Q 180,270 160,210" fill="url(#octoGrad)" stroke="#7f0000" stroke-width="4"/>
                
                <!-- Тіло -->
                <ellipse cx="150" cy="140" rx="70" ry="80" fill="url(#octoGrad)" stroke="#7f0000" stroke-width="4"/>
                
                <!-- Піратський капелюх -->
                <path d="M 40,80 Q 150,20 260,80 L 280,70 Q 150,-30 20,70 Z" fill="#212121" stroke="#000" stroke-width="3"/>
                <path d="M 80,60 Q 150,-10 220,60 Z" fill="#212121" stroke="#000" stroke-width="3"/>
                <circle cx="150" cy="40" r="10" fill="#fff" /> <!-- Череп на капелюсі міні -->
                
                <!-- Очі -->
                <!-- Ліве око -->
                <circle cx="115" cy="130" r="20" fill="#fff" stroke="#7f0000" stroke-width="2"/>
                <circle cx="115" cy="130" r="8" fill="#000" class="eye-pupil" id="pupil-l"/>
                <!-- Праве око -->
                <circle cx="185" cy="130" r="20" fill="#fff" stroke="#7f0000" stroke-width="2"/>
                <circle cx="185" cy="130" r="8" fill="#000" class="eye-pupil" id="pupil-r"/>
                
                <!-- Рот -->
                <path d="M 130,170 Q 150,190 170,170" fill="none" stroke="#7f0000" stroke-width="5" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- Навігація -->
        <div class="nav-controls">
            <!-- Кнопка Перегенерувати -->
            <div class="nav-btn" onclick="regenerateTask()" title="Перегенерувати завдання">
                <svg viewBox="0 0 24 24">
                    <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
                </svg>
            </div>
        </div>

    </div>

    <!-- SVG Шаблони для клітинок -->
    <template id="svg-hatch">
        <svg viewBox="0 0 100 100" style="width:100%; height:100%;">
            <line x1="20" y1="20" x2="80" y2="80" stroke="#3d2616" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
            <line x1="80" y1="20" x2="20" y2="80" stroke="#3d2616" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
        </svg>
    </template>

    <template id="svg-treasure">
        <svg viewBox="0 0 100 100" style="width:100%; height:100%; animation: pulse-glow 1s infinite alternate;">
            <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#fff" />
                <stop offset="50%" stop-color="#ffd700" />
                <stop offset="100%" stop-color="#b8860b" />
            </radialGradient>
            <!-- Сяйво -->
            <circle cx="50" cy="50" r="45" fill="url(#goldGlow)" opacity="0.8"/>
            <!-- Монети -->
            <circle cx="35" cy="45" r="15" fill="#ffd700" stroke="#b8860b" stroke-width="2"/>
            <circle cx="65" cy="45" r="15" fill="#ffd700" stroke="#b8860b" stroke-width="2"/>
            <circle cx="50" cy="65" r="18" fill="#ffea00" stroke="#b8860b" stroke-width="3"/>
            <path d="M 45,60 L 50,70 L 55,60" fill="none" stroke="#b8860b" stroke-width="2"/>
            <!-- Бліки -->
            <circle cx="45" cy="60" r="4" fill="#fff" opacity="0.8"/>
        </svg>
    </template>

    <template id="svg-crab">
        <svg viewBox="0 0 100 100" style="width:100%; height:100%;">
            <!-- Пісок/Нора -->
            <ellipse cx="50" cy="70" rx="40" ry="15" fill="#3d2616" opacity="0.6"/>
            <!-- Краб -->
            <path d="M 30,50 Q 15,35 25,25 Q 35,20 40,40" fill="#e53935" stroke="#b71c1c" stroke-width="2"/>
            <path d="M 70,50 Q 85,35 75,25 Q 65,20 60,40" fill="#e53935" stroke="#b71c1c" stroke-width="2"/>
            <ellipse cx="50" cy="55" rx="25" ry="15" fill="#ef5350" stroke="#b71c1c" stroke-width="2"/>
            <!-- Очі -->
            <circle cx="40" cy="40" r="6" fill="#fff"/>
            <circle cx="40" cy="40" r="2" fill="#000"/>
            <circle cx="60" cy="40" r="6" fill="#fff"/>
            <circle cx="60" cy="40" r="2" fill="#000"/>
            <!-- Ніжки -->
            <path d="M 30,65 L 15,75 M 35,68 L 25,80 M 70,65 L 85,75 M 65,68 L 75,80" stroke="#e53935" stroke-width="4" stroke-linecap="round"/>
        </svg>
    </template>

</div>

<script>
    // Аудіо система (тихі звуки)
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTone(type) {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        const vol = 0.02; // Тихі звуки

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, t);
            osc.frequency.exponentialRampToValueAtTime(1600, t + 0.1);
            gain.gain.setValueAtTime(vol, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            osc.start(t);
            osc.stop(t + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, t);
            osc.frequency.exponentialRampToValueAtTime(100, t + 0.2);
            gain.gain.setValueAtTime(vol, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            osc.start(t);
            osc.stop(t + 0.3);
        } else if (type === 'treasure') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, t);
            osc.frequency.setValueAtTime(600, t + 0.1);
            osc.frequency.setValueAtTime(800, t + 0.2);
            osc.frequency.setValueAtTime(1200, t + 0.3);
            gain.gain.setValueAtTime(vol, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.6);
            osc.start(t);
            osc.stop(t + 0.6);
        } else if (type === 'crab') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.linearRampToValueAtTime(80, t + 0.3);
            gain.gain.setValueAtTime(vol, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.3);
            osc.start(t);
            osc.stop(t + 0.3);
        } else if (type === 'win') {
            osc.type = 'sine';
            [523, 659, 783, 1046, 1318].forEach((f, i) => {
                osc.frequency.setValueAtTime(f, t + i*0.1);
            });
            gain.gain.setValueAtTime(vol, t);
            gain.gain.linearRampToValueAtTime(0, t + 1.0);
            osc.start(t);
            osc.stop(t + 1.0);
        }
    }

    // Стан гри
    const state = {
        players: [
            { name: "Пірат 1", grid: [], found: 0 },
            { name: "Пірат 2", grid: [], found: 0 }
        ],
        activePlayerIdx: 0,
        phase: 'answer', // 'answer' або 'pick'
        targetAnswer: 0
    };

    // Утиліти
    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Ініціалізація гри
    function startGame() {
        initAudio();
        
        const n1 = document.getElementById('p1-input').value.trim();
        const n2 = document.getElementById('p2-input').value.trim();
        if(n1) state.players[0].name = n1;
        if(n2) state.players[1].name = n2;

        document.getElementById('p1-name-display').innerText = state.players[0].name;
        document.getElementById('p2-name-display').innerText = state.players[1].name;

        // Поля: 5 скарбів (1), 4 краби (0)
        state.players[0].grid = shuffle([1, 1, 1, 1, 1, 0, 0, 0, 0]).map(val => ({ type: val, open: false }));
        state.players[1].grid = shuffle([1, 1, 1, 1, 1, 0, 0, 0, 0]).map(val => ({ type: val, open: false }));
        
        state.players[0].found = 0;
        state.players[1].found = 0;
        state.activePlayerIdx = 0;

        document.getElementById('start-menu').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');

        renderGrids();
        setupTurn();
    }

    // Рендер ігрових полів
    function renderGrids() {
        [0, 1].forEach(pIdx => {
            const container = document.getElementById(`p${pIdx+1}-grid`);
            container.innerHTML = '';
            state.players[pIdx].grid.forEach((cellData, cellIdx) => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${pIdx}-${cellIdx}`;
                
                // Вміст клітинки
                if (cellData.open) {
                    cell.innerHTML = document.getElementById(cellData.type === 1 ? 'svg-treasure' : 'svg-crab').innerHTML;
                } else {
                    cell.innerHTML = document.getElementById('svg-hatch').innerHTML;
                }
                
                // Клік по клітинці
                cell.addEventListener('click', () => handleCellClick(pIdx, cellIdx));
                container.appendChild(cell);
            });
        });
    }

    // Підготовка ходу
    function setupTurn() {
        state.phase = 'answer';
        
        // Візуальне перемикання активного гравця
        document.getElementById('player1-area').className = 'player-area ' + (state.activePlayerIdx === 0 ? 'active-player' : 'inactive-player');
        document.getElementById('player2-area').className = 'player-area ' + (state.activePlayerIdx === 1 ? 'active-player' : 'inactive-player');
        
        // Знімаємо підсвітку клітинок
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('pickable'));

        generateMathTask();
    }

    // Генерація завдання
    function generateMathTask() {
        const total = Math.floor(Math.random() * 6) + 5; // 5..10
        const part1 = Math.floor(Math.random() * (total - 1)) + 1;
        state.targetAnswer = total - part1;

        updateEquationUI(total, part1, state.targetAnswer);
    }

    // Оновлення UI рівняння та монет
    function updateEquationUI(total, part1, correctAns) {
        document.getElementById('equation-display').innerText = `${total} = ${part1} і ?`;

        let options = [correctAns];
        while (options.length < 4) {
            let wrong = Math.floor(Math.random() * 10) + 1;
            if (!options.includes(wrong) && wrong !== total) options.push(wrong);
        }
        options = shuffle(options);

        const optContainer = document.getElementById('options-box');
        optContainer.innerHTML = '';
        optContainer.style.opacity = '1';
        optContainer.style.pointerEvents = 'auto';

        options.forEach(num => {
            const btn = document.createElement('div');
            btn.className = 'coin-btn';
            btn.innerText = num;
            btn.onclick = () => handleAnswer(num, btn);
            optContainer.appendChild(btn);
        });
    }

    // Обробка відповіді
    function handleAnswer(selectedNum, btnElement) {
        if (state.phase !== 'answer') return;
        initAudio();

        if (selectedNum === state.targetAnswer) {
            playTone('correct');
            animateCharacter('jump');
            state.phase = 'pick';
            
            // Ховаємо варіанти
            document.getElementById('options-box').style.opacity = '0.3';
            document.getElementById('options-box').style.pointerEvents = 'none';

            // Робимо невідкриті клітинки активного гравця клікабельними
            const grid = state.players[state.activePlayerIdx].grid;
            grid.forEach((cellData, idx) => {
                if (!cellData.open) {
                    document.getElementById(`cell-${state.activePlayerIdx}-${idx}`).classList.add('pickable');
                }
            });
        } else {
            playTone('wrong');
            animateCharacter('shake');
            btnElement.classList.add('disabled');
            
            // Перехід ходу при помилці (після невеликої затримки)
            setTimeout(() => {
                state.activePlayerIdx = 1 - state.activePlayerIdx;
                setupTurn();
            }, 800);
        }
    }

    // Обробка кліку по клітинці
    function handleCellClick(pIdx, cellIdx) {
        if (state.phase !== 'pick' || pIdx !== state.activePlayerIdx) return;
        
        const cellData = state.players[pIdx].grid[cellIdx];
        if (cellData.open) return; // Вже відкрита

        initAudio();
        cellData.open = true;
        
        // Знімаємо підсвітку
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('pickable'));

        const cellEl = document.getElementById(`cell-${pIdx}-${cellIdx}`);
        
        if (cellData.type === 1) {
            // Скарб
            cellEl.innerHTML = document.getElementById('svg-treasure').innerHTML;
            playTone('treasure');
            animateCharacter('jump');
            state.players[pIdx].found++;
            
            if (state.players[pIdx].found >= 5) {
                setTimeout(winGame, 1000);
                return;
            }
        } else {
            // Краб
            cellEl.innerHTML = document.getElementById('svg-crab').innerHTML;
            playTone('crab');
            animateCharacter('shake');
        }

        // Перехід ходу
        setTimeout(() => {
            state.activePlayerIdx = 1 - state.activePlayerIdx;
            setupTurn();
        }, 1200);
    }

    // Перемога
    function winGame() {
        playTone('win');
        document.getElementById('equation-display').innerHTML = document.getElementById('svg-treasure').innerHTML;
        document.getElementById('equation-display').style.background = 'none';
        document.getElementById('options-box').innerHTML = '';
        animateCharacter('jump');
        setInterval(() => animateCharacter('jump'), 2000);
    }

    // Навігація: Перегенерувати завдання (не змінюючи чергу гравця)
    function regenerateTask() {
        initAudio();
        setupTurn(); // Це скидає фазу назад на 'answer' і генерує нове завдання
    }

    // Анімація та рух очей персонажа
    const charEl = document.getElementById('character');
    function animateCharacter(type) {
        charEl.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        if (type === 'jump') {
            charEl.style.transform = 'translateY(-5vh) scale(1.1)';
            setTimeout(() => charEl.style.transform = 'translateY(0) scale(1)', 300);
        } else if (type === 'shake') {
            charEl.style.transform = 'rotate(-10deg)';
            setTimeout(() => {
                charEl.style.transform = 'rotate(10deg)';
                setTimeout(() => charEl.style.transform = 'rotate(0)', 150);
            }, 150);
        }
    }

    // Рандомний рух зіниць без кліпання
    setInterval(() => {
        const pxL = document.getElementById('pupil-l');
        const pxR = document.getElementById('pupil-r');
        if (pxL && pxR) {
            const rx = (Math.random() - 0.5) * 12; // Зміщення X
            const ry = (Math.random() - 0.5) * 12; // Зміщення Y
            pxL.style.transform = `translate(${rx}px, ${ry}px)`;
            pxR.style.transform = `translate(${rx}px, ${ry}px)`;
        }
    }, 1200);

</script>
</html>
