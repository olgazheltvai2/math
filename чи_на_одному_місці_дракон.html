<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра: Святковий Китайський Дракон</title>
    <!-- Підключення Firebase (compat версія для класичного Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2b1010; 
            font-family: Arial, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            transition: background-image 0.5s ease;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #game-wrapper {
            position: relative;
            transform-origin: center center;
            transition: transform 0.2s ease-out;
        }

        #game-container {
            position: relative;
            width: 100vw;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            /* Затемнений, менш яскравий захід сонця, щоб виділити дракона */
            background: linear-gradient(to bottom, #4A148C 0%, #B71C1C 50%, #D84315 100%);
            border-radius: 15px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.9), inset 0 0 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            transition: background 0.3s ease;
        }

        /* Клас для прибирання фонових прямокутників при виборі динамічного фону */
        #game-container.transparent-bg {
            background: transparent !important;
            box-shadow: none !important;
            border-radius: 0 !important;
        }

        #background-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        #game-container.transparent-bg #background-layer {
            opacity: 0; /* Ховаємо вбудований SVG фон, якщо обрано зовнішній */
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 15px;
            align-items: center;
            background: #B71C1C;
            padding: 10px 20px;
            border-radius: 40px;
            box-shadow: 0 6px 0 #7F0000, 0 10px 20px rgba(0,0,0,0.6);
            border: 2px solid #FFCDD2;
        }

        #wagon-input {
            width: 70px;
            height: 50px;
            font-size: 32px;
            text-align: center;
            background-color: #FFF8E1;
            border: 3px solid #FFCA28;
            border-radius: 15px;
            color: #B71C1C;
            font-weight: bold;
            outline: none;
        }

        #build-btn {
            background: #FFCA28;
            border: 3px solid #FFF3E0;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            box-shadow: 0 4px 0 #F57F17;
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #build-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #F57F17;
        }

        /* Двір перед монастирем (кам'яна плитка) */
        #tracks {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            z-index: 2;
            background: linear-gradient(to bottom, #424242 0%, #212121 100%);
            border-top: 8px solid #757575;
            box-shadow: inset 0 20px 30px rgba(0,0,0,0.6);
            /* Паттерн традиційної кам'яної кладки */
            background-image: 
                linear-gradient(90deg, rgba(0,0,0,0.3) 2px, transparent 2px),
                linear-gradient(0deg, rgba(0,0,0,0.3) 2px, transparent 2px);
            background-size: 80px 40px;
            background-position: 0 0, 40px 20px;
        }

        #train-wrapper {
            position: absolute;
            bottom: 135px;
            left: 150px;
            display: flex;
            align-items: flex-end;
            z-index: 5;
            transform-origin: left bottom;
            transition: transform 0.4s ease-in-out;
        }

        .moving #train-wrapper {
            animation: dragon-dance 0.5s infinite alternate ease-in-out;
        }
        @keyframes dragon-dance {
            0% { transform: translateY(0) scale(var(--train-scale, 1)) rotate(0deg); }
            100% { transform: translateY(-8px) scale(var(--train-scale, 1)) rotate(0.5deg); }
        }

        .train-unit { flex-shrink: 0; }
        
        #locomotive { width: 220px; height: 230px; }

        .wagon {
            width: 140px;
            height: 160px;
            margin-left: -15px; 
            transform-origin: center center;
            animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.4) forwards;
            opacity: 0;
            transform: scale(0);
        }
        @keyframes pop-in { 100% { opacity: 1; transform: scale(1); } }

        .character {
            position: absolute;
            width: 110px;
            height: 210px; 
            z-index: 20;
            cursor: grab;
            filter: drop-shadow(4px 4px 6px rgba(0,0,0,0.5));
            transition: left 0.1s linear, top 0.1s linear; 
            touch-action: none; 
            will-change: left, top;
        }
        
        .character.dragging {
            cursor: grabbing;
            filter: drop-shadow(10px 20px 20px rgba(0,0,0,0.7));
            transform: scale(1.05);
            transition: none !important; 
            z-index: 100;
        }

        .char-inner {
            width: 100%;
            height: 100%;
            transform-origin: bottom center;
            animation: breathe 1.5s infinite alternate ease-in-out;
        }
        @keyframes breathe {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(0.96); }
        }

        #boy { left: 20px; bottom: 120px; top: auto; }
        #girl { left: 900px; bottom: 120px; top: auto; }

        /* ================= ДОДАНІ БЛОКИ (UI, СИСТЕМА ФОНІВ, МАЛЮВАННЯ, МАСШТАБ, БЛОКУВАННЯ) ================= */

        /* Адаптивність */
        @media (max-width: 768px) {
            #ui-layer { transform: translateX(-50%) scale(0.8); top: 10px; }
            #wagon-input { height: 40px; font-size: 24px; }
            #build-btn { width: 50px; height: 50px; }
        }

        /* Поля вводу таємних слів (глобальний стиль на майбутнє) */
        .secret-input {
            color: transparent !important;
        }
        .secret-input::selection {
            color: transparent !important;
            background: transparent !important;
        }

        /* Кнопка налаштувань фону */
        #theme-settings-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #2C3E50;
            color: white;
            border: 2px solid #ECF0F1;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 99999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Модальне вікно фонів */
        #theme-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(44, 62, 80, 0.95);
            padding: 20px;
            border-radius: 15px;
            z-index: 100000;
            width: 80vw;
            max-width: 600px;
            border: 2px solid #ECF0F1;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }
        #theme-modal h3 {
            color: white; margin-top: 0; text-align: center;
        }
        #theme-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
        }
        .theme-card {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            cursor: pointer;
            overflow: hidden;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .theme-card:hover { border-color: #F1C40F; transform: scale(1.05); }
        .theme-card img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .theme-card span {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.6);
            color: white;
            text-align: center;
            font-size: 12px;
            padding: 4px 0;
            pointer-events: none;
        }
        .theme-card.no-bg-card {
            background: #7f8c8d;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 14px;
        }
        #close-theme-btn {
            display: block; width: 100%; padding: 10px;
            margin-top: 15px; background: #E74C3C; color: white;
            border: none; border-radius: 8px; cursor: pointer; font-size: 16px;
        }

        /* Інструмент малювання */
        #draw-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 90000;
            pointer-events: none; /* Активується тільки при відкритті панелі */
        }
        #toggle-draw-btn-global {
            position: fixed;
            bottom: 85px; right: 20px;
            width: 50px; height: 50px;
            background: #8e44ad; color: white;
            border: 2px solid #fff; border-radius: 50%;
            font-size: 24px; cursor: pointer;
            z-index: 99999; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
        }
        #draw-panel-global {
            display: none;
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px; border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            z-index: 100000; width: 220px;
            border: 2px solid #8e44ad;
            font-family: Arial, sans-serif;
        }
        #draw-panel-handle {
            background: #e0e0e0; height: 15px; border-radius: 6px;
            margin-bottom: 10px; cursor: grab;
        }
        .draw-btn-row { display: flex; gap: 5px; margin-bottom: 10px; }
        .draw-btn {
            flex: 1; padding: 8px; border: none; border-radius: 6px;
            background: #ecf0f1; cursor: pointer; font-weight: bold;
        }
        .draw-btn.active { background: #8e44ad; color: white; }
        .draw-slider { width: 100%; margin-bottom: 10px; }
        #clear-draw-btn {
            width: 100%; padding: 8px; background: #e74c3c; color: white;
            border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        #close-draw-panel {
            position: absolute; top: -10px; right: -10px;
            background: #333; color: white; border: none;
            border-radius: 50%; width: 24px; height: 24px; cursor: pointer;
        }

        /* Інструменти масштабування (Лупа) */
        #zoom-controls {
            position: fixed;
            left: 20px; bottom: 20px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 99999;
        }
        .zoom-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: #3498db; color: white; border: 2px solid white;
            font-size: 20px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }

        /* Екран блокування (Радар/Заглушка) */
        #block-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; background: rgba(0,0,0,0.85);
            z-index: 999999; justify-content: center; align-items: center;
            color: #ff4d4d; font-size: 5vw; font-weight: bold; text-align: center;
            text-transform: uppercase; font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

<!-- Контейнер для масштабування -->
<div id="game-wrapper">
    <div id="game-container">
        <!-- Полотно для малювання (знаходиться всередині гри для правильного позиціонування) -->
        <canvas id="draw-canvas"></canvas>

        <!-- Складний магічний фон (ЧІТКИЙ, БЕЗ РОЗМИТТЯ) -->
        <svg id="background-layer" viewBox="0 0 1200 800" preserveAspectRatio="none">
            
            <!-- Менш яскраве сонце -->
            <circle cx="600" cy="350" r="150" fill="#FFB300" opacity="0.6"/>
            <circle cx="600" cy="350" r="180" fill="#FFCA28" opacity="0.2"/>
            
            <!-- Хмари у традиційному китайському стилі (анімовані) -->
            <g fill="#FFFFFF" opacity="0.4">
                <path d="M 150,200 Q 180,180 210,200 Q 230,170 270,190 Q 290,160 330,190 Q 360,180 380,210 L 120,210 Q 130,190 150,200 Z">
                    <animateTransform attributeName="transform" type="translate" values="0,0; -80,0; 0,0" dur="25s" repeatCount="indefinite"/>
                </path>
                <path d="M 850,150 Q 880,130 910,150 Q 930,120 970,140 Q 990,110 1030,140 Q 1060,130 1080,160 L 820,160 Q 830,140 850,150 Z">
                    <animateTransform attributeName="transform" type="translate" values="0,0; -100,0; 0,0" dur="30s" repeatCount="indefinite"/>
                </path>
            </g>

            <!-- Далекі Гори (Стиль Гуйлінь, затемнені) -->
            <path d="M -50,550 Q 50,250 150,550 T 400,600 L 400,800 L -50,800 Z" fill="#4A148C" opacity="0.6"/>
            <path d="M 100,600 Q 200,300 350,600 T 700,550 L 700,800 L 100,800 Z" fill="#311B92" opacity="0.7"/>
            <path d="M 600,650 Q 800,200 950,650 T 1300,550 L 1300,800 L 600,800 Z" fill="#311B92" opacity="0.6"/>
            <path d="M 800,700 Q 950,350 1100,700 T 1300,650 L 1300,800 L 800,800 Z" fill="#1A237E" opacity="0.8"/>
            
            <!-- Передні гори -->
            <path d="M -100,650 L 100,450 L 300,650 L 500,500 L 800,650 L 1000,450 L 1300,650 L 1300,800 L -100,800 Z" fill="#0D47A1"/>

            <!-- Китайські Монастирі (Пагоди) на горах -->
            <!-- Лівий монастир -->
            <g transform="translate(100, 420)">
                <!-- Основа -->
                <rect x="-30" y="0" width="60" height="30" fill="#B71C1C"/>
                <rect x="-20" y="5" width="10" height="25" fill="#FFCA28"/>
                <rect x="10" y="5" width="10" height="25" fill="#FFCA28"/>
                <!-- Дах 1 -->
                <path d="M -40,5 Q -50,-5 -60,-15 Q 0,-30 60,-15 Q 50,-5 40,5 Z" fill="#212121"/>
                <rect x="-20" y="-30" width="40" height="20" fill="#B71C1C"/>
                <!-- Дах 2 -->
                <path d="M -30,-25 Q -40,-35 -50,-45 Q 0,-60 50,-45 Q 40,-35 30,-25 Z" fill="#212121"/>
                <rect x="-10" y="-50" width="20" height="15" fill="#B71C1C"/>
                <!-- Дах 3 (Верхівка) -->
                <path d="M -20,-45 Q -30,-55 -40,-65 Q 0,-80 40,-65 Q 30,-55 20,-45 Z" fill="#212121"/>
                <!-- Шпиль -->
                <line x1="0" y1="-70" x2="0" y2="-90" stroke="#FFCA28" stroke-width="3"/>
                <circle cx="0" cy="-90" r="4" fill="#FFCA28"/>
            </g>

            <!-- Правий великий монастир -->
            <g transform="translate(950, 310)">
                <rect x="-40" y="0" width="80" height="40" fill="#B71C1C"/>
                <rect x="-25" y="10" width="15" height="30" fill="#FFCA28"/>
                <rect x="10" y="10" width="15" height="30" fill="#FFCA28"/>
                <path d="M -50,5 Q -60,-5 -75,-15 Q 0,-35 75,-15 Q 60,-5 50,5 Z" fill="#212121"/>
                <rect x="-30" y="-30" width="60" height="20" fill="#B71C1C"/>
                <path d="M -40,-25 Q -50,-35 -60,-45 Q 0,-65 60,-45 Q 50,-35 40,-25 Z" fill="#212121"/>
                <rect x="-20" y="-55" width="40" height="20" fill="#B71C1C"/>
                <path d="M -30,-50 Q -40,-60 -50,-70 Q 0,-90 50,-70 Q 40,-60 30,-50 Z" fill="#212121"/>
                <line x1="0" y1="-80" x2="0" y2="-110" stroke="#FFCA28" stroke-width="4"/>
                <circle cx="0" cy="-110" r="5" fill="#FFCA28"/>
                <circle cx="0" cy="-95" r="7" fill="#FFCA28"/>
            </g>

            <!-- Анімовані журавлі, що летять -->
            <g fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1">
                <g transform="translate(300, 250)">
                    <animateTransform attributeName="transform" type="translate" values="300,250; -100,200" dur="15s" repeatCount="indefinite"/>
                    <path d="M 0,0 Q -10,-10 -20,-5 Q -10,0 0,0">
                        <animate attributeName="d" values="M 0,0 Q -10,-10 -20,-5 Q -10,0 0,0; M 0,0 Q -10,10 -20,15 Q -10,5 0,0; M 0,0 Q -10,-10 -20,-5 Q -10,0 0,0" dur="1s" repeatCount="indefinite"/>
                    </path>
                    <path d="M 0,0 Q -10,-10 -20,-25 Q -5,-10 0,0">
                        <animate attributeName="d" values="M 0,0 Q -10,-10 -20,-25 Q -5,-10 0,0; M 0,0 Q -10,10 -20,5 Q -5,10 0,0; M 0,0 Q -10,-10 -20,-25 Q -5,-10 0,0" dur="1s" repeatCount="indefinite"/>
                    </path>
                    <circle cx="5" cy="0" r="2" fill="#FFFFFF"/>
                    <line x1="5" y1="0" x2="15" y2="0" stroke="#FFFFFF" stroke-width="2"/>
                </g>
                <g transform="translate(350, 280)">
                    <animateTransform attributeName="transform" type="translate" values="350,280; -50,230" dur="14s" repeatCount="indefinite"/>
                    <path d="M 0,0 Q -8,-8 -16,-4 Q -8,0 0,0">
                        <animate attributeName="d" values="M 0,0 Q -8,-8 -16,-4 Q -8,0 0,0; M 0,0 Q -8,8 -16,12 Q -8,4 0,0; M 0,0 Q -8,-8 -16,-4 Q -8,0 0,0" dur="0.9s" repeatCount="indefinite"/>
                    </path>
                    <path d="M 0,0 Q -8,-8 -16,-20 Q -4,-8 0,0">
                        <animate attributeName="d" values="M 0,0 Q -8,-8 -16,-20 Q -4,-8 0,0; M 0,0 Q -8,8 -16,4 Q -4,8 0,0; M 0,0 Q -8,-8 -16,-20 Q -4,-8 0,0" dur="0.9s" repeatCount="indefinite"/>
                    </path>
                    <line x1="3" y1="0" x2="12" y2="0" stroke="#FFFFFF" stroke-width="1.5"/>
                </g>
            </g>

            <!-- Гілки квітучої сакури на передньому плані -->
            <path d="M 0,0 Q 150,50 250,150 Q 200,200 280,250" fill="none" stroke="#2D1A11" stroke-width="12" stroke-linecap="round"/>
            <path d="M 150,50 Q 200,10 300,50" fill="none" stroke="#2D1A11" stroke-width="8" stroke-linecap="round"/>
            <path d="M 1200,0 Q 1050,80 950,180 Q 1000,220 900,280" fill="none" stroke="#2D1A11" stroke-width="15" stroke-linecap="round"/>
            
            <!-- Квіти сакури -->
            <g fill="#F48FB1">
                <circle cx="100" cy="40" r="15"/> <circle cx="120" cy="30" r="12"/> <circle cx="130" cy="60" r="14"/>
                <circle cx="200" cy="120" r="16"/> <circle cx="230" cy="100" r="12"/>
                <circle cx="260" cy="220" r="14"/>
                <circle cx="1100" cy="70" r="18"/> <circle cx="1070" cy="50" r="15"/>
                <circle cx="1000" cy="150" r="16"/> <circle cx="950" cy="200" r="14"/>
                <circle cx="920" cy="260" r="12"/>
            </g>
            <g fill="#FCE4EC">
                <circle cx="105" cy="45" r="6"/> <circle cx="205" cy="125" r="6"/>
                <circle cx="1105" cy="75" r="7"/> <circle cx="1005" cy="155" r="6"/>
            </g>

            <!-- Анімовані падаючі пелюстки -->
            <g fill="#F8BBD0">
                <path d="M 200,120 Q 210,130 200,140 Q 190,130 200,120">
                    <animateTransform attributeName="transform" type="translate" values="0,0; 50,300" dur="5s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="1;0" dur="5s" repeatCount="indefinite"/>
                </path>
                <path d="M 260,220 Q 270,230 260,240 Q 250,230 260,220">
                    <animateTransform attributeName="transform" type="translate" values="0,0; 80,400" dur="6s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="1;0" dur="6s" repeatCount="indefinite"/>
                </path>
                <path d="M 1000,150 Q 1010,160 1000,170 Q 990,160 1000,150">
                    <animateTransform attributeName="transform" type="translate" values="0,0; -100,500" dur="7s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="1;0" dur="7s" repeatCount="indefinite"/>
                </path>
                <path d="M 950,200 Q 960,210 950,220 Q 940,210 950,200">
                    <animateTransform attributeName="transform" type="translate" values="0,0; -60,400" dur="5.5s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="1;0" dur="5.5s" repeatCount="indefinite"/>
                </path>
            </g>
        </svg>

        <div id="ui-layer">
            <input type="number" id="wagon-input" min="1" max="50" value="4">
            <button id="build-btn">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#D32F2F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M8 12h8"></path>
                    <path d="M12 8v8"></path>
                </svg>
            </button>
        </div>

        <div id="tracks"></div>

        <div id="train-wrapper">
            <!-- Голова Китайського Дракона (Святковий) -->
            <svg id="locomotive" class="train-unit" viewBox="0 -30 220 230" xmlns="http://www.w3.org/2000/svg">
                <!-- Шия (Луска) -->
                <path d="M 130,200 Q 180,180 200,100 L 220,100 L 220,200 Z" fill="#D32F2F"/>
                <path d="M 130,200 Q 160,180 170,100 L 200,100 C 190,160 170,190 130,200 Z" fill="#F44336"/>
                
                <!-- Золота грива на шиї -->
                <path d="M 220,100 Q 190,120 220,140 Q 190,160 220,180 Q 200,190 220,200 Z" fill="#FFCA28"/>

                <!-- Голова -->
                <path d="M 180,100 C 180,20 80,10 40,60 C 10,90 10,130 50,150 C 90,170 160,160 180,100 Z" fill="#D32F2F"/>

<!-- Лупа для масштабування -->
<div id="zoom-controls">
    <button class="zoom-btn" onclick="setZoom(0.1)">+</button>
    <button class="zoom-btn" onclick="setZoom(-0.1)">−</button>
</div>

<!-- Кнопка та меню фонів -->
<button id="theme-settings-btn">⚙️️</button>
<div id="theme-modal">
    <h3>Оберіть фон</h3>
    <div id="theme-gallery">
        <!-- Перша опція: Без фону -->
        <div class="theme-card no-bg-card" onclick="selectTheme('none')">
            Без фону
        </div>
    </div>
    <button id="close-theme-btn">Закрити</button>
</div>

<!-- Інструмент малювання -->
<button id="toggle-draw-btn-global">✏️</button>
<div id="draw-panel-global">
    <button id="close-draw-panel">✕</button>
    <div id="draw-panel-handle"></div>
    <div class="draw-btn-row">
        <button id="tool-pencil" class="draw-btn active">✏️ Олівець</button>
        <button id="tool-eraser" class="draw-btn">🧽 Гумка</button>
    </div>
    <input type="range" id="draw-size" class="draw-slider" min="1" max="50" value="5">
    <input type="color" id="draw-color" class="draw-slider" value="#FF0000">
    <button id="clear-draw-btn">🗑️ Очистити</button>
</div>

<!-- Екран-заглушка (Блок контролю) -->
<div id="block-overlay">Зачекай! Зараз не твій урок.</div>

<script>
    // ================= КОНФІГУРАЦІЯ ТА ІНІЦІАЛІЗАЦІЯ FIREBASE =================
    const CONFIG = {
        gameId: 'dragon_dance_v1', 
        projectId: 'lesson-13c44'
    };

    const firebaseConfig = {
        databaseURL: `https://${CONFIG.projectId}-default-rtdb.firebaseio.com/`,
        projectId: CONFIG.projectId
    };

    // Ініціалізація Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    
    // Унікальний ID поточного клієнта (щоб не дублювати власні дії)
    const senderId = Math.random().toString(36).substring(2, 10);
    
    const actionsRef = db.ref(`game_action/${CONFIG.gameId}`);
    const themeRef = db.ref(`game_theme/${CONFIG.gameId}`);
    
    // ================= БЛОК КОНТРОЛЮ (ІДЕНТИФІКАЦІЯ, РАДАР, БЛОКУВАННЯ) =================
    const urlParams = new URLSearchParams(window.location.search);
    let myName = urlParams.get('user');
    
    if (!myName) myName = sessionStorage.getItem('userName');
    if (!myName) {
        myName = 'Гість_' + Math.floor(Math.random() * 1000);
    }
    sessionStorage.setItem('userName', myName);

    const tabId = Math.random().toString(36).substring(2, 15);
    const userRef = db.ref(`online_users/${myName}/${tabId}`);

    // Радар підключень
    db.ref('.info/connected').on('value', snap => {
        if (snap.val() === true) {
            userRef.set(true);
            userRef.onDisconnect().remove();
        }
    });

    // Миттєва зачистка при закритті
    window.addEventListener('beforeunload', () => {
        userRef.remove();
    });

    // Блокування екрану
    db.ref(`blocked_users/${myName}`).on('value', snap => {
        document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
    });

    // Примусове оновлення (не встановлюємо тут, тільки слухаємо)
    db.ref('force_refresh').on('value', snap => {
        if (snap.val()) {
            window.location.reload();
        }
    });

    // Повернення в лобі з імунітетом 1 сек
    let immunity = true;
    setTimeout(() => immunity = false, 1000);
    db.ref('current_activity').on('value', snap => {
        if (!immunity && snap.val() === 'lobby') {
            window.location.href = `https://olgazheltvai2.github.io/rizne/lobby.html?user=${encodeURIComponent(myName)}`;
        }
    });

    // ================= СИНХРОНІЗАТОР ДІЙ =================
    function sendAction(actionData) {
        actionData.senderId = senderId;
        actionData.timestamp = firebase.database.ServerValue.TIMESTAMP;
        // Запис через set
        actionsRef.set(actionData);
    }

    actionsRef.on('value', snap => {
        const data = snap.val();
        if (!data || data.senderId === senderId) return;
        
        try {
            if (data.type === 'build') {
                input.value = data.count;
                buildTrain(true); // Передаємо прапорець, щоб не викликати loop
            } else if (data.type === 'move') {
                const el = document.getElementById(data.id);
                if (el) {
                    el.style.left = data.left + 'px';
                    el.style.top = data.top + 'px';
                    el.style.bottom = 'auto';
                }
            } else if (data.type === 'draw_line') {
                drawRemoteLine(data.x0, data.y0, data.x1, data.y1, data.color, data.size, data.isEraser);
            } else if (data.type === 'clear_canvas') {
                clearCanvas(false);
            }
        } catch (e) {
            console.error("Помилка синхронізації:", e);
        }
    });

    // ================= СИСТЕМА ДИНАМІЧНИХ ФОНІВ =================
    const themeModal = document.getElementById('theme-modal');
    const themeGallery = document.getElementById('theme-gallery');
    
    document.getElementById('theme-settings-btn').onclick = () => {
        themeModal.style.display = 'block';
    };
    document.getElementById('close-theme-btn').onclick = () => {
        themeModal.style.display = 'none';
    };

    function applyBackground(url) {
        if (url === 'none') {
            document.body.style.backgroundImage = 'none';
            document.getElementById('game-container').classList.remove('transparent-bg');
        } else {
            document.body.style.backgroundImage = `url('${url}')`;
            document.getElementById('game-container').classList.add('transparent-bg');
        }
        // Зберігаємо індивідуально для цієї гри
        localStorage.setItem('mySavedBg_' + CONFIG.gameId, url);
    }

    // Слухач фону з Firebase
    themeRef.on('value', snap => {
        const url = snap.val();
        if (url) {
            applyBackground(url);
        }
    });

    function selectTheme(url) {
        themeRef.set(url); // Синхронізація для всіх
        applyBackground(url);
        themeModal.style.display = 'none';
    }

    // Послідовне завантаження фонів
    async function loadBackgrounds() {
        let index = 1;
        while (true) {
            const url = `https://olgazheltvai2.github.io/images/backgrounds/background_${index}.webp`;
            const exists = await checkImageExists(url);
            if (!exists) break; // Зупинка при 404
            
            const card = document.createElement('div');
            card.className = 'theme-card';
            card.onclick = () => selectTheme(url);
            card.innerHTML = `<img src="${url}" alt="Фон ${index}"><span>Фон ${index}</span>`;
            themeGallery.appendChild(card);
            index++;
        }
    }

    function checkImageExists(url) {
        return new Promise(resolve => {
            const img = new Image();
            img.onload = () => resolve(true);
            img.onerror = () => resolve(false);
            img.src = url;
        });
    }

    // Відновлення фону при завантаженні сторінки
    const savedBg = localStorage.getItem('mySavedBg_' + CONFIG.gameId);
    if (savedBg) {
        applyBackground(savedBg);
    }
    loadBackgrounds();


    // ================= МАСШТАБУВАННЯ (ЛУПА) =================
    let currentZoom = 1;
    const wrapper = document.getElementById('game-wrapper');
    function setZoom(delta) {
        currentZoom += delta;
        if(currentZoom < 0.3) currentZoom = 0.3;
        if(currentZoom > 3) currentZoom = 3;
        wrapper.style.transform = `scale(${currentZoom})`;
    }


    // ================= ІНСТРУМЕНТ МАЛЮВАННЯ =================
    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    const drawPanel = document.getElementById('draw-panel-global');
    const toggleDrawBtn = document.getElementById('toggle-draw-btn-global');
    
    let isDrawing = false;
    let isDrawingModeActive = false;
    let lastX = 0; let lastY = 0;
    let currentTool = 'pencil'; // pencil або eraser

    function resizeCanvas() {
        const container = document.getElementById('game-container');
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
    }
    // Сповільнення (debounce) виклику resize для мобільних
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resizeCanvas, 200);
    });
    resizeCanvas();

    toggleDrawBtn.onclick = () => {
        drawPanel.style.display = 'block';
        canvas.style.pointerEvents = 'auto'; // Активуємо полотно
        isDrawingModeActive = true;
    };

    document.getElementById('close-draw-panel').onclick = () => {
        drawPanel.style.display = 'none';
        canvas.style.pointerEvents = 'none'; // Пропускаємо кліки до гри
        isDrawingModeActive = false;
    };

    document.getElementById('tool-pencil').onclick = function() {
        currentTool = 'pencil';
        this.classList.add('active');
        document.getElementById('tool-eraser').classList.remove('active');
    };
    
    document.getElementById('tool-eraser').onclick = function() {
        currentTool = 'eraser';
        this.classList.add('active');
        document.getElementById('tool-pencil').classList.remove('active');
    };

    document.getElementById('clear-draw-btn').onclick = () => {
        clearCanvas(true);
    };

    function clearCanvas(broadcast) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (broadcast) sendAction({ type: 'clear_canvas' });
    }

    // Отримання координат з врахуванням масштабування лупою
    function getMousePos(evt) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (evt.clientX - rect.left) / currentZoom,
            y: (evt.clientY - rect.top) / currentZoom
        };
    }

    canvas.addEventListener('pointerdown', e => {
        if (!isDrawingModeActive) return;
        isDrawing = true;
        const pos = getMousePos(e);
        lastX = pos.x;
        lastY = pos.y;
    });

    canvas.addEventListener('pointermove', e => {
        if (!isDrawing || !isDrawingModeActive) return;
        const pos = getMousePos(e);
        const color = document.getElementById('draw-color').value;
        const size = document.getElementById('draw-size').value;
        
        drawLocalLine(lastX, lastY, pos.x, pos.y, color, size, currentTool === 'eraser');
        sendAction({
            type: 'draw_line',
            x0: lastX / canvas.width, y0: lastY / canvas.height,
            x1: pos.x / canvas.width, y1: pos.y / canvas.height,
            color: color, size: size, isEraser: currentTool === 'eraser'
        });

        lastX = pos.x; lastY = pos.y;
    });

    canvas.addEventListener('pointerup', () => isDrawing = false);
    canvas.addEventListener('pointerout', () => isDrawing = false);

    function drawLocalLine(x0, y0, x1, y1, color, size, isEraser) {
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.strokeStyle = isEraser ? 'rgba(0,0,0,1)' : color;
        ctx.lineWidth = size;
        ctx.lineCap = 'round';
        ctx.globalCompositeOperation = isEraser ? 'destination-out' : 'source-over';
        ctx.stroke();
        ctx.closePath();
    }

    function drawRemoteLine(nx0, ny0, nx1, ny1, color, size, isEraser) {
        const x0 = nx0 * canvas.width; const y0 = ny0 * canvas.height;
        const x1 = nx1 * canvas.width; const y1 = ny1 * canvas.height;
        drawLocalLine(x0, y0, x1, y1, color, size, isEraser);
    }

    // Перетягування панелі малювання
    const drawPanelHandle = document.getElementById('draw-panel-handle');
    let isDraggingPanel = false, pStartX, pStartY, pInitLeft, pInitTop;
    drawPanelHandle.addEventListener('pointerdown', e => {
        isDraggingPanel = true;
        pStartX = e.clientX; pStartY = e.clientY;
        const rect = drawPanel.getBoundingClientRect();
        pInitLeft = rect.left; pInitTop = rect.top;
        drawPanel.style.right = 'auto'; // відключаємо прив'язку
    });
    window.addEventListener('pointermove', e => {
        if (!isDraggingPanel) return;
        drawPanel.style.left = (pInitLeft + e.clientX - pStartX) + 'px';
        drawPanel.style.top = (pInitTop + e.clientY - pStartY) + 'px';
    });
    window.addEventListener('pointerup', () => isDraggingPanel = false);


    // ================= ОРИГІНАЛЬНА МЕХАНІКА ГРИ З СИНХРОНІЗАЦІЄЮ =================
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playPop() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    function playWhistle() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.1);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
        osc.start(); osc.stop(audioCtx.currentTime + 0.6);
    }

    function playGrab() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    const input = document.getElementById('wagon-input');
    const btn = document.getElementById('build-btn');
    const trainWrapper = document.getElementById('train-wrapper');
    const girl = document.getElementById('girl');
    const container = document.getElementById('game-container');

    const colors = ['#D32F2F', '#FBC02D', '#009688', '#E91E63', '#FF9800'];

    function getWagonHTML(color) {
        return `
            <svg class="train-unit wagon" viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">
                <!-- Золоті шипи на спині -->
                <polygon points="30,40 50,15 70,40" fill="#FFCA28"/>
                <polygon points="70,40 90,15 110,40" fill="#FFCA28"/>
                
                <!-- Основа тіла (Лускатий сегмент) -->
                <rect x="0" y="40" width="140" height="100" fill="${color}" rx="40"/>
                <!-- Нижній край дракона -->
                <rect x="0" y="110" width="140" height="30" fill="#FFF59D" rx="15"/>
                <rect x="0" y="115" width="140" height="20" fill="#FFCA28" rx="10"/>
                
                <!-- Деталізація луски золотом -->
                <path d="M 20,60 Q 30,70 40,60" fill="none" stroke="#FFCA28" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
                <path d="M 60,70 Q 70,80 80,70" fill="none" stroke="#FFCA28" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
                <path d="M 100,55 Q 110,65 120,55" fill="none" stroke="#FFCA28" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
                <path d="M 40,90 Q 50,100 60,90" fill="none" stroke="#FFCA28" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
                <path d="M 80,85 Q 90,95 100,85" fill="none" stroke="#FFCA28" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
                
                <!-- Традиційний китайський ліхтарик, що висить на сегменті -->
                <g transform="translate(55, 15)">
                    <line x1="15" y1="0" x2="15" y2="40" stroke="#795548" stroke-width="2"/>
                    <circle cx="15" cy="50" r="20" fill="#FFEB3B" opacity="0.3">
                        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <rect x="5" y="35" width="20" height="30" fill="#E65100" rx="10"/>
                    <path d="M 5,45 Q 15,35 25,45 M 5,55 Q 15,45 25,55" fill="none" stroke="#FFCA28" stroke-width="2"/>
                    <rect x="10" y="30" width="10" height="5" fill="#FFCA28"/>
                    <rect x="10" y="65" width="10" height="5" fill="#FFCA28"/>
                    <line x1="15" y1="70" x2="15" y2="85" stroke="#D32F2F" stroke-width="3"/>
                </g>
            </svg>
        `;
    }

    async function buildTrain(isRemote = false) {
        let count = parseInt(input.value);
        if (isNaN(count) || count < 1) count = 1;
        input.value = count;

        if (!isRemote) {
            sendAction({ type: 'build', count: count });
        }

        const wagons = trainWrapper.querySelectorAll('.wagon');
        wagons.forEach(w => w.remove());

        trainWrapper.style.setProperty('--train-scale', '1');
        trainWrapper.style.transform = 'scale(1)';
        container.classList.add('moving');
        playWhistle();

        for (let i = 0; i < count; i++) {
            await new Promise(r => setTimeout(r, 100));
            const div = document.createElement('div');
            div.innerHTML = getWagonHTML(colors[i % colors.length]);
            const wagonSvg = div.firstElementChild;
            trainWrapper.appendChild(wagonSvg);
            playPop();
        }

        setTimeout(() => {
            container.classList.remove('moving');
            const locoWidth = 220;
            const wagonWidth = 125; 
            const actualWidth = locoWidth + (count * wagonWidth);
            const availableWidth = container.clientWidth - 150 - 120;
            
            let scale = 1;
            if (actualWidth > availableWidth) {
                scale = availableWidth / actualWidth;
                if (scale < 0.2) scale = 0.2; 
            }

            trainWrapper.style.setProperty('--train-scale', scale);
            trainWrapper.style.transform = `scale(${scale})`;

            const scaledWidth = actualWidth * scale;
            const targetX = 150 + scaledWidth + 10; 
            
            girl.style.left = targetX + 'px';
            girl.style.bottom = '120px'; 
            girl.style.top = 'auto';
            
            if(!isRemote) {
                sendAction({ type: 'move', id: 'girl', left: targetX, top: girl.offsetTop });
            }
        }, 300);
    }

    btn.addEventListener('click', () => buildTrain(false));
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') buildTrain(false); });

    function makeDraggable(el) {
        let isDragLoc = false, startX, startY, initLeft, initTop;
        let lastSyncTime = 0;

        el.addEventListener('pointerdown', e => {
            isDragLoc = true;
            el.classList.add('dragging');
            el.setPointerCapture(e.pointerId);
            playGrab();
            
            startX = e.clientX; startY = e.clientY;
            const rect = el.getBoundingClientRect();
            const pRect = container.getBoundingClientRect();
            
            initLeft = (rect.left - pRect.left) / currentZoom;
            initTop = (rect.top - pRect.top) / currentZoom;
            
            el.style.transition = 'none'; 
            
            el.style.left = initLeft + 'px';
            el.style.top = initTop + 'px';
            el.style.bottom = 'auto'; 
        });

        el.addEventListener('pointermove', e => {
            if (!isDragLoc) return;
            // Врахування масштабу при переміщенні
            const newLeft = initLeft + (e.clientX - startX) / currentZoom;
            const newTop = initTop + (e.clientY - startY) / currentZoom;
            
            el.style.left = newLeft + 'px';
            el.style.top = newTop + 'px';

            // Синхронізація "весь шлях" з обмеженням частоти 
            const now = Date.now();
            if (now - lastSyncTime > 40) { // ~25 FPS
                sendAction({ type: 'move', id: el.id, left: newLeft, top: newTop });
                lastSyncTime = now;
            }
        });

        el.addEventListener('pointerup', e => {
            if(!isDragLoc) return;
            isDragLoc = false;
            el.classList.remove('dragging');
            el.releasePointerCapture(e.pointerId);
            el.style.transition = 'left 0.1s linear, top 0.1s linear';
            playPop();
            
            // Фінальна синхронізація
            sendAction({ type: 'move', id: el.id, left: parseFloat(el.style.left), top: parseFloat(el.style.top) });
        });
    }

    makeDraggable(document.getElementById('boy'));
    makeDraggable(girl);

    window.onload = () => buildTrain(false);

    // Запобігаємо нескінченному циклу при зміні орієнтації чи приховуванні панелі адреси на мобільних
    let lastWidth = window.innerWidth;
    window.addEventListener('resize', () => {
        if (window.innerWidth !== lastWidth) {
            lastWidth = window.innerWidth;
            girl.style.transition = 'none'; 
            buildTrain(false);
            setTimeout(() => girl.style.transition = 'left 0.1s linear, top 0.1s linear', 100);
        }
    });
</script>
</body>
</html>
