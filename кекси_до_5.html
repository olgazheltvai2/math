<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Кондитерська кексів</title>
  <style>
    /* ================= ОСНОВНІ СТИЛІ ТА СКИДАННЯ ================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
      background-color: #2c1810;
    }

    /* Головний ігровий контейнер на весь екран */
    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Фоновий шар пекарні */
    #bakery-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Анімація хмаринок у вікні */
    .cloud-anim-1 {
      animation: floatCloud 38s linear infinite;
    }
    .cloud-anim-2 {
      animation: floatCloud 52s linear infinite reverse;
    }
    @keyframes floatCloud {
      0% { transform: translateX(-180px); }
      100% { transform: translateX(450px); }
    }

    /* Анімація сонячних променів */
    .sun-ray {
      animation: pulseRay 6s ease-in-out infinite alternate;
    }
    @keyframes pulseRay {
      0% { opacity: 0.18; }
      100% { opacity: 0.36; }
    }

    /* Анімація підвісного кухонного начиння */
    .hanging-pan {
      transform-origin: 50% 0%;
      animation: swayPan 5s ease-in-out infinite alternate;
    }
    .hanging-pan.delay {
      animation-duration: 6.5s;
      animation-direction: alternate-reverse;
    }
    @keyframes swayPan {
      0% { transform: rotate(-2.5deg); }
      100% { transform: rotate(2.5deg); }
    }

    /* ================= НАВІГАЦІЙНІ КНОПКИ (НАЗАД / ДАЛІ) ================= */
    .nav-controls {
      position: fixed;
      top: 18px;
      right: 22px;
      display: flex;
      gap: 14px;
      z-index: 100;
    }

    .nav-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid #f7d694;
      background: radial-gradient(circle at 30% 30%, #d97b43, #8c3b14);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45), inset 0 3px 6px rgba(255, 235, 190, 0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
    }

    .nav-btn:hover {
      transform: scale(1.1);
      filter: brightness(1.12);
    }

    .nav-btn:active {
      transform: scale(0.92);
    }

    .nav-btn svg {
      width: 30px;
      height: 30px;
      fill: #fff6e0;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
    }

    /* ================= ЖИВИЙ ПЕРСОНАЖ (КІТ-КОНДИТЕР) ================= */
    #chef-character {
      position: absolute;
      left: 2%;
      bottom: 24%;
      width: clamp(150px, 16vw, 240px);
      height: clamp(190px, 21vw, 310px);
      z-index: 15;
      pointer-events: none;
      transform-origin: bottom center;
      animation: chefBreathe 3.2s ease-in-out infinite;
    }

    @keyframes chefBreathe {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-4px) scaleY(1.02); }
    }

    /* Емоції котика */
    #chef-character.happy {
      animation: chefJump 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 2;
    }
    #chef-character.celebrate {
      animation: chefDance 0.7s ease-in-out infinite alternate;
    }
    #chef-character.oops {
      animation: chefShake 0.5s ease-in-out;
    }

    @keyframes chefJump {
      0%, 100% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-28px) scale(1.06, 0.95) rotate(-4deg); }
      75% { transform: translateY(-10px) scale(0.98, 1.03) rotate(4deg); }
    }

    @keyframes chefDance {
      0% { transform: translateY(0) rotate(-6deg) scale(1.04); }
      100% { transform: translateY(-20px) rotate(6deg) scale(1.08); }
    }

    @keyframes chefShake {
      0%, 100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(-10px) rotate(-6deg); }
      40% { transform: translateX(10px) rotate(6deg); }
      60% { transform: translateX(-8px) rotate(-4deg); }
      80% { transform: translateX(8px) rotate(4deg); }
    }

    .cat-tail {
      transform-origin: 70px 210px;
      animation: tailWag 2.6s ease-in-out infinite alternate;
    }
    @keyframes tailWag {
      0% { transform: rotate(-12deg); }
      100% { transform: rotate(16deg); }
    }

    .cat-blink {
      transform-origin: center;
      animation: blinkEyes 4.5s infinite;
    }
    @keyframes blinkEyes {
      0%, 94%, 98%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }

    /* ================= ПОЛИЦЯ З КЕКСАМИ ================= */
    #cupcakes-zone {
      position: relative;
      z-index: 20;
      width: 82%;
      margin: 4vh 3% 0 auto;
      height: 52vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    /* Ряд кексів опущений вниз так, щоб денця кексів стояли прямо на поверхні полиці */
    #cupcakes-row {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding: 0 2%;
      margin-bottom: -24px;
      z-index: 23;
    }

    /* Окремий кекс із фіксованим співвідношенням сторін (без пустоти знизу) */
    .cupcake-slot {
      position: relative;
      width: clamp(120px, 14.5vw, 205px);
      aspect-ratio: 220 / 252;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s;
      transform-origin: bottom center;
    }

    .cupcake-slot:hover, .cupcake-slot.drop-hover {
      transform: scale(1.06) translateY(-4px);
      filter: drop-shadow(0 0 18px rgba(255, 230, 140, 0.75));
    }

    /* Різноманітні анімації успіху для кексів */
    .cupcake-slot.joy-bounce {
      animation: cupcakeJoyBounce 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .cupcake-slot.joy-spin {
      animation: cupcakeJoySpin 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .cupcake-slot.joy-jelly {
      animation: cupcakeJoyJelly 0.85s ease-in-out;
    }

    @keyframes cupcakeJoyBounce {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      25% { transform: translateY(6px) scale(1.12, 0.88); }
      50% { transform: translateY(-28px) scale(0.92, 1.12); }
      75% { transform: translateY(3px) scale(1.05, 0.95); }
    }

    @keyframes cupcakeJoySpin {
      0% { transform: scale(1) rotate(0deg); }
      35% { transform: translateY(-24px) scale(1.12) rotate(-10deg); }
      70% { transform: translateY(-14px) scale(1.12) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes cupcakeJoyJelly {
      0%, 100% { transform: scale(1, 1); }
      20% { transform: scale(1.18, 0.82); }
      40% { transform: scale(0.86, 1.16) translateY(-16px); }
      60% { transform: scale(1.10, 0.90); }
      80% { transform: scale(0.96, 1.04); }
    }

    /* Анімація помилки для кексу */
    .cupcake-slot.wrong-wobble {
      animation: wrongWobble 0.45s ease-in-out;
    }
    @keyframes wrongWobble {
      0%, 100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(-12px) rotate(-5deg); }
      40% { transform: translateX(12px) rotate(5deg); }
      60% { transform: translateX(-8px) rotate(-3deg); }
      80% { transform: translateX(8px) rotate(3deg); }
    }

    /* Святкова хвиля після прикрашання всіх кексів */
    .cupcake-slot.victory-wave {
      animation: victoryWave 0.9s ease-in-out infinite alternate;
    }
    @keyframes victoryWave {
      0% { transform: translateY(0) rotate(-3deg) scale(1); }
      100% { transform: translateY(-20px) rotate(3deg) scale(1.06); }
    }

    .cupcake-svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Місце посадки прикраси на вершечку крему */
    .topping-mount {
      position: absolute;
      top: -8%;
      left: 50%;
      transform: translateX(-50%) scale(0);
      width: 72%;
      height: 52%;
      pointer-events: none;
      z-index: 25;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .topping-mount.placed {
      transform: translateX(-50%) scale(1);
    }

    /* Дерев'яна полиця під кексами */
    #wooden-shelf {
      width: 100%;
      height: 56px;
      z-index: 21;
      filter: drop-shadow(0 16px 20px rgba(25, 10, 2, 0.65));
    }

    /* ================= НИЖНЯ ТАЦЯ З ПРИКРАСАМИ ================= */
    #tray-zone {
      position: relative;
      z-index: 30;
      width: 100%;
      height: 34vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4%;
    }

    #pastry-tray {
      position: relative;
      width: min(94%, 1150px);
      height: 82%;
      border-radius: 36px;
      background:
        radial-gradient(circle at 50% 25%, #fff8eb 0%, #f3dec0 65%, #dfc096 100%);
      border: 6px solid #c88d48;
      box-shadow:
        0 16px 35px rgba(0, 0, 0, 0.65),
        inset 0 4px 12px rgba(255, 255, 255, 0.8),
        inset 0 -8px 18px rgba(139, 87, 35, 0.35);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 3%;
    }

    /* Декоративний візерунок серветки на таці */
    #pastry-tray::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 26px;
      border: 3px dashed #d6a467;
      background-image: radial-gradient(#e6c494 1.5px, transparent 1.5px);
      background-size: 18px 18px;
      opacity: 0.65;
      pointer-events: none;
    }

    /* Слоти на таці для кожної прикраси */
    .tray-slot {
      position: relative;
      width: clamp(98px, 12.5vw, 170px);
      height: clamp(98px, 12.5vw, 170px);
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #f9ead2, #dec098 75%, #c7a070 100%);
      box-shadow:
        inset 0 5px 10px rgba(90, 50, 15, 0.35),
        0 3px 6px rgba(255, 250, 240, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 32;
    }

    /* Сама інтерактивна прикраса */
    .topping-item {
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
      z-index: 35;
    }

    .topping-item:hover {
      transform: scale(1.1) translateY(-5px);
      filter: drop-shadow(0 10px 12px rgba(60, 25, 5, 0.4));
    }

    /* Стан обраної прикраси (при кліку) */
    .topping-item.selected {
      transform: scale(1.16) translateY(-12px);
      filter: drop-shadow(0 0 16px #ffae00) drop-shadow(0 12px 14px rgba(0,0,0,0.45));
      animation: selectedPulse 1s ease-in-out infinite alternate;
    }

    @keyframes selectedPulse {
      0% { transform: scale(1.13) translateY(-10px) rotate(-3deg); }
      100% { transform: scale(1.2) translateY(-15px) rotate(3deg); }
    }

    /* Стан під час перетягування */
    .topping-item.dragging {
      position: fixed;
      width: clamp(108px, 13.5vw, 180px);
      height: clamp(108px, 13.5vw, 180px);
      pointer-events: none;
      z-index: 999;
      cursor: grabbing;
      transition: none;
      filter: drop-shadow(0 18px 20px rgba(0, 0, 0, 0.5));
    }

    .topping-item.used {
      opacity: 0;
      pointer-events: none;
      transform: scale(0);
    }

    .topping-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Коли прикраса вже встановлена на кекс — робимо жетон із цифрою акуратним збоку */
    .topping-mount .answer-badge {
      transform: translate(122px, 128px) scale(0.82);
    }

    /* Полотно для частинок (іскорки, конфетті, цукрова посипка) */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 200;
    }
  </style>
</head>
<body>

<div id="game-stage">
  <!-- ================= СЮЖЕТНИЙ ЖИВИЙ ФОН КОНДИТЕРСЬКОЇ (SVG) ================= -->
  <svg id="bakery-bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Градієнт теплої стіни пекарні -->
      <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#6b3426"/>
        <stop offset="45%" stop-color="#8b4732"/>
        <stop offset="72%" stop-color="#5a291c"/>
        <stop offset="100%" stop-color="#38170e"/>
      </linearGradient>

      <!-- Патерн фактурної цегляної/кахельної стіни -->
      <pattern id="brickPattern" width="120" height="60" patternUnits="userSpaceOnUse">
        <rect width="120" height="60" fill="none"/>
        <path d="M 0 30 L 120 30 M 60 0 L 60 30 M 0 30 L 0 60 M 120 30 L 120 60" stroke="#4c1f13" stroke-width="3" opacity="0.35"/>
        <rect x="4" y="4" width="52" height="22" rx="4" fill="#a45a43" opacity="0.18"/>
        <rect x="64" y="34" width="52" height="22" rx="4" fill="#703120" opacity="0.22"/>
      </pattern>

      <!-- Візерунок шпалер у смужку -->
      <pattern id="stripeWallpaper" width="80" height="80" patternUnits="userSpaceOnUse">
        <rect width="40" height="80" fill="#7d3b29" opacity="0.22"/>
        <circle cx="20" cy="40" r="4" fill="#d99b66" opacity="0.2"/>
        <circle cx="60" cy="20" r="3" fill="#d99b66" opacity="0.15"/>
      </pattern>

      <!-- Небо за вікном -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#68c4ff"/>
        <stop offset="65%" stop-color="#b8eaff"/>
        <stop offset="100%" stop-color="#fef9d7"/>
      </linearGradient>

      <!-- Мідний градієнт для каструль і пателень -->
      <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffd2a6"/>
        <stop offset="35%" stop-color="#e07a42"/>
        <stop offset="75%" stop-color="#9c3d16"/>
        <stop offset="100%" stop-color="#5c1f06"/>
      </linearGradient>

      <!-- Дерев'яна стільниця внизу -->
      <linearGradient id="counterWood" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#8c4a27"/>
        <stop offset="12%" stop-color="#6e3518"/>
        <stop offset="100%" stop-color="#3b1909"/>
      </linearGradient>

      <!-- Сонячне проміння з вікна -->
      <linearGradient id="sunbeamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff6c2" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#fff6c2" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <!-- Стіна пекарні -->
    <rect width="1600" height="900" fill="url(#wallGrad)"/>
    <rect width="1600" height="650" fill="url(#stripeWallpaper)"/>
    <rect width="1600" height="650" fill="url(#brickPattern)"/>

    <!-- Велике аркове вікно зліва-посередині -->
    <g transform="translate(80, 45)">
      <!-- Світіння навколо вікна -->
      <rect x="-15" y="-15" width="370" height="440" rx="185" fill="#ffdf9e" opacity="0.12"/>
      <!-- Пейзаж за вікном -->
      <clipPath id="windowClip">
        <rect x="0" y="0" width="340" height="410" rx="170"/>
      </clipPath>
      <g clip-path="url(#windowClip)">
        <rect width="340" height="410" fill="url(#skyGrad)"/>
        <!-- Сонечко -->
        <circle cx="85" cy="95" r="42" fill="#fff394" opacity="0.9"/>
        <circle cx="85" cy="95" r="58" fill="#fff394" opacity="0.3"/>

        <!-- Живі хмаринки -->
        <g class="cloud-anim-1" opacity="0.9">
          <ellipse cx="90" cy="130" rx="45" ry="22" fill="#ffffff"/>
          <ellipse cx="120" cy="122" rx="35" ry="26" fill="#ffffff"/>
          <ellipse cx="65" cy="136" rx="28" ry="18" fill="#ffffff"/>
        </g>
        <g class="cloud-anim-2" opacity="0.75">
          <ellipse cx="230" cy="190" rx="50" ry="20" fill="#ffffff"/>
          <ellipse cx="260" cy="182" rx="32" ry="22" fill="#ffffff"/>
        </g>

        <!-- Далекі зелені пагорби та дерева -->
        <path d="M-20 410 Q 90 290 220 350 T 370 330 L 370 410 Z" fill="#7ec850"/>
        <path d="M-20 410 Q 150 330 290 365 T 370 360 L 370 410 Z" fill="#5aa832"/>
        <!-- Дах сусідньої кав'ярні -->
        <polygon points="210,360 285,305 355,360" fill="#d9534f"/>
        <rect x="225" y="360" width="115" height="60" fill="#fae3c6"/>
      </g>

      <!-- Дерев'яна рама вікна -->
      <rect x="0" y="0" width="340" height="410" rx="170" fill="none" stroke="#4a2110" stroke-width="18"/>
      <rect x="4" y="4" width="332" height="402" rx="166" fill="none" stroke="#8c4b2b" stroke-width="6"/>
      <line x1="170" y1="0" x2="170" y2="410" stroke="#5c2914" stroke-width="12"/>
      <line x1="0" y1="215" x2="340" y2="215" stroke="#5c2914" stroke-width="12"/>
      <!-- Текстильні фіранки -->
      <path d="M 5 140 Q 95 160 115 40 C 60 10 15 65 5 140 Z" fill="#e85d56" stroke="#9e2a25" stroke-width="3"/>
      <path d="M 335 140 Q 245 160 225 40 C 280 10 325 65 335 140 Z" fill="#e85d56" stroke="#9e2a25" stroke-width="3"/>
      <!-- Підвіконня -->
      <rect x="-22" y="396" width="384" height="26" rx="8" fill="#5c2812" stroke="#361406" stroke-width="3"/>
    </g>

    <!-- Сонячні промені з вікна -->
    <polygon class="sun-ray" points="160,120 420,120 980,900 420,900" fill="url(#sunbeamGrad)"/>
    <polygon class="sun-ray" points="220,240 410,240 1250,900 780,900" fill="url(#sunbeamGrad)"/>

    <!-- Підвісна полиця з мідним посудом угорі -->
    <g transform="translate(520, 20)">
      <rect x="0" y="25" width="440" height="14" rx="7" fill="#3a1c10" stroke="#703d25" stroke-width="2"/>
      <!-- Пательня 1 -->
      <g class="hanging-pan" transform="translate(85, 35)">
        <rect x="-3" y="0" width="6" height="48" rx="3" fill="#4a2512"/>
        <circle cx="0" cy="88" r="44" fill="url(#copperGrad)" stroke="#4a1906" stroke-width="3"/>
        <circle cx="-12" cy="75" r="26" fill="#ffdfb8" opacity="0.25"/>
      </g>
      <!-- Віничок -->
      <g class="hanging-pan delay" transform="translate(195, 35)">
        <rect x="-4" y="0" width="8" height="42" rx="4" fill="#c97a40"/>
        <ellipse cx="0" cy="68" rx="16" ry="28" fill="none" stroke="#e6d5c3" stroke-width="3"/>
        <ellipse cx="0" cy="68" rx="8" ry="28" fill="none" stroke="#e6d5c3" stroke-width="2.5"/>
      </g>
      <!-- Пательня 2 -->
      <g class="hanging-pan" transform="translate(310, 35)">
        <rect x="-3" y="0" width="6" height="40" rx="3" fill="#4a2512"/>
        <circle cx="0" cy="72" r="35" fill="url(#copperGrad)" stroke="#4a1906" stroke-width="3"/>
        <circle cx="-8" cy="62" r="18" fill="#ffdfb8" opacity="0.25"/>
      </g>
    </g>

    <!-- Декоративні баночки зі спеціями та борошном на фоні справа -->
    <g transform="translate(1330, 80)" opacity="0.85">
      <rect x="-20" y="130" width="230" height="18" rx="6" fill="#4d2110"/>
      <!-- Банка з полуничним джемом -->
      <rect x="5" y="45" width="68" height="85" rx="14" fill="#d9384a" stroke="#ffd6dc" stroke-width="3"/>
      <rect x="12" y="34" width="54" height="14" rx="5" fill="#e09f5a"/>
      <ellipse cx="24" cy="75" rx="7" ry="22" fill="#ffffff" opacity="0.35"/>
      <!-- Банка з какао -->
      <rect x="95" y="30" width="82" height="100" rx="16" fill="#6b371c" stroke="#ebd1b7" stroke-width="3"/>
      <rect x="105" y="16" width="62" height="16" rx="5" fill="#e09f5a"/>
      <ellipse cx="118" cy="70" rx="8" ry="28" fill="#ffffff" opacity="0.28"/>

<script>
  /* =========================================================================
     1. ТИХИЙ СИНТЕЗАТОР ЗВУКІВ (Web Audio API)
     Усі звуки мають низький рівень гучності, щоб звучати м'яко та приємно.
     ========================================================================= */
  class QuietSoundEngine {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    // Тихий звук взяття прикраси
    playPick() {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(340, now);
      osc.frequency.exponentialRampToValueAtTime(580, now + 0.09);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.028, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.11);
    }

    // 5 різних варіантів тихих музикальних фідбеків при правильній відповіді
    playCorrect(variantIndex = 0) {
      this.init();
      const now = this.ctx.currentTime;

      const melodies = [
        [523.25, 659.25, 783.99, 1046.50],
        [587.33, 739.99, 880.00, 1174.66],
        [659.25, 783.99, 987.77, 1318.51],
        [440.00, 554.37, 659.25, 880.00],
        [493.88, 659.25, 783.99, 987.77]
      ];

      const notes = melodies[variantIndex % melodies.length];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = idx % 2 === 0 ? 'triangle' : 'sine';
        const startTime = now + idx * 0.065;

        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.001, startTime);
        gain.gain.linearRampToValueAtTime(0.035, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.36);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.38);
      });
    }

    // Тихий м'який звук помилки
    playWrong() {
      this.init();
      const now = this.ctx.currentTime;
      [210, 165].forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const start = now + i * 0.11;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, start);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.75, start + 0.1);

        gain.gain.setValueAtTime(0.001, start);
        gain.gain.linearRampToValueAtTime(0.03, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.12);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(start);
        osc.stop(start + 0.13);
      });
    }

    // Ніжна святкова мелодія при завершенні всього рівня
    playLevelWin() {
      this.init();
      const now = this.ctx.currentTime;
      const fanfare = [
        { f: 523.25, t: 0.00, d: 0.22 },
        { f: 659.25, t: 0.11, d: 0.22 },
        { f: 783.99, t: 0.22, d: 0.22 },
        { f: 1046.50, t: 0.34, d: 0.45 },
        { f: 880.00, t: 0.52, d: 0.20 },
        { f: 1046.50, t: 0.68, d: 0.65 }
      ];

      fanfare.forEach(note => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        const st = now + note.t;
        osc.frequency.setValueAtTime(note.f, st);

        gain.gain.setValueAtTime(0.001, st);
        gain.gain.linearRampToValueAtTime(0.04, st + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, st + note.d);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(st);
        osc.stop(st + note.d + 0.02);
      });
    }
  }

  /* =========================================================================
     4. СИСТЕМА АКТИВНИХ ВІЗУАЛЬНИХ ЕФЕКТІВ (ЧАСТИНКИ, КОНФЕТТІ, ЗІРОЧКИ)
     ========================================================================= */
  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function spawnBurst(x, y, count = 36) {
    const colors = ['#ff4d79', '#ffbe0b', '#3a86ff', '#52b788', '#ff9ebb', '#ffffff', '#b5838d'];
    const shapes = ['circle', 'star', 'sprinkle'];

    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
      const speed = 3 + Math.random() * 8;
      particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2.5,
        gravity: 0.22,
        size: 5 + Math.random() * 7,
        color: colors[Math.floor(Math.random() * colors.length)],
        shape: shapes[Math.floor(Math.random() * shapes.length)],
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.2,
        alpha: 1,
        decay: 0.014 + Math.random() * 0.012
      });
    }
  }

  function spawnGrandCelebration() {
    for (let i = 0; i < 4; i++) {
      setTimeout(() => {
        const rx = window.innerWidth * (0.2 + Math.random() * 0.6);
        const ry = window.innerHeight * (0.25 + Math.random() * 0.35);
        spawnBurst(rx, ry, 45);
      }, i * 180);
    }
  }

  function drawStar(cx, cy, spikes, outerR, innerR) {
    let rot = (Math.PI / 2) * 3;
    let x = cx;
    let y = cy;
    const step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerR);
    for (let i = 0; i < spikes; i++) {
      x = cx + Math.cos(rot) * outerR;
      y = cy + Math.sin(rot) * outerR;
      ctx.lineTo(x, y);
      rot += step;

      x = cx + Math.cos(rot) * innerR;
      y = cy + Math.sin(rot) * innerR;
      ctx.lineTo(x, y);
      rot += step;
    }
    ctx.lineTo(cx, cy - outerR);
    ctx.closePath();
    ctx.fill();
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.rotation += p.vRot;
      p.alpha -= p.decay;

      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.color;

      if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.6, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.shape === 'sprinkle') {
        ctx.beginPath();
        ctx.roundRect(-p.size, -p.size * 0.35, p.size * 2, p.size * 0.7, 4);
        ctx.fill();
      } else {
        drawStar(0, 0, 5, p.size, p.size * 0.45);
      }
      ctx.restore();
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

      chefEl.classList.add('happy');
      catMouth.setAttribute('d', 'M 100 150 Q 120 174 140 150 Z');
      catMouth.setAttribute('fill', '#ff6b8b');
      emotionTimer = setTimeout(() => setChefEmotion('idle'), 1200);
    } else if (state === 'oops') {
      chefEl.classList.add('oops');
      catMouth.setAttribute('d', 'M 114 155 A 6 6 0 1 0 126 155 A 6 6 0 1 0 114 155');
      catMouth.setAttribute('fill', '#632708');
      emotionTimer = setTimeout(() => setChefEmotion('idle'), 900);
    } else if (state === 'celebrate') {
      chefEl.classList.add('celebrate');
      catMouth.setAttribute('d', 'M 98 148 Q 120 178 142 148 Z');
      catMouth.setAttribute('fill', '#ff6b8b');

  /* =========================================================================
     6. ІСТОРІЯ РІВНІВ, ГЕНЕРАЦІЯ ТА ЛОГІКА ВЗАЄМОДІЇ
     ========================================================================= */
  const cupcakesRow = document.getElementById('cupcakes-row');
  const pastryTray = document.getElementById('pastry-tray');

  let levelHistory = [];
  let currentLevelIdx = -1;
  let selectedToppingEl = null;
  let completedCount = 0;

  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function generateLevelData() {
    const cupcakeAnswers = shuffle([1, 2, 3, 4, 5]);
    const themes = shuffle(CUPCAKE_THEMES);
    const toppingTypes = shuffle(TOPPING_TYPES);
    const toppingAnswers = shuffle([1, 2, 3, 4, 5]);

    const cupcakes = cupcakeAnswers.map((ans, idx) => {
      const pool = EXAMPLES_BY_ANSWER[ans];
      const expr = pool[Math.floor(Math.random() * pool.length)];
      return {
        answer: ans,
        expression: expr,
        theme: themes[idx]
      };
    });

    const toppings = toppingAnswers.map((ans, idx) => ({
      answer: ans,
      type: toppingTypes[idx]
    }));

    return { cupcakes, toppings };
  }

  function renderLevel(levelData) {
    completedCount = 0;
    selectedToppingEl = null;
    setChefEmotion('idle');

    cupcakesRow.innerHTML = '';
    pastryTray.innerHTML = '';

    // 1. Створюємо 5 кексів на полиці
    levelData.cupcakes.forEach((cup, idx) => {
      const slot = document.createElement('div');
      slot.className = 'cupcake-slot';
      slot.dataset.answer = cup.answer;
      slot.dataset.index = idx;
      slot.dataset.decorated = 'false';

      const mount = document.createElement('div');
      mount.className = 'topping-mount';

      slot.innerHTML = createCupcakeSVG(cup.theme, cup.expression, idx);
      slot.appendChild(mount);

      slot.addEventListener('click', () => {
        if (selectedToppingEl && slot.dataset.decorated === 'false') {
          tryPlaceTopping(selectedToppingEl, slot);
        }
      });

      cupcakesRow.appendChild(slot);
    });

    // 2. Створюємо 5 прикрас на таці
    levelData.toppings.forEach((top) => {
      const traySlot = document.createElement('div');
      traySlot.className = 'tray-slot';

      const item = document.createElement('div');
      item.className = 'topping-item';
      item.dataset.answer = top.answer;
      item.dataset.type = top.type;
      item.innerHTML = createToppingSVG(top.type, top.answer);

      setupToppingInteractions(item);

      traySlot.appendChild(item);
      pastryTray.appendChild(traySlot);
    });
  }

  function setupToppingInteractions(item) {
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let hasMoved = false;

    item.addEventListener('pointerdown', (e) => {
      if (item.classList.contains('used')) return;
      e.preventDefault();
      sound.playPick();

      startX = e.clientX;
      startY = e.clientY;
      hasMoved = false;
      isDragging = true;

      item.setPointerCapture(e.pointerId);
    });

    item.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if (!hasMoved && Math.hypot(dx, dy) > 8) {
        hasMoved = true;
        if (selectedToppingEl) {
          selectedToppingEl.classList.remove('selected');
          selectedToppingEl = null;
        }
        item.classList.add('dragging');
      }

      if (hasMoved) {
        const rect = item.getBoundingClientRect();
        item.style.left = `${e.clientX - rect.width / 2}px`;
        item.style.top = `${e.clientY - rect.height / 2}px`;

        highlightHoveredCupcake(e.clientX, e.clientY);
      }
    });

    item.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      item.releasePointerCapture(e.pointerId);
      clearCupcakeHighlights();

      if (hasMoved) {
        item.classList.remove('dragging');
        item.style.left = '';
        item.style.top = '';

        const targetCupcake = findCupcakeAtPoint(e.clientX, e.clientY);
        if (targetCupcake && targetCupcake.dataset.decorated === 'false') {
          tryPlaceTopping(item, targetCupcake);
        }
      } else {
        if (selectedToppingEl === item) {
          item.classList.remove('selected');
          selectedToppingEl = null;
        } else {
          if (selectedToppingEl) selectedToppingEl.classList.remove('selected');
          selectedToppingEl = item;
          item.classList.add('selected');
        }
      }
    });
  }

  function findCupcakeAtPoint(x, y) {
    const slots = document.querySelectorAll('.cupcake-slot');
    for (const slot of slots) {
      const r = slot.getBoundingClientRect();
      if (x >= r.left - 15 && x <= r.right + 15 && y >= r.top - 25 && y <= r.bottom + 15) {
        return slot;
      }
    }
    return null;
  }

  function highlightHoveredCupcake(x, y) {
    clearCupcakeHighlights();
    const target = findCupcakeAtPoint(x, y);
    if (target && target.dataset.decorated === 'false') {
      target.classList.add('drop-hover');
    }
  }

  function clearCupcakeHighlights() {
    document.querySelectorAll('.cupcake-slot.drop-hover').forEach(el => {
      el.classList.remove('drop-hover');
    });
  }

  function tryPlaceTopping(toppingEl, cupcakeSlot) {
    const toppingAnswer = toppingEl.dataset.answer;
    const cupcakeAnswer = cupcakeSlot.dataset.answer;
    const cupcakeIdx = Number(cupcakeSlot.dataset.index);

    if (toppingAnswer === cupcakeAnswer) {
      cupcakeSlot.dataset.decorated = 'true';
      toppingEl.classList.remove('selected');
      toppingEl.classList.add('used');
      if (selectedToppingEl === toppingEl) selectedToppingEl = null;

      const mount = cupcakeSlot.querySelector('.topping-mount');
      mount.innerHTML = createToppingSVG(toppingEl.dataset.type, toppingAnswer);
      requestAnimationFrame(() => mount.classList.add('placed'));

      const joyAnimations = ['joy-bounce', 'joy-spin', 'joy-jelly'];
      const chosenAnim = joyAnimations[cupcakeIdx % joyAnimations.length];
      cupcakeSlot.classList.remove('joy-bounce', 'joy-spin', 'joy-jelly');
      void cupcakeSlot.offsetWidth;
      cupcakeSlot.classList.add(chosenAnim);

      sound.playCorrect(cupcakeIdx);
      const rect = cupcakeSlot.getBoundingClientRect();
      spawnBurst(rect.left + rect.width / 2, rect.top + rect.height * 0.28, 38);
      setChefEmotion('happy');

      completedCount++;
      if (completedCount === 5) {
        setTimeout(() => {
          sound.playLevelWin();
          setChefEmotion('celebrate');
          spawnGrandCelebration();
          document.querySelectorAll('.cupcake-slot').forEach((slot, i) => {
            slot.style.animationDelay = `${i * 0.12}s`;
            slot.classList.add('victory-wave');
          });
        }, 450);
      }
    } else {
      sound.playWrong();
      setChefEmotion('oops');
      cupcakeSlot.classList.remove('wrong-wobble');
      void cupcakeSlot.offsetWidth;
      cupcakeSlot.classList.add('wrong-wobble');
    }
  }

  /* =========================================================================
     7. КНОПКИ ПЕРЕХОДУ МІЖ РІВНЯМИ (ДАЛІ / НАЗАД)
     ========================================================================= */
  function goNextLevel() {
    sound.playPick();
    if (currentLevelIdx < levelHistory.length - 1) {
      currentLevelIdx++;
    } else {
      levelHistory.push(generateLevelData());
      currentLevelIdx = levelHistory.length - 1;
    }
    renderLevel(levelHistory[currentLevelIdx]);
  }

  function goPrevLevel() {
    sound.playPick();
    if (currentLevelIdx > 0) {
      currentLevelIdx--;
      renderLevel(levelHistory[currentLevelIdx]);
    } else {
      levelHistory[0] = generateLevelData();
      renderLevel(levelHistory[0]);
    }
  }

  document.getElementById('btn-next').addEventListener('click', goNextLevel);
  document.getElementById('btn-prev').addEventListener('click', goPrevLevel);

  // Запуск першого рівня
  goNextLevel();
</script>

</body>
</html>
