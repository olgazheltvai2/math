<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Гра: 10 Негренят</title>
    <!-- Firebase Compat Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <style>
        /* Базові стилі */
        * { box-sizing: border-box; font-family: Arial, sans-serif; user-select: none; }
        body { 
            margin: 0; padding: 0; height: 100vh; overflow: hidden; 
            background-color: #2c3e50; background-size: cover; background-position: center; 
            display: flex; flex-direction: column; transition: background-image 0.5s ease;
        }

        /* Контейнер гри (Прозорий) */
        .transparent-container {
            background: transparent; flex-grow: 1; display: flex; flex-direction: column; 
            justify-content: space-between; padding: 10px; width: 100%; max-width: 1200px; margin: 0 auto;
        }

        /* Опоненти */
        .opponents-area {
            display: flex; justify-content: space-around; align-items: center; min-height: 80px;
            background: rgba(0, 0, 0, 0.3); border-radius: 15px; padding: 10px; flex-wrap: wrap; gap: 10px;
        }
        .opponent {
            display: flex; flex-direction: column; align-items: center; color: white; 
            background: rgba(0,0,0,0.5); padding: 8px 20px; border-radius: 12px; font-weight: bold;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
        }
        .opponent.active-turn { box-shadow: 0 0 15px #2ecc71; border: 2px solid #2ecc71; transform: scale(1.05); }
        .opponent.highlight-error { transform: scale(1.2); box-shadow: 0 0 25px #e74c3c; border-color: #e74c3c; }
        .opponent-icons { display: flex; gap: 15px; font-size: 1.4rem; margin-top: 5px; }

        /* Центр столу */
        .table-area {
            display: flex; flex-direction: column; justify-content: center; align-items: center; flex-grow: 1; gap: 20px;
            position: relative;
        }
        
        /* Стартовий екран очікування */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center;
            z-index: 50; border-radius: 15px; flex-direction: column; gap: 15px;
            backdrop-filter: blur(3px);
        }
        .big-start-btn {
            padding: 20px 40px; font-size: 32px; background: #2ecc71; color: white;
            border: none; border-radius: 20px; cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            transition: transform 0.2s, background 0.2s; font-weight: bold;
        }
        .big-start-btn:hover { background: #27ae60; transform: scale(1.1); }

        .cards-center { display: flex; justify-content: center; align-items: center; gap: 30px; }
        
        /* Картки (Збільшені, без рамок, contain) */
        .card {
            width: 90px; height: 125px; border-radius: 15px; 
            background-size: contain; background-position: center; background-repeat: no-repeat;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5); transition: transform 0.2s, box-shadow 0.2s, filter 0.3s; cursor: pointer;
            display: flex; justify-content: center; align-items: center; color: transparent;
            border: none; background-color: transparent;
        }
        .card:hover { transform: translateY(-10px); box-shadow: 0 10px 20px rgba(0,0,0,0.6); }
        .card.large { width: 130px; height: 185px; }
        .card.empty { border: 2px dashed rgba(255,255,255,0.5); background: rgba(0,0,0,0.2); box-shadow: none; cursor: default;}
        .card.empty:hover { transform: none; }
        
        .stack-count { 
            position: absolute; top: -10px; right: -10px; background: #e74c3c; color: white; 
            border-radius: 50%; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; 
            font-weight: bold; border: 2px solid white; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Зона вводу та операцій */
        .interaction-area {
            display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 60px;
        }
        .operations { display: none; gap: 10px; }
        .op-btn {
            background: #f39c12; border: none; border-radius: 50%; width: 50px; height: 50px;
            font-size: 24px; color: white; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            display: flex; justify-content: center; align-items: center;
        }
        .op-btn:hover { background: #e67e22; transform: scale(1.1); }
        
        .input-group { display: none; align-items: center; gap: 10px; }
        .input-group input {
            font-size: 28px; width: 80px; text-align: center; border-radius: 10px; border: 3px solid white;
            background: rgba(255,255,255,0.8); padding: 5px; font-weight: bold; color: #333; outline: none;
        }
        .submit-btn {
            background: #2ecc71; border: none; border-radius: 10px; width: 50px; height: 50px;
            font-size: 24px; color: white; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            display: flex; justify-content: center; align-items: center;
        }
        .submit-btn:hover { background: #27ae60; transform: scale(1.05); }

        /* Моя зона */
        .my-area {
            display: flex; flex-direction: column; align-items: center; background: rgba(0, 0, 0, 0.4);
            border-radius: 15px 15px 0 0; padding: 20px; gap: 15px; position: relative;
            transition: box-shadow 0.3s, border-top 0.3s;
        }
        .my-area.my-turn-active {
            box-shadow: inset 0 0 30px rgba(46, 204, 113, 0.4);
            border-top: 3px solid #2ecc71;
            background: rgba(0, 0, 0, 0.6);
        }
        .my-hand { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; min-height: 185px; align-items: center; }
        .my-stats { display: flex; gap: 20px; color: white; font-size: 1.8rem; font-weight: bold; align-items: center;}
        
        /* Кнопки керування */
        .controls { display: flex; gap: 10px; position: absolute; top: -50px; right: 10px; }
        .ctrl-btn {
            background: rgba(255,255,255,0.2); border: 2px solid white; border-radius: 50%; width: 45px; height: 45px;
            font-size: 20px; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(5px); transition: background 0.2s;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.5); }

        /* Theme Manager */
        #settings-btn {
            position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); color: white;
            border: 2px solid white; border-radius: 50%; width: 50px; height: 50px; font-size: 24px;
            cursor: pointer; z-index: 1000; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.2s;
        }
        #settings-btn:hover { transform: rotate(45deg); }
        
        #theme-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1001; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        #theme-content {
            background: #34495e; width: 90%; max-width: 600px; max-height: 60vh; border-radius: 15px;
            padding: 20px; overflow-y: auto; border: 2px solid white;
        }
        .theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; }
        .theme-item {
            position: relative; cursor: pointer; border-radius: 10px; overflow: hidden; height: 80px;
            border: 2px solid transparent; transition: 0.2s; background-size: cover; background-position: center;
        }
        .theme-item:hover { border-color: #2ecc71; transform: scale(1.05); }
        .theme-title {
            position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); color: white;
            text-align: center; font-size: 12px; padding: 4px 0; font-weight: bold;
        }

        /* Заглушка та секретні поля */
        #block-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 9999; justify-content: center; align-items: center;
            color: #e74c3c; font-size: 3rem; font-weight: bold; text-transform: uppercase; text-align: center;
        }
        .secret-input { color: transparent !important; selection: transparent; }
        .secret-input::selection { background: transparent; color: transparent; }

        /* Анімації */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.4s ease-in-out; }
        
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .feedback-icon {
            position: absolute; font-size: 100px; pointer-events: none; opacity: 0; z-index: 100;
        }
        
        #version { 
            position: fixed; top: 15px; left: 15px; 
            background: rgba(0, 0, 0, 0.8); color: #2ecc71; 
            padding: 10px 15px; border-radius: 8px; font-size: 16px; 
            font-weight: bold; border: 2px solid #2ecc71;
            z-index: 1000; pointer-events: none; text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        
        /* Mobile adjustments */
        @media (max-width: 600px) {
            .card.large { width: 100px; height: 140px; }
            .card { width: 70px; height: 100px; }
            .my-area { padding: 10px; gap: 5px; }
            .input-group input { width: 60px; font-size: 20px; }
            .my-hand { min-height: 140px; gap: 10px; }
            .big-start-btn { padding: 15px 30px; font-size: 24px; }
            #version { top: 5px; left: 5px; font-size: 12px; padding: 5px 8px; }
            .stack-count { width: 25px; height: 25px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- Яскраво видима версія гри -->
    <div id="version">v1.11.0 (UI & Deck Removed)</div>

    <!-- Основний контейнер гри -->
    <div class="transparent-container">
        
        <!-- Опоненти -->
        <div class="opponents-area" id="opponents-area">
            <!-- Динамічно -->
        </div>

        <!-- Стіл -->
        <div class="table-area">
            
            <!-- Великий екран очікування -->
            <div id="start-screen">
                <!-- Запускає гру вперше. Не спрацює, якщо гра вже йде -->
                <button class="big-start-btn" onclick="startGame(false)">🃏 ПОЧАТИ ГРУ</button>
                <div style="font-size: 30px; margin-top: 10px;">⏳</div>
            </div>

            <div class="cards-center">
                <div class="card empty" id="center-stack">
                    <!-- Динамічно -->
                </div>
            </div>

            <!-- Зона взаємодії -->
            <div class="interaction-area">
                
                <div class="operations" id="operations">
                    <!-- Кнопки генеруються JS -->
                </div>

                <div class="input-group" id="input-group">
                    <input type="number" id="sum-input" placeholder="❓" step="any" autocomplete="off">
                    <button class="submit-btn" onclick="submitSum()">✔️</button>
                </div>

            </div>
            
            <div class="feedback-icon" id="feedback-icon"></div>

        </div>

        <!-- Моя зона -->
        <div class="my-area" id="my-area-container">
            <div class="controls">
                <!-- Примусовий перезапуск гри (працює завжди) -->
                <button class="ctrl-btn" onclick="startGame(true)" title="Почати гру заново">🔄</button>
                <button class="ctrl-btn" onclick="removeOfflinePlayers()" title="Видалити гравців, які вийшли з уроку">🚷</button>
            </div>
            
            <div class="my-stats" id="my-stats">
                <div id="my-score-display">🏆 0</div>
                <div id="my-turn-indicator">⏳</div>
            </div>
            
            <div class="my-hand" id="my-hand">
                <!-- Динамічно -->
            </div>
        </div>

    </div>

    <!-- Theme Manager -->
    <button id="settings-btn" onclick="document.getElementById('theme-modal').style.display='flex'">⚙️</button>
    <div id="theme-modal" onclick="if(event.target===this) this.style.display='none'">
        <div id="theme-content">
            <div class="theme-grid" id="theme-grid"></div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ -->
    <!-- ========================================== -->
    <div id="block-overlay">Зачекай! Зараз не твій урок.</div>

    <script>
        // 1. Отримання та збереження імені
        const urlParams = new URLSearchParams(window.location.search);
        let myName = urlParams.get('user');
        
        if (!myName) myName = sessionStorage.getItem('myName');
        if (!myName) {
            myName = 'Гість_' + Math.floor(Math.random() * 1000);
        }
        sessionStorage.setItem('myName', myName);
        
        // 2. Радар та унікальні вкладки
        const myTabId = 'tab_' + Math.random().toString(36).substr(2, 9);

        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
            projectId: "lesson-13c44"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const connectedRef = db.ref('.info/connected');
        const myRadarRef = db.ref(`online_users/${myName}/${myTabId}`);
        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                myRadarRef.set(true);
                myRadarRef.onDisconnect().remove();
            }
        });
        window.addEventListener('beforeunload', () => myRadarRef.remove());

        let onlineUsersObj = {};
        db.ref('online_users').on('value', snap => { onlineUsersObj = snap.val() || {}; });

        // 3. Оновлення списку та блокування
        db.ref('force_refresh').on('value', snap => {
            if (snap.val() === true) window.location.reload();
        });
        db.ref(`blocked_users/${myName}`).on('value', snap => {
            document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
        });

        // 4. Повернення в Лобі (з імунітетом при старті)
        let initImmunity = true;
        setTimeout(() => initImmunity = false, 1500);
        db.ref('current_activity').on('value', snap => {
            if (!initImmunity && snap.val() === 'lobby') {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
        });

        // ==========================================
        // Система динамічних фонів (Theme Manager)
        // ==========================================
        const savedBg = localStorage.getItem('mySavedGameBg');
        if(savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;

        db.ref('game_theme').on('value', snap => {
            const url = snap.val();
            if(url) {
                document.body.style.backgroundImage = `url('${url}')`;
                localStorage.setItem('mySavedGameBg', url);
            }
        });

        const themeGrid = document.getElementById('theme-grid');
        let currentBgIndex = 1;
        
        function loadNextBackgroundsBatch() {
            let limit = currentBgIndex + 30;
            function checkOne(idx) {
                if(idx > limit) return;
                const img = new Image();
                const url = `https://olgazheltvai2.github.io/images/backgrounds/background_${idx}.webp`;
                img.onload = () => {
                    const div = document.createElement('div');
                    div.className = 'theme-item';
                    div.style.backgroundImage = `url('${url}')`;
                    div.onclick = () => {
                        db.ref('game_theme').set(url);
                        document.getElementById('theme-modal').style.display = 'none';
                    };
                    div.innerHTML = `<div class="theme-title">Фон ${idx}</div>`;
                    themeGrid.appendChild(div);
                    checkOne(idx + 1);
                };
                img.onerror = () => { checkOne(idx + 1); };
                img.src = url;
            }
            checkOne(currentBgIndex);
            currentBgIndex = limit + 1;
        }
        loadNextBackgroundsBatch();

        // ==========================================
        // Аудіо та Анімації
        // ==========================================
        let audioCtx;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) {
            console.warn("AudioContext не підтримується");
        }

        function playBeep(type) {
            try {
                if(!audioCtx) return;
                if(audioCtx.state === 'suspended') {
                    let resumePromise = audioCtx.resume();
                    if(resumePromise !== undefined) {
                        resumePromise.catch(e => console.warn(e));
                    }
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                
                if (type === 'click') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'error') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'win') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch(e) {
                console.warn("Помилка звуку", e);
            }
        }

        function showFeedback(isCorrect) {
            const fb = document.getElementById('feedback-icon');
            fb.innerText = isCorrect ? '✅' : '❌';
            fb.style.animation = 'none';
            void fb.offsetWidth;
            fb.style.animation = 'pop 1s forwards';
        }

        function triggerShake(elementId) {
            const el = document.getElementById(elementId);
            if(el) {
                el.classList.remove('shake');
                void el.offsetWidth;
                el.classList.add('shake');
            }
        }

        // ==========================================
        // Логіка Гри та Синхронізація
        // ==========================================
        
        function normalizeGameState(state) {
            if (!state) return state;
            if (!state.centerStack) state.centerStack = [];
            if (!state.deck) state.deck = [];
            if (!state.turnOrder) state.turnOrder = [];
            if (state.players) {
                Object.keys(state.players).forEach(p => {
                    if (!state.players[p].hand) state.players[p].hand = [];
                });
            } else {
                state.players = {};
            }
            return state;
        }

        let gameState = {
            players: {}, turnOrder: [], currentTurnIndex: 0,
            deck: [], centerStack: [], currentSum: 0, lastPlayer: "",
            status: "waiting", pendingCalculations: null, actionCount: 0
        };
        let isGameInitialized = false;

        function joinGame() {
            let stateChanged = false;
            if(!gameState.players[myName]) {
                gameState.players[myName] = { hand: [], score: 0 };
                if(!gameState.turnOrder.includes(myName)) gameState.turnOrder.push(myName);
                
                if(gameState.status === 'playing') {
                    while(gameState.deck && gameState.deck.length > 0 && gameState.players[myName].hand.length < 3) {
                        gameState.players[myName].hand.push(gameState.deck.pop());
                    }
                }
                stateChanged = true;
            } else if (gameState.status === 'playing' && gameState.players[myName].hand.length === 0) {
                 while(gameState.deck && gameState.deck.length > 0 && gameState.players[myName].hand.length < 3) {
                     gameState.players[myName].hand.push(gameState.deck.pop());
                 }
                 stateChanged = true;
            }
            if (stateChanged) broadcastState('JOIN');
        }

        let lastUpdateId = "";

        db.ref('game_action').on('value', snap => {
            const val = snap.val();
            if(val && val.data) {
                const incomingCount = val.data.actionCount || 0;
                const currentCount = gameState.actionCount || 0;
                
                if (incomingCount < currentCount) return; 
                
                gameState = normalizeGameState(val.data);
                renderGame();
                
                if (gameState.status === 'playing' && (!gameState.players[myName] || gameState.players[myName].hand.length === 0)) {
                    joinGame();
                }
            }
            if(!isGameInitialized) {
                isGameInitialized = true;
                joinGame();
            }
        });

        function broadcastState(actionType) {
            gameState.actionCount = (gameState.actionCount || 0) + 1;
            
            db.ref('game_action').set({
                senderId: myName, 
                timestamp: Date.now(), 
                type: actionType, 
                data: gameState
            }).catch(e => console.error("Помилка запису в базу", e));
            renderGame(); 
        }

        // isRestart = true примусово ігнорує блокування та стартує гру наново
        function startGame(isRestart = false) {
            try {
                if(!isRestart && gameState.status === 'playing') return;

                playBeep('click');
                let deck = [];
                for(let i=0; i<=10; i++) {
                    for(let j=0; j<8; j++) deck.push(i);
                }
                deck.sort(() => Math.random() - 0.5);

                let activePlayers = Object.keys(gameState.players || {}).filter(p => onlineUsersObj[p]);
                
                if(!activePlayers.includes(myName)) {
                    activePlayers.push(myName);
                }

                let newPlayers = {};
                activePlayers.forEach(p => {
                    newPlayers[p] = { hand: [], score: 0 };
                    for(let c=0; c<3; c++) {
                        if(deck.length > 0) newPlayers[p].hand.push(deck.pop());
                    }
                });

                let currentCount = gameState.actionCount || 0;

                gameState = {
                    players: newPlayers, turnOrder: activePlayers, currentTurnIndex: 0,
                    deck: deck, centerStack: [], currentSum: 0, lastPlayer: activePlayers[0],
                    status: "playing", pendingCalculations: null, actionCount: currentCount
                };
                broadcastState('START');
            } catch (error) {
                console.error("Помилка під час старту:", error);
            }
        }

        function removeOfflinePlayers() {
            playBeep('click');
            const activePlayers = gameState.turnOrder.filter(p => onlineUsersObj[p]);
            let newPlayers = {};
            activePlayers.forEach(p => { if(gameState.players[p]) newPlayers[p] = gameState.players[p]; });
            gameState.players = newPlayers;
            gameState.turnOrder = activePlayers;
            if(gameState.currentTurnIndex >= activePlayers.length) gameState.currentTurnIndex = 0;
            broadcastState('REMOVE_OFFLINE');
        }

        function playCard(handIndex) {
            try {
                if(!gameState.centerStack) gameState.centerStack = [];
                if(!gameState.players[myName].hand) gameState.players[myName].hand = [];

                if(gameState.turnOrder[gameState.currentTurnIndex] !== myName) {
                    playBeep('error');
                    triggerShake('my-hand');
                    const activeOpponent = document.querySelector('.opponent.active-turn');
                    if(activeOpponent) {
                        activeOpponent.classList.add('highlight-error');
                        setTimeout(() => activeOpponent.classList.remove('highlight-error'), 400);
                    }
                    return;
                }
                
                if(gameState.pendingCalculations) {
                    playBeep('error');
                    triggerShake('input-group');
                    return;
                }

                playBeep('click');
                const card = gameState.players[myName].hand.splice(handIndex, 1)[0];
                gameState.centerStack.push(card); 

                if(card === 0) {
                    setupInputPhase(0);
                } else if(card === 5) {
                    setupOperationPhase(['+', '-']);
                } else if(card === 2) {
                    setupOperationPhase(['+', '*', '/']);
                } else {
                    setupInputPhase(gameState.currentSum + card);
                }
                broadcastState('PLAY_CARD');
            } catch(error) {
                console.error("Помилка при спробі зіграти карту:", error);
            }
        }

        function setupOperationPhase(ops) {
            gameState.pendingCalculations = { step: 'choose_op', availableOps: ops };
            broadcastState('SETUP_OP');
        }

        function selectOperation(op) {
            playBeep('click');
            let expected = gameState.currentSum;
            const card = gameState.centerStack[gameState.centerStack.length-1];
            if(op === '+') expected += card;
            else if(op === '-') expected -= card;
            else if(op === '*') expected *= card;
            else if(op === '/') expected = Number((expected / card).toFixed(2));
            
            gameState.pendingCalculations = { step: 'input_sum', expectedSum: expected };
            broadcastState('SELECT_OP');
        }

        function setupInputPhase(expected) {
            gameState.pendingCalculations = { step: 'input_sum', expectedSum: expected };
            broadcastState('SETUP_INPUT');
        }

        function submitSum() {
            try {
                if(gameState.turnOrder[gameState.currentTurnIndex] !== myName) return;
                if(!gameState.pendingCalculations || gameState.pendingCalculations.step !== 'input_sum') return;

                const inputVal = parseFloat(document.getElementById('sum-input').value);
                if(isNaN(inputVal)) return;

                if(!gameState.deck) gameState.deck = [];

                if(inputVal === gameState.pendingCalculations.expectedSum) {
                    playBeep('win');
                    showFeedback(true);
                    gameState.currentSum = inputVal;
                    
                    if(gameState.currentSum === 10) {
                        gameState.players[myName].score += gameState.centerStack.length;
                        gameState.centerStack = [];
                        gameState.currentSum = 0;
                    } else if(gameState.currentSum > 10) {
                        if(gameState.players[gameState.lastPlayer]) {
                            gameState.players[gameState.lastPlayer].score += gameState.centerStack.length;
                        } else {
                            gameState.players[myName].score += gameState.centerStack.length;
                        }
                        gameState.centerStack = [];
                        gameState.currentSum = 0;
                    }

                    while(gameState.deck.length > 0 && gameState.players[myName].hand.length < 3) {
                        gameState.players[myName].hand.push(gameState.deck.pop());
                    }

                    gameState.lastPlayer = myName;
                    gameState.currentTurnIndex = (gameState.currentTurnIndex + 1) % gameState.turnOrder.length;
                    gameState.pendingCalculations = null;
                    document.getElementById('sum-input').value = '';
                    broadcastState('SUBMIT_CORRECT');

                } else {
                    playBeep('error');
                    showFeedback(false);
                    triggerShake('input-group');
                }
            } catch(error) {
                console.error("Помилка під час відправки суми:", error);
            }
        }

        // ==========================================
        // Рендер Інтерфейсу
        // ==========================================
        function renderGame() {
            if(!gameState || !gameState.turnOrder) return;
            const isMyTurn = gameState.turnOrder[gameState.currentTurnIndex] === myName;

            const startScreen = document.getElementById('start-screen');
            if(gameState.status === 'waiting') {
                startScreen.style.display = 'flex';
            } else {
                startScreen.style.display = 'none';
            }

            const oppArea = document.getElementById('opponents-area');
            oppArea.innerHTML = '';
            gameState.turnOrder.forEach(p => {
                if(p === myName) return;
                const isThisOpponentTurn = (gameState.turnOrder[gameState.currentTurnIndex] === p && gameState.status === 'playing');
                const div = document.createElement('div');
                div.className = 'opponent ' + (isThisOpponentTurn ? 'active-turn' : '');
                div.innerHTML = `
                    <div>👤 ${p}</div>
                    <div class="opponent-icons">
                        <div title="Залишилося карт на руці">🃏x${gameState.players[p] && gameState.players[p].hand ? gameState.players[p].hand.length : 0}</div>
                        <div title="Зароблено балів (зібраних карт)">🏆x${gameState.players[p] ? gameState.players[p].score : 0}</div>
                    </div>
                `;
                oppArea.appendChild(div);
            });

            // Відмальовуємо лише стопку по центру. Колоду видалено повністю за запитом.
            const stack = document.getElementById('center-stack');
            stack.className = 'card ' + (gameState.centerStack && gameState.centerStack.length === 0 ? 'empty' : 'large');
            if(gameState.centerStack && gameState.centerStack.length > 0) {
                const top = gameState.centerStack[gameState.centerStack.length-1];
                stack.style.backgroundImage = `url('kartka_${top}.webp')`;
                // Кількість карт у поточній стопці по центру
                stack.innerHTML = `<div class="stack-count">${gameState.centerStack.length}</div>`;
            } else {
                stack.style.backgroundImage = 'none';
                stack.innerHTML = '';
            }

            const myHand = document.getElementById('my-hand');
            myHand.innerHTML = '';
            
            const scoreDisplay = document.getElementById('my-score-display');
            if(gameState.players[myName]) {
                scoreDisplay.innerText = `🏆 ${gameState.players[myName].score}`;
                if (gameState.players[myName].hand) {
                    gameState.players[myName].hand.forEach((card, idx) => {
                        const cDiv = document.createElement('div');
                        cDiv.className = 'card large';
                        cDiv.style.backgroundImage = `url('kartka_${card}.webp')`;
                        cDiv.onclick = () => playCard(idx);
                        if((!isMyTurn && gameState.status === 'playing') || gameState.pendingCalculations) {
                            cDiv.style.filter = 'brightness(0.5)';
                        }
                        myHand.appendChild(cDiv);
                    });
                }
            } else {
                scoreDisplay.innerText = `🏆 0`;
            }

            const myAreaContainer = document.getElementById('my-area-container');
            if(isMyTurn && gameState.status === 'playing') {
                myAreaContainer.classList.add('my-turn-active');
            } else {
                myAreaContainer.classList.remove('my-turn-active');
            }

            document.getElementById('my-turn-indicator').innerText = isMyTurn && gameState.status === 'playing' ? '🟢' : '⏳';
            
            const opsDiv = document.getElementById('operations');
            const inpDiv = document.getElementById('input-group');
            opsDiv.style.display = 'none';
            inpDiv.style.display = 'none';

            if(isMyTurn && gameState.pendingCalculations) {
                if(gameState.pendingCalculations.step === 'choose_op') {
                    opsDiv.style.display = 'flex';
                    opsDiv.innerHTML = '';
                    gameState.pendingCalculations.availableOps.forEach(op => {
                        const btn = document.createElement('button');
                        btn.className = 'op-btn';
                        btn.innerText = op === '*' ? '✖️' : op === '/' ? '➗' : op === '+' ? '➕' : '➖';
                        btn.onclick = () => selectOperation(op);
                        opsDiv.appendChild(btn);
                    });
                } else if(gameState.pendingCalculations.step === 'input_sum') {
                    inpDiv.style.display = 'flex';
                    setTimeout(() => document.getElementById('sum-input').focus(), 100);
                }
            }
        }

        document.getElementById('sum-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') submitSum();
        });

    </script>
</body>
</html>
