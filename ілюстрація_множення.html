<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ілюстратор</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out;
            overflow: hidden;
        }

        /* Контейнер на весь екран - спільний фон прибрано */
        .game-container {
            width: 98vw;
            height: 96vh;
            background-color: transparent; 
            display: flex;
            flex-direction: column;
            position: relative;
            box-sizing: border-box;
        }

        /* Поля вводу - тепер у нормальному потоці, тому на них нічого не налізе */
        .input-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding-top: 30px;
            padding-bottom: 15px;
            z-index: 10;
            flex-shrink: 0; /* Щоб панель вводу не стискалася */
        }

        .math-sign {
            font-size: 32px;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.7);
            user-select: none;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 0 10px;
            border-radius: 8px;
        }

        .hidden-input {
            width: 60px;
            height: 40px;
            padding: 5px;
            font-size: 24px;
            border: 2px solid rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            color: transparent !important; 
            caret-color: transparent !important; 
            background-color: rgba(255, 255, 255, 0.8) !important; 
            text-align: center;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
        }

        .hidden-input:focus {
            border-color: rgba(0, 0, 0, 0.4);
            color: transparent !important; 
        }

        /* Зона ілюстрації */
        #illustrationArea {
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            align-content: center;
            position: relative;
            overflow-y: auto;
            padding: 10px 40px 40px 40px; /* Акуратні відступи */
            box-sizing: border-box;
        }

        .emoji {
            margin: 0;
            user-select: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        /* Оновлені Лейаути */
        .group-layout {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: auto;
            min-height: 100%;
        }

        .group {
            border: 3px solid rgba(0, 0, 0, 0.4); 
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.85); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            box-sizing: border-box;
            /* Дисплей буде задано через JS як grid для фіксації форми */
        }

        /* Theme Manager CSS */
        .settings-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            background-color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            border: none;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .settings-modal {
            display: none;
            position: fixed;
            z-index: 9998;
            bottom: 80px;
            right: 20px;
            width: 300px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .settings-modal.active { display: block; }

        .settings-modal-header {
            padding: 10px;
            background-color: #f0f0f0;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-modal-close {
            border: none;
            background: none;
            font-size: 20px;
            cursor: pointer;
            color: #888;
        }

        .theme-list {
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .theme-thumbnail {
            position: relative;
            cursor: pointer;
            border-radius: 5px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .theme-thumbnail img {
            width: 100%;
            height: auto;
            display: block;
        }

        .theme-thumbnail.active-theme {
            border: 3px solid #007bff;
        }

        .theme-thumbnail-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
            font-size: 12px;
            pointer-events: none;
        }
        
        /* Приховання стрілок в input number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<body>

    <div class="game-container">
        <div class="input-container">
            <input type="number" id="num1" class="hidden-input" autocomplete="off">
            <div class="math-sign">×</div>
            <input type="number" id="num2" class="hidden-input" autocomplete="off">
            <div class="math-sign">=</div>
            <!-- Третє порожнє вікно -->
            <input type="number" id="resultInput" class="hidden-input" autocomplete="off">
        </div>
        <div id="illustrationArea"></div>
    </div>

    <!-- Theme Manager -->
    <button id="settingsBtn" class="settings-btn">⚙️</button>
    <div id="settingsModal" class="settings-modal">
        <div class="settings-modal-header">
            <div style="font-size: 18px; font-weight: bold;">Налаштування</div>
            <button id="settingsModalClose" class="settings-modal-close">×</button>
        </div>
        <div id="themeList" class="theme-list"></div>
    </div>

    <script>
        /* Логіка Ілюстратора */
        const num1Input = document.getElementById('num1');
        const num2Input = document.getElementById('num2');
        const resultInput = document.getElementById('resultInput');
        const area = document.getElementById('illustrationArea');
        const emojis = ['🍎', '⭐', '🎈', '🚗', '🐱', '🐶', '⚽', '🦋', '🍉', '🚀', '🍓', '🧸'];

        function getFactors(n) {
            const factors = [];
            for (let i = 1; i <= n; i++) {
                if (n % i === 0) factors.push([i, n / i]);
            }
            return factors;
        }

        function generateIllustration() {
            const n1 = parseInt(num1Input.value);
            const n2 = parseInt(num2Input.value);

            if (isNaN(n1) || isNaN(n2) || n1 <= 0 || n2 <= 0) return;

            // Миттєве очищення всіх полів
            num1Input.value = '';
            num2Input.value = '';
            resultInput.value = '';
            num1Input.blur();
            num2Input.blur();
            resultInput.blur();

            area.innerHTML = '';
            area.className = 'group-layout'; 

            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            const factors = getFactors(n1);

            // Вибираємо форму ОДИН РАЗ
            const shapeIndex = Math.floor(Math.random() * (factors.length + 1));

            // Динамічне масштабування (vmin) для ідеального розміщення на широкоформатному екрані
            let emojiSize = 7; // Базовий великий розмір
            let gapSize = 15;
            let groupGap = 40;
            let paddingSize = 25;
            const totalItems = n1 * n2;

            if (totalItems > 15) { emojiSize = 5; gapSize = 10; groupGap = 30; paddingSize = 20; }
            if (totalItems > 30) { emojiSize = 4; gapSize = 8; groupGap = 20; paddingSize = 15; }
            if (totalItems > 50) { emojiSize = 3; gapSize = 5; groupGap = 15; paddingSize = 10; }
            if (totalItems > 70) { emojiSize = 2.5; gapSize = 3; groupGap = 10; paddingSize = 5; }

            area.style.gap = `${groupGap}px`;

            for (let i = 0; i < n2; i++) {
                const group = document.createElement('div');
                group.className = 'group';
                group.style.padding = `${paddingSize}px`;
                group.style.gap = `${gapSize}px`;

                // ЗАВЖДИ використовуємо grid, щоб запобігти зміні форми при зумінгу
                if (shapeIndex < factors.length) {
                    const shape = factors[shapeIndex];
                    group.style.display = 'grid';
                    group.style.gridTemplateRows = `repeat(${shape[0]}, auto)`;
                    group.style.gridTemplateColumns = `repeat(${shape[1]}, auto)`;
                } else {
                    // Асиметрична форма, але з жорстко заданою кількістю стовпчиків
                    const cols = Math.floor(Math.random() * Math.ceil(n1 / 2)) + 2; 
                    group.style.display = 'grid';
                    group.style.gridTemplateColumns = `repeat(${cols > n1 ? n1 : cols}, auto)`;
                }

                for (let j = 0; j < n1; j++) {
                    const span = document.createElement('span');
                    span.className = 'emoji';
                    span.innerText = emoji;
                    span.style.fontSize = `${emojiSize}vmin`; // Завдяки vmin елементи будуть максимально великими, але не вилізуть
                    group.appendChild(span);
                }
                area.appendChild(group);
            }
        }

        num1Input.addEventListener('input', () => { if(num2Input.value !== '') generateIllustration(); });
        num2Input.addEventListener('input', () => { if(num1Input.value !== '') generateIllustration(); });


        /* Логіка Theme Manager */
        const themesBaseUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const settingsModalClose = document.getElementById('settingsModalClose');
        const themeList = document.getElementById('themeList');
        const availableThemes = [];

        function changeBg(url, index) {
            document.body.style.backgroundImage = `url(${url})`;
            localStorage.setItem('mySavedGameBg', url);
            const activeThumb = document.querySelector('.theme-thumbnail.active-theme');
            if (activeThumb) activeThumb.classList.remove('active-theme');
            const newActiveThumb = document.querySelector(`.theme-thumbnail[data-index="${index}"]`);
            if (newActiveThumb) newActiveThumb.classList.add('active-theme');
        }

        async function loadThemes() {
            for (let i = 1; i <= 1000; i++) {
                const url = `${themesBaseUrl}background_${i}.webp`;
                try {
                    const imgExists = await checkImage(url);
                    if (imgExists) {
                        availableThemes.push({ url, index: i });
                    } else {
                        break;
                    }
                } catch (error) {
                    break;
                }
            }
            createThumbnails();
            loadSettings(); 
        }

        function checkImage(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        function createThumbnails() {
            themeList.innerHTML = '';
            availableThemes.forEach(theme => {
                const thumb = document.createElement('div');
                thumb.classList.add('theme-thumbnail');
                thumb.setAttribute('data-index', theme.index);
                thumb.onclick = () => changeBg(theme.url, theme.index);

                const img = document.createElement('img');
                img.src = theme.url;

                const label = document.createElement('div');
                label.classList.add('theme-thumbnail-label');
                label.innerText = `Фон ${theme.index}`;

                thumb.appendChild(img);
                thumb.appendChild(label);
                themeList.appendChild(thumb);
            });
        }

        function loadSettings() {
            const savedBg = localStorage.getItem('mySavedGameBg');
            if (savedBg) {
                document.body.style.backgroundImage = `url(${savedBg})`;
                const index = savedBg.match(/background_(\d+)\.webp/);
                if (index && index[1]) {
                    setTimeout(() => {
                        const savedThumb = document.querySelector(`.theme-thumbnail[data-index="${index[1]}"]`);
                        if (savedThumb) savedThumb.classList.add('active-theme');
                    }, 50);
                }
            } else {
                changeBg(`${themesBaseUrl}background_1.webp`, 1);
            }
        }

        settingsBtn.addEventListener('click', () => { settingsModal.classList.toggle('active'); });
        settingsModalClose.addEventListener('click', () => { settingsModal.classList.remove('active'); });
        window.addEventListener('load', loadThemes);
    </script>
</html>
