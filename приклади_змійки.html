<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake Math Chain</title>
  <style>
    /* ================= БАЗОВІ СТИЛІ ТА СКИДАННЯ ================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07170d;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    /* Контейнер всієї сцени */
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Головне SVG-полотно на весь екран */
    #scene-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ================= ПАНЕЛЬ КЕРУВАННЯ (РЕЖИМИ 10 / 100 ТА ПЕРЕГЕНЕРАЦІЯ) ================= */
    #ui-top {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }

    .ui-group {
      display: flex;
      gap: 14px;
      pointer-events: auto;
    }

    /* Реалістичні кам'яно-смарагдові кнопки без білих прямокутників */
    .stone-btn {
      position: relative;
      width: 78px;
      height: 64px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.65));
      outline: none;
    }

    .stone-btn:hover {
      transform: translateY(-3px) scale(1.05);
      filter: drop-shadow(0 12px 16px rgba(0, 0, 0, 0.75)) brightness(1.08);
    }

    .stone-btn:active {
      transform: translateY(2px) scale(0.96);
    }

    .stone-btn.active-mode {
      filter: drop-shadow(0 0 16px rgba(132, 255, 99, 0.75)) drop-shadow(0 8px 12px rgba(0,0,0,0.7));
      transform: scale(1.07);
    }

    .stone-btn svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* ================= ЦИФРОВА КАМ'ЯНА КЛАВІАТУРА СПРАВА ВЕРТИКАЛЬНО ================= */
    #numpad-bar {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 10px 8px;
      border-radius: 28px;
      background: radial-gradient(ellipse at 50% 20%, rgba(44, 71, 39, 0.92), rgba(16, 33, 19, 0.96));
      border: 3px solid #4e733d;
      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.8),
        inset 0 2px 4px rgba(198, 255, 160, 0.35),
        inset 0 -4px 10px rgba(0, 0, 0, 0.7);
      z-index: 20;
      align-items: center;
    }

    .num-key {
      width: 44px;
      height: 46px;
      border: none;
      background: transparent;
      cursor: pointer;
      position: relative;
      padding: 0;
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.14s;
      filter: drop-shadow(0 5px 7px rgba(0, 0, 0, 0.6));
      outline: none;
    }

    .num-key:hover {
      transform: translateX(-4px) scale(1.07);
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.7)) brightness(1.1);
    }

    .num-key:active {
      transform: translateX(1px) scale(0.93);
    }

    .num-key svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Анімації для кружечків завдання у SVG */
    .task-node {
      cursor: pointer;
      transition: filter 0.25s ease;
    }

    .task-node:hover {
      filter: brightness(1.12);
    }

    /* Пульсація активного кружечка */
    @keyframes pulseActiveRing {
      0%, 100% {
        stroke-width: 5px;
        stroke-opacity: 0.95;
        filter: drop-shadow(0 0 10px #ffd54f);
      }
      50% {
        stroke-width: 9px;
        stroke-opacity: 1;
        filter: drop-shadow(0 0 22px #ffea00);
      }
    }

    .active-ring {
      animation: pulseActiveRing 1.4s infinite ease-in-out;
    }

    /* Анімація помилки (трусіння) */
    @keyframes shakeError {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-10px, -3px); }
      40% { transform: translate(10px, 3px); }
      60% { transform: translate(-8px, 2px); }
      80% { transform: translate(8px, -2px); }
    }

    .shake-node {
      animation: shakeError 0.42s ease-in-out;
    }

    /* Фонова анімація листя та світлячків */
    @keyframes swayLeaf1 {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(3.2deg); }
    }
    @keyframes swayLeaf2 {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-2.8deg); }
    }

    .leaf-sway-1 {
      transform-origin: 0% 50%;
      animation: swayLeaf1 6s ease-in-out infinite;
    }
    .leaf-sway-2 {
      transform-origin: 100% 50%;
      animation: swayLeaf2 7.5s ease-in-out infinite;
    }

    /* Адаптивність для менших екранів */
    @media (max-width: 780px) {
      .num-key {
        width: 38px;
        height: 40px;
      }
      #numpad-bar {
        gap: 3px;
        padding: 7px 6px;
        right: 8px;
      }
      .stone-btn {
        width: 64px;
        height: 54px;
      }
    }

    @media (max-height: 680px) {
      .num-key {
        width: 38px;
        height: 40px;
      }
      #numpad-bar {
        gap: 3px;
        padding: 7px 6px;
      }
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Верхня панель: вибір режиму (10 або 100) та кнопка перегенерації -->
  <div id="ui-top">
    <div class="ui-group">
      <!-- Режим в межах 10 -->
      <button class="stone-btn active-mode" id="btn-mode-10" aria-label="10">
        <svg viewBox="0 0 90 74">
          <defs>
            <radialGradient id="amberGem10" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#ffe57f"/>
              <stop offset="45%" stop-color="#f59e0b"/>
              <stop offset="85%" stop-color="#9a3412"/>
              <stop offset="100%" stop-color="#451a03"/>
            </radialGradient>
            <linearGradient id="stoneRim" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8da87e"/>
              <stop offset="50%" stop-color="#485e3f"/>
              <stop offset="100%" stop-color="#1e2b18"/>
            </linearGradient>
          </defs>
          <!-- Кам'яна оправа у формі зміїного медальйона -->
          <path d="M14,10 C35,2 58,2 76,11 C87,22 88,52 75,63 C56,72 32,72 14,63 C3,51 3,22 14,10 Z"
                fill="url(#stoneRim)" stroke="#172411" stroke-width="3"/>
          <path d="M19,15 C36,8 55,8 71,16 C80,25 81,49 70,58 C54,66 34,66 19,58 C10,48 10,25 19,15 Z"
                fill="url(#amberGem10)" stroke="#5c2804" stroke-width="2"/>
          <!-- Блік -->
          <ellipse cx="36" cy="22" rx="18" ry="6" fill="rgba(255,255,255,0.45)" transform="rotate(-12 36 22)"/>
          <text x="45" y="49" text-anchor="middle" font-size="33" font-weight="900"
                fill="#fffbeb" stroke="#3b1103" stroke-width="4" paint-order="stroke">10</text>
        </svg>
      </button>

      <!-- Режим в межах 100 -->
      <button class="stone-btn" id="btn-mode-100" aria-label="100">
        <svg viewBox="0 0 90 74">
          <defs>
            <radialGradient id="emeraldGem100" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#a7f3d0"/>
              <stop offset="45%" stop-color="#10b981"/>
              <stop offset="85%" stop-color="#065f46"/>
              <stop offset="100%" stop-color="#022c22"/>
            </radialGradient>
          </defs>
          <path d="M14,10 C35,2 58,2 76,11 C87,22 88,52 75,63 C56,72 32,72 14,63 C3,51 3,22 14,10 Z"
                fill="url(#stoneRim)" stroke="#172411" stroke-width="3"/>
          <path d="M19,15 C36,8 55,8 71,16 C80,25 81,49 70,58 C54,66 34,66 19,58 C10,48 10,25 19,15 Z"
                fill="url(#emeraldGem100)" stroke="#053326" stroke-width="2"/>
          <ellipse cx="36" cy="22" rx="18" ry="6" fill="rgba(255,255,255,0.4)" transform="rotate(-12 36 22)"/>
          <text x="45" y="48" text-anchor="middle" font-size="29" font-weight="900"
                fill="#ecfdf5" stroke="#022c22" stroke-width="4" paint-order="stroke">100</text>
        </svg>
      </button>
    </div>

    <!-- Кнопка перегенерації завдання (іконка зі змією, що кусає хвіст / оновлює цикл) -->
    <div class="ui-group">
      <button class="stone-btn" id="btn-regen" aria-label="Regenerate" style="width: 74px; height: 68px;">
        <svg viewBox="0 0 84 80">
          <defs>
            <radialGradient id="regenStone" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#d9f99d"/>
              <stop offset="50%" stop-color="#65a30d"/>
              <stop offset="90%" stop-color="#365314"/>
              <stop offset="100%" stop-color="#1a2e05"/>
            </radialGradient>
          </defs>
          <path d="M14,12 C32,3 54,3 70,12 C81,24 81,56 70,68 C53,77 31,77 14,68 C3,56 3,24 14,12 Z"
                fill="url(#stoneRim)" stroke="#141f0f" stroke-width="3"/>
          <circle cx="42" cy="40" r="28" fill="url(#regenStone)" stroke="#1a2e05" stroke-width="2.5"/>
          <ellipse cx="33" cy="24" rx="13" ry="5" fill="rgba(255,255,255,0.38)" transform="rotate(-18 33 24)"/>
          <!-- Іконка кругової стрілки-змії -->
          <path d="M 42 21 A 19 19 0 1 1 24.5 32.5" fill="none" stroke="#fef08a" stroke-width="6.5" stroke-linecap="round"/>
          <polygon points="23,20 34,30 19,35" fill="#fef08a" stroke="#365314" stroke-width="1.5" stroke-linejoin="round"/>
          <circle cx="42" cy="40" r="4.5" fill="#fef08a"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ГОЛОВНЕ ІГРОВЕ ПОЛОТНО SVG -->
  <svg id="scene-svg" viewBox="0 0 1280 760" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Глибокий тропічний лісовий фон -->
      <radialGradient id="jungleBg" cx="50%" cy="45%" r="70%">
        <stop offset="0%" stop-color="#284e2a"/>
        <stop offset="45%" stop-color="#17331b"/>
        <stop offset="80%" stop-color="#0c1f11"/>
        <stop offset="100%" stop-color="#051008"/>
      </radialGradient>

      <!-- Сонячне проміння крізь крони -->
      <linearGradient id="sunbeam" x1="0%" y1="0%" x2="60%" y2="100%">
        <stop offset="0%" stop-color="rgba(215, 255, 140, 0.16)"/>
        <stop offset="60%" stop-color="rgba(160, 230, 100, 0.05)"/>
        <stop offset="100%" stop-color="rgba(160, 230, 100, 0)"/>
      </linearGradient>

      <!-- Текстура моховитого каменю на галявині -->
      <radialGradient id="mossGround" cx="50%" cy="50%" r="55%">
        <stop offset="0%" stop-color="#375f32" stop-opacity="0.75"/>
        <stop offset="60%" stop-color="#213d20" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#0e2010" stop-opacity="0"/>
      </radialGradient>

      <!-- Патерн реалістичної зміїної луски для тіла змії -->
      <pattern id="snakeScalesPattern" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
        <rect width="28" height="28" fill="#2e7d32"/>
        <!-- Лусочка 1 -->
        <path d="M14,0 C22,5 26,12 14,24 C2,12 6,5 14,0 Z" fill="#4caf50" stroke="#1b4d20" stroke-width="1.4"/>
        <path d="M14,2 C19,6 21,11 14,20 C7,11 9,6 14,2 Z" fill="#66bb6a" opacity="0.75"/>
        <ellipse cx="12" cy="8" rx="3" ry="5" fill="#c8e6c9" opacity="0.45"/>
        <!-- Кутові лусочки для безшовності -->
        <path d="M0,14 C8,19 12,26 0,38 C-12,26 -8,19 0,14 Z" fill="#388e3c" stroke="#1b4d20" stroke-width="1.2"/>
        <path d="M28,14 C36,19 40,26 28,38 C16,26 20,19 28,14 Z" fill="#388e3c" stroke="#1b4d20" stroke-width="1.2"/>
        <path d="M0,-14 C8,-9 12,-2 0,10 C-12,-2 -8,-9 0,-14 Z" fill="#388e3c" stroke="#1b4d20" stroke-width="1.2"/>
        <path d="M28,-14 C36,-9 40,-2 28,10 C16,-2 20,-9 28,-14 Z" fill="#388e3c" stroke="#1b4d20" stroke-width="1.2"/>
      </pattern>

      <!-- Золотисто-оливковий патерн луски для центрального хребта змії -->
      <pattern id="snakeRidgePattern" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
        <rect width="22" height="22" fill="#689f38"/>
        <path d="M11,1 L20,11 L11,21 L2,11 Z" fill="#9ccc65" stroke="#33691e" stroke-width="1.5"/>
        <circle cx="11" cy="11" r="4" fill="#dcedc8" opacity="0.55"/>
      </pattern>

      <!-- Градієнти для об'ємної голови змії -->
      <radialGradient id="snakeHeadGrad" cx="38%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#a3e635"/>
        <stop offset="35%" stop-color="#4d7c0f"/>
        <stop offset="75%" stop-color="#1f4716"/>
        <stop offset="100%" stop-color="#0c2108"/>
      </radialGradient>

      <radialGradient id="snakeEyeGrad" cx="45%" cy="40%" r="55%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="45%" stop-color="#f59e0b"/>
        <stop offset="85%" stop-color="#b45309"/>
        <stop offset="100%" stop-color="#451a03"/>
      </radialGradient>

      <!-- Градієнти для кружечків-каменів із числами (жодних білих прямокутників!) -->
      <!-- Початковий кружечок (бурштиново-золотий) -->
      <radialGradient id="nodeStartGrad" cx="35%" cy="28%" r="70%">
        <stop offset="0%" stop-color="#fff3b0"/>
        <stop offset="35%" stop-color="#fbbf24"/>
        <stop offset="78%" stop-color="#b45309"/>
        <stop offset="100%" stop-color="#5c2206"/>
      </radialGradient>

      <!-- Порожній / очікуючий кружечок (річковий нефритово-бірюзовий камінь) -->
      <radialGradient id="nodeIdleGrad" cx="35%" cy="28%" r="70%">
        <stop offset="0%" stop-color="#e0f2fe"/>
        <stop offset="30%" stop-color="#7dd3fc"/>
        <stop offset="75%" stop-color="#0369a1"/>
        <stop offset="100%" stop-color="#0c2f49"/>
      </radialGradient>

      <!-- Активний кружечок (теплий сонячний топаз) -->
      <radialGradient id="nodeActiveGrad" cx="35%" cy="28%" r="70%">
        <stop offset="0%" stop-color="#fef9c3"/>
        <stop offset="38%" stop-color="#facc15"/>
        <stop offset="80%" stop-color="#ca8a04"/>
        <stop offset="100%" stop-color="#713f12"/>
      </radialGradient>

      <!-- Розв'язаний правильний кружечок (живий смарагд) -->
      <radialGradient id="nodeDoneGrad" cx="35%" cy="28%" r="70%">
        <stop offset="0%" stop-color="#d9f99d"/>
        <stop offset="35%" stop-color="#4ade80"/>
        <stop offset="78%" stop-color="#15803d"/>
        <stop offset="100%" stop-color="#052e16"/>
      </radialGradient>

      <!-- Помилковий кружечок (рубіновий спалах) -->
      <radialGradient id="nodeErrorGrad" cx="35%" cy="28%" r="70%">
        <stop offset="0%" stop-color="#fecaca"/>
        <stop offset="40%" stop-color="#ef4444"/>
        <stop offset="80%" stop-color="#991b1b"/>
        <stop offset="100%" stop-color="#450a0a"/>
      </radialGradient>

      <!-- Тінь під елементами -->
      <filter id="deepShadow" x="-25%" y="-25%" width="150%" height="150%">
        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.65"/>
      </filter>

      <filter id="snakeBodyShadow" x="-15%" y="-15%" width="130%" height="130%">
        <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#020a04" flood-opacity="0.78"/>
      </filter>

      <!-- Градієнт для стрілок дії (малиново-рубіновий як у підручнику, але об'ємний) -->
      <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff4d94"/>
        <stop offset="50%" stop-color="#e11d74"/>
        <stop offset="100%" stop-color="#9d174d"/>
      </linearGradient>

      <!-- Медальйон під арифметичну дію (+2, -6 тощо) -->
      <radialGradient id="opBadgeGrad" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#4a3728"/>
        <stop offset="60%" stop-color="#2b1e16"/>
        <stop offset="100%" stop-color="#140d09"/>
      </radialGradient>

      <!-- Тропічний листок монстери/папороті для фону -->
      <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3f7a38"/>
        <stop offset="50%" stop-color="#234d20"/>
        <stop offset="100%" stop-color="#0e260d"/>
      </linearGradient>
      <linearGradient id="leafGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#558b2f"/>
        <stop offset="60%" stop-color="#2e5718"/>
        <stop offset="100%" stop-color="#142b09"/>
      </linearGradient>
    </defs>

    <!-- 1. БАЗОВИЙ ЖИВИЙ ФОН ТРОПІЧНИХ ДЖУНГЛІВ -->
    <rect width="1280" height="760" fill="url(#jungleBg)"/>

    <!-- Моховита галявина та каміння на задньому плані -->
    <ellipse cx="640" cy="400" rx="580" ry="310" fill="url(#mossGround)"/>
    <ellipse cx="320" cy="560" rx="260" ry="130" fill="url(#mossGround)"/>
    <ellipse cx="980" cy="240" rx="280" ry="140" fill="url(#mossGround)"/>

    <!-- Деталізоване лісове каміння з мохом по кутах -->
    <g opacity="0.65">
      <path d="M-20,690 Q60,610 170,650 Q240,680 260,770 L-20,770 Z" fill="#1b2e1e" stroke="#0d190f" stroke-width="3"/>
      <path d="M10,680 Q75,630 145,660 Q110,690 40,700 Z" fill="#3b692f" opacity="0.6"/>
      <path d="M1040,695 Q1130,615 1295,645 L1295,770 L1010,770 Z" fill="#182a1b" stroke="#0d190f" stroke-width="3"/>
      <path d="M1080,675 Q1160,635 1250,660 Q1190,695 1100,695 Z" fill="#3b692f" opacity="0.55"/>
    </g>

    <!-- Сонячні промені -->
    <polygon points="180,0 420,0 780,760 420,760" fill="url(#sunbeam)"/>
    <polygon points="620,0 820,0 1180,760 920,760" fill="url(#sunbeam)" opacity="0.7"/>

    <!-- Ліани та тропічне листя по краях (живе, погойдується) -->
    <g class="leaf-sway-1">
      <!-- Ліва верхня гілка папороті та монстери -->
      <path d="M-30,110 Q90,140 165,220 Q75,235 -30,190 Z" fill="url(#leafGrad1)" opacity="0.85"/>
      <path d="M-25,115 Q70,150 155,215" fill="none" stroke="#689f38" stroke-width="2.5" opacity="0.6"/>
      <path d="M-20,250 Q80,260 135,330 Q55,360 -20,320 Z" fill="url(#leafGrad2)" opacity="0.75"/>
      <path d="M-15,430 Q75,410 125,470 Q55,515 -15,490 Z" fill="url(#leafGrad1)" opacity="0.8"/>
      <!-- Краплі роси на листі -->
      <circle cx="85" cy="185" r="4.5" fill="#e0f7fa" opacity="0.8"/>
      <circle cx="84" cy="184" r="1.8" fill="#ffffff"/>
    </g>

    <g class="leaf-sway-2">
      <!-- Права гілка тропічного листя -->
      <path d="M1310,120 Q1180,150 1120,235 Q1210,255 1310,200 Z" fill="url(#leafGrad2)" opacity="0.85"/>
      <path d="M1300,128 Q1200,165 1130,230" fill="none" stroke="#8bc34a" stroke-width="2.5" opacity="0.55"/>
      <path d="M1310,360 Q1195,350 1145,425 Q1225,455 1310,430 Z" fill="url(#leafGrad1)" opacity="0.8"/>
      <path d="M1310,510 Q1200,490 1150,560 Q1225,595 1310,575 Z" fill="url(#leafGrad2)" opacity="0.75"/>
      <circle cx="1185" cy="205" r="5" fill="#e0f7fa" opacity="0.8"/>
      <circle cx="1184" cy="203" r="2" fill="#ffffff"/>
    </g>

    <!-- Анімовані лісові світлячки (спори) -->
    <g id="fireflies-layer"></g>

    <!-- 2. ШАР ТІЛА ЗМІЇ (малюється динамічно вздовж рандомної кривої) -->
    <g id="snake-layer" filter="url(#snakeBodyShadow)"></g>

    <!-- 3. ШАР СТРІЛОК ТА АРИФМЕТИЧНИХ ДІЙ -->
    <g id="arrows-layer"></g>

    <!-- 4. ШАР КРУЖЕЧКІВ ІЗ ЧИСЛАМИ -->
    <g id="nodes-layer"></g>

    <!-- 5. ШАР ЖИВОЇ ГОЛОВИ ЗМІЇ (реагує очима, язиком та рухами) -->
    <g id="snake-head-layer" filter="url(#deepShadow)"></g>

    <!-- 6. ШАР ЕФЕКТІВ ТА ЧАСТИНОК (іскри, зірочки при правильній відповіді) -->
    <g id="fx-layer"></g>
  </svg>

  <!-- Нижня кам'яна клавіатура (0-9 та стирання) для зручності на планшеті/дошці -->
  <div id="numpad-bar"></div>
</div>

<script>
  // ============================================================================
  // 1. АУДІО-СИНТЕЗАТОР (Web Audio API) — активні різноманітні звуки без слів
  // ============================================================================
  class SoundEngine {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    // Звук вибору кружечка або натискання цифри (м'який дерев'яно-кам'яний клік)
    playTap(pitchOffset = 0) {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320 + pitchOffset * 22, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);

      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.09);
    }

    // Звук правильного числа у кружечку (яскравий магічний маримба-акорд)
    playNodeSuccess(stepIndex = 0) {
      this.init();
      const now = this.ctx.currentTime;
      const baseFreqs = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
      const root = baseFreqs[stepIndex % baseFreqs.length];
      const notes = [root, root * 1.25, root * 1.5];

      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.055);

        gain.gain.setValueAtTime(0.001, now + idx * 0.055);
        gain.gain.linearRampToValueAtTime(0.24, now + idx * 0.055 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.35);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + idx * 0.055);
        osc.stop(now + idx * 0.055 + 0.37);
      });
    }

    // Звук помилки (пружний низький звук + легке зміїне шипіння)
    playError() {
      this.init();
      const now = this.ctx.currentTime;

      // Низький тон
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(175, now);
      osc.frequency.linearRampToValueAtTime(115, now + 0.28);

      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.31);

      // Коротке шипіння змії (білий шум через смуговий фільтр)
      const bufferSize = this.ctx.sampleRate * 0.22;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(3800, now);
      filter.Q.setValueAtTime(3.0, now);

      const nGain = this.ctx.createGain();
      nGain.gain.setValueAtTime(0.15, now);
      nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

      noise.connect(filter);
      filter.connect(nGain);
      nGain.connect(this.ctx.destination);
      noise.start(now);
    }

    // Фінальна перемога (урочиста тропічна фанфара + каскад дзвіночків)
    playVictoryFanfare() {
      this.init();
      const now = this.ctx.currentTime;
      const melody = [
        { f: 523.25, t: 0.0, d: 0.14 },
        { f: 659.25, t: 0.11, d: 0.14 },
        { f: 783.99, t: 0.22, d: 0.14 },
        { f: 1046.50, t: 0.34, d: 0.42 },
        { f: 987.77, t: 0.52, d: 0.15 },
        { f: 1046.50, t: 0.68, d: 0.55 }
      ];

      melody.forEach(n => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.f, now + n.t);

        gain.gain.setValueAtTime(0.001, now + n.t);
        gain.gain.linearRampToValueAtTime(0.28, now + n.t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + n.t);
        osc.stop(now + n.t + n.d + 0.02);
      });
    }

    // Звук перегенерації змії (шурхіт луски по листю)
    playSlither() {
      this.init();
      const now = this.ctx.currentTime;
      const bufferSize = this.ctx.sampleRate * 0.28;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1600, now);
      filter.frequency.exponentialRampToValueAtTime(2800, now + 0.28);

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start(now);
    }
  }

  const sound = new SoundEngine();

  // ============================================================================
  // 2. СТАН ГРИ ТА НАЛАШТУВАННЯ
  // ============================================================================
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const NODE_RADIUS = 46; // Великий радіус кружечка для крупних чисел

  let currentMode = 10;        // 10 або 100
  let nodesData = [];          // Масив вузлів: { x, y, value, userValue, solved, isStart }
  let opsData = [];            // Масив операцій між вузлами: { opStr, delta, cpX, cpY, labelX, labelY }
  let activeNodeIndex = 1;     // Індекс поточного вибраного кружечка
  let lastShapeIndex = -1;     // Щоб форма лінії щоразу змінювалася
  let inputCheckTimer = null;  // Таймер для перевірки двозначного вводу
  let snakeHeadState = {
    x: 640,
    y: 380,
    angle: 0,
    mood: 'neutral',           // 'neutral', 'happy', 'surprised', 'victory'
    tongueOut: false
  };

  // DOM-елементи
  const snakeLayer = document.getElementById('snake-layer');
  const arrowsLayer = document.getElementById('arrows-layer');
  const nodesLayer = document.getElementById('nodes-layer');
  const snakeHeadLayer = document.getElementById('snake-head-layer');
  const fxLayer = document.getElementById('fx-layer');
  const firefliesLayer = document.getElementById('fireflies-layer');

  // ============================================================================
  // 3. СТВОРЕННЯ КАМ'ЯНОЇ ЦИФРОВОЇ КЛАВІАТУРИ (0-9 + Backspace)
  // ============================================================================
  function buildNumpad() {
    const bar = document.getElementById('numpad-bar');
    bar.innerHTML = '';
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '⌫'];

    keys.forEach((k, idx) => {
      const btn = document.createElement('button');
      btn.className = 'num-key';
      btn.setAttribute('aria-label', k);

      const isBack = k === '⌫';
      const fillGrad = isBack ? 'url(#amberGem10)' : 'url(#regenStone)';

      btn.innerHTML = `
        <svg viewBox="0 0 64 66">
          <path d="M10,8 C24,2 40,2 54,8 C61,18 61,48 54,58 C40,64 24,64 10,58 C3,48 3,18 10,8 Z"
                fill="url(#stoneRim)" stroke="#14200e" stroke-width="2.5"/>
          <path d="M14,12 C25,7 39,7 50,12 C56,20 56,46 50,54 C39,59 25,59 14,54 C8,46 8,20 14,12 Z"
                fill="${fillGrad}" stroke="#1f350c" stroke-width="2"/>
          <ellipse cx="26" cy="18" rx="11" ry="4" fill="rgba(255,255,255,0.38)" transform="rotate(-14 26 18)"/>
          <text x="32" y="${isBack ? 43 : 45}" text-anchor="middle"
                font-size="${isBack ? 28 : 34}" font-weight="900"
                fill="#fffbeb" stroke="#1b2e08" stroke-width="4" paint-order="stroke">${k}</text>
        </svg>
      `;

      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (isBack) {
          handleBackspace();
        } else {
          handleDigitInput(k);
        }
      });

      bar.appendChild(btn);
    });
  }

  // ============================================================================
  // 4. ШАБЛОНИ РАНДОМНИХ ФОРМ ЗМІЇНОЇ ЛІНІЇ (Спіраль, Синусоїда, Вісімка, Дуга, Зигзаг...)
  // ============================================================================
  function generateRandomPathNodes() {
    // Обираємо випадковий шаблон форми лінії, відмінний від попереднього
    const templatesCount = 6;
    let shapeIdx;
    do {
      shapeIdx = Math.floor(Math.random() * templatesCount);
    } while (shapeIdx === lastShapeIndex);
    lastShapeIndex = shapeIdx;

    // Випадкове віддзеркалення по горизонталі або вертикалі для ще більшої різноманітності
    const flipX = Math.random() < 0.5 ? -1 : 1;
    const flipY = Math.random() < 0.5 ? -1 : 1;

    let rawPoints = [];
    let curveSides = []; // Напрямок вигину дуги стрілки (+1 або -1)

    if (shapeIdx === 0) {
      // 1. Класична незамкнена спіраль / равлик (як лівий приклад на фото)
      rawPoints = [
        { x: 350, y: 270 },
        { x: 520, y: 155 },
        { x: 730, y: 220 },
        { x: 760, y: 405 },
        { x: 585, y: 535 },
        { x: 365, y: 490 },
        { x: 225, y: 365 }
      ];
      curveSides = [-1, -1, -1, -1, -1, -1];
    } else if (shapeIdx === 1) {
      // 2. Плавна подвійна S-хвиля (як правий приклад на фото)
      rawPoints = [
        { x: 185, y: 265 },
        { x: 355, y: 165 },
        { x: 425, y: 360 },
        { x: 575, y: 520 },
        { x: 720, y: 335 },
        { x: 880, y: 175 },
        { x: 1055, y: 345 }
      ];
      curveSides = [-1, 1, 1, -1, -1, 1];
    } else if (shapeIdx === 2) {
      // 3. Королівська кобра (широка хвиляста омега-дуга)
      rawPoints = [
        { x: 210, y: 500 },
        { x: 310, y: 300 },
        { x: 485, y: 170 },
        { x: 695, y: 170 },
        { x: 870, y: 300 },
        { x: 965, y: 500 },
        { x: 775, y: 555 }
      ];
      curveSides = [-1, -1, -1, -1, -1, 1];
    } else if (shapeIdx === 3) {
      // 4. Зміїний серпантин (горизонтальна S-подібна петля)
      rawPoints = [
        { x: 240, y: 190 },
        { x: 470, y: 155 },
        { x: 685, y: 245 },
        { x: 560, y: 405 },
        { x: 390, y: 515 },
        { x: 625, y: 565 },
        { x: 890, y: 495 }
      ];
      curveSides = [-1, -1, 1, -1, 1, 1];
    } else if (shapeIdx === 4) {
      // 5. Підкова джунглів з подвійним вигином
      rawPoints = [
        { x: 265, y: 485 },
        { x: 255, y: 270 },
        { x: 445, y: 165 },
        { x: 640, y: 285 },
        { x: 835, y: 165 },
        { x: 1020, y: 275 },
        { x: 995, y: 490 }
      ];
      curveSides = [-1, -1, 1, -1, -1, 1];
    } else {
      // 6. Хвилястий каньйон
      rawPoints = [
        { x: 195, y: 395 },
        { x: 335, y: 535 },
        { x: 525, y: 430 },
        { x: 615, y: 225 },
        { x: 815, y: 175 },
        { x: 985, y: 315 },
        { x: 895, y: 515 }
      ];
      curveSides = [1, 1, -1, -1, -1, 1];
    }

    // Центруємо та застосовуємо легку випадкову варіацію і віддзеркалення
    const centerX = 620;
    const centerY = 355;

    const transformed = rawPoints.map(pt => {
      const dx = (pt.x - centerX) * flipX;
      const dy = (pt.y - centerY) * flipY;
      const jitterX = (Math.random() - 0.5) * 22;
      const jitterY = (Math.random() - 0.5) * 18;
      return {
        x: Math.round(centerX + dx + jitterX),
        y: Math.round(centerY + dy + jitterY)
      };
    });

    // Якщо віддзеркалили по одній осі, інвертуємо напрямок вигину дуг
    const sideFactor = flipX * flipY;
    const finalSides = curveSides.map(s => s * sideFactor);

    return { points: transformed, sides: finalSides };
  }

  // ============================================================================
  // 5. ГЕНЕРАТОР МАТЕМАТИЧНИХ ЗАВДАНЬ (В МЕЖАХ 10 ТА В МЕЖАХ 100)
  // ============================================================================
  function generateMathChain(stepsCount, maxLimit) {
    const values = [];
    const operations = [];

    if (maxLimit === 10) {
      // Початкове число від 2 до 9
      let curr = Math.floor(Math.random() * 8) + 2;
      values.push(curr);

      for (let i = 0; i < stepsCount; i++) {
        // Генеруємо всі можливі переходи в межах [0..10]
        const candidates = [];
        for (let nextVal = 0; nextVal <= 10; nextVal++) {
          const delta = nextVal - curr;
          if (delta === 0) continue; // Уникаємо +0 на кожному кроці, робимо цікаві дії
          candidates.push({ nextVal, delta });
        }
        const choice = candidates[Math.floor(Math.random() * candidates.length)];
        curr = choice.nextVal;
        values.push(curr);
        operations.push({
          delta: choice.delta,
          opStr: choice.delta > 0 ? `+${choice.delta}` : `−${Math.abs(choice.delta)}`
        });
      }
    } else {
      // Режим в межах 100: кожна дія — додавання/віднімання ДВОЗНАЧНОГО числа (10–99),
      // результат завжди залишається в межах 0–99 (щоб на кружечку було рівно 2 цифри).
      let curr = Math.floor(Math.random() * 50) + 25; // старт: 25–74 (двозначне)
      values.push(curr);

      for (let i = 0; i < stepsCount; i++) {
        const candidates = [];
        for (let d = 10; d <= 99; d++) {
          // Плюс двозначне
          if (curr + d <= 99) {
            candidates.push({ nextVal: curr + d, delta: d });
          }
          // Мінус двозначне
          if (curr - d >= 0) {
            candidates.push({ nextVal: curr - d, delta: -d });
          }
        }

        // М'яке зважування: круглі десятки та п'ятірки — зручніші для усного рахунку
        const weighted = [];
        candidates.forEach(c => {
          const a = Math.abs(c.delta);
          let w = 1;
          if (a % 10 === 0) w = 3;
          else if (a % 5 === 0) w = 2;
          for (let k = 0; k < w; k++) weighted.push(c);
        });

        const pool = weighted.length > 0 ? weighted : candidates;
        const choice = pool[Math.floor(Math.random() * pool.length)];
        curr = choice.nextVal;
        values.push(curr);
        operations.push({
          delta: choice.delta,
          opStr: choice.delta > 0 ? `+${choice.delta}` : `−${Math.abs(choice.delta)}`
        });
      }
    }

    return { values, operations };
  }

  // ============================================================================
  // 6. ПОБУДОВА ЗАВДАННЯ ТА ВІДМАЛЬОВУВАННЯ РЕАЛІСТИЧНОЇ ЗМІЇ І СТРІЛОК
  // ============================================================================
  function createNewTask() {
    clearTimeout(inputCheckTimer);
    fxLayer.innerHTML = '';

    const { points, sides } = generateRandomPathNodes();
    const stepsCount = points.length - 1;
    const { values, operations } = generateMathChain(stepsCount, currentMode);

    nodesData = points.map((pt, idx) => ({
      x: pt.x,
      y: pt.y,
      value: values[idx],
      userValue: idx === 0 ? String(values[idx]) : '',
      solved: idx === 0,
      isStart: idx === 0
    }));

    // Обчислюємо контрольні точки для кожної дуги між кружечками
    opsData = operations.map((op, i) => {
      const p1 = nodesData[i];
      const p2 = nodesData[i + 1];
      const mx = (p1.x + p2.x) / 2;
      const my = (p1.y + p2.y) / 2;
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy) || 1;

      // Нормаль до відрізка
      const nx = -dy / len;
      const ny = dx / len;

      const side = sides[i] || 1;
      const curveOffset = Math.min(72, Math.max(48, len * 0.32)) * side;

      // Контрольна точка квадратичної кривої Безьє
      const cpX = mx + nx * curveOffset;
      const cpY = my + ny * curveOffset;

      // Вершина дуги при t = 0.5: M = 0.25*P1 + 0.5*CP + 0.25*P2
      const peakX = 0.25 * p1.x + 0.5 * cpX + 0.25 * p2.x;
      const peakY = 0.25 * p1.y + 0.5 * cpY + 0.25 * p2.y;

      // Розміщуємо підпис дії (+2, -6) трохи далі по нормалі від вершини стрілки
      const labelDist = 38 * side;
      const labelX = Math.max(85, Math.min(1195, peakX + nx * labelDist));
      const labelY = Math.max(70, Math.min(655, peakY + ny * labelDist));

      return {
        ...op,
        cpX,
        cpY,
        side,
        labelX,
        labelY
      };
    });

    activeNodeIndex = 1;
    snakeHeadState.mood = 'neutral';

    renderSnakeBody();
    renderArrowsAndOps();
    renderNodes();
    updateSnakeHeadPose();
  }

  // Допоміжна функція: точка на квадратичній кривій Безьє
  function quadBezierPoint(p0, cp, p1, t) {
    const mt = 1 - t;
    return {
      x: mt * mt * p0.x + 2 * mt * t * cp.x + t * t * p1.x,
      y: mt * mt * p0.y + 2 * mt * t * cp.y + t * t * p1.y
    };
  }

  // Допоміжна функція: дотичний вектор на квадратичній кривій Безьє
  function quadBezierTangent(p0, cp, p1, t) {
    return {
      x: 2 * (1 - t) * (cp.x - p0.x) + 2 * t * (p1.x - cp.x),
      y: 2 * (1 - t) * (cp.y - p0.y) + 2 * t * (p1.y - cp.y)
    };
  }

  // Відмальовування реалістичного лускатого тіла змії вздовж усього маршруту
  function renderSnakeBody() {
    snakeLayer.innerHTML = '';

    // Формуємо єдиний плавний SVG-шлях через усі вузли та контрольні точки
    const pStart = nodesData[0];
    const cpFirst = opsData[0];

    // Хвостик змії перед першим кружечком (як у підручнику, але з реалістичним кінчиком хвоста)
    const startTan = quadBezierTangent(pStart, { x: cpFirst.cpX, y: cpFirst.cpY }, nodesData[1], 0);
    const startLen = Math.hypot(startTan.x, startTan.y) || 1;
    const tailTipX = pStart.x - (startTan.x / startLen) * 82;
    const tailTipY = pStart.y - (startTan.y / startLen) * 82;
    const tailMidX = pStart.x - (startTan.x / startLen) * 44 + (startTan.y / startLen) * 16;
    const tailMidY = pStart.y - (startTan.y / startLen) * 44 - (startTan.x / startLen) * 16;

    let dBody = `M ${pStart.x} ${pStart.y}`;
    for (let i = 0; i < opsData.length; i++) {
      const nextP = nodesData[i + 1];
      const op = opsData[i];
      dBody += ` Q ${op.cpX} ${op.cpY} ${nextP.x} ${nextP.y}`;
    }

    // 1. Хвіст змії, що звужується до кінчика
    const tailPath = document.createElementNS(SVG_NS, 'path');
    tailPath.setAttribute('d', `M ${tailTipX} ${tailTipY} Q ${tailMidX} ${tailMidY} ${pStart.x} ${pStart.y}`);
    tailPath.setAttribute('fill', 'none');
    tailPath.setAttribute('stroke', 'url(#snakeScalesPattern)');
    tailPath.setAttribute('stroke-width', '22');
    tailPath.setAttribute('stroke-linecap', 'round');
    snakeLayer.appendChild(tailPath);

    // 2. Зовнішній темний контур тіла змії (дає 3D-об'єм)
    const outerStroke = document.createElementNS(SVG_NS, 'path');
    outerStroke.setAttribute('d', dBody);
    outerStroke.setAttribute('fill', 'none');
    outerStroke.setAttribute('stroke', '#0e2910');
    outerStroke.setAttribute('stroke-width', '46');
    outerStroke.setAttribute('stroke-linecap', 'round');
    outerStroke.setAttribute('stroke-linejoin', 'round');
    snakeLayer.appendChild(outerStroke);

    // 3. Основне лускате тіло змії
    const mainBody = document.createElementNS(SVG_NS, 'path');
    mainBody.setAttribute('d', dBody);
    mainBody.setAttribute('fill', 'none');
    mainBody.setAttribute('stroke', 'url(#snakeScalesPattern)');
    mainBody.setAttribute('stroke-width', '38');
    mainBody.setAttribute('stroke-linecap', 'round');
    mainBody.setAttribute('stroke-linejoin', 'round');
    snakeLayer.appendChild(mainBody);

    // 4. Візерунчастий хребет вздовж спини змії
    const ridgeBody = document.createElementNS(SVG_NS, 'path');
    ridgeBody.setAttribute('d', dBody);
    ridgeBody.setAttribute('fill', 'none');
    ridgeBody.setAttribute('stroke', 'url(#snakeRidgePattern)');
    ridgeBody.setAttribute('stroke-width', '16');
    ridgeBody.setAttribute('stroke-linecap', 'round');
    ridgeBody.setAttribute('stroke-dasharray', '18 10');
    snakeLayer.appendChild(ridgeBody);

    // 5. Глянцевий блік вздовж тіла змії
    const glossBody = document.createElementNS(SVG_NS, 'path');
    glossBody.setAttribute('d', dBody);
    glossBody.setAttribute('fill', 'none');
    glossBody.setAttribute('stroke', 'rgba(220, 255, 190, 0.28)');
    glossBody.setAttribute('stroke-width', '6');
    glossBody.setAttribute('stroke-linecap', 'round');
    snakeLayer.appendChild(glossBody);

    // 6. Яскрава рубінова точка на кінчику хвоста (як у зразку з підручника)
    const tailDot = document.createElementNS(SVG_NS, 'circle');
    tailDot.setAttribute('cx', tailTipX);
    tailDot.setAttribute('cy', tailTipY);
    tailDot.setAttribute('r', '7');
    tailDot.setAttribute('fill', '#ff2e88');
    tailDot.setAttribute('stroke', '#fff');
    tailDot.setAttribute('stroke-width', '1.8');
    snakeLayer.appendChild(tailDot);
  }

  // Відмальовування чітких дугових стрілок між кружечками та крупних підписів дій
  function renderArrowsAndOps() {
    arrowsLayer.innerHTML = '';

    opsData.forEach((op, i) => {
      const p0 = nodesData[i];
      const p1 = nodesData[i + 1];
      const cp = { x: op.cpX, y: op.cpY };

      // Знаходимо параметри tStart та tEnd, щоб стрілка починалась і закінчувалась рівно на межі кружечків
      let tStart = 0.18;
      let tEnd = 0.80;

      for (let t = 0.05; t <= 0.45; t += 0.01) {
        const pt = quadBezierPoint(p0, cp, p1, t);
        if (Math.hypot(pt.x - p0.x, pt.y - p0.y) >= NODE_RADIUS + 4) {
          tStart = t;
          break;
        }
      }
      for (let t = 0.95; t >= 0.55; t -= 0.01) {
        const pt = quadBezierPoint(p0, cp, p1, t);
        if (Math.hypot(pt.x - p1.x, pt.y - p1.y) >= NODE_RADIUS + 12) {
          tEnd = t;
          break;
        }
      }

      // Будуємо сегмент кривої між tStart і tEnd через проміжні точки
      const segPts = [];
      const steps = 12;
      for (let s = 0; s <= steps; s++) {
        const t = tStart + (tEnd - tStart) * (s / steps);
        segPts.push(quadBezierPoint(p0, cp, p1, t));
      }

      let polyD = `M ${segPts[0].x.toFixed(1)} ${segPts[0].y.toFixed(1)}`;
      for (let s = 1; s < segPts.length; s++) {
        polyD += ` L ${segPts[s].x.toFixed(1)} ${segPts[s].y.toFixed(1)}`;
      }

      // Підкладка стрілки для максимальної контрастності
      const arrowShadow = document.createElementNS(SVG_NS, 'path');
      arrowShadow.setAttribute('d', polyD);
      arrowShadow.setAttribute('fill', 'none');
      arrowShadow.setAttribute('stroke', '#2a0415');
      arrowShadow.setAttribute('stroke-width', '10');
      arrowShadow.setAttribute('stroke-linecap', 'round');
      arrowsLayer.appendChild(arrowShadow);

      // Основна яскрава стрілка
      const arrowLine = document.createElementNS(SVG_NS, 'path');
      arrowLine.setAttribute('d', polyD);
      arrowLine.setAttribute('fill', 'none');
      arrowLine.setAttribute('stroke', 'url(#arrowGrad)');
      arrowLine.setAttribute('stroke-width', '6');
      arrowLine.setAttribute('stroke-linecap', 'round');
      arrowsLayer.appendChild(arrowLine);

      // Наконечник стрілки біля цільового кружечка
      const tipPt = segPts[segPts.length - 1];
      const tan = quadBezierTangent(p0, cp, p1, tEnd);
      const angleDeg = Math.atan2(tan.y, tan.x) * (180 / Math.PI);

      const arrowHead = document.createElementNS(SVG_NS, 'polygon');
      arrowHead.setAttribute('points', '13,0 -10,-10 -6,0 -10,10');
      arrowHead.setAttribute('fill', '#ff2e88');
      arrowHead.setAttribute('stroke', '#2a0415');
      arrowHead.setAttribute('stroke-width', '2.2');
      arrowHead.setAttribute('stroke-linejoin', 'round');
      arrowHead.setAttribute('transform', `translate(${tipPt.x.toFixed(1)}, ${tipPt.y.toFixed(1)}) rotate(${angleDeg.toFixed(1)})`);
      arrowsLayer.appendChild(arrowHead);

      // Медальйон з арифметичною дією (+2, -6, +10 тощо) — КРУПНІ ЧИСЛА
      const opGroup = document.createElementNS(SVG_NS, 'g');
      opGroup.setAttribute('transform', `translate(${op.labelX.toFixed(1)}, ${op.labelY.toFixed(1)})`);
      opGroup.setAttribute('filter', 'url(#deepShadow)');

      const badgeBg = document.createElementNS(SVG_NS, 'ellipse');
      badgeBg.setAttribute('cx', '0');
      badgeBg.setAttribute('cy', '0');
      badgeBg.setAttribute('rx', op.opStr.length > 2 ? '44' : '36');
      badgeBg.setAttribute('ry', '26');
      badgeBg.setAttribute('fill', 'url(#opBadgeGrad)');
      badgeBg.setAttribute('stroke', '#84cc16');
      badgeBg.setAttribute('stroke-width', '2.5');
      opGroup.appendChild(badgeBg);

      const opText = document.createElementNS(SVG_NS, 'text');
      opText.setAttribute('x', '0');
      opText.setAttribute('y', '12');
      opText.setAttribute('text-anchor', 'middle');
      opText.setAttribute('font-size', '35');
      opText.setAttribute('font-weight', '900');
      opText.setAttribute('fill', '#fef08a');
      opText.setAttribute('stroke', '#1a0f07');
      opText.setAttribute('stroke-width', '5');
      opText.setAttribute('paint-order', 'stroke');
      opText.textContent = op.opStr;
      opGroup.appendChild(opText);

      arrowsLayer.appendChild(opGroup);
    });
  }

  // Відмальовування кружечків із числами
  function renderNodes() {
    nodesLayer.innerHTML = '';

    nodesData.forEach((node, idx) => {
      const g = document.createElementNS(SVG_NS, 'g');
      g.setAttribute('class', 'task-node');
      g.setAttribute('id', `node-group-${idx}`);
      g.setAttribute('transform', `translate(${node.x}, ${node.y})`);
      g.setAttribute('filter', 'url(#deepShadow)');

      // Зовнішня кам'яна оправа кружечка
      const outerRim = document.createElementNS(SVG_NS, 'circle');
      outerRim.setAttribute('r', NODE_RADIUS + 5);
      outerRim.setAttribute('fill', 'url(#stoneRim)');
      outerRim.setAttribute('stroke', '#101c0b');
      outerRim.setAttribute('stroke-width', '3');
      g.appendChild(outerRim);

      // Вибір кольору внутрішнього самоцвіту залежно від стану
      let gradId = 'url(#nodeIdleGrad)';
      if (node.isStart) gradId = 'url(#nodeStartGrad)';
      else if (node.solved) gradId = 'url(#nodeDoneGrad)';
      else if (idx === activeNodeIndex) gradId = 'url(#nodeActiveGrad)';

      const innerCircle = document.createElementNS(SVG_NS, 'circle');
      innerCircle.setAttribute('id', `node-circle-${idx}`);
      innerCircle.setAttribute('r', NODE_RADIUS - 2);
      innerCircle.setAttribute('fill', gradId);
      innerCircle.setAttribute('stroke', node.isStart ? '#f59e0b' : (node.solved ? '#4ade80' : '#38bdf8'));
      innerCircle.setAttribute('stroke-width', '3');
      g.appendChild(innerCircle);

      // Якщо це активний кружечок, додаємо золоте пульсуюче кільце
      if (idx === activeNodeIndex && !node.isStart) {
        const activeRing = document.createElementNS(SVG_NS, 'circle');
        activeRing.setAttribute('r', NODE_RADIUS + 7);
        activeRing.setAttribute('fill', 'none');
        activeRing.setAttribute('stroke', '#fde047');
        activeRing.setAttribute('class', 'active-ring');
        g.appendChild(activeRing);
      }

      // Природний скляний блік зверху кружечка
      const highlight = document.createElementNS(SVG_NS, 'ellipse');
      highlight.setAttribute('cx', '-12');
      highlight.setAttribute('cy', '-18');
      highlight.setAttribute('rx', '20');
      highlight.setAttribute('ry', '9');
      highlight.setAttribute('fill', 'rgba(255, 255, 255, 0.38)');
      highlight.setAttribute('transform', 'rotate(-22 -12 -18)');
      g.appendChild(highlight);

      // КРУПНЕ ЧИСЛО всередині кружечка
      const numText = document.createElementNS(SVG_NS, 'text');
      numText.setAttribute('id', `node-text-${idx}`);
      numText.setAttribute('x', '0');
      numText.setAttribute('y', '16');
      numText.setAttribute('text-anchor', 'middle');
      numText.setAttribute('font-size', '46');
      numText.setAttribute('font-weight', '900');
      numText.setAttribute('fill', '#ffffff');
      numText.setAttribute('stroke', '#091e0d');
      numText.setAttribute('stroke-width', '6');
      numText.setAttribute('paint-order', 'stroke');
      numText.textContent = node.userValue;
      g.appendChild(numText);

      // Клік по будь-якому кружечку (крім першого стартового) робить його активним
      if (!node.isStart) {
        g.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          sound.playTap(idx);
          activeNodeIndex = idx;
          renderNodes();
          updateSnakeHeadPose();
        });
      }

      nodesLayer.appendChild(g);
    });
  }

  // ============================================================================
  // 7. ЖИВИЙ ПЕРСОНАЖ — РЕАЛІСТИЧНА ГОЛОВА ЗМІЇ (СЛІДКУЄ ОЧИМА ТА РЕАГУЄ)
  // ============================================================================
  function updateSnakeHeadPose() {
    if (!nodesData.length) return;
    const lastIdx = nodesData.length - 1;
    const lastNode = nodesData[lastIdx];
    const prevNode = nodesData[lastIdx - 1];
    const lastOp = opsData[opsData.length - 1];

    // Обчислюємо напрямок виходу змії після останнього кружечка
    const tan = quadBezierTangent(prevNode, { x: lastOp.cpX, y: lastOp.cpY }, lastNode, 1);
    const len = Math.hypot(tan.x, tan.y) || 1;
    const ux = tan.x / len;
    const uy = tan.y / len;

    // Розміщуємо голову змії трохи далі за останнім кружечком, щоб не перекривати число
    const headX = Math.max(115, Math.min(1165, lastNode.x + ux * 88));
    const headY = Math.max(110, Math.min(620, lastNode.y + uy * 88));

    // Куди дивиться змія: повертається до активного кружечка!
    const targetNode = nodesData[activeNodeIndex] || lastNode;
    const lookDx = targetNode.x - headX;
    const lookDy = targetNode.y - headY;

    snakeHeadState.x = headX;
    snakeHeadState.y = headY;
    snakeHeadState.lastNodeX = lastNode.x;
    snakeHeadState.lastNodeY = lastNode.y;
    snakeHeadState.lookDx = lookDx;
    snakeHeadState.lookDy = lookDy;

    drawSnakeHead();
  }

  function drawSnakeHead() {
    snakeHeadLayer.innerHTML = '';

    const { x, y, lastNodeX, lastNodeY, lookDx, lookDy, mood, tongueOut } = snakeHeadState;

    // Шия, що з'єднує останній кружечок із головою змії
    const neckPath = document.createElementNS(SVG_NS, 'path');
    neckPath.setAttribute('d', `M ${lastNodeX} ${lastNodeY} L ${x} ${y}`);
    neckPath.setAttribute('stroke', 'url(#snakeScalesPattern)');
    neckPath.setAttribute('stroke-width', '34');
    neckPath.setAttribute('stroke-linecap', 'round');
    snakeHeadLayer.appendChild(neckPath);

    // Кут повороту голови у бік активного кружечка
    const angleDeg = Math.atan2(lookDy, lookDx) * (180 / Math.PI);

    const headG = document.createElementNS(SVG_NS, 'g');
    headG.setAttribute('transform', `translate(${x.toFixed(1)}, ${y.toFixed(1)}) rotate(${angleDeg.toFixed(1)})`);

    // 1. Роздвоєний червоний язик змії (висовується при русі, радості або періодично)
    const tongueLen = (tongueOut || mood === 'happy' || mood === 'victory') ? 68 : 44;
    const tongueWiggle = mood === 'happy' ? -6 : (mood === 'surprised' ? 8 : 0);
    const tongue = document.createElementNS(SVG_NS, 'path');
    tongue.setAttribute(
      'd',
      `M 32,0 Q 48,${tongueWiggle} ${tongueLen},0 M ${tongueLen - 10},0 L ${tongueLen + 11},-9 M ${tongueLen - 10},0 L ${tongueLen + 11},9`
    );
    tongue.setAttribute('fill', 'none');
    tongue.setAttribute('stroke', '#ef4444');
    tongue.setAttribute('stroke-width', '3.5');
    tongue.setAttribute('stroke-linecap', 'round');
    headG.appendChild(tongue);

    // 2. Анатомічна форма голови смарагдового пітона/боа
    const skull = document.createElementNS(SVG_NS, 'path');
    skull.setAttribute(
      'd',
      'M -34,-20 C -22,-34 2,-32 22,-20 C 40,-12 46,-6 46,0 C 46,6 40,12 22,20 C 2,32 -22,34 -34,20 C -42,10 -42,-10 -34,-20 Z'
    );
    skull.setAttribute('fill', 'url(#snakeHeadGrad)');
    skull.setAttribute('stroke', '#0b2408');
    skull.setAttribute('stroke-width', '3');
    headG.appendChild(skull);

    // 3. Деталізовані симетричні щитки-лусочки на голові змії
    const headScales = document.createElementNS(SVG_NS, 'path');
    headScales.setAttribute(
      'd',
      'M -18,0 L 2,-11 L 20,0 L 2,11 Z M -28,-12 L -10,-20 L 4,-13 L -12,-4 Z M -28,12 L -10,20 L 4,13 L -12,4 Z'
    );
    headScales.setAttribute('fill', '#84cc16');
    headScales.setAttribute('opacity', '0.45');
    headScales.setAttribute('stroke', '#1a3810');
    headScales.setAttribute('stroke-width', '1.2');
    headG.appendChild(headScales);

    // Блік на носі змії
    const noseShine = document.createElementNS(SVG_NS, 'ellipse');
    noseShine.setAttribute('cx', '16');
    noseShine.setAttribute('cy', '-6');
    noseShine.setAttribute('rx', '12');
    noseShine.setAttribute('ry', '5');
    noseShine.setAttribute('fill', 'rgba(255,255,255,0.32)');
    headG.appendChild(noseShine);

    // Ніздрі на кінчику морди
    [-5, 5].forEach(ny => {
      const nostril = document.createElementNS(SVG_NS, 'circle');
      nostril.setAttribute('cx', '37');
      nostril.setAttribute('cy', String(ny));
      nostril.setAttribute('r', '2');
      nostril.setAttribute('fill', '#071706');
      headG.appendChild(nostril);
    });

    // 4. Реалістичні золоті очі з вертикальною зіницею (реагують на емоції)
    const eyeRadius = mood === 'surprised' ? 10.5 : 9;
    const pupilWidth = mood === 'happy' || mood === 'victory' ? 5.5 : (mood === 'surprised' ? 2.5 : 3.5);

    [-16, 16].forEach(ey => {
      const eyeGroup = document.createElementNS(SVG_NS, 'g');
      eyeGroup.setAttribute('transform', `translate(4, ${ey})`);

      const eyeBall = document.createElementNS(SVG_NS, 'circle');
      eyeBall.setAttribute('r', String(eyeRadius));
      eyeBall.setAttribute('fill', 'url(#snakeEyeGrad)');
      eyeBall.setAttribute('stroke', '#111c09');
      eyeBall.setAttribute('stroke-width', '2');
      eyeGroup.appendChild(eyeBall);

      // Вертикальна котяча/зміїна зіниця
      const slit = document.createElementNS(SVG_NS, 'ellipse');
      slit.setAttribute('cx', '2');
      slit.setAttribute('cy', '0');
      slit.setAttribute('rx', String(pupilWidth));
      slit.setAttribute('ry', String(eyeRadius - 2));
      slit.setAttribute('fill', '#090d06');
      eyeGroup.appendChild(slit);

      // Живий відблиск в оці
      const glint = document.createElementNS(SVG_NS, 'circle');
      glint.setAttribute('cx', '4');
      glint.setAttribute('cy', '-3');
      glint.setAttribute('r', '2.6');
      glint.setAttribute('fill', '#ffffff');
      eyeGroup.appendChild(glint);

      // Надбрівна луска (змінює нахил при радості чи подиві)
      const brow = document.createElementNS(SVG_NS, 'path');
      const sideSign = ey < 0 ? -1 : 1;
      const browCurve = mood === 'happy' || mood === 'victory' ? sideSign * 6 : -sideSign * 4;
      brow.setAttribute('d', `M -9,${sideSign * 6} Q 2,${browCurve} 10,${sideSign * 5}`);
      brow.setAttribute('fill', 'none');
      brow.setAttribute('stroke', '#1c3d11');
      brow.setAttribute('stroke-width', '3.5');
      brow.setAttribute('stroke-linecap', 'round');
      eyeGroup.appendChild(brow);

      headG.appendChild(eyeGroup);
    });

    snakeHeadLayer.appendChild(headG);
  }

  // Періодичний рух язиком змії для ефекту живої присутності
  setInterval(() => {
    snakeHeadState.tongueOut = !snakeHeadState.tongueOut;
    drawSnakeHead();
  }, 1600);

  // ============================================================================
  // 8. ОБРОБКА ВВЕДЕННЯ ЧИСЕЛ ТА ПЕРЕВІРКА ВІДПОВІДЕЙ
  // ============================================================================
  function handleDigitInput(digitStr) {
    if (activeNodeIndex < 1 || activeNodeIndex >= nodesData.length) return;
    const node = nodesData[activeNodeIndex];

    // Якщо кружечок вже розв'язаний і користувач вводить нову цифру, дозволяємо перезаписати
    if (node.solved) {
      node.solved = false;
      node.userValue = '';
    }

    const targetStr = String(node.value);
    const maxDigits = targetStr.length;

    sound.playTap( parseInt(digitStr, 10) );

    // Додаємо цифру (не більше ніж довжина очікуваної відповіді або 3 символи)
    if (node.userValue.length >= Math.max(maxDigits, 2)) {
      node.userValue = digitStr;
    } else {
      node.userValue += digitStr;
    }

    renderNodes();
    clearTimeout(inputCheckTimer);

    // Якщо введене число точно збігається з правильною відповіддю — миттєвий успіх!
    if (node.userValue === targetStr) {
      onNodeCorrect(activeNodeIndex);
      return;
    }

    // Якщо введена перша цифра є правильним початком двозначної відповіді — чекаємо другу цифру
    if (targetStr.startsWith(node.userValue)) {
      return;
    }

    // Якщо вже введено достатньо цифр або перша цифра точно неправильна — показуємо помилку
    inputCheckTimer = setTimeout(() => {
      onNodeError(activeNodeIndex);
    }, 260);
  }

  function handleBackspace() {
    if (activeNodeIndex < 1 || activeNodeIndex >= nodesData.length) return;
    const node = nodesData[activeNodeIndex];
    clearTimeout(inputCheckTimer);
    sound.playTap(0);

    if (node.userValue.length > 0) {
      node.userValue = node.userValue.slice(0, -1);
      node.solved = false;
      renderNodes();
    }
  }

  // Коли кружечок заповнено правильно
  function onNodeCorrect(idx) {
    const node = nodesData[idx];
    node.solved = true;
    sound.playNodeSuccess(idx);

    snakeHeadState.mood = 'happy';
    spawnSparkles(node.x, node.y, '#84cc16', 18);

    // Шукаємо наступний нерозв'язаний кружечок
    let nextUnsolved = -1;
    for (let i = 1; i < nodesData.length; i++) {
      if (!nodesData[i].solved) {
        nextUnsolved = i;
        break;
      }
    }

    if (nextUnsolved !== -1) {
      activeNodeIndex = nextUnsolved;
      renderNodes();
      updateSnakeHeadPose();
    } else {
      // Усі кружечки заповнені правильно! Фінальний салют!
      activeNodeIndex = -1;
      snakeHeadState.mood = 'victory';
      renderNodes();
      updateSnakeHeadPose();
      setTimeout(() => {
        sound.playVictoryFanfare();
        triggerVictoryCelebration();
      }, 180);
    }
  }

  // Коли допущено помилку
  function onNodeError(idx) {
    const node = nodesData[idx];
    sound.playError();
    snakeHeadState.mood = 'surprised';
    drawSnakeHead();

    const circleEl = document.getElementById(`node-circle-${idx}`);
    const groupEl = document.getElementById(`node-group-${idx}`);
    if (circleEl) {
      circleEl.setAttribute('fill', 'url(#nodeErrorGrad)');
    }
    if (groupEl) {
      groupEl.classList.add('shake-node');
    }

    setTimeout(() => {
      node.userValue = '';
      snakeHeadState.mood = 'neutral';
      renderNodes();
      drawSnakeHead();
    }, 520);
  }

  // ============================================================================
  // 9. СИСТЕМА ВІЗУАЛЬНИХ ЕФЕКТІВ (ІСКРИ, ЛИСТЯ, СВІТЛЯЧКИ)
  // ============================================================================
  function spawnSparkles(cx, cy, color = '#fde047', count = 16) {
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.3;
      const speed = 45 + Math.random() * 65;
      const tx = cx + Math.cos(angle) * speed;
      const ty = cy + Math.sin(angle) * speed;

      const star = document.createElementNS(SVG_NS, 'circle');
      star.setAttribute('cx', cx);
      star.setAttribute('cy', cy);
      star.setAttribute('r', String(4 + Math.random() * 5));
      star.setAttribute('fill', i % 2 === 0 ? '#fef08a' : color);
      fxLayer.appendChild(star);

      const anim = star.animate(
        [
          { transform: 'translate(0px, 0px) scale(1)', opacity: 1 },
          { transform: `translate(${(tx - cx).toFixed(1)}px, ${(ty - cy).toFixed(1)}px) scale(0.1)`, opacity: 0 }
        ],
        {
          duration: 550 + Math.random() * 250,
          easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
        }
      );
      anim.onfinish = () => star.remove();
    }
  }

  function triggerVictoryCelebration() {
    nodesData.forEach((n, i) => {
      setTimeout(() => {
        spawnSparkles(n.x, n.y, '#4ade80', 22);
      }, i * 95);
    });
  }

  // Генерація живих лісових світлячків на фоні
  function initFireflies() {
    firefliesLayer.innerHTML = '';
    for (let i = 0; i < 18; i++) {
      const fx = Math.random() * 1240 + 20;
      const fy = Math.random() * 700 + 30;
      const r = 2 + Math.random() * 3.5;

      const dot = document.createElementNS(SVG_NS, 'circle');
      dot.setAttribute('cx', fx.toFixed(1));
      dot.setAttribute('cy', fy.toFixed(1));
      dot.setAttribute('r', r.toFixed(1));
      dot.setAttribute('fill', '#d9f99d');
      dot.setAttribute('opacity', '0.5');
      firefliesLayer.appendChild(dot);

      const dx = (Math.random() - 0.5) * 90;
      const dy = (Math.random() - 0.5) * 70;
      dot.animate(
        [
          { transform: 'translate(0px, 0px)', opacity: 0.15 },
          { transform: `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`, opacity: 0.75 },
          { transform: 'translate(0px, 0px)', opacity: 0.15 }
        ],
        {
          duration: 4000 + Math.random() * 4000,
          iterations: Infinity,
          easing: 'ease-in-out'
        }
      );
    }
  }

  // ============================================================================
  // 10. ПІДКЛЮЧЕННЯ КНОПОК ТА ФІЗИЧНОЇ КЛАВІАТУРИ
  // ============================================================================
  document.getElementById('btn-mode-10').addEventListener('pointerdown', () => {
    sound.playSlither();
    currentMode = 10;
    document.getElementById('btn-mode-10').classList.add('active-mode');
    document.getElementById('btn-mode-100').classList.remove('active-mode');
    createNewTask();
  });

  document.getElementById('btn-mode-100').addEventListener('pointerdown', () => {
    sound.playSlither();
    currentMode = 100;
    document.getElementById('btn-mode-100').classList.add('active-mode');
    document.getElementById('btn-mode-10').classList.remove('active-mode');
    createNewTask();
  });

  document.getElementById('btn-regen').addEventListener('pointerdown', () => {
    sound.playSlither();
    createNewTask();
  });

  // Підтримка фізичної клавіатури ноутбука/ПК
  window.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') {
      e.preventDefault();
      handleDigitInput(e.key);
    } else if (e.key === 'Backspace' || e.key === 'Delete') {
      e.preventDefault();
      handleBackspace();
    } else if (e.key === ' ' || e.key === 'Enter') {
      // Якщо всі вузли розв'язані, Enter або Пробіл генерує нову змію
      const allSolved = nodesData.every(n => n.solved);
      if (allSolved) {
        e.preventDefault();
        sound.playSlither();
        createNewTask();
      }
    }
  });

  // Ініціалізація при завантаженні
  initFireflies();
  buildNumpad();
  createNewTask();
</script>
</body>
</html>
