<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vet Clinic Math</title>
  <style>
    /* =====================================================================
       1. BASE RESET & FULL-VIEWPORT 16:9 WIDESCREEN STAGE
       ===================================================================== */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 32% 24%, #d6dfc9 0%, #aebca2 52%, #7d6d58 100%);
      font-family: "Trebuchet MS", "Nunito", "Segoe UI", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Responsive 16:9 container that fits 100vw x 100vh with zero scroll */
    #game-stage {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(34, 24, 14, 0.45);
      background: #c5d4b9;
    }

    #clinic-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    /* =====================================================================
       2. SAFE SVG ANIMATIONS (ONLY ON INNER <g> WITHOUT SVG transform!)
       ===================================================================== */
    @keyframes cloudDriftSlow {
      0% { transform: translateX(-70px); }
      100% { transform: translateX(460px); }
    }
    @keyframes cloudDriftMed {
      0% { transform: translateX(-95px); }
      100% { transform: translateX(480px); }
    }
    @keyframes treeSway {
      0%, 100% { transform: rotate(-1.6deg); }
      50% { transform: rotate(2.1deg); }
    }
    @keyframes fernSway {
      0%, 100% { transform: rotate(-2.4deg); }
      50% { transform: rotate(2.4deg); }
    }
    @keyframes dustFloat {
      0% { transform: translate(0px, 0px); opacity: 0.14; }
      50% { transform: translate(16px, -20px); opacity: 0.6; }
      100% { transform: translate(30px, -40px); opacity: 0.08; }
    }
    @keyframes sunPulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.34; }
    }

    .anim-cloud-1 { animation: cloudDriftSlow 48s linear infinite; }
    .anim-cloud-2 { animation: cloudDriftMed 36s linear infinite; animation-delay: -16s; }
    .anim-tree {
      transform-box: fill-box;
      transform-origin: 0% 50%;
      animation: treeSway 6.5s ease-in-out infinite;
    }
    .anim-fern-1 {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: fernSway 5.4s ease-in-out infinite;
    }
    .anim-fern-2 {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: fernSway 6.6s ease-in-out infinite reverse;
    }
    .anim-dust { animation: dustFloat 9.5s ease-in-out infinite; }
    .anim-sunbeam { animation: sunPulse 8s ease-in-out infinite; }

    /* Veterinarian gentle breathing, blinking, and healing gestures */
    @keyframes vetBreathe {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.012); }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      95%, 97% { transform: scaleY(0.08); }
    }
    @keyframes vetHealArm {
      0% { transform: rotate(0deg); }
      22% { transform: rotate(-20deg) translate(16px, -14px); }
      52% { transform: rotate(-14deg) translate(24px, -8px); }
      74% { transform: rotate(-22deg) translate(18px, -16px); }
      100% { transform: rotate(0deg); }
    }
    @keyframes vetHeadNod {
      0%, 100% { transform: rotate(0deg); }
      35% { transform: rotate(5deg); }
      70% { transform: rotate(-2.5deg); }
    }
    @keyframes vetHeadPuzzle {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-7deg); }
      70% { transform: rotate(5deg); }
    }

    .anim-vet-torso {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: vetBreathe 4.2s ease-in-out infinite;
    }
    .anim-vet-eyes {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: eyeBlink 4.9s ease-in-out infinite;
    }
    .anim-vet-head {
      transform-box: fill-box;
      transform-origin: 50% 85%;
    }
    .anim-vet-arm {
      transform-box: fill-box;
      transform-origin: 18% 18%;
    }
    .vet-healing .anim-vet-arm {
      animation: vetHealArm 2.2s ease-in-out 1;
    }
    .vet-healing .anim-vet-head {
      animation: vetHeadNod 1.8s ease-in-out 1;
    }
    .vet-puzzled .anim-vet-head {
      animation: vetHeadPuzzle 0.65s ease-in-out 1;
    }

    /* Animal grounded idle, shiver, entrance/exit, and joyful recovery */
    @keyframes animalBreathe {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.018); }
    }
    @keyframes animalShiver {
      0%, 100% { transform: translateX(0px); }
      25% { transform: translateX(-1.4px); }
      50% { transform: translateX(1.4px); }
      75% { transform: translateX(-0.9px); }
    }
    @keyframes animalJoyHop {
      0%, 100% { transform: translateY(0px) scale(1, 1); }
      20% { transform: translateY(2px) scale(1.03, 0.96); }
      48% { transform: translateY(-18px) scale(0.98, 1.03); }
      72% { transform: translateY(1px) scale(1.02, 0.98); }
      88% { transform: translateY(-7px) scale(0.99, 1.01); }
    }
    @keyframes tailSwaySlow {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }
    @keyframes tailWagFast {
      0%, 100% { transform: rotate(-16deg); }
      50% { transform: rotate(18deg); }
    }
    @keyframes earPerk {
      0%, 100% { transform: rotate(0deg); }
      45% { transform: rotate(-9deg); }
      75% { transform: rotate(4deg); }
    }
    @keyframes wingFlap {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-24deg); }
      60% { transform: rotate(10deg); }
    }
    @keyframes headTiltGentle {
      0%, 100% { transform: rotate(0deg); }
      35% { transform: rotate(8deg); }
      70% { transform: rotate(-5deg); }
    }

    /* Entrance / exit uses ONLY inner wrapper without SVG transform */
    #patient-motion {
      transition: transform 0.58s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.42s ease;
    }
    #patient-motion.entering {
      transform: translateX(280px);
      opacity: 0;
    }
    #patient-motion.exiting {
      transform: translateX(320px);
      opacity: 0;
    }
    #patient-motion.present {
      transform: translateX(0px);
      opacity: 1;
    }

    .anim-animal-body {
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }
    .state-sick .anim-animal-body {
      animation: animalBreathe 3.4s ease-in-out infinite;
    }
    .state-sick .anim-shiver {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: animalShiver 2.5s ease-in-out infinite;
    }
    .state-healthy .anim-animal-body {
      animation: animalJoyHop 0.92s ease-in-out 2;
    }
    .state-curious .anim-animal-head {
      transform-box: fill-box;
      transform-origin: 50% 80%;
      animation: headTiltGentle 0.65s ease-in-out 1;
    }

    .anim-tail {
      transform-box: fill-box;
      transform-origin: 18% 82%;
    }
    .state-sick .anim-tail {
      animation: tailSwaySlow 4.2s ease-in-out infinite;
    }
    .state-healthy .anim-tail {
      animation: tailWagFast 0.34s ease-in-out infinite;
    }

    .anim-ear {
      transform-box: fill-box;
      transform-origin: 50% 85%;
    }
    .state-healthy .anim-ear {
      animation: earPerk 0.78s ease-in-out 2;
    }

    .anim-wing-l {
      transform-box: fill-box;
      transform-origin: 85% 30%;
    }
    .anim-wing-r {
      transform-box: fill-box;
      transform-origin: 15% 30%;
    }
    .state-healthy .anim-wing-l {
      animation: wingFlap 0.55s ease-in-out 3;
    }
    .state-healthy .anim-wing-r {
      animation: wingFlap 0.55s ease-in-out 3 reverse;
    }

    .sick-only { transition: opacity 0.35s ease; opacity: 1; }
    .healthy-only { transition: opacity 0.35s ease; opacity: 0; }
    .state-healthy .sick-only { opacity: 0; }
    .state-healthy .healthy-only { opacity: 1; }

    /* Celebration Particle & Treatment VFX Animations */
    @keyframes fxRipple {
      0% { transform: scale(0.35); opacity: 0.92; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    @keyframes fxDrop {
      0% { transform: translateY(-10px) scale(0.75); opacity: 0; }
      25% { opacity: 1; }
      85% { transform: translateY(34px) scale(1); opacity: 0.9; }
      100% { transform: translateY(46px) scale(0.4); opacity: 0; }
    }
    @keyframes fxParticleRise {
      0% { transform: translate(0px, 12px) scale(0.25) rotate(0deg); opacity: 0; }
      22% { opacity: 1; transform: translate(var(--dx1, 6px), -14px) scale(1.05) rotate(40deg); }
      80% { opacity: 0.9; }
      100% { transform: translate(var(--dx2, 14px), -95px) scale(0.35) rotate(145deg); opacity: 0; }
    }

    .fx-ripple {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: fxRipple 1.1s ease-out infinite;
    }
    .fx-drop {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: fxDrop 0.85s ease-in infinite;
    }
    .fx-particle {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: fxParticleRise 1.65s ease-out forwards;
    }

    /* =====================================================================
       3. ROCK-SOLID HTML/CSS UI OVERLAY (ZERO BUTTON RUNNING AWAY!)
       ===================================================================== */

    /* TOP-RIGHT MINIMALIST ICON BUTTONS */
    #top-controls {
      position: absolute;
      top: 2.8%;
      right: 2.2%;
      display: flex;
      gap: 0.9vw;
      z-index: 30;
    }

    .ctrl-btn {
      width: clamp(44px, 4vw, 64px);
      height: clamp(44px, 4vw, 64px);
      border-radius: 50%;
      border: 3px solid #6e4a14;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      outline: none;
      box-shadow:
        0 6px 14px rgba(34, 21, 9, 0.36),
        inset 0 2px 4px rgba(255, 248, 222, 0.45);
      transform-origin: center center;
      transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
    }

    .ctrl-btn-wood {
      background: linear-gradient(145deg, #c98e55 0%, #9b6030 60%, #75431c 100%);
      border-color: #e2b85c;
    }

    .ctrl-btn-brass {
      background: linear-gradient(145deg, #f8df93 0%, #d4a644 55%, #9a6e1f 100%);
      border-color: #6b4712;
    }

    /* Strictly centered tiny scale + brightness on hover — NEVER shifts position */
    .ctrl-btn:hover {
      transform: scale(1.04);
      filter: brightness(1.08);
      box-shadow:
        0 0 14px rgba(255, 224, 130, 0.65),
        0 6px 14px rgba(34, 21, 9, 0.36),
        inset 0 2px 4px rgba(255, 248, 222, 0.55);
    }

    .ctrl-btn:active {
      transform: scale(0.96);
    }

    .ctrl-btn svg {
      width: 56%;
      height: 56%;
      pointer-events: none;
    }

    /* WOODEN VETERINARY CLIPBOARD (EQUATION BOARD) */
    #clipboard-wrap {
      position: absolute;
      top: 4.5%;
      left: 34.5%;
      width: 53%;
      height: 22.5%;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #clipboard-board {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: clamp(14px, 1.8vw, 26px);
      background:
        repeating-linear-gradient(
          3deg,
          rgba(92, 51, 20, 0.08) 0px,
          rgba(92, 51, 20, 0.08) 3px,
          transparent 3px,
          transparent 14px
        ),
        linear-gradient(155deg, #be834c 0%, #9b6131 52%, #7a461e 100%);
      border: 4px solid #633817;
      box-shadow:
        0 12px 26px rgba(36, 22, 10, 0.38),
        inset 0 2px 6px rgba(255, 227, 181, 0.35),
        inset 0 -4px 10px rgba(61, 31, 10, 0.45);
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      padding: 2.2% 2.6%;
    }

    /* Inner warm engraved border on clipboard */
    #clipboard-board::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: clamp(10px, 1.3vw, 18px);
      border: 1.5px solid rgba(235, 188, 126, 0.48);
      background: rgba(84, 48, 21, 0.22);
      pointer-events: none;
    }

    /* Brass metal clipboard clip at top center */
    #clipboard-clip {
      position: absolute;
      top: -12%;
      left: 50%;
      transform: translateX(-50%);
      width: 18%;
      height: 22%;
      border-radius: 10px;
      background: linear-gradient(180deg, #f9e29c 0%, #d4a441 55%, #8f651d 100%);
      border: 2.5px solid #6b4712;
      box-shadow: 0 4px 8px rgba(36, 22, 10, 0.35);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12%;
    }

    #clipboard-clip::before,
    #clipboard-clip::after {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #61400f;
      box-shadow: inset 0 1px 1px rgba(255, 240, 180, 0.5);
    }

    /* NUMBER TILES (Warm textured enamel — NO white rectangles!) */
    .num-tile {
      position: relative;
      z-index: 2;
      width: 11.8%;
      height: 68%;
      border-radius: clamp(10px, 1.3vw, 18px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(24px, 4.3vw, 68px);
      font-weight: 800;
      line-height: 1;
      box-shadow:
        0 6px 12px rgba(38, 22, 9, 0.36),
        inset 0 2px 3px rgba(255, 250, 232, 0.65);
    }

    .tile-a {
      background: linear-gradient(180deg, #f8e4b9 0%, #e1bc7a 100%);
      border: 3px solid #9c7236;
      color: #4a2d15;
    }

    .tile-b {
      background: linear-gradient(180deg, #dbedd2 0%, #a8cc9a 100%);
      border: 3px solid #5a8250;
      color: #254021;
    }

    .tile-c {
      background: linear-gradient(180deg, #f7d6c4 0%, #dfa98c 100%);
      border: 3px solid #a16041;
      color: #522817;
    }

    .tile-r {
      width: 13.6%;
      background: linear-gradient(180deg, #ffe9a3 0%, #e5b74a 100%);
      border: 3.5px solid #99701d;
      color: #4a3008;
      font-weight: 900;
    }

    /* Brass Equals Symbol */
    .equals-sign {
      position: relative;
      z-index: 2;
      width: 6.2%;
      height: 44%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18%;
    }

    .equals-bar {
      width: 100%;
      height: 20%;
      border-radius: 99px;
      background: linear-gradient(180deg, #f8e198 0%, #c99835 100%);
      border: 2px solid #6b4812;
      box-shadow: 0 3px 6px rgba(36, 22, 9, 0.32);
    }

    /* EQUATION SIGN SLOTS (Clickable to select OR clear, drop targets) */
    @keyframes activeSlotPulse {
      0%, 100% {
        box-shadow:
          0 0 0 3px rgba(255, 213, 79, 0.85),
          0 0 18px rgba(255, 213, 79, 0.72),
          inset 0 4px 10px rgba(20, 10, 4, 0.65);
      }
      50% {
        box-shadow:
          0 0 0 5px rgba(255, 232, 130, 1),
          0 0 26px rgba(255, 213, 79, 0.98),
          inset 0 4px 10px rgba(20, 10, 4, 0.65);
      }
    }

    @keyframes slotShakeGentle {
      0%, 100% { transform: translateX(0px); }
      20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    @keyframes tokenPopIn {
      0% { transform: scale(0.45); opacity: 0; }
      72% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes slotSuccessBounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .eq-slot {
      position: relative;
      z-index: 3;
      width: clamp(54px, 6vw, 94px);
      height: clamp(54px, 6vw, 94px);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 55%, #52321b 0%, #3a200f 75%, #2a1508 100%);
      border: 3.5px dashed #d9ae57;
      box-shadow: inset 0 5px 12px rgba(20, 10, 4, 0.65);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      outline: none;
      transform-origin: center center;
      transition: transform 0.14s ease, border-color 0.16s ease, box-shadow 0.16s ease, filter 0.14s ease;
    }

    .eq-slot.active-target {
      border-style: solid;
      border-color: #ffe078;
      animation: activeSlotPulse 1.8s ease-in-out infinite;
    }

    .eq-slot.filled {
      border-style: solid;
      border-color: rgba(232, 193, 114, 0.65);
    }

    /* Subtle hover feedback — NEVER shifts position */
    .eq-slot:hover {
      transform: scale(1.04);
      filter: brightness(1.08);
    }

    .eq-slot.filled:hover {
      box-shadow:
        0 0 0 3px rgba(255, 224, 150, 0.9),
        0 0 16px rgba(255, 200, 110, 0.75);
    }

    .eq-slot.drag-over {
      transform: scale(1.08);
      border-style: solid;
      border-color: #79f2b4;
      box-shadow:
        0 0 0 4px rgba(121, 242, 180, 0.85),
        0 0 22px rgba(88, 224, 158, 0.9);
    }

    .eq-slot.wrong-shake {
      border-style: solid;
      border-color: #ff7e66;
      box-shadow:
        0 0 0 4px rgba(255, 126, 102, 0.9),
        0 0 22px rgba(255, 112, 86, 0.85);
      animation: slotShakeGentle 0.48s ease-in-out;
    }

    .eq-slot.correct-glow {
      border-style: solid;
      border-color: #82f5b8;
      box-shadow:
        0 0 0 4px rgba(130, 245, 184, 0.92),
        0 0 24px rgba(88, 224, 158, 0.95);
      animation: slotSuccessBounce 0.55s ease-in-out 2;
    }

    /* Sign badge rendered inside a filled slot */
    .slot-badge {
      width: 90%;
      height: 90%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transform-origin: center center;
      animation: tokenPopIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* WALNUT & BRASS MEDICAL SIGN TRAY (BOTTOM CENTER) */
    #medical-tray {
      position: absolute;
      bottom: 2.6%;
      left: 55.5%;
      transform: translateX(-50%);
      width: 34%;
      height: 16.5%;
      border-radius: clamp(18px, 2.2vw, 32px);
      background: linear-gradient(180deg, #744828 0%, #56321a 52%, #3d2110 100%);
      border: 4px solid #a86f3d;
      box-shadow:
        0 14px 28px rgba(30, 17, 7, 0.45),
        inset 0 2px 5px rgba(255, 221, 170, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4% 2.6%;
      z-index: 25;
    }

    .tray-pocket {
      width: 45.5%;
      height: 100%;
      border-radius: clamp(12px, 1.5vw, 22px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 4px 10px rgba(15, 9, 5, 0.5);
    }

    .tray-pocket-plus {
      background: linear-gradient(180deg, #2d544f 0%, #21403c 100%);
      border: 2px solid #4c7d77;
    }

    .tray-pocket-minus {
      background: linear-gradient(180deg, #52342c 0%, #3d241e 100%);
      border: 2px solid #865a4e;
    }

    .tray-clasp {
      width: 3%;
      height: 52%;
      border-radius: 99px;
      background: linear-gradient(180deg, #f6dc8d 0%, #c89835 60%, #8a6019 100%);
      border: 1.5px solid #593b0d;
      pointer-events: none;
    }

    /* STATIONARY '+' AND '-' SIGN BUTTONS */
    .sign-token {
      position: relative;
      width: clamp(56px, 6.2vw, 96px);
      height: clamp(56px, 6.2vw, 96px);
      border-radius: 50%;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      outline: none;
      touch-action: none;
      transform-origin: center center;
      transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
    }

    .sign-token:active {
      cursor: grabbing;
      transform: scale(0.97);
    }

    /* Strictly centered tiny scale + warm glow on hover — NEVER shifts position! */
    .sign-token:hover {
      transform: scale(1.04);
      filter: brightness(1.08);
    }

    .sign-plus-style {
      background: radial-gradient(circle at 35% 30%, #5ee3a1 0%, #22ad6e 56%, #117549 100%);
      border: 3.5px solid #0d5c39;
      box-shadow:
        0 6px 14px rgba(16, 46, 30, 0.45),
        inset 0 3px 6px rgba(220, 255, 238, 0.45);
    }

    .sign-plus-style:hover {
      box-shadow:
        0 0 18px rgba(94, 227, 161, 0.78),
        0 6px 14px rgba(16, 46, 30, 0.45),
        inset 0 3px 6px rgba(220, 255, 238, 0.55);
    }

    .sign-minus-style {
      background: radial-gradient(circle at 35% 30%, #ff9d73 0%, #e76238 56%, #b23a17 100%);
      border: 3.5px solid #8a290c;
      box-shadow:
        0 6px 14px rgba(54, 18, 9, 0.45),
        inset 0 3px 6px rgba(255, 232, 220, 0.45);
    }

    .sign-minus-style:hover {
      box-shadow:
        0 0 18px rgba(255, 157, 115, 0.78),

      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.muted = false;
          this.melodyIdx = 0;
        }

        ensure() {
          if (this.muted) return null;
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        }

        toggleMute() {
          this.muted = !this.muted;
          return this.muted;
        }

        tone(freq, dur, type = 'sine', vol = 0.16, delay = 0, endFreq = null) {
          const ctx = this.ensure();
          if (!ctx) return;
          const t0 = ctx.currentTime + delay;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t0);
          if (endFreq !== null) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), t0 + dur);
          }
          gain.gain.setValueAtTime(0.001, t0);
          gain.gain.linearRampToValueAtTime(vol, t0 + 0.014);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t0);
          osc.stop(t0 + dur + 0.02);
        }

        noise(dur, freq = 1000, vol = 0.07, delay = 0) {
          const ctx = this.ensure();
          if (!ctx) return;
          const t0 = ctx.currentTime + delay;
          const len = Math.floor(ctx.sampleRate * dur);
          const buf = ctx.createBuffer(1, len, ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < len; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.55));
          }
          const src = ctx.createBufferSource();
          src.buffer = buf;
          const filt = ctx.createBiquadFilter();
          filt.type = 'bandpass';
          filt.frequency.setValueAtTime(freq, t0);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(vol, t0);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
          src.connect(filt);
          filt.connect(gain);
          gain.connect(ctx.destination);
          src.start(t0);
        }

        playSelectSlot() {
          this.tone(540, 0.07, 'sine', 0.1, 0, 660);
        }

        playPickup() {
          this.tone(430, 0.075, 'triangle', 0.13, 0, 590);
        }

        playPlace() {
          // Crisp warm wooden click
          this.tone(330, 0.08, 'triangle', 0.18, 0, 520);
          this.tone(720, 0.06, 'sine', 0.08, 0.02);
        }

        playRemove() {
          // Soft reverse pop

        }

        playSkip() {
          this.noise(0.12, 1450, 0.06, 0);
          this.tone(520, 0.09, 'triangle', 0.11, 0.02, 690);

        playArrival() {

        playTreatment(tool) {

        playSuccess(animalId) {

          const chosen = melodies[this.melodyIdx % melodies.length];

          chosen.notes.forEach((f, i) => {

      const sound = new SoundEngine();

      /* =====================================================================
         2. SMART INFINITE 1ST-TEN 2-STEP MATH GENERATOR
         ===================================================================== */
      function evalOp(x, op, y) {
        return op === '+' ? x + y : x - y;
      }

      class MathGenerator {
        constructor() {
          this.buckets = { '++': [], '+-': [], '-+': [], '--': [] };
          this.bag = [];
          this.lastCombo = null;
          this.recentIds = [];
          this.buildBuckets();
        }

        buildBuckets() {
          const ops = ['+', '-'];
          for (let a = 1; a <= 9; a++) {
            for (let b = 1; b <= 9; b++) {
              for (let c = 1; c <= 9; c++) {
                for (const op1 of ops) {
                  const step1 = evalOp(a, op1, b);
                  if (step1 < 0 || step1 > 10) continue;
                  for (const op2 of ops) {
                    const r = evalOp(step1, op2, c);
                    if (r < 0 || r > 10) continue;
                    const combo = op1 + op2;
                    this.buckets[combo].push({ a, b, c, r, op1, op2, id: `${a}${combo}${b}${c}=${r}` });
                  }
                }
              }
            }
          }
        }

        refillBag() {
          const combos = ['++', '+-', '-+', '--'];
          for (let i = combos.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [combos[i], combos[j]] = [combos[j], combos[i]];
          }
          // Guarantee operator combination never repeats consecutively across bags
          if (this.lastCombo && combos[combos.length - 1] === this.lastCombo) {
            [combos[0], combos[combos.length - 1]] = [combos[combos.length - 1], combos[0]];
          }
          this.bag = combos;
        }

        next() {
          if (this.bag.length === 0) this.refillBag();
          const combo = this.bag.pop();
          this.lastCombo = combo;

          const pool = this.buckets[combo];
          let picked = pool[Math.floor(Math.random() * pool.length)];
          for (let tries = 0; tries < 24; tries++) {
            const cand = pool[Math.floor(Math.random() * pool.length)];
            if (!this.recentIds.includes(cand.id)) {
              picked = cand;
              break;
            }
          }

          this.recentIds.push(picked.id);
          if (this.recentIds.length > 12) this.recentIds.shift();
          return picked;
        }
      }

      const mathGen = new MathGenerator();

        return `
          <div class="slot-badge sign-minus-style">
            <svg class="sign-svg" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
              <path d="M10,24 L38,24" stroke="#fff8f4" stroke-width="8.5" stroke-linecap="round" />
            </svg>
          </div>
        `;
      }

      function renderSlots() {
        slotEls.forEach((el, idx) => {
          const val = slots[idx];
          el.classList.toggle('filled', val !== null);
          el.classList.toggle('active-target', gameState === 'PLAYING' && activeSlot === idx);
          el.classList.remove('correct-glow', 'drag-over');

          // Only rebuild innerHTML when content actually changes to prevent flicker
          const currentSign = el.dataset.currentSign || '';
          const desiredSign = val || '';
          if (currentSign !== desiredSign) {
            el.dataset.currentSign = desiredSign;
            el.innerHTML = val ? getSignBadgeHTML(val) : '';
          }
        });
      }

      function nextAnimal() {
        if (animalBag.length === 0) {
          animalBag = [...ANIMALS];
          for (let i = animalBag.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [animalBag[i], animalBag[j]] = [animalBag[j], animalBag[i]];
          }
          if (currentAnimal && animalBag[animalBag.length - 1].id === currentAnimal.id) {
            [animalBag[0], animalBag[animalBag.length - 1]] = [animalBag[animalBag.length - 1], animalBag[0]];
          }
        }
        return animalBag.pop();
      }

      function hideAllTools() {
        Object.values(vetTools).forEach(t => t.setAttribute('opacity', '0'));
      }

      function spawnCelebrationVFX(tool) {
        let html = '';

        // Treatment-specific visual effect
        if (tool === 'stethoscope') {
          html += `
            <circle class="fx-ripple" cx="-115" cy="18" r="24" fill="none" stroke="#5de0d6" stroke-width="4" />
            <circle class="fx-ripple" cx="-115" cy="18" r="24" fill="none" stroke="#ffe17d" stroke-width="3" style="animation-delay: 0.45s;" />
          `;
        } else if (tool === 'dropper') {
          html += `
            <path class="fx-drop" d="M-92,-68 Q-81,-50 -92,-42 Q-103,-50 -92,-68 Z" fill="#5ce8a4" />
            <path class="fx-drop" d="M-78,-62 Q-69,-46 -78,-40 Q-87,-46 -78,-62 Z" fill="#ffd966" style="animation-delay: 0.35s;" />
          `;
        }

        // 4 Varied celebration particle themes rotating each round
        const themes = ['stars', 'hearts', 'bubbles', 'petals'];
        const theme = themes[celebrationThemeIdx % themes.length];
        celebrationThemeIdx++;

        const spots = [
          { x: -120, y: -34, d: 0.12, dx1: -12, dx2: -26, s: 1.1 },
          { x: -52,  y: -96, d: 0.24, dx1: -6,  dx2: -14, s: 1.0 },
          { x: 12,   y: -116, d: 0.36, dx1: 8,  dx2: 18,  s: 1.15 },
          { x: 74,   y: -86, d: 0.20, dx1: 14,  dx2: 28,  s: 0.95 },
          { x: 122,  y: -30, d: 0.42, dx1: 10,  dx2: 22,  s: 0.9 },
          { x: -88,  y: -78, d: 0.52, dx1: -10, dx2: -22, s: 0.85 },
          { x: 42,   y: -60, d: 0.58, dx1: 6,   dx2: 12,  s: 1.05 }
        ];

        const colors = ['#ffe066', '#f2798f', '#70e8b3', '#78e3dc', '#ff9f76', '#d8a7ff', '#ffd966'];

        spots.forEach((p, i) => {
          const col = colors[i % colors.length];
          const styleStr = `animation-delay:${p.d}s; --dx1:${p.dx1}px; --dx2:${p.dx2}px;`;
          let shape = '';

          if (theme === 'stars') {
            shape = `<path class="fx-particle" style="${styleStr}" d="M0,-18 L4.5,-5 L18,0 L4.5,5 L0,18 L-4.5,5 L-18,0 L-4.5,-5 Z" fill="${col}" filter="url(#glowGold)" />`;
          } else if (theme === 'hearts') {
            shape = `<path class="fx-particle" style="${styleStr}" d="M0,-4 C0,-14 14,-14 14,-4 C14,6 0,15 0,15 C0,15 -14,6 -14,-4 C-14,-14 0,-14 0,-4 Z" fill="${col}" />`;
          } else if (theme === 'bubbles') {
            shape = `
              <g class="fx-particle" style="${styleStr}">
                <circle cx="0" cy="0" r="14" fill="${col}" fill-opacity="0.34" stroke="${col}" stroke-width="2.5" />
                <ellipse cx="-5" cy="-5" rx="4" ry="2.2" transform="rotate(-30 -5 -5)" fill="#ffffff" opacity="0.75" />
              </g>
            `;
          } else {
            shape = `<path class="fx-particle" style="${styleStr}" d="M0,-16 Q12,-4 0,16 Q-12,-4 0,-16 Z" fill="${col}" filter="url(#glowGold)" />`;
          }

          html += `<g transform="translate(${p.x}, ${p.y}) scale(${p.s})">${shape}</g>`;
        });

        healingVfx.innerHTML = html;
      }

      /* =====================================================================
         7. ROUND LIFECYCLE & VALIDATION
         ===================================================================== */
      function clearPendingEval() {
        if (evalTimer !== null) {
          clearTimeout(evalTimer);
          evalTimer = null;
        }
      }

      function startNewRound(isSkip = false) {
        clearPendingEval();
        roundToken++;
        const myToken = roundToken;

        gameState = 'ENTERING';
        slots = [null, null];
        activeSlot = 0;
        healingVfx.innerHTML = '';
        hideAllTools();
        vetEl.classList.remove('vet-healing', 'vet-puzzled');
        slotEls.forEach(el => el.classList.remove('wrong-shake', 'correct-glow'));

        currentProblem = mathGen.next();
        currentAnimal = nextAnimal();

        numAEl.textContent = currentProblem.a;
        numBEl.textContent = currentProblem.b;
        numCEl.textContent = currentProblem.c;
        numREl.textContent = currentProblem.r;
        renderSlots();

        // Smooth grounded slide-in onto the examination mat
        patientMotion.classList.remove('present', 'exiting');
        patientMotion.classList.add('entering');
        patientContainer.innerHTML = `<g class="state-sick">${currentAnimal.svg}</g>`;

        void patientMotion.getBoundingClientRect();

        requestAnimationFrame(() => {
          if (myToken !== roundToken) return;
          patientMotion.classList.remove('entering');
          patientMotion.classList.add('present');
          if (!isSkip) sound.playArrival();
        });

        setTimeout(() => {
          if (myToken !== roundToken) return;
          gameState = 'PLAYING';
          renderSlots();
        }, 360);
      }

      function placeSignInSlot(slotIdx, sign) {
        if (gameState !== 'PLAYING') return;
        clearPendingEval();

        slots[slotIdx] = sign;
        sound.playPlace();

        // Automatically move active selection to the remaining empty slot (if any)
        const otherIdx = slotIdx === 0 ? 1 : 0;
        if (slots[otherIdx] === null) {
          activeSlot = otherIdx;
        } else {
          activeSlot = slotIdx;
        }

        slotEls.forEach(el => el.classList.remove('wrong-shake'));
        renderSlots();

        // Automatically evaluate 300ms after both slots are filled
        if (slots[0] !== null && slots[1] !== null) {
          const myToken = roundToken;
          evalTimer = setTimeout(() => {
            evalTimer = null;
            if (myToken !== roundToken || gameState !== 'PLAYING') return;
            if (slots[0] === null || slots[1] === null) return;
            evaluateCurrentAnswer(myToken);
          }, 300);
        }
      }

      function evaluateCurrentAnswer(myToken) {
        const step1 = evalOp(currentProblem.a, slots[0], currentProblem.b);
        const finalVal = evalOp(step1, slots[1], currentProblem.c);
        const isCorrect = (step1 >= 0 && finalVal === currentProblem.r);

        if (isCorrect) {
          triggerVictory(myToken);
        } else {
          triggerGentleWrong(myToken);
        }
      }

      function triggerVictory(myToken) {
        gameState = 'HEALING';
        activeSlot = -1;
        renderSlots();
        slotEls.forEach(el => el.classList.add('correct-glow'));

        hideAllTools();
        const tool = currentAnimal.tool;
        if (vetTools[tool]) vetTools[tool].setAttribute('opacity', '1');
        vetEl.classList.remove('vet-healing');
        void vetEl.getBoundingClientRect();
        vetEl.classList.add('vet-healing');

        sound.playTreatment(tool);
        spawnCelebrationVFX(tool);

        setTimeout(() => {
          if (myToken !== roundToken) return;
          const inner = patientContainer.firstElementChild;
          if (inner) {
            inner.classList.remove('state-sick');
            inner.classList.add('state-healthy');
          }
          sound.playSuccess(currentAnimal.id);
        }, 440);

        // ~2.8s of joyful celebration, then smoothly transition to next patient
        setTimeout(() => {
          if (myToken !== roundToken) return;
          gameState = 'EXITING';
          hideAllTools();
          vetEl.classList.remove('vet-healing');
          patientMotion.classList.remove('present');
          patientMotion.classList.add('exiting');
        }, 2800);

        setTimeout(() => {
          if (myToken !== roundToken) return;
          startNewRound(false);
        }, 3320);
      }

      function triggerGentleWrong(myToken) {
        sound.playWrong();

        // Keep placed signs so the child can click whichever sign they want to remove & fix!
        // Board stays unlocked and responsive immediately.
        slotEls.forEach(el => {
          el.classList.remove('wrong-shake');
          void el.offsetWidth;
          el.classList.add('wrong-shake');
        });

        const inner = patientContainer.firstElementChild;
        if (inner) {
          inner.classList.remove('state-curious');
          void inner.getBoundingClientRect();
          inner.classList.add('state-curious');
        }
        vetEl.classList.remove('vet-puzzled');
        void vetEl.getBoundingClientRect();
        vetEl.classList.add('vet-puzzled');

        setTimeout(() => {
          if (myToken !== roundToken) return;
          slotEls.forEach(el => el.classList.remove('wrong-shake'));
          vetEl.classList.remove('vet-puzzled');
          if (inner) inner.classList.remove('state-curious');
        }, 560);
      }

      /* =====================================================================
         8. INTERACTION: SLOT SELECTION, REMOVAL, CLICK-TO-PLACE & DRAG-DROP
         ===================================================================== */

      // Clicking a slot:
      // - If filled: immediately removes the sign (reverse pop) and selects that slot as active.
      // - If empty: selects that slot as the active target (lets child fill Slot 2 first!).
      slotEls.forEach((slotEl, idx) => {
        slotEl.addEventListener('pointerdown', (e) => {
          if (gameState !== 'PLAYING') return;
          e.preventDefault();
          sound.ensure();
          clearPendingEval();

          if (slots[idx] !== null) {
            slots[idx] = null;
            activeSlot = idx;
            sound.playRemove();
          } else {
            activeSlot = idx;
            sound.playSelectSlot();
          }
          slotEls.forEach(el => el.classList.remove('wrong-shake'));
          renderSlots();
        });
      });

      // Hit-test floating drag coordinates against the two HTML equation slots
      function getSlotUnderPoint(clientX, clientY) {
        const padding = 22; // Generous child-friendly drop margin
        for (let i = 0; i < slotEls.length; i++) {
          const rect = slotEls[i].getBoundingClientRect();
          if (
            clientX >= rect.left - padding &&
            clientX <= rect.right + padding &&
            clientY >= rect.top - padding &&
            clientY <= rect.bottom + padding
          ) {
            return i;
          }
        }
        return -1;
      }

      let dragState = null;

      tokenBtns.forEach(btn => {
        btn.addEventListener('pointerdown', (e) => {
          if (gameState !== 'PLAYING') return;
          e.preventDefault();
          sound.ensure();
          sound.playPickup();

          const sign = btn.dataset.sign;
          dragState = {
            sign,
            pointerId: e.pointerId,
            startX: e.clientX,
            startY: e.clientY,
            isDragging: false,
            hoveredSlot: -1
          };

          // Prepare lightweight ghost clone while original button stays 100% stationary
          dragGhost.className = sign === '+' ? 'sign-plus-style' : 'sign-minus-style';
          dragGhost.innerHTML = btn.innerHTML;
          dragGhost.style.left = `${e.clientX}px`;
          dragGhost.style.top = `${e.clientY}px`;

          btn.setPointerCapture(e.pointerId);
        });

        btn.addEventListener('pointermove', (e) => {
          if (!dragState || e.pointerId !== dragState.pointerId) return;
          const dist = Math.hypot(e.clientX - dragState.startX, e.clientY - dragState.startY);
          if (dist > 8) {
            dragState.isDragging = true;
            dragGhost.classList.add('visible');
          }

          if (dragState.isDragging) {
            dragGhost.style.left = `${e.clientX}px`;
            dragGhost.style.top = `${e.clientY}px`;

            const hovered = getSlotUnderPoint(e.clientX, e.clientY);
            dragState.hoveredSlot = hovered;
            slotEls.forEach((el, idx) => {
              el.classList.toggle('drag-over', idx === hovered);
            });
          }
        });

        const finishPointer = (e) => {
          if (!dragState || e.pointerId !== dragState.pointerId) return;
          const { sign, isDragging, hoveredSlot } = dragState;
          dragState = null;

          dragGhost.classList.remove('visible');
          slotEls.forEach(el => el.classList.remove('drag-over'));

          if (gameState !== 'PLAYING') return;

          if (isDragging) {
            if (hoveredSlot !== -1) {
              // Directly place or replace sign in the dropped slot
              placeSignInSlot(hoveredSlot, sign);
            }
          } else {
            // Simple click/tap -> place into the currently selected active slot
            const target = (activeSlot === 0 || activeSlot === 1) ? activeSlot : (slots[0] === null ? 0 : 1);
            placeSignInSlot(target, sign);
          }
        };

        btn.addEventListener('pointerup', finishPointer);
        btn.addEventListener('pointercancel', finishPointer);
      });

      // Top-right minimalist Next Patient button
      btnNext.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        sound.ensure();
        sound.playSkip();
        startNewRound(true);
      });

      // Top-right minimalist Sound Toggle button
      btnSound.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const isMuted = sound.toggleMute();
        iconSoundWaves.setAttribute('opacity', isMuted ? '0' : '1');
        iconSoundMute.setAttribute('opacity', isMuted ? '1' : '0');
        if (!isMuted) sound.playPickup();
      });

      /* =====================================================================
         9. INITIALIZE GAME
         ===================================================================== */
      window.addEventListener('load', () => {
        startNewRound(true);
      });
    })();
  </script>
</body>
