<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Математична крамниця</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1e120a;
      font-family: 'Rubik', sans-serif;
    }

    /* Adaptive 16:9 Widescreen Stage */
    #stage-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #3a2312 0%, #160c05 100%);
    }

    #game-stage {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 ratio */
      max-height: 100vh;
      max-width: 177.78vh;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85), inset 0 0 40px rgba(45, 22, 6, 0.7);
      border-radius: 14px;
      background: linear-gradient(180deg, #5e3a1e 0%, #3d2410 60%, #2a1709 100%);
    }

    /* Wood & Brass UI Styling - Zero white rectangles */
    .wood-btn {
      background: linear-gradient(180deg, #d79956 0%, #b37032 48%, #8f531d 100%);
      border: 3px solid #59310e;
      box-shadow:
        0 5px 0 #3f2107,
        0 8px 15px rgba(0,0,0,0.45),
        inset 0 2px 2px rgba(255, 232, 195, 0.65),
        inset 0 -3px 4px rgba(70, 34, 6, 0.6);
      color: #fff3d6;
      text-shadow: 0 2px 3px #3f2107;
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, filter 0.15s ease;
      cursor: pointer;
    }

    .wood-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }

    .wood-btn:active, .wood-btn.active-mode {
      transform: translateY(3px);
      box-shadow:
        0 2px 0 #3f2107,
        0 3px 6px rgba(0,0,0,0.4),
        inset 0 2px 5px rgba(40, 18, 2, 0.7);
    }

    .wood-btn.active-mode {
      background: linear-gradient(180deg, #f6b93b 0%, #e58e26 55%, #b7620e 100%);
      border-color: #fff0b8;
      color: #2c1402;
      text-shadow: 0 1px 0 rgba(255,255,255,0.6);
    }

    /* Brass Register Key */
    .brass-key {
      background: radial-gradient(circle at 32% 28%, #ffe89e 0%, #d99f38 58%, #9b6514 100%);
      border: 2.5px solid #5c3706;
      box-shadow:
        0 4px 0 #3d2303,
        0 6px 10px rgba(0,0,0,0.5),
        inset 0 2px 2px rgba(255, 250, 215, 0.8);
      color: #361c02;
      text-shadow: 0 1px 0 rgba(255, 240, 190, 0.7);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.1s ease;
      cursor: pointer;
    }

    .brass-key:hover {
      filter: brightness(1.1);
    }

    .brass-key:active, .brass-key.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #3d2303, inset 0 2px 4px rgba(0,0,0,0.4);
    }

    .emerald-key {
      background: radial-gradient(circle at 32% 28%, #88ef9d 0%, #2ea84c 58%, #16682b 100%);
      border: 2.5px solid #0d441b;
      box-shadow:
        0 4px 0 #092e12,
        0 6px 10px rgba(0,0,0,0.5),
        inset 0 2px 2px rgba(215, 255, 225, 0.8);
      color: #f4fff6;
    }

    .crimson-key {
      background: radial-gradient(circle at 32% 28%, #ff9e8a 0%, #cf452e 58%, #872110 100%);
      border: 2.5px solid #521005;
      box-shadow:
        0 4px 0 #380902,
        0 6px 10px rgba(0,0,0,0.5),
        inset 0 2px 2px rgba(255, 220, 210, 0.8);
      color: #fff5f2;
    }

    /* Awning Sway */
    @keyframes awningSway {
      0%, 100% { transform: rotateX(0deg) scaleY(1); }
      50% { transform: rotateX(6deg) scaleY(1.03); }
    }
    .awning-anim {
      transform-origin: top center;
      animation: awningSway 4.5s ease-in-out infinite;
    }

    /* Hanging Garland Swing */
    @keyframes gentleSwing {
      0%, 100% { transform: rotate(-2.5deg); }
      50% { transform: rotate(2.5deg); }
    }
    .swing-slow {
      transform-origin: top center;
      animation: gentleSwing 5.5s ease-in-out infinite;
    }
    .swing-slow-delay {
      transform-origin: top center;
      animation: gentleSwing 6.2s ease-in-out 1.4s infinite;
    }

    /* Seller Breathing & Head Motion */
    @keyframes sellerBreathe {
      0%, 100% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-3px) scaleY(1.012); }
    }
    .seller-torso-anim {
      transform-origin: bottom center;
      animation: sellerBreathe 3.6s ease-in-out infinite;
    }

    @keyframes headBob {
      0%, 100% { transform: rotate(-1.2deg) translateY(0px); }
      35% { transform: rotate(1.6deg) translateY(-2px); }
      70% { transform: rotate(-0.6deg) translateY(1px); }
    }
    .seller-head-anim {
      transform-origin: 250px 235px;
      animation: headBob 4.8s ease-in-out infinite;
    }

    /* Clouds drifting outside window */
    @keyframes cloudDrift {
      0% { transform: translateX(-140px); }
      100% { transform: translateX(340px); }
    }
    .cloud-1 { animation: cloudDrift 34s linear infinite; }
    .cloud-2 { animation: cloudDrift 46s linear -18s infinite; }

    /* Product Crate Card */
    .product-slot {
      position: relative;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
    }
    .product-slot:hover {
      transform: translateY(-6px) scale(1.04);
      filter: drop-shadow(0 10px 14px rgba(0,0,0,0.5));
    }
    .product-slot.selected-slot .crate-box {
      border-color: #ffd35c;
      box-shadow:
        0 0 0 3px #b87c14,
        0 0 22px rgba(255, 212, 82, 0.75),
        inset 0 0 18px rgba(255, 200, 60, 0.45);
    }
    .product-slot.selected-slot .product-svg-wrap {
      transform: scale(0.84) translateY(-4px);
      opacity: 0.45;
      filter: drop-shadow(0 0 10px rgba(255, 230, 120, 0.85));
    }

    /* Slate & Brass Giant Price Badge */
    .kraft-tag {
      background: linear-gradient(180deg, #2b1d12 0%, #1a1008 100%);
      border: 2.5px solid #d49b43;
      box-shadow: 0 5px 10px rgba(0,0,0,0.6), inset 0 1px 3px rgba(255, 230, 175, 0.35);
      color: #ffdfa0;
      border-radius: 12px;
      transform-origin: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .product-slot:hover .kraft-tag {
      transform: scale(1.07);
      border-color: #ffe28a;
    }
    .product-slot.selected-slot .kraft-tag {
      background: linear-gradient(180deg, #4a2f0d 0%, #2b1904 100%);
      border-color: #ffd659;
      color: #fff3bd;
    }

    /* Bag Squash & Stretch on item drop */
    @keyframes bagSquash {
      0% { transform: scale(1, 1); }
      30% { transform: scale(1.11, 0.89) translateY(6px); }
      65% { transform: scale(0.96, 1.05) translateY(-3px); }
      100% { transform: scale(1, 1); }
    }
    .bag-bounce {
      animation: bagSquash 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    /* Register Shake on Wrong Answer */
    @keyframes registerWobble {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-9px) rotate(-2deg); }
      40% { transform: translateX(9px) rotate(2deg); }
      60% { transform: translateX(-7px) rotate(-1.5deg); }
      80% { transform: translateX(6px) rotate(1.5deg); }
    }
    .shake-error {
      animation: registerWobble 0.48s ease-in-out;
    }

    /* Sunbeam dust motes */
    @keyframes floatDust {
      0%, 100% { transform: translate(0, 0); opacity: 0.25; }
      50% { transform: translate(12px, -18px); opacity: 0.75; }
    }
    .dust-mote {
      animation: floatDust 5s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="stage-wrapper">
    <div id="game-stage">

      <!-- ===================================================== -->
      <!-- 1. BACKGROUND SCENE SVG (Market Interior, Window, Shelves, Seller, Counter, Plate, Bag) -->
      <!-- ===================================================== -->
      <svg id="scene-svg" viewBox="0 0 1600 900" class="w-full h-full block" preserveAspectRatio="xMidYMid slice">
        <defs>
          <!-- Warm Shop Wall Gradient -->
          <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6b4223" />
            <stop offset="55%" stop-color="#4e2e16" />
            <stop offset="100%" stop-color="#2e190a" />
          </linearGradient>

          <!-- Wood Plank Pattern -->
          <pattern id="woodWallPattern" width="160" height="400" patternUnits="userSpaceOnUse">
            <rect width="160" height="400" fill="url(#wallGrad)" />
            <line x1="0" y1="0" x2="0" y2="400" stroke="#2a1507" stroke-width="3" />
            <line x1="80" y1="0" x2="80" y2="400" stroke="#361c0a" stroke-width="2" />
            <path d="M 15 40 Q 40 90 15 160 M 110 180 Q 135 240 115 320" stroke="#3c210e" stroke-width="2" fill="none" opacity="0.55" />
          </pattern>

          <!-- Sky Outside Window -->
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#68c4f8" />
            <stop offset="65%" stop-color="#b6e6ff" />
            <stop offset="100%" stop-color="#fff0c4" />
          </linearGradient>

          <!-- Sunbeam Gradient -->
          <linearGradient id="sunbeamGrad" x1="0" y1="0" x2="0.6" y2="1">
            <stop offset="0%" stop-color="#fff4b8" stop-opacity="0.28" />
            <stop offset="60%" stop-color="#ffd97d" stop-opacity="0.10" />
            <stop offset="100%" stop-color="#ffd97d" stop-opacity="0" />
          </linearGradient>

          <!-- Counter Oak Wood Gradient -->
          <linearGradient id="counterTopGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d48c46" />
            <stop offset="45%" stop-color="#b56f2c" />
            <stop offset="88%" stop-color="#8c5019" />
            <stop offset="100%" stop-color="#59310d" />
          </linearGradient>

          <linearGradient id="counterFrontGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6e3d14" />
            <stop offset="50%" stop-color="#4f2a0c" />
            <stop offset="100%" stop-color="#2e1705" />
          </linearGradient>

          <!-- Glazed Ceramic Plate Gradients -->
          <radialGradient id="plateRimGrad" cx="48%" cy="42%" r="56%">
            <stop offset="0%" stop-color="#fffdf7" />
            <stop offset="68%" stop-color="#f5e6c8" />
            <stop offset="90%" stop-color="#d9bd8c" />
            <stop offset="100%" stop-color="#b3925d" />
          </radialGradient>

          <radialGradient id="plateWellGrad" cx="45%" cy="40%" r="58%">
            <stop offset="0%" stop-color="#fffef9" />
            <stop offset="75%" stop-color="#edd9b4" />
            <stop offset="100%" stop-color="#c9ab79" />
          </radialGradient>

          <!-- Skin Gradients for Realistic Seller -->
          <radialGradient id="skinFaceGrad" cx="45%" cy="38%" r="58%">
            <stop offset="0%" stop-color="#ffdfc4" />
            <stop offset="65%" stop-color="#f2b891" />
            <stop offset="100%" stop-color="#d48c62" />
          </radialGradient>

          <radialGradient id="cheekBlush" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ec6b56" stop-opacity="0.48" />
            <stop offset="100%" stop-color="#ec6b56" stop-opacity="0" />
          </radialGradient>

          <linearGradient id="apronGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3b6e38" />
            <stop offset="60%" stop-color="#295227" />
            <stop offset="100%" stop-color="#1b391a" />
          </linearGradient>

          <linearGradient id="shirtGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f5dfbe" />
            <stop offset="100%" stop-color="#d8b78a" />
          </linearGradient>

          <linearGradient id="armSkinGrad" x1="0" y1="0" x2="1" y2="0.4">
            <stop offset="0%" stop-color="#ffdfc4" />
            <stop offset="65%" stop-color="#f0b68e" />
            <stop offset="100%" stop-color="#d69165" />
          </linearGradient>

          <linearGradient id="sleeveGrad" x1="0" y1="0" x2="1" y2="0.5">
            <stop offset="0%" stop-color="#f7e4c6" />
            <stop offset="65%" stop-color="#dfc196" />
            <stop offset="100%" stop-color="#c29c6d" />
          </linearGradient>

          <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8f4d23" />
            <stop offset="65%" stop-color="#633213" />
            <stop offset="100%" stop-color="#401e09" />
          </linearGradient>

          <!-- Kraft Paper Bag Gradients -->
          <linearGradient id="kraftBagFront" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e3b778" />
            <stop offset="45%" stop-color="#cc9b58" />
            <stop offset="80%" stop-color="#b3803e" />
            <stop offset="100%" stop-color="#946529" />
          </linearGradient>

          <linearGradient id="kraftBagInside" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6e481b" />
            <stop offset="100%" stop-color="#3d260b" />
          </linearGradient>

          <!-- Lantern Warm Glow -->
          <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff6b3" stop-opacity="0.95" />
            <stop offset="35%" stop-color="#ffba42" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#ff8800" stop-opacity="0" />
          </radialGradient>

          <!-- Window Clip -->
          <clipPath id="windowClip">
            <path d="M 55 95 Q 165 45 275 95 L 275 350 L 55 350 Z" />
          </clipPath>
        </defs>

        <!-- BACK WALL -->
        <rect x="0" y="0" width="1600" height="460" fill="url(#woodWallPattern)" />

        <!-- ARCHED WINDOW (Left Background) -->
        <g transform="translate(10, 22)">
          <g clip-path="url(#windowClip)">
            <rect x="50" y="45" width="230" height="310" fill="url(#skyGrad)" />
            <!-- Distant Rolling Hills -->
            <path d="M 50 310 Q 130 265 210 295 Q 250 275 285 300 L 285 360 L 50 360 Z" fill="#76b865" />
            <path d="M 50 330 Q 150 295 285 325 L 285 360 L 50 360 Z" fill="#529445" />
            <!-- Drifting Clouds -->
            <g class="cloud-1" opacity="0.88">
              <ellipse cx="110" cy="130" rx="34" ry="15" fill="#fff8e8" />
              <ellipse cx="130" cy="122" rx="24" ry="17" fill="#fffdf7" />
              <ellipse cx="92" cy="126" rx="20" ry="12" fill="#fff5df" />
            </g>
            <g class="cloud-2" opacity="0.75">
              <ellipse cx="150" cy="185" rx="28" ry="11" fill="#fff8e8" />
              <ellipse cx="168" cy="179" rx="18" ry="12" fill="#fffdf7" />
            </g>
          </g>
          <!-- Wooden Window Frame & Mullions -->
          <path d="M 55 95 Q 165 45 275 95 L 275 350 L 55 350 Z" fill="none" stroke="#3b1e0a" stroke-width="14" />
          <path d="M 55 95 Q 165 45 275 95 L 275 350 L 55 350 Z" fill="none" stroke="#854f25" stroke-width="5" />
          <line x1="165" y1="68" x2="165" y2="350" stroke="#4a260d" stroke-width="8" />
          <line x1="55" y1="215" x2="275" y2="215" stroke="#4a260d" stroke-width="8" />
          <rect x="42" y="344" width="246" height="18" rx="6" fill="#73421c" stroke="#361c08" stroke-width="3" />
        </g>

        <!-- BACKGROUND WOODEN SHELVES WITH JARS (Right & Center-Right) -->
        <g opacity="0.92">
          <!-- Upper Shelf -->
          <rect x="690" y="155" width="850" height="16" rx="5" fill="#7c471e" stroke="#381d08" stroke-width="3" />
          <path d="M 735 171 L 750 205 L 765 171 Z M 1100 171 L 1115 205 L 1130 171 Z M 1460 171 L 1475 205 L 1490 171 Z" fill="#42220a" />

          <!-- Honey Jar -->
          <g transform="translate(745, 88)">
            <rect x="6" y="14" width="44" height="52" rx="12" fill="#f7a823" stroke="#8f5308" stroke-width="2.5" />
            <rect x="10" y="20" width="12" height="36" rx="5" fill="#ffe184" opacity="0.55" />
            <path d="M 2 14 Q 28 6 54 14 L 50 22 L 6 22 Z" fill="#d9822b" stroke="#693805" stroke-width="2" />
            <rect x="14" y="32" width="28" height="16" rx="4" fill="#eed294" stroke="#7d5116" stroke-width="1.5" />
          </g>

          <!-- Jam Jar -->
          <g transform="translate(825, 96)">
            <rect x="4" y="12" width="40" height="46" rx="10" fill="#b82937" stroke="#5e0d15" stroke-width="2.5" />
            <rect x="9" y="18" width="9" height="30" rx="4" fill="#ff7a88" opacity="0.45" />
            <rect x="2" y="6" width="44" height="10" rx="4" fill="#c99e63" stroke="#5c3f16" stroke-width="2" />
          </g>

          <!-- Woven Decorative Basket on Shelf -->
          <g transform="translate(915, 95)">
            <path d="M 0 25 L 95 25 L 82 60 L 13 60 Z" fill="#c78842" stroke="#5e3910" stroke-width="2.5" />
            <path d="M 10 35 L 85 35 M 14 47 L 81 47 M 28 25 L 32 60 M 48 25 L 48 60 M 68 25 L 64 60" stroke="#7a4b19" stroke-width="2" />
            <circle cx="28" cy="18" r="14" fill="#d94126" />
            <circle cx="50" cy="15" r="15" fill="#ebb42c" />
            <circle cx="70" cy="19" r="13" fill="#7eb835" />
          </g>

          <!-- Pickles Jar -->
          <g transform="translate(1055, 82)">
            <rect x="4" y="14" width="48" height="58" rx="12" fill="#6aa336" stroke="#365916" stroke-width="2.5" />
            <ellipse cx="22" cy="44" rx="8" ry="18" transform="rotate(-15 22 44)" fill="#47781c" />
            <ellipse cx="34" cy="42" rx="8" ry="17" transform="rotate(12 34 42)" fill="#528722" />
            <rect x="8" y="6" width="40" height="10" rx="3" fill="#d49e59" stroke="#5c3a10" stroke-width="2" />
          </g>

          <!-- Lower Shelf -->
          <rect x="690" y="275" width="850" height="16" rx="5" fill="#7c471e" stroke="#381d08" stroke-width="3" />
          <g transform="translate(735, 207)">
            <ellipse cx="52" cy="46" rx="46" ry="22" fill="#e6aa32" stroke="#855808" stroke-width="2.5" />
            <rect x="6" y="24" width="92" height="22" fill="#f0b946" stroke="#855808" stroke-width="2.5" />
            <ellipse cx="52" cy="24" rx="46" ry="14" fill="#fbd272" stroke="#855808" stroke-width="2.5" />
          </g>
          <g transform="translate(885, 193)">
            <path d="M 12 82 Q 2 45 18 22 Q 40 16 62 22 Q 78 45 68 82 Z" fill="#c2955d" stroke="#634521" stroke-width="2.5" />
            <path d="M 22 20 L 58 20" stroke="#7d4e1d" stroke-width="4" />
          </g>
        </g>

        <!-- HANGING GARLIC & CHILI PEPPER BUNDLES -->
        <g class="swing-slow" style="transform-origin: 655px 40px;">
          <line x1="655" y1="30" x2="655" y2="185" stroke="#9e7340" stroke-width="4" />
          <g transform="translate(635, 75)">
            <ellipse cx="12" cy="14" rx="14" ry="12" fill="#f5ead6" stroke="#9c8563" stroke-width="2" />
            <ellipse cx="28" cy="26" rx="14" ry="12" fill="#efe0c6" stroke="#9c8563" stroke-width="2" />
            <ellipse cx="12" cy="40" rx="15" ry="12" fill="#f5ead6" stroke="#9c8563" stroke-width="2" />
            <ellipse cx="28" cy="54" rx="14" ry="12" fill="#efe0c6" stroke="#9c8563" stroke-width="2" />
            <ellipse cx="15" cy="70" rx="14" ry="12" fill="#f5ead6" stroke="#9c8563" stroke-width="2" />
          </g>
        </g>

        <!-- WARM SUNBEAMS & FLOATING DUST MOTES -->
        <polygon points="75,80 290,80 680,460 220,460" fill="url(#sunbeamGrad)" pointer-events="none" />
        <g pointer-events="none">
          <circle class="dust-mote" cx="260" cy="210" r="3" fill="#fff5c0" />
          <circle class="dust-mote" cx="340" cy="275" r="2.5" fill="#fff5c0" style="animation-delay: -1.5s;" />
          <circle class="dust-mote" cx="560" cy="195" r="3.5" fill="#fff5c0" style="animation-delay: -3.1s;" />
        </g>

        <!-- HANGING EDISON LANTERNS -->
        <g transform="translate(330, 0)">
          <line x1="0" y1="0" x2="0" y2="82" stroke="#2b1708" stroke-width="5" />
          <circle cx="0" cy="105" r="64" fill="url(#lanternGlow)" pointer-events="none" />
          <path d="M -24 82 Q 0 64 24 82 Z" fill="#4a2b13" stroke="#241205" stroke-width="2.5" />
          <ellipse cx="0" cy="102" rx="13" ry="18" fill="#fff2a6" stroke="#d48817" stroke-width="2.5" />
        </g>
        <g transform="translate(1015, 0)">
          <line x1="0" y1="0" x2="0" y2="85" stroke="#2b1708" stroke-width="5" />
          <circle cx="0" cy="108" r="68" fill="url(#lanternGlow)" pointer-events="none" />
          <path d="M -26 85 Q 0 65 26 85 Z" fill="#4a2b13" stroke="#241205" stroke-width="2.5" />
          <ellipse cx="0" cy="106" rx="14" ry="20" fill="#fff2a6" stroke="#d48817" stroke-width="2.5" />
        </g>

        <!-- ===================================================== -->
        <!-- CLOSE-UP SELLER CHARACTER (Centered at X=450 behind Plate) -->
        <!-- ===================================================== -->
        <g id="seller-character" transform="translate(200, 52)" class="cursor-pointer">
          <g id="seller-body-rig">
            <!-- Animated Breathing Torso & Shoulders -->

    /******************************************************************
     * 2. WEB AUDIO SYNTHESIZER (Rich, Varied Non-Verbal Feedback)
     ******************************************************************/
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playPop(select = true) {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(select ? 340 : 480, now);
        osc.frequency.exponentialRampToValueAtTime(select ? 690 : 250, now + 0.11);
        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }

      playKeyClick() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(820, now);
        osc.frequency.exponentialRampToValueAtTime(260, now + 0.045);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }

      playPaperBagRustle() {
        this.init();
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.22;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.45));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1100, now);
        filter.Q.setValueAtTime(1.8, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);

        // Soft thud inside bag
        const thud = this.ctx.createOscillator();
        const thudGain = this.ctx.createGain();
        thud.type = 'sine';
        thud.frequency.setValueAtTime(165, now + 0.03);
        thud.frequency.exponentialRampToValueAtTime(65, now + 0.16);
        thudGain.gain.setValueAtTime(0.28, now + 0.03);
        thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
        thud.connect(thudGain);
        thudGain.connect(this.ctx.destination);
        thud.start(now + 0.03);
        thud.stop(now + 0.17);
      }

      playCashRegisterWin() {
        this.init();
        const now = this.ctx.currentTime;
        // Vintage "Cha-Ching" Bell + Marimba Chord
        const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
        notes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = i >= 3 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.07);
          gain.gain.setValueAtTime(0.22, now + i * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.55);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.07);
          osc.stop(now + i * 0.07 + 0.56);
        });
      }

      playWrongBoing() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.linearRampToValueAtTime(135, now + 0.18);
        osc.frequency.linearRampToValueAtTime(185, now + 0.28);
        osc.frequency.linearRampToValueAtTime(110, now + 0.44);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(700, now);

        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.46);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.46);
      }
    }

     ******************************************************************/
    let currentLang = 'uk';

    let roundItems = []; // 10 items with generated prices
    let selectedIndices = []; // Indices of selected products

    function randomPriceForDigits(digits) {
      if (digits === 1) {
        // 1 to 9
        return Math.floor(Math.random() * 9) + 1;
      } else if (digits === 2) {
        // 11 to 99, avoiding multiples of 10 so rounding is active
        let n;
        do {
          n = Math.floor(Math.random() * 89) + 11;
        } while (n % 10 === 0);
        return n;
      } else {
        // 101 to 999, avoiding multiples of 10
        let n;
        do {
          n = Math.floor(Math.random() * 889) + 105;
        } while (n % 10 === 0);
        return n;
      }
    }

    function generateNewRound() {
      isPacking = false;
      selectedIndices = [];
      typedInput = '';
      updateRegisterDisplay();

      // Clear counter table and packed bag items
      document.getElementById('tray-items-layer').innerHTML = '';
      document.getElementById('items-in-bag-layer').innerHTML = '';

      // Generate 10 prices according to currentMode
      roundItems = PRODUCTS_CATALOG.map((prod, idx) => {
        let digits = currentMode;
        if (currentMode === 4) {
          // Mixed mode: balanced mix of 1-digit, 2-digit, and 3-digit prices
          const pattern = [1, 2, 3, 1, 2, 3, 1, 2, 3, 2];
          digits = pattern[idx % pattern.length];
        }
        return {
          ...prod,
          index: idx,
          price: randomPriceForDigits(digits)
        };
      });

      renderProductsGrid();
      renderCounterTrayItems();
      setSellerEmotion();
    }

    function toggleProductSelection(idx, silent = false) {
      const pos = selectedIndices.indexOf(idx);
      if (pos >= 0) {

      } else {
        selectedIndices.push(idx);

      if (!silent) {

      // Update crate visual highlights
      const slots = document.querySelectorAll('#products-grid .product-slot');
      slots.forEach((slot, sIdx) => {
        if (selectedIndices.includes(sIdx)) {

      renderCounterTrayItems();

    // Compute exact SVG coordinates on the glazed ceramic plate (cx=450, cy=486)
    function getPlateSlotPosition(orderIdx, totalCount) {
      const plateCenterX = 450;
      const plateCenterY = 472;
      const maxSpread = Math.min(340, Math.max(105, (totalCount - 1) * 95));
      const startX = plateCenterX - maxSpread / 2;
      const x = totalCount === 1
        ? plateCenterX
        : startX + (maxSpread * orderIdx) / (totalCount - 1);
      // Slight elliptical depth offset on the plate well
      const y = plateCenterY + (orderIdx % 2 === 0 ? -9 : 7);
      const scale = totalCount > 7 ? 0.78 : totalCount > 5 ? 0.88 : totalCount > 3 ? 0.96 : 1.08;
      return { x, y, scale };
    }

    function renderCounterTrayItems() {
      const trayLayer = document.getElementById('tray-items-layer');
      const count = selectedIndices.length;
      if (count === 0) {
        trayLayer.innerHTML = '';
        return;
      }

      trayLayer.innerHTML = selectedIndices.map((itemIdx, orderIdx) => {
        const item = roundItems[itemIdx];
        const { x, y, scale } = getPlateSlotPosition(orderIdx, count);

        return `
          <g id="tray-item-${itemIdx}" data-idx="${itemIdx}"
             transform="translate(${x.toFixed(1)}, ${y.toFixed(1)}) scale(${scale})"
             class="cursor-pointer">
            <g class="plate-item-inner">
              <!-- Contact shadow on the glazed ceramic plate -->
              <ellipse cx="0" cy="18" rx="40" ry="12" fill="rgba(45, 22, 5, 0.38)" />
              <!-- Product Vector Graphic sitting directly on the plate (centered pure <g>, never flies to corner!) -->
              ${renderSceneProductGroup(item, -55, -80, 1.12)}
              <!-- Large, High-Contrast Price Tag right below the product on the plate -->
              <g transform="translate(0, 26)">
                <rect x="-46" y="-20" width="92" height="40" rx="12" fill="#2b1808" stroke="#ffd25a" stroke-width="3.2" />
                <text x="0" y="9" text-anchor="middle" fill="#fff5c0" font-family="Rubik, sans-serif" font-weight="900" font-size="28">
                  ${item.price}
                </text>
              </g>
            </g>
          </g>
        `;
      }).join('');

      // Smoothly pop-animate the newly added item in pure SVG space (no CSS pixel mismatch!)
      if (lastAddedItemIdx !== null) {
        const addedGroup = document.getElementById(`tray-item-${lastAddedItemIdx}`);
        if (addedGroup) {
          const inner = addedGroup.querySelector('.plate-item-inner');
          const start = performance.now();
          const dur = 280;
          function popFrame(now) {
            const t = Math.min(1, (now - start) / dur);
            // Back-out overshoot curve
            const s = 1 + 0.28 * Math.sin(t * Math.PI) * (1 - t * 0.5);
            const liftY = (1 - t) * -22 * Math.sin(t * Math.PI);
            if (inner) {
              inner.setAttribute('transform', `translate(0, ${liftY.toFixed(1)}) scale(${s.toFixed(3)})`);
            }
            if (t < 1) {
              requestAnimationFrame(popFrame);
            } else if (inner) {
              inner.removeAttribute('transform');
            }
          }
          requestAnimationFrame(popFrame);
        }
        lastAddedItemIdx = null;
      }

      // Allow clicking an item directly on the ceramic plate to remove it
      trayLayer.querySelectorAll('g[data-idx]').forEach(g => {
        g.addEventListener('click', () => {
          if (isPacking) return;
          const idx = parseInt(g.getAttribute('data-idx'), 10);
          toggleProductSelection(idx, false);
        });
      });
    }

    /******************************************************************
     * 6. ROUNDING VALIDATION LOGIC (Flexible & School-Friendly)
     ******************************************************************/
    function roundHalfUp(num, base) {
      return Math.round(num / base) * base;
    }

    function getAcceptedRoundedAnswers() {
      if (selectedIndices.length === 0) return [];
      const prices = selectedIndices.map(i => roundItems[i].price);
      const exactSum = prices.reduce((a, b) => a + b, 0);

      const valid = new Set();

      // 1. Round total sum to nearest 10
      valid.add(roundHalfUp(exactSum, 10));
      // Also if exactSum ends in 5, accept both down and up just in case
      if (exactSum % 10 === 5) {
        valid.add(exactSum - 5);
        valid.add(exactSum + 5);
      }
      // If sum is 1..4 in single-digit mode, accept both 0 and 10
      if (exactSum > 0 && exactSum < 5) {
        valid.add(10);
        valid.add(0);
      }

      // 2. Round total sum to nearest 100 (when sum >= 50)
      if (exactSum >= 50) {
        valid.add(roundHalfUp(exactSum, 100));
      }

      // 3. Round total sum to nearest 1000 (when sum >= 500)
      if (exactSum >= 500) {
        valid.add(roundHalfUp(exactSum, 1000));
      }

      // 4. Sum of individually rounded prices (nearest 10)
      const sumRounded10 = prices.reduce((acc, p) => acc + roundHalfUp(p, 10), 0);
      valid.add(sumRounded10);
      valid.add(roundHalfUp(sumRounded10, 10));

      // 5. Sum of individually rounded prices to their highest place value (e.g. 100s for 3-digit, 10s for 2-digit)
      const sumRoundedPlace = prices.reduce((acc, p) => {
        if (p >= 100) return acc + roundHalfUp(p, 100);
        if (p >= 10) return acc + roundHalfUp(p, 10);
        return acc + p;
      }, 0);
      valid.add(sumRoundedPlace);
      valid.add(roundHalfUp(sumRoundedPlace, 10));
      if (sumRoundedPlace >= 50) {
        valid.add(roundHalfUp(sumRoundedPlace, 100));
      }

      return Array.from(valid);
    }

    /******************************************************************
     * 7. SEAMLESS, CONTINUOUS CURVED ARMS & BODY LEAN SYSTEM
     *    (Zero detached joints! Continuous Bezier sleeve & skin arm)
     ******************************************************************/
    // Evaluate point & tangent on a quadratic Bezier curve B(t) = (1-t)^2 P0 + 2(1-t)t P1 + t^2 P2
    function evalQuadBezier(p0, p1, p2, t) {
      const mt = 1 - t;
      const x = mt * mt * p0.x + 2 * mt * t * p1.x + t * t * p2.x;
      const y = mt * mt * p0.y + 2 * mt * t * p1.y + t * t * p2.y;
      const dx = 2 * mt * (p1.x - p0.x) + 2 * t * (p2.x - p1.x);
      const dy = 2 * mt * (p1.y - p0.y) + 2 * t * (p2.y - p1.y);
      const angleDeg = (Math.atan2(dy, dx) * 180) / Math.PI;
      return { x, y, angleDeg };
    }

    // Subdivide quadratic Bezier from t=0 to t=tEnd so the shirt sleeve follows the exact arm curve
    function splitQuadBezierStart(p0, p1, p2, tEnd) {
      const q0 = p0;
      const q1 = {
        x: p0.x + (p1.x - p0.x) * tEnd,
        y: p0.y + (p1.y - p0.y) * tEnd
      };
      const q2 = evalQuadBezier(p0, p1, p2, tEnd);
      return { q0, q1, q2 };
    }

    // Compute natural elbow control point that never over-stretches or detaches
    function computeSeamlessArmCurve(shoulder, targetWrist, side) {
      const maxArmSpan = 245;
      const dx = targetWrist.x - shoulder.x;
      const dy = targetWrist.y - shoulder.y;
      const dist = Math.hypot(dx, dy) || 1;

      // Clamp wrist so arm never detaches or locks straight
      const clampedDist = Math.min(maxArmSpan, dist);
      const wrist = {
        x: shoulder.x + (dx / dist) * clampedDist,
        y: shoulder.y + (dy / dist) * clampedDist
      };

      // Midpoint between shoulder and wrist
      const midX = (shoulder.x + wrist.x) * 0.5;
      const midY = (shoulder.y + wrist.y) * 0.5;

      // Natural outward & downward elbow bend
      const bendFactor = Math.max(26, (maxArmSpan - clampedDist) * 0.48 + 28);
      const outwardSign = side === 'left' ? -1 : 1;

      const elbowCtrl = {
        x: midX + outwardSign * bendFactor * 0.85,
        y: midY + bendFactor * 0.75
      };

      return { shoulder, elbowCtrl, wrist };
    }

    // Renders a single, seamless, organic arm + sleeve + cozy hand (and held item if any)
    function renderSeamlessArmSVG(shoulder, targetWrist, side, gripAmount = 0, heldItemSVG = null, heldScale = 0.86) {
      const { elbowCtrl, wrist } = computeSeamlessArmCurve(shoulder, targetWrist, side);
      const isLeft = side === 'left';

      // Full arm quadratic Bezier path
      const armCurveD = `M ${shoulder.x.toFixed(1)} ${shoulder.y.toFixed(1)} Q ${elbowCtrl.x.toFixed(1)} ${elbowCtrl.y.toFixed(1)} ${wrist.x.toFixed(1)} ${wrist.y.toFixed(1)}`;

      // Sleeve covers from shoulder (t=0) to just past the elbow (t=0.56) along the exact same curve
      const sleeveSeg = splitQuadBezierStart(shoulder, elbowCtrl, wrist, 0.56);
      const sleeveCurveD = `M ${sleeveSeg.q0.x.toFixed(1)} ${sleeveSeg.q0.y.toFixed(1)} Q ${sleeveSeg.q1.x.toFixed(1)} ${sleeveSeg.q1.y.toFixed(1)} ${sleeveSeg.q2.x.toFixed(1)} ${sleeveSeg.q2.y.toFixed(1)}`;

      // End of wrist tangent angle for natural hand orientation
      const wristTangent = evalQuadBezier(shoulder, elbowCtrl, wrist, 1.0);
      const handAngle = wristTangent.angleDeg * 0.35 + (isLeft ? 10 : -10);
      const flipX = isLeft ? -1 : 1;

      return `
        <g class="seamless-arm-${side}">
          <!-- Soft Shadow under Arm -->
          <path d="${armCurveD}" transform="translate(0, 8)"
                fill="none" stroke="rgba(20, 8, 0, 0.28)" stroke-width="38" stroke-linecap="round" />

          <!-- Continuous Seamless Skin Arm (Outline + Fill) -->
          <path d="${armCurveD}" fill="none" stroke="#7a4422" stroke-width="36" stroke-linecap="round" />
          <path d="${armCurveD}" fill="none" stroke="url(#armSkinGrad)" stroke-width="30" stroke-linecap="round" />

          <!-- Continuous Seamless Shirt Sleeve Anchored Inside Shoulder -->
          <path d="${sleeveCurveD}" fill="none" stroke="#5c3818" stroke-width="46" stroke-linecap="round" />
          <path d="${sleeveCurveD}" fill="none" stroke="url(#sleeveGrad)" stroke-width="40" stroke-linecap="round" />

          <!-- Soft Folded Cuff Band at end of sleeve (t=0.56) -->
          <g transform="translate(${sleeveSeg.q2.x.toFixed(1)}, ${sleeveSeg.q2.y.toFixed(1)}) rotate(${sleeveSeg.q2.angleDeg.toFixed(1)})">
            <rect x="-8" y="-22" width="14" height="44" rx="7" fill="#edd3ad" stroke="#5c3818" stroke-width="3" />
          </g>

          <!-- Cozy Rounded Hand at Wrist -->
          <g transform="translate(${wrist.x.toFixed(1)}, ${wrist.y.toFixed(1)}) rotate(${handAngle.toFixed(1)}) scale(${flipX}, 1)">
            <!-- Held Product (Sandwiched between palm and curling fingers) -->
            ${heldItemSVG ? `
              <g transform="scale(${flipX}, 1) translate(0, 6) scale(${heldScale})">
                ${heldItemSVG}
              </g>
            ` : ''}

            <!-- Rounded Palm Cushion -->
            <ellipse cx="0" cy="4" rx="20" ry="16" fill="url(#armSkinGrad)" stroke="#7a4422" stroke-width="3" />

            <!-- Cozy Thumb -->
            <ellipse cx="-12" cy="${2 + gripAmount * 4}" rx="10" ry="7"
                     transform="rotate(${-24 + gripAmount * 28} -12 2)"
                     fill="url(#armSkinGrad)" stroke="#7a4422" stroke-width="2.8" />

            <!-- Soft Rounded Fingers resting on counter or gently wrapping item -->
            <ellipse cx="-6" cy="${14 - gripAmount * 3}" rx="6.5" ry="${8 - gripAmount * 2}"
                     fill="url(#armSkinGrad)" stroke="#7a4422" stroke-width="2.5" />
            <ellipse cx="3" cy="${15 - gripAmount * 3}" rx="6.5" ry="${8.5 - gripAmount * 2}"
                     fill="url(#armSkinGrad)" stroke="#7a4422" stroke-width="2.5" />
            <ellipse cx="11" cy="${13 - gripAmount * 3}" rx="6" ry="${7.5 - gripAmount * 2}"
                     fill="#ebaa80" stroke="#7a4422" stroke-width="2.5" />
          </g>
        </g>
      `;
    }

    // Shoulder sockets anchored directly inside the seller's shirt shoulders (seller at translate(200, 52))
    const BASE_SHOULDER_LEFT = { x: 332, y: 315 };
    const BASE_SHOULDER_RIGHT = { x: 568, y: 315 };

    // Idle breathing loop for the seller's arms resting naturally beside the ceramic plate
    function startSellerArmsLoop() {
      const activeLayer = document.getElementById('active-packing-layer');
      const bodyRig = document.getElementById('seller-body-rig');

      function updateIdleArms(now) {
        if (!isPacking) {
          const breathe = Math.sin(now * 0.0022) * 2.5;
          const sway = Math.cos(now * 0.0016) * 2;

          if (bodyRig) {
            bodyRig.setAttribute('transform', 'translate(0, 0) rotate(0 250 380)');
          }

          // Hands rest comfortably on the wooden counter flanking the ceramic plate
          const leftRestWrist = { x: 255 + sway, y: 454 + breathe * 0.4 };
          const rightRestWrist = { x: 645 - sway, y: 454 + breathe * 0.4 };

          activeLayer.innerHTML =
            renderSeamlessArmSVG(
              { x: BASE_SHOULDER_LEFT.x, y: BASE_SHOULDER_LEFT.y + breathe },
              leftRestWrist,
              'left',
              0.1,
              null
            ) +
            renderSeamlessArmSVG(
              { x: BASE_SHOULDER_RIGHT.x, y: BASE_SHOULDER_RIGHT.y + breathe },
              rightRestWrist,
              'right',
              0.1,
              null
            );
        }
        requestAnimationFrame(updateIdleArms);
      }

      requestAnimationFrame(updateIdleArms);
    }

    // Smoothly packs each item from the ceramic plate into the paper bag with natural body lean
    function animateSellerPacking() {
      isPacking = true;
      sfx.playCashRegisterWin();
      setSellerEmotion('joyful_laugh');
      spawnCelebrationParticles(890, 400, 38);

      const itemsToPack = [...selectedIndices];
      const activeLayer = document.getElementById('active-packing-layer');
      const bagItemsLayer = document.getElementById('items-in-bag-layer');
      const bagAnimGroup = document.getElementById('grocery-bag-anim');
      const bodyRig = document.getElementById('seller-body-rig');

      const leftRestWrist = { x: 255, y: 454 };
      const rightRestWrist = { x: 645, y: 454 };
      // Mouth of the craft paper bag (bag root at x=755, y=245)
      const bagOpening = { x: 855, y: 302 };

      let packIdx = 0;

      function packNextItem() {
        if (!isPacking) return;
        if (packIdx >= itemsToPack.length) {
          if (bodyRig) {
            bodyRig.setAttribute('transform', 'translate(0, 0) rotate(0 250 380)');
          }
          setSellerEmotion('proud_grin');
          spawnCelebrationParticles(895, 350, 45);
          isPacking = false;

          // Automatically generate new round after celebration
          setTimeout(() => {
            if (!isPacking) generateNewRound();
          }, 1450);
          return;
        }

        const itemIndex = itemsToPack[packIdx];
        const item = roundItems[itemIndex];
        const trayEl = document.getElementById(`tray-item-${itemIndex}`);

        // Exact coordinates of this item on the ceramic plate
        const count = itemsToPack.length;
        const slotPos = getPlateSlotPosition(packIdx, count);
        const pickTarget = { x: slotPos.x, y: slotPos.y - 18 };

        const startWrist = packIdx === 0 ? { ...rightRestWrist } : { x: 700, y: 380 };
        const startTime = performance.now();
        const reachDuration = 340; // Phase 1: Reach to product on ceramic plate
        const liftDuration = 520;  // Phase 2: Carry product in smooth arc to paper bag
        const totalDuration = reachDuration + liftDuration;

        function stepFrame(now) {
          if (!isPacking) return;
          const elapsed = now - startTime;

          let wristX, wristY, grip, holdingItem = false, dropOffset = 0;
          let bodyLeanX = 0, bodyLeanY = 0, bodyTilt = 0;

          if (elapsed < reachDuration) {
            // PHASE 1: Reach toward the product on the ceramic plate
            const t = Math.min(1, elapsed / reachDuration);
            const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            wristX = startWrist.x + (pickTarget.x - startWrist.x) * ease;
            wristY = startWrist.y + (pickTarget.y - startWrist.y) * ease - Math.sin(ease * Math.PI) * 28;
            grip = ease * 0.85;

            // Subtle lean toward the plate
            bodyLeanX = (pickTarget.x - 500) * 0.12 * ease;
            bodyLeanY = 4 * ease;
            bodyTilt = bodyLeanX * 0.08;
          } else {
            // Hide static item on plate once picked up
            if (trayEl && trayEl.style.opacity !== '0') {
              trayEl.style.opacity = '0';
              sfx.playPop(true);
            }

            // PHASE 2: Carry the grasped product up over the craft bag opening and drop it inside
            const t = Math.min(1, (elapsed - reachDuration) / liftDuration);
            const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

            wristX = pickTarget.x + (bagOpening.x - pickTarget.x) * ease;
            const linearY = pickTarget.y + (bagOpening.y - pickTarget.y) * ease;
            const arcLift = Math.sin(ease * Math.PI) * -95;
            wristY = linearY + arcLift;

            // Smoothly lean seller's upper body toward the paper bag so the arm stays natural and connected!
            const startLeanX = (pickTarget.x - 500) * 0.12;
            bodyLeanX = startLeanX + (78 - startLeanX) * ease;
            bodyLeanY = 4 * (1 - ease);
            bodyTilt = bodyLeanX * 0.09;

            if (t < 0.82) {
              holdingItem = true;
              grip = 0.95;
            } else {
              // Hand opens over the bag and item drops down inside
              holdingItem = true;
              const releaseT = (t - 0.82) / 0.18;
              grip = Math.max(0.1, 0.95 * (1 - releaseT));
              dropOffset = releaseT * releaseT * 75;
            }
          }

          // Apply lean transform to seller's torso & head rig
          if (bodyRig) {
            bodyRig.setAttribute(
              'transform',
              `translate(${bodyLeanX.toFixed(1)}, ${bodyLeanY.toFixed(1)}) rotate(${bodyTilt.toFixed(2)} 250 380)`
            );
          }

          // Shoulders move seamlessly with the leaning torso
          const leftShoulderNow = {
            x: BASE_SHOULDER_LEFT.x + bodyLeanX,
            y: BASE_SHOULDER_LEFT.y + bodyLeanY
          };
          const rightShoulderNow = {
            x: BASE_SHOULDER_RIGHT.x + bodyLeanX,
            y: BASE_SHOULDER_RIGHT.y + bodyLeanY
          };

          const leftWristNow = {
            x: leftRestWrist.x + bodyLeanX * 0.35,
            y: leftRestWrist.y
          };

          const itemGraphic = holdingItem
            ? `<g transform="translate(0, ${dropOffset.toFixed(1)})">${renderSceneProductGroup(item, -55, -58, 1.05)}</g>`
            : null;

          activeLayer.innerHTML =
            renderSeamlessArmSVG(leftShoulderNow, leftWristNow, 'left', 0.15, null) +
            renderSeamlessArmSVG(rightShoulderNow, { x: wristX, y: wristY }, 'right', grip, itemGraphic, 0.92);

          if (elapsed < totalDuration) {
            requestAnimationFrame(stepFrame);
          } else {
            // Item lands inside the bag!
            sfx.playPaperBagRustle();

            bagAnimGroup.classList.remove('bag-bounce');
            void bagAnimGroup.offsetWidth;
            bagAnimGroup.classList.add('bag-bounce');

            // Place item inside #items-in-bag-layer (between back and front walls of the craft bag)
            const slotX = 88 + ((packIdx * 44) % 118);
            const slotY = 64 + (packIdx % 2) * 14;
            const rot = packIdx % 2 === 0 ? -12 : 14;
            const packedNode = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            packedNode.setAttribute(
              'transform',
              `translate(${slotX}, ${slotY}) rotate(${rot})`
            );
            packedNode.innerHTML = renderSceneProductGroup(item, -55, -55, 0.85);
            bagItemsLayer.appendChild(packedNode);

            setSellerEmotion(packIdx % 2 === 0 ? 'joyful_laugh' : 'playful_wink');

            packIdx++;
            setTimeout(packNextItem, 60);
          }
        }

        requestAnimationFrame(stepFrame);
      }

      packNextItem();
    }

    /******************************************************************
     * 8. CELEBRATION PARTICLES (Golden Stars & Market Confetti)
     ******************************************************************/
    function spawnCelebrationParticles(originX, originY, count = 32) {
      const layer = document.getElementById('fx-particles-layer');
      const colors = ['#ffd34d', '#ff6b4a', '#5cd669', '#4dc3ff', '#ff94d6', '#fff2a1'];

      for (let i = 0; i < count; i++) {
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const speed = 90 + Math.random() * 190;
        const dx = Math.cos(angle) * speed;
        const dy = Math.sin(angle) * speed - 70;
        const color = colors[i % colors.length];
        const size = 8 + Math.random() * 10;

        if (i % 2 === 0) {
          // 5-pointed star SVG
          p.innerHTML = `<polygon points="0,-${size} ${size*0.3},-${size*0.3} ${size},-${size*0.2} ${size*0.45},${size*0.25} ${size*0.6},${size} 0,${size*0.55} -${size*0.6},${size} -${size*0.45},${size*0.25} -${size},-${size*0.2} -${size*0.3},-${size*0.3}" fill="${color}" stroke="#5c3604" stroke-width="1.5"/>`;
        } else {
          p.innerHTML = `<circle r="${size * 0.55}" fill="${color}" stroke="#5c3604" stroke-width="1.5"/>`;
        }

        layer.appendChild(p);

        const start = performance.now();
        const dur = 750 + Math.random() * 350;

        function animParticle(now) {
          const t = Math.min(1, (now - start) / dur);
          const x = originX + dx * t;
          const y = originY + dy * t + 190 * t * t; // gravity
          const scale = 1 - t * 0.65;
          p.setAttribute('transform', `translate(${x}, ${y}) scale(${scale}) rotate(${t * 280})`);
          p.setAttribute('opacity', String(1 - t));
          if (t < 1) {
            requestAnimationFrame(animParticle);
          } else {
            p.remove();
          }
        }
        requestAnimationFrame(animParticle);
      }
    }

    /******************************************************************
     * 9. REGISTER INPUT & CHECK HANDLERS
     ******************************************************************/
    function updateRegisterDisplay() {
      const disp = document.getElementById('register-display');
      disp.textContent = typedInput.length > 0 ? typedInput : '?';
    }

    function appendDigit(digit) {
      if (isPacking) return;
      if (typedInput.length >= 5) return;
      if (typedInput === '0') typedInput = '';
      typedInput += String(digit);
      sfx.playKeyClick();
      updateRegisterDisplay();
    }

    function clearInput() {
      if (isPacking) return;
      typedInput = typedInput.slice(0, -1);
      sfx.playKeyClick();
      updateRegisterDisplay();
    }

    function submitAnswer() {
      if (isPacking) return;
      if (selectedIndices.length === 0 || typedInput.length === 0) {
        triggerWrongFeedback();
        return;
      }

      const userValue = parseInt(typedInput, 10);
      const validAnswers = getAcceptedRoundedAnswers();

      if (validAnswers.includes(userValue)) {
        animateSellerPacking();
      } else {
        triggerWrongFeedback();
      }
    }

    function triggerWrongFeedback() {
      sfx.playWrongBoing();
      setSellerEmotion('puzzled_oops');
      const reg = document.getElementById('cash-register');
      reg.classList.remove('shake-error');
      void reg.offsetWidth;
      reg.classList.add('shake-error');
      typedInput = '';
      updateRegisterDisplay();
    }

    /******************************************************************
     * 10. EVENT LISTENERS (UI Buttons, Keypad, Physical Keyboard)
     ******************************************************************/
    // On-screen Numeric Keypad
    document.querySelectorAll('.num-key').forEach(btn => {
      btn.addEventListener('click', () => {
        appendDigit(btn.getAttribute('data-key'));
      });
    });

    document.getElementById('key-clear').addEventListener('click', clearInput);
    document.getElementById('key-submit').addEventListener('click', submitAnswer);

    // Physical Keyboard Support
    window.addEventListener('keydown', (e) => {
      if (isPacking) return;
      if (e.key >= '0' && e.key <= '9') {
        appendDigit(e.key);
      } else if (e.key === 'Backspace' || e.key === 'Delete') {
        clearInput();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        submitAnswer();
      }
    });

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        sfx.playKeyClick();
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active-mode'));
        btn.classList.add('active-mode');
        currentMode = parseInt(btn.getAttribute('data-mode'), 10);
        generateNewRound();

    });

    });

    // Minimalist "Next" (Skip) Button
    document.getElementById('next-btn').addEventListener('click', () => {
      sfx.playPop(true);
      generateNewRound();
    });

    // Click on Seller to trigger a fun random emotion
    document.getElementById('seller-character').addEventListener('click', () => {
      sfx.playPop(true);
      setSellerEmotion();
    });

    // Start Game on Window Load
    window.onload = () => {
      startSellerArmsLoop();
      generateNewRound();
    };
  </script>
</body>
</html>
