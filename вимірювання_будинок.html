<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Будівництво Міста — дм та см (1-2 клас)</title>
<style>
  /* Скидання стандартних відступів та заборона виділення тексту для зручності гри */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #2980b9;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }

  /* Головний контейнер гри */
  #game-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* preserveAspectRatio="xMidYMid meet" гарантує, що жодна кнопка зверху чи знизу не обріжеться */
  svg#main-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Анімація хмар у місті */
  .cloud-slow {
    animation: drift 65s linear infinite;
  }
  .cloud-fast {
    animation: drift 42s linear infinite;
  }
  @keyframes drift {
    from { transform: translateX(-350px); }
    to { transform: translateX(1850px); }
  }

  /* Анімація колеса огляду на фоні міста */
  #ferris-wheel {
    transform-origin: 580px 440px;
    animation: spinWheel 40s linear infinite;
  }
  @keyframes spinWheel {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Анімація дерев на вітрі */
  .sway-tree {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: treeSway 4s ease-in-out infinite alternate;
  }
  @keyframes treeSway {
    from { transform: rotate(-2deg); }
    to { transform: rotate(2deg); }
  }

  /* Анімація диму з труби */
  .smoke-puff {
    transform-box: fill-box;
    transform-origin: center;
    animation: smokeRise 3.2s ease-out infinite;
  }
  .smoke-puff.d2 { animation-delay: 1.1s; }
  .smoke-puff.d3 { animation-delay: 2.2s; }
  @keyframes smokeRise {
    0% { transform: translate(0, 0) scale(0.5); opacity: 0.85; }
    100% { transform: translate(25px, -55px) scale(1.7); opacity: 0; }
  }

  /* Стаціонарна зона кліку для кнопок відповідей (не рухається, тому кнопка ніколи не тікає) */
  .ans-slot {
    cursor: pointer;
  }
  .ans-inner {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
  }
  .ans-slot:hover .ans-inner {
    transform: translateY(-4px) scale(1.03);
    filter: brightness(1.1) drop-shadow(0 8px 12px rgba(0,0,0,0.45));
  }
  .ans-slot:active .ans-inner {
    transform: translateY(2px) scale(0.97);
  }

  /* Стаціонарна зона кліку для кнопок навігації (Назад / Далі) та вибору класу */
  .nav-slot, .mode-slot {
    cursor: pointer;
  }
  .nav-inner, .mode-inner {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.18s ease, filter 0.18s ease;
  }
  .nav-slot:hover .nav-inner,
  .mode-slot:hover .mode-inner {
    transform: scale(1.09);
    filter: brightness(1.15) drop-shadow(0 4px 8px rgba(0,0,0,0.45));
  }
  .nav-slot:active .nav-inner,
  .mode-slot:active .mode-inner {
    transform: scale(0.94);
  }

  /* Активний стан кнопки вибору класу (1, 2 або 1+2) */
  .mode-slot.active .mode-bg {
    fill: url(#activeModeGrad);
    stroke: #ffffff;
    stroke-width: 4;
  }
  .mode-slot.active .mode-text {
    fill: #1a2a44;
  }

  /* Анімація появи елементів будинку */
  .house-part {
    opacity: 0;
    pointer-events: none;
    transform-box: fill-box;
    transform-origin: center;
    transition: opacity 0.25s ease;
  }
  .house-part.built {
    opacity: 1;
  }
  .house-part.just-built {
    animation: dropBuild 0.65s cubic-bezier(0.22, 1.35, 0.5, 1) forwards;
  }
  @keyframes dropBuild {
    0% {
      opacity: 0;
      transform: translateY(-90px) scale(0.94);
    }
    65% {
      opacity: 1;
      transform: translateY(6px) scale(1.02);
    }
    85% {
      opacity: 1;
      transform: translateY(-3px) scale(0.99);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* Анімації живого персонажа — Бобра-архітектора */
  #character-root {
    transform-origin: 210px 790px;
    animation: charBreathe 2.6s ease-in-out infinite alternate;
  }
  @keyframes charBreathe {
    0% { transform: translateY(0) scaleY(1); }
    100% { transform: translateY(-4px) scaleY(1.015); }
  }
  #character-root.happy {
    animation: charJump 0.55s ease-in-out 2;
  }
  @keyframes charJump {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    40% { transform: translateY(-34px) rotate(-6deg) scale(1.05); }
    70% { transform: translateY(-12px) rotate(5deg); }
  }
  #character-root.sad {
    animation: charShake 0.5s ease-in-out;
  }
  @keyframes charShake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-14px) rotate(-5deg); }
    40% { transform: translateX(14px) rotate(5deg); }
    60% { transform: translateX(-10px) rotate(-3deg); }
    80% { transform: translateX(10px) rotate(3deg); }
  }

  /* Рухи рук та хвоста персонажа */
  #beaver-arm-r {
    transform-origin: 248px 655px;
    transition: transform 0.3s ease;
  }
  #character-root.happy #beaver-arm-r {
    transform: rotate(-55deg);
  }
  #character-root.sad #beaver-arm-r {
    transform: rotate(25deg);
  }
  #beaver-tail {
    transform-origin: 155px 730px;
    animation: tailWag 1.8s ease-in-out infinite alternate;
  }
  @keyframes tailWag {
    from { transform: rotate(-6deg); }
    to { transform: rotate(8deg); }
  }

  /* Мигання маячка на крані */
  #crane-beacon {
    animation: beaconFlash 1.2s ease-in-out infinite alternate;
  }
  @keyframes beaconFlash {
    from { opacity: 0.35; filter: drop-shadow(0 0 2px #ff3b30); }
    to { opacity: 1; filter: drop-shadow(0 0 12px #ff3b30); }
  }

  /* Плавний рух візка та гака будівельного крана */
  #crane-trolley-group {
    transition: transform 0.55s cubic-bezier(0.35, 1.2, 0.5, 1);
  }
  #crane-cable {
    transition: height 0.45s ease;
  }
  #crane-hook-group {
    transition: transform 0.45s ease;
  }
</style>
</head>
<body>

<div id="game-wrap">
  <!-- preserveAspectRatio="xMidYMid meet" показує всю сцену цілком на будь-якому моніторі -->
  <svg id="main-svg" viewBox="0 0 1400 820" preserveAspectRatio="xMidYMid meet">
    <defs>
      <!-- Градієнт неба живого міста -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2980b9"/>
        <stop offset="52%" stop-color="#6dd5fa"/>
        <stop offset="85%" stop-color="#ffeaa7"/>
        <stop offset="100%" stop-color="#fab1a0"/>
      </linearGradient>

      <!-- Текстура дерев'яної дошки для прикладу -->
      <linearGradient id="woodBoardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6e4726"/>
        <stop offset="50%" stop-color="#875831"/>
        <stop offset="100%" stop-color="#59381c"/>
      </linearGradient>

      <!-- Текстура синього інженерного креслення (blueprint) -->
      <linearGradient id="blueprintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f3866"/>
        <stop offset="50%" stop-color="#174e8a"/>
        <stop offset="100%" stop-color="#0b294d"/>
      </linearGradient>

      <!-- Яскравий золотий градієнт для активної кнопки класу -->
      <linearGradient id="activeModeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fff200"/>
        <stop offset="55%" stop-color="#f1c40f"/>
        <stop offset="100%" stop-color="#e67e22"/>
      </linearGradient>

      <!-- Сітка інженерного креслення -->
      <pattern id="blueprintGrid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(130, 204, 255, 0.22)" stroke-width="1"/>
        <path d="M 12 0 L 12 24 M 0 12 L 24 12" fill="none" stroke="rgba(130, 204, 255, 0.09)" stroke-width="0.6"/>
      </pattern>

      <!-- Металева золотиста рамка -->
      <linearGradient id="brassGrad" x1="0%" y1="0%" x2="0%" y2="100%">

        <stop offset="45%" stop-color="#f39c12"/>
        <stop offset="100%" stop-color="#b76e08"/>

      <!-- Градієнт для кнопок-блоків відповідей -->
      <linearGradient id="blockBtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#f8c291"/>
        <stop offset="15%" stop-color="#e58e26"/>
        <stop offset="85%" stop-color="#b75e09"/>
        <stop offset="100%" stop-color="#783802"/>

      <!-- Візерунок діагональних будівельних смуг -->
      <pattern id="hazardStripes" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <rect width="10" height="20" fill="#f1c40f"/>
        <rect x="10" width="10" height="20" fill="#2c3e50"/>
      </pattern>

      <!-- Текстура цегляної кладки 1-го поверху -->
      <pattern id="brickPattern1" width="36" height="18" patternUnits="userSpaceOnUse">
        <rect width="36" height="18" fill="#b33925"/>
        <path d="M0 0 H36 M0 9 H36 M0 0 V9 M18 0 V9 M9 9 V18 M27 9 V18" stroke="#e6b89c" stroke-width="1.8" fill="none"/>
        <rect x="2" y="2" width="14" height="5" fill="#c44530" opacity="0.6"/>
        <rect x="11" y="11" width="14" height="5" fill="#962b19" opacity="0.5"/>
      </pattern>

      <!-- Текстура каменю для фундаменту -->
      <pattern id="stoneFoundation" width="44" height="24" patternUnits="userSpaceOnUse">
        <rect width="44" height="24" fill="#636e72"/>
        <rect x="1" y="1" width="20" height="10" rx="2" fill="#7f8c8d" stroke="#2d3436" stroke-width="1.2"/>
        <rect x="22" y="1" width="21" height="10" rx="2" fill="#95a5a6" stroke="#2d3436" stroke-width="1.2"/>
        <rect x="10" y="12" width="22" height="11" rx="2" fill="#718093" stroke="#2d3436" stroke-width="1.2"/>
        <rect x="-11" y="12" width="20" height="11" rx="2" fill="#8395a7" stroke="#2d3436" stroke-width="1.2"/>
        <rect x="33" y="12" width="20" height="11" rx="2" fill="#8395a7" stroke="#2d3436" stroke-width="1.2"/>
      </pattern>

      <!-- Текстура стін 2-го поверху (тепла штукатурка) -->
      <pattern id="stuccoPattern2" width="30" height="30" patternUnits="userSpaceOnUse">
        <rect width="30" height="30" fill="#f7d794"/>
        <line x1="0" y1="15" x2="30" y2="15" stroke="#eab56f" stroke-width="1.2"/>
        <circle cx="7" cy="7" r="1" fill="#e5a95c" opacity="0.6"/>
        <circle cx="22" cy="21" r="1.2" fill="#e5a95c" opacity="0.6"/>
      </pattern>

      <!-- Текстура черепиці даху -->
      <pattern id="roofTilePattern" width="26" height="18" patternUnits="userSpaceOnUse">
        <rect width="26" height="18" fill="#8e281b"/>
        <path d="M 0 9 Q 6.5 17 13 9 Q 19.5 17 26 9" fill="#b33925" stroke="#5e170e" stroke-width="1.5"/>
        <path d="M -6.5 18 Q 0 26 6.5 18 Q 13 26 19.5 18 Q 26 26 32.5 18" fill="#a33220" stroke="#5e170e" stroke-width="1.5"/>
      </pattern>

      <!-- Відблиск віконного скла -->
      <linearGradient id="windowGlass" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#74b9ff"/>
        <stop offset="40%" stop-color="#0984e3"/>
        <stop offset="60%" stop-color="#1e3799"/>
        <stop offset="100%" stop-color="#0c2461"/>
      </linearGradient>

      <!-- Тепле світло у вікнах (коли вмикається освітлення) -->
      <linearGradient id="windowLit" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fff200"/>
        <stop offset="50%" stop-color="#ffdd59"/>
        <stop offset="100%" stop-color="#ffa801"/>
      </linearGradient>

      <!-- Тінь під елементами -->
      <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
        <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.38"/>
      </filter>
    </defs>

    <!-- ================= 1. СЮЖЕТНИЙ ФОН ЖИВОГО МІСТА (розширений до країв ультрашироких екранів) ================= -->
    <g id="city-background">
      <!-- Небо на всю ширину будь-якого екрана -->
      <rect x="-600" y="-300" width="2600" height="1400" fill="url(#skyGrad)"/>

      <!-- Яскраве сонце з променями -->
      <g transform="translate(1130, 110)">
        <circle r="68" fill="#fff200" opacity="0.22"/>

      </g>

      <!-- Рухомі хмари -->
      <g transform="translate(0, 75)" opacity="0.88">
        <g class="cloud-slow">
          <path d="M0 30 Q15 5 42 15 Q65 -10 95 12 Q125 5 135 30 Z" fill="#fff3e6"/>

      </g>
      <g transform="translate(0, 120) scale(0.85)" opacity="0.8">

          <path d="M0 35 Q20 10 50 18 Q80 -8 110 15 Q140 8 150 35 Z" fill="#ffffff"/>
        </g>
      </g>
      <g transform="translate(0, 55) scale(1.15)" opacity="0.75">
        <g class="cloud-slow" style="animation-delay: -28s;">
          <path d="M0 30 Q15 5 42 15 Q65 -10 95 12 Q125 5 135 30 Z" fill="#ffffff"/>
        </g>
      </g>

      <!-- Далекий силует мегаполісу -->
      <path d="M-400 640 L-400 460 L-280 460 L-280 410 L-160 410 L-160 490 L0 490 L0 470 L55 470 L55 410 L120 410 L120 510 L165 510 L165 370 L240 370 L240 490 L290 490 L290 420 L360 420 L360 520 L420 520 L420 390 L495 390 L495 530 L660 530 L660 430 L725 430 L725 480 L810 480 L810 385 L885 385 L885 520 L980 520 L980 410 L1055 410 L1055 495 L1140 495 L1140 430 L1230 430 L1230 510 L1310 510 L1310 440 L1800 440 L1800 640 Z" fill="#546de5" opacity="0.45"/>

      <!-- Колесо огляду в міському парку -->
      <g id="ferris-wheel-struct">
        <line x1="580" y1="440" x2="540" y2="565" stroke="#303952" stroke-width="5"/>
        <line x1="580" y1="440" x2="620" y2="565" stroke="#303952" stroke-width="5"/>
        <g id="ferris-wheel">
          <circle cx="580" cy="440" r="68" fill="none" stroke="#f5cd79" stroke-width="4"/>
          <circle cx="580" cy="440" r="52" fill="none" stroke="#ea8685" stroke-width="2" stroke-dasharray="6 4"/>
          <line x1="580" y1="372" x2="580" y2="508" stroke="#f5cd79" stroke-width="2"/>
          <line x1="512" y1="440" x2="648" y2="440" stroke="#f5cd79" stroke-width="2"/>
          <line x1="532" y1="392" x2="628" y2="488" stroke="#f5cd79" stroke-width="2"/>
          <line x1="628" y1="392" x2="532" y2="488" stroke="#f5cd79" stroke-width="2"/>
          <circle cx="580" cy="372" r="7" fill="#eb4d4b"/>
          <circle cx="580" cy="508" r="7" fill="#6ab04c"/>
          <circle cx="512" cy="440" r="7" fill="#f0932b"/>
          <circle cx="648" cy="440" r="7" fill="#22a6b3"/>
          <circle cx="532" cy="392" r="7" fill="#be2edd"/>
          <circle cx="628" cy="488" r="7" fill="#f9ca24"/>
          <circle cx="628" cy="392" r="7" fill="#eb4d4b"/>
          <circle cx="532" cy="488" r="7" fill="#22a6b3"/>
        </g>
        <circle cx="580" cy="440" r="9" fill="#303952" stroke="#f5cd79" stroke-width="3"/>
      </g>

      <!-- Середній план міста — кольорові будинки -->
      <g id="midground-city">
        <rect x="25" y="455" width="95" height="190" fill="#574b90"/>
        <polygon points="20,455 72,415 125,455" fill="#303952"/>
        <g fill="#ffeaa7" opacity="0.8">
          <rect x="40" y="475" width="18" height="24" rx="2"/>
          <rect x="65" y="475" width="18" height="24" rx="2"/>
          <rect x="90" y="475" width="18" height="24" rx="2"/>
          <rect x="40" y="515" width="18" height="24" rx="2"/>
          <rect x="90" y="515" width="18" height="24" rx="2"/>
          <rect x="40" y="555" width="18" height="24" rx="2"/>
          <rect x="65" y="555" width="18" height="24" rx="2"/>
        </g>

        <rect x="330" y="470" width="110" height="175" fill="#e15f41"/>
        <rect x="325" y="462" width="120" height="10" fill="#c44569"/>
        <g fill="#fff200" opacity="0.75">
          <rect x="348" y="490" width="22" height="26" rx="2"/>
          <rect x="395" y="490" width="22" height="26" rx="2"/>
          <rect x="348" y="532" width="22" height="26" rx="2"/>
          <rect x="395" y="532" width="22" height="26" rx="2"/>
        </g>

        <rect x="625" y="485" width="95" height="160" fill="#3dc1d3"/>
        <g fill="#dff9fb" opacity="0.85">
          <rect x="642" y="505" width="22" height="22" rx="2"/>

          <rect x="680" y="542" width="22" height="22" rx="2"/>

      <!-- Зелені пагорби та паркова зона міста -->
      <path d="M-500 635 Q260 595 560 630 T1160 625 T1900 635 L1900 720 L-500 720 Z" fill="#2ecc71"/>
      <path d="M-500 655 Q380 625 760 650 T1900 645 L1900 735 L-500 735 Z" fill="#27ae60"/>

      <!-- Міська дорога з розміткою -->
      <rect x="-500" y="655" width="2400" height="32" fill="#4b5563"/>
      <line x1="-500" y1="671" x2="1900" y2="671" stroke="#f9ca24" stroke-width="3" stroke-dasharray="28 22"/>

      <!-- Анімована машинка-бетонозмішувач, що їде містом -->
      <g id="city-truck">
        <animateTransform attributeName="transform" type="translate" from="-250 633" to="1650 633" dur="22s" repeatCount="indefinite"/>

        <path d="M56 10 L78 10 L84 22 L84 32 L56 32 Z" fill="#f1c40f"/>
        <rect x="62" y="13" width="15" height="9" rx="2" fill="#74b9ff"/>

      <!-- Широкий кам'яний майданчик для будівництва -->
      <rect x="-500" y="685" width="2400" height="300" fill="#576574"/>

      <path d="M-500 725 H1900 M-500 765 H1900 M-500 805 H1900" stroke="#485460" stroke-width="2"/>

    <!-- ================= 2. ВЕЛИКИЙ БАШТОВИЙ КРАН СПРАВА ================= -->
    <g id="tower-crane">
      <rect x="1245" y="695" width="90" height="35" rx="4" fill="#636e72" stroke="#2d3436" stroke-width="2.5"/>
      <rect x="1255" y="683" width="70" height="14" fill="url(#hazardStripes)" stroke="#2d3436" stroke-width="2"/>

      <rect x="1272" y="95" width="36" height="588" fill="none" stroke="#f39c12" stroke-width="5"/>
      <path d="M1272 680 L1308 640 L1272 600 L1308 560 L1272 520 L1308 480 L1272 440 L1308 400 L1272 360 L1308 320 L1272 280 L1308 240 L1272 200 L1308 160 L1272 120 L1308 95" fill="none" stroke="#e67e22" stroke-width="3.5"/>
      <path d="M1308 680 L1272 640 L1308 600 L1272 560 L1308 520 L1272 480 L1308 440 L1272 400 L1308 360 L1272 320 L1308 280 L1272 240 L1308 200 L1272 160 L1308 120 L1272 95" fill="none" stroke="#d35400" stroke-width="2.5"/>

      <polygon points="650,95 1385,95 1365,72 680,72" fill="none" stroke="#f39c12" stroke-width="4.5"/>

<script>
  // =========================================================================
  // 1. ЗВУКОВИЙ РУШІЙ (Web Audio API — активні різноманітні звуки без слів)
  // =========================================================================
  let audioCtx = null;

  function getAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // Звук встановлення будівельного елемента краном + святковий акорд
  function playBuildSuccessSound(stepNumber) {
    const ctx = getAudio();
    const now = ctx.currentTime;

    const oscThud = ctx.createOscillator();
    const gainThud = ctx.createGain();
    oscThud.type = 'triangle';
    oscThud.frequency.setValueAtTime(140, now);
    oscThud.frequency.exponentialRampToValueAtTime(48, now + 0.16);
    gainThud.gain.setValueAtTime(0.35, now);
    gainThud.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
    oscThud.connect(gainThud);
    gainThud.connect(ctx.destination);
    oscThud.start(now);
    oscThud.stop(now + 0.19);

    const melodies = [
      [523.25, 659.25, 783.99, 1046.50],
      [587.33, 739.99, 880.00, 1174.66],
      [659.25, 830.61, 987.77, 1318.51],
      [523.25, 659.25, 783.99, 987.77, 1046.50]
    ];
    const notes = melodies[stepNumber % melodies.length];

    notes.forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = idx % 2 === 0 ? 'triangle' : 'sine';
      const startTime = now + 0.08 + idx * 0.075;
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(0.22, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.36);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.37);
    });
  }

  // Грандіозна фанфара завершення всього 3-поверхового будинку (15 елементів)
  function playHouseCompletedFanfare() {
    const ctx = getAudio();
    const now = ctx.currentTime;
    const fanfare = [
      { f: 523.25, t: 0.0, d: 0.15 },
      { f: 659.25, t: 0.14, d: 0.15 },
      { f: 783.99, t: 0.28, d: 0.15 },
      { f: 1046.50, t: 0.42, d: 0.32 },
      { f: 783.99, t: 0.72, d: 0.16 },
      { f: 1046.50, t: 0.88, d: 0.65 }
    ];
    fanfare.forEach(n => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(n.f, now + n.t);
      gain.gain.setValueAtTime(0.28, now + n.t);
      gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + n.t);
      osc.stop(now + n.t + n.d + 0.02);
    });
  }

  // Кумедний пружинний звук при помилці
  function playWrongSound() {
    const ctx = getAudio();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.linearRampToValueAtTime(135, now + 0.18);
    osc.frequency.linearRampToValueAtTime(185, now + 0.28);
    osc.frequency.linearRampToValueAtTime(110, now + 0.45);

    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.005, now + 0.46);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.48);
  }

  // Короткий клік для кнопок навігації та перемикача класу
  function playClickSound(pitch = 620) {
    const ctx = getAudio();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(pitch, now);
    osc.frequency.exponentialRampToValueAtTime(pitch * 1.4, now + 0.06);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.08);
  }

  // =========================================================================
  // 2. СТАН ГРИ, ВИБІР КЛАСУ (1, 2, 1+2) ТА КООРДИНАТИ ЕЛЕМЕНТІВ БУДИНКУ
  // =========================================================================
  const TOTAL_PARTS = 15; // 3 поверхи по 5 елементів
  let builtCount = 0;     // Скільки елементів поточного будинку вже зведено (0..15)
  let gradeMode = 'both'; // Поточний режим: '1' (1 клас), '2' (2 клас), 'both' (1+2 разом)
  let currentTask = null;
  let taskHistory = [];   // Історія завдань для кнопки "Назад"
  let historyIndex = -1;
  let isAnimating = false;

  // Координати (X, Y) кожного з 15 елементів будинку для точного наведення крана
  const partTargets = [
    { x: 930, y: 695 }, // 1: Фундамент і сходи
    { x: 930, y: 615 }, // 2: Цегляні стіни 1-го поверху
    { x: 930, y: 620 }, // 3: Парадні двері з колонами
    { x: 930, y: 610 }, // 4: Вікна 1-го поверху з квітами
    { x: 930, y: 552 }, // 5: Міжповерховий карниз і ліхтарі
    { x: 930, y: 480 }, // 6: Стіни 2-го поверху
    { x: 930, y: 485 }, // 7: Центральні французькі двері
    { x: 930, y: 475 }, // 8: Аркові вікна з віконницями
    { x: 930, y: 520 }, // 9: Кований балкон та пілястри
    { x: 930, y: 406 }, // 10: Карниз і фриз 2-го поверху
    { x: 930, y: 340 }, // 11: Фахверкові стіни 3-го поверху
    { x: 930, y: 335 }, // 12: Три вікна 3-го поверху
    { x: 930, y: 230 }, // 13: Черепичний дах і димар
    { x: 930, y: 205 }, // 14: Мансарда з годинником та флюгером
    { x: 930, y: 245 }  // 15: Фінальний декор, світло у вікнах, дерева
  ];

  // Перемикання режиму складності: '1', '2' або 'both' (1+2)
  function setGradeMode(mode) {
    if (isAnimating) return;
    gradeMode = mode;
    playClickSound(mode === '1' ? 520 : mode === '2' ? 680 : 820);

    document.getElementById('mode-1').classList.toggle('active', mode === '1');
    document.getElementById('mode-2').classList.toggle('active', mode === '2');
    document.getElementById('mode-both').classList.toggle('active', mode === 'both');

    // Одразу генеруємо приклад обраного рівня складності
    nextGeneratedTask();
  }

  // Створення 15 візуальних індикаторів (3 поверхи по 5 точок)
  function initProgressDots() {
    const group = document.getElementById('progress-dots');
    group.innerHTML = '';
    for (let floor = 0; floor < 3; floor++) {
      for (let el = 0; el < 5; el++) {
        const idx = floor * 5 + el;
        const cx = 34 + el * 36;
        const cy = 39 - floor * 13;
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('id', `prog-dot-${idx}`);
        circle.setAttribute('cx', cx);
        circle.setAttribute('cy', cy);
        circle.setAttribute('r', '5');
        circle.setAttribute('fill', '#174e8a');
        circle.setAttribute('stroke', '#74b9ff');
        circle.setAttribute('stroke-width', '1.5');
        group.appendChild(circle);
      }
    }
  }

  function updateProgressDots() {
    for (let i = 0; i < TOTAL_PARTS; i++) {
      const dot = document.getElementById(`prog-dot-${i}`);
      if (!dot) continue;
      if (i < builtCount) {
        dot.setAttribute('fill', '#fff200');
        dot.setAttribute('stroke', '#f39c12');
      } else {
        dot.setAttribute('fill', '#174e8a');
        dot.setAttribute('stroke', '#74b9ff');
      }
    }
  }

  // =========================================================================
  // 3. ГЕНЕРАТОР ПРИКЛАДІВ ОКРЕМО ДЛЯ 1 КЛАСУ ТА 2 КЛАСУ
  // =========================================================================
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // Генератор завдань для 1 КЛАСУ (прості переведення, числа в межах 20 см або круглі десятки)
  function generateGrade1Task() {
    const type = randInt(1, 7);
    let question = '';
    let correct = '';
    let wrongSet = new Set();

    if (type === 1) {
      // Переведення цілих дм у см: 5 дм = ? см
      const dm = randInt(1, 9);
      const ans = dm * 10;
      question = `${dm} дм = ? см`;
      correct = `${ans} см`;
      wrongSet.add(`${dm} см`);
      wrongSet.add(`${dm + 10} см`);
      wrongSet.add(`${dm === 9 ? 80 : (dm + 1) * 10} см`);
    } else if (type === 2) {
      // Переведення круглих см у дм: 60 см = ? дм
      const dm = randInt(1, 9);
      const cm = dm * 10;
      question = `${cm} см = ? дм`;
      correct = `${dm} дм`;
      wrongSet.add(`${cm} дм`);
      wrongSet.add(`${dm + 10} дм`);
      wrongSet.add(`${dm === 9 ? 8 : dm + 1} дм`);
    } else if (type === 3) {
      // Переведення в межах другого десятка (1 дм і см -> см): 1 дм 4 см = ? см
      const cm = randInt(1, 9);
      const ans = 10 + cm;
      question = `1 дм ${cm} см = ? см`;
      correct = `${ans} см`;
      wrongSet.add(`${1 + cm} см`);
      wrongSet.add(`${cm * 10 + 1} см`);
      wrongSet.add(`${cm}0 см`);
    } else if (type === 4) {
      // Переведення двоцифрового числа (11..19 см) у дм і см: 17 см = ?
      const cm = randInt(2, 9);
      const total = 10 + cm;
      question = `${total} см = ?`;
      correct = `1 дм ${cm} см`;
      wrongSet.add(`${cm} дм 1 см`);
      wrongSet.add(`1 дм ${cm * 10} см`);
      wrongSet.add(`${1 + cm} дм`);
    } else if (type === 5) {
      // Додавання та віднімання однорідних дм у межах 10: 4 дм + 3 дм = ? дм
      if (Math.random() > 0.5) {
        const a = randInt(1, 5);
        const b = randInt(1, 10 - a);
        const ans = a + b;
        question = `${a} дм + ${b} дм = ? дм`;
        correct = `${ans} дм`;
        wrongSet.add(`${ans * 10} дм`);
        wrongSet.add(`${ans + 1} дм`);
        wrongSet.add(`${Math.max(1, ans - 1)} дм`);
      } else {
        const a = randInt(3, 10);
        const b = randInt(1, a - 1);
        const ans = a - b;
        question = `${a} дм - ${b} дм = ? дм`;
        correct = `${ans} дм`;
        wrongSet.add(`${ans * 10} дм`);
        wrongSet.add(`${ans + 1} дм`);
        wrongSet.add(`${Math.max(1, ans - 1)} дм`);
      }
    } else if (type === 6) {
      // Просте додавання 1 дм та кількох см: 1 дм + 6 см = ? см
      const cm = randInt(1, 9);
      const ans = 10 + cm;
      question = `1 дм + ${cm} см = ? см`;
      correct = `${ans} см`;
      wrongSet.add(`${1 + cm} см`);
      wrongSet.add(`${cm * 10 + 1} см`);
      wrongSet.add(`${ans + 1} см`);
    } else {
      // Просте віднімання в межах 20 см: 16 см - 6 см = ? дм або 18 см - 1 дм = ? см
      const cm = randInt(1, 9);
      if (Math.random() > 0.5) {
        question = `${10 + cm} см - ${cm} см = ? дм`;
        correct = `1 дм`;
        wrongSet.add(`10 дм`);
        wrongSet.add(`${cm} дм`);
        wrongSet.add(`2 дм`);
      } else {
        question = `${10 + cm} см - 1 дм = ? см`;
        correct = `${cm} см`;
        wrongSet.add(`${cm + 9} см`);
        wrongSet.add(`10 см`);
        wrongSet.add(`${cm + 1} см`);
      }
    }

    return finalizeTaskOptions(question, correct, wrongSet);
  }

  // Генератор завдань для 2 КЛАСУ (двоцифрові іменовані числа до 100 см, комбіновані дії, перехід через десяток)
  function generateGrade2Task() {
    const type = randInt(1, 8);
    let question = '';
    let correct = '';
    let wrongSet = new Set();

    if (type === 1) {
      // Складені іменовані числа в см: 6 дм 8 см = ? см
      const dm = randInt(2, 9);
      const cm = randInt(1, 9);
      const ans = dm * 10 + cm;
      question = `${dm} дм ${cm} см = ? см`;
      correct = `${ans} см`;
      wrongSet.add(`${cm * 10 + dm} см`);
      wrongSet.add(`${dm + cm} см`);
      wrongSet.add(`${ans + 10} см`);
    } else if (type === 2) {
      // Розкладання двоцифрових см (21..99) на дм і см: 74 см = ?
      const dm = randInt(2, 9);
      const cm = randInt(1, 9);
      if (dm === cm) return generateGrade2Task();
      const total = dm * 10 + cm;
      question = `${total} см = ?`;
      correct = `${dm} дм ${cm} см`;
      wrongSet.add(`${cm} дм ${dm} см`);
      wrongSet.add(`${dm} дм ${cm * 10} см`);
      wrongSet.add(`${dm + cm} дм`);
    } else if (type === 3) {
      // Додавання дм і двоцифрових см: 3 дм + 46 см = ? см
      const dm = randInt(2, 5);
      const otherDm = randInt(1, 9 - dm);
      const cm = randInt(1, 9);
      const bVal = otherDm * 10 + cm;
      const ans = dm * 10 + bVal;
      question = `${dm} дм + ${bVal} см = ? см`;
      correct = `${ans} см`;
      wrongSet.add(`${dm + bVal} см`);
      wrongSet.add(`${ans - 10} см`);
      wrongSet.add(`${ans + 10} см`);
    } else if (type === 4) {
      // Віднімання дм від двоцифрових см: 85 см - 3 дм = ? см
      const dmTotal = randInt(4, 9);
      const cm = randInt(1, 9);
      const subDm = randInt(2, dmTotal - 1);
      const total = dmTotal * 10 + cm;
      const ans = (dmTotal - subDm) * 10 + cm;
      question = `${total} см - ${subDm} дм = ? см`;
      correct = `${ans} см`;
      wrongSet.add(`${total - subDm} см`);
      wrongSet.add(`${ans + 10} см`);
      wrongSet.add(`${(dmTotal - subDm)} дм`);
    } else if (type === 5) {
      // Додавання з утворенням нового десятка (перехід у цілі дм): 4 дм 3 см + 7 см = ? дм
      const dm = randInt(2, 8);
      const cm1 = randInt(2, 8);
      const cm2 = 10 - cm1;
      const ansDm = dm + 1;
      question = `${dm} дм ${cm1} см + ${cm2} см = ? дм`;
      correct = `${ansDm} дм`;
      wrongSet.add(`${ansDm * 10} дм`);
      wrongSet.add(`${dm} дм`);
      wrongSet.add(`${dm + cm1 + cm2} см`);
    } else if (type === 6) {
      // Віднімання см від цілих дм (розмін дециметра): 5 дм - 4 см = ? см
      const dm = randInt(2, 9);
      const cm = randInt(1, 9);
      const ans = dm * 10 - cm;
      question = `${dm} дм - ${cm} см = ? см`;
      correct = `${ans} см`;
      wrongSet.add(`${dm * 10 + cm} см`);
      wrongSet.add(`${(dm - 1) * 10 - cm} см`);
      wrongSet.add(`${Math.abs(dm - cm)} см`);
    } else if (type === 7) {
      // Додавання та віднімання круглих десятків см із переведенням у дм: 90 см - 40 см = ? дм
      const aDm = randInt(5, 9);
      const bDm = randInt(2, aDm - 1);
      const ans = aDm - bDm;
      question = `${aDm * 10} см - ${bDm * 10} см = ? дм`;
      correct = `${ans} дм`;
      wrongSet.add(`${ans * 10} дм`);
      wrongSet.add(`${aDm + bDm} дм`);
      wrongSet.add(`${ans + 1} дм`);
    } else {
      // Додавання складених іменованих чисел: 2 дм 3 см + 4 дм 5 см = ? см
      const d1 = randInt(1, 4);
      const d2 = randInt(2, 9 - d1);
      const c1 = randInt(1, 5);
      const c2 = randInt(1, 9 - c1);
      const ans = (d1 + d2) * 10 + (c1 + c2);
      question = `${d1} дм ${c1} см + ${d2} дм ${c2} см = ? см`;
      correct = `${ans} см`;
      wrongSet.add(`${(c1 + c2) * 10 + (d1 + d2)} см`);
      wrongSet.add(`${d1 + d2 + c1 + c2} см`);
      wrongSet.add(`${ans + 10} см`);
    }

    return finalizeTaskOptions(question, correct, wrongSet);
  }

  // Формування 4 унікальних варіантів відповіді
  function finalizeTaskOptions(question, correct, wrongSet) {
    wrongSet.delete(correct);
    const distractors = Array.from(wrongSet).slice(0, 3);
    while (distractors.length < 3) {
      const extra = `${randInt(2, 95)} см`;
      if (extra !== correct && !distractors.includes(extra)) {
        distractors.push(extra);
      }
    }
    const options = shuffleArray([correct, ...distractors]);
    return { question, correct, options };
  }

  // Вибір генератора відповідно до активного перемикача (1, 2 або 1+2)
  function generateNewTask() {
    if (gradeMode === '1') {
      return generateGrade1Task();
    } else if (gradeMode === '2') {
      return generateGrade2Task();
    } else {
      return Math.random() < 0.5 ? generateGrade1Task() : generateGrade2Task();
    }
  }

  // Відображення поточного прикладу на інженерній дошці
  function renderTask(task) {
    currentTask = task;
    const qEl = document.getElementById('math-question');
    qEl.textContent = task.question;
    if (task.question.length > 20) {
      qEl.setAttribute('font-size', '38');
    } else if (task.question.length > 14) {
      qEl.setAttribute('font-size', '45');
    } else {
      qEl.setAttribute('font-size', '52');
    }

    task.options.forEach((opt, idx) => {
      const tEl = document.getElementById(`ans-text-${idx}`);
      tEl.textContent = opt;
      tEl.setAttribute('font-size', opt.length > 8 ? '32' : '36');
    });
  }

  // =========================================================================
  // 4. ВІЗУАЛЬНІ ЕФЕКТИ КРАНА, БУДІВНИЦТВА ТА ЕМОЦІЙ ПЕРСОНАЖА
  // =========================================================================
  function animateCraneTo(partIndex) {
    const target = partTargets[partIndex] || { x: 930, y: 400 };
    const trolley = document.getElementById('crane-trolley-group');
    const cable = document.getElementById('crane-cable');
    const hook = document.getElementById('crane-hook-group');

    trolley.style.transform = `translate(${target.x}px, 95px)`;
    const cableLen = Math.max(45, target.y - 160);
    cable.setAttribute('height', cableLen);
    hook.style.transform = `translate(0px, ${cableLen + 10}px)`;

    setTimeout(() => {
      cable.setAttribute('height', 65);
      hook.style.transform = 'translate(0px, 75px)';
    }, 520);
  }

  // Спалах зірочок і будівельних іскор при правильній відповіді
  function spawnSparkles(cx, cy, count = 18) {
    const fx = document.getElementById('fx-layer');
    const colors = ['#fff200', '#ffdd59', '#ff6b81', '#2ed573', '#70a1ff', '#ffa502'];

    for (let i = 0; i < count; i++) {
      const star = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      star.setAttribute('points', '0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3');
      star.setAttribute('fill', colors[i % colors.length]);
      fx.appendChild(star);

      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
      const dist = randInt(55, 165);
      const tx = cx + Math.cos(angle) * dist;
      const ty = cy + Math.sin(angle) * dist;

      star.animate([
        { transform: `translate(${cx}px, ${cy}px) scale(0.3) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${tx}px, ${ty}px) scale(1.35) rotate(180deg)`, opacity: 0 }
      ], {
        duration: 750 + Math.random() * 250,
        easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
      }).onfinish = () => star.remove();
    }
  }

  // Реакція Бобра-архітектора (радість або подив)
  function triggerCharacterEmotion(type) {
    const charRoot = document.getElementById('character-root');
    const eyesNormal = document.getElementById('eyes-normal');
    const eyesHappy = document.getElementById('eyes-happy');
    const mouth = document.getElementById('beaver-mouth');

    charRoot.classList.remove('happy', 'sad');
    void charRoot.offsetWidth;

    if (type === 'happy') {
      charRoot.classList.add('happy');
      eyesNormal.setAttribute('opacity', '0');
      eyesHappy.setAttribute('opacity', '1');
      mouth.setAttribute('d', 'M178 594 Q205 620 232 594');
      setTimeout(() => {
        eyesNormal.setAttribute('opacity', '1');
        eyesHappy.setAttribute('opacity', '0');
        mouth.setAttribute('d', 'M182 596 Q205 612 228 596');
        charRoot.classList.remove('happy');
      }, 1100);
    } else {
      charRoot.classList.add('sad');
      mouth.setAttribute('d', 'M188 606 Q205 594 222 606');
      setTimeout(() => {
        mouth.setAttribute('d', 'M182 596 Q205 612 228 596');
        charRoot.classList.remove('sad');
      }, 650);
    }
  }

  // Оновити видимість усіх 15 елементів будинку відповідно до builtCount
  function syncHouseParts(animatedPartIndex = -1) {
    for (let i = 1; i <= TOTAL_PARTS; i++) {
      const el = document.getElementById(`part-${i}`);
      if (!el) continue;
      el.classList.remove('just-built');
      if (i <= builtCount) {
        el.classList.add('built');
        if (i === animatedPartIndex) {
          void el.offsetWidth;
          el.classList.add('just-built');
        }
      } else {
        el.classList.remove('built');
      }
    }

    // Якщо всі 15 елементів збудовано — вмикаємо тепле світло у всіх вікнах
    const windows = document.querySelectorAll('.house-win');
    windows.forEach(w => {
      w.setAttribute('fill', builtCount === TOTAL_PARTS ? 'url(#windowLit)' : 'url(#windowGlass)');
    });

    updateProgressDots();
  }

  // =========================================================================
  // 5. ОБРОБКА ВІДПОВІДЕЙ ТА КНОПОК НАВІГАЦІЇ ("НАЗАД" / "ДАЛІ")
  // =========================================================================
  function selectAnswer(optIndex) {
    if (isAnimating || !currentTask) return;
    const chosen = currentTask.options[optIndex];

    if (chosen === currentTask.correct) {
      isAnimating = true;

      if (builtCount >= TOTAL_PARTS) {
        builtCount = 0;
        syncHouseParts();
      }

      builtCount++;
      const target = partTargets[builtCount - 1];

      playBuildSuccessSound(builtCount);
      animateCraneTo(builtCount - 1);
      syncHouseParts(builtCount);
      triggerCharacterEmotion('happy');
      spawnSparkles(target.x, target.y, 16);

      if (builtCount === TOTAL_PARTS) {
        setTimeout(() => {
          playHouseCompletedFanfare();
          spawnSparkles(820, 260, 22);
          spawnSparkles(1040, 260, 22);
          spawnSparkles(930, 180, 26);
        }, 450);
      }

      setTimeout(() => {
        nextGeneratedTask();
        isAnimating = false;
      }, builtCount === TOTAL_PARTS ? 1400 : 750);

    } else {
      playWrongSound();
      triggerCharacterEmotion('sad');
    }
  }

  function nextGeneratedTask() {
    const newTask = generateNewTask();
    taskHistory.push(newTask);
    historyIndex = taskHistory.length - 1;
    renderTask(newTask);
  }

  function navigateStep(dir) {
    playClickSound();
    if (dir === 1) {
      if (builtCount >= TOTAL_PARTS) {
        builtCount = 1;
      } else {
        builtCount++;
      }
      animateCraneTo(builtCount - 1);
      syncHouseParts(builtCount);

      if (historyIndex < taskHistory.length - 1) {
        historyIndex++;
        renderTask(taskHistory[historyIndex]);
      } else {
        nextGeneratedTask();
      }
    } else if (dir === -1) {
      if (builtCount > 0) {
        builtCount--;
        syncHouseParts();
      }
      if (historyIndex > 0) {
        historyIndex--;
        renderTask(taskHistory[historyIndex]);
      } else {
        nextGeneratedTask();
      }
    }
  }

  // Автоматичне моргання очей Бобра-будівельника
  setInterval(() => {
    const eyesNormal = document.getElementById('eyes-normal');
    const eyesHappy = document.getElementById('eyes-happy');
    if (eyesHappy.getAttribute('opacity') === '1') return;
    eyesNormal.style.transformOrigin = '205px 564px';
    eyesNormal.style.transform = 'scaleY(0.1)';
    setTimeout(() => {
      eyesNormal.style.transform = 'scaleY(1)';
    }, 130);
  }, 3600);

  // Старт гри
  initProgressDots();
  syncHouseParts();
  nextGeneratedTask();
</script>
