<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Сафарі-вантажівка: Склад чисел 2-6</title>
<style>
  /* ================= БАЗОВІ СТИЛІ ТА СКИДАННЯ ================= */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', 'Comic Sans MS', sans-serif;
    background: #e09f3e;
  }

  /* Головна сцена гри */
  #game-stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(180deg, #ff9233 0%, #ffd166 42%, #f4d58d 62%, #709775 62%, #415d43 100%);
  }

  /* ================= ЖИВИЙ СЮЖЕТНИЙ ФОН САВАНИ ================= */
  #bg-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* Плавний рух хмар та птахів */
  .cloud-drift-1 {
    animation: cloudMove 55s linear infinite;
  }
  .cloud-drift-2 {
    animation: cloudMove 38s linear infinite;
  }
  @keyframes cloudMove {
    0% { transform: translateX(-280px); }
    100% { transform: translateX(1400px); }
  }

  .acacia-sway {
    transform-origin: bottom center;
    transform-box: fill-box;
    animation: treeBreeze 4.5s ease-in-out infinite alternate;
  }
  @keyframes treeBreeze {
    0% { transform: rotate(-1.4deg); }
    100% { transform: rotate(1.4deg); }
  }

  .birds-flock {
    animation: birdsFly 26s linear infinite;
  }
  @keyframes birdsFly {
    0% { transform: translate(-120px, 30px) scale(0.85); }
    50% { transform: translate(650px, -18px) scale(1.05); }
    100% { transform: translate(1400px, 20px) scale(0.85); }
  }

  /* ================= КНОПКИ НАВІГАЦІЇ (НАЗАД / ДАЛІ) ================= */
  .nav-btn {
    position: fixed;
    top: 2.2vh;
    width: 68px;
    height: 68px;
    z-index: 60;
    cursor: pointer;
    background: none;
    border: none;
    outline: none;
    filter: drop-shadow(0 6px 8px rgba(40, 20, 5, 0.45));
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .nav-btn:hover {
    transform: scale(1.12);
  }
  .nav-btn:active {
    transform: scale(0.92);
  }
  #btn-prev { left: 2.2vw; }
  #btn-next { right: 2.2vw; }

  /* ================= САФАРІ-ВАНТАЖІВКА З ПРИЧЕПОМ ================= */
  /* Вантажівка стоїть чітко колесами на дорозі */
  #truck-assembly {
    position: absolute;
    left: 50%;
    bottom: 18.5vh;
    width: 860px;
    height: 320px;
    margin-left: -340px;
    z-index: 15;
    will-change: transform;
  }

  #truck-assembly.offscreen-left {
    transform: translateX(-145vw);
    transition: none;
  }
  #truck-assembly.parked {
    transform: translateX(0);
    transition: transform 1.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #truck-assembly.offscreen-right {
    transform: translateX(135vw);
    transition: transform 1.3s cubic-bezier(0.55, 0.05, 0.67, 0.19);
  }

  /* Легка вібрація кузова від роботи двигуна */
  #truck-suspension {
    position: relative;
    width: 100%;
    height: 100%;
    transform-origin: center 250px;
    animation: engineIdle 0.38s ease-in-out infinite alternate;
  }
  @keyframes engineIdle {
    0% { transform: translateY(0px); }
    100% { transform: translateY(-2px); }
  }

  /* Просідання ресор, коли тварина застрибує в кузов */
  .suspension-bounce {
    animation: suspensionDip 0.38s ease-out !important;
  }
  @keyframes suspensionDip {
    0% { transform: translateY(0) rotate(0deg); }
    35% { transform: translateY(11px) rotate(-1.2deg); }
    75% { transform: translateY(-3px) rotate(0.4deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }

  /* Струс при помилковій відповіді */
  .truck-shake-error {
    animation: truckErrorWobble 0.45s ease-in-out !important;
  }
  @keyframes truckErrorWobble {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-12px) rotate(-1deg); }
    40% { transform: translateX(12px) rotate(1deg); }
    60% { transform: translateX(-8px) rotate(-0.6deg); }
    80% { transform: translateX(8px) rotate(0.6deg); }
  }

  /* Обертання коліс навколо власного центру (0,0) без зміщення координат */
  .wheel-rotor {
    transform-origin: 0px 0px;
    animation: spinWheel 0.55s linear infinite;
  }
  .wheel-stopped .wheel-rotor {
    animation-play-state: paused;
  }
  @keyframes spinWheel {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Відкидний дерев'яний трап ззаду причепа */
  #ramp-rotor {
    transform-origin: 0px 0px;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .ramp-closed {
    transform: rotate(0deg);
  }
  .ramp-open {
    transform: rotate(-122deg);
  }

  /* Живий водій у кабіні вантажівки */
  #driver-character {
    transform-origin: 0px 0px;
    transition: transform 0.3s ease;
    animation: driverBob 1.8s ease-in-out infinite alternate;
  }
  @keyframes driverBob {
    0% { transform: translateY(0px) rotate(-2deg); }
    100% { transform: translateY(-3px) rotate(3deg); }
  }
  .driver-happy {
    animation: driverCheer 0.35s ease-in-out infinite alternate !important;
  }
  @keyframes driverCheer {
    0% { transform: translateY(2px) rotate(-8deg) scale(1.04); }
    100% { transform: translateY(-9px) rotate(10deg) scale(1.08); }
  }
  .driver-oops {
    animation: driverShake 0.22s ease-in-out 3 !important;
  }
  @keyframes driverShake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-14deg); }
    75% { transform: rotate(14deg); }
  }

  /* Пульсація щита з цифрою на кабіні при помилці */
  .badge-pulse {
    animation: badgeHighlight 0.55s ease-in-out;
  }
  @keyframes badgeHighlight {
    0%, 100% { transform: translate(642px, 174px) scale(1); }
    50% { transform: translate(642px, 174px) scale(1.24); }
  }

  /* ================= ШАРИ ТВАРИН ТА АНІМАЦІЯ ЇХНІХ КІНЦІВОК ================= */
  /* Контейнер тварин всередині причепа (між задньою стінкою та переднім бортиком) */
  #trailer-animals-layer {
    position: absolute;
    left: 44px;
    bottom: 92px;
    width: 492px;
    height: 150px;
    z-index: 16;
    pointer-events: none;
  }

  /* Загальний шар для тварин на дорозі та під час посадки */
  #ground-animals-layer {
    position: absolute;
    left: 0;
    top: 0;
    width: 100vw;
    height: 100vh;
    z-index: 22;
    pointer-events: none;
  }

  .animal-actor {
    position: absolute;
    width: 122px;
    height: 106px;
    transform-origin: center bottom;
    will-change: left, top, transform;
  }

  /* Всі шарніри кінцівок обертаються навколо (0,0) своєї точки кріплення */
  .leg-f-near, .leg-f-far, .leg-b-near, .leg-b-far, .head-rotor, .tail-rotor, .animal-rig {
    transform-origin: 0px 0px;
  }

  /* 1. Стан спокою (дихання, помах хвоста, легкий рух голови) */
  .state-idle .animal-rig {
    animation: rigBreathe 2.2s ease-in-out infinite alternate;
  }
  .state-idle .head-rotor {
    animation: headIdle 2.6s ease-in-out infinite alternate;
  }
  .state-idle .tail-rotor {
    animation: tailIdle 1.5s ease-in-out infinite alternate;
  }
  @keyframes rigBreathe {
    0% { transform: translateY(0px) scaleY(1); }
    100% { transform: translateY(1.5px) scaleY(0.985); }
  }
  @keyframes headIdle {
    0% { transform: rotate(-2.5deg); }
    100% { transform: rotate(3.5deg); }
  }
  @keyframes tailIdle {
    0% { transform: rotate(-10deg); }
    100% { transform: rotate(14deg); }
  }

  /* 2. Стан реалістичної ходьби (перехресний крок 4 лап + пружний рух корпусу) */
  .state-walking .animal-rig {
    animation: walkBounce 0.22s ease-in-out infinite alternate;
  }
  .state-walking .leg-f-near,
  .state-walking .leg-b-far {
    animation: legSwingA 0.24s ease-in-out infinite alternate;
  }
  .state-walking .leg-f-far,
  .state-walking .leg-b-near {
    animation: legSwingB 0.24s ease-in-out infinite alternate;
  }
  .state-walking .head-rotor {
    animation: walkHeadNod 0.24s ease-in-out infinite alternate;
  }
  .state-walking .tail-rotor {
    animation: walkTailCarry 0.24s ease-in-out infinite alternate;
  }

  @keyframes walkBounce {
    0% { transform: translateY(0px) rotate(-1deg); }
    100% { transform: translateY(-4.5px) rotate(1.5deg); }
  }
  @keyframes legSwingA {
    0% { transform: rotate(-26deg); }
    100% { transform: rotate(26deg); }
  }
  @keyframes legSwingB {
    0% { transform: rotate(26deg); }
    100% { transform: rotate(-26deg); }
  }
  @keyframes walkHeadNod {
    0% { transform: rotate(-5deg); }
    100% { transform: rotate(6deg); }
  }
  @keyframes walkTailCarry {
    0% { transform: rotate(12deg); }
    100% { transform: rotate(28deg); }
  }

  /* 3. Стан присідання перед стрибком у кузов */
  .state-crouch .animal-rig {
    transform: translateY(7px) rotate(-12deg) scale(1.06, 0.9);
    transition: transform 0.16s ease-out;
  }
  .state-crouch .leg-b-near, .state-crouch .leg-b-far {
    transform: rotate(-28deg);
    transition: transform 0.16s ease-out;
  }
  .state-crouch .leg-f-near, .state-crouch .leg-f-far {
    transform: rotate(22deg);
    transition: transform 0.16s ease-out;
  }
  .state-crouch .head-rotor {
    transform: rotate(-16deg);
    transition: transform 0.16s ease-out;
  }

  /* 4. Стан стрибка ВГОРУ в причіп (задні лапи відштовхуються, передні тягнуться вперед) */
  .state-jump-up .leg-b-near, .state-jump-up .leg-b-far {
    transform: rotate(38deg);
    transition: transform 0.2s ease-out;
  }
  .state-jump-up .leg-f-near, .state-jump-up .leg-f-far {
    transform: rotate(-36deg);
    transition: transform 0.2s ease-out;
  }
  .state-jump-up .tail-rotor {
    transform: rotate(35deg);
  }
  .state-jump-up .head-rotor {
    transform: rotate(-10deg);
  }

  /* 5. Пружне вмощування на своєму місці в кузові */
  .state-settle {
    animation: settleSquash 0.36s ease-out;
  }
  @keyframes settleSquash {
    0% { transform: scale(1.14, 0.86); }
    50% { transform: scale(0.95, 1.06); }
    100% { transform: scale(1, 1); }
  }

  /* ================= ПАНЕЛЬ ВИБОРУ ЦИФР (1 - 6) ================= */
  #numbers-dock {
    position: absolute;
    bottom: 1.8vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 1.5vw;
    z-index: 50;
    padding: 8px 20px;
  }

  .num-totem {
    width: 92px;
    height: 102px;
    cursor: pointer;
    position: relative;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
    filter: drop-shadow(0 7px 9px rgba(30, 18, 6, 0.48));
  }
  .num-totem:hover {
    transform: translateY(-9px) scale(1.07);
    filter: drop-shadow(0 14px 14px rgba(30, 18, 6, 0.55)) brightness(1.06);
  }
  .num-totem:active {
    transform: translateY(2px) scale(0.95);
  }

  .totem-wrong {
    animation: totemShake 0.48s ease-in-out;
  }
  @keyframes totemShake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-11px) rotate(-9deg); }
    40% { transform: translateX(11px) rotate(9deg); }
    60% { transform: translateX(-7px) rotate(-5deg); }
    80% { transform: translateX(7px) rotate(5deg); }
  }

  .totem-correct {
    animation: totemPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes totemPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.28) translateY(-14px); filter: drop-shadow(0 0 20px #ffd166); }
    100% { transform: scale(1); }
  }

  /* Шар спецефектів (хмарки пилу з-під лап та салют) */
  #fx-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 45;
  }

  /* Адаптація для менших екранів */
  @media (max-width: 1060px) {
    #truck-assembly {
      transform-origin: center bottom;
      scale: 0.8;
      margin-left: -360px;
    }
    .num-totem {
      width: 76px;
      height: 84px;
    }
  }
</style>
</head>
<body>

<div id="game-stage">
  <!-- ================= ЖИВИЙ СЮЖЕТНИЙ ФОН САВАНИ ================= -->
  <svg id="bg-svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff8d6" />
        <stop offset="50%" stop-color="#ffbe0b" stop-opacity="0.75" />
        <stop offset="100%" stop-color="#fb5607" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="canyonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#c97a53" />
        <stop offset="100%" stop-color="#8d5538" />
      </linearGradient>
      <linearGradient id="safariRoadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#df9a4f" />
        <stop offset="45%" stop-color="#c87d32" />
        <stop offset="100%" stop-color="#9c5a18" />
      </linearGradient>
    </defs>

    <!-- Сонце в небі савани -->
    <circle cx="1010" cy="125" r="145" fill="url(#sunGlow)" />
    <circle cx="1010" cy="125" r="62" fill="#fff9db" />

    <!-- Хмари -->
    <g class="cloud-drift-1" opacity="0.82">
      <path d="M90 105 Q120 72 162 92 Q198 62 242 92 Q280 82 292 112 Q305 135 270 140 L95 140 Q65 135 90 105 Z" fill="#ffe5d9" />
    </g>
    <g class="cloud-drift-2" style="animation-delay: -18s;" opacity="0.72">
      <path d="M140 175 Q165 148 200 165 Q230 148 260 172 Q285 178 270 198 L140 198 Q115 192 140 175 Z" fill="#ffcad4" />
    </g>

    <!-- Птахи в небі -->
    <g class="birds-flock">
      <path d="M0 0 Q12 -14 24 0 Q36 -14 48 0 Q36 -5 24 4 Q12 -5 0 0 Z" fill="#5c3a21" />
      <path d="M38 16 Q48 6 58 16 Q68 6 78 16 Q68 11 58 19 Q48 11 38 16 Z" fill="#5c3a21" />
    </g>

    <!-- Далекі скелясті плато савани -->
    <path d="M-20 430 L85 335 L205 335 L275 405 L455 385 L545 310 L690 310 L775 410 L980 365 L1115 325 L1215 325 L1300 420 L1300 480 L-20 480 Z" fill="url(#canyonGrad)" opacity="0.65" />
    <path d="M-20 455 Q260 400 540 440 T1060 425 T1300 445 L1300 510 L-20 510 Z" fill="#b57c4e" />

    <!-- Акації з обох боків -->
    <g class="acacia-sway">
      <path d="M195 455 Q200 385 178 340 Q150 305 110 295 M200 455 Q205 375 228 325 Q255 295 288 290 M202 390 Q175 350 155 335" stroke="#4a2c18" stroke-width="10" stroke-linecap="round" fill="none" />
      <ellipse cx="115" cy="292" rx="68" ry="18" fill="#386641" />
      <ellipse cx="190" cy="325" rx="56" ry="15" fill="#6a994e" />
      <ellipse cx="278" cy="288" rx="75" ry="20" fill="#2b5030" />
      <ellipse cx="212" cy="274" rx="86" ry="22" fill="#4f772d" />
    </g>

    <g class="acacia-sway" style="animation-delay: -2.2s;">
      <path d="M1110 450 Q1115 380 1085 330 Q1050 300 1020 295 M1118 450 Q1123 375 1155 320 Q1190 295 1215 290" stroke="#4a2c18" stroke-width="11" stroke-linecap="round" fill="none" />
      <ellipse cx="1030" cy="292" rx="70" ry="18" fill="#386641" />
      <ellipse cx="1200" cy="288" rx="78" ry="20" fill="#2b5030" />
      <ellipse cx="1120" cy="270" rx="95" ry="24" fill="#6a994e" />
    </g>

    <!-- Зелена смуга трави за дорогою -->
    <path d="M-20 455 Q420 432 880 450 T1300 445 L1300 520 L-20 520 Z" fill="#588157" />

    <!-- ШИРОКА ПІЩАНА ДОРОГА САВАНИ (саме тут стоять звірі та котяться колеса машини) -->
    <path d="M-20 495 Q640 486 1300 495 L1300 618 Q640 610 -20 618 Z" fill="url(#safariRoadGrad)" stroke="#7f4f24" stroke-width="4" />
    <!-- Колії на піску -->
    <path d="M-20 532 Q640 524 1300 532" stroke="#edc483" stroke-width="5" stroke-dasharray="38 24" fill="none" opacity="0.55" />
    <path d="M-20 584 Q640 576 1300 584" stroke="#edc483" stroke-width="5" stroke-dasharray="45 28" fill="none" opacity="0.55" />

    <!-- Дерев'яний вказівник зупинки сафарі біля місця посадки -->
    <g transform="translate(278, 430)">
      <rect x="-5" y="0" width="10" height="72" rx="3" fill="#5c3010" stroke="#2b1606" stroke-width="2.5" />
      <polygon points="-38,8 32,8 44,22 32,36 -38,36" fill="#e9c46a" stroke="#4a2c18" stroke-width="3" stroke-linejoin="round" />
      <!-- Силует лапки на вказівнику (без жодного тексту) -->
      <circle cx="-4" cy="24" r="6" fill="#7f4f24" />
      <circle cx="-12" cy="15" r="3" fill="#7f4f24" />
      <circle cx="-4" cy="13" r="3" fill="#7f4f24" />
      <circle cx="4" cy="15" r="3" fill="#7f4f24" />
      <path d="M14 16 L26 22 L14 28 Z" fill="#bc6c25" />
    </g>

    <!-- Передній план: смарагдова трава під кнопки цифр -->
    <path d="M-20 612 Q320 598 640 612 T1300 608 L1300 730 L-20 730 Z" fill="#2d6a4f" stroke="#1b4332" stroke-width="4" />
    <g fill="#1b4332">
      <path d="M35 625 L45 592 L57 625 L70 598 L77 625 Z" />
      <path d="M235 622 L245 590 L257 622 L270 596 L277 622 Z" />
      <path d="M1020 622 L1030 588 L1045 622 L1060 594 L1068 622 Z" />
      <path d="M1190 620 L1202 588 L1215 620 L1228 592 L1238 620 Z" />
    </g>
  </svg>

  <!-- ================= КНОПКИ НАВІГАЦІЇ (ДЕРЕВ'ЯНІ СТРІЛКИ) ================= -->
  <button id="btn-prev" class="nav-btn" aria-label="Попередній рівень">
    <svg viewBox="0 0 100 100">
      <defs>
        <radialGradient id="btnWood" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#e09f3e" />
          <stop offset="65%" stop-color="#9e5a24" />
          <stop offset="100%" stop-color="#5c3010" />
        </radialGradient>
      </defs>
      <circle cx="50" cy="50" r="44" fill="url(#btnWood)" stroke="#3d1e08" stroke-width="6" />
      <circle cx="50" cy="50" r="36" fill="none" stroke="#f4d58d" stroke-width="2.5" stroke-dasharray="10 6" opacity="0.7" />
      <path d="M62 28 L32 50 L62 72 L55 50 Z" fill="#fff3b0" stroke="#3d1e08" stroke-width="4" stroke-linejoin="round" />
    </svg>
  </button>

  <button id="btn-next" class="nav-btn" aria-label="Наступний рівень">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="44" fill="url(#btnWood)" stroke="#3d1e08" stroke-width="6" />
      <circle cx="50" cy="50" r="36" fill="none" stroke="#f4d58d" stroke-width="2.5" stroke-dasharray="10 6" opacity="0.7" />
      <path d="M38 28 L68 50 L38 72 L45 50 Z" fill="#fff3b0" stroke="#3d1e08" stroke-width="4" stroke-linejoin="round" />
    </svg>
  </button>

  <!-- ================= САФАРІ-ВАНТАЖІВКА З ПРИЧЕПОМ ================= -->
  <div id="truck-assembly" class="offscreen-left">
    <div id="truck-suspension">
      <!-- Контейнер для звірів, які вже стоять/сидять у причепі -->
      <div id="trailer-animals-layer"></div>

      <!-- SVG Вантажівка + Причіп + Відкидний трап + Живий водій + Колеса -->
      <svg id="truck-svg" viewBox="0 0 860 320" width="100%" height="100%">
        <defs>

  // 1. ЗВУКОВИЙ РУШІЙ (Web Audio API) — РЕАЛІСТИЧНІ ЗВУКИ КРОКІВ, СТРИБКІВ ТА МОТОРА
  // =========================================================================
  class SoundEngine {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    // Бурчання мотора вантажівки під час руху
    playTruckEngine(duration = 1.1, rising = true) {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';

      osc.frequency.setValueAtTime(rising ? 52 : 92, now);
      osc.frequency.exponentialRampToValueAtTime(rising ? 92 : 48, now + duration);

      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.11, now + 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    // Звук відкриття/закриття дерев'яного трапа
    playRampClunk(open = true) {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(open ? 160 : 110, now);
      osc.frequency.exponentialRampToValueAtTime(open ? 75 : 175, now + 0.14);

      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.16);
    }

    // М'який тупіт лап/копит під час ходьби тварини
    playFootstep(pitchOffset = 0) {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(115 + pitchOffset, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.065);

      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.075);
    }

      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      const startFreq = 220 + index * 40;
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(startFreq, now);
      osc.frequency.exponentialRampToValueAtTime(startFreq * 1.9, now + 0.24);

      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.27);
    }

      const osc = this.ctx.createOscillator();

      osc.frequency.exponentialRampToValueAtTime(48, now + 0.12);

      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.14);
    }

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.38);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.45);
    }

  // =========================================================================
  // 3. СТВОРЕННЯ ПАНЕЛІ ЦИФР (1..6)
  // =========================================================================
  const numbersDock = document.getElementById('numbers-dock');
  const totemPalettes = [
    ['#ff595e', '#c9184a'], // 1
    ['#ffca3a', '#e07a5f'], // 2
    ['#8ac926', '#386641'], // 3
    ['#1982c4', '#1d3557'], // 4
    ['#9b5de5', '#5a189a'], // 5
    ['#f77f00', '#9c4100']  // 6
  ];

  for (let n = 1; n <= 6; n++) {
    const [colTop, colBot] = totemPalettes[n - 1];
    const btn = document.createElement('div');
    btn.className = 'num-totem';
    btn.dataset.value = n;
    btn.innerHTML = `
      <svg viewBox="0 0 100 110" width="100%" height="100%">
        <defs>
          <linearGradient id="totemGrad${n}" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="${colTop}" />
            <stop offset="100%" stop-color="${colBot}" />
          </linearGradient>
        </defs>
        <path d="M16 18 Q50 6 84 18 Q94 55 82 94 Q50 106 18 94 Q6 55 16 18 Z" fill="#5c3010" stroke="#2b1606" stroke-width="5" />
        <path d="M22 23 Q50 13 78 23 Q86 55 76 88 Q50 98 24 88 Q14 55 22 23 Z" fill="url(#totemGrad${n})" stroke="#fff3b0" stroke-width="3" />
        <path d="M18 22 Q28 10 38 20 Q28 28 18 22 Z" fill="#8ac926" stroke="#2b5030" stroke-width="2" />

      </svg>
    `;
    btn.addEventListener('click', () => handleNumberClick(n, btn));
    numbersDock.appendChild(btn);
  }

  // =========================================================================
  // 4. СПЕЦЕФЕКТИ (ПИЛ ПІД ЛАПАМИ ТА СВЯТКОВИЙ ФЕЄРВЕРК)
  // =========================================================================
  const fxLayer = document.getElementById('fx-layer');

  function spawnDustPuff(xPx, yPx, scale = 1, color = '#edc483') {
    const stageRect = document.getElementById('game-stage').getBoundingClientRect();
    const svgX = (xPx / stageRect.width) * 1280;
    const svgY = (yPx / stageRect.height) * 720;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    for (let i = 0; i < 5; i++) {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      const angle = Math.PI + (Math.random() - 0.5) * 2.2;
      const dx = Math.cos(angle) * 26 * scale;
      const dy = -Math.abs(Math.sin(angle) * 18 * scale) - 4;

      circle.setAttribute('cx', svgX);
      circle.setAttribute('cy', svgY);
      circle.setAttribute('r', 8 * scale);
      circle.setAttribute('fill', color);
      circle.setAttribute('opacity', '0.8');
      g.appendChild(circle);

      circle.animate([
        { transform: 'translate(0px, 0px) scale(0.5)', opacity: 0.85 },
        { transform: `translate(${dx}px, ${dy}px) scale(1.4)`, opacity: 0 }
      ], { duration: 360, easing: 'ease-out' });
    }
    fxLayer.appendChild(g);
    setTimeout(() => g.remove(), 380);
  }

  function spawnCelebrationBurst() {
    const colors = ['#ffd166', '#06d6a0', '#ef476f', '#118ab2', '#ff9f1c'];
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

    for (let i = 0; i < 24; i++) {
      const star = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      const startX = 520 + (Math.random() - 0.5) * 280;
      const startY = 340 + (Math.random() - 0.5) * 70;
      const dx = (Math.random() - 0.5) * 340;
      const dy = -90 - Math.random() * 180;

      star.setAttribute('points', '0,-12 4,-4 12,-4 6,2 8,11 0,6 -8,11 -6,2 -12,-4 -4,-4');
      star.setAttribute('fill', colors[i % colors.length]);
      star.setAttribute('stroke', '#3d1e08');
      star.setAttribute('stroke-width', '1.5');
      g.appendChild(star);

      star.animate([
        { transform: `translate(${startX}px, ${startY}px) scale(0.3) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${startX + dx}px, ${startY + dy}px) scale(1.3) rotate(240deg)`, opacity: 0 }
      ], { duration: 850 + Math.random() * 300, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' });
    }
    fxLayer.appendChild(g);
    setTimeout(() => g.remove(), 1200);
  }

  // =========================================================================
  // 5. ЕМОЦІЇ ВОДІЯ В КАБІНІ ТА КЕРУВАННЯ ТРАПОМ І КОЛЕСАМИ
  // =========================================================================
  const driverEl = document.getElementById('driver-character');
  const driverMouth = document.getElementById('driver-mouth');
  const rampRotor = document.getElementById('ramp-rotor');
  const truckAssembly = document.getElementById('truck-assembly');
  const truckSuspension = document.getElementById('truck-suspension');
  const targetBadgeGroup = document.getElementById('target-badge-group');

  function setDriverState(state) {
    driverEl.classList.remove('driver-happy', 'driver-oops');
    if (state === 'happy') {
      driverEl.classList.add('driver-happy');
      driverMouth.setAttribute('d', 'M1 -7 Q7 1 13 -7 Z');
      driverMouth.setAttribute('fill', '#ef476f');
    } else if (state === 'oops') {
      driverEl.classList.add('driver-oops');
      driverMouth.setAttribute('d', 'M3 -3 Q7 -8 11 -3');
      driverMouth.setAttribute('fill', 'none');
    } else {
      driverMouth.setAttribute('d', 'M2 -6 Q8 -2 12 -6');
      driverMouth.setAttribute('fill', 'none');
    }
  }

  function setWheelsSpinning(spinning) {
    if (spinning) {
      truckAssembly.classList.remove('wheel-stopped');
    } else {
      truckAssembly.classList.add('wheel-stopped');
    }
  }

  function setRampOpen(open) {
    if (open) {
      rampRotor.classList.remove('ramp-closed');
      rampRotor.classList.add('ramp-open');
    } else {
      rampRotor.classList.remove('ramp-open');
      rampRotor.classList.add('ramp-closed');
    }
  }

  // =========================================================================
  // 6. ЗБАЛАНСОВАНИЙ ГЕНЕРАТОР СКЛАДУ ЧИСЕЛ (2, 3, 4, 5, 6)
  // =========================================================================
  const levelHistory = [];
  let currentHistoryIndex = -1;
  let isBusy = false;

  // Тасована колода цільових чисел [2, 3, 4, 5, 6], щоб кожне число гарантовано випадало!
  let targetDeck = [];

  function getNextTargetNumber() {
    if (targetDeck.length === 0) {
      targetDeck = [2, 3, 4, 5, 6];
      // Перемішуємо за алгоритмом Фішера-Єйтса
      for (let i = targetDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [targetDeck[i], targetDeck[j]] = [targetDeck[j], targetDeck[i]];
      }
      // Перевіряємо, щоб перше число нової колоди не збігалося з останнім числом минулої
      if (levelHistory.length > 0 && targetDeck[0] === levelHistory[levelHistory.length - 1].targetTotal) {
        [targetDeck[0], targetDeck[1]] = [targetDeck[1], targetDeck[0]];
      }
    }
    return targetDeck.shift();
  }

  function createRandomLevelData() {
    const targetTotal = getNextTargetNumber();

    // Кількість звірів, що вже в кузові: від 1 до (targetTotal - 1)
    const initialCount = 1 + Math.floor(Math.random() * (targetTotal - 1));
    const missingCount = targetTotal - initialCount;

    // Вибираємо 2 різні види тварин із 10
    const idx1 = Math.floor(Math.random() * ANIMAL_SPECIES.length);
    let idx2 = Math.floor(Math.random() * (ANIMAL_SPECIES.length - 1));
    if (idx2 >= idx1) idx2++;

    return {
      targetTotal,
      initialCount,
      missingCount,
      speciesInside: ANIMAL_SPECIES[idx1],
      speciesWaiting: ANIMAL_SPECIES[idx2]
    };
  }

  // =========================================================================
  // 7. ВІДМАЛЬОВКА СЛОТІВ У ПРИЧЕПІ ТА ПОЗИЦІОНУВАННЯ ЗВІРІВ
  // =========================================================================
  const trailerAnimalsLayer = document.getElementById('trailer-animals-layer');
  const groundAnimalsLayer = document.getElementById('ground-animals-layer');
  const targetNumberText = document.getElementById('target-number-text');
  const slotDividersGroup = document.getElementById('trailer-slot-dividers');

  // Розрахунок координат місця в причепі: звірі займають місця справа наліво (від кабіни до входу),
  // щоб нові звірі, які застрибують зліва, природно підходили до вільних місць без перестрибування через зайняті!
  function getSlotXInTrailer(slotOrderIndex, totalSlots) {
    const usableWidth = 480;
    const step = usableWidth / totalSlots;
    // slotOrderIndex = 0 — найближче до кабіни (справа), щоб вхід зліва залишався вільним для посадки
    const visualColFromLeft = (totalSlots - 1) - slotOrderIndex;
    const x = step * visualColFromLeft + (step - 118) / 2;
    return x;
  }

  // Відмальовка дерев'яних перегородок та килимків-місць у причепі відповідно до targetTotal (2..6)
  function renderTrailerStalls(totalSlots) {
    slotDividersGroup.innerHTML = '';
    const usableWidth = 480;
    const step = usableWidth / totalSlots;

    for (let i = 0; i < totalSlots; i++) {
      const slotLeft = 52 + i * step;
      const slotCenter = slotLeft + step / 2;

      // Вертикальна бамбукова перегородка між секціями
      if (i > 0) {
        const divider = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        divider.setAttribute('x1', slotLeft);
        divider.setAttribute('y1', 78);
        divider.setAttribute('x2', slotLeft);
        divider.setAttribute('y2', 208);
        divider.setAttribute('stroke', '#8a5a36');
        divider.setAttribute('stroke-width', '5');
        divider.setAttribute('stroke-dasharray', '12 6');
        slotDividersGroup.appendChild(divider);
      }

      // Солом'яний килимок-місце на підлозі кузова
      const mat = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      mat.setAttribute('cx', slotCenter);
      mat.setAttribute('cy', 204);
      mat.setAttribute('rx', Math.min(36, step * 0.38));
      mat.setAttribute('ry', 8);
      mat.setAttribute('fill', '#e9c46a');
      mat.setAttribute('stroke', '#3d2210');
      mat.setAttribute('stroke-width', '2');
      slotDividersGroup.appendChild(mat);
    }
  }

  // Завантаження рівня
  function loadLevel(levelData) {
    isBusy = true;
    setDriverState('idle');
    setRampOpen(false);

    trailerAnimalsLayer.innerHTML = '';
    groundAnimalsLayer.innerHTML = '';

    // Оновлюємо цільове число (2, 3, 4, 5 або 6) на дверях кабіни
    targetNumberText.textContent = levelData.targetTotal;
    renderTrailerStalls(levelData.targetTotal);

    // Розміщуємо початкових тварин першого виду у причепі (починаючи від правого краю біля кабіни)
    for (let i = 0; i < levelData.initialCount; i++) {
      const slotX = getSlotXInTrailer(i, levelData.targetTotal);
      const animalEl = document.createElement('div');
      animalEl.className = 'animal-actor state-idle';
      animalEl.style.left = `${slotX}px`;
      animalEl.style.top = `34px`;
      trailerAnimalsLayer.appendChild(animalEl);
      animalEl.innerHTML = getArticulatedAnimalSVG(levelData.speciesInside);
    }

    // Розміщуємо шеренгу тварин другого виду на піщаній дорозі зліва від місця паркування причепа
    // Вони стоять на землі одна за одною, готові йти вперед та стрибати в кузов
    const waitingCount = 5;
    const roadBaseY = window.innerHeight * 0.635;
    for (let i = 0; i < waitingCount; i++) {
      const wAnimal = document.createElement('div');
      wAnimal.className = 'animal-actor state-idle waiting-queue-animal';
      // i = 0 стоїть найближче до причепа (перший у черзі на посадку)
      const queueX = 165 - i * 44;
      const queueY = roadBaseY + (i % 2) * 14;
      wAnimal.style.left = `${queueX}px`;
      wAnimal.style.top = `${queueY}px`;
      wAnimal.style.zIndex = 20 + (i % 2);
      wAnimal.innerHTML = getArticulatedAnimalSVG(levelData.speciesWaiting);
      groundAnimalsLayer.appendChild(wAnimal);
    }

    // Заїзд вантажівки зліва
    truckAssembly.className = 'offscreen-left';
    setWheelsSpinning(true);

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        sound.playTruckEngine(1.2, true);
        truckAssembly.className = 'parked wheel-stopped';
        setWheelsSpinning(true);
      });
    });

    // Коли вантажівка зупинилася — зупиняємо колеса і відкидаємо трап
    setTimeout(() => {
      setWheelsSpinning(false);
      sound.playRampClunk(true);
      setRampOpen(true);
      isBusy = false;
    }, 1350);
  }

  // =========================================================================
  // 8. РЕАЛІСТИЧНА ХОРЕОГРАФІЯ ПОСАДКИ: ХОДЬБА ПО ЗЕМЛІ -> СТРИБОК ВГОРУ -> ПРОХІД ПО КУЗОВУ
  // =========================================================================
  function handleNumberClick(selectedNumber, btnElement) {
    if (isBusy) return;

    const currentLevel = levelHistory[currentHistoryIndex];

    if (selectedNumber === currentLevel.missingCount) {
      isBusy = true;
      btnElement.classList.add('totem-correct');
      setTimeout(() => btnElement.classList.remove('totem-correct'), 600);

      setDriverState('happy');
      boardAnimalsRealistically(currentLevel);
    } else {
      // Активний фідбек при помилці
      sound.playErrorBoing();
      btnElement.classList.add('totem-wrong');
      truckSuspension.classList.add('truck-shake-error');
      targetBadgeGroup.classList.add('badge-pulse');
      setDriverState('oops');

      setTimeout(() => {
        btnElement.classList.remove('totem-wrong');
        truckSuspension.classList.remove('truck-shake-error');
        targetBadgeGroup.classList.remove('badge-pulse');
        if (!isBusy) setDriverState('idle');
      }, 580);
    }
  }

  // Покрокова реалістична анімація кожної тварини:
  // Фаза 1: Йде лапами по дорозі до трапа причепа.
  // Фаза 2: Присідає біля трапа і вистрибує ВГОРУ на підлогу кузова (задній край причепа).
  // Фаза 3: Йде лапами всередині причепа до свого вільного місця і зупиняється.
  function boardAnimalsRealistically(levelData) {
    const queueAnimals = Array.from(groundAnimalsLayer.querySelectorAll('.waiting-queue-animal'));
    const countToBoard = levelData.missingCount;

    let completedBoardings = 0;

    for (let i = 0; i < countToBoard; i++) {
      setTimeout(() => {
        const actor = queueAnimals[i];
        if (!actor) return;

        const targetOrderSlot = levelData.initialCount + i;
        const targetInternalX = getSlotXInTrailer(targetOrderSlot, levelData.targetTotal);

        const trailerRect = trailerAnimalsLayer.getBoundingClientRect();
        const actorRect = actor.getBoundingClientRect();

        const startX = actorRect.left;
        const startY = actorRect.top;

        // Точка біля підніжжя відкидного трапа на землі
        const rampFootX = trailerRect.left - 62;
        const rampFootY = trailerRect.top + 96;

        // Точка входу на підлогу кузова (лівий край всередині причепа)
        const deckEntryX = trailerRect.left + 4;
        const deckEntryY = trailerRect.top + 34;

        // Фінальна точка місця всередині причепа
        const finalScreenX = trailerRect.left + targetInternalX;
        const finalScreenY = deckEntryY;

        // ---------------- ФАЗА 1: ХОДЬБА ПО ЗЕМЛІ ДО ТРАПА ----------------
        actor.classList.remove('state-idle');
        actor.classList.add('state-walking');

        const walkGroundDist = Math.max(40, Math.hypot(rampFootX - startX, rampFootY - startY));
        const walkGroundDuration = Math.min(720, Math.max(340, walkGroundDist * 2.4));

        // Звуки кроків та пил під лапами під час підходу до причепа
        const stepInterval = setInterval(() => {
          const r = actor.getBoundingClientRect();
          sound.playFootstep(i * 15);
          spawnDustPuff(r.left + 55, r.bottom - 6, 0.75);
        }, 160);

        const walkToRampAnim = actor.animate([
          { left: `${startX}px`, top: `${startY}px` },
          { left: `${rampFootX}px`, top: `${rampFootY}px` }
        ], {
          duration: walkGroundDuration,
          easing: 'linear',
          fill: 'forwards'
        });

        walkToRampAnim.onfinish = () => {
          clearInterval(stepInterval);
          actor.style.left = `${rampFootX}px`;
          actor.style.top = `${rampFootY}px`;

          // ---------------- ФАЗА 2: ПРИСІДАННЯ ТА СТРИБОК ВГОРУ В КУЗОВ ----------------
          actor.classList.remove('state-walking');
          actor.classList.add('state-crouch');

          setTimeout(() => {
            actor.classList.remove('state-crouch');
            actor.classList.add('state-jump-up');
            sound.playAnimalJumpUp(i);
            spawnDustPuff(rampFootX + 60, rampFootY + 95, 1.15);

            // Висока дуга стрибка знизу-вгору на платформу причепа
            const jumpMidX = (rampFootX + deckEntryX) / 2;
            const jumpPeakY = deckEntryY - 46;

            const jumpUpAnim = actor.animate([
              { left: `${rampFootX}px`, top: `${rampFootY}px`, transform: 'rotate(-20deg)' },
              { left: `${jumpMidX}px`, top: `${jumpPeakY}px`, transform: 'rotate(-8deg)', offset: 0.58 },
              { left: `${deckEntryX}px`, top: `${deckEntryY}px`, transform: 'rotate(0deg)' }
            ], {
              duration: 390,
              easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)',
              fill: 'forwards'
            });

            jumpUpAnim.onfinish = () => {
              sound.playDeckThud();
              // Просідання ресор вантажівки в момент приземлення звіра на підлогу кузова
              truckSuspension.classList.remove('suspension-bounce');
              void truckSuspension.offsetWidth;
              truckSuspension.classList.add('suspension-bounce');

              // Переносимо тварину в DOM-шар причепа у точці входу (x = 4px)
              actor.remove();
              const trailerActor = document.createElement('div');
              trailerActor.className = 'animal-actor state-walking';
              trailerActor.style.left = `4px`;
              trailerActor.style.top = `34px`;
              trailerActor.innerHTML = getArticulatedAnimalSVG(levelData.speciesWaiting);
              trailerAnimalsLayer.appendChild(trailerActor);

              // ---------------- ФАЗА 3: ПРОХІД ПО ПІДЛОЗІ КУЗОВА ДО СВОГО МІСЦЯ ----------------
              const insideDist = Math.abs(targetInternalX - 4);
              const walkInsideDuration = Math.max(180, insideDist * 1.65);

              const deckStepTimer = setInterval(() => {
                sound.playFootstep(35);
              }, 150);

              const walkInsideAnim = trailerActor.animate([
                { left: `4px`, top: `34px` },
                { left: `${targetInternalX}px`, top: `34px` }
              ], {
                duration: walkInsideDuration,
                easing: 'linear',
                fill: 'forwards'
              });

              walkInsideAnim.onfinish = () => {
                clearInterval(deckStepTimer);
                trailerActor.style.left = `${targetInternalX}px`;
                trailerActor.classList.remove('state-walking');
                trailerActor.classList.add('state-idle', 'state-settle');

                completedBoardings++;
                if (completedBoardings === countToBoard) {
                  finishLevelAndDepart();
                }
              };
            };
          }, 130);
        };
      }, i * 560);
    }
  }

  // Коли всі звірі зайшли і сіли на свої місця — закриваємо трап і машина вирушає!
  function finishLevelAndDepart() {
    setTimeout(() => {
      sound.playRampClunk(false);
      setRampOpen(false);
      sound.playVictoryHornAndFanfare();
      spawnCelebrationBurst();
    }, 220);

    // Ховаємо решту звірів із черги на дорозі, щоб не заважали від'їзду
    setTimeout(() => {
      groundAnimalsLayer.innerHTML = '';
      setWheelsSpinning(true);
      sound.playTruckEngine(1.2, true);
      truckAssembly.className = 'offscreen-right';
    }, 950);

    setTimeout(() => {
      goToNextLevel();
    }, 2200);
  }

  // =========================================================================
  // 9. КНОПКИ НАВІГАЦІЇ ("ДАЛІ" ТА "НАЗАД")
  // =========================================================================
  function goToNextLevel() {
    if (currentHistoryIndex < levelHistory.length - 1) {
      currentHistoryIndex++;
    } else {
      levelHistory.push(createRandomLevelData());
      currentHistoryIndex = levelHistory.length - 1;
    }
    loadLevel(levelHistory[currentHistoryIndex]);
  }

  function goToPrevLevel() {
    if (currentHistoryIndex > 0) {
      currentHistoryIndex--;
      loadLevel(levelHistory[currentHistoryIndex]);
    } else {
      loadLevel(levelHistory[0]);
    }
  }

  document.getElementById('btn-next').addEventListener('click', () => {
    sound.init();
    goToNextLevel();
  });

  document.getElementById('btn-prev').addEventListener('click', () => {
    sound.init();
    goToPrevLevel();
  });

  // Запуск гри
  window.addEventListener('DOMContentLoaded', () => {
    goToNextLevel();
  });
</script>
</body>
</html>
