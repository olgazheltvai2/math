<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1-10 Динозаврики</title>
  <style>
    /* ==========================================================================
       RESET & FULL-VIEWPORT WIDESCREEN SETUP
       Two-layer SVG architecture:
       1) #bg-svg (preserveAspectRatio="xMidYMid slice") fills 100vw x 100vh
       2) #stage-svg (preserveAspectRatio="xMidYMid meet") keeps all interactive
          dino eggs, mama dinosaur, and buttons 100% inside the screen on any aspect ratio.
       CRITICAL: Never apply CSS transform to SVG elements positioned via
       transform="translate(X,Y)", so buttons and eggs NEVER jump/run away!
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #1c2e24;
      font-family: 'Georgia', 'Trebuchet MS', serif;
      cursor: default;
      touch-action: manipulation;
    }

    #game-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 35% 25%, #3b6e52 0%, #182b20 100%);
    }

    /* Layer 1: Full-bleed Prehistoric Valley Background */
    #bg-svg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      pointer-events: none;
    }

    /* Layer 2: Contained Interactive Stage (Mama Dino, Eggs, Stone/Wood UI Controls) */
    #stage-svg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 10;
      pointer-events: auto;
    }

    /* Layer 3: Particle & Sunbeam Spores Canvas overlay */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 20;
    }

    /* ==========================================================================
       AMBIENT PREHISTORIC VALLEY ANIMATIONS
       ========================================================================== */
    @keyframes pendulumSwing {
      0%   { transform: rotate(-10deg); }
      50%  { transform: rotate(10deg); }
      100% { transform: rotate(-10deg); }
    }

    @keyframes curtainSwayLeft {
      0%, 100% { transform: skewX(0deg) scaleX(1); }
      50%      { transform: skewX(-2.2deg) scaleX(1.02); }
    }

    @keyframes curtainSwayRight {
      0%, 100% { transform: skewX(0deg) scaleX(1); }
      50%      { transform: skewX(2.0deg) scaleX(0.98); }
    }

    @keyframes leafSway1 {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(3.6deg); }
    }

    @keyframes leafSway2 {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-3.2deg); }
    }

    @keyframes cloudDrift {
      0%   { transform: translateX(-40px); }
      50%  { transform: translateX(40px); }
      100% { transform: translateX(-40px); }
    }

    @keyframes sunbeamPulse {
      0%, 100% { opacity: 0.42; }
      50%      { opacity: 0.68; }
    }

    #clock-pendulum {
      transform-origin: 1235px 110px;
      animation: pendulumSwing 3.2s ease-in-out infinite;
    }

    #curtain-left {
      transform-origin: 140px 420px;
      animation: curtainSwayLeft 6.5s ease-in-out infinite;
    }

    #curtain-right {
      transform-origin: 1460px 420px;
      animation: curtainSwayRight 7.8s ease-in-out infinite;
    }

    #plant-foliage-1 {
      transform-origin: 360px 460px;
      animation: leafSway1 5.2s ease-in-out infinite;
    }

    #plant-foliage-2 {
      transform-origin: 1260px 470px;
      animation: leafSway2 6.4s ease-in-out infinite;
    }

    #window-clouds {
      animation: cloudDrift 36s ease-in-out infinite;
    }

    .sunbeam-ray {
      animation: sunbeamPulse 6s ease-in-out infinite;
      mix-blend-mode: screen;
    }

    /* ==========================================================================
       SAFE INTERACTIVE STATES (NO CSS TRANSFORM ON POSITIONED <g> ELEMENTS!)
       All hover/active feedback uses filter on outer group or inner local visual
       ========================================================================== */
    .interactive-node {
      cursor: pointer;
      pointer-events: all;
      transition: filter 0.2s ease;
    }

    .interactive-node:hover {
      filter: brightness(1.12) drop-shadow(0 6px 14px rgba(255, 225, 120, 0.55));
    }

    .interactive-node:active {
      filter: brightness(0.95) drop-shadow(0 2px 6px rgba(255, 200, 90, 0.4));
    }

    .hit-target {
      fill: rgba(255, 255, 255, 0.001);
      pointer-events: all;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-viewport">
    <!-- ========================================================================
         LAYER 1: PREHISTORIC JURASSIC VALLEY SVG (1600x900, slice to fill screen)
         ======================================================================== -->
    <svg id="bg-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="bg-shadow-deep" x="-20%" y="-20%" width="150%" height="150%">
          <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0d1f14" flood-opacity="0.55" />
        </filter>
        <filter id="bg-shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#122619" flood-opacity="0.45" />
        </filter>
        <filter id="bg-sun-blur" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="18" />
        </filter>

        <!-- Prehistoric Sky & Valley Gradients -->
        <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#6cc3d9" />
          <stop offset="45%" stop-color="#a8e6cf" />
          <stop offset="80%" stop-color="#fdffab" />
          <stop offset="100%" stop-color="#ffd394" />
        </linearGradient>

        <linearGradient id="distant-mountain-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#6b8c9e" />
          <stop offset="60%" stop-color="#4e736b" />
          <stop offset="100%" stop-color="#345448" />
        </linearGradient>

        <linearGradient id="mid-hills-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#5e9e6e" />
          <stop offset="60%" stop-color="#3e784f" />
          <stop offset="100%" stop-color="#275235" />
        </linearGradient>

        <linearGradient id="jungle-ground-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#4e7d44" />
          <stop offset="35%" stop-color="#3c6635" />
          <stop offset="75%" stop-color="#2b4d26" />
          <stop offset="100%" stop-color="#1a3317" />
        </linearGradient>

        <linearGradient id="canyon-ledge-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#a67c52" />
          <stop offset="35%" stop-color="#855c38" />
          <stop offset="100%" stop-color="#54361d" />
        </linearGradient>

        <linearGradient id="sunbeam-grad" x1="0%" y1="0%" x2="60%" y2="100%">
          <stop offset="0%" stop-color="#fff9d6" stop-opacity="0.45" />
          <stop offset="50%" stop-color="#ffe78c" stop-opacity="0.22" />
          <stop offset="100%" stop-color="#ffcc4d" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="palm-trunk-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#7a4e2d" />
          <stop offset="50%" stop-color="#9c6840" />
          <stop offset="100%" stop-color="#4f2f18" />
        </linearGradient>
      </defs>

      <!-- Warm Jurassic Sky -->
      <rect x="0" y="0" width="1600" height="540" fill="url(#sky-grad)" />

      <!-- Glowing Prehistoric Sun -->
      <circle cx="310" cy="145" r="88" fill="#fffbe0" fill-opacity="0.75" filter="url(#bg-sun-blur)" />
      <circle cx="310" cy="145" r="52" fill="#fffdf2" />

      <!-- Drifting Clouds & Friendly Pterodactyls in the Sky -->
      <g id="window-clouds">
        <path d="M180 185 Q205 155 240 168 Q275 142 315 165 Q345 158 360 185 Z" fill="#ffffff" fill-opacity="0.78" />
        <path d="M680 125 Q710 98 750 110 Q785 88 825 112 Q855 108 870 130 Z" fill="#ffffff" fill-opacity="0.72" />
        <path d="M1180 165 Q1205 140 1240 150 Q1270 132 1305 152 Q1330 148 1345 168 Z" fill="#ffffff" fill-opacity="0.75" />

        <!-- Cute Distant Pterodactyl Silhouette -->
        <g transform="translate(560, 145) scale(0.85)" fill="#527a78" opacity="0.65">
          <path d="M0 0 Q-22 -18 -48 -8 Q-26 -2 -8 6 L-18 12 L0 8 L14 14 L8 6 Q28 -2 50 -10 Q24 -18 0 0 Z" />
          <polygon points="0,0 12,-8 22,-5 6,3" />
        </g>
      </g>

      <!-- Distant Prehistoric Volcano & Misty Mountains -->
      <g id="distant-mountains">
        <!-- Gentle Steam Puffs from Volcano -->
        <circle cx="1035" cy="105" r="28" fill="#fff8eb" fill-opacity="0.45" filter="url(#bg-sun-blur)" />
        <circle cx="1065" cy="78" r="38" fill="#fff8eb" fill-opacity="0.35" filter="url(#bg-sun-blur)" />
        <circle cx="1105" cy="58" r="46" fill="#fff8eb" fill-opacity="0.25" filter="url(#bg-sun-blur)" />

        <!-- Mountain Peaks -->
        <polygon points="-40,460 180,240 430,460" fill="url(#distant-mountain-grad)" opacity="0.75" />
        <polygon points="320,460 610,210 910,460" fill="url(#distant-mountain-grad)" opacity="0.85" />
        <!-- Iconic Flat-Topped Volcano -->
        <polygon points="780,460 995,140 1075,140 1290,460" fill="url(#distant-mountain-grad)" />
        <!-- Warm Lava Rim Glow -->
        <ellipse cx="1035" cy="140" rx="40" ry="7" fill="#ff9b54" opacity="0.55" />
        <polygon points="1180,460 1440,225 1660,460" fill="url(#distant-mountain-grad)" opacity="0.8" />
      </g>

      <!-- Lush Midground Jungle Hills & Sparkling Waterfall -->
      <g id="midground-hills" filter="url(#bg-shadow-soft)">
        <path d="M-20 480 Q240 340 560 430 Q880 330 1220 420 Q1440 350 1620 430 L1620 550 L-20 550 Z" fill="url(#mid-hills-grad)" />
        <!-- Distant Waterfall on Right Hill -->
        <path d="M1355 382 C1362 425, 1358 465, 1368 510 L1395 510 C1385 465, 1388 425, 1378 382 Z" fill="#bef2ff" opacity="0.65" />
        <ellipse cx="1380" cy="510" rx="34" ry="8" fill="#e0faff" opacity="0.7" />
      </g>

      <!-- Left & Right Swaying Prehistoric Cycad / Palm Trees -->
      <g id="curtain-left" filter="url(#bg-shadow-deep)">
        <path d="M95 535 Q125 340 165 160 L195 165 Q162 340 142 535 Z" fill="url(#palm-trunk-grad)" />
        <g transform="translate(178, 165)">
          <path d="M0 0 C-65 -25, -135 5, -165 55 C-105 35, -50 25, 0 12 Z" fill="#2d6e3e" />
          <path d="M0 0 C-45 -65, -115 -75, -155 -40 C-95 -35, -45 -18, 0 5 Z" fill="#3f8c52" />
          <path d="M0 0 C15 -75, 85 -95, 135 -60 C80 -45, 35 -25, 0 5 Z" fill="#4ca360" />
          <path d="M0 0 C65 -35, 145 -10, 175 40 C115 20, 55 15, 0 12 Z" fill="#388049" />
          <path d="M0 0 C45 15, 95 55, 110 105 C65 65, 30 35, 0 15 Z" fill="#285e36" />
        </g>
      </g>

      <g id="curtain-right" filter="url(#bg-shadow-deep)">
        <path d="M1515 535 Q1485 350 1435 175 L1405 180 Q1448 350 1468 535 Z" fill="url(#palm-trunk-grad)" />
        <g transform="translate(1420, 178)">
          <path d="M0 0 C65 -25, 135 5, 165 55 C105 35, 50 25, 0 12 Z" fill="#2d6e3e" />
          <path d="M0 0 C45 -65, 115 -75, 155 -40 C95 -35, 45 -18, 0 5 Z" fill="#3f8c52" />
          <path d="M0 0 C-15 -75, -85 -95, -135 -60 C-80 -45, -35 -25, 0 5 Z" fill="#4ca360" />
          <path d="M0 0 C-65 -35, -145 -10, -175 40 C-115 20, -55 15, 0 12 Z" fill="#388049" />
        </g>
      </g>

      <!-- Hanging Prehistoric Vine & Glowing Amber Sun-Crystal (Replaces Wall Clock) -->
      <g id="wall-clock" filter="url(#bg-shadow-soft)">
        <g id="clock-pendulum">
          <path d="M1235 0 Q1228 65 1235 125" fill="none" stroke="#366938" stroke-width="5" stroke-linecap="round" />
          <path d="M1235 45 C1215 38, 1205 52, 1222 58 Z" fill="#529e54" />
          <path d="M1235 82 C1255 75, 1265 89, 1248 95 Z" fill="#529e54" />
          <!-- Amber Sun-Dial Medallion -->
          <circle cx="1235" cy="140" r="32" fill="#d9822b" stroke="#6e3809" stroke-width="3" />
          <circle cx="1235" cy="140" r="25" fill="#ffcf6b" />
          <line id="clock-hour-hand" x1="1235" y1="140" x2="1223" y2="128" stroke="#6e3809" stroke-width="3.5" stroke-linecap="round" />
          <line id="clock-min-hand" x1="1235" y1="140" x2="1235" y2="119" stroke="#6e3809" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="1235" cy="140" r="4" fill="#6e3809" />
        </g>
      </g>

      <!-- Canyon Stone Rim & Prehistoric Mossy Ground -->
      <path d="M0 495 Q400 465 800 485 T1600 475 L1600 545 L0 545 Z" fill="url(#canyon-ledge-grad)" stroke="#3d2612" stroke-width="3" />
      <rect x="0" y="520" width="1600" height="380" fill="url(#jungle-ground-grad)" />

      <!-- Decorative Moss Patches, Ferns & Warm Canyon Stones -->
      <g id="plant-foliage-1" filter="url(#bg-shadow-soft)">
        <path d="M360 515 C310 465, 250 455, 220 490 C260 505, 315 515, 360 515 Z" fill="#2e6b34" />
        <path d="M360 512 C330 445, 285 415, 255 438 C280 472, 325 498, 360 512 Z" fill="#438f49" />
        <path d="M365 512 C395 445, 445 425, 468 450 C435 480, 395 502, 365 512 Z" fill="#397d3f" />
        <path d="M362 508 C360 438, 382 405, 405 420 C402 460, 382 490, 362 508 Z" fill="#59ab5e" />
        <!-- Prehistoric Red/Orange Hibiscus Flower -->
        <circle cx="315" cy="465" r="14" fill="#f26444" />
        <circle cx="315" cy="465" r="6" fill="#ffe066" />
      </g>

      <g id="plant-foliage-2" filter="url(#bg-shadow-soft)">
        <path d="M1260 520 C1210 475, 1165 485, 1145 515 C1185 522, 1230 522, 1260 520 Z" fill="#2e6b34" />
        <path d="M1265 516 C1305 462, 1365 465, 1385 495 C1345 512, 1300 518, 1265 516 Z" fill="#438f49" />
        <path d="M1262 514 C1245 452, 1240 412, 1262 400 C1282 425, 1275 472, 1262 514 Z" fill="#59ab5e" />
        <circle cx="1315" cy="482" r="13" fill="#ff758f" />
        <circle cx="1315" cy="482" r="5.5" fill="#ffe066" />
      </g>

      <!-- Smooth River Stones around the clearing -->
      <g fill="#6e5a49" stroke="#3b2e23" stroke-width="2" opacity="0.75">
        <ellipse cx="145" cy="610" rx="42" ry="18" />
        <ellipse cx="185" cy="622" rx="25" ry="12" fill="#856f5b" />
        <ellipse cx="1445" cy="605" rx="48" ry="20" />
        <ellipse cx="1400" cy="618" rx="28" ry="13" fill="#856f5b" />
      </g>

      <!-- Sunlit Clearing Reflection Patch -->
      <ellipse cx="800" cy="720" rx="580" ry="145" fill="#ffe79e" fill-opacity="0.12" filter="url(#bg-sun-blur)" />

      <!-- Volumetric Diagonal Golden Sunbeams -->
      <g id="volumetric-sunbeams" pointer-events="none">
        <polygon class="sunbeam-ray" points="160,0 410,0 920,900 440,900" fill="url(#sunbeam-grad)" />
        <polygon class="sunbeam-ray" style="animation-delay: -2.5s;" points="440,0 680,0 1320,900 840,900" fill="url(#sunbeam-grad)" />
      </g>
    </svg>

    <!-- ========================================================================
         LAYER 2: INTERACTIVE STAGE & UI SVG (1600x900, preserveAspectRatio="xMidYMid meet")
         Guaranteed 100% visible inside any screen aspect ratio!
         ======================================================================== -->
    <svg id="stage-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="shadow-deep" x="-20%" y="-20%" width="150%" height="150%">
          <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#140c04" flood-opacity="0.55" />
        </filter>
        <filter id="shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1c1106" flood-opacity="0.45" />
        </filter>
        <filter id="glow-gold" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="6" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- Cozy Prehistoric Woven Dino Nest Gradients -->
        <radialGradient id="rug-base-grad" cx="50%" cy="48%" r="52%" fx="45%" fy="42%">
          <stop offset="0%" stop-color="#f2dfb6" />
          <stop offset="38%" stop-color="#d9b87c" />
          <stop offset="62%" stop-color="#b08246" />
          <stop offset="78%" stop-color="#608543" />
          <stop offset="90%" stop-color="#8c5a2b" />
          <stop offset="100%" stop-color="#4d2e12" />
        </radialGradient>

        <pattern id="rug-weave" width="26" height="14" patternUnits="userSpaceOnUse">
          <path d="M0 7 Q6.5 1.5 13 7 T26 7" stroke="#523214" stroke-width="1.4" fill="none" stroke-opacity="0.22" />
          <path d="M0 14 Q6.5 8.5 13 14 T26 14" stroke="#fff5d6" stroke-width="1" fill="none" stroke-opacity="0.22" />
        </pattern>

        <!-- Carved Wood & Amber Stone Button Gradients -->
        <radialGradient id="wood-btn-face" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#d99b66" />
          <stop offset="55%" stop-color="#9e6234" />
          <stop offset="90%" stop-color="#693b19" />
          <stop offset="100%" stop-color="#47250d" />
        </radialGradient>

        <linearGradient id="wood-btn-rim" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f0be8a" />
          <stop offset="50%" stop-color="#874f25" />
          <stop offset="100%" stop-color="#3b1d09" />
        </linearGradient>

        <linearGradient id="shelf-wood-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#8c5836" />
          <stop offset="20%" stop-color="#724427" />
          <stop offset="85%" stop-color="#59331b" />
          <stop offset="100%" stop-color="#3d2110" />
        </linearGradient>

        <radialGradient id="felt-badge-grad" cx="40%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#fffdf5" />
          <stop offset="75%" stop-color="#f2dfc2" />
          <stop offset="100%" stop-color="#cfa97e" />
        </radialGradient>

        <!-- Mama Dinosaur Scales & Skin Gradients (Friendly Meadow-Green & Golden-Cream Dino) -->
        <radialGradient id="cat-body-grad" cx="42%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#8cd96c" />
          <stop offset="55%" stop-color="#52ab46" />
          <stop offset="88%" stop-color="#2e7a2c" />
          <stop offset="100%" stop-color="#1b4f1b" />
        </radialGradient>

        <radialGradient id="cat-head-grad" cx="45%" cy="38%" r="60%">
          <stop offset="0%" stop-color="#98e376" />
          <stop offset="58%" stop-color="#5ab54c" />
          <stop offset="90%" stop-color="#348232" />
          <stop offset="100%" stop-color="#1e571e" />
        </radialGradient>

        <radialGradient id="cat-cream-fur" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#fff8d6" />
          <stop offset="65%" stop-color="#f5dc99" />
          <stop offset="100%" stop-color="#d4ac63" />
        </radialGradient>

        <linearGradient id="cat-ear-inner" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffb86b" />
          <stop offset="60%" stop-color="#eb7d3c" />
          <stop offset="100%" stop-color="#b54818" />
        </linearGradient>

        <radialGradient id="cat-eye-iris" cx="45%" cy="45%" r="55%">
          <stop offset="0%" stop-color="#ffe169" />
          <stop offset="45%" stop-color="#d98a2b" />
          <stop offset="85%" stop-color="#7d3e09" />
          <stop offset="100%" stop-color="#3d1b02" />
        </radialGradient>
      </defs>

      <!-- ====================================================================
           1. COZY PREHISTORIC NEST ON THE CANYON FLOOR
           ==================================================================== -->
      <g id="cozy-rug" filter="url(#shadow-deep)">
        <!-- Outer Fern Leaves & Twigs -->
        <ellipse cx="800" cy="735" rx="652" ry="145" fill="none" stroke="#5c8a3c" stroke-width="16" stroke-dasharray="18 14" stroke-linecap="round" />
        <ellipse cx="800" cy="735" rx="642" ry="138" fill="none" stroke="#9e6d36" stroke-width="12" stroke-dasharray="10 12" stroke-linecap="round" />
        <!-- Main Woven Nest Bowl -->
        <ellipse cx="800" cy="732" rx="634" ry="134" fill="url(#rug-base-grad)" stroke="#4f3014" stroke-width="5" />
        <ellipse cx="800" cy="732" rx="585" ry="118" fill="none" stroke="#fae5b8" stroke-width="3.5" stroke-dasharray="14 9" stroke-opacity="0.55" />
        <ellipse cx="800" cy="732" rx="510" ry="102" fill="none" stroke="#527834" stroke-width="4" stroke-dasharray="12 10" stroke-opacity="0.5" />
        <ellipse cx="800" cy="732" rx="420" ry="82" fill="none" stroke="#fff2cf" stroke-width="3.5" stroke-dasharray="16 10" stroke-opacity="0.6" />
        <ellipse cx="800" cy="732" rx="630" ry="131" fill="url(#rug-weave)" />
      </g>

      <!-- ====================================================================
           2. NEST TASK EMBLEM (Shows Direction Arrow & Step Pips +1/+2/+3 or -1/-2/-3)
           ==================================================================== -->
      <g id="task-emblem-group" transform="translate(800, 614)" filter="url(#shadow-soft)">
        <rect x="-118" y="-30" width="236" height="60" rx="30" fill="url(#wood-btn-rim)" stroke="#3b1d09" stroke-width="3" />
        <rect x="-111" y="-23" width="222" height="46" rx="23" fill="url(#felt-badge-grad)" stroke="#8c5830" stroke-width="2" stroke-dasharray="6 4" />
        <g id="task-emblem-content"></g>
      </g>

      <!-- ====================================================================
           3. CONNECTING NEST VINE & DIRECTIONAL DINO FOOTPRINT TRAIL
           ==================================================================== -->
      <g id="yarn-connecting-layer"></g>
      <g id="paw-trail-layer"></g>

      <!-- ====================================================================
           4. ANIMATED MAMA DINOSAUR

    /* ==========================================================================
       HELPER: Bounce any inner visual <g> smoothly via JS without touching
       the outer <g transform="translate(X, Y)"> positioning!
       ========================================================================== */
    function animateInnerScale(el, peakScale = 1.14, duration = 320) {
      if (!el) return;
      const start = performance.now();
      function step(now) {
        const t = Math.min(1, (now - start) / duration);
        const s = 1 + (peakScale - 1) * Math.sin(t * Math.PI);
        el.setAttribute('transform', `scale(${s.toFixed(3)})`);
        if (t < 1) requestAnimationFrame(step);
        else el.setAttribute('transform', 'scale(1)');
      }
      requestAnimationFrame(step);
    }

        this.purrStopTimer = null;
        this.isPurring = false;
        this.numberFreqs = [
          261.63, // 1: C4
          293.66, // 2: D4
          329.63, // 3: E4
          392.00, // 4: G4
          440.00, // 5: A4
          523.25, // 6: C5
          587.33, // 7: D5
          659.25, // 8: E5
          783.99, // 9: G5
          880.00  // 10: A5
        ];
      }

      init() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
              this.setupPurrGenerator();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        } catch (err) {
          // Ignore audio context restrictions if blocked
        }
      }

      setupPurrGenerator() {
        if (!this.ctx) return;
        const ctx = this.ctx;

        this.purrGain = ctx.createGain();
        this.purrGain.gain.value = 0.0001;
        this.purrGain.connect(ctx.destination);

        const subOsc = ctx.createOscillator();
        subOsc.type = 'triangle';
        subOsc.frequency.value = 28.0;

        const breathLfo = ctx.createOscillator();
        breathLfo.type = 'sine';
        breathLfo.frequency.value = 0.45;
        const breathFreqGain = ctx.createGain();
        breathFreqGain.gain.value = 2.0;
        breathLfo.connect(breathFreqGain);
        breathFreqGain.connect(subOsc.frequency);

        const subFilter = ctx.createBiquadFilter();
        subFilter.type = 'lowpass';
        subFilter.frequency.value = 105;

        const subLevel = ctx.createGain();
        subLevel.gain.value = 0.35;

        subOsc.connect(subFilter);
        subFilter.connect(subLevel);
        subLevel.connect(this.purrGain);

        const bufferSize = ctx.sampleRate * 2;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.04;
          b6 = white * 0.115926;
        }

        const noiseNode = ctx.createBufferSource();
        noiseNode.buffer = noiseBuffer;
        noiseNode.loop = true;

        const bandpass = ctx.createBiquadFilter();
        bandpass.type = 'bandpass';
        bandpass.frequency.value = 220;
        bandpass.Q.value = 2.2;

        const rattleModGain = ctx.createGain();
        rattleModGain.gain.value = 0.24;

        const rattleLfo = ctx.createOscillator();
        rattleLfo.type = 'sine';
        rattleLfo.frequency.value = 24.0;
        const rattleDepth = ctx.createGain();
        rattleDepth.gain.value = 0.20;
        rattleLfo.connect(rattleDepth);
        rattleDepth.connect(rattleModGain.gain);

        noiseNode.connect(bandpass);
        bandpass.connect(rattleModGain);
        rattleModGain.connect(this.purrGain);

        subOsc.start();
        breathLfo.start();
        noiseNode.start();
        rattleLfo.start();
      }

      triggerQuietPurr(durationMs = 3400, intensity = 0.085) {
        if (this.muted) return;
        this.init();
        if (!this.ctx || !this.purrGain) return;

        const now = this.ctx.currentTime;
        this.isPurring = true;
        this.purrGain.gain.cancelScheduledValues(now);
        this.purrGain.gain.setValueAtTime(Math.max(0.001, this.purrGain.gain.value), now);
        this.purrGain.gain.linearRampToValueAtTime(intensity, now + 0.4);

        if (this.purrStopTimer) clearTimeout(this.purrStopTimer);
        this.purrStopTimer = setTimeout(() => {
          if (!this.ctx || !this.purrGain) return;
          const t = this.ctx.currentTime;
          this.purrGain.gain.cancelScheduledValues(t);
          this.purrGain.gain.setValueAtTime(this.purrGain.gain.value, t);
          this.purrGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
          this.isPurring = false;
        }, durationMs);
      }

      playPawStep() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(105 + Math.random() * 20, now);
        osc.frequency.exponentialRampToValueAtTime(42, now + 0.075);

        gain.gain.setValueAtTime(0.055, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.085);
      }

      playEggCrackAndBabyChirp() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        // 1) Crisp Eggshell Pop/Crack
        const crackOsc = this.ctx.createOscillator();
        const crackGain = this.ctx.createGain();
        crackOsc.type = 'triangle';
        crackOsc.frequency.setValueAtTime(480, now);
        crackOsc.frequency.exponentialRampToValueAtTime(190, now + 0.045);
        crackGain.gain.setValueAtTime(0.11, now);
        crackGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        crackOsc.connect(crackGain);
        crackGain.connect(this.ctx.destination);
        crackOsc.start(now);
        crackOsc.stop(now + 0.055);

        // 2) Cute Baby Dino Squeak
        const chirpOsc = this.ctx.createOscillator();
        const chirpGain = this.ctx.createGain();
        chirpOsc.type = 'sine';
        chirpOsc.frequency.setValueAtTime(580, now + 0.05);
        chirpOsc.frequency.exponentialRampToValueAtTime(920, now + 0.16);
        chirpOsc.frequency.exponentialRampToValueAtTime(760, now + 0.24);
        chirpGain.gain.setValueAtTime(0.001, now + 0.05);
        chirpGain.gain.linearRampToValueAtTime(0.075, now + 0.08);
        chirpGain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        chirpOsc.connect(chirpGain);
        chirpGain.connect(this.ctx.destination);
        chirpOsc.start(now + 0.05);
        chirpOsc.stop(now + 0.26);
      }

      playNumberReveal(numberOneToTen, isHatching = false) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        if (isHatching) {
          this.playEggCrackAndBabyChirp();
        }

        const now = this.ctx.currentTime;
        const idx = Math.max(0, Math.min(9, numberOneToTen - 1));
        const freq = this.numberFreqs[idx];

        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        const gain2 = this.ctx.createGain();

        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(freq, now);

        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(freq * 2, now);

        gain1.gain.setValueAtTime(0.001, now);
        gain1.gain.linearRampToValueAtTime(0.22, now + 0.018);
        gain1.gain.exponentialRampToValueAtTime(0.0008, now + 0.75);

        gain2.gain.setValueAtTime(0.001, now);
        gain2.gain.linearRampToValueAtTime(0.07, now + 0.012);
        gain2.gain.exponentialRampToValueAtTime(0.0005, now + 0.28);

        osc1.connect(gain1);
        osc2.connect(gain2);
        gain1.connect(this.ctx.destination);
        gain2.connect(this.ctx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.78);
        osc2.stop(now + 0.30);
      }

      playKittenChirp() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const mod = this.ctx.createOscillator();
        const modGain = this.ctx.createGain();
        const mainGain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(380, now);
        osc.frequency.exponentialRampToValueAtTime(620, now + 0.16);
        osc.frequency.exponentialRampToValueAtTime(490, now + 0.28);

        mod.type = 'sine';
        mod.frequency.value = 26;
        modGain.gain.value = 22;

        mod.connect(modGain);
        modGain.connect(osc.frequency);

        mainGain.gain.setValueAtTime(0.001, now);
        mainGain.gain.linearRampToValueAtTime(0.09, now + 0.04);
        mainGain.gain.exponentialRampToValueAtTime(0.0008, now + 0.29);

        osc.connect(mainGain);
        mainGain.connect(this.ctx.destination);

        osc.start(now);
        mod.start(now);
        osc.stop(now + 0.30);
        mod.stop(now + 0.30);
      }

      playCelebrationFanfare(styleIndex = 0) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const chordPatterns = [
          [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50],
          [329.63, 392.00, 523.25, 587.33, 659.25, 783.99, 1046.50],
          [261.63, 392.00, 440.00, 523.25, 659.25, 880.00, 1046.50],
          [293.66, 392.00, 493.88, 587.33, 783.99, 987.77, 1174.66]
        ];

        const notes = chordPatterns[styleIndex % chordPatterns.length];
        notes.forEach((freq, idx) => {
          const delay = idx * 0.085;
          const now = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const oscHarm = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = styleIndex % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, now);

          oscHarm.type = 'sine';
          oscHarm.frequency.setValueAtTime(freq * 1.5, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.14, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.9);

          const harmGain = this.ctx.createGain();
          harmGain.gain.setValueAtTime(0.03, now);
          harmGain.gain.exponentialRampToValueAtTime(0.0005, now + 0.45);

          osc.connect(gain);
          oscHarm.connect(harmGain);
          gain.connect(this.ctx.destination);
          harmGain.connect(this.ctx.destination);

          osc.start(now);
          oscHarm.start(now);
          osc.stop(now + 0.95);
          oscHarm.stop(now + 0.5);
        });
      }

      playWoodClick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.055);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.065);
      }
    }

    const sound = new SoundEngine();

    /* ==========================================================================
       3. CANVAS PARTICLE & EGGSHELL BURST ENGINE
       Maps stage-svg (1600x900 meet) coordinates accurately to screen pixels
       ========================================================================== */
    class ParticleSystem {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.dustMotes = [];
        this.particles = [];
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.initDustMotes();
      }

      resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
      }

      // Convert stage-svg (1600x900 meet) coordinates to screen canvas coordinates
      svgToScreen(svgX, svgY) {
        const scale = Math.min(this.width / 1600, this.height / 900);
        const offsetX = (this.width - 1600 * scale) / 2;
        const offsetY = (this.height - 900 * scale) / 2;
        return {
          x: offsetX + svgX * scale,
          y: offsetY + svgY * scale,
          scale
        };
      }

      initDustMotes() {
        this.dustMotes = [];
        for (let i = 0; i < 50; i++) {
          this.dustMotes.push({
            x: Math.random() * this.width,
            y: Math.random() * this.height,
            r: 1.2 + Math.random() * 2.4,
            vx: 0.12 + Math.random() * 0.2,
            vy: -0.08 + Math.random() * 0.22,
            phase: Math.random() * Math.PI * 2,
            alpha: 0.2 + Math.random() * 0.55
          });
        }
      }

      spawnYarnRevealBurst(svgX, svgY, colorObj) {
        const pos = this.svgToScreen(svgX, svgY - 12);
        const colors = [colorObj.shell, colorObj.base, colorObj.light, '#ffe58f', '#fffdf2'];

        for (let i = 0; i < 30; i++) {
          const angle = (Math.PI * 2 * i) / 30 + (Math.random() - 0.5) * 0.3;
          const speed = (2.8 + Math.random() * 6.5) * pos.scale;
          this.particles.push({
            type: i % 3 === 0 ? 'star' : (i % 2 === 0 ? 'shell' : 'yarn'),
            x: pos.x,
            y: pos.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2.4 * pos.scale,
            gravity: 0.15 * pos.scale,
            size: (6 + Math.random() * 7) * pos.scale,
            color: colors[i % colors.length],
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.18,
            life: 1,
            decay: 0.015 + Math.random() * 0.012
          });
        }
      }

      spawnPurrHearts(svgX, svgY) {
        const pos = this.svgToScreen(svgX, svgY);
        const colors = ['#ff8fa3', '#ffb3c1', '#ffd6a5', '#ffe599'];
        for (let i = 0; i < 6; i++) {
          this.particles.push({
            type: 'heart',
            x: pos.x + (Math.random() - 0.5) * 55 * pos.scale,
            y: pos.y - 18 * pos.scale,
            vx: (Math.random() - 0.5) * 1.2 * pos.scale,
            vy: (-1.4 - Math.random() * 1.4) * pos.scale,
            gravity: -0.01 * pos.scale,
            size: (10 + Math.random() * 7) * pos.scale,
            color: colors[i % colors.length],
            rot: (Math.random() - 0.5) * 0.4,
            vRot: (Math.random() - 0.5) * 0.02,
            life: 1,
            decay: 0.012 + Math.random() * 0.008
          });
        }
      }

      spawnRoundCelebration(styleIndex, ballPositions, catPos) {
        const palette = ['#ff758f', '#ffd166', '#06d6a0', '#4ea8de', '#c77dff', '#ff9f1c'];

        if (styleIndex === 0) {
          ballPositions.forEach((b) => {
            const pos = this.svgToScreen(b.x, b.y);
            for (let i = 0; i < 5; i++) {
              this.particles.push({
                type: 'butterfly',
                x: pos.x + (Math.random() - 0.5) * 45 * pos.scale,
                y: pos.y,
                vx: (Math.random() - 0.5) * 3.2 * pos.scale,
                vy: (-2.0 - Math.random() * 2.4) * pos.scale,
                gravity: -0.015 * pos.scale,
                size: (13 + Math.random() * 8) * pos.scale,
                color: palette[(i + b.num) % palette.length],
                wingPhase: Math.random() * Math.PI * 2,
                rot: 0,
                vRot: 0,
                life: 1,
                decay: 0.007 + Math.random() * 0.005
              });
            }
          });
        } else if (styleIndex === 1) {
          const cPos = this.svgToScreen(catPos.x, catPos.y - 60);
          for (let i = 0; i < 36; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = (1.5 + Math.random() * 4.8) * cPos.scale;
            this.particles.push({
              type: i % 2 === 0 ? 'heart' : 'star',
              x: cPos.x + (Math.random() - 0.5) * 160 * cPos.scale,
              y: cPos.y + (Math.random() - 0.5) * 50 * cPos.scale,
              vx: Math.cos(angle) * speed * 0.7,
              vy: -Math.abs(Math.sin(angle) * speed) - 1.2 * cPos.scale,
              gravity: -0.01 * cPos.scale,
              size: (10 + Math.random() * 9) * cPos.scale,
              color: palette[i % palette.length],
              rot: (Math.random() - 0.5) * 0.5,
              vRot: (Math.random() - 0.5) * 0.03,
              life: 1,
              decay: 0.009 + Math.random() * 0.006
            });
          }
        } else if (styleIndex === 2) {
          ballPositions.forEach((b) => {
            const pos = this.svgToScreen(b.x, b.y - 25);
            for (let i = 0; i < 20; i++) {
              const angle = (Math.PI * 2 * i) / 20;
              const speed = (2.8 + Math.random() * 6.0) * pos.scale;
              this.particles.push({
                type: 'ribbon',
                x: pos.x,
                y: pos.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 3.2 * pos.scale,
                gravity: 0.12 * pos.scale,
                size: (11 + Math.random() * 9) * pos.scale,
                color: palette[(i + b.num) % palette.length],
                rot: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 0.14,
                life: 1,
                decay: 0.01 + Math.random() * 0.007
              });
            }
          });
        } else {
          ballPositions.forEach((b) => {
            const pos = this.svgToScreen(b.x, b.y);
            for (let i = 0; i < 18; i++) {
              const angle = (Math.PI * 2 * i) / 18;
              const speed = (2 + Math.random() * 4.2) * pos.scale;
              this.particles.push({
                type: 'star',
                x: pos.x,
                y: pos.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 1.5 * pos.scale,
                gravity: 0.04 * pos.scale,
                size: (9 + Math.random() * 8) * pos.scale,
                color: i % 2 === 0 ? '#ffe885' : '#9bf6ff',
                rot: Math.random() * Math.PI,
                vRot: 0.08,
                life: 1,
                decay: 0.01 + Math.random() * 0.006
              });
            }
          });
        }
      }

      updateAndDraw(time) {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.width, this.height);

        for (let m of this.dustMotes) {
          m.x += m.vx + Math.sin(time * 0.001 + m.phase) * 0.18;
          m.y += m.vy + Math.cos(time * 0.0012 + m.phase) * 0.12;
          if (m.x > this.width + 10) m.x = -10;
          if (m.y > this.height + 10) m.y = -10;
          if (m.y < -10) m.y = this.height + 10;

          const twinkle = 0.5 + 0.5 * Math.sin(time * 0.003 + m.phase);
          ctx.save();
          ctx.globalAlpha = m.alpha * twinkle;
          ctx.fillStyle = '#fff2b2';
          ctx.shadowColor = '#ffd966';
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.rot += p.vRot;
          p.life -= p.decay;

          if (p.life <= 0) {
            this.particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);

          if (p.type === 'star') {
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 8;
            this.drawFourPointStar(ctx, 0, 0, p.size, p.size * 0.38);
          } else if (p.type === 'heart') {
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 6;
            this.drawHeart(ctx, 0, 0, p.size);
          } else if (p.type === 'shell') {
            ctx.fillStyle = p.color;
            ctx.strokeStyle = '#8c6d46';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(-p.size * 0.6, -p.size * 0.4);
            ctx.lineTo(p.size * 0.7, -p.size * 0.1);
            ctx.lineTo(0, p.size * 0.7);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else if (p.type === 'yarn' || p.type === 'ribbon') {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = p.type === 'ribbon' ? 4 : 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-p.size, 0);
            ctx.quadraticCurveTo(-p.size * 0.3, -p.size * 0.7, 0, 0);
            ctx.quadraticCurveTo(p.size * 0.3, p.size * 0.7, p.size, 0);
            ctx.stroke();
          } else if (p.type === 'butterfly') {
            p.wingPhase += 0.24;
            p.x += Math.sin(p.wingPhase * 0.3) * 1.2;
            const wingW = Math.abs(Math.cos(p.wingPhase)) * p.size;
            ctx.fillStyle = p.color;
            ctx.shadowColor = '#fff3b0';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.ellipse(-wingW * 0.5, -2, wingW * 0.65, p.size * 0.5, -0.3, 0, Math.PI * 2);
            ctx.ellipse(wingW * 0.5, -2, wingW * 0.65, p.size * 0.5, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#4a2508';
            ctx.fillRect(-1.5, -p.size * 0.35, 3, p.size * 0.7);
          }

          ctx.restore();
        }
      }

      drawFourPointStar(ctx, x, y, outerR, innerR) {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const r = i % 2 === 0 ? outerR : innerR;
          const a = (i * Math.PI) / 4;
          if (i === 0) ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
          else ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();
      }

      drawHeart(ctx, x, y, size) {
        const s = size * 0.55;
        ctx.beginPath();
        ctx.moveTo(x, y + s * 0.6);
        ctx.bezierCurveTo(x - s * 1.3, y - s * 0.2, x - s * 0.7, y - s * 1.2, x, y - s * 0.4);
        ctx.bezierCurveTo(x + s * 0.7, y - s * 1.2, x + s * 1.3, y - s * 0.2, x, y + s * 0.6);
        ctx.closePath();
        ctx.fill();
      }
    }

    /* ==========================================================================
       5. MAMA DINOSAUR ANIMATION & EMOTION CONTROLLER
       Handles smooth walking between eggs, 5+ emotional states, blinking, cooing
       ========================================================================== */
    class KittenController {
      constructor() {
        this.root = document.getElementById('kitten-root');
        this.flipGroup = document.getElementById('kitten-flip-group');
        this.bodyRig = document.getElementById('kitten-body-rig');
        this.head = document.getElementById('cat-head');
        this.tailGroup = document.getElementById('cat-tail-group');
        this.earL = document.getElementById('ear-l');
        this.earR = document.getElementById('ear-r');
        this.legFL = document.getElementById('leg-fl');
        this.legFR = document.getElementById('leg-fr');
        this.legBL = document.getElementById('leg-bl');
        this.legBR = document.getElementById('leg-br');
        this.eyesOpen = document.getElementById('cat-eyes-open');
        this.eyesHappy = document.getElementById('cat-eyes-happy');
        this.eyelidL = document.getElementById('eyelid-l');
        this.eyelidR = document.getElementById('eyelid-r');
        this.pupilL = document.getElementById('pupil-l');
        this.pupilR = document.getElementById('pupil-r');
        this.blush = document.getElementById('cat-blush');
        this.mouthOpen = document.getElementById('cat-mouth-open');
        this.purrRipples = document.getElementById('purr-ripples');

        this.x = 800;
        this.y = 645;
        this.facing = 1;
        this.emotion = 'calm';
        this.emotionTimer = null;
        this.walkState = null;
        this.lastStepTime = 0;

        this.nextBlinkTime = performance.now() + 2400;
        this.isBlinking = false;
      }

      setPositionImmediate(x, y, facing = 1) {
        this.walkState = null;
        this.x = x;
        this.y = y;
        this.facing = facing;
        this.root.setAttribute('transform', `translate(${this.x}, ${this.y})`);
        this.flipGroup.setAttribute('transform', `scale(${this.facing}, 1)`);
        this.setEmotion('calm');
      }

      setEmotion(emotionName, durationMs = 0) {
        this.emotion = emotionName;
        if (this.emotionTimer) {
          clearTimeout(this.emotionTimer);
          this.emotionTimer = null;
        }

        this.eyesOpen.setAttribute('opacity', '1');
        this.eyesHappy.setAttribute('opacity', '0');
        this.blush.style.opacity = '0';
        this.mouthOpen.setAttribute('opacity', '0');
        this.pupilL.setAttribute('rx', '5.5');
        this.pupilR.setAttribute('rx', '5.5');

        if (emotionName === 'curious') {
          this.pupilL.setAttribute('rx', '7.8');
          this.pupilR.setAttribute('rx', '7.8');
          this.mouthOpen.setAttribute('opacity', '0.7');
        } else if (emotionName === 'purring') {
          this.eyesOpen.setAttribute('opacity', '0');
          this.eyesHappy.setAttribute('opacity', '1');
          this.blush.style.opacity = '1';
        } else if (emotionName === 'excited') {
          this.pupilL.setAttribute('rx', '8.2');
          this.pupilR.setAttribute('rx', '8.2');
          this.blush.style.opacity = '0.85';
          this.mouthOpen.setAttribute('opacity', '1');
        } else if (emotionName === 'celebrating') {
          this.eyesOpen.setAttribute('opacity', '0');
          this.eyesHappy.setAttribute('opacity', '1');
          this.blush.style.opacity = '1';
          this.mouthOpen.setAttribute('opacity', '1');
        }

        if (durationMs > 0) {
          this.emotionTimer = setTimeout(() => {
            if (this.emotion !== 'walking') {
              this.setEmotion('calm');
            }
          }, durationMs);
        }
      }

      walkTo(targetX, targetY, onArrive) {
        const dx = targetX - this.x;
        const dy = targetY - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 6) {
          this.x = targetX;
          this.y = targetY;
          this.root.setAttribute('transform', `translate(${this.x}, ${this.y})`);
          if (onArrive) onArrive();
          return;
        }

        this.facing = dx >= 0 ? 1 : -1;
        this.flipGroup.setAttribute('transform', `scale(${this.facing}, 1)`);
        this.setEmotion('walking');

        const duration = Math.min(900, Math.max(340, dist * 1.35));
        this.walkState = {
          startX: this.x,
          startY: this.y,
          targetX,
          targetY,
          startTime: performance.now(),
          duration,
          onArrive
        };
      }

      update(now) {
        if (this.walkState) {
          const elapsed = now - this.walkState.startTime;
          const t = Math.min(1, elapsed / this.walkState.duration);
          const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

          this.x = this.walkState.startX + (this.walkState.targetX - this.walkState.startX) * ease;
          this.y = this.walkState.startY + (this.walkState.targetY - this.walkState.startY) * ease;

          const stepPhase = elapsed * 0.026;
          const bounceY = -Math.abs(Math.sin(stepPhase)) * 10;
          const bodyTilt = Math.sin(stepPhase) * 3.2;

          this.root.setAttribute('transform', `translate(${this.x}, ${this.y})`);
          this.bodyRig.setAttribute('transform', `translate(0, ${bounceY}) rotate(${bodyTilt})`);

          const flSwing = Math.sin(stepPhase) * 22;
          const frSwing = -Math.sin(stepPhase) * 22;
          this.legFL.setAttribute('transform', `translate(-10, 12) rotate(${flSwing})`);
          this.legFR.setAttribute('transform', `translate(20, 12) rotate(${frSwing})`);
          this.legBL.setAttribute('transform', `translate(-30, 14) rotate(${frSwing * 0.6})`);
          this.legBR.setAttribute('transform', `translate(26, 16) rotate(${flSwing * 0.6})`);

          if (now - this.lastStepTime > 170) {
            sound.playPawStep();
            this.lastStepTime = now;
          }

          if (t >= 1) {
            const cb = this.walkState.onArrive;
            this.walkState = null;
            this.legFL.setAttribute('transform', 'translate(-10, 12)');
            this.legFR.setAttribute('transform', 'translate(20, 12)');
            this.legBL.setAttribute('transform', 'translate(-30, 14)');
            this.legBR.setAttribute('transform', 'translate(26, 16)');
            this.bodyRig.setAttribute('transform', 'translate(0, 0)');
            if (cb) cb();
          }
          return;
        }

        const breath = Math.sin(now * 0.0032);
        const tailAngle = Math.sin(now * 0.0028) * 12 + (this.emotion === 'celebrating' ? Math.sin(now * 0.015) * 16 : 0);
        this.tailGroup.setAttribute('transform', `translate(-42, 8) rotate(${tailAngle})`);

        if (sound.isPurring || this.emotion === 'purring') {
          const vibX = Math.sin(now * 0.16) * 0.8;
          const vibY = Math.cos(now * 0.18) * 0.6;
          this.bodyRig.setAttribute('transform', `translate(${vibX}, ${breath * 1.8 + vibY}) scale(1, ${1 + breath * 0.012})`);
          const ripplePulse = 0.4 + 0.35 * Math.sin(now * 0.008);
          this.purrRipples.setAttribute('opacity', ripplePulse.toFixed(2));
        } else if (this.emotion === 'celebrating') {
          const hopY = -Math.abs(Math.sin(now * 0.009)) * 20;
          const stretch = 1 + Math.sin(now * 0.009) * 0.06;
          this.bodyRig.setAttribute('transform', `translate(0, ${hopY}) scale(${1 / stretch}, ${stretch})`);
          const pawWave = Math.sin(now * 0.018) * 24;
          this.legFL.setAttribute('transform', `translate(-10, 6) rotate(${pawWave})`);
          this.legFR.setAttribute('transform', `translate(20, 6) rotate(${-pawWave})`);
          this.purrRipples.setAttribute('opacity', '0');
        } else {
          this.bodyRig.setAttribute('transform', `translate(0, ${breath * 1.8}) scale(1, ${1 + breath * 0.01})`);
          this.legFL.setAttribute('transform', 'translate(-10, 12)');
          this.legFR.setAttribute('transform', 'translate(20, 12)');
          this.purrRipples.setAttribute('opacity', '0');
        }

        let headTilt = Math.sin(now * 0.0018) * 2.5;
        if (this.emotion === 'curious') headTilt = 10 + Math.sin(now * 0.004) * 3;
        else if (this.emotion === 'purring') headTilt = -6 + Math.sin(now * 0.003) * 2;
        else if (this.emotion === 'excited') headTilt = -4 + Math.cos(now * 0.006) * 4;
        this.head.setAttribute('transform', `translate(12, -68) rotate(${headTilt})`);

        const earTwitchL = Math.sin(now * 0.0025) * 4 + (this.emotion === 'curious' ? -8 : 0);
        const earTwitchR = -Math.cos(now * 0.0029) * 4 + (this.emotion === 'curious' ? 8 : 0);
        this.earL.setAttribute('transform', `translate(-26, -32) rotate(${earTwitchL})`);
        this.earR.setAttribute('transform', `translate(18, -34) rotate(${earTwitchR})`);

        if (!this.isBlinking && now > this.nextBlinkTime) {
          this.isBlinking = true;
          this.blinkStart = now;
          this.nextBlinkTime = now + 2600 + Math.random() * 2800;
        }

        if (this.isBlinking) {
          const bt = (now - this.blinkStart) / 180;
          if (bt >= 1) {
            this.isBlinking = false;
            this.eyelidL.setAttribute('transform', 'scale(1, 0)');
            this.eyelidR.setAttribute('transform', 'scale(1, 0)');
          } else {
            const closeAmt = Math.sin(bt * Math.PI);
            this.eyelidL.setAttribute('transform', `scale(1, ${closeAmt})`);
            this.eyelidR.setAttribute('transform', `scale(1, ${closeAmt})`);
          }
        }
      }
    }
