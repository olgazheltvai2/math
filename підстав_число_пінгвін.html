<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>&#8203;</title>
  <style>
    /* ==========================================================================
       БАЗОВІ СТИЛІ СЦЕНИ (БЕЗ БІЛИХ ПРЯМОКУТНИКІВ ТА БЕЗ СЛІВ)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #031126;
    }

    #arctic-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    /* Живий сюжетний SVG-фон Арктики */
    #background-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Анімація північного сяйва */
    .aurora-band {
      mix-blend-mode: screen;
      animation: auroraWave 10s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .aurora-band-2 {
      mix-blend-mode: screen;
      animation: auroraWave2 14s ease-in-out infinite alternate;
      transform-origin: center;
    }

    @keyframes auroraWave {
      0% { transform: translateY(0px) scaleY(1) skewX(-4deg); opacity: 0.55; }
      50% { transform: translateY(-16px) scaleY(1.2) skewX(5deg); opacity: 0.88; }
      100% { transform: translateY(8px) scaleY(0.92) skewX(-2deg); opacity: 0.6; }
    }

    @keyframes auroraWave2 {
      0% { transform: translateY(6px) scaleY(0.95) skewX(4deg); opacity: 0.45; }
      50% { transform: translateY(-20px) scaleY(1.25) skewX(-6deg); opacity: 0.82; }
      100% { transform: translateY(0px) scaleY(1.05) skewX(3deg); opacity: 0.5; }
    }

    /* Дрейф крижин та хвиль */
    .ocean-wave {
      animation: waveDrift 6s ease-in-out infinite alternate;
    }
    .ocean-wave-slow {
      animation: waveDrift 9.5s ease-in-out infinite alternate-reverse;
    }
    @keyframes waveDrift {
      0% { transform: translateX(-18px) translateY(0px); }
      100% { transform: translateX(18px) translateY(4px); }
    }

    /* ==========================================================================
       ВЕРХНЯ НАВІГАЦІЯ (КНОПКИ "НАЗАД", "ДАЛІ" ТА КРИЖАНІ ПЕРЛИНИ РІВНІВ)
       ========================================================================== */
    #top-nav {
      position: relative;
      z-index: 10;
      width: 97%;
      max-width: 1380px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.8vh;
    }

    .ice-nav-btn {
      width: clamp(50px, 5.2vw, 68px);
      height: clamp(50px, 5.2vw, 68px);
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s;
      filter: drop-shadow(0 6px 12px rgba(0, 18, 45, 0.7));
    }

    .ice-nav-btn:hover {
      transform: scale(1.14) translateY(-2px);
      filter: drop-shadow(0 8px 18px rgba(80, 225, 255, 0.85));
    }

    .ice-nav-btn:active {
      transform: scale(0.92);
    }

    /* Індикатор рівнів без цифр і тексту */
    #level-pearls {
      display: flex;
      gap: clamp(4px, 0.55vw, 8px);
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      padding: 7px 16px;
      border-radius: 40px;
      background: linear-gradient(180deg, rgba(16, 68, 122, 0.6), rgba(8, 34, 72, 0.8));
      border: 1.5px solid rgba(145, 230, 255, 0.45);
      box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.25), 0 6px 16px rgba(0, 15, 40, 0.5);
      backdrop-filter: blur(6px);
    }

    .ice-pearl {
      width: clamp(10px, 1vw, 14px);
      height: clamp(10px, 1vw, 14px);
      border-radius: 50%;
      cursor: pointer;
      background: radial-gradient(circle at 30% 30%, #b3ecff, #2b6ca3 70%, #0d315c);
      border: 1px solid rgba(190, 242, 255, 0.6);
      transition: all 0.25s ease;
      opacity: 0.55;
    }

    .ice-pearl.active {
      transform: scale(1.45);
      opacity: 1;
      background: radial-gradient(circle at 30% 30%, #ffffff, #5df0ff 55%, #0088cc);
      box-shadow: 0 0 12px #5df0ff, 0 0 20px rgba(93, 240, 255, 0.75);
    }

    .ice-pearl.solved {
      opacity: 0.95;
      background: radial-gradient(circle at 30% 30%, #fffac2, #4ef2b8 60%, #0a7e68);
      box-shadow: 0 0 8px rgba(78, 242, 184, 0.8);
    }

    /* ==========================================================================
       ЦЕНТРАЛЬНА ЗОНА: ЗБІЛЬШЕНА КРИЖАНА БРИЛА З РЕБУСОМ + ЖИВИЙ ПІНГВІН
       ========================================================================== */
    #main-play-area {
      position: relative;
      z-index: 10;
      width: 98%;
      max-width: 1440px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 2vw, 32px);
      padding: 0.4vh 1vw;
      min-height: 0;
    }

    /* Велика різьблена крижана брила для прикладів */
    #ice-tablet-wrapper {
      position: relative;
      flex: 1;
      max-width: 1040px;
      height: min(73vh, 650px);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 18px 34px rgba(2, 14, 38, 0.85));
    }

    #tablet-backdrop-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Контейнер рядків ребуса */
    #equations-container {
      position: relative;
      z-index: 2;
      width: 93%;
      height: 88%;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      padding: 1vh 1.5vw;
    }

    /* Окрема крижана поличка для кожного рядка (збільшена) */
    .equation-row {
      width: 100%;
      height: 22.5%;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 2.2vw, 30px);
      padding: 6px 22px;
      border-radius: 30px;
      background:
        linear-gradient(135deg, rgba(210, 246, 255, 0.3) 0%, rgba(74, 168, 230, 0.25) 50%, rgba(18, 75, 138, 0.48) 100%),
        repeating-linear-gradient(60deg, rgba(255, 255, 255, 0.07) 0px, rgba(255, 255, 255, 0.07) 12px, transparent 12px, transparent 24px);
      border: 2.5px solid rgba(195, 244, 255, 0.65);
      box-shadow:
        inset 0 3px 10px rgba(255, 255, 255, 0.45),
        inset 0 -4px 12px rgba(7, 42, 88, 0.5),
        0 8px 18px rgba(4, 24, 56, 0.45);
      animation: rowAppear 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
    }

    /* Підгрупи для першого рядка з двома відомими предметами */
    .equation-subpair {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 1.8vw, 22px);
      padding: 4px 18px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(14, 62, 118, 0.32));
      border: 2px solid rgba(200, 244, 255, 0.4);
    }

    .pair-divider {
      width: 4px;
      height: 72%;
      border-radius: 4px;
      background: linear-gradient(180deg, transparent, rgba(190, 242, 255, 0.8), transparent);
      margin: 0 clamp(6px, 1.2vw, 18px);
    }

    @keyframes rowAppear {
      from { opacity: 0; transform: translateY(14px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ==========================================================================
       КРУПНІ КАРТИНКИ ПРЕДМЕТІВ ІЗ ІНДИВІДУАЛЬНОЮ ЗАМІНОЮ НА ЧИСЛО
       ========================================================================== */
    .item-token {
      position: relative;
      width: clamp(68px, 10.6vh, 112px);
      height: clamp(68px, 10.6vh, 112px);
      border-radius: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.24s, box-shadow 0.24s;
      filter: drop-shadow(0 6px 10px rgba(0, 18, 42, 0.6));
      flex-shrink: 0;
    }

    .item-token:hover {
      transform: scale(1.12) translateY(-3px);
      filter: drop-shadow(0 0 14px rgba(155, 244, 255, 0.95));
    }

    /* SVG-ілюстрація всередині токена */
    .item-token .token-full-svg {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: transform 0.25s ease, opacity 0.2s ease;
    }

    .item-token .token-full-svg svg {
      width: 100%;
      height: 100%;
    }

    /* Стан, коли дитина клікнула на конкретну картинку, щоб замінити її цифрою */
    .item-token.selected-target {
      background: radial-gradient(circle at 50% 50%, rgba(255, 243, 168, 0.45), rgba(66, 230, 255, 0.35) 65%, rgba(16, 86, 158, 0.55));
      border: 3.5px solid #ffea79;
      box-shadow:
        0 0 22px rgba(255, 234, 121, 0.95),
        0 0 36px rgba(93, 240, 255, 0.8),
        inset 0 0 14px rgba(255, 255, 255, 0.85);
      animation: selectedTokenPulse 0.85s ease-in-out infinite alternate;
    }

    @keyframes selectedTokenPulse {
      0% { transform: scale(1.06) rotate(-2deg); }
      100% { transform: scale(1.16) rotate(2deg); }
    }

    /* Стан, коли конкретну картинку замінили на число */
    .item-token.has-number {
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.6), rgba(76, 219, 255, 0.45) 55%, rgba(13, 71, 145, 0.85)),
        linear-gradient(135deg, #48cae4 0%, #023e8a 100%);
      border: 3px solid #caf0f8;
      box-shadow:
        0 6px 14px rgba(0, 20, 48, 0.6),
        inset 0 2px 10px rgba(255, 255, 255, 0.75);
    }

    /* Коли замінена цифрою картинка знову обрана для зміни */
    .item-token.has-number.selected-target {
      border-color: #ffea79;
      box-shadow:
        0 0 24px rgba(255, 234, 121, 0.95),
        inset 0 2px 12px rgba(255, 255, 255, 0.9);
    }

    /* Велика цифра на місці заміненої картинки */
    .token-number-badge {
      font-weight: 900;
      font-size: clamp(38px, 6.6vh, 68px);
      line-height: 1;
      color: #ffffff;
      text-shadow:
        0 3px 0 #1665a3,
        0 5px 10px rgba(0, 15, 38, 0.85),
        0 0 14px rgba(170, 245, 255, 0.8);
      pointer-events: none;
      animation: numberPopIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Маленька міні-іконка у куточку заміненої картинки, щоб пам'ятати, який це був предмет */
    .token-mini-corner {
      position: absolute;
      top: -7px;
      right: -7px;
      width: clamp(24px, 3.4vh, 36px);
      height: clamp(24px, 3.4vh, 36px);
      border-radius: 50%;
      padding: 3px;
      background: radial-gradient(circle at 30% 30%, #e0fbff, #1b6ca8);
      border: 2px solid #ffffff;
      box-shadow: 0 3px 8px rgba(0, 15, 38, 0.7);
      pointer-events: none;
    }

    .token-mini-corner svg {
      width: 100%;
      height: 100%;
    }

    @keyframes numberPopIn {
      0% { transform: scale(0.3) rotate(-12deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    /* ==========================================================================
       КРУПНІ МАТЕМАТИЧНІ ЗНАКИ, ЧИСЛА ТА ВІКОНЦЕ ВІДПОВІДІ
       ========================================================================== */
    .math-symbol, .math-number {
      font-weight: 900;
      font-size: clamp(40px, 6.8vh, 72px);
      line-height: 1;
      color: #f4fdff;
      text-shadow:
        0 3px 0 #48b2e8,
        0 5px 0 #19649e,
        0 8px 14px rgba(0, 15, 38, 0.8),
        0 0 16px rgba(130, 232, 255, 0.6);
      letter-spacing: 1px;
    }

    .math-symbol {
      color: #9ef3ff;
    }

    /* Сяючий крижаний кристал для фінальної відповіді */
    #answer-slot {
      width: clamp(80px, 11.4vh, 122px);
      height: clamp(68px, 10.2vh, 108px);
      border-radius: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: clamp(42px, 6.8vh, 72px);
      color: #ffffff;
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.55), rgba(88, 224, 255, 0.35) 55%, rgba(10, 74, 145, 0.75)),
        linear-gradient(135deg, #3ad9ff 0%, #0c58a3 100%);
      border: 3.5px solid #bdf5ff;
      box-shadow:
        0 0 18px rgba(90, 232, 255, 0.75),
        inset 0 2px 10px rgba(255, 255, 255, 0.75);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Коли активне саме віконце фінальної відповіді */
    #answer-slot.selected-target {
      border-color: #ffea79;
      box-shadow:
        0 0 26px rgba(255, 234, 121, 0.95),
        0 0 38px rgba(90, 232, 255, 0.9),
        inset 0 2px 14px rgba(255, 255, 255, 0.95);
      animation: slotPulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes slotPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.07); }
    }

    #answer-slot.correct-slot {
      background: radial-gradient(circle at 30% 25%, #ffffff, #38f7b2 55%, #07825a);
      border-color: #d9fff0;
      box-shadow: 0 0 36px #38f7b2, inset 0 0 16px #ffffff;
      transform: scale(1.16);
    }

    #answer-slot.wrong-slot {
      background: radial-gradient(circle at 30% 25%, #ffd9e0, #ff5c77 55%, #991431);
      border-color: #ffc2cc;
      box-shadow: 0 0 30px #ff5c77;
      animation: shakeError 0.48s ease;
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-14px) rotate(-4deg); }
      40% { transform: translateX(14px) rotate(4deg); }
      60% { transform: translateX(-10px) rotate(-3deg); }
      80% { transform: translateX(10px) rotate(3deg); }
    }

    /* ==========================================================================
       ЖИВИЙ ПЕРСОНАЖ — ІМПЕРАТОРСЬКИЙ ПІНГВІН З БАГАТЬМА ЕМОЦІЯМИ
       ========================================================================== */
    #penguin-stage {
      position: relative;
      width: clamp(175px, 20vw, 275px);
      height: min(56vh, 420px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #penguin-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      cursor: pointer;
      filter: drop-shadow(0 14px 22px rgba(0, 12, 32, 0.78));
    }

    .penguin-body-group {
      transform-origin: 150px 290px;
      animation: penguinIdle 3.2s ease-in-out infinite alternate;
      transition: transform 0.3s ease;
    }

    @keyframes penguinIdle {
      0% { transform: translateY(0px) rotate(-1.2deg); }
      100% { transform: translateY(-7px) rotate(1.5deg); }
    }

    .wing-left {
      transform-origin: 96px 195px;
      animation: wingWaveLeft 3.2s ease-in-out infinite alternate;
    }
    .wing-right {
      transform-origin: 204px 195px;
      animation: wingWaveRight 3.2s ease-in-out infinite alternate;
    }

    @keyframes wingWaveLeft {
      0% { transform: rotate(4deg); }
      100% { transform: rotate(-10deg); }
    }
    @keyframes wingWaveRight {
      0% { transform: rotate(-4deg); }
      100% { transform: rotate(10deg); }
    }

    /* Радісна реакція 1: Високі стрибки радості */
    #penguin-stage.happy-jump .penguin-body-group {
      animation: penguinJumpJoy 0.48s cubic-bezier(0.34, 1.56, 0.64, 1) infinite alternate;
    }
    /* Радісна реакція 2: Веселий танець з погойдуванням */
    #penguin-stage.happy-dance .penguin-body-group {
      animation: penguinDanceSway 0.36s ease-in-out infinite alternate;
    }
    /* Радісна реакція 3: Святковий оберт-сальто на крижині */
    #penguin-stage.happy-spin .penguin-body-group {
      animation: penguinSpinJoy 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }

    #penguin-stage.happy-jump .wing-left,
    #penguin-stage.happy-dance .wing-left,
    #penguin-stage.happy-spin .wing-left {
      animation: wingFlapFastLeft 0.2s ease-in-out infinite alternate;
    }
    #penguin-stage.happy-jump .wing-right,
    #penguin-stage.happy-dance .wing-right,
    #penguin-stage.happy-spin .wing-right {
      animation: wingFlapFastRight 0.2s ease-in-out infinite alternate;
    }

    @keyframes penguinJumpJoy {
      0% { transform: translateY(4px) scaleY(0.92) scaleX(1.06) rotate(-5deg); }
      100% { transform: translateY(-42px) scaleY(1.08) scaleX(0.95) rotate(5deg); }
    }
    @keyframes penguinDanceSway {
      0% { transform: translateX(-14px) translateY(-10px) rotate(-12deg) scale(1.05); }
      100% { transform: translateX(14px) translateY(-18px) rotate(12deg) scale(1.05); }
    }
    @keyframes penguinSpinJoy {
      0% { transform: translateY(0) scaleX(1); }
      25% { transform: translateY(-30px) scaleX(0.2); }
      50% { transform: translateY(-45px) scaleX(-1); }
      75% { transform: translateY(-25px) scaleX(0.2); }
      100% { transform: translateY(0) scaleX(1); }
    }

    @keyframes wingFlapFastLeft {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(56deg); }
    }
    @keyframes wingFlapFastRight {
      0% { transform: rotate(5deg); }
      100% { transform: rotate(-56deg); }
    }

    /* Реакція на підстановку цифри: схвальний кивок крильцями */
    #penguin-stage.nod .penguin-body-group {
      animation: penguinNod 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes penguinNod {
      0% { transform: scale(1); }
      50% { transform: translateY(-16px) scale(1.06); }
      100% { transform: scale(1); }
    }

    /* Помилка: кумедне тремтіння */
    #penguin-stage.oops .penguin-body-group {
      animation: penguinShiver 0.13s ease-in-out 5;
    }
    #penguin-stage.oops .wing-left {
      transform: rotate(-62deg) translateY(-10px);
    }
    #penguin-stage.oops .wing-right {
      transform: rotate(62deg) translateY(-10px);
    }

    @keyframes penguinShiver {
      0%, 100% { transform: translateX(0) rotate(0); }
      25% { transform: translateX(-9px) rotate(-5deg); }
      75% { transform: translateX(9px) rotate(5deg); }
    }

    /* ==========================================================================
       НИЖНЯ ПАНЕЛЬ — КРУПНІ КРИЖАНІ КРИСТАЛИ З ЧИСЛАМИ (0..12)
       ========================================================================== */
    #ice-keypad {
      position: relative;
      z-index: 10;
      width: 98%;
      max-width: 1280px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: clamp(6px, 0.9vw, 14px);
      padding: 0.6vh 1vw 1.8vh;
    }

    .crystal-key {
      position: relative;
      width: clamp(58px, 6.8vw, 84px);
      height: clamp(64px, 8.6vh, 92px);
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
      filter: drop-shadow(0 8px 12px rgba(2, 16, 40, 0.75));
    }

    .crystal-key:hover {
      transform: translateY(-10px) scale(1.12);
      filter: drop-shadow(0 12px 22px rgba(95, 235, 255, 0.9));
    }

    .crystal-key:active {
      transform: translateY(2px) scale(0.94);
    }

    .crystal-key svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .crystal-key span {
      position: relative;
      z-index: 2;
      font-weight: 900;
      font-size: clamp(26px, 3.8vh, 40px);
      color: #ffffff;
      text-shadow:
        0 2px 0 #1f7ab8,
        0 4px 7px rgba(0, 18, 44, 0.9);
      pointer-events: none;
    }

    /* Шар активних ефектів та снігопаду */
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
    }

    @media (max-width: 860px) {
      #main-play-area {
        flex-direction: column;
        gap: 6px;
      }
      #ice-tablet-wrapper {
        width: 99%;
        height: 54vh;
      }

  /* ==========================================================================
     СИНТЕЗАТОР ЗВУКІВ (WEB AUDIO API — БАГАТОГРАННІ ЗВУКИ БЕЗ СЛІВ)
     ========================================================================== */
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // Кришталевий дзвін при виборі предмета або кнопки
  function playIceChime(freq = 880) {
    initAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.35, now + 0.14);

    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.18);
  }

  // Чарівний двонотний акорд, коли картинка перетворюється на цифру
  function playTokenMorphSound() {
    initAudio();
    const now = audioCtx.currentTime;
    [659.25, 987.77, 1318.51].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      const t = now + i * 0.045;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.25);
    });
  }

  // 4 різні святкові мелодії для перемоги
  function playVictorySound(variant = 0) {
    initAudio();
    const now = audioCtx.currentTime;

    const melodies = [
      [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98],
      [440, 554.37, 659.25, 880, 1108.73, 1318.51],
      [587.33, 739.99, 880, 1174.66, 1479.98, 1760],
      [493.88, 659.25, 783.99, 987.77, 1318.51, 1567.98]
    ];

    const notes = melodies[variant % melodies.length];
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
      const startTime = now + idx * 0.08;
      osc.frequency.setValueAtTime(freq, startTime);

      gain.gain.setValueAtTime(0.22, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.42);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.45);
    });
  }

  // Пружинистий звук помилки
  function playOopsSound() {
    initAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(240, now);
    osc.frequency.linearRampToValueAtTime(130, now + 0.22);
    osc.frequency.linearRampToValueAtTime(175, now + 0.34);

    gain.gain.setValueAtTime(0.16, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.42);
  }

  /* ==========================================================================
     ЛОГІКА ІНДИВІДУАЛЬНОЇ ЗАМІНИ КАРТИНКИ НА ЦИФРУ ТА ПЕРЕВІРКИ ВІДПОВІДІ
     ========================================================================== */
  let currentLevel = 0;
  let solvedLevels = new Set();
  let isTransitioning = false;

  // Поточний обраний елемент: або конкретна картинка (.item-token), або #answer-slot
  let activeTargetEl = null;

  const equationsContainer = document.getElementById('equations-container');
  const levelPearlsContainer = document.getElementById('level-pearls');
  const keypadContainer = document.getElementById('ice-keypad');
  const penguinStage = document.getElementById('penguin-stage');

  // Встановлює активний елемент (конкретну картинку або фінальне віконце)
  function setActiveTarget(el) {
    document.querySelectorAll('.selected-target').forEach(node => {
      node.classList.remove('selected-target');
    });
    activeTargetEl = el;
    if (activeTargetEl) {
      activeTargetEl.classList.add('selected-target');
    }
  }

  // Створює інтерактивну картинку предмета, яку можна замінити цифрою окремо від інших
  function createIconToken(itemName) {
    const token = document.createElement('div');
    token.className = 'item-token';
    token.dataset.item = itemName;

    const fullSvgWrap = document.createElement('div');
    fullSvgWrap.className = 'token-full-svg';
    fullSvgWrap.innerHTML = ARCTIC_SVGS[itemName] || ARCTIC_SVGS.fish;
    token.appendChild(fullSvgWrap);

    token.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isTransitioning) return;

      // Якщо ця картинка ВЖЕ обрана і на ній стоїть цифра — повторний клік повертає картинку
      if (activeTargetEl === token && token.classList.contains('has-number')) {
        revertTokenToPicture(token);
        playIceChime(680);
        return;
      }

      // Якщо ця картинка вже обрана (і без цифри) — знімаємо виділення назад на віконце відповіді
      if (activeTargetEl === token) {
        const answerSlot = document.getElementById('answer-slot');
        setActiveTarget(answerSlot);
        playIceChime(640);
        return;
      }

      // Обираємо САМЕ ЦЮ конкретну картинку для підстановки числа
      playIceChime(960);
      setActiveTarget(token);
    });

    return token;
  }

  // Замінює ТІЛЬКИ обрану картинку на вибране число
  function replaceTokenWithNumber(token, num) {
    const itemName = token.dataset.item;
    token.classList.add('has-number');
    token.innerHTML = `
      <span class="token-number-badge">${num}</span>
      <div class="token-mini-corner">${ARCTIC_SVGS[itemName] || ARCTIC_SVGS.fish}</div>
    `;

    // Звуковий та візуальний ефект перетворення саме на цій картинці
    playTokenMorphSound();
    const rect = token.getBoundingClientRect();
    spawnLocalIceSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2);

    // Пінгвін схвально киває
    penguinStage.classList.remove('nod');
    void penguinStage.offsetWidth;
    penguinStage.classList.add('nod');

    // Після заміни картинки автоматично повертаємо фокус на віконце відповіді,
    // або дитина може клікнути на наступну картинку
    const answerSlot = document.getElementById('answer-slot');
    setActiveTarget(answerSlot);
  }

  // Повертає замінену цифру назад у початкову картинку
  function revertTokenToPicture(token) {
    const itemName = token.dataset.item;
    token.classList.remove('has-number');
    token.innerHTML = `<div class="token-full-svg">${ARCTIC_SVGS[itemName] || ARCTIC_SVGS.fish}</div>`;
    const answerSlot = document.getElementById('answer-slot');
    setActiveTarget(answerSlot);
  }

  // Рендеринг перлин рівнів
  function renderPearls() {
    levelPearlsContainer.innerHTML = '';
    LEVELS.forEach((_, index) => {
      const pearl = document.createElement('div');
      pearl.className = 'ice-pearl';
      if (index === currentLevel) pearl.classList.add('active');
      if (solvedLevels.has(index)) pearl.classList.add('solved');
      pearl.addEventListener('click', () => {
        playIceChime(740);
        goToLevel(index);
      });
      levelPearlsContainer.appendChild(pearl);
    });
  }

  // Створення крижаної клавіатури (0..12)
  function createIceKeypad() {
    keypadContainer.innerHTML = '';
    for (let num = 0; num <= 12; num++) {
      const btn = document.createElement('button');
      btn.className = 'crystal-key';
      btn.innerHTML = `
        <svg viewBox="0 0 100 110">
          <defs>
            <linearGradient id="keyIce${num}" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#e3faff" />
              <stop offset="45%" stop-color="#48cae4" />
              <stop offset="100%" stop-color="#023e8a" />
            </linearGradient>
          </defs>
          <polygon points="50,5 92,28 84,88 50,105 16,88 8,28"
                   fill="url(#keyIce${num})" stroke="#caf0f8" stroke-width="3.5" stroke-linejoin="round" />
          <polygon points="50,10 85,30 50,48 15,30" fill="#ffffff" opacity="0.45" />
          <path d="M22,26 Q50,12 78,26" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
        </svg>
        <span>${num}</span>
      `;
      btn.addEventListener('click', () => handleNumberInput(num));
      keypadContainer.appendChild(btn);
    }
  }

  function createTextSpan(text, className) {
    const span = document.createElement('span');
    span.className = className;
    span.textContent = text;
    return span;
  }

  function createAnswerSlot() {
    const slot = document.createElement('div');
    slot.id = 'answer-slot';
    slot.textContent = '?';
    slot.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isTransitioning) return;
      playIceChime(820);
      setActiveTarget(slot);
    });
    return slot;
  }

  // Відображення поточного рівня
  function renderLevel(index) {
    isTransitioning = false;
    equationsContainer.innerHTML = '';
    penguinStage.classList.remove('happy-jump', 'happy-dance', 'happy-spin', 'oops', 'nod');
    renderPearls();

    const levelData = LEVELS[index];

    levelData.rows.forEach((row, rIdx) => {
      const rowEl = document.createElement('div');
      rowEl.className = 'equation-row';
      rowEl.style.animationDelay = `${rIdx * 0.06}s`;

      if (row.type === 'single') {
        rowEl.appendChild(createIconToken(row.item));
        rowEl.appendChild(createTextSpan('=', 'math-symbol'));
        rowEl.appendChild(createTextSpan(row.val, 'math-number'));
      }
      else if (row.type === 'pair') {
        const pairA = document.createElement('div');
        pairA.className = 'equation-subpair';
        pairA.appendChild(createIconToken(row.a.item));
        pairA.appendChild(createTextSpan('=', 'math-symbol'));
        pairA.appendChild(createTextSpan(row.a.val, 'math-number'));

        const divider = document.createElement('div');
        divider.className = 'pair-divider';

        const pairB = document.createElement('div');
        pairB.className = 'equation-subpair';
        pairB.appendChild(createIconToken(row.b.item));
        pairB.appendChild(createTextSpan('=', 'math-symbol'));
        pairB.appendChild(createTextSpan(row.b.val, 'math-number'));

        rowEl.appendChild(pairA);
        rowEl.appendChild(divider);
        rowEl.appendChild(pairB);
      }
      else if (row.type === 'exprNum') {
        rowEl.appendChild(createIconToken(row.target));
        rowEl.appendChild(createTextSpan('=', 'math-symbol'));
        rowEl.appendChild(createIconToken(row.left));
        rowEl.appendChild(createTextSpan(row.op, 'math-symbol'));
        rowEl.appendChild(createTextSpan(row.num, 'math-number'));
      }
      else if (row.type === 'exprItems') {
        rowEl.appendChild(createIconToken(row.target));
        rowEl.appendChild(createTextSpan('=', 'math-symbol'));
        rowEl.appendChild(createIconToken(row.left));
        rowEl.appendChild(createTextSpan(row.op, 'math-symbol'));
        rowEl.appendChild(createIconToken(row.right));
      }
      else if (row.type === 'askItem') {
        rowEl.appendChild(createIconToken(row.item));
        rowEl.appendChild(createTextSpan('=', 'math-symbol'));
        rowEl.appendChild(createAnswerSlot());
      }
      else if (row.type === 'askExpr') {
        rowEl.appendChild(createIconToken(row.left));
        rowEl.appendChild(createTextSpan(row.op, 'math-symbol'));
        rowEl.appendChild(createIconToken(row.right));
        rowEl.appendChild(createTextSpan('=', 'math-symbol'));
        rowEl.appendChild(createAnswerSlot());
      }

      equationsContainer.appendChild(rowEl);
    });

    // За замовчуванням активне віконце фінальної відповіді
    const slot = document.getElementById('answer-slot');
    setActiveTarget(slot);
  }

  // Обробка кліку на число (або замінює обрану картинку, або перевіряє фінальну відповідь)
  function handleNumberInput(selectedNum) {
    if (isTransitioning) return;

    // 1. Якщо зараз обрана конкретна КАРТИНКА в прикладі — замінюємо ЛИШЕ ЇЇ на це число
    if (activeTargetEl && activeTargetEl.classList.contains('item-token')) {
      replaceTokenWithNumber(activeTargetEl, selectedNum);
      return;
    }

    // 2. Інакше підставляємо число у фінальне віконце відповіді (#answer-slot)
    const slot = document.getElementById('answer-slot');
    if (!slot) return;

    const correctAns = LEVELS[currentLevel].answer;
    slot.textContent = selectedNum;

    if (selectedNum === correctAns) {
      isTransitioning = true;
      solvedLevels.add(currentLevel);
      slot.classList.remove('wrong-slot', 'selected-target');
      slot.classList.add('correct-slot');

      // Різноманітна радісна реакція пінгвіна + салюти
      const happyAnimations = ['happy-jump', 'happy-dance', 'happy-spin'];
      const chosenAnim = happyAnimations[currentLevel % happyAnimations.length];
      penguinStage.classList.remove('oops', 'nod');
      penguinStage.classList.add(chosenAnim);

      playVictorySound(currentLevel % 4);
      spawnCelebrationBurst(currentLevel % 3);
      renderPearls();

      setTimeout(() => {
        goToLevel((currentLevel + 1) % LEVELS.length);
      }, 1750);
    } else {
      slot.classList.remove('wrong-slot');
      void slot.offsetWidth;
      slot.classList.add('wrong-slot');

      penguinStage.classList.remove('happy-jump', 'happy-dance', 'happy-spin', 'nod');
      penguinStage.classList.add('oops');
      playOopsSound();
      spawnSnowPuffOnPenguin();

      setTimeout(() => {
        if (!isTransitioning) {
          slot.classList.remove('wrong-slot');
          slot.textContent = '?';
          penguinStage.classList.remove('oops');
        }
      }, 750);
    }
  }

  // Навігація рівнями
  function goToLevel(index) {
    currentLevel = (index + LEVELS.length) % LEVELS.length;
    renderLevel(currentLevel);
  }

  document.getElementById('prev-btn').addEventListener('click', () => {
    playIceChime(620);
    goToLevel(currentLevel - 1);
  });

  document.getElementById('next-btn').addEventListener('click', () => {
    playIceChime(860);
    goToLevel(currentLevel + 1);
  });

  // Клік на пінгвіна
  document.getElementById('penguin-svg').addEventListener('click', () => {
    playIceChime(1046);
    penguinStage.classList.add('happy-jump');
    spawnCelebrationBurst(0);
    setTimeout(() => {
      if (!isTransitioning) penguinStage.classList.remove('happy-jump');
    }, 900);
  });

  // Стеження очима пінгвіна за курсором
  window.addEventListener('pointermove', (e) => {
    const pupils = document.getElementById('pupils');
    if (!pupils) return;
    const dx = ((e.clientX / window.innerWidth) - 0.5) * 6;
    const dy = ((e.clientY / window.innerHeight) - 0.5) * 5;
    pupils.setAttribute('transform', `translate(${dx.toFixed(1)}, ${dy.toFixed(1)})`);
  });

  /* ==========================================================================
     СИСТЕМА СНІГОПАДУ ТА СВЯТКОВИХ ЕФЕКТІВ НА CANVAS
     ========================================================================== */
  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d');
  let snowflakes = [];
  let fxParticles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  for (let i = 0; i < 65; i++) {
    snowflakes.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 3.2 + 1.2,
      speedY: Math.random() * 0.9 + 0.35,
      speedX: (Math.random() - 0.5) * 0.6,
      alpha: Math.random() * 0.55 + 0.25
    });
  }

  // Локальний спалах крижаних іскор при заміні однієї картинки на число
  function spawnLocalIceSparkles(x, y) {
    const colors = ['#ffffff', '#72efdd', '#ffea79', '#48cae4'];
    for (let i = 0; i < 18; i++) {
      const angle = (Math.PI * 2 * i) / 18;
      const speed = Math.random() * 4.5 + 2;
      fxParticles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        size: Math.random() * 5 + 3.5,
        color: colors[i % colors.length],
        rotation: Math.random() * Math.PI,
        vRot: (Math.random() - 0.5) * 0.2,
        life: 1,
        decay: 0.035,
        shape: 'star'
      });
    }
  }

  // Святковий феєрверк при розв'язанні рівня
  function spawnCelebrationBurst(mode = 0) {
    const rect = penguinStage.getBoundingClientRect();
    const originX = rect.left + rect.width / 2;
    const originY = rect.top + rect.height / 2;

    const palette = mode === 0
      ? ['#5df0ff', '#ffffff', '#4ef2b8', '#ffea79']
      : mode === 1
      ? ['#ff9ebb', '#ffd166', '#72efdd', '#ffffff']
      : ['#48cae4', '#80ffdb', '#b8f2e6', '#fde4cf'];

    for (let i = 0; i < 45; i++) {
      const angle = (Math.PI * 2 * i) / 45 + (Math.random() - 0.5) * 0.2;
      const speed = Math.random() * 9.5 + 4;
      fxParticles.push({
        x: originX,
        y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3.2,
        size: Math.random() * 8 + 5,
        color: palette[i % palette.length],
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.2,
        life: 1,
        decay: Math.random() * 0.014 + 0.014,
        shape: i % 3 === 0 ? 'fish' : 'star'
      });
    }
  }

  // Снігова хмаринка при помилці
  function spawnSnowPuffOnPenguin() {
    const rect = penguinStage.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const topY = rect.top + 35;

    for (let i = 0; i < 22; i++) {
      fxParticles.push({
        x: centerX + (Math.random() - 0.5) * 70,
        y: topY + (Math.random() - 0.5) * 20,
        vx: (Math.random() - 0.5) * 3,
        vy: Math.random() * 3 + 1,
        size: Math.random() * 6 + 4,
        color: '#e6f9ff',
        rotation: 0,
        vRot: 0,
        life: 1,
        decay: 0.028,
        shape: 'snow'
      });
    }
  }

  function drawParticle(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;

    if (p.shape === 'star') {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const ang = (i * Math.PI) / 3;
        const rOuter = p.size;
        const rInner = p.size * 0.35;
        ctx.lineTo(Math.cos(ang) * rOuter, Math.sin(ang) * rOuter);
        ctx.lineTo(Math.cos(ang + Math.PI / 6) * rInner, Math.sin(ang + Math.PI / 6) * rInner);
      }
      ctx.closePath();
      ctx.fill();
    } else if (p.shape === 'fish') {
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size * 1.1, p.size * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-p.size, 0);
      ctx.lineTo(-p.size * 1.6, -p.size * 0.6);
      ctx.lineTo(-p.size * 1.6, p.size * 0.6);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function animateScene() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (const s of snowflakes) {
      s.y += s.speedY;
      s.x += s.speedX;
      if (s.y > canvas.height + 10) {
        s.y = -10;
        s.x = Math.random() * canvas.width;
      }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
      ctx.fill();
    }

    for (let i = fxParticles.length - 1; i >= 0; i--) {
      const p = fxParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.2;
      p.rotation += p.vRot;
      p.life -= p.decay;

      if (p.life <= 0) {
        fxParticles.splice(i, 1);
      } else {
        drawParticle(p);
      }
    }

    requestAnimationFrame(animateScene);
  }

  createIceKeypad();
  renderLevel(0);
  animateScene();
</script>
