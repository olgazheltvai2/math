<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Десяткові дроби</title>
    <!-- Підключення Firebase (compat версія) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        /* Скидання стилів та налаштування повноекранного режиму */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2b003a;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Контейнер для складної SVG-сцени (Фіолетова кришталева печера) */
        #bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        /* Ігровий шар */
        #game-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            transform-origin: 0 0;
            transition: transform 0.15s ease-out;
        }

        /* Рівні гри */
        .level {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .level.active {
            display: block;
        }

        /* Стилі для кнопок навігації */
        .nav-btn {
            position: absolute;
            bottom: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            border: 2px solid #d2b4de;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 0 15px rgba(142, 68, 173, 0.7);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(142, 68, 173, 1);
        }

        #btn-back { left: 20px; }
        #btn-next { right: 20px; }

        /* Стилі для draggable чисел (Рівень 1) */
        .draggable-number {
            position: absolute;
            cursor: grab;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
            touch-action: none;
        }
        
        .draggable-number:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        .number-bg {
            fill: url(#num-grad);
            stroke: #e8b2ff;
            stroke-width: 3;
            rx: 20;
            ry: 20;
        }

        .number-text {
            font-size: 48px;
            font-weight: bold;
            fill: #fff;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }

        /* Стилі для сіток (Рівень 2) */
        .grids-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100%;
            padding: 0 50px;
            box-sizing: border-box;
        }

        .grid-svg {
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
            touch-action: none;
        }

        .grid-cell {
            fill: rgba(142, 68, 173, 0.2);
            stroke: #d2b4de;
            stroke-width: 2;
            cursor: pointer;
            transition: fill 0.1s;
        }

        .grid-cell:hover {
            fill: rgba(142, 68, 173, 0.5);
        }

        .grid-cell.filled {
            fill: #e056fd;
            stroke: #fff;
        }

        /* Адаптивність для планшетів та смартфонів */
        @media (max-width: 850px) {
            .grids-container {
                flex-direction: column;
                justify-content: center;
                gap: 20px;
                padding: 10px 0;
            }
            .grid-svg {
                max-width: 90vw;
                height: auto;
            }
        }

        /* Менеджер тем (UI) */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 80px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #34495e;
            color: white;
            font-size: 24px;
            border: 2px solid #ecf0f1;
            cursor: pointer;
            z-index: 100000;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 650px;
            max-height: 60vh;
            background: #ffffff;
            border-radius: 15px;
            z-index: 100001;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow-y: auto;
            padding: 20px;
            color: #000;
            box-sizing: border-box;
        }
        
        #theme-modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #333;
        }

        .theme-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .theme-card {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            background-color: #2b003a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid transparent;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .theme-card:hover {
            border-color: #9b59b6;
        }

        .theme-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .theme-title {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            padding: 5px 0;
            font-size: 13px;
            pointer-events: none;
        }

        #theme-overlay {
            display: none;
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100000;
        }

        /* Заглушка (Радар) */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            color: red;
            font-size: 40px;
            font-weight: bold;
            z-index: 999999;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Глобальне полотно малювання */
        #global-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 90000;
            pointer-events: none;
        }

        #toggle-draw-btn-global {
            position: fixed;
            bottom: 85px;
            right: 20px;
            background-color: #8e44ad;
            color: white;
            border: 2px solid #fff;
            border-radius: 25px;
            padding: 10px 16px;
            font-size: 15px;
            cursor: pointer;
            z-index: 100000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #draw-panel-global {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            z-index: 100001;
            width: 250px;
            color: #333;
            user-select: none;
            -webkit-user-select: none;
        }

        #draw-panel-header {
            background: #8e44ad;
            color: white;
            padding: 10px 14px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .draw-panel-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .draw-btn-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .draw-tool-btn {
            flex: 1;
            padding: 8px 4px;
            border: 1px solid #ccc;
            background: #f9f9f9;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .draw-tool-btn.active {
            background: #8e44ad;
            color: white;
            border-color: #8e44ad;
        }

        /* Лупа (Масштабування) */
        #zoom-controls {
            position: fixed;
            bottom: 150px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100000;
        }

        .zoom-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #2980b9;
            color: white;
            border: 2px solid #fff;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>
<body>

    <!-- Складний сюжетний фон: Фіолетова кришталева печера -->
    <svg id="bg-container" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <defs>
            <radialGradient id="cave-glow" cx="50%" cy="50%" r="70%">
                <stop offset="0%" stop-color="#4a0e4e" />
                <stop offset="100%" stop-color="#12011c" />
            </radialGradient>
            
            <linearGradient id="crystal-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#be2edd" />
                <stop offset="100%" stop-color="#686de0" />
            </linearGradient>

            <linearGradient id="crystal-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#e056fd" />
                <stop offset="100%" stop-color="#4834d4" />
            </linearGradient>

            <linearGradient id="num-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#a55eea" />
                <stop offset="100%" stop-color="#4b4bf5" />
            </linearGradient>
            
            <pattern id="hex-pattern" width="60" height="103.923" patternUnits="userSpaceOnUse" patternTransform="scale(0.5)">
                <path d="M30 0L60 17.32L60 51.96L30 69.28L0 51.96L0 17.32Z" fill="none" stroke="rgba(155, 89, 182, 0.1)" stroke-width="2"/>
                <path d="M30 103.923L60 86.6L60 51.96L30 69.28L0 51.96L0 86.6Z" fill="none" stroke="rgba(155, 89, 182, 0.1)" stroke-width="2"/>
            </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#cave-glow)" />
        <rect width="100%" height="100%" fill="url(#hex-pattern)" />

        <path d="M100 0 L150 300 L200 0 Z" fill="url(#crystal-grad-1)" opacity="0.8"/>
        <path d="M400 0 L430 450 L480 0 Z" fill="url(#crystal-grad-2)" opacity="0.6"/>
        <path d="M800 0 L870 250 L920 0 Z" fill="url(#crystal-grad-1)" opacity="0.9"/>
        <path d="M1300 0 L1350 500 L1420 0 Z" fill="url(#crystal-grad-2)" opacity="0.7"/>
        <path d="M1700 0 L1740 350 L1800 0 Z" fill="url(#crystal-grad-1)" opacity="0.8"/>

        <path d="M250 1080 L320 600 L400 1080 Z" fill="url(#crystal-grad-2)" opacity="0.9"/>
        <path d="M600 1080 L650 750 L720 1080 Z" fill="url(#crystal-grad-1)" opacity="0.8"/>
        <path d="M1050 1080 L1120 500 L1200 1080 Z" fill="url(#crystal-grad-2)" opacity="0.9"/>
        <path d="M1500 1080 L1580 650 L1650 1080 Z" fill="url(#crystal-grad-1)" opacity="0.7"/>

        <circle cx="300" cy="400" r="4" fill="#fff" filter="blur(2px)">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
        </circle>
        <circle cx="800" cy="700" r="5" fill="#e056fd" filter="blur(3px)">
            <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4s" repeatCount="indefinite" />
        </circle>
        <circle cx="1400" cy="300" r="3" fill="#fff" filter="blur(2px)">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
        </circle>
        <circle cx="1600" cy="800" r="6" fill="#be2edd" filter="blur(4px)">
            <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite" />
        </circle>
    </svg>

    <!-- Інтерфейс гри -->
    <div id="game-layer">
        
        <!-- Кнопки навігації -->
        <button id="btn-back" class="nav-btn">&#10094;</button>
        <button id="btn-next" class="nav-btn">&#10095;</button>

        <!-- РІВЕНЬ 1: Drag and Drop числа -->
        <div id="level-1" class="level active">
            <!-- Числа генеруються через JS -->
        </div>

        <!-- РІВЕНЬ 2: Квадрати-сітки -->
        <div id="level-2" class="level">
            <div class="grids-container">
                <svg width="300" height="500" class="grid-svg" viewBox="0 0 300 500">
                    <rect x="0" y="0" width="300" height="500" rx="15" fill="url(#num-grad)" opacity="0.3" stroke="#e8b2ff" stroke-width="4"/>
                    <g id="grid-10"></g>
                </svg>

                <svg width="500" height="500" class="grid-svg" viewBox="0 0 500 500">
                    <rect x="0" y="0" width="500" height="500" rx="15" fill="url(#num-grad)" opacity="0.3" stroke="#e8b2ff" stroke-width="4"/>
                    <g id="grid-100"></g>
                </svg>
            </div>
        </div>

    </div>

    <!-- Менеджер тем (UI) -->
    <div id="theme-btn" title="Вибір фону">⚙️</div>
    <div id="theme-overlay"></div>
    <div id="theme-modal">
        <div id="theme-modal-close">✕</div>
        <h2 style="margin-top:0;">Оберіть фон</h2>
        <div class="theme-gallery" id="theme-gallery">
            <div class="theme-card" onclick="setTheme('none')">
                <div style="width:100%;height:100%;background:#2b003a;position:absolute;top:0;left:0;"></div>
                <div class="theme-title">Без фону</div>
            </div>
            <!-- Галерея генерується JS -->
        </div>
    </div>

    <!-- Інструменти масштабування -->
    <div id="zoom-controls">
        <button class="zoom-btn" id="btn-zoom-in" title="Збільшити">🔎+</button>
        <button class="zoom-btn" id="btn-zoom-out" title="Зменшити">🔎-</button>
    </div>

    <!-- Глобальна малювалка -->
    <canvas id="global-canvas"></canvas>
    <button id="toggle-draw-btn-global">✏️ Малювати</button>
    <div id="draw-panel-global">
        <div id="draw-panel-header">
            <span>Панель малювання</span>
            <span id="close-draw-panel" style="cursor:pointer;">✕</span>
        </div>
        <div class="draw-panel-content">
            <div class="draw-btn-row">
                <button class="draw-tool-btn active" id="tool-pencil">✏️ Олівець</button>
                <button class="draw-tool-btn" id="tool-eraser">🧽 Гумка</button>
            </div>
            <label style="font-size:14px;">Товщина: <input type="range" id="draw-thickness" min="1" max="50" value="5" style="width:100%;margin-top:4px;"></label>
            <label style="font-size:14px;">Колір: <input type="color" id="draw-color" value="#ff0000" style="width:100%;height:35px;border:none;cursor:pointer;"></label>
            <button id="clear-draw-canvas" style="padding:8px;background:#e74c3c;color:white;border:none;border-radius:5px;cursor:pointer;font-weight:bold;">🗑️ Очистити</button>
        </div>
    </div>

    <!-- Заглушка (Радар) -->
    <div id="block-overlay">Зачекай! Зараз не твій урок.</div>

    <script>
        /* ІНІЦІАЛІЗАЦІЯ FIREBASE ТА КОНФІГ */
        const CONFIG = {
            gameId: 'decimal_fractions_level1_v1',
            firebaseConfig: {
                databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
                projectId: "lesson-13c44"
            }
        };

        let db = null;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(CONFIG.firebaseConfig);
            }
            db = firebase.database();
        } catch (e) {
            console.warn("Працюємо в автономному режимі (без Firebase):", e);
        }

        let isRemoteAction = false;
        const pageLoadTime = Date.now(); // Фіксуємо час завантаження для захисту від старих команд

        // Отримання імені користувача
        let myName = new URLSearchParams(window.location.search).get('user');
        if (!myName) myName = sessionStorage.getItem('userName');
        if (!myName) {
            myName = 'Гість_' + Math.floor(Math.random() * 1000);
            sessionStorage.setItem('userName', myName);
        } else {
            sessionStorage.setItem('userName', myName);
        }

        // РАДАР ТА БЛОКУВАННЯ
        const tabId = Math.random().toString(36).substr(2, 9);
        
        if (db) {
            const userRef = db.ref(`online_users/${myName}/${tabId}`);
            const connectedRef = db.ref('.info/connected');

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    userRef.set(true);
                    userRef.onDisconnect().remove();
                }
            });

            window.addEventListener('beforeunload', () => {
                userRef.remove();
            });

            // ВИПРАВЛЕНО: Захист від зациклення force_refresh.
            // Реагуємо лише на свіжі команди, надіслані ПІСЛЯ запуску цієї сторінки.
            db.ref('force_refresh').on('value', (snap) => {
                const val = snap.val();
                if (!val) return;
                
                if (typeof val === 'object' && val.timestamp) {
                    if (val.timestamp > pageLoadTime) {
                        window.location.reload();
                    }
                } else if (val === true) {
                    // Якщо в базі був збережений старий булевий прапорець, скидаємо його та уникаємо перезавантаження
                    db.ref('force_refresh').set(false);
                }
            });

            db.ref(`blocked_users/${myName}`).on('value', (snap) => {
                const overlay = document.getElementById('block-overlay');
                if (snap.val() === true) {
                    overlay.style.display = 'flex';
                } else {
                    overlay.style.display = 'none';
                }
            });

            let initImmunity = true;
            setTimeout(() => { initImmunity = false; }, 2000);
            db.ref('current_activity').on('value', (snap) => {
                if (!initImmunity && snap.val() === 'lobby') {
                    window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
                }
            });
        }

        /* МЕНЕДЖЕР ТЕМ (Синхронізація + LocalStorage з індивідуальним ключем) */
        const themeBtn = document.getElementById('theme-btn');
        const themeModal = document.getElementById('theme-modal');
        const themeOverlay = document.getElementById('theme-overlay');
        const themeClose = document.getElementById('theme-modal-close');
        const gallery = document.getElementById('theme-gallery');
        const bgContainerSVG = document.getElementById('bg-container');

        themeBtn.onclick = () => { themeModal.style.display = 'block'; themeOverlay.style.display = 'block'; };
        const closeTheme = () => { themeModal.style.display = 'none'; themeOverlay.style.display = 'none'; };
        themeClose.onclick = closeTheme;
        themeOverlay.onclick = closeTheme;

        // Послідовне завантаження фонів по одному із зупинкою на 404
        async function loadThemesSequentially() {
            let i = 1;
            while (i <= 1000) {
                const url = `https://olgazheltvai2.github.io/images/backgrounds/background_${i}.webp`;
                try {
                    const response = await fetch(url, { method: 'HEAD' });
                    if (response.ok) {
                        const card = document.createElement('div');
                        card.className = 'theme-card';
                        card.onclick = () => setTheme(url);
                        card.innerHTML = `<img src="${url}" alt="Фон ${i}"><div class="theme-title">Фон ${i}</div>`;
                        gallery.appendChild(card);
                        i++;
                    } else {
                        break;
                    }
                } catch(e) {
                    break;
                }
            }
        }
        loadThemesSequentially();

        function applyThemeToScreen(url) {
            if (!url || url === 'none') {
                document.body.style.backgroundImage = 'none';
                bgContainerSVG.style.display = 'block';
            } else {
                document.body.style.backgroundImage = `url('${url}')`;
                bgContainerSVG.style.display = 'none';
            }
        }

        function setTheme(url) {
            applyThemeToScreen(url);
            localStorage.setItem('mySavedBg_' + CONFIG.gameId, url);
            closeTheme();
            
            if (db) {
                db.ref(`game_theme_${CONFIG.gameId}`).set({
                    url: url,
                    senderId: tabId,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
            }
        }

        // Відновлення збереженого фону гри з localStorage
        const savedBg = localStorage.getItem('mySavedBg_' + CONFIG.gameId);
        if (savedBg) {
            applyThemeToScreen(savedBg);
        }

        if (db) {
            db.ref(`game_theme_${CONFIG.gameId}`).on('value', snap => {
                const data = snap.val();
                if (data && data.senderId !== tabId) {
                    applyThemeToScreen(data.url);
                    localStorage.setItem('mySavedBg_' + CONFIG.gameId, data.url);
                }
            });
        }

        /* АУДІО ДВИЖОК */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'drag') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.1); gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'drop') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.2); gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2); osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'paint') {
                osc.type = 'square'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05); gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.05); osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'erase') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.05); gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.05); osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'nav') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(500, now); osc.frequency.setValueAtTime(800, now + 0.1); gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.3); osc.start(now); osc.stop(now + 0.3);
            }
        }

        /* МАСШТАБУВАННЯ (ЛУПА) */
        let currentZoom = 1;
        const gameLayer = document.getElementById('game-layer');
        document.getElementById('btn-zoom-in').onclick = () => {
            currentZoom = Math.min(2.5, currentZoom + 0.1);
            gameLayer.style.transform = `scale(${currentZoom})`;
            updateCanvasSize();
        };
        document.getElementById('btn-zoom-out').onclick = () => {
            currentZoom = Math.max(0.4, currentZoom - 0.1);
            gameLayer.style.transform = `scale(${currentZoom})`;
            updateCanvasSize();
        };

        /* ГЛОБАЛЬНА СИНХРОНІЗАЦІЯ ДІЙ ГРИ */
        function sendGameAction(type, data) {
            if (isRemoteAction || !db) return;
            db.ref(`game_action_${CONFIG.gameId}`).set({
                senderId: tabId,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                type: type,
                data: data
            });
        }

        if (db) {
            db.ref(`game_action_${CONFIG.gameId}`).on('value', snap => {
                const action = snap.val();
                if (!action || action.senderId === tabId) return;
                isRemoteAction = true;
                
                if (action.type === 'nav') {
                    changeLevel(action.data.level, false);
                } else if (action.type === 'drag_move') {
                    const el = document.getElementById(action.data.id);
                    if (el) { el.style.left = action.data.x + 'px'; el.style.top = action.data.y + 'px'; }
                } else if (action.type === 'cell_color') {
                    const cell = document.getElementById(action.data.cellId);
                    if (cell) {
                        if (action.data.filled) {
                            cell.classList.add("filled"); playSound('paint');
                        } else {
                            cell.classList.remove("filled"); playSound('erase');
                        }
                    }
                } else if (action.type === 'draw_line') {
                    drawRemoteLine(action.data);
                } else if (action.type === 'clear_canvas') {
                    clearCanvas(false);
                }

                setTimeout(() => { isRemoteAction = false; }, 20);
            });
        }

        /* НАВІГАЦІЯ */
        let currentLevel = 1;
        const totalLevels = 2;

        function changeLevel(newLevel, sync = true) {
            if (newLevel < 1 || newLevel > totalLevels) return;
            playSound('nav');
            document.getElementById(`level-${currentLevel}`).classList.remove('active');
            currentLevel = newLevel;
            document.getElementById(`level-${currentLevel}`).classList.add('active');
            if (sync) sendGameAction('nav', { level: currentLevel });
        }

        document.getElementById('btn-next').addEventListener('click', () => changeLevel(currentLevel + 1));
        document.getElementById('btn-back').addEventListener('click', () => changeLevel(currentLevel - 1));

        /* РІВЕНЬ 1 (Drag and Drop) */
        const numbers = ["10", "100", "1000", "10000", "100000", "1000000"];
        const level1Container = document.getElementById('level-1');
        
        numbers.forEach((num, index) => {
            const startX = 50 + Math.random() * (Math.max(window.innerWidth - 350, 100));
            const startY = 80 + Math.random() * (Math.max(window.innerHeight - 250, 100));
            const el = document.createElement('div');
            el.className = 'draggable-number';
            el.id = 'drag-num-' + index;
            el.style.left = startX + 'px';
            el.style.top = startY + 'px';
            const boxWidth = 100 + (num.length * 25);
            el.innerHTML = `
                <svg width="${boxWidth}" height="100" viewBox="0 0 ${boxWidth} 100">
                    <rect x="5" y="5" width="${boxWidth-10}" height="90" class="number-bg" />
                    <text x="${boxWidth/2}" y="55" class="number-text">${num}</text>
                </svg>
            `;
            level1Container.appendChild(el);
            makeDraggable(el);
        });

        function makeDraggable(element) {
            let isDragging = false;
            let startX, startY, initialX, initialY;

            element.addEventListener('mousedown', dragStart);
            element.addEventListener('touchstart', dragStart, {passive: false});

            function dragStart(e) {
                if (isRemoteAction) return;
                if (e.type === "touchstart") { 
                    startX = e.touches[0].clientX; 
                    startY = e.touches[0].clientY; 
                } else { 
                    startX = e.clientX; 
                    startY = e.clientY; 
                }
                
                initialX = element.offsetLeft;
                initialY = element.offsetTop;
                isDragging = true;
                element.style.zIndex = 100;
                playSound('drag');

                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag, {passive: false});
                document.addEventListener('mouseup', dragEnd);
                document.addEventListener('touchend', dragEnd);
            }

            function drag(e) {
                if (!isDragging || isRemoteAction) return;
                e.preventDefault();
                let currentX, currentY;
                if (e.type === "touchmove") { 
                    currentX = e.touches[0].clientX; 
                    currentY = e.touches[0].clientY; 
                } else { 
                    currentX = e.clientX; 
                    currentY = e.clientY; 
                }

                const dx = (currentX - startX) / currentZoom;
                const dy = (currentY - startY) / currentZoom;

                const newX = initialX + dx;
                const newY = initialY + dy;

                element.style.left = newX + 'px';
                element.style.top = newY + 'px';

                sendGameAction('drag_move', { id: element.id, x: newX, y: newY });
            }

            function dragEnd() {
                if (!isDragging) return;
                isDragging = false;
                element.style.zIndex = '';
                playSound('drop');
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', dragEnd);
                document.removeEventListener('touchend', dragEnd);
            }
        }

        /* РІВЕНЬ 2 (Масове розфарбовування сіток перетягуванням) */
        let isGridPainting = false;
        let paintFillState = true;

        // Сітка 1x10
        const grid10 = document.getElementById('grid-10');
        const cellHeight10 = 460 / 10;
        for (let i = 0; i < 10; i++) {
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.id = 'cell-10-' + i;
            rect.setAttribute("x", "20"); 
            rect.setAttribute("y", 20 + i * cellHeight10);
            rect.setAttribute("width", "260"); 
            rect.setAttribute("height", cellHeight10);
            rect.setAttribute("class", "grid-cell"); 
            rect.setAttribute("rx", "5");
            setupCellEvents(rect);
            grid10.appendChild(rect);
        }

        // Сітка 10x10
        const grid100 = document.getElementById('grid-100');
        const cellSize100 = 460 / 10;
        for (let row = 0; row < 10; row++) {
            for (let col = 0; col < 10; col++) {
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.id = `cell-100-${row}-${col}`;
                rect.setAttribute("x", 20 + col * cellSize100); 
                rect.setAttribute("y", 20 + row * cellSize100);
                rect.setAttribute("width", cellSize100); 
                rect.setAttribute("height", cellSize100);
                rect.setAttribute("class", "grid-cell"); 
                rect.setAttribute("rx", "4");
                setupCellEvents(rect);
                grid100.appendChild(rect);
            }
        }

        function setupCellEvents(rect) {
            rect.addEventListener("mousedown", (e) => {
                isGridPainting = true;
                paintFillState = !rect.classList.contains("filled");
                applyGridColor(rect, paintFillState);
            });
            rect.addEventListener("mouseenter", (e) => {
                if (isGridPainting) applyGridColor(rect, paintFillState);
            });
            rect.addEventListener("touchstart", (e) => {
                e.preventDefault();
                isGridPainting = true;
                paintFillState = !rect.classList.contains("filled");
                applyGridColor(rect, paintFillState);
            }, {passive: false});
            rect.addEventListener("touchmove", (e) => {
                e.preventDefault();
                if (!isGridPainting) return;
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (target && target.classList.contains('grid-cell')) {
                    applyGridColor(target, paintFillState);
                }
            }, {passive: false});
        }

        document.addEventListener("mouseup", () => { isGridPainting = false; });
        document.addEventListener("touchend", () => { isGridPainting = false; });

        function applyGridColor(cell, fill) {
            if (isRemoteAction) return;
            const currentlyFilled = cell.classList.contains("filled");
            if (fill && !currentlyFilled) {
                cell.classList.add("filled"); 
                playSound('paint');
                sendGameAction('cell_color', { cellId: cell.id, filled: true });
            } else if (!fill && currentlyFilled) {
                cell.classList.remove("filled"); 
                playSound('erase');
                sendGameAction('cell_color', { cellId: cell.id, filled: false });
            }
        }

        /* ГЛОБАЛЬНА МАЛЮВАЛКА (Canvas) */
        const canvas = document.getElementById('global-canvas');
        const ctx = canvas.getContext('2d');
        const drawBtn = document.getElementById('toggle-draw-btn-global');
        const drawPanel = document.getElementById('draw-panel-global');
        const closeDrawBtn = document.getElementById('close-draw-panel');
        
        let isDrawingMode = false;
        let isDrawing = false;
        let currentDrawTool = 'pencil';
        let lastX = 0, lastY = 0;

        function updateCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', updateCanvasSize);
        updateCanvasSize();

        drawBtn.onclick = () => {
            drawPanel.style.display = 'block';
            isDrawingMode = true;
            canvas.style.pointerEvents = 'auto';
        };

        closeDrawBtn.onclick = () => {
            drawPanel.style.display = 'none';
            isDrawingMode = false;
            canvas.style.pointerEvents = 'none';
        };

        document.getElementById('tool-pencil').onclick = function() {
            currentDrawTool = 'pencil';
            this.classList.add('active');
            document.getElementById('tool-eraser').classList.remove('active');
        };

        document.getElementById('tool-eraser').onclick = function() {
            currentDrawTool = 'eraser';
            this.classList.add('active');
            document.getElementById('tool-pencil').classList.remove('active');
        };

        document.getElementById('clear-draw-canvas').onclick = () => {
            clearCanvas(true);
        };

        function clearCanvas(sync = true) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (sync) sendGameAction('clear_canvas', {});
        }

        // Перетягування панелі малювання
        const panelHeader = document.getElementById('draw-panel-header');
        let isDraggingPanel = false, pStartX, pStartY, pInitX, pInitY;
        
        panelHeader.onmousedown = (e) => {
            isDraggingPanel = true; 
            pStartX = e.clientX; 
            pStartY = e.clientY;
            pInitX = drawPanel.offsetLeft; 
            pInitY = drawPanel.offsetTop;
        };
        panelHeader.ontouchstart = (e) => {
            isDraggingPanel = true; 
            pStartX = e.touches[0].clientX; 
            pStartY = e.touches[0].clientY;
            pInitX = drawPanel.offsetLeft; 
            pInitY = drawPanel.offsetTop;
        };
        
        document.addEventListener('mousemove', (e) => {
            if (!isDraggingPanel) return;
            drawPanel.style.left = (pInitX + e.clientX - pStartX) + 'px';
            drawPanel.style.top = (pInitY + e.clientY - pStartY) + 'px';
            drawPanel.style.right = 'auto';
        });
        document.addEventListener('touchmove', (e) => {
            if (!isDraggingPanel) return;
            drawPanel.style.left = (pInitX + e.touches[0].clientX - pStartX) + 'px';
            drawPanel.style.top = (pInitY + e.touches[0].clientY - pStartY) + 'px';
            drawPanel.style.right = 'auto';
        }, {passive: false});
        
        document.addEventListener('mouseup', () => isDraggingPanel = false);
        document.addEventListener('touchend', () => isDraggingPanel = false);

        // Малювання штрихів
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX, clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX; 
                clientY = e.touches[0].clientY;
            }
            return {
                x: (clientX - rect.left) / (rect.right - rect.left) * canvas.width,
                y: (clientY - rect.top) / (rect.bottom - rect.top) * canvas.height
            };
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); }, {passive: false});
        canvas.addEventListener('mousemove', drawLineLocal);
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); drawLineLocal(e); }, {passive: false});
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('touchend', () => isDrawing = false);

        function startDraw(e) {
            if (!isDrawingMode) return;
            isDrawing = true;
            const pos = getMousePos(e);
            lastX = pos.x; 
            lastY = pos.y;
        }

        function drawLineLocal(e) {
            if (!isDrawing || !isDrawingMode) return;
            const pos = getMousePos(e);
            const color = document.getElementById('draw-color').value;
            const thick = document.getElementById('draw-thickness').value;

            ctx.beginPath();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            if (currentDrawTool === 'eraser') {
                ctx.globalCompositeOperation = "destination-out";
                ctx.lineWidth = thick * 2;
                ctx.strokeStyle = "rgba(0,0,0,1)";
            } else {
                ctx.globalCompositeOperation = "source-over";
                ctx.lineWidth = thick;
                ctx.strokeStyle = color;
            }
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();

            sendGameAction('draw_line', {
                x0: lastX / canvas.width, 
                y0: lastY / canvas.height,
                x1: pos.x / canvas.width, 
                y1: pos.y / canvas.height,
                color: color, 
                thick: thick, 
                tool: currentDrawTool
            });

            lastX = pos.x;
            lastY = pos.y;
        }

        function drawRemoteLine(data) {
            ctx.beginPath();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            if (data.tool === 'eraser') {
                ctx.globalCompositeOperation = "destination-out";
                ctx.lineWidth = data.thick * 2;
                ctx.strokeStyle = "rgba(0,0,0,1)";
            } else {
                ctx.globalCompositeOperation = "source-over";
                ctx.lineWidth = data.thick;
                ctx.strokeStyle = data.color;
            }
            
            ctx.moveTo(data.x0 * canvas.width, data.y0 * canvas.height);
            ctx.lineTo(data.x1 * canvas.width, data.y1 * canvas.height);
            ctx.stroke();
            ctx.globalCompositeOperation = "source-over";
        }

    </script>
</body>
</html>
