<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Однина і множина</title>
  <!-- Підключаємо красивий, крупний і легкочитний шрифт із підтримкою кирилиці -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    /* =====================================================================
       БАЗОВІ СТИЛІ ТА МАКЕТ ЕКРАНА
       ===================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
      background: #1a261c;
    }

    #game-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Головна SVG-сцена займає весь екран */
    #scene-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* =====================================================================
       СТИЛІЗОВАНА ТАБЛИЧКА З РЕЧЕННЯМ (ЖОДНИХ БІЛИХ ПРЯМОКУТНИКІВ!)
       ===================================================================== */
    #sentence-wrapper {
      position: absolute;
      top: clamp(14px, 2.6vh, 30px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      max-width: min(92vw, 960px);
      width: max-content;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .sentence-plaque {
      position: relative;
      padding: clamp(14px, 2vh, 24px) clamp(28px, 4vw, 54px);
      border-radius: 36px 42px 38px 44px / 32px 36px 34px 30px;
      border: 4px solid var(--plaque-border, #8b5a2b);
      background: var(--plaque-bg, linear-gradient(165deg, #f7e1b5 0%, #e5be82 55%, #d4a362 100%));
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.32),
        inset 0 3px 6px rgba(255, 255, 255, 0.45),
        inset 0 -5px 10px rgba(80, 42, 12, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35em;
      flex-wrap: wrap;
      text-align: center;
      overflow: hidden;
    }

    /* Текстурний візерунок поверх таблички */
    .sentence-plaque::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.16;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(
          -12deg,
          transparent 0px,
          transparent 14px,
          rgba(92, 48, 12, 0.35) 14px,
          rgba(92, 48, 12, 0.35) 16px
        );
    }

    /* Декоративні заклепки по кутках таблички */
    .plaque-rivet {
      position: absolute;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff3c4, #a06b2e 70%, #5c3a14 100%);
      box-shadow: 0 2px 3px rgba(0,0,0,0.4);
      pointer-events: none;
    }
    .rivet-tl { top: 10px; left: 14px; }
    .rivet-tr { top: 10px; right: 14px; }
    .rivet-bl { bottom: 10px; left: 14px; }
    .rivet-br { bottom: 10px; right: 14px; }

    .sentence-text {
      position: relative;
      z-index: 2;
      font-size: clamp(26px, 3.6vw, 48px);
      font-weight: 900;
      color: var(--plaque-text, #3b200c);
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.45);
      letter-spacing: 0.01em;
      line-height: 1.25;
    }

    /* Пропуск у реченні */
    .blank-slot {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: clamp(130px, 16vw, 220px);
      padding: 2px 18px;
      margin: 0 4px;
      border-radius: 20px;
      background: var(--slot-bg, rgba(94, 52, 18, 0.16));
      border: 3px dashed var(--slot-border, #7c481d);
      font-size: clamp(26px, 3.6vw, 48px);
      font-weight: 900;
      color: transparent;
      transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.18);
    }

    .blank-slot.filled {
      border-style: solid;
      border-color: #2e8b47;
      background: linear-gradient(145deg, #4cd964, #28a745);
      color: #fffef5;
      text-shadow: 0 2px 4px rgba(0, 60, 20, 0.45);
      box-shadow: 0 6px 18px rgba(40, 167, 69, 0.45), inset 0 2px 4px rgba(255,255,255,0.4);
      transform: scale(1.06);
    }

    /* =====================================================================
       КНОПКИ ВИБОРУ СЛОВА (ОДНИНА / МНОЖИНА)
       ===================================================================== */
    #choices-wrapper {
      position: absolute;
      bottom: clamp(22px, 4.5vh, 46px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      gap: clamp(18px, 3.5vw, 44px);
      align-items: center;
      justify-content: center;
      transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #choices-wrapper.hidden-choices {
      opacity: 0;
      transform: translateX(-50%) translateY(60px) scale(0.85);
      pointer-events: none;
    }

    .choice-btn {
      position: relative;
      cursor: pointer;
      border: 4px solid var(--btn-border, #6d3f18);
      border-radius: 30px 34px 32px 28px / 28px 32px 28px 34px;
      padding: clamp(14px, 2vh, 22px) clamp(32px, 4.5vw, 60px);
      font-family: 'Nunito', sans-serif;
      font-size: clamp(26px, 3.3vw, 44px);
      font-weight: 900;
      color: var(--btn-text, #2f1a08);
      background: var(--btn-bg, linear-gradient(170deg, #ffe799 0%, #f5b942 60%, #dc8f1e 100%));
      box-shadow:
        0 10px 0 var(--btn-shadow, #8d5514),
        0 16px 26px rgba(0, 0, 0, 0.35),
        inset 0 4px 6px rgba(255, 255, 255, 0.55);
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.4);
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.16s ease, filter 0.2s ease;
      overflow: hidden;
    }

    /* Текстурний блік на кнопці */
    .choice-btn::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 12%;
      width: 76%;
      height: 36%;
      border-radius: 50px;
      background: linear-gradient(180deg, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0) 100%);
      pointer-events: none;
    }

    .choice-btn:hover {
      transform: translateY(-5px) scale(1.04);
      filter: brightness(1.06);
    }

    .choice-btn:active {
      transform: translateY(4px) scale(0.98);
      box-shadow:
        0 4px 0 var(--btn-shadow, #8d5514),
        0 8px 14px rgba(0, 0, 0, 0.3);
    }

    .choice-btn.wrong-shake {
      animation: wrongShake 0.48s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      background: linear-gradient(170deg, #ff9a8b 0%, #e85d50 100%) !important;
      border-color: #8c231c !important;
      color: #fff5f5 !important;
    }

    .choice-btn.correct-pop {
      animation: correctPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      background: linear-gradient(170deg, #6ef08c 0%, #2ab54b 100%) !important;
      border-color: #166e2c !important;
      color: #ffffff !important;
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-14px) rotate(-3deg); }
      40% { transform: translateX(14px) rotate(3deg); }
      60% { transform: translateX(-10px) rotate(-2deg); }
      80% { transform: translateX(8px) rotate(1deg); }
    }

    @keyframes correctPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.18) rotate(-2deg); }
      100% { transform: scale(1.05); }
    }

    /* =====================================================================
       МІНІМАЛІСТИЧНІ КНОПКИ НАВІГАЦІЇ («НАЗАД» ТА «ДАЛІ»)
       ===================================================================== */
    .nav-btn {
      position: absolute;
      bottom: clamp(18px, 3.2vh, 32px);
      z-index: 35;
      width: clamp(54px, 5.2vw, 68px);
      height: clamp(54px, 5.2vw, 68px);
      border-radius: 50%;
      border: 3px solid rgba(255, 240, 200, 0.85);
      background: radial-gradient(circle at 32% 30%, #f7d07a, #c77b24 72%, #8c4b10 100%);
      box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.36),
        inset 0 3px 5px rgba(255, 255, 255, 0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
    }

    .nav-btn:hover {
      transform: scale(1.12);
      filter: brightness(1.1);
    }

    .nav-btn:active {
      transform: scale(0.93);
    }

    #btn-prev {
      right: clamp(92px, 10vw, 124px);
    }

    #btn-next {
      right: clamp(20px, 2.8vw, 36px);
    }

    .nav-btn svg {
      width: 52%;
      height: 52%;
      fill: none;
      stroke: #fff9e6;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 2px rgba(90, 40, 0, 0.5));
    }

    /* =====================================================================
       ЖИВИЙ ПЕРСОНАЖ — РУДЕ ЛИСЕНЯ (У ЛІВОМУ НИЖНЬОМУ КУТІ)
       ===================================================================== */
    #fox-container {
      position: absolute;
      left: clamp(6px, 1.6vw, 24px);
      bottom: clamp(4px, 1.2vh, 16px);
      width: clamp(135px, 15vw, 215px);
      height: clamp(135px, 15vw, 215px);
      z-index: 30;
      cursor: pointer;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.35));
    }

    #fox-container:hover {
      transform: scale(1.04);
    }

    /* Анімації живого Лисеняти */
    .fox-breathe {
      transform-origin: 100px 175px;
      animation: foxBreathe 3.2s ease-in-out infinite;
    }

    .fox-tail {
      transform-origin: 65px 155px;
      animation: foxTailSway 2.8s ease-in-out infinite;
    }

    .fox-ear-l {
      transform-origin: 76px 76px;
      animation: foxEarTwitch 5.4s ease-in-out infinite;
    }

    .fox-ear-r {
      transform-origin: 124px 76px;
      animation: foxEarTwitch 6.2s ease-in-out 1.4s infinite;
    }

    .fox-eyes {
      transform-origin: 100px 102px;
      animation: foxBlink 4.6s ease-in-out infinite;
    }

    #fox-container.state-happy .fox-breathe {
      animation: foxJump 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 2;
    }

    #fox-container.state-happy .fox-tail {
      animation: foxTailWagFast 0.25s ease-in-out infinite;
    }

    #fox-container.state-oops .fox-head-group {
      transform-origin: 100px 115px;
      animation: foxTiltOops 0.7s ease-in-out;
    }

    #fox-container.state-cheer .fox-breathe {
      animation: foxCheerBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 1;
    }

    @keyframes foxBreathe {
      0%, 100% { transform: scaleY(1) translateY(0); }
      50% { transform: scaleY(1.025) translateY(-2px); }
    }

    @keyframes foxTailSway {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(9deg); }
    }

    @keyframes foxTailWagFast {
      0%, 100% { transform: rotate(-16deg); }
      50% { transform: rotate(18deg); }
    }

    @keyframes foxEarTwitch {
      0%, 88%, 100% { transform: rotate(0deg); }
      92% { transform: rotate(-10deg); }
      96% { transform: rotate(4deg); }
    }

    @keyframes foxBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }

    @keyframes foxJump {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-28px) scale(1.06, 0.96); }
      70% { transform: translateY(3px) scale(0.96, 1.04); }
    }

    @keyframes foxCheerBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      45% { transform: translateY(-16px) rotate(-4deg); }
    }

    @keyframes foxTiltOops {
      0%, 100% { transform: rotate(0deg); }
      35% { transform: rotate(-14deg) translateY(4px); }
      70% { transform: rotate(7deg); }
    }

    /* =====================================================================
       ІНТЕРАКТИВНІ ОБ'ЄКТИ НА СЦЕНІ ТА ЖИВІ ФОНОВІ АНІМАЦІЇ
       ===================================================================== */
    .interactive-obj {
      cursor: pointer;
      transition: filter 0.25s ease;
    }

    /* М'яке золотисте сяйво-підказка після правильної відповіді (без слів!) */
    .scene-unlocked .interactive-obj {
      filter: drop-shadow(0 0 12px rgba(255, 232, 117, 0.85));
      animation: invitePulse 1.8s ease-in-out infinite;
    }

    .scene-unlocked .interactive-obj:hover {
      filter: drop-shadow(0 0 20px rgba(255, 245, 160, 1)) brightness(1.08);
    }

    @keyframes invitePulse {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 230, 100, 0.55)); }
      50% { filter: drop-shadow(0 0 20px rgba(255, 238, 130, 0.98)); }
    }

    /* Загальні фонові рухи */
    .ambient-float {
      animation: ambientFloat 5s ease-in-out infinite;
    }
    .ambient-sway {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: ambientSway 4.2s ease-in-out infinite;
    }
    .ambient-cloud {
      animation: ambientCloud 26s linear infinite;
    }
    .ambient-shimmer {
      animation: ambientShimmer 3.2s ease-in-out infinite;
    }

    @keyframes ambientFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes ambientSway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3.5deg); }
    }
    @keyframes ambientCloud {
      0% { transform: translateX(-80px); }
      50% { transform: translateX(80px); }
      100% { transform: translateX(-80px); }
    }
    @keyframes ambientShimmer {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.9; }
    }

    /* Шар частинок (іскри, краплі, пелюстки, ноти) */
    #particles-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
    }
  </style>
</head>
<body>
  <div id="game-root">
    <!-- Головне SVG-полотно для сюжетних сцен -->
    <svg id="scene-svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"></svg>

    <!-- Шар анімованих частинок та ефектів -->
    <svg id="particles-svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"></svg>

    <!-- Стилізована табличка з реченням -->
    <div id="sentence-wrapper">
      <div class="sentence-plaque" id="sentence-plaque">
        <span class="plaque-rivet rivet-tl"></span>
        <span class="plaque-rivet rivet-tr"></span>
        <span class="plaque-rivet rivet-bl"></span>
        <span class="plaque-rivet rivet-br"></span>
        <span class="sentence-text" id="sentence-before"></span>
        <span class="blank-slot" id="blank-slot">...</span>
        <span class="sentence-text" id="sentence-after"></span>
      </div>
    </div>

    <!-- Кнопки вибору слова (однина / множина) -->
    <div id="choices-wrapper">
      <button class="choice-btn" id="choice-0"></button>
      <button class="choice-btn" id="choice-1"></button>
    </div>

    <!-- Живий персонаж: Руде Лисеня -->
    <div id="fox-container">
      <svg viewBox="0 0 200 200" width="100%" height="100%">
        <defs>
          <radialGradient id="foxFurMain" cx="45%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ff9b42"/>
            <stop offset="55%" stop-color="#e36414"/>
            <stop offset="100%" stop-color="#a83c08"/>
          </radialGradient>
          <radialGradient id="foxFurLight" cx="50%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#fff8eb"/>
            <stop offset="70%" stop-color="#f5dfc0"/>
            <stop offset="100%" stop-color="#dfc098"/>
          </radialGradient>
          <radialGradient id="foxEyeGrad" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#7c4714"/>
            <stop offset="50%" stop-color="#381d07"/>
            <stop offset="100%" stop-color="#140902"/>
          </radialGradient>
        </defs>

        <!-- Тінь під лисеням -->
        <ellipse cx="102" cy="186" rx="56" ry="10" fill="rgba(0,0,0,0.28)"/>

        <g class="fox-breathe">
          <!-- Пухнастий хвіст -->
          <g class="fox-tail">
            <path d="M68,162 C24,174 8,130 28,104 C44,84 68,112 72,144 Z" fill="url(#foxFurMain)" stroke="#8c3208" stroke-width="2"/>
            <path d="M28,104 C18,116 20,132 34,132 C42,132 45,118 42,108 C38,102 32,100 28,104 Z" fill="url(#foxFurLight)"/>
          </g>

          <!-- Тулуб -->
          <path d="M66,132 C60,165 68,184 100,184 C132,184 140,165 134,132 C128,114 72,114 66,132 Z" fill="url(#foxFurMain)"/>
          <!-- Пухнаста грудка -->
          <path d="M80,130 C76,154 84,176 100,176 C116,176 124,154 120,130 C112,122 88,122 80,130 Z" fill="url(#foxFurLight)"/>
          <!-- Передні лапки -->
          <ellipse cx="82" cy="178" rx="13" ry="8" fill="#3a1c0c"/>
          <ellipse cx="118" cy="178" rx="13" ry="8" fill="#3a1c0c"/>

          <!-- Голова -->
          <g class="fox-head-group">
            <!-- Ліве вушко -->
            <g class="fox-ear-l">
              <path d="M62,84 L54,34 L92,66 Z" fill="url(#foxFurMain)" stroke="#8c3208" stroke-width="2" stroke-linejoin="round"/>
              <path d="M64,78 L59,46 L84,66 Z" fill="#ffd9b3"/>
              <path d="M54,34 L63,46 L58,52 Z" fill="#3a1c0c"/>
            </g>
            <!-- Праве вушко -->
            <g class="fox-ear-r">
              <path d="M138,84 L146,34 L108,66 Z" fill="url(#foxFurMain)" stroke="#8c3208" stroke-width="2" stroke-linejoin="round"/>
              <path d="M136,78 L141,46 L116,66 Z" fill="#ffd9b3"/>
              <path d="M146,34 L137,46 L142,52 Z" fill="#3a1c0c"/>
            </g>

            <!-- Основна форма голови -->
            <path d="M52,102 C50,74 74,60 100,60 C126,60 150,74 148,102 C146,126 122,138 100,138 C78,138 54,126 52,102 Z" fill="url(#foxFurMain)"/>
            <!-- Світлі щічки -->
            <path d="M53,104 C58,124 78,136 100,136 C122,136 142,124 147,104 C132,102 118,108 100,116 C82,108 68,102 53,104 Z" fill="url(#foxFurLight)"/>
            <!-- Рум'янець -->
            <ellipse cx="69" cy="113" rx="9" ry="5" fill="#ff7c6b" opacity="0.45"/>
            <ellipse cx="131" cy="113" rx="9" ry="5" fill="#ff7c6b" opacity="0.45"/>

            <!-- Очі (звичайні) -->
            <g class="fox-eyes" id="fox-eyes-normal">
              <circle cx="81" cy="99" r="9.5" fill="url(#foxEyeGrad)"/>
              <circle cx="78" cy="95.5" r="3.2" fill="#ffffff"/>
              <circle cx="84" cy="102" r="1.4" fill="#ffffff" opacity="0.8"/>

              <circle cx="119" cy="99" r="9.5" fill="url(#foxEyeGrad)"/>
              <circle cx="116" cy="95.5" r="3.2" fill="#ffffff"/>
              <circle cx="122" cy="102" r="1.4" fill="#ffffff" opacity="0.8"/>
            </g>

            <!-- Щасливі примружені очі (при перемозі) -->
            <g id="fox-eyes-happy" style="display:none;">
              <path d="M71,100 Q81,88 91,100" fill="none" stroke="#381d07" stroke-width="4.5" stroke-linecap="round"/>
              <path d="M109,100 Q119,88 129,100" fill="none" stroke="#381d07" stroke-width="4.5" stroke-linecap="round"/>
            </g>

            <!-- Носик -->
            <ellipse cx="100" cy="114" rx="7.5" ry="5.5" fill="#2b1409"/>
            <ellipse cx="98" cy="112.5" rx="2.5" ry="1.3" fill="#ffffff" opacity="0.5"/>

            <!-- Усмішка -->
            <path id="fox-mouth" d="M91,122 Q100,129 109,122" fill="none" stroke="#4a220c" stroke-width="3" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
    </div>

    <!-- Мінімалістичні кнопки перемикання рівнів -->
    <button class="nav-btn" id="btn-prev" aria-label="Попередній">
      <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg>
    </button>
    <button class="nav-btn" id="btn-next" aria-label="Наступний">
      <svg viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg>
    </button>
  </div>

  <script>
    /* =======================================================================
       1. ЗВУКОВИЙ СИНТЕЗАТОР (WEB AUDIO API) — ЖОДНИХ ЗОВНІШНІХ ФАЙЛІВ
       ======================================================================= */
    const SoundFX = (() => {
      let ctx = null;
      function getCtx() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          ctx = new AudioCtx();
        }
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }

      // Допоміжна функція для ноти
      function playTone(freq, type, duration, vol = 0.18, delay = 0, slideTo = null) {
        const c = getCtx();
        const t = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, t + duration);
        }
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(vol, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(t);
        osc.stop(t + duration + 0.02);
      }

      return {
        // Святковий акорд при правильній відповіді
        correct() {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((n, i) => playTone(n, 'triangle', 0.36, 0.18, i * 0.075));
          playTone(1318.5, 'sine', 0.45, 0.12, 0.32);
        },

        },
        // Бульк / сплеск води (жабка, рибки, мушля, полив)
        splash() {
          playTone(340, 'sine', 0.16, 0.18, 0, 720);
          playTone(520, 'sine', 0.14, 0.14, 0.08, 280);
          playTone(680, 'sine', 0.12, 0.1, 0.16, 980);
        },
        // Квакання жабки
        ribbit() {
          playTone(180, 'sawtooth', 0.12, 0.09, 0, 340);
          playTone(210, 'sawtooth', 0.15, 0.09, 0.14, 420);
        },
        // Дзижчання бджоли
        buzz() {
          playTone(220, 'sawtooth', 0.28, 0.07, 0, 265);
          playTone(265, 'sawtooth', 0.22, 0.06, 0.22, 200);
        },
        // Чарівний дзвіночок / блиск (перлина, світлячки, сніжинки, свічки)
        chime() {
          [880, 1174.6, 1567.9, 1760].forEach((n, i) => playTone(n, 'sine', 0.42, 0.12, i * 0.06));
        },
        // М'який стукіт / падіння яблука чи гриба
        pop() {
          playTone(290, 'sine', 0.12, 0.22, 0, 580);
          playTone(460, 'triangle', 0.1, 0.14, 0.06, 360);

        // Шелест листя / вітер / полум'я кулі

          playTone(320, 'triangle', 0.28, 0.12, 0, 640);
          playTone(540, 'sine', 0.3, 0.1, 0.08, 420);

    const particlesSvg = document.getElementById('particles-svg');

    function spawnParticles(x, y, count = 14, colors = ['#ffe066', '#ff9f1c', '#ffffff', '#6ef08c'], shape = 'star') {
      const ns = 'http://www.w3.org/2000/svg';
      for (let i = 0; i < count; i++) {
        const el = document.createElementNS(ns, shape === 'circle' ? 'circle' : 'path');
        const color = colors[i % colors.length];
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.45;
        const speed = 55 + Math.random() * 115;
        const dx = Math.cos(angle) * speed;
        const dy = Math.sin(angle) * speed - 35;

        if (shape === 'circle') {
          el.setAttribute('cx', 0);
          el.setAttribute('cy', 0);
          el.setAttribute('r', 4 + Math.random() * 6);
        } else if (shape === 'note') {
          el.setAttribute('d', 'M0,12 C-5,12 -7,8 -3,5 C0,3 4,4 4,7 L4,-10 L14,-13 L14,4 C14,8 8,10 6,7 C4,4 9,1 12,3 L12,-9 L6,-7 L6,9 C6,11 3,12 0,12 Z');
        } else {
          el.setAttribute('d', 'M0,-11 L3,-3 L11,0 L3,3 L0,11 L-3,3 L-11,0 L-3,-3 Z');
        }

        el.setAttribute('fill', color);
        el.setAttribute('transform', `translate(${x}, ${y}) scale(0.4)`);
        particlesSvg.appendChild(el);

        const start = performance.now();
        const duration = 680 + Math.random() * 420;
        const rot = (Math.random() - 0.5) * 260;

        function animate(now) {
          const p = Math.min(1, (now - start) / duration);
          const ease = 1 - Math.pow(1 - p, 3);
          const cx = x + dx * ease;
          const cy = y + dy * ease + p * p * 55;
          const scale = (1 - p * 0.7) * 1.1;
          el.setAttribute('transform', `translate(${cx.toFixed(1)}, ${cy.toFixed(1)}) rotate(${(rot * p).toFixed(1)}) scale(${scale.toFixed(2)})`);
          el.setAttribute('opacity', (1 - p).toFixed(2));
          if (p < 1) {
            requestAnimationFrame(animate);
          } else {
            el.remove();
          }
        }
        requestAnimationFrame(animate);
      }
    }

    function setFoxState(state) {
      clearTimeout(foxTimer);
      foxEl.classList.remove('state-happy', 'state-oops', 'state-cheer');
      void foxEl.offsetWidth; // скидання анімації

      if (state === 'happy') {
        foxEl.classList.add('state-happy');
        foxEyesNormal.style.display = 'none';
        foxEyesHappy.style.display = 'block';
        foxMouth.setAttribute('d', 'M89,121 Q100,134 111,121');

      } else if (state === 'oops') {
        foxEl.classList.add('state-oops');
        foxEyesNormal.style.display = 'block';
        foxEyesHappy.style.display = 'none';
        foxMouth.setAttribute('d', 'M93,126 Q100,121 107,126');
        foxTimer = setTimeout(() => setFoxState('idle'), 950);
      } else if (state === 'cheer') {
        foxEl.classList.add('state-cheer');
        foxEyesNormal.style.display = 'none';
        foxEyesHappy.style.display = 'block';
        foxMouth.setAttribute('d', 'M90,121 Q100,132 110,121');

      } else {
        foxEyesNormal.style.display = 'block';
        foxEyesHappy.style.display = 'none';
        foxMouth.setAttribute('d', 'M91,122 Q100,129 109,122');
      }
    }

          <path d="M-12,-68 Q0,-112 24,-96" stroke="#3c7a24" stroke-width="14" fill="none" stroke-linecap="round"/>
          <ellipse cx="-62" cy="4" rx="54" ry="72" fill="url(#pumpGrad)" stroke="#8c3607" stroke-width="3"/>
          <ellipse cx="62" cy="4" rx="54" ry="72" fill="url(#pumpGrad)" stroke="#8c3607" stroke-width="3"/>
          <ellipse cx="0" cy="8" rx="64" ry="78" fill="url(#pumpGrad)" stroke="#8c3607" stroke-width="3"/>
          <!-- Листок гарбуза -->
          <path d="M-110,45 Q-175,10 -155,-30 Q-110,-40 -80,15 Z" fill="#4aa32c"/>
        </g>
      `;

      let big = false;
      bindInteractive('hero-pumpkin', (el) => {
        SoundFX.pop();
        big = !big;
        el.style.transition = 'transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1)';
        el.setAttribute('transform', `translate(640, ${big ? 455 : 475}) scale(${big ? 1.22 : 1})`);
        spawnParticles(640, 420, 18, ['#ffb84d', '#6ef08c', '#ffe066'], 'star');
      });
    }

    // --- СЦЕНА 15: НІЧНЕ ОЗЕРО ЗІ СВІТЛЯЧКАМИ (світлячки) ---
    function buildFirefliesScene() {
      sceneSvg.innerHTML = `
        <defs>
          <linearGradient id="night15" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#131b42"/>
            <stop offset="65%" stop-color="#22356b"/>
            <stop offset="100%" stop-color="#15383d"/>
          </linearGradient>
          <radialGradient id="glowFirefly" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffd9"/>
            <stop offset="40%" stop-color="#ffe047"/>
            <stop offset="100%" stop-color="rgba(255,224,71,0)"/>
          </radialGradient>
        </defs>
        <rect width="1280" height="720" fill="url(#night15)"/>
        <!-- Місяць -->
        <circle cx="1050" cy="135" r="56" fill="#fff7cc" opacity="0.9"/>
        <!-- Нічна трава та очерет -->
        <path d="M0,515 Q420,475 860,520 T1280,490 L1280,720 L0,720 Z" fill="#16422c"/>
        <path d="M0,575 Q480,545 960,590 T1280,565 L1280,720 L0,720 Z" fill="#0d2e1e"/>
        <!-- П'ять світлячків -->
        ${[
          { id: 'ff-1', x: 430, y: 410 },
          { id: 'ff-2', x: 560, y: 340 },
          { id: 'ff-3', x: 675, y: 455 },
          { id: 'ff-4', x: 790, y: 360 },
          { id: 'ff-5', x: 900, y: 440 }
        ].map(f => `
          <g id="${f.id}" transform="translate(${f.x}, ${f.y})">
            <circle cx="0" cy="0" r="46" fill="url(#glowFirefly)"/>
            <ellipse cx="0" cy="0" rx="14" ry="9" fill="#fff9b0"/>
            <ellipse cx="-6" cy="-10" rx="10" ry="6" transform="rotate(-25 -6 -10)" fill="rgba(255,255,255,0.65)"/>
            <ellipse cx="6" cy="-10" rx="10" ry="6" transform="rotate(25 6 -10)" fill="rgba(255,255,255,0.65)"/>
          </g>
        `).join('')}
      `;

      ['ff-1', 'ff-2', 'ff-3', 'ff-4', 'ff-5'].forEach((id, i) => {
        const pos = [[430, 410], [560, 340], [675, 455], [790, 360], [900, 440]][i];
        bindInteractive(id, (el) => {
          SoundFX.chime();
          const nx = 360 + Math.random() * 580;
          const ny = 260 + Math.random() * 240;
          el.style.transition = 'transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1)';
          el.setAttribute('transform', `translate(${nx.toFixed(0)}, ${ny.toFixed(0)}) scale(1.3)`);
          spawnParticles(nx, ny, 14, ['#ffffd9', '#ffe047', '#96f7d2'], 'star');
        });
      });
    }

    // --- СЦЕНА 16: ПОВІТРЯНА ДОЛИНА (куля) ---
    function buildBalloonScene() {
      sceneSvg.innerHTML = `
        <defs>
          <linearGradient id="sky16" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3c9ce6"/>
            <stop offset="65%" stop-color="#9ad8fa"/>
            <stop offset="100%" stop-color="#e3f4ff"/>
          </linearGradient>
          <radialGradient id="balloonGrad" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ff8c66"/>
            <stop offset="60%" stop-color="#e63e2e"/>
            <stop offset="100%" stop-color="#941812"/>
          </radialGradient>
        </defs>
        <rect width="1280" height="720" fill="url(#sky16)"/>
        <g class="ambient-cloud" opacity="0.9">
          <path d="M160,260 Q190,220 235,230 Q270,195 320,225 Q360,225 365,260 Z" fill="#ffffff"/>
          <path d="M840,220 Q870,185 915,195 Q955,165 1000,195 Q1040,195 1045,225 Z" fill="#ffffff"/>
        </g>
        <path d="M0,565 Q380,505 780,565 T1280,535 L1280,720 L0,720 Z" fill="#61b04a"/>
        <!-- Повітряна куля -->
        <g id="hero-balloon" transform="translate(640, 390)" style="transition: transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);">
          <line x1="-22" y1="78" x2="-16" y2="122" stroke="#6e4420" stroke-width="3.5"/>
          <line x1="22" y1="78" x2="16" y2="122" stroke="#6e4420" stroke-width="3.5"/>
          <rect x="-26" y="120" width="52" height="40" rx="6" fill="#b87638" stroke="#6e4016" stroke-width="3"/>
          <path d="M0,-148 C98,-148 118,-25 46,78 L-46,78 C-118,-25 -98,-148 0,-148 Z" fill="url(#balloonGrad)" stroke="#7a150f" stroke-width="3"/>
          <path d="M0,-148 C48,-148 56,-25 22,78 L-22,78 C-56,-25 -48,-148 0,-148 Z" fill="#ffd24d"/>
        </g>
      `;

      let high = false;
      bindInteractive('hero-balloon', (el) => {
        SoundFX.whoosh();
        high = !high;
        el.setAttribute('transform', `translate(${high ? 680 : 640}, ${high ? 275 : 390}) rotate(${high ? 5 : 0})`);
        spawnParticles(high ? 680 : 640, high ? 355 : 465, 16, ['#ff9800', '#ffe066', '#ffffff'], 'star');
      });
    }

    /* =======================================================================
       6. ГОЛОВНА ЛОГІКА ГРИ (ЗАВАНТАЖЕННЯ РІВНІВ ТА ВЗАЄМОДІЯ)
       ======================================================================= */
    let currentIndex = 0;
    let isSolved = false;

    const plaqueEl = document.getElementById('sentence-plaque');
    const beforeEl = document.getElementById('sentence-before');
    const afterEl = document.getElementById('sentence-after');
    const slotEl = document.getElementById('blank-slot');
    const choicesWrapper = document.getElementById('choices-wrapper');
    const choiceBtns = [document.getElementById('choice-0'), document.getElementById('choice-1')];

    function loadLevel(index) {
      currentIndex = (index + LEVELS.length) % LEVELS.length;
      isSolved = false;
      const lvl = LEVELS[currentIndex];

      // Оновлюємо кольорову палітру таблички та кнопок під сцену
      const root = document.documentElement;
      root.style.setProperty('--plaque-bg', lvl.theme.plaqueBg);
      root.style.setProperty('--plaque-border', lvl.theme.plaqueBorder);
      root.style.setProperty('--plaque-text', lvl.theme.plaqueText);
      root.style.setProperty('--btn-bg', lvl.theme.btnBg);
      root.style.setProperty('--btn-border', lvl.theme.btnBorder);
      root.style.setProperty('--btn-shadow', lvl.theme.btnShadow);

      // Заповнюємо речення
      beforeEl.textContent = lvl.before;
      afterEl.textContent = lvl.after;
      slotEl.textContent = '______';
      slotEl.classList.remove('filled');

      // Перемішуємо порядок кнопок (ліворуч / праворуч)
      const shuffled = Math.random() > 0.5 ? [lvl.options[0], lvl.options[1]] : [lvl.options[1], lvl.options[0]];
      choicesWrapper.classList.remove('hidden-choices');
      sceneSvg.classList.remove('scene-unlocked');

      choiceBtns.forEach((btn, idx) => {
        btn.textContent = shuffled[idx];
        btn.classList.remove('wrong-shake', 'correct-pop');
        btn.onclick = () => handleChoice(btn, shuffled[idx], lvl.correct);
      });

      // Малюємо нову унікальну сцену
      lvl.buildScene();
      setFoxState('idle');
    }

    function handleChoice(btn, selectedWord, correctWord) {
      if (isSolved) return;

      if (selectedWord === correctWord) {
        // Правильна відповідь!
        isSolved = true;
        SoundFX.correct();
        btn.classList.add('correct-pop');
        setFoxState('happy');

        slotEl.textContent = correctWord;
        slotEl.classList.add('filled');

        // Святковий салют із зірочок
        spawnParticles(640, 120, 26, ['#ffe066', '#6ef08c', '#ff9f1c', '#ffffff'], 'star');

        // Плавно приховуємо кнопки вибору та активуємо підсвітку інтерактивної сцени
        setTimeout(() => {
          choicesWrapper.classList.add('hidden-choices');
          sceneSvg.classList.add('scene-unlocked');
        }, 650);
      } else {
        // Помилковий вибір
        SoundFX.wrong();
        setFoxState('oops');
        btn.classList.remove('wrong-shake');
        void btn.offsetWidth;
        btn.classList.add('wrong-shake');
      }
    }

    // Кнопки «Назад» та «Далі» (перемикають одразу, без очікування)
    document.getElementById('btn-prev').addEventListener('click', () => {
      SoundFX.nav();
      loadLevel(currentIndex - 1);
    });
    document.getElementById('btn-next').addEventListener('click', () => {
      SoundFX.nav();
      loadLevel(currentIndex + 1);
    });

    // Запуск першого рівня
    loadLevel(0);
  </script>
</body>
</html>
