<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графічний Диктант - Гра</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background-color: #1a4a6e; background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; color: #fff; }
        #game-container { width: 95vw; height: 95vh; background: transparent; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 4px rgba(160, 196, 255, 0.5); display: flex; flex-direction: row; overflow: hidden; backdrop-filter: blur(5px); position: relative; }
        #sidebar { width: 250px; padding: 20px; background: rgba(10,30,50,0.4); border-right: 3px solid rgba(160, 196, 255, 0.5); display: flex; flex-direction: column; gap: 15px; }
        #canvas-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; padding: 10px; }
        canvas { background-color: rgba(255,255,255,0.7); border: 4px solid #f9d857; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); cursor: pointer; max-width: 100%; max-height: 100%; object-fit: contain; }
        .instruction-box { background: rgba(255,255,255,0.1); border: 2px solid rgba(160, 196, 255, 0.5); border-radius: 15px; padding: 20px; font-size: 2rem; font-weight: bold; text-align: center; color: #f9d857; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; gap: 15px; transition: color 0.3s; }
        .secret-hidden { color: transparent !important; text-shadow: none !important; user-select: none; }
        .secret-hidden * { fill: transparent !important; filter: none !important; }
        .secret-hidden-teacher { opacity: 0.5; background: rgba(255,0,0,0.2) !important; border-color: #ff7e5f !important; }
        .step-icon { width: 50px; height: 50px; fill: #f9d857; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5)); }
        
        .slider-group { display: flex; flex-direction: column; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; width: 100%; gap: 5px; margin-top: 10px; }
        .slider-group input { width: 100%; cursor: pointer; }

        @media (max-width: 768px) {
            #game-container { flex-direction: column; width: 100vw; height: 100vh; border-radius: 0; }
            #sidebar { width: 100%; border-right: none; border-bottom: 3px solid rgba(160, 196, 255, 0.5); flex: 0 0 auto; box-sizing: border-box; }
        }
    </style>
</head>
<body>
<div id="game-container">
    <div id="sidebar">
        <!-- Заголовок з кнопками вчителя -->
        <div style="display:flex; justify-content:center; align-items:center; gap:10px;">
            <h2 style="margin:0; color:#a0c4ff; text-shadow:1px 1px 2px #000;">Малюй!</h2>
            <button id="btn-toggle-code" style="background:none; border:none; font-size:1.5rem; cursor:pointer; filter:drop-shadow(1px 1px 2px #000);" title="Сховати/Показати код">👁️</button>
            <button id="btn-reset-game" style="background:none; border:none; font-size:1.5rem; cursor:pointer; filter:drop-shadow(1px 1px 2px #000);" title="Очистити гру для нового уроку">🔄</button>
        </div>
        <div id="current-step" class="instruction-box"></div>
        <div style="flex-grow:1"></div>
        <div class="slider-group">
            <label>Видимість сітки:</label>
            <input type="range" id="grid-opacity" min="0" max="1" step="0.1" value="0.2">
        </div>
        <button id="btn-check" style="background: linear-gradient(to bottom, #f9d857, #e0b826); border:none; padding:15px; border-radius:15px; font-size:1.2rem; font-weight:bold; color:#5c3a21; cursor:pointer; box-shadow:0 5px 15px rgba(0,0,0,0.3); display:none; margin-top:15px;">Готово!</button>
    </div>
    <div id="canvas-area">
        <canvas id="main-canvas" width="600" height="600"></canvas>
    </div>
</div>

<!-- КНОПКА ТА МОДАЛЬНЕ ВІКНО THEME MANAGER -->
<button id="theme-manager-btn" style="position:fixed; bottom:20px; right:20px; z-index:9999; background:#fff; border:none; border-radius:50%; width:50px; height:50px; font-size:24px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center;" title="Змінити фон">⚙️</button>

<div id="theme-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.6); z-index:10000; justify-content:center; align-items:center;">
    <div style="background:white; padding:20px; border-radius:15px; width:90%; max-width:600px; max-height:60vh; overflow-y:auto; box-shadow:0 10px 30px rgba(0,0,0,0.5); color:#333;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="margin:0; font-family:Arial, sans-serif;">Оберіть фон</h3>
            <button id="theme-modal-close" style="background:none; border:none; font-size:20px; cursor:pointer; font-weight:bold;">✕</button>
        </div>
        <div id="theme-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:10px;"></div>
    </div>
</div>

<!-- БЛОК КОНТРОЛЮ ТА FIREBASE -->
<div id="block-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; color:red; font-size:3rem; font-weight:bold; justify-content:center; align-items:center; text-align:center;">Зачекай! Зараз не твій урок.</div>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<script>
    const CONFIG = {
        gameId: 'dict_1787919777637381',
        bgImg: ''
    };

    // --- LOGIC FOR THEME MANAGER ---
    const firebaseConfig = {
        databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Apply saved background immediately
    const savedBg = localStorage.getItem('mySavedGameBg');
    if (savedBg) {
        document.body.style.backgroundImage = `url('${savedBg}')`;
    }

    // Theme Manager UI & Async Loader
    const themeBtn = document.getElementById('theme-manager-btn');
    const themeModal = document.getElementById('theme-modal');
    const themeClose = document.getElementById('theme-modal-close');
    const themeGrid = document.getElementById('theme-grid');

    themeBtn.addEventListener('click', () => {
        themeModal.style.display = 'flex';
        loadThemes();
    });
    themeClose.addEventListener('click', () => {
        themeModal.style.display = 'none';
    });
    window.addEventListener('click', (e) => {
        if (e.target === themeModal) themeModal.style.display = 'none';
    });

    function loadThemes() {
        if (themeGrid.children.length > 0) return; // Load once
        for (let i = 1; i <= 1000; i++) {
            const url = `https://olgazheltvai2.github.io/images/backgrounds/background_${i}.webp`;
            const img = new Image();
            img.onload = () => {
                const card = document.createElement('div');
                card.style.cssText = "position:relative; height:80px; border-radius:8px; overflow:hidden; cursor:pointer; border:2px solid #ddd; background-size:cover; background-position:center;";
                card.style.backgroundImage = `url('${url}')`;
                card.innerHTML = `<div style="position:absolute; bottom:0; left:0; width:100%; background:rgba(0,0,0,0.6); color:white; font-size:11px; text-align:center; padding:2px; font-family:Arial, sans-serif;">Фон ${i}</div>`;
                card.addEventListener('click', () => {
                    db.ref('game_theme').set(url);
                    document.body.style.backgroundImage = `url('${url}')`;
                    localStorage.setItem('mySavedGameBg', url);
                    themeModal.style.display = 'none';
                });
                themeGrid.appendChild(card);
            };
            img.onerror = () => {
                // Stop checking if missing
            };
            img.src = url;
        }
    }

    db.ref('game_theme').on('value', snap => {
        const url = snap.val();
        if (url) {
            document.body.style.backgroundImage = `url('${url}')`;
            localStorage.setItem('mySavedGameBg', url);
        }
    });

    // --- ACCESS CONTROL, RADAR & LOBBY ---
    const urlParams = new URLSearchParams(window.location.search);
    let myName = urlParams.get('user');
    if (!myName) {
        myName = sessionStorage.getItem('userName') || ('Гість_' + Math.floor(Math.random() * 1000));
    }
    sessionStorage.setItem('userName', myName);

    const tabId = Math.random().toString(36).substring(2);
    const userRef = db.ref(`online_users/${myName}/${tabId}`);
    userRef.set({ status: 'online', timestamp: Date.now() });
    userRef.onDisconnect().remove();

    window.addEventListener('beforeunload', () => {
        userRef.remove();
    });

    db.ref(`blocked_users/${myName}`).on('value', snap => {
        if (snap.val() === true) {
            document.getElementById('block-overlay').style.display = 'flex';
        } else {
            document.getElementById('block-overlay').style.display = 'none';
        }
    });

    let initialLoad = true;
    setTimeout(() => { initialLoad = false; }, 1000);

    db.ref('current_activity').on('value', snap => {
        if (initialLoad) return;
        const val = snap.val();
        if (val === 'lobby') {
            window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
        }
    });

    db.ref('force_refresh').on('value', snap => {
        if (initialLoad) return;
        if (snap.val()) {
            window.location.reload();
        }
    });
</script>
<script src="https://olgazheltvai2.github.io/rizne/pencil.js"></script></body>
</html>
