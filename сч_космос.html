<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Nebula Drop</title>
    
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            touch-action: manipulation;
            background-color: #1a0b2e;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* --- Складний SVG Фон: Магічна Туманність --- */
        #svg-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
        }
        
        .magic-cloud {
            animation: float-cloud 12s infinite alternate ease-in-out;
            transform-origin: center;
        }
        
        .floating-crystal {
            animation: float-crystal 8s infinite alternate ease-in-out;
        }
        
        .stardust {
            animation: twinkle-magic 4s infinite alternate;
        }

        @keyframes float-cloud {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            50% { transform: scale(1.1) translate(20px, -20px); opacity: 0.8; }
            100% { transform: scale(1.05) translate(-20px, 10px); opacity: 0.5; }
        }
        @keyframes float-crystal {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-30px) rotate(15deg); }
        }
        @keyframes twinkle-magic {
            0% { opacity: 0.1; transform: scale(0.5); fill: #fff; }
            50% { opacity: 1; transform: scale(1.5); fill: #ff99ff; }
            100% { opacity: 0.3; transform: scale(0.8); fill: #99ffff; }
        }

        /* Ігрові контейнери (максимально прозорі) */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            transform-origin: top left;
            transition: transform 0.2s ease;
        }

        /* --- Персонаж: Космічний Аксолотль Лум --- */
        #character {
            position: absolute;
            bottom: 2vh;
            left: 2vw;
            width: 28vmin;
            height: 28vmin;
            z-index: 20;
            pointer-events: none;
            animation: zero-gravity 4s infinite ease-in-out;
            filter: drop-shadow(0px 15px 20px rgba(0, 0, 0, 0.4));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: block;
        }
        
        .gill-left { transform-origin: 80px 100px; animation: flap-gill-l 2.5s infinite ease-in-out; }
        .gill-right { transform-origin: 170px 100px; animation: flap-gill-r 2.5s infinite ease-in-out reverse; }
        .axo-tail { transform-origin: 50px 150px; animation: wag-tail 3s infinite ease-in-out; }
        .glass-helmet { animation: glass-shine 3s infinite alternate; }

        @keyframes zero-gravity {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        @keyframes flap-gill-l {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-15deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes flap-gill-r {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(15deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes wag-tail {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(20deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes glass-shine {
            0% { opacity: 0.3; }
            100% { opacity: 0.6; }
        }

        .char-happy { transform: translateY(-40px) scale(1.15) rotate(10deg) !important; filter: drop-shadow(0 0 30px #ff00ff) !important; }
        .char-sad { transform: translateY(15px) scale(0.9) rotate(-10deg) !important; filter: grayscale(30%) drop-shadow(0 0 20px #000) !important; }

        /* --- Математичний Екран --- */
        #math-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5vh;
            z-index: 10;
            transition: opacity 0.5s;
        }

        .equation-box {
            display: flex;
            align-items: center;
            gap: 2vw;
            background: rgba(255, 255, 255, 0.1);
            padding: 3vw 6vw;
            border-radius: 60px;
            border: 4px solid rgba(255, 153, 255, 0.5);
            box-shadow: 0 10px 40px rgba(255, 0, 255, 0.2), inset 0 0 30px rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            position: relative;
        }

        .number, .operator, .question-mark {
            font-size: 9vmin;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(255, 153, 255, 0.8), 0 0 30px #00ffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .number-bubble {
            width: 15vmin;
            height: 15vmin;
            background: radial-gradient(circle at 30% 30%, #ff99ff, #9900ff);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 10px 10px 20px rgba(255,255,255,0.4), 0 10px 20px rgba(0,0,0,0.5);
            animation: morph-bubble 4s infinite alternate ease-in-out;
        }

        @keyframes morph-bubble {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: scale(1); }
            100% { border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%; transform: scale(1.05); }
        }

        .question-mark {
            width: 15vmin;
            height: 15vmin;
            background: rgba(0, 0, 0, 0.3);
            border: 4px dashed #00ffff;
            border-radius: 50%;
            color: #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
            animation: pulse-q 2s infinite alternate;
        }

        @keyframes pulse-q {
            0% { transform: scale(0.95); box-shadow: 0 0 10px rgba(0, 255, 255, 0.4); }
            100% { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 255, 255, 1); }
        }

        .options-container {
            display: flex;
            gap: 4vw;
        }

        .option-btn {
            width: 14vmin;
            height: 14vmin;
            font-size: 7vmin;
            font-weight: 900;
            color: #fff;
            background: radial-gradient(circle at 30% 30%, #00ffff, #0066ff);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 5px 5px 15px rgba(255,255,255,0.5);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        .option-btn:hover {
            transform: scale(1.2) rotate(15deg);
            filter: brightness(1.2) drop-shadow(0 0 20px #00ffff);
        }

        /* --- Екран Plinko --- */
        #plinko-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #drop-zone-indicator {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 15vh;
            background: linear-gradient(to bottom, rgba(255, 0, 255, 0.2), transparent);
            z-index: 6;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 2vh;
        }
        
        .arrow-down {
            width: 0; 
            height: 0; 
            border-left: 2.5vw solid transparent;
            border-right: 2.5vw solid transparent;
            border-top: 3.5vw solid #ff00ff;
            animation: bounce 1s infinite;
            filter: drop-shadow(0 0 15px #ff00ff);
        }

        #next-btn {
            position: absolute;
            bottom: 4vh;
            right: 4vw;
            background: linear-gradient(45deg, #ff00a0, #7a00ff);
            border: 3px solid #ff99ff;
            color: #fff;
            padding: 1.5vh 3vw;
            border-radius: 40px;
            font-size: 3vmin;
            font-weight: 900;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: inherit;
        }

        #next-btn:hover {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 15px 30px rgba(255,0,255,0.6), inset 0 0 20px rgba(255,255,255,0.8);
        }

        #start-drop-btn {
            position: absolute;
            top: 20vh;
            right: 4vw;
            background: linear-gradient(45deg, #00ff00, #008000);
            border: 3px solid #ccffcc;
            color: #fff;
            padding: 1.5vh 3vw;
            border-radius: 40px;
            font-size: 3vmin;
            font-weight: 900;
            cursor: pointer;
            z-index: 25;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.3s;
            font-family: inherit;
            display: none;
        }
        #start-drop-btn:hover {
            transform: scale(1.1);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(15px); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(0); }
            25% { transform: translateX(-15px) rotate(-10deg); }
            50% { transform: translateX(15px) rotate(10deg); }
            75% { transform: translateX(-15px) rotate(-10deg); }
        }
        .shake-anim { animation: shake 0.5s ease-in-out; }

        /* --- Блок контролю доступу --- */
        #block-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9); z-index: 100000;
            display: none; justify-content: center; align-items: center;
            color: red; font-size: 5vw; font-weight: bold; text-align: center;
            font-family: Arial, sans-serif;
        }
        
        #zoom-controls {
            position: fixed; top: 20px; left: 20px; z-index: 90001;
            display: flex; gap: 10px;
        }
        .zoom-btn {
            background: rgba(255,255,255,0.2); border: 2px solid #fff;
            color: #fff; font-size: 24px; width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer; backdrop-filter: blur(5px);
        }

        .secret-input { color: transparent !important; }
        .secret-input::selection { color: transparent !important; background: transparent !important; }

        /* --- Theme Manager UI --- */
        #theme-manager-btn {
            position: fixed; bottom: 20px; right: 20px; z-index: 90002;
            background: #34495e; color: white; border: none; border-radius: 50%;
            width: 50px; height: 50px; font-size: 24px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #theme-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95); width: 80vw; max-width: 600px; max-height: 60vh;
            border-radius: 15px; padding: 20px; z-index: 90003; display: none;
            overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            font-family: Arial, sans-serif;
        }
        #theme-modal h3 { margin-top: 0; text-align: center; color: #333; }
        #theme-close {
            position: absolute; top: 15px; right: 20px; font-size: 20px;
            cursor: pointer; color: #333;
        }
        .theme-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px;
        }
        .theme-card {
            position: relative; width: 100%; padding-top: 56.25%;
            border-radius: 8px; overflow: hidden; cursor: pointer;
            border: 3px solid transparent; transition: 0.2s;
            background-size: cover; background-position: center;
            background-color: #555;
        }
        .theme-card:hover { border-color: #8e44ad; transform: scale(1.05); }
        .theme-card span {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.6); color: white; text-align: center;
            padding: 5px 0; font-size: 12px; font-weight: bold;
        }

        /* --- Глобальний інструмент малювання --- */
        #drawing-canvas-global {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 90000;
        }
        #toggle-draw-btn-global {
            position: fixed; bottom: 85px; right: 20px; z-index: 90002;
            background: #8e44ad; color: white; border: none; border-radius: 25px;
            padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-family: Arial, sans-serif;
        }
        #draw-panel-global {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 10px;
            z-index: 90003; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            font-family: Arial, sans-serif; min-width: 300px;
        }
        .draw-header {
            cursor: grab; background: #eee; padding: 5px; border-radius: 5px;
            text-align: center; margin-bottom: 10px; font-weight: bold; color: #333;
        }
        .draw-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;}
        .draw-btn {
            padding: 5px 10px; border: 1px solid #ccc; border-radius: 5px;
            background: #fff; cursor: pointer; font-weight: bold;
        }
        .draw-btn.active { background: #8e44ad; color: #fff; border-color: #8e44ad; }
        .draw-close { position: absolute; top: 10px; right: 10px; cursor: pointer; font-weight: bold; }
        
        @media (max-width: 600px) {
            #start-drop-btn { top: 18vh; right: 50%; transform: translateX(50%); }
            #next-btn { bottom: 1vh; right: 50%; transform: translateX(50%); }
        }
    </style>
</head>
<body>

    <!-- Екран блокування -->
    <div id="block-overlay">Зачекай! Зараз не твій урок.</div>

    <!-- Лупа -->
    <div id="zoom-controls">
        <button class="zoom-btn" onclick="changeZoom(0.1)">+</button>
        <button class="zoom-btn" onclick="changeZoom(-0.1)">-</button>
    </div>

    <!-- Theme Manager UI -->
    <button id="theme-manager-btn">⚙️</button>
    <div id="theme-modal">
        <span id="theme-close">✕</span>
        <h3>Виберіть фон</h3>
        <div class="theme-grid" id="theme-grid"></div>
    </div>

    <!-- Інструмент малювання -->
    <canvas id="drawing-canvas-global"></canvas>
    <button id="toggle-draw-btn-global">✏️ Малювати</button>
    <div id="draw-panel-global">
        <div class="draw-close" id="draw-close-btn">✕</div>
        <div class="draw-header" id="draw-drag-handle">≡ Перетягнути ≡</div>
        <div class="draw-controls">
            <button class="draw-btn active" id="tool-pen">✏️ Олівець</button>
            <button class="draw-btn" id="tool-eraser">🧽 Гумка</button>
            <input type="range" id="draw-size" min="1" max="50" value="5">
            <input type="color" id="draw-color" value="#ff0000">
            <button class="draw-btn" id="tool-clear">🗑️ Очистити</button>
        </div>
    </div>

    <!-- Складне живе SVG тло -->
    <svg id="svg-bg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1200 800">
        <defs>
            <radialGradient id="nebulaPink" cx="30%" cy="30%" r="60%">
                <stop offset="0%" stop-color="rgba(255, 0, 128, 0.5)" />
                <stop offset="50%" stop-color="rgba(128, 0, 255, 0.2)" />
                <stop offset="100%" stop-color="transparent" />
            </radialGradient>
            <radialGradient id="nebulaCyan" cx="70%" cy="70%" r="50%">
                <stop offset="0%" stop-color="rgba(0, 255, 255, 0.4)" />
                <stop offset="100%" stop-color="transparent" />
            </radialGradient>
            <linearGradient id="crystalGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff99cc" />
                <stop offset="50%" stop-color="#9900ff" />
                <stop offset="100%" stop-color="#000066" />
            </linearGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="8" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>
        
        <rect width="100%" height="100%" fill="#0b001a" />
        <circle cx="300" cy="200" r="500" fill="url(#nebulaPink)" class="magic-cloud" />
        <circle cx="900" cy="600" r="600" fill="url(#nebulaCyan)" class="magic-cloud" style="animation-delay: -5s;" />
        
        <g class="floating-crystal" transform="translate(900, 150)" opacity="0.6">
            <polygon points="0,-100 40,0 0,150 -40,0" fill="url(#crystalGrad)" filter="url(#glow)"/>
            <polygon points="0,-100 40,0 0,150" fill="rgba(255,255,255,0.2)"/>
        </g>
        <g class="floating-crystal" transform="translate(150, 650) scale(0.6) rotate(30)" opacity="0.4">
            <polygon points="0,-100 40,0 0,150 -40,0" fill="url(#crystalGrad)"/>
            <polygon points="0,-100 -40,0 0,150" fill="rgba(255,255,255,0.2)"/>
        </g>

        <g id="stars-group" fill="#fff">
            <circle cx="100" cy="100" r="3" class="stardust" style="animation-duration: 3s;" />
            <circle cx="250" cy="300" r="4" class="stardust" style="animation-duration: 4.5s; animation-delay: 1s;" />
            <circle cx="800" cy="200" r="2" class="stardust" style="animation-duration: 2s;" />
            <circle cx="1050" cy="500" r="5" class="stardust" style="animation-duration: 5s; animation-delay: 2s;" />
            <circle cx="400" cy="700" r="3" class="stardust" style="animation-duration: 3.5s;" />
            <circle cx="600" cy="150" r="4" class="stardust" style="animation-duration: 4s; animation-delay: 0.5s;" />
        </g>
        
        <path d="M 0 750 Q 600 680 1200 750 L 1200 800 L 0 800 Z" fill="rgba(255, 0, 255, 0.1)" />
        <path d="M 0 750 Q 600 680 1200 750" fill="none" stroke="#00ffff" stroke-width="3" filter="url(#glow)" opacity="0.5"/>
    </svg>

    <div id="game-container">
        <!-- Персонаж "Аксолотль Лум" -->
        <svg id="character" viewBox="0 0 250 250">
            <defs>
                <radialGradient id="axoBody" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" stop-color="#ffb3ff" />
                    <stop offset="80%" stop-color="#ff4df2" />
                    <stop offset="100%" stop-color="#b300b3" />
                </radialGradient>
                <linearGradient id="gillGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#00ffff" />
                    <stop offset="100%" stop-color="#0066ff" />
                </linearGradient>
            </defs>
            
            <path class="axo-tail" d="M 125 180 Q 50 240 20 180 Q 80 150 125 180" fill="url(#axoBody)" />
            <path class="axo-tail" d="M 100 170 Q 30 250 10 180 Q 40 140 100 170" fill="rgba(0, 255, 255, 0.4)" />

            <g class="gill-left">
                <path d="M 85 110 Q 30 60 40 90 Q 60 115 85 115" fill="url(#gillGrad)" />
                <path d="M 85 120 Q 20 100 30 130 Q 50 135 85 125" fill="url(#gillGrad)" />
                <path d="M 85 130 Q 30 150 50 170 Q 70 150 85 135" fill="url(#gillGrad)" />
            </g>
            
            <g class="gill-right">
                <path d="M 165 110 Q 220 60 210 90 Q 190 115 165 115" fill="url(#gillGrad)" />
                <path d="M 165 120 Q 230 100 220 130 Q 200 135 165 125" fill="url(#gillGrad)" />
                <path d="M 165 130 Q 220 150 200 170 Q 180 150 165 135" fill="url(#gillGrad)" />
            </g>

            <ellipse cx="125" cy="130" rx="45" ry="40" fill="url(#axoBody)" />
            
            <g id="face-idle">
                <ellipse cx="110" cy="125" rx="6" ry="10" fill="#1a0033" />
                <circle cx="108" cy="122" r="2.5" fill="#fff" />
                <ellipse cx="140" cy="125" rx="6" ry="10" fill="#1a0033" />
                <circle cx="138" cy="122" r="2.5" fill="#fff" />
                <path d="M 120 140 Q 125 145 130 140" fill="none" stroke="#1a0033" stroke-width="3" stroke-linecap="round"/>
            </g>

            <g id="face-happy" style="display:none;">
                <path d="M 105 125 Q 110 115 115 125" fill="none" stroke="#1a0033" stroke-width="3" stroke-linecap="round"/>
                <path d="M 135 125 Q 140 115 145 125" fill="none" stroke="#1a0033" stroke-width="3" stroke-linecap="round"/>
                <path d="M 118 138 Q 125 155 132 138 Z" fill="#ff0066" />
                <path d="M 122 145 Q 125 150 128 145 Z" fill="#ff99cc" />
            </g>

            <g id="face-sad" style="display:none;">
                <circle cx="110" cy="125" r="7" fill="#1a0033" />
                <circle cx="140" cy="125" r="7" fill="#1a0033" />
                <path d="M 105 115 L 115 120" stroke="#1a0033" stroke-width="3" stroke-linecap="round"/>
                <path d="M 145 115 L 135 120" stroke="#1a0033" stroke-width="3" stroke-linecap="round"/>
                <path d="M 120 145 Q 125 138 130 145" fill="none" stroke="#1a0033" stroke-width="3" stroke-linecap="round"/>
            </g>
            
            <ellipse cx="95" cy="135" rx="8" ry="4" fill="#ff0066" opacity="0.4" />
            <ellipse cx="155" cy="135" rx="8" ry="4" fill="#ff0066" opacity="0.4" />

            <circle cx="125" cy="120" r="70" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(0, 255, 255, 0.6)" stroke-width="4" />
            <path class="glass-helmet" d="M 70 90 A 60 60 0 0 1 110 55" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5" />
            
            <ellipse cx="125" cy="190" rx="35" ry="10" fill="#00ffff" />
            <ellipse cx="125" cy="185" rx="35" ry="10" fill="#ccffff" />
        </svg>

        <div id="math-screen">
            <div class="equation-box" id="eq-box">
                <div class="number-bubble"><span class="number" id="part1"></span></div>
                <div class="operator">+</div>
                <div class="question-mark">?</div>
                <div class="operator">=</div>
                <div class="number-bubble" style="background: radial-gradient(circle at 30% 30%, #00ffff, #00cc99);">
                    <span class="number" id="target-sum"></span>
                </div>
            </div>
            <div class="options-container" id="options"></div>
        </div>

        <div id="drop-zone-indicator">
            <div class="arrow-down"></div>
        </div>

        <div id="plinko-screen">
            <canvas id="canvas"></canvas>
            <button id="start-drop-btn">Запустити!</button>
        </div>

        <button id="next-btn">Магія ➦</button>
    </div>

<script>
    // ==========================================
    // 1. КОНФІГУРАЦІЯ ТА FIREBASE
    // ==========================================
    const CONFIG = {
        gameId: 'magic_nebula_drop',
        bgBaseUrl: 'https://olgazheltvai2.github.io/images/backgrounds/'
    };

    const firebaseConfig = {
        databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
        projectId: "lesson-13c44"
    };

    let db = null;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
    } catch (e) {
        console.warn("Firebase не ініціалізовано. Гра працюватиме локально.");
    }

    // ==========================================
    // 2. ІДЕНТИФІКАЦІЯ ТА КОНТРОЛЬ ДОСТУПУ
    // ==========================================
    let myName = sessionStorage.getItem('userName');
    if (!myName) {
        const urlParams = new URLSearchParams(window.location.search);
        myName = urlParams.get('user');
        if (myName) {
            sessionStorage.setItem('userName', myName);
        } else {
            myName = 'Гість_' + Math.floor(Math.random() * 1000);
            sessionStorage.setItem('userName', myName);
        }
    }
    
    const tabId = Math.random().toString(36).substr(2, 9);
    const senderId = myName + '_' + tabId;
    let isRemoteAction = false;

    if (db) {
        const myPresenceRef = db.ref(`online_users/${myName}/${tabId}`);
        db.ref('.info/connected').on('value', snap => {
            if (snap.val() === true) {
                myPresenceRef.set(true);
                myPresenceRef.onDisconnect().remove();
            }
        });
        window.addEventListener('beforeunload', () => myPresenceRef.remove());

        db.ref(`blocked_users/${myName}`).on('value', snap => {
            document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
        });

        let isInitialRefresh = true;
        db.ref('force_refresh').on('value', snap => {
            if (isInitialRefresh) {
                isInitialRefresh = false;
                return; 
            }
            if (snap.val() && !isRemoteAction) location.reload();
        });

        let isInitialLobbyCheck = true;
        setTimeout(() => {
            db.ref('current_activity').on('value', snap => {
                if (isInitialLobbyCheck) {
                    isInitialLobbyCheck = false;
                    return;
                }
                if (snap.val() === 'lobby') {
                    window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
                }
            });
        }, 1000);
    }

    // ==========================================
    // 3. СИСТЕМА ДИНАМІЧНИХ ФОНІВ (THEME MANAGER)
    // ==========================================
    const themeModal = document.getElementById('theme-modal');
    const themeGrid = document.getElementById('theme-grid');
    const svgBg = document.getElementById('svg-bg');

    function applyTheme(url) {
        if (url === 'none') {
            document.body.style.backgroundImage = 'none';
            svgBg.style.display = 'block';
        } else {
            document.body.style.backgroundImage = `url('${url}')`;
            svgBg.style.display = 'none';
        }
        localStorage.setItem('mySavedBg_' + CONFIG.gameId, url);
    }

    const savedBg = localStorage.getItem('mySavedBg_' + CONFIG.gameId);
    if (savedBg) applyTheme(savedBg);

    if (db) {
        db.ref('game_theme').on('value', snap => {
            const themeUrl = snap.val();
            if (themeUrl && !isRemoteAction) {
                applyTheme(themeUrl);
            }
        });
    }

    async function loadBackgrounds() {
        themeGrid.innerHTML = `
            <div class="theme-card" style="background-color: #333;" onclick="selectTheme('none')">
                <span>Без фону</span>
            </div>
        `;
        let i = 1;
        while (true) {
            const url = `${CONFIG.bgBaseUrl}background_${i}.webp`;
            try {
                const res = await fetch(url, { method: 'HEAD' });
                if (res.ok) {
                    const div = document.createElement('div');
                    div.className = 'theme-card';
                    div.style.backgroundImage = `url('${url}')`;
                    div.innerHTML = `<span>Фон ${i}</span>`;
                    div.onclick = () => selectTheme(url);
                    themeGrid.appendChild(div);
                    i++;
                } else {
                    break;
                }
            } catch (e) {
                break;
            }
        }
    }

    function selectTheme(url) {
        applyTheme(url);
        if (db) {
            isRemoteAction = true;
            db.ref('game_theme').set(url).then(() => isRemoteAction = false);
        }
        themeModal.style.display = 'none';
    }

    document.getElementById('theme-manager-btn').onclick = () => {
        themeModal.style.display = 'block';
        if (themeGrid.children.length <= 1) loadBackgrounds();
    };
    document.getElementById('theme-close').onclick = () => themeModal.style.display = 'none';

    // ==========================================
    // 4. ГЛОБАЛЬНИЙ ІНСТРУМЕНТ МАЛЮВАННЯ
    // ==========================================
    const drawCanvas = document.getElementById('drawing-canvas-global');
    const drawCtx = drawCanvas.getContext('2d');
    const drawPanel = document.getElementById('draw-panel-global');
    let isDrawingGlobal = false;
    let drawModeActive = false;
    let drawCurrentTool = 'pen';
    let lastX = 0, lastY = 0;

    function resizeDrawCanvas() {
        drawCanvas.width = window.innerWidth;
        drawCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeDrawCanvas);
    resizeDrawCanvas();

    document.getElementById('toggle-draw-btn-global').onclick = () => {
        drawPanel.style.display = 'block';
        drawModeActive = true;
        drawCanvas.style.pointerEvents = 'all';
    };

    document.getElementById('draw-close-btn').onclick = () => {
        drawPanel.style.display = 'none';
        drawModeActive = false;
        drawCanvas.style.pointerEvents = 'none';
    };

    document.getElementById('tool-pen').onclick = (e) => { drawCurrentTool = 'pen'; updateDrawBtns(e.target); };
    document.getElementById('tool-eraser').onclick = (e) => { drawCurrentTool = 'eraser'; updateDrawBtns(e.target); };
    function updateDrawBtns(activeBtn) {
        document.querySelectorAll('.draw-btn').forEach(b => b.classList.remove('active'));
        activeBtn.classList.add('active');
    }

    function getDrawCoords(e) {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX / globalZoom, y: clientY / globalZoom };
    }

    function drawLine(x0, y0, x1, y1, color, size, tool, emit) {
        drawCtx.beginPath();
        drawCtx.moveTo(x0, y0);
        drawCtx.lineTo(x1, y1);
        drawCtx.strokeStyle = tool === 'eraser' ? 'rgba(0,0,0,1)' : color;
        drawCtx.lineWidth = size;
        drawCtx.lineCap = 'round';
        if (tool === 'eraser') drawCtx.globalCompositeOperation = 'destination-out';
        else drawCtx.globalCompositeOperation = 'source-over';
        drawCtx.stroke();
        drawCtx.closePath();

        if (!emit || !db) return;
        const actionId = Date.now() + '_' + Math.random().toString(36).substr(2,9);
        db.ref('game_action').set({
            senderId: senderId, timestamp: firebase.database.ServerValue.TIMESTAMP, actionId: actionId,
            type: 'draw_line',
            data: { x0: x0/drawCanvas.width, y0: y0/drawCanvas.height, x1: x1/drawCanvas.width, y1: y1/drawCanvas.height, color, size, tool }
        });
    }

    function clearCanvas(emit) {
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        if (!emit || !db) return;
        const actionId = Date.now() + '_' + Math.random();
        db.ref('game_action').set({
            senderId: senderId, timestamp: firebase.database.ServerValue.TIMESTAMP, actionId: actionId,
            type: 'clear_canvas'
        });
    }

    document.getElementById('tool-clear').onclick = () => clearCanvas(true);

    const startDraw = (e) => {
        if (!drawModeActive) return;
        isDrawingGlobal = true;
        const pos = getDrawCoords(e);
        lastX = pos.x; lastY = pos.y;
    };
    const moveDraw = (e) => {
        if (!isDrawingGlobal || !drawModeActive) return;
        e.preventDefault(); 
        const pos = getDrawCoords(e);
        const color = document.getElementById('draw-color').value;
        const size = document.getElementById('draw-size').value;
        drawLine(lastX, lastY, pos.x, pos.y, color, size, drawCurrentTool, true);
        lastX = pos.x; lastY = pos.y;
    };
    const stopDraw = () => { isDrawingGlobal = false; };

    drawCanvas.addEventListener('mousedown', startDraw);
    drawCanvas.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', stopDraw);
    drawCanvas.addEventListener('touchstart', startDraw, {passive: false});
    drawCanvas.addEventListener('touchmove', moveDraw, {passive: false});
    window.addEventListener('touchend', stopDraw);

    const dragHandle = document.getElementById('draw-drag-handle');
    let isDraggingPanel = false;
    let pStartX, pStartY, pStartLeft, pStartTop;
    dragHandle.onmousedown = dragHandle.ontouchstart = (e) => {
        isDraggingPanel = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        pStartX = clientX; pStartY = clientY;
        const rect = drawPanel.getBoundingClientRect();
        pStartLeft = rect.left; pStartTop = rect.top;
    };
    window.onmousemove = window.ontouchmove = (e) => {
        if (!isDraggingPanel) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const dx = clientX - pStartX; const dy = clientY - pStartY;
        drawPanel.style.left = pStartLeft + dx + 'px';
        drawPanel.style.top = pStartTop + dy + 'px';
        drawPanel.style.transform = 'none';
    };
    window.onmouseup = window.ontouchend = () => { isDraggingPanel = false; };

    // ==========================================
    // 5. ЛУПА ТА ЗУМ (МАСШТАБУВАННЯ)
    // ==========================================
    let globalZoom = 1;
    function changeZoom(delta) {
        globalZoom += delta;
        if(globalZoom < 0.5) globalZoom = 0.5;
        if(globalZoom > 2) globalZoom = 2;
        document.body.style.zoom = globalZoom; 
    }

    // ==========================================
    // 6. ЛОГІКА ТА СИНХРОНІЗАЦІЯ ГРИ 
    // ==========================================
    const mathScreen = document.getElementById('math-screen');
    const plinkoScreen = document.getElementById('plinko-screen');
    const dropIndicator = document.getElementById('drop-zone-indicator');
    const startDropBtn = document.getElementById('start-drop-btn');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const character = document.getElementById('character');
    
    const fIdle = document.getElementById('face-idle');
    const fHappy = document.getElementById('face-happy');
    const fSad = document.getElementById('face-sad');
    
    let currentAnswer = 0;
    let gameState = 'MATH'; 
    let balls = [];
    let pegs = [];
    let particles = [];
    let animFrame = null;
    let gateHeight = 50;
    let myPlayerColor = `hsl(${Math.random()*360}, 100%, 50%)`;
    let hasPlacedBall = false;

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx = null;

    function initAudio() {
        if (!actx) actx = new AudioContext();
        if (actx.state === 'suspended') actx.resume();
    }

    function playTone(type) {
        if (!actx) return;
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.connect(gain);
        gain.connect(actx.destination);
        const now = actx.currentTime;

        if (type === 'pop') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
            gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'error') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'bounce') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(800 + Math.random()*600, now);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'win') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(783.99, now + 0.2); osc.frequency.setValueAtTime(1046.50, now + 0.3);
            gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.8);
            osc.start(now); osc.stop(now + 0.8);
        } else if (type === 'lose') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(150, now + 0.6);
            gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0, now + 0.6);
            osc.start(now); osc.stop(now + 0.6);
        }
    }

    function setAxoMood(mood) {
        fIdle.style.display = 'none'; fHappy.style.display = 'none'; fSad.style.display = 'none';
        character.className = '';
        if(mood === 'happy') { fHappy.style.display = 'block'; character.classList.add('char-happy'); } 
        else if(mood === 'sad') { fSad.style.display = 'block'; character.classList.add('char-sad'); } 
        else { fIdle.style.display = 'block'; }
    }

    function updateCharacterVisibility() {
        character.style.display = (gameState === 'MATH') ? 'block' : 'none';
    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function sendGameAction(type, data) {
        if (!db) {
            processGameAction(type, data, true);
            return;
        }
        const actionId = Date.now() + '_' + Math.random().toString(36).substr(2,9);
        db.ref('game_action').set({
            senderId: senderId, timestamp: firebase.database.ServerValue.TIMESTAMP, actionId: actionId,
            type: type, data: data || {}
        });
    }

    let lastActionId = null;
    if (db) {
        db.ref('game_action').on('value', snap => {
            const val = snap.val();
            if (!val || val.actionId === lastActionId) return;
            lastActionId = val.actionId;
            isRemoteAction = true;
            
            if (val.type === 'draw_line') {
                drawLine(val.data.x0*drawCanvas.width, val.data.y0*drawCanvas.height, val.data.x1*drawCanvas.width, val.data.y1*drawCanvas.height, val.data.color, val.data.size, val.data.tool, false);
            } else if (val.type === 'clear_canvas') {
                clearCanvas(false);
            } else {
                processGameAction(val.type, val.data, false);
            }
            isRemoteAction = false;
        });
    }

    function processGameAction(type, data, isLocal) {
        if (type === 'NEW_MATH') applyNewMath(data);
        else if (type === 'MATH_SOLVED') applyMathSolved(data.pegs);
        else if (type === 'PLACE_BALL') { balls.push(data); playTone('pop'); }
        else if (type === 'START_DROP') triggerDrop();
    }

    function startMath() {
        const target = Math.floor(Math.random() * 9) + 2;
        const part1 = Math.floor(Math.random() * (target - 1)) + 1;
        const answer = target - part1;

        let options = [answer];
        while(options.length < 3) {
            let r = Math.floor(Math.random() * 10) + 1;
            if(!options.includes(r)) options.push(r);
        }
        options.sort(() => Math.random() - 0.5);

        sendGameAction('NEW_MATH', { target, part1, options, answer });
    }

    function applyNewMath(data) {
        gameState = 'MATH';
        cancelAnimationFrame(animFrame);
        balls = []; particles = []; hasPlacedBall = false;
        setAxoMood('idle');
        updateCharacterVisibility();
        
        mathScreen.style.opacity = '1'; 
        mathScreen.style.pointerEvents = 'all'; // Активуємо кліки на прикладі
        plinkoScreen.style.opacity = '0'; 
        plinkoScreen.style.pointerEvents = 'none';
        dropIndicator.style.opacity = '0'; 
        startDropBtn.style.display = 'none';

        currentAnswer = data.answer;
        document.getElementById('part1').innerText = data.part1;
        document.getElementById('target-sum').innerText = data.target;

        const optsContainer = document.getElementById('options');
        optsContainer.innerHTML = '';
        data.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn'; btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, btn);
            optsContainer.appendChild(btn);
        });
    }

    function checkAnswer(ans, btn) {
        initAudio();
        if(ans === currentAnswer) {
            playTone('pop');
            setAxoMood('happy');
            
            // Локально ховаємо, щоб миттєво не заважало
            mathScreen.style.opacity = '0';
            mathScreen.style.pointerEvents = 'none';
            
            setTimeout(() => {
                const newPegs = generatePegsData();
                sendGameAction('MATH_SOLVED', { pegs: newPegs });
            }, 800);
        } else {
            playTone('error'); setAxoMood('sad');
            const eqBox = document.getElementById('eq-box');
            eqBox.classList.remove('shake-anim'); void eqBox.offsetWidth; eqBox.classList.add('shake-anim');
            btn.style.transform = 'scale(0.8) rotate(-10deg)';
            setTimeout(() => { btn.style.transform = ''; if(gameState === 'MATH') setAxoMood('idle'); }, 500);
        }
    }

    function generatePegsData() {
        let tempPegs = [];
        const rows = Math.floor(canvas.height / 80) - 2;
        const cols = Math.floor(canvas.width / 90);
        const startY = canvas.height * 0.25;

        for(let i=0; i<rows; i++) {
            for(let j=1; j<=cols; j++) {
                let offset = (i % 2 === 0) ? 45 : 0;
                let x = j * 90 + offset - 45 + (Math.random()*40 - 20);
                let y = startY + i * 80 + (Math.random()*30 - 15);
                if(x > 30 && x < canvas.width - 30) {
                    tempPegs.push({
                        x: x, y: y, r: 12 + Math.random()*8, 
                        rot: Math.random() * Math.PI, 
                        color: `hsl(${Math.random()*60 + 280}, 100%, 70%)` 
                    });
                }
            }
        }
        return tempPegs;
    }

    function applyMathSolved(pegsData) {
        gameState = 'DROP';
        updateCharacterVisibility();
        
        // --- ВИПРАВЛЕННЯ ---
        // Цей код виконається у ВСІХ гравців, тому ми примусово 
        // вимикаємо видимість та кліки для екрану з прикладом!
        mathScreen.style.opacity = '0';
        mathScreen.style.pointerEvents = 'none'; 

        plinkoScreen.style.opacity = '1'; 
        plinkoScreen.style.pointerEvents = 'all'; // Відкриваємо доступ до Canvas
        dropIndicator.style.opacity = '1'; 
        startDropBtn.style.display = 'block';
        pegs = pegsData;
        
        cancelAnimationFrame(animFrame);
        animate();
    }

    canvas.addEventListener('pointerdown', (e) => {
        if(gameState !== 'DROP') return;
        if(e.clientY > canvas.height * 0.25) return; 
        if(hasPlacedBall) return; 

        initAudio();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const cx = (e.clientX - rect.left) * scaleX;
        const cy = (e.clientY - rect.top) * scaleY;

        hasPlacedBall = true;
        sendGameAction('PLACE_BALL', {
            x: cx, y: cy, vx: (Math.random() - 0.5) * 2, vy: 0,
            r: 18, color: myPlayerColor, owner: myName
        });
    });

    startDropBtn.addEventListener('click', () => {
        if(gameState !== 'DROP') return;
        sendGameAction('START_DROP');
    });

    function triggerDrop() {
        gameState = 'PLAY';
        dropIndicator.style.opacity = '0';
        startDropBtn.style.display = 'none';
    }

    function spawnParticles(x, y, color, count) {
        for(let i=0; i<count; i++) {
            particles.push({
                x: x, y: y, vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
                life: 1, color: color, size: Math.random() * 3 + 1
            });
        }
    }

    function drawCrystal(x, y, radius, rot, color) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
        ctx.shadowBlur = 15; ctx.shadowColor = color;
        ctx.beginPath(); ctx.moveTo(0, -radius); ctx.lineTo(radius*0.7, 0);
        ctx.lineTo(0, radius); ctx.lineTo(-radius*0.7, 0); ctx.closePath();
        ctx.fillStyle = color; ctx.fill();
        ctx.beginPath(); ctx.moveTo(0, -radius); ctx.lineTo(0, radius);
        ctx.lineTo(-radius*0.7, 0); ctx.closePath();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.stroke();
        ctx.restore();
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
        ctx.fillRect(0, canvas.height - gateHeight, canvas.width, gateHeight);
        ctx.shadowBlur = 20; ctx.shadowColor = '#00ffff'; ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 3; ctx.beginPath();
        ctx.moveTo(0, canvas.height - gateHeight); ctx.lineTo(canvas.width, canvas.height - gateHeight);
        ctx.stroke(); ctx.shadowBlur = 0;

        pegs.forEach(p => {
            p.rot += 0.02; drawCrystal(p.x, p.y, p.r, p.rot, p.color);
        });

        let activeBalls = false;

        balls.forEach(b => {
            if(gameState === 'PLAY') {
                b.vy += 0.25; b.vx *= 0.99; b.vy *= 0.99;
                b.x += b.vx; b.y += b.vy;
                if(b.y < canvas.height - gateHeight + b.r) activeBalls = true;

                if(b.x < b.r) { b.x = b.r; b.vx *= -0.7; }
                if(b.x > canvas.width - b.r) { b.x = canvas.width - b.r; b.vx *= -0.7; }

                pegs.forEach(p => {
                    let dx = b.x - p.x; let dy = b.y - p.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < b.r + p.r * 0.8) { 
                        let overlap = (b.r + p.r * 0.8) - dist;
                        let nx = dx / dist; let ny = dy / dist;
                        b.x += nx * overlap; b.y += ny * overlap;
                        let dot = b.vx * nx + b.vy * ny;
                        b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny;
                        b.vx += (Math.random() - 0.5) * 3; 
                        b.vx *= 0.85; b.vy *= 0.85;
                        spawnParticles(p.x, p.y, p.color, 4); 
                        p.r += 3; setTimeout(() => p.r -= 3, 100);
                        if(Math.abs(b.vy) > 1 || Math.abs(b.vx) > 1) playTone('bounce');
                    }
                });

                if(b.y > canvas.height - gateHeight + b.r && !b.finished) {
                    b.finished = true;
                    spawnParticles(b.x, b.y, b.color, 100);
                    playTone('win');
                }
            }

            ctx.save(); ctx.translate(b.x, b.y);
            ctx.shadowBlur = 20; ctx.shadowColor = b.color;
            ctx.beginPath();
            for(let i=0; i<8; i++) {
                let angle = (i * Math.PI * 2) / 8 + (b.x * 0.05);
                ctx.moveTo(0,0); ctx.lineTo(Math.cos(angle)*b.r*1.5, Math.sin(angle)*b.r*1.5);
            }
            ctx.strokeStyle = b.color; ctx.lineWidth = 4; ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1;

            let grad = ctx.createRadialGradient(0, 0, 0, 0, 0, b.r);
            grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.5, b.color); grad.addColorStop(1, '#000');
            ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI*2);
            ctx.fillStyle = grad; ctx.fill();
            spawnParticles(b.x, b.y, b.color, 1); 
            ctx.restore();
        });

        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life -= 0.02;
            if(p.life <= 0) { particles.splice(i, 1); continue; }
            ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.shadowBlur = 10; ctx.shadowColor = p.color;
            ctx.beginPath(); ctx.moveTo(p.x, p.y - p.size); ctx.lineTo(p.x + p.size, p.y);
            ctx.lineTo(p.x, p.y + p.size); ctx.lineTo(p.x - p.size, p.y); ctx.fill();
        }
        ctx.globalAlpha = 1; ctx.shadowBlur = 0;

        if(gameState === 'PLAY' && !activeBalls && balls.length > 0) {
            gameState = 'END';
            setTimeout(startMath, 3500);
        }

        if(gameState === 'DROP' || gameState === 'PLAY' || gameState === 'END') {
            animFrame = requestAnimationFrame(animate);
        }
    }

    document.getElementById('next-btn').addEventListener('click', () => {
        initAudio();
        startMath();
    });

    startMath();

</script>
</body>
