<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Seaside Math Adventure</title>
  <!-- Load rounded Cyrillic-friendly font (Nunito) with clean system fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       RESET & FULL-VIEWPORT 16:9 ADAPTIVE LAYOUT
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Nunito', 'Trebuchet MS', 'Segoe UI', sans-serif;
      background: #1b7fa8;
    }

    /* Background living ocean & beach canvas */
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
    }

    /* Decorative swaying palms & beach umbrella layer */
    #scenery-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    /* Foreground celebration effects canvas (splashes, balls, bubbles, sand puffs) */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 25;
      pointer-events: none;
      display: block;
    }

    /* Main interactive game UI overlay */
    #ui-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(8px, 1.4vh, 18px) clamp(12px, 2vw, 32px) clamp(10px, 2vh, 24px);
      pointer-events: none;
    }

    #ui-layer button,
    .interactive {
      pointer-events: auto;
    }

    /* ==========================================================================
       SWAYING PALM FRONDS & BEACH UMBRELLA
       ========================================================================== */
    .palm-left {
      position: absolute;
      top: -2vh;
      left: -2vw;
      width: clamp(180px, 23vw, 390px);
      height: auto;
      transform-origin: 5% 8%;
      animation: palmSwayLeft 6.5s ease-in-out infinite;
      filter: drop-shadow(4px 8px 10px rgba(20, 45, 25, 0.25));
    }

    .palm-right {
      position: absolute;
      top: -2vh;
      right: -2vw;
      width: clamp(180px, 23vw, 390px);
      height: auto;
      transform-origin: 95% 8%;
      animation: palmSwayRight 7.2s ease-in-out infinite;
      filter: drop-shadow(-4px 8px 10px rgba(20, 45, 25, 0.25));
    }

    .beach-umbrella {
      position: absolute;
      bottom: 24vh;
      right: clamp(4px, 2vw, 36px);
      width: clamp(130px, 15vw, 240px);
      height: auto;
      transform-origin: 55% 95%;
      animation: umbrellaSway 5.5s ease-in-out infinite;
      filter: drop-shadow(-8px 14px 12px rgba(90, 58, 22, 0.28));
    }

    @keyframes palmSwayLeft {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(2.6deg) scale(1.01); }
    }

    @keyframes palmSwayRight {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(-2.4deg) scale(1.01); }
    }

    @keyframes umbrellaSway {
      0%, 100% { transform: rotate(-1.2deg); }
      50% { transform: rotate(1.6deg); }
    }

    /* ==========================================================================
       TOP BAR: LEVEL SHELLS, HANGING DRIFTWOOD QUESTION SIGN, CONTROLS
       ========================================================================== */
    .top-bar {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 12px;
      position: relative;
      z-index: 15;
    }

    /* Top-Left: 4 Stylized Seashell/Buoy Level Buttons */
    .level-bar {
      display: flex;
      align-items: center;
      gap: clamp(6px, 0.9vw, 14px);
      padding-top: 4px;
    }

    .level-btn {
      position: relative;
      width: clamp(48px, 4.4vw, 66px);
      height: clamp(48px, 4.4vw, 66px);
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s ease;
      filter: drop-shadow(0 5px 6px rgba(15, 55, 78, 0.35));
    }

    .level-btn svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .level-btn span {
      position: relative;
      z-index: 2;
      font-size: clamp(19px, 1.9vw, 28px);
      font-weight: 900;
      color: #4d260e;
      text-shadow: 0 1px 0 rgba(255, 245, 225, 0.85);
      margin-top: 3px;
    }

    .level-btn:hover {
      transform: translateY(-4px) scale(1.08);
    }

    .level-btn.active {
      animation: buoyBob 2.4s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(255, 224, 102, 0.95)) drop-shadow(0 6px 8px rgba(15, 55, 78, 0.38));
    }

    .level-btn.active span {
      color: #fff9e6;
      text-shadow: 0 2px 4px rgba(125, 42, 6, 0.85);
    }

    @keyframes buoyBob {
      0%, 100% { transform: translateY(0) rotate(-2deg) scale(1.1); }
      50% { transform: translateY(-6px) rotate(2deg) scale(1.12); }
    }

    /* Top-Center: Weathered Driftwood Question Banner */
    .question-banner-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -12px;
      transform-origin: top center;
      animation: signSwing 5.8s ease-in-out infinite;
    }

    @keyframes signSwing {
      0%, 100% { transform: rotate(-0.8deg); }
      50% { transform: rotate(0.8deg); }
    }

    .driftwood-sign {
      position: relative;
      width: clamp(290px, 34vw, 500px);
      height: clamp(68px, 9.2vh, 96px);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 8px 12px rgba(20, 42, 58, 0.36));
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .driftwood-sign.pop-in {
      animation: signPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes signPop {
      0% { transform: scale(0.86) rotate(-2deg); }
      60% { transform: scale(1.04) rotate(1deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .driftwood-sign > svg.sign-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .question-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1vw, 14px);
      padding: 12px 24px 0 24px;
    }

    .question-arrow-icon {
      width: clamp(28px, 2.6vw, 38px);
      height: clamp(28px, 2.6vw, 38px);
      flex-shrink: 0;
      filter: drop-shadow(0 2px 2px rgba(56, 26, 8, 0.55));
    }

    .question-text {
      font-size: clamp(19px, 2.25vw, 34px);
      font-weight: 900;
      color: #fff6df;
      letter-spacing: 0.4px;
      text-shadow:
        0 2px 0 #5b3114,
        0 4px 8px rgba(40, 18, 5, 0.55);
      white-space: nowrap;
    }

    /* Top-Right: Minimalist Controls (Lang, Sound, Next) */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: clamp(8px, 1vw, 14px);
      padding-top: 4px;
    }

    .wood-tag-btn {
      position: relative;
      width: clamp(66px, 5.8vw, 88px);
      height: clamp(44px, 4.2vw, 58px);
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 5px 6px rgba(15, 55, 78, 0.35));
    }

    .wood-tag-btn svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .wood-tag-btn span {
      position: relative;
      z-index: 2;
      font-size: clamp(15px, 1.4vw, 21px);
      font-weight: 900;
      color: #fff4d8;
      letter-spacing: 0.8px;
      text-shadow: 0 2px 2px rgba(68, 34, 10, 0.75);
    }

    .wood-tag-btn:hover {
      transform: translateY(-3px) scale(1.06);
    }

    .wood-tag-btn:active {
      transform: scale(0.94);
    }

    .icon-circle-btn {
      position: relative;
      width: clamp(46px, 4.2vw, 60px);
      height: clamp(46px, 4.2vw, 60px);
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 5px 6px rgba(15, 55, 78, 0.35));
    }

    .icon-circle-btn svg {
      width: 100%;
      height: 100%;
    }

    .icon-circle-btn:hover {
      transform: translateY(-3px) scale(1.08);
    }

    .icon-circle-btn:active {
      transform: scale(0.92);
    }

    /* ==========================================================================
       CENTER TASK STAGE (LEVEL 1 MATS OR LEVELS 2-4 SURFBOARDS/BUOYS/SIGNS)
       ========================================================================== */
    #task-stage {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 12;
      transition: opacity 0.32s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #task-stage.transition-out {
      opacity: 0;
      transform: scale(0.93) translateY(10px);
    }

    /* --- LEVEL 1: TWO STACKED WOVEN STRAW BEACH MATS --- */
    .mats-container {
      width: min(88vw, 1060px);
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.8vh, 22px);
      align-items: center;
      position: relative;
    }

    .straw-mat {
      position: relative;
      width: 100%;
      height: clamp(92px, 16.5vh, 148px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 clamp(26px, 3.8vw, 56px);
      filter: drop-shadow(0 10px 14px rgba(102, 66, 24, 0.34));
    }

    .straw-mat > svg.mat-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Aligned 1-to-1 grid so visual difference is immediately clear */
    .mat-items-grid {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 82%;
      display: grid;
      grid-template-columns: repeat(var(--cols, 10), 1fr);
      align-items: center;
      justify-items: center;
      gap: clamp(2px, 0.6vw, 8px);
    }

    .mat-item {
      width: min(100%, clamp(52px, 7.6vh, 92px));
      height: min(100%, clamp(52px, 7.6vh, 92px));
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: itemDropIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
      transition: transform 0.35s ease, filter 0.35s ease;
    }

    .mat-item svg {
      width: 94%;
      height: 94%;
      filter: drop-shadow(0 4px 4px rgba(72, 42, 12, 0.32));
    }

    @keyframes itemDropIn {
      0% { opacity: 0; transform: translateY(-18px) scale(0.5) rotate(-8deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    }

    /* Highlight extra unmatched items on Level 1 when solved */
    .mat-item.extra-highlight {
      transform: scale(1.16) translateY(-5px);
      filter: drop-shadow(0 0 14px rgba(255, 224, 72, 1)) drop-shadow(0 0 24px rgba(255, 166, 0, 0.85));
      z-index: 5;
    }

    .mat-item.extra-highlight::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 3px dashed #ffe066;
      animation: pulseRing 0.9s ease-in-out infinite;
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(0.95); opacity: 0.95; }
      50% { transform: scale(1.1); opacity: 0.55; }
    }

    /* Golden difference bracket overlay on the longer mat */
    .diff-bracket-bar {
      position: absolute;
      z-index: 6;
      bottom: -8px;
      height: 12px;
      border-bottom: 4px solid #ffd54f;
      border-left: 4px solid #ffd54f;
      border-right: 4px solid #ffd54f;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 4px 12px rgba(255, 193, 7, 0.8);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .diff-bracket-bar.visible {
      opacity: 1;
    }

    /* --- LEVELS 2, 3, 4: SIDE-BY-SIDE SEASIDE NUMBER PROPS --- */
    .numbers-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 4.5vw, 72px);
      width: min(86vw, 960px);
      padding-top: clamp(4px, 1.5vh, 18px);
    }

    .seaside-prop {
      position: relative;
      width: clamp(165px, 21vw, 275px);
      height: clamp(210px, 37vh, 330px);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 14px 18px rgba(68, 44, 16, 0.34));
      animation: propPlant 0.52s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
    }

    .seaside-prop.left-prop {
      transform: rotate(-3.5deg);
    }

    .seaside-prop.right-prop {
      transform: rotate(3.5deg);
      animation-delay: 0.08s;
    }

    @keyframes propPlant {
      0% { opacity: 0; transform: translateY(36px) scale(0.75); }
      100% { opacity: 1; }
    }

    .seaside-prop svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .prop-number {
      position: relative;
      z-index: 3;
      font-size: clamp(54px, 6.8vw, 96px);
      font-weight: 900;
      color: #fffaf0;
      text-shadow:
        0 4px 0 rgba(56, 28, 12, 0.72),
        0 8px 16px rgba(32, 16, 6, 0.45);
      line-height: 1;
      letter-spacing: -1px;
    }

    .prop-number.dark-ink {
      color: #3a1f0d;
      text-shadow:
        0 2px 0 rgba(255, 245, 224, 0.85),
        0 4px 10px rgba(80, 42, 12, 0.25);
    }

    .center-emblem {
      position: relative;
      width: clamp(78px, 8.2vw, 118px);
      height: clamp(78px, 8.2vw, 118px);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 8px 12px rgba(62, 38, 14, 0.34));
      animation: emblemFloat 3.4s ease-in-out infinite;
    }

    @keyframes emblemFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-7px) scale(1.04); }
    }

    .center-emblem svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .center-emblem span {
      position: relative;
      z-index: 2;
      font-size: clamp(34px, 3.8vw, 56px);
      font-weight: 900;
      color: #fff6dc;
      text-shadow: 0 3px 0 #703914;
    }

    /* ==========================================================================
       LOWER BEACH AREA: 5 TACTILE SEASHELL / PEBBLE ANSWERS IN A GENTLE ARC
       ========================================================================== */
    .answers-arc {
      width: min(92vw, 1020px);
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(12px, 2.6vw, 40px);
      padding-bottom: clamp(4px, 1.4vh, 18px);
      position: relative;
      z-index: 16;
    }

    .answer-btn {
      position: relative;
      width: clamp(78px, 8.8vw, 126px);
      height: clamp(74px, 8.4vw, 118px);
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.24s ease;
      filter: drop-shadow(0 10px 10px rgba(105, 68, 22, 0.38));
    }

    /* Gentle smile arc offsets */
    .answer-btn[data-idx="0"] { transform: translateY(-16px) rotate(-5deg); }
    .answer-btn[data-idx="1"] { transform: translateY(-4px) rotate(-2deg); }
    .answer-btn[data-idx="2"] { transform: translateY(4px) rotate(0deg); }
    .answer-btn[data-idx="3"] { transform: translateY(-4px) rotate(2deg); }
    .answer-btn[data-idx="4"] { transform: translateY(-16px) rotate(5deg); }

    .answer-btn:hover:not(:disabled) {
      filter: drop-shadow(0 16px 16px rgba(96, 58, 16, 0.44)) brightness(1.06);
    }

    .answer-btn[data-idx="0"]:hover:not(:disabled) { transform: translateY(-28px) rotate(-8deg) scale(1.1); }
    .answer-btn[data-idx="1"]:hover:not(:disabled) { transform: translateY(-16px) rotate(-4deg) scale(1.1); }
    .answer-btn[data-idx="2"]:hover:not(:disabled) { transform: translateY(-8px) rotate(2deg) scale(1.1); }
    .answer-btn[data-idx="3"]:hover:not(:disabled) { transform: translateY(-16px) rotate(4deg) scale(1.1); }
    .answer-btn[data-idx="4"]:hover:not(:disabled) { transform: translateY(-28px) rotate(8deg) scale(1.1); }

    .answer-btn svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .answer-btn span {
      position: relative;
      z-index: 2;
      font-size: clamp(28px, 3.1vw, 44px);
      font-weight: 900;
      color: #fffaf0;
      text-shadow:
        0 3px 0 rgba(58, 26, 10, 0.72),
        0 5px 10px rgba(34, 16, 4, 0.35);
      margin-top: 4px;
    }

    .answer-btn.dark-num span {
      color: #46230d;
      text-shadow:
        0 1.5px 0 rgba(255, 248, 232, 0.9),
        0 3px 6px rgba(80, 42, 12, 0.2);
    }

    /* Wrong answer gentle wobble */
    .answer-btn.wobble {
      animation: shellWobble 0.48s ease-in-out;
    }

    @keyframes shellWobble {
      0% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-9px) rotate(-9deg); }
      40% { transform: translateX(8px) rotate(8deg); }
      60% { transform: translateX(-6px) rotate(-6deg); }
      80% { transform: translateX(4px) rotate(4deg); }
      100% { transform: translateX(0) rotate(0deg); }
    }

    /* Correct answer joyful lift + golden pearl halo */
    .answer-btn.correct-chosen {
      transform: translateY(-26px) scale(1.22) !important;
      filter: drop-shadow(0 0 22px rgba(255, 230, 110, 1)) drop-shadow(0 14px 18px rgba(88, 52, 10, 0.42)) !important;
      z-index: 20;
    }

    .answer-btn.dimmed {
      opacity: 0.45;
      transform: scale(0.92) !important;
      pointer-events: none;
    }

    /* Responsive adjustments for shorter viewports */
    @media (max-height: 640px) {
      .straw-mat { height: clamp(78px, 15vh, 116px); }
      .seaside-prop { height: clamp(165px, 34vh, 250px); }
      .answer-btn { width: clamp(68px, 7.6vw, 104px); height: clamp(64px, 7.2vw, 98px); }
    }
  </style>
</head>
<body>
  <!-- Living Ocean, Sky, Lighthouse, Sailboat, Waves, Beach & Crab Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Swaying Palm Fronds & Striped Beach Umbrella (Procedural Inline SVGs) -->
  <div id="scenery-layer" aria-hidden="true">
    <!-- Left Palm Fronds -->
    <svg class="palm-left" viewBox="0 0 340 280" fill="none">
      <defs>
        <linearGradient id="palmGrad1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1e6b34" />
          <stop offset="55%" stop-color="#359446" />
          <stop offset="100%" stop-color="#69b856" />
        </linearGradient>
        <linearGradient id="palmGrad2" x1="0" y1="0" x2="1" y2="0.6">
          <stop offset="0%" stop-color="#165228" />
          <stop offset="60%" stop-color="#2c7f3e" />
          <stop offset="100%" stop-color="#58a64c" />
        </linearGradient>
      </defs>
      <!-- Upper sweeping frond -->
      <path d="M-10,18 Q125,8 295,62 Q225,68 182,58 Q195,78 145,62 Q156,82 108,60 Q114,82 68,54 Q70,76 28,46 Z" fill="url(#palmGrad1)" />
      <path d="M-10,18 Q135,16 292,62" stroke="#9be077" stroke-width="3" stroke-linecap="round" opacity="0.65" />
      <!-- Middle lush frond -->
      <path d="M-12,24 Q108,58 242,162 Q184,148 156,125 Q162,155 120,118 Q122,148 84,104 Q82,135 44,88 Q40,116 8,66 Z" fill="url(#palmGrad2)" />
      <path d="M-12,24 Q112,68 238,158" stroke="#85d164" stroke-width="3" stroke-linecap="round" opacity="0.6" />
      <!-- Lower hanging frond -->
      <path d="M-8,28 Q64,104 128,244 Q92,208 82,175 Q68,205 56,156 Q42,182 34,132 Q18,156 12,102 Z" fill="url(#palmGrad1)" />
      <path d="M-8,28 Q64,110 124,238" stroke="#88d668" stroke-width="2.6" stroke-linecap="round" opacity="0.55" />
      <!-- Coconuts tucked at base -->
      <ellipse cx="22" cy="36" rx="18" ry="20" fill="#5e3418" />
      <ellipse cx="18" cy="32" rx="7" ry="9" fill="#824c25" opacity="0.55" />
      <ellipse cx="44" cy="26" rx="15" ry="17" fill="#4f2a12" />
      <ellipse cx="40" cy="22" rx="6" ry="7" fill="#784320" opacity="0.5" />
    </svg>

    <!-- Right Palm Fronds -->
    <svg class="palm-right" viewBox="0 0 340 280" fill="none">
      <g transform="translate(340, 0) scale(-1, 1)">

    (() => {
      'use strict';

      /* ========================================================================
         1. GAME STATE & CONFIGURATION
         ======================================================================== */
      const STATE = {
        level: 1,              // 1: visual objects (1-10), 2: nums <=10, 3: nums <=20, 4: nums <=100
        lang: 'uk',            // 'uk' (УКР) or 'ru' (РУС)
        soundOn: true,
        questionType: 'more',  // 'more' or 'less'
        numA: 5,
        numB: 3,
        correctDiff: 2,
        options: [],
        locked: false,         // true during celebration transition
        lastObjectIdx: -1,
        lastPropStyle: -1,
        celebrationBag: []     // shuffled bag of 0..4 to ensure varied celebrations
      };

      const TEXTS = {
        uk: {
          more: 'На скільки більше?',
          less: 'На скільки менше?',
          tag: 'УКР'
        },
        ru: {
          more: 'На сколько больше?',
          less: 'На сколько меньше?',
          tag: 'РУС'
        }
      };

      /* ========================================================================
         2. WEB AUDIO API SYNTHESIZER (NO EXTERNAL AUDIO FILES)
         ======================================================================== */
      class SoundEngine {
        constructor() {
          this.ctx = null;
        }

        ensureContext() {
          if (!STATE.soundOn) return null;
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        }

        // Soft wooden/shell tap for UI buttons
        playTap() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.08);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain).connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        }

        // Soft playful low water-bloop for wrong answer (non-punitive)
        playWrongBloop() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(270, now);
          osc.frequency.exponentialRampToValueAtTime(165, now + 0.14);
          osc.frequency.exponentialRampToValueAtTime(210, now + 0.24);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
          osc.connect(gain).connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        }

        // Filtered white-noise water splash
        playSplash(delay = 0) {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime + delay;
          const bufferSize = Math.floor(ctx.sampleRate * 0.45);
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.16));
          }
          const src = ctx.createBufferSource();
          src.buffer = buffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1200, now);
          filter.frequency.exponentialRampToValueAtTime(420, now + 0.42);
          filter.Q.value = 1.2;

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.26, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.44);

          src.connect(filter).connect(gain).connect(ctx.destination);
          src.start(now);
        }

        // Celebration 1: Bright harp arpeggio + splashes (Dolphin Leap)
        playHarpArpeggio() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
          const now = ctx.currentTime;
          notes.forEach((freq, i) => {
            const t = now + i * 0.085;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.16, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.65);
            osc.connect(gain).connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.68);
          });
          this.playSplash(0.05);
          this.playSplash(0.75);
        }

        // Celebration 2: Steel-drum melody + rising bubble pops (Beach Balls & Bubbles)
        playSteelDrum() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const melody = [523.25, 659.25, 783.99, 659.25, 880, 1046.5];
          const now = ctx.currentTime;
          melody.forEach((freq, i) => {
            const t = now + i * 0.11;
            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const gain = ctx.createGain();
            osc1.type = 'sine';
            osc2.type = 'triangle';
            osc1.frequency.setValueAtTime(freq, t);
            osc2.frequency.setValueAtTime(freq * 2, t);
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
            const g2 = ctx.createGain();
            g2.gain.value = 0.05;
            osc1.connect(gain);
            osc2.connect(g2).connect(gain);
            gain.connect(ctx.destination);
            osc1.start(t);
            osc2.start(t);
            osc1.stop(t + 0.38);
            osc2.stop(t + 0.38);
          });
          // Bubble pops
          for (let b = 0; b < 4; b++) {
            const bt = now + 0.25 + b * 0.19;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(420 + b * 110, bt);
            osc.frequency.exponentialRampToValueAtTime(980 + b * 140, bt + 0.09);
            gain.gain.setValueAtTime(0.1, bt);
            gain.gain.exponentialRampToValueAtTime(0.001, bt + 0.1);
            osc.connect(gain).connect(ctx.destination);
            osc.start(bt);
            osc.stop(bt + 0.11);
          }
        }

        // Celebration 3: Celebratory warm marimba chord (Sunlit Sea-Spray & Seagulls)
        playMarimbaChord() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const chord = [392.0, 493.88, 587.33, 783.99, 987.77];
          const now = ctx.currentTime;
          chord.forEach((freq, i) => {
            const t = now + i * 0.07;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
            osc.connect(gain).connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.58);
          });
          // Gentle celebratory final shimmer chord
          [523.25, 659.25, 783.99, 1046.5].forEach((freq) => {
            const t = now + 0.48;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.08, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
            osc.connect(gain).connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.72);
          });
        }

        // Celebration 4: Upbeat xylophone victory dance (Crab Dance)
        playXylophoneDance() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const notes = [587.33, 659.25, 783.99, 659.25, 880, 783.99, 1046.5, 1174.66];
          const now = ctx.currentTime;
          notes.forEach((freq, i) => {
            const t = now + i * 0.095;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
            osc.connect(gain).connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.2);
          });
        }

        // Celebration 5: Cheerful ukulele strums + pearl shimmer (Pearl & Rainbow Arcs)
        playUkuleleStrum() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const chords = [
            [392.0, 523.25, 659.25, 783.99],
            [440.0, 523.25, 659.25, 880.0],
            [523.25, 659.25, 783.99, 1046.5]
          ];
          const now = ctx.currentTime;
          chords.forEach((ch, ci) => {
            ch.forEach((freq, ni) => {
              const t = now + ci * 0.24 + ni * 0.028;
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, t);
              gain.gain.setValueAtTime(0.12, t);
              gain.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
              osc.connect(gain).connect(ctx.destination);
              osc.start(t);
              osc.stop(t + 0.44);
            });
          });
        }
      }

        () => `

      /* ========================================================================
         4. LIVING SEASIDE BACKGROUND CANVAS (SKY, SUN, CLOUDS, LIGHTHOUSE,
            SAILBOAT, SEAGULLS, WAVES, SEAFOAM, SAND GRAIN, DOLPHIN, CRAB)
         ======================================================================== */
      const bgCanvas = document.getElementById('bg-canvas');
      const bgCtx = bgCanvas.getContext('2d');
      const fxCanvas = document.getElementById('fx-canvas');
      const fxCtx = fxCanvas.getContext('2d');

      let W = window.innerWidth;
      let H = window.innerHeight;
      let DPR = Math.min(window.devicePixelRatio || 1, 2);

      // Offscreen cached procedural sand grain texture
      let sandGrainCanvas = null;

      function buildSandGrain() {
        sandGrainCanvas = document.createElement('canvas');
        sandGrainCanvas.width = 256;
        sandGrainCanvas.height = 256;
        const sctx = sandGrainCanvas.getContext('2d');
        for (let i = 0; i < 2400; i++) {
          const x = Math.random() * 256;
          const y = Math.random() * 256;
          const r = Math.random() * 1.4 + 0.4;
          const light = Math.random() > 0.48;
          sctx.fillStyle = light ? 'rgba(255, 246, 214, 0.22)' : 'rgba(150, 102, 42, 0.16)';
          sctx.fillRect(x, y, r, r);
        }
      }

      function resizeCanvases() {
        W = window.innerWidth;
        H = window.innerHeight;
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        [bgCanvas, fxCanvas].forEach((c) => {
          c.width = Math.floor(W * DPR);
          c.height = Math.floor(H * DPR);
          c.style.width = `${W}px`;
          c.style.height = `${H}px`;
        });
        bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
        fxCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }

      // Ambient living entities
      const clouds = [
        { x: 0.14, y: 0.12, scale: 1.05, speed: 0.0045 },
        { x: 0.48, y: 0.09, scale: 0.85, speed: 0.0032 },
        { x: 0.78, y: 0.15, scale: 1.15, speed: 0.0038 },

        { x: 0.22, y: 0.19, speed: 0.022, phase: 0.0, size: 1.0, swoop: 0 },
        { x: 0.28, y: 0.22, speed: 0.019, phase: 1.7, size: 0.78, swoop: 0 },
        { x: 0.68, y: 0.16, speed: -0.021, phase: 3.1, size: 0.92, swoop: 0 }
      ];

      const sailboat = {
        x: 0.72,
        speed: -0.0045

      // Realistic foreground beach crab (also performs Celebration #4!)
      const crab = {
        x: 0.16,
        y: 0.935,
        targetX: 0.16,
        facing: 1,
        walkPhase: 0,
        idleTimer: 2.2,

      // Realistic leaping dolphin (Celebration #1)
      const dolphin = {
        active: false,
        t: 0,
        duration: 1.45,
        startX: 0.25,
        endX: 0.75,
        splashedOut: false,
        splashedIn: false
      };

      // Foreground FX particles (droplets, beach balls, bubbles, stars, sand puffs, rainbow arcs, pearl glow)
      let fxParticles = [];
      let fxBalls = [];
      let fxPearl = null;
      let fxRainbowArcs = [];

      function drawSoftCloud(ctx, cx, cy, scale) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        const grad = ctx.createLinearGradient(0, -28, 0, 26);
        grad.addColorStop(0, 'rgba(255, 252, 242, 0.92)');
        grad.addColorStop(1, 'rgba(255, 232, 204, 0.68)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(-42, 6, 22, 0, Math.PI * 2);
        ctx.arc(-16, -6, 30, 0, Math.PI * 2);
        ctx.arc(20, -2, 26, 0, Math.PI * 2);
        ctx.arc(46, 8, 19, 0, Math.PI * 2);
        ctx.arc(0, 12, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawSeagull(ctx, x, y, size, phase, dir) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(dir < 0 ? -size : size, size);
        const flap = Math.sin(phase) * 9;
        ctx.strokeStyle = '#334e63';
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-16, -flap);
        ctx.quadraticCurveTo(-7, -8 - flap * 0.3, 0, 0);
        ctx.quadraticCurveTo(7, -8 - flap * 0.3, 16, -flap);
        ctx.stroke();
        // Bright sunlit wing top highlight
        ctx.strokeStyle = 'rgba(255, 250, 238, 0.85)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(-14, -flap - 1);
        ctx.quadraticCurveTo(-6, -8 - flap * 0.3, 0, -1);
        ctx.quadraticCurveTo(6, -8 - flap * 0.3, 14, -flap - 1);
        ctx.stroke();
        ctx.restore();
      }

      function drawHeadlandAndLighthouse(ctx, horizonY, time) {
        const baseX = W * 0.13;
        ctx.save();
        // Distant rocky headland silhouette
        const rockGrad = ctx.createLinearGradient(0, horizonY - 45, 0, horizonY + 8);
        rockGrad.addColorStop(0, '#5a6e7a');
        rockGrad.addColorStop(1, '#3b5263');
        ctx.fillStyle = rockGrad;
        ctx.beginPath();
        ctx.moveTo(0, horizonY + 4);
        ctx.lineTo(0, horizonY - 34);
        ctx.quadraticCurveTo(baseX * 0.45, horizonY - 46, baseX * 0.9, horizonY - 26);
        ctx.quadraticCurveTo(baseX * 1.45, horizonY - 14, baseX * 1.75, horizonY + 4);
        ctx.closePath();
        ctx.fill();

        // Red-and-white striped lighthouse
        const lx = baseX * 0.85;
        const ly = horizonY - 26;
        // Tower body
        ctx.fillStyle = '#fff5e4';
        ctx.beginPath();
        ctx.moveTo(lx - 8, ly);
        ctx.lineTo(lx - 5, ly - 44);
        ctx.lineTo(lx + 5, ly - 44);
        ctx.lineTo(lx + 8, ly);
        ctx.closePath();
        ctx.fill();
        // Red stripes
        ctx.fillStyle = '#d94336';
        ctx.fillRect(lx - 7, ly - 15, 14, 9);
        ctx.fillRect(lx - 6, ly - 33, 12, 9);
        // Lantern room & dome
        ctx.fillStyle = '#ffe285';
        ctx.fillRect(lx - 4.5, ly - 51, 9, 7);
        ctx.fillStyle = '#b82e24';
        ctx.beginPath();
        ctx.arc(lx, ly - 51, 5.5, Math.PI, 0);
        ctx.fill();
        // Subtle rotating warm beacon glint
        const glint = 0.25 + 0.35 * Math.sin(time * 2.2);
        const beamGrad = ctx.createRadialGradient(lx, ly - 48, 1, lx, ly - 48, 22);
        beamGrad.addColorStop(0, `rgba(255, 245, 180, ${glint})`);
        beamGrad.addColorStop(1, 'rgba(255, 245, 180, 0)');
        ctx.fillStyle = beamGrad;
        ctx.beginPath();
        ctx.arc(lx, ly - 48, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawSailboat(ctx, x, y, time) {
        const bob = Math.sin(time * 2.1) * 2.8;
        const tilt = Math.sin(time * 1.6) * 0.05;
        ctx.save();
        ctx.translate(x, y + bob);
        ctx.rotate(tilt);
        // Hull
        ctx.fillStyle = '#8c3b2b';
        ctx.beginPath();
        ctx.moveTo(-20, 0);
        ctx.lineTo(20, 0);
        ctx.lineTo(14, 7);
        ctx.lineTo(-15, 7);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#f5e6cc';
        ctx.fillRect(-17, -2, 34, 2.5);
        // Mast
        ctx.strokeStyle = '#6b4222';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -34);
        ctx.stroke();
        // Main sail
        ctx.fillStyle = '#fff9ec';
        ctx.beginPath();
        ctx.moveTo(1, -32);
        ctx.quadraticCurveTo(15, -18, 16, -4);
        ctx.lineTo(1, -4);
        ctx.closePath();
        ctx.fill();
        // Jib sail
        ctx.fillStyle = '#ffd6a5';
        ctx.beginPath();
        ctx.moveTo(-1, -28);
        ctx.lineTo(-14, -4);
        ctx.lineTo(-1, -4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawDolphin(ctx, horizonY, waterBottomY) {
        if (!dolphin.active) return;
        const p = dolphin.t / dolphin.duration;
        if (p >= 1) {
          dolphin.active = false;
          return;
        }
        const x = W * (dolphin.startX + (dolphin.endX - dolphin.startX) * p);
        const baseOceanY = horizonY + (waterBottomY - horizonY) * 0.56;
        const jumpHeight = Math.min(180, H * 0.24);
        const y = baseOceanY - Math.sin(p * Math.PI) * jumpHeight;
        // Tangent angle of the parabolic arc
        const dx = W * (dolphin.endX - dolphin.startX);
        const dy = -Math.cos(p * Math.PI) * Math.PI * jumpHeight;
        const angle = Math.atan2(dy, dx);

        // Trigger water splash bursts on exit and re-entry
        if (p > 0.04 && !dolphin.splashedOut) {
          dolphin.splashedOut = true;
          spawnWaterSplash(x, baseOceanY, 24);
        }
        if (p > 0.90 && !dolphin.splashedIn) {
          dolphin.splashedIn = true;
          spawnWaterSplash(x, baseOceanY, 32);
        }

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        const s = Math.min(W / 1280, 1.15) * 1.15;
        ctx.scale(s, s);

        // Sleek dolphin body
        const bodyGrad = ctx.createLinearGradient(0, -18, 0, 18);
        bodyGrad.addColorStop(0, '#3a6f94');
        bodyGrad.addColorStop(0.55, '#6da8cc');
        bodyGrad.addColorStop(1, '#dceef7');
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.moveTo(46, 2); // snout tip
        ctx.quadraticCurveTo(32, -8, 18, -14);
        ctx.quadraticCurveTo(-8, -22, -38, -6);
        ctx.lineTo(-56, -18); // upper tail fluke
        ctx.quadraticCurveTo(-48, -2, -46, 2);
        ctx.lineTo(-58, 16); // lower tail fluke
        ctx.quadraticCurveTo(-40, 10, -28, 7);
        ctx.quadraticCurveTo(4, 16, 26, 8);
        ctx.quadraticCurveTo(38, 7, 46, 2);
        ctx.closePath();
        ctx.fill();

        // Dorsal fin
        ctx.fillStyle = '#36688a';
        ctx.beginPath();
        ctx.moveTo(4, -15);
        ctx.quadraticCurveTo(-6, -34, -18, -32);
        ctx.quadraticCurveTo(-10, -20, -12, -14);
        ctx.closePath();
        ctx.fill();

        // Pectoral fin
        ctx.fillStyle = '#4e85a8';
        ctx.beginPath();
        ctx.moveTo(12, 8);
        ctx.quadraticCurveTo(2, 24, -8, 22);
        ctx.quadraticCurveTo(0, 13, 2, 7);
        ctx.closePath();
        ctx.fill();

        // Eye & playful smile
        ctx.fillStyle = '#182b3a';
        ctx.beginPath();
        ctx.arc(27, -2, 2.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(22, -10);
        ctx.quadraticCurveTo(0, -16, -24, -6);
        ctx.stroke();

        ctx.restore();
      }

      function drawForegroundCrab(ctx, time, dt) {
        if (crab.dancing) {
          crab.danceTime += dt;
          // Run swiftly toward center-bottom (0.5, 0.87)
          crab.x += (0.5 - crab.x) * Math.min(1, dt * 6);
          crab.walkPhase += dt * 24;
          if (crab.danceTime > 1.55) {
            crab.dancing = false;
            crab.danceTime = 0;
            crab.targetX = Math.random() < 0.5 ? 0.14 : 0.86;
          }
        } else {
          // Occasional natural scuttling along the foreground sand
          const dx = crab.targetX - crab.x;
          if (Math.abs(dx) > 0.004) {
            const step = Math.sign(dx) * Math.min(Math.abs(dx), dt * 0.055);
            crab.x += step;
            crab.facing = Math.sign(dx);
            crab.walkPhase += dt * 15;
          } else {
            crab.idleTimer -= dt;
            if (crab.idleTimer <= 0) {
              crab.idleTimer = 3 + Math.random() * 4.5;
              crab.targetX = 0.08 + Math.random() * 0.84;
            }
          }
        }

        const cx = crab.x * W;
        const hop = crab.dancing ? Math.abs(Math.sin(crab.danceTime * 11)) * 22 : 0;
        const cy = (crab.dancing ? H * 0.88 : H * 0.945) - hop;
        const scale = (crab.dancing ? 1.35 : 0.92) * Math.min(1.1, W / 1180);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);

        // Soft shadow on sand
        ctx.fillStyle = 'rgba(110, 72, 24, 0.28)';
        ctx.beginPath();
        ctx.ellipse(0, 14 + hop * 0.65, 24, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        const wobble = crab.dancing ? Math.sin(crab.danceTime * 16) * 0.22 : Math.sin(crab.walkPhase) * 0.06;
        ctx.rotate(wobble);

        // Legs
        ctx.strokeStyle = '#a82218';
        ctx.lineWidth = 3.2;
        ctx.lineCap = 'round';
        for (let i = 0; i < 3; i++) {
          const swing = Math.sin(crab.walkPhase + i * 1.4) * 4;
          // Left legs
          ctx.beginPath();
          ctx.moveTo(-14, 2 + i * 3);
          ctx.lineTo(-27, 8 + i * 4 + swing);
          ctx.stroke();
          // Right legs
          ctx.beginPath();
          ctx.moveTo(14, 2 + i * 3);
          ctx.lineTo(27, 8 + i * 4 - swing);
          ctx.stroke();
        }

        // Claws (raise and snap rapidly during dance!)
        const clawRaise = crab.dancing ? -14 - Math.abs(Math.sin(crab.danceTime * 18)) * 8 : -4 + Math.sin(time * 2.5) * 2;
        const snap = crab.dancing ? Math.abs(Math.sin(crab.danceTime * 22)) * 0.45 : 0.15;
        [-1, 1].forEach((side) => {
          ctx.save();
          ctx.translate(side * 18, clawRaise);
          ctx.rotate(side * (0.25 + snap));
          ctx.fillStyle = '#e63c2e';
          ctx.strokeStyle = '#911910';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, 9, 0.4, Math.PI * 2 - 0.4);
          ctx.lineTo(0, 0);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        });

        // Shell body
        const bodyGrad = ctx.createRadialGradient(-5, -4, 3, 0, 2, 24);
        bodyGrad.addColorStop(0, '#ff6d59');
        bodyGrad.addColorStop(1, '#cf291d');
        ctx.fillStyle = bodyGrad;
        ctx.strokeStyle = '#8a170f';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.ellipse(0, 2, 22, 14, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Eye stalks
        ctx.strokeStyle = '#a82218';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(-7, -9);
        ctx.lineTo(-9, -18);
        ctx.moveTo(7, -9);
        ctx.lineTo(9, -18);
        ctx.stroke();

        [-9, 9].forEach((ex) => {
          ctx.fillStyle = '#fff9ec';
          ctx.beginPath();
          ctx.arc(ex, -19, 4.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#1b1412';
          ctx.beginPath();
          ctx.arc(ex + crab.facing * 0.8, -19.5, 2, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.restore();
      }

      /* ========================================================================
         5. FOREGROUND CELEBRATION FX SPAWNERS & RENDERER
         ======================================================================== */
      function spawnWaterSplash(x, y, count = 24) {
        for (let i = 0; i < count; i++) {
          const angle = -Math.PI * 0.15 - Math.random() * Math.PI * 0.7;
          const speed = 120 + Math.random() * 240;
          fxParticles.push({
            type: 'droplet',
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            r: 3 + Math.random() * 5,
            life: 0.7 + Math.random() * 0.5,
            maxLife: 1.2,
            color: Math.random() > 0.4 ? 'rgba(235, 250, 255, 0.92)' : 'rgba(120, 224, 245, 0.85)'
          });
        }
      }

      function spawnSandPuff(x, y) {
        for (let i = 0; i < 16; i++) {
          const angle = -Math.random() * Math.PI;
          const speed = 45 + Math.random() * 95;
          fxParticles.push({
            type: 'sand',
            x: x + (Math.random() - 0.5) * 32,
            y: y + 18,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 20,
            r: 4 + Math.random() * 7,
            life: 0.45 + Math.random() * 0.3,
            maxLife: 0.75,
            color: Math.random() > 0.5 ? '#e6bc73' : '#cfa052'
          });
        }
      }

      function spawnCelebration(typeIdx, originX, originY) {
        if (typeIdx === 0) {
          // 1. Realistic Dolphin Leap out of the ocean + splashes + harp arpeggio
          dolphin.active = true;
          dolphin.t = 0;
          dolphin.startX = Math.random() < 0.5 ? 0.22 : 0.78;
          dolphin.endX = dolphin.startX < 0.5 ? 0.78 : 0.22;
          dolphin.splashedOut = false;
          dolphin.splashedIn = false;
          sound.playHarpArpeggio();
        } else if (typeIdx === 1) {
          // 2. Bouncing Colorful Beach Balls + Iridescent Sea Bubbles + Steel Drum
          for (let i = 0; i < 5; i++) {
            fxBalls.push({
              x: (i % 2 === 0 ? -40 : W + 40),
              y: H * (0.42 + Math.random() * 0.22),
              vx: (i % 2 === 0 ? 1 : -1) * (240 + Math.random() * 180),
              vy: -160 - Math.random() * 140,
              r: 24 + Math.random() * 14,
              rot: Math.random() * Math.PI * 2,
              vrot: (Math.random() - 0.5) * 8,
              life: 1.65
            });
          }
          for (let i = 0; i < 28; i++) {
            fxParticles.push({
              type: 'bubble',
              x: originX + (Math.random() - 0.5) * W * 0.65,
              y: H * 0.92 + Math.random() * 40,
              vx: (Math.random() - 0.5) * 45,
              vy: -(110 + Math.random() * 150),
              r: 8 + Math.random() * 15,
              life: 1.2 + Math.random() * 0.5,
              maxLife: 1.7,
              wobblePhase: Math.random() * Math.PI * 2
            });
          }
          sound.playSteelDrum();
        } else if (typeIdx === 2) {
          // 3. Golden Sunlit Sea-Spray & Starlight Burst + Swooping Seagulls + Marimba Chord
          for (let i = 0; i < 48; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 90 + Math.random() * 290;
            fxParticles.push({
              type: i % 3 === 0 ? 'star' : 'droplet',
              x: originX,
              y: originY,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - 90,
              r: 5 + Math.random() * 7,
              life: 0.9 + Math.random() * 0.55,
              maxLife: 1.45,
              color: i % 2 === 0 ? '#ffe066' : '#7ae7ff'
            });
          }
          seagulls.forEach((g) => { g.swoop = 1.4; });
          sound.playMarimbaChord();
        } else if (typeIdx === 3) {
          // 4. Foreground Beach Crab Runs to Center & Does a Claw-Snapping Victory Dance + Xylophone
          crab.dancing = true;
          crab.danceTime = 0;
          for (let i = 0; i < 22; i++) {
            const angle = -Math.PI * 0.15 - Math.random() * Math.PI * 0.7;
            const speed = 90 + Math.random() * 170;
            fxParticles.push({
              type: 'star',
              x: W * 0.5,
              y: H * 0.86,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              r: 4 + Math.random() * 6,
              life: 0.85 + Math.random() * 0.5,
              maxLife: 1.35,
              color: i % 2 === 0 ? '#ff9f43' : '#ffe066'
            });
          }
          sound.playXylophoneDance();
        } else {
          // 5. Shimmering Pearl Glow + Cascading Rainbow Water-Droplet Arcs + Ukulele Strums
          fxPearl = { x: originX, y: originY, t: 0, duration: 1.45 };
          const rainbow = ['#ff6b6b', '#ffa94d', '#ffe066', '#69db7c', '#4dabf7', '#b197fc'];
          rainbow.forEach((col, ci) => {
            fxRainbowArcs.push({
              x: originX,
              y: originY,
              color: col,
              delay: ci * 0.05,
              t: 0,
              duration: 1.25,
              spread: (ci - 2.5) * 65,
              peak: 150 + ci * 22
            });
          });
          sound.playUkuleleStrum();
        }
      }

      function getNextCelebrationType() {
        if (STATE.celebrationBag.length === 0) {
          STATE.celebrationBag = [0, 1, 2, 3, 4];
          for (let i = STATE.celebrationBag.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [STATE.celebrationBag[i], STATE.celebrationBag[j]] = [STATE.celebrationBag[j], STATE.celebrationBag[i]];
          }
        }
        return STATE.celebrationBag.pop();
      }

      function drawStarShape(ctx, cx, cy, outerR, innerR) {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const r = i % 2 === 0 ? outerR : innerR;
          const a = (i * Math.PI) / 5 - Math.PI / 2;
          const x = cx + Math.cos(a) * r;
          const y = cy + Math.sin(a) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
      }

      function drawBeachBall(ctx, b) {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot);
        ctx.beginPath();
        ctx.arc(0, 0, b.r, 0, Math.PI * 2);
        ctx.fillStyle = '#fff5d6';
        ctx.fill();
        ctx.clip();

        ctx.fillStyle = '#f04b3e';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, b.r, -Math.PI * 0.5, Math.PI * 0.15);
        ctx.fill();

        ctx.fillStyle = '#1fa7c9';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, b.r, Math.PI * 0.15, Math.PI * 0.85);
        ctx.fill();

        ctx.fillStyle = '#f7be2c';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, b.r, Math.PI * 0.85, Math.PI * 1.5);
        ctx.fill();

        ctx.fillStyle = '#fff9e6';
        ctx.beginPath();
        ctx.arc(0, 0, b.r * 0.24, 0, Math.PI * 2);
        ctx.fill();

        // Gloss highlight
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.beginPath();
        ctx.ellipse(-b.r * 0.3, -b.r * 0.35, b.r * 0.28, b.r * 0.14, -0.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      /* ========================================================================
         6. MAIN 60FPS ANIMATION LOOP
         ======================================================================== */
      let lastTs = 0;

      function renderFrame(ts) {
        const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
        lastTs = ts;
        const time = ts * 0.001;

        const horizonY = H * 0.34;
        const shoreBaseY = H * 0.56;

        // --- 1. WARM SUMMER SKY GRADIENT ---
        const skyGrad = bgCtx.createLinearGradient(0, 0, 0, horizonY);
        skyGrad.addColorStop(0, '#3699d6');
        skyGrad.addColorStop(0.58, '#77c9ed');
        skyGrad.addColorStop(1, '#fce4b8');
        bgCtx.fillStyle = skyGrad;
        bgCtx.fillRect(0, 0, W, horizonY + 4);

        // --- 2. RADIANT SUN & SUBTLE ROTATING LIGHT BEAMS ---
        const sunX = W * 0.78;
        const sunY = H * 0.14;
        bgCtx.save();
        bgCtx.translate(sunX, sunY);
        bgCtx.rotate(time * 0.06);
        for (let i = 0; i < 12; i++) {
          bgCtx.rotate((Math.PI * 2) / 12);
          const beamGrad = bgCtx.createLinearGradient(0, 0, 0, -170);
          beamGrad.addColorStop(0, 'rgba(255, 244, 186, 0.24)');
          beamGrad.addColorStop(1, 'rgba(255, 244, 186, 0)');
          bgCtx.fillStyle = beamGrad;
          bgCtx.beginPath();
          bgCtx.moveTo(-12, 0);
          bgCtx.lineTo(12, 0);
          bgCtx.lineTo(28, -170);
          bgCtx.lineTo(-28, -170);
          bgCtx.closePath();
          bgCtx.fill();
        }
        bgCtx.restore();

        const sunGlow = bgCtx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 95);
        sunGlow.addColorStop(0, '#fffbe0');
        sunGlow.addColorStop(0.32, '#ffe484');
        sunGlow.addColorStop(0.65, 'rgba(255, 210, 110, 0.35)');
        sunGlow.addColorStop(1, 'rgba(255, 210, 110, 0)');
        bgCtx.fillStyle = sunGlow;
        bgCtx.beginPath();
        bgCtx.arc(sunX, sunY, 95, 0, Math.PI * 2);
        bgCtx.fill();

        // --- 3. DRIFTING VOLUMETRIC CLOUDS ---
        clouds.forEach((c) => {
          c.x += c.speed * dt;
          if (c.x > 1.15) c.x = -0.15;
          drawSoftCloud(bgCtx, c.x * W, c.y * H, c.scale * Math.min(1.15, W / 1200));
        });

        // --- 4. DISTANT HEADLAND, LIGHTHOUSE & BOBBING SAILBOAT ---
        drawHeadlandAndLighthouse(bgCtx, horizonY, time);
        sailboat.x += sailboat.speed * dt;
        if (sailboat.x < -0.05) sailboat.x = 1.06;
        drawSailboat(bgCtx, sailboat.x * W, horizonY - 2, time);

        // --- 5. ANIMATED SEAGULLS ---
        seagulls.forEach((g) => {
          g.x += g.speed * dt;
          g.phase += dt * (g.swoop > 0 ? 11 : 6.2);
          if (g.swoop > 0) g.swoop = Math.max(0, g.swoop - dt);
          if (g.x > 1.08) g.x = -0.08;
          if (g.x < -0.08) g.x = 1.08;
          const swoopY = g.swoop > 0 ? Math.sin(g.swoop * Math.PI) * H * 0.14 : 0;
          drawSeagull(bgCtx, g.x * W, g.y * H + Math.sin(time + g.phase * 0.2) * 8 + swoopY, g.size, g.phase, g.speed);
        });

        // --- 6. MULTI-LAYERED REALISTIC OCEAN ---
        const oceanGrad = bgCtx.createLinearGradient(0, horizonY, 0, shoreBaseY + 35);
        oceanGrad.addColorStop(0, '#126e9c');
        oceanGrad.addColorStop(0.45, '#1994b8');
        oceanGrad.addColorStop(0.85, '#3ec4cf');
        oceanGrad.addColorStop(1, '#7ce0d6');
        bgCtx.fillStyle = oceanGrad;
        bgCtx.fillRect(0, horizonY, W, shoreBaseY - horizonY + 45);

        // Sparkling sun reflections on the water
        for (let i = 0; i < 24; i++) {
          const sy = horizonY + 8 + (i / 24) * (shoreBaseY - horizonY - 22);
          const spread = 24 + (i / 24) * 140;
          const sx = sunX + Math.sin(time * 2.2 + i * 1.9) * spread;
          const sw = 12 + Math.sin(time * 3.1 + i) * 10 + (i / 24) * 26;
          const alpha = 0.22 + 0.3 * Math.abs(Math.sin(time * 2.8 + i * 2.3));
          bgCtx.fillStyle = `rgba(255, 248, 210, ${alpha})`;
          bgCtx.beginPath();
          bgCtx.ellipse(sx, sy, sw, 2.2, 0, 0, Math.PI * 2);
          bgCtx.fill();
        }

        // Rolling ocean swells
        for (let layer = 0; layer < 3; layer++) {
          const ly = horizonY + (shoreBaseY - horizonY) * (0.28 + layer * 0.24);
          bgCtx.beginPath();
          bgCtx.moveTo(0, shoreBaseY + 40);
          for (let x = 0; x <= W; x += 28) {
            const wy = ly + Math.sin(x * 0.008 + time * (1.1 + layer * 0.35) + layer * 2) * (4 + layer * 2);
            bgCtx.lineTo(x, wy);
          }
          bgCtx.lineTo(W, shoreBaseY + 40);
          bgCtx.closePath();
          bgCtx.fillStyle = layer === 0
            ? 'rgba(20, 134, 173, 0.35)'
            : layer === 1
              ? 'rgba(42, 178, 199, 0.32)'
              : 'rgba(98, 214, 214, 0.28)';
          bgCtx.fill();
        }

        // Leaping dolphin rendered right in the ocean layer
        if (dolphin.active) {
          dolphin.t += dt;
          drawDolphin(bgCtx, horizonY, shoreBaseY);
        }

        // --- 7. GOLDEN SANDY BEACH + WET SAND + WASHING SEAFOAM ---
        const tideCycle = Math.sin(time * 0.95);
        const tideOffset = tideCycle * 18;

        // Dry golden sand
        const sandGrad = bgCtx.createLinearGradient(0, shoreBaseY - 10, 0, H);
        sandGrad.addColorStop(0, '#edd093');
        sandGrad.addColorStop(0.28, '#f5d99d');
        sandGrad.addColorStop(0.7, '#e8bf74');
        sandGrad.addColorStop(1, '#d9a857');
        bgCtx.fillStyle = sandGrad;
        bgCtx.beginPath();
        bgCtx.moveTo(0, shoreBaseY + 8);
        for (let x = 0; x <= W; x += 36) {
          const curve = Math.sin(x * 0.0045 + 0.5) * 14;
          bgCtx.lineTo(x, shoreBaseY + curve);
        }
        bgCtx.lineTo(W, H);
        bgCtx.lineTo(0, H);
        bgCtx.closePath();
        bgCtx.fill();

        // Subtle wet-sand darkened strip near the tide line
        bgCtx.fillStyle = 'rgba(168, 118, 54, 0.28)';
        bgCtx.beginPath();
        bgCtx.moveTo(0, shoreBaseY + 28);
        for (let x = 0; x <= W; x += 32) {
          const curve = Math.sin(x * 0.0045 + 0.5) * 14 + Math.sin(x * 0.012 + time * 0.6) * 4;
          bgCtx.lineTo(x, shoreBaseY + curve + 22);
        }
        bgCtx.lineTo(W, shoreBaseY - 12);
        bgCtx.lineTo(0, shoreBaseY - 12);
        bgCtx.closePath();
        bgCtx.fill();

        // Advancing/receding translucent shallow wave + frothy white seafoam
        bgCtx.beginPath();
        bgCtx.moveTo(0, shoreBaseY - 22);
        for (let x = 0; x <= W; x += 24) {
          const waveY = shoreBaseY + Math.sin(x * 0.0045 + 0.5) * 14
            + Math.sin(x * 0.016 + time * 1.4) * 5
            + tideOffset;
          bgCtx.lineTo(x, waveY);
        }
        bgCtx.lineTo(W, shoreBaseY - 22);
        bgCtx.closePath();
        bgCtx.fillStyle = 'rgba(116, 224, 218, 0.52)';
        bgCtx.fill();

        // Frothy foam edge
        bgCtx.beginPath();
        for (let x = 0; x <= W; x += 18) {
          const waveY = shoreBaseY + Math.sin(x * 0.0045 + 0.5) * 14
            + Math.sin(x * 0.016 + time * 1.4) * 5
            + tideOffset;
          if (x === 0) bgCtx.moveTo(x, waveY);
          else bgCtx.lineTo(x, waveY);
        }
        bgCtx.strokeStyle = `rgba(255, 253, 245, ${0.65 + 0.22 * (tideCycle * 0.5 + 0.5)})`;
        bgCtx.lineWidth = 7;
        bgCtx.lineCap = 'round';
        bgCtx.stroke();

        // Procedural sand grain texture overlay
        if (sandGrainCanvas) {
          const pat = bgCtx.createPattern(sandGrainCanvas, 'repeat');
          bgCtx.save();
          bgCtx.fillStyle = pat;
          bgCtx.fillRect(0, shoreBaseY + 18, W, H - shoreBaseY);
          bgCtx.restore();
        }

        // Foreground realistic red crab
        drawForegroundCrab(bgCtx, time, dt);

        // --- 8. FOREGROUND FX CANVAS (PARTICLES, BALLS, PEARL, RAINBOW ARCS) ---
        fxCtx.clearRect(0, 0, W, H);

        // Shimmering Pearl Halo (Celebration #5)
        if (fxPearl) {
          fxPearl.t += dt;
          const p = fxPearl.t / fxPearl.duration;
          if (p >= 1) {
            fxPearl = null;
          } else {
            const radius = 35 + Math.sin(p * Math.PI) * 145;
            const alpha = Math.sin(p * Math.PI) * 0.72;
            const pg = fxCtx.createRadialGradient(fxPearl.x, fxPearl.y, 6, fxPearl.x, fxPearl.y, radius);
            pg.addColorStop(0, `rgba(255, 253, 235, ${alpha})`);
            pg.addColorStop(0.45, `rgba(255, 226, 150, ${alpha * 0.65})`);
            pg.addColorStop(0.78, `rgba(175, 245, 255, ${alpha * 0.35})`);
            pg.addColorStop(1, 'rgba(255, 255, 255, 0)');
            fxCtx.fillStyle = pg;
            fxCtx.beginPath();
            fxCtx.arc(fxPearl.x, fxPearl.y, radius, 0, Math.PI * 2);
            fxCtx.fill();
          }
        }

        // Cascading Rainbow Water-Droplet Arcs (Celebration #5)
        for (let i = fxRainbowArcs.length - 1; i >= 0; i--) {
          const arc = fxRainbowArcs[i];
          arc.t += dt;
          if (arc.t < arc.delay) continue;
          const p = (arc.t - arc.delay) / arc.duration;
          if (p >= 1) {
            fxRainbowArcs.splice(i, 1);
            continue;
          }
          for (let d = 0; d < 7; d++) {
            const dp = Math.max(0, p - d * 0.05);
            if (dp <= 0 || dp >= 1) continue;
            const ax = arc.x + arc.spread * dp * 2.4;
            const ay = arc.y - Math.sin(dp * Math.PI) * arc.peak;
            const alpha = (1 - d * 0.13) * Math.sin(dp * Math.PI);
            fxCtx.fillStyle = arc.color;
            fxCtx.globalAlpha = Math.max(0, alpha);
            fxCtx.beginPath();
            fxCtx.arc(ax, ay, 7.5 - d * 0.7, 0, Math.PI * 2);
            fxCtx.fill();
          }
          fxCtx.globalAlpha = 1;
        }

        // Bouncing Beach Balls (Celebration #2)
        for (let i = fxBalls.length - 1; i >= 0; i--) {
          const b = fxBalls[i];
          b.life -= dt;
          if (b.life <= 0) {
            fxBalls.splice(i, 1);
            continue;
          }
          b.vy += 680 * dt;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.rot += b.vrot * dt;
          const floorY = H * 0.89;
          if (b.y > floorY) {
            b.y = floorY;
            b.vy = -Math.abs(b.vy) * 0.74;
          }
          fxCtx.globalAlpha = Math.min(1, b.life * 2.5);
          drawBeachBall(fxCtx, b);
          fxCtx.globalAlpha = 1;
        }

        // General FX Particles (droplets, bubbles, stars, sand puffs)
        for (let i = fxParticles.length - 1; i >= 0; i--) {
          const pt = fxParticles[i];
          pt.life -= dt;
          if (pt.life <= 0) {
            fxParticles.splice(i, 1);
            continue;
          }
          const alpha = Math.min(1, pt.life / (pt.maxLife * 0.45));
          if (pt.type === 'bubble') {
            pt.wobblePhase += dt * 4.5;
            pt.x += (pt.vx + Math.sin(pt.wobblePhase) * 28) * dt;
            pt.y += pt.vy * dt;
            fxCtx.save();
            fxCtx.globalAlpha = alpha * 0.82;
            const bg = fxCtx.createRadialGradient(pt.x - pt.r * 0.3, pt.y - pt.r * 0.3, 1, pt.x, pt.y, pt.r);
            bg.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
            bg.addColorStop(0.55, 'rgba(155, 235, 255, 0.32)');
            bg.addColorStop(0.85, 'rgba(255, 185, 235, 0.45)');
            bg.addColorStop(1, 'rgba(255, 255, 255, 0.75)');
            fxCtx.fillStyle = bg;
            fxCtx.beginPath();
            fxCtx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
            fxCtx.fill();
            fxCtx.restore();
          } else if (pt.type === 'star') {
            pt.vy += 320 * dt;
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            fxCtx.save();
            fxCtx.globalAlpha = alpha;
            fxCtx.fillStyle = pt.color;
            drawStarShape(fxCtx, pt.x, pt.y, pt.r * 1.4, pt.r * 0.6);
            fxCtx.restore();
          } else if (pt.type === 'sand') {
            pt.vy += 260 * dt;
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            fxCtx.save();
            fxCtx.globalAlpha = alpha * 0.75;
            fxCtx.fillStyle = pt.color;
            fxCtx.beginPath();
            fxCtx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
            fxCtx.fill();
            fxCtx.restore();
          } else {
            // Water droplet
            pt.vy += 520 * dt;
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            fxCtx.save();
            fxCtx.globalAlpha = alpha;
            fxCtx.fillStyle = pt.color;
            fxCtx.beginPath();
            fxCtx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
            fxCtx.fill();
            fxCtx.restore();
          }
        }

        requestAnimationFrame(renderFrame);
      }

      /* ========================================================================
         7. INFINITE TASK GENERATOR (4 LEVELS + SMART DISTRACTORS)
         ======================================================================== */
      function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function generateTask() {
        STATE.locked = false;
        STATE.questionType = Math.random() < 0.5 ? 'more' : 'less';

        let a = 1;
        let b = 2;

        if (STATE.level === 1 || STATE.level === 2) {
          // Counts / numbers 1 to 10, never equal
          a = randInt(1, 10);
          do {
            b = randInt(1, 10);
          } while (b === a);
        } else if (STATE.level === 3) {
          // Numbers 1 to 20, frequently crossing 10
          if (Math.random() < 0.68) {
            // Ensure one is > 10 and one is <= 10 for rich crossing-10 practice
            a = randInt(11, 20);
            b = randInt(2, 10);
            if (Math.random() < 0.5) [a, b] = [b, a];
          } else {
            a = randInt(1, 20);
            do {
              b = randInt(1, 20);
            } while (b === a);
          }
        } else {
          // Level 4: Numbers 10 to 99, differences ranging from 1 to 85
          a = randInt(10, 99);
          do {
            b = randInt(10, 99);
          } while (b === a || Math.abs(a - b) > 85);
        }

        STATE.numA = a;
        STATE.numB = b;
        STATE.correctDiff = Math.abs(a - b);

        // Generate 4 unique plausible distractors (>= 1)
        const set = new Set([STATE.correctDiff]);
        const maxPossible = STATE.level <= 2 ? 10 : STATE.level === 3 ? 20 : 95;
        const deltas = STATE.level <= 2
          ? [-2, -1, 1, 2, 3, -3, 4]
          : STATE.level === 3
            ? [-3, -2, -1, 1, 2, 3, 4, -4, 5, 10]
            : [-10, 10, -2, -1, 1, 2, -5, 5, 11, -11, 9, -9];

        let guard = 0;
        while (set.size < 5 && guard < 120) {
          guard++;
          const d = deltas[Math.floor(Math.random() * deltas.length)];
          const cand = STATE.correctDiff + d;
          if (cand >= 1 && cand <= maxPossible) {
            set.add(cand);
          }
        }
        while (set.size < 5) {
          set.add(randInt(1, Math.max(9, maxPossible)));
        }

        // Shuffle options
        const arr = Array.from(set);
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        STATE.options = arr;

        renderQuestionBanner();
        renderTaskStage();
        renderAnswerButtons();
      }

      /* ========================================================================
         8. UI RENDERING & INTERACTIONS
         ======================================================================== */
      function renderLevelButtons() {
        const bar = document.getElementById('level-bar');
        bar.innerHTML = '';
        for (let lvl = 1; lvl <= 4; lvl++) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `level-btn${STATE.level === lvl ? ' active' : ''}`;
          btn.setAttribute('aria-label', `Level ${lvl}`);
          btn.innerHTML = `${getLevelButtonSVG(lvl, STATE.level === lvl)}<span>${lvl}</span>`;
          btn.addEventListener('click', () => {
            sound.playTap();
            if (STATE.level !== lvl) {
              STATE.level = lvl;
              renderLevelButtons();
              transitionToNewTask();
            }
          });
          bar.appendChild(btn);
        }
      }

      function renderQuestionBanner() {
        const textEl = document.getElementById('question-text');
        const signEl = document.getElementById('driftwood-sign');
        textEl.textContent = TEXTS[STATE.lang][STATE.questionType];
        renderQuestionArrow();

        signEl.classList.remove('pop-in');
        void signEl.offsetWidth;
        signEl.classList.add('pop-in');
      }

      function renderTaskStage() {
        const stage = document.getElementById('task-stage');
        stage.innerHTML = '';

        if (STATE.level === 1) {
          // Pick a fresh seaside object type each round
          let objIdx;
          do {
            objIdx = Math.floor(Math.random() * SEASIDE_OBJECTS.length);
          } while (objIdx === STATE.lastObjectIdx);
          STATE.lastObjectIdx = objIdx;

          const maxCount = Math.max(STATE.numA, STATE.numB);
          const cols = Math.max(6, maxCount); // Keep columns neat & well-proportioned

          const container = document.createElement('div');
          container.className = 'mats-container';

          [STATE.numA, STATE.numB].forEach((count, rowIdx) => {
            const mat = document.createElement('div');
            mat.className = 'straw-mat';
            mat.dataset.row = rowIdx;
            mat.innerHTML = getStrawMatSVG(rowIdx);

            const grid = document.createElement('div');
            grid.className = 'mat-items-grid';
            grid.style.setProperty('--cols', cols);

            for (let c = 0; c < cols; c++) {
              const slot = document.createElement('div');
              if (c < count) {
                slot.className = 'mat-item';
                slot.dataset.col = c;
                slot.style.animationDelay = `${(c * 0.045 + rowIdx * 0.08).toFixed(2)}s`;
                slot.innerHTML = SEASIDE_OBJECTS[objIdx]();
              } else {
                slot.style.width = '100%';
                slot.style.height = '100%';
              }
              grid.appendChild(slot);
            }

            // Bracket element for highlighting the unmatched difference on the longer row
            const bracket = document.createElement('div');
            bracket.className = 'diff-bracket-bar';
            bracket.id = `diff-bracket-${rowIdx}`;
            mat.appendChild(grid);
            mat.appendChild(bracket);
            container.appendChild(mat);
          });

          stage.appendChild(container);
        } else {
          // Levels 2, 3, 4: Stylized seaside number props (surfboards, lifebuoys, beach signs)
          let propStyle;
          do {
            propStyle = Math.floor(Math.random() * 3);
          } while (propStyle === STATE.lastPropStyle);
          STATE.lastPropStyle = propStyle;

          const leftPropData = getSeasidePropSVG(propStyle, 'left');
          const rightPropData = getSeasidePropSVG(propStyle, 'right');

          const wrap = document.createElement('div');
          wrap.className = 'numbers-stage';

          wrap.innerHTML = `
            <div class="seaside-prop left-prop">
              ${leftPropData.svg}
              <span class="prop-number${leftPropData.darkInk ? ' dark-ink' : ''}">${STATE.numA}</span>
            </div>
            <div class="center-emblem">
              <svg viewBox="0 0 110 110" fill="none">
                <circle cx="55" cy="55" r="46" fill="#d99a52" stroke="#784214" stroke-width="5"/>
                <circle cx="55" cy="55" r="38" fill="none" stroke="#fff0c9" stroke-width="4" stroke-dasharray="10 7"/>
                <circle cx="55" cy="55" r="30" fill="#1d8ea6" stroke="#fff3d1" stroke-width="2.5"/>
              </svg>
              <span>?</span>
            </div>
            <div class="seaside-prop right-prop">
              ${rightPropData.svg}
              <span class="prop-number${rightPropData.darkInk ? ' dark-ink' : ''}">${STATE.numB}</span>
            </div>
          `;

          stage.appendChild(wrap);
        }
      }

      function highlightLevel1Difference() {
        if (STATE.level !== 1) return;
        const longerRow = STATE.numA > STATE.numB ? 0 : 1;
        const minCount = Math.min(STATE.numA, STATE.numB);
        const mat = document.querySelector(`.straw-mat[data-row="${longerRow}"]`);
        if (!mat) return;

        const items = mat.querySelectorAll('.mat-item');
        const extraItems = [];
        items.forEach((el) => {
          const col = parseInt(el.dataset.col, 10);
          if (col >= minCount) {
            el.classList.add('extra-highlight');
            extraItems.push(el);
          }
        });

        // Position golden difference bracket neatly under the unmatched items
        if (extraItems.length > 0) {
          const matRect = mat.getBoundingClientRect();
          const firstRect = extraItems[0].getBoundingClientRect();
          const lastRect = extraItems[extraItems.length - 1].getBoundingClientRect();
          const bracket = document.getElementById(`diff-bracket-${longerRow}`);
          if (bracket) {
            bracket.style.left = `${firstRect.left - matRect.left}px`;
            bracket.style.width = `${lastRect.right - firstRect.left}px`;
            bracket.classList.add('visible');
          }
        }
      }

      function renderAnswerButtons() {
        const arc = document.getElementById('answers-arc');
        arc.innerHTML = '';

        STATE.options.forEach((val, idx) => {
          const shell = getAnswerShellSVG(idx);
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `answer-btn${shell.darkNum ? ' dark-num' : ''}`;
          btn.dataset.idx = idx;
          btn.dataset.val = val;
          btn.innerHTML = `${shell.svg}<span>${val}</span>`;

          btn.addEventListener('click', () => handleAnswerClick(btn, val));
          arc.appendChild(btn);
        });
      }

      function handleAnswerClick(btn, val) {
        if (STATE.locked) return;

        const rect = btn.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        if (val === STATE.correctDiff) {
          STATE.locked = true;
          btn.classList.add('correct-chosen');

          // Dim other shells
          document.querySelectorAll('.answer-btn').forEach((other) => {
            if (other !== btn) other.classList.add('dimmed');
          });

          // Visually highlight unmatched extra objects on Level 1
          highlightLevel1Difference();

          // Launch varied, active, wordless seaside celebration
          const celebType = getNextCelebrationType();
          spawnCelebration(celebType, cx, cy);

          // Smoothly transition to the next generated task after ~1.6s
          setTimeout(() => {
            transitionToNewTask();
          }, 1620);
        } else {
          // Gentle, playful, non-punitive feedback allowing immediate retry
          sound.playWrongBloop();
          spawnSandPuff(cx, cy);
          btn.classList.remove('wobble');
          void btn.offsetWidth;
          btn.classList.add('wobble');
        }
      }

      function transitionToNewTask() {
        const stage = document.getElementById('task-stage');
        stage.classList.add('transition-out');
        setTimeout(() => {
          generateTask();
          stage.classList.remove('transition-out');
        }, 280);
      }

      /* ========================================================================
         9. WIRE UP TOP-RIGHT CONTROLS & INITIALIZE
         ======================================================================== */
      function init() {
        buildSandGrain();
        resizeCanvases();
        window.addEventListener('resize', resizeCanvases);

        // Single Language Toggle Button (УКР / РУС)
        const langBtn = document.getElementById('lang-btn');
        const langLabel = document.getElementById('lang-label');
        langBtn.addEventListener('click', () => {
          sound.playTap();
          STATE.lang = STATE.lang === 'uk' ? 'ru' : 'uk';
          langLabel.textContent = TEXTS[STATE.lang].tag;
          document.getElementById('question-text').textContent = TEXTS[STATE.lang][STATE.questionType];
        });

        // Sound Toggle Button
        const soundBtn = document.getElementById('sound-btn');
        soundBtn.addEventListener('click', () => {
          STATE.soundOn = !STATE.soundOn;
          renderSoundButton();
          if (STATE.soundOn) sound.playTap();
        });

        // Minimalist Next Button (skips immediately without solving)
        const nextBtn = document.getElementById('next-btn');
        nextBtn.addEventListener('click', () => {
          sound.playTap();
          STATE.locked = false;
          transitionToNewTask();
        });

        renderLevelButtons();
        renderSoundButton();
        generateTask();

        requestAnimationFrame(renderFrame);
      }

      window.addEventListener('load', init);
    })();
  </script>
