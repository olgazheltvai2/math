<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Віднімання з переходом через десяток</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-image 0.5s ease;
        }

        #app-wrapper {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 20px;
            width: 95%;
            max-width: 1400px;
            margin: 20px auto;
            position: relative;
            z-index: 10;
        }

        .panel {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        #left-panel {
            flex: 1;
            min-width: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            flex: 3;
            min-width: 300px;
        }

        #right-panel {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            justify-content: flex-start;
        }

        #controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            transition: transform 0.2s, background 0.2s;
            width: 100%;
        }

        button:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        #custom-input {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .custom-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
        }

        #problem-text {
            font-size: 60px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0 40px 0;
        }

        #methods-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .method-box {
            flex: 1;
            min-width: 220px;
            padding: 20px;
            border: 3px dashed #3498db;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.8);
        }

        .method-box h2 {
            margin-top: 0;
            color: #3498db;
        }

        .inputs-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 30px;
            font-weight: bold;
        }

        input[type="number"] {
            width: 70px;
            height: 60px;
            font-size: 30px;
            text-align: center;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: #333;
            transition: all 0.3s;
        }

        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        input[type="number"]:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
        }

        .answer-box {
            font-size: 30px;
            font-weight: bold;
            margin: 20px 0;
            color: #2c3e50;
        }

        #check-btn {
            background: #e74c3c;
            font-size: 24px;
            padding: 20px 20px;
            border-radius: 15px;
            margin-top: auto;
        }

        #check-btn:hover {
            background: #c0392b;
        }

        #stickers {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        .sticker {
            font-size: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.1); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }

        .error {
            animation: shake 0.4s ease-in-out;
            border-color: #e74c3c !important;
            background-color: #fadbd8;
            color: #c0392b !important;
        }

        .correct {
            border-color: #2ecc71 !important;
            background-color: #d5f5e3;
            color: #27ae60 !important;
        }

        .bounce-in {
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Theme Manager */
        #settings-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: white;
            font-size: 30px;
            border: 2px solid #ccc;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
        }

        #theme-modal {
            position: fixed;
            bottom: 90px;
            right: 20px;
            z-index: 9998;
            max-height: 60vh;
            width: 260px;
            overflow-y: auto;
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .theme-thumb {
            width: 100%;
            height: 80px;
            background-size: cover;
            background-position: center;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .theme-thumb:hover {
            border-color: #4CAF50;
        }

        .theme-thumb span {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: white;
            text-align: center;
            font-size: 12px;
            padding: 4px 0;
            border-bottom-left-radius: 3px;
            border-bottom-right-radius: 3px;
            font-family: Arial, sans-serif;
        }

        #theme-modal::-webkit-scrollbar { width: 8px; }
        #theme-modal::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        #theme-modal::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        #theme-modal::-webkit-scrollbar-thumb:hover { background: #555; }

        @media (max-width: 1100px) {
            #app-wrapper {
                flex-direction: column;
                align-items: stretch;
            }
            #left-panel {
                flex-direction: row;
                min-height: 100px;
            }
            #stickers {
                flex-direction: row;
                flex-wrap: wrap;
            }
            #right-panel {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: stretch;
            }
            #controls {
                flex-direction: row;
                width: auto;
            }
            #check-btn {
                margin-top: 0;
            }
        }

        @media (max-width: 700px) {
            #methods-container {
                flex-direction: column;
            }
            .inputs-row {
                font-size: 24px;
            }
            input[type="number"] {
                width: 55px;
                height: 50px;
                font-size: 24px;
            }
            #controls {
                flex-direction: column;
                width: 100%;
            }
            #right-panel {
                flex-direction: column;
            }
            #check-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <div id="left-panel" class="panel">
            <div id="stickers"></div>
        </div>

        <div id="game-container" class="panel">
            <div id="problem-text"></div>

            <div id="methods-container">
                <div class="method-box">
                    <h2>Зручне розкладання від'ємника</h2>
                    <div class="inputs-row">
                        <input type="number" id="m1-1"> -
                        <input type="number" id="m1-2"> -
                        <input type="number" id="m1-3">
                    </div>
                </div>
                
                <div class="method-box">
                    <h2>Віднімання частинами</h2>
                    <div class="inputs-row">
                        <input type="number" id="m2-1"> -
                        <input type="number" id="m2-2"> -
                        <input type="number" id="m2-3">
                    </div>
                </div>

                <div class="method-box">
                    <h2>Метод округлення</h2>
                    <div class="inputs-row">
                        <input type="number" id="m3-1"> -
                        <input type="number" id="m3-2"> +
                        <input type="number" id="m3-3">
                    </div>
                </div>
            </div>

            <div class="answer-box">
                Відповідь: <input type="number" id="final-ans" style="width: 100px;">
            </div>
        </div>

        <div id="right-panel" class="panel">
            <div id="controls">
                <button onclick="generate()">Новий приклад</button>
                <button onclick="toggleCustom()">Ввести свій приклад</button>
            </div>

            <div id="custom-input" style="display:none;">
                <div class="custom-row">
                    <input type="number" id="cust-m" placeholder="52" style="width: 70px;"> - 
                    <input type="number" id="cust-s" placeholder="37" style="width: 70px;">
                </div>
                <button onclick="applyCustom()">Застосувати</button>
            </div>

            <button id="check-btn" onclick="checkAnswer()">Перевірити</button>
        </div>
    </div>

    <!-- Theme Manager -->
    <button id="settings-btn" onclick="toggleThemeModal()">⚙️</button>
    <div id="theme-modal"></div>

    <script>
        // --- Audio Context ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioInited = false;
        
        document.addEventListener('click', () => {
            if(!audioInited) {
                audioCtx.resume();
                audioInited = true;
            }
        });

        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.1); 
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'epic') {
                [261.63, 329.63, 392.00, 523.25].forEach((freq, i) => {
                    setTimeout(() => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.type = 'sine';
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
                        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                        o.start(); o.stop(audioCtx.currentTime + 0.5);
                    }, i * 150);
                });
            }
        }

        // --- Game Logic ---
        let currentM = 0;
        let currentS = 0;
        let stickersCount = 0;
        const stickerEmojis = ['🌟', '🎉', '🏆', '🔥', '✨', '🎈', '🚀', '⭐', '🎊', '😎'];

        function toggleCustom() {
            const block = document.getElementById('custom-input');
            block.style.display = block.style.display === 'none' ? 'flex' : 'none';
        }

        function applyCustom() {
            const m = parseInt(document.getElementById('cust-m').value);
            const s = parseInt(document.getElementById('cust-s').value);
            
            if(isNaN(m) || isNaN(s) || m <= s || m < 10 || s < 10) {
                alert("Введіть коректні двозначні числа (Зменшуване має бути більше за Від'ємник).");
                return;
            }
            if(m % 10 >= s % 10) {
                alert("Гра розрахована на приклади з переходом через десяток (одиниці зменшуваного мають бути меншими за одиниці від'ємника).");
                return;
            }
            
            currentM = m;
            currentS = s;
            document.getElementById('custom-input').style.display = 'none';
            updateDisplay();
        }

        function generate() {
            do {
                currentM = Math.floor(Math.random() * 80) + 20; 
                currentS = Math.floor(Math.random() * (currentM - 10)) + 10; 
            } while (currentM % 10 >= currentS % 10);
            
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('problem-text').innerText = `${currentM} - ${currentS} = ?`;
            
            const inputs = document.querySelectorAll('input[type="number"]');
            inputs.forEach(input => {
                if(input.id !== 'cust-m' && input.id !== 'cust-s') {
                    input.value = '';
                    input.classList.remove('correct', 'error');
                }
            });
        }

        function checkAnswer() {
            const m1_1 = parseInt(document.getElementById('m1-1').value);
            const m1_2 = parseInt(document.getElementById('m1-2').value);
            const m1_3 = parseInt(document.getElementById('m1-3').value);
            
            const m2_1 = parseInt(document.getElementById('m2-1').value);
            const m2_2 = parseInt(document.getElementById('m2-2').value);
            const m2_3 = parseInt(document.getElementById('m2-3').value);

            const m3_1 = parseInt(document.getElementById('m3-1').value);
            const m3_2 = parseInt(document.getElementById('m3-2').value);
            const m3_3 = parseInt(document.getElementById('m3-3').value);
            
            const ans = parseInt(document.getElementById('final-ans').value);
            
            const correctAns = currentM - currentS;
            
            const x1 = Math.floor(currentS / 10) * 10 + (currentM % 10);
            const y1 = currentS - x1;
            
            const x2 = Math.floor(currentS / 10) * 10;
            const y2 = currentS % 10;

            const x3 = (Math.floor(currentS / 10) + 1) * 10;
            const y3 = x3 - currentS;
            
            let isCorrect = true;
            
            function validate(id, expected) {
                const el = document.getElementById(id);
                if(parseInt(el.value) === expected) {
                    el.classList.remove('error');
                    el.classList.add('correct');
                    return true;
                } else {
                    el.classList.remove('correct');
                    void el.offsetWidth; 
                    el.classList.add('error');
                    return false;
                }
            }
            
            isCorrect &= validate('m1-1', currentM);
            isCorrect &= validate('m1-2', x1);
            isCorrect &= validate('m1-3', y1);
            
            isCorrect &= validate('m2-1', currentM);
            isCorrect &= validate('m2-2', x2);
            isCorrect &= validate('m2-3', y2);

            isCorrect &= validate('m3-1', currentM);
            isCorrect &= validate('m3-2', x3);
            isCorrect &= validate('m3-3', y3);
            
            isCorrect &= validate('final-ans', correctAns);
            
            if(isCorrect) {
                playSound('win');
                addSticker();
                if(stickersCount < 10) {
                    setTimeout(generate, 2000);
                }
            } else {
                playSound('error');
            }
        }

        function addSticker() {
            stickersCount++;
            const sDiv = document.getElementById('stickers');
            
            const span = document.createElement('span');
            span.innerText = stickerEmojis[(stickersCount - 1) % stickerEmojis.length];
            span.className = 'sticker bounce-in';
            sDiv.appendChild(span);

            if(stickersCount === 10) {
                setTimeout(() => {
                    playSound('epic');
                    alert('Вітаємо! Перемога! Ти зібрав всі 10 стікерів!');
                    stickersCount = 0;
                    sDiv.innerHTML = '';
                    generate();
                }, 800);
            }
        }

        // --- Theme Manager ---
        const baseUrlBg = 'https://olgazheltvai2.github.io/images/backgrounds/';

        function toggleThemeModal() {
            const modal = document.getElementById('theme-modal');
            modal.style.display = modal.style.display === 'grid' ? 'none' : 'grid';
        }

        function checkImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => reject(false);
                img.src = url;
            });
        }

        async function initThemeManager() {
            const defaultBg = baseUrlBg + 'background_1.webp';
            const savedBg = localStorage.getItem('mySavedGameBg') || defaultBg;
            document.body.style.backgroundImage = `url(${savedBg})`;

            const gallery = document.getElementById('theme-modal');
            let i = 1;
            
            while (i <= 1000) {
                const url = baseUrlBg + `background_${i}.webp`;
                try {
                    await checkImage(url);
                    const thumb = document.createElement('div');
                    thumb.className = 'theme-thumb';
                    thumb.style.backgroundImage = `url(${url})`;
                    thumb.innerHTML = `<span>Фон ${i}</span>`;
                    thumb.onclick = () => {
                        document.body.style.backgroundImage = `url(${url})`;
                        localStorage.setItem('mySavedGameBg', url);
                    };
                    gallery.appendChild(thumb);
                    i++;
                } catch (e) {
                    break; 
                }
            }
        }

        window.onload = () => {
            initThemeManager();
            generate();
        };

    </script>
<script src="https://olgazheltvai2.github.io/rizne/pencil.js"></script></body>
</html>
