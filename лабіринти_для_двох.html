<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабіринт: Перегони</title>
    <link rel="stylesheet" href="style.css">
    <!-- Підключаємо Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- Екран налаштування (для вчителя) -->
    <div id="setup-screen">
        <h2>Налаштування гри</h2>
        <p>Введіть питання та відповіді у форматі: <b>Питання=Відповідь</b> (кожна пара з нового рядка)</p>
        <textarea id="questions-input" rows="6" placeholder="2+2=4&#10;Скільки звуків у слові 'їжак'=5"></textarea>
        <br>
        <button id="create-game-btn">Створити гру</button>
        <hr>
        <p>Або приєднайтеся до існуючої гри:</p>
        <input type="text" id="room-id-input" placeholder="ID кімнати">
        <button id="join-game-btn">Приєднатися</button>
    </div>

    <!-- Ігровий екран -->
    <div id="game-screen" style="display: none;">
        <div id="game-info">Кімната: <span id="display-room-id"></span> | Ви: <span id="player-role"></span></div>
        <div id="maze-container">
            <!-- Сюди за допомогою JS буде згенеровано сітку лабіринту -->
        </div>
        
        <!-- Екранні кнопки для учнів на планшетах -->
        <div class="controls">
            <button id="btn-up">⬆️</button>
            <div>
                <button id="btn-left">⬅️</button>
                <button id="btn-down">⬇️</button>
                <button id="btn-right">➡️</button>
            </div>
        </div>
    </div>

    <!-- Модальне вікно для перешкоди (питання) -->
    <div id="question-modal" style="display: none;">
        <div class="modal-content">
            <h3 id="question-text">Запитання</h3>
            <input type="text" id="answer-input" placeholder="Ваша відповідь...">
            <button id="submit-answer-btn">Відповісти</button>
            <p id="feedback-msg" style="color: red;"></p>
        </div>
    </div>

    <!-- Звуки (фідбек) -->
    <audio id="bg-music" src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3" loop volume="0.2"></audio>
    <audio id="step-sfx" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7c569f0653.mp3"></audio>
    <audio id="success-sfx" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3"></audio>
    <audio id="win-sfx" src="https://cdn.pixabay.com/download/audio/2021/08/09/audio_7f6c6d2524.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
