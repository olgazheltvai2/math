<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабіринт: 6 Таємниць</title>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        /* ШРИФТ ARIAL ДЛЯ ВСІЄЇ ГРИ */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: #2c3e50;
            background-color: #85c1e9;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.3s ease;
        }

        #top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.95); padding: 10px 20px;
            border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); margin-bottom: 20px;
        }
        
        #restart-btn {
            background-color: #e74c3c; color: white; border: none; border-radius: 8px;
            padding: 10px 20px; font-size: 20px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0 #c0392b; display: none; margin-left: auto;
        }
        #restart-btn:active { box-shadow: 0 0 0 #c0392b; transform: translateY(4px); }

        #setup-screen, #waiting-screen {
            margin: 40px auto; max-width: 600px; padding: 40px;
            background: rgba(255, 255, 255, 0.95); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h2 { font-size: 36px; margin-top: 0; }
        p { font-size: 24px; font-weight: bold; }

        textarea, input {
            width: 100%; margin-bottom: 20px; padding: 15px; box-sizing: border-box; font-family: Arial, sans-serif;
            border: 4px solid #3498db; border-radius: 12px; font-size: 28px; text-align: center; font-weight: bold;
        }
        textarea { text-align: left; font-size: 24px; }

        .action-btn {
            padding: 20px; background-color: #3498db; color: white; border: none; font-family: Arial, sans-serif;
            border-radius: 12px; cursor: pointer; font-size: 28px; font-weight: bold;
            width: 100%; margin-bottom: 15px; box-shadow: 0 8px 0 #2980b9;
        }
        .action-btn:active { box-shadow: 0 0 0 #2980b9; transform: translateY(8px); }
        .join-btn { background-color: #2ecc71; box-shadow: 0 8px 0 #27ae60; }
        .join-btn:active { box-shadow: 0 0 0 #27ae60; }

        #game-layout { display: flex; justify-content: center; align-items: stretch; gap: 30px; flex-wrap: wrap; }

        /* ЛІВА ПАНЕЛЬ */
        #left-panel {
            background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-width: 220px;
        }
        #my-avatar { font-size: 110px; margin: 0; line-height: 1; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3)); }
        #my-role-name { font-size: 32px; font-weight: bold; margin: 10px 0; }
        #obstacles-left { font-size: 45px; margin-top: 15px; display: flex; gap: 10px; }

        /* ЛАБІРИНТ */
        #maze-container {
            display: grid; grid-template-columns: repeat(15, 45px); grid-template-rows: repeat(15, 45px);
            gap: 2px; background-color: rgba(44, 62, 80, 0.95); padding: 8px; border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .cell { width: 45px; height: 45px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 34px; position: relative; }
        .path { background-color: rgba(236, 240, 241, 0.95); }
        .wall { background-color: #34495e; box-shadow: inset 0 0 8px rgba(0,0,0,0.9); }
        
        .center-locked::after { content: '🏡'; font-size: 42px; opacity: 0.5; }
        .center-locked::before { content: '🔒'; position: absolute; font-size: 30px; z-index: 5; }
        .center-open::after { content: '🏡'; font-size: 42px; filter: drop-shadow(0 0 15px gold); }
        
        .mystery-box::after { content: '❓'; z-index: 2; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)); }
        
        .player1::after { content: '🦊'; filter: drop-shadow(0 0 5px #3498db); z-index: 3; }
        .player2::after { content: '🐰'; background: rgba(255, 255, 255, 0.8); border-radius: 50%; box-shadow: 0 0 15px white, 0 0 5px rgba(0,0,0,0.5); z-index: 3; padding: 2px;}
        .hunter::after { content: '🤠'; filter: drop-shadow(0 0 8px #e74c3c); z-index: 4; font-size: 40px; }

        .answering-bubble::before { content: '💬'; position: absolute; top: -15px; right: -10px; font-size: 20px; z-index: 5; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* КНОПКИ КЕРУВАННЯ */
        .controls {
            background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .controls-row { display: flex; gap: 10px; margin-top: 10px; }
        .controls button { 
            width: 90px; height: 90px; font-size: 45px; background-color: #f39c12; color: white; border: none;
            border-radius: 20px; box-shadow: 0 8px 0 #d35400; cursor: pointer;
        }
        .controls button:active { box-shadow: 0 0 0 #d35400; transform: translateY(8px); background-color: #e67e22; }

        /* ВІЗУАЛЬНІ ПОВІДОМЛЕННЯ (ЗАМІСТЬ ALERT) */
        #temp-msg {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); color: white; padding: 15px 30px; border-radius: 30px;
            font-size: 24px; font-weight: bold; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 2000;
        }
        #temp-msg.show { opacity: 1; }

        #visual-feedback {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999; display: flex; justify-content: center; align-items: center;
            font-size: 200px; opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        }
        #visual-feedback.show { opacity: 1; pointer-events: all; }
        .anim-pop { animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        /* МОДАЛКА ПИТАННЯ */
        #question-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content { background: white; padding: 40px; border-radius: 20px; width: 90%; max-width: 500px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); }
        #question-text { font-size: 48px; margin-top: 0; }
        
        /* THEME MANAGER UI */
        #theme-btn {
            position: fixed; bottom: 30px; right: 30px; font-size: 40px;
            background: white; border-radius: 50%; width: 70px; height: 70px;
            border: none; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.4); z-index: 2000;
            display: flex; justify-content: center; align-items: center; transition: transform 0.2s;
        }
        #theme-btn:hover { transform: scale(1.1); }
        
        #theme-modal-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2001; display: none;
            justify-content: center; align-items: center;
        }
        #theme-modal-wrap {
            background: white; width: 90%; max-width: 800px; max-height: 60vh;
            border-radius: 12px; padding: 20px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #theme-gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px;
        }
        .theme-item {
            position: relative; height: 120px; border-radius: 8px; cursor: pointer;
            background-size: cover; background-position: center; border: 3px solid transparent; transition: 0.2s;
        }
        .theme-item:hover { border-color: #3498db; transform: scale(1.05); }
        .theme-item span {
            position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.6);
            color: white; padding: 8px 0; font-weight: bold; font-size: 18px; text-align: center;
            border-bottom-left-radius: 5px; border-bottom-right-radius: 5px;
        }
        #close-theme-btn {
            background: #e74c3c; color: white; border: none; padding: 10px 20px; font-size: 20px;
            border-radius: 8px; cursor: pointer; float: right; margin-bottom: 10px; font-weight: bold; font-family: Arial, sans-serif;
        }

    </style>
<style id="canvas-click-fix">canvas#draw-canvas { pointer-events: none !important; } .drawing-active canvas#draw-canvas { pointer-events: auto !important; }</style></head>
<body>

    <div id="temp-msg">Повідомлення</div>

    <!-- Кнопка рестарту винесена у верхню панель, яка з'являється під час гри -->
    <div id="top-bar" style="display: none;">
        <button id="restart-btn" onclick="hostRestartGame()">🔄 Новий лабіринт</button>
    </div>

    <!-- Екран налаштування -->
    <div id="setup-screen">
        <h2>Налаштування</h2>
        <div id="teacher-panel">
            <p>Питання=Відповідь</p>
            <textarea id="questions-input" rows="4">2+2=4&#10;5+5=10&#10;10-3=7&#10;2*3=6</textarea>
            <button id="create-game-btn" class="action-btn">🦊 Створити гру</button>
        </div>
        <hr style="margin: 30px 0; border: 2px dashed #bdc3c7;">
        <input type="number" id="room-id-input" placeholder="Код від вчителя" autocomplete="off">
        <button id="join-game-btn" class="action-btn join-btn">🐰 Приєднатися</button>
    </div>

    <!-- Екран очікування -->
    <div id="waiting-screen" style="display: none;">
        <h2>Гра створена!</h2>
        <p>Скажіть учню цей код:</p>
        <h1 id="display-room-id" style="color: #e74c3c; letter-spacing: 15px; font-size: 90px; margin: 30px 0;">...</h1>
        <p>Очікування підключення...</p>
    </div>

    <!-- Ігровий екран -->
    <div id="game-screen" style="display: none;">
        <div id="game-layout">
            <div id="left-panel">
                <div id="my-avatar">🦊</div>
                <div id="my-role-name">Ви</div>
                <div style="font-weight: bold; margin-top: 10px; font-size: 22px;">Залишилось знайти:</div>
                <div id="obstacles-left">❓❓❓</div>
            </div>

            <div id="maze-container"></div>
            
            <div class="controls">
                <button id="btn-up">⬆️</button>
                <div class="controls-row">
                    <button id="btn-left">⬅️</button>
                    <button id="btn-down">⬇️</button>
                    <button id="btn-right">➡️</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Вікно завдання -->
    <div id="question-modal" style="display: none;">
        <div class="modal-content">
            <h3 id="question-text">Запитання</h3>
            <input type="text" id="answer-input" placeholder="Відповідь..." autocomplete="off">
            <button id="submit-answer-btn" class="action-btn" style="background-color: #8e44ad;">Відповісти</button>
            <p id="feedback-msg" style="color: red;"></p>
        </div>
    </div>

    <!-- Theme Manager UI -->
    <button id="theme-btn">⚙️</button>
    <div id="theme-modal-bg">
        <div id="theme-modal-wrap">
            <button id="close-theme-btn">Закрити</button>
            <h2 style="margin-top: 0;">Вибір фону</h2>
            <div id="theme-gallery">
                <!-- Сюди генеруються картинки -->
            </div>
        </div>
    </div>

    <div id="visual-feedback"><div id="feedback-emoji"></div></div>

    <audio id="step-sfx" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7c569f0653.mp3"></audio>
    <audio id="success-sfx" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3"></audio>
    <audio id="win-sfx" src="https://cdn.pixabay.com/download/audio/2021/08/09/audio_7f6c6d2524.mp3"></audio>
    <audio id="lose-sfx" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3"></audio>

    <script>
        // ==========================================
        // THEME MANAGER (Синхронізація фонів без Firebase)
        // ==========================================
        const themeBtn = document.getElementById('theme-btn');
        const themeModalBg = document.getElementById('theme-modal-bg');
        const themeGallery = document.getElementById('theme-gallery');
        const closeThemeBtn = document.getElementById('close-theme-btn');
        
        // Читаємо збережений фон при завантаженні
        const savedBg = localStorage.getItem('mySavedGameBg');
        if (savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;

        themeBtn.onclick = () => themeModalBg.style.display = 'flex';
        closeThemeBtn.onclick = () => themeModalBg.style.display = 'none';

        // Асинхронне завантаження фонів з GitHub
        let bgIndex = 1;
        let missCount = 0;
        const BASE_GH_URL = 'https://olgazheltvai2.github.io/images/backgrounds/';
        
        function loadNextTheme() {
            if (bgIndex > 1000 || missCount >= 3) return; // Зупиняємо, якщо 3 помилки підряд або ліміт
            
            let url = `${BASE_GH_URL}background_${bgIndex}.webp`;
            let img = new Image();
            
            img.onload = () => {
                missCount = 0; // Скидаємо лічильник помилок
                let div = document.createElement('div');
                div.className = 'theme-item';
                div.style.backgroundImage = `url('${url}')`;
                div.innerHTML = `<span>Фон ${bgIndex}</span>`;
                
                div.onclick = () => {
                    applyAndSyncTheme(url);
                    themeModalBg.style.display = 'none';
                };
                
                themeGallery.appendChild(div);
                bgIndex++;
                loadNextTheme();
            };
            
            img.onerror = () => {
                missCount++;
                bgIndex++;
                loadNextTheme(); // Пробуємо наступний номер
            };
            
            img.src = url;
        }
        
        // Запускаємо пошук фонів
        loadNextTheme();

        function applyAndSyncTheme(url) {
            document.body.style.backgroundImage = `url('${url}')`;
            localStorage.setItem('mySavedGameBg', url);
            // Синхронізуємо з іншим гравцем через PeerJS
            if (conn && conn.open) {
                conn.send({ type: 'theme_update', url: url });
            }
        }

        function showMessage(text) {
            const el = document.getElementById('temp-msg');
            el.innerText = text;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }

        // ==========================================
        // ІГРОВА ЛОГІКА
        // ==========================================
        let peer = null, conn = null, isHost = false, playerRole = null;
        let myX, myY;
        let gameQuestions = [];
        let mazeMap = [];
        let boxesData = []; 
        
        let p1Data = { x: 1, y: 1, answering: false, tasksLeft: 3 }; 
        let p2Data = { x: 13, y: 1, answering: false, tasksLeft: 3 }; 
        let hunterData = { x: 7, y: 13, active: true }; 
        
        let currentBoxIndex = null;
        let hunterInterval = null;
        const HUNTER_SPEED = 2500;

        function generateDynamicMaze() {
            let maze = Array(15).fill().map(() => Array(15).fill(0));
            for(let i=0; i<15; i++) { maze[0][i]=1; maze[14][i]=1; maze[i][0]=1; maze[i][14]=1; }
            for(let y=2; y<13; y++) {
                for(let x=2; x<13; x++) {
                    if(Math.random() < 0.25) maze[y][x] = 1;
                }
            }
            for(let dy=-1; dy<=1; dy++) {
                for(let dx=-1; dx<=1; dx++) { maze[7+dy][7+dx] = 0; }
            }
            maze[1][1]=0; maze[1][2]=0; maze[2][1]=0;
            maze[1][13]=0; maze[1][12]=0; maze[2][13]=0;
            return maze;
        }

        // ГЕНЕРАЦІЯ ЛИШЕ 6 КОРОБОК (3 для P1, 3 для P2)
        function generateMysteryBoxes(maze) {
            let boxes = [];
            let emptySpots = [];
            for (let y = 1; y < 14; y++) {
                for (let x = 1; x < 14; x++) {
                    if (maze[y][x] === 0 && !(x===1 && y===1) && !(x===13 && y===1) && !(x===7 && y===7)) {
                        emptySpots.push({x, y});
                    }
                }
            }
            emptySpots.sort(() => Math.random() - 0.5); 
            
            // Завжди генеруємо 6 точок: 3 належать P1, 3 належать P2
            let types = ['p1','p1','p1', 'p2','p2','p2'];
            types.sort(() => Math.random() - 0.5); // Рандомізуємо, кому яка належить

            for(let i=0; i<6; i++) {
                boxes.push({ x: emptySpots[i].x, y: emptySpots[i].y, type: types[i], active: true });
            }
            return boxes;
        }

        // --- МЕРЕЖА: ВЧИТЕЛЬ ---
        document.getElementById('create-game-btn').addEventListener('click', () => {
            const raw = document.getElementById('questions-input').value.split('\n');
            gameQuestions = raw.map(q => { const p = q.split('='); return { q: p[0]?.trim(), a: p[1]?.trim() }; }).filter(q => q.q && q.a);
            if (gameQuestions.length < 3) return alert("Мінімум 3 питання!");

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('waiting-screen').style.display = 'block';
            document.getElementById('top-bar').style.display = 'flex'; // Показуємо панель

            const numericCode = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer('maze-' + numericCode, { config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }]} }); 
            
            peer.on('open', (id) => { document.getElementById('display-room-id').innerText = numericCode; });

            peer.on('connection', (connection) => {
                conn = connection;
                conn.on('open', () => {
                    isHost = true;
                    playerRole = 'p1';
                    document.getElementById('restart-btn').style.display = 'block'; 
                    startNewRound(true); 
                    setupConnectionHandlers();
                    // Синхронізуємо поточний фон з учнем при підключенні
                    if(localStorage.getItem('mySavedGameBg')) {
                        conn.send({ type: 'theme_update', url: localStorage.getItem('mySavedGameBg') });
                    }
                });
            });
            peer.on('error', (e) => { console.error(e); alert("Помилка з'єднання. Спробуйте ще раз."); location.reload(); });
        });

        // --- МЕРЕЖА: УЧЕНЬ ---
        document.getElementById('join-game-btn').addEventListener('click', () => {
            const code = document.getElementById('room-id-input').value.trim();
            if (!code || code.length !== 4) return alert("Введіть 4 цифри!");

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('top-bar').style.display = 'flex'; // Показуємо панель
            peer = new Peer({ config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }]} }); 

            peer.on('open', () => {
                conn = peer.connect('maze-' + code);
                conn.on('open', () => {
                    playerRole = 'p2';
                    setupConnectionHandlers();
                });
            });
            peer.on('error', () => { alert("Код не знайдено!"); location.reload(); });
        });

        function setupConnectionHandlers() {
            conn.on('data', (data) => {
                if (data.type === 'theme_update') {
                    // Приймаємо новий фон від іншого гравця
                    document.body.style.backgroundImage = `url('${data.url}')`;
                    localStorage.setItem('mySavedGameBg', data.url);
                }
                if (data.type === 'init') {
                    gameQuestions = data.questions;
                    mazeMap = data.maze;
                    boxesData = data.boxes;
                    p1Data = { x: 1, y: 1, answering: false, tasksLeft: 3 };
                    p2Data = { x: 13, y: 1, answering: false, tasksLeft: 3 };
                    hunterData.x = 7; hunterData.y = 13;
                    
                    myX = playerRole === 'p1' ? p1Data.x : p2Data.x; 
                    myY = playerRole === 'p1' ? p1Data.y : p2Data.y; 
                    startGameUI();
                }
                if (data.type === 'move') {
                    if (data.role === 'p1') { p1Data.x = data.x; p1Data.y = data.y; }
                    if (data.role === 'p2') { p2Data.x = data.x; p2Data.y = data.y; }
                    drawMaze();
                }
                if (data.type === 'state') {
                    if (data.role === 'p1') p1Data.answering = data.answering;
                    if (data.role === 'p2') p2Data.answering = data.answering;
                    drawMaze();
                }
                if (data.type === 'box_clear') {
                    boxesData[data.boxIndex].active = false;
                    if(data.role === 'p1') p1Data.tasksLeft--;
                    if(data.role === 'p2') p2Data.tasksLeft--;
                    drawMaze();
                    updateLeftPanel();
                }
                if (data.type === 'hunter') { hunterData.x = data.x; hunterData.y = data.y; drawMaze(); }
                if (data.type === 'win') showVisualFeedback('🏆', 'win');
                if (data.type === 'lose') showVisualFeedback('💥', 'lose'); 
            });
        }

        function hostRestartGame() {
            if(!isHost) return;
            startNewRound(true);
        }

        function startNewRound(sendData) {
            p1Data = { x: 1, y: 1, answering: false, tasksLeft: 3 };
            p2Data = { x: 13, y: 1, answering: false, tasksLeft: 3 };
            hunterData = { x: 7, y: 13, active: true };
            
            document.getElementById('question-modal').style.display = 'none';

            if (sendData) {
                mazeMap = generateDynamicMaze();
                boxesData = generateMysteryBoxes(mazeMap); // 6 коробок
                conn.send({ type: 'init', questions: gameQuestions, maze: mazeMap, boxes: boxesData });
                myX = p1Data.x; myY = p1Data.y;
                startGameUI();
                
                if(hunterInterval) clearInterval(hunterInterval);
                hunterInterval = setInterval(moveHunter, HUNTER_SPEED);
            }
        }

        function startGameUI() {
            document.getElementById('waiting-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            updateLeftPanel();
            drawMaze();
        }

        function updateLeftPanel() {
            const isP1 = playerRole === 'p1';
            document.getElementById('my-avatar').innerText = isP1 ? '🦊' : '🐰';
            
            let tasks = isP1 ? p1Data.tasksLeft : p2Data.tasksLeft;
            let icons = '';
            for(let i=0; i<tasks; i++) icons += '❓';
            if(tasks === 0) icons = '✅ Знайдено!';
            
            document.getElementById('obstacles-left').innerText = icons;
        }

        function drawMaze() {
            const container = document.getElementById('maze-container');
            container.innerHTML = '';
            
            let myTasksLeft = playerRole === 'p1' ? p1Data.tasksLeft : p2Data.tasksLeft;

            for (let y = 0; y < 15; y++) {
                for (let x = 0; x < 15; x++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    if (mazeMap[y][x] === 1) cell.classList.add('wall');
                    else cell.classList.add('path');
                    
                    if (x === 7 && y === 7) {
                        if (myTasksLeft > 0) cell.classList.add('center-locked');
                        else cell.classList.add('center-open');
                    }

                    let hasBox = boxesData.find(b => b.x === x && b.y === y && b.active);
                    if(hasBox) cell.classList.add('mystery-box');

                    if (p1Data.x === x && p1Data.y === y) {
                        cell.classList.add('player1');
                        if(p1Data.answering) cell.classList.add('answering-bubble');
                    }
                    if (p2Data.x === x && p2Data.y === y) {
                        cell.classList.add('player2');
                        if(p2Data.answering) cell.classList.add('answering-bubble');
                    }
                    if (hunterData.x === x && hunterData.y === y && hunterData.active) {
                        cell.classList.add('hunter');
                    }
                    container.appendChild(cell);
                }
            }
        }

        // --- КЕРУВАННЯ ---
        window.addEventListener('keydown', (e) => {
            if (document.getElementById('question-modal').style.display === 'flex') return;
            let nx = myX, ny = myY;
            if (e.key === 'ArrowUp') ny--; if (e.key === 'ArrowDown') ny++;
            if (e.key === 'ArrowLeft') nx--; if (e.key === 'ArrowRight') nx++;
            if (nx !== myX || ny !== myY) tryMove(nx, ny);
        });

        document.getElementById('btn-up').addEventListener('click', () => tryMove(myX, myY - 1));
        document.getElementById('btn-down').addEventListener('click', () => tryMove(myX, myY + 1));
        document.getElementById('btn-left').addEventListener('click', () => tryMove(myX - 1, myY));
        document.getElementById('btn-right').addEventListener('click', () => tryMove(myX + 1, myY));

        function tryMove(nx, ny) {
            if (nx < 0 || nx > 14 || ny < 0 || ny > 14) return;
            if (mazeMap[ny][nx] === 1) return; 
            if (playerRole === 'p1' && p2Data.x === nx && p2Data.y === ny) return; 
            if (playerRole === 'p2' && p1Data.x === nx && p1Data.y === ny) return;

            // Будиночок (тільки якщо вирішив 3 завдання)
            if (nx === 7 && ny === 7) {
                let tasks = playerRole === 'p1' ? p1Data.tasksLeft : p2Data.tasksLeft;
                if (tasks > 0) {
                    showMessage("Спочатку знайди всі свої завдання! 🔒");
                    return; 
                }
            }

            // Перевірка Коробок (всього їх 6)
            let boxIndex = boxesData.findIndex(b => b.x === nx && b.y === ny && b.active);
            if (boxIndex !== -1) {
                let box = boxesData[boxIndex];
                
                if (box.type === playerRole) {
                    // Це наше завдання
                    triggerQuestion(boxIndex);
                    return; 
                } else {
                    // Це завдання суперника (порожнє/чуже для нас)
                    showMessage("Це чужа перешкода! 🛑");
                    return; // Блокуємо прохід як стіну
                }
            }

            myX = nx; myY = ny;
            if (playerRole === 'p1') { p1Data.x = nx; p1Data.y = ny; } else { p2Data.x = nx; p2Data.y = ny; }
            
            drawMaze();
            conn.send({ type: 'move', role: playerRole, x: myX, y: myY });
            document.getElementById('step-sfx').play().catch(()=>{});

            // ПЕРЕМОГА
            if (nx === 7 && ny === 7) {
                conn.send({ type: 'win', role: playerRole });
                showVisualFeedback('🏆', 'win');
            }
        }

        // --- МИСЛИВЕЦЬ ---
        function moveHunter() {
            if (!isHost) return;
            let path1 = p1Data.answering ? null : findPath(hunterData.x, hunterData.y, p1Data.x, p1Data.y);
            let path2 = p2Data.answering ? null : findPath(hunterData.x, hunterData.y, p2Data.x, p2Data.y);

            let bestPath = null;
            if (path1 && path2) bestPath = (path1.length <= path2.length) ? path1 : path2;
            else if (path1) bestPath = path1; else if (path2) bestPath = path2;

            if (bestPath && bestPath.length > 0) {
                hunterData.x = bestPath[0].x; hunterData.y = bestPath[0].y;
            } else {
                let dirs = [[0,-1], [0,1], [-1,0], [1,0]];
                let validMoves = dirs.map(d => ({x: hunterData.x+d[0], y: hunterData.y+d[1]})).filter(p => mazeMap[p.y][p.x] === 0);
                if (validMoves.length > 0) {
                    let rm = validMoves[Math.floor(Math.random() * validMoves.length)];
                    hunterData.x = rm.x; hunterData.y = rm.y;
                }
            }

            drawMaze();
            conn.send({ type: 'hunter', x: hunterData.x, y: hunterData.y });

            if ((hunterData.x === p1Data.x && hunterData.y === p1Data.y && !p1Data.answering) ||
                (hunterData.x === p2Data.x && hunterData.y === p2Data.y && !p2Data.answering)) {
                clearInterval(hunterInterval);
                conn.send({ type: 'lose' });
                showVisualFeedback('💥', 'lose');
            }
        }

        function findPath(sx, sy, tx, ty) {
            let queue = [{x: sx, y: sy, path: []}];
            let visited = new Set([`${sx},${sy}`]);
            while(queue.length > 0) {
                let curr = queue.shift();
                if (curr.x === tx && curr.y === ty) return curr.path;
                let dirs = [[0,-1], [0,1], [-1,0], [1,0]];
                for (let d of dirs) {
                    let nx = curr.x + d[0], ny = curr.y + d[1];
                    if (nx>=0 && nx<15 && ny>=0 && ny<15 && mazeMap[ny][nx] !== 1) {
                        if ((p1Data.x === nx && p1Data.y === ny && p1Data.answering) || (p2Data.x === nx && p2Data.y === ny && p2Data.answering)) continue;
                        if (!visited.has(`${nx},${ny}`)) {
                            visited.add(`${nx},${ny}`);
                            queue.push({x: nx, y: ny, path: [...curr.path, {x:nx, y:ny}]});
                        }
                    }
                }
            }
            return null;
        }

        // --- ВІДПОВІДІ НА ЗАВДАННЯ ---
        function triggerQuestion(boxIndex) {
            currentBoxIndex = boxIndex;
            if(playerRole === 'p1') p1Data.answering = true; else p2Data.answering = true;
            conn.send({ type: 'state', role: playerRole, answering: true });
            drawMaze();

            const q = gameQuestions[Math.floor(Math.random() * gameQuestions.length)];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('question-text').dataset.answer = q.a;
            document.getElementById('answer-input').value = '';
            document.getElementById('feedback-msg').innerText = '';
            document.getElementById('question-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('answer-input').focus(), 100);
        }

        document.getElementById('submit-answer-btn').addEventListener('click', checkAnswer);
        document.getElementById('answer-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAnswer(); });

        function checkAnswer() {
            const ua = document.getElementById('answer-input').value.trim().toLowerCase();
            const ca = document.getElementById('question-text').dataset.answer.toLowerCase();

            if (ua === ca) {
                document.getElementById('success-sfx').play().catch(()=>{});
                document.getElementById('question-modal').style.display = 'none';
                
                if(playerRole === 'p1') { p1Data.answering = false; p1Data.tasksLeft--; } 
                else { p2Data.answering = false; p2Data.tasksLeft--; }
                
                conn.send({ type: 'state', role: playerRole, answering: false });

                boxesData[currentBoxIndex].active = false;
                drawMaze();
                updateLeftPanel();
                conn.send({ type: 'box_clear', boxIndex: currentBoxIndex, role: playerRole });
                showMessage("✅ Завдання виконано!");
            } else {
                document.getElementById('feedback-msg').innerText = 'Спробуй ще раз!';
            }
        }

        // --- ВІЗУАЛЬНИЙ ФІДБЕК ---
        function showVisualFeedback(emoji, type) {
            const overlay = document.getElementById('visual-feedback');
            const icon = document.getElementById('feedback-emoji');
            
            icon.innerText = emoji;
            icon.className = 'anim-pop';
            overlay.classList.add('show');

            if (type === 'win') document.getElementById('win-sfx').play().catch(()=>{});
            if (type === 'lose') document.getElementById('lose-sfx').play().catch(()=>{});

            setTimeout(() => {
                overlay.classList.remove('show');
                icon.className = '';
                if (isHost) hostRestartGame(); 
            }, 3500);
        }
    </script>
