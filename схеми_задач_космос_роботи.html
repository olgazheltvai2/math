<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Math Drones</title>
    <style>
        /* Основні налаштування стилю для пропорції 16:9 */
        body {
            margin: 0;
            padding: 0;
            background-color: #050914;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            max-width: 177.78vh; /* Співвідношення 16:9 */
            height: 56.25vw;
            max-height: 100vh;
            background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 50%, #020617 100%);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            border-radius: 15px;
            border: 2px solid #1e293b;
        }

        /* Деталізований векторний фон З ЛЕГКИМ РОЗМИТТЯМ за запитом */
        .bg-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            filter: blur(3px); /* Легке розмиття фону */
        }

        /* Живий персонаж (Робот-Наставник) */
        #mentor-robot {
            position: absolute;
            bottom: 10%;
            left: 2%;
            width: 22%;
            height: 50%;
            z-index: 5;
            pointer-events: none;
            animation: floatRobot 4s ease-in-out infinite;
        }

        @keyframes floatRobot {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(1deg); }
        }

        /* Анімація очей робота (кліпання) */
        .robot-eye {
            animation: blink 4s infinite;
            transform-origin: center;
        }

        @keyframes blink {
            0%, 46%, 48%, 100% { transform: scaleY(1); }
            47% { transform: scaleY(0.1); }
        }
        
        .robot-antenna {
            animation: radar 3s infinite linear;
            transform-origin: 50% 10%;
        }
        
        @keyframes radar {
            0%, 100% { transform: rotate(-15deg); }
            50% { transform: rotate(15deg); }
        }

        /* Сцена для дронів (зміщена вправо, щоб дати місце роботу) */
        #stage {
            position: absolute;
            bottom: 12%;
            right: 2%;
            width: 75%;
            height: 35%;
            z-index: 10;
            display: flex;
            align-items: flex-end;
            background: radial-gradient(ellipse at bottom, rgba(0, 255, 255, 0.1) 0%, transparent 60%);
            border-bottom: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
        }

        .bunny-wrapper {
            position: absolute;
            bottom: 10%;
            width: 10%;
            transition: left 1s ease-in-out, opacity 0.5s;
            transform-origin: bottom center;
        }

        /* Анімації руху та стрибків (перероблені на космічний політ) */
        @keyframes hop {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-40%) scale(0.95, 1.05); }
        }

        @keyframes dance {
            0%, 100% { transform: translateY(0) rotate(0deg); filter: hue-rotate(0deg); }
            25% { transform: translateY(-20%) rotate(-15deg); filter: hue-rotate(90deg); }
            50% { transform: translateY(-10%) rotate(0deg); filter: hue-rotate(180deg); }
            75% { transform: translateY(-20%) rotate(15deg); filter: hue-rotate(270deg); }
        }

        .hopping {
            animation: hop 0.5s infinite alternate;
        }

        .dancing {
            animation: dance 0.8s infinite;
        }

        /* Інтерфейс схеми та введення (Голографічний стиль) */
        #ui-layer {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #schema-board {
            background: rgba(10, 20, 45, 0.85);
            padding: 15px 30px;
            border-radius: 20px;
            border: 2px solid #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(0, 242, 254, 0.2);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #schema-display {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 5px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Стилізація інпутів у кібер-стилі */
        input[type="number"], .sign-toggle {
            width: 4.5vw;
            height: 4.5vw;
            min-width: 45px;
            min-height: 45px;
            font-size: 2.5vw;
            font-weight: 900;
            text-align: center;
            border: 2px solid #00f2fe;
            border-radius: 10px;
            background: rgba(2, 6, 23, 0.8);
            color: #00f2fe;
            text-shadow: 0 0 8px #00f2fe;
            box-shadow: inset 0 0 10px rgba(0, 242, 254, 0.3);
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            appearance: none;
            -moz-appearance: textfield;
            font-family: 'Courier New', Courier, monospace;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            transform: scale(1.1);
            border-color: #f0abfc;
            color: #f0abfc;
            text-shadow: 0 0 10px #f0abfc;
            box-shadow: inset 0 0 15px rgba(240, 171, 252, 0.5), 0 0 15px rgba(240, 171, 252, 0.4);
        }

        .sign-toggle {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(192, 38, 211, 0.2);
            border-color: #c026d3;
            color: #f0abfc;
            text-shadow: 0 0 8px #f0abfc;
            user-select: none;
        }

        .equals-sign {
            font-size: 3vw;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        /* Мінімалістичні кнопки навігації (Неоновий портал) */
        .nav-container {
            position: absolute;
            bottom: 5%;
            right: 5%;
            display: flex;
            gap: 15px;
            z-index: 30;
        }

        .nav-btn {
            width: 4.5vw;
            height: 4.5vw;
            min-width: 55px;
            min-height: 55px;
            border-radius: 50%;
            border: 2px solid #22d3ee;
            background: radial-gradient(circle, #0891b2 0%, #164e63 100%);
            color: #cffafe;
            font-size: 2vw;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.5), inset 0 0 10px rgba(34, 211, 238, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.8), inset 0 0 15px rgba(34, 211, 238, 0.8);
            background: radial-gradient(circle, #06b6d4 0%, #0891b2 100%);
        }

        .nav-btn:active {
            transform: translateY(2px) scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    
    <!-- Сюжетний фон у векторі (Космос, Планети, Зірки) з розмиттям -->
    <svg class="bg-layer" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMax slice">
        <defs>
            <radialGradient id="planetBody" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#f472b6"/>
                <stop offset="50%" stop-color="#9333ea"/>
                <stop offset="100%" stop-color="#312e81"/>
            </radialGradient>
            <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="rgba(45, 212, 191, 0.8)"/>
                <stop offset="50%" stop-color="rgba(45, 212, 191, 0.2)"/>
                <stop offset="100%" stop-color="rgba(45, 212, 191, 0.9)"/>
            </linearGradient>
            <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="30%" stop-color="#a5f3fc"/>
                <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
        </defs>
        
        <!-- Туманність -->
        <ellipse cx="200" cy="150" rx="300" ry="150" fill="#4c1d95" opacity="0.3" filter="blur(40px)"/>
        <ellipse cx="800" cy="300" rx="400" ry="200" fill="#0891b2" opacity="0.2" filter="blur(50px)"/>

        <!-- Зірки (Анімовані) -->
        <g fill="url(#starGlow)">
            <circle cx="150" cy="80" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
            <circle cx="450" cy="120" r="4"><animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/></circle>
            <circle cx="850" cy="60" r="2.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" repeatCount="indefinite"/></circle>
            <circle cx="920" cy="250" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
            <circle cx="300" cy="350" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
            <circle cx="50" cy="220" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
            <circle cx="600" cy="400" r="4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
        </g>

        <!-- Велика планета з кільцями -->
        <g transform="translate(800, 150) rotate(-15)">
            <ellipse cx="0" cy="0" rx="140" ry="40" fill="transparent" stroke="url(#ring)" stroke-width="15"/>
            <circle cx="0" cy="0" r="70" fill="url(#planetBody)"/>
            <ellipse cx="0" cy="0" rx="140" ry="40" fill="transparent" stroke="url(#ring)" stroke-width="15" stroke-dasharray="220 220" stroke-dashoffset="220"/>
        </g>

        <!-- Далекий супутник -->
        <circle cx="200" cy="100" r="25" fill="#94a3b8"/>
        <circle cx="190" cy="95" r="5" fill="#475569" opacity="0.6"/>
        <circle cx="210" cy="110" r="8" fill="#475569" opacity="0.6"/>
        <circle cx="195" cy="115" r="3" fill="#475569" opacity="0.6"/>
        
        <!-- Метеорит -->
        <path d="M -50 -50 L -30 -40" stroke="#fff" stroke-width="2">
            <animateTransform attributeName="transform" type="translate" from="0 0" to="1200 800" dur="8s" repeatCount="indefinite" />
        </path>
    </svg>

    <!-- Живий персонаж: Робот-Наставник "Нейро" -->
    <div id="mentor-robot">
        <svg viewBox="0 0 200 300" style="width: 100%; height: 100%; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));">
            <defs>
                <linearGradient id="roboBody" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#e2e8f0"/>
                    <stop offset="50%" stop-color="#94a3b8"/>
                    <stop offset="100%" stop-color="#475569"/>
                </linearGradient>
                <linearGradient id="roboScreen" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#020617"/>
                    <stop offset="100%" stop-color="#0f172a"/>
                </linearGradient>
                <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#22d3ee"/>
                    <stop offset="100%" stop-color="#0891b2"/>
                </radialGradient>
            </defs>
            <!-- Антена -->
            <line class="robot-antenna" x1="100" y1="40" x2="100" y2="10" stroke="#94a3b8" stroke-width="4"/>
            <circle class="robot-antenna" cx="100" cy="10" r="6" fill="#f0abfc"/>
            
            <!-- Голова (Екран) -->
            <rect x="50" y="40" width="100" height="70" rx="15" fill="url(#roboBody)"/>
            <rect x="60" y="50" width="80" height="50" rx="8" fill="url(#roboScreen)"/>
            
            <!-- Очі -->
            <g class="robot-eye">
                <path d="M 75 75 Q 80 65 85 75 Q 80 70 75 75" fill="#22d3ee" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
                <path d="M 115 75 Q 120 65 125 75 Q 120 70 115 75" fill="#22d3ee" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
            </g>

            <!-- Шия -->
            <rect x="90" y="110" width="20" height="15" fill="#475569"/>
            
            <!-- Тіло -->
            <path d="M 60 125 L 140 125 L 150 200 L 50 200 Z" fill="url(#roboBody)"/>
            
            <!-- Енергетичне ядро -->
            <circle cx="100" cy="160" r="20" fill="url(#coreGlow)">
                <animate attributeName="r" values="18;22;18" dur="2s" repeatCount="indefinite"/>
            </circle>
            
            <!-- Руки -->
            <path d="M 60 135 Q 20 160 30 200" fill="none" stroke="url(#roboBody)" stroke-width="12" stroke-linecap="round"/>
            <path d="M 140 135 Q 180 160 170 200" fill="none" stroke="url(#roboBody)" stroke-width="12" stroke-linecap="round">
                <animateTransform attributeName="transform" type="rotate" values="0 140 135; -15 140 135; 0 140 135" dur="3s" repeatCount="indefinite"/>
            </path>
            <!-- Долоні -->
            <circle cx="30" cy="200" r="10" fill="#334155"/>
            <circle cx="170" cy="200" r="10" fill="#334155">
                <animateTransform attributeName="transform" type="rotate" values="0 170 200; -15 170 200; 0 170 200" dur="3s" repeatCount="indefinite"/>
            </circle>
            
            <!-- Двигун підвіски (замість ніг) -->
            <path d="M 70 200 L 130 200 L 110 230 L 90 230 Z" fill="#334155"/>
            <!-- Полум'я -->
            <path d="M 90 230 Q 100 280 110 230" fill="#0ea5e9">
                <animate attributeName="d" values="M 90 230 Q 100 280 110 230; M 90 230 Q 100 250 110 230; M 90 230 Q 100 280 110 230" dur="0.2s" repeatCount="indefinite"/>
            </path>
        </svg>
    </div>

    <!-- Сцена для анімації (Дронів) -->
    <div id="stage"></div>

    <!-- UI: Схема задачі та поля для введення прикладу -->
    <div id="ui-layer">
        <div id="schema-board">
            <!-- Графічна схема генерується динамічно -->
            <div id="schema-display"></div>
            <div class="input-group">
                <input type="number" id="inp-a" min="0" max="10">
                <div class="sign-toggle" id="inp-sign">+</div>
                <input type="number" id="inp-b" min="0" max="10">
                <span class="equals-sign">=</span>
                <input type="number" id="inp-c" min="0" max="20">
            </div>
        </div>
    </div>

    <!-- Мінімалістична кнопка навігації (тільки вперед) -->
    <div class="nav-container">
        <button id="btn-next" class="nav-btn">➔</button>
    </div>

</div>

<script>
    // Аудіо контекст для генерації звуків 
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playTone(freq, type, duration, vol=0.5, slideFreq=null) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if(slideFreq) {
            osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
        }
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // Звуки (залишені оригінальними)
    function soundHop() { playTone(400, 'sine', 0.15, 0.3, 600); }
    function soundPop() { playTone(600, 'square', 0.1, 0.2, 800); }
    function soundSuccess() {
        playTone(440, 'triangle', 0.2, 0.4);
        setTimeout(() => playTone(554, 'triangle', 0.2, 0.4), 150);
        setTimeout(() => playTone(659, 'triangle', 0.4, 0.4), 300);
        setTimeout(() => playTone(880, 'triangle', 0.6, 0.5), 450);
    }
    function soundError() { playTone(150, 'sawtooth', 0.3, 0.5, 100); }

    // Деталізований SVG Енергетичного Дрона (замість Зайця)
    const bunnySVG = `
    <svg viewBox="0 0 100 120" style="width: 100%; height: 100%; filter: drop-shadow(0px 10px 5px rgba(0,255,255,0.2));">
        <defs>
            <linearGradient id="droneMetal" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#cbd5e1"/>
                <stop offset="100%" stop-color="#64748b"/>
            </linearGradient>
            <radialGradient id="droneGlass" cx="50%" cy="30%" r="50%">
                <stop offset="0%" stop-color="#cffafe"/>
                <stop offset="70%" stop-color="#06b6d4"/>
                <stop offset="100%" stop-color="#164e63"/>
            </radialGradient>
        </defs>
        <!-- Полум'я турбіни (анімоване) -->
        <path d="M 40 85 Q 50 120 60 85" fill="#0ea5e9">
            <animate attributeName="d" values="M 40 85 Q 50 120 60 85; M 40 85 Q 50 100 60 85; M 40 85 Q 50 120 60 85" dur="0.1s" repeatCount="indefinite"/>
        </path>
        <path d="M 45 85 Q 50 110 55 85" fill="#cffafe">
            <animate attributeName="d" values="M 45 85 Q 50 110 55 85; M 45 85 Q 50 95 55 85; M 45 85 Q 50 110 55 85" dur="0.1s" repeatCount="indefinite"/>
        </path>
        <!-- Нижня база -->
        <ellipse cx="50" cy="80" rx="35" ry="12" fill="#334155"/>
        <ellipse cx="50" cy="77" rx="35" ry="12" fill="url(#droneMetal)"/>
        <!-- Кабіна / Купол -->
        <path d="M 20 75 Q 20 30 50 30 Q 80 30 80 75 Z" fill="url(#droneGlass)"/>
        <!-- Бліки на склі -->
        <path d="M 25 70 Q 25 40 45 35 Q 25 50 35 70 Z" fill="#ffffff" opacity="0.4"/>
        <!-- Енергетичне кільце -->
        <ellipse cx="50" cy="65" rx="36" ry="10" fill="transparent" stroke="#22d3ee" stroke-width="2" opacity="0.8"/>
        <!-- Антена -->
        <line x1="50" y1="30" x2="50" y2="10" stroke="#94a3b8" stroke-width="3"/>
        <circle cx="50" cy="8" r="4" fill="#f472b6">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite"/>
        </circle>
        <!-- Внутрішнє ядро дрона (око) -->
        <circle cx="50" cy="55" r="8" fill="#fdf4ff" filter="drop-shadow(0 0 4px #f0abfc)"/>
        <circle cx="50" cy="55" r="3" fill="#c026d3"/>
    </svg>`;

    // Змінні гри (оригінальна логіка збережена повністю)
    let valA = 0;
    let valB = 0;
    let valResult = 0;
    let operation = '+'; 
    let activeBunnies = [];
    let isSolved = false;

    // DOM Елементи
    const stage = document.getElementById('stage');
    const schemaDisplay = document.getElementById('schema-display');
    const inpA = document.getElementById('inp-a');
    const inpB = document.getElementById('inp-b');
    const inpC = document.getElementById('inp-c');
    const inpSign = document.getElementById('inp-sign');
    const btnNext = document.getElementById('btn-next');

    // Обробники подій
    inpSign.addEventListener('click', () => {
        if(isSolved) return;
        soundPop();
        inpSign.textContent = inpSign.textContent === '+' ? '-' : '+';
        checkWinCondition();
    });

    [inpA, inpB, inpC].forEach(inp => {
        inp.addEventListener('input', () => {
            soundPop();
            checkWinCondition();
        });
    });

    btnNext.addEventListener('click', () => { soundPop(); generateLevel(); });

    // Генерація векторної схеми задачі (оновлено для кібер-дизайну)
    function renderSchema(a, b, op) {
        const W = 200;
        const startX = 20;
        let svg = '';

        if (op === '+') {
            const total = a + b;
            const splitX = startX + (a / total) * W;
            
            svg = `
            <svg width="240" height="120" viewBox="0 0 240 120" style="font-family: 'Courier New', monospace; font-weight: 900; font-size: 22px; fill: #22d3ee; filter: drop-shadow(0 0 4px #22d3ee);">
                <!-- Головна лінія -->
                <line x1="20" y1="60" x2="220" y2="60" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
                <!-- Зарубки -->
                <line x1="20" y1="50" x2="20" y2="70" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
                <line x1="${splitX}" y1="50" x2="${splitX}" y2="70" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
                <line x1="220" y1="50" x2="220" y2="70" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>

                <!-- Верхні дуги (Відомі частини) -->
                <path d="M 20,45 Q ${(20+splitX)/2},15 ${splitX},45" fill="none" stroke="#22d3ee" stroke-width="3"/>
                <text x="${(20+splitX)/2}" y="25" text-anchor="middle">${a}</text>

                <path d="M ${splitX},45 Q ${(splitX+220)/2},15 220,45" fill="none" stroke="#22d3ee" stroke-width="3"/>
                <text x="${(splitX+220)/2}" y="25" text-anchor="middle">${b}</text>

                <!-- Нижня дуга (Невідома сума) -->
                <path d="M 20,75 Q 120,110 220,75" fill="none" stroke="#f0abfc" stroke-width="3" stroke-dasharray="6,6"/>
                <text x="120" y="115" text-anchor="middle" fill="#f0abfc" filter="drop-shadow(0 0 4px #f0abfc)">?</text>
            </svg>`;
        } else {
            const splitX = startX + (b / a) * W;
            
            svg = `
            <svg width="240" height="120" viewBox="0 0 240 120" style="font-family: 'Courier New', monospace; font-weight: 900; font-size: 22px; fill: #22d3ee; filter: drop-shadow(0 0 4px #22d3ee);">
                <line x1="20" y1="60" x2="220" y2="60" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
                <line x1="20" y1="50" x2="20" y2="70" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
                <line x1="${splitX}" y1="50" x2="${splitX}" y2="70" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
                <line x1="220" y1="50" x2="220" y2="70" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>

                <path d="M 20,45 Q 120,10 220,45" fill="none" stroke="#22d3ee" stroke-width="3"/>
                <text x="120" y="25" text-anchor="middle">${a}</text>

                <path d="M 20,75 Q ${(20+splitX)/2},105 ${splitX},75" fill="none" stroke="#22d3ee" stroke-width="3"/>
                <text x="${(20+splitX)/2}" y="110" text-anchor="middle">${b}</text>

                <path d="M ${splitX},75 Q ${(splitX+220)/2},105 220,75" fill="none" stroke="#f0abfc" stroke-width="3" stroke-dasharray="6,6"/>
                <text x="${(splitX+220)/2}" y="110" text-anchor="middle" fill="#f0abfc" filter="drop-shadow(0 0 4px #f0abfc)">?</text>
            </svg>`;
        }
        schemaDisplay.innerHTML = svg;
    }

    // Робота з персонажами (оригінальна логіка)
    function createBunny(id) {
        const div = document.createElement('div');
        div.className = 'bunny-wrapper';
        div.id = `bunny-${id}`;
        div.innerHTML = bunnySVG;
        div.style.left = '-20%'; 
        stage.appendChild(div);
        return div;
    }

    function updateBunnyPositions() {
        const total = activeBunnies.length;
        const spacing = 80 / (total + 1); 
        activeBunnies.forEach((bunny, index) => {
            const targetLeft = 10 + spacing * (index + 1);
            bunny.style.left = `${targetLeft}%`;
        });
    }

    function animateHopIn(count, onComplete = null) {
        let spawned = 0;
        const interval = setInterval(() => {
            if(spawned >= count) {
                clearInterval(interval);
                setTimeout(() => { if(onComplete) onComplete(); }, 1000);
                return;
            }
            const bunny = createBunny(Date.now() + spawned);
            activeBunnies.push(bunny);
            bunny.classList.add('hopping');
            soundHop();
            
            setTimeout(() => { updateBunnyPositions(); }, 50);
            setTimeout(() => { bunny.classList.remove('hopping'); }, 1000);

            spawned++;
        }, 400);
    }

    function animateHopOut(count, onComplete = null) {
        let removed = 0;
        const toRemove = activeBunnies.slice(-count);
        
        const interval = setInterval(() => {
            if(removed >= count) {
                clearInterval(interval);
                setTimeout(() => { if(onComplete) onComplete(); }, 1000);
                return;
            }
            const bunny = toRemove[removed];
            bunny.classList.add('hopping');
            bunny.style.left = '120%'; 
            soundHop();
            
            activeBunnies = activeBunnies.filter(b => b !== bunny);
            setTimeout(() => {
                bunny.remove();
                updateBunnyPositions(); 
            }, 1000);

            removed++;
        }, 400);
    }

    function generateLevel() {
        isSolved = false;
        
        // Очищення сцени
        stage.innerHTML = '';
        activeBunnies = [];
        inpA.value = '';
        inpB.value = '';
        inpC.value = '';
        inpA.disabled = false;
        inpB.disabled = false;
        inpC.disabled = false;
        
        // Генерація в межах десятка
        operation = Math.random() > 0.5 ? '+' : '-';
        if (operation === '+') {
            valA = Math.floor(Math.random() * 5) + 2; 
            valB = Math.floor(Math.random() * (10 - valA)) + 1; 
            valResult = valA + valB;
        } else {
            valA = Math.floor(Math.random() * 6) + 5; 
            valB = Math.floor(Math.random() * (valA - 2)) + 2; 
            valResult = valA - valB;
        }

        // Відображення схеми
        renderSchema(valA, valB, operation);
        
        // Початкова кількість об'єктів
        animateHopIn(valA);
    }

    function checkWinCondition() {
        if(isSolved) return;
        
        const uA = parseInt(inpA.value);
        const uB = parseInt(inpB.value);
        const uC = parseInt(inpC.value);
        const uSign = inpSign.textContent;

        if(isNaN(uA) || isNaN(uB) || isNaN(uC)) return;

        if (uA === valA && uB === valB && uC === valResult && uSign === operation) {
            isSolved = true;
            inpA.disabled = true;
            inpB.disabled = true;
            inpC.disabled = true;
            soundSuccess();

            // Анімація згідно зі схемою
            if (operation === '+') {
                animateHopIn(valB, triggerDance);
            } else {
                animateHopOut(valB, triggerDance);
            }
        } else if (uA.toString().length > 0 && uB.toString().length > 0 && uC.toString().length > 0) {
             if (uA !== valA || uB !== valB || uC !== valResult || uSign !== operation) {
                 soundError();
             }
        }
    }

    function triggerDance() {
        activeBunnies.forEach(bunny => {
            bunny.classList.add('dancing');
        });
    }

    // Старт
    window.onload = generateLevel;

</script>
</body>
</html>
