<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Озеро Комарів</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; 
            font-family: Arial, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            background: transparent; 
            border-radius: 20px;
            box-shadow: none; 
            overflow: hidden;
            transform-origin: center;
            transition: transform 0.2s ease;
        }

        @keyframes breathe {
            0% { transform: scaleY(1); }
            50% { transform: scaleY(1.05); }
            100% { transform: scaleY(1); }
        }
        .frog-body {
            transform-origin: bottom center;
            animation: breathe 3s infinite ease-in-out;
        }

        @keyframes blink {
            0%, 96%, 98% { transform: scaleY(1); }
            97%, 100% { transform: scaleY(0.1); }
        }
        .frog-eye-lid {
            transform-origin: center;
            animation: blink 4s infinite linear;
        }

        @keyframes flutter {
            0% { transform: rotate(-20deg); }
            50% { transform: rotate(20deg); }
            100% { transform: rotate(-20deg); }
        }
        .wing {
            transform-origin: bottom center;
            animation: flutter 0.02s infinite;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .mosquito {
            position: absolute;
            width: 40px;
            height: 40px;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: transform 0.1s;
        }
        
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }
        .math-line {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 1s ease forwards;
        }

        .secret-input-text { color: transparent !important; text-shadow: 0 0 0 transparent !important; }
        .secret-input-text::selection { color: transparent !important; background: transparent !important; }

        #block-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 999999;
            display: none; justify-content: center; align-items: center;
        }
        #block-overlay h1 { color: red; font-size: 5vw; font-weight: bold; text-align: center; }

        #theme-btn {
            position: fixed; bottom: 140px; right: 20px; z-index: 80000;
            width: 50px; height: 50px; background: #34495e; color: white;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 2px solid white;
        }
        #theme-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(30,41,59,0.95); padding: 20px; border-radius: 20px;
            z-index: 80001; display: none; width: 90%; max-width: 800px;
            max-height: 60vh; overflow-y: auto; border: 4px solid #38bdf8;
            backdrop-filter: blur(10px);
        }
        #theme-gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px;
        }
        .theme-card {
            position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 10px;
            overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: 0.2s;
            background-color: #0f172a; display: flex; justify-content: center; align-items: center;
        }
        .theme-card:hover { border-color: #38bdf8; transform: scale(1.05); }
        .theme-card img { width: 100%; height: 100%; object-fit: cover; }
        .theme-label {
            position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7);
            color: white; text-align: center; font-size: 14px; padding: 5px 0; font-weight: bold;
        }

        #zoom-controls {
            position: fixed; bottom: 200px; right: 20px; z-index: 80000;
            display: flex; flex-direction: column; gap: 10px;
        }
        .zoom-btn {
            width: 50px; height: 50px; background: #2563eb; color: white;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 2px solid white;
        }

        #draw-canvas-global {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 90000; pointer-events: none;
        }
        #toggle-draw-btn-global {
            position: fixed; bottom: 85px; right: 20px; z-index: 90001;
            width: 50px; height: 50px; background: #8e44ad; color: white;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 2px solid white;
        }
        #draw-panel-global {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #ffffff; padding: 10px; border-radius: 15px;
            z-index: 90002; display: none; flex-direction: column; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 3px solid #8e44ad;
            user-select: none;
        }
        .draw-panel-header {
            width: 100%; height: 20px; background: #e2e8f0; border-radius: 10px;
            cursor: grab; display: flex; justify-content: center; align-items: center;
        }
        .draw-panel-header:active { cursor: grabbing; }
        .draw-panel-header::after { content: "••••"; color: #94a3b8; font-size: 20px; line-height: 10px; }
        .draw-controls-row { display: flex; gap: 10px; align-items: center; }
        .draw-btn {
            padding: 8px 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; background: #f1f5f9;
        }
        .draw-btn.active { background: #8e44ad; color: white; }
        #draw-color-picker { width: 40px; height: 40px; border: none; cursor: pointer; border-radius: 5px; overflow: hidden; }
        #draw-close-btn { position: absolute; top: -15px; right: -15px; width: 30px; height: 30px; background: red; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-weight: bold; border: 2px solid white; }
        
        @media (max-width: 768px) {
            #draw-panel-global { bottom: 10px; width: 95%; max-width: 400px; flex-wrap: wrap; }
            .draw-controls-row { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        
        <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
            <defs>

            <path d="M0,500 Q400,480 800,500 T1600,500 L1600,900 L0,900 Z" fill="url(#waterGrad)" opacity="0.8"/>
            <path d="M0,550 Q400,530 800,560 T1600,540 L1600,900 L0,900 Z" fill="#0052a3" opacity="0.4"/>
            <path d="M0,620 Q500,650 900,610 T1600,630 L1600,900 L0,900 Z" fill="#003d7a" opacity="0.5"/>

            <g opacity="0.8">

                <path d="M 1450,550 Q 1460,350 1430,250" stroke="#2d5a27" stroke-width="5" fill="none"/>
                <rect x="1425" y="250" width="10" height="50" rx="5" fill="#5c3a21" transform="rotate(-20 1430 250)"/>
                <path d="M 1520,600 Q 1500,400 1540,300" stroke="#3a7533" stroke-width="7" fill="none"/>
                <rect x="1535" y="300" width="14" height="65" rx="7" fill="#4a2e1b" transform="rotate(15 1540 300)"/>

            <path d="M800,750 C1000,750 1100,820 800,850 C500,820 600,750 800,750 Z" fill="#2e8b57" stroke="#1f5c3a" stroke-width="4" filter="url(#shadow)"/>
            <path d="M800,750 L820,780 L780,780 Z" fill="#0052a3" opacity="0.8"/>
            
            <g transform="translate(800, 720)" class="frog-body">
                <ellipse cx="-70" cy="50" rx="40" ry="20" fill="#3cb371" transform="rotate(30 -70 50)"/>
                <ellipse cx="70" cy="50" rx="40" ry="20" fill="#3cb371" transform="rotate(-30 70 50)"/>
                <ellipse cx="0" cy="0" rx="80" ry="70" fill="#3cb371"/>
                <ellipse cx="0" cy="20" rx="60" ry="40" fill="#98fb98"/>
                <path d="M-50,40 Q-70,80 -40,90" stroke="#3cb371" stroke-width="15" stroke-linecap="round" fill="none"/>
                <path d="M50,40 Q70,80 40,90" stroke="#3cb371" stroke-width="15" stroke-linecap="round" fill="none"/>
                
                <g transform="translate(-40, -50)">
                    <circle cx="0" cy="0" rx="25" fill="#3cb371"/>
                    <circle cx="0" cy="-5" rx="18" fill="white"/>
                    <circle cx="0" cy="-5" rx="8" fill="black" class="pupil"/>
                    <path d="M-20,-15 Q0,-30 20,-15" stroke="#2e8b57" stroke-width="4" fill="none"/>
                    <ellipse cx="0" cy="-5" rx="20" ry="20" fill="#3cb371" class="frog-eye-lid" opacity="1"/>
                </g>
                <g transform="translate(40, -50)">
                    <circle cx="0" cy="0" rx="25" fill="#3cb371"/>
                    <circle cx="0" cy="-5" rx="18" fill="white"/>
                    <circle cx="0" cy="-5" rx="8" fill="black" class="pupil"/>
                    <path d="M-20,-15 Q0,-30 20,-15" stroke="#2e8b57" stroke-width="4" fill="none"/>
                    <ellipse cx="0" cy="-5" rx="20" ry="20" fill="#3cb371" class="frog-eye-lid" opacity="1"/>
                </g>

                <path d="M-40,10 Q0,40 40,10" stroke="#1f5c3a" stroke-width="4" fill="none" id="frog-mouth"/>
                <path d="M-30,20 Q0,50 30,20 Z" fill="#ff6b6b" opacity="0" id="frog-mouth-open"/>
            </g>

            <path id="frog-tongue-path" d="" stroke="#ff6b6b" stroke-width="12" stroke-linecap="round" fill="none" opacity="0" filter="url(#shadow)"/>
        </svg>

        <div id="mosquitoes-layer" class="absolute inset-0 w-full h-full pointer-events-none z-10 overflow-hidden">
        </div>

        <div id="lobby-ui" class="absolute inset-0 flex flex-col justify-center items-center bg-black/60 z-50 backdrop-blur-sm transition-opacity duration-300">
            <div class="bg-[#1e293b]/90 p-8 rounded-3xl border-4 border-[#38bdf8] shadow-[0_0_40px_#38bdf8] flex flex-col items-center gap-6 w-[500px] max-w-[90%]">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-pulse">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                
                <div class="w-full bg-black/40 rounded-xl p-4 flex flex-col gap-2 border border-white/10">
                    <div class="flex justify-between items-center text-xl font-bold">
                        <span class="text-[#ef4444]">Гравець 1:</span>
                        <span id="lobby-status-p1" class="text-white/50">Вільний</span>
                    </div>
                    <div class="flex justify-between items-center text-xl font-bold">
                        <span class="text-[#3b82f6]">Гравець 2:</span>
                        <span id="lobby-status-p2" class="text-white/50">Вільний</span>
                    </div>
                </div>

                <div id="lobby-message" class="text-xl font-bold text-white text-center tracking-wide min-h-[30px]">
                    Оберіть роль для початку
                </div>
                
                <button id="btn-claim-slot" class="group relative px-10 py-4 bg-gradient-to-b from-[#38bdf8] to-[#0284c7] rounded-2xl shadow-[0_8px_0_#075985] active:shadow-[0_0px_0_#075985] active:translate-y-2 transition-all text-white font-black text-xl tracking-wider w-full">
                    ПРИЄДНАТИСЯ ДО ГРИ
                </button>

                <button id="btn-start-game" class="hidden group relative px-10 py-4 bg-gradient-to-b from-[#4ade80] to-[#16a34a] rounded-2xl shadow-[0_8px_0_#14532d] active:shadow-[0_0px_0_#14532d] active:translate-y-2 transition-all text-white font-black text-xl tracking-wider w-full mt-2">
                    СТАРТ
                </button>
            </div>
        </div>

        <div id="hud-layer" class="absolute inset-0 pointer-events-none z-20 flex justify-between p-6 opacity-0 transition-opacity">
            <div class="flex gap-8 items-start w-full justify-between">
                <div class="flex flex-col items-center bg-[#ef4444]/40 backdrop-blur-md p-4 rounded-3xl border-4 border-[#ef4444] shadow-[0_0_20px_#ef4444]">
                    <span class="text-white font-bold text-xl mb-1">Гравець 1</span>
                    <span id="score-p1" class="text-5xl font-black text-white drop-shadow-md">0</span>
                </div>
                
                <div class="flex items-center justify-center w-24 h-24 bg-white/20 backdrop-blur-md rounded-full border-4 border-white shadow-[0_0_20px_white]">
                    <span id="game-timer" class="text-5xl font-black text-white drop-shadow-md">15</span>
                </div>

                <div class="flex flex-col items-center bg-[#3b82f6]/40 backdrop-blur-md p-4 rounded-3xl border-4 border-[#3b82f6] shadow-[0_0_20px_#3b82f6]">
                    <span class="text-white font-bold text-xl mb-1">Гравець 2</span>
                    <span id="score-p2" class="text-5xl font-black text-white drop-shadow-md">0</span>
                </div>
            </div>
        </div>

        <div id="math-input-layer" class="absolute inset-0 flex justify-center items-center bg-black/70 z-40 backdrop-blur-sm hidden">
            <div class="bg-[#1e293b]/90 p-10 rounded-[40px] border-8 border-[#f59e0b] shadow-[0_0_60px_#f59e0b] flex flex-col items-center gap-8 w-full max-w-4xl mx-4 relative">
                <h2 class="text-4xl text-white font-black tracking-widest text-center mb-4">На скільки більше?</h2>
                
                <button id="toggle-secret-btn" class="absolute top-6 right-6 w-12 h-12 bg-white/10 rounded-full flex justify-center items-center text-2xl border-2 border-white/30 cursor-pointer pointer-events-auto">
                    👁️
                </button>

                <div class="flex justify-around items-center w-full gap-8">
                    <div class="flex flex-col items-center">
                        <span class="text-[#ef4444] font-bold text-2xl mb-2">Гр. 1</span>
                        <div class="w-32 h-32 bg-[#ef4444]/20 border-4 border-[#ef4444] rounded-3xl flex justify-center items-center">
                            <span id="math-score-p1" class="text-6xl font-black text-white">0</span>
                        </div>
                    </div>

                    <div class="flex flex-col items-center gap-4">
                        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <input id="difference-input" type="number" class="text-7xl text-center w-40 h-32 rounded-3xl bg-white/10 text-white font-black outline-none border-4 border-white/30 focus:border-[#f59e0b] pointer-events-auto transition-all">
                    </div>

                    <div class="flex flex-col items-center">
                        <span class="text-[#3b82f6] font-bold text-2xl mb-2">Гр. 2</span>
                        <div class="w-32 h-32 bg-[#3b82f6]/20 border-4 border-[#3b82f6] rounded-3xl flex justify-center items-center">
                            <span id="math-score-p2" class="text-6xl font-black text-white">0</span>
                        </div>
                    </div>
                </div>
                
                <button id="btn-submit-math" class="w-full max-w-md mt-6 py-6 bg-gradient-to-b from-[#f59e0b] to-[#b45309] rounded-2xl shadow-[0_8px_0_#78350f] active:translate-y-2 active:shadow-none transition-all flex justify-center pointer-events-auto">
                    <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </button>
            </div>
        </div>

        <svg id="explanation-layer" class="absolute inset-0 w-full h-full pointer-events-none z-30 hidden" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
        </svg>

        <button id="btn-next-round" class="absolute bottom-10 left-1/2 transform -translate-x-1/2 z-50 hidden group relative px-12 py-4 bg-gradient-to-b from-[#8b5cf6] to-[#6d28d9] rounded-2xl shadow-[0_8px_0_#4c1d95] active:shadow-[0_0px_0_#4c1d95] active:translate-y-2 transition-all text-white font-black text-2xl tracking-wider pointer-events-auto">
            ГРАТИ ЩЕ
        </button>

    </div>

    <div id="block-overlay">
        <h1>Зачекай! Зараз не твій урок.</h1>
    </div>

    <div id="zoom-controls">
        <div class="zoom-btn" id="zoom-in">➕</div>
        <div class="zoom-btn" id="zoom-out">➖</div>
    </div>

    <div id="theme-btn">⚙️</div>
    <div id="theme-modal">
        <h2 style="color:white; text-align:center; font-size: 24px; margin-bottom: 20px;">Обери фон</h2>
        <div id="theme-gallery">
            <div class="theme-card" data-url="none" style="background: #2c3e50;">
                <div class="theme-label">Без фону</div>
            </div>
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <button id="close-theme-modal" style="padding: 10px 30px; border-radius: 10px; border: none; background: #ef4444; color: white; font-weight: bold; cursor: pointer;">Закрити</button>
        </div>
    </div>

    <canvas id="draw-canvas-global"></canvas>
    <div id="toggle-draw-btn-global">✏️</div>
    <div id="draw-panel-global">
        <div id="draw-close-btn">✕</div>
        <div class="draw-panel-header" id="draw-drag-handle"></div>
        <div class="draw-controls-row">
            <button class="draw-btn active" id="tool-pencil">✏️ Олівець</button>
            <button class="draw-btn" id="tool-eraser">🧽 Гумка</button>
            <input type="range" id="draw-size" min="1" max="50" value="5">
            <input type="color" id="draw-color-picker" value="#ff0000">
            <button class="draw-btn" id="tool-clear">🗑️ Очистити</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, set, update, onValue, onDisconnect, push, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const CONFIG = { gameId: 'mosquito-lake' };
        
        let firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        if (Object.keys(firebaseConfig).length === 0) {
            firebaseConfig = {
                apiKey: "fake-api-key-to-bypass-sdk-checks", 
                projectId: "lesson-13c44",
                databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/"
            };
        } else if (!firebaseConfig.databaseURL) {
            firebaseConfig.databaseURL = "https://lesson-13c44-default-rtdb.firebaseio.com/";
        }

        let app = null, auth = null, rtdb = null;
        try {
            app = initializeApp(firebaseConfig);
            rtdb = getDatabase(app);
            try { auth = getAuth(app); } catch(e) { console.warn("Auth init failed"); }
        } catch (e) {
            console.error("Firebase SDK Init Error", e);
        }

        let userId = null;
        let mySlot = null; 
        let isHost = false;
        const mainRoomPath = `game_rooms/${CONFIG.gameId}/main_room`;
        let gameState = { status: 'waiting', p1: null, p2: null, p1Score: 0, p2Score: 0, timer: 15 };
        let gameLoopInterval = null;
        let localMosquitoes = [];
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playPopSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.01, audioCtx.currentTime); 
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playSuccessSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, audioCtx.currentTime + i*0.1);
                gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + i*0.1 + 0.05); 
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + i*0.1 + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + i*0.1);
                osc.stop(audioCtx.currentTime + i*0.1 + 0.2);
            });
        }

        let buzzOsc, buzzGain;
        function startBuzz() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            if(buzzOsc) return;
            buzzOsc = audioCtx.createOscillator();
            buzzGain = audioCtx.createGain();
            buzzOsc.type = 'sawtooth';
            buzzOsc.frequency.value = 150;
            const lfo = audioCtx.createOscillator();
            lfo.frequency.value = 15;
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 20;
            lfo.connect(lfoGain);
            lfoGain.connect(buzzOsc.frequency);
            
            buzzGain.gain.value = 0.01; 
            buzzOsc.connect(buzzGain);
            buzzGain.connect(audioCtx.destination);
            lfo.start();
            buzzOsc.start();
        }
        function stopBuzz() {
            if(buzzGain) {
                buzzGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
                setTimeout(() => {
                    if(buzzOsc) { buzzOsc.stop(); buzzOsc = null; }
                }, 500);
            }
        }

        const mathInput = document.getElementById('difference-input');
        const toggleSecretBtn = document.getElementById('toggle-secret-btn');
        let isSecretMode = false;
        toggleSecretBtn.addEventListener('click', () => {
            isSecretMode = !isSecretMode;
            if(isSecretMode) {
                mathInput.classList.add('secret-input-text');
                toggleSecretBtn.innerHTML = '🙈';
            } else {
                mathInput.classList.remove('secret-input-text');
                toggleSecretBtn.innerHTML = '👁️';
            }
        });

        async function initGame() {
            if (auth) {
                try { await signInAnonymously(auth); userId = auth.currentUser.uid; } 
                catch(e) {}
            }
            if(!userId) userId = 'player_' + Math.random().toString(36).substr(2, 9);

            if (rtdb) {
                const roomRef = ref(rtdb, mainRoomPath);
                onValue(roomRef, (snapshot) => {
                    if (snapshot.exists()) {
                        handleStateChange(snapshot.val());
                    } else {
                        handleStateChange({ status: 'waiting', p1: null, p2: null, p1Score: 0, p2Score: 0, timer: 15 });
                    }
                });
            } else {
                mySlot = 'p1'; isHost = true;
                handleStateChange({ status: 'waiting', p1: userId, p2: null, p1Score: 0, p2Score: 0, timer: 15 });
            }
        }

        document.getElementById('btn-claim-slot').addEventListener('click', () => {
            if (!rtdb) {
                mySlot = 'p1'; isHost = true;
                handleStateChange(gameState);
                return;
            }
            
            const roomRef = ref(rtdb, mainRoomPath);
            runTransaction(roomRef, (currentData) => {
                if (currentData === null) {
                    return { p1: userId, p2: null, status: 'waiting', p1Score: 0, p2Score: 0, timer: 15 };
                }
                if (!currentData.p1) {
                    currentData.p1 = userId;
                } else if (!currentData.p2 && currentData.p1 !== userId) {
                    currentData.p2 = userId;
                }
                return currentData;
            }).then((result) => {
                if (result.committed) {
                    const data = result.snapshot.val();
                    if (data.p1 === userId) {
                        mySlot = 'p1'; isHost = true;
                        onDisconnect(ref(rtdb, `${mainRoomPath}/p1`)).remove();
                    } else if (data.p2 === userId) {
                        mySlot = 'p2'; isHost = false;
                        onDisconnect(ref(rtdb, `${mainRoomPath}/p2`)).remove();
                    } else {
                        mySlot = 'spectator';
                        isHost = false;
                    }
                }
            });
        });

        function handleStateChange(data) {
            gameState = data;
            const lobbyUi = document.getElementById('lobby-ui');
            const lobbyMsg = document.getElementById('lobby-message');
            const btnClaim = document.getElementById('btn-claim-slot');
            const btnStart = document.getElementById('btn-start-game');
            const statusP1 = document.getElementById('lobby-status-p1');
            const statusP2 = document.getElementById('lobby-status-p2');
            
            const hud = document.getElementById('hud-layer');
            const mathLayer = document.getElementById('math-input-layer');
            const explLayer = document.getElementById('explanation-layer');
            const btnNext = document.getElementById('btn-next-round');

            document.getElementById('score-p1').textContent = data.p1Score || 0;
            document.getElementById('score-p2').textContent = data.p2Score || 0;
            document.getElementById('game-timer').textContent = data.timer || 15;

            if (data.status === 'waiting' || !data.status) {
                lobbyUi.classList.remove('hidden', 'opacity-0');
                hud.classList.add('opacity-0');
                mathLayer.classList.add('hidden');
                explLayer.classList.add('hidden');
                btnNext.classList.add('hidden');
                clearMosquitoes();

                statusP1.textContent = data.p1 ? (data.p1 === userId ? 'Це ви' : 'Зайнято') : 'Вільний';
                statusP1.className = data.p1 ? 'text-white' : 'text-white/50';
                
                statusP2.textContent = data.p2 ? (data.p2 === userId ? 'Це ви' : 'Зайнято') : 'Вільний';
                statusP2.className = data.p2 ? 'text-white' : 'text-white/50';

                if (!mySlot) {
                    if (data.p1 && data.p2) {
                        btnClaim.classList.add('hidden');
                        lobbyMsg.textContent = "Кімната повна. Ви зможете бути глядачем.";
                    } else {
                        btnClaim.classList.remove('hidden');
                        lobbyMsg.textContent = "Оберіть роль для початку";
                    }
                    btnStart.classList.add('hidden');
                } else if (mySlot === 'p1') {
                    btnClaim.classList.add('hidden');
                    if (data.p2) {
                        lobbyMsg.textContent = "Всі гравці на місці!";
                        btnStart.classList.remove('hidden');
                    } else {
                        lobbyMsg.textContent = "Очікуємо Гравця 2...";
                        btnStart.classList.add('hidden');
                    }
                } else if (mySlot === 'p2') {
                    btnClaim.classList.add('hidden');
                    btnStart.classList.add('hidden');
                    lobbyMsg.textContent = "Очікуємо старт від Гравця 1.";
                } else if (mySlot === 'spectator') {
                    btnClaim.classList.add('hidden');
                    btnStart.classList.add('hidden');
                    lobbyMsg.textContent = "Ви глядач.";
                }
            } 
            else if (data.status === 'playing') {
                lobbyUi.classList.add('opacity-0');
                setTimeout(() => lobbyUi.classList.add('hidden'), 300);
                hud.classList.remove('opacity-0');
                mathLayer.classList.add('hidden');
                explLayer.classList.add('hidden');
                btnNext.classList.add('hidden');
                
                if (localMosquitoes.length === 0) {
                    generateMosquitoes();
                    startBuzz();
                }
                
                if(isHost && !gameLoopInterval) startGameTimer();
            }
            else if (data.status === 'math') {
                stopBuzz();
                clearMosquitoes();
                if(gameLoopInterval) { clearInterval(gameLoopInterval); gameLoopInterval = null; }
                
                document.getElementById('math-score-p1').textContent = data.p1Score;
                document.getElementById('math-score-p2').textContent = data.p2Score;
                
                hud.classList.add('opacity-0');

                inp.value = '';

                if(mySlot !== 'spectator') inp.focus();

            else if (data.status === 'explanation') {
                mathLayer.classList.add('hidden');

        function generateMosquitoes() {
            const layer = document.getElementById('mosquitoes-layer');
            layer.innerHTML = '';
            localMosquitoes = [];
            
            for(let i=0; i<30; i++) {
                const mosquito = document.createElement('div');
                mosquito.className = 'mosquito pointer-events-auto';
                let x = Math.random() * window.innerWidth;
                let y = Math.random() * (window.innerHeight * 0.7); 
                mosquito.style.left = `${x}px`;
                mosquito.style.top = `${y}px`;
                
                mosquito.innerHTML = `
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <path class="wing" d="M 50,50 Q 20,10 10,30 Q 30,50 50,50 Z" fill="#e2e8f0" opacity="0.8"/>
                        <path class="wing" d="M 50,50 Q 80,10 90,30 Q 70,50 50,50 Z" fill="#e2e8f0" opacity="0.8"/>
                        <ellipse cx="50" cy="50" rx="8" ry="15" fill="#334155"/>
                        <circle cx="50" cy="35" r="6" fill="#0f172a"/>
                        <line x1="50" y1="29" x2="50" y2="15" stroke="#0f172a" stroke-width="2"/>
                    </svg>
                `;

                let data = { el: mosquito, x: x, y: y, vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12, active: true };
                mosquito.addEventListener('pointerdown', (e) => catchMosquito(e, data));
                layer.appendChild(mosquito);
                localMosquitoes.push(data);
            }
            requestAnimationFrame(animateMosquitoes);
        }

        function animateMosquitoes() {
            if(gameState.status !== 'playing') return;
            const w = window.innerWidth, h = window.innerHeight;
            localMosquitoes.forEach(m => {
                if(!m.active) return;
                if(Math.random() < 0.05) { m.vx += (Math.random() - 0.5) * 6; m.vy += (Math.random() - 0.5) * 6; }
                const maxSpeed = 10;
                m.vx = Math.max(-maxSpeed, Math.min(maxSpeed, m.vx));
                m.vy = Math.max(-maxSpeed, Math.min(maxSpeed, m.vy));
                m.x += m.vx; m.y += m.vy;
                if(m.x < 20 || m.x > w - 20) m.vx *= -1;
                if(m.y < 20 || m.y > h - 150) m.vy *= -1; 
                const angle = Math.atan2(m.vy, m.vx) * 180 / Math.PI + 90;
                m.el.style.left = `${m.x}px`;
                m.el.style.top = `${m.y}px`;
                m.el.children[0].style.transform = `rotate(${angle}deg)`;
            });
            requestAnimationFrame(animateMosquitoes);
        }

        async function catchMosquito(e, mData) {
            e.preventDefault(); e.stopPropagation();
            if(!mData.active || gameState.status !== 'playing' || !mySlot || mySlot === 'spectator') return;
            
            mData.active = false;
            mData.el.style.display = 'none';
            
            const rect = document.getElementById('game-container').getBoundingClientRect();
            const scaleX = 1600 / rect.width, scaleY = 900 / rect.height;
            const tapX = (e.clientX - rect.left) * scaleX;
            const tapY = (e.clientY - rect.top) * scaleY;
            
            const tonguePath = document.getElementById('frog-tongue-path');
            const frogMouthOpen = document.getElementById('frog-mouth-open');
            const frogMouth = document.getElementById('frog-mouth');
            
            frogMouth.setAttribute('opacity', '0');
            frogMouthOpen.setAttribute('opacity', '1');
            tonguePath.setAttribute('d', `M 800,740 Q ${(800+tapX)/2},${(740+tapY)/2-100} ${tapX},${tapY}`);
            tonguePath.setAttribute('opacity', '1');
            
            playPopSound();
            setTimeout(() => {
                tonguePath.setAttribute('opacity', '0');
                frogMouth.setAttribute('opacity', '1');
                frogMouthOpen.setAttribute('opacity', '0');
            }, 150);

            if (mySlot === 'p1') gameState.p1Score++; else if (mySlot === 'p2') gameState.p2Score++;

            if (rtdb) {
                const roomRef = ref(rtdb, mainRoomPath);
                if (mySlot === 'p1') await update(roomRef, { p1Score: gameState.p1Score });
                else await update(roomRef, { p2Score: gameState.p2Score });
            } else {
                document.getElementById(mySlot === 'p1' ? 'score-p1' : 'score-p2').textContent = mySlot === 'p1' ? gameState.p1Score : gameState.p2Score;
            }
        }

        function startGameTimer() {
            let timeLeft = 15;
            gameLoopInterval = setInterval(async () => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(gameLoopInterval);
                    const payload = { status: 'math', timer: 0 };
                    if (rtdb) await update(ref(rtdb, mainRoomPath), payload);
                    else handleStateChange(Object.assign(gameState, payload));
                } else {
                    if (rtdb) await update(ref(rtdb, mainRoomPath), { timer: timeLeft });
                    else { gameState.timer = timeLeft; document.getElementById('game-timer').textContent = timeLeft; }
                }
            }, 1000);

        document.getElementById('btn-submit-math').addEventListener('click', async () => {
            if(!mySlot || mySlot === 'spectator') return;
            const inputVal = parseInt(document.getElementById('difference-input').value);
            if (isNaN(inputVal)) return;

            const expectedDiff = Math.abs(gameState.p1Score - gameState.p2Score);
            
            if (inputVal === expectedDiff) {
                playSuccessSound();
                if (rtdb) await update(ref(rtdb, mainRoomPath), { status: 'explanation' });

                setTimeout(() => inp.style.transform = 'translateX(-10px)', 50);
                setTimeout(() => inp.style.transform = 'translateX(0)', 100);
            }

        async function runVisualExplanation(s1, s2) {
            const layer = document.getElementById('explanation-layer');
            layer.innerHTML = `<rect x="0" y="0" width="1600" height="900" fill="black" opacity="0.6" />`;

            const maxScore = Math.max(s1, s2), minScore = Math.min(s1, s2), diff = maxScore - minScore;
            const c1 = '#ef4444', c2 = '#3b82f6'; 
            
            const gap = Math.min(100, 1400 / Math.max(1, maxScore));
            const startX = 800 - (maxScore * gap) / 2 + gap/2;
            const y1 = 250, y2 = 550;
            
            layer.innerHTML += `<text x="100" y="${y1+20}" fill="${c1}" font-size="40" font-weight="900">Гр. 1</text>`;
            layer.innerHTML += `<text x="100" y="${y2+20}" fill="${c2}" font-size="40" font-weight="900">Гр. 2</text>`;

            for(let i=0; i<s1; i++) layer.innerHTML += createStaticMosquitoSVG(startX + i*gap, y1, c1, `p1-mosq-${i}`);
            for(let i=0; i<s2; i++) layer.innerHTML += createStaticMosquitoSVG(startX + i*gap, y2, c2, `p2-mosq-${i}`);

            for(let i=0; i<minScore; i++) {
                await new Promise(r => setTimeout(r, 400));
                playPopSound(); 
                layer.innerHTML += `<line x1="${startX + i*gap}" y1="${y1 + 40}" x2="${startX + i*gap}" y2="${y2 - 40}" stroke="#ffffff" stroke-width="6" stroke-dasharray="10,10" class="math-line"/>`;
            }

            await new Promise(r => setTimeout(r, 600));
            const isP1More = s1 > s2, extraY = isP1More ? y1 : y2;

            if (diff > 0) {
                for(let i=0; i<diff; i++) {
                    await new Promise(r => setTimeout(r, 500));
                    const cx = startX + (minScore + i)*gap;
                    layer.innerHTML += `<circle cx="${cx}" cy="${extraY}" r="45" fill="none" stroke="#f59e0b" stroke-width="6" class="pop-in"/>`;
                    layer.innerHTML += `<text x="${cx}" y="${extraY - 60}" fill="#f59e0b" font-size="50" font-weight="900" text-anchor="middle" class="pop-in">${i + 1}</text>`;
                    playSuccessSound(); 
                }
            } else {
                layer.innerHTML += `<text x="800" y="450" fill="#10b981" font-size="150" font-weight="900" text-anchor="middle" class="pop-in">=</text>`;
                playSuccessSound();
            }

            if(mySlot === 'p1') {
                setTimeout(() => document.getElementById('btn-next-round').classList.remove('hidden'), 2000);
            }
        }

        document.getElementById('draw-size').addEventListener('input', (e) => drawSize = parseInt(e.target.value));

        function updateToolUI(activeBtn) {
            document.querySelectorAll('.draw-btn').forEach(btn => btn.classList.remove('active'));
            activeBtn.classList.add('active');
        }

        const dragHandle = document.getElementById('draw-drag-handle');
        let isDraggingPanel = false, startX, startY, initialLeft, initialBottom;
        dragHandle.addEventListener('pointerdown', (e) => {
            isDraggingPanel = true;
            startX = e.clientX; startY = e.clientY;
            const rect = drawPanelGlobal.getBoundingClientRect();
            initialLeft = rect.left;
            initialBottom = window.innerHeight - rect.bottom;
            e.preventDefault();
        });
        window.addEventListener('pointermove', (e) => {
            if (!isDraggingPanel) return;
            const dx = e.clientX - startX, dy = startY - e.clientY;
            drawPanelGlobal.style.left = `${initialLeft + dx + drawPanelGlobal.offsetWidth/2}px`;
            drawPanelGlobal.style.bottom = `${initialBottom + dy}px`;
        });
        window.addEventListener('pointerup', () => isDraggingPanel = false);

        let lastX = 0, lastY = 0;
        function getPointerPos(e) {
            return { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!isDrawingMode) return;
            isDrawing = true;
            const pos = getPointerPos(e);
            lastX = pos.x; lastY = pos.y;
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !isDrawingMode) return;
            const pos = getPointerPos(e);
            drawLine(lastX, lastY, pos.x, pos.y, currentTool, drawColor, drawSize);
            sendDrawAction('draw_line', { x0: lastX / canvas.width, y0: lastY / canvas.height, x1: pos.x / canvas.width, y1: pos.y / canvas.height, tool: currentTool, color: drawColor, size: drawSize });
            lastX = pos.x; lastY = pos.y;
        });

        window.addEventListener('pointerup', () => isDrawing = false);

        function drawLine(x0, y0, x1, y1, tool, color, size) {
            ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
            ctx.strokeStyle = tool === 'eraser' ? 'rgba(0,0,0,1)' : color;
            ctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
            ctx.lineWidth = size; ctx.lineCap = 'round'; ctx.stroke();
        }

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function sendDrawAction(type, data = null) {
            if (!rtdb) return;
            set(push(ref(rtdb, 'game_action')), { senderId: tabId, timestamp: Date.now(), type: type, data: data });
        }

        if (rtdb) {
            onValue(ref(rtdb, 'game_action'), (snap) => {
                const actions = snap.val();
                if (!actions) return;
                const keys = Object.keys(actions);
                const action = actions[keys[keys.length - 1]];
                if (action.senderId === tabId || (Date.now() - action.timestamp > 5000)) return;
                if (action.type === 'clear_canvas') clearCanvas();
                else if (action.type === 'draw_line' && action.data) {
                    const d = action.data;
                    drawLine(d.x0 * canvas.width, d.y0 * canvas.height, d.x1 * canvas.width, d.y1 * canvas.height, d.tool, d.color, d.size);
                }
            });
        }
    </script>
</body>
