<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Озеро Комарів</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; 
            font-family: Arial, sans-serif;
        }

        /* Ідеальне масштабування під будь-який екран 16:9 */
        #game-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: transparent;
        }
        #game-container {
            position: relative;
            background: transparent; 
            box-shadow: none; 
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        
        @media (min-aspect-ratio: 16/9) {
            #game-container {
                height: 100vh;
                width: 177.78vh; /* 16/9 * 100 */
            }
        }
        @media (max-aspect-ratio: 16/9) {
            #game-container {
                width: 100vw;
                height: 56.25vw; /* 9/16 * 100 */
            }
        }

        @keyframes breathe {
            0% { transform: scaleY(1); }
            50% { transform: scaleY(1.03); }
            100% { transform: scaleY(1); }
        }
        .frog-body {
            transform-origin: bottom center;
            animation: breathe 3s infinite ease-in-out;
        }

        /* Анімація погляду жаби (зіниці) */
        @keyframes lookAround {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-4px, 0); }
            40% { transform: translate(4px, 0); }
            60% { transform: translate(0, -4px); }
            80% { transform: translate(0, 4px); }
        }
        .pupil {
            animation: lookAround 6s infinite ease-in-out;
        }

        @keyframes flutter {
            0% { transform: rotate(-20deg); }
            50% { transform: rotate(20deg); }
            100% { transform: rotate(-20deg); }
        }
        .wing {
            transform-origin: bottom center;
            animation: flutter 0.02s infinite;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .mosquito {
            position: absolute;
            width: 5%; 
            height: 8.8%;
            cursor: pointer;
            transform: translate(-50%, -50%);
        }

        /* Рукавичка комп'ютера */
        #pc-hand {
            position: absolute;
            width: 8%;
            height: 14.2%;
            transform: translate(-50%, -50%);
            transition: left 0.1s linear, top 0.1s linear;
            pointer-events: none;
            z-index: 45;
            display: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }
        
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }
        .math-line {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 1.5s ease forwards;
        }

        /* Секретний інпут */
        .secret-input-text { color: transparent !important; text-shadow: 0 0 0 transparent !important; }
        .secret-input-text::selection { color: transparent !important; background: transparent !important; }

        /* Екран-заглушка */
        #block-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 999999;
            display: none; justify-content: center; align-items: center;
        }
        #block-overlay h1 { color: red; font-size: 5vw; font-weight: bold; text-align: center; }

        /* Theme Manager UI */
        #theme-btn {
            position: fixed; bottom: 140px; right: 20px; z-index: 80000;
            width: 50px; height: 50px; background: #34495e; color: white;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 2px solid white;
        }
        #theme-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(30,41,59,0.95); padding: 20px; border-radius: 20px;
            z-index: 80001; display: none; width: 90%; max-width: 800px;
            max-height: 60vh; overflow-y: auto; border: 4px solid #38bdf8;
            backdrop-filter: blur(10px);
        }
        #theme-gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px;
        }
        .theme-card {
            position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 10px;
            overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: 0.2s;
            background-color: #0f172a; display: flex; justify-content: center; align-items: center;
        }
        .theme-card:hover { border-color: #38bdf8; transform: scale(1.05); }
        .theme-card img { width: 100%; height: 100%; object-fit: cover; }
        .theme-label {
            position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7);
            color: white; text-align: center; font-size: 14px; padding: 5px 0; font-weight: bold;
        }

        /* Лупа (Масштабування) */
        #zoom-controls {
            position: fixed; bottom: 200px; right: 20px; z-index: 80000;
            display: flex; flex-direction: column; gap: 10px;
        }
        .zoom-btn {
            width: 50px; height: 50px; background: #2563eb; color: white;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 2px solid white;
        }

        /* Глобальна малювалка */
        #draw-canvas-global {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 90000; pointer-events: none;
        }
        #toggle-draw-btn-global {
            position: fixed; bottom: 85px; right: 20px; z-index: 90001;
            width: 50px; height: 50px; background: #8e44ad; color: white;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 2px solid white;
        }
        #draw-panel-global {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #ffffff; padding: 10px; border-radius: 15px;
            z-index: 90002; display: none; flex-direction: column; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 3px solid #8e44ad;
            user-select: none;
        }
        .draw-panel-header {
            width: 100%; height: 20px; background: #e2e8f0; border-radius: 10px;
            cursor: grab; display: flex; justify-content: center; align-items: center;
        }
        .draw-panel-header:active { cursor: grabbing; }
        .draw-panel-header::after { content: "••••"; color: #94a3b8; font-size: 20px; line-height: 10px; }
        .draw-controls-row { display: flex; gap: 10px; align-items: center; }
        .draw-btn {
            padding: 8px 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; background: #f1f5f9;
        }
        .draw-btn.active { background: #8e44ad; color: white; }
        #draw-color-picker { width: 40px; height: 40px; border: none; cursor: pointer; border-radius: 5px; overflow: hidden; }
        #draw-close-btn { position: absolute; top: -15px; right: -15px; width: 30px; height: 30px; background: red; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-weight: bold; border: 2px solid white; }
        
        @media (max-width: 768px) {
            #draw-panel-global { bottom: 10px; width: 95%; max-width: 400px; flex-wrap: wrap; }
            .draw-controls-row { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

  <div id="game-wrapper">
    <div id="game-container">
        
        <!-- Складний SVG фон озера -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#4db8ff"/>
                    <stop offset="100%" stop-color="#0066cc"/>
                </linearGradient>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="5" stdDeviation="5" flood-opacity="0.3"/>
                </filter>
            </defs>
            
            <path d="M0,500 Q400,480 800,500 T1600,500 L1600,900 L0,900 Z" fill="url(#waterGrad)" opacity="0.8"/>
            <path d="M0,550 Q400,530 800,560 T1600,540 L1600,900 L0,900 Z" fill="#0052a3" opacity="0.4"/>
            <path d="M0,620 Q500,650 900,610 T1600,630 L1600,900 L0,900 Z" fill="#003d7a" opacity="0.5"/>

            <g opacity="0.8">
                <path d="M 50,600 Q 60,400 30,300" stroke="#2d5a27" stroke-width="6" fill="none"/>
                <rect x="25" y="300" width="12" height="60" rx="6" fill="#5c3a21" transform="rotate(-15 30 300)"/>
                <path d="M 120,650 Q 110,450 140,350" stroke="#3a7533" stroke-width="8" fill="none"/>
                <rect x="135" y="350" width="14" height="70" rx="7" fill="#4a2e1b" transform="rotate(10 140 350)"/>
                
                <path d="M 1450,550 Q 1460,350 1430,250" stroke="#2d5a27" stroke-width="5" fill="none"/>
                <rect x="1425" y="250" width="10" height="50" rx="5" fill="#5c3a21" transform="rotate(-20 1430 250)"/>
                <path d="M 1520,600 Q 1500,400 1540,300" stroke="#3a7533" stroke-width="7" fill="none"/>
                <rect x="1535" y="300" width="14" height="65" rx="7" fill="#4a2e1b" transform="rotate(15 1540 300)"/>
            </g>

            <!-- Повноцінний Листок латаття -->
            <ellipse cx="800" cy="780" rx="280" ry="70" fill="#2e8b57" stroke="#1f5c3a" stroke-width="6" filter="url(#shadow)"/>
            <path d="M800,780 L860,860 L740,860 Z" fill="#0052a3" opacity="0.8"/>
            
            <!-- Деталізована Жаба із зовнішнім позиціонуванням -->
            <g transform="translate(800, 740)">
                <g class="frog-body">
                    <!-- Лапки задні -->
                    <ellipse cx="-80" cy="10" rx="45" ry="20" fill="#228b22" transform="rotate(25 -80 10)"/>
                    <ellipse cx="80" cy="10" rx="45" ry="20" fill="#228b22" transform="rotate(-25 80 10)"/>
                    <!-- Тіло -->
                    <ellipse cx="0" cy="0" rx="90" ry="75" fill="#32cd32"/>
                    <!-- Пузико -->
                    <ellipse cx="0" cy="20" rx="65" ry="45" fill="#98fb98"/>
                    <!-- Лапки передні -->
                    <path d="M-40,40 Q-50,90 -20,95" stroke="#32cd32" stroke-width="18" stroke-linecap="round" fill="none"/>
                    <path d="M40,40 Q50,90 20,95" stroke="#32cd32" stroke-width="18" stroke-linecap="round" fill="none"/>
                    
                    <!-- Очі (з новими зіницями, що рухаються) -->
                    <g transform="translate(-40, -55)">
                        <circle cx="0" cy="0" rx="22" fill="#32cd32"/>
                        <circle cx="0" cy="-4" rx="14" fill="white"/>
                        <circle cx="0" cy="-4" rx="6" fill="black" class="pupil"/>
                    </g>
                    <g transform="translate(40, -55)">
                        <circle cx="0" cy="0" rx="22" fill="#32cd32"/>
                        <circle cx="0" cy="-4" rx="14" fill="white"/>
                        <circle cx="0" cy="-4" rx="6" fill="black" class="pupil"/>
                    </g>

                    <!-- Рот -->
                    <path id="frog-mouth" d="M-35,10 Q0,30 35,10" stroke="#006400" stroke-width="4" fill="none"/>
                    <path id="frog-mouth-open" d="M-25,10 Q0,40 25,10 Z" fill="#ff6b6b" opacity="0"/>
                </g>
            </g>

            <path id="frog-tongue-path" d="" stroke="#ff6b6b" stroke-width="15" stroke-linecap="round" fill="none" opacity="0" filter="url(#shadow)"/>
        </svg>

        <div id="mosquitoes-layer" class="absolute inset-0 w-full h-full pointer-events-none z-10 overflow-hidden">
        </div>

        <!-- Долонька комп'ютера -->
        <svg id="pc-hand" viewBox="0 0 100 100">
            <path d="M50 95 C25 95, 10 70, 15 45 C18 30, 30 15, 45 15 C50 15, 55 5, 65 5 C75 5, 85 15, 85 30 C85 45, 95 50, 95 65 C95 85, 75 95, 50 95 Z" fill="#ffffff" stroke="#3b82f6" stroke-width="6" stroke-linejoin="round"/>
            <path d="M30 55 L45 55 M45 45 L60 45 M65 55 L75 55" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
        </svg>

        <div id="lobby-ui" class="absolute inset-0 flex flex-col justify-center items-center bg-black/60 z-50 backdrop-blur-sm transition-opacity duration-300">
            <div class="bg-[#1e293b]/90 p-10 rounded-3xl border-4 border-[#38bdf8] shadow-[0_0_40px_#38bdf8] flex flex-col items-center gap-6 w-auto max-w-[90%]">
                <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-pulse">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                
                <div class="text-4xl font-black text-white tracking-wide text-center">
                    Люди <span class="text-[#ef4444]">VS</span> Комп'ютер
                </div>
                
                <div class="text-2xl text-white/80 text-center mb-4 max-w-[500px]">
                    Всі підключені гравці ловлять комарів разом! Ваше завдання — випередити комп'ютер.
                </div>

                <button id="btn-start-game" class="group relative px-12 py-5 bg-gradient-to-b from-[#4ade80] to-[#16a34a] rounded-2xl shadow-[0_8px_0_#14532d] active:shadow-[0_0px_0_#14532d] active:translate-y-2 transition-all text-white font-black text-3xl tracking-wider w-full">
                    ПОЧАТИ ГРУ
                </button>
            </div>
        </div>

        <div id="hud-layer" class="absolute inset-0 pointer-events-none z-20 flex justify-between p-6 opacity-0 transition-opacity">
            <!-- Кнопка Назад -->
            <button id="btn-back" class="pointer-events-auto w-[8%] max-w-[80px] aspect-square bg-white/20 backdrop-blur-md rounded-full flex justify-center items-center shadow-lg border-2 border-white/50 active:scale-90 transition-transform">
                <svg width="60%" height="60%" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            
            <div class="flex gap-4 sm:gap-8 items-start justify-center flex-1">
                <div class="flex flex-col items-center bg-[#ef4444]/40 backdrop-blur-md px-6 py-2 sm:p-4 rounded-3xl border-4 border-[#ef4444] shadow-[0_0_20px_#ef4444]">
                    <span class="text-white font-bold text-sm sm:text-xl mb-1">Люди</span>
                    <span id="score-p1" class="text-4xl sm:text-5xl font-black text-white drop-shadow-md">0</span>
                </div>
                
                <div class="flex items-center justify-center w-20 h-20 sm:w-24 sm:h-24 bg-white/20 backdrop-blur-md rounded-full border-4 border-white shadow-[0_0_20px_white]">
                    <span id="game-timer" class="text-4xl sm:text-5xl font-black text-white drop-shadow-md">15</span>
                </div>

                <div class="flex flex-col items-center bg-[#3b82f6]/40 backdrop-blur-md px-6 py-2 sm:p-4 rounded-3xl border-4 border-[#3b82f6] shadow-[0_0_20px_#3b82f6]">
                    <span class="text-white font-bold text-sm sm:text-xl mb-1">Комп'ютер</span>
                    <span id="score-p2" class="text-4xl sm:text-5xl font-black text-white drop-shadow-md">0</span>
                </div>
            </div>
            
            <div class="w-[8%] max-w-[80px] aspect-square"></div> <!-- Пласхолдер для симетрії -->
        </div>

        <div id="math-input-layer" class="absolute inset-0 flex justify-center items-center bg-black/70 z-40 backdrop-blur-sm hidden">
            <div class="bg-[#1e293b]/90 p-6 sm:p-10 rounded-[40px] border-8 border-[#f59e0b] shadow-[0_0_60px_#f59e0b] flex flex-col items-center gap-6 sm:gap-8 w-full max-w-4xl mx-4 relative">
                <h2 class="text-3xl sm:text-4xl text-white font-black tracking-widest text-center mb-2">На скільки більше?</h2>
                
                <button id="toggle-secret-btn" class="absolute top-6 right-6 w-12 h-12 bg-white/10 rounded-full flex justify-center items-center text-2xl border-2 border-white/30 cursor-pointer pointer-events-auto">
                    👁️
                </button>

                <div class="flex justify-around items-center w-full gap-4 sm:gap-8">
                    <div class="flex flex-col items-center">
                        <span class="text-[#ef4444] font-bold text-xl sm:text-2xl mb-2">Люди</span>
                        <div class="w-24 h-24 sm:w-32 sm:h-32 bg-[#ef4444]/20 border-4 border-[#ef4444] rounded-3xl flex justify-center items-center">
                            <span id="math-score-p1" class="text-5xl sm:text-6xl font-black text-white">0</span>
                        </div>
                    </div>

                    <div class="flex flex-col items-center gap-2 sm:gap-4">
                        <svg width="40" height="40" class="sm:w-[60px] sm:h-[60px]" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <input id="difference-input" type="number" class="text-6xl sm:text-7xl text-center w-32 sm:w-40 h-24 sm:h-32 rounded-3xl bg-white/10 text-white font-black outline-none border-4 border-white/30 focus:border-[#f59e0b] pointer-events-auto transition-all secret-input-text">
                    </div>

                    <div class="flex flex-col items-center">
                        <span class="text-[#3b82f6] font-bold text-xl sm:text-2xl mb-2">Комп.</span>
                        <div class="w-24 h-24 sm:w-32 sm:h-32 bg-[#3b82f6]/20 border-4 border-[#3b82f6] rounded-3xl flex justify-center items-center">
                            <span id="math-score-p2" class="text-5xl sm:text-6xl font-black text-white">0</span>
                        </div>
                    </div>
                </div>
                
                <button id="btn-submit-math" class="w-full max-w-md mt-4 py-4 sm:py-6 bg-gradient-to-b from-[#f59e0b] to-[#b45309] rounded-2xl shadow-[0_8px_0_#78350f] active:translate-y-2 active:shadow-none transition-all flex justify-center pointer-events-auto">
                    <svg width="40" height="40" class="sm:w-[50px] sm:h-[50px]" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </button>
            </div>
        </div>

        <div id="explanation-layer" class="absolute inset-0 w-full h-full pointer-events-none z-[45] hidden">
            <!-- Тут малюватиметься розбір порівняння SVG -->
        </div>

        <button id="btn-next-round" class="absolute bottom-10 left-1/2 transform -translate-x-1/2 z-[60] hidden group relative px-12 py-5 bg-gradient-to-b from-[#8b5cf6] to-[#6d28d9] rounded-2xl shadow-[0_8px_0_#4c1d95] active:shadow-[0_0px_0_#4c1d95] active:translate-y-2 transition-all text-white font-black text-3xl tracking-wider pointer-events-auto">
            ГРАТИ ЩЕ
        </button>

    </div>
  </div>

    <!-- ДОДАНІ БЛОКИ ІНТЕРФЕЙСУ -->

    <!-- Екран-заглушка -->
    <div id="block-overlay">
        <h1>Зачекай! Зараз не твій урок.</h1>
    </div>

    <!-- Кнопки зуму -->
    <div id="zoom-controls">
        <div class="zoom-btn" id="zoom-in">➕</div>
        <div class="zoom-btn" id="zoom-out">➖</div>
    </div>

    <!-- Theme Manager -->
    <div id="theme-btn">⚙️</div>
    <div id="theme-modal">
        <h2 style="color:white; text-align:center; font-size: 24px; margin-bottom: 20px;">Обери фон</h2>
        <div id="theme-gallery">
            <div class="theme-card" data-url="none" style="background: #2c3e50;">
                <div class="theme-label">Без фону</div>
            </div>
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <button id="close-theme-modal" style="padding: 10px 30px; border-radius: 10px; border: none; background: #ef4444; color: white; font-weight: bold; cursor: pointer;">Закрити</button>
        </div>
    </div>

    <!-- Глобальна малювалка -->
    <canvas id="draw-canvas-global"></canvas>
    <div id="toggle-draw-btn-global">✏️</div>
    <div id="draw-panel-global">
        <div id="draw-close-btn">✕</div>
        <div class="draw-panel-header" id="draw-drag-handle"></div>
        <div class="draw-controls-row">
            <button class="draw-btn active" id="tool-pencil">✏️ Олівець</button>
            <button class="draw-btn" id="tool-eraser">🧽 Гумка</button>
            <input type="range" id="draw-size" min="1" max="50" value="5">
            <input type="color" id="draw-color-picker" value="#ff0000">
            <button class="draw-btn" id="tool-clear">🗑️ Очистити</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, set, update, onValue, onDisconnect, push, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const CONFIG = { gameId: 'mosquito-lake' };
        
        let firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        if (Object.keys(firebaseConfig).length === 0) {
            firebaseConfig = {
                apiKey: "fake-api-key-to-bypass-sdk-checks",

        let userId = null;
        let isHost = false; // Тільки Host керує логікою таймера і вибором комп'ютера
        const mainRoomPath = `game_rooms/${CONFIG.gameId}/main_room`;
        let gameState = { status: 'waiting', p1Score: 0, p2Score: 0, timer: 15, hostId: null, mosquitoesState: {}, activePcTarget: null };
        let gameLoopInterval = null;
        let pcLoopInterval = null;
        let localMosquitoes = [];
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Гучність звуків зменшено ЩЕ вдвічі (0.0025)
        function playPopSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.0025, audioCtx.currentTime); 
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playSuccessSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, audioCtx.currentTime + i*0.1);
                gain.gain.linearRampToValueAtTime(0.0125, audioCtx.currentTime + i*0.1 + 0.05); 
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + i*0.1 + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + i*0.1);
                osc.stop(audioCtx.currentTime + i*0.1 + 0.2);
            });
        }

        let buzzOsc, buzzGain;
        function startBuzz() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            if(buzzOsc) return;
            buzzOsc = audioCtx.createOscillator();
            buzzGain = audioCtx.createGain();
            buzzOsc.type = 'sawtooth';
            buzzOsc.frequency.value = 150;
            const lfo = audioCtx.createOscillator();
            lfo.frequency.value = 15;
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 20;
            lfo.connect(lfoGain);
            lfoGain.connect(buzzOsc.frequency);
            
            buzzGain.gain.value = 0.0025; 
            buzzOsc.connect(buzzGain);
            buzzGain.connect(audioCtx.destination);
            lfo.start();
            buzzOsc.start();
        }
        function stopBuzz() {
            if(buzzGain) {
                buzzGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
                setTimeout(() => {
                    if(buzzOsc) { buzzOsc.stop(); buzzOsc = null; }
                }, 500);
            }
        }

        const mathInput = document.getElementById('difference-input');
        const toggleSecretBtn = document.getElementById('toggle-secret-btn');
        let isSecretMode = true;
        toggleSecretBtn.addEventListener('click', () => {
            isSecretMode = !isSecretMode;
            if(isSecretMode) {
                mathInput.classList.add('secret-input-text');
                toggleSecretBtn.innerHTML = '👁️';
            } else {
                mathInput.classList.remove('secret-input-text');
                toggleSecretBtn.innerHTML = '🙈';
            }
        });

        // Детермінована функція псевдовипадкових чисел для 100% синхронізації руху
        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function getMosquitoPosition(id, t) {
            let baseX = 0.1 + 0.8 * seededRandom(id * 10);
            let baseY = 0.1 + 0.6 * seededRandom(id * 10 + 1);
            let speedX = (seededRandom(id * 10 + 2) - 0.5) * 3;
            let speedY = (seededRandom(id * 10 + 3) - 0.5) * 3;
            let offsetX = seededRandom(id * 10 + 4) * 100;
            let offsetY = seededRandom(id * 10 + 5) * 100;

            let x = baseX + 0.15 * Math.sin(t * speedX + offsetX);
            let y = baseY + 0.15 * Math.cos(t * speedY + offsetY);
            
            x = Math.max(0.05, Math.min(0.95, x));
            y = Math.max(0.05, Math.min(0.85, y));
            
            return { x, y };
        }

        async function initGame() {
            if (auth) {
                try { await signInAnonymously(auth); userId = auth.currentUser.uid; } 
                catch(e) {}
            }
            if(!userId) userId = 'user_' + Math.random().toString(36).substr(2, 9);

            if (rtdb) {
                const roomRef = ref(rtdb, mainRoomPath);
                
                // Стаємо хостом, якщо його немає
                runTransaction(roomRef, (currentData) => {
                    if (!currentData) {
                        return { status: 'waiting', p1Score: 0, p2Score: 0, timer: 15, hostId: userId, mosquitoesState: {}, activePcTarget: null };
                    }
                    if (!currentData.hostId) {
                        currentData.hostId = userId;
                    }
                    return currentData;
                }).then((result) => {
                    if (result.committed && result.snapshot.val().hostId === userId) {
                        isHost = true;
                        onDisconnect(ref(rtdb, `${mainRoomPath}/hostId`)).set(null);
                    }
                });

                onValue(roomRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        if (!data.hostId && !isHost) {
                            update(roomRef, { hostId: userId }).then(() => { 
                                isHost = true; 
                                onDisconnect(ref(rtdb, `${mainRoomPath}/hostId`)).set(null);
                            });
                        }
                        handleStateChange(data);
                    } else {
                        handleStateChange({ status: 'waiting', p1Score: 0, p2Score: 0, timer: 15, hostId: isHost ? userId : null, mosquitoesState: {}, activePcTarget: null });
                    }
                });
            } else {
                isHost = true;
                handleStateChange({ status: 'waiting', p1Score: 0, p2Score: 0, timer: 15, mosquitoesState: {}, activePcTarget: null });
            }
        }

        document.getElementById('btn-start-game').addEventListener('click', async () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const payload = { status: 'playing', p1Score: 0, p2Score: 0, timer: 15, mosquitoesState: {}, activePcTarget: null };
            if (rtdb) await update(ref(rtdb, mainRoomPath), payload);
            else handleStateChange(Object.assign(gameState, payload));
        });

        async function resetGameToLobby() {
            const explLayer = document.getElementById('explanation-layer');
            explLayer.classList.add('hidden');
            explLayer.innerHTML = '';
            
            const payload = { status: 'waiting', p1Score: 0, p2Score: 0, timer: 15, mosquitoesState: {}, activePcTarget: null };
            if (rtdb) await update(ref(rtdb, mainRoomPath), payload);
            else handleStateChange(Object.assign(gameState, payload));
        }

        document.getElementById('btn-back').addEventListener('click', resetGameToLobby);
        document.getElementById('btn-next-round').addEventListener('click', resetGameToLobby);

        function handleStateChange(data) {
            gameState = data;
            const lobbyUi = document.getElementById('lobby-ui');
            const hud = document.getElementById('hud-layer');
            const mathLayer = document.getElementById('math-input-layer');
            const explLayer = document.getElementById('explanation-layer');
            const btnNext = document.getElementById('btn-next-round');
            const pcHand = document.getElementById('pc-hand');

            document.getElementById('score-p1').textContent = data.p1Score || 0;
            document.getElementById('score-p2').textContent = data.p2Score || 0;
            document.getElementById('game-timer').textContent = data.timer || 15;

            // Синхронізація зникнення спійманих комарів
            if (localMosquitoes.length > 0) {
                localMosquitoes.forEach(m => {
                    if (data.mosquitoesState && data.mosquitoesState[m.id]) {
                        m.active = false;
                        m.el.style.display = 'none';
                    } else if (data.status === 'playing') {
                        m.active = true;
                        m.el.style.display = 'block';
                    }
                });
            }

            if (data.status === 'waiting' || !data.status) {
                lobbyUi.classList.remove('hidden', 'opacity-0');
                hud.classList.add('opacity-0');
                mathLayer.classList.add('hidden');
                explLayer.classList.add('hidden');
                btnNext.classList.add('hidden');
                pcHand.style.display = 'none';
                clearMosquitoes();
                stopBuzz();
                if(gameLoopInterval) { clearInterval(gameLoopInterval); gameLoopInterval = null; }
                if(pcLoopInterval) { clearInterval(pcLoopInterval); pcLoopInterval = null; }
            } 
            else if (data.status === 'playing') {
                lobbyUi.classList.add('opacity-0');
                setTimeout(() => lobbyUi.classList.add('hidden'), 300);
                hud.classList.remove('opacity-0');
                mathLayer.classList.add('hidden');
                explLayer.classList.add('hidden');
                btnNext.classList.add('hidden');
                
                if (localMosquitoes.length === 0) {
                    generateMosquitoes();
                    startBuzz();
                }
                
                if(isHost && !gameLoopInterval) startGameTimer();
                if(isHost && !pcLoopInterval) startPcLogic();
            }
            else if (data.status === 'math') {
                stopBuzz();
                clearMosquitoes();
                pcHand.style.display = 'none';
                if(gameLoopInterval) { clearInterval(gameLoopInterval); gameLoopInterval = null; }
                if(pcLoopInterval) { clearInterval(pcLoopInterval); pcLoopInterval = null; }
                
                document.getElementById('math-score-p1').textContent = data.p1Score;
                document.getElementById('math-score-p2').textContent = data.p2Score;
                
                hud.classList.add('opacity-0');
                mathLayer.classList.remove('hidden');
                
                const inp = document.getElementById('difference-input');
                inp.value = '';
                inp.style.borderColor = 'rgba(255,255,255,0.3)';
                inp.focus();
            }
            else if (data.status === 'explanation') {
                mathLayer.classList.add('hidden');
                explLayer.classList.remove('hidden');
                if (explLayer.innerHTML === '') {
                    runVisualExplanation(data.p1Score || 0, data.p2Score || 0);
                }
            }
        }

        function generateMosquitoes() {
            const layer = document.getElementById('mosquitoes-layer');
            layer.innerHTML = '';
            localMosquitoes = [];
            
            for(let i=0; i<35; i++) {
                const mosquito = document.createElement('div');
                mosquito.className = 'mosquito pointer-events-auto';
                
                mosquito.innerHTML = `
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <path class="wing" d="M 50,50 Q 20,10 10,30 Q 30,50 50,50 Z" fill="#e2e8f0" opacity="0.8"/>
                        <path class="wing" d="M 50,50 Q 80,10 90,30 Q 70,50 50,50 Z" fill="#e2e8f0" opacity="0.8"/>
                        <ellipse cx="50" cy="50" rx="8" ry="15" fill="#334155"/>
                        <circle cx="50" cy="35" r="6" fill="#0f172a"/>
                        <line x1="50" y1="29" x2="50" y2="15" stroke="#0f172a" stroke-width="2"/>
                    </svg>
                `;

                let data = { id: i, el: mosquito, active: true };
                
                const pos = getMosquitoPosition(i, Date.now() / 1000);
                mosquito.style.left = `${pos.x * 100}%`;
                mosquito.style.top = `${pos.y * 100}%`;

                mosquito.addEventListener('pointerdown', (e) => catchMosquito(e, data));
                layer.appendChild(mosquito);
                localMosquitoes.push(data);
            }
            requestAnimationFrame(animateMosquitoes);
        }

        function animateMosquitoes() {
            if(gameState.status !== 'playing') return;
            const t = Date.now() / 1000;
            
            // Рух комарів
            localMosquitoes.forEach(m => {
                if(!m.active) return;
                const pos = getMosquitoPosition(m.id, t);
                const posPrev = getMosquitoPosition(m.id, t - 0.05);
                const dx = pos.x - posPrev.x;
                const dy = pos.y - posPrev.y;
                const angle = Math.atan2(dy, dx) * 180 / Math.PI + 90;

                m.el.style.left = `${pos.x * 100}%`;
                m.el.style.top = `${pos.y * 100}%`;
                m.el.children[0].style.transform = `rotate(${angle}deg)`;
            });

            // Рух долоньки комп'ютера за ціллю
            const pcHand = document.getElementById('pc-hand');
            if (gameState.activePcTarget !== undefined && gameState.activePcTarget !== null) {
                const targetM = localMosquitoes.find(m => m.id === gameState.activePcTarget);
                if (targetM && targetM.active) {
                    pcHand.style.display = 'block';
                    const targetPos = getMosquitoPosition(targetM.id, t);
                    pcHand.style.left = `${targetPos.x * 100}%`;
                    pcHand.style.top = `${targetPos.y * 100}%`;
                } else {
                    pcHand.style.display = 'none';
                }
            } else {
                pcHand.style.display = 'none';
            }

            requestAnimationFrame(animateMosquitoes);
        }

        async function catchMosquito(e, mData) {
            e.preventDefault(); e.stopPropagation();
            if(!mData.active || gameState.status !== 'playing') return;
            
            mData.active = false;
            mData.el.style.display = 'none';
            
            animateFrogCatch(e.clientX, e.clientY);
            playPopSound();

            gameState.p1Score++;
            if(!gameState.mosquitoesState) gameState.mosquitoesState = {};
            gameState.mosquitoesState[mData.id] = 'human';

            if (rtdb) {
                const roomRef = ref(rtdb, mainRoomPath);
                await update(roomRef, { 
                    p1Score: gameState.p1Score,
                    [`mosquitoesState/${mData.id}`]: 'human'
                });
            } else {
                document.getElementById('score-p1').textContent = gameState.p1Score;
            }
        }

        function animateFrogCatch(clientX, clientY) {
            const rect = document.getElementById('game-container').getBoundingClientRect();
            const scaleX = 1600 / rect.width, scaleY = 900 / rect.height;
            const tapX = (clientX - rect.left) * scaleX;
            const tapY = (clientY - rect.top) * scaleY;
            
            const tonguePath = document.getElementById('frog-tongue-path');
            const frogMouthOpen = document.getElementById('frog-mouth-open');
            const frogMouth = document.getElementById('frog-mouth');
            
            frogMouth.setAttribute('opacity', '0');
            frogMouthOpen.setAttribute('opacity', '1');
            tonguePath.setAttribute('d', `M 800,740 Q ${(800+tapX)/2},${(740+tapY)/2-100} ${tapX},${tapY}`);
            tonguePath.setAttribute('opacity', '1');
            
            setTimeout(() => {
                tonguePath.setAttribute('opacity', '0');
                frogMouth.setAttribute('opacity', '1');
                frogMouthOpen.setAttribute('opacity', '0');
            }, 150);
        }

        // ЛОГІКА КОМП'ЮТЕРА (Запускає тільки хост)
        function startPcLogic() {
            pcLoopInterval = setInterval(async () => {
                if (gameState.status !== 'playing') return;
                
                const activeIds = localMosquitoes.filter(m => m.active).map(m => m.id);
                if (activeIds.length === 0) return;
                
                const targetId = activeIds[Math.floor(Math.random() * activeIds.length)];
                
                if (rtdb) {
                    await update(ref(rtdb, mainRoomPath), { activePcTarget: targetId });
                } else {
                    gameState.activePcTarget = targetId;
                }
                
                // Комп'ютер хапає ціль через 0.7 сек
                setTimeout(async () => {
                    if (gameState.status !== 'playing') return;
                    // Перевірка чи комар ще не спійманий
                    if (gameState.mosquitoesState && gameState.mosquitoesState[targetId]) {
                        if (rtdb) await update(ref(rtdb, mainRoomPath), { activePcTarget: null });
                        return;
                    }
                    
                    playPopSound();
                    if (rtdb) {
                        const roomRef = ref(rtdb, mainRoomPath);
                        await update(roomRef, { 
                            p2Score: (gameState.p2Score || 0) + 1,
                            [`mosquitoesState/${targetId}`]: 'pc',
                            activePcTarget: null
                        });
                    } else {
                        gameState.p2Score++;
                        document.getElementById('score-p2').textContent = gameState.p2Score;
                        gameState.activePcTarget = null;
                        gameState.mosquitoesState[targetId] = 'pc';
                        const m = localMosquitoes.find(mx => mx.id === targetId);
                        if(m) { m.active = false; m.el.style.display = 'none'; }
                    }
                }, 700);
                
            }, 1500); // Інтервал вибору цілі
        }

        function clearMosquitoes() {
            document.getElementById('mosquitoes-layer').innerHTML = '';
            localMosquitoes = [];
        }

        function startGameTimer() {
            let timeLeft = 15;
            gameLoopInterval = setInterval(async () => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(gameLoopInterval);
                    const payload = { status: 'math', timer: 0 };
                    if (rtdb) await update(ref(rtdb, mainRoomPath), payload);
                    else handleStateChange(Object.assign(gameState, payload));
                } else {
                    if (rtdb) await update(ref(rtdb, mainRoomPath), { timer: timeLeft });
                    else { gameState.timer = timeLeft; document.getElementById('game-timer').textContent = timeLeft; }
                }
            }, 1000);
        }

        document.getElementById('btn-submit-math').addEventListener('click', async () => {
            const inputVal = parseInt(document.getElementById('difference-input').value);
            if (isNaN(inputVal)) return;

            const expectedDiff = Math.abs(gameState.p1Score - gameState.p2Score);
            
            if (inputVal === expectedDiff) {
                playSuccessSound();
                if (rtdb) await update(ref(rtdb, mainRoomPath), { status: 'explanation' });
                else handleStateChange(Object.assign(gameState, { status: 'explanation' }));
            } else {
                const inp = document.getElementById('difference-input');
                inp.style.transform = 'translateX(10px)';
                setTimeout(() => inp.style.transform = 'translateX(-10px)', 50);
                setTimeout(() => inp.style.transform = 'translateX(0)', 100);
            }
        });

        async function runVisualExplanation(s1, s2) {
            const layer = document.getElementById('explanation-layer');
            
            let svgContent = `<svg width="100%" height="100%" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
                <rect x="0" y="0" width="1600" height="900" fill="black" opacity="0.8" />`;

            const maxScore = Math.max(s1, s2);
            const minScore = Math.min(s1, s2);
            const diff = maxScore - minScore;
            
            const gap = Math.min(90, 1100 / Math.max(1, maxScore));
            const startX = 800 - ((maxScore - 1) * gap) / 2;
            const y1 = 300, y2 = 600;
            
            svgContent += `<text x="200" y="${y1+15}" fill="#ef4444" font-size="50" font-weight="900" text-anchor="end">Люди</text>`;
            svgContent += `<text x="200" y="${y2+15}" fill="#3b82f6" font-size="50" font-weight="900" text-anchor="end">Комп.</text>`;

            for(let i=0; i<s1; i++) svgContent += createStaticMosquitoSVG(startX + i*gap, y1, '#ef4444', `p1-mosq-${i}`);
            for(let i=0; i<s2; i++) svgContent += createStaticMosquitoSVG(startX + i*gap, y2, '#3b82f6', `p2-mosq-${i}`);

            svgContent += `</svg>`;
            layer.innerHTML = svgContent;
            layer.classList.remove('hidden');

            const svgRoot = layer.querySelector('svg');

            for(let i=0; i<minScore; i++) {
                await new Promise(r => setTimeout(r, 300));
                playPopSound(); 
                svgRoot.innerHTML += `<line x1="${startX + i*gap}" y1="${y1 + 40}" x2="${startX + i*gap}" y2="${y2 - 40}" stroke="#ffffff" stroke-width="8" stroke-dasharray="15,15" class="math-line"/>`;
            }

            await new Promise(r => setTimeout(r, 600));
            const isP1More = s1 > s2;
            const extraY = isP1More ? y1 : y2;

            if (diff > 0) {
                for(let i=0; i<diff; i++) {
                    await new Promise(r => setTimeout(r, 500));
                    const cx = startX + (minScore + i)*gap;
                    svgRoot.innerHTML += `<circle cx="${cx}" cy="${extraY}" r="55" fill="none" stroke="#f59e0b" stroke-width="8" class="pop-in"/>`;
                    svgRoot.innerHTML += `<text x="${cx}" y="${extraY - 70}" fill="#f59e0b" font-size="60" font-weight="900" text-anchor="middle" class="pop-in">${i + 1}</text>`;
                    playSuccessSound(); 
                }
            } else {
                svgRoot.innerHTML += `<text x="800" y="450" fill="#10b981" font-size="150" font-weight="900" text-anchor="middle" class="pop-in">=</text>`;
                playSuccessSound();
            }

            setTimeout(() => document.getElementById('btn-next-round').classList.remove('hidden'), 2000);
        }

        function createStaticMosquitoSVG(x, y, color, id) {
            return `
                <g transform="translate(${x-50}, ${y-50})" id="${id}">
                    <circle cx="50" cy="50" r="45" fill="${color}" opacity="0.4"/>
                    <path d="M 50,50 Q 20,10 10,30 Q 30,50 50,50 Z" fill="#e2e8f0" opacity="0.8"/>
                    <path d="M 50,50 Q 80,10 90,30 Q 70,50 50,50 Z" fill="#e2e8f0" opacity="0.8"/>
                    <ellipse cx="50" cy="50" rx="8" ry="15" fill="#334155"/>
                    <circle cx="50" cy="35" r="6" fill="#0f172a"/>
                    <line x1="50" y1="29" x2="50" y2="15" stroke="#0f172a" stroke-width="2"/>
                </g>
            `;
        }
        
        initGame();

        /* ================= БЛОКИ СИСТЕМИ ================= */
        
        const urlParams = new URLSearchParams(window.location.search);
        let myName = urlParams.get('user') || sessionStorage.getItem('userName');
        if (!myName) {
            myName = 'Гість_' + Math.floor(Math.random() * 1000);
        }
        sessionStorage.setItem('userName', myName);

        const tabId = Math.random().toString(36).substr(2, 9);
        let rtdbConnected = false;

        if (rtdb) {
            const connectedRef = ref(rtdb, '.info/connected');
            const userRadarRef = ref(rtdb, `online_users/${myName}/${tabId}`);
            const blockRef = ref(rtdb, `blocked_users/${myName}`);
            const forceRefreshRef = ref(rtdb, 'force_refresh');
            const activityRef = ref(rtdb, 'current_activity');

            onValue(connectedRef, (snap) => {
                if (snap.val() === true) {
                    rtdbConnected = true;
                    set(userRadarRef, true);
                    onDisconnect(userRadarRef).remove();
                }
            });

            window.addEventListener('beforeunload', () => {
                if (rtdbConnected) set(userRadarRef, null);
            });

            onValue(blockRef, (snap) => {
                const overlay = document.getElementById('block-overlay');
                if (snap.val() === true) {
                    overlay.style.display = 'flex';
                } else {
                    overlay.style.display = 'none';
                }
            });

            let firstRefresh = true;
            onValue(forceRefreshRef, (snap) => {
                if (firstRefresh) { firstRefresh = false; return; }
                if (snap.val() === true) window.location.reload();
            });

            let firstActivity = true;
            onValue(activityRef, (snap) => {
                if (firstActivity) { firstActivity = false; return; }
                if (snap.val() === 'lobby') {
                    window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
                }
            });
        }

        const themeBtn = document.getElementById('theme-btn');
        const themeModal = document.getElementById('theme-modal');
        const themeGallery = document.getElementById('theme-gallery');
        const closeThemeModal = document.getElementById('close-theme-modal');

        themeBtn.addEventListener('click', () => themeModal.style.display = 'block');
        closeThemeModal.addEventListener('click', () => themeModal.style.display = 'none');

        const localBgKey = 'mySavedBg_' + CONFIG.gameId;
        const savedBg = localStorage.getItem(localBgKey);
        if (savedBg) {
            document.body.style.backgroundImage = savedBg !== 'none' ? `url('${savedBg}')` : 'none';
        }

        let themeIndex = 1;
        const loadTheme = async () => {
            if (themeIndex > 1000) return;
            const url = `https://olgazheltvai2.github.io/images/backgrounds/background_${themeIndex}.webp`;
            try {
                const res = await fetch(url, { method: 'HEAD' });
                if (res.ok) {
                    const card = document.createElement('div');
                    card.className = 'theme-card';
                    card.dataset.url = url;
                    card.innerHTML = `<img src="${url}" alt="Фон ${themeIndex}"><div class="theme-label">Фон ${themeIndex}</div>`;
                    themeGallery.appendChild(card);
                    
                    card.addEventListener('click', () => applyTheme(url));
                    
                    themeIndex++;
                    loadTheme();
                } else {
                    return; 
                }
            } catch (e) {
                return; 
            }
        };
        loadTheme();

        themeGallery.children[0].addEventListener('click', () => applyTheme('none'));

        function applyTheme(url) {
            localStorage.setItem(localBgKey, url);
            document.body.style.backgroundImage = url !== 'none' ? `url('${url}')` : 'none';
            if (rtdb) set(ref(rtdb, 'game_theme'), url);
            themeModal.style.display = 'none';
        }

        if (rtdb) {
            onValue(ref(rtdb, 'game_theme'), (snap) => {
                const url = snap.val();
                if (url) {
                    document.body.style.backgroundImage = url !== 'none' ? `url('${url}')` : 'none';
                    localStorage.setItem(localBgKey, url);
                }
            });
        }

        let currentZoom = 1;
        const gc = document.getElementById('game-container');
        document.getElementById('zoom-in').addEventListener('click', () => {
            currentZoom += 0.1;
            gc.style.transform = `scale(${currentZoom})`;
        });
        document.getElementById('zoom-out').addEventListener('click', () => {
            currentZoom -= 0.1;
            gc.style.transform = `scale(${currentZoom})`;
        });

        const drawBtnGlobal = document.getElementById('toggle-draw-btn-global');
        const drawPanelGlobal = document.getElementById('draw-panel-global');
        const drawCloseBtn = document.getElementById('draw-close-btn');
        const canvas = document.getElementById('draw-canvas-global');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let isDrawingMode = false, isDrawing = false, currentTool = 'pencil', drawColor = '#ff0000', drawSize = 5;

        // Малювалка активується відразу при відкритті!
        drawPanelGlobal.style.display = 'flex'; 
        activateDrawing(true);

        drawBtnGlobal.addEventListener('click', () => { drawPanelGlobal.style.display = 'flex'; activateDrawing(true); });
        drawCloseBtn.addEventListener('click', () => { drawPanelGlobal.style.display = 'none'; activateDrawing(false); });

        function activateDrawing(active) {
            isDrawingMode = active;
            canvas.style.pointerEvents = active ? 'auto' : 'none';
        }

        document.getElementById('tool-pencil').addEventListener('click', (e) => { currentTool = 'pencil'; updateToolUI(e.target); });
        document.getElementById('tool-eraser').addEventListener('click', (e) => { currentTool = 'eraser'; updateToolUI(e.target); });
        document.getElementById('tool-clear').addEventListener('click', () => { clearCanvas(); sendDrawAction('clear_canvas'); });
        document.getElementById('draw-color-picker').addEventListener('input', (e) => drawColor = e.target.value);
        document.getElementById('draw-size').addEventListener('input', (e) => drawSize = parseInt(e.target.value));

        function updateToolUI(activeBtn) {
            document.querySelectorAll('.draw-btn').forEach(btn => btn.classList.remove('active'));
            activeBtn.classList.add('active');
        }

        const dragHandle = document.getElementById('draw-drag-handle');
        let isDraggingPanel = false, startX, startY, initialLeft, initialBottom;
        dragHandle.addEventListener('pointerdown', (e) => {
            isDraggingPanel = true;
            startX = e.clientX; startY = e.clientY;
            const rect = drawPanelGlobal.getBoundingClientRect();
            initialLeft = rect.left;
            initialBottom = window.innerHeight - rect.bottom;
            e.preventDefault();
        });
        window.addEventListener('pointermove', (e) => {
            if (!isDraggingPanel) return;
            const dx = e.clientX - startX, dy = startY - e.clientY;
            drawPanelGlobal.style.left = `${initialLeft + dx + drawPanelGlobal.offsetWidth/2}px`;
            drawPanelGlobal.style.bottom = `${initialBottom + dy}px`;
        });
        window.addEventListener('pointerup', () => isDraggingPanel = false);

        let lastX = 0, lastY = 0;
        function getPointerPos(e) {
            return { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!isDrawingMode) return;
            isDrawing = true;
            const pos = getPointerPos(e);
            lastX = pos.x; lastY = pos.y;
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !isDrawingMode) return;
            const pos = getPointerPos(e);
            drawLine(lastX, lastY, pos.x, pos.y, currentTool, drawColor, drawSize);
            sendDrawAction('draw_line', { x0: lastX / canvas.width, y0: lastY / canvas.height, x1: pos.x / canvas.width, y1: pos.y / canvas.height, tool: currentTool, color: drawColor, size: drawSize });
            lastX = pos.x; lastY = pos.y;
        });

        window.addEventListener('pointerup', () => isDrawing = false);

        function drawLine(x0, y0, x1, y1, tool, color, size) {
            ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
            ctx.strokeStyle = tool === 'eraser' ? 'rgba(0,0,0,1)' : color;
            ctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
            ctx.lineWidth = size; ctx.lineCap = 'round'; ctx.stroke();
        }

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function sendDrawAction(type, data = null) {
            if (!rtdb) return;
            set(push(ref(rtdb, 'game_action')), { senderId: tabId, timestamp: Date.now(), type: type, data: data });
        }

        if (rtdb) {
            onValue(ref(rtdb, 'game_action'), (snap) => {
                const actions = snap.val();
                if (!actions) return;
                const keys = Object.keys(actions);
                const action = actions[keys[keys.length - 1]];
                if (action.senderId === tabId || (Date.now() - action.timestamp > 5000)) return;
                if (action.type === 'clear_canvas') clearCanvas();
                else if (action.type === 'draw_line' && action.data) {
                    const d = action.data;
                    drawLine(d.x0 * canvas.width, d.y0 * canvas.height, d.x1 * canvas.width, d.y1 * canvas.height, d.tool, d.color, d.size);
                }
            });
        }
    </script>
</body>
</html>
